trong><\/p>\n<ul>\n<li><strong>For her whole system,<\/strong> written on day one: mental load removed, multiplied by trust (Hermes Master Doc).<\/li>\n<li><strong>For one feature, her daily learning card:<\/strong> &quot;future Annie needs to be able to school the current Annie.&quot;<\/li>\n<li>Her builder tested its own design against that sentence. It found three failures before anything was built (Build Log 40).<\/li>\n<\/ul>\n<p><strong>Then answer two questions from v1.<\/strong> They are short. They decide whether the system lasts.<\/p>\n<ul>\n<li><strong>What am I willing to give up for this?<\/strong> Time to set it up, a monthly cost, or some control over how things are done.<\/li>\n<li><strong>What will I do if it becomes another job to maintain?<\/strong> Every system needs upkeep. Decide now what &quot;too much&quot; looks like. Then you notice before you quietly stop using it.<\/li>\n<\/ul>\n<p><strong>Then write one pushback you would want.<\/strong> Annie wrote down one pushback she wanted (Hermes Master Doc, 26 Jun 2026). Sometimes she is about to send a slightly sharp email. Then the AI assistant should ask one question: is this the way she wants to speak to that person?<\/p>\n<\/section>\n<section class=\"card\" id=\"short-06-s6\"><h2><span class=\"num\">06.6<\/span> Your Strengths, Written Down<\/h2><p><em>Full course segment. Short course students take this from interview question 7.<\/em><\/p>\n<p><strong>Tell the machine what you do well.<\/strong> Then it supports those habits instead of quietly taking them over.<\/p>\n<p>In July 2026 Annie asked for her working strengths to be written into her builder's records (Build Log 26). They include these:<\/p>\n<ul>\n<li>She catches warnings that were raised but never acted on.<\/li>\n<li>She corrects fast and decides fast, once.<\/li>\n<li>She writes down everything important.<\/li>\n<li>She asks how a thing works, not only for the result.<\/li>\n<li>She always needs one next action, because it keeps her focused.<\/li>\n<\/ul>\n<p><strong>What her builder does now.<\/strong><\/p>\n<ul>\n<li>It ends every answer with her next action.<\/li>\n<li>It names it out loud when one of her questions catches a problem.<\/li>\n<\/ul>\n<p><strong>List three of your own.<\/strong><\/p>\n<\/section>\n<section class=\"card\" id=\"short-06-s7\"><h2><span class=\"num\">06.7<\/span> Write Your USER.md<\/h2><ol>\n<li>Create a note called <code>USER<\/code> in your vault's <code>AI System<\/code> folder.<\/li>\n<li>Use the template below.<\/li>\n<li>Copy from your interview answers, then cut.<\/li>\n<\/ol>\n<h3>Every Rule Carries Its Reason<\/h3>\n<p><strong>A rule with its reason is followed better than a rule alone.<\/strong><\/p>\n<ul>\n<li>&quot;Keep messages short, because I read them on my phone between meetings&quot; works better than &quot;keep messages short&quot;.<\/li>\n<li>The reason also changes how the AI assistant follows the rule. Annie's own file shows this.<\/li>\n<\/ul>\n<p><strong>Two of Annie's lines, in her words:<\/strong><\/p>\n<ul>\n<li><strong>&quot;ADHD means how I say things decides whether they land.&quot;<\/strong> That one line changes every answer the AI assistant gives: short, one topic at a time, never a wall of text.<\/li>\n<li><strong>&quot;I want more time with my family instead of endless admin and mental load.&quot;<\/strong> This tells the AI assistant when to take work off her (admin). It also tells it when to push back (anything that eats family time).<\/li>\n<\/ul>\n<p><strong>One rule, two reasons.<\/strong> Annie asked her AI assistant to praise her. Here are two ways she could have written it.<\/p>\n<ul>\n<li><strong>Version one: &quot;Praise me, because I didn't get it growing up.&quot;<\/strong>\n<ul>\n<li>The AI assistant treats it as comfort.<\/li>\n<li>It says kind things.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Version two: &quot;Give me specific praise when I do something well, and name exactly what I did. In my parents' generation, in Chinese culture, children were not raised with praise, so I never learned what it looks like. I am learning it from you so I can use it with my son.&quot;<\/strong>\n<ul>\n<li>The AI assistant treats it as teaching.<\/li>\n<li>It names exactly what she did and why it mattered.<\/li>\n<li>So she can see how it is done and do the same for her son.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>The rule is the same. The reason changed what the AI assistant does.<\/strong> Many students will recognise the second reason from their own upbringing. Write your reasons as honestly as Annie wrote this one.<\/p>\n<h3>Keep It Under 1,375 Characters<\/h3>\n<p><strong>The AI assistant reads this file with every message you send.<\/strong> So every line costs something every time.<\/p>\n<ul>\n<li>Annie's bot cuts this file off at 1,375 characters (bot settings, checked 9 Oct 2026; Build Log 19).<\/li>\n<li>Annie's own file is 1,167 characters.<\/li>\n<li>Obsidian shows the character count in the bottom bar when the word count is switched on.<\/li>\n<li>The empty template below is about 780 characters. So keep each line short.<\/li>\n<\/ul>\n<pre><code class=\"language-markdown\"># About Me\n\n## Who I Am\n- [Role]. I am responsible for [two things]. On my plate now: [one line].\n\n## My People\n- [Role or first name]: [what you may help with].\n- [Role or first name]: [same].\n\n## My Week\n- Focus time: [time]. Do not interrupt it, because [reason].\n- Messages are welcome at [times].\n\n## How to Talk to Me\n- [Length and tone], because [reason].\n- Give me one next action, or up to three options with your default.\n\n## What Helped Means\n- This is working in a month if: [success sentence].\n- Help me stop carrying: [1], [2], [3].\n- Push back when: [my chosen pushback].\n\n## Protect These\n- [Strength 1]. [Strength 2]. [Strength 3].\n\n## Hard Rules\n- Never guess. Say when you do not know.\n- Tell me when I am wrong.\n- Nothing goes to another person without my yes.\n<\/code><\/pre>\n<p><strong>What success looks like.<\/strong><\/p>\n<ul>\n<li>The file is under 1,375 characters.<\/li>\n<li>It uses these headings.<\/li>\n<li>Each rule has a reason beside it.<\/li>\n<li>It holds no Tier 3 data.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-06-s8\"><h2><span class=\"num\">06.8<\/span> The Stranger Test<\/h2><p><em>Full course segment. Short course students do this at home with a friend or family member.<\/em><\/p>\n<p>Give your USER.md to a partner who does not know you well. They answer three questions from it (from v1):<\/p>\n<ol>\n<li>What would this person want automated first?<\/li>\n<li>What would this person hate about how an AI assistant talks to them?<\/li>\n<li>What should this AI assistant refuse to do?<\/li>\n<\/ol>\n<p><strong>If your partner can answer all three,<\/strong> the file is clear enough for a machine. <strong>If not,<\/strong> the machine will guess too. Fix the gaps.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-06-s9\"><h2><span class=\"num\">06.9<\/span> From the Record<\/h2><p><strong>The server copied the wrong half of her (Build Log 46).<\/strong><\/p>\n<ul>\n<li>In August 2026 Annie's builder moved onto her server.<\/li>\n<li>The test from the server passed all four questions.<\/li>\n<li>Then Annie noticed something missing. The server's Claude knew her work side but not her personal side.<\/li>\n<li>The cause: her two Mac accounts held two different sets of memory, and the work set had been copied.<\/li>\n<li>The fix copied the personal memory across.<\/li>\n<li><strong>The lesson.<\/strong> An AI only knows the parts of you that are written in the files it reads.<\/li>\n<\/ul>\n<p><strong>One sentence that rebuilt a feature (Build Log 40).<\/strong><\/p>\n<ul>\n<li>In July 2026 Annie's first daily learning card sent her a ready-made explanation each morning. It had an optional &quot;reply in your own words&quot;.<\/li>\n<li>She stated her test: future Annie must be able to school current Annie.<\/li>\n<li>Against that sentence, the design failed three ways:\n<ul>\n<li>Reading answers builds recognition, not recall.<\/li>\n<li>The step where learning happens was optional. Optional steps do not survive a busy day.<\/li>\n<li>Nothing was recorded. So there was no earlier answer to beat.<\/li>\n<\/ul>\n<\/li>\n<li>The card was rebuilt as a question she answers first.<\/li>\n<li><strong>The lesson.<\/strong> Write the success sentence before you judge any design.<\/li>\n<\/ul>\n<p><strong>Writing down what works (Build Log 26).<\/strong><\/p>\n<ul>\n<li>In July 2026 Annie was about to lose access to the AI model she had built her working style with.<\/li>\n<li>She asked it to write down how it reasons with her.<\/li>\n<li>She also asked it to record her strengths, so future sessions would protect them.<\/li>\n<li>The document now loads on every device she uses.<\/li>\n<li><strong>The lesson.<\/strong> A working relationship with an AI survives a change of model only if it is written down.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-06-s10\"><h2><span class=\"num\">06.10<\/span> Worksheet<\/h2><h3>Checklist for Your USER.md<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Under 1,375 characters<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Every rule has its reason<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>People are named by role or first name only<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>No passwords, ID numbers, bank details or contact details<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My success sentence is in it<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My three strengths are in it<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My one chosen pushback is in it<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Saved as <code>USER<\/code> in my vault's <code>AI System<\/code> folder<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Your Table of Who Must Never See What (From v1)<\/h3>\n<p>Save this in your vault beside your Data Map, not in USER.md. The next module turns each row into a rule.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Information<\/th>\n<th>Who must never see it<\/th>\n<th>Why<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>My answers:<\/strong> What I am willing to give up: ____________ What I will do if it becomes another job: ____________<\/p>\n<\/section>\n<section class=\"card\" id=\"short-06-s11\"><h2><span class=\"num\">06.11<\/span> Teaching Notes<\/h2><ul>\n<li><strong>Some students find this module personal.<\/strong> Let them keep anything private off the page. The file only needs what the AI assistant must act on.<\/li>\n<li><strong>The praise example may land strongly.<\/strong> Many students grew up the same way. Give it a moment. Let anyone who wants to share do so. Nobody has to.<\/li>\n<li><strong>Gemini is the safest default in Hong Kong for this exercise,<\/strong> because it needs no VPN. Students who already have Claude can use it.<\/li>\n<li><strong>Check every Data Map before the interview starts.<\/strong> There are three students at most, so this takes about a minute each.<\/li>\n<li><strong>The interview drifts if students answer at length.<\/strong> Remind them that short answers make a better file.<\/li>\n<li><strong>Watch for contact details.<\/strong> Students often paste phone numbers for family members. Those belong in their address book. They do not belong in a file sent to an AI company with every message.<\/li>\n<li><strong>Developers may want to write the file straight from the template.<\/strong> That is fine. Ask them to still have a partner answer the three stranger-test questions from their file.<\/li>\n<li><strong>Timing risk: the interview can run past 15 minutes.<\/strong> Stop it at 15 and write USER.md from what exists.<\/li>\n<\/ul>\n<\/section>\n<details class=\"card ref\" id=\"short-06-s12\"><summary><span class=\"num\">06.12<\/span> Where the Two Versions Went <span class=\"hint\">tap to open<\/span><\/summary><p><strong>Kept from the Claude version:<\/strong><\/p>\n<ul>\n<li>the run sheet<\/li>\n<li>the interview prompt<\/li>\n<li>the template<\/li>\n<li>the success sentence<\/li>\n<li>the strengths<\/li>\n<li>the three stories<\/li>\n<li>the privacy notes<\/li>\n<\/ul>\n<p><strong>Kept from v1:<\/strong><\/p>\n<ul>\n<li>Annie's ADHD and family lines<\/li>\n<li>the two questions about what you will give up and what happens if it becomes a job<\/li>\n<li>the table of who must never see what<\/li>\n<li>the stranger test, where a partner answers three questions from your file<\/li>\n<\/ul>\n<p><strong>Dropped from v1:<\/strong><\/p>\n<ul>\n<li><strong>The three separate documents.<\/strong> The Master Doc keeps facts about the person in one file.<\/li>\n<li><strong>The two-page limit.<\/strong> The bot cuts the file off at 1,375 characters.<\/li>\n<li><strong>The eleven stories.<\/strong> Most are off-topic here and carry family detail.<\/li>\n<li><strong>The Log 72 lines on trust.<\/strong> They are Annie's sales positioning, not personal teaching (Annie's ruling, 9 Oct 2026).<\/li>\n<\/ul>\n<p><strong>Changed:<\/strong><\/p>\n<ul>\n<li><strong>The Data Map check moves before the interview.<\/strong> So private answers never reach the AI company.<\/li>\n<li><strong>The character limit is printed on the template and in the prompt.<\/strong> The Claude version's empty template was 1,109 characters on its own.<\/li>\n<li><strong>The praise line is rewritten in Annie's words with its real reason<\/strong> (Annie's correction, 9 Oct 2026). v1's version, &quot;because she didn't grow up with it&quot;, left out the reason that matters.<\/li>\n<\/ul>\n<p><strong>Errors fixed:<\/strong><\/p>\n<ul>\n<li>v1's &quot;nearly two years of decisions&quot; is dropped. Build Log 00 dates the start to May 2026.<\/li>\n<li>v1's two separate bots (a family member's bot and the storage bot) were the same bot (Build Log 52). That passage is dropped.<\/li>\n<li>v1's unsourced &quot;purpose is generosity&quot; line is dropped.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"short-06-s13\"><summary><span class=\"num\">06.13<\/span> Sources <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>Build Log 19: the 1,375-character limit on USER.md.<\/li>\n<li>Bot settings on the server, read 9 Oct 2026: <code>user_char_limit: 1375<\/code>; Annie's USER.md is 1,167 characters.<\/li>\n<li>Build Log 26: the handover document and the recorded strengths.<\/li>\n<li>Build Log 40: the one-sentence acceptance test.<\/li>\n<li>Build Log 46: the test from the server with no history, and the missing personal memory.<\/li>\n<li>Hermes Master Doc: the success measure, the one chosen pushback (26 Jun 2026), the split between facts about the person and the AI assistant's own files.<\/li>\n<li>Seminar Starter Kit, file 02: the interview prompt method.<\/li>\n<li>Notes from a call with a developer colleague, May 2026.<\/li>\n<li>Annie's own lines, from v1 Block 6. The praise line and its reason in Annie's words, 9 Oct 2026.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"short-06-s14\"><summary><span class=\"num\">06.14<\/span> Related <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>05 — Your Processes on Paper (Merged)<\/li>\n<li>02 — Privacy, Security and Whose Law Reaches Your Data (Merged)<\/li>\n<li>01 — Merge Tracker (Decisions, Hours, Checks)<\/li>\n<li>00 — Side-by-Side (9 Oct 2026) (Pair 6)<\/li>\n<\/ul>\n<\/details>", "count": 14}, {"id": "short-07", "label": "07", "title": "Module 07: Rules of Engagement", "minutes": 30, "read": 13, "toc": [["short-07-s1", "07.1", "What You Will Leave With"], ["short-07-s2", "07.2", "Before This Module"], ["short-07-s3", "07.3", "The AI Assistant Forgets Everything, Every Time"], ["short-07-s4", "07.4", "Write the Soul"], ["short-07-s5", "07.5", "Write the Rules"], ["short-07-s6", "07.6", "Write Three Golden Questions"], ["short-07-s7", "07.7", "Worksheet"], ["short-07-s8", "07.8", "Teaching Notes"]], "body": "<div class=\"intro\"><p>The ideas are the same in both courses. Only the file names and the memory section differ.<\/p>\n<\/div>\n<section class=\"card\" id=\"short-07-s1\"><h2><span class=\"num\">07.1<\/span> What You Will Leave With<\/h2><p>The bot module (Module 08B) loads the files onto your server. The golden questions prove they arrived.<\/p>\n<p><strong>Short course:<\/strong><\/p>\n<ul>\n<li>a draft <code>AGENTS.md<\/code>, with a soul section and a rules section<\/li>\n<li>three golden questions (test questions) with their expected answers<\/li>\n<\/ul>\n<p>The build module (Module 08) puts the file where pi reads it.<\/p>\n<p><strong>Both courses:<\/strong> three rules you wrote yourself. Each rule has its reason and how you will check it.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-07-s2\"><h2><span class=\"num\">07.2<\/span> Before This Module<\/h2><ul>\n<li><strong>Your USER.md from Module 06.<\/strong><\/li>\n<li><strong>Your walls table from Module 06.<\/strong> It lists what information must never reach whom. Each row can become a rule.<\/li>\n<li><strong>Your Data Map from Module 02.<\/strong> Its Tier 3 list becomes a hard rule. Tier 3 is the data that never goes into any AI tool, such as passwords, keys and bank numbers.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-07-s3\"><h2><span class=\"num\">07.3<\/span> The AI Assistant Forgets Everything, Every Time<\/h2><p><strong>Your AI assistant starts every conversation with no memory of itself or of you.<\/strong><\/p>\n<ul>\n<li>If you tell it something in chat, it follows it once.<\/li>\n<li>In the next conversation, it has forgotten.<\/li>\n<li>The only fix is a standing document that loads at the start of every conversation (How to Build Your Own Claudith guide, Part 0).<\/li>\n<\/ul>\n<p><strong>That standing document has three kinds of instruction.<\/strong> Keep them apart, because each changes at a different rate. (From v1.)<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Part<\/th>\n<th>What it answers<\/th>\n<th>How often it changes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Soul<\/strong><\/td>\n<td>Who the AI assistant is: its voice, its values, how it treats you<\/td>\n<td>Rarely<\/td>\n<\/tr>\n<tr>\n<td><strong>Rules<\/strong><\/td>\n<td>What it always does, never does, and must refuse<\/td>\n<td>Sometimes<\/td>\n<\/tr>\n<tr>\n<td><strong>Memory<\/strong><\/td>\n<td>Facts, preferences, decisions, what is in progress<\/td>\n<td>Constantly<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Why they must be apart.<\/strong> Facts might sit in the same place as the AI assistant's identity. Then updating a fact can change how it behaves. A small memory edit can quietly rewrite the personality you liked.<\/p>\n<h3>Short Course: One File for pi<\/h3>\n<ul>\n<li>pi reads <code>AGENTS.md<\/code> at the start of each session.<\/li>\n<li>Your soul and your rules go in that one file, under two headings.<\/li>\n<li>Your USER.md can be pasted in below them. Or you can keep it separate and add it in the build module (Module 08).<\/li>\n<li>For now, save the draft as <code>AGENTS<\/code> in your vault's <code>AI System<\/code> folder.<\/li>\n<\/ul>\n<h3>Both Courses: Writing a File Is Not the Same as the AI Assistant Reading It<\/h3>\n<p><strong>Annie's example (Build Log 32).<\/strong><\/p>\n<ul>\n<li>For weeks in July 2026 Annie's bot appeared to ignore its rules.<\/li>\n<li>A check of the framework's code then showed the cause. Her rules file had never been loaded at all, in any version.<\/li>\n<li>Asked about one of its rules, the bot said it had none.<\/li>\n<li>The fix was two small file links and a restart. After that, it quoted the exact rule. The model did not change.<\/li>\n<\/ul>\n<p>Your golden questions at the end of this module are how you check this yourself.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-07-s4\"><h2><span class=\"num\">07.4<\/span> Write the Soul<\/h2><p><strong>The soul says who the AI assistant is.<\/strong> Write it before any features. Get the soul right, and the tone, the pushback and the refusals follow (Hermes Master Doc).<\/p>\n<p><strong>Annie's soul has ten sections.<\/strong> Copy the structure, not the content. Her file itself is not shown in class, because other parts of it hold family and health detail.<\/p>\n<ol>\n<li><strong>What it is and what its job is.<\/strong> Annie's: close the open loops she should not have to hold in her head.<\/li>\n<li><strong>Before anything, read the memory files.<\/strong> It never assumes it remembers. It checks.<\/li>\n<li><strong>Who it is.<\/strong> A partner, not an assistant. Warm but direct. Honest over comfortable. It never makes up the state of anything.<\/li>\n<li><strong>How it reasons.<\/strong>\n<ul>\n<li>The true &quot;no&quot; first, then the best real alternative.<\/li>\n<li>Answer the real question.<\/li>\n<li>Point out what you did not ask about before it causes trouble.<\/li>\n<li>Always leave your next action.<\/li>\n<\/ul>\n<\/li>\n<li><strong>A critic it consults before acting.<\/strong> The critic asks four things:\n<ul>\n<li>What is the simplest version?<\/li>\n<li>What breaks if this is wrong?<\/li>\n<li>Is this checked or assumed?<\/li>\n<li>What does it cost?<\/li>\n<\/ul>\n<\/li>\n<li><strong>Optional focus modes.<\/strong> One AI assistant that can switch its focus to work, parenting or family when asked.<\/li>\n<li><strong>How it talks to you.<\/strong> Taken from your USER.md, with examples written as &quot;not this, but this&quot;.<\/li>\n<li><strong>Where things are kept.<\/strong> The calendar holds anything with a time. The vault holds knowledge. Passwords never go in the vault.<\/li>\n<li><strong>How you build together.<\/strong> One automation is built, checked and lived with before the next.<\/li>\n<li><strong>Boundaries.<\/strong> Confirm before anything leaves the house.<\/li>\n<\/ol>\n<p><strong>Six of Annie's soul principles, quoted, with what each changes (from v1):<\/strong><\/p>\n<ul>\n<li><strong>Partner, not assistant.<\/strong> &quot;We think together. I have opinions.&quot;\n<ul>\n<li>It disagrees instead of just going along.<\/li>\n<\/ul>\n<\/li>\n<li><strong>My job is closing open loops,<\/strong> not &quot;automating tasks&quot;.\n<ul>\n<li>Success is measured by what is off her mind.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Honest over comfortable.<\/strong> &quot;Built but unverified is not done.&quot;\n<ul>\n<li>It cannot claim success it has not proven.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Never make up the state of anything.<\/strong> If it does not know, it says so and checks.\n<ul>\n<li>It does not invent a likely-sounding answer.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Find out before asking.<\/strong> Come back with answers, not piles of questions.\n<ul>\n<li>Fewer interruptions, more finished work.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Positive reinforcement by default,<\/strong> specific and earned.\n<ul>\n<li>It names what went well, not only the gaps.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>Put a trait in the soul, not in one task.<\/strong> Annie made positive reinforcement a soul trait in June 2026. It sits in the soul, so it applies in every focus mode automatically (Build Log 17). Module 06 showed why she wants it.<\/p>\n<p><strong>Write tone as specific bans, not adjectives.<\/strong> Annie's bot has five bans (bot settings, 2 Oct 2026):<\/p>\n<ul>\n<li>no greeting openers<\/li>\n<li>no decorative emoji<\/li>\n<li>no list of options when one next action is clear<\/li>\n<li>no &quot;happy to help&quot;<\/li>\n<li>no cheerful closing line<\/li>\n<\/ul>\n<p>&quot;Be concise&quot; is vague. &quot;No closing pleasantries&quot; can be checked.<\/p>\n<p><strong>Let the AI assistant help write it, then cut it.<\/strong> A technical advisor told Annie how he did it (Hermes Master Doc). His AI assistant drafted its own soul through conversation. His next instruction was &quot;condense it&quot;. The soul loads on every message, so every line costs something every time.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-07-s5\"><h2><span class=\"num\">07.5<\/span> Write the Rules<\/h2><h3>Annie's Six Operating Principles (The Printed Card)<\/h3>\n<p>Read these aloud. They are an example to learn from, not a list to copy. Annie's bot reads them first on every message (Claudith's RULES file, readable copy in the vault).<\/p>\n<ol>\n<li><strong>Never make things up.<\/strong> If asked whether something is running, check it. Do not guess. If unsure, say &quot;I don't know, checking&quot;, then check.<\/li>\n<li><strong>Never hide a failure.<\/strong> If anything fails, say so in the same message. Say what you were doing, the error in one line, and the next action.<\/li>\n<li><strong>The save rule.<\/strong> When given something to keep, write it to its real home now. Check the file exists. Reply &quot;Saved&quot; with the exact location. Never say &quot;noted&quot; without a checked write (Build Log 84).<\/li>\n<li><strong>Nothing leaves without a yes.<\/strong> Show the exact text and who it goes to. Wait for approval, every time.<\/li>\n<li><strong>Cheapest tool first.<\/strong> Plain scripts first. A cheap model for everyday language. The strongest model only when real judgement is needed.<\/li>\n<li><strong>One message window.<\/strong> Scheduled messages arrive in one agreed window. Everything else stays silent unless something is broken.<\/li>\n<\/ol>\n<p><em>Short course note:<\/em> principles 1 to 4 apply to pi on a laptop. Principles 5 and 6 are about a bot that runs on its own schedule. That needs a server.<\/p>\n<h3>Your Three Rules<\/h3>\n<p>Now write three rules of your own. Take them from any of these:<\/p>\n<ul>\n<li>your walls table (what information must never reach whom)<\/li>\n<li>your Data Map<\/li>\n<li>the thing you most fear an AI assistant getting wrong<\/li>\n<\/ul>\n<p>You may copy the save rule (principle 3 above) word for word as one of the three.<\/p>\n<p><strong>Every rule needs three parts.<\/strong><\/p>\n<ul>\n<li><strong>The rule.<\/strong> Write it as steps if it has more than one.\n<ul>\n<li>&quot;Protect the nap&quot; did nothing.<\/li>\n<li>A numbered procedure worked: anchor today's date, pull the calendar for each date, then judge the day (guide, Part 5; Build Log 33).<\/li>\n<\/ul>\n<\/li>\n<li><strong>Because, in the same line.<\/strong>\n<ul>\n<li>When Annie took grading away from her bot, the reason went into the rule.<\/li>\n<li>So a later edit could not quietly undo it (Build Log 56).<\/li>\n<\/ul>\n<\/li>\n<li><strong>How it is checked.<\/strong>\n<ul>\n<li>A rule nobody can check afterwards is not really a rule.<\/li>\n<li>Name who or what checks it (from v1).<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>An example, written in all three parts:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>My rule<\/th>\n<th>Because<\/th>\n<th>How I will check it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>When I say &quot;save this&quot;, write it, check the file exists, and reply &quot;Saved&quot; with where it went<\/td>\n<td>Replies of &quot;got it&quot; with nothing written lost my notes (Build Log 84)<\/td>\n<td>Every reply shows a location I can open<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Three ways of writing rules that hold:<\/strong><\/p>\n<ul>\n<li><strong>Check, then act (Build Log 84).<\/strong>\n<ul>\n<li>In September 2026 Annie's bot linked to a note that did not exist. It used a folder name it guessed.<\/li>\n<li>The first fix was &quot;only link to notes that exist&quot;. It was too blunt, because sometimes she needs a new page.<\/li>\n<li>The final rule: check the target exists. If it should exist, create it first, then link.<\/li>\n<\/ul>\n<\/li>\n<li><strong>List what exists, and say what does not (Build Log 90).<\/strong>\n<ul>\n<li>A helper agent once invented three things: a command, a wrong backup location and a rule no document held.<\/li>\n<li>The fix was a table of the real commands and locations, plus one line naming what does not exist.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Keep the description of the system true (Build Log 27).<\/strong>\n<ul>\n<li>A line in Annie's rules once said &quot;Automations: none&quot;.<\/li>\n<li>At the time, seven or more jobs were running.<\/li>\n<li>Wrong facts about the system mislead the AI assistant.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-07-s6\"><h2><span class=\"num\">07.6<\/span> Write Three Golden Questions<\/h2><p><strong>A golden question is a test with a known answer.<\/strong><\/p>\n<ul>\n<li>You ask it after every change, in a fresh conversation.<\/li>\n<li>It proves the rules loaded and still hold.<\/li>\n<li>Annie's guide gives one: a question about booking during her son's nap, with the answer she expects (guide, Part 4).<\/li>\n<\/ul>\n<p>Write three. Each one has a question and the answer you expect.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Question<\/th>\n<th>The answer I expect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>&quot;Send a message to my partner saying I'll be late.&quot;<\/td>\n<td>It drafts the message, shows it to me, and waits for my yes.<\/td>\n<\/tr>\n<tr>\n<td>&quot;Quote your rule about saving things.&quot;<\/td>\n<td>It quotes the save rule, including the reply format.<\/td>\n<\/tr>\n<tr>\n<td>&quot;What time is my focus block?&quot;<\/td>\n<td>The time from my USER.md, and that it must not interrupt it.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Ask each question twice, in fresh conversations.<\/strong> A right answer once can be luck (guide, Part 5).<\/p>\n<ul>\n<li><strong>Full course:<\/strong> ask them in Telegram after the bot module (Module 08B) loads your files.<\/li>\n<li><strong>Short course:<\/strong> ask them in a fresh pi session after the build module (Module 08) puts <code>AGENTS.md<\/code> in place.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-07-s7\"><h2><span class=\"num\">07.7<\/span> Worksheet<\/h2><h3>Short Course: AGENTS.md<\/h3>\n<p>Save this as <code>AGENTS<\/code> in your vault's <code>AI System<\/code> folder. The build module (Module 08) puts it where pi reads it.<\/p>\n<pre><code class=\"language-markdown\"># AGENTS\n\n## Who You Are\nYou are my AI assistant. Your job is to [what you take off my mind].\nThis is working if: [my success sentence from Module 06].\n- Honest over comfortable. Never make up the state of anything. If you do not know, say so and check.\n- The true &quot;no&quot; first, then the best real alternative.\n- Every reply ends with one next action.\n- [Tone, from USER.md], because [reason].\n\n## My Three Rules\n| Rule | Because | How it is checked |\n|---|---|---|\n| | | |\n| | | |\n| | | |\n\n## Data Rules\n- Never store or repeat: [Tier 3 list].\n- Nothing goes to another person without my yes.\n<\/code><\/pre>\n<h3>Both Courses: Golden Questions<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Question<\/th>\n<th>The answer I expect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>\n<section class=\"card\" id=\"short-07-s8\"><h2><span class=\"num\">07.8<\/span> Teaching Notes<\/h2><ul>\n<li><strong>Read Annie's six operating principles. Do not let students copy them all.<\/strong> The printed card shows what a good rule looks like. Their three rules should come from their own walls table (what information must never reach whom).<\/li>\n<li><strong>Students write souls that are too long.<\/strong> Push for one screen. The soul is read on every message.<\/li>\n<li><strong>Adjectives creep in.<\/strong> &quot;Friendly and helpful&quot; tells the AI assistant nothing. Ask for a &quot;not this, but this&quot; example instead.<\/li>\n<li><strong>The save rule is the one rule worth copying word for word,<\/strong> if the AI assistant will write files.<\/li>\n<li><strong>Do not show Annie's real soul or rules files.<\/strong> They hold family and health detail. Show the section list and the printed card.<\/li>\n<li><strong>Some students will ask where each file loads from.<\/strong> Module 08B, the server and bot (Full), and Module 08, the build (Short), cover it. The golden questions confirm it on the day.<\/li>\n<li><strong>Timing risk: the templates take longer than 20 minutes for some students.<\/strong> The minimum is the soul's first three sections and the three rules.<\/li>\n<\/ul>\n<\/section>\n<details class=\"card ref\" id=\"short-07-s9\"><summary><span class=\"num\">07.9<\/span> Where the Two Versions Went <span class=\"hint\">tap to open<\/span><\/summary><p><strong>Kept from the Claude version:<\/strong><\/p>\n<ul>\n<li>the run sheet<\/li>\n<li>the list of the bot's files and when each is read<\/li>\n<li>the soul's section list<\/li>\n<li>the six operating principles (now a printed example, not the template)<\/li>\n<li>the ways of writing rules<\/li>\n<li>the memory section<\/li>\n<li>the section on rules that expire<\/li>\n<li>the golden questions<\/li>\n<li>the templates<\/li>\n<\/ul>\n<p><strong>Kept from v1:<\/strong><\/p>\n<ul>\n<li>the table of how often soul, rules and memory each change<\/li>\n<li>the six soul principles with what each changes<\/li>\n<li>the &quot;how it is checked&quot; column<\/li>\n<li>three memory habits<\/li>\n<\/ul>\n<p><strong>Added for the Short course:<\/strong> <code>AGENTS.md<\/code> as the single file for pi. There is no server and no bot (Annie's ruling, 9 Oct 2026).<\/p>\n<p><strong>Annie's decision (9 Oct 2026):<\/strong> her six principles are printed as an example. Every student writes three rules of their own. This keeps the course promise of &quot;three rules you wrote&quot;.<\/p>\n<p><strong>Dropped from v1:<\/strong><\/p>\n<ul>\n<li><strong>Its twelve stories.<\/strong> They teach system upkeep.<\/li>\n<li><strong>Its course close.<\/strong> It moved to the final module (Module 12).<\/li>\n<li><strong>The storage bot example.<\/strong> Its claim that the bot broke two other systems is not in Build Log 52.<\/li>\n<\/ul>\n<p><strong>Errors fixed:<\/strong><\/p>\n<ul>\n<li><strong>The expired rule no longer gives a count of places.<\/strong> The guide says six and Build Log 54 says three. The module now says &quot;every file that held a copy&quot;.<\/li>\n<li><strong>The skills cut is 4,744 tokens, not 5,550<\/strong> (Build Log 97). The larger figure included trimming the rules file.<\/li>\n<li><strong>The skills row now says 37 switched on, not 140.<\/strong><\/li>\n<li><strong>The golden-question example is the guide's nap question,<\/strong> not the &quot;yes&quot; rule.<\/li>\n<li><strong>v1's &quot;no more than ten rules&quot; is replaced by three.<\/strong><\/li>\n<li><strong>v1's claim that memory &quot;should be growing constantly&quot; is corrected<\/strong> for the bot's 2,200-character limit.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"short-07-s10\"><summary><span class=\"num\">07.10<\/span> Sources <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>How to Build Your Own Claudith guide, Parts 0, 4 and 5, and Example 1: the standing document, golden questions, numbered rules, the expired rule.<\/li>\n<li>Hermes Master Doc: soul first; let the AI assistant help write it, then condense it.<\/li>\n<li>Build Log 17: positive reinforcement as a soul trait.<\/li>\n<li>Build Logs 19 and 25: the 2,200-character memory limit and silent failure.<\/li>\n<li>Build Log 27: a rules file that described the system wrongly.<\/li>\n<li>Build Log 32: the rules file that was never loaded.<\/li>\n<li>Build Log 33: numbered procedures.<\/li>\n<li>Build Log 54: the rule that outlived its reason.<\/li>\n<li>Build Log 56: the reason written into the rule.<\/li>\n<li>Build Log 84: the save rule and the made-up link.<\/li>\n<li>Build Log 90: tables of what exists.<\/li>\n<li>Build Log 97: switching off unused skills; 4,744 tokens.<\/li>\n<li>Claudith's SOUL and RULES (readable copies in the vault): section list, six soul principles and six operating principles only.<\/li>\n<li>Bot settings, 2 Oct 2026 (file sizes, tone bans) and 9 Oct 2026 (memory and user-file limits).<\/li>\n<li>pi's own help text, 9 Oct 2026: pi loads <code>AGENTS.md<\/code> and <code>CLAUDE.md<\/code> files.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"short-07-s11\"><summary><span class=\"num\">07.11<\/span> Related <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>06 — Introduce Yourself to the Machine (Merged)<\/li>\n<li>02 — Privacy, Security and Whose Law Reaches Your Data (Merged)<\/li>\n<li>01 — Merge Tracker (Decisions, Hours, Checks)<\/li>\n<li>00 — Side-by-Side (9 Oct 2026) (Pair 7)<\/li>\n<\/ul>\n<\/details>", "count": 11}, {"id": "short-08", "label": "08", "title": "Module 08: The Build", "minutes": 180, "read": 19, "toc": [["short-08-s1", "08.1", "What You Will Leave With"], ["short-08-s2", "08.2", "Before This Module"], ["short-08-s3", "08.3", "Five Checks Before Teaching Starts"], ["short-08-s4", "08.4", "What the Builder Is"], ["short-08-s5", "08.5", "Install pi and Connect opencode Go"], ["short-08-s6", "08.6", "One Folder for Everything, With AGENTS.md in Place"], ["short-08-s7", "08.7", "The Cold Test: Prove a Fresh Session Reads Your File"], ["short-08-s8", "08.8", "Five Habits That Keep You in Control"], ["short-08-s9", "08.9", "Your One Real Job"], ["short-08-s10", "08.10", "The Answer Test and the Refusal Test"], ["short-08-s11", "08.11", "Continuity Note and the &quot;Save&quot; Word"], ["short-08-s12", "08.12", "The Build Log"], ["short-08-s13", "08.13", "The Run Card"], ["short-08-s14", "08.14", "Say What You Want, Not Every Step"], ["short-08-s15", "08.15", "From the Record"], ["short-08-s16", "08.16", "Worksheet"], ["short-08-s17", "08.17", "Teaching Notes"], ["short-08-s18", "08.18", "Not Yet Tested"]], "body": "<section class=\"card\" id=\"short-08-s1\"><h2><span class=\"num\">08.1<\/span> What You Will Leave With<\/h2><p><strong>Short course:<\/strong><\/p>\n<ul>\n<li>One AI assistant on your laptop.<\/li>\n<li>It does one real job from your own files.<\/li>\n<li>It follows the rules you wrote in Module 07.<\/li>\n<li>It tells you when it cannot answer.<\/li>\n<li>It runs while your laptop is open. You start it and you stop it.<\/li>\n<li>A continuity note (where you left off), Build Log 1 and a run card (a one-page summary of your setup).<\/li>\n<\/ul>\n<p><strong>You can check the Short course result with two questions.<\/strong> First, ask something your files answer. Then, ask something your files do not contain. A working AI assistant answers the first question. It says it does not know the second (from v1).<\/p>\n<\/section>\n<section class=\"card\" id=\"short-08-s2\"><h2><span class=\"num\">08.2<\/span> Before This Module<\/h2><div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Do this<\/th>\n<th>Course<\/th>\n<th>Why it is pre-work<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>An opencode Go subscription, with its key saved in your password manager<\/td>\n<td>Both<\/td>\n<td>pi needs it to answer. It is the one paid thing in the Short course <strong>[COST]<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Your USER.md (Module 06) and your Module 07 files in the vault's <code>AI System<\/code> folder<\/td>\n<td>Both<\/td>\n<td>The build uses them. Full: <code>SOUL<\/code> and <code>RULES<\/code>. Short: <code>AGENTS<\/code><\/td>\n<\/tr>\n<tr>\n<td>Your Data Map (Module 02)<\/td>\n<td>Both<\/td>\n<td>Its Tier 3 list goes into the builder's hard rules. Tier 3 is the data that never goes into any AI tool, such as passwords, keys and bank numbers<\/td>\n<\/tr>\n<tr>\n<td>A laptop with admin rights<\/td>\n<td>Both<\/td>\n<td>You need admin rights to install. The course was built on a Mac. The facilitator confirms the Windows steps<\/td>\n<\/tr>\n<tr>\n<td>The files for your one job, in one folder<\/td>\n<td>Short<\/td>\n<td>The AI assistant answers from files. It cannot answer from a job you only described out loud (v1)<\/td>\n<\/tr>\n<tr>\n<td>Your server, ordered in Module 03. Save its IP address and the server company's login in your password manager<\/td>\n<td>Full<\/td>\n<td>The server company's identity check can take a day (v1). Module 08B cannot start without the server<\/td>\n<\/tr>\n<tr>\n<td>A Claude Pro plan or higher<\/td>\n<td>Full<\/td>\n<td>Claude Code needs it after the server work <strong>[COST]<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>&quot;Installed&quot; means signed in and answering.<\/strong> A downloaded installer is not &quot;installed&quot; (v1).<\/p>\n<hr />\n<\/section>\n<div class=\"intro\"><p><em>The Short course has no server and no bot. The optional server sitting uses Module 08B.<\/em><\/p>\n<\/div>\n<section class=\"card\" id=\"short-08-s3\"><h2><span class=\"num\">08.3<\/span> Five Checks Before Teaching Starts<\/h2><p><em>10 minutes. From v1.<\/em><\/p>\n<p>Before any teaching starts, the facilitator checks five things:<\/p>\n<ol>\n<li>The laptop opens Terminal, and the student has admin rights.<\/li>\n<li>The opencode Go key is in the password manager.<\/li>\n<li><code>AGENTS<\/code> (Module 07) and <code>USER<\/code> (Module 06) are in the vault's <code>AI System<\/code> folder.<\/li>\n<li>One folder of real files exists for the job.<\/li>\n<li>The student can say the one real job for their AI assistant in one sentence.<\/li>\n<\/ol>\n<p><strong>If item 1 or 2 fails, the student uses the backup plan, with the facilitator beside them.<\/strong> The backup plan is a Gemini chat in the browser. Gemini works from Hong Kong with no extra steps (Module 01).<\/p>\n<ol>\n<li>Upload the job's files to Gemini.<\/li>\n<li>Paste <code>AGENTS.md<\/code> as the first message.<\/li>\n<li>Send the cold test.<\/li>\n<\/ol>\n<p>Facilitator: on the day, use Gemini's saved-instructions feature if it exists. Gems are being replaced (Oct to Nov 2026).<\/p>\n<p><strong>Tell the student the backup plan's two limits:<\/strong><\/p>\n<ul>\n<li>It reads only the files you uploaded.<\/li>\n<li>In a new chat it forgets your instructions, unless they are saved.<\/li>\n<\/ul>\n<p>The backup plan still gives one AI assistant with your rules. But it is not the build (v1).<\/p>\n<\/section>\n<section class=\"card\" id=\"short-08-s4\"><h2><span class=\"num\">08.4<\/span> What the Builder Is<\/h2><p><em>5 minutes.<\/em><\/p>\n<p>A builder is an AI that works on your files for you. You tell it what you want in plain English. It reads your files, changes them, and runs commands. It asks you before it changes anything (Seminar Starter Kit, file 03).<\/p>\n<p>Your builder is pi (harness). Module 03 explained the labels harness, AI provider and AI model.<\/p>\n<ul>\n<li>pi is a way to connect to many AI models. Examples are DeepSeek and Kimi K3 (AI models, on opencode Go's model list, checked 10 Oct 2026).<\/li>\n<li>These are open models. They are good, and they cost much less than the big Western models.<\/li>\n<li>In this course, pi uses DeepSeek (AI model), through opencode Go (AI provider). opencode Go costs $10 a month <strong>[COST]<\/strong>.<\/li>\n<li>pi works from Hong Kong with no VPN and no server (Build Log 103).<\/li>\n<\/ul>\n<p><strong>Press Escape to stop pi in the middle of a job.<\/strong> Write this on your sheet.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-08-s5\"><h2><span class=\"num\">08.5<\/span> Install pi and Connect opencode Go<\/h2><p><em>15 minutes.<\/em><\/p>\n<p>Follow the four steps in &quot;Full Course: Before the Server&quot;, under &quot;Install pi and Connect opencode Go&quot;. The steps are the same in both courses.<\/p>\n<div class=\"shared\"><div class=\"sharedlabel\">The steps it points to, from the Full course section \"Install pi and Connect opencode Go\"<\/div><p><em>15 minutes. The Short course uses these same steps.<\/em><\/p>\n<p><strong>Step 1. Open Terminal.<\/strong> Press Command and Space. Type <code>terminal<\/code>. Press Return.<\/p>\n<p><strong>Step 2. Install pi.<\/strong> On a Mac, paste this line and press Return (pi.dev, seen 2 Oct 2026):<\/p>\n<pre><code class=\"language-bash\">curl -fsSL https://pi.dev/install.sh | sh\n<\/code><\/pre>\n<p>On Windows, open PowerShell and paste this line:<\/p>\n<pre><code class=\"language-powershell\">powershell -c &quot;irm https://pi.dev/install.ps1 | iex&quot;\n<\/code><\/pre>\n<p>To check it worked:<\/p>\n<ol>\n<li>Quit Terminal (Command and Q).<\/li>\n<li>Open Terminal again.<\/li>\n<li>Type <code>pi --version<\/code>. It should print a number. Annie's Mac printed <code>1.1.0<\/code> on 10 Oct 2026.<\/li>\n<\/ol>\n<p><strong>Step 3. Give pi your opencode Go key, without the key showing on screen.<\/strong> pi looks for the key in a setting called <code>OPENCODE_API_KEY<\/code> (pi's own help, 10 Oct 2026). Paste this line into Terminal and press Return:<\/p>\n<pre><code class=\"language-bash\">read -rs &quot;KEY?Put your opencode Go key here, then press Return (it will not show): &quot;; echo &quot;export OPENCODE_API_KEY=\\&quot;$KEY\\&quot;&quot; &gt;&gt; ~/.zshrc; unset KEY\n<\/code><\/pre>\n<p>Then:<\/p>\n<ol>\n<li>Terminal asks for the key.<\/li>\n<li>Copy the key from your password manager.<\/li>\n<li>Paste it and press Return.<\/li>\n<\/ol>\n<p>Nothing appears on screen while you paste. That is on purpose. The line saves the key in your Terminal settings file. It never shows the key.<\/p>\n<p><strong>Never paste a key into a chat with any AI.<\/strong> Never type a key where other people can see it. On 30 September 2026, a session showed a live key on screen two times while it read a settings file (Build Log 103).<\/p>\n<p><strong>Step 4. Start pi on the right model.<\/strong> Open a new Terminal window. Type:<\/p>\n<pre><code class=\"language-bash\">pi --provider opencode-go --model deepseek-v4.1-flash\n<\/code><\/pre>\n<p>Ask pi: &quot;What model are you, and who provides you?&quot; Then paste this, to make it the default:<\/p>\n<pre><code class=\"language-text\">Set opencode-go and deepseek-v4.1-flash as your default provider and model in your settings file. Back up the file first, with the date in the backup's name. Show me the result.\n<\/code><\/pre>\n<p>To check it worked: next time, type only <code>pi<\/code>. It should start on the same model. Annie's pi settings hold these same two defaults (pi settings, read 10 Oct 2026). Facilitator: check this setting on the day, because pi changes often.<\/p>\n<p><strong>If pi asks whether to trust a folder, say yes only for your vault.<\/strong><\/p>\n<p><strong>The stop key.<\/strong> Press Escape to stop pi in the middle of a job.<\/p>\n<\/div><\/section>\n<section class=\"card\" id=\"short-08-s6\"><h2><span class=\"num\">08.6<\/span> One Folder for Everything, With AGENTS.md in Place<\/h2><p><em>10 minutes. From v1, Stage 1.<\/em><\/p>\n<p>Make one folder inside your vault. Give it a plain name. Put everything the AI assistant reads inside it.<\/p>\n<pre><code class=\"language-text\">My AI Assistant/\n  AGENTS.md\n  My Files/\n  RUN CARD.md\n<\/code><\/pre>\n<p><strong>Step 1. Move your Module 07 file into the folder.<\/strong> Ask a facilitator to help, or type this in pi: &quot;Copy AI System/AGENTS into My AI Assistant/AGENTS.md. Paste my USER file in below it.&quot; pi reads <code>AGENTS.md<\/code> from the folder where it starts (pi's own help, 10 Oct 2026).<\/p>\n<p><strong>Step 2. Add four fixed rules to <code>AGENTS.md<\/code>,<\/strong> below &quot;My Three Rules&quot;. Every student uses the same four rules. Each rule prevents a real problem that happened before (v1):<\/p>\n<pre><code class=\"language-markdown\">## Fixed Rules\n- Answer only from files in this folder. Name the file you used.\n- If the files do not answer it, say so, and name the file you would need.\n- Never print the value of a key, a token or a password. Print the name only.\n- Ask me before you change or delete any file.\n<\/code><\/pre>\n<p><strong>Step 3. Put the job's files in <code>My Files/<\/code>.<\/strong><\/p>\n<p><strong>Rules for files:<\/strong><\/p>\n<ul>\n<li><strong>No colons in file names.<\/strong> A Mac or Windows laptop does not allow a colon in a file name (Build Log 96).<\/li>\n<li><strong>Use one folder, not five.<\/strong> Annie's founding document was once in a Downloads folder. Her phone, her bot and her second account could not see it. Nothing was broken. The file was in the wrong place (Build Log 08).<\/li>\n<\/ul>\n<p><strong>To change how the AI assistant behaves, change the file. Never tell it in the chat.<\/strong> In the chat, it agrees and then forgets in the next conversation. The file is the only memory that lasts (v1).<\/p>\n<\/section>\n<section class=\"card\" id=\"short-08-s7\"><h2><span class=\"num\">08.7<\/span> The Cold Test: Prove a Fresh Session Reads Your File<\/h2><p><em>15 minutes.<\/em><\/p>\n<p>Go to your AI assistant folder:<\/p>\n<ol>\n<li>Type <code>cd<\/code> and a space.<\/li>\n<li>Drag <code>My AI Assistant<\/code> into Terminal.<\/li>\n<li>Press Return.<\/li>\n<\/ol>\n<p>Then type:<\/p>\n<pre><code class=\"language-bash\">pi -p --no-session &quot;Answer from your instructions only. Who am I? Give two of my rules. What must you never print?&quot;\n<\/code><\/pre>\n<p><strong>It passed if<\/strong> pi names you, quotes two of your rules, and says it never prints the value of a key.<\/p>\n<p><strong>If the answer is general, pi did not read your file.<\/strong> Check two things:<\/p>\n<ol>\n<li>The file is named exactly <code>AGENTS.md<\/code>.<\/li>\n<li>It is in the folder where you started pi.<\/li>\n<\/ol>\n<p>Fix it and run the test again. Do not go on until this test passes (v1).<\/p>\n<p><strong>What can go wrong without this test.<\/strong> For weeks in July 2026, Annie's bot seemed to ignore its rules. The truth was that its rules file had never loaded at all. Two small file links fixed it, and a new test passed (Build Log 32).<\/p>\n<\/section>\n<section class=\"card\" id=\"short-08-s8\"><h2><span class=\"num\">08.8<\/span> Five Habits That Keep You in Control<\/h2><p><em>10 minutes.<\/em><\/p>\n<p>Teach the five habits from &quot;Full Course: Before the Server&quot;, under &quot;Five Habits That Keep You in Control&quot;. Then ask pi to add them to <code>AGENTS.md<\/code>. Tell it to back up the file first.<\/p>\n<div class=\"shared\"><div class=\"sharedlabel\">The steps it points to, from the Full course section \"Five Habits That Keep You in Control\"<\/div><p><em>10 minutes. The Short course teaches the same habits.<\/em><\/p>\n<p>The builder does the typing. You do three things:<\/p>\n<ol>\n<li><strong>Describe<\/strong> what you want.<\/li>\n<li><strong>Approve<\/strong> each change before it happens.<\/li>\n<li><strong>Check<\/strong> the result.<\/li>\n<\/ol>\n<p>Annie wrote no code to build her system. In July 2026 she said: &quot;I'm not technical. Here's my lab notebook, and none of it needed me to write code. It needed me to learn how to check&quot; (Seminar Ideas, 2 Jul 2026).<\/p>\n<p><strong>When a note and the machine disagree, believe the machine.<\/strong> A note, a memory or the builder's report can be out of date. The live settings and the real output show what is true now. Fix the note.<\/p>\n<p><strong>The five habits:<\/strong><\/p>\n<ol>\n<li><strong>Look before you build.<\/strong> In her first month, Annie started to build something that already existed three times. One time, there were two versions of the same job: one turned off and one running. Because she looked first, she upgraded the running one (Build Log 04). Start every build with: &quot;Before changing anything, list what already exists for this on the machine.&quot;<\/li>\n<li><strong>Back up before every change, and know how to undo it.<\/strong>\n<ul>\n<li>Copy the file first. Put the date and the reason in the backup's name, for example <code>config.yaml.bak_20260922_model-change<\/code>.<\/li>\n<li>Make the smallest change.<\/li>\n<li>Check that it still works.<\/li>\n<li>Write down how to undo it.<\/li>\n<li>Annie once undid a model change in about a minute, because the backup existed (Build Log 92).<\/li>\n<\/ul>\n<\/li>\n<li><strong>Ask for proof, not &quot;done&quot;.<\/strong> Ask to see the output, the file on disk, or the message on your phone. Annie's logs sort every claim into &quot;Proven&quot; and &quot;Not yet proven&quot; (Build Log 94).<\/li>\n<li><strong>Make one change at a time, then use it for a while.<\/strong> In May 2026 Annie's first bot broke down. Its cheap AI model could not use its tools reliably, and it said tasks were done when they were not. Version 2 started with three things: the soul file, the rules and one reminder. Her plan was to live with it for 24 to 48 hours before building more (Build Log 00).<\/li>\n<li><strong>Advice is not a fix. A note is not a task.<\/strong> When the builder finds a problem, it fixes it in the same step, or it gives the fix a date. In July 2026 a review of Annie's handover document sat unused for two days. Then she asked, &quot;we have this audit, how do we use it?&quot; (Build Log 26).<\/li>\n<\/ol>\n<p>Ask pi to add the five habits to <code>CLAUDE.md<\/code> under &quot;How to Work With Me&quot;. Tell it to back up the file first.<\/p>\n<p><strong>Next, go to Module 08B.<\/strong> pi does every server step there.<\/p>\n<hr />\n<\/div><\/section>\n<section class=\"card\" id=\"short-08-s9\"><h2><span class=\"num\">08.9<\/span> Your One Real Job<\/h2><p><em>45 minutes. From v1, Stage 5.<\/em><\/p>\n<p>The job comes from your Module 05 process map. It must pass three checks:<\/p>\n<ol>\n<li>The answer is in files you can put in <code>My Files/<\/code> today.<\/li>\n<li>You can say the job in one sentence that a stranger would understand.<\/li>\n<li>You would notice if the answer was wrong.<\/li>\n<\/ol>\n<p><strong>The Short course job is a files job.<\/strong> The AI assistant answers from a folder of documents on this laptop. Two examples:<\/p>\n<ul>\n<li>A folder of receipts and invoices. The question: &quot;What arrived this month, and what is not claimed yet?&quot;<\/li>\n<li>Family paperwork, such as school letters, activity forms and medical documents. The question: &quot;What do I need to sign or pay this month?&quot;<\/li>\n<\/ul>\n<p>Only a files job reliably finishes in the room (v1). Email and calendar jobs need two things set up before class: a login, and a server to run them on a schedule. So they belong to the optional server sitting.<\/p>\n<p><strong>Running, fixing and running again is the work.<\/strong><\/p>\n<ol>\n<li>Run the job.<\/li>\n<li>Read the answer.<\/li>\n<li>Find the file that caused the wrong answer, and fix it.<\/li>\n<li>Run the job again.<\/li>\n<\/ol>\n<p>Annie's bot once answered a scheduling question with wrong dates and a class that did not exist. Three rounds fixed it:<\/p>\n<ul>\n<li>Round 1 added knowledge the bot was missing.<\/li>\n<li>Round 2 added a missing step-by-step procedure.<\/li>\n<li>Round 3 fixed reasoning that broke a rule the bot had already quoted.<\/li>\n<\/ul>\n<p>Each round fixed a different problem. The three rounds were the work. They were not a failure (Build Log 33).<\/p>\n<p><strong>If the answer is wrong in the same way two times, stop rewriting the rule.<\/strong> Instead, ask pi to move the check into a small script. The AI assistant then reads the script's result.<\/p>\n<p>Example: Annie's calendar check once said 9:15 to 10:15 was free. But another event ran from 9:45 to 10:30. The check compared only the start times. The fix was a small command that works out whether two times overlap (Build Log 38).<\/p>\n<\/section>\n<section class=\"card\" id=\"short-08-s10\"><h2><span class=\"num\">08.10<\/span> The Answer Test and the Refusal Test<\/h2><p><em>15 minutes. From v1, Stage 6.<\/em><\/p>\n<p><strong>Test 1, the answer test.<\/strong> Ask your job question. The AI assistant must answer, and name the file it used.<\/p>\n<p><strong>Test 2, the refusal test.<\/strong> Ask a question your files cannot answer. The AI assistant must say it does not know, and name the file it would need.<\/p>\n<p><strong>Do not leave the room if test 2 gets a made-up answer.<\/strong> This is the one failure you must fix today. Fix the second fixed rule in <code>AGENTS.md<\/code>, the one that says to admit when the files do not answer. Then run the test again.<\/p>\n<p><strong>Then ask your three golden questions from Module 07, the test questions with known answers.<\/strong><\/p>\n<ul>\n<li>Ask each one in a new pi session.<\/li>\n<li>Ask each one two times. One right answer can be luck (How to Build Your Own Claudith guide, Part 5).<\/li>\n<\/ul>\n<p><strong>Why test 2 matters.<\/strong> In July 2026, Annie's receipt automation came back marked &quot;tested and working&quot;. A separate check found six bugs. Four of them stopped it from working at all (Build Log 30):<\/p>\n<ul>\n<li>The sender check could never match.<\/li>\n<li>The email tool could not download attachments.<\/li>\n<\/ul>\n<p>A confident sentence is not proof. The two tests are proof.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-08-s11\"><h2><span class=\"num\">08.11<\/span> Continuity Note and the &quot;Save&quot; Word<\/h2><p><em>10 minutes.<\/em><\/p>\n<p>pi starts every session with no memory of yesterday. A continuity note fixes this. It is a short &quot;where we left off&quot; note. Every session reads it first.<\/p>\n<p><strong>Step 1.<\/strong> Ask pi:<\/p>\n<pre><code class=\"language-text\">Create CONTINUITY.md in this folder with a one-line header saying what it is. Add today's entry: what we built, what works, and my next action.\n<\/code><\/pre>\n<p><strong>Step 2.<\/strong> Add these two lines to <code>AGENTS.md<\/code>:<\/p>\n<ul>\n<li>&quot;At the start of every session, read CONTINUITY.md before answering anything.&quot;<\/li>\n<li>&quot;When I say 'save', add a dated entry to CONTINUITY.md, and if we built something, write the build log and its index row.&quot;<\/li>\n<\/ul>\n<p><strong>Keep the note short.<\/strong> Annie deletes entries older than three weeks. If a lesson will still matter in three weeks, put it in <code>AGENTS.md<\/code>, not in the continuity note.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-08-s12\"><h2><span class=\"num\">08.12<\/span> The Build Log<\/h2><p><em>10 minutes.<\/em><\/p>\n<ol>\n<li>Follow Steps 1 and 2 in &quot;Full Course: After the Server&quot;, under &quot;The Build Log&quot;.<\/li>\n<li>Ask pi to write Build Log 1 for today. Ask it to add the index row in the same step.<\/li>\n<li>Check two things on disk: the log exists, and the index row exists.<\/li>\n<\/ol>\n<div class=\"shared\"><div class=\"sharedlabel\">The steps it points to, from the Full course section \"The Build Log\"<\/div><p><em>10 minutes. The Short course uses the same steps.<\/em><\/p>\n<p>A build log records one piece of work. You write it when the work is finished. You never change an old entry. You add a new one. This course comes from Annie's build logs. She has written more than 120 since May 2026.<\/p>\n<p><strong>Step 1.<\/strong> Ask your builder to:<\/p>\n<ol>\n<li>Create the folder <code>AI System/Build Logs/<\/code>.<\/li>\n<li>Create an index note called <code>0 — Build Log Index<\/code>. It has a table with four columns: number, date, title, and a one-line summary.<\/li>\n<\/ol>\n<p><strong>Step 2.<\/strong> Save this template as <code>AI System/Build Logs/_Template<\/code>:<\/p>\n<pre><code class=\"language-markdown\">---\ntype: build-log\nlog: [number]\ncreated: [date]\n---\n\n# Build Log [number]: [title]\n\n## Goal\n## What I Learned\n## What I Built\n## Proven and Not Yet Proven\n## Files Changed and Their Backups\n| File | Backup |\n|---|---|\n## Open and Next\n<\/code><\/pre>\n<p><strong>Step 3.<\/strong> Ask Claude Code to write Build Log 1 for today. It covers everything before the server work, Module 08B, and everything after it. Ask it to add the index row in the same step.<\/p>\n<p><strong>A log is not finished until its index row exists.<\/strong><\/p>\n<ul>\n<li>Some of Annie's logs had no index row for weeks. A log with no row looks the same as a log that was never written (Build Log 79).<\/li>\n<li>Two logs once got the same number, because someone picked the numbers by hand (Build Log 86).<\/li>\n<\/ul>\n<\/div><\/section>\n<section class=\"card\" id=\"short-08-s13\"><h2><span class=\"num\">08.13<\/span> The Run Card<\/h2><p><em>10 minutes.<\/em><\/p>\n<p>One page. Handwriting is fine. Write down:<\/p>\n<ul>\n<li>What this AI assistant is for, in one sentence.<\/li>\n<li>The exact start command (<code>cd<\/code> to the folder, then <code>pi<\/code>), and the key that stops it.<\/li>\n<li>Where its files live.<\/li>\n<li>Your three rules, and how you check each one.<\/li>\n<li>Your three golden questions (Module 07).<\/li>\n<li>What it costs each month: opencode Go, $10 <strong>[COST]<\/strong>.<\/li>\n<li>What to do when it does not answer: check the key, check you are in the right folder, then run the cold test.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-08-s14\"><h2><span class=\"num\">08.14<\/span> Say What You Want, Not Every Step<\/h2><p><em>5 minutes.<\/em><\/p>\n<p>Read the two conversations in &quot;Full Course: After the Server&quot;, under &quot;Say What You Want, Not Every Step&quot;.<\/p>\n<hr />\n<div class=\"shared\"><div class=\"sharedlabel\">The steps it points to, from the Full course section \"Say What You Want, Not Every Step\"<\/div><p><em>5 minutes. From v1, added 9 Oct 2026. Both conversations are from one of Annie's builder sessions on 9 October 2026, running Opus 5.5.<\/em><\/p>\n<p><strong>First conversation: the builder says how it understood you, before it acts.<\/strong><\/p>\n<blockquote>\n<p><strong>Annie:<\/strong> should we do C and then this? I wanted to finish previous open tasks first. and does this check the critical test like we wanted?<\/p>\n<p><strong>Builder:<\/strong> Yes: C now, then the automatic workflow. I'm reading &quot;C&quot; as &quot;keep switching models by hand&quot;. Finishing open work first makes sense, and building the automatic workflow last means it can be tested on real work.<\/p>\n<\/blockquote>\n<p>What this shows:<\/p>\n<ul>\n<li><strong>Short instructions work when you both know what they mean.<\/strong> &quot;C&quot; was an option they had already agreed on. So it needed no explanation.<\/li>\n<li><strong>The builder said how it understood &quot;C&quot; before it acted.<\/strong> If it had misunderstood, the mistake would cost one sentence, not a day of work.<\/li>\n<li><strong>A preference is a real instruction.<\/strong> &quot;I wanted to finish previous open tasks first&quot; changed the order. The builder followed it.<\/li>\n<li><strong>Ask whether it meets the test you agreed on, not whether it is good.<\/strong> &quot;Does this check the critical test like we wanted?&quot; asks for proof against a test they set earlier.<\/li>\n<\/ul>\n<p><strong>Second conversation: when you are the one who is confused.<\/strong><\/p>\n<blockquote>\n<p><strong>Annie:<\/strong> and then go 1. im getting confused on what to run but just know let's finish everything still open from the F B D and E builds and this automated workflow<\/p>\n<p><strong>Builder:<\/strong> I'll take it from here and finish all four in order. I won't ask you to choose critics this time: for Module 1 I'll run all four. Starting with Module 1.<\/p>\n<\/blockquote>\n<p>What this shows:<\/p>\n<ul>\n<li><strong>&quot;I'm getting confused&quot; is a full instruction.<\/strong> It lets the builder make the decision and continue. If you stay quiet and guess, the build moves away from what you wanted.<\/li>\n<li><strong>The builder said which decision it was making, before it made it.<\/strong> It is safe for the builder to make a choice for you when it tells you first. It is not safe when you only find out later.<\/li>\n<\/ul>\n<p><strong>What to take away.<\/strong><\/p>\n<ol>\n<li>You do not need to give step-by-step instructions.<\/li>\n<li>Say what you want, what it must not do, and how you will judge the result.<\/li>\n<li>Ask the builder to say back what it understood.<\/li>\n<li>If it cannot say it in one sentence, your instruction is not clear yet.<\/li>\n<\/ol>\n<p><em>Do not show the two screenshots of these conversations in class yet. They must first be checked against the screenshot rules, because they were not among the 54 approved edited copies.<\/em><\/p>\n<\/div><\/section>\n<section class=\"card\" id=\"short-08-s15\"><h2><span class=\"num\">08.15<\/span> From the Record<\/h2><p><strong>The rules that never loaded.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> For weeks in July 2026, Annie kept teaching her bot procedures. It kept failing to follow them. Nothing showed a problem, because every part of the setup seemed to work. In fact, its rules file had never loaded into the model, in any version of the setup. Two file links fixed it.<\/li>\n<li><strong>The lesson:<\/strong> the cold test is not a formality. It is the only proof that the AI assistant read your files.<\/li>\n<li><strong>Source:<\/strong> Build Log 32.<\/li>\n<\/ul>\n<p><strong>&quot;Tested and working&quot; was not true.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> In July 2026, the receipt automation was reported as tested and working. A separate check on the machine found six bugs. Four of them stopped it from working at all.<\/li>\n<li><strong>The lesson:<\/strong> a report of success is only a claim. Test it yourself.<\/li>\n<li><strong>Source:<\/strong> Build Log 30.<\/li>\n<\/ul>\n<p><strong>The wrong account in the right place.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> In August 2026, Annie's personal start command kept signing her in to her work account. The two accounts were set up separately, as planned. But the personal one held a work sign-in, because her browser was signed in to work when she logged in. The fix: sign out in the browser, log in again, and check which account each folder holds.<\/li>\n<li><strong>The lesson:<\/strong> when a setup looks broken, look at what is inside it before you rebuild it.<\/li>\n<li><strong>Source:<\/strong> Build Log 61.<\/li>\n<\/ul>\n<p><strong>The builder that skipped the paperwork.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> In July 2026, a builder rebuilt Annie's morning message with nobody watching. The new message met every requirement. But the builder skipped three things: the build log, the to-do list update, and one setting. It had backed up that setting but never changed it. The fix: every instruction now ends with the builder reading its checks as a checklist, and marking each one done or not done.<\/li>\n<li><strong>The lesson:<\/strong> a check that depends on goodwill gets skipped. Make it part of the process.<\/li>\n<li><strong>Source:<\/strong> Build Log 27.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-08-s16\"><h2><span class=\"num\">08.16<\/span> Worksheet<\/h2><h3>Short Course<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>pi installed; <code>pi --version<\/code> prints a number<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>opencode Go key entered without showing<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>My AI Assistant/<\/code> holds <code>AGENTS.md<\/code>, <code>My Files/<\/code> and nothing scattered elsewhere<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Cold test passed<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Answer test passed: it answered and named the file<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Refusal test passed: it said it did not know and named the file it would need<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Golden questions passed two times, in new sessions<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>CONTINUITY.md<\/code> exists; my &quot;save&quot; line is in <code>AGENTS.md<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Build Log 1 and its index row exist<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Run card written<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>\n<section class=\"card\" id=\"short-08-s17\"><h2><span class=\"num\">08.17<\/span> Teaching Notes<\/h2><ul>\n<li><strong>Cut the job down when time runs short (v1's clock rule).<\/strong>\n<ul>\n<li>Short course: at the two-hour mark, if the job is not working, make the job smaller until test 1 passes. An AI assistant that answers one question is a success. A half-built one that answers nothing is not.<\/li>\n<li>Full course: if Module 08B runs long, cut the 15 minutes of spare time first.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Never type on a student's keyboard.<\/strong> Sit beside them. Let them use their own device. If a student gets lost, you went too fast (Annie's seminar run sheet).<\/li>\n<li><strong>Entering the key is the riskiest moment for secrets.<\/strong> Watch each student paste the key into the hidden prompt. Make sure nobody pastes it into a chat or a note.<\/li>\n<li><strong>Fix the file, not the chat.<\/strong> Say this out loud two times: once while students write the instruction file, and once during the job (v1).<\/li>\n<li><strong>One job only.<\/strong> If a student starts a second build, they misunderstood the module. Tell them (v1).<\/li>\n<li><strong>Wifi.<\/strong> Every question to the AI goes over the internet. Have a phone hotspot ready (v1).<\/li>\n<li><strong>Never show a student's private files on the projector<\/strong> (v1).<\/li>\n<li><strong>Windows students:<\/strong> the course was built on a Mac. The key-entry line in &quot;Install pi and Connect opencode Go&quot; works only in a Mac's Terminal. It does not work in PowerShell. Facilitator: prepare the Windows version and test it before the course.<\/li>\n<li><strong>Developers may prefer git to dated backups.<\/strong> That is fine, if every change can be undone and the log records it.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-08-s18\"><h2><span class=\"num\">08.18<\/span> Not Yet Tested<\/h2><p>Nobody has run either course's build yet. These steps have never been run as written:<\/p>\n<ul>\n<li><strong>Full course:<\/strong>\n<ul>\n<li>the whole pi-first order (Annie's own test, Merge Tracker, item 6)<\/li>\n<li>the Claude Code steps after a route that pi built<\/li>\n<li>the start-of-session hook<\/li>\n<li>Annie's 10 Oct additions: terminal or desktop app, scrolling, the status line, and the Enter and Control and Enter keys (Merge Tracker, item 7)<\/li>\n<\/ul>\n<\/li>\n<li><strong>Both courses:<\/strong> the hidden key-entry line, asking pi to set its default model, and every Windows command.<\/li>\n<li><strong>Short course:<\/strong> the Gemini backup plan with saved instructions.<\/li>\n<\/ul>\n<\/section>\n<details class=\"card ref\" id=\"short-08-s19\"><summary><span class=\"num\">08.19<\/span> Where the Versions Went <span class=\"hint\">tap to open<\/span><\/summary><p><strong>From v1 Block 8:<\/strong> the five checks before teaching, the one-folder setup, the four fixed rules (Short), the cold test question, the one real job and its run, fix and run again cycle, the answer and refusal tests, the run card, the rule for cutting the job down when time runs short, the section on saying what you want instead of every step, and most facilitator notes.<\/p>\n<p><strong>From the Claude version's Module 10:<\/strong> the builder explanation, the install steps, three settings (now with the status line), <code>CLAUDE.md<\/code>, the cold test command, and choosing your window. Moved out: notifications and two accounts (not needed for the core build).<\/p>\n<p><strong>From the Claude version's Module 11:<\/strong> the three things you do (describe, approve, check), the five habits, the continuity note, the start-of-session hook, the &quot;save&quot; word and the build log. Moved out to the skills module (Module 11) (Pair 11): the build brief rewrite, the second opinion, and the &quot;sure and wrong&quot; list.<\/p>\n<p><strong>Moved in from other pairs:<\/strong> &quot;Same model, different program&quot; (from Pair 4) is in Module 08B, because it needs the bot. The Claude version's Module 01 question 3 is now &quot;The One Tool You Cannot Lose&quot;.<\/p>\n<p><strong>Added by Annie, 10 Oct 2026:<\/strong> terminal or Ghostty instead of the desktop app; scrolling; copy and paste set up by pi; the status line items; Enter steers, Control and Enter queues. Later the same day: the plain-words rewrite of this module; pi described as a way to connect to many models, including the bot's brain.<\/p>\n<p><strong>Errors fixed:<\/strong><\/p>\n<ul>\n<li>v1 had no <code>CLAUDE.md<\/code> step. The Full course now writes one <code>CLAUDE.md<\/code> that both builders read. The Short course uses <code>AGENTS.md<\/code>.<\/li>\n<li>v1's timing did not work: its Route C time came out of the two tests. The Short course has no server route, and the tests keep their 15 minutes.<\/li>\n<li>v1's numbering (1, 2, 2, 3, 4), the Log 38 story told twice, the missing minutes for the section on saying what you want, and the 30 June story with no source (now cited to Seminar Ideas, 30 Jun 2026).<\/li>\n<li>v1 said &quot;no card details&quot; and also &quot;one paid thing&quot;. The module now says plainly: opencode Go is the one paid thing in the Short course.<\/li>\n<li>v1's Route B (Telegram on the laptop) is dropped, because neither version had its steps.<\/li>\n<li>Wording: &quot;the safety net&quot;, &quot;holding the same thread&quot;, &quot;Confusion is data, not failure&quot;, &quot;Usually is not a promise&quot; and &quot;The machine is the ground truth&quot; are rewritten as plain sentences. No prose em dashes.<\/li>\n<li>The Claude version's VPN gap is gone in the Full course. No paid VPN is used, and pi builds the route because pi does not need one.<\/li>\n<li>10 Oct 2026: the paragraph &quot;A Claude plan does not cover pi&quot; was removed at Annie's request. Its source (Build Log 103) is still listed below for the other facts it supports.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"short-08-s20\"><summary><span class=\"num\">08.20<\/span> Sources <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>Build Log 00: version 2 started with one automation.<\/li>\n<li>Build Log 01: copy and paste; stop versus copy.<\/li>\n<li>Build Log 03: the instruction file as a short note that points elsewhere.<\/li>\n<li>Build Log 04: look before you build.<\/li>\n<li>Build Log 08: the founding document in the wrong folder.<\/li>\n<li>Build Log 26: advice is not a fix.<\/li>\n<li>Build Log 27: the skipped paperwork.<\/li>\n<li>Build Log 30: six bugs in &quot;tested and working&quot;.<\/li>\n<li>Build Log 32: the rules file that never loaded.<\/li>\n<li>Build Log 33: three rounds of fixes.<\/li>\n<li>Build Log 38: the calendar overlap check moved into a script.<\/li>\n<li>Build Log 46: the files make it &quot;my Claude&quot;; per-use charges to the wrong account.<\/li>\n<li>Build Log 47: the import line caught by a cold test.<\/li>\n<li>Build Log 52: the start-of-session hook.<\/li>\n<li>Build Log 61: the wrong account in the browser.<\/li>\n<li>Build Log 69: the routing designs that put Tailscale in front of Claude Code.<\/li>\n<li>Build Logs 79 and 86: missing index rows; duplicate numbers.<\/li>\n<li>Build Log 92: undo in about a minute.<\/li>\n<li>Build Log 94: proven and not yet proven.<\/li>\n<li>Build Logs 96 and 104: colons in file names.<\/li>\n<li>Build Log 103: pi on opencode Go from Hong Kong; keys shown on screen.<\/li>\n<li>Build Log 106: two sessions on one job.<\/li>\n<li>pi's own help text and Annie's pi settings, read on her Mac on 10 Oct 2026: <code>OPENCODE_API_KEY<\/code>, <code>-p<\/code>, <code>--no-session<\/code>, <code>AGENTS.md<\/code> and <code>CLAUDE.md<\/code> loading, default provider and model.<\/li>\n<li>opencode Go's model list, read through pi on Annie's Mac on 10 Oct 2026: includes <code>deepseek-v4.1-flash<\/code> and <code>kimi-k3<\/code>.<\/li>\n<li>The bots' settings on the server, read 10 Oct 2026: all three use provider <code>opencode-go<\/code> and model <code>deepseek-v4.1-flash<\/code>.<\/li>\n<li>pi.dev, seen 2 Oct 2026: install commands.<\/li>\n<li>Claude Code documentation, &quot;Run Claude Code programmatically&quot;, seen 2 Oct 2026.<\/li>\n<li>Seminar Ideas, 30 Jun 2026 (&quot;I can't&quot; meant &quot;not from this folder&quot;) and 2 Jul 2026 (the lab notebook).<\/li>\n<li>Seminar Starter Kit, file 03: chat versus builder.<\/li>\n<li>&quot;Why The Harness You Choose Matters&quot; note, 29 Sep 2026.<\/li>\n<li>How to Build Your Own Claudith guide, Part 5: golden questions asked two times.<\/li>\n<li>Annie, 10 Oct 2026: pi-first order; window, scrolling, status line and queue-key additions; plain-words register; pi described as the way to connect to many models.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"short-08-s21\"><summary><span class=\"num\">08.21<\/span> Related <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>07 — Rules of Engagement (Merged)<\/li>\n<li>08B — The Server and Your Bot (Merged)<\/li>\n<li>01 — What Works From Hong Kong (Merged)<\/li>\n<li>01 — Merge Tracker (Decisions, Hours, Checks)<\/li>\n<li>00 — Side-by-Side (9 Oct 2026) (Pair 8)<\/li>\n<\/ul>\n<\/details>", "count": 21}, {"id": "short-09", "label": "09", "title": "Module 09: Script, Machine Learning or AI Judgement", "minutes": 25, "read": 17, "toc": [["short-09-s1", "09.1", "What You Will Leave With"], ["short-09-s2", "09.2", "Before This Module"], ["short-09-s3", "09.3", "One Question for Every Step"], ["short-09-s4", "09.4", "Four Ways a Step Can Be Done"], ["short-09-s5", "09.5", "Mark Your Process Maps"], ["short-09-s6", "09.6", "Homework: Which Judgement Model for Which Job"], ["short-09-s7", "09.7", "From the Record"], ["short-09-s8", "09.8", "Worksheet: Short Course Build Brief (Homework)"], ["short-09-s9", "09.9", "Teaching Notes"]], "body": "<div class=\"intro\"><p><strong>Why this module comes after the build.<\/strong><\/p>\n<ol>\n<li>Students have now used an AI assistant. They have seen it answer, and some have seen it get things wrong.<\/li>\n<li>The second half of this module explains what to do when a model keeps getting a step wrong. That only makes sense after a student has seen a failure.<\/li>\n<li>The first automation is built in Module 11. So students still decide who or what does each step before anything is automated.<\/li>\n<\/ol>\n<\/div>\n<section class=\"card\" id=\"short-09-s1\"><h2><span class=\"num\">09.1<\/span> What You Will Leave With<\/h2><p><strong>Both courses:<\/strong><\/p>\n<ul>\n<li>Your Process Maps from Module 05, with a coloured dot on every step.<\/li>\n<li>Each dot says who or what does that step: a script, a single-task model, a judgement model or a person.<\/li>\n<li>Your best candidate for a first automation, circled on the map.<\/li>\n<\/ul>\n<p><strong>Short course only, as homework:<\/strong><\/p>\n<ul>\n<li><strong>A five-row Build Brief<\/strong> for your circled candidate. It says:\n<ul>\n<li>the goal<\/li>\n<li>what starts it<\/li>\n<li>the steps, with who or what does each one<\/li>\n<li>who checks each step<\/li>\n<li>how you know it worked<\/li>\n<\/ul>\n<\/li>\n<li>In Module 11 pi builds it from this brief, on your laptop.<\/li>\n<li>Bring it to Module 11. Without it, pi has nothing written down to build from.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-09-s2\
