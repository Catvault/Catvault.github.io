<script>window.COURSE={"full": {"overview": "<section class=\"card hero\">\n<h1>Full Course<\/h1>\n<p class=\"sub\">16 hours · with a server<\/p>\n<p>Students build their own AI system on a private server, with a Telegram bot, using two builders: pi first, Claude Code last.<\/p>\n<\/section>\n<section class=\"card\"><h2>Syllabus<\/h2>\n<p class=\"muted\">Each session has its own colour. The tabs at the top use the same colours. The session split is a draft. The session format is still open.<\/p>\n<div class=\"sess s1\"><div class=\"sesshead\"><b>Session 1<\/b><span class=\"min big\">4 hr 5 min<\/span><\/div><ul><li><a href=\"#full-01\" data-go=\"full-01\">01: What Works From Hong Kong<\/a> <span class=\"min\">1 hr 15 min<\/span><\/li><li><a href=\"#full-02\" data-go=\"full-02\">02: Privacy, Security and Whose Law Reaches Your Data<\/a> <span class=\"min\">1 hr 10 min<\/span><\/li><li><a href=\"#full-03\" data-go=\"full-03\">03: Architecture and Where Your System Lives<\/a> <span class=\"min\">1 hr 40 min<\/span><\/li><\/ul><\/div><div class=\"sess s2\"><div class=\"sesshead\"><b>Session 2<\/b><span class=\"min big\">4 hr 15 min<\/span><\/div><ul><li><a href=\"#full-04\" data-go=\"full-04\">04: The Demo<\/a> <span class=\"min\">45 min<\/span><\/li><li><a href=\"#full-05\" data-go=\"full-05\">05: Your Processes on Paper<\/a> <span class=\"min\">1 hr<\/span><\/li><li><a href=\"#full-06\" data-go=\"full-06\">06: Introduce Yourself to the Machine<\/a> <span class=\"min\">45 min<\/span><\/li><li><a href=\"#full-07\" data-go=\"full-07\">07: Rules of Engagement<\/a> <span class=\"min\">45 min<\/span><\/li><li><a href=\"#full-08a\" data-go=\"full-08a\">08A: The Build, Before the Server<\/a> <span class=\"min\">1 hr<\/span><\/li><\/ul><\/div><div class=\"sess s3\"><div class=\"sesshead\"><b>Session 3<\/b><span class=\"min big\">4 hr 15 min<\/span><\/div><ul><li><a href=\"#full-08b\" data-go=\"full-08b\">08B: The Server and Your Bot<\/a> <span class=\"min\">2 hr 35 min<\/span><\/li><li><a href=\"#full-08c\" data-go=\"full-08c\">08C: The Build, After the Server<\/a> <span class=\"min\">1 hr 40 min<\/span><\/li><\/ul><\/div><div class=\"sess s4\"><div class=\"sesshead\"><b>Session 4<\/b><span class=\"min big\">3 hr 40 min<\/span><\/div><ul><li><a href=\"#full-09\" data-go=\"full-09\">09: Script, Machine Learning or AI Judgement<\/a> <span class=\"min\">45 min<\/span><\/li><li><a href=\"#full-10\" data-go=\"full-10\">10: What Breaks, and Keeping It Honest<\/a> <span class=\"min\">50 min<\/span><\/li><li><a href=\"#full-11\" data-go=\"full-11\">11: Growing It, Skills and Schedules<\/a> <span class=\"min\">1 hr 25 min<\/span><\/li><li><a href=\"#full-12\" data-go=\"full-12\">12: The Close, Your 30-Day Plan<\/a> <span class=\"min\">40 min<\/span><\/li><\/ul><\/div>\n<p class=\"total\"><b>Total:<\/b> 16 hr 15 min of 16 hr. That is 15 min over.<\/p>\n<\/section>\n<section class=\"card\"><h2>How to Use This Page<\/h2>\n<ol>\n<li><b>One module per tab.<\/b> Tap a number at the top. Each tab is one module, so you only read one thing at a time.<\/li>\n<li><b>Every section has a number,<\/b> like <span class=\"num\">3.4<\/span>. It means module 3, section 4.<\/li>\n<li><b>To change something,<\/b> tell Claude the course, the number and the change. For example: <i>\"Full, 3.4: make the first list shorter.\"<\/i><\/li>\n<li><b>Your place is saved.<\/b> The page opens on the last tab you read.<\/li>\n<\/ol><\/section>", "tabs": [{"id": "full-01", "label": "01", "title": "Module 01: What Works From Hong Kong", "minutes": 75, "read": 24, "toc": [["full-01-s1", "01.1", "What You Will Leave With"], ["full-01-s2", "01.2", "What You Need to Prepare"], ["full-01-s3", "01.3", "AI Jargon You Need to Know"], ["full-01-s4", "01.4", "Which AI Tools Work From Hong Kong"], ["full-01-s5", "01.5", "Check the AI Provider's Page to See if Hong Kong Is Blocked"], ["full-01-s6", "01.6", "Live Test: Read the Error Code the AI Provider Sends Back"], ["full-01-s7", "01.7", "Control Tests: How to Know What Is Really Blocked"], ["full-01-s8", "01.8", "Every Route to Claude From Hong Kong, and Your Builders"], ["full-01-s9", "01.9", "Phones and the Mac"], ["full-01-s10", "01.10", "Lessons From Real Mistakes"], ["full-01-s11", "01.11", "Exercise"], ["full-01-s12", "01.12", "Worksheet: Your Access Sheet"]], "body": "<section class=\"card\" id=\"full-01-s1\"><h2><span class=\"num\">01.1<\/span> What You Will Leave With<\/h2><p><strong>Your Access Sheet.<\/strong> It is one page. It lists:<\/p>\n<ul>\n<li>every account you have or need<\/li>\n<li>which tools work directly from Hong Kong<\/li>\n<li>your route for each tool that does not work directly<\/li>\n<li>the date you tested each one, because what works can change<\/li>\n<\/ul>\n<p>You use this sheet when you install your builder. You use it again if you build your own server.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-01-s2\"><h2><span class=\"num\">01.2<\/span> What You Need to Prepare<\/h2><ul>\n<li><strong>A laptop you control.<\/strong>\n<ul>\n<li>A personal Mac is the easiest.<\/li>\n<li>A Windows laptop works. The Windows commands are shown where they are different.<\/li>\n<li>A company laptop often blocks installs and network tools. Do not bring one if you can avoid it.<\/li>\n<\/ul>\n<\/li>\n<li><strong>A phone with Telegram installed.<\/strong> You do not use Telegram today. You need it later, when you meet your bot.<\/li>\n<li><strong>A Google account.<\/strong> Gemini works in Hong Kong with no extra steps. So today it is the tool we know works, to compare the others against.<\/li>\n<li><strong>Nothing else.<\/strong> Do not buy a VPN or a server before this session. This module explains what you need.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-01-s3\"><h2><span class=\"num\">01.3<\/span> AI Jargon You Need to Know<\/h2><p>This course builds a personal AI system. It has up to three parts:<\/p>\n<ul>\n<li><strong>The builder<\/strong> is an AI that writes and fixes code for you. You describe what you want in plain English.<\/li>\n<li><strong>The bot<\/strong> is an AI you send messages to on your phone.<\/li>\n<li><strong>The server<\/strong> is a small rented computer in another country. It runs all day.<\/li>\n<\/ul>\n<p>Each part talks to an AI company over the internet. From Hong Kong, some of those companies do not answer.<\/p>\n<p>If you choose your tools before you know which ones answer, you build a system you cannot reach. Annie lost about a week to one of these blocks. This module helps you avoid that.<\/p>\n<p><strong>Three words you will hear all day:<\/strong><\/p>\n<ul>\n<li><strong>VPN.<\/strong> A VPN sends your internet traffic through a computer in another country. The AI company then sees that country, not Hong Kong.<\/li>\n<li><strong>API.<\/strong> An API is how a program talks to an AI company. A person types in a chat window. A program uses an API instead. Your builder and your bot both use one.<\/li>\n<li><strong>Open-weight model.<\/strong> An AI model whose makers publish it, so many companies can run it. DeepSeek, Qwen, GLM and Kimi are open-weight models. They answer from Hong Kong.<\/li>\n<\/ul>\n<p>Module 03 adds three more words: harness, AI provider and AI model.<\/p>\n<p><strong>The block comes from the AI companies, not from Hong Kong.<\/strong><\/p>\n<ul>\n<li>Many people think the Hong Kong government blocks these tools. It does not.<\/li>\n<li>Hong Kong's internet is open. You can reach any website.<\/li>\n<li>The AI companies choose not to serve Hong Kong. Their own pages give no reason.<\/li>\n<li>So the check happens at the company, every time you send a request.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-01-s4\"><h2><span class=\"num\">01.4<\/span> Which AI Tools Work From Hong Kong<\/h2><p>This table was checked on 2 October 2026. The Anthropic, OpenAI and opencode rows were checked again on 9 October 2026.<\/p>\n<p><strong>What works can change, so the date matters.<\/strong> In March 2026 the Gemini row changed from blocked to open. Annie's own notes stayed wrong until someone checked. Check this table again in the week before you teach it.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Company or tool<\/th>\n<th>From a Hong Kong connection<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Google Gemini (consumer app)<\/td>\n<td>Works directly<\/td>\n<td>Web from 16 March 2026, mobile from 27 March 2026 (Hong Kong Free Press, 16 Mar 2026). The paid Pro tier works too. A seminar room in Hong Kong paid for it on 6 October 2026.<\/td>\n<\/tr>\n<tr>\n<td>Google AI Studio, Antigravity and other Google developer tools<\/td>\n<td>Blocked<\/td>\n<td>Consumer Gemini is open. The developer tools are not.<\/td>\n<\/tr>\n<tr>\n<td>Anthropic: claude.ai, the Claude apps, Claude Code and the API<\/td>\n<td>Blocked<\/td>\n<td>Hong Kong is not on Anthropic's list of supported countries (checked 9 Oct 2026). The phone apps are blocked too. Tested on Android with the VPN off on 27 Aug 2026.<\/td>\n<\/tr>\n<tr>\n<td>OpenAI: ChatGPT and the API<\/td>\n<td>Blocked<\/td>\n<td>Hong Kong is not on OpenAI's list of supported countries (checked 9 Oct 2026). OpenAI refuses Hong Kong phone numbers at sign-up (PTS Consulting, seen 2 Oct 2026).<\/td>\n<\/tr>\n<tr>\n<td>DeepSeek, Kimi (Moonshot), GLM (Zhipu), Qwen (Alibaba)<\/td>\n<td>Work directly<\/td>\n<td>Open-weight models. You can reach them directly, or through a company that resells them.<\/td>\n<\/tr>\n<tr>\n<td>opencode Go (a monthly AI provider plan)<\/td>\n<td>Works directly<\/td>\n<td>It answered from Hong Kong on 30 Sep 2026 and again on 9 Oct 2026. Annie's three bots use it. Its model list also has one Claude model. The routes to Claude are explained later in this module.<\/td>\n<\/tr>\n<tr>\n<td>OpenRouter (a company that resells many models)<\/td>\n<td>Works for open-weight models only<\/td>\n<td>Annie tested her OpenRouter key. Every Anthropic, OpenAI and Google model returned a 403 error, &quot;provider Terms of Service&quot;, even for a plain hello. The open-weight models answered on the same key.<\/td>\n<\/tr>\n<tr>\n<td>Mistral, Grok, Perplexity, Microsoft Copilot<\/td>\n<td>Reported to work directly<\/td>\n<td>Not tested for this course. Facilitator: test these before teaching, or remove the row.<\/td>\n<\/tr>\n<tr>\n<td>Telegram, Tailscale, Obsidian<\/td>\n<td>Work directly<\/td>\n<td>The messaging app, the private network and the notes app. None of them is an AI company.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>There are three kinds of block. A fix for one does not fix the others.<\/strong><\/p>\n<ol>\n<li><strong>Your connection.<\/strong> The company sees a Hong Kong address and refuses. A VPN or your own server fixes this one.<\/li>\n<li><strong>Your sign-up details.<\/strong> OpenAI refuses Hong Kong phone numbers. A VPN does not change your phone number.<\/li>\n<li><strong>Your billing address.<\/strong> In May 2026, Anthropic's developer website did not accept a Hong Kong billing address. A VPN changed nothing, because the check was on the card, not the connection. Annie's system stopped using that service on 25 September 2026. So you may never need it. It is still worth knowing, because it cost her a week.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"full-01-s5\"><h2><span class=\"num\">01.5<\/span> Check the AI Provider's Page to See if Hong Kong Is Blocked<\/h2><p><em>Full course.<\/em><\/p>\n<p><strong>Check these pages from a real browser, such as Chrome or Safari. Do not use the terminal.<\/strong> Some company pages first run a check to stop bots. A real browser passes that check. A command typed in the terminal can fail it, and then you see an error instead of the page.<\/p>\n<p>You can check a block without a terminal. Open the company's list of supported countries and search it.<\/p>\n<ol>\n<li>Open Anthropic's page: <code>https://www.anthropic.com/supported-countries<\/code>. Search it for &quot;Hong Kong&quot;. It is not there.<\/li>\n<li>Search the same page for &quot;Singapore&quot;. It is there.<\/li>\n<li>Do the same on OpenAI's page: <code>https://developers.openai.com/api/docs/supported-countries<\/code>.<\/li>\n<\/ol>\n<p><strong>Why searching for Singapore matters.<\/strong><\/p>\n<ul>\n<li>If a page does not load, your search finds nothing.<\/li>\n<li>If a page loads but has no Hong Kong, your search also finds nothing.<\/li>\n<li>These two look the same. Finding Singapore proves the page loaded. So the missing Hong Kong is real.<\/li>\n<\/ul>\n<p>This kind of check is called a <strong>control<\/strong>. A control is a check where you already know the answer. You run it next to the check you are unsure of.<\/p>\n<p>On 9 October 2026, both pages listed Singapore, Japan and Taiwan. Neither listed Hong Kong or Macau.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-01-s6\"><h2><span class=\"num\">01.6<\/span> Live Test: Read the Error Code the AI Provider Sends Back<\/h2><p>You do not need to guess whether a tool is blocked. Ask the company's server, and read the number it sends back. Every web request gets a number back, called a status code. Five codes matter here.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Code<\/th>\n<th>What it means for you<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>403<\/td>\n<td>Forbidden. The company refused you. From Hong Kong this is usually the regional block.<\/td>\n<\/tr>\n<tr>\n<td>401<\/td>\n<td>Unauthorised. The company answered and asked for a key. Access works.<\/td>\n<\/tr>\n<tr>\n<td>405<\/td>\n<td>Wrong method. The company answered, but expected a different kind of request. Access works.<\/td>\n<\/tr>\n<tr>\n<td>404<\/td>\n<td>Not found. The company answered, but not at that address. Check that you copied the whole command.<\/td>\n<\/tr>\n<tr>\n<td>No answer (a timeout)<\/td>\n<td>A network problem, not the company's decision. Check your Wi-Fi or VPN.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Step 1. Open a terminal.<\/strong><\/p>\n<ul>\n<li>On a Mac: press Command and Space, type Terminal, and press Return.<\/li>\n<li>On Windows: open the Start menu, type PowerShell, and press Return.<\/li>\n<\/ul>\n<p><strong>Step 2. Test Anthropic.<\/strong> Paste this line and press Return. It asks Anthropic's API for a page, and prints only the status code.<\/p>\n<p>On a Mac:<\/p>\n<pre><code class=\"language-bash\">curl -s -o /dev/null -w &quot;%{http_code}\\n&quot; https://api.anthropic.com/v1/messages\n<\/code><\/pre>\n<p>On Windows (PowerShell):<\/p>\n<pre><code class=\"language-powershell\">curl.exe -s -o NUL -w &quot;%{http_code}&quot; https://api.anthropic.com/v1/messages\n<\/code><\/pre>\n<p><strong>What you should see:<\/strong> a three-digit number on the next line.<\/p>\n<ul>\n<li>From a Hong Kong connection with no VPN: 403.<\/li>\n<li>With a VPN on: 405 or 401. Both mean the company answered.<\/li>\n<\/ul>\n<p>Write your code on your sheet.<\/p>\n<p><strong>Step 3. Test opencode, an AI provider for open models.<\/strong> This line is different from the Anthropic line. It ends in <code>-X POST<\/code>, because opencode only answers that kind of request at this address.<\/p>\n<p>On a Mac:<\/p>\n<pre><code class=\"language-bash\">curl -s -o /dev/null -w &quot;%{http_code}\\n&quot; -X POST https://opencode.ai/zen/go/v1/chat/completions\n<\/code><\/pre>\n<p>On Windows (PowerShell):<\/p>\n<pre><code class=\"language-powershell\">curl.exe -s -o NUL -w &quot;%{http_code}&quot; -X POST https://opencode.ai/zen/go/v1/chat/completions\n<\/code><\/pre>\n<p><strong>What you should see:<\/strong> 401. The company answered and wants a key. If you see 404, you left out <code>-X POST<\/code>.<\/p>\n<p><strong>If it fails:<\/strong><\/p>\n<ul>\n<li>If you see &quot;command not found&quot;, you are probably in the wrong program. Close it. Open Terminal or PowerShell again.<\/li>\n<li>If nothing prints for 30 seconds, press Control and C. Then check your Wi-Fi.<\/li>\n<\/ul>\n<h3>Your Terminal Window for the Rest of the Course<\/h3>\n<p><em>You make these settings in the build module (Module 08), once a builder is installed.<\/em><\/p>\n<p>This is the first time you open a terminal. Your builders run in a terminal for the rest of the course. So choose your window now.<\/p>\n<p><strong>Your choices:<\/strong><\/p>\n<ul>\n<li>the plain Terminal app that came with your Mac<\/li>\n<li>Ghostty, a free terminal app (ghostty.org)<\/li>\n<li>the Claude desktop app's Code tab<\/li>\n<\/ul>\n<p>All three run the same builder. Facilitator: Ghostty is for Mac. Confirm the Windows choice on the day.<\/p>\n<p><strong>Annie's advice: use a terminal (Terminal or Ghostty), not the desktop app.<\/strong> Her reason is that it uses fewer tokens. This is what she noticed from daily use. It is not a measurement.<\/p>\n<p><strong>Four things to know now. The build module (Module 08) sets them up.<\/strong><\/p>\n<ol>\n<li>\n<p><strong>Scrolling back can stop working while Claude Code runs in a terminal.<\/strong><\/p>\n<ul>\n<li>Why: Claude Code's &quot;fullscreen&quot; display keeps old messages inside Claude Code, not in the terminal's own history. With the mouse turned off, the scroll wheel cannot reach them.<\/li>\n<li>The fix is one setting: <code>&quot;tui&quot;: &quot;default&quot;<\/code> in Claude Code's settings file. This switches to the classic display. Every message then stays in the terminal's history. The scroll wheel and normal text selection work.<\/li>\n<li>Annie made this change herself (Claude Code settings documentation, &quot;tui&quot;).<\/li>\n<li>In the fullscreen display, Page Up and Page Down still scroll. Control and O opens the full conversation.<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>Copy and paste does not work at first in Claude Code,<\/strong> because Claude Code takes control of the mouse. In the Full course, pi changes this setting for you, because pi is installed first. Claude Code can also change it itself.<\/p>\n<\/li>\n<li>\n<p><strong>You can choose what shows at the bottom of the window.<\/strong> This line is called the status line. It can show:<\/p>\n<ul>\n<li>how much of the conversation space is used<\/li>\n<li>money spent<\/li>\n<li>the model name and effort level<\/li>\n<li>the folder the builder opened in<\/li>\n<li>the mode, for example auto or planning<\/li>\n<\/ul>\n<p>The status line belongs to the builder, not to the window. So pi and Claude Code show different items. You set up each one separately.<\/p>\n<\/li>\n<li>\n<p><strong>The keys that control a builder while it works:<\/strong><\/p>\n<\/li>\n<\/ol>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Key<\/th>\n<th>What it does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Escape<\/td>\n<td>Stops the builder in the middle of a job. Annie used the tools for weeks before she knew this<\/td>\n<\/tr>\n<tr>\n<td>Enter<\/td>\n<td>Sends your message. While the builder works, Enter does not stop the job. But it does not wait for the job to end either. Both builders read your message as soon as the current step finishes, inside the same job. So it can change what the builder does next. This is true in Claude Code and in pi<\/td>\n<\/tr>\n<tr>\n<td>Control and Enter<\/td>\n<td>Claude Code only. Sends your waiting messages at once. If Claude is only writing its answer, this interrupts it. Work that runs in the background keeps running<\/td>\n<\/tr>\n<tr>\n<td>Control and X, then Enter<\/td>\n<td>Claude Code's built-in key to queue a message for after the job. The message waits its turn and never interrupts the job. Annie moved this to Option and Enter on her Mac. The build module (Module 08) shows how<\/td>\n<\/tr>\n<tr>\n<td>Option and Enter (Mac), Control and Q (Windows)<\/td>\n<td>pi's default key to queue a message for after the job. Nothing needs setting up. pi holds the message until the whole job is finished. On Windows it is Control and Q, because Windows Terminal already uses Alt and Enter for full screen. Option and Up arrow (Alt and Q on Windows) brings waiting messages back so you can edit them<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><em>Where this table comes from:<\/em><\/p>\n<ul>\n<li><em>Claude Code's documentation says a message sent with Enter reaches Claude &quot;as soon as those tool calls finish, within the same turn&quot; (Claude Code docs, &quot;When Claude Code sends what you queued&quot;).<\/em><\/li>\n<li><em>pi's documentation says the same: Enter &quot;guides the next response&quot;, and Alt and Enter &quot;waits until Pi finishes the current task&quot; (pi docs, usage, &quot;Follow Pi's work&quot;).<\/em><\/li>\n<li><em>Annie proved the Claude Code behaviour herself. A question she typed in the middle of a job was answered inside that same job.<\/em><\/li>\n<li><em>The Windows keys come from pi's keybindings page. Nobody has tested them on a Windows machine.<\/em><\/li>\n<\/ul>\n<p><strong>Why Enter counts as steering, even when the builder answers your first question first.<\/strong> This confused Annie at first. Here it is in plain steps.<\/p>\n<ol>\n<li><strong>One reply is many small steps.<\/strong> When you ask the builder something, it does not answer in one go. It might search a file, then check a setting, then write the answer. That is three steps inside one reply.<\/li>\n<li><strong>A message sent with Enter arrives between steps.<\/strong> If you press Enter while the builder is busy, it reads your message as soon as the current step finishes. That is before the job is done.<\/li>\n<li><strong>Then the builder decides what to do with it.<\/strong> Annie once typed &quot;what's 4 + 4?&quot; in the middle of a job. It had nothing to do with the job. So the builder carried on and answered both questions at the end. From the outside, that looked like a queue.<\/li>\n<li><strong>It counts as steering, because it could have changed the rest of the job.<\/strong> Suppose Annie had typed &quot;stop, don't touch the settings files&quot; instead. The builder would have read it before its next step, and skipped that work. Her message changed nothing only because 4 + 4 was unrelated.<\/li>\n<li><strong>The queue key is different.<\/strong> With Option and Enter, the builder does not see your message until the whole reply is finished. A &quot;don't touch the settings files&quot; sent that way would arrive too late, after the files were already changed.<\/li>\n<\/ol>\n<p><strong>In short:<\/strong><\/p>\n<ul>\n<li>Enter means &quot;read this at your next step, and change course if it matters&quot;.<\/li>\n<li>Option and Enter means &quot;don't show me this until you're finished&quot;.<\/li>\n<\/ul>\n<p><strong>When to use which:<\/strong><\/p>\n<ul>\n<li>Use Enter to correct the builder in the middle of a job.<\/li>\n<li>Use Option and Enter for a new, unrelated task that should not pull the builder away from the current one.<\/li>\n<\/ul>\n<p><strong>You can change any of these keys, and add your own.<\/strong> You can move most keys in a builder to a key you prefer. Annie does not know every shortcut, and nobody needs to. To find them:<\/p>\n<ul>\n<li>search the web for the builder's name and &quot;keyboard shortcuts&quot;, for example &quot;Claude Code keyboard shortcuts&quot;, or<\/li>\n<li>ask your builder to list its shortcuts and change one for you.<\/li>\n<\/ul>\n<p><strong>What these tests returned when Annie ran them:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Test<\/th>\n<th>Where the request came from<\/th>\n<th>Code<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Anthropic<\/td>\n<td>Hong Kong<\/td>\n<td>403<\/td>\n<\/tr>\n<tr>\n<td>Anthropic<\/td>\n<td>Taiwan and Singapore<\/td>\n<td>405<\/td>\n<\/tr>\n<tr>\n<td>opencode<\/td>\n<td>Hong Kong<\/td>\n<td>401<\/td>\n<\/tr>\n<tr>\n<td>opencode<\/td>\n<td>Taiwan and Singapore<\/td>\n<td>401<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The Hong Kong result for Anthropic took three tries. The first two tries quietly came from other countries. The next section shows how to check where your test really came from.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-01-s7\"><h2><span class=\"num\">01.7<\/span> Control Tests: How to Know What Is Really Blocked<\/h2><p><em>Full course.<\/em><\/p>\n<p>&quot;It is broken&quot; and &quot;I am refused&quot; are different. Only one of them tells you what to do next. A control test tells them apart.<\/p>\n<ul>\n<li>Run the thing you are unsure of.<\/li>\n<li>At the same moment, from the same machine, run a thing you know works.<\/li>\n<li>Compare the two results.<\/li>\n<\/ul>\n<p><strong>A real example.<\/strong> A note in Annie's system said Gemini could not be used from her server. She asked whether that was true. This is how it was proved:<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Test, from the server, same key, same moment<\/th>\n<th>Result<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Google Gemini 2.5 Flash, through the reseller<\/td>\n<td>403<\/td>\n<\/tr>\n<tr>\n<td>Google Gemini 2.5 Pro, through the reseller<\/td>\n<td>403<\/td>\n<\/tr>\n<tr>\n<td>Qwen3 Coder, through the reseller<\/td>\n<td>200 (it worked)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The third line is the control.<\/p>\n<ul>\n<li>The key worked for Qwen. So the key was fine, and Google was refusing.<\/li>\n<li>The error said &quot;violation of provider Terms Of Service&quot;.<\/li>\n<li>The usual explanation is that Google refuses Gemini requests from data-centre addresses. But that is a guess. The error does not say it.<\/li>\n<li>So the note was rewritten to say only what the server returned.<\/li>\n<\/ul>\n<p><strong>Three traps Annie found in her own testing.<\/strong><\/p>\n<ol>\n<li><strong>Do not test the website with this command.<\/strong>\n<ul>\n<li>A test of claude.ai returned 403, even from the Singapore server, where Claude is supported.<\/li>\n<li>The page was a check for bots. A real browser passes it. A terminal command cannot.<\/li>\n<li>The API address gives an honest answer.<\/li>\n<\/ul>\n<\/li>\n<li><strong>A working tool from the same company tells you where not to look.<\/strong>\n<ul>\n<li>Once, Annie could not open Claude Code on her server from her phone. She thought the VPN was the cause.<\/li>\n<li>At the same moment, on the same phone, through the same route, her phone chat with Claude worked. So the network was fine.<\/li>\n<li>The real cause was an expired login on the server.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Check where your test really came from.<\/strong> When Annie tested from Hong Kong for this module, two of her three tries came from the wrong country.\n<ul>\n<li>The first run came from a laptop whose connection went out through Taiwan. Anthropic serves Taiwan, so it returned 405.<\/li>\n<li>The second run used a service that sends web requests from a chosen country. Asked for Hong Kong, it switched to another address without saying so. Its report showed New York time. It also returned 405.<\/li>\n<li>The third run used a setting that had already passed a location check: a page that reports your country had said &quot;HK&quot;. Its report showed Hong Kong time. It returned 403, as this module expects.<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<p><strong>Why a test from the wrong country misleads you.<\/strong><\/p>\n<ol>\n<li>The first two tries returned 405. The code 405 means &quot;access works&quot;.<\/li>\n<li>That code was true. But it was true only for the place the request really came from: Taiwan the first time, and somewhere on New York time the second time.<\/li>\n<li>So those two tries said nothing about Hong Kong. They looked like proof that Claude works from Hong Kong. They were not.<\/li>\n<li>Before you trust a code, check which country your request came from. On the same laptop and the same connection, search the web for &quot;what is my IP location&quot;. Check that it says Hong Kong.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"full-01-s8\"><h2><span class=\"num\">01.8<\/span> Every Route to Claude From Hong Kong, and Your Builders<\/h2><p><em>Full course.<\/em><\/p>\n<p>You need a builder for this course. A builder is the AI that installs software, edits files and fixes problems while you describe what you want.<\/p>\n<p><strong>Annie uses two builders.<\/strong><\/p>\n<ul>\n<li><strong>Claude Code (harness)<\/strong> uses Claude (AI model) from Anthropic (AI provider).<\/li>\n<li><strong>pi (harness)<\/strong> uses open models such as DeepSeek (AI model) from opencode Go (AI provider).<\/li>\n<li>Annie tested Claude Code beside an open-model builder for three full days. She found Claude Code much easier for a non-developer building something new. It works out what you meant from an unclear description.<\/li>\n<\/ul>\n<p>Claude Code does not answer from Hong Kong. These are the four routes Annie has used or tested to reach Claude.<\/p>\n<p><strong>A paid VPN. Not used in the Full course.<\/strong><\/p>\n<ul>\n<li>You pay a VPN company and turn it on. Then Claude works on that device. <strong>[COST]<\/strong><\/li>\n<li>Annie used a paid VPN for a long time. Later she added extra security to her setup: her server now accepts connections only through a private VPN.<\/li>\n<\/ul>\n<p><strong>Your own server as your route out. This is the Full course route.<\/strong><\/p>\n<ul>\n<li>Your server is in Singapore. It can carry your laptop's and phone's internet traffic. Then Claude sees Singapore, not Hong Kong.<\/li>\n<li>This replaced Annie's paid VPN. One connection now does two jobs: it reaches Claude, and it joins her private network.<\/li>\n<li>You build this in the server module (Module 08B).<\/li>\n<\/ul>\n<p><strong>Claude Code on the server itself.<\/strong><\/p>\n<ul>\n<li>Claude Code can run on the server. You reach it from your laptop or phone.<\/li>\n<li>The server is in Singapore, so Claude answers it directly.<\/li>\n<li>The first time you sign in to each Claude account, your laptop's internet traffic must go out through your server. This is because Claude's sign-in page is blocked in Hong Kong.<\/li>\n<li>After that one sign-in, switch your laptop back to its normal Hong Kong connection. Claude Code on the server keeps working.<\/li>\n<\/ul>\n<p><strong>A Claude model through opencode. Being checked.<\/strong><\/p>\n<ul>\n<li>opencode Go's model list has one Claude model: Claude Haiku 5.5, the smallest one.<\/li>\n<li>It answered through Annie's opencode Go plan from a Taiwan connection.<\/li>\n<li>It has not been tested from Hong Kong yet. That is the test that matters.<\/li>\n<li>This route gives you a Claude model inside pi. It does not give you Claude Code.<\/li>\n<li>Facilitator: run this check again before teaching. Then update this paragraph with the result.<\/li>\n<\/ul>\n<p><strong>Haiku is the only Claude model on the opencode Go plan.<\/strong> When Annie tried them, Opus 5.5, Opus 4.8 and Sonnet 5.5 each returned &quot;Model is unavailable&quot; on the Go plan. On opencode, the larger Claude models are pay-per-use only. They are sold through a separate service, Zen, where you pay for each use instead of a monthly fee. <strong>[COST]<\/strong><\/p>\n<p><strong>The builder that needs no route: pi (harness) with opencode Go (AI provider).<\/strong><\/p>\n<ul>\n<li>pi is a way to connect to many AI models, such as DeepSeek and Kimi K3. These open models are good, and they cost much less than the big Western models. <strong>[COST]<\/strong><\/li>\n<li>Connected to opencode Go, pi answers from Hong Kong directly, with no VPN and no server.<\/li>\n<li>pi understands unclear instructions less well than Claude Code.<\/li>\n<li>Two developers Annie works with prefer this kind of model for complex work. They know how to give it exact instructions.<\/li>\n<li>Module 03 explains why your Claude subscription cannot be used inside pi.<\/li>\n<\/ul>\n<p><strong>What the Full course uses.<\/strong><\/p>\n<ol>\n<li><strong>pi first.<\/strong> You install pi in the build module (Module 08). It works from Hong Kong with nothing else turned on.<\/li>\n<li><strong>pi builds your server,<\/strong> and your server becomes your route out to Claude. The Full course uses no paid VPN.<\/li>\n<li><strong>Claude Code last.<\/strong> You install it after the server work, through your own route.<\/li>\n<li><strong>Why this order:<\/strong> pi needs no route, so it keeps you working when the route breaks. Annie's Mac now runs on its real Hong Kong connection for this reason. Claude Code was no longer her only builder.<\/li>\n<\/ol>\n<p><strong>Whether a workaround breaks a company's terms is yours to decide.<\/strong><\/p>\n<ul>\n<li>A VPN or a server in another country is a workaround. It is not an official route.<\/li>\n<li>Anthropic's terms may not allow use from a region it does not serve.<\/li>\n<li>Each person is responsible for staying within local law and each company's terms.<\/li>\n<li>Answer questions about this with facts. Let each student decide.<\/li>\n<\/ul>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Claude Code (harness)<\/th>\n<th>pi (harness) with opencode Go (AI provider)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Works from a Hong Kong connection<\/td>\n<td>No. Needs your own server, or a VPN<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>Monthly cost<\/td>\n<td><strong>[COST]<\/strong><\/td>\n<td><strong>[COST]<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Strength<\/td>\n<td>Understands unclear, plain-English requests<\/td>\n<td>Cheap and fast. Good inside a system that already exists<\/td>\n<\/tr>\n<tr>\n<td>Weakness<\/td>\n<td>Needs a route, and may break Anthropic's terms<\/td>\n<td>Needs clearer instructions from you<\/td>\n<\/tr>\n<tr>\n<td>Used in the Full course for<\/td>\n<td>Building, after the server work<\/td>\n<td>Your first builder. It builds your server<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>opencode Go is also the AI provider for your bot. Module 03 explains this.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-01-s9\"><h2><span class=\"num\">01.9<\/span> Phones and the Mac<\/h2><p><em>Full course, and the Short course's optional server sitting.<\/em><\/p>\n<p>You use your phone to talk to your bot and to open your private pages. Phones and laptops differ in one way that matters here: can you choose which apps use the route out?<\/p>\n<p><strong>Android can choose app by app.<\/strong><\/p>\n<ul>\n<li>In the Tailscale app, use <strong>exclude mode<\/strong>.<\/li>\n<li>Tick only the apps that should stay on your Hong Kong connection, such as Chrome and your banking apps. Everything else uses the route out.<\/li>\n<li>Do not use include mode. It looks safer, but it breaks. Android's address lookup is not an app you can tick. So website names stop working, and the phone can log itself out of Tailscale.<\/li>\n<\/ul>\n<p><strong>An iPhone routes everything or nothing.<\/strong> There is no app-by-app choice on an iPhone.<\/p>\n<p><strong>The Mac also routes everything or nothing.<\/strong><\/p>\n<ul>\n<li>Annie uses one command that switches her Mac between two states: everything through her server, or her real Hong Kong connection.<\/li>\n<li>The same command prints the address the Mac is using. So she checks the state instead of guessing it.<\/li>\n<\/ul>\n<p><strong>Trust a test, not a status label.<\/strong><\/p>\n<ul>\n<li>During the Android setup, the Tailscale app showed &quot;Logged out&quot;, but traffic was still going through it.<\/li>\n<li>Claude misread the label. It wrongly decided that the Claude app worked without a VPN.<\/li>\n<li>Annie caught the mistake. A test across the private network proved the connection was up the whole time.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-01-s10\"><h2><span class=\"num\">01.10<\/span> Lessons From Real Mistakes<\/h2><p>Each line below is one lesson from a real mistake in Annie's own system. The full story behind each one is on the FAQ tab, the last tab at the top of the page.<\/p>\n<ul>\n<li>Before you believe a test that disproves what you already know, check that the test was clean.<\/li>\n<li>A model on a price list may still refuse you. Send it a short hello first, from the machine and the key that will use it.<\/li>\n<li>Write the date next to every fact about what works. Check it again before you rely on it.<\/li>\n<li>Your connection, your sign-up details and your billing address are three separate checks. A VPN fixes only your connection.<\/li>\n<li>Before you trust a location test, check which country the request came from.<\/li>\n<li><em>Full course only:<\/em> do not put a fragile setting between you and the tool you depend on most.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-01-s11\"><h2><span class=\"num\">01.11<\/span> Exercise<\/h2><p>Run the live test for Anthropic and for opencode. Then answer three questions in writing.<\/p>\n<ol>\n<li>Which status code did Anthropic return? Which code did opencode return? What does each code mean?<\/li>\n<li>Which builder will you use? What is your route to Claude, if you want one? Give your reason in one sentence.<\/li>\n<li>Which AI tools have you been reaching through another route, such as a VPN or a work network? Did you know you were doing that?<\/li>\n<\/ol>\n<p>Most people find at least one tool for question 3.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-01-s12\"><h2><span class=\"num\">01.12<\/span> Worksheet: Your Access Sheet<\/h2><p>Copy this table into a new note called <code>Access Sheet<\/code> in your notes app. You move it into your notes folder later in the course.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Tool<\/th>\n<th>What I use it for<\/th>\n<th>Works from Hong Kong directly? (Y / N / test code)<\/th>\n<th>My route<\/th>\n<th>Account created?<\/th>\n<th>Tested on (date)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Gemini (consumer)<\/td>\n<td><\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My builder (pi, and Claude Code in the Full course)<\/td>\n<td>Building and fixing<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Claude, if I want it<\/td>\n<td><\/td>\n<td><\/td>\n<td>VPN, my server, or opencode<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>opencode Go (AI provider)<\/td>\n<td>The models for my bot and for pi<\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Telegram<\/td>\n<td>Talking to my bot<\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Obsidian<\/td>\n<td>My notes, in one place<\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Tailscale (Full course, or the server sitting)<\/td>\n<td>Private network and route out<\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Server company (Full course, or the server sitting)<\/td>\n<td>Computer that is always on<\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Other:<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>My open question for the facilitator:<\/strong><\/p>\n<\/section>", "count": 12, "sess": [1]}, {"id": "full-02", "label": "02", "title": "Module 02: Privacy, Security and Whose Law Reaches Your Data", "minutes": 70, "read": 18, "toc": [["full-02-s1", "02.1", "What You Will Leave With"], ["full-02-s2", "02.2", "What You Need to Prepare"], ["full-02-s3", "02.3", "Why This Comes Before Any Connection"], ["full-02-s4", "02.4", "Whose Law Can Reach Your Data"], ["full-02-s5", "02.5", "Six Ways to Run an AI Tool, From App to Offline Machine"], ["full-02-s6", "02.6", "Your One-Line Rule and the Four Habits That Enforce It"], ["full-02-s7", "02.7", "When the Model You Rent Changes"], ["full-02-s8", "02.8", "Hong Kong Law in Five Minutes"], ["full-02-s9", "02.9", "When the Data Is Your Clients'"], ["full-02-s10", "02.10", "Build Your Data Map"], ["full-02-s11", "02.11", "Lessons From Real Mistakes"], ["full-02-s12", "02.12", "Exercise"], ["full-02-s13", "02.13", "Worksheet: Your Data Map"]], "body": "<section class=\"card\" id=\"full-02-s1\"><h2><span class=\"num\">02.1<\/span> What You Will Leave With<\/h2><p><strong>Your Data Map.<\/strong> It sorts your information into three tiers: open, personal and never.<\/p>\n<ul>\n<li>For each tier, it names the companies you allow.<\/li>\n<li>For each tier, it names the places the data may be stored.<\/li>\n<li>It ends with a short list of things that never go into any AI tool.<\/li>\n<li>It also has a protection checklist for your accounts.<\/li>\n<\/ul>\n<p>Two later modules use the map:<\/p>\n<ul>\n<li>The rules module (Module 07) turns the map into rules your bot must follow.<\/li>\n<li>The builder module (Module 08) copies your list of things that never go into any AI tool into your builder's instructions.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-02-s2\"><h2><span class=\"num\">02.2<\/span> What You Need to Prepare<\/h2><ul>\n<li><strong>Module 01 finished.<\/strong> You need your Access Sheet. It lists the tools you are about to sort.<\/li>\n<li><strong>A list of your accounts.<\/strong> Email, calendar, cloud storage, password manager, and any AI tools you already use.<\/li>\n<li><strong>Your phone.<\/strong> You will check two-factor sign-in on it.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-02-s3\"><h2><span class=\"num\">02.3<\/span> Why This Comes Before Any Connection<\/h2><p>Every tool you connect in this course gets a permission. A permission given in a hurry is hard to take back.<\/p>\n<p>Here is what happened to Annie:<\/p>\n<ol>\n<li>Annie asked Google to give her bot less access to her email.<\/li>\n<li>Google kept the old, wider permission anyway.<\/li>\n<li>The reason: a smaller request does not cancel a larger one you granted before.<\/li>\n<li>She had to remove the app's access completely and start again.<\/li>\n<\/ol>\n<p>So the order matters:<\/p>\n<ol>\n<li>First, decide what data goes where. This module gives you those decisions.<\/li>\n<li>Then, connect only the tools that fit those decisions. The build modules (Module 08 and Module 08B) make those connections.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"full-02-s4\"><h2><span class=\"num\">02.4<\/span> Whose Law Can Reach Your Data<\/h2><p>People use three words as if they mean the same thing. They do not.<\/p>\n<ul>\n<li><strong>Where the data sits.<\/strong> This is the country the computer holding it is in. Lawyers call this residency.<\/li>\n<li><strong>Whose law can reach it.<\/strong> This is which government can order someone to hand the data over. It depends mostly on where the company is based. It does not depend only on where the computer is. In meetings you will hear this called <strong>sovereignty<\/strong>.<\/li>\n<li><strong>Who can read it.<\/strong> This depends on the company's settings, its contract with you, and the people who run it. This is confidentiality.<\/li>\n<\/ul>\n<p><strong>Where the data sits does not decide whose law reaches it.<\/strong><\/p>\n<ul>\n<li>A US company storing your data in Singapore still has to answer US legal orders.<\/li>\n<li>The law behind this is the US CLOUD Act (2018, 18 U.S.C. section 2713).<\/li>\n<li>It lets US authorities require a US company to hand over data in its control. This applies wherever the data is stored.<\/li>\n<\/ul>\n<p>Annie described her own system honestly:<\/p>\n<ul>\n<li>Her data sits on machines she controls. That is ownership.<\/li>\n<li>Her backups and models still pass through companies under foreign law. So it is not full sovereignty.<\/li>\n<\/ul>\n<p><strong>Renting a server is choosing a country.<\/strong> You pick a data centre when you sign up. Most people never notice they chose.<\/p>\n<ul>\n<li>Annie's server sits in Singapore.<\/li>\n<li>She rents it from a company based in Germany.<\/li>\n<li>So two countries are involved: the one where the data sits, and the one where the company is based.<\/li>\n<\/ul>\n<p><strong>The server company's country and the data centre's country can both reach everything on the server. Each AI company's country can reach only what you send it.<\/strong><\/p>\n<p>Here is how that works for Annie's own data. Each country reaches a different slice. (Checked 10 Oct 2026.)<\/p>\n<ol>\n<li><strong>The United States, through Claude and other US companies.<\/strong>\n<ul>\n<li>US law reaches what Annie sends to Claude, such as her chats and the files Claude reads.<\/li>\n<li>It does not reach her whole server.<\/li>\n<li>Claude is not her only US company. opencode, which runs her bots, is in San Francisco. Google holds her email, her calendar and her password-locked backups on Google Drive.<\/li>\n<li>So US law reaches more of her data than Claude alone.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Singapore, because the server sits there.<\/strong>\n<ul>\n<li>Singapore law reaches everything on the server.<\/li>\n<li>The reason: the whole disk is physically in Singapore.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Germany, because Hetzner is a German company.<\/strong>\n<ul>\n<li>The company is Hetzner Online GmbH, in Gunzenhausen, Germany.<\/li>\n<li>German law also reaches everything on the server, because Hetzner controls the machine.<\/li>\n<li>Hetzner's terms say encryption is the customer's job, not Hetzner's.<\/li>\n<\/ul>\n<\/li>\n<li><strong>The British Virgin Islands and Dubai, through Telegram.<\/strong>\n<ul>\n<li>Annie's chats with her bot pass through Telegram's companies in those two places.<\/li>\n<li>Bot chats are not end-to-end encrypted.<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<p><strong>In short:<\/strong> Singapore and Germany can reach the whole server. The United States can reach whatever passes through its companies, and for Annie that is a lot. This is what Annie meant by &quot;ownership, not full sovereignty&quot;. She owns the machine. Several countries can still reach parts of it.<\/p>\n<p><strong>The companies this course uses or mentions.<\/strong> Policies change. Check each company before you rely on what is written here.<\/p>\n<p><strong>Anthropic (Claude), OpenAI, Google, Microsoft<\/strong><\/p>\n<ul>\n<li>Based in: the United States.<\/li>\n<li>What it means for you: US law can reach your data, wherever it is stored.<\/li>\n<\/ul>\n<p><strong>opencode Go (AI provider: the model subscription your bot uses)<\/strong><\/p>\n<ul>\n<li>Based in: the United States. The company is Anomaly, in San Francisco.<\/li>\n<li>US law reaches opencode.<\/li>\n<li>For the AI model DeepSeek V4.1 Flash on the Go plan, opencode states two things:\n<ul>\n<li>The data is not used for training.<\/li>\n<li>The data is kept for 0 days.<\/li>\n<\/ul>\n<\/li>\n<li>That rests on an agreement with DeepSeek. opencode renews it monthly. It is currently valid to 31 Oct 2026.<\/li>\n<li>The Go page does not say which country runs the model.<\/li>\n<li>opencode's separate pay-per-use service (Zen) says its models run in the US and the EU.<\/li>\n<li>Source: opencode Go and Zen pages, and privacy policy, read 9 Oct 2026.<\/li>\n<\/ul>\n<p><strong>DeepSeek (its own app and API)<\/strong><\/p>\n<ul>\n<li>Based in: mainland China.<\/li>\n<li>Its privacy policy says it collects, processes and stores personal data in the People's Republic of China.<\/li>\n<li>It uses data to train its models.<\/li>\n<li>You have the right to opt out.<\/li>\n<li>Source: DeepSeek privacy policy, read 9 Oct 2026.<\/li>\n<\/ul>\n<p><strong>Qwen (Alibaba), Kimi (Moonshot), GLM (Zhipu), each through its own app<\/strong><\/p>\n<ul>\n<li>Based in: mainland China.<\/li>\n<li>The same question applies to each company's own app. Read each policy.<\/li>\n<\/ul>\n<p><strong>A Chinese-made model reached through another company<\/strong><\/p>\n<ul>\n<li>Based in: wherever that other company is based.<\/li>\n<li>You are bound by the host's policy, not the model maker's.<\/li>\n<li>opencode above is the example: a US company serving models made in China.<\/li>\n<\/ul>\n<p><strong>Mistral<\/strong><\/p>\n<ul>\n<li>Based in: France (European Union).<\/li>\n<li>EU data protection law (GDPR) applies.<\/li>\n<\/ul>\n<p><strong>Telegram<\/strong><\/p>\n<ul>\n<li>Based in: Telegram Group Inc. is in the British Virgin Islands. Telegram FZ-LLC is in Dubai.<\/li>\n<li>Chats with a bot are cloud chats. They are not end-to-end encrypted.<\/li>\n<li>Only Telegram's secret chats are end-to-end encrypted. Bots cannot use secret chats.<\/li>\n<li>Whoever runs the bot receives every message you send it.<\/li>\n<li>Source: Telegram privacy policy, sections 3.3 and 6, read 9 Oct 2026.<\/li>\n<\/ul>\n<p><strong>Your rented server (Full course, or the optional server sitting)<\/strong><\/p>\n<ul>\n<li>Based in: the server company's country, plus the data centre you pick.<\/li>\n<li>Pick the data centre on purpose.<\/li>\n<\/ul>\n<p><strong>Hong Kong's own privacy law also applies to you.<\/strong> It is the Personal Data (Privacy) Ordinance (PDPO).<\/p>\n<ul>\n<li>It covers personal data you put into any tool.<\/li>\n<li>That includes data about other people.<\/li>\n<li>Your family's and your friends' details belong to them as well as to you.<\/li>\n<\/ul>\n<p><strong>Training on your data is a setting, not a fact.<\/strong><\/p>\n<ul>\n<li>Since August 2025, people on Claude's Free, Pro and Max plans choose whether their chats and coding sessions train future models.<\/li>\n<li>If you allow it, Anthropic keeps the data for up to 5 years.<\/li>\n<li>If you do not allow it, Anthropic keeps it for 30 days.<\/li>\n<li>Source: Anthropic, &quot;Updates to Consumer Terms and Privacy Policy&quot;, Aug 2025.<\/li>\n<\/ul>\n<p>Check this setting today on every AI account you hold.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-02-s5\"><h2><span class=\"num\">02.5<\/span> Six Ways to Run an AI Tool, From App to Offline Machine<\/h2><p><em>Full course.<\/em><\/p>\n<p>Most people think there are two choices: use the app, or run your own model. In fact there are six levels. Each level up gives you more control. Each level up also gives you more work.<\/p>\n<ol>\n<li><strong>A consumer app<\/strong> (free or paid personal plan).\n<ul>\n<li>Fine for: low-stakes personal use.<\/li>\n<li>Your data may train the model unless you turn that off.<\/li>\n<\/ul>\n<\/li>\n<li><strong>A business or team plan.<\/strong>\n<ul>\n<li>Fine for: work use.<\/li>\n<li>It has admin controls. It usually does not train on your data by default.<\/li>\n<\/ul>\n<\/li>\n<li><strong>The API under business terms, or through a cloud platform you already trust.<\/strong>\n<ul>\n<li>Fine for: confidential work.<\/li>\n<li>Contracts can forbid training. Contracts can also set where data is processed.<\/li>\n<\/ul>\n<\/li>\n<li><strong>A private deployment for your organisation.<\/strong>\n<ul>\n<li>Fine for: regulated work at scale.<\/li>\n<\/ul>\n<\/li>\n<li><strong>An open-weight model file run on your own hardware.<\/strong>\n<ul>\n<li>Fine for: data that must not leave your control.<\/li>\n<li>You now own the updates and the security.<\/li>\n<\/ul>\n<\/li>\n<li><strong>The same, on a machine with no internet connection.<\/strong>\n<ul>\n<li>Fine for: the most sensitive data.<\/li>\n<li>It is hard to keep up to date.<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<p><strong>Using an app and running a model file are different things.<\/strong><\/p>\n<ul>\n<li>The DeepSeek app sends your data to servers in mainland China.<\/li>\n<li>Several governments banned the app on official devices for that reason.<\/li>\n<li>Those bans do not cover the model file itself.<\/li>\n<li>Running the model file on your own machine sends nothing to China.<\/li>\n<\/ul>\n<p>Your bot in this course uses a hosted model through a subscription. That is level 1 to 3, not level 5. So the company list above applies to you.<\/p>\n<p><strong>Pick a level for each kind of data, not one level for everything.<\/strong> Personal notes and family admin can sit at a lower level than anything more sensitive. Write that choice on your Data Map.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-02-s6\"><h2><span class=\"num\">02.6<\/span> Your One-Line Rule and the Four Habits That Enforce It<\/h2><p>Annie wrote one rule early on. She tested every later connection against it:<\/p>\n<blockquote>\n<p><strong>Read freely. Write to my own notes freely. Anything that goes to another person needs my yes, every time.<\/strong><\/p>\n<\/blockquote>\n<p><strong>Why this one rule matters.<\/strong> In June 2025 the writer Simon Willison named the most dangerous combination in AI tools. It is an AI assistant that does all three of these:<\/p>\n<ol>\n<li>It holds your private data.<\/li>\n<li>It reads content from strangers, such as incoming email.<\/li>\n<li>It has a way to send data out.<\/li>\n<\/ol>\n<p>Take away the way out. Then an instruction hidden in a stranger's email cannot send your data anywhere.<\/p>\n<p>Four habits make the rule real.<\/p>\n<p><strong>Habit 1: Put the limit in the permission, not in the instructions.<\/strong><\/p>\n<ul>\n<li>A sentence such as &quot;never send email&quot; is a request. The model can misread it.<\/li>\n<li>Annie's email tool has read-only access at Google's end.<\/li>\n<li>Its script also has no command that sends.<\/li>\n<li>So Google refuses a send even if something tries one.<\/li>\n<li>That is two separate protections. Neither depends on the model behaving.<\/li>\n<\/ul>\n<p><strong>Habit 2: Give each tool the smallest access that does the job.<\/strong><\/p>\n<ul>\n<li>Say a bot needs one calendar.<\/li>\n<li>Give it a small script that can only read that one calendar.<\/li>\n<li>Do not give it your whole account plus a sentence asking it to stay in one corner.<\/li>\n<li>Annie built exactly this for a family member's tutor bot.<\/li>\n<\/ul>\n<p><strong>Habit 3: Revoke at the source before you delete anything.<\/strong><\/p>\n<ul>\n<li>Deleting a file that holds a login does not cancel the login.<\/li>\n<li>The login still works from any backup copy.<\/li>\n<li>Once, an old Google login on Annie's server still had wide calendar access. Her bot used it once, even though its rules said never to.<\/li>\n<li>The fix had three steps, in this order:\n<ol>\n<li>Cancel the login at Google.<\/li>\n<li>Check that Google refused it.<\/li>\n<li>Only then delete the files.<\/li>\n<\/ol>\n<\/li>\n<li>The same applies inside chat apps. Disconnecting a tool inside a chat app does not cancel its permission at the company that granted it. The permission stays live until you remove it there too.<\/li>\n<\/ul>\n<p><strong>Habit 4: Label every paste before you paste it.<\/strong><\/p>\n<ul>\n<li>Before your builder asks you to paste anything, it should say which kind it is:\n<ul>\n<li>safe to paste,<\/li>\n<li>remove the secret first, or<\/li>\n<li>never paste.<\/li>\n<\/ul>\n<\/li>\n<li>Never paste passwords, API keys, tokens or private keys into any chat.<\/li>\n<li>You will put this rule into your builder's instructions in the builder module (Module 08).<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-02-s7\"><h2><span class=\"num\">02.7<\/span> When the Model You Rent Changes<\/h2><p><em>Full course.<\/em><\/p>\n<p>You do not own the model. You rent it, and the company can change it. There are four ways this can hurt you (checked 6 Jul 2026).<\/p>\n<ol>\n<li><strong>It is taken away.<\/strong>\n<ul>\n<li>OpenAI removed GPT-4o from ChatGPT on 7 August 2025. That was the day GPT-5 launched.<\/li>\n<li>After complaints, GPT-4o came back for paid users a few days later (OpenAI release notes; Ars Technica, Aug 2025).<\/li>\n<li>Users had no warning before it was removed.<\/li>\n<li>Notice periods for API models range from 60 days to 6 months. Consumer apps owe no notice at all.<\/li>\n<\/ul>\n<\/li>\n<li><strong>It changes without a new name.<\/strong>\n<ul>\n<li>Anthropic's own September 2025 report described three server bugs.<\/li>\n<li>They lowered answer quality for about a month.<\/li>\n<li>The model itself was unchanged.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Your data sits in someone else's systems.<\/strong>\n<ul>\n<li>In the New York Times case against OpenAI, a court ordered a sample of 20 million conversations to be handed over.<\/li>\n<\/ul>\n<\/li>\n<li><strong>The price, the terms or the countries served change.<\/strong>\n<ul>\n<li>Module 01 showed how much the countries matter from Hong Kong.<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<p><strong>Keep everything except the model in your own files.<\/strong><\/p>\n<ul>\n<li>Your rules, your memory, your instructions and your notes live in plain files in your notes folder.<\/li>\n<li>Then a model change is a small edit.<\/li>\n<\/ul>\n<p>Here is Annie's example:<\/p>\n<ol>\n<li>Annie once moved two of her bots onto the model her main bot already used.<\/li>\n<li>The change was a short edit to each bot's settings file.<\/li>\n<li>It still broke both bots, until each bot was given its own key.<\/li>\n<li>The reason: each bot reads only its own settings file.<\/li>\n<li>A restart looked healthy. Every real message still failed.<\/li>\n<\/ol>\n<p>So a model change is small, and it still needs a real test message for each piece.<\/p>\n<p>Keep a short list of real questions with known good answers. Then you can test any replacement quickly. The rules module (Module 07) builds that list.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-02-s8\"><h2><span class=\"num\">02.8<\/span> Hong Kong Law in Five Minutes<\/h2><p><em>Full course.<\/em><\/p>\n<p><strong>The PDPO applies to personal data you put into any tool.<\/strong> That includes data about other people.<\/p>\n<p><strong>Section 33 is not in force.<\/strong><\/p>\n<ul>\n<li>It would restrict sending personal data outside Hong Kong.<\/li>\n<li>It has been in the law since the PDPO took effect in 1996.<\/li>\n<li>It has never been switched on.<\/li>\n<li>Law firms now say it may never come into force (Baker McKenzie; Tanner De Witt, seen 9 Oct 2026).<\/li>\n<li>That is a reason to build good habits now. It is not a reason to relax.<\/li>\n<li>The Privacy Commissioner (PCPD) still publishes guidance on sending data abroad.<\/li>\n<\/ul>\n<p><strong>Agentic AI guidance, 25 August 2026.<\/strong><\/p>\n<ul>\n<li>The PCPD published &quot;Protecting Personal Data Privacy in the Use of Agentic AI&quot;.<\/li>\n<li>It adds to the PCPD's June 2024 AI framework.<\/li>\n<li>It is written for organisations and individuals.<\/li>\n<li>It is guidance, not a binding rulebook (PCPD; Dentons Hong Kong, 1 Sep 2026; Bird &amp; Bird, 27 Aug 2026).<\/li>\n<li>Its first recommendation: do not collect more personal data than the agent needs.<\/li>\n<li>That is the same idea as this module's Habit 2: give each tool the smallest access that does the job.<\/li>\n<\/ul>\n<p>Facilitator: bring the current PCPD guidance to the session (pcpd.org.hk, under Artificial Intelligence).<\/p>\n<\/section>\n<section class=\"card\" id=\"full-02-s9\"><h2><span class=\"num\">02.9<\/span> When the Data Is Your Clients'<\/h2><p><em>Full course. For awareness, not for doing it alone.<\/em><\/p>\n<p>You will build systems for other people. This section shows what to think about when the data belongs to a client.<\/p>\n<ul>\n<li>It is not enough to handle client data on your own.<\/li>\n<li>For anything regulated, the client's own compliance team or a lawyer decides.<\/li>\n<\/ul>\n<p><strong>Step 1: Sort the data first.<\/strong> The kind of data decides the route. The route does not decide the kind of data.<\/p>\n<p>Can each kind go to an AI company abroad?<\/p>\n<ul>\n<li><strong>Public.<\/strong> Example: marketing copy, published research. Answer: yes.<\/li>\n<li><strong>Business-internal.<\/strong> Example: drafts, plans, internal notes. Answer: usually, on a business plan with training switched off.<\/li>\n<li><strong>Personal.<\/strong> Example: names, health, finances of real people. Answer: only with real thought, and the smallest amount needed.<\/li>\n<li><strong>Client-confidential.<\/strong> Example: anything under a non-disclosure agreement. Answer: not without the client's written agreement.<\/li>\n<li><strong>Regulated.<\/strong> Example: bank, medical, legal or government data. Answer: never by default. The client decides, in writing, before the first message.<\/li>\n<\/ul>\n<p><strong>Step 2: Follow the chain.<\/strong> Client data does not go from you to &quot;the AI&quot;. It goes through a chain:<\/p>\n<pre><code>You → your network → (a VPN or your own server) → (a reseller) → the AI company → its servers\n<\/code><\/pre>\n<ul>\n<li>Every link can keep a copy.<\/li>\n<li>Each link sits under some country's law.<\/li>\n<li>The least careful company in the chain sets the risk for all of it.<\/li>\n<li>A reseller's privacy policy does not cover what the AI company behind it keeps.<\/li>\n<\/ul>\n<p><strong>Step 3: Business terms are a different deal from personal ones.<\/strong><\/p>\n<ul>\n<li>Personal apps may train on your data unless you switch it off.<\/li>\n<li>Business plans and APIs usually do not train on your data by default.<\/li>\n<li>OpenAI, Anthropic and Google each offer zero data retention on business terms. That means your messages are not stored after the answer comes back (each company's own page, checked 29 Sep 2026).<\/li>\n<li>opencode lists the training and retention terms for each model on its Go page.<\/li>\n<\/ul>\n<p><strong>Step 4: Know the other countries' laws by name.<\/strong><\/p>\n<ul>\n<li>If a client's customers are in the European Union, the GDPR applies.<\/li>\n<li>If the AI company is in mainland China, China's Personal Information Protection Law (PIPL) applies.<\/li>\n<\/ul>\n<p><strong>Step 5: The one-sentence test.<\/strong> Before any client data goes into your system, you should be able to finish this sentence:<\/p>\n<blockquote>\n<p>&quot;Your data goes to [country]. [Company] controls it. It is not used for training. It is deleted after [number] days. This is the route it takes.&quot;<\/p>\n<\/blockquote>\n<p>If you cannot fill in every blank, you are not ready to put that client's data in.<\/p>\n<p><strong>Three honest points to say out loud.<\/strong><\/p>\n<ol>\n<li><strong>Free tiers are not private tiers.<\/strong> Personal terms often allow training on what you type. Business use needs business terms.<\/li>\n<li><strong>An open-weight model does not mean private use.<\/strong> A published model tells you nothing about the company running it. Only running it on your own hardware makes it private. That costs hardware and upkeep.<\/li>\n<li><strong>A reseller adds a company to the chain.<\/strong> It is convenient. It is also one more company that can keep a copy.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"full-02-s10\"><h2><span class=\"num\">02.10<\/span> Build Your Data Map<\/h2><ol>\n<li>Fill in the worksheet below.<\/li>\n<li>Then fill in the protection checklist.<\/li>\n<li><em>Full course:<\/em> rotate the maps afterwards. Find one gap in another student's map.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"full-02-s11\"><h2><span class=\"num\">02.11<\/span> Lessons From Real Mistakes<\/h2><p>Each line below is one lesson from a real mistake in Annie's own system. The full story behind each one is on the FAQ tab, the last tab at the top of the page.<\/p>\n<ul>\n<li>When the exact control you want does not exist, choose the stricter control you can prove.<\/li>\n<li>Taking access back is a deliberate act at the company. It is not a smaller request.<\/li>\n<li>Count every copy of a secret before you claim it is safe.<\/li>\n<li>Check where your phone has already put private material before you worry about the bot.<\/li>\n<li>When you inspect settings, print the names of keys, never their values.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-02-s12\"><h2><span class=\"num\">02.12<\/span> Exercise<\/h2><p>Take three real things you want your system to handle. For example: your family calendar, your expense receipts, and your meeting notes.<\/p>\n<p>For each one, answer on paper:<\/p>\n<ol>\n<li>Which tier is it in: open, personal, or never?<\/li>\n<li>Which company will process it? Which country's law reaches that company?<\/li>\n<li>If that company changed its terms tomorrow, which of your files would you need to keep?<\/li>\n<li><em>Full course:<\/em> which of the six levels, from consumer app to offline machine, is acceptable for it?<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"full-02-s13\"><h2><span class=\"num\">02.13<\/span> Worksheet: Your Data Map<\/h2><p><strong>My one-line rule:<\/strong> ____________________________________________<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Tier<\/th>\n<th>What belongs here<\/th>\n<th>My examples<\/th>\n<th>Companies I allow<\/th>\n<th>Where it may be stored<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Open<\/td>\n<td>Public information, research, drafts I would publish anyway<\/td>\n<td><\/td>\n<td>Any company on my Access Sheet<\/td>\n<td>Anywhere<\/td>\n<\/tr>\n<tr>\n<td>2. Personal<\/td>\n<td>My notes, plans, calendar, family admin<\/td>\n<td><\/td>\n<td>Only companies I chose on purpose, with training switched off<\/td>\n<td>My laptop and my notes. My own server, if I have one<\/td>\n<\/tr>\n<tr>\n<td>3. Never<\/td>\n<td>Passwords, keys, ID numbers, bank and card numbers, other people's confidential business<\/td>\n<td><\/td>\n<td>None. These never go into any AI tool or bot chat<\/td>\n<td>A password manager only<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Client or employer information:<\/strong> keep it out of your personal bot, unless your organisation has approved a tool for it. Write your organisation's rule here: ____________<\/p>\n<p><strong>Protection checklist<\/strong> (tick each one before the builder module (Module 08)):<\/p>\n<ul>\n<li class=\"task\"><span class=\"box\"><\/span>Disk encryption is on for my laptop (FileVault on Mac, BitLocker or Device Encryption on Windows).<\/li>\n<li class=\"task\"><span class=\"box\"><\/span>I use a password manager, and no password lives in my notes.<\/li>\n<li class=\"task\"><span class=\"box\"><\/span>Two-factor sign-in is on for my email, Telegram, every AI account, and my server company if I have one.<\/li>\n<li class=\"task\"><span class=\"box\"><\/span>I have checked the &quot;use my data for training&quot; setting on every AI account.<\/li>\n<li class=\"task\"><span class=\"box\"><\/span>I know which of my accounts are work accounts and which are personal.<\/li>\n<\/ul>\n<\/section>", "count": 13, "sess": [1]}, {"id": "full-03", "label": "03", "title": "Module 03: Architecture and Where Your System Lives", "minutes": 100, "read": 28, "toc": [["full-03-s1", "03.1", "What You Will Leave With"], ["full-03-s2", "03.2", "What You Need to Prepare"], ["full-03-s3", "03.3", "Where Is the One Real Copy?"], ["full-03-s4", "03.4", "Five Questions About How You Work"], ["full-03-s5", "03.5", "The Parts of the System"], ["full-03-s6", "03.6", "The Vault, and One Job Each for Calendar, Vault and Inbox"], ["full-03-s7", "03.7", "Two Kinds of Instruction File, and One Bot or Several"], ["full-03-s8", "03.8", "Build Your Vault"], ["full-03-s9", "03.9", "Three Questions and the Decision Tree"], ["full-03-s10", "03.10", "Three Machines Compared: Laptop, Mac Mini or Rented Server"], ["full-03-s11", "03.11", "Telegram as the Front Door"], ["full-03-s12", "03.12", "Order Your Server"], ["full-03-s13", "03.13", "Your Shape Decision, and What Your System Does at 11pm on a Bad Day"], ["full-03-s14", "03.14", "Lessons From Real Mistakes"], ["full-03-s15", "03.15", "Exercise"], ["full-03-s16", "03.16", "Worksheet: System Sketch and Shape Decision"]], "body": "<div class=\"intro\"><p>The module has two halves:<\/p>\n<ol>\n<li><strong>&quot;A System That Fits How You Think&quot;.<\/strong> This half fits the system to the person and builds the notes vault.<\/li>\n<li><strong>&quot;Where Your System Lives&quot;.<\/strong> This half decides which machine the system runs on.<\/li>\n<\/ol>\n<p>You can teach the second half in the next session. In the Full course, teach it at least a day before the server module (Module 08B). The reason: the server company's identity check can take time.<\/p>\n<p>Prices are marked <strong>[COST]<\/strong>. They go in last.<\/p>\n<\/div>\n<section class=\"card\" id=\"full-03-s1\"><h2><span class=\"num\">03.1<\/span> What You Will Leave With<\/h2><ul>\n<li><strong>Your worksheet answers.<\/strong> Six lines about how you find, capture, plan and share.<\/li>\n<li><strong>A working vault.<\/strong> This is an Obsidian folder on your laptop and your phone. It holds your folders, an inbox, a map note (one line per folder saying what lives there), your Access Sheet and your Data Map.<\/li>\n<li><strong>Your Shape Decision.<\/strong> It says which machine runs your system. Telegram is ready on your phone. In the Full course, it also records the server you ordered.<\/li>\n<li><strong>Homework:<\/strong> a one-page System Sketch: your system drawn as boxes and arrows.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-03-s2\"><h2><span class=\"num\">03.2<\/span> What You Need to Prepare<\/h2><ul>\n<li><strong>Modules 01 and 02 finished.<\/strong> Bring the Access Sheet and the Data Map.<\/li>\n<li><strong>Admin rights on your laptop.<\/strong> You will install one app.<\/li>\n<li><strong>Your phone, with Telegram installed.<\/strong><\/li>\n<li><strong>Full course only: a payment card and an ID document,<\/strong> for the server company. Its identity check can take time. That is why you order in this module.<\/li>\n<\/ul>\n<\/section>\n<div class=\"partbar\">A System That Fits How You Think<\/div>\n<section class=\"card\" id=\"full-03-s3\"><h2><span class=\"num\">03.3<\/span> Where Is the One Real Copy?<\/h2><p>Count the places your notes and instructions live today. Most people find four to six. For example:<\/p>\n<ul>\n<li>a notes app<\/li>\n<li>email drafts<\/li>\n<li>a to-do app<\/li>\n<li>documents in Downloads<\/li>\n<li>a chat with an AI that remembers some things<\/li>\n<li>a paper notebook<\/li>\n<\/ul>\n<p>Annie's own system had this problem twice:<\/p>\n<ol>\n<li><strong>Her notes about the bot.<\/strong> They lived in three places: a folder on her Mac, Obsidian, and the bot's server.<\/li>\n<li><strong>Her builder's memory.<\/strong> Her builder had four separate memories: two accounts on the Mac, one on the server, and an old project folder. They had drifted apart. The version on her phone felt like a stranger, because it read a different copy of her.<\/li>\n<\/ol>\n<p><strong>Two copies of one file slowly become different from each other. Then you cannot trust either one.<\/strong> That is the reason for this module. The fix is one real copy that every device and every tool reads.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-03-s4\"><h2><span class=\"num\">03.4<\/span> Five Questions About How You Work<\/h2><p><strong>There is no correct design. There is only the one that fits the person using it.<\/strong><\/p>\n<ul>\n<li>Most AI advice hands everyone the same tools and the same folders.<\/li>\n<li>When it does not stick, people blame their own discipline.<\/li>\n<li>The real cause is usually that the system was built for someone else's habits.<\/li>\n<li>A system that is awkward to use gets abandoned within a few weeks.<\/li>\n<\/ul>\n<p>These five questions change the design.<\/p>\n<p><strong>1. How do you find things again?<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>If you remember...<\/th>\n<th>Then your system should...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><em>Where<\/em> you saw something<\/td>\n<td>Be organised by place: folders, projects, people<\/td>\n<\/tr>\n<tr>\n<td><em>When<\/em> you saw it<\/td>\n<td>Be organised by time: dated notes and logs<\/td>\n<\/tr>\n<tr>\n<td><em>What it was about<\/em><\/td>\n<td>Be searchable, with notes that link to each other<\/td>\n<\/tr>\n<tr>\n<td>Nothing reliably<\/td>\n<td>Capture things for you automatically, with no filing decision<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The last row matters most for people with busy heads. If saving a thought costs a filing decision, the thought gets lost.<\/p>\n<p><strong>2. How do you capture?<\/strong><\/p>\n<ul>\n<li>Typing, voice, photos, or forwarding things on.<\/li>\n<li>Whatever you actually use is the front door.<\/li>\n<li>A system with a front door you avoid will not be used.<\/li>\n<\/ul>\n<p><strong>3. When are you at your best?<\/strong><\/p>\n<ul>\n<li>Some people plan in the morning and act at night. Others do the reverse.<\/li>\n<li>Your automations should arrive before the moment they are useful.<\/li>\n<li>A 7am summary helps someone who plans early. For someone who plans late, it is a message they will mute.<\/li>\n<\/ul>\n<p><strong>4. What do you dread doing?<\/strong><\/p>\n<ul>\n<li>For example: chasing invoices, filing receipts, copying between systems, writing the same email.<\/li>\n<li>The best first automation is the one you dread, not the cleverest one.<\/li>\n<li>The dread is what keeps you maintaining it.<\/li>\n<\/ul>\n<p><strong>5. Who else has to work with you?<\/strong><\/p>\n<ul>\n<li>If nobody else touches your system, build it for one person.<\/li>\n<li>Once a spouse, an assistant or a colleague needs access, you must be able to separate your private notes from shared ones.<\/li>\n<li>Annie has bots sealed to one person and one purpose, such as a tutor for her son. Those bots must not see the rest of her life.<\/li>\n<\/ul>\n<h3>Worksheet: How I Work<\/h3>\n<p>Answer in one line each. Do not overthink.<\/p>\n<ol>\n<li>When you need something you saved six months ago, what do you search for: the <strong>place<\/strong>, the <strong>date<\/strong>, or the <strong>topic<\/strong>?<\/li>\n<li>How do you capture a thought at 2am: type it, say it, or lose it?<\/li>\n<li>Which single task do you dread most, and when does it come up?<\/li>\n<li>When do you plan, and when do you act?<\/li>\n<li>Who else will ever need to see your notes, and who must never?<\/li>\n<li>What have you tried before and abandoned, and why? This is the most useful answer on the page.<\/li>\n<\/ol>\n<h3>Annie's Answers, as a Worked Example<\/h3>\n<p>This is not a template to copy. It shows one person's habits turned into design choices.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>How Annie works<\/th>\n<th>What she built<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Thinks in linked ideas, not folders<\/td>\n<td>One vault where notes link to each other<\/td>\n<\/tr>\n<tr>\n<td>Loses anything that needs a filing decision<\/td>\n<td>One inbox, sorted every night by a scheduled job<\/td>\n<\/tr>\n<tr>\n<td>Works across two accounts and several devices<\/td>\n<td>A continuity note, so the next session picks up where the last one stopped<\/td>\n<\/tr>\n<tr>\n<td>Uses her laptop, her phone and different times of day<\/td>\n<td>Several ways in, all reading one set of notes<\/td>\n<\/tr>\n<tr>\n<td>Dreads admin above everything else<\/td>\n<td>Admin handed over first: briefs, filing, reminders, chasing<\/td>\n<\/tr>\n<tr>\n<td>Family time is fixed<\/td>\n<td>Bots sealed to family jobs, and a system that protects that time<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Six Ways a Personal System Fails<\/h3>\n<ol>\n<li><strong>Copying someone else's system whole.<\/strong> It was built for how they think.<\/li>\n<li><strong>Building the clever thing before the needed thing.<\/strong> The clever thing gets abandoned. The needed thing gets maintained.<\/li>\n<li><strong>Keeping two places to look.<\/strong> One of them is always out of date.<\/li>\n<li><strong>Designing for a tidier version of yourself.<\/strong> Build for the person who actually shows up.<\/li>\n<li><strong>Making capture cost a decision.<\/strong> If saving something needs a choice, it does not get saved.<\/li>\n<li><strong>Building for the demo instead of a normal day.<\/strong> Ask whether it still helps on an ordinary, tired weekday.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"full-03-s5\"><h2><span class=\"num\">03.5<\/span> The Parts of the System<\/h2><p><strong>Each part has one job.<\/strong> When one part tries to do another part's job, things go wrong in ways that are hard to see.<\/p>\n<p>Annie's summary:<\/p>\n<ul>\n<li>The bots act.<\/li>\n<li>The watchdog only reports.<\/li>\n<li>A separate script restarts stuck bots.<\/li>\n<li>Claude Code builds.<\/li>\n<\/ul>\n<p><strong>The builder and the bot are different.<\/strong> People mix them up.<\/p>\n<ul>\n<li><strong>The bot<\/strong> is the AI assistant you message from your phone. It has a personality, a small set of skills, and low running costs.<\/li>\n<li><strong>The builder<\/strong> is the tool you use at your desk to build or fix something real. It can read every file and change the system itself.<\/li>\n<li>You build the builder first. Then you use it to build the bot.<\/li>\n<\/ul>\n<h3>Full Course: Six Parts, With a Server<\/h3>\n<pre><code class=\"language-mermaid\">flowchart LR\n  You((You)) -- &quot;messages on your phone&quot; --&gt; Bot\n  You -- &quot;plain-English requests&quot; --&gt; Builder\n  subgraph Server[&quot;Your rented server (always on)&quot;]\n    Bot[&quot;The bot&quot;]\n    Jobs[&quot;Scheduled jobs&quot;]\n    Watchdog[&quot;The watchdog&quot;]\n    VaultCopy[(&quot;Copy of your vault&quot;)]\n  end\n  Builder[&quot;The builder (Claude Code, and pi)&quot;] -- &quot;installs, edits, repairs&quot; --&gt; Server\n  Vault[(&quot;Your vault on laptop and phone&quot;)] &lt;-- &quot;Obsidian Sync&quot; --&gt; VaultCopy\n  Bot -- &quot;asks for an answer&quot; --&gt; Model[&quot;A rented AI model&quot;]\n  Watchdog -- &quot;only when something is wrong&quot; --&gt; You\n<\/code><\/pre>\n<p><strong>The six parts, with Annie's version of each.<\/strong><\/p>\n<p><strong>1. The builder<\/strong><\/p>\n<ul>\n<li>What it does: writes, installs and repairs everything while you describe what you want.<\/li>\n<li>Annie's version: Claude Code on her Mac and her server, with pi as a second builder.<\/li>\n<\/ul>\n<p><strong>2. The bot<\/strong><\/p>\n<ul>\n<li>What it does: it is the AI assistant you message from your phone, all day.<\/li>\n<li>Annie's version: Claudith, a Telegram bot.<\/li>\n<\/ul>\n<p><strong>3. The server<\/strong><\/p>\n<ul>\n<li>What it does: it is a small rented computer that never sleeps.<\/li>\n<li>Annie's version: a server in Singapore with 2 processors and about 3.7 GB of usable memory (3,809 MB).<\/li>\n<\/ul>\n<p><strong>4. The vault<\/strong><\/p>\n<ul>\n<li>What it does: it is one home for notes, rules and memory.<\/li>\n<li>Annie's version: an Obsidian vault on her laptop, phone and server.<\/li>\n<\/ul>\n<p><strong>5. Scheduled jobs<\/strong><\/p>\n<ul>\n<li>What they do: work that runs at set times without you.<\/li>\n<li>Annie's version: 26 jobs. 23 of them are plain scripts that never call an AI model (checked 2 Oct 2026).<\/li>\n<\/ul>\n<p><strong>6. The watchdog<\/strong><\/p>\n<ul>\n<li>What it does: checks every hour that things worked. It stays silent when they did.<\/li>\n<li>Annie's version: Toby, with 24 checks (checked 9 Oct 2026).<\/li>\n<\/ul>\n<h3>How Your Builder and Your Bot Reach an AI: Harness, Provider, Model<\/h3>\n<p>The diagrams above show an arrow to &quot;a rented AI model&quot;. That arrow has three parts. You will hear the three words all through this course.<\/p>\n<p><strong>You → harness → AI provider → AI model.<\/strong> Then the answer comes back the same way.<\/p>\n<p><strong>The short version, with pi.<\/strong><\/p>\n<ul>\n<li><strong>pi is the harness.<\/strong> It is the program you type
