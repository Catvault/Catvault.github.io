li>\n<\/ul>\n<p><strong>Errors fixed:<\/strong><\/p>\n<ul>\n<li><strong>The expired rule no longer gives a count of places.<\/strong> The guide says six and Build Log 54 says three. The module now says &quot;every file that held a copy&quot;.<\/li>\n<li><strong>The skills cut is 4,744 tokens, not 5,550<\/strong> (Build Log 97). The larger figure included trimming the rules file.<\/li>\n<li><strong>The skills row now says 37 switched on, not 140.<\/strong><\/li>\n<li><strong>The golden-question example is the guide's nap question,<\/strong> not the &quot;yes&quot; rule.<\/li>\n<li><strong>v1's &quot;no more than ten rules&quot; is replaced by three.<\/strong><\/li>\n<li><strong>v1's claim that memory &quot;should be growing constantly&quot; is corrected<\/strong> for the bot's 2,200-character limit.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"full-07-s12\"><summary><span class=\"num\">07.12<\/span> Sources <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>How to Build Your Own Claudith guide, Parts 0, 4 and 5, and Example 1: the standing document, golden questions, numbered rules, the expired rule.<\/li>\n<li>Hermes Master Doc: soul first; let the AI assistant help write it, then condense it.<\/li>\n<li>Build Log 17: positive reinforcement as a soul trait.<\/li>\n<li>Build Logs 19 and 25: the 2,200-character memory limit and silent failure.<\/li>\n<li>Build Log 27: a rules file that described the system wrongly.<\/li>\n<li>Build Log 32: the rules file that was never loaded.<\/li>\n<li>Build Log 33: numbered procedures.<\/li>\n<li>Build Log 54: the rule that outlived its reason.<\/li>\n<li>Build Log 56: the reason written into the rule.<\/li>\n<li>Build Log 84: the save rule and the made-up link.<\/li>\n<li>Build Log 90: tables of what exists.<\/li>\n<li>Build Log 97: switching off unused skills; 4,744 tokens.<\/li>\n<li>Claudith's SOUL and RULES (readable copies in the vault): section list, six soul principles and six operating principles only.<\/li>\n<li>Bot settings, 2 Oct 2026 (file sizes, tone bans) and 9 Oct 2026 (memory and user-file limits).<\/li>\n<li>pi's own help text, 9 Oct 2026: pi loads <code>AGENTS.md<\/code> and <code>CLAUDE.md<\/code> files.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"full-07-s13\"><summary><span class=\"num\">07.13<\/span> Related <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>06 — Introduce Yourself to the Machine (Merged)<\/li>\n<li>02 — Privacy, Security and Whose Law Reaches Your Data (Merged)<\/li>\n<li>01 — Merge Tracker (Decisions, Hours, Checks)<\/li>\n<li>00 — Side-by-Side (9 Oct 2026) (Pair 7)<\/li>\n<\/ul>\n<\/details>", "count": 13}, {"id": "full-08a", "label": "08A Build", "title": "Module 08A: The Build, Before the Server (Part A in the file)", "minutes": 60, "read": 13, "toc": [["full-08a-s1", "08A.1", "What You Will Leave With"], ["full-08a-s2", "08A.2", "Before This Module"], ["full-08a-s3", "08A.3", "Five Checks Before Teaching Starts"], ["full-08a-s4", "08A.4", "Your Two Builders"], ["full-08a-s5", "08A.5", "Install pi and Connect opencode Go"], ["full-08a-s6", "08A.6", "Start in Your Vault and Write Your Builder's Instructions"], ["full-08a-s7", "08A.7", "The Cold Test: Prove a Fresh Session Reads Your File"], ["full-08a-s8", "08A.8", "Five Habits That Keep You in Control"]], "body": "<div class=\"intro\"><p><strong>Why pi comes first in the Full course.<\/strong><\/p>\n<ol>\n<li>Hong Kong blocks Claude. So Claude Code cannot sign in until a route out exists.<\/li>\n<li>If Claude Code built the route, students would first need a paid VPN. That VPN would also have to stay on while the server steps changed the network.<\/li>\n<li>pi on opencode Go works from Hong Kong directly (Build Log 103). So pi can build the route with nothing else turned on.<\/li>\n<\/ol>\n<p>Annie decided this on 10 Oct 2026. She will run this order herself on a test server before it is taught (Merge Tracker, Checks Before Teaching, item 6).<\/p>\n<\/div>\n<section class=\"card\" id=\"full-08a-s1\"><h2><span class=\"num\">08A.1<\/span> What You Will Leave With<\/h2><p><strong>Full course:<\/strong><\/p>\n<ul>\n<li>Two builders on your laptop. Both read the same <code>CLAUDE.md<\/code> file.<\/li>\n<li>pi works even when everything else is turned off.<\/li>\n<li>Claude Code works through your own server.<\/li>\n<li>A continuity note. Every new Claude Code session reads it first.<\/li>\n<li>A build log with an index.<\/li>\n<li>A run card: one page with your start commands, files, rules and costs.<\/li>\n<li>The server and the bot from Module 08B. You build those between the two halves of this module.<\/li>\n<\/ul>\n<p><strong>You can check the Short course result with two questions.<\/strong> First, ask something your files answer. Then, ask something your files do not contain. A working AI assistant answers the first question. It says it does not know the second (from v1).<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08a-s2\"><h2><span class=\"num\">08A.2<\/span> Before This Module<\/h2><div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Do this<\/th>\n<th>Course<\/th>\n<th>Why it is pre-work<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>An opencode Go subscription, with its key saved in your password manager<\/td>\n<td>Both<\/td>\n<td>pi needs it to answer. It is the one paid thing in the Short course <strong>[COST]<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Your USER.md (Module 06) and your Module 07 files in the vault's <code>AI System<\/code> folder<\/td>\n<td>Both<\/td>\n<td>The build uses them. Full: <code>SOUL<\/code> and <code>RULES<\/code>. Short: <code>AGENTS<\/code><\/td>\n<\/tr>\n<tr>\n<td>Your Data Map (Module 02)<\/td>\n<td>Both<\/td>\n<td>Its Tier 3 list goes into the builder's hard rules. Tier 3 is the data that never goes into any AI tool, such as passwords, keys and bank numbers<\/td>\n<\/tr>\n<tr>\n<td>A laptop with admin rights<\/td>\n<td>Both<\/td>\n<td>You need admin rights to install. The course was built on a Mac. The facilitator confirms the Windows steps<\/td>\n<\/tr>\n<tr>\n<td>The files for your one job, in one folder<\/td>\n<td>Short<\/td>\n<td>The AI assistant answers from files. It cannot answer from a job you only described out loud (v1)<\/td>\n<\/tr>\n<tr>\n<td>Your server, ordered in Module 03. Save its IP address and the server company's login in your password manager<\/td>\n<td>Full<\/td>\n<td>The server company's identity check can take a day (v1). Module 08B cannot start without the server<\/td>\n<\/tr>\n<tr>\n<td>A Claude Pro plan or higher<\/td>\n<td>Full<\/td>\n<td>Claude Code needs it after the server work <strong>[COST]<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>&quot;Installed&quot; means signed in and answering.<\/strong> A downloaded installer is not &quot;installed&quot; (v1).<\/p>\n<hr />\n<\/section>\n<section class=\"card\" id=\"full-08a-s3\"><h2><span class=\"num\">08A.3<\/span> Five Checks Before Teaching Starts<\/h2><p><em>10 minutes. From v1.<\/em><\/p>\n<p>Before any teaching starts, the facilitator checks five things:<\/p>\n<ol>\n<li>The laptop opens Terminal, and the student has admin rights.<\/li>\n<li>The opencode Go key is in the password manager.<\/li>\n<li>The server exists. The server company's website shows it, and the student can log in there.<\/li>\n<li><code>SOUL<\/code>, <code>RULES<\/code> and <code>USER<\/code> are in the vault's <code>AI System<\/code> folder.<\/li>\n<li>Telegram is on the phone, with two-factor sign-in on.<\/li>\n<\/ol>\n<p><strong>If item 3 fails, the student cannot do Module 08B today.<\/strong> Here is what happens instead:<\/p>\n<ul>\n<li>The student sits beside another student during 08B and watches.<\/li>\n<li>At home, they do 08B with the checklist.<\/li>\n<li>The facilitator joins them on a call for the steps that lock down the server.<\/li>\n<li>With three students at most, the facilitator has time for this.<\/li>\n<\/ul>\n<p>Everyone does &quot;Full Course: Before the Server&quot;.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08a-s4\"><h2><span class=\"num\">08A.4<\/span> Your Two Builders<\/h2><p><em>5 minutes.<\/em><\/p>\n<p>A builder is an AI that works on your files for you. You tell it what you want in plain English. It reads your files, changes them, and runs commands. It asks you before it changes anything (Seminar Starter Kit, file 03).<\/p>\n<p>You use two builders in this course: pi and Claude Code. Module 03 explained the three labels used below: harness, AI provider and AI model.<\/p>\n<p><strong>pi (harness)<\/strong><\/p>\n<ul>\n<li>pi is a way to connect to many AI models. Examples are DeepSeek and Kimi K3 (AI models, on opencode Go's model list, checked 10 Oct 2026).<\/li>\n<li>These are open models. They are good, and they cost much less than the big Western models. opencode Go (AI provider) costs $10 a month <strong>[COST]<\/strong>.<\/li>\n<li>In this course, pi uses DeepSeek (AI model), through opencode Go (AI provider).<\/li>\n<li>The same opencode Go plan gives your PA bot its brain (Module 08B). The bot runs on a separate harness called Hermes, but it uses the same models from the same $10 plan.<\/li>\n<li>To change your bot's brain to a different model, you ask pi to change one setting.<\/li>\n<li>pi works from Hong Kong with no VPN (Build Log 103).<\/li>\n<li>You install pi now.<\/li>\n<\/ul>\n<p><strong>Claude Code (harness)<\/strong><\/p>\n<ul>\n<li>Claude Code is the builder made by Anthropic (AI provider). It comes with every paid Claude plan.<\/li>\n<li>It uses Claude models (AI models), such as Opus 5.5.<\/li>\n<li>Hong Kong blocks Claude. So Claude Code works only through your server in Singapore (Module 01).<\/li>\n<li>You install Claude Code after the server work.<\/li>\n<li>Claude Code is good at understanding unclear instructions and working out what you meant (Module 01).<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-08a-s5\"><h2><span class=\"num\">08A.5<\/span> Install pi and Connect opencode Go<\/h2><p><em>15 minutes. The Short course uses these same steps.<\/em><\/p>\n<p><strong>Step 1. Open Terminal.<\/strong> Press Command and Space. Type <code>terminal<\/code>. Press Return.<\/p>\n<p><strong>Step 2. Install pi.<\/strong> On a Mac, paste this line and press Return (pi.dev, seen 2 Oct 2026):<\/p>\n<pre><code class=\"language-bash\">curl -fsSL https://pi.dev/install.sh | sh\n<\/code><\/pre>\n<p>On Windows, open PowerShell and paste this line:<\/p>\n<pre><code class=\"language-powershell\">powershell -c &quot;irm https://pi.dev/install.ps1 | iex&quot;\n<\/code><\/pre>\n<p>To check it worked:<\/p>\n<ol>\n<li>Quit Terminal (Command and Q).<\/li>\n<li>Open Terminal again.<\/li>\n<li>Type <code>pi --version<\/code>. It should print a number. Annie's Mac printed <code>1.1.0<\/code> on 10 Oct 2026.<\/li>\n<\/ol>\n<p><strong>Step 3. Give pi your opencode Go key, without the key showing on screen.<\/strong> pi looks for the key in a setting called <code>OPENCODE_API_KEY<\/code> (pi's own help, 10 Oct 2026). Paste this line into Terminal and press Return:<\/p>\n<pre><code class=\"language-bash\">read -rs &quot;KEY?Put your opencode Go key here, then press Return (it will not show): &quot;; echo &quot;export OPENCODE_API_KEY=\\&quot;$KEY\\&quot;&quot; &gt;&gt; ~/.zshrc; unset KEY\n<\/code><\/pre>\n<p>Then:<\/p>\n<ol>\n<li>Terminal asks for the key.<\/li>\n<li>Copy the key from your password manager.<\/li>\n<li>Paste it and press Return.<\/li>\n<\/ol>\n<p>Nothing appears on screen while you paste. That is on purpose. The line saves the key in your Terminal settings file. It never shows the key.<\/p>\n<p><strong>Never paste a key into a chat with any AI.<\/strong> Never type a key where other people can see it. On 30 September 2026, a session showed a live key on screen two times while it read a settings file (Build Log 103).<\/p>\n<p><strong>Step 4. Start pi on the right model.<\/strong> Open a new Terminal window. Type:<\/p>\n<pre><code class=\"language-bash\">pi --provider opencode-go --model deepseek-v4.1-flash\n<\/code><\/pre>\n<p>Ask pi: &quot;What model are you, and who provides you?&quot; Then paste this, to make it the default:<\/p>\n<pre><code class=\"language-text\">Set opencode-go and deepseek-v4.1-flash as your default provider and model in your settings file. Back up the file first, with the date in the backup's name. Show me the result.\n<\/code><\/pre>\n<p>To check it worked: next time, type only <code>pi<\/code>. It should start on the same model. Annie's pi settings hold these same two defaults (pi settings, read 10 Oct 2026). Facilitator: check this setting on the day, because pi changes often.<\/p>\n<p><strong>If pi asks whether to trust a folder, say yes only for your vault.<\/strong><\/p>\n<p><strong>The stop key.<\/strong> Press Escape to stop pi in the middle of a job.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08a-s6\"><h2><span class=\"num\">08A.6<\/span> Start in Your Vault and Write Your Builder's Instructions<\/h2><p><em>10 minutes.<\/em><\/p>\n<p><strong>Always start your builder in your vault.<\/strong> The builder reads the instruction file in the folder where it starts. If it starts in the wrong folder, it does not know your setup.<\/p>\n<p>Here is what happened to Annie on 30 June 2026:<\/p>\n<ol>\n<li>Her desktop app said it could not check her bot's backups. It blamed a technical problem.<\/li>\n<li>The app had been opened in a different folder. So it never read the file that says where the bot lives.<\/li>\n<li>She opened the terminal in the right folder. It did the job at once (Seminar Ideas, 30 Jun 2026).<\/li>\n<\/ol>\n<p><strong>If a builder says &quot;I can't&quot;, first ask which folder it started in.<\/strong><\/p>\n<p>To go to your vault in Terminal:<\/p>\n<ol>\n<li>Type <code>cd<\/code> and a space.<\/li>\n<li>Drag your vault folder from Finder into the Terminal window.<\/li>\n<li>Press Return.<\/li>\n<\/ol>\n<p><strong>Write one instruction file that both builders read.<\/strong><\/p>\n<ul>\n<li>pi reads <code>AGENTS.md<\/code> and <code>CLAUDE.md<\/code> (pi's own help, 10 Oct 2026).<\/li>\n<li>Claude Code reads <code>CLAUDE.md<\/code>.<\/li>\n<li>So the Full course writes one <code>CLAUDE.md<\/code>, and both builders read it.<\/li>\n<li>If a rule lives in two files, the two copies slowly become different. One file prevents that (Module 07, &quot;Rules Expire, and Each Rule Should Live in One File&quot;).<\/li>\n<\/ul>\n<p><strong>Keep the file short. Make it point to other notes.<\/strong> Annie's builder instructions hold only the rules the builder needs every time. For everything else, they point to notes in the vault (Build Log 03).<\/p>\n<p>Start pi in your vault and paste:<\/p>\n<pre><code class=\"language-text\">Read USER and Data Map in my AI System folder. Then draft a CLAUDE.md at the top of this vault from the template I paste next. Keep it under one screen. Show it to me before saving.\n<\/code><\/pre>\n<p>Then paste the template:<\/p>\n<pre><code class=\"language-markdown\"># Builder Instructions\n\n## Who I Am\n- [Three to five lines from USER.md.]\n\n## How to Work With Me\n- Explain in plain words, with numbered steps. I am not a developer.\n- Give me one next action, or at most three options with your recommended default and the reason.\n- Never end without my next action.\n- Tell me when I am wrong. Never guess: check the machine first, then answer.\n\n## Hard Rules\n- Before you ask me to paste anything, label it: safe to paste, remove the secret first, or never paste.\n- Never print the value of a key, token or password. Print its name only.\n- Back up any file before you edit it. Put the date and the reason in the backup's name.\n- Nothing goes to another person without my yes.\n- Never store or repeat: [the Tier 3 list from my Data Map].\n\n## Where Things Live\n- My vault is this folder. New notes go to 00 Inbox.\n- My builder files live in Builder/. My system notes live in AI System/.\n- My server: [added in Module 08B]. My bot: [added in Module 08B].\n\n## At the Start of Every Session\n- Read Builder/CONTINUITY.md before answering anything.\n<\/code><\/pre>\n<p><strong>Never put a colon in a file name.<\/strong> A Mac does not allow colons in file names. So a note with a colon in its name on the server never arrives on the laptop (Build Logs 96 and 104).<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08a-s7\"><h2><span class=\"num\">08A.7<\/span> The Cold Test: Prove a Fresh Session Reads Your File<\/h2><p><em>10 minutes. You repeat it for Claude Code after the server work. The Short course runs it too.<\/em><\/p>\n<p><strong>Why you test.<\/strong> If the builder does not read your instruction file, nothing tells you. It just acts like a general AI assistant that does not know you.<\/p>\n<p>Here is what happened to Annie in August 2026:<\/p>\n<ol>\n<li>She linked her builder's instructions with an import line.<\/li>\n<li>The folder path in that line had a space in it. So the link did not work.<\/li>\n<li>No error appeared.<\/li>\n<li>A cold test caught it. The answers were missing a rule that only the main file held (Build Log 47).<\/li>\n<\/ol>\n<p><strong>Step 1. Exit pi.<\/strong> Press Control and C two times. Or type <code>/exit<\/code>, if your version has it.<\/p>\n<p><strong>Step 2. Ask one question with no history.<\/strong> In your vault folder, type:<\/p>\n<pre><code class=\"language-bash\">pi -p --no-session &quot;Answer from your instructions only. Who am I? Give two of my rules for working with me. What must you never print?&quot;\n<\/code><\/pre>\n<p>What the parts mean (pi's own help, 10 Oct 2026):<\/p>\n<ul>\n<li><code>-p<\/code> asks one question and prints the answer.<\/li>\n<li><code>--no-session<\/code> means pi uses nothing from earlier conversations.<\/li>\n<\/ul>\n<p><strong>It passed if<\/strong> pi names you, quotes two of your rules, and says it never prints key values.<\/p>\n<p><strong>If the answer is general, pi did not read your file.<\/strong> Check two things:<\/p>\n<ol>\n<li><code>CLAUDE.md<\/code> is in the folder where you ran the command.<\/li>\n<li>The name is exactly <code>CLAUDE.md<\/code>.<\/li>\n<\/ol>\n<p>Fix it and run the test again. Do not go on until this test passes (v1).<\/p>\n<p><strong>What can go wrong without this test.<\/strong> For weeks in July 2026, Annie's bot seemed to ignore its rules. The truth was that its rules file had never loaded at all. Two small file links fixed it, and a new test passed (Build Log 32). These files are what make an AI assistant know you. Without them, it is a general AI assistant (Build Log 46).<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08a-s8\"><h2><span class=\"num\">08A.8<\/span> Five Habits That Keep You in Control<\/h2><p><em>10 minutes. The Short course teaches the same habits.<\/em><\/p>\n<p>The builder does the typing. You do three things:<\/p>\n<ol>\n<li><strong>Describe<\/strong> what you want.<\/li>\n<li><strong>Approve<\/strong> each change before it happens.<\/li>\n<li><strong>Check<\/strong> the result.<\/li>\n<\/ol>\n<p>Annie wrote no code to build her system. In July 2026 she said: &quot;I'm not technical. Here's my lab notebook, and none of it needed me to write code. It needed me to learn how to check&quot; (Seminar Ideas, 2 Jul 2026).<\/p>\n<p><strong>When a note and the machine disagree, believe the machine.<\/strong> A note, a memory or the builder's report can be out of date. The live settings and the real output show what is true now. Fix the note.<\/p>\n<p><strong>The five habits:<\/strong><\/p>\n<ol>\n<li><strong>Look before you build.<\/strong> In her first month, Annie started to build something that already existed three times. One time, there were two versions of the same job: one turned off and one running. Because she looked first, she upgraded the running one (Build Log 04). Start every build with: &quot;Before changing anything, list what already exists for this on the machine.&quot;<\/li>\n<li><strong>Back up before every change, and know how to undo it.<\/strong>\n<ul>\n<li>Copy the file first. Put the date and the reason in the backup's name, for example <code>config.yaml.bak_20260922_model-change<\/code>.<\/li>\n<li>Make the smallest change.<\/li>\n<li>Check that it still works.<\/li>\n<li>Write down how to undo it.<\/li>\n<li>Annie once undid a model change in about a minute, because the backup existed (Build Log 92).<\/li>\n<\/ul>\n<\/li>\n<li><strong>Ask for proof, not &quot;done&quot;.<\/strong> Ask to see the output, the file on disk, or the message on your phone. Annie's logs sort every claim into &quot;Proven&quot; and &quot;Not yet proven&quot; (Build Log 94).<\/li>\n<li><strong>Make one change at a time, then use it for a while.<\/strong> In May 2026 Annie's first bot broke down. Its cheap AI model could not use its tools reliably, and it said tasks were done when they were not. Version 2 started with three things: the soul file, the rules and one reminder. Her plan was to live with it for 24 to 48 hours before building more (Build Log 00).<\/li>\n<li><strong>Advice is not a fix. A note is not a task.<\/strong> When the builder finds a problem, it fixes it in the same step, or it gives the fix a date. In July 2026 a review of Annie's handover document sat unused for two days. Then she asked, &quot;we have this audit, how do we use it?&quot; (Build Log 26).<\/li>\n<\/ol>\n<p>Ask pi to add the five habits to <code>CLAUDE.md<\/code> under &quot;How to Work With Me&quot;. Tell it to back up the file first.<\/p>\n<p><strong>Next, go to Module 08B.<\/strong> pi does every server step there.<\/p>\n<hr />\n<\/section>", "count": 8}, {"id": "full-08b", "label": "08B Server", "title": "Module 08B: The Server and Your Bot", "minutes": 155, "read": 34, "toc": [["full-08b-s1", "08B.1", "What You Will Leave With"], ["full-08b-s2", "08B.2", "Before This Module"], ["full-08b-s3", "08B.3", "The Plan and the Four Safety Rules"], ["full-08b-s4", "08B.4", "Snapshot and SSH Key"], ["full-08b-s5", "08B.5", "First Login, Timezone and Updates"], ["full-08b-s6", "08B.6", "Secure the Server, in an Order That Cannot Lock You Out"], ["full-08b-s7", "08B.7", "Tailscale: Your Private Network"], ["full-08b-s8", "08B.8", "Close Public SSH, With an Automatic Undo Timer"], ["full-08b-s9", "08B.9", "The Exit Node: Send Your Traffic Out Through Your Server"], ["full-08b-s10", "08B.10", "Claude Code on the Server"], ["full-08b-s11", "08B.11", "Your Vault on the Server"], ["full-08b-s12", "08B.12", "Create the Telegram Bot"], ["full-08b-s13", "08B.13", "Install Hermes and Connect It"], ["full-08b-s14", "08B.14", "Load Your Files and Make It Restart on Its Own"], ["full-08b-s15", "08B.15", "Three Tests: Quoting Rules, Saying It Does Not Know, and Golden Questions"], ["full-08b-s16", "08B.16", "Same Model, Different Program: Why pi and the Bot Answer Differently"], ["full-08b-s17", "08B.17", "Homework: A Normal User, a Swap File and a Reboot Test"], ["full-08b-s18", "08B.18", "From the Record"], ["full-08b-s19", "08B.19", "Worksheet: Server and Bot Checklist"], ["full-08b-s20", "08B.20", "Teaching Notes"], ["full-08b-s21", "08B.21", "Not Yet Tested"]], "body": "<div class=\"intro\"><p><strong>This order has not been run yet.<\/strong> Annie will run it herself before it is taught: on a fresh test server, from Hong Kong, with no VPN (Merge Tracker, Checks Before Teaching, item 6). If a step fails in her test, this module changes first.<\/p>\n<\/div>\n<section class=\"card\" id=\"full-08b-s1\"><h2><span class=\"num\">08B.1<\/span> What You Will Leave With<\/h2><p><strong>Full course:<\/strong><\/p>\n<ul>\n<li>A locked server in Singapore that only your own devices can reach, over your own private network.<\/li>\n<li>It is your route out of Hong Kong when you want Claude.<\/li>\n<li>Claude Code runs on it, signed in to your subscription.<\/li>\n<li>Your vault is copied to it.<\/li>\n<li>A Telegram bot lives on it. The bot answers only you, restarts by itself and quotes your rules back. It has no job yet.<\/li>\n<\/ul>\n<p><strong>Optional Short course server session:<\/strong><\/p>\n<ul>\n<li>A locked server in Singapore that accepts only your key. It has a firewall and automatic bans.<\/li>\n<li>A Telegram bot lives on it. The bot answers only you, restarts by itself and quotes your rules.<\/li>\n<li>Your laptop and pi stay exactly as they were.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-08b-s2\"><h2><span class=\"num\">08B.2<\/span> Before This Module<\/h2><ul>\n<li><strong>Your server, ordered in Module 03.<\/strong> Its IP address and the provider's console login are in your password manager.<\/li>\n<li><strong>pi working on your laptop<\/strong> (Module 08, &quot;Full Course: Before the Server&quot; or &quot;Short Course&quot;), opening in your vault.<\/li>\n<li><strong>Your SOUL, RULES and USER files<\/strong> (Full) or your <code>AGENTS.md<\/code> and USER (Short), in the vault's <code>AI System<\/code> folder.<\/li>\n<li><strong>Telegram on your phone,<\/strong> with two-factor sign-in on.<\/li>\n<li><strong>Tailscale on your phone<\/strong> (Full only). Install the app now. You sign in during the module.<\/li>\n<li><strong>Obsidian Sync, bought before this module<\/strong> (Full only, and only if the vault goes on the server). About $4 to $5 a month <strong>[COST]<\/strong>. The Claude version's pre-work listed this a session too late.<\/li>\n<li><strong>If you already pay for a commercial VPN, switch it off before this module and leave it off.<\/strong> Two VPNs on one machine fight over the same settings (Build Log 64).<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-08b-s3\"><h2><span class=\"num\">08B.3<\/span> The Plan and the Four Safety Rules<\/h2><p><em>5 minutes. Both courses.<\/em><\/p>\n<p><strong>You will not type most of these commands. pi does, and you approve each one.<\/strong><\/p>\n<ul>\n<li>Annie's guide is direct about this. Let the builder (here, pi) drive the install. Do not follow random tutorials by hand. The builder reads the errors and fixes them (How to Build Your Own Claudith guide, Part 3).<\/li>\n<li>Each step shows <strong>what to ask pi<\/strong>, the commands it should run, and <strong>what success looks like<\/strong>.<\/li>\n<li>Read the command before you approve it.<\/li>\n<\/ul>\n<p><strong>Why pi, and not Claude Code.<\/strong><\/p>\n<ul>\n<li>pi answers from Hong Kong directly.<\/li>\n<li>Nothing in this module can cut pi off, because it never depends on the network you are building.<\/li>\n<li>Claude Code would need a route out before it could start (Module 08, &quot;Why pi comes first&quot;).<\/li>\n<\/ul>\n<p>Start pi in your vault and paste:<\/p>\n<pre><code class=\"language-text\">Today we set up my new Ubuntu server. Its IP address is in my password manager; I will paste it when you ask. You run commands on it over SSH from this laptop. Work one step at a time. Before each step, show me the command and what it changes. After each step, check it worked and show me the proof. Back up any file before editing it. Do not change anything I have not approved. If a command asks for a password or passphrase, give it to me to run myself in a second Terminal window. Keep a list of every change for my build log.\n<\/code><\/pre>\n<p><strong>The four safety rules.<\/strong> Annie learned each one on her own server.<\/p>\n<ol>\n<li><strong>Snapshot first.<\/strong> Before her first build in May 2026, Annie took a full snapshot of her server in the provider's console. If the build went wrong, she could return the server to that exact state (Build Log 00).<\/li>\n<li><strong>Every change that could lock you out needs an automatic undo.<\/strong> In September 2026 Annie changed which accounts may log in to her server (Build Log 103).\n<ul>\n<li>Before the change, she set a ten-minute timer. It would undo the change automatically if she was locked out.<\/li>\n<li>She cancelled the timer once the change was proven.<\/li>\n<\/ul>\n<\/li>\n<li><strong>One change at a time, tested before the next.<\/strong> In June 2026 her bot kept the same process number through every security change. That proved nothing had restarted or broken (Build Log 06).<\/li>\n<li><strong>The provider's web console still works when SSH does not.<\/strong> If anything locks you out, log in there.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"full-08b-s4\"><h2><span class=\"num\">08B.4<\/span> Snapshot and SSH Key<\/h2><p><em>10 minutes. Both courses.<\/em><\/p>\n<p><strong>Step 1. Take a snapshot.<\/strong> In your provider's web console, find the server. Choose &quot;Snapshot&quot; or &quot;Backup now&quot;. Name it <code>day-1-before-build<\/code>.<\/p>\n<p>What success looks like: the snapshot appears in the list.<\/p>\n<p><strong>Step 2. Make an SSH key on your laptop.<\/strong> An SSH key is a pair of files.<\/p>\n<ul>\n<li>The private file stays on your laptop. It proves who you are.<\/li>\n<li>The public file goes on the server.<\/li>\n<\/ul>\n<p>pi gives you this command to run yourself in a second Terminal window, because it asks for a passphrase:<\/p>\n<pre><code class=\"language-bash\">ssh-keygen -t ed25519 -C &quot;laptop-yourname&quot;\n<\/code><\/pre>\n<p><strong>Use a passphrase.<\/strong> Annie's first build log lists this as the one protection she had not set up. A passphrase makes a stolen key file useless on its own. Your Mac's keychain can remember it (Build Log 00).<\/p>\n<p><strong>Label every key with the device it belongs to.<\/strong> Annie's phone and tablet keys both arrived labelled <code>moshi<\/code>. So a list of keys could not tell them apart. She relabelled them by device (Build Log 103).<\/p>\n<p><strong>Step 3. Put the public key on the server.<\/strong> If your provider emailed you a root password, run this yourself in the second window:<\/p>\n<pre><code class=\"language-bash\">ssh-copy-id -i ~/.ssh/id_ed25519.pub root@&lt;your-server-ip&gt;\n<\/code><\/pre>\n<ul>\n<li>You type the root password once.<\/li>\n<li>If your provider asked for a key at order time, paste the contents of <code>~/.ssh/id_ed25519.pub<\/code> into the provider's console instead.<\/li>\n<li>On Windows, <code>ssh-copy-id<\/code> may not exist. Use the console.<\/li>\n<\/ul>\n<p>What success looks like: <code>ssh root@&lt;your-server-ip&gt;<\/code> logs you in without asking for the server password.<\/p>\n<p><strong>Only the file ending in <code>.pub<\/code> is safe to share.<\/strong> Never paste the private key anywhere.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08b-s5\"><h2><span class=\"num\">08B.5<\/span> First Login, Timezone and Updates<\/h2><p><em>10 minutes. Both courses.<\/em><\/p>\n<p><strong>Step 4. Set the timezone.<\/strong> Servers arrive set to UTC (Build Logs 00 and 14).<\/p>\n<ul>\n<li>For about a month, Annie's bot gave tomorrow's date in the evenings.<\/li>\n<li>The cause: the server's clock ran eight hours behind Hong Kong.<\/li>\n<li>Her first build log said the timezone was set. It was not.<\/li>\n<\/ul>\n<pre><code class=\"language-bash\">timedatectl set-timezone Asia/Hong_Kong\ntimedatectl\n<\/code><\/pre>\n<p>What success looks like: the output shows <code>Asia/Hong_Kong<\/code>, and the local time matches your watch.<\/p>\n<p><strong>Step 5. Update the system.<\/strong><\/p>\n<pre><code class=\"language-bash\">apt update &amp;&amp; apt upgrade -y\n<\/code><\/pre>\n<p>What success looks like: it finishes without red errors. It may ask about a changed configuration file. If so, keep the version already installed.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08b-s6\"><h2><span class=\"num\">08B.6<\/span> Secure the Server, in an Order That Cannot Lock You Out<\/h2><p><em>15 minutes. Both courses. From the Claude version's Module 12 and v1's Logs 05 and 06.<\/em><\/p>\n<p><strong>Annie's example (Build Logs 05 and 06).<\/strong><\/p>\n<ul>\n<li>For its first month, Annie's server had five secret files that any user on it could read. It had no firewall.<\/li>\n<li>Her guide says it plainly: nothing bad happened, and that was luck, not design (guide, Part 3, Step 6).<\/li>\n<li>Her review in June 2026 looked first and changed nothing. It sorted the fixes by risk.<\/li>\n<li>The next day the fixes went in, in an order that could not lock her out.<\/li>\n<\/ul>\n<p><strong>Step 6. Look first.<\/strong> Ask pi to report how SSH is set up and which ports are open. It must not change anything.<\/p>\n<pre><code class=\"language-bash\">sshd -T | grep -E 'passwordauthentication|permitrootlogin|pubkeyauthentication'\nss -tulnp\n<\/code><\/pre>\n<p>What success looks like: a short report. Only SSH (port 22) should face the internet.<\/p>\n<p><strong>Step 7. Prove your key works in a second window.<\/strong><\/p>\n<ul>\n<li>Open a new Terminal window and log in with <code>ssh root@&lt;your-server-ip&gt;<\/code>.<\/li>\n<li>Keep this window open for the rest of the module.<\/li>\n<li>If a change goes wrong, this window is still logged in and can undo it.<\/li>\n<\/ul>\n<p><strong>Step 8. Turn off password logins.<\/strong> Ask pi to write a small separate settings file. It should not edit the main one. Then each change is easy to see and undo (Build Log 103). The file <code>/etc/ssh/sshd_config.d/99-hardening.conf<\/code> should contain:<\/p>\n<pre><code class=\"language-text\">PasswordAuthentication no\nKbdInteractiveAuthentication no\nPermitRootLogin prohibit-password\n<\/code><\/pre>\n<p>Then check the settings before applying them, and reload:<\/p>\n<pre><code class=\"language-bash\">sshd -t &amp;&amp; systemctl reload ssh\n<\/code><\/pre>\n<p>What success looks like: <code>sshd -t<\/code> prints nothing, which means no errors. A third new window still logs in with your key.<\/p>\n<p><strong>Step 9. Turn on the firewall, allowing SSH first.<\/strong> The order matters. Allow SSH, then block everything else coming in. Annie's review named this as the only lockout risk in the whole security review (Build Log 05).<\/p>\n<pre><code class=\"language-bash\">ufw allow OpenSSH\nufw default deny incoming\nufw default allow outgoing\nufw --force enable\nufw status verbose\n<\/code><\/pre>\n<p>What success looks like (Build Log 05):<\/p>\n<ul>\n<li>The firewall is active, with SSH allowed.<\/li>\n<li>A new window still logs in.<\/li>\n<li>The bot only makes outgoing connections. So this firewall will not block it later.<\/li>\n<\/ul>\n<p><strong>Step 10. Ban repeated failed logins, and keep security updates automatic.<\/strong><\/p>\n<pre><code class=\"language-bash\">apt install -y fail2ban\nfail2ban-client status sshd\nsystemctl is-enabled unattended-upgrades\n<\/code><\/pre>\n<p>What success looks like: fail2ban reports an <code>sshd<\/code> jail, and unattended upgrades shows <code>enabled<\/code>. Annie's server runs both (live server check, 2 Oct 2026).<\/p>\n<p><strong>Lock the secret files as you add them.<\/strong> Any file holding a key or token gets <code>chmod 600<\/code>. Then only its owner can read it. Annie's five readable secret files were fixed this way (Build Log 06).<\/p>\n<p><strong>If you get locked out:<\/strong> log in through the provider's web console. Ask pi to undo the last change from its backup.<\/p>\n<p><strong>Optional Short course server session: the server steps stop here.<\/strong> Go to &quot;Create the Telegram Bot&quot;.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08b-s7\"><h2><span class=\"num\">08B.7<\/span> Tailscale: Your Private Network<\/h2><p><em>15 minutes. Full only.<\/em><\/p>\n<p><strong>Tailscale puts your laptop, phone and server on one private network,<\/strong> as if they sat in the same room. The free Personal plan covers up to 6 users and unlimited devices. It includes exit nodes (Tailscale pricing, seen 2 Oct 2026).<\/p>\n<p><strong>Step 11. Create a Tailscale account<\/strong> at tailscale.com. Sign in with an account you control personally.<\/p>\n<p><strong>Step 12. Join your laptop.<\/strong> Install the Tailscale app from tailscale.com/download and sign in.<\/p>\n<p><strong>If it hangs, check that no commercial VPN is on (Build Log 64).<\/strong><\/p>\n<ul>\n<li>In August 2026 Annie's Mac could not join for most of a day.<\/li>\n<li>The app did nothing, and the login printed no address.<\/li>\n<li>Tailscale's own health message gave the reason. The commercial VPN had taken over the Mac's address lookups.<\/li>\n<li>Annie guessed the cause first. Turning the VPN off fixed it at once.<\/li>\n<\/ul>\n<p><strong>Step 13. Join your phone.<\/strong> Open the Tailscale app and sign in with the same account.<\/p>\n<p><strong>Step 14. Join the server.<\/strong> Ask pi to install Tailscale on the server and start it:<\/p>\n<pre><code class=\"language-bash\">curl -fsSL https://tailscale.com/install.sh | sh\ntailscale up\n<\/code><\/pre>\n<p><code>tailscale up<\/code> prints a web address. Open it on your laptop and approve the server.<\/p>\n<p>What success looks like: the Tailscale admin page lists three devices. On the server, <code>tailscale ip -4<\/code> prints an address starting with <code>100.<\/code>.<\/p>\n<p><strong>Step 15. Turn off key expiry.<\/strong> In the Tailscale admin page, open each device's menu and choose &quot;Disable key expiry&quot;. Otherwise a device drops off the network when its key expires. Then the exit node stops working (Build Log 64).<\/p>\n<p><strong>Step 16. Give the server a short name on your laptop.<\/strong> Ask pi to add an entry to <code>~/.ssh/config<\/code>:<\/p>\n<pre><code class=\"language-text\">Host myserver\n  HostName &lt;your-server-tailscale-name&gt;\n  User root\n<\/code><\/pre>\n<p>What success looks like: <code>ssh myserver<\/code> logs you in over Tailscale.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08b-s8\"><h2><span class=\"num\">08B.8<\/span> Close Public SSH, With an Automatic Undo Timer<\/h2><p><em>10 minutes. Full only.<\/em><\/p>\n<p><strong>Step 17. Make SSH work only over your private network.<\/strong> Do three things in order:<\/p>\n<ol>\n<li>Allow SSH on the Tailscale side.<\/li>\n<li>Set a timer that reopens public SSH in ten minutes unless you cancel it.<\/li>\n<li>Remove the public rule.<\/li>\n<\/ol>\n<pre><code class=\"language-bash\">ufw allow in on tailscale0 to any port 22 proto tcp\napt install -y at\necho &quot;ufw allow OpenSSH&quot; | at now + 10 minutes\nufw delete allow OpenSSH\n<\/code><\/pre>\n<p>Test <code>ssh myserver<\/code> in a new window. If it works, cancel the timer. <code>atq<\/code> lists it, and <code>atrm &lt;number&gt;<\/code> cancels it.<\/p>\n<p>What success looks like: <code>ssh myserver<\/code> works, and <code>ssh root@&lt;your-server-ip&gt;<\/code> no longer connects.<\/p>\n<p><strong>This is the same safety Annie used in September 2026<\/strong> when she changed which accounts may log in. The undo was set before the change and cancelled after it was proven. Her public SSH had already been closed by then (Build Log 103).<\/p>\n<p><strong>Now Tailscale is your only way in.<\/strong> With Tailscale off, you cannot reach your server. In September 2026 Annie's builder on the Mac could not reach her server for exactly this reason (Build Log 102). The provider's console still works.<\/p>\n<p><strong>After any network change, test every job that connects to the server<\/strong> (live system check, 2 Oct 2026).<\/p>\n<ul>\n<li>A check on 2 October 2026 found two of Annie's scheduled Mac jobs still using the server's old public address.<\/li>\n<li>This was days after public SSH was closed.<\/li>\n<li>One of them, a backup, had failed twice.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-08b-s9\"><h2><span class=\"num\">08B.9<\/span> The Exit Node: Send Your Traffic Out Through Your Server<\/h2><p><em>15 minutes. Full only.<\/em><\/p>\n<p><strong>An exit node sends a device's internet traffic out through your server.<\/strong> So your laptop appears to be in Singapore.<\/p>\n<p><strong>Annie's problem in August 2026 (Build Log 63).<\/strong> Her phone could run only one VPN at a time.<\/p>\n<ul>\n<li>With her commercial VPN on, Claude worked but her private pages did not.<\/li>\n<li>With Tailscale on, the private pages worked but Claude was blocked.<\/li>\n<li>Making her server an exit node meant one switch did both jobs.<\/li>\n<li>The commercial VPN was no longer needed.<\/li>\n<\/ul>\n<p>Her server is in Singapore, which Anthropic serves (Build Log 64).<\/p>\n<p><strong>The same caution from Module 01 applies.<\/strong> Using a route like this to reach a provider that does not serve Hong Kong is a choice about that provider's terms. It is yours to make.<\/p>\n<p><strong>Step 18. Allow the server to forward traffic, permanently (Build Log 64).<\/strong><\/p>\n<ul>\n<li>Annie's forwarding was first switched on in memory only. So a restart would have silently broken the exit node.<\/li>\n<li>She wrote it to a settings file. Then she proved it survived a simulated restart.<\/li>\n<\/ul>\n<p>Ask pi to write <code>/etc/sysctl.d/99-tailscale.conf<\/code> containing:<\/p>\n<pre><code class=\"language-text\">net.ipv4.ip_forward = 1\nnet.ipv6.conf.all.forwarding = 1\n<\/code><\/pre>\n<p>Then apply it:<\/p>\n<pre><code class=\"language-bash\">sysctl -p /etc/sysctl.d/99-tailscale.conf\n<\/code><\/pre>\n<p>Ask pi to write the file with a short command or an editor. In August 2026 a long pasted command wrapped in the terminal and failed (Build Log 63).<\/p>\n<p><strong>Step 19. Let the firewall forward Tailscale traffic only, then offer the server as an exit node.<\/strong><\/p>\n<pre><code class=\"language-bash\">ufw route allow in on tailscale0\ntailscale set --advertise-exit-node\n<\/code><\/pre>\n<p><strong>Step 20. Approve it.<\/strong> In the Tailscale admin page, open the server's menu. Choose &quot;Edit route settings&quot;, and tick &quot;Use as exit node&quot;.<\/p>\n<p><strong>Step 21. Test it from your laptop.<\/strong> In the Tailscale menu, choose your server as the exit node. Then run:<\/p>\n<pre><code class=\"language-bash\">curl -s https://1.1.1.1/cdn-cgi/trace | grep loc\n<\/code><\/pre>\n<p>What success looks like: <code>loc=SG<\/code>.<\/p>\n<p>Then run the status test from Module 01 again (Build Log 103).<\/p>\n<ul>\n<li>Anthropic answered 403 from Hong Kong.<\/li>\n<li>It answered 401 through Annie's Singapore server.<\/li>\n<li>A 401 means the route works.<\/li>\n<\/ul>\n<p><strong>Full course: Module 08's &quot;After the Server&quot; half can start from here.<\/strong> The rest of this module also works with that half done first.<\/p>\n<p><strong>Use one switch with two settings: exit node on, or exit node off.<\/strong><\/p>\n<ul>\n<li>A Mac cannot route app by app.<\/li>\n<li>Annie built two cleverer designs that sent only some traffic through Singapore. She removed both the next day, because each put Tailscale directly in front of Claude Code (Build Log 69).<\/li>\n<li>Her rule since then: exit node on, everything goes through Singapore. Exit node off, a normal Hong Kong connection.<\/li>\n<li>Since 30 September 2026 her exit node is off by default (How To Open Claude on the VPS note, 30 Sep 2026).<\/li>\n<li>pi works in both states (Build Log 103).<\/li>\n<\/ul>\n<p><strong>On Android, route app by app.<\/strong> Use exclude mode in the Tailscale app, as Module 01 explained (Build Log 68).<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08b-s10\"><h2><span class=\"num\">08B.10<\/span> Claude Code on the Server<\/h2><p><em>10 minutes. Full only.<\/em><\/p>\n<p><strong>With Claude Code on the server, you can reach your builder from your phone with the laptop closed.<\/strong> In August 2026 Annie moved hers there in about 10 minutes. It ran on the subscription she already paid for (Build Log 46).<\/p>\n<p><strong>Step 22. Install Claude Code on the server.<\/strong> Ask pi to run, on the server:<\/p>\n<pre><code class=\"language-bash\">curl -fsSL https://claude.ai/install.sh | bash\n<\/code><\/pre>\n<p><strong>Step 23. Sign in once, with the exit node on (Build Log 105).<\/strong> Claude's sign-in page is blocked in Hong Kong. Only the sign-in needs the route.<\/p>\n<ol>\n<li>In your own SSH window, run <code>claude<\/code> on the server and follow the sign-in prompt.<\/li>\n<li>It shows a web address. Open it in your laptop's browser.<\/li>\n<li>With the exit node on, the page opens.<\/li>\n<li>Once you are signed in, the login is stored on the server.<\/li>\n<li>Turn the exit node off.<\/li>\n<\/ol>\n<p>Facilitator: confirm the current sign-in flow on the day.<\/p>\n<p>What success looks like: <code>claude -p &quot;Reply with the word PONG&quot;<\/code> on the server prints <code>PONG<\/code>.<\/p>\n<p><strong>Step 24. Lock it to the subscription.<\/strong> Ask pi to set <code>forceLoginMethod<\/code> to <code>claudeai<\/code> in the server's <code>~/.claude/settings.json<\/code>. Annie's server has this lock (live server check, 2 Oct 2026).<\/p>\n<p><strong>The server's login expires (Build Log 75).<\/strong><\/p>\n<ul>\n<li>On an idle server it lasted about 30 days.<\/li>\n<li>Using it did not extend it.<\/li>\n<li>The watchdog, a checking script you set up in a later module (Module 10), warns you before it lapses.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-08b-s11\"><h2><span class=\"num\">08B.11<\/span> Your Vault on the Server<\/h2><p><em>10 minutes. Full only.<\/em><\/p>\n<p><strong>Step 25. Copy your vault to the server.<\/strong><\/p>\n<ul>\n<li>Annie's server keeps a copy of her vault through Obsidian's own sync service. It uses the server version, <code>ob<\/code>, on a schedule (Build Logs 02 and 97).<\/li>\n<li>Facilitator: walk the room through the current set-up from Obsidian's guide (obsidian.md/help/sync/headless) on the day. These steps are not yet written here.<\/li>\n<li>Keep the vault in its own folder, such as <code>/root/vault/<\/code>. Keep it separate from the bot's files.<\/li>\n<\/ul>\n<p>Three sync facts every student needs (Build Logs 25, 97 and 104):<\/p>\n<ul>\n<li><strong>Obsidian must be open on your laptop<\/strong> for laptop edits to leave it. The server can report &quot;Sync OK&quot; while your laptop sends nothing.<\/li>\n<li><strong>A file name with a colon never arrives<\/strong> on a Mac.<\/li>\n<li><strong>Deleting a file on one device may not stick.<\/strong> Delete on the server first, then let it sync.<\/li>\n<\/ul>\n<p>What success looks like: a note you create on your laptop appears in the server's vault folder within a few minutes.<\/p>\n<p><strong>Step 26. Run a cold test on the server.<\/strong> A cold test is a fresh session that proves your instructions file loads. From the vault folder on the server, run the cold test from Module 08 with <code>claude -p<\/code>. Annie's first server test caught that the wrong half of her memory had been copied (Build Log 46).<\/p>\n<h3>Your Daily Routine<\/h3>\n<p>From now on (How To Open Claude on the VPS note, 30 Sep 2026):<\/p>\n<ol>\n<li>Tailscale on.<\/li>\n<li>Exit node off.<\/li>\n<li><code>ssh myserver<\/code>.<\/li>\n<li>Go to your vault folder and start Claude Code.<\/li>\n<\/ol>\n<p>pi on the laptop works at any time, with or without these four steps. Claude Code on the laptop needs the exit node on.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08b-s12\"><h2><span class=\"num\">08B.12<\/span> Create the Telegram Bot<\/h2><p><em>10 minutes. Both courses.<\/em><\/p>\n<p><strong>Step 27. Open Telegram and search for <code>@BotFather<\/code>.<\/strong> Check for the blue verified tick. This is Telegram's official account for creating bots.<\/p>\n<p><strong>Step 28. Send <code>/newbot<\/code>.<\/strong> Give it a display name, then a username ending in <code>bot<\/code>. Choose a username that does not include your full name.<\/p>\n<p><strong>Step 29. Save the token (Build Log 103).<\/strong><\/p>\n<ul>\n<li>BotFather replies with a long token.<\/li>\n<li>Anyone with this token controls your bot.<\/li>\n<li>Save it in your password manager straight away.<\/li>\n<li>Never paste it into a chat with any AI, a note or your vault.<\/li>\n<\/ul>\n<p>What success looks like: the token is in your password manager, and your new bot appears in Telegram.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08b-s13\"><h2><span class=\"num\">08B.13<\/span> Install Hermes and Connect It<\/h2><p><em>15 minutes. Both courses.<\/em><\/p>\n<p>A bot has four parts:<\/p>\n<ul>\n<li><strong>Framework:<\/strong> the program that runs the bot. It holds its tools, memory, schedules and rules.\n<ul>\n<li>This course uses Hermes Agent by Nous Research.<\/li>\n<li>Annie's server runs version 0.21.5 (live server check, 2 Oct 2026).<\/li>\n<\/ul>\n<\/li>\n<li><strong>Channel:<\/strong> where you type to it. This course uses Telegram.<\/li>\n<li><strong>Model:<\/strong> the AI that writes the answers. This course uses DeepSeek V4.1 Flash through opencode Go, the same as your pi.<\/li>\n<li><strong>Files:<\/strong> who it is and what it must do. This course uses your SOUL, RULES and USER.<\/li>\n<\/ul>\n<p><strong>Step 30. Install Hermes.<\/strong> Ask pi:<\/p>\n<pre><code class=\"language-text\">Install Hermes Agent on my server using the official install script from the NousResearch hermes-agent repository. Then set its timezone to Asia/Hong_Kong. Show me each command before running it. When it asks for my Telegram bot token or any key, stop and tell me how to enter it myself without it being shown on screen.\n<\/code><\/pre>\n<p>The commands it should use (official repository, seen 2 Oct 2026; Build Log 14):<\/p>\n<pre><code class=\"language-bash\">curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash\nhermes config set timezone Asia/Hong_Kong\n<\/code><\/pre>\n<p><strong>Set the timezone in Hermes as well as on the server.<\/strong> They are two separate settings. Annie's bot's own timezone setting was blank. That is what caused the month of wrong dates (Build Log 14).<\/p>\n<p><strong>Step 31. Connect Telegram, and allow only yourself.<\/strong> The set-up asks questions, so run it yourself in your SSH window:<\/p>\n<pre><code class=\"language-bash\">hermes gateway setup\n<\/code><\/pre>\n<ol>\n<li>Choose Telegram.<\/li>\n<li>Paste your bot token when asked.<\/li>\n<li>Enter your numeric Telegram user ID (Hermes Telegram documentation, seen 2 Oct 2026).<\/li>\n<\/ol>\n<p><strong>If you do not know your ID (Build Log 52):<\/strong><\/p>\n<ol>\n<li>Leave it blank.<\/li>\n<li>Send your bot one message from your phone.<\/li>\n<li>The bot's log will show your number, in a line saying a user was blocked.<\/li>\n<li>Add that number as the only allowed user.<\/li>\n<\/ol>\n<p>The setting is <code>TELEGRAM_ALLOWED_USERS<\/code>. It holds your number and nobody else's.<\/p>\n<p><strong>Step 32. Connect the model.<\/strong> Ask pi to add your opencode Go key to the bot's <code>.env<\/code> file without printing it. Ask it to set the model in <code>config.yaml<\/code>. Annie's live settings (Build Log 92; live server check, 2 Oct 2026):<\/p>\n<pre><code class=\"language-yaml\">model:\n  default: deepseek-v4.1-flash\n  provider: opencode-go\n  max_tokens: 2048\n<\/code><\/pre>\n<ul>\n<li>The key's name in <code>.env<\/code> on Annie's server is <code>OPENCODE_GO_API_KEY<\/code> (Build Log 94).<\/li>\n<li>Then lock the file: <code>chmod 600 ~/.hermes/.env<\/code>.<\/li>\n<li>Facilitator: confirm the provider set-up in the Hermes documentation on the day.<\/li>\n<\/ul>\n<p><strong>The output limit matters (Build Log 80).<\/strong> <code>max_tokens<\/code> caps how long one answer can be.<\/p>\n<ul>\n<li>Annie's son's tutor bot once wrote an answer of about 15,000 tokens.<\/li>\n<li>It took up to three minutes to reply.<\/li>\n<li>A short-answers rule and a 2,048-token cap brought replies well under a minute.<\/li>\n<\/ul>\n<p><strong>A model name works only on the provider that serves it.<\/strong> When Annie changed provider in September 2026, every model name the old provider used stopped working (Build Log 94).<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08b-s14\"><h2><span class=\"num\">08B.14<\/span> Load Your Files and Make It Restart on Its Own<\/h2><p><em>10 minutes. Both courses.<\/em><\/p>\n<p><strong>Optional Short course server session first.<\/strong> Your Module 07 file is one <code>AGENTS.md<\/code>. Ask pi to split it into two files in your <code>AI System<\/code> folder:<\/p>\n<ul>\n<li><code>SOUL<\/code>: the &quot;Who You Are&quot; section<\/li>\n<li><code>RULES<\/code>: every rules section<\/li>\n<\/ul>\n<p>Hermes reads different files at different times (Hermes documentation, &quot;Which File Does What&quot;, seen 2 Oct 2026):<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Your file<\/th>\n<th>Where it goes on the server<\/th>\n<th>When Hermes reads it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>SOUL<\/td>\n<td><code>~/.hermes/SOUL.md<\/code><\/td>\n<td>At the start of every conversation, first<\/td>\n<\/tr>\n<tr>\n<td>RULES<\/td>\n<td>A file named <code>.hermes.md<\/code> in the bot's working folder<\/td>\n<td>At the start of every conversation<\/td>\n<\/tr>\n<tr>\n<td>USER<\/td>\n<td><code>~/.hermes/memories/USER.md<\/code><\/td>\n<td>At the start of every conversation<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Give the bot its own working folder<\/strong> (Annie's Hermes notes).<\/p>\n<ul>\n<li>Hermes reads <code>.hermes.md<\/code> from the folder set as the bot's working folder in its settings.<\/li>\n<li>Annie uses a dedicated folder, never <code>/root<\/code>. Then her other bots do not load the same rules.<\/li>\n<li>Facilitator: confirm the setting's name on the day.<\/li>\n<\/ul>\n<p><strong>Keep the user file short.<\/strong> Annie's settings cap it at 1,375 characters (bot settings, 9 Oct 2026).<\/p>\n<p><strong>Step 33. Copy the files.<\/strong> Ask pi:<\/p>\n<pre><code class=\"language-text\">Copy SOUL, RULES and USER from my vault's AI System folder into the places in this table on my server. Back up anything already there first. Then restart the bot and show me that the restart worked.\n<\/code><\/pre>\n<p><strong>Restart after any change, then start a fresh chat<\/strong> (Annie's Hermes notes).<\/p>\n<ul>\n<li>The bot loads its files when it starts.<\/li>\n<li>An open Telegram chat also keeps the instructions it started with, even after a restart.<\/li>\n<li>So send <code>/new<\/code> after every change.<\/li>\n<\/ul>\n<pre><code class=\"language-bash\">hermes gateway restart\n<\/code><\/pre>\n<p><strong>Step 34. Make it come back on its own.<\/strong> A bot that stops and stays stopped is worse than no bot, because you think it is working. In September 2026 two of Annie's bots stayed connected to nothing for days, and nobody knew (Build Log 76).<\/p>\n<pre><code class=\"language-bash\">hermes gateway install\n<\/code><\/pre>\n<p>This runs the bot as a service that starts with the server. Then ask pi to show you the service file and confirm the four lines below. Here is why they matter (Build Log 78):<\/p>\n<ul>\n<li>Hermes's Telegram connection gives up after about 10 reconnects and exits.<\/li>\n<li>It expects something to restart it.<\/li>\n<li>On 6 September 2026 nothing did.<\/li>\n<\/ul>\n<pre><code class=\"language-text\">Restart=always\nRestartSec=5\nRestartForceExitStatus=75\nStartLimitIntervalSec=0\n<\/code><\/pre>\n<p>Then check that it runs with nobody logged in:<\/p>\n<pre><code class=\"language-bash\">loginctl show-user root --property=Linger\n<\/code><\/pre>\n<p>What success looks like: <code>Linger=yes<\/code>. Annie's builder once reported the restart settings had &quot;vanished&quot;. It had looked in the wrong list of services (Build Log 80).<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08b-s15\"><h2><span class=\"num\">08B.15<\/span> Three Tests: Quoting Rules, Saying It Does Not Know, and Golden Questions<\/h2><p><em>15 minutes. Both courses.<\/em><\/p>\n<p><strong>A restart proves nothing about whether the bot works.<\/strong> When the bot starts, it does not check its model key. Only a real message does (Build Log 94).<\/p>\n<p><strong>Step 35. The hello test.<\/strong> In Telegram, send <code>/new<\/code>, then <code>hello<\/code>. What success looks like: a reply within a few seconds.<\/p>\n<p><strong>Step 36. The quote test.<\/strong> Send:<\/p>\n<pre><code class=\"language-text\">Quote your rule about saving things, word for word.\n<\/code><\/pre>\n<p>Then:<\/p>\n<pre><code class=\"language-text\">What are your standing instructions? List their headings.\n<\/code><\/pre>\n<p>What success looks like: it quotes your save rule exactly and lists the headings from your RULES file.<\/p>\n<p><strong>If it cannot quote them, stop and fix it (Build Log 32).<\/strong><\/p>\n<ul>\n<li>For weeks in July 2026 Annie's rules file was never loaded into her bot.<\/li>\n<li>Asked about one of its rules, the bot said it had none.<\/li>\n<li>Two file links and a restart fixed it.<\/li>\n<li>Annie's guide calls this &quot;the single most instructive bug of the whole build&quot;.<\/li>\n<li>Nothing else you write matters until the bot can read its rules.<\/li>\n<\/ul>\n<p><strong>Step 37. The refusal test (from v1).<\/strong><\/p>\n<ul>\n<li>Send a question your files cannot answer, such as the name of a person you have never mentioned.<\/li>\n<li>The bot must say it does not know.<\/li>\n<li>A made-up answer here is the one failure you must not leave the room with.<\/li>\n<li>Fix the rule and test again.<\/li>\n<\/ul>\n<p><strong>Step 38. Your golden questions<\/strong> from Module 07. These are your test questions with known answers.<\/p>\n<ol>\n<li>Ask each one in a fresh conversation. Send <code>/new<\/code> before each.<\/li>\n<li>Then ask them all again. A right answer once can be luck (guide, Part 5).<\/li>\n<li>Write the results into your build log.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"full-08b-s16\"><h2><span class=\"num\">08B.16<\/span> Same Model, Different Program: Why pi and the Bot Answer Differently<\/h2><p><em>5 minutes. Both courses. Moved here from Module 04, the demo (Pair 4).<\/em><\/p>\n<p><strong>Your pi and your bot now run the same model:<\/strong> DeepSeek V4.1 Flash on opencode Go.<\/p>\n<ul>\n<li>Ask both the same question: &quot;What can you do with my files?&quot;<\/li>\n<li>The answers differ, because the program around the model differs.<\/li>\n<li>pi can read and edit the files on your laptop.<\/li>\n<li>The bot has its own skills and its own rules on the server.<\/li>\n<\/ul>\n<p><strong>The line to say.<\/strong> &quot;The model only answers. The program around it decides what it can read, what it remembers, and what it is allowed to do.&quot;<\/p>\n<p><strong>This is why Annie moved her bots to a new model in one evening.<\/strong> She changed one line in each bot's settings. The skills, rules and limits stayed the same (Build Log 92).<\/p>\n<p><strong>It is also why a Telegram bot is not limited by Telegram (Build Log 23).<\/strong><\/p>\n<ul>\n<li>Annie once assumed her bot could not build software because it was a Telegram bot.<\/li>\n<li>The real reason was that it had been set up as an AI assistant, with no tools to edit files.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-08b-s17\"><h2><span class=\"num\">08B.17<\/span> Homework: A Normal User, a Swap File and a Reboot Test<\/h2><p><strong>A normal user instead of root (Build Log 05; live server check, 2 Oct 2026).<\/strong><\/p>\n<ul>\n<li>Logging in as <code>root<\/code> means every command runs with full power over the machine.<\/li>\n<li>Annie's June 2026 review listed moving her bot off root as the highest-risk change. She deferred it.<\/li>\n<li>Her server still runs the bot as root.<\/li>\n<li>If you choose a normal user, do it before installing anything else, with the facilitator beside you.<\/li>\n<\/ul>\n<p><strong>A swap file (Build Log 95).<\/strong> Swap is disk space the server uses when its memory is full. Without it, a full server stops a program of its own choosing.<\/p>\n<ul>\n<li>In September 2026 Annie's server began logging memory warnings every minute.<\/li>\n<li>The cause: six forgotten Claude Code sessions held 1.5 GB between them.<\/li>\n<li>Closing them freed the memory.<\/li>\n<li>A 2 GB swap file was added, so the server has room to spare next time.<\/li>\n<\/ul>\n<p>What to do:<\/p>\n<ul>\n<li>Ask pi to add a 2 GB swap file that survives a restart, with swappiness set to 10.<\/li>\n<li>Facilitator: confirm the first command on the day, because Build Log 95 does not record how the empty file was made.<\/li>\n<li>Close Claude Code sessions with <code>/exit<\/code> when you finish.<\/li>\n<\/ul>\n<p><strong>The reboot test.<\/strong> &quot;It works&quot; and &quot;it survives a restart&quot; are different claims. Reboot the server once, then check:<\/p>\n<pre><code class=\"language-bash\">tailscale status\nsysctl net.ipv4.ip_forward\nufw status\ntimedatectl\nsystemctl --user status hermes-gateway\n<\/code><\/pre>\n<p>What success looks like:<\/p>\n<ul>\n<li>Tailscale is connected.<\/li>\n<li>Forwarding reads 1.<\/li>\n<li>The firewall is active.<\/li>\n<li>The timezone is Hong Kong.<\/li>\n<li>The bot answers <code>hello<\/code> in Telegram.<\/li>\n<\/ul>\n<p><strong>Private web pages, for later.<\/strong> You may want a small private page some day, such as a dashboard. Keep it reachable only through Tailscale.<\/p>\n<ul>\n<li>Annie first published one page publicly. She moved it back to private in August 2026, because it showed household items (Build Log 64).<\/li>\n<li><strong>A password box in front of a public page protects nothing.<\/strong> The page's content is still sent to anyone who asks. The box only hides it.<\/li>\n<li>To share a page with someone outside your network, encrypt the page itself. Then the public copy cannot be read without the password (Build Log 49).<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-08b-s18\"><h2><span class=\"num\">08B.18<\/span> From the Record<\/h2><p><strong>Luck, not design (Build Logs 05 and 06).<\/strong><\/p>\n<ul>\n<li>For its first month, Annie's server had five secret files that any user on the machine could read. It had no firewall.<\/li>\n<li>Her June 2026 review looked first and changed nothing. It found the gaps and sorted the fixes by risk.<\/li>\n<li>The next day the fixes went in. SSH was allowed before the firewall was switched on, with a second login window open.<\/li>\n<li>The bot kept the same process number throughout. That proved nothing broke.<\/li>\n<li><strong>The lesson.<\/strong> Look before you change. Change in an order that always leaves you able to log in.<\/li>\n<\/ul>\n<p><strong>One VPN instead of two (Build Logs 63 and 64).<\/strong><\/p>\n<ul>\n<li>In August 2026 Annie's phone could run only one VPN at a time.<\/li>\n<li>With her commercial VPN on, Claude worked and her private pages did not. With Tailscale on, the reverse.<\/li>\n<li>She made her Singapore server a Tailscale exit node. One switch did both jobs.<\/li>\n<li>The commercial VPN became unnecessary on the phone, then on the Mac.<\/li>\n<li><strong>The lesson.<\/strong> Before adding a second tool to solve a clash, ask whether the one you already have can do both jobs.<\/li>\n<\/ul>\n<p><strong>The login that expired quietly (Build Log 75).<\/strong><\/p>\n<ul>\n<li>In September 2026 Annie could not open Claude Code on her server from her phone.<\/li>\n<li>She suspected the VPN. But her phone's Claude chat was working at that moment, so the network was fine.<\/li>\n<li>The server's login had expired. Using Claude did not extend it.<\/li>\n<li>The watchdog now warns before the expiry date.<\/li>\n<li><strong>The lesson.<\/strong> When one tool works and another fails on the same device, look at what differs.<\/li>\n<\/ul>\n<p><strong>One provider move, three outages (Build Log 94).<\/strong><\/p>\n<ul>\n<li>On 27 September 2026 Annie moved her bots to a new model provider.<\/li>\n<li>Two bots went down. The new key sat only in the main bot's file, and each bot reads only its own.<\/li>\n<li>The nightly filing job failed. Its model names existed only on the old provider.<\/li>\n<li>Every restart looked healthy, because starting the bot never checks the key.<\/li>\n<li><strong>The lesson.<\/strong> After any change to keys or models, send a real message through every bot.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-08b-s19\"><h2><span class=\"num\">08B.19<\/span> Worksheet: Server and Bot Checklist<\/h2><div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Proof<\/th>\n<th>Course<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Snapshot taken before any change<\/td>\n<td>Snapshot listed in the console<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Key login works; passwords off<\/td>\n<td><code>sshd -T<\/code> shows <code>passwordauthentication no<\/code><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Firewall active<\/td>\n<td><code>ufw status verbose<\/code><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>fail2ban and security updates on<\/td>\n<td><code>fail2ban-client status sshd<\/code><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Timezone is Hong Kong, on the server and in Hermes<\/td>\n<td><code>timedatectl<\/code>; Hermes config<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Laptop, phone and server on Tailscale; key expiry off<\/td>\n<td>Tailscale admin page<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>SSH works only over Tailscale<\/td>\n<td><code>ssh myserver<\/code> works; the public address does not<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Exit node tested<\/td>\n<td><code>loc=SG<\/code> with it on<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Claude Code on the server, signed in, locked to the subscription<\/td>\n<td><code>claude -p<\/code> returns PONG<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Vault copied to the server<\/td>\n<td>A new laptop note appears on the server<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Bot token only in my password manager<\/td>\n<td><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Only my Telegram ID is allowed<\/td>\n<td>The allow-list holds one number<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>.env<\/code> readable by the owner only<\/td>\n<td><code>ls -l<\/code> shows <code>-rw-------<\/code><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Runs as a service with the four restart lines from Step 34; linger on<\/td>\n<td>The service file; <code>Linger=yes<\/code><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Quote test passed<\/td>\n<td>It quoted my save rule exactly<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Refusal test passed<\/td>\n<td>It said it did not know<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Golden questions passed twice, in fresh conversations<\/td>\n<td>My build log<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>\n<section class=\"card\" id=\"full-08b-s20\"><h2><span class=\"num\">08B.20<\/span> Teaching Notes<\/h2><ul>\n<li><strong>This is the hardest part of either course.<\/strong> There are three students at most. The facilitator sits beside each one in turn. Never take the keyboard.<\/li>\n<li><strong>The second SSH window is the most important habit.<\/strong> Check every student has one open before Step 8.<\/li>\n<li><strong>Some students' servers will not be ready.<\/strong> They sit beside a neighbour. They finish at home with this checklist, with the facilitator on a call for Steps 6 to 10. They must not do the lock-down steps alone without the second window.<\/li>\n<li><strong>pi cannot answer prompts that need typing.<\/strong> The student runs these in their own window, and pi gives them the command:\n<ul>\n<li>passphrases and passwords<\/li>\n<li><code>tailscale up<\/code> approvals<\/li>\n<li>the Claude sign-in<\/li>\n<li><code>hermes gateway setup<\/code><\/li>\n<\/ul>\n<\/li>\n<li><strong>Tokens and keys get pasted into the wrong places.<\/strong> Before the bot segments, remind every student that a bot token is a password.<\/li>\n<li><strong>Provider consoles differ.<\/strong> Show one provider on screen. Tell students to find the same button on theirs.<\/li>\n<li><strong>The exit node and the terms question:<\/strong> keep it factual, as in Module 01.<\/li>\n<li><strong>Timing risk: Tailscale and the exit node take longest.<\/strong> If the room is behind at 75 minutes, copying the vault to the server becomes homework.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-08b-s21\"><h2><span class=\"num\">08B.21<\/span> Not Yet Tested<\/h2><ul>\n<li><strong>The whole order, with pi running every step.<\/strong> Annie's own test on a fresh server, from Hong Kong, no VPN, exit node off (Merge Tracker, item 6).<\/li>\n<li><strong>From the Claude version, still untested:<\/strong>\n<ul>\n<li>the server sign-in flow for Claude Code<\/li>\n<li>the Obsidian server sync (no written steps)<\/li>\n<li>the normal-user change<\/li>\n<li>the swap file's first command<\/li>\n<li><code>ssh-copy-id<\/code> on Windows<\/li>\n<li>the Hermes install script<\/li>\n<li><code>hermes gateway setup<\/code><\/li>\n<li>the opencode Go set-up in Hermes<\/li>\n<li>the working-folder setting for <code>.hermes.md<\/code><\/li>\n<\/ul>\n<\/li>\n<li><strong>New here:<\/strong>\n<ul>\n<li>pi running server commands over SSH from the laptop<\/li>\n<li>splitting <code>AGENTS.md<\/code> into SOUL and RULES for the optional Short course server session<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/section>\n<details class=\"card ref\" id=\"full-08b-s22\"><summary><span class=\"num\">08B.22<\/span> Where the Versions Went <span class=\"hint\">tap to open<\/span><\/summary><p><strong>Kept from the Claude version's Module 12:<\/strong><\/p>\n<ul>\n<li>the four safety rules (snapshot first, an automatic undo timer, one change at a time, the web console)<\/li>\n<li>every server step<\/li>\n<li>Tailscale and the exit node<\/li>\n<li>Claude Code and the vault on the server<\/li>\n<li>the daily routine for opening Claude Code on the server<\/li>\n<li>swap, the reboot test and private pages (now homework)<\/li>\n<li>three of its stories<\/li>\n<\/ul>\n<p><strong>Kept from the Claude version's Module 13:<\/strong><\/p>\n<ul>\n<li>the Telegram bot<\/li>\n<li>the Hermes install<\/li>\n<li>the model settings block for <code>config.yaml<\/code><\/li>\n<li>the table of where each file goes on the server<\/li>\n<li>the restart settings<\/li>\n<li>the quote test (the bot quotes your rules word for word) and the golden questions (test questions with known answers)<\/li>\n<li>two stories<\/li>\n<\/ul>\n<p><strong>Moved out of Module 13:<\/strong> separate bots for other people, model testing and attack lists. They go to the module on growing your system (Module 11) (Pair 11).<\/p>\n<p><strong>Kept from v1:<\/strong> the refusal test, and the stories from Logs 05, 06, 49 and 63 (moved from Pair 2 and Pair 1).<\/p>\n<p><strong>Moved in from Pair 4:<\/strong> &quot;same model, different program&quot;, where you ask pi and the bot the same question. It needs the bot and pi on the same model.<\/p>\n<p><strong>Errors fixed:<\/strong><\/p>\n<ul>\n<li><strong>The Claude version's VPN gap.<\/strong> Its Module 12 told students to switch off any commercial VPN before Tailscale. That cut off Claude Code in Hong Kong until the exit node worked. Now pi drives every step, and pi needs no route out of Hong Kong.<\/li>\n<li><strong>The timer story.<\/strong> The Claude version said a ten-minute timer guarded the closing of public SSH. Build Log 103 says it guarded a change to which accounts may log in, and that public SSH was already closed. The story is corrected. The technique is still taught for closing public SSH.<\/li>\n<li><strong>The two-VPNs story<\/strong> is cited to Build Log 64, where it happened, not Build Log 63.<\/li>\n<li><strong>The server is in Singapore.<\/strong> Build Log 63 says &quot;the VPS lives in the EU&quot;. Build Log 64 records the Mac's address through the server as Singapore. v1's Log 63 story now says Singapore.<\/li>\n<li><strong>Obsidian Sync<\/strong> is now pre-work for this module, not the next session.<\/li>\n<li><strong>Register:<\/strong> four phrases are fixed.\n<ul>\n<li>&quot;Lock the Doors&quot; is now &quot;Secure the Server&quot;.<\/li>\n<li>The phrase &quot;your back door&quot; now says what the console does.<\/li>\n<li>The word &quot;cushion&quot; is rewritten.<\/li>\n<li>The phrase &quot;the moment of truth&quot; is gone.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"full-08b-s23\"><summary><span class=\"num\">08B.23<\/span> Sources <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>How to Build Your Own Claudith guide, Parts 3 and 5: let the builder drive; timezone first; luck, not design; golden questions twice.<\/li>\n<li>Build Log 00: the first snapshot; the passphrase not set; the timezone note that was wrong.<\/li>\n<li>Build Logs 02, 25, 97 and 104: the vault on the server and the sync facts.<\/li>\n<li>Build Logs 05 and 06: the review, the hardening order, the bot unbroken throughout.<\/li>\n<li>Build Log 14: the blank timezone setting in the bot.<\/li>\n<li>Build Log 23: the program behind the chat app decides what the bot can do.<\/li>\n<li>Build Log 32: the rules file that was never loaded; the quote test.<\/li>\n<li>Build Log 46: Claude Code moved to the server; the cold test there.<\/li>\n<li>Build Log 49: a password box protects nothing; encrypt the page.<\/li>\n<li>Build Log 52: allow-lists and finding your Telegram ID.<\/li>\n<li>Build Log 63: one VPN at a time; the exit node; the long pasted command.<\/li>\n<li>Build Log 64: the VPN that took over address lookups; Singapore; persistent forwarding; key expiry; a public page made private.<\/li>\n<li>Build Log 68: Android exclude mode.<\/li>\n<li>Build Log 69: the routing designs that were removed.<\/li>\n<li>Build Log 75: the server login that expired.<\/li>\n<li>Build Log 76: two bots that stopped in silence.<\/li>\n<li>Build Log 78: the four restart lines.<\/li>\n<li>Build Log 80: the slow tutor bot; checking the wrong list of services.<\/li>\n<li>Build Log 92: the model block; changing model in one line.<\/li>\n<li>Build Log 94: one provider move, three outages.<\/li>\n<li>Build Log 95: six forgotten sessions and the swap file.<\/li>\n<li>Build Log 102: locked out with Tailscale off.<\/li>\n<li>Build Log 103: small settings files; the ten-minute undo timer and <code>AllowUsers<\/code>; public SSH already closed; 403 from Hong Kong, 401 through Singapore; pi on the server; device-labelled keys.<\/li>\n<li>Build Log 105 and the &quot;How To Open Claude on the VPS&quot; note: first login from Hong Kong; the daily routine.<\/li>\n<li>Annie's Hermes notes: the rules file's working folder; a chat keeps its starting instructions until <code>/new<\/code>.<\/li>\n<li>Live server and system check, 2 Oct 2026; bot settings, 9 Oct 2026.<\/li>\n<li>Hermes Agent repository and documentation, Tailscale pricing and Obsidian Sync pricing, seen 2 Oct 2026.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"full-08b-s24\"><summary><span class=\"num\">08B.24<\/span> Related <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>08 — The Build (Merged)<\/li>\n<li>07 — Rules of Engagement (Merged)<\/li>\n<li>03 — Architecture and Where Your System Lives (Merged)<\/li>\n<li>01 — Merge Tracker (Decisions, Hours, Checks)<\/li>\n<li>00 — Side-by-Side (9 Oct 2026) (Pair 8)<\/li>\n<\/ul>\n<\/details>", "count": 24}, {"id": "full-08c", "label": "08C Build", "title": "Module 08C: The Build, After the Server (Part B in the file)", "minutes": 100, "read": 21, "toc": [["full-08c-s1", "08C.1", "Claude Code Through Your Own Route"], ["full-08c-s2", "08C.2", "Your Window and Four Settings"], ["full-08c-s3", "08C.3", "The Cold Test Again, for Claude Code"], ["full-08c-s4", "08C.4", "Continuity and the Start-of-Session Hook"], ["full-08c-s5", "08C.5", "The Build Log"], ["full-08c-s6", "08C.6", "The Run Card"], ["full-08c-s7", "08C.7", "Say What You Want, Not Every Step"], ["full-08c-s8", "08C.8", "The One Tool You Cannot Lose"], ["full-08c-s9", "08C.9", "From the Record"], ["full-08c-s10", "08C.10", "Worksheet"], ["full-08c-s11", "08C.11", "Teaching Notes"], ["full-08c-s12", "08C.12", "Not Yet Tested"]], "body": "<div class=\"intro\"><p><em>Start this half only after Module 08B's exit node test passes (08B, Step 21).<\/em><\/p>\n<\/div>\n<section class=\"card\" id=\"full-08c-s1\"><h2><span class=\"num\">08C.1<\/span> Claude Code Through Your Own Route<\/h2><p><em>15 minutes.<\/em><\/p>\n<p>Your server is now your route out of Hong Kong.<\/p>\n<ul>\n<li><strong>Exit node on:<\/strong> your laptop's internet traffic goes out through Singapore. Anthropic serves Singapore.<\/li>\n<li><strong>Exit node off:<\/strong> your laptop is a normal Hong Kong laptop again (Module 08B).<\/li>\n<\/ul>\n<p><strong>Step 1. Turn the exit node on.<\/strong> In the Tailscale menu, choose your server as the exit node.<\/p>\n<p><strong>Step 2. Check where your laptop appears to be.<\/strong><\/p>\n<pre><code class=\"language-bash\">curl -s https://1.1.1.1/cdn-cgi/trace | grep loc\n<\/code><\/pre>\n<p><strong>It passed if<\/strong> it prints <code>loc=SG<\/code>. If it prints <code>loc=HK<\/code>, the exit node is not on. Stop here and fix that first.<\/p>\n<p><strong>Step 3. Install Claude Code.<\/strong><\/p>\n<pre><code class=\"language-bash\">curl -fsSL https://claude.ai/install.sh | bash\n<\/code><\/pre>\n<p>On Windows, in PowerShell (facilitator: check Anthropic's install page on the day):<\/p>\n<pre><code class=\"language-powershell\">irm https://claude.ai/install.ps1 | iex\n<\/code><\/pre>\n<p>To check it worked: quit and reopen Terminal. Type <code>claude --version<\/code>. It should print a number.<\/p>\n<p><strong>Step 4. Start Claude Code in your vault and sign in.<\/strong><\/p>\n<ol>\n<li>Go to your vault folder.<\/li>\n<li>Type <code>claude<\/code>.<\/li>\n<li>Choose <strong>&quot;Claude account with subscription&quot;<\/strong>.<\/li>\n<li>A browser opens. Sign in there.<\/li>\n<li>When it asks whether to trust this folder, answer <strong>Yes<\/strong>.<\/li>\n<\/ol>\n<p><strong>If it signs in to the wrong account:<\/strong><\/p>\n<ol>\n<li>Sign out of claude.ai in your browser.<\/li>\n<li>Type <code>/login<\/code> inside Claude Code.<\/li>\n<\/ol>\n<p>Claude Code signs in to whichever account your browser has open (Build Log 61).<\/p>\n<p><strong>Claude Code on the laptop needs the exit node on, every time.<\/strong> pi does not. Annie keeps her exit node off most of the time. She turns it on when she wants Claude on the laptop. She can also use Claude Code on the server, which needs no route (Module 08B, &quot;Your Daily Routine&quot;).<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08c-s2\"><h2><span class=\"num\">08C.2<\/span> Your Window and Four Settings<\/h2><p><em>15 minutes. Annie's additions of 10 Oct 2026 are marked.<\/em><\/p>\n<h3>Where You Run It<\/h3>\n<p>Module 01 showed you your terminal window and Annie's notes on it (Module 01, &quot;Your Terminal Window for the Rest of the Course&quot;). The notes cover:<\/p>\n<ul>\n<li>using a terminal (Terminal or Ghostty) instead of the desktop app<\/li>\n<li>scrolling<\/li>\n<li>copy and paste<\/li>\n<li>the status line<\/li>\n<li>the keys<\/li>\n<\/ul>\n<p>In this section you make the changes, because both builders are now installed.<\/p>\n<p><em>Moved 10 Oct 2026: Annie's notes now live in Module 01, where students first open a terminal. Only the setup steps stay here.<\/em><\/p>\n<h3>Let pi Make the Changes<\/h3
