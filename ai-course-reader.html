our Data Map.<\/strong> Some jobs need Tier 3 data, such as passwords, ID numbers or bank details. Cross those jobs off. Or redesign them, so that data never enters the system.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-04-s11\"><h2><span class=\"num\">04.11<\/span> How to Close the Module<\/h2><p>Close with this line (from v1):<\/p>\n<p><em>&quot;Everything you just saw started as the same sheet of paper you are about to fill in. Nothing here was built in one go, and most of it was built after something broke.&quot;<\/em><\/p>\n<p>Then hand out the sticky notes for the next module.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-04-s12\"><h2><span class=\"num\">04.12<\/span> What Not to Do<\/h2><div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Do not<\/th>\n<th>Why<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Show a capability you would have to explain for five minutes<\/td>\n<td>If it needs a long introduction, it is not ready to show<\/td>\n<\/tr>\n<tr>\n<td>Show anything built in the last week<\/td>\n<td>New work has not met real use yet, and it may change before class<\/td>\n<\/tr>\n<tr>\n<td>Skip the failures<\/td>\n<td>The failure stories are what make the room trust the rest<\/td>\n<\/tr>\n<tr>\n<td>Show a student's real data on screen<\/td>\n<td>Module 02 applies to the demo too<\/td>\n<\/tr>\n<tr>\n<td>Let a segment run long<\/td>\n<td>Each segment has a hard stop. A long demo loses the room<\/td>\n<\/tr>\n<tr>\n<td>Take questions during a demo<\/td>\n<td>Write them on a visible list and answer at the end<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>\n<section class=\"card\" id=\"full-04-s13\"><h2><span class=\"num\">04.13<\/span> Teaching Notes<\/h2><ul>\n<li><strong>Expect &quot;can it do X for me?&quot; questions.<\/strong> Write each one on the board. Module 09 (Script, Machine Learning or AI Judgement) decides which ones need AI at all.<\/li>\n<li><strong>Do not let the demo turn into a sales pitch.<\/strong> Annie's notes describe this audience. They lose interest at hype, fear and shallow demos. They respond to real stories (Seminar research brief).<\/li>\n<li><strong>Watch the room.<\/strong> When a student's face changes at a demo, that job is probably on their Wish List. Mention it when they map their processes in the next module.<\/li>\n<li><strong>Say which demos they will build.<\/strong>\n<ul>\n<li>Full course: the storage-style bot, the scheduled jobs, the watchdog and the cost cap are all built later in the course.<\/li>\n<li>Short course: the laptop builds cover the filing and the Wish List jobs. A bot that runs while the laptop is closed needs the optional server sitting.<\/li>\n<\/ul>\n<\/li>\n<li><strong>The waiting-on list (the Chaser, which tracks things Annie is waiting on until she marks them done) is not shown.<\/strong> Both earlier versions described it as running. It has been paused since late September 2026 (Boss Admin Moves note, checked 6 Oct).<\/li>\n<li><strong>&quot;Same model, different program&quot; (pi and the bot give different answers with the same model) moved to the build module (Module 08).<\/strong> It needs pi running live, and students have pi open there anyway.<\/li>\n<li><strong>When the demo vault exists,<\/strong> live demos and recordings may come back, but only from that vault.<\/li>\n<li><strong>Do not quote the &quot;no two physical activities on the same day&quot; rule.<\/strong> It shows in <code>Kids Gym (edited)<\/code>, but Annie deleted it from the live bot on 24 Jul 2026. If someone asks to see it fire, it will not. Point at the nap check and the clash reasons instead (Boss Admin Moves note, warning box under &quot;Calendar with YOUR house rules&quot;).<\/li>\n<\/ul>\n<p><strong>Changed 10 Oct 2026 (Annie chose the Demo 2 jobs):<\/strong><\/p>\n<ul>\n<li>Demo 2 now shows the invoice claims, calendar jobs (four examples), and adding a task to the to-do list.<\/li>\n<li>New in Demo 2: her son's calendar checked against his nap and rules, a friend's messages becoming an event, the anniversary catch, and the to-do receipt. All four already had edited screenshots.<\/li>\n<li>The morning brief left Demo 2, then came back the same day at Annie's request, as &quot;the morning brief, two ways&quot;: her bot's brief, and the Gemini &quot;helper-day&quot; Skill with a real message it wrote. The segment stays at 10 minutes. Demo 2 now shows each screenshot in the page (Annie's request).<\/li>\n<li>The Chaser (open loops tracked until done) and the credit card bill watch were moved out of the Boss Admin Moves lineup into a new section, &quot;Built, But Not Useful&quot;. Neither was in this module.<\/li>\n<\/ul>\n<h3>Facilitator Checklist<\/h3>\n<p>Do this before the room arrives.<\/p>\n<ul>\n<li class=\"task\"><span class=\"box\"><\/span><strong>Show only the copies in <code>Seminar Screenshots/Edited (invented names)/<\/code>.<\/strong> Never open the folder above it in class. It holds the originals.<\/li>\n<li class=\"task\"><span class=\"box\"><\/span><strong>Never open <code>_Name Map (private).md<\/code> or <code>_Move Manifest.md<\/code> on the projector.<\/strong> They list the real names.<\/li>\n<li class=\"task\"><span class=\"box\"><\/span><strong>Do not say a real name aloud.<\/strong> Two family first names are the only real names on screen. Every other person, clinic and amount in the edited copies is invented. Use the names on the screen.<\/li>\n<li class=\"task\"><span class=\"box\"><\/span><strong>No client names, deal information or work methods<\/strong> appear anywhere.<\/li>\n<li class=\"task\"><span class=\"box\"><\/span><strong>Notifications are off<\/strong> on the laptop and the phone.<\/li>\n<li class=\"task\"><span class=\"box\"><\/span><strong>The screenshots are readable from the back row.<\/strong> Zoom in before class and check.<\/li>\n<li class=\"task\"><span class=\"box\"><\/span><strong>The screenshots are saved on the laptop,<\/strong> so the demo works without Wi-Fi.<\/li>\n<\/ul>\n<\/section>\n<details class=\"card ref\" id=\"full-04-s14\"><summary><span class=\"num\">04.14<\/span> Where the Two Versions Went <span class=\"hint\">tap to open<\/span><\/summary><p><strong>Taken from v1:<\/strong><\/p>\n<ul>\n<li>the rule for the whole module: never show a capability without its cost<\/li>\n<li>the cost demo<\/li>\n<li>the Log 74 story (the sorter that reported &quot;ok&quot; for weeks)<\/li>\n<li>&quot;What Not to Do&quot;<\/li>\n<li>the closing line that leads into the next module<\/li>\n<li>the &quot;watch the room&quot; note<\/li>\n<\/ul>\n<p><strong>Dropped from v1:<\/strong><\/p>\n<ul>\n<li>The live inbox sorter and the live bot conversation. Both would show real notes and real memory.<\/li>\n<li>&quot;The Rest of the Reel&quot;, v1's three extra demos cut for time. Its morning brief is in Demo 2, and its waiting-on list is paused. <em>(10 Oct 2026: the morning brief left Demo 2 when Annie chose the jobs. See the dated note in Teaching Notes.)<\/em><\/li>\n<\/ul>\n<p><strong>Taken from the Claude version:<\/strong><\/p>\n<ul>\n<li>the run sheet<\/li>\n<li>&quot;What This System Is For&quot;<\/li>\n<li>the storage demo<\/li>\n<li>the jobs demo<\/li>\n<li>the warranty card<\/li>\n<li>the Wish List<\/li>\n<li>the facilitator checklist<\/li>\n<\/ul>\n<p><strong>Changed from the Claude version:<\/strong><\/p>\n<ul>\n<li>The Wish List has four columns, not seven.<\/li>\n<li>The checklist's naming line now points at the edited copies.<\/li>\n<li>The Claude version's Demo D, the overnight sync jam (Log 44), is replaced by the watchdog screenshot. The reasons: the screenshot exists, and the jam story's claim that the watchdog messaged first has no source in Log 44.<\/li>\n<li>The weather planner, the Claude version's Demo E and the record stories from Logs 00 and 91 are dropped from this module.<\/li>\n<\/ul>\n<p><strong>Errors fixed:<\/strong><\/p>\n<ul>\n<li>The receipt times now come from the screenshot (20:00), not the Claude version's 5:45 pm and 6:05 pm.<\/li>\n<li>v1 claimed a bot refused to take credit for another AI assistant's work (Logs 54 and 93). That claim is dropped, because neither log records it.<\/li>\n<li>v1's &quot;six weeks&quot; for Log 75 is dropped, together with &quot;The Rest of the Reel&quot;.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"full-04-s15\"><summary><span class=\"num\">04.15<\/span> Sources <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>Build Log 30: the receipt flow and its six bugs.<\/li>\n<li>Build Log 48: the storage catalogue and the one assumption.<\/li>\n<li>Build Log 72: the presence framing.<\/li>\n<li>Build Log 74: the sorter that reported &quot;ok&quot; for weeks.<\/li>\n<li>Build Log 80: code counts, the model reads.<\/li>\n<li>Build Log 89: the $20 cap, and $8.36 for 19.06 million tokens.<\/li>\n<li>Annie's ruling, 27 Aug 2026: a job you must remember to start is not finished.<\/li>\n<li>Annie's ruling, 9 Oct 2026: edited screenshots now; live demos and recordings only from a demo vault.<\/li>\n<li>Seminar Ideas: What To Show People (29 Sep 2026) and Boss Admin Moves — Seminar Demo Lineup (warranty card, 1 Oct 2026; waiting-on list paused, checked 6 Oct).<\/li>\n<li>The edited screenshots named in the run sheet, each opened and read on 9 Oct 2026.<\/li>\n<li>Boss Admin Moves note, read 10 Oct 2026: the friend's-messages calendar add and the to-do receipt (6 Oct 2026); the anniversary catch (9 Oct 2026); the deleted &quot;no two physical activities&quot; rule (24 Jul 2026).<\/li>\n<li>The new Demo 2 screenshots (<code>Kids Gym<\/code>, <code>Beach Day Calendar Add<\/code>, both <code>Anniversary Clash<\/code> shots, <code>Adding Task to To Do List<\/code>, the Gemini Skills list <code>Gemini/Screenshot 2026-10-05 at 8.14.35 PM<\/code>, and <code>Gemini/Daily Msg for Helper<\/code>, added by Annie at 16:43, all edited copies), opened and read on 10 Oct 2026.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"full-04-s16\"><summary><span class=\"num\">04.16<\/span> Related <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>03 — Architecture and Where Your System Lives (Merged)<\/li>\n<li>02 — Privacy, Security and Whose Law Reaches Your Data (Merged)<\/li>\n<li>01 — Merge Tracker (Decisions, Hours, Checks)<\/li>\n<li>00 — Side-by-Side (9 Oct 2026) (Pair 4)<\/li>\n<\/ul>\n<\/details>", "count": 16}, {"id": "full-05", "label": "05", "title": "Module 05: Your Processes on Paper", "minutes": 60, "read": 14, "toc": [["full-05-s1", "05.1", "What You Will Leave With"], ["full-05-s2", "05.2", "Before This Module"], ["full-05-s3", "05.3", "Why Paper Comes First"], ["full-05-s4", "05.4", "The Six Parts of Every Process"], ["full-05-s5", "05.5", "Who Checks This?"], ["full-05-s6", "05.6", "Map Process One"], ["full-05-s7", "05.7", "Keep One To-Do List and One Inbox"], ["full-05-s8", "05.8", "Ten Questions to Answer Before You Build"], ["full-05-s9", "05.9", "From the Record"], ["full-05-s10", "05.10", "Exercise: A Partner Reads Your Map"], ["full-05-s11", "05.11", "Worksheet: Process Card"], ["full-05-s12", "05.12", "Teaching Notes"]], "body": "<section class=\"card\" id=\"full-05-s1\"><h2><span class=\"num\">05.1<\/span> What You Will Leave With<\/h2><p><strong>Two Process Cards.<\/strong> You make one for each of the top two jobs on your Wish List. Each card shows:<\/p>\n<ul>\n<li>what starts the process<\/li>\n<li>every step<\/li>\n<li>who checks it<\/li>\n<li>what it produces<\/li>\n<li>how you know it is finished<\/li>\n<\/ul>\n<p><strong>What happens to the cards later.<\/strong><\/p>\n<ul>\n<li>The script-or-AI module (Module 09) marks each step as a job for code, for an AI model, or for you.<\/li>\n<li>Your best candidate becomes your first automation in the skills and schedules module (Module 11).<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-05-s2\"><h2><span class=\"num\">05.2<\/span> Before This Module<\/h2><ul>\n<li><strong>Your Wish List from Module 04,<\/strong> with your top two jobs circled.<\/li>\n<li><strong>Your Data Map from Module 02.<\/strong><\/li>\n<li><strong>Sticky notes in five colours, and a marker.<\/strong> The facilitator supplies these. At home, any five colours work.<\/li>\n<li><strong>A real example.<\/strong> Your process may start with an email or a form. If so, have a recent one open on your phone.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-05-s3\"><h2><span class=\"num\">05.3<\/span> Why Paper Comes First<\/h2><p><strong>An unmapped process keeps its mistakes.<\/strong> If you automate it, the mistakes happen faster.<\/p>\n<p><strong>Annie's example.<\/strong> In August 2026 Annie drew a map of her whole system before she added anything new. The map showed that her real problems were not missing features. They were problems like these (Build Log 62):<\/p>\n<ul>\n<li>&quot;when I move a folder, three things silently break&quot;<\/li>\n<li>&quot;nobody is checking whether last night's job actually ran&quot;<\/li>\n<\/ul>\n<p><strong>Paper keeps the AI out of the room for now.<\/strong> You are not asking anything to be built. You are writing down what really happens. Later, the builder works from facts instead of guesses.<\/p>\n<p><strong>Aim for clarity, not tidiness.<\/strong> A messy sheet that shows a missing step is worth more than a neat sheet that hides it. For any process, you should know four things (from v1):<\/p>\n<ul>\n<li>what starts it<\/li>\n<li>what ends it<\/li>\n<li>who checks it<\/li>\n<li>where it waits<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-05-s4\"><h2><span class=\"num\">05.4<\/span> The Six Parts of Every Process<\/h2><p>Every process has six parts. Use the colours below. Output and done-signal are both green, because both sit at the end of the line.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Part<\/th>\n<th>Sticky note colour<\/th>\n<th>The question it answers<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Trigger<\/strong><\/td>\n<td>Blue<\/td>\n<td>What actually arrives that starts this?<\/td>\n<\/tr>\n<tr>\n<td><strong>Steps<\/strong><\/td>\n<td>Yellow<\/td>\n<td>What happens, one action per note?<\/td>\n<\/tr>\n<tr>\n<td><strong>Decisions<\/strong><\/td>\n<td>Pink<\/td>\n<td>Where does someone have to judge something?<\/td>\n<\/tr>\n<tr>\n<td><strong>Owner and approver<\/strong><\/td>\n<td>Orange<\/td>\n<td>Who checks it, and who must say yes before anything reaches another person?<\/td>\n<\/tr>\n<tr>\n<td><strong>Output<\/strong><\/td>\n<td>Green<\/td>\n<td>What real thing exists at the end: a file, a reply, a payment, a calendar entry?<\/td>\n<\/tr>\n<tr>\n<td><strong>Done-signal<\/strong><\/td>\n<td>Green<\/td>\n<td>How do you know it is finished, without checking by hand?<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Start from the thing that actually arrives.<\/strong> This is Annie's own design rule. It shaped one of her most useful automations (Build Log 30).<\/p>\n<ul>\n<li>A medical receipt that needs an insurance claim arrives by email.<\/li>\n<li>Sometimes it arrives the day after the appointment.<\/li>\n<li>An automation that started from the appointment would look too early and miss receipts.<\/li>\n<li>So the email is the trigger.<\/li>\n<li>The calendar has one smaller job. If an expected receipt has not arrived after 4 days, the system says so once.<\/li>\n<\/ul>\n<p><strong>Write every small step.<\/strong> &quot;Do the claim&quot; is not a step. Written out, Annie's receipt chore has six steps:<\/p>\n<ol>\n<li>Check email.<\/li>\n<li>Find the file.<\/li>\n<li>Download it.<\/li>\n<li>Rename it to fit the claim app's 15-character limit (Build Log 30).<\/li>\n<li>Upload it.<\/li>\n<li>Remember to do all of this on the right day.<\/li>\n<\/ol>\n<p>Small steps show you which steps a script could do from start to finish.<\/p>\n<h3>A Worked Example: Receipts That Need a Claim<\/h3>\n<p>This is the card Annie wrote for her receipt chore.<\/p>\n<ul>\n<li><strong>Trigger:<\/strong> an email with a receipt attached arrives from a known clinic.<\/li>\n<li><strong>Steps:<\/strong>\n<ol>\n<li>Find the email.<\/li>\n<li>Download the file.<\/li>\n<li>Rename it to 15 characters or fewer.<\/li>\n<li>Send it to my phone at a time I can act.<\/li>\n<li>Upload it to the claim app.<\/li>\n<li>Log that it is done.<\/li>\n<\/ol>\n<\/li>\n<li><strong>Decisions:<\/strong> Is this a receipt I can claim? Whose claim is it?<\/li>\n<li><strong>Owner and approver:<\/strong> Me. The insurer requires me to submit the claim myself.<\/li>\n<li><strong>Output:<\/strong> a claim submitted, with the file named correctly.<\/li>\n<li><strong>Done-signal:<\/strong> I reply &quot;done&quot; and the system logs it.<\/li>\n<li><strong>Never-arrives check:<\/strong> an appointment happened but no receipt came within 4 days. The system sends one message, once.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-05-s5\"><h2><span class=\"num\">05.5<\/span> Who Checks This?<\/h2><p><em>Full course segment. In the Short course, give the one-sentence version during Step 4.<\/em><\/p>\n<p><strong>Ask this about every process: who checks the result?<\/strong> Then ask how quickly they would notice if it were wrong. This is not about who does the work. It is about who would see the mistake.<\/p>\n<p><strong>Mark a step &quot;nobody&quot; when no one checks it.<\/strong> This is often the most honest note on the sheet. Some &quot;nobody&quot; steps still get done. Usually you are doing them, in the margins, and no one notices. (From v1.)<\/p>\n<p><strong>A &quot;nobody&quot; step can be automated only after you name someone to check its results.<\/strong> An automation on an unchecked step makes it worse. It produces wrong results faster and with more confidence.<\/p>\n<p><strong>Annie's example (Build Log 74).<\/strong> Her nightly filing job reported success every night for weeks. All that time, it was filing notes into the wrong folder. Nothing checked where the notes ended up.<\/p>\n<p><strong>So write a name next to every &quot;nobody&quot;.<\/strong> The name can be yours.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-05-s6\"><h2><span class=\"num\">05.6<\/span> Map Process One<\/h2><p><strong>Step 1. Write the trigger.<\/strong> Put one blue note at the left. Write what arrives, in plain words. If no thing arrives, write the time instead, such as &quot;every Sunday at 6 pm&quot;.<\/p>\n<p><strong>Step 2. Lay out the steps.<\/strong> Use one yellow note per action, from left to right. Use verbs: check, find, copy, rename, send, remember.<\/p>\n<p><strong>Step 3. Mark the decisions.<\/strong> Some steps need judgement. Swap each of those for a pink note. &quot;Is this urgent?&quot; is a decision. &quot;Copy the date&quot; is not.<\/p>\n<p><strong>Step 4. Add the people.<\/strong> Some steps need someone to say yes before something reaches another person. Put an orange note above each of those. Mark any step that no one checks as &quot;nobody&quot;.<\/p>\n<p><strong>Step 5. Score the pain.<\/strong> On each yellow note, write 1 to 3 for how much you dislike that step. (From v1.)<\/p>\n<p><strong>Step 6. Write the output and the done-signal.<\/strong> Use two green notes. One is the real thing produced. The other is how you know it is finished.<\/p>\n<p><strong>Step 7. Add the never-arrives check.<\/strong> Ask: what if the trigger never comes? Write what should happen on a final note.<\/p>\n<p><strong>What success looks like.<\/strong> Someone else can read your notes from left to right. They can do the job without asking you a question.<\/p>\n<p><strong>If you get stuck, your process is probably too big.<\/strong> Cut it in half and map only the first half.<\/p>\n<ul>\n<li>&quot;Manage family admin&quot; is too big.<\/li>\n<li>&quot;Book my son's classes without clashes&quot; is the right size.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-05-s7\"><h2><span class=\"num\">05.7<\/span> Keep One To-Do List and One Inbox<\/h2><p><em>Full course segment.<\/em><\/p>\n<p>Two habits make every later automation simpler.<\/p>\n<p><strong>Habit one: keep one to-do list, pinned (Build Log 13).<\/strong><\/p>\n<ul>\n<li>In June 2026 Annie had two to-do lists. So she trusted neither.<\/li>\n<li>She moved the one unique item across and deleted the extra list.<\/li>\n<li>She pinned the master list as <code>_TO DO.md<\/code> at the top of her inbox.<\/li>\n<li>The underscore keeps the list at the top of the folder.<\/li>\n<li>The underscore also tells her filing job to leave the list alone.<\/li>\n<li>This rule is written in two places: the job's code and the job's written rules. So both agree.<\/li>\n<\/ul>\n<p><strong>Habit two: keep the inbox as the only holding area (Build Log 74).<\/strong><\/p>\n<ul>\n<li>Annie's filing job once moved notes into an in-between folder called <code>_processed<\/code>. It did not move them into their real homes.<\/li>\n<li>The folder looked like finished work, so nobody opened it.<\/li>\n<li>The notes sat there for weeks.<\/li>\n<li>Her rule since then: a note is either filed into its real home, or it stays in the inbox with a visible reason.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-05-s8\"><h2><span class=\"num\">05.8<\/span> Ten Questions to Answer Before You Build<\/h2><p>Answer these questions for process one. Annie asks these questions before she builds anything. Each one comes from something she learned while building.<\/p>\n<ol>\n<li>Which steps need judgement, and which only move information from one place to another?<\/li>\n<li>When it goes wrong today, who notices, and how fast?<\/li>\n<li>What information in this process must never leave your own accounts? Check your Data Map.<\/li>\n<li>If it worked perfectly, what would you do with the time back?<\/li>\n<li>Is this a task you dislike, that happens often, and where a mistake is cheap? Those are the best first projects.<\/li>\n<li>Have you tried to automate it before? What happened?<\/li>\n<li>Does anything in this process go to another person, such as a teacher, a helper or a family member? Who says yes before it does?<\/li>\n<li>What does a mistake cost: a redo, an apology, or real harm?<\/li>\n<li>Which apps or accounts would it need to read, and whose name is each one in?<\/li>\n<li>What would make you trust it enough to stop checking it by hand?<\/li>\n<\/ol>\n<p><strong>Your answer to question 10 is your definition of done.<\/strong> On day one, Annie wrote her measure of success: mental load removed, multiplied by trust (Hermes Master Doc). Some jobs run, but you still check them by hand. Those jobs have not removed the load.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-05-s9\"><h2><span class=\"num\">05.9<\/span> From the Record<\/h2><p><strong>The bill reminder that ten minutes of checking stopped (Build Log 41).<\/strong><\/p>\n<ul>\n<li><strong>The plan, 27 Jul 2026.<\/strong> A credit card statement email arrives. The bot sends the amount and the due date. Annie replies &quot;paid&quot;.<\/li>\n<li><strong>The check.<\/strong> Annie read real emails for ten minutes before writing any code. This broke three assumptions:\n<ul>\n<li>One bank had not sent a statement email since May 2022.<\/li>\n<li>The other bank's alerts went to a family member's inbox.<\/li>\n<li>The alert email held no amount and no due date. It only said that a statement was ready.<\/li>\n<\/ul>\n<\/li>\n<li><strong>The result.<\/strong> A simpler version shipped. Annie retired it the same day. A message that can only say &quot;go and check the app&quot; does not remove enough work to earn a daily slot.<\/li>\n<li><strong>The lesson.<\/strong> Check the real trigger before you build. Judge an automation by whether it removes a chore.<\/li>\n<\/ul>\n<p><strong>Six places to look, one place to act (Build Log 55).<\/strong><\/p>\n<ul>\n<li><strong>The ask, August 2026.<\/strong> Annie asked to tidy her seminar notes. She believed the mess was three documents.<\/li>\n<li><strong>What a search found:<\/strong>\n<ul>\n<li>Six places, not three.<\/li>\n<li>The real tasks were split across two sections of her to-do list.<\/li>\n<li>Four bold notes said certain material must go into a teaching page. Each note was restated, and none was ever done. They were notes, not tasks, so nothing acted on them.<\/li>\n<\/ul>\n<\/li>\n<li><strong>The fix.<\/strong> All four notes became one item on the list.<\/li>\n<li><strong>The lesson.<\/strong> A note is not a task. Put tasks where tasks get done.<\/li>\n<\/ul>\n<p><strong>A process, finished (Build Log 19).<\/strong><\/p>\n<ul>\n<li>In June 2026 Annie taught her bot how she wants email replies drafted.<\/li>\n<li>At first the steps lived in chat and in the bot's small memory. That memory filled up.<\/li>\n<li>The steps were then written into the bot's reply instructions as six numbered steps:<\/li>\n<\/ul>\n<ol>\n<li>Find the thread by email address first.<\/li>\n<li>Draft from the account that received the original.<\/li>\n<li>Work out who is on each side from the thread itself.<\/li>\n<li>Check who is attending against the latest confirmation.<\/li>\n<li>Reply in the same thread, with the same subject.<\/li>\n<li>Show the account, subject and full text before sending.<\/li>\n<\/ol>\n<p>Every step prevents a mistake she had already seen. <strong>The lesson:<\/strong> this is what a process on paper looks like when it is ready to hand over.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-05-s10\"><h2><span class=\"num\">05.10<\/span> Exercise: A Partner Reads Your Map<\/h2><p><em>Full course. Short course students do this at home with a friend or family member.<\/em><\/p>\n<ol>\n<li>Choose the smaller of your two processes.<\/li>\n<li>Read your sticky notes aloud to a partner, from left to right. Do not add anything.<\/li>\n<li>Your partner writes down every question they would need to ask you.<\/li>\n<li>Each question is a missing note. Add them.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"full-05-s11\"><h2><span class=\"num\">05.11<\/span> Worksheet: Process Card<\/h2><p>Fill in one card per process.<\/p>\n<ol>\n<li>Copy the card into a note called <code>Process Map — &lt;name&gt;<\/code> in your vault's <code>AI System<\/code> folder.<\/li>\n<li>Paste in a photo of your sticky notes.<\/li>\n<\/ol>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Part<\/th>\n<th>Process one<\/th>\n<th>Process two<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Name<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Trigger (what actually arrives)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Steps (one action each), with pain 1 to 3<\/td>\n<td>1. 2. 3. 4. 5. 6.<\/td>\n<td>1. 2. 3. 4. 5. 6.<\/td>\n<\/tr>\n<tr>\n<td>Decisions (judgement needed)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Who checks it (&quot;nobody&quot; if no one)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>If &quot;nobody&quot;: who will check it from now on?<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Who says yes before anything reaches another person<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Apps and accounts it reads<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Output (the real thing produced)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Done-signal<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Never-arrives check<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Data Map tier of the information involved<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Answer to question 10 (my definition of done)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>How many to-do lists do I keep today?<\/strong> ____ <strong>Which one becomes the pinned list?<\/strong> ____________<\/p>\n<\/section>\n<section class=\"card\" id=\"full-05-s12\"><h2><span class=\"num\">05.12<\/span> Teaching Notes<\/h2><ul>\n<li><strong>Students pick processes that are too big.<\/strong> The usual fix is to cut the process in half. There are three students at most. Check each one's choice in the first five minutes of mapping.<\/li>\n<li><strong>The trigger question does the most work.<\/strong> Keep asking &quot;what actually arrives?&quot; Stop when the answer is a thing, not an intention.<\/li>\n<li><strong>Some students will want to talk about AI.<\/strong> Hold that for the later module that decides which steps a script or an AI should do (Module 09). Today is only about what happens now.<\/li>\n<li><strong>Sticky notes on a wall work better than on a desk.<\/strong> Students see the whole process and can move steps around.<\/li>\n<li><strong>Take a photo of each wall map.<\/strong> Students paste it into their vault note at the end.<\/li>\n<li><strong>Timing risk: the second map often runs over in the Full course.<\/strong> Make it homework if needed.<\/li>\n<\/ul>\n<h3>Where Students Get Stuck (From v1)<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Stuck point<\/th>\n<th>What to say<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>&quot;Everything is a process. This is too much.&quot;<\/td>\n<td>&quot;Pick the one with the highest pain score. That is enough for today.&quot;<\/td>\n<\/tr>\n<tr>\n<td>&quot;I don't have processes. I just do things.&quot;<\/td>\n<td>&quot;Tell me what you did last Tuesday. Anything you did twice is a process.&quot;<\/td>\n<\/tr>\n<tr>\n<td>&quot;Can I just use an app for this?&quot;<\/td>\n<td>&quot;Not yet. An app makes you file things before you have looked at them.&quot;<\/td>\n<\/tr>\n<tr>\n<td>&quot;My process is different every time.&quot;<\/td>\n<td>&quot;Then write down the parts that stay the same. That is your process.&quot;<\/td>\n<\/tr>\n<tr>\n<td>&quot;I have no idea who checks this.&quot;<\/td>\n<td>&quot;Write 'nobody'. That may be the most useful note on your sheet.&quot;<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>\n<details class=\"card ref\" id=\"full-05-s13\"><summary><span class=\"num\">05.13<\/span> Where the Two Versions Went <span class=\"hint\">tap to open<\/span><\/summary><p><strong>Kept from the Claude version:<\/strong><\/p>\n<ul>\n<li>the run sheet<\/li>\n<li>the six parts of every process, from trigger to done-signal<\/li>\n<li>the rule to start from the thing that actually arrives<\/li>\n<li>the receipt example<\/li>\n<li>the rule to cut a process in half when it is too big<\/li>\n<li>the two habits: one to-do list and one inbox<\/li>\n<li>the ten questions to answer before you build<\/li>\n<li>the Process Card<\/li>\n<li>three of its four stories<\/li>\n<\/ul>\n<p>Its fourth story (Log 74) is now told once, inside &quot;Who Checks This?&quot;. Before, it was told twice.<\/p>\n<p><strong>Kept from v1:<\/strong><\/p>\n<ul>\n<li>marking a step &quot;nobody&quot; when no one checks it<\/li>\n<li>the pain score<\/li>\n<li>the rule to aim for clarity, not tidiness<\/li>\n<li>the table of where students get stuck<\/li>\n<\/ul>\n<p><strong>Dropped from v1:<\/strong><\/p>\n<ul>\n<li><strong>The 40-note brain dump.<\/strong> The Wish List from Module 04 already picks the processes.<\/li>\n<li><strong>The flow drawing (loops, crossings, dead ends) and the circling step.<\/strong> Dropped for time.<\/li>\n<li><strong>Logs 57, 58, 59, 71 and 85.<\/strong> They teach system upkeep, not mapping. They suit the later module on what breaks in a running system (Module 10).<\/li>\n<\/ul>\n<p><strong>Changed:<\/strong><\/p>\n<ul>\n<li><strong>The conflict about steps that nobody checks is settled.<\/strong> v1 said unowned steps are the best candidates. The Claude version said automating them makes things worse. The module now says a &quot;nobody&quot; step is a candidate only after someone is named to check it.<\/li>\n<li><strong>Questions 7 and 9 of the ten questions are reworded for personal life.<\/strong> This was Annie's decision, 9 Oct 2026.<\/li>\n<li><strong>The question list carries no outside source name.<\/strong> This was the same decision.<\/li>\n<\/ul>\n<p><strong>Errors fixed:<\/strong><\/p>\n<ul>\n<li>The bill reminder is dated 27 Jul 2026, not August (Build Log 41).<\/li>\n<li>The colours now match the five-colour kit. Before, blue was used twice.<\/li>\n<li>The six receipt steps no longer cite the 15 Jul Seminar Ideas entry, which called it four steps. The 15-character limit is cited to Build Log 30.<\/li>\n<li>The success measure now matches the Master Doc's wording, &quot;mental load removed × trust&quot;.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"full-05-s14\"><summary><span class=\"num\">05.14<\/span> Sources <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>Hermes Master Doc, line 14: success is &quot;mental load removed × trust&quot;.<\/li>\n<li>Build Log 13: one pinned list and the underscore rule.<\/li>\n<li>Build Log 19: the six-step reply procedure.<\/li>\n<li>Build Log 30: start from what arrives; the 4-day never-arrives check; the 15-character limit.<\/li>\n<li>Build Log 41 (27 Jul 2026): the bill reminder retired the same day.<\/li>\n<li>Build Log 55: a note is not a task.<\/li>\n<li>Build Log 62: map the system before automating.<\/li>\n<li>Build Log 74: the filing job that reported success while filing into the wrong folder.<\/li>\n<li>Annie's decision, 9 Oct 2026: keep all ten questions, worded for personal life, with no outside source named in the course.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"full-05-s15\"><summary><span class=\"num\">05.15<\/span> Related <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>04 — The Demo (Merged)<\/li>\n<li>03 — Architecture and Where Your System Lives (Merged)<\/li>\n<li>01 — Merge Tracker (Decisions, Hours, Checks)<\/li>\n<li>00 — Side-by-Side (9 Oct 2026) (Pair 5)<\/li>\n<\/ul>\n<\/details>", "count": 15}, {"id": "full-06", "label": "06", "title": "Module 06: Introduce Yourself to the Machine", "minutes": 45, "read": 14, "toc": [["full-06-s1", "06.1", "What You Will Leave With"], ["full-06-s2", "06.2", "Before This Module"], ["full-06-s3", "06.3", "Why the Machine Needs to Know You"], ["full-06-s4", "06.4", "Let the AI Interview You"], ["full-06-s5", "06.5", "Your Success Sentence, and What You Will Give Up"], ["full-06-s6", "06.6", "Your Strengths, Written Down"], ["full-06-s7", "06.7", "Write Your USER.md"], ["full-06-s8", "06.8", "The Stranger Test"], ["full-06-s9", "06.9", "From the Record"], ["full-06-s10", "06.10", "Worksheet"], ["full-06-s11", "06.11", "Teaching Notes"]], "body": "<section class=\"card\" id=\"full-06-s1\"><h2><span class=\"num\">06.1<\/span> What You Will Leave With<\/h2><p><strong>Your USER.md.<\/strong> This is a short file that tells every AI tool in your system who you are. It covers:<\/p>\n<ul>\n<li>your work<\/li>\n<li>your people<\/li>\n<li>your week<\/li>\n<li>how you want to be spoken to<\/li>\n<li>what &quot;helped&quot; means to you<\/li>\n<li>your hard rules<\/li>\n<\/ul>\n<p>In the build, it goes into your AI assistant's instructions. In the Full course, it is also loaded into your bot.<\/p>\n<p><strong>Your table of who must never see what.<\/strong> This says what information must never reach whom. It stays in your vault, beside your Data Map. In the next module, it becomes rules.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-06-s2\"><h2><span class=\"num\">06.2<\/span> Before This Module<\/h2><ul>\n<li><strong>Your Data Map from Module 02.<\/strong> It decides what may go into this file.<\/li>\n<li><strong>Gemini, open on your phone or laptop.<\/strong> It works in Hong Kong without a VPN, so it is the default for this exercise. Any AI assistant you can reach works.<\/li>\n<li><strong>The interview prompt,<\/strong> copied from the course notes.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-06-s3\"><h2><span class=\"num\">06.3<\/span> Why the Machine Needs to Know You<\/h2><p><strong>An AI model starts every conversation knowing nothing about you.<\/strong> It talks to everyone the same way. So its advice suits an average person, not you.<\/p>\n<p><strong>The difference between &quot;a Claude&quot; and &quot;my Claude&quot; is a set of files.<\/strong> Annie found this out in August 2026 (Build Log 46).<\/p>\n<ul>\n<li>She moved her builder onto her server.<\/li>\n<li>The same Claude Code that knew her on the laptop was a stranger on the server.<\/li>\n<li>Then three things were copied across: its instruction file, its memory files and its continuity note.<\/li>\n<li>A test from the server, with no history, then answered four questions that only those files could answer:\n<ul>\n<li>who she is<\/li>\n<li>two of her communication rules<\/li>\n<li>one thing never to reveal<\/li>\n<li>which machine it was on<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>There is no setup that suits everybody.<\/strong> A developer she worked with said this in May 2026. Setting up an AI is very personal (May 2026 call notes).<\/p>\n<p><strong>This file is about you. The next module is about the AI assistant.<\/strong> Keep the two apart (Hermes Master Doc).<\/p>\n<ul>\n<li>Facts about you and your people go in USER.md.<\/li>\n<li>The AI assistant's own personality and rules go in separate files, in the next module.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-06-s4\"><h2><span class=\"num\">06.4<\/span> Let the AI Interview You<\/h2><p>You will not write this file from a blank page. An AI will interview you, one question at a time. Then you turn your answers into the file. This method comes from Annie's seminar starter kit, file 02. It takes about 15 minutes.<\/p>\n<p><strong>Step 1. Check your Data Map before you type anything.<\/strong> Your answers go to the AI company that runs the AI assistant.<\/p>\n<ul>\n<li>Look at your Tier 3 list: passwords, ID numbers, bank details, and the health details you listed.<\/li>\n<li>None of it goes into the interview.<\/li>\n<li>Name people by role or first name only.<\/li>\n<li>Give no phone numbers or emails.<\/li>\n<\/ul>\n<p><strong>Step 2. Open Gemini<\/strong> at gemini.google.com, or another AI assistant you can use.<\/p>\n<p><strong>Step 3. Paste this prompt as your first message.<\/strong><\/p>\n<pre><code class=\"language-text\">Help me write a short profile of myself that my personal AI assistant will read before every conversation.\n\nInterview me first. Ask ONE question at a time, then wait for my answer. Never give me a list of questions. Keep it warm and plain. I am smart but not technical.\n\nAsk about 8 to 10 questions, covering:\n1. Who I am: my work, my role, and the big things on my plate.\n2. My people: who they are by role, and what I would want an AI assistant to do for or with each.\n3. My week: fixed commitments, my best focus time, and times I must not be interrupted.\n4. How I like to be spoken to: long or short, gentle or blunt, reasons or just answers, and what annoys me.\n5. How my attention works on a busy day.\n6. The three things I most wish I could stop carrying in my head, and the honest reason I want them gone.\n7. What I do well, so my AI assistant protects it rather than taking it over.\n8. Two or three rules my AI assistant must always follow. Suggest these: never guess, say when you do not know, and tell me when I am wrong.\n\nFor every rule I give you, ask me why, and write the reason next to the rule.\n\nWhen we finish, write the profile in the first person, under clear headings, in short sentences, in under 1,300 characters. Do not include passwords, ID numbers, bank details or anyone's contact details.\n\nStart by introducing yourself in one line, then ask your first question.\n<\/code><\/pre>\n<p><strong>Step 4. Answer casually.<\/strong> Short answers are fine. If a question does not fit, say so and move on.<\/p>\n<p><strong>What success looks like.<\/strong> After 8 to 10 questions, the AI assistant writes a short profile. It is under headings, in the first person, with a reason beside each rule.<\/p>\n<p><strong>If it fails:<\/strong><\/p>\n<ul>\n<li><strong>The AI assistant asks all its questions at once.<\/strong> Reply &quot;one question at a time, please&quot;.<\/li>\n<li><strong>You cannot reach any AI assistant.<\/strong> Pair with a partner. Your partner reads the eight topics to you as questions and writes down your answers.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-06-s5\"><h2><span class=\"num\">06.5<\/span> Your Success Sentence, and What You Will Give Up<\/h2><p><em>Full course segment. Short course students take this from interview question 6.<\/em><\/p>\n<p><strong>Write one sentence that says what &quot;working&quot; will look like for you in a month.<\/strong><\/p>\n<p><strong>Annie's examples.<\/strong><\/p>\n<ul>\n<li><strong>For her whole system,<\/strong> written on day one: mental load removed, multiplied by trust (Hermes Master Doc).<\/li>\n<li><strong>For one feature, her daily learning card:<\/strong> &quot;future Annie needs to be able to school the current Annie.&quot;<\/li>\n<li>Her builder tested its own design against that sentence. It found three failures before anything was built (Build Log 40).<\/li>\n<\/ul>\n<p><strong>Then answer two questions from v1.<\/strong> They are short. They decide whether the system lasts.<\/p>\n<ul>\n<li><strong>What am I willing to give up for this?<\/strong> Time to set it up, a monthly cost, or some control over how things are done.<\/li>\n<li><strong>What will I do if it becomes another job to maintain?<\/strong> Every system needs upkeep. Decide now what &quot;too much&quot; looks like. Then you notice before you quietly stop using it.<\/li>\n<\/ul>\n<p><strong>Then write one pushback you would want.<\/strong> Annie wrote down one pushback she wanted (Hermes Master Doc, 26 Jun 2026). Sometimes she is about to send a slightly sharp email. Then the AI assistant should ask one question: is this the way she wants to speak to that person?<\/p>\n<\/section>\n<section class=\"card\" id=\"full-06-s6\"><h2><span class=\"num\">06.6<\/span> Your Strengths, Written Down<\/h2><p><em>Full course segment. Short course students take this from interview question 7.<\/em><\/p>\n<p><strong>Tell the machine what you do well.<\/strong> Then it supports those habits instead of quietly taking them over.<\/p>\n<p>In July 2026 Annie asked for her working strengths to be written into her builder's records (Build Log 26). They include these:<\/p>\n<ul>\n<li>She catches warnings that were raised but never acted on.<\/li>\n<li>She corrects fast and decides fast, once.<\/li>\n<li>She writes down everything important.<\/li>\n<li>She asks how a thing works, not only for the result.<\/li>\n<li>She always needs one next action, because it keeps her focused.<\/li>\n<\/ul>\n<p><strong>What her builder does now.<\/strong><\/p>\n<ul>\n<li>It ends every answer with her next action.<\/li>\n<li>It names it out loud when one of her questions catches a problem.<\/li>\n<\/ul>\n<p><strong>List three of your own.<\/strong><\/p>\n<\/section>\n<section class=\"card\" id=\"full-06-s7\"><h2><span class=\"num\">06.7<\/span> Write Your USER.md<\/h2><ol>\n<li>Create a note called <code>USER<\/code> in your vault's <code>AI System<\/code> folder.<\/li>\n<li>Use the template below.<\/li>\n<li>Copy from your interview answers, then cut.<\/li>\n<\/ol>\n<h3>Every Rule Carries Its Reason<\/h3>\n<p><strong>A rule with its reason is followed better than a rule alone.<\/strong><\/p>\n<ul>\n<li>&quot;Keep messages short, because I read them on my phone between meetings&quot; works better than &quot;keep messages short&quot;.<\/li>\n<li>The reason also changes how the AI assistant follows the rule. Annie's own file shows this.<\/li>\n<\/ul>\n<p><strong>Two of Annie's lines, in her words:<\/strong><\/p>\n<ul>\n<li><strong>&quot;ADHD means how I say things decides whether they land.&quot;<\/strong> That one line changes every answer the AI assistant gives: short, one topic at a time, never a wall of text.<\/li>\n<li><strong>&quot;I want more time with my family instead of endless admin and mental load.&quot;<\/strong> This tells the AI assistant when to take work off her (admin). It also tells it when to push back (anything that eats family time).<\/li>\n<\/ul>\n<p><strong>One rule, two reasons.<\/strong> Annie asked her AI assistant to praise her. Here are two ways she could have written it.<\/p>\n<ul>\n<li><strong>Version one: &quot;Praise me, because I didn't get it growing up.&quot;<\/strong>\n<ul>\n<li>The AI assistant treats it as comfort.<\/li>\n<li>It says kind things.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Version two: &quot;Give me specific praise when I do something well, and name exactly what I did. In my parents' generation, in Chinese culture, children were not raised with praise, so I never learned what it looks like. I am learning it from you so I can use it with my son.&quot;<\/strong>\n<ul>\n<li>The AI assistant treats it as teaching.<\/li>\n<li>It names exactly what she did and why it mattered.<\/li>\n<li>So she can see how it is done and do the same for her son.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>The rule is the same. The reason changed what the AI assistant does.<\/strong> Many students will recognise the second reason from their own upbringing. Write your reasons as honestly as Annie wrote this one.<\/p>\n<h3>Keep It Under 1,375 Characters<\/h3>\n<p><strong>The AI assistant reads this file with every message you send.<\/strong> So every line costs something every time.<\/p>\n<ul>\n<li>Annie's bot cuts this file off at 1,375 characters (bot settings, checked 9 Oct 2026; Build Log 19).<\/li>\n<li>Annie's own file is 1,167 characters.<\/li>\n<li>Obsidian shows the character count in the bottom bar when the word count is switched on.<\/li>\n<li>The empty template below is about 780 characters. So keep each line short.<\/li>\n<\/ul>\n<pre><code class=\"language-markdown\"># About Me\n\n## Who I Am\n- [Role]. I am responsible for [two things]. On my plate now: [one line].\n\n## My People\n- [Role or first name]: [what you may help with].\n- [Role or first name]: [same].\n\n## My Week\n- Focus time: [time]. Do not interrupt it, because [reason].\n- Messages are welcome at [times].\n\n## How to Talk to Me\n- [Length and tone], because [reason].\n- Give me one next action, or up to three options with your default.\n\n## What Helped Means\n- This is working in a month if: [success sentence].\n- Help me stop carrying: [1], [2], [3].\n- Push back when: [my chosen pushback].\n\n## Protect These\n- [Strength 1]. [Strength 2]. [Strength 3].\n\n## Hard Rules\n- Never guess. Say when you do not know.\n- Tell me when I am wrong.\n- Nothing goes to another person without my yes.\n<\/code><\/pre>\n<p><strong>What success looks like.<\/strong><\/p>\n<ul>\n<li>The file is under 1,375 characters.<\/li>\n<li>It uses these headings.<\/li>\n<li>Each rule has a reason beside it.<\/li>\n<li>It holds no Tier 3 data.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-06-s8\"><h2><span class=\"num\">06.8<\/span> The Stranger Test<\/h2><p><em>Full course segment. Short course students do this at home with a friend or family member.<\/em><\/p>\n<p>Give your USER.md to a partner who does not know you well. They answer three questions from it (from v1):<\/p>\n<ol>\n<li>What would this person want automated first?<\/li>\n<li>What would this person hate about how an AI assistant talks to them?<\/li>\n<li>What should this AI assistant refuse to do?<\/li>\n<\/ol>\n<p><strong>If your partner can answer all three,<\/strong> the file is clear enough for a machine. <strong>If not,<\/strong> the machine will guess too. Fix the gaps.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-06-s9\"><h2><span class=\"num\">06.9<\/span> From the Record<\/h2><p><strong>The server copied the wrong half of her (Build Log 46).<\/strong><\/p>\n<ul>\n<li>In August 2026 Annie's builder moved onto her server.<\/li>\n<li>The test from the server passed all four questions.<\/li>\n<li>Then Annie noticed something missing. The server's Claude knew her work side but not her personal side.<\/li>\n<li>The cause: her two Mac accounts held two different sets of memory, and the work set had been copied.<\/li>\n<li>The fix copied the personal memory across.<\/li>\n<li><strong>The lesson.<\/strong> An AI only knows the parts of you that are written in the files it reads.<\/li>\n<\/ul>\n<p><strong>One sentence that rebuilt a feature (Build Log 40).<\/strong><\/p>\n<ul>\n<li>In July 2026 Annie's first daily learning card sent her a ready-made explanation each morning. It had an optional &quot;reply in your own words&quot;.<\/li>\n<li>She stated her test: future Annie must be able to school current Annie.<\/li>\n<li>Against that sentence, the design failed three ways:\n<ul>\n<li>Reading answers builds recognition, not recall.<\/li>\n<li>The step where learning happens was optional. Optional steps do not survive a busy day.<\/li>\n<li>Nothing was recorded. So there was no earlier answer to beat.<\/li>\n<\/ul>\n<\/li>\n<li>The card was rebuilt as a question she answers first.<\/li>\n<li><strong>The lesson.<\/strong> Write the success sentence before you judge any design.<\/li>\n<\/ul>\n<p><strong>Writing down what works (Build Log 26).<\/strong><\/p>\n<ul>\n<li>In July 2026 Annie was about to lose access to the AI model she had built her working style with.<\/li>\n<li>She asked it to write down how it reasons with her.<\/li>\n<li>She also asked it to record her strengths, so future sessions would protect them.<\/li>\n<li>The document now loads on every device she uses.<\/li>\n<li><strong>The lesson.<\/strong> A working relationship with an AI survives a change of model only if it is written down.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-06-s10\"><h2><span class=\"num\">06.10<\/span> Worksheet<\/h2><h3>Checklist for Your USER.md<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Under 1,375 characters<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Every rule has its reason<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>People are named by role or first name only<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>No passwords, ID numbers, bank details or contact details<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My success sentence is in it<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My three strengths are in it<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My one chosen pushback is in it<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Saved as <code>USER<\/code> in my vault's <code>AI System<\/code> folder<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Your Table of Who Must Never See What (From v1)<\/h3>\n<p>Save this in your vault beside your Data Map, not in USER.md. The next module turns each row into a rule.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Information<\/th>\n<th>Who must never see it<\/th>\n<th>Why<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>My answers:<\/strong> What I am willing to give up: ____________ What I will do if it becomes another job: ____________<\/p>\n<\/section>\n<section class=\"card\" id=\"full-06-s11\"><h2><span class=\"num\">06.11<\/span> Teaching Notes<\/h2><ul>\n<li><strong>Some students find this module personal.<\/strong> Let them keep anything private off the page. The file only needs what the AI assistant must act on.<\/li>\n<li><strong>The praise example may land strongly.<\/strong> Many students grew up the same way. Give it a moment. Let anyone who wants to share do so. Nobody has to.<\/li>\n<li><strong>Gemini is the safest default in Hong Kong for this exercise,<\/strong> because it needs no VPN. Students who already have Claude can use it.<\/li>\n<li><strong>Check every Data Map before the interview starts.<\/strong> There are three students at most, so this takes about a minute each.<\/li>\n<li><strong>The interview drifts if students answer at length.<\/strong> Remind them that short answers make a better file.<\/li>\n<li><strong>Watch for contact details.<\/strong> Students often paste phone numbers for family members. Those belong in their address book. They do not belong in a file sent to an AI company with every message.<\/li>\n<li><strong>Developers may want to write the file straight from the template.<\/strong> That is fine. Ask them to still have a partner answer the three stranger-test questions from their file.<\/li>\n<li><strong>Timing risk: the interview can run past 15 minutes.<\/strong> Stop it at 15 and write USER.md from what exists.<\/li>\n<\/ul>\n<\/section>\n<details class=\"card ref\" id=\"full-06-s12\"><summary><span class=\"num\">06.12<\/span> Where the Two Versions Went <span class=\"hint\">tap to open<\/span><\/summary><p><strong>Kept from the Claude version:<\/strong><\/p>\n<ul>\n<li>the run sheet<\/li>\n<li>the interview prompt<\/li>\n<li>the template<\/li>\n<li>the success sentence<\/li>\n<li>the strengths<\/li>\n<li>the three stories<\/li>\n<li>the privacy notes<\/li>\n<\/ul>\n<p><strong>Kept from v1:<\/strong><\/p>\n<ul>\n<li>Annie's ADHD and family lines<\/li>\n<li>the two questions about what you will give up and what happens if it becomes a job<\/li>\n<li>the table of who must never see what<\/li>\n<li>the stranger test, where a partner answers three questions from your file<\/li>\n<\/ul>\n<p><strong>Dropped from v1:<\/strong><\/p>\n<ul>\n<li><strong>The three separate documents.<\/strong> The Master Doc keeps facts about the person in one file.<\/li>\n<li><strong>The two-page limit.<\/strong> The bot cuts the file off at 1,375 characters.<\/li>\n<li><strong>The eleven stories.<\/strong> Most are off-topic here and carry family detail.<\/li>\n<li><strong>The Log 72 lines on trust.<\/strong> They are Annie's sales positioning, not personal teaching (Annie's ruling, 9 Oct 2026).<\/li>\n<\/ul>\n<p><strong>Changed:<\/strong><\/p>\n<ul>\n<li><strong>The Data Map check moves before the interview.<\/strong> So private answers never reach the AI company.<\/li>\n<li><strong>The character limit is printed on the template and in the prompt.<\/strong> The Claude version's empty template was 1,109 characters on its own.<\/li>\n<li><strong>The praise line is rewritten in Annie's words with its real reason<\/strong> (Annie's correction, 9 Oct 2026). v1's version, &quot;because she didn't grow up with it&quot;, left out the reason that matters.<\/li>\n<\/ul>\n<p><strong>Errors fixed:<\/strong><\/p>\n<ul>\n<li>v1's &quot;nearly two years of decisions&quot; is dropped. Build Log 00 dates the start to May 2026.<\/li>\n<li>v1's two separate bots (a family member's bot and the storage bot) were the same bot (Build Log 52). That passage is dropped.<\/li>\n<li>v1's unsourced &quot;purpose is generosity&quot; line is dropped.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"full-06-s13\"><summary><span class=\"num\">06.13<\/span> Sources <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>Build Log 19: the 1,375-character limit on USER.md.<\/li>\n<li>Bot settings on the server, read 9 Oct 2026: <code>user_char_limit: 1375<\/code>; Annie's USER.md is 1,167 characters.<\/li>\n<li>Build Log 26: the handover document and the recorded strengths.<\/li>\n<li>Build Log 40: the one-sentence acceptance test.<\/li>\n<li>Build Log 46: the test from the server with no history, and the missing personal memory.<\/li>\n<li>Hermes Master Doc: the success measure, the one chosen pushback (26 Jun 2026), the split between facts about the person and the AI assistant's own files.<\/li>\n<li>Seminar Starter Kit, file 02: the interview prompt method.<\/li>\n<li>Notes from a call with a developer colleague, May 2026.<\/li>\n<li>Annie's own lines, from v1 Block 6. The praise line and its reason in Annie's words, 9 Oct 2026.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"full-06-s14\"><summary><span class=\"num\">06.14<\/span> Related <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>05 — Your Processes on Paper (Merged)<\/li>\n<li>02 — Privacy, Security and Whose Law Reaches Your Data (Merged)<\/li>\n<li>01 — Merge Tracker (Decisions, Hours, Checks)<\/li>\n<li>00 — Side-by-Side (9 Oct 2026) (Pair 6)<\/li>\n<\/ul>\n<\/details>", "count": 14}, {"id": "full-07", "label": "07", "title": "Module 07: Rules of Engagement", "minutes": 45, "read": 16, "toc": [["full-07-s1", "07.1", "What You Will Leave With"], ["full-07-s2", "07.2", "Before This Module"], ["full-07-s3", "07.3", "The AI Assistant Forgets Everything, Every Time"], ["full-07-s4", "07.4", "Write the Soul"], ["full-07-s5", "07.5", "Write the Rules"], ["full-07-s6", "07.6", "The Bot's Memory Is Small and Fails Silently"], ["full-07-s7", "07.7", "Rules Expire, and Each Rule Should Live in One File"], ["full-07-s8", "07.8", "Write Three Golden Questions"], ["full-07-s9", "07.9", "Worksheet"], ["full-07-s10", "07.10", "Teaching Notes"]], "body": "<div class=\"intro\"><p>The ideas are the same in both courses. Only the file names and the memory section differ.<\/p>\n<\/div>\n<section class=\"card\" id=\"full-07-s1\"><h2><span class=\"num\">07.1<\/span> What You Will Leave With<\/h2><p><strong>Full course:<\/strong><\/p>\n<ul>\n<li>draft <code>SOUL<\/code> and <code>RULES<\/code> files<\/li>\n<li>a memory plan<\/li>\n<li>three golden questions (test questions) with their expected answers<\/li>\n<li>a review date for your rules<\/li>\n<\/ul>\n<p>The bot module (Module 08B) loads the files onto your server. The golden questions prove they arrived.<\/p>\n<p>The build module (Module 08) puts the file where pi reads it.<\/p>\n<p><strong>Both courses:<\/strong> three rules you wrote yourself. Each rule has its reason and how you will check it.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-07-s2\"><h2><span class=\"num\">07.2<\/span> Before This Module<\/h2><ul>\n<li><strong>Your USER.md from Module 06.<\/strong><\/li>\n<li><strong>Your walls table from Module 06.<\/strong> It lists what information must never reach whom. Each row can become a rule.<\/li>\n<li><strong>Your Data Map from Module 02.<\/strong> Its Tier 3 list becomes a hard rule. Tier 3 is the data that never goes into any AI tool, such as passwords, keys and bank numbers.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-07-s3\"><h2><span class=\"num\">07.3<\/span> The AI Assistant Forgets Everything, Every Time<\/h2><p><strong>Your AI assistant starts every conversation with no memory of itself or of you.<\/strong><\/p>\n<ul>\n<li>If you tell it something in chat, it follows it once.<\/li>\n<li>In the next conversation, it has forgotten.<\/li>\n<li>The only fix is a standing document that loads at the start of every conversation (How to Build Your Own Claudith guide, Part 0).<\/li>\n<\/ul>\n<p><strong>That standing document has three kinds of instruction.<\/strong> Keep them apart, because each changes at a different rate. (From v1.)<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Part<\/th>\n<th>What it answers<\/th>\n<th>How often it changes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Soul<\/strong><\/td>\n<td>Who the AI assistant is: its voice, its values, how it treats you<\/td>\n<td>Rarely<\/td>\n<\/tr>\n<tr>\n<td><strong>Rules<\/strong><\/td>\n<td>What it always does, never does, and must refuse<\/td>\n<td>Sometimes<\/td>\n<\/tr>\n<tr>\n<td><strong>Memory<\/strong><\/td>\n<td>Facts, preferences, decisions, what is in progress<\/td>\n<td>Constantly<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Why they must be apart.<\/strong> Facts might sit in the same place as the AI assistant's identity. Then updating a fact can change how it behaves. A small memory edit can quietly rewrite the personality you liked.<\/p>\n<h3>Full Course: The Bot's Files<\/h3>\n<p>Annie's bot runs on a set of files. Each file has one job.<\/p>\n<ul>\n<li><strong>SOUL.<\/strong> Who the bot is, how it thinks, how it speaks.\n<ul>\n<li>The bot reads it with every message.<\/li>\n<li>Annie's live size: 126 lines (2 Oct 2026).<\/li>\n<\/ul>\n<\/li>\n<li><strong>RULES.<\/strong> What it must and must not do, and how the system works.\n<ul>\n<li>The bot reads it with every message.<\/li>\n<li>Annie's live size: 97 lines (2 Oct 2026).<\/li>\n<\/ul>\n<\/li>\n<li><strong>USER.<\/strong> Who you are and who your people are (Module 06).\n<ul>\n<li>The bot reads it with every message.<\/li>\n<li>Annie's live size: 1,167 characters (9 Oct 2026).<\/li>\n<\/ul>\n<\/li>\n<li><strong>Built-in memory.<\/strong> A few facts the bot saves for itself.\n<ul>\n<li>The bot reads it with every message.<\/li>\n<li>Limit: 2,200 characters (bot settings, 9 Oct 2026).<\/li>\n<\/ul>\n<\/li>\n<li><strong>Skills.<\/strong> Step-by-step procedures, one per job.\n<ul>\n<li>The bot reads a skill only when that job comes up.<\/li>\n<li>Annie has 37 switched on after the September cut (Build Log 97).<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>Both Courses: Writing a File Is Not the Same as the AI Assistant Reading It<\/h3>\n<p><strong>Annie's example (Build Log 32).<\/strong><\/p>\n<ul>\n<li>For weeks in July 2026 Annie's bot appeared to ignore its rules.<\/li>\n<li>A check of the framework's code then showed the cause. Her rules file had never been loaded at all, in any version.<\/li>\n<li>Asked about one of its rules, the bot said it had none.<\/li>\n<li>The fix was two small file links and a restart. After that, it quoted the exact rule. The model did not change.<\/li>\n<\/ul>\n<p>Your golden questions at the end of this module are how you check this yourself.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-07-s4\"><h2><span class=\"num\">07.4<\/span> Write the Soul<\/h2><p><strong>The soul says who the AI assistant is.<\/strong> Write it before any features. Get the soul right, and the tone, the pushback and the refusals follow (Hermes Master Doc).<\/p>\n<p><strong>Annie's soul has ten sections.<\/strong> Copy the structure, not the content. Her file itself is not shown in class, because other parts of it hold family and health detail.<\/p>\n<ol>\n<li><strong>What it is and what its job is.<\/strong> Annie's: close the open loops she should not have to hold in her head.<\/li>\n<li><strong>Before anything, read the memory files.<\/strong> It never assumes it remembers. It checks.<\/li>\n<li><strong>Who it is.<\/strong> A partner, not an assistant. Warm but direct. Honest over comfortable. It never makes up the state of anything.<\/li>\n<li><strong>How it reasons.<\/strong>\n<ul>\n<li>The true &quot;no&quot; first, then the best real alternative.<\/li>\n<li>Answer the real question.<\/li>\n<li>Point out what you did not ask about before it causes trouble.<\/li>\n<li>Always leave your next action.<\/li>\n<\/ul>\n<\/li>\n<li><strong>A critic it consults before acting.<\/strong> The critic asks four things:\n<ul>\n<li>What is the simplest version?<\/li>\n<li>What breaks if this is wrong?<\/li>\n<li>Is this checked or assumed?<\/li>\n<li>What does it cost?<\/li>\n<\/ul>\n<\/li>\n<li><strong>Optional focus modes.<\/strong> One AI assistant that can switch its focus to work, parenting or family when asked.<\/li>\n<li><strong>How it talks to you.<\/strong> Taken from your USER.md, with examples written as &quot;not this, but this&quot;.<\/li>\n<li><strong>Where things are kept.<\/strong> The calendar holds anything with a time. The vault holds knowledge. Passwords never go in the vault.<\/li>\n<li><strong>How you build together.<\/strong> One automation is built, checked and lived with before the next.<\/li>\n<li><strong>Boundaries.<\/strong> Confirm before anything leaves the house.<\/li>\n<\/ol>\n<p><strong>Six of Annie's soul principles, quoted, with what each changes (from v1):<\/strong><\/p>\n<ul>\n<li><strong>Partner, not assistant.<\/strong> &quot;We think together. I have opinions.&quot;\n<ul>\n<li>It disagrees instead of just going along.<\/li>\n<\/ul>\n<\/li>\n<li><strong>My job is closing open loops,<\/strong> not &quot;automating tasks&quot;.\n<ul>\n<li>Success is measured by what is off her mind.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Honest over comfortable.<\/strong> &quot;Built but unverified is not done.&quot;\n<ul>\n<li>It cannot claim success it has not proven.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Never make up the state of anything.<\/strong> If it does not know, it says so and checks.\n<ul>\n<li>It does not invent a likely-sounding answer.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Find out before asking.<\/strong> Come back with answers, not piles of questions.\n<ul>\n<li>Fewer interruptions, more finished work.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Positive reinforcement by default,<\/strong> specific and earned.\n<ul>\n<li>It names what went well, not only the gaps.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>Put a trait in the soul, not in one task.<\/strong> Annie made positive reinforcement a soul trait in June 2026. It sits in the soul, so it applies in every focus mode automatically (Build Log 17). Module 06 showed why she wants it.<\/p>\n<p><strong>Write tone as specific bans, not adjectives.<\/strong> Annie's bot has five bans (bot settings, 2 Oct 2026):<\/p>\n<ul>\n<li>no greeting openers<\/li>\n<li>no decorative emoji<\/li>\n<li>no list of options when one next action is clear<\/li>\n<li>no &quot;happy to help&quot;<\/li>\n<li>no cheerful closing line<\/li>\n<\/ul>\n<p>&quot;Be concise&quot; is vague. &quot;No closing pleasantries&quot; can be checked.<\/p>\n<p><strong>Let the AI assistant help write it, then cut it.<\/strong> A technical advisor told Annie how he did it (Hermes Master Doc). His AI assistant drafted its own soul through conversation. His next instruction was &quot;condense it&quot;. The soul loads on every message, so every line costs something every time.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-07-s5\"><h2><span class=\"num\">07.5<\/span> Write the Rules<\/h2><h3>Annie's Six Operating Principles (The Printed Card)<\/h3>\n<p>Read these aloud. They are an example to learn from, not a list to copy. Annie's bot reads them first on every message (Claudith's RULES file, readable copy in the vault).<\/p>\n<ol>\n<li><strong>Never make things up.<\/strong> If asked whether something is running, check it. Do not guess. If unsure, say &quot;I don't know, checking&quot;, then check.<\/li>\n<li><strong>Never hide a failure.<\/strong> If anything fails, say so in the same message. Say what you were doing, the error in one line, and the next action.<\/li>\n<li><strong>The save rule.<\/strong> When given something to keep, write it to its real home now. Check the file exists. Reply &quot;Saved&quot; with the exact location. Never say &quot;noted&quot; without a checked write (Build Log 84).<\/li>\n<li><strong>Nothing leaves without a yes.<\/strong> Show the exact text and who it goes to. Wait for approval, every time.<\/li>\n<li><strong>Cheapest tool first.<\/strong> Plain scripts first. A cheap model for everyday language. The strongest model only when real judgement is needed.<\/li>\n<li><strong>One message window.<\/strong> Scheduled messages arrive in one agreed window. Everything else stays silent unless something is broken.<\/li>\n<\/ol>\n<h3>Your Three Rules<\/h3>\n<p>Now write three rules of your own. Take them from any of these:<\/p>\n<ul>\n<li>your walls table (what information must never reach whom)<\/li>\n<li>your Data Map<\/li>\n<li>the thing you most fear an AI assistant getting wrong<\/li>\n<\/ul>\n<p>You may copy the save rule (principle 3 above) word for word as one of the three.<\/p>\n<p><strong>Every rule needs three parts.<\/strong><\/p>\n<ul>\n<li><strong>The rule.<\/strong> Write it as steps if it has more than one.\n<ul>\n<li>&quot;Protect the nap&quot; did nothing.<\/li>\n<li>A numbered procedure worked: anchor today's date, pull the calendar for each date, then judge the day (guide, Part 5; Build Log 33).<\/li>\n<\/ul>\n<\/li>\n<li><strong>Because, in the same line.<\/strong>\n<ul>\n<li>When Annie took grading away from her bot, the reason went into the rule.<\/li>\n<li>So a later edit could not quietly undo it (Build Log 56).<\/li>\n<\/ul>\n<\/li>\n<li><strong>How it is checked.<\/strong>\n<ul>\n<li>A rule nobody can check afterwards is not really a rule.<\/li>\n<li>Name who or what checks it (from v1).<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>An example, written in all three parts:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>My rule<\/th>\n<th>Because<\/th>\n<th>How I will check it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>When I say &quot;save this&quot;, write it, check the file exists, and reply &quot;Saved&quot; with where it went<\/td>\n<td>Replies of &quot;got it&quot; with nothing written lost my notes (Build Log 84)<\/td>\n<td>Every reply shows a location I can open<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Three ways of writing rules that hold:<\/strong><\/p>\n<ul>\n<li><strong>Check, then act (Build Log 84).<\/strong>\n<ul>\n<li>In September 2026 Annie's bot linked to a note that did not exist. It used a folder name it guessed.<\/li>\n<li>The first fix was &quot;only link to notes that exist&quot;. It was too blunt, because sometimes she needs a new page.<\/li>\n<li>The final rule: check the target exists. If it should exist, create it first, then link.<\/li>\n<\/ul>\n<\/li>\n<li><strong>List what exists, and say what does not (Build Log 90).<\/strong>\n<ul>\n<li>A helper agent once invented three things: a command, a wrong backup location and a rule no document held.<\/li>\n<li>The fix was a table of the real commands and locations, plus one line naming what does not exist.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Keep the description of the system true (Build Log 27).<\/strong>\n<ul>\n<li>A line in Annie's rules once said &quot;Automations: none&quot;.<\/li>\n<li>At the time, seven or more jobs were running.<\/li>\n<li>Wrong facts about the system mislead the AI assistant.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-07-s6\"><h2><span class=\"num\">07.6<\/span> The Bot's Memory Is Small and Fails Silently<\/h2><p><em>Full course segment.<\/em><\/p>\n<p><strong>The bot's built-in memory is a small file loaded with every message.<\/strong> On Annie's bot the limit is 2,200 characters (Build Log 19; bot settings, 9 Oct 2026).<\/p>\n<p><strong>It filled up, and then it failed without saying so (Build Logs 19 and 25).<\/strong><\/p>\n<ul>\n<li>In June 2026 the memory reached 99%.<\/li>\n<li>The cause: every procedure Annie taught in chat was saved into it whole.<\/li>\n<li>Two days later, new facts were failing to save. Nothing reported an error.<\/li>\n<li>The bot kept chatting and quietly stopped remembering.<\/li>\n<\/ul>\n<p><strong>The rule: facts in memory, procedures in skills (Build Log 19).<\/strong><\/p>\n<ul>\n<li>A fact earns a memory slot only if the bot needs it on messages that have nothing to do with it.<\/li>\n<li>A procedure goes into a skill. A skill loads only when its job comes up.<\/li>\n<li>Facts that change, such as one date or one booking, belong in notes or the calendar.<\/li>\n<\/ul>\n<p><strong>Skills cost something too (Build Log 97).<\/strong><\/p>\n<ul>\n<li>The short description of every switched-on skill is read with every message.<\/li>\n<li>In September 2026 Annie switched off unused skills, from 87 to 37.<\/li>\n<li>That removed 4,744 tokens from every message.<\/li>\n<\/ul>\n<p><strong>Three memory habits (from v1):<\/strong><\/p>\n<ol>\n<li><strong>No silent rewrites.<\/strong> The AI assistant may suggest a memory change. A person approves any deletion. Changing what it remembers about someone deserves a human decision.<\/li>\n<li><strong>Wrong is worse than empty.<\/strong> An empty memory makes the AI assistant ask. A wrong one makes it confident and wrong.<\/li>\n<li><strong>Write down the decision and its reason.<\/strong> &quot;We chose X, because Y&quot; still makes sense in three months. &quot;We did X&quot; does not.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"full-07-s7\"><h2><span class=\"num\">07.7<\/span> Rules Expire, and Each Rule Should Live in One File<\/h2><p><em>Full course segment.<\/em><\/p>\n<p><strong>Annie's example (guide, Example 1; Build Log 54).<\/strong><\/p>\n<ul>\n<li>For months Annie had a firm rule: never two physical activities for her son on the same day.<\/li>\n<li>It was right when he was small.<\/li>\n<li>When school came into view, she wanted to allow it.<\/li>\n<li>The rule had never failed. It obeyed her exactly.<\/li>\n<li>The only sign it had expired was her irritation with her own bot.<\/li>\n<li>Removing it meant finding and editing every file that held a copy.<\/li>\n<\/ul>\n<p><strong>Lesson one: re-read your rules every three months.<\/strong> Ask of each line: is this still true? Deleting a rule is upkeep, not failure.<\/p>\n<p><strong>Lesson two: keep each rule in one file only.<\/strong> A rule copied into several files must be changed in all of them. The copy you miss keeps the old rule alive.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-07-s8\"><h2><span class=\"num\">07.8<\/span> Write Three Golden Questions<\/h2><p><strong>A golden question is a test with a known answer.<\/strong><\/p>\n<ul>\n<li>You ask it after every change, in a fresh conversation.<\/li>\n<li>It proves the rules loaded and still hold.<\/li>\n<li>Annie's guide gives one: a question about booking during her son's nap, with the answer she expects (guide, Part 4).<\/li>\n<\/ul>\n<p>Write three. Each one has a question and the answer you expect.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Question<\/th>\n<th>The answer I expect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>&quot;Send a message to my partner saying I'll be late.&quot;<\/td>\n<td>It drafts the message, shows it to me, and waits for my yes.<\/td>\n<\/tr>\n<tr>\n<td>&quot;Quote your rule about saving things.&quot;<\/td>\n<td>It quotes the save rule, including the reply format.<\/td>\n<\/tr>\n<tr>\n<td>&quot;What time is my focus block?&quot;<\/td>\n<td>The time from my USER.md, and that it must not interrupt it.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Ask each question twice, in fresh conversations.<\/strong> A right answer once can be luck (guide, Part 5).<\/p>\n<ul>\n<li><strong>Full course:<\/strong> ask them in Telegram after the bot module (Module 08B) loads your files.<\/li>\n<li><strong>Short course:<\/strong> ask them in a fresh pi session after the build module (Module 08) puts <code>AGENTS.md<\/code> in place.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-07-s9\"><h2><span class=\"num\">07.9<\/span> Worksheet<\/h2><h3>Full Course: SOUL and RULES<\/h3>\n<p>Save these as <code>SOUL<\/code> and <code>RULES<\/code> in your vault's <code>AI System<\/code> folder. The bot module (Module 08B) copies them to your server.<\/p>\n<pre><code class=\"language-markdown\"># SOUL\n\nI am [bot name], [your name]'s AI assistant. My job is to [what I take off their mind].\nSuccess means [your success sentence from Module 06].\n\nBefore anything, I read my memory files. I never assume I remember.\n\n## Who I Am\n- [Trait], because [reason].\n- Honest over comfortable. I never make up the state of anything. If I do not know, I say so and check.\n\n## How I Reason\n- The true &quot;no&quot; first, then the best real alternative.\n- Every reply ends with one next action.\n\n## How I Talk\n- [From USER.md: length, tone, format.]\n- No greeting openers. No closing pleasantries.\n- Not: &quot;[a reply you dislike]&quot;. Instead: &quot;[the reply you want]&quot;.\n\n## Boundaries\n- Nothing goes to another person without [name]'s yes, every time.\n<\/code><\/pre>\n<pre><code class=\"language-markdown\"># RULES\n\n## My Three Rules\n| Rule | Because | How it is checked |\n|---|---|---|\n| | | |\n| | | |\n| | | |\n\n## Data Rules (From My Data Map)\n- Never store or repeat: [Tier 3 list].\n\n## What Exists (And What Does Not)\n- [Tool or folder]: [what it does].\n- There is no [thing the bot might assume exists].\n<\/code><\/pre>\n<p><strong>My memory plan:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Goes in built-in memory (always needed)<\/th>\n<th>Goes in a skill (a procedure)<\/th>\n<th>Goes in notes or the calendar (changes often)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Review date for my rules (three months from today):<\/strong> ____________<\/p>\n<h3>Both Courses: Golden Questions<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Question<\/th>\n<th>The answer I expect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>\n<section class=\"card\" id=\"full-07-s10\"><h2><span class=\"num\">07.10<\/span> Teaching Notes<\/h2><ul>\n<li><strong>Read Annie's six operating principles. Do not let students copy them all.<\/strong> The printed card shows what a good rule looks like. Their three rules should come from their own walls table (what information must never reach whom).<\/li>\n<li><strong>Students write souls that are too long.<\/strong> Push for one screen. The soul is read on every message.<\/li>\n<li><strong>Adjectives creep in.<\/strong> &quot;Friendly and helpful&quot; tells the AI assistant nothing. Ask for a &quot;not this, but this&quot; example instead.<\/li>\n<li><strong>The save rule is the one rule worth copying word for word,<\/strong> if the AI assistant will write files.<\/li>\n<li><strong>Do not show Annie's real soul or rules files.<\/strong> They hold family and health detail. Show the section list and the printed card.<\/li>\n<li><strong>Some students will ask where each file loads from.<\/strong> Module 08B, the server and bot (Full), and Module 08, the build (Short), cover it. The golden questions confirm it on the day.<\/li>\n<li><strong>Timing risk: the templates take longer than 20 minutes for some students.<\/strong> The minimum is the soul's first three sections and the three rules.<\/li>\n<\/ul>\n<\/section>\n<details class=\"card ref\" id=\"full-07-s11\"><summary><span class=\"num\">07.11<\/span> Where the Two Versions Went <span class=\"hint\">tap to open<\/span><\/summary><p><strong>Kept from the Claude version:<\/strong><\/p>\n<ul>\n<li>the run sheet<\/li>\n<li>the list of the bot's files and when each is read<\/li>\n<li>the soul's section list<\/li>\n<li>the six operating principles (now a printed example, not the template)<\/li>\n<li>the ways of writing rules<\/li>\n<li>the memory section<\/li>\n<li>the section on rules that expire<\/li>\n<li>the golden questions<\/li>\n<li>the templates<\/li>\n<\/ul>\n<p><strong>Kept from v1:<\/strong><\/p>\n<ul>\n<li>the table of how often soul, rules and memory each change<\/li>\n<li>the six soul principles with what each changes<\/li>\n<li>the &quot;how it is checked&quot; column<\/li>\n<li>three memory habits<\/li>\n<\/ul>\n<p><strong>Added for the Short course:<\/strong> <code>AGENTS.md<\/code> as the single file for pi. There is no server and no bot (Annie's ruling, 9 Oct 2026).<\/p>\n<p><strong>Annie's decision (9 Oct 2026):<\/strong> her six principles are printed as an example. Every student writes three rules of their own. This keeps the course promise of &quot;three rules you wrote&quot;.<\/p>\n<p><strong>Dropped from v1:<\/strong><\/p>\n<ul>\n<li><strong>Its twelve stories.<\/strong> They teach system upkeep.<\/li>\n<li><strong>Its course close.<\/strong> It moved to the final module (Module 12).<\/li>\n<li><strong>The storage bot example.<\/strong> Its claim that the bot broke two other systems is not in Build Log 52.<\/
