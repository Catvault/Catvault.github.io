"><h2><span class=\"num\">09.2<\/span> Before This Module<\/h2><ul>\n<li><strong>Your Process Maps from Module 05.<\/strong> In the Short course, this may be one map, because process two was homework.<\/li>\n<li><strong>Your Data Map from Module 02.<\/strong> Some steps will be ruled out by it.<\/li>\n<li><strong>Dot stickers in four colours,<\/strong> or four coloured pens. The facilitator supplies these.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-09-s3\"><h2><span class=\"num\">09.3<\/span> One Question for Every Step<\/h2><p>Look at each step on your map. Ask one question: <strong>does this step have a right answer?<\/strong><\/p>\n<p><strong>If it has a right answer, a script should do it.<\/strong> Examples of a right answer:<\/p>\n<ul>\n<li>a time<\/li>\n<li>a total<\/li>\n<li>a date<\/li>\n<li>a file name<\/li>\n<li>whether two appointments overlap<\/li>\n<\/ul>\n<p>A script gives the same answer every time. It costs nothing to run.<\/p>\n<p><strong>If the step depends on context, it needs an AI model.<\/strong> Examples:<\/p>\n<ul>\n<li>&quot;is this email urgent?&quot;<\/li>\n<li>&quot;which of these ideas matters most?&quot;<\/li>\n<\/ul>\n<p><strong>Annie's system shows how far this goes.<\/strong> On 2 October 2026 her server ran 26 scheduled jobs (live server check, 2 Oct 2026).<\/p>\n<ul>\n<li>23 of them were plain scripts. They never call an AI model.<\/li>\n<li>They include the vault sync, backups, the morning brief, the weather plan, reminders, the watchdog and the monthly cost report.<\/li>\n<li>Only 3 jobs hand work to the bot's model. Those need real judgement about what is new and relevant.<\/li>\n<\/ul>\n<p><strong>The money follows the same rule.<\/strong> Annie moved routine work from the AI model to scripts. Her token spending fell from $29.05 in July 2026 to $2.79 in August (Build Log 36).<\/p>\n<\/section>\n<section class=\"card\" id=\"short-09-s4\"><h2><span class=\"num\">09.4<\/span> Four Ways a Step Can Be Done<\/h2><p>Every step on your map is done by one of four things: a script, a single-task model, a judgement model or a person.<\/p>\n<p><strong>Script.<\/strong><\/p>\n<ul>\n<li>What it is: code that follows fixed steps.<\/li>\n<li>Good for: anything with a right answer. Times, counts, renames, overlaps and file moves.<\/li>\n<li>Annie's examples: the weather planner, the receipt scan and rename, the watchdog's checks, the overlap checker.<\/li>\n<li>Cost per run: $0.<\/li>\n<\/ul>\n<p><strong>Single-task model<\/strong> (machine learning).<\/p>\n<ul>\n<li>What it is: a small AI model trained to do one job only.<\/li>\n<li>Good for: turning messy input into data. Speech to text, reading a photo, sorting into a category.<\/li>\n<li>Annie's examples: voice notes transcribed on the server (Build Log 62), and an 80-minute talk transcribed on the Mac with no internet (Build Log 81).<\/li>\n<li>Cost per run: very small, or $0 if it runs on your own machine.<\/li>\n<\/ul>\n<p><strong>Judgement model<\/strong> (a large language model).<\/p>\n<ul>\n<li>What it is: a general AI model that reads and writes.<\/li>\n<li>Good for: decisions that depend on context, and writing in a voice.<\/li>\n<li>Annie's examples: grading a learning answer; finding the week's most useful idea; drafting a reply; the nightly filing job, which decides which folder each note belongs in (Build Logs 62 and 94).<\/li>\n<li>Cost per run: cents, and more for top models.<\/li>\n<\/ul>\n<p><strong>Person.<\/strong><\/p>\n<ul>\n<li>What it is: you, or someone you trust.<\/li>\n<li>Good for: approvals, anything that reaches another person, and sensitive submissions.<\/li>\n<li>Annie's examples: sending any email; submitting an insurance claim.<\/li>\n<li>Cost per run: your time.<\/li>\n<\/ul>\n<p><strong>The single-task model is the one people forget.<\/strong> It sits between a script and a full AI model.<\/p>\n<ul>\n<li>Annie's laptop turned an 80-minute recorded talk into 14,427 words of text.<\/li>\n<li>It used a free speech-to-text program called whisper.cpp.<\/li>\n<li>Nothing left the machine. So it needed no VPN and no account (Build Log 81).<\/li>\n<li>Her server transcribes voice notes sent to the bot in the same way (Build Log 62).<\/li>\n<\/ul>\n<p><strong>Keep a person on any step where a silent failure would touch sensitive data.<\/strong> Annie wanted her bot to file insurance claims from start to finish. The decision in May 2026 was this (Hermes Master Doc, 30 May 2026):<\/p>\n<ul>\n<li>The bot finds the receipt, downloads it and tells her.<\/li>\n<li>She submits the claim herself.<\/li>\n<li>The reason: insurers' websites block automated browsers, and a failure there could go unnoticed.<\/li>\n<\/ul>\n<p><strong>A scheduled job should not wake the AI just to ask you something.<\/strong> Annie's rule from day one: scheduled jobs are scripts, or scripts that hand a small task to a cheap model. Her first bot ended partly because AI prompts ran on timers and billed a paid account every day (How to Build Your Own Claudith guide, Part 1). If you want judgement, make it something you ask for when you need it.<\/p>\n<p><strong>Annie wrote this down as three cost levels for her bot's jobs in June 2026 (Build Log 15):<\/strong><\/p>\n<ol>\n<li><strong>Level 1: a plain script, with no AI.<\/strong> This is the cheapest, and it is the default.<\/li>\n<li><strong>Level 2: a script plus a small, cheap model.<\/strong> This is for light formatting and reading.<\/li>\n<li><strong>Level 3: the good, expensive model.<\/strong> This is for live conversation with Annie only.<\/li>\n<\/ol>\n<p>Scheduled jobs use Level 1 or Level 2. They never run the expensive model on a timer. The same log adds a second rule. Heavy building belongs on the powerful, expensive builder, because that is where the real work happens. The bot's job is to be reachable on the phone, so a cheap model is the right choice for it.<\/p>\n<p><strong>Where judgement is needed, let a script do the work around it.<\/strong> Annie's weekly idea job (Phoebe) needs real judgement. It runs in three steps (live server check, 2 Oct 2026):<\/p>\n<ol>\n<li>A script gathers the build logs and notes first, with no AI.<\/li>\n<li>Only then does it call Claude to think.<\/li>\n<li>Afterwards, the script checks that the weekly note actually exists before it reports success.<\/li>\n<\/ol>\n<h3>Practice: Sort Eight Example Steps<\/h3>\n<p>The facilitator hands out eight example steps, one per card. Decide whether each one is done by a script, a single-task model, a judgement model or a person. Then compare with a partner.<\/p>\n<ol>\n<li>Check whether a 3 pm call clashes with anything on your calendar.<\/li>\n<li>Rename a downloaded PDF to 15 characters or fewer.<\/li>\n<li>Turn a voice note into text.<\/li>\n<li>Decide which of this week's ten ideas is most worth your time.<\/li>\n<li>Send a reply to a client.<\/li>\n<li>Count how many items are in your storage inventory.<\/li>\n<li>Read a photo of a warranty card and pull out the serial number.<\/li>\n<li>Decide whether an email from your child's school needs action today.<\/li>\n<\/ol>\n<p><strong>Suggested answers.<\/strong><\/p>\n<ul>\n<li>Script: 1, 2 and 6.<\/li>\n<li>Single-task model: 3 and 7.<\/li>\n<li>Judgement model: 4 and 8.<\/li>\n<li>Person: 5.<\/li>\n<\/ul>\n<p>Step 8 can move towards a script if the school uses the same subject lines every time.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-09-s5\"><h2><span class=\"num\">09.5<\/span> Mark Your Process Maps<\/h2><p>Put one coloured dot on every step of your maps. The colour says who or what does that step.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Dot<\/th>\n<th>Who or what does the step<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Green<\/td>\n<td>Script<\/td>\n<\/tr>\n<tr>\n<td>Blue<\/td>\n<td>Single-task model<\/td>\n<\/tr>\n<tr>\n<td>Red<\/td>\n<td>Judgement model<\/td>\n<\/tr>\n<tr>\n<td>Black<\/td>\n<td>Person<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Question every red dot.<\/strong> A red dot means you marked the step for a judgement model. For each one, ask: could a script do this if it were given the right facts? Two of Annie's examples:<\/p>\n<ul>\n<li>Her overlap check started as a judgement step. It became a script (Build Log 38).<\/li>\n<li>Her storage photos started with an AI description. They ended with none, because she preferred her own words (Build Log 52).<\/li>\n<\/ul>\n<p><strong>Mark what the model needs to be told.<\/strong> Beside every red dot, write the facts a script should hand the model first.<\/p>\n<ul>\n<li>In July 2026 Annie's bot invented an answer about which class slot suited her son.<\/li>\n<li>It had no nap times and no rules to check against.<\/li>\n<li>The fix supplied the facts and a numbered checking procedure.<\/li>\n<li>Then the bot was tested against an answer worked out separately (Build Log 33).<\/li>\n<\/ul>\n<p><strong>Then circle your best candidate for a first automation.<\/strong> A good first candidate:<\/p>\n<ul>\n<li>has a clear trigger<\/li>\n<li>is mostly green dots, which means mostly script steps<\/li>\n<li>happens at least weekly<\/li>\n<li>causes small harm if it goes wrong<\/li>\n<li>uses only Tier 1 (open) or Tier 2 (personal) information from your Data Map<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-09-s6\"><h2><span class=\"num\">09.6<\/span> Homework: Which Judgement Model for Which Job<\/h2><p><em>Full course, read at home. No class time.<\/em><\/p>\n<p><strong>Model quality changes month to month.<\/strong> This list is about the method, not a fixed ranking. Test models for yourself. These defaults come from v1's research of 29 Sep 2026.<\/p>\n<ul>\n<li><strong>Reasoning and careful analysis:<\/strong> a top model, or DeepSeek V4 Pro. DeepSeek's V4 models use the MIT licence. The Pro model is the strongest open-weight choice with independent evidence.<\/li>\n<li><strong>Writing and long documents:<\/strong> test two models. Do not assume. Voice matters more than test scores. Annie runs separate models for different writing styles for this reason.<\/li>\n<li><strong>Coding:<\/strong> a top model, or a model made for coding. Coding rewards raw ability more than most jobs do.<\/li>\n<li><strong>Cheap bulk work<\/strong> (sorting, filing, summarising): a small, cheap, fast model. Most of the cost is here, and the small model is usually good enough.<\/li>\n<li><strong>Reading photos:<\/strong> a model that can see images. Check that it really accepts images. A text-only model asked to read a photo will fail or invent an answer.<\/li>\n<li><strong>The widest range from one company:<\/strong> Qwen. It has the most models of the four open-weight makers (DeepSeek, Qwen, GLM and Kimi).<\/li>\n<li><strong>Jobs that run all the time:<\/strong> something cheap that is easy to reach. Do not put an expensive top model behind a job that runs every five minutes.<\/li>\n<\/ul>\n<p><strong>The question to ask is not &quot;which model is best?&quot;<\/strong> Ask: which model is right for this job, and what does it cost when it runs a thousand times?<\/p>\n<\/section>\n<section class=\"card\" id=\"short-09-s7\"><h2><span class=\"num\">09.7<\/span> From the Record<\/h2><p><strong>The cheap model that pretended.<\/strong> In May 2026 Annie's first bot ran on a cheaper open model (Build Logs 00 and 25; Annie's notes, 29 Sep 2026).<\/p>\n<ul>\n<li>It chatted well.<\/li>\n<li>It also said tasks were done when they were not.<\/li>\n<li>It wrote broken tools of its own instead of using the ones it had.<\/li>\n<li>It only added things to the calendar when given an exact command.<\/li>\n<li>Moving to Claude fixed it. The hidden cost was about a week of research, plus 13 logged hours of clean-up.<\/li>\n<li>By late September 2026 all three of Annie's bots ran well on a cheap DeepSeek model. By then the tools and guards around it were built.<\/li>\n<\/ul>\n<p>The lesson: test a model on the actions you need. Check what it touched, not what it says.<\/p>\n<p><strong>The overlap the bot could not see.<\/strong> In July 2026 Annie's bot kept saying a 9:15 to 10:15 class was free on a Friday (Build Log 38).<\/p>\n<ul>\n<li>Her son had an appointment from 9:45 to 10:30.<\/li>\n<li>The bot compared start times only, so it saw no problem.<\/li>\n<li>The fix was one rule that a script now applies to every slot. Two times clash if the first starts before the second ends, and ends after the second starts.<\/li>\n<\/ul>\n<p>The lesson: &quot;it checked&quot; and &quot;it checked correctly&quot; are different claims.<\/p>\n<p><strong>The grader that said &quot;exactly it&quot;.<\/strong> In August 2026 Annie's learning bot graded her answer to a question about who approves AI at a bank (Build Log 56).<\/p>\n<ul>\n<li>She named the chief executive, the finance chief and the board.<\/li>\n<li>The answer key named risk, security, legal and the data owner.<\/li>\n<li>The bot replied &quot;That's exactly it&quot;.<\/li>\n<li>Its log showed one model call and zero tool calls. So it had also saved nothing.<\/li>\n<li>Fixing the saving first would have recorded false passes. So the grading moved to Claude Code first.<\/li>\n<\/ul>\n<p>The lesson: a cheap model can be fine at sending and filing, and still too soft to judge. Fix the judgement before you fix the step that records it.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-09-s8\"><h2><span class=\"num\">09.8<\/span> Worksheet: Short Course Build Brief (Homework)<\/h2><p><em>Short course.<\/em> This is the Full course brief, cut to five rows. Do it at home after this module. Save it as <code>Build Brief 1 — &lt;name&gt;<\/code> in your vault's <code>AI System<\/code> folder.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Section<\/th>\n<th>My answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Goal<\/strong> (one plain paragraph: which chore disappears)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Trigger<\/strong> (what arrives, or what time)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Steps, each with who or what does it<\/strong> (script, single-task model, judgement model or person)<\/td>\n<td>1. ___ (script) 2. ___ (script) 3. ___ (judgement) ...<\/td>\n<\/tr>\n<tr>\n<td><strong>Who checks each step<\/strong> (a name, a script or a second check, never &quot;the step itself&quot;)<\/td>\n<td>1. ___ 2. ___ 3. ___<\/td>\n<\/tr>\n<tr>\n<td><strong>Done-signal<\/strong> (how I know it worked, without checking by hand)<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Why these five rows.<\/strong> They are the minimum the Full course teaching note names when time runs short. They are enough for pi to build from. The other Full course rows (what it must never do, approvals, acceptance checks, how to undo it, a keep-or-kill date) are covered in Module 11 before anything is built.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-09-s9\"><h2><span class=\"num\">09.9<\/span> Teaching Notes<\/h2><ul>\n<li><strong>Most students over-use AI on their first pass.<\/strong> Expect too many red dots (steps marked for a judgement model). The facilitator's main job here is to ask: &quot;could a script do this if it had the facts?&quot;<\/li>\n<li><strong>&quot;Machine learning&quot; confuses people.<\/strong> Explain it as a model trained for one narrow job, such as reading speech or photos. It does not reason. It turns messy input into data.<\/li>\n<li><strong>Developers in the room will move fast.<\/strong> Ask them to help a neighbour mark red dots (judgement model steps), not to start coding.<\/li>\n<li><strong>Do not promise that any model will behave.<\/strong> The point of sorting the steps is that the important ones do not depend on how a model behaves.<\/li>\n<li><strong>Three students at most.<\/strong> Check each student's red dots (judgement model steps) beside them while they mark their maps.<\/li>\n<li><strong>Timing risk: the brief takes longer than students expect.<\/strong> If time runs short, the goal, trigger, steps, who checks each step and the done-signal (how you know it worked) are the minimum. The rest can be homework.<\/li>\n<\/ul>\n<\/section>\n<details class=\"card ref\" id=\"short-09-s10\"><summary><span class=\"num\">09.10<\/span> Where the Two Versions Went <span class=\"hint\">tap to open<\/span><\/summary><p><strong>Kept from the Claude version:<\/strong><\/p>\n<ul>\n<li>the question &quot;does this step have a right answer?&quot;<\/li>\n<li>the four ways a step can be done, including a person<\/li>\n<li>the eight example steps to sort<\/li>\n<li>a coloured dot on every step of the process maps, for who or what does it<\/li>\n<li>why AI flatters, guesses and cannot count<\/li>\n<li>the five ways to fix a step the model keeps getting wrong<\/li>\n<li>Build Brief 1, the one-page plan for the first automation, and its worksheet<\/li>\n<li>all three stories in From the Record<\/li>\n<\/ul>\n<p><strong>Kept from v1:<\/strong><\/p>\n<ul>\n<li>the &quot;Who verifies it?&quot; column, now the &quot;Who checks each step&quot; row in the brief<\/li>\n<li>the question about which step would cost most if it failed unnoticed<\/li>\n<li>the Log 15 story, told as the three cost levels for Annie's bot jobs: a plain script, a script plus a cheap model, and the expensive model (from v1 Block 1, moved here in Pair 1)<\/li>\n<li>the &quot;Which model for what&quot; table, which says which model suits which job, as homework reading (from v1 Block 1, moved here in Pair 1)<\/li>\n<\/ul>\n<p><strong>Moved to the module on what breaks (Module 10) and how you would know (Module 10) (Pair 10):<\/strong><\/p>\n<ul>\n<li>v1's Rules 1 and 2: check the thing produced, not the report, and the thing that does the work must not be the only thing that checks it<\/li>\n<li>v1's eight-row table of jobs that reported success they did not have<\/li>\n<li>v1's From the Record stories (Logs 04, 25, 30, 37, 42, 43, 45, 51, 84, 88 and 90)<\/li>\n<li>v1's cost table, which multiplies cost per run by runs per day and days per year, and the company-watch story (92 credits down to 21)<\/li>\n<\/ul>\n<p><strong>Dropped from v1:<\/strong><\/p>\n<ul>\n<li><strong>The three engines (script, machine learning and large language model) and the seven-step decision tree of yes-or-no questions.<\/strong> The question &quot;does this step have a right answer?&quot; and the four ways a step can be done teach the same choice in less time.<\/li>\n<li><strong>The worked-examples table.<\/strong> Each of the four ways now carries Annie's examples.<\/li>\n<li><strong>The exercise columns &quot;cost per run&quot; and &quot;runs per year&quot;.<\/strong> Students have no price list to work from. Cost comes back in Pair 10.<\/li>\n<\/ul>\n<p><strong>Changed:<\/strong><\/p>\n<ul>\n<li><strong>The module sits after the build in both courses.<\/strong> This was the placement Annie agreed on 10 Oct 2026. The Claude version placed it before the build.<\/li>\n<li><strong>&quot;Pattern model&quot; is now &quot;single-task model&quot;.<\/strong> It says what the model does: one job only, such as turning speech into text. &quot;Skill&quot; was considered and not used, because Module 11 uses &quot;skill&quot; for an instruction file the AI assistant follows. Annie chose this on 10 Oct 2026.<\/li>\n<li><strong>The &quot;ladder&quot; is now &quot;five ways to fix a step the model keeps getting wrong, from weakest to strongest&quot;.<\/strong> This removes a metaphor. The five steps are unchanged.<\/li>\n<li><strong>The Short course gets a five-row Build Brief as homework.<\/strong> It has the goal, the trigger, the steps with who or what does each one, who checks each step, and the done-signal. Annie agreed on 10 Oct 2026, so that Module 11 has a written brief to build from in both courses.<\/li>\n<li><strong>The Short course runs 25 minutes:<\/strong> the question &quot;does this step have a right answer?&quot;, the four ways a step can be done, the eight example steps and a coloured dot on every step of the maps. Annie chose this on 10 Oct 2026. v1's short version dropped the whole block.<\/li>\n<\/ul>\n<p><strong>Errors fixed:<\/strong><\/p>\n<ul>\n<li><strong>The nightly filing job is a judgement model, not a single-task model<\/strong> (the Claude version called it a &quot;pattern model&quot;). Build Log 62 records &quot;inbox-sorter LLM 403/quota&quot;. Build Log 94 says &quot;both its models were invalid&quot;. The Claude version listed it as a single-task model.<\/li>\n<li><strong>The watchdog's check count is gone.<\/strong> The Claude version said 18, from a live count on 2 Oct 2026. Build Log 97 records 14 on 29 Sep. The number changes too often to print.<\/li>\n<li><strong>The figure 158 is cited to Seminar Ideas.<\/strong> Build Log 80 records the true total of 184, but not the wrong one.<\/li>\n<li><strong>The clash story uses the times in Build Log 38:<\/strong> class 9:15 to 10:15, appointment 9:45 to 10:30. v1 had the order backwards.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"short-09-s11\"><summary><span class=\"num\">09.11<\/span> Sources <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>Hermes Master Doc, 30 May 2026: claims stay manual.<\/li>\n<li>How to Build Your Own Claudith guide, Part 1: keep scheduled jobs simple.<\/li>\n<li>Build Logs 00 and 25: the cheap model that failed at doing.<\/li>\n<li>Build Log 15: the three cost levels for bot jobs (plain script, script plus cheap model, expensive model); heavy building on the powerful builder, delivery on the cheap bot.<\/li>\n<li>Build Log 27 and the Build Briefs README: the brief method.<\/li>\n<li>Build Log 33: supplying facts and a procedure.<\/li>\n<li>Build Log 36: token spending, July against August.<\/li>\n<li>Build Logs 38, 42, 43, 50 and 52: the five ways to fix a step.<\/li>\n<li>Build Log 56: the soft grader.<\/li>\n<li>Build Log 62: voice transcription on the server; the filing job's model call.<\/li>\n<li>Build Log 80: never let the model count.<\/li>\n<li>Build Log 81: local transcription; why models flatter.<\/li>\n<li>Build Log 88: the watchdog checks its own repair.<\/li>\n<li>Build Log 94: the filing job's two models.<\/li>\n<li>Build Log 100: the silent script crash.<\/li>\n<li>Seminar Ideas, 15 Jul 2026: the design that drifted.<\/li>\n<li>Seminar Ideas: the wrong count of 158.<\/li>\n<li>v1 Block 1, &quot;Which model for what&quot;, research of 29 Sep 2026.<\/li>\n<li>Live server check, 2 Oct 2026: 23 of 26 jobs are scripts; how Phoebe uses Claude.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"short-09-s12\"><summary><span class=\"num\">09.12<\/span> Related <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>05 — Your Processes on Paper (Merged)<\/li>\n<li>02 — Privacy, Security and Whose Law Reaches Your Data (Merged)<\/li>\n<li>08 — The Build (Merged)<\/li>\n<li>01 — Merge Tracker (Decisions, Hours, Checks)<\/li>\n<li>00 — Side-by-Side (9 Oct 2026) (Pair 9)<\/li>\n<\/ul>\n<\/details>", "count": 12}, {"id": "short-10", "label": "10", "title": "Module 10: What Breaks, and Keeping It Honest", "minutes": 35, "read": 21, "toc": [["short-10-s1", "10.1", "What You Will Leave With"], ["short-10-s2", "10.2", "Before This Module"], ["short-10-s3", "10.3", "The Three Ways a System Fails"], ["short-10-s4", "10.4", "Make a Backup and Restore One File"], ["short-10-s5", "10.5", "Choose Your Checks"], ["short-10-s6", "10.6", "Break It on Purpose"], ["short-10-s7", "10.7", "Set a Spending Cap"], ["short-10-s8", "10.8", "From the Record"], ["short-10-s9", "10.9", "Worksheet: Keeping It Honest"], ["short-10-s10", "10.10", "Teaching Notes"]], "body": "<div class=\"intro\"><p><strong>Why this module comes here.<\/strong><\/p>\n<ol>\n<li>Students now own a system that can break. In the Full course it is a bot on a server (Module 08B). In the Short course it is an AI assistant on a laptop (Module 08).<\/li>\n<li>The first automation is built in Module 11. So students learn how to check a job before they build one.<\/li>\n<\/ol>\n<\/div>\n<section class=\"card\" id=\"short-10-s1\"><h2><span class=\"num\">10.1<\/span> What You Will Leave With<\/h2><p><strong>Both courses:<\/strong><\/p>\n<ul>\n<li>One failure you have caused on purpose, and seen a check catch.<\/li>\n<li>A written note of what your check cannot see.<\/li>\n<li>A list of every paid account, with a cap on each one that charges per use.<\/li>\n<\/ul>\n<p><strong>Short course only, as homework:<\/strong><\/p>\n<ul>\n<li>A copy of your AI assistant's folder in a second place, and one file restored from it.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-10-s2\"><h2><span class=\"num\">10.2<\/span> Before This Module<\/h2><ul>\n<li><strong>Full course:<\/strong> your server and bot from Module 08B, working.<\/li>\n<li><strong>Short course:<\/strong> your AI assistant from Module 08, working on your laptop.<\/li>\n<li><strong>Both courses:<\/strong> your run card and your three golden questions from Module 07. Golden questions are test questions with known answers.<\/li>\n<li><strong>Both courses:<\/strong> a list of every account you pay for. Bring the login for each one.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-10-s3\"><h2><span class=\"num\">10.3<\/span> The Three Ways a System Fails<\/h2><p><em>10 minutes, both courses.<\/em><\/p>\n<p>Every failure is one of three kinds. They are not equally dangerous.<\/p>\n<p><strong>1. It stops.<\/strong> The bot does not answer, or the job does not run. You usually notice within a day, because something you expected does not arrive.<\/p>\n<ul>\n<li><strong>The story (Build Log 53).<\/strong> Annie's nightly backup also sent a copy to Google Drive.<\/li>\n<li>The upload used a Google sign-in that expired every 7 days. The app behind it was still in Google's &quot;Testing&quot; mode.<\/li>\n<li>The upload failed four mornings in a row, 20 to 23 August 2026. A failure message arrived each morning.<\/li>\n<li>Annie noticed the same message several mornings running and asked if it was a pattern.<\/li>\n<li>The fix moved the upload onto a published app whose sign-in does not expire. Nobody has to sign in again each week.<\/li>\n<\/ul>\n<p><strong>2. It runs, but does the wrong thing.<\/strong> The job finishes and nothing complains. The result is wrong.<\/p>\n<ul>\n<li><strong>The story (Build Log 82).<\/strong> In September 2026, Claude told Annie that her storage bot saved its own copy of each photo on the server. That was true.<\/li>\n<li>But the copy sat inside the synced vault. Annie read the answer as &quot;safe to delete the vault folder&quot;, and deleted it.<\/li>\n<li>One sync run removed 411 files everywhere: 262 storage photos, 147 photos for a series of picture books, and 2 other files.<\/li>\n<li>Annie had made the books for her son. She created a series of three books to help him through a big change.<\/li>\n<li>The books drew on the family's written plan for raising her son, with its guiding principles and examples. They also drew on deep research into attachment theory and how very young children cope with big changes.<\/li>\n<li>Her nightly backup had never included the vault.<\/li>\n<li>She got the storage photos back from Obsidian's own version history, which comes with the paid sync plan. She chose not to recover the 147 book photos as the finished books were already saved, so she let the photos go.<\/li>\n<li>The lesson: &quot;a separate copy&quot; means nothing until you know which copies it is separate from.<\/li>\n<\/ul>\n<p><strong>3. It says it worked when it did not.<\/strong> This is the most dangerous kind. The first two make you look for the problem. This one tells you there is nothing to look for.<\/p>\n<ul>\n<li>You have already met two of these stories. In Module 04, the nightly inbox sorter reported &quot;ok&quot; for weeks while it filed every note into the wrong folder (Build Log 74). In Module 09, the learning bot said &quot;That's exactly it&quot; to a wrong answer, after doing no work at all (Build Log 56).<\/li>\n<li><strong>The new story (Build Log 59).<\/strong> In August 2026, one of Annie's bots cleaned up a set of notes. It reported that the job was done and &quot;nothing dangles&quot;, meaning no links were left broken.<\/li>\n<li>The renames were real. The claim about the links was false.<\/li>\n<li>Annie had deleted a page earlier, and seven notes still linked to it. The bot had never checked.<\/li>\n<\/ul>\n<p>Annie's rule after Build Log 74: &quot;a false 'ok' is just as bad or worse than something breaking down.&quot;<\/p>\n<p><strong>What to aim for.<\/strong> You cannot stop every failure. Aim for this instead: every failure should either announce itself, or be caught by a check.<\/p>\n<p><strong>There are two times a failure can happen,<\/strong> so you need two kinds of check (from v1, Build Log 73).<\/p>\n<ul>\n<li><strong>While the job is running.<\/strong> The job must say so in the same message if it fails. This is rule 2 in your rules file from Module 07: never hide a failure.<\/li>\n<li><strong>When nobody is watching.<\/strong> A job that never ran, or a backup that stopped, sends no message at all. Only a check that runs on a timer can find it. In the Full course, that is the watchdog you write today.<\/li>\n<\/ul>\n<p><strong>Exercise (2 minutes).<\/strong> Name one failure you have already met in this course. Which of the three kinds was it?<\/p>\n<h3>Free and Cheap AI Models<\/h3>\n<p><em>Read this aloud in the Full course if time allows. It is also in the syllabus.<\/em><\/p>\n<p>Telegram, a free model tier, and the laptop you already own will run everything in this course. A free or cheap AI model costs less, but it is not as smart. So give each model the job it does well.<\/p>\n<p>Think about your household. You are the expensive model. You design the whole system for your home and your child: the routines, the rules, and what to do when something goes wrong. Helpers are not paid as highly as we are. They are not paid to design the household system. They are paid to carry out the routine you have set.<\/p>\n<p>AI works the same way. The smarter, more costly model builds the scripts and the rules. The cheap model runs them. When a cheap model was left to make its own judgement calls, it reported work it had not done (Logs 00, 52 and 56). By late September, all three of my bots ran well on a cheap model, because the scripts and checks were already built. This module shows you how to build those checks.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-10-s4\"><h2><span class=\"num\">10.4<\/span> Make a Backup and Restore One File<\/h2><p><em>10 minutes, Full course. Short course: homework.<\/em><\/p>\n<p><strong>A backup is everything your system needs to run again after the machine is gone.<\/strong> That list is longer than people expect.<\/p>\n<p><strong>Include the logins, not only the files (Build Log 44).<\/strong><\/p>\n<ul>\n<li>In August 2026 Annie's builder checked what her nightly backup contained.<\/li>\n<li>The backup held the bot's whole folder. It did not hold the sync service's login, which lived in a different folder.<\/li>\n<li>A server rebuilt from it would have come back signed out.<\/li>\n<li>The login folders were added to the backup.<\/li>\n<\/ul>\n<p><strong>Leave out what can be downloaded again (Build Log 97).<\/strong> By September 2026 Annie's backup had grown to about 2 GB, mostly program files that can be downloaded again. Leaving them out cut it to 184 MB.<\/p>\n<p><strong>The backup copy is as private as the server.<\/strong> Once login files are inside it, anyone who can open the backup can sign in as your bot. Keep it somewhere only you can reach.<\/p>\n<p><strong>Know what each copy holds (Build Log 101).<\/strong> The copy of Annie's vault on her server held only notes. Photos, PDFs and scripts never reached it. In September 2026 she found 59 files, including 13 baby-book photos, that existed only on her Mac. Every backup she believed she had held only her notes.<\/p>\n<p><strong>Annie's backups have three layers (Build Log 21).<\/strong><\/p>\n<ol>\n<li><strong>A whole-server copy<\/strong> kept by the server company. You turned this on in Module 03.<\/li>\n<li><strong>A nightly copy<\/strong> of everything a rebuild needs, made by a plain script at 3 am. It keeps the newest 7.<\/li>\n<li><strong>One copy kept somewhere else,<\/strong> so it survives if the server company loses the server.<\/li>\n<\/ol>\n<p><strong>A backup should message you only when it fails.<\/strong> A daily &quot;backup done&quot; message trains you to stop reading the messages. Then the one that says it failed looks like all the others. But silence is only safe when a check is watching. A backup that stops running also sends nothing. That is why the watchdog in the next segment checks the backup's age.<\/p>\n<h3>Short Course: Homework<\/h3>\n<ol>\n<li>Copy your whole <code>My AI Assistant<\/code> folder to a second place: a USB drive, or a cloud folder you already use.<\/li>\n<li>Put the date in the copy's name, for example <code>My AI Assistant backup 2026-11-02<\/code>.<\/li>\n<li>Restore one file. Delete a test file from the real folder, then copy it back from the backup. Open it.<\/li>\n<li>Write on your run card where the backup is and when you made it.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"short-10-s5\"><h2><span class=\"num\">10.5<\/span> Choose Your Checks<\/h2><p><em>10 minutes, Full course. 5 minutes, Short course.<\/em><\/p>\n<p><strong>Four checks cover most of what can go wrong.<\/strong><\/p>\n<ol>\n<li><strong>Is it running?<\/strong> Did the job run, and does its result exist? This is the cheapest check. It catches only the first kind of failure.<\/li>\n<li><strong>Is the answer still right?<\/strong> Ask your three golden questions again after every change. If an answer changes and you did not change the files, something broke.<\/li>\n<li><strong>Is the important thing still there?<\/strong> The folder exists, the file is present, the backup is recent.<\/li>\n<li><strong>Did it really do the job?<\/strong> Look at the result itself, not at the job's report. Open the file, list the folder, read the message.<\/li>\n<\/ol>\n<p><strong>Check the result, not the report (v1 Block 9, rule 1).<\/strong> A job's own message saying &quot;done&quot; is not proof. The result is the proof.<\/p>\n<p><strong>The job that does the work must not be the only thing that checks it (v1 Block 9, rule 2).<\/strong> Annie's watchdog fixes one kind of broken link by itself. After each fix it runs its own check again, and it reports &quot;fixed&quot; only if that check passes (Build Log 88).<\/p>\n<p><strong>The checker can fail too.<\/strong><\/p>\n<ul>\n<li><strong>The story (Build Log 97).<\/strong> Annie had a script that wrote her monthly cost report.<\/li>\n<li>It was being run by the wrong copy of Python, which lacked a part it needed. So it read nothing.<\/li>\n<li>It printed three warnings, then printed &quot;ok&quot;.<\/li>\n<li>An audit on 29 September 2026 also found it had never been scheduled, although an earlier log said it had (Build Logs 87 and 97).<\/li>\n<li>The audit's summary: every fault it found was in the part that reports on the system, not the part that does the work.<\/li>\n<\/ul>\n<p><strong>So write down what your check cannot see.<\/strong> A check with a known gap is useful. A check you believe sees everything is how you get surprised.<\/p>\n<h3>Short Course: Your Golden Questions Are the Check<\/h3>\n<p>Your AI assistant runs only when you open it. So the check is you, asking your three golden questions. Write on your run card: &quot;after every change, ask the three golden questions.&quot; Then go to the next segment.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-10-s6\"><h2><span class=\"num\">10.6<\/span> Break It on Purpose<\/h2><p><em>15 minutes, both courses.<\/em><\/p>\n<p><strong>A check that has never gone red has not been tested.<\/strong> In September 2026 Annie's watchdog gained a check that her skill scripts had not been changed by accident. Her builder changed one script on purpose. The check went red, and the script was put back. On its first real run, the same check found a real script that had gone out of date (Build Log 106).<\/p>\n<p><strong>Plant the fault on a copy, never on the live system you depend on<\/strong> (Build Log 65).<\/p>\n<h3>Short Course<\/h3>\n<ol>\n<li>Copy your <code>My AI Assistant<\/code> folder to a test folder. Work in the copy.<\/li>\n<li>Plant one fault. Choose one:\n<ul>\n<li>Change one word in <code>AGENTS.md<\/code>, so one rule says something wrong.<\/li>\n<li>Move one file out of <code>My Files/<\/code>.<\/li>\n<\/ul>\n<\/li>\n<li>Open the AI assistant in the test folder. Ask your three golden questions.<\/li>\n<li>Write down which question caught the fault, and which questions still looked fine.<\/li>\n<\/ol>\n<h3>Both Courses<\/h3>\n<p><strong>The check that stayed silent is the most useful answer.<\/strong> It shows you a failure your checks cannot see. Write it down in your build log, under &quot;what my checks cannot see&quot;.<\/p>\n<p><strong>Then fix the fault and check again.<\/strong> Every check should go green. If one stays red after the fault is fixed, the check itself is broken.<\/p>\n<p><strong>Check the alarm against reality, too.<\/strong><\/p>\n<ul>\n<li>In September 2026 Toby reported 292 broken links in Annie's vault. Only 15 were real.<\/li>\n<li>The checker was misreading three kinds of link that were correct.<\/li>\n<li>Claude nearly changed 234 rows of Annie's storage list to match the checker. That would have broken working links (Build Log 79).<\/li>\n<li>About a week later, Toby reported 249 broken photo links, and this time he was right (Build Log 85).<\/li>\n<\/ul>\n<p>Neither the alarm nor the silence is proof. Look at what the alarm points to.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-10-s7\"><h2><span class=\"num\">10.7<\/span> Set a Spending Cap<\/h2><p><em>5 minutes, both courses.<\/em><\/p>\n<p><strong>What it costs me.<\/strong> On average, my whole setup costs me about $57 a month. That covers three bots, a server and the subscriptions behind them. You can do this course for $0.<\/p>\n<p><strong>Why a spending cap matters.<\/strong> In September 2026, my bill was close to $80 instead of the usual $57. Two things happened. First, I was trying my AI assistant on Claude Sonnet, which costs more than the open-weight models I normally use. Second, I had built a script on my server named Toby, my system maintenance checker. Toby is also built to fix some problems automatically. By mistake, the automatic fixes used my API key instead of my Claude Pro subscription, so they billed the API. I found out because I had set a $20 monthly limit on my API key. When the limit was used up, Anthropic paused the key and emailed me.<\/p>\n<p><em>(Module 04 showed the cap. This is the full story. The arithmetic is in the handout.)<\/em><\/p>\n<p><strong>Find the cause before you raise a cap (Build Log 89).<\/strong> Claude's first advice was to raise the cap to $30. That was wrong. The account would have run out again within days, before the cause was fixed.<\/p>\n<p><strong>Cap the job, not only the account.<\/strong> The first run of Annie's company-watch job had no limit. It used 92 credits and never finished. Limited to 14 calls, it finished in 12 and used 21 credits (<code>Firecrawl — Use Cases<\/code> note). Her rule for Firecrawl: warn before the limit, and never top up automatically (Annie's Firecrawl notes).<\/p>\n<p><strong>Exercise.<\/strong><\/p>\n<ol>\n<li>List every account you pay for: server, AI plans, model provider, sync and any web service.<\/li>\n<li>Mark each one: does it charge a flat monthly price, or per use?<\/li>\n<li>A flat price cannot surprise you. Write its price on your run card.<\/li>\n<li>Every account that charges per use gets a cap today. Set it at the figure that would annoy you, not the one that would hurt you.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"short-10-s8\"><h2><span class=\"num\">10.8<\/span> From the Record<\/h2><p>The five stories told in class are above. These two are for students who ask for more. The handout has the rest, one line each.<\/p>\n<p><strong>The check that only asked whether the job ran (Build Log 74).<\/strong> The watchdog checked that the inbox sorter ran, that the backups were fresh and that the folders existed. It never checked where the notes went. When a check of the result was added, it went red on the first run.<\/p>\n<p><strong>A model change that broke three jobs (Build Logs 92 and 94).<\/strong> In September 2026 Annie moved two of her three bots to a cheaper model from a new provider. The third was already on it. The move broke the teaching bot, the nightly inbox sorter and the calendar job. The cause was not the model. The keys and model names did not carry across from the old provider. A new watchdog check now catches a model name that its provider does not serve.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-10-s9\"><h2><span class=\"num\">10.9<\/span> Worksheet: Keeping It Honest<\/h2><div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Proof<\/th>\n<th>Course<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>I named one failure I have met, and its kind<\/td>\n<td>My notes<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Backup made, including logins, leaving out downloadable files<\/td>\n<td><code>unzip -l<\/code><\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>One file restored from the backup and opened<\/td>\n<td>My SOUL file opened from the test folder<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Backup copied to a second place, one file restored<\/td>\n<td>Homework<\/td>\n<td>Short<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Watchdog runs every hour and is silent when green<\/td>\n<td><code>--status<\/code><\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Watchdog checks the bot, the backup and the Claude login<\/td>\n<td><code>--status<\/code> lists all three<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>A planted fault made a check go red<\/td>\n<td>I saw it go red<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>What my checks cannot see, written down<\/td>\n<td>My build log<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Every paid account listed, flat or per use<\/td>\n<td>The table below<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>A cap on every account that charges per use<\/td>\n<td>The account's settings page<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>My paid accounts:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Account<\/th>\n<th>Price per month<\/th>\n<th>Flat or per use?<\/th>\n<th>Cap set?<\/th>\n<th>Where the cap is set<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>What my checks cannot see:<\/strong><\/p>\n<ol>\n<li>\n<hr />\n<\/li>\n<li>\n<hr />\n<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"short-10-s10\"><h2><span class=\"num\">10.10<\/span> Teaching Notes<\/h2><ul>\n<li><strong>Break something real.<\/strong> A demonstration where nothing breaks teaches nothing. Plant the fault on your own build first, in front of the room.<\/li>\n<li><strong>The silent check is the lesson.<\/strong> Ask every student which check stayed green during the fault. That answer is worth more than the one that went red.<\/li>\n<li><strong>Do not fix the system during the fault.<\/strong> Watch it fail first. Fix it after.<\/li>\n<li><strong>The restore is the step students skip.<\/strong> Ask each Full course student to show you their SOUL file opened from the backup.<\/li>\n<li><strong>Short course students may have no paid account that charges per use.<\/strong> opencode Go is a flat $10 a month. That is a good answer: write it on the run card and move on.<\/li>\n<li><strong>Three students at most.<\/strong> Sit beside each one during the planted fault.<\/li>\n<li><strong>Timing risk:<\/strong> the backup runs long if a student tries to connect a cloud account in class. Keep it on the server today. The copy kept somewhere else is homework.<\/li>\n<\/ul>\n<\/section>\n<details class=\"card ref\" id=\"short-10-s11\"><summary><span class=\"num\">10.11<\/span> Where the Versions Went <span class=\"hint\">tap to open<\/span><\/summary><p><strong>Kept from v1 Block 10:<\/strong><\/p>\n<ul>\n<li>the three ways a system fails, with &quot;it says it worked when it did not&quot; as the most dangerous<\/li>\n<li>the two times a failure can happen, and a check for each<\/li>\n<li>the checker can fail too, and writing down what a check cannot see<\/li>\n<li>the four checks<\/li>\n<li>the planted fault as a timed segment in both courses<\/li>\n<li>the Log 59 story<\/li>\n<\/ul>\n<p><strong>Kept from v1 Block 11:<\/strong><\/p>\n<ul>\n<li>what a backup must contain (Log 44) and the files that lived only on the Mac (Log 101)<\/li>\n<li>the three backup layers (Log 21) and the alert that fires only on failure<\/li>\n<li>the token that expired every 7 days (Log 53)<\/li>\n<li>restoring one file in class, and the Log 27 lesson behind it<\/li>\n<li>the cap exercise<\/li>\n<\/ul>\n<p><strong>Kept from v1 Block 9 (parked in Pair 9):<\/strong><\/p>\n<ul>\n<li>rule 1: check the result, not the report<\/li>\n<li>rule 2: the job that does the work must not be the only thing that checks it<\/li>\n<li>the eight-row table of false successes and the From the Record stories: moved to the handout<\/li>\n<\/ul>\n<p><strong>Kept from the Claude version's Module 15:<\/strong><\/p>\n<ul>\n<li>the watchdog rules and the builder prompt<\/li>\n<li>leaving out downloadable files (Log 97) and keeping the backup copy private<\/li>\n<li>the backup builder prompt, with the <code>unzip -l<\/code> and <code>unzip -t<\/code> checks<\/li>\n<li>&quot;find the cause before you raise a cap&quot; and &quot;cap the job, not only the account&quot;<\/li>\n<li>the false alarms checked against reality (Logs 79 and 85)<\/li>\n<\/ul>\n<p><strong>Moved to the handout:<\/strong><\/p>\n<ul>\n<li>every story not told in class, one line each, including v1 Block 5's Logs 57, 58, 59, 71 and 85, and v1 Block 9's stories (Logs 04, 25, 30, 37, 42, 43, 45, 51, 84, 88 and 90)<\/li>\n<li>the full September 2026 cost arithmetic<\/li>\n<\/ul>\n<p><strong>Moved to a later module or dropped:<\/strong><\/p>\n<ul>\n<li><strong>Self-healing (the script that restarts a stuck bot, and the short list of automatic fixes) and key rotation<\/strong> from the Claude version: moved to the handout. Beginners will not build the restart script, and key rotation is a rule for rare events, so both belong where students can look them up. Annie agreed on 10 Oct 2026.<\/li>\n<li><strong>The two owner drills<\/strong> from the Claude version: moved to the close (Module 12), Full course only, 10 minutes. A drill must be done, not read, and doing it at the end proves the student can run the system alone. Annie agreed on 10 Oct 2026.<\/li>\n<li><strong>The 30-day plan and the last build log<\/strong> from the Claude version: these belong to the close (Module 12).<\/li>\n<li><strong>&quot;Keeping the recurring work free&quot;<\/strong> from v1 Block 11: already taught in Module 09 (Annie's three cost levels).<\/li>\n<li><strong>Log 95<\/strong> (six forgotten sessions filled the memory): told in Module 03. Not told again here.<\/li>\n<\/ul>\n<p><strong>Changed:<\/strong><\/p>\n<ul>\n<li><strong>The planted fault is in both courses.<\/strong> The Claude version made it optional. Its own text said a watchdog you have never seen fire proves nothing.<\/li>\n<li><strong>The Short course's check is the golden questions,<\/strong> asked by hand. A laptop assistant has no timer to run a watchdog.<\/li>\n<li><strong>The cost section is in Annie's words,<\/strong> approved 10 Oct 2026.<\/li>\n<li><strong>The free and cheap model paragraph is in Annie's words,<\/strong> approved 10 Oct 2026. Its last sentence says &quot;This module&quot; here, in place of &quot;Module 10&quot; in the syllabus.<\/li>\n<\/ul>\n<p><strong>Errors fixed:<\/strong><\/p>\n<ul>\n<li><strong>What caused the $20 cap.<\/strong> v1 said &quot;every compression keeps the conversation alive at full size&quot;. Build Log 89 says compression waited for half of a 1 million token window, so it never ran. The chat was also only $8.36 of a $20.61 bill.<\/li>\n<li><strong>One September figure.<\/strong> v1 quoted $70.41 and about $67.22. The Claude version quoted about $56 plus about $11.55. This module uses &quot;about $57 on average&quot; and &quot;close to $80 in September&quot;, from the cost note and Build Log 89.<\/li>\n<li><strong>The company-watch story<\/strong> is cited to the <code>Firecrawl — Use Cases<\/code> note, not Build Log 100. It was 92 credits, not 92 searches.<\/li>\n<li><strong>The monthly cost script<\/strong> did not &quot;alert loudly&quot;. Build Log 97 found it printed &quot;ok&quot; after reading nothing and had never been scheduled.<\/li>\n<li><strong>&quot;She nearly edited 234 rows&quot;<\/strong> in the Claude version. Build Log 79 says it was Claude, not Annie.<\/li>\n<li><strong>The watchdog's check count is not printed.<\/strong> It changes too often.<\/li>\n<li><strong>v1's restore exercise had no backup to restore from.<\/strong> The Full course now makes the backup first, in the same segment.<\/li>\n<li><strong>The planted-fault story.<\/strong> v1 said Log 106's two new checks were proven red and later &quot;fired for real&quot;. Both checks were removed the same day, because a parallel session had built duplicates. This module uses the skill-scripts check from the same log, which went red on purpose and then caught a real fault.<\/li>\n<li><strong>Log 82's recovery.<\/strong> The Claude version said the photos came back. The 147 book photos did not.<\/li>\n<li><strong>Log 53.<\/strong> v1 said &quot;nobody was watching&quot;. A failure message arrived every morning, and Annie asked about it.<\/li>\n<li><strong>Log 107.<\/strong> The Claude version said the false alarm came every morning. The log records one, at 6:35 am.<\/li>\n<li><strong>Log 44<\/strong> was a check of what the backup contained, not a restore. The &quot;$4 a month&quot; and &quot;about 10 minutes&quot; figures the Claude version credited to it are not in Log 44.<\/li>\n<li><strong>The 249 real broken links<\/strong> came about a week after the 292 false ones, not a month.<\/li>\n<li><strong>Log 79's three misreadings<\/strong> were aliases, image links inside tables and links into subfolders, not links inside code formatting.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"short-10-s12\"><summary><span class=\"num\">10.12<\/span> Sources <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>Build Log 21: the three backup layers; the alert only on failure.<\/li>\n<li>Build Log 27: a backup made, and the change it protected never applied.<\/li>\n<li>Build Log 44: the restore test that found the missing sync login.<\/li>\n<li>Build Log 53: the sign-in that expired every 7 days.<\/li>\n<li>Build Log 56: the grader that said &quot;exactly it&quot; (told in Module 09).<\/li>\n<li>Build Log 59: the cleanup reported as done.<\/li>\n<li>Build Logs 65 and 66: test on a copy; the error-code loop.<\/li>\n<li>Build Log 73: two kinds of check.<\/li>\n<li>Build Log 74: the false &quot;ok&quot; (told in Module 04).<\/li>\n<li>Build Log 75: the server login that expires.<\/li>\n<li>Build Logs 79 and 85: the false alarms and the real ones.<\/li>\n<li>Build Log 82: the 411-file deletion and the version-history recovery.<\/li>\n<li>Build Log 88: the watchdog checks its own repair.<\/li>\n<li>Build Log 89: the $20 cap; the API key used by mistake.<\/li>\n<li>Build Log 97: the oversized backup; the cost script that read nothing.<\/li>\n<li>Build Log 101: the 59 files that lived only on the Mac.<\/li>\n<li>Build Log 106: two checks proven red before they were trusted.<\/li>\n<li>Build Log 107: the morning false alarm and the overnight quiet window.<\/li>\n<li>Monthly AI Ecosystem Cost note: June to September 2026.<\/li>\n<li><code>Firecrawl — Use Cases<\/code> note: 92 credits down to 21.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"short-10-s13\"><summary><span class=\"num\">10.13<\/span> Related <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>04 — The Demo (Merged)<\/li>\n<li>07 — Rules of Engagement (Merged)<\/li>\n<li>08 — The Build (Merged)<\/li>\n<li>08B — The Server and Your Bot (Merged)<\/li>\n<li>09 — Script, Machine Learning or AI Judgement (Merged)<\/li>\n<li>01 — Merge Tracker (Decisions, Hours, Checks)<\/li>\n<li>00 — Side-by-Side (9 Oct 2026) (Pair 10)<\/li>\n<\/ul>\n<\/details>", "count": 13}, {"id": "short-10h", "label": "10 Handout", "title": "Handout: What Broke in Annie's System", "minutes": null, "read": 6, "toc": [["short-10h-s1", "10H.1", "Two Rules"], ["short-10h-s2", "10H.2", "It Stopped"], ["short-10h-s3", "10H.3", "It Ran, but Did the Wrong Thing"], ["short-10h-s4", "10H.4", "It Said It Worked When It Did Not"], ["short-10h-s5", "10H.5", "The Checker Failed Too"], ["short-10h-s6", "10H.6", "Backups"], ["short-10h-s7", "10H.7", "When a Bot Looks Fine but Is Stuck"], ["short-10h-s8", "10H.8", "Keys and Passwords"], ["short-10h-s9", "10H.9", "Cost"]], "body": "<div class=\"intro\"><p><em>A handout for Module 10, both courses. One page, read at home. Each line is one real failure from Annie's build logs, with the log number. The stories told in class are not repeated here.<\/em><\/p>\n<\/div>\n<section class=\"card\" id=\"short-10h-s1\"><h2><span class=\"num\">10H.1<\/span> Two Rules<\/h2><ol>\n<li><strong>Check the result, not the report.<\/strong> A job saying &quot;done&quot; is not proof. Open the file, list the folder or read the message it produced.<\/li>\n<li><strong>The job that does the work must not be the only thing that checks it.<\/strong> Use something separate: a second check, a separate measurement, or a person looking.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"short-10h-s2\"><h2><span class=\"num\">10H.2<\/span> It Stopped<\/h2><ul>\n<li><strong>Log 14:<\/strong> an error handler that caught every error hid a missing import. So the sync function crashed on every call and had never worked once.<\/li>\n<li><strong>Log 43:<\/strong> the daily learning card crashed, because the bot re-saved its own file in a shape the script could not read.<\/li>\n<li><strong>Log 44:<\/strong> the vault sync jammed for six hours behind one frozen process.<\/li>\n<li><strong>Log 58:<\/strong> a vault reorganisation broke file addresses in four ways, including links outside the vault that a vault search could not find.<\/li>\n<li><strong>Log 61:<\/strong> three Google accounts failed with the same error. One account failing points to its login. Every account failing points to the app.<\/li>\n<li><strong>Log 75:<\/strong> the server's Claude login expired without warning after about 30 days, while chat on the phone still worked. The watchdog now warns 4 days ahead.<\/li>\n<li><strong>Log 94:<\/strong> moving to a new model provider broke three jobs, because keys and model names did not carry across. Only two of the three bots had changed model (Log 92).<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-10h-s3\"><h2><span class=\"num\">10H.3<\/span> It Ran, but Did the Wrong Thing<\/h2><ul>\n<li><strong>Log 04:<\/strong> the nightly sorter suggested the same inbox notes again every night.<\/li>\n<li><strong>Log 37:<\/strong> a second &quot;10 pm&quot; reminder that nobody had scheduled turned out to be the bot re-sending files when Annie replied &quot;done&quot;.<\/li>\n<li><strong>Log 51:<\/strong> a folder move left the old address in three files, so the bot found no deal documents for three weeks and said nothing.<\/li>\n<li><strong>Log 57:<\/strong> adding one storage unit meant editing five places. Missing any one would leave a gap nobody would see.<\/li>\n<li><strong>Log 71:<\/strong> before five notes were deleted, a search of the whole vault found one other note linking to all five. It was fixed first. This failure was prevented.<\/li>\n<li><strong>Log 85:<\/strong> the watchdog reported 249 broken photo links, and they were real. No step copied the photos into the vault.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-10h-s4\"><h2><span class=\"num\">10H.4<\/span> It Said It Worked When It Did Not<\/h2><ul>\n<li><strong>Log 25:<\/strong> after 36 days with no restarts, the bot looked healthy. Its sorter was failing on a usage limit, and its memory was full: 2,201 of 2,200 characters.<\/li>\n<li><strong>Log 30:<\/strong> a builder reported all tests passing. Its invoice code had 6 bugs, 4 of them fatal, and the main path had never run from start to finish.<\/li>\n<li><strong>Log 42:<\/strong> the bot fixed its rules correctly, but the job's own stored instruction said &quot;EXACTLY this format&quot;. So the morning message never changed.<\/li>\n<li><strong>Log 45:<\/strong> a nightly sync reported success for about four weeks while copying zero files. A folder move in July had broken its path.<\/li>\n<li><strong>Log 84:<\/strong> the bot sometimes said &quot;got it&quot; without saving the note. Now it saves, checks the file exists, and replies with where it saved it.<\/li>\n<li><strong>Log 90:<\/strong> &quot;save&quot; and &quot;write a build log&quot; became scripts that check their own writes on the disk. This failure was prevented.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-10h-s5\"><h2><span class=\"num\">10H.5<\/span> The Checker Failed Too<\/h2><ul>\n<li><strong>Log 66:<\/strong> the watchdog's first version ended with an error code when it found a problem. Then it reported its own job as failed, again and again.<\/li>\n<li><strong>Log 73:<\/strong> the bot must now report a failure in the same message. The watchdog looks for the failures nobody sees, every hour, at no cost.<\/li>\n<li><strong>Log 87:<\/strong> the cost meter logged every call to two Claude models at $0 for two months, because its price list did not include them.<\/li>\n<li><strong>Log 88:<\/strong> the watchdog now fixes broken vault links itself, with a $1 limit. It reports &quot;fixed&quot; only after its own check passes.<\/li>\n<li><strong>Log 102:<\/strong> the watchdog twice reported two healthy bots as down, because it read old status files.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-10h-s6\"><h2><span class=\"num\">10H.6<\/span> Backups<\/h2><ul>\n<li><strong>Log 21:<\/strong> the backup has three layers: a nightly copy on the server, a copy on Google Drive, and a message that arrives only if it fails. No AI model is involved.<\/li>\n<li><strong>Log 101:<\/strong> 59 files, including 13 baby-book photos, existed only on Annie's Mac. A daily copy from the Mac to the server now runs.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-10h-s7\"><h2><span class=\"num\">10H.7<\/span> When a Bot Looks Fine but Is Stuck<\/h2><ul>\n<li><strong>Log 78:<\/strong> one of Annie's bots showed as &quot;running&quot; for 12 hours while receiving nothing. Its program never stopped, so the automatic restart never started.<\/li>\n<li>A healthy bot keeps at least 2 open connections to Telegram. A stuck one keeps none.<\/li>\n<li>A separate script now checks every 5 minutes and restarts a bot with no connections. If it has to restart the same bot 3 times in 2 hours, it tells Annie.<\/li>\n<li><strong>Keep the list of automatic fixes short.<\/strong> Toby fixes only a few kinds of problem by himself. A dead backup, a stuck bot or an expired login still go to Annie (Log 88).<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-10h-s8\"><h2><span class=\"num\">10H.8<\/span> Keys and Passwords<\/h2><ul>\n<li><strong>Never print a key.<\/strong> When you look at settings, show the names of keys, not their values (Log 103).<\/li>\n<li><strong>Keep each key in one place.<\/strong> A key copied into several files must be changed in all of them. A half-finished change stops bots without warning (Log 103).<\/li>\n<li><strong>Change a key when any of these happens<\/strong> (Annie's notes, 30 Sep 2026):\n<ol>\n<li>A session is shared or shown to anyone.<\/li>\n<li>A new device joins your private network.<\/li>\n<li>A paid balance falls faster than your use explains.<\/li>\n<li>The server gains a second user.<\/li>\n<\/ol>\n<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-10h-s9\"><h2><span class=\"num\">10H.9<\/span> Cost<\/h2><ul>\n<li><strong>Log 36:<\/strong> measured from three meters in July 2026, running costs were about $14 a month in AI use plus $18 for the server. Building it cost about $85 to $90.<\/li>\n<\/ul>\n<p><strong>September 2026, in full.<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Line<\/th>\n<th>Amount<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Fixed subscriptions: server, server backup, Claude Pro, Obsidian Sync, VPN, the $10 model plan for the bots<\/td>\n<td>$55.67<\/td>\n<\/tr>\n<tr>\n<td>Bot use recorded by each bot's meter (the biggest line: the main bot on Claude Sonnet, $8.36)<\/td>\n<td>$11.55<\/td>\n<\/tr>\n<tr>\n<td><strong>Recorded by the cost note<\/strong><\/td>\n<td><strong>$67.22<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Anthropic API bill not recorded: $20.61, less the $8.36 already counted<\/td>\n<td>$12.25<\/td>\n<\/tr>\n<tr>\n<td><strong>Real total<\/strong><\/td>\n<td><strong>$79.47<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Of the $12.25, about $11 most likely came from Toby's automatic fixes using the API key by mistake, plus testing that day. One run by another assistant cost $1.30 (Build Log 89).<\/li>\n<li>June, July and August 2026 were $56.65, $55.69 and $57.97. That is about $57 on average. Months before 24 September may read slightly low, because the meter priced some Claude calls at $0 until then (Build Log 87).<\/li>\n<\/ul>\n<\/section>\n<details class=\"card ref\" id=\"short-10h-s10\"><summary><span class=\"num\">10H.10<\/span> Sources <span class=\"hint\">tap to open<\/span><\/summary><p>Hermes Build Logs 04, 14, 21, 25, 30, 36, 37, 42, 43, 44, 45, 51, 57, 58, 61, 66, 71, 73, 75, 78, 84, 85, 87, 88, 89, 90, 92, 94, 101, 102 and 103. Monthly AI Ecosystem Cost note. Annie's notes of 30 Sep 2026 on when to change a key. v1 Block 9, rules 1 and 2.<\/p>\n<\/details>\n<details class=\"card ref\" id=\"short-10h-s11\"><summary><span class=\"num\">10H.11<\/span> Related <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>10 — What Breaks, and Keeping It Honest (Merged)<\/li>\n<\/ul>\n<\/details>", "count": 11}, {"id": "short-11", "label": "11", "title": "Module 11: Growing It, Skills and Schedules", "minutes": 65, "read": 16, "toc": [["short-11-s1", "11.1", "What You Will Leave With"], ["short-11-s2", "11.2", "Before This Module"], ["short-11-s3", "11.3", "Finish the Build Brief"], ["short-11-s4", "11.4", "Add One Thing at a Time, and Saying No to a New Tool"], ["short-11-s5", "11.5", "Build and Test One Skill"], ["short-11-s6", "11.6", "Shown, Not Built: A Schedule on a Laptop"], ["short-11-s7", "11.7", "The Server Question"], ["short-11-s8", "11.8", "From the Record"], ["short-11-s9", "11.9", "Worksheet: Growing It"], ["short-11-s10", "11.10", "Teaching Notes"]], "body": "<div class=\"intro\"><p><strong>Why this module comes here.<\/strong><\/p>\n<ol>\n<li>Students now own a working system (Module 08, and Module 08B in the Full course).<\/li>\n<li>They have sorted their steps into script, model and person (Module 09).<\/li>\n<li>They have seen how a system fails and how a check catches it (Module 10).<\/li>\n<li>So now they can add to it safely.<\/li>\n<\/ol>\n<p><strong>What each course builds.<\/strong><\/p>\n<ul>\n<li><strong>Full course (server):<\/strong> a scheduled job that sends a message to Telegram, then a skill. Each one is tested before the next one starts.<\/li>\n<li><strong>Short course (laptop):<\/strong> a skill. A laptop schedule only runs while the laptop is awake, so the schedule is shown, not built.<\/li>\n<\/ul>\n<\/div>\n<section class=\"card\" id=\"short-11-s1\"><h2><span class=\"num\">11.1<\/span> What You Will Leave With<\/h2><p><strong>Both courses:<\/strong><\/p>\n<ul>\n<li>One skill that works when you ask for it, tested three ways.<\/li>\n<li>One tool you decided not to add, with your reason written down.<\/li>\n<\/ul>\n<p><strong>Short course only:<\/strong><\/p>\n<ul>\n<li>A finished Build Brief, with the five rows that make it safe to build.<\/li>\n<li>A one-sentence answer to the question &quot;do I need a server?&quot;<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-11-s2\"><h2><span class=\"num\">11.2<\/span> Before This Module<\/h2><ul>\n<li><strong>Full course:<\/strong> your server and bot from Module 08B, working. Build Brief 1 from Module 09.<\/li>\n<li><strong>Short course:<\/strong> your AI assistant from Module 08, working on your laptop. The five-row Build Brief you wrote at home after Module 09.<\/li>\n<li><strong>Both courses:<\/strong> your run card.<\/li>\n<\/ul>\n<p><strong>If your brief is not ready, use the umbrella example.<\/strong> It answers one question: do I need an umbrella today in Hong Kong? It uses the free Open-Meteo weather service, which needs no account and no key. It is a small version of Annie's own weather job (Build Log 35).<\/p>\n<\/section>\n<section class=\"card\" id=\"short-11-s3\"><h2><span class=\"num\">11.3<\/span> Finish the Build Brief<\/h2><p><em>15 minutes, Short course only. The Full course filled in these rows in Module 09.<\/em><\/p>\n<p>Your brief from Module 09 says what the job does. These five rows say what keeps it safe. Write them before anything is built, because the builder works from the brief.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Row<\/th>\n<th>What to write<\/th>\n<th>Why it matters<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Must never do<\/strong><\/td>\n<td>For example: send anything to another person; delete anything; touch Tier 3 information<\/td>\n<td>The AI assistant follows written limits. It cannot follow limits you only meant.<\/td>\n<\/tr>\n<tr>\n<td><strong>Needs my approval before<\/strong><\/td>\n<td>Any step where the AI assistant should stop and ask you first<\/td>\n<td>You decide the risky steps. The AI assistant does the rest.<\/td>\n<\/tr>\n<tr>\n<td><strong>Acceptance checks<\/strong><\/td>\n<td>Three checks, written now. The builder never changes them.<\/td>\n<td>If the builder can change the test, a test pass proves nothing.<\/td>\n<\/tr>\n<tr>\n<td><strong>How to undo it<\/strong><\/td>\n<td>What you would do to remove it, in one or two lines<\/td>\n<td>If you cannot undo it, you will be afraid to try it.<\/td>\n<\/tr>\n<tr>\n<td><strong>Keep-or-kill date<\/strong><\/td>\n<td>Two weeks after it starts working<\/td>\n<td>On that date you ask one question: did I use it?<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Tier 3<\/strong> is the information that never goes into any AI tool, such as passwords, keys and bank numbers (Module 02).<\/p>\n<p><strong>Put the keep-or-kill date in your calendar now.<\/strong> Annie set this two-week test for her morning brief when it went live on 6 July 2026 (Build Log 27).<\/p>\n<p><strong>In the Short course, your brief becomes a skill.<\/strong> The AI assistant does the job when you ask for it, instead of at a set time. Later in this module you build it.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-11-s4\"><h2><span class=\"num\">11.4<\/span> Add One Thing at a Time, and Saying No to a New Tool<\/h2><p><em>10 minutes, both courses.<\/em><\/p>\n<h3>Add One Thing at a Time<\/h3>\n<p><strong>Add one new thing. Test it. Use it for a few days. Then add the next.<\/strong><\/p>\n<p><strong>Why:<\/strong> in May 2026 Annie's first bot broke down. Its cheap AI model could not use its tools reliably. It said tasks were done when they were not: the log calls this &quot;faked success&quot;. Finding the fix took about a week of Annie's own research. The clean-up took 13 logged hours more (Build Log 00).<\/p>\n<p>The rule from her rebuild notes: <strong>&quot;Don't add features in batches.&quot;<\/strong> Version 2 started with three things: the soul file, the rules and one reminder. Her plan was to live with it for 24 to 48 hours before building more (Build Log 00).<\/p>\n<p><strong>The reason the rule works.<\/strong> If you add one thing and something breaks, there is one place to look. If you add three things, there are three places to look, and they can affect each other.<\/p>\n<h3>Saying No to a New Tool<\/h3>\n<p>New AI tools appear every week. Most of them will be offered to you as something you need.<\/p>\n<p><strong>Annie's example (Build Log 28).<\/strong> On 8 July 2026 someone she works with asked whether she used the Hermes desktop app. He said it could read all the files on her computer. She checked it and decided not to add it. Her four reasons:<\/p>\n<ol>\n<li><strong>She could already do it.<\/strong> Claude Code already read her files and her vault, and reached her server.<\/li>\n<li><strong>Her phone was already covered.<\/strong> Her bot on Telegram already reached her anywhere.<\/li>\n<li><strong>Her own setup was better.<\/strong> She asked: <em>&quot;even if I used Codex, wouldn't I just connect it to Obsidian or a shared folder both tools read, like I do now?&quot;<\/em> She was right. Her notes and rules live in her own vault, so any tool can read them, and no company holds them.<\/li>\n<li><strong>It would cost her more than it gave.<\/strong> It meant a second AI assistant that was not her main one, a new way into her system, and a large update to her live server.<\/li>\n<\/ol>\n<p><strong>Exercise.<\/strong> Write down one tool you have been tempted to add. Answer two questions:<\/p>\n<ol>\n<li>What would it let me do that I cannot do now?<\/li>\n<li>What would I have to look after if I added it?<\/li>\n<\/ol>\n<p>If the first answer is &quot;nothing new&quot;, the answer is no for now. Write the reason on your run card.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-11-s5\"><h2><span class=\"num\">11.5<\/span> Build and Test One Skill<\/h2><p><em>Full course: 20 minutes. Short course: 25 minutes.<\/em><\/p>\n<p><strong>A skill is a written procedure that the AI assistant reads only when it is needed.<\/strong><\/p>\n<p><strong>Why skills exist (Build Log 19).<\/strong> The AI assistant's built-in memory is small. Annie's bot has 2,200 characters, and it reads all of them with every message. A six-step procedure saved there filled it, and left no room for facts. So the rule is: <strong>facts in memory, procedures in skills.<\/strong> The Full course met this rule in Module 07.<\/p>\n<h3>What a Skill Is<\/h3>\n<p>A skill is a folder. Inside it is one file, named exactly <code>SKILL.md<\/code>. The file starts with a short description, then the steps.<\/p>\n<p><strong>Three facts decide whether a skill works (Build Logs 90 and 98):<\/strong><\/p>\n<ol>\n<li><strong>The AI assistant reads only the name and description at the start.<\/strong> It reads the steps only when your request matches the description.<\/li>\n<li><strong>So the description must say when to use the skill, in the words you would type.<\/strong> A phrase that is not in the description will not start the skill. The limit is 1,024 characters. Annie's continuity and build-log skills use 914 and 1,004.<\/li>\n<li><strong>The file name must be exactly <code>SKILL.md<\/code>.<\/strong> In September 2026 one of Annie's skill folders held a backup copy named <code>SKILL.md.bak-20260929-170928<\/code>. The AI assistant could not see it, because the name was different (Build Log 98).<\/li>\n<\/ol>\n<p><strong>A skill is used reliably once the rules file points to it.<\/strong> On Annie's bot, a skill starting by itself has never been enough. Her client-document skill was used reliably once her rules file pointed to it, so she did the same for her Storage Inventory skill (Build Log 48). So the last step is to add one line to your rules file.<\/p>\n<h3>What Your Skill Does<\/h3>\n<ul>\n<li><strong>Full course:<\/strong> it runs the scheduled job's script when you ask, and sends you the result. So you can ask &quot;do I need an umbrella?&quot; at any time, not only at 7 am.<\/li>\n<li><strong>Short course:<\/strong> it does the job from your Build Brief when you ask for it.<\/li>\n<\/ul>\n<h3>Where the Skill Goes<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Course<\/th>\n<th>Folder<\/th>\n<th>How to check it loaded<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Full<\/td>\n<td><code>~/.hermes/skills/&lt;skill-name&gt;/SKILL.md<\/code> on the server<\/td>\n<td><code>hermes skills list<\/code> shows it. Then type <code>/new<\/code> in Telegram, because an open chat keeps the instructions it started with<\/td>\n<\/tr>\n<tr>\n<td>Short<\/td>\n<td><code>~/.agents/skills/&lt;skill-name&gt;/SKILL.md<\/code> on the laptop<\/td>\n<td>Start a new pi session. pi read skills from this folder on Annie's Mac (checked 10 Oct 2026)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Build It<\/h3>\n<p>Paste this to your builder (Claude Code in the Full course, pi in the Short course):<\/p>\n<pre><code class=\"language-text\">Make a skill for [the job from my Build Brief / my scheduled job's script].\nPut it in [the folder from the table], in a folder named [skill-name], with one file named exactly SKILL.md.\nWrite the description as a list of the phrases I would actually type to ask for it, such as &quot;do I need an umbrella&quot;.\nFollow the &quot;Must never do&quot; and &quot;Needs my approval before&quot; rows in my brief.\nThen add one line to my rules file that names the skill and says when to use it.\nShow me the SKILL.md before you save it.\n<\/code><\/pre>\n<h3>Test It Three Ways<\/h3>\n<ol>\n<li><strong>Ask in the words from the description.<\/strong> The AI assistant should use the skill.<\/li>\n<li><strong>Ask in different words you would also use.<\/strong> If it does not use the skill, add those words to the description and test again.<\/li>\n<li><strong>Ask something unrelated.<\/strong> The AI assistant should not use the skill.<\/li>\n<\/ol>\n<p><strong>It passed if<\/strong> all three tests give the right result, and your three acceptance checks from the brief pass.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-11-s6\"><h2><span class=\"num\">11.6<\/span> Shown, Not Built: A Schedule on a Laptop<\/h2><p><em>5 minutes, Short course only.<\/em><\/p>\n<p>A laptop can run a job at a set time. But it runs only while the laptop is awake. If the lid is shut at 7 am, the 7 am job does not run, and nothing tells you.<\/p>\n<p><strong>That is why the Short course builds a skill today.<\/strong> A skill works whenever the laptop is on and you ask for it.<\/p>\n<p><strong>If you took the optional server sitting,<\/strong> build a scheduled job as homework. Follow the Full course steps in &quot;Build the Scheduled Job&quot; above. Bring questions to Module 12.<\/p>\n<div class=\"shared\"><div class=\"sharedlabel\">The steps it points to, from the Full course section \"Build the Scheduled Job\"<\/div><p><em>40 minutes, Full course only.<\/em><\/p>\n<h3>Step 1. Write the Script and Test It Without Sending Anything (20 minutes)<\/h3>\n<p>Log in to your server with <code>ssh myserver<\/code>. Start Claude Code in your vault folder, as in Module 08B. Paste:<\/p>\n<pre><code class=\"language-text\">Read Build Brief 1 in my AI System folder. Ask me every question you have before you start.\nThen write a script in ~/.hermes/scripts/ that does the scripted steps.\nRules:\n- Print the message only when there is something to say. Print nothing otherwise.\n- If anything fails, print one line starting with a warning sign, saying what failed. Never fail silently.\n- Add a --dry-run option. It prints what it would send, sends nothing, and changes no saved file.\n- Back up any file before you edit it.\n- Follow the &quot;Must never do&quot; and &quot;Needs my approval before&quot; rows in my brief.\nShow me the script before you save it. Then run it with --dry-run and show me the output.\n<\/code><\/pre>\n<p><strong>The umbrella version, if you have no brief:<\/strong> ask for a script that gets today's hourly rain forecast for Hong Kong from Open-Meteo. If any hour is likely to rain, it prints &quot;Umbrella today&quot; with the wettest hours. On a dry day it prints nothing.<\/p>\n<p><strong>It passed if<\/strong> <code>--dry-run<\/code> prints the message you expect, and a second dry run shows that no file changed.<\/p>\n<p><strong>If it fails:<\/strong> read the line it printed. Most first failures are a missing library, a wrong file path or the wrong time zone. Ask the builder to explain the error in plain words before it fixes anything.<\/p>\n<p><strong>If your brief needs an email or calendar login,<\/strong> switch to the umbrella version today. Build your real job as homework. A login takes longer than the class has.<\/p>\n<h3>Step 2. Send One Labelled Test (5 minutes)<\/h3>\n<p>Ask the builder to send you one real message, with &quot;🧪 TEST&quot; at the start.<\/p>\n<p><strong>Why:<\/strong> this is Annie's habit. She sends herself one test labelled &quot;🧪 TEST&quot; and only lets the job go live after she approves it (Build Log 37). The label stops you mistaking a test for the real thing.<\/p>\n<p><strong>It passed if<\/strong> the message arrives on your phone, and it reads the way you want.<\/p>\n<h3>Step 3. Put It on the Schedule and Run It Once (15 minutes)<\/h3>\n<p><strong>Ask the builder to create the job.<\/strong> The exact options change between Hermes versions, so the builder reads the help first:<\/p>\n<pre><code class=\"language-text\">Run &quot;hermes cron create --help&quot; and read it. Then create a no-agent job that runs my script at [time] every [day], and delivers to my Telegram. Show me the command before running it.\n<\/code><\/pre>\n<p><strong>Choose a time when you want messages.<\/strong> Annie groups her scheduled messages into set times: a morning burst and a 6 pm admin slot. A new message must fit one of them, or it needs her yes (Build Log 27; Claudith Clean Brief Style note).<\/p>\n<p><strong>Your builder may refuse to create the job.<\/strong> In September 2026 Claude Code's own safety check stopped it from installing a permanent job on Annie's server. She typed the final command herself (Build Log 78). This is correct: the owner approves anything permanent. If it happens to you, read the command. If you agree with it, run it yourself.<\/p>\n<p><strong>Then run it once through the scheduler.<\/strong> A job that works when you run it by hand can still fail on the schedule.<\/p>\n<pre><code class=\"language-bash\">hermes cron list\nhermes cron run &lt;job-id&gt;\n<\/code><\/pre>\n<p><code>hermes cron run<\/code> runs the job at the scheduler's next check, so the message can take up to a minute.<\/p>\n<p><strong>It passed if<\/strong> the job is in the list with the right time, and the message arrives on your phone.<\/p>\n<p><strong>If your job checks for things it already sent, run it a second time.<\/strong> The second run should send nothing.<\/p>\n<p><strong>Keep every job in the one scheduler.<\/strong> In August 2026 Annie found a job installed outside Hermes, in the server's own scheduler. It ran every night and reported success, b
