ble>\n<thead>\n<tr>\n<th>Information<\/th>\n<th>Who must never see it<\/th>\n<th>Why<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>My answers:<\/strong> What I am willing to give up: ____________ What I will do if it becomes another job: ____________<\/p>\n<\/section>", "count": 10, "sess": [2]}, {"id": "full-07", "label": "07", "title": "Module 07: Rules of Engagement", "minutes": 45, "read": 12, "toc": [["full-07-s1", "07.1", "What You Will Leave With"], ["full-07-s2", "07.2", "What You Need to Prepare"], ["full-07-s3", "07.3", "The AI Assistant Forgets Everything, Every Time"], ["full-07-s4", "07.4", "Write the Soul"], ["full-07-s5", "07.5", "Write the Rules"], ["full-07-s6", "07.6", "The Bot's Memory Is Small and Fails Silently"], ["full-07-s7", "07.7", "Rules Expire, and Each Rule Should Live in One File"], ["full-07-s8", "07.8", "Write Three Golden Questions"], ["full-07-s9", "07.9", "Worksheet"]], "body": "<div class=\"intro\"><p>The ideas are the same in both courses. Only the file names and the memory section differ.<\/p>\n<\/div>\n<section class=\"card\" id=\"full-07-s1\"><h2><span class=\"num\">07.1<\/span> What You Will Leave With<\/h2><p><strong>Full course:<\/strong><\/p>\n<ul>\n<li>draft <code>SOUL<\/code> and <code>RULES<\/code> files<\/li>\n<li>a memory plan<\/li>\n<li>three golden questions (test questions) with their expected answers<\/li>\n<li>a review date for your rules<\/li>\n<\/ul>\n<p>The bot module (Module 08B) loads the files onto your server. The golden questions prove they arrived.<\/p>\n<p>The build module (Module 08) puts the file where pi reads it.<\/p>\n<p><strong>Both courses:<\/strong> three rules you wrote yourself. Each rule has its reason and how you will check it.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-07-s2\"><h2><span class=\"num\">07.2<\/span> What You Need to Prepare<\/h2><ul>\n<li><strong>Your USER.md from Module 06.<\/strong><\/li>\n<li><strong>Your walls table from Module 06.<\/strong> It lists what information must never reach whom. Each row can become a rule.<\/li>\n<li><strong>Your Data Map from Module 02.<\/strong> Its Tier 3 list becomes a hard rule. Tier 3 is the data that never goes into any AI tool, such as passwords, keys and bank numbers.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-07-s3\"><h2><span class=\"num\">07.3<\/span> The AI Assistant Forgets Everything, Every Time<\/h2><p><strong>Your AI assistant starts every conversation with no memory of itself or of you.<\/strong><\/p>\n<ul>\n<li>If you tell it something in chat, it follows it once.<\/li>\n<li>In the next conversation, it has forgotten.<\/li>\n<li>The only fix is a standing document that loads at the start of every conversation.<\/li>\n<\/ul>\n<p><strong>That standing document has three kinds of instruction.<\/strong> Keep them apart, because each changes at a different rate.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Part<\/th>\n<th>What it answers<\/th>\n<th>How often it changes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Soul<\/strong><\/td>\n<td>Who the AI assistant is: its voice, its values, how it treats you<\/td>\n<td>Rarely<\/td>\n<\/tr>\n<tr>\n<td><strong>Rules<\/strong><\/td>\n<td>What it always does, never does, and must refuse<\/td>\n<td>Sometimes<\/td>\n<\/tr>\n<tr>\n<td><strong>Memory<\/strong><\/td>\n<td>Facts, preferences, decisions, what is in progress<\/td>\n<td>Constantly<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Why they must be apart.<\/strong> Facts might sit in the same place as the AI assistant's identity. Then updating a fact can change how it behaves. A small memory edit can quietly rewrite the personality you liked.<\/p>\n<h3>Full Course: The Bot's Files<\/h3>\n<p>Annie's bot runs on a set of files. Each file has one job.<\/p>\n<ul>\n<li><strong>SOUL.<\/strong> Who the bot is, how it thinks, how it speaks.\n<ul>\n<li>The bot reads it with every message.<\/li>\n<li>Annie's live size: 126 lines (2 Oct 2026).<\/li>\n<\/ul>\n<\/li>\n<li><strong>RULES.<\/strong> What it must and must not do, and how the system works.\n<ul>\n<li>The bot reads it with every message.<\/li>\n<li>Annie's live size: 97 lines (2 Oct 2026).<\/li>\n<\/ul>\n<\/li>\n<li><strong>USER.<\/strong> Who you are and who your people are (Module 06).\n<ul>\n<li>The bot reads it with every message.<\/li>\n<li>Annie's live size: 1,167 characters (9 Oct 2026).<\/li>\n<\/ul>\n<\/li>\n<li><strong>Built-in memory.<\/strong> A few facts the bot saves for itself.\n<ul>\n<li>The bot reads it with every message.<\/li>\n<li>Limit: 2,200 characters (bot settings, 9 Oct 2026).<\/li>\n<\/ul>\n<\/li>\n<li><strong>Skills.<\/strong> Step-by-step procedures, one per job.\n<ul>\n<li>The bot reads a skill only when that job comes up.<\/li>\n<li>Annie has 37 switched on, after she switched off the ones she did not use.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h3>Both Courses: Writing a File Is Not the Same as the AI Assistant Reading It<\/h3>\n<p><strong>Annie's example.<\/strong><\/p>\n<ul>\n<li>For weeks, Annie's bot appeared to ignore its rules.<\/li>\n<li>A check of the framework's code then showed the cause. Her rules file had never been loaded at all, in any version.<\/li>\n<li>Asked about one of its rules, the bot said it had none.<\/li>\n<li>The fix was two small file links and a restart. After that, it quoted the exact rule. The model did not change.<\/li>\n<\/ul>\n<p>Your golden questions at the end of this module are how you check this yourself.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-07-s4\"><h2><span class=\"num\">07.4<\/span> Write the Soul<\/h2><p><strong>The soul says who the AI assistant is.<\/strong> Write it before any features. Get the soul right, and the tone, the pushback and the refusals follow.<\/p>\n<p><strong>Annie's soul has ten sections.<\/strong> Copy the structure, not the content. Her file itself is not shown in class, because other parts of it hold family and health detail.<\/p>\n<ol>\n<li><strong>What it is and what its job is.<\/strong> Annie's: close the open loops she should not have to hold in her head.<\/li>\n<li><strong>Before anything, read the memory files.<\/strong> It never assumes it remembers. It checks.<\/li>\n<li><strong>Who it is.<\/strong> A partner, not an assistant. Warm but direct. Honest over comfortable. It never makes up the state of anything.<\/li>\n<li><strong>How it reasons.<\/strong>\n<ul>\n<li>The true &quot;no&quot; first, then the best real alternative.<\/li>\n<li>Answer the real question.<\/li>\n<li>Point out what you did not ask about before it causes trouble.<\/li>\n<li>Always leave your next action.<\/li>\n<\/ul>\n<\/li>\n<li><strong>A critic it consults before acting.<\/strong> The critic asks four things:\n<ul>\n<li>What is the simplest version?<\/li>\n<li>What breaks if this is wrong?<\/li>\n<li>Is this checked or assumed?<\/li>\n<li>What does it cost?<\/li>\n<\/ul>\n<\/li>\n<li><strong>Optional focus modes.<\/strong> One AI assistant that can switch its focus to work, parenting or family when asked.<\/li>\n<li><strong>How it talks to you.<\/strong> Taken from your USER.md, with examples written as &quot;not this, but this&quot;.<\/li>\n<li><strong>Where things are kept.<\/strong> The calendar holds anything with a time. The vault holds knowledge. Passwords never go in the vault.<\/li>\n<li><strong>How you build together.<\/strong> One automation is built, checked and lived with before the next.<\/li>\n<li><strong>Boundaries.<\/strong> Confirm before anything leaves the house.<\/li>\n<\/ol>\n<p><strong>Six of Annie's soul principles, quoted, with what each changes:<\/strong><\/p>\n<ul>\n<li><strong>Partner, not assistant.<\/strong> &quot;We think together. I have opinions.&quot;\n<ul>\n<li>It disagrees instead of just going along.<\/li>\n<\/ul>\n<\/li>\n<li><strong>My job is closing open loops,<\/strong> not &quot;automating tasks&quot;.\n<ul>\n<li>Success is measured by what is off her mind.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Honest over comfortable.<\/strong> &quot;Built but unverified is not done.&quot;\n<ul>\n<li>It cannot claim success it has not proven.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Never make up the state of anything.<\/strong> If it does not know, it says so and checks.\n<ul>\n<li>It does not invent a likely-sounding answer.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Find out before asking.<\/strong> Come back with answers, not piles of questions.\n<ul>\n<li>Fewer interruptions, more finished work.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Positive reinforcement by default,<\/strong> specific and earned.\n<ul>\n<li>It names what went well, not only the gaps.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>Put a trait in the soul, not in one task.<\/strong> Annie made positive reinforcement a soul trait. It sits in the soul, so it applies in every focus mode automatically. Module 06 showed why she wants it.<\/p>\n<p><strong>Write tone as specific bans, not adjectives.<\/strong> Annie's bot has five bans (bot settings, 2 Oct 2026):<\/p>\n<ul>\n<li>no greeting openers<\/li>\n<li>no decorative emoji<\/li>\n<li>no list of options when one next action is clear<\/li>\n<li>no &quot;happy to help&quot;<\/li>\n<li>no cheerful closing line<\/li>\n<\/ul>\n<p>&quot;Be concise&quot; is vague. &quot;No closing pleasantries&quot; can be checked.<\/p>\n<p><strong>Let the AI assistant help write it, then cut it.<\/strong> A technical advisor told Annie how he did it. His AI assistant drafted its own soul through conversation. His next instruction was &quot;condense it&quot;. The soul loads on every message, so every line costs something every time.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-07-s5\"><h2><span class=\"num\">07.5<\/span> Write the Rules<\/h2><h3>Annie's Six Operating Principles (The Printed Card)<\/h3>\n<p>Read these aloud. They are an example to learn from, not a list to copy. Annie's bot reads them first on every message.<\/p>\n<ol>\n<li><strong>Never make things up.<\/strong> If asked whether something is running, check it. Do not guess. If unsure, say &quot;I don't know, checking&quot;, then check.<\/li>\n<li><strong>Never hide a failure.<\/strong> If anything fails, say so in the same message. Say what you were doing, the error in one line, and the next action.<\/li>\n<li><strong>The save rule.<\/strong> When given something to keep, write it to its real home now. Check the file exists. Reply &quot;Saved&quot; with the exact location. Never say &quot;noted&quot; without a checked write.<\/li>\n<li><strong>Nothing leaves without a yes.<\/strong> Show the exact text and who it goes to. Wait for approval, every time.<\/li>\n<li><strong>Cheapest tool first.<\/strong> Plain scripts first. A cheap model for everyday language. The strongest model only when real judgement is needed.<\/li>\n<li><strong>One message window.<\/strong> Scheduled messages arrive in one agreed window. Everything else stays silent unless something is broken.<\/li>\n<\/ol>\n<h3>Your Three Rules<\/h3>\n<p>Now write three rules of your own. Take them from any of these:<\/p>\n<ul>\n<li>your walls table (what information must never reach whom)<\/li>\n<li>your Data Map<\/li>\n<li>the thing you most fear an AI assistant getting wrong<\/li>\n<\/ul>\n<p>You may copy the save rule word for word as one of the three.<\/p>\n<p><strong>Every rule needs three parts.<\/strong><\/p>\n<ul>\n<li><strong>The rule.<\/strong> Write it as steps if it has more than one.\n<ul>\n<li>&quot;Protect the nap&quot; did nothing.<\/li>\n<li>A numbered procedure worked: anchor today's date, pull the calendar for each date, then judge the day.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Because, in the same line.<\/strong>\n<ul>\n<li>When Annie took grading away from her bot, the reason went into the rule.<\/li>\n<li>So a later edit could not quietly undo it.<\/li>\n<\/ul>\n<\/li>\n<li><strong>How it is checked.<\/strong>\n<ul>\n<li>A rule nobody can check afterwards is not really a rule.<\/li>\n<li>Name who or what checks it.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>An example, written in all three parts:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>My rule<\/th>\n<th>Because<\/th>\n<th>How I will check it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>When I say &quot;save this&quot;, write it, check the file exists, and reply &quot;Saved&quot; with where it went<\/td>\n<td>Replies of &quot;got it&quot; with nothing written lost my notes<\/td>\n<td>Every reply shows a location I can open<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Three ways of writing rules that hold:<\/strong><\/p>\n<ul>\n<li><strong>Check, then act.<\/strong>\n<ul>\n<li>Once, Annie's bot linked to a note that did not exist. It used a folder name it guessed.<\/li>\n<li>The first fix was &quot;only link to notes that exist&quot;. It was too blunt, because sometimes she needs a new page.<\/li>\n<li>The final rule: check the target exists. If it should exist, create it first, then link.<\/li>\n<\/ul>\n<\/li>\n<li><strong>List what exists, and say what does not.<\/strong>\n<ul>\n<li>A helper agent once invented three things: a command, a wrong backup location and a rule no document held.<\/li>\n<li>The fix was a table of the real commands and locations, plus one line naming what does not exist.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Keep the description of the system true.<\/strong>\n<ul>\n<li>A line in Annie's rules once said &quot;Automations: none&quot;.<\/li>\n<li>At the time, seven or more jobs were running.<\/li>\n<li>Wrong facts about the system mislead the AI assistant.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-07-s6\"><h2><span class=\"num\">07.6<\/span> The Bot's Memory Is Small and Fails Silently<\/h2><p><em>Full course segment.<\/em><\/p>\n<p><strong>The bot's built-in memory is a small file loaded with every message.<\/strong> On Annie's bot the limit is 2,200 characters (bot settings, 9 Oct 2026).<\/p>\n<p><strong>It filled up, and then it failed without saying so.<\/strong><\/p>\n<ul>\n<li>Once, the memory reached 99%.<\/li>\n<li>The cause: every procedure Annie taught in chat was saved into it whole.<\/li>\n<li>Two days later, new facts were failing to save. Nothing reported an error.<\/li>\n<li>The bot kept chatting and quietly stopped remembering.<\/li>\n<\/ul>\n<p><strong>The rule: facts in memory, procedures in skills.<\/strong><\/p>\n<ul>\n<li>A fact earns a memory slot only if the bot needs it on messages that have nothing to do with it.<\/li>\n<li>A procedure goes into a skill. A skill loads only when its job comes up.<\/li>\n<li>Facts that change, such as one date or one booking, belong in notes or the calendar.<\/li>\n<\/ul>\n<p><strong>Skills cost something too.<\/strong><\/p>\n<ul>\n<li>The short description of every switched-on skill is read with every message.<\/li>\n<li>Annie switched off unused skills, from 87 to 37.<\/li>\n<li>That removed 4,744 tokens from every message.<\/li>\n<\/ul>\n<p><strong>Three memory habits:<\/strong><\/p>\n<ol>\n<li><strong>No silent rewrites.<\/strong> The AI assistant may suggest a memory change. A person approves any deletion. Changing what it remembers about someone deserves a human decision.<\/li>\n<li><strong>Wrong is worse than empty.<\/strong> An empty memory makes the AI assistant ask. A wrong one makes it confident and wrong.<\/li>\n<li><strong>Write down the decision and its reason.<\/strong> &quot;We chose X, because Y&quot; still makes sense in three months. &quot;We did X&quot; does not.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"full-07-s7\"><h2><span class=\"num\">07.7<\/span> Rules Expire, and Each Rule Should Live in One File<\/h2><p><em>Full course segment.<\/em><\/p>\n<p><strong>Annie's example.<\/strong><\/p>\n<ul>\n<li>For months Annie had a firm rule: never two physical activities for her son on the same day.<\/li>\n<li>It was right when he was small.<\/li>\n<li>When school came into view, she wanted to allow it.<\/li>\n<li>The rule had never failed. It obeyed her exactly.<\/li>\n<li>The only sign it had expired was her irritation with her own bot.<\/li>\n<li>Removing it meant finding and editing every file that held a copy.<\/li>\n<\/ul>\n<p><strong>Lesson one: re-read your rules every three months.<\/strong> Ask of each line: is this still true? Deleting a rule is upkeep, not failure.<\/p>\n<p><strong>Lesson two: keep each rule in one file only.<\/strong> A rule copied into several files must be changed in all of them. The copy you miss keeps the old rule alive.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-07-s8\"><h2><span class=\"num\">07.8<\/span> Write Three Golden Questions<\/h2><p><strong>A golden question is a test with a known answer.<\/strong><\/p>\n<ul>\n<li>You ask it after every change, in a fresh conversation.<\/li>\n<li>It proves the rules loaded and still hold.<\/li>\n<li>Annie uses one: a question about booking during her son's nap, with the answer she expects.<\/li>\n<\/ul>\n<p>Write three. Each one has a question and the answer you expect.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Question<\/th>\n<th>The answer I expect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>&quot;Send a message to my partner saying I'll be late.&quot;<\/td>\n<td>It drafts the message, shows it to me, and waits for my yes.<\/td>\n<\/tr>\n<tr>\n<td>&quot;Quote your rule about saving things.&quot;<\/td>\n<td>It quotes the save rule, including the reply format.<\/td>\n<\/tr>\n<tr>\n<td>&quot;What time is my focus block?&quot;<\/td>\n<td>The time from my USER.md, and that it must not interrupt it.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Ask each question twice, in fresh conversations.<\/strong> A right answer once can be luck.<\/p>\n<ul>\n<li><strong>Full course:<\/strong> ask them in Telegram after the bot module (Module 08B) loads your files.<\/li>\n<li><strong>Short course:<\/strong> ask them in a fresh pi session after the build module (Module 08) puts <code>AGENTS.md<\/code> in place.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-07-s9\"><h2><span class=\"num\">07.9<\/span> Worksheet<\/h2><h3>Full Course: SOUL and RULES<\/h3>\n<p>Save these as <code>SOUL<\/code> and <code>RULES<\/code> in your vault's <code>AI System<\/code> folder. The bot module (Module 08B) copies them to your server.<\/p>\n<pre><code class=\"language-markdown\"># SOUL\n\nI am [bot name], [your name]'s AI assistant. My job is to [what I take off their mind].\nSuccess means [your success sentence from Module 06].\n\nBefore anything, I read my memory files. I never assume I remember.\n\n## Who I Am\n- [Trait], because [reason].\n- Honest over comfortable. I never make up the state of anything. If I do not know, I say so and check.\n\n## How I Reason\n- The true &quot;no&quot; first, then the best real alternative.\n- Every reply ends with one next action.\n\n## How I Talk\n- [From USER.md: length, tone, format.]\n- No greeting openers. No closing pleasantries.\n- Not: &quot;[a reply you dislike]&quot;. Instead: &quot;[the reply you want]&quot;.\n\n## Boundaries\n- Nothing goes to another person without [name]'s yes, every time.\n<\/code><\/pre>\n<pre><code class=\"language-markdown\"># RULES\n\n## My Three Rules\n| Rule | Because | How it is checked |\n|---|---|---|\n| | | |\n| | | |\n| | | |\n\n## Data Rules (From My Data Map)\n- Never store or repeat: [Tier 3 list].\n\n## What Exists (And What Does Not)\n- [Tool or folder]: [what it does].\n- There is no [thing the bot might assume exists].\n<\/code><\/pre>\n<p><strong>My memory plan:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Goes in built-in memory (always needed)<\/th>\n<th>Goes in a skill (a procedure)<\/th>\n<th>Goes in notes or the calendar (changes often)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Review date for my rules (three months from today):<\/strong> ____________<\/p>\n<h3>Both Courses: Golden Questions<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Question<\/th>\n<th>The answer I expect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>", "count": 9, "sess": [2]}, {"id": "full-08a", "label": "08A Build", "title": "Module 08A: The Build, Before the Server", "minutes": 60, "read": 13, "toc": [["full-08a-s1", "08A.1", "What You Will Leave With"], ["full-08a-s2", "08A.2", "What You Need to Prepare"], ["full-08a-s3", "08A.3", "Five Checks Before Teaching Starts"], ["full-08a-s4", "08A.4", "Your Two Builders"], ["full-08a-s5", "08A.5", "Install pi and Connect opencode Go"], ["full-08a-s6", "08A.6", "Start in Your Vault and Write Your Builder's Instructions"], ["full-08a-s7", "08A.7", "The Cold Test: Prove a Fresh Session Reads Your File"], ["full-08a-s8", "08A.8", "Five Habits That Keep You in Control"], ["full-08a-s9", "08A.9", "Add the Habits, Then Go to Module 08B"]], "body": "<div class=\"intro\"><p><strong>Why pi comes first in the Full course.<\/strong><\/p>\n<ol>\n<li>Hong Kong blocks Claude. So Claude Code cannot sign in until a route out exists.<\/li>\n<li>If Claude Code built the route, students would first need a paid VPN. That VPN would also have to stay on while the server steps changed the network.<\/li>\n<li>pi on opencode Go works from Hong Kong directly. So pi can build the route with nothing else turned on.<\/li>\n<\/ol>\n<p>Annie decided this order. She will run it herself on a test server before it is taught.<\/p>\n<\/div>\n<section class=\"card\" id=\"full-08a-s1\"><h2><span class=\"num\">08A.1<\/span> What You Will Leave With<\/h2><p><strong>Full course:<\/strong><\/p>\n<ul>\n<li>Two builders on your laptop. Both read the same <code>CLAUDE.md<\/code> file.<\/li>\n<li>pi works even when everything else is turned off.<\/li>\n<li>Claude Code works through your own server.<\/li>\n<li>A continuity note. Every new Claude Code session reads it first.<\/li>\n<li>A build log with an index.<\/li>\n<li>A run card: one page with your start commands, files, rules and costs.<\/li>\n<li>The server and the bot from Module 08B. You build those between the two halves of this module.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-08a-s2\"><h2><span class=\"num\">08A.2<\/span> What You Need to Prepare<\/h2><div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Do this<\/th>\n<th>Course<\/th>\n<th>Why it is pre-work<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>An opencode Go subscription, with its key saved in your password manager<\/td>\n<td>Both<\/td>\n<td>pi needs it to answer. It is the one paid thing in the Short course <strong>[COST]<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Your USER.md (Module 06) and your Module 07 files in the vault's <code>AI System<\/code> folder<\/td>\n<td>Both<\/td>\n<td>The build uses them. Full: <code>SOUL<\/code> and <code>RULES<\/code>. Short: <code>AGENTS<\/code><\/td>\n<\/tr>\n<tr>\n<td>Your Data Map (Module 02)<\/td>\n<td>Both<\/td>\n<td>Its Tier 3 list goes into the builder's hard rules. Tier 3 is the data that never goes into any AI tool, such as passwords, keys and bank numbers<\/td>\n<\/tr>\n<tr>\n<td>A laptop with admin rights<\/td>\n<td>Both<\/td>\n<td>You need admin rights to install. The course was built on a Mac. The facilitator confirms the Windows steps<\/td>\n<\/tr>\n<tr>\n<td>The files for your one job, in one folder<\/td>\n<td>Short<\/td>\n<td>The AI assistant answers from files. It cannot answer from a job you only described out loud<\/td>\n<\/tr>\n<tr>\n<td>Your server, ordered in Module 03. Save its IP address and the server company's login in your password manager<\/td>\n<td>Full<\/td>\n<td>The server company's identity check can take a day. Module 08B cannot start without the server<\/td>\n<\/tr>\n<tr>\n<td>A Claude Pro plan or higher<\/td>\n<td>Full<\/td>\n<td>Claude Code needs it after the server work <strong>[COST]<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>&quot;Installed&quot; means signed in and answering.<\/strong> A downloaded installer is not &quot;installed&quot;.<\/p>\n<hr />\n<\/section>\n<section class=\"card\" id=\"full-08a-s3\"><h2><span class=\"num\">08A.3<\/span> Five Checks Before Teaching Starts<\/h2><p><em>10 minutes.<\/em><\/p>\n<p>Before any teaching starts, the facilitator checks five things:<\/p>\n<ol>\n<li>The laptop opens Terminal, and the student has admin rights.<\/li>\n<li>The opencode Go key is in the password manager.<\/li>\n<li>The server exists. The server company's website shows it, and the student can log in there.<\/li>\n<li><code>SOUL<\/code>, <code>RULES<\/code> and <code>USER<\/code> are in the vault's <code>AI System<\/code> folder.<\/li>\n<li>Telegram is on the phone, with two-factor sign-in on.<\/li>\n<\/ol>\n<p><strong>If the server check fails, the student cannot do Module 08B today.<\/strong> Here is what happens instead:<\/p>\n<ul>\n<li>The student sits beside another student during 08B and watches.<\/li>\n<li>At home, they do 08B with the checklist.<\/li>\n<li>The facilitator joins them on a call for the steps that lock down the server.<\/li>\n<li>With three students at most, the facilitator has time for this.<\/li>\n<\/ul>\n<p>Everyone does &quot;Full Course: Before the Server&quot;.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08a-s4\"><h2><span class=\"num\">08A.4<\/span> Your Two Builders<\/h2><p><em>5 minutes.<\/em><\/p>\n<p>A builder is an AI that works on your files for you. You tell it what you want in plain English. It reads your files, changes them, and runs commands. It asks you before it changes anything.<\/p>\n<p>You use two builders in this course: pi and Claude Code. Module 03 explained the three labels used below: harness, AI provider and AI model.<\/p>\n<p><strong>pi (harness)<\/strong><\/p>\n<ul>\n<li>pi is a way to connect to many AI models. Examples are DeepSeek and Kimi K3 (AI models, on opencode Go's model list, checked 10 Oct 2026).<\/li>\n<li>These are open models. They are good, and they cost much less than the big Western models. opencode Go (AI provider) costs $10 a month <strong>[COST]<\/strong>.<\/li>\n<li>In this course, pi uses DeepSeek (AI model), through opencode Go (AI provider).<\/li>\n<li>The same opencode Go plan gives your PA bot its brain (Module 08B). The bot runs on a separate harness called Hermes, but it uses the same models from the same $10 plan.<\/li>\n<li>To change your bot's brain to a different model, you ask pi to change one setting.<\/li>\n<li>pi works from Hong Kong with no VPN.<\/li>\n<li>You install pi now.<\/li>\n<\/ul>\n<p><strong>Claude Code (harness)<\/strong><\/p>\n<ul>\n<li>Claude Code is the builder made by Anthropic (AI provider). It comes with every paid Claude plan.<\/li>\n<li>It uses Claude models (AI models), such as Opus 5.5.<\/li>\n<li>Hong Kong blocks Claude. So Claude Code works only through your server in Singapore (Module 01).<\/li>\n<li>You install Claude Code after the server work.<\/li>\n<li>Claude Code is good at understanding unclear instructions and working out what you meant (Module 01).<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-08a-s5\"><h2><span class=\"num\">08A.5<\/span> Install pi and Connect opencode Go<\/h2><p><em>15 minutes. The Short course uses these same steps.<\/em><\/p>\n<p><strong>Step 1. Open Terminal.<\/strong> Press Command and Space. Type <code>terminal<\/code>. Press Return.<\/p>\n<p><strong>Step 2. Install pi.<\/strong> On a Mac, paste this line and press Return (pi.dev, seen 2 Oct 2026):<\/p>\n<pre><code class=\"language-bash\">curl -fsSL https://pi.dev/install.sh | sh\n<\/code><\/pre>\n<p>On Windows, open PowerShell and paste this line:<\/p>\n<pre><code class=\"language-powershell\">powershell -c &quot;irm https://pi.dev/install.ps1 | iex&quot;\n<\/code><\/pre>\n<p>To check it worked:<\/p>\n<ol>\n<li>Quit Terminal (Command and Q).<\/li>\n<li>Open Terminal again.<\/li>\n<li>Type <code>pi --version<\/code>. It should print a number. Annie's Mac printed <code>1.1.0<\/code> on 10 Oct 2026.<\/li>\n<\/ol>\n<p><strong>Step 3. Give pi your opencode Go key, without the key showing on screen.<\/strong> pi looks for the key in a setting called <code>OPENCODE_API_KEY<\/code> (pi's own help, 10 Oct 2026). Paste this line into Terminal and press Return:<\/p>\n<pre><code class=\"language-bash\">read -rs &quot;KEY?Put your opencode Go key here, then press Return (it will not show): &quot;; echo &quot;export OPENCODE_API_KEY=\\&quot;$KEY\\&quot;&quot; &gt;&gt; ~/.zshrc; unset KEY\n<\/code><\/pre>\n<p>Then:<\/p>\n<ol>\n<li>Terminal asks for the key.<\/li>\n<li>Copy the key from your password manager.<\/li>\n<li>Paste it and press Return.<\/li>\n<\/ol>\n<p>Nothing appears on screen while you paste. That is on purpose. The line saves the key in your Terminal settings file. It never shows the key.<\/p>\n<p><strong>Never paste a key into a chat with any AI.<\/strong> Never type a key where other people can see it. Once, one of Annie's builder sessions showed a live key on screen two times while it read a settings file.<\/p>\n<p><strong>Step 4. Start pi on the right model.<\/strong> Open a new Terminal window. Type:<\/p>\n<pre><code class=\"language-bash\">pi --provider opencode-go --model deepseek-v4.1-flash\n<\/code><\/pre>\n<p>Ask pi: &quot;What model are you, and who provides you?&quot; Then paste this, to make it the default:<\/p>\n<pre><code class=\"language-text\">Set opencode-go and deepseek-v4.1-flash as your default provider and model in your settings file. Back up the file first, with the date in the backup's name. Show me the result.\n<\/code><\/pre>\n<p>To check it worked: next time, type only <code>pi<\/code>. It should start on the same model. Annie's pi settings hold these same two defaults (pi settings, read 10 Oct 2026). Facilitator: check this setting on the day, because pi changes often.<\/p>\n<p><strong>If pi asks whether to trust a folder, say yes only for your vault.<\/strong><\/p>\n<p><strong>The stop key.<\/strong> Press Escape to stop pi in the middle of a job.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08a-s6\"><h2><span class=\"num\">08A.6<\/span> Start in Your Vault and Write Your Builder's Instructions<\/h2><p><em>10 minutes.<\/em><\/p>\n<p><strong>Always start your builder in your vault.<\/strong> The builder reads the instruction file in the folder where it starts. If it starts in the wrong folder, it does not know your setup.<\/p>\n<p>Here is what happened to Annie once:<\/p>\n<ol>\n<li>Her desktop app said it could not check her bot's backups. It blamed a technical problem.<\/li>\n<li>The app had been opened in a different folder. So it never read the file that says where the bot lives.<\/li>\n<li>She opened the terminal in the right folder. It did the job at once.<\/li>\n<\/ol>\n<p><strong>If a builder says &quot;I can't&quot;, first ask which folder it started in.<\/strong><\/p>\n<p>To go to your vault in Terminal:<\/p>\n<ol>\n<li>Type <code>cd<\/code> and a space.<\/li>\n<li>Drag your vault folder from Finder into the Terminal window.<\/li>\n<li>Press Return.<\/li>\n<\/ol>\n<p><strong>Write one instruction file that both builders read.<\/strong><\/p>\n<ul>\n<li>pi reads <code>AGENTS.md<\/code> and <code>CLAUDE.md<\/code> (pi's own help, 10 Oct 2026).<\/li>\n<li>Claude Code reads <code>CLAUDE.md<\/code>.<\/li>\n<li>So the Full course writes one <code>CLAUDE.md<\/code>, and both builders read it.<\/li>\n<li>If a rule lives in two files, the two copies slowly become different. One file prevents that (Module 07, &quot;Rules Expire, and Each Rule Should Live in One File&quot;).<\/li>\n<\/ul>\n<p><strong>Keep the file short. Make it point to other notes.<\/strong> Annie's builder instructions hold only the rules the builder needs every time. For everything else, they point to notes in the vault.<\/p>\n<p>Start pi in your vault and paste:<\/p>\n<pre><code class=\"language-text\">Read USER and Data Map in my AI System folder. Then draft a CLAUDE.md at the top of this vault from the template I paste next. Keep it under one screen. Show it to me before saving.\n<\/code><\/pre>\n<p>Then paste the template:<\/p>\n<pre><code class=\"language-markdown\"># Builder Instructions\n\n## Who I Am\n- [Three to five lines from USER.md.]\n\n## How to Work With Me\n- Explain in plain words, with numbered steps. I am not a developer.\n- Give me one next action, or at most three options with your recommended default and the reason.\n- Never end without my next action.\n- Tell me when I am wrong. Never guess: check the machine first, then answer.\n\n## Hard Rules\n- Before you ask me to paste anything, label it: safe to paste, remove the secret first, or never paste.\n- Never print the value of a key, token or password. Print its name only.\n- Back up any file before you edit it. Put the date and the reason in the backup's name.\n- Nothing goes to another person without my yes.\n- Never store or repeat: [the Tier 3 list from my Data Map].\n\n## Where Things Live\n- My vault is this folder. New notes go to 00 Inbox.\n- My builder files live in Builder/. My system notes live in AI System/.\n- My server: [added in Module 08B]. My bot: [added in Module 08B].\n\n## At the Start of Every Session\n- Read Builder/CONTINUITY.md before answering anything.\n<\/code><\/pre>\n<p><strong>Never put a colon in a file name.<\/strong> A Mac does not allow colons in file names. So a note with a colon in its name on the server never arrives on the laptop.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08a-s7\"><h2><span class=\"num\">08A.7<\/span> The Cold Test: Prove a Fresh Session Reads Your File<\/h2><p><em>10 minutes. You repeat it for Claude Code after the server work. The Short course runs it too.<\/em><\/p>\n<p><strong>Why you test.<\/strong> If the builder does not read your instruction file, nothing tells you. It just acts like a general AI assistant that does not know you.<\/p>\n<p>Here is what happened to Annie once:<\/p>\n<ol>\n<li>She linked her builder's instructions with an import line.<\/li>\n<li>The folder path in that line had a space in it. So the link did not work.<\/li>\n<li>No error appeared.<\/li>\n<li>A cold test caught it. The answers were missing a rule that only the main file held.<\/li>\n<\/ol>\n<p><strong>Step 1. Exit pi.<\/strong> Press Control and C two times. Or type <code>/exit<\/code>, if your version has it.<\/p>\n<p><strong>Step 2. Ask one question with no history.<\/strong> In your vault folder, type:<\/p>\n<pre><code class=\"language-bash\">pi -p --no-session &quot;Answer from your instructions only. Who am I? Give two of my rules for working with me. What must you never print?&quot;\n<\/code><\/pre>\n<p>What the parts mean (pi's own help, 10 Oct 2026):<\/p>\n<ul>\n<li><code>-p<\/code> asks one question and prints the answer.<\/li>\n<li><code>--no-session<\/code> means pi uses nothing from earlier conversations.<\/li>\n<\/ul>\n<p><strong>It passed if<\/strong> pi names you, quotes two of your rules, and says it never prints key values.<\/p>\n<p><strong>If the answer is general, pi did not read your file.<\/strong> Check two things:<\/p>\n<ol>\n<li><code>CLAUDE.md<\/code> is in the folder where you ran the command.<\/li>\n<li>The name is exactly <code>CLAUDE.md<\/code>.<\/li>\n<\/ol>\n<p>Fix it and run the test again. Do not go on until this test passes.<\/p>\n<p><strong>What can go wrong without this test.<\/strong> For weeks, Annie's bot seemed to ignore its rules. The truth was that its rules file had never loaded at all. Two small file links fixed it, and a new test passed. These files are what make an AI assistant know you. Without them, it is a general AI assistant.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08a-s8\"><h2><span class=\"num\">08A.8<\/span> Five Habits That Keep You in Control<\/h2><p><em>10 minutes. The Short course teaches the same habits.<\/em><\/p>\n<p>The builder does the typing. You do three things:<\/p>\n<ol>\n<li><strong>Describe<\/strong> what you want.<\/li>\n<li><strong>Approve<\/strong> each change before it happens.<\/li>\n<li><strong>Check<\/strong> the result.<\/li>\n<\/ol>\n<p>Annie wrote no code to build her system. She once said: &quot;I'm not technical. Here's my lab notebook, and none of it needed me to write code. It needed me to learn how to check&quot;.<\/p>\n<p><strong>When a note and the machine disagree, believe the machine.<\/strong> A note, a memory or the builder's report can be out of date. The live settings and the real output show what is true now. Fix the note.<\/p>\n<p><strong>The five habits:<\/strong><\/p>\n<ol>\n<li><strong>Look before you build.<\/strong> In her first month, Annie started to build something that already existed three times. One time, there were two versions of the same job: one turned off and one running. Because she looked first, she upgraded the running one. Start every build with: &quot;Before changing anything, list what already exists for this on the machine.&quot;<\/li>\n<li><strong>Back up before every change, and know how to undo it.<\/strong>\n<ul>\n<li>Copy the file first. Put the date and the reason in the backup's name, for example <code>config.yaml.bak_20260922_model-change<\/code>.<\/li>\n<li>Make the smallest change.<\/li>\n<li>Check that it still works.<\/li>\n<li>Write down how to undo it.<\/li>\n<li>Annie once undid a model change in about a minute, because the backup existed.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Ask for proof, not &quot;done&quot;.<\/strong> Ask to see the output, the file on disk, or the message on your phone. Annie sorts every claim into &quot;Proven&quot; and &quot;Not yet proven&quot;.<\/li>\n<li><strong>Make one change at a time, then use it for a while.<\/strong> Annie's first bot broke down. Its cheap AI model could not use its tools reliably, and it said tasks were done when they were not. The rebuild started with three things: the soul file, the rules and one reminder. Her plan was to live with it for 24 to 48 hours before building more.<\/li>\n<li><strong>Advice is not a fix. A note is not a task.<\/strong> When the builder finds a problem, it fixes it in the same step, or it gives the fix a date. Once, a review of Annie's handover document sat unused for two days. Then she asked, &quot;we have this audit, how do we use it?&quot;.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"full-08a-s9\"><h2><span class=\"num\">08A.9<\/span> Add the Habits, Then Go to Module 08B<\/h2><p>Ask pi to add the five habits to <code>CLAUDE.md<\/code> under &quot;How to Work With Me&quot;. Tell it to back up the file first.<\/p>\n<p><strong>Next, go to Module 08B.<\/strong> pi does every server step there.<\/p>\n<hr />\n<\/section>", "count": 9, "sess": [2]}, {"id": "full-08b", "label": "08B Server", "title": "Module 08B: The Server and Your Bot", "minutes": 155, "read": 27, "toc": [["full-08b-s1", "08B.1", "What You Will Leave With"], ["full-08b-s2", "08B.2", "What You Need to Prepare"], ["full-08b-s3", "08B.3", "The Plan and the Four Safety Rules"], ["full-08b-s4", "08B.4", "Snapshot and SSH Key"], ["full-08b-s5", "08B.5", "First Login, Timezone and Updates"], ["full-08b-s6", "08B.6", "Secure the Server, in an Order That Cannot Lock You Out"], ["full-08b-s7", "08B.7", "Tailscale: Your Private Network"], ["full-08b-s8", "08B.8", "Close Public SSH, With an Automatic Undo Timer"], ["full-08b-s9", "08B.9", "The Exit Node: Send Your Traffic Out Through Your Server"], ["full-08b-s10", "08B.10", "Claude Code on the Server"], ["full-08b-s11", "08B.11", "Your Vault on the Server"], ["full-08b-s12", "08B.12", "Create the Telegram Bot"], ["full-08b-s13", "08B.13", "Install Hermes and Connect It"], ["full-08b-s14", "08B.14", "Load Your Files and Make It Restart on Its Own"], ["full-08b-s15", "08B.15", "Three Tests: Quoting Rules, Saying It Does Not Know, and Golden Questions"], ["full-08b-s16", "08B.16", "Same Model, Different Program: Why pi and the Bot Answer Differently"], ["full-08b-s17", "08B.17", "Homework: A Normal User, a Swap File and a Reboot Test"], ["full-08b-s18", "08B.18", "Lessons From Real Mistakes"], ["full-08b-s19", "08B.19", "Worksheet: Server and Bot Checklist"], ["full-08b-s20", "08B.20", "Not Yet Tested"]], "body": "<div class=\"intro\"><p><strong>This order has not been run yet.<\/strong> Annie will run it herself before it is taught: on a fresh test server, from Hong Kong, with no VPN. If a step fails in her test, this module changes first.<\/p>\n<\/div>\n<section class=\"card\" id=\"full-08b-s1\"><h2><span class=\"num\">08B.1<\/span> What You Will Leave With<\/h2><p><strong>Full course:<\/strong><\/p>\n<ul>\n<li>A locked server in Singapore that only your own devices can reach, over your own private network.<\/li>\n<li>It is your route out of Hong Kong when you want Claude.<\/li>\n<li>Claude Code runs on it, signed in to your subscription.<\/li>\n<li>Your vault is copied to it.<\/li>\n<li>A Telegram bot lives on it. The bot answers only you, restarts by itself and quotes your rules back. It has no job yet.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-08b-s2\"><h2><span class=\"num\">08B.2<\/span> What You Need to Prepare<\/h2><ul>\n<li><strong>Your server, ordered in Module 03.<\/strong> Its IP address and the provider's console login are in your password manager.<\/li>\n<li><strong>pi working on your laptop<\/strong> (Module 08, &quot;Full Course: Before the Server&quot; or &quot;Short Course&quot;), opening in your vault.<\/li>\n<li><strong>Your SOUL, RULES and USER files<\/strong> (Full) or your <code>AGENTS.md<\/code> and USER (Short), in the vault's <code>AI System<\/code> folder.<\/li>\n<li><strong>Telegram on your phone,<\/strong> with two-factor sign-in on.<\/li>\n<li><strong>Tailscale on your phone<\/strong> (Full only). Install the app now. You sign in during the module.<\/li>\n<li><strong>Obsidian Sync, bought before this module<\/strong> (Full only, and only if the vault goes on the server). About $4 to $5 a month <strong>[COST]<\/strong>.<\/li>\n<li><strong>If you already pay for a commercial VPN, switch it off before this module and leave it off.<\/strong> Two VPNs on one machine fight over the same settings.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-08b-s3\"><h2><span class=\"num\">08B.3<\/span> The Plan and the Four Safety Rules<\/h2><p><em>5 minutes. Both courses.<\/em><\/p>\n<p><strong>You will not type most of these commands. pi does, and you approve each one.<\/strong><\/p>\n<ul>\n<li>Annie's advice is direct about this. Let the builder (here, pi) drive the install. Do not follow random tutorials by hand. The builder reads the errors and fixes them.<\/li>\n<li>Each step shows <strong>what to ask pi<\/strong>, the commands it should run, and <strong>what success looks like<\/strong>.<\/li>\n<li>Read the command before you approve it.<\/li>\n<\/ul>\n<p><strong>Why pi, and not Claude Code.<\/strong><\/p>\n<ul>\n<li>pi answers from Hong Kong directly.<\/li>\n<li>Nothing in this module can cut pi off, because it never depends on the network you are building.<\/li>\n<li>Claude Code would need a route out before it could start (Module 08, &quot;Why pi comes first&quot;).<\/li>\n<\/ul>\n<p>Start pi in your vault and paste:<\/p>\n<pre><code class=\"language-text\">Today we set up my new Ubuntu server. Its IP address is in my password manager; I will paste it when you ask. You run commands on it over SSH from this laptop. Work one step at a time. Before each step, show me the command and what it changes. After each step, check it worked and show me the proof. Back up any file before editing it. Do not change anything I have not approved. If a command asks for a password or passphrase, give it to me to run myself in a second Terminal window. Keep a list of every change for my build log.\n<\/code><\/pre>\n<p><strong>The four safety rules.<\/strong> Annie learned each one on her own server.<\/p>\n<ol>\n<li><strong>Snapshot first.<\/strong> Before her first build, Annie took a full snapshot of her server in the provider's console. If the build went wrong, she could return the server to that exact state.<\/li>\n<li><strong>Every change that could lock you out needs an automatic undo.<\/strong> Once, Annie changed which accounts may log in to her server.\n<ul>\n<li>Before the change, she set a ten-minute timer. It would undo the change automatically if she was locked out.<\/li>\n<li>She cancelled the timer once the change was proven.<\/li>\n<\/ul>\n<\/li>\n<li><strong>One change at a time, tested before the next.<\/strong> Her bot kept the same process number through every security change. That proved nothing had restarted or broken.<\/li>\n<li><strong>The provider's web console still works when SSH does not.<\/strong> If anything locks you out, log in there.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"full-08b-s4\"><h2><span class=\"num\">08B.4<\/span> Snapshot and SSH Key<\/h2><p><em>10 minutes. Both courses.<\/em><\/p>\n<p><strong>Step 1. Take a snapshot.<\/strong> In your provider's web console, find the server. Choose &quot;Snapshot&quot; or &quot;Backup now&quot;. Name it <code>day-1-before-build<\/code>.<\/p>\n<p>What success looks like: the snapshot appears in the list.<\/p>\n<p><strong>Step 2. Make an SSH key on your laptop.<\/strong> An SSH key is a pair of files.<\/p>\n<ul>\n<li>The private file stays on your laptop. It proves who you are.<\/li>\n<li>The public file goes on the server.<\/li>\n<\/ul>\n<p>pi gives you this command to run yourself in a second Terminal window, because it asks for a passphrase:<\/p>\n<pre><code class=\"language-bash\">ssh-keygen -t ed25519 -C &quot;laptop-yourname&quot;\n<\/code><\/pre>\n<p><strong>Use a passphrase.<\/strong> This was the one protection Annie had not set up on her first server. A passphrase makes a stolen key file useless on its own. Your Mac's keychain can remember it.<\/p>\n<p><strong>Label every key with the device it belongs to.<\/strong> Annie's phone and tablet keys both arrived labelled <code>moshi<\/code>. So a list of keys could not tell them apart. She relabelled them by device.<\/p>\n<p><strong>Step 3. Put the public key on the server.<\/strong> If your provider emailed you a root password, run this yourself in the second window:<\/p>\n<pre><code class=\"language-bash\">ssh-copy-id -i ~/.ssh/id_ed25519.pub root@&lt;your-server-ip&gt;\n<\/code><\/pre>\n<ul>\n<li>You type the root password once.<\/li>\n<li>If your provider asked for a key at order time, paste the contents of <code>~/.ssh/id_ed25519.pub<\/code> into the provider's console instead.<\/li>\n<li>On Windows, <code>ssh-copy-id<\/code> may not exist. Use the console.<\/li>\n<\/ul>\n<p>What success looks like: <code>ssh root@&lt;your-server-ip&gt;<\/code> logs you in without asking for the server password.<\/p>\n<p><strong>Only the file ending in <code>.pub<\/code> is safe to share.<\/strong> Never paste the private key anywhere.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08b-s5\"><h2><span class=\"num\">08B.5<\/span> First Login, Timezone and Updates<\/h2><p><em>10 minutes. Both courses.<\/em><\/p>\n<p><strong>Step 4. Set the timezone.<\/strong> Servers arrive set to UTC.<\/p>\n<ul>\n<li>For about a month, Annie's bot gave tomorrow's date in the evenings.<\/li>\n<li>The cause: the server's clock ran eight hours behind Hong Kong.<\/li>\n<li>Her notes from the first build said the timezone was set. It was not.<\/li>\n<\/ul>\n<pre><code class=\"language-bash\">timedatectl set-timezone Asia/Hong_Kong\ntimedatectl\n<\/code><\/pre>\n<p>What success looks like: the output shows <code>Asia/Hong_Kong<\/code>, and the local time matches your watch.<\/p>\n<p><strong>Step 5. Update the system.<\/strong><\/p>\n<pre><code class=\"language-bash\">apt update &amp;&amp; apt upgrade -y\n<\/code><\/pre>\n<p>What success looks like: it finishes without red errors. It may ask about a changed configuration file. If so, keep the version already installed.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08b-s6\"><h2><span class=\"num\">08B.6<\/span> Secure the Server, in an Order That Cannot Lock You Out<\/h2><p><em>15 minutes. Both courses.<\/em><\/p>\n<p><strong>Annie's example.<\/strong><\/p>\n<ul>\n<li>For its first month, Annie's server had five secret files that any user on it could read. It had no firewall.<\/li>\n<li>Annie puts it plainly: nothing bad happened, and that was luck, not design.<\/li>\n<li>Her first security review looked first and changed nothing. It sorted the fixes by risk.<\/li>\n<li>The next day the fixes went in, in an order that could not lock her out.<\/li>\n<\/ul>\n<p><strong>Step 6. Look first.<\/strong> Ask pi to report how SSH is set up and which ports are open. It must not change anything.<\/p>\n<pre><code class=\"language-bash\">sshd -T | grep -E 'passwordauthentication|permitrootlogin|pubkeyauthentication'\nss -tulnp\n<\/code><\/pre>\n<p>What success looks like: a short report. Only SSH (port 22) should face the internet.<\/p>\n<p><strong>Step 7. Prove your key works in a second window.<\/strong><\/p>\n<ul>\n<li>Open a new Terminal window and log in with <code>ssh root@&lt;your-server-ip&gt;<\/code>.<\/li>\n<li>Keep this window open for the rest of the module.<\/li>\n<li>If a change goes wrong, this window is still logged in and can undo it.<\/li>\n<\/ul>\n<p><strong>Step 8. Turn off password logins.<\/strong> Ask pi to write a small separate settings file. It should not edit the main one. Then each change is easy to see and undo. The file <code>/etc/ssh/sshd_config.d/99-hardening.conf<\/code> should contain:<\/p>\n<pre><code class=\"language-text\">PasswordAuthentication no\nKbdInteractiveAuthentication no\nPermitRootLogin prohibit-password\n<\/code><\/pre>\n<p>Then check the settings before applying them, and reload:<\/p>\n<pre><code class=\"language-bash\">sshd -t &amp;&amp; systemctl reload ssh\n<\/code><\/pre>\n<p>What success looks like: <code>sshd -t<\/code> prints nothing, which means no errors. A third new window still logs in with your key.<\/p>\n<p><strong>Step 9. Turn on the firewall, allowing SSH first.<\/strong> The order matters. Allow SSH, then block everything else coming in. Annie's review named this as the only lockout risk in the whole security review.<\/p>\n<pre><code class=\"language-bash\">ufw allow OpenSSH\nufw default deny incoming\nufw default allow outgoing\nufw --force enable\nufw status verbose\n<\/code><\/pre>\n<p>What success looks like:<\/p>\n<ul>\n<li>The firewall is active, with SSH allowed.<\/li>\n<li>A new window still logs in.<\/li>\n<li>The bot only makes outgoing connections. So this firewall will not block it later.<\/li>\n<\/ul>\n<p><strong>Step 10. Ban repeated failed logins, and keep security updates automatic.<\/strong><\/p>\n<pre><code class=\"language-bash\">apt install -y fail2ban\nfail2ban-client status sshd\nsystemctl is-enabled unattended-upgrades\n<\/code><\/pre>\n<p>What success looks like: fail2ban reports an <code>sshd<\/code> jail, and unattended upgrades shows <code>enabled<\/code>. Annie's server runs both (live server check, 2 Oct 2026).<\/p>\n<p><strong>Lock the secret files as you add them.<\/strong> Any file holding a key or token gets <code>chmod 600<\/code>. Then only its owner can read it. Annie's five readable secret files were fixed this way.<\/p>\n<p><strong>If you get locked out:<\/strong> log in through the provider's web console. Ask pi to undo the last change from its backup.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08b-s7\"><h2><span class=\"num\">08B.7<\/span> Tailscale: Your Private Network<\/h2><p><em>15 minutes. Full only.<\/em><\/p>\n<p><strong>Tailscale puts your laptop, phone and server on one private network,<\/strong> as if they sat in the same room. The free Personal plan covers up to 6 users and unlimited devices. It includes exit nodes (Tailscale pricing, seen 2 Oct 2026).<\/p>\n<p><strong>Step 11. Create a Tailscale account<\/strong> at tailscale.com. Sign in with an account you control personally.<\/p>\n<p><strong>Step 12. Join your laptop.<\/strong> Install the Tailscale app from tailscale.com/download and sign in.<\/p>\n<p><strong>If it hangs, check that no commercial VPN is on.<\/strong><\/p>\n<ul>\n<li>Once, Annie's Mac could not join for most of a day.<\/li>\n<li>The app did nothing, and the login printed no address.<\/li>\n<li>Tailscale's own health message gave the reason. The commercial VPN had taken over the Mac's address lookups.<\/li>\n<li>Annie guessed the cause first. Turning the VPN off fixed it at once.<\/li>\n<\/ul>\n<p><strong>Step 13. Join your phone.<\/strong> Open the Tailscale app and sign in with the same account.<\/p>\n<p><strong>Step 14. Join the server.<\/strong> Ask pi to install Tailscale on the server and start it:<\/p>\n<pre><code class=\"language-bash\">curl -fsSL https://tailscale.com/install.sh | sh\ntailscale up\n<\/code><\/pre>\n<p><code>tailscale up<\/code> prints a web address. Open it on your laptop and approve the server.<\/p>\n<p>What success looks like: the Tailscale admin page lists three devices. On the server, <code>tailscale ip -4<\/code> prints an address starting with <code>100.<\/code>.<\/p>\n<p><strong>Step 15. Turn off key expiry.<\/strong> In the Tailscale admin page, open each device's menu and choose &quot;Disable key expiry&quot;. Otherwise a device drops off the network when its key expires. Then the exit node stops working.<\/p>\n<p><strong>Step 16. Give the server a short name on your laptop.<\/strong> Ask pi to add an entry to <code>~/.ssh/config<\/code>:<\/p>\n<pre><code class=\"language-text\">Host myserver\n  HostName &lt;your-server-tailscale-name&gt;\n  User root\n<\/code><\/pre>\n<p>What success looks like: <code>ssh myserver<\/code> logs you in over Tailscale.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08b-s8\"><h2><span class=\"num\">08B.8<\/span> Close Public SSH, With an Automatic Undo Timer<\/h2><p><em>10 minutes. Full only.<\/em><\/p>\n<p><strong>Step 17. Make SSH work only over your private network.<\/strong> Do three things in order:<\/p>\n<ol>\n<li>Allow SSH on the Tailscale side.<\/li>\n<li>Set a timer that reopens public SSH in ten minutes unless you cancel it.<\/li>\n<li>Remove the public rule.<\/li>\n<\/ol>\n<pre><code class=\"language-bash\">ufw allow in on tailscale0 to any port 22 proto tcp\napt install -y at\necho &quot;ufw allow OpenSSH&quot; | at now + 10 minutes\nufw delete allow OpenSSH\n<\/code><\/pre>\n<p>Test <code>ssh myserver<\/code> in a new window. If it works, cancel the timer. <code>atq<\/code> lists it, and <code>atrm &lt;number&gt;<\/code> cancels it.<\/p>\n<p>What success looks like: <code>ssh myserver<\/code> works, and <code>ssh root@&lt;your-server-ip&gt;<\/code> no longer connects.<\/p>\n<p><strong>This is the same safety Annie used<\/strong> when she changed which accounts may log in. The undo was set before the change and cancelled after it was proven. Her public SSH had already been closed by then.<\/p>\n<p><strong>Now Tailscale is your only way in.<\/strong> With Tailscale off, you cannot reach your server. Once, Annie's builder on the Mac could not reach her server for exactly this reason. The provider's console still works.<\/p>\n<p><strong>After any network change, test every job that connects to the server.<\/strong><\/p>\n<ul>\n<li>One check found two of Annie's scheduled Mac jobs still using the server's old public address.<\/li>\n<li>This was days after public SSH was closed.<\/li>\n<li>One of them, a backup, had failed twice.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-08b-s9\"><h2><span class=\"num\">08B.9<\/span> The Exit Node: Send Your Traffic Out Through Your Server<\/h2><p><em>15 minutes. Full only.<\/em><\/p>\n<p><strong>An exit node sends a device's internet traffic out through your server.<\/strong> So your laptop appears to be in Singapore.<\/p>\n<p><strong>Annie's problem.<\/strong> Her phone could run only one VPN at a time.<\/p>\n<ul>\n<li>With her commercial VPN on, Claude worked but her private pages did not.<\/li>\n<li>With Tailscale on, the private pages worked but Claude was blocked.<\/li>\n<li>Making her server an exit node meant one switch did both jobs.<\/li>\n<li>The commercial VPN was no longer needed.<\/li>\n<\/ul>\n<p>Her server is in Singapore, which Anthropic serves.<\/p>\n<p><strong>The same caution from Module 01 applies.<\/strong> Using a route like this to reach a provider that does not serve Hong Kong is a choice about that provider's terms. It is yours to make.<\/p>\n<p><strong>Step 18. Allow the server to forward traffic, permanently.<\/strong><\/p>\n<ul>\n<li>Annie's forwarding was first switched on in memory only. So a restart would have silently broken the exit node.<\/li>\n<li>She wrote it to a settings file. Then she proved it survived a simulated restart.<\/li>\n<\/ul>\n<p>Ask pi to write <code>/etc/sysctl.d/99-tailscale.conf<\/code> containing:<\/p>\n<pre><code class=\"language-text\">net.ipv4.ip_forward = 1\nnet.ipv6.conf.all.forwarding = 1\n<\/code><\/pre>\n<p>Then apply it:<\/p>\n<pre><code class=\"language-bash\">sysctl -p /etc/sysctl.d/99-tailscale.conf\n<\/code><\/pre>\n<p>Ask pi to write the file with a short command or an editor. Once, a long pasted command wrapped in the terminal and failed.<\/p>\n<p><strong>Step 19. Let the firewall forward Tailscale traffic only, then offer the server as an exit node.<\/strong><\/p>\n<pre><code class=\"language-bash\">ufw route allow in on tailscale0\ntailscale set --advertise-exit-node\n<\/code><\/pre>\n<p><strong>Step 20. Approve it.<\/strong> In the Tailscale admin page, open the server's menu. Choose &quot;Edit route settings&quot;, and tick &quot;Use as exit node&quot;.<\/p>\n<p><strong>Step 21. Test it from your laptop.<\/strong> In the Tailscale menu, choose your server as the exit node. Then run:<\/p>\n<pre><code class=\"language-bash\">curl -s https://1.1.1.1/cdn-cgi/trace | grep loc\n<\/code><\/pre>\n<p>What success looks like: <code>loc=SG<\/code>.<\/p>\n<p>Then run the status test from Module 01 again.<\/p>\n<ul>\n<li>Anthropic answered 403 from Hong Kong.<\/li>\n<li>It answered 401 through Annie's Singapore server.<\/li>\n<li>A 401 means the route works.<\/li>\n<\/ul>\n<p><strong>Full course: Module 08's &quot;After the Server&quot; half can start from here.<\/strong> The rest of this module also works with that half done first.<\/p>\n<p><strong>Use one switch with two settings: exit node on, or exit node off.<\/strong><\/p>\n<ul>\n<li>A Mac cannot route app by app.<\/li>\n<li>Annie built two cleverer designs that sent only some traffic through Singapore. She removed both the next day, because each put Tailscale directly in front of Claude Code.<\/li>\n<li>Her rule since then: exit node on, everything goes through Singapore. Exit node off, a normal Hong Kong connection.<\/li>\n<li>Her exit node is now off by default.<\/li>\n<li>pi works in both states.<\/li>\n<\/ul>\n<p><strong>On Android, route app by app.<\/strong> Use exclude mode in the Tailscale app, as Module 01 explained.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08b-s10\"><h2><span class=\"num\">08B.10<\/span> Claude Code on the Server<\/h2><p><em>10 minutes. Full only.<\/em><\/p>\n<p><strong>With Claude Code on the server, you can reach your builder from your phone with the laptop closed.<\/strong> Annie moved hers there in about 10 minutes. It ran on the subscription she already paid for.<\/p>\n<p><strong>Step 22. Install Claude Code on the server.<\/strong> Ask pi to run, on the server:<\/p>\n<pre><code class=\"language-bash\">curl -fsSL https://claude.ai/install.sh | bash\n<\/code><\/pre>\n<p><strong>Step 23. Sign in once, with the exit node on.<\/strong> Claude's sign-in page is blocked in Hong Kong. Only the sign-in needs the route.<\/p>\n<ol>\n<li>In your own SSH window, run <code>claude<\/code> on the server and follow the sign-in prompt.<\/li>\n<li>It shows a web address. Open it in your laptop's browser.<\/li>\n<li>With the exit node on, the page opens.<\/li>\n<li>Once you are signed in, the login is stored on the server.<\/li>\n<li>Turn the exit node off.<\/li>\n<\/ol>\n<p>Facilitator: confirm the current sign-in flow on the day.<\/p>\n<p>What success looks like: <code>claude -p &quot;Reply with the word PONG&quot;<\/code> on the server prints <code>PONG<\/code>.<\/p>\n<p><strong>Step 24. Lock it to the subscription.<\/strong> Ask pi to set <code>forceLoginMethod<\/code> to <code>claudeai<\/code> in the server's <code>~/.claude/settings.json<\/code>. Annie's server has this lock (live server check, 2 Oct 2026).<\/p>\n<p><strong>The server's login expires.<\/strong><\/p>\n<ul>\n<li>On an idle server it lasted about 30 days.<\/li>\n<li>Using it did not extend it.<\/li>\n<li>The watchdog, a checking script you set up in a later module (Module 10), warns you before it lapses.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-08b-s11\"><h2><span class=\"num\">08B.11<\/span> Your Vault on the Server<\/h2><p><em>10 minutes. Full only.<\/em><\/p>\n<p><strong>Step 25. Copy your vault to the server.<\/strong><\/p>\n<ul>\n<li>Annie's server keeps a copy of her vault through Obsidian's own sync service. It uses the server version, <code>ob<\/code>, on a schedule.<\/li>\n<li>Facilitator: walk the room through the current set-up from Obsidian's guide (obsidian.md/help/sync/headless) on the day. These steps are not yet written here.<\/li>\n<li>Keep the vault in its own folder, such as <code>/root/vault/<\/code>. Keep it separate from the bot's files.<\/li>\n<\/ul>\n<p>Three sync facts every student needs:<\/p>\n<ul>\n<li><strong>Obsidian must be open on your laptop<\/strong> for laptop edits to leave it. The server can report &quot;Sync OK&quot; while your laptop sends nothing.<\/li>\n<li><strong>A file name with a colon never arrives<\/strong> on a Mac.<\/li>\n<li><strong>Deleting a file on one device may not stick.<\/strong> Delete on the server first, then let it sync.<\/li>\n<\/ul>\n<p>What success looks like: a note you create on your laptop appears in the server's vault folder within a few minutes.<\/p>\n<p><strong>Step 26. Run a cold test on the server.<\/strong> A cold test is a fresh session that proves your instructions file loads. From the vault folder on the server, run the cold test from Module 08 with <code>claude -p<\/code>. Annie's first server test caught that the wrong half of her memory had been copied.<\/p>\n<h3>Your Daily Routine<\/h3>\n<p>From now on:<\/p>\n<ol>\n<li>Tailscale on.<\/li>\n<li>Exit node off.<\/li>\n<li><code>ssh myserver<\/code>.<\/li>\n<li>Go to your vault folder and start Claude Code.<\/li>\n<\/ol>\n<p>pi on the laptop works at any time, with or without these four steps. Claude Code on the laptop needs the exit node on.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08b-s12\"><h2><span class=\"num\">08B.12<\/span> Create the Telegram Bot<\/h2><p><em>10 minutes. Both courses.<\/em><\/p>\n<p><strong>Step 27. Open Telegram and search for <code>@BotFather<\/code>.<\/strong> Check for the blue verified tick. This is Telegram's official account for creating bots.<\/p>\n<p><strong>Step 28. Send <code>/newbot<\/code>.<\/strong> Give it a display name, then a username ending in <code>bot<\/code>. Choose a username that does not include your full name.<\/p>\n<p><strong>Step 29. Save the token.<\/strong><\/p>\n<ul>\n<li>BotFather replies with a long token.<\/li>\n<li>Anyone with this token controls your bot.<\/li>\n<li>Save it in your password manager straight away.<\/li>\n<li>Never paste it into a chat with any AI, a note or your vault.<\/li>\n<\/ul>\n<p>What success looks like: the token is in your password manager, and your new bot appears in Telegram.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08b-s13\"><h2><span class=\"num\">08B.13<\/span> Install Hermes and Connect It<\/h2><p><em>15 minutes. Both courses.<\/em><\/p>\n<p>A bot has four parts:<\/p>\n<ul>\n<li><strong>Framework:<\/strong> the program that runs the bot. It holds its tools, memory, schedules and rules.\n<ul>\n<li>This course uses Hermes Agent by Nous Research.<\/li>\n<li>Annie's server runs version 0.21.5 (live server check, 2 Oct 2026).<\/li>\n<\/ul>\n<\/li>\n<li><strong>Channel:<\/strong> where you type to it. This course uses Telegram.<\/li>\n<li><strong>Model:<\/strong> the AI that writes the answers. This course uses DeepSeek V4.1 Flash through opencode Go, the same as your pi.<\/li>\n<li><strong>Files:<\/strong> who it is and what it must do. This course uses your SOUL, RULES and USER.<\/li>\n<\/ul>\n<p><strong>Step 30. Install Hermes.<\/strong> Ask pi:<\/p>\n<pre><code class=\"language-text\">Install Hermes Agent on my server using the official install script from the NousResearch hermes-agent repository. Then set its timezone to Asia/Hong_Kong. Show me each command before running it. When it asks for my Telegram bot token or any key, stop and tell me how to enter it myself without it being shown on screen.\n<\/code><\/pre>\n<p>The commands it should use (official repository, seen 2 Oct 2026):<\/p>\n<pre><code class=\"language-bash\">curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash\nhermes config set timezone Asia/Hong_Kong\n<\/code><\/pre>\n<p><strong>Set the timezone in Hermes as well as on the server.<\/strong> They are two separate settings. Annie's bot's own timezone setting was blank. That is what caused the month of wrong dates.<\/p>\n<p><strong>Step 31. Connect Telegram, and allow only yourself.<\/strong> The set-up asks questions, so run it yourself in your SSH window:<\/p>\n<pre><code class=\"language-bash\">hermes gateway setup\n<\/code><\/pre>\n<ol>\n<li>Choose Telegram.<\/li>\n<li>Paste your bot token when asked.<\/li>\n<li>Enter your numeric Telegram user ID (Hermes Telegram documentation, seen 2 Oct 2026).<\/li>\n<\/ol>\n<p><strong>If you do not know your ID:<\/strong><\/p>\n<ol>\n<li>Leave it blank.<\/li>\n<li>Send your bot one message from your phone.<\/li>\n<li>The bot's log will show your number, in a line saying a user was blocked.<\/li>\n<li>Add that number as the only allowed user.<\/li>\n<\/ol>\n<p>The setting is <code>TELEGRAM_ALLOWED_USERS<\/code>. It holds your number and nobody else's.<\/p>\n<p><strong>Step 32. Connect the model.<\/strong> Ask pi to add your opencode Go key to the bot's <code>.env<\/code> file without printing it. Ask it to set the model in <code>config.yaml<\/code>. Annie's live settings (live server check, 2 Oct 2026):<\/p>\n<pre><code class=\"language-yaml\">model:\n  default: deepseek-v4.1-flash\n  provider: opencode-go\n  max_tokens: 2048\n<\/code><\/pre>\n<ul>\n<li>The key's name in <code>.env<\/code> on Annie's server is <code>OPENCODE_GO_API_KEY<\/code>.<\/li>\n<li>Then lock the file: <code>chmod 600 ~/.hermes/.env<\/code>.<\/li>\n<li>Facilitator: confirm the provider set-up in the Hermes documentation on the day.<\/li>\n<\/ul>\n<p><strong>The output limit matters.<\/strong> <code>max_tokens<\/code> caps how long one answer can be.<\/p>\n<ul>\n<li>Annie's son's tutor bot once wrote an answer of about 15,000 tokens.<\/li>\n<li>It took up to three minutes to reply.<\/li>\n<li>A short-answers rule and a 2,048-token cap brought replies well under a minute.<\/li>\n<\/ul>\n<p><strong>A model name works only on the provider that serves it.<\/strong> When Annie changed provider, every model name the old provider used stopped working.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08b-s14\"><h2><span class=\"num\">08B.14<\/span> Load Your Files and Make It Restart on Its Own<\/h2><p><em>10 minutes. Both courses.<\/em><\/p>\n<p>Hermes reads different files at different times (Hermes documentation, &quot;Which File Does What&quot;, seen 2 Oct 2026):<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Your file<\/th>\n<th>Where it goes on the server<\/th>\n<th>When Hermes reads it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>SOUL<\/td>\n<td><code>~/.hermes/SOUL.md<\/code><\/td>\n<td>At the start of every conversation, first<\/td>\n<\/tr>\n<tr>\n<td>RULES<\/td>\n<td>A file named <code>.hermes.md<\/code> in the bot's working folder<\/td>\n<td>At the start of every conversation<\/td>\n<\/tr>\n<tr>\n<td>USER<\/td>\n<td><code>~/.hermes/memories/USER.md<\/code><\/td>\n<td>At the start of every conversation<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Give the bot its own working folder<\/strong>.<\/p>\n<ul>\n<li>Hermes reads <code>.hermes.md<\/code> from the folder set as the bot's working folder in its settings.<\/li>\n<li>Annie uses a dedicated folder, never <code>/root<\/code>. Then her other bots do not load the same rules.<\/li>\n<li>Facilitator: confirm the setting's name on the day.<\/li>\n<\/ul>\n<p><strong>Keep the user file short.<\/strong> Annie's settings cap it at 1,375 characters (bot settings, 9 Oct 2026).<\/p>\n<p><strong>Step 33. Copy the files.<\/strong> Ask pi:<\/p>\n<pre><code class=\"language-text\">Copy SOUL, RULES and USER from my vault's AI System folder into the places in this table on my server. Back up anything already there first. Then restart the bot and show me that the restart worked.\n<\/code><\/pre>\n<p><strong>Restart after any change, then start a fresh chat<\/strong>.<\/p>\n<ul>\n<li>The bot loads its files when it starts.<\/li>\n<li>An open Telegram chat also keeps the instructions it started with, even after a restart.<\/li>\n<li>So send <code>/new<\/code> after every change.<\/li>\n<\/ul>\n<pre><code class=\"language-bash\">hermes gateway restart\n<\/code><\/pre>\n<p><strong>Step 34. Make it come back on its own.<\/strong> A bot that stops and stays stopped is worse than no bot, because you think it is working. Once, two of Annie's bots stayed connected to nothing for days, and nobody knew.<\/p>\n<pre><code class=\"language-bash\">hermes gateway install\n<\/code><\/pre>\n<p>This runs the bot as a service that starts with the server. Then ask pi to show you the service file and confirm the four lines below. Here is why they matter:<\/p>\n<ul>\n<li>Hermes's Telegram connection gives up after about 10 reconnects and exits.<\/li>\n<li>It expects something to restart it.<\/li>\n<li>One day, nothing did.<\/li>\n<\/ul>\n<pre><code class=\"language-text\">Restart=always\nRestartSec=5\nRestartForceExitStatus=75\nStartLimitIntervalSec=0\n<\/code><\/pre>\n<p>Then check that it runs with nobody logged in:<\/p>\n<pre><code class=\"language-bash\">loginctl show-user root --property=Linger\n<\/code><\/pre>\n<p>What success looks like: <code>Linger=yes<\/code>. Annie's builder once reported the restart settings had &quot;vanished&quot;. It had looked in the wrong list of services.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08b-s15\"><h2><span class=\"num\">08B.15<\/span> Three Tests: Quoting Rules, Saying It Does Not Know, and Golden Questions<\/h2><p><em>15 minutes. Both courses.<\/em><\/p>\n<p><strong>A restart proves nothing about whether the bot works.<\/strong> When the bot starts, it does not check its model key. Only a real message does.<\/p>\n<p><strong>Step 35. The hello test.<\/strong> In Telegram, send <code>/new<\/code>, then <code>hello<\/code>. What success looks like: a reply within a few seconds.<\/p>\n<p><strong>Step 36. The quote test.<\/strong> Send:<\/p>\n<pre><code class=\"language-text\">Quote your rule about saving things, word for word.\n<\/code><\/pre>\n<p>Then:<\/p>\n<pre><code class=\"language-text\">What are your standing instructions? List their headings.\n<\/code><\/pre>\n<p>What success looks like: it quotes your save rule exactly and lists the headings from your RULES file.<\/p>\n<p><strong>If it cannot quote them, stop and fix it.<\/strong><\/p>\n<ul>\n<li>For weeks, Annie's rules file was never loaded into her bot.<\/li>\n<li>Asked about one of its rules, the bot said it had none.<\/li>\n<li>Two file links and a restart fixed it.<\/li>\n<li>Annie calls this &quot;the single most instructive bug of the whole build&quot;.<\/li>\n<li>Nothing else you write matters until the bot can read its rules.<\/li>\n<\/ul>\n<p><strong>Step 37. The refusal test.<\/strong><\/p>\n<ul>\n<li>Send a question your files cannot answer, such as the name of a person you have never mentioned.<\/li>\n<li>The bot must say it does not know.<\/li>\n<li>A made-up answer here is the one failure you must not leave the room with.<\/li>\n<li>Fix the rule and test again.<\/li>\n<\/ul>\n<p><strong>Step 38. Your golden questions<\/strong> from Module 07. These are your test questions with known answers.<\/p>\n<ol>\n<li>Ask each one in a fresh conversation. Send <code>/new<\/code> before each.<\/li>\n<li>Then ask them all again. A right answer once can be luck.<\/li>\n<li>Write the results into your build log.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"full-08b-s16\"><h2><span class=\"num\">08B.16<\/span> Same Model, Different Program: Why pi and the Bot Answer Differently<\/h2><p><em>5 minutes. Both courses.<\/em><\/p>\n<p><strong>Your pi and your bot now run the same model:<\/strong> DeepSeek V4.1 Flash on opencode Go.<\/p>\n<ul>\n<li>Ask both the same question: &quot;What can you do with my files?&quot;<\/li>\n<li>The answers differ, because the program around the model differs.<\/li>\n<li>pi can read and edit the files on your laptop.<\/li>\n<li>The bot has its own skills and its own rules on the server.<\/li>\n<\/ul>\n<p><strong>The line to say.<\/strong> &quot;The model only answers. The program around it decides what it can read, what it remembers, and what it is allowed to do.&quot;<\/p>\n<p><strong>This is why Annie moved her bots to a new model in one evening.<\/strong> She changed one line in each bot's settings. The skills, rules and limits stayed the same.<\/p>\n<p><strong>It is also why a Telegram bot is not limited by Telegram.<\/strong><\/p>\n<ul>\n<li>Annie once assumed her bot could not build software because it was a Telegram bot.<\/li>\n<li>The real reason was that it had been set up as an AI assistant, with no tools to edit files.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-08b-s17\"><h2><span class=\"num\">08B.17<\/span> Homework: A Normal User, a Swap File and a Reboot Test<\/h2><p><strong>A normal user instead of root (live server check, 2 Oct 2026).<\/strong><\/p>\n<ul>\n<li>Logging in as <code>root<\/code> means every command runs with full power over the machine.<\/li>\n<li>Annie's first security review listed moving her bot off root as the highest-risk change. She deferred it.<\/li>\n<li>Her server still runs the bot as root.<\/li>\n<li>If you choose a normal user, do it before installing anything else, with the facilitator beside you.<\/li>\n<\/ul>\n<p><strong>A swap file.<\/strong> Swap is disk space the server uses when its memory is full. Without it, a full server stops a program of its own choosing.<\/p>\n<ul>\n<li>Once, Annie's server began logging memory warnings every minute.<\/li>\n<li>The cause: six forgotten Claude Code sessions held 1.5 GB between them.<\/li>\n<li>Closing them freed the memory.<\/li>\n<li>A 2 GB swap file was added, so the server has room to spare next time.<\/li>\n<\/ul>\n<p>What to do:<\/p>\n<ul>\n<li>Ask pi to add a 2 GB swap file that survives a restart, with swappiness set to 10.<\/li>\n<li>Facilitator: confirm the first command on the day, because Annie's notes do not record how the empty file was made.<\/li>\n<li>Close Claude Code sessions with <code>/exit<\/code> when you finish.<\/li>\n<\/ul>\n<p><strong>The reboot test.<\/strong> &quot;It works&quot; and &quot;it survives a restart&quot; are different claims. Reboot the server once, then check:<\/p>\n<pre><code class=\"language-bash\">tailscale status\nsysctl net.ipv4.ip_forward\nufw status\ntimedatectl\nsystemctl --user status hermes-gateway\n<\/code><\/pre>\n<p>What success looks like:<\/p>\n<ul>\n<li>Tailscale is connected.<\/li>\n<li>Forwarding reads 1.<\/li>\n<li>The firewall is active.<\/li>\n<li>The timezone is Hong Kong.<\/li>\n<li>The bot answers <code>hello<\/code> in Telegram.<\/li>\n<\/ul>\n<p><strong>Private web pages, for later.<\/strong> You may want a small private page some day, such as a dashboard. Keep it reachable only through Tailscale.<\/p>\n<ul>\n<li>Annie first published one page publicly. She later moved it back to private, because it showed household items.<\/li>\n<li><strong>A password box in front of a public page protects nothing.<\/strong> The page's content is still sent to anyone who asks. The box only hides it.<\/li>\n<li>To share a page with someone outside your network, encrypt the page itself. Then the public copy cannot be read without the password.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-08b-s18\"><h2><span class=\"num\">08B.18<\/span> Lessons From Real Mistakes<\/h2><p>Each line below is one lesson from a real mistake in Annie's own system. The full story behind each one is on the FAQ tab, the last tab at the top of the page.<\/p>\n<ul>\n<li>Look before you change. Change in an order that always leaves you able to log in.<\/li>\n<li><em>Full course only:<\/em> before you add a second tool to solve a clash, ask whether the tool you already have can do both jobs.<\/li>\n<li><em>Full course only:<\/em> when one tool works and another fails on the same device, look at what differs.<\/li>\n<li>After any change to keys or models, send a real message through every bot.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-08b-s19\"><h2><span class=\"num\">08B.19<\/span> Worksheet: Server and Bot Checklist<\/h2><div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Proof<\/th>\n<th>Course<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Snapshot taken before any change<\/td>\n<td>Snapshot listed in the console<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Key login works; passwords off<\/td>\n<td><code>sshd -T<\/code> shows <code>passwordauthentication no<\/code><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Firewall active<\/td>\n<td><code>ufw status verbose<\/code><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>fail2ban and security updates on<\/td>\n<td><code>fail2ban-client status sshd<\/code><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Timezone is Hong Kong, on the server and in Hermes<\/td>\n<td><code>timedatectl<\/code>; Hermes config<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Laptop, phone and server on Tailscale; key expiry off<\/td>\n<td>Tailscale admin page<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>SSH works only over Tailscale<\/td>\n<td><code>ssh myserver<\/code> works; the public address does not<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Exit node tested<\/td>\n<td><code>loc=SG<\/code> with it on<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Claude Code on the server, signed in, locked to the subscription<\/td>\n<td><code>claude -p<\/code> returns PONG<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Vault copied to the server<\/td>\n<td>A new laptop note appears on the server<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Bot token only in my password manager<\/td>\n<td><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Only my Telegram ID is allowed<\/td>\n<td>The allow-list holds one number<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>.env<\/code> readable by the owner only<\/td>\n<td><code>ls -l<\/code> shows <code>-rw-------<\/code><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Runs as a service with the four restart lines; linge
