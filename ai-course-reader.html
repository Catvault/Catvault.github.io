 into. It sends your words to the AI. It lets the AI read your files and run commands.<\/li>\n<li><strong>opencode Go is the AI provider.<\/strong> It is the company that runs the AI on its own computers. It charges you $10 a month <strong>[COST]<\/strong>. pi connects to it with your key.<\/li>\n<li><strong>DeepSeek is the AI model.<\/strong> It is the AI that writes the answers. opencode Go offers many models. DeepSeek is the one this course uses. Kimi K3 is another.<\/li>\n<\/ul>\n<p><strong>The order:<\/strong> you → pi (harness) → opencode Go (AI provider) → DeepSeek (AI model). The answer comes back the same way.<\/p>\n<p><strong>The same pattern for Claude:<\/strong> Claude Code is the harness. Anthropic is the AI provider. Opus 5.5 is the AI model.<\/p>\n<p><strong>And Annie's bot:<\/strong> Hermes is the harness. opencode Go is the AI provider. DeepSeek is the AI model.<\/p>\n<ul>\n<li>That is why one opencode Go plan pays for both pi and the bot.<\/li>\n<li>They are two harnesses using the same provider and the same model.<\/li>\n<\/ul>\n<p>The rest of this section explains each part in more detail.<\/p>\n<p><strong>1. The harness.<\/strong> The harness is the program you use.<\/p>\n<ul>\n<li>It takes your words and sends them to the AI.<\/li>\n<li>It lets the AI do things, such as read your files and run commands.<\/li>\n<li>It decides how the AI works: what it can touch, and what it must ask you first.<\/li>\n<li>Examples: pi and Claude Code are harnesses for building. Hermes is the harness Annie's bots run on.<\/li>\n<\/ul>\n<p><strong>2. The AI provider.<\/strong> The provider is the company that runs the AI on its own computers.<\/p>\n<ul>\n<li>You pay the provider, by subscription or by use.<\/li>\n<li>Your harness connects to the provider with a key or a sign-in. A key is a long password that lets a program use your account.<\/li>\n<li>Examples: opencode Go and Anthropic.<\/li>\n<li>Hong Kong blocks happen here, at the provider (Module 01).<\/li>\n<\/ul>\n<p><strong>3. The AI model.<\/strong> The model is the AI that writes the answers. It is your bot's &quot;brain&quot;.<\/p>\n<ul>\n<li>One provider can offer many models.<\/li>\n<li>Examples: DeepSeek V4.1 Flash and Kimi K3 (both on opencode Go), and Claude Opus 5.5 (on Anthropic).<\/li>\n<\/ul>\n<p><strong>Annie's three setups (checked 10 Oct 2026):<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Harness<\/th>\n<th>Provider<\/th>\n<th>Model<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Her building at the desk<\/td>\n<td>Claude Code<\/td>\n<td>Anthropic, through her Claude subscription<\/td>\n<td>Claude Opus 5.5<\/td>\n<\/tr>\n<tr>\n<td>Her second builder<\/td>\n<td>pi<\/td>\n<td>opencode Go<\/td>\n<td>DeepSeek V4.1 Flash<\/td>\n<\/tr>\n<tr>\n<td>Her three bots<\/td>\n<td>Hermes<\/td>\n<td>opencode Go<\/td>\n<td>DeepSeek V4.1 Flash<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Sources: Annie's pi settings and the bots' settings on her server, both read 10 Oct 2026.<\/p>\n<p><strong>Why the three parts matter:<\/strong><\/p>\n<ul>\n<li><strong>You can change one part and keep the others.<\/strong>\n<ul>\n<li>To give your bot a different &quot;brain&quot;, you change one setting: the model name.<\/li>\n<li>The harness and your files stay the same.<\/li>\n<\/ul>\n<\/li>\n<li><strong>A model name works only with a provider that offers it.<\/strong> Here is what happened:\n<ol>\n<li>Once, Annie moved Claudith to a new provider.<\/li>\n<li>Some settings still named models that only the old provider offered.<\/li>\n<li>Those models stopped working at once. Nothing sent an alert.<\/li>\n<li>A scheduled job that used one of them failed overnight.<\/li>\n<\/ol>\n<\/li>\n<li><strong>The same model can act differently in two harnesses.<\/strong>\n<ul>\n<li>pi (harness) and Annie's bot, which runs on Hermes (harness), both use DeepSeek (AI model).<\/li>\n<li>But they give different answers to the same question.<\/li>\n<li>Module 08B shows this live (&quot;Same model, different program&quot;).<\/li>\n<\/ul>\n<\/li>\n<li><strong>The bill comes from the provider.<\/strong>\n<ul>\n<li>opencode Go (AI provider) costs $10 a month <strong>[COST]<\/strong>.<\/li>\n<li>A Claude subscription from Anthropic (AI provider) pays for Claude Code (harness).<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>One opencode Go plan does two jobs. A Claude plan cannot.<\/strong><\/p>\n<ul>\n<li>With opencode Go (AI provider), one $10 a month plan <strong>[COST]<\/strong> pays for two things:\n<ol>\n<li>your PA bot's AI, through Hermes (harness) on the server<\/li>\n<li>pi (harness) in the terminal on your laptop<\/li>\n<\/ol>\n<\/li>\n<li>Both use the same models, such as DeepSeek (AI model), from the same plan.<\/li>\n<li>A Claude subscription from Anthropic (AI provider) cannot do this. Anthropic's own pages say so in two places (both read 10 Oct 2026):\n<ol>\n<li><strong>Claude Code's legal page:<\/strong> a Claude subscription sign-in is &quot;designed to support ordinary use of Claude Code and other native Anthropic applications&quot;. Other programs &quot;should use API key authentication&quot;. Anthropic does not allow other programs to &quot;route requests through Free, Pro, or Max plan credentials&quot;.<\/li>\n<li><strong>Anthropic's Consumer Terms (effective 8 Oct 2025), Section 3:<\/strong> you may not use the service &quot;through automated or non-human means, whether through a bot, script, or otherwise&quot;, except with an Anthropic API key or with Anthropic's explicit permission.<\/li>\n<\/ol>\n<\/li>\n<li><strong>The reason, in plain words:<\/strong>\n<ul>\n<li>A subscription is priced for one person using Anthropic's own apps.<\/li>\n<li>A bot or another program can send far more requests.<\/li>\n<li>So Anthropic wants those to go through an API key. With a key, you pay for each use, on top of any subscription.<\/li>\n<li>Anthropic's pages do not say this reason in these words. It is the reason the two rules point to.<\/li>\n<\/ul>\n<\/li>\n<li>News reports say Anthropic began blocking subscription sign-ins in other programs on 9 Jan 2026 (WinBuzzer and Gigazine, Feb 2026).<\/li>\n<li>Annie saw the block herself. When she signed pi into her Claude account, every request failed with &quot;Model access is disabled&quot;.<\/li>\n<li>Facilitator: check both Anthropic pages again before teaching, because these rules can change. Anthropic says it may enforce them &quot;without prior notice&quot; (Claude Code legal page).<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-03-s6\"><h2><span class=\"num\">03.6<\/span> The Vault, and One Job Each for Calendar, Vault and Inbox<\/h2><p>A vault is a folder of plain text notes. The notes are written in a simple format called Markdown. Obsidian is a free app that shows the folder as a notebook. You own the files. They are not locked inside any company's app.<\/p>\n<p><strong>Why plain files and not Google Docs?<\/strong> Annie's bot's first memory was a Google Sheet. She replaced it for three reasons:<\/p>\n<ol>\n<li><strong>Speed and cost.<\/strong> A bot reads plain files on its own disk instantly and for free. Every read of a Google Doc is a signed-in request.<\/li>\n<li><strong>Shape.<\/strong> Notes work better as linked pages than as rows in a grid.<\/li>\n<li><strong>Ownership.<\/strong> You own the files, with no company in between.<\/li>\n<\/ol>\n<p>Google still does the jobs it does well: the calendar, email, and file backups.<\/p>\n<p><strong>Give each tool one job.<\/strong> Annie settled this in her first month:<\/p>\n<ul>\n<li><strong>The calendar holds anything with a time.<\/strong> Appointments, deadlines, reminders.<\/li>\n<li><strong>The vault holds anything you want to keep.<\/strong> Notes, plans, rules, records.<\/li>\n<li><strong>An inbox folder holds anything you have not sorted yet.<\/strong> You capture first and file later. In the Full course, a nightly job will do the filing for you.<\/li>\n<\/ul>\n<p><strong>Pick the starting point you actually open every day.<\/strong><\/p>\n<ul>\n<li>Annie set up a task board first. It stayed empty, because she never opened it.<\/li>\n<li>Her calendar became the main list instead, because she already lived in it.<\/li>\n<li>So choose your daily starting point from habit, not from what looks organised.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-03-s7\"><h2><span class=\"num\">03.7<\/span> Two Kinds of Instruction File, and One Bot or Several<\/h2><p><em>Full course.<\/em><\/p>\n<p>Your system will have two sets of instructions. They are stored differently on purpose.<\/p>\n<p><strong>The builder's files are shared everywhere.<\/strong><\/p>\n<ul>\n<li>The builder reads its instructions only when you start a session.<\/li>\n<li>So it is safe for every device to read one shared copy in the vault.<\/li>\n<li>After Annie set this up, a note written on her Mac appeared on her server about 80 seconds later.<\/li>\n<\/ul>\n<p><strong>The bot's rulebook is guarded.<\/strong><\/p>\n<ul>\n<li>The bot reads its rulebook on every message, all day.<\/li>\n<li>If that file changed halfway through an edit, or a sync stalled, the bot could break in the middle of a conversation.<\/li>\n<li>So Annie keeps the live rulebook on the server, next to the bot.<\/li>\n<li>The vault holds a copy for reading. It refreshes every minute.<\/li>\n<li>To change the bot, she edits a draft and runs a push command. The push backs up the old live file first.<\/li>\n<li>A scheduled check messages her if the live file and the copy ever disagree outside a push.<\/li>\n<\/ul>\n<p><strong>The question to ask about any shared file:<\/strong> what breaks if it changes halfway through?<\/p>\n<ul>\n<li>If the answer is &quot;nothing much&quot;, share it.<\/li>\n<li>If people depend on it, guard it.<\/li>\n<\/ul>\n<p><strong>One bot or several?<\/strong><\/p>\n<p>Annie once considered four bots: one for work, one for parenting, one for her marriage, one for friends. Research recommended one bot instead. She can ask that one bot to take on different roles.<\/p>\n<p>Four bots had three problems:<\/p>\n<ol>\n<li>She would have to decide which bot to tell each thought to.<\/li>\n<li>They could not see across her life. So they would miss a work call that clashes with a child's appointment.<\/li>\n<li>They would cost about four times as much.<\/li>\n<\/ol>\n<p>Her system later gained more bots, for a different reason: different people use them.<\/p>\n<p><strong>Split bots by who uses them and what they may see, not by your moods.<\/strong><\/p>\n<\/section>\n<section class=\"card\" id=\"full-03-s8\"><h2><span class=\"num\">03.8<\/span> Build Your Vault<\/h2><p>The facilitator sits beside each student for this.<\/p>\n<p><strong>Step 1. Install Obsidian on your laptop.<\/strong><\/p>\n<ul>\n<li>Go to obsidian.md.<\/li>\n<li>Download the installer for your system, and open it.<\/li>\n<\/ul>\n<p>What success looks like: Obsidian opens and offers to create a vault.<\/p>\n<p><strong>Step 2. Create the vault.<\/strong><\/p>\n<ul>\n<li>Choose &quot;Create new vault&quot;.<\/li>\n<li>Name it with your first name, for example <code>Jane Vault<\/code>.<\/li>\n<li>Put it in your Documents folder.<\/li>\n<li>Do not put it inside iCloud Drive, OneDrive or Google Drive. Those services and Obsidian's own sync can damage each other's files.<\/li>\n<\/ul>\n<p>What success looks like: an empty vault opens, with your vault name at the top of the left panel.<\/p>\n<p><strong>Step 3. Create your top-level folders.<\/strong><\/p>\n<ul>\n<li>Annie's folders follow how she looks things up.<\/li>\n<li>Anything about her son's school is filed under her son, not under &quot;School&quot;.<\/li>\n<li>Use the people and areas of your life.<\/li>\n<\/ul>\n<p>A starting set:<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Folder<\/th>\n<th>What goes in it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>00 Inbox<\/code><\/td>\n<td>Anything not yet sorted<\/td>\n<\/tr>\n<tr>\n<td><code>Me Personal<\/code><\/td>\n<td>Your own plans, health notes, learning<\/td>\n<\/tr>\n<tr>\n<td><code>Me Work<\/code><\/td>\n<td>Your work notes. Check your Data Map before anything confidential goes here<\/td>\n<\/tr>\n<tr>\n<td>One folder per family member<\/td>\n<td>Their school, appointments, records<\/td>\n<\/tr>\n<tr>\n<td><code>Household<\/code><\/td>\n<td>The home, bills, repairs, suppliers<\/td>\n<\/tr>\n<tr>\n<td><code>Builder<\/code><\/td>\n<td>Your builder's instructions, memory and continuity note<\/td>\n<\/tr>\n<tr>\n<td><code>AI System<\/code><\/td>\n<td>Your bot's rulebook, your build logs and your system map<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Right-click in the left panel and choose &quot;New folder&quot; for each one.<\/p>\n<p><strong>Step 4. Start flat.<\/strong> Do not create subfolders yet. Add one only when a folder gets crowded.<\/p>\n<p><strong>Step 5. Create a map note.<\/strong><\/p>\n<ul>\n<li>In the top level of the vault, create a note called <code>Map of This Vault<\/code>.<\/li>\n<li>Write one line per folder saying what lives there.<\/li>\n<li>When a vault feels messy, the usual cause is an out-of-date map, not real chaos.<\/li>\n<\/ul>\n<p><strong>Step 6. Move in your two worksheets.<\/strong><\/p>\n<ul>\n<li>Create notes called <code>Access Sheet<\/code> and <code>Data Map<\/code> inside <code>AI System<\/code>.<\/li>\n<li>Paste your Module 01 and 02 work into them.<\/li>\n<\/ul>\n<p><strong>Step 7. Install Obsidian on your phone.<\/strong><\/p>\n<ul>\n<li>Create the same vault name on the phone, stored on the phone itself.<\/li>\n<li>Do not connect the two yet.<\/li>\n<li>In the Full course, the server module (Module 08B) connects them.<\/li>\n<li>In the Short course, Obsidian's own sync service connects them, if you want your notes on your phone. It is optional. <strong>[COST]<\/strong><\/li>\n<\/ul>\n<p><strong>If it fails:<\/strong><\/p>\n<ul>\n<li>If Obsidian will not install on a company laptop, use your phone today. Install on a personal laptop before the next session.<\/li>\n<li>If you already use Obsidian, create a new vault for this course anyway. You can merge later.<\/li>\n<\/ul>\n<h3>Five Rules That Keep a Vault Safe<\/h3>\n<p>These come from things that broke in Annie's vault. Each one failed without any error message.<\/p>\n<ol>\n<li><strong>Never put a password or key in the vault.<\/strong> It copies to every device and to backups. Use a password manager.<\/li>\n<li><strong>Never use these characters in a file name:<\/strong> <code>: / \\ * ? &quot; &lt; &gt; |<\/code>. A colon in a file name stopped a page from ever reaching Annie's Mac, with no warning.<\/li>\n<li><strong>Choose folder names now, and keep them.<\/strong>\n<ul>\n<li>Scripts will soon refer to these names.<\/li>\n<li>Plain names are easiest to type in a terminal.<\/li>\n<li>If you want emoji in names, add them today, not later.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Moving a file breaks every place that wrote down its address.<\/strong> Before moving or renaming, search for the old name everywhere.<\/li>\n<li><strong>Keep anything a bot must read as a Markdown note.<\/strong> A page saved as <code>.html<\/code> never reached Annie's server, so her bot could not read it.<\/li>\n<\/ol>\n<\/section>\n<div class=\"partbar\">Where Your System Lives<\/div>\n<section class=\"card\" id=\"full-03-s9\"><h2><span class=\"num\">03.9<\/span> Three Questions and the Decision Tree<\/h2><p>Your system has to run on some machine. Choosing it is a decision about your life, not about technology. Answer each question yes or no.<\/p>\n<p><strong>1. Does anything need to run while you are asleep?<\/strong><\/p>\n<ul>\n<li>Morning summaries, the nightly inbox sort, backups and checks all run when you are not there.<\/li>\n<li>If yes, the machine must stay on when you are off.<\/li>\n<li>A laptop that sleeps will not do it.<\/li>\n<\/ul>\n<p><strong>2. Do you need it away from your desk?<\/strong><\/p>\n<ul>\n<li>If you only use it at your desk, the laptop is fine.<\/li>\n<li>If you want it on your phone while out, you need a bot.<\/li>\n<li>The bot is only as available as the machine it runs on.<\/li>\n<\/ul>\n<p><strong>3. What will you actually maintain?<\/strong><\/p>\n<ul>\n<li>Everything you run must be updated, backed up, and noticed when it breaks.<\/li>\n<li>The failure is rarely dramatic.<\/li>\n<li>On Annie's server, a login was once blanked. Nobody noticed for four days.<\/li>\n<\/ul>\n<p><strong>A one-person system should be as small as it can be while still doing the job.<\/strong><\/p>\n<pre><code class=\"language-text\">Do you need anything to run while you sleep?\n├── No  → Do you need it away from your desk?\n│          ├── No  → LAPTOP ONLY. Do not spend money.\n│          └── Yes → LAPTOP PLUS A TELEGRAM BOT.\n│                    The bot answers only while the laptop is awake.\n└── Yes → You need a machine that stays on.\n           ├── A machine at home in Hong Kong, such as a Mac mini:\n           │     it cannot reach Claude without a VPN.\n           │     Fine for companies that serve Hong Kong.\n           └── A RENTED SERVER IN SINGAPORE:\n                 reaches every company this course uses,\n                 and you can reach it from anywhere.\n<\/code><\/pre>\n<p><strong>Annie's own choice, honestly.<\/strong> She rented a server because four reasons combined:<\/p>\n<ol>\n<li>It stays on.<\/li>\n<li>She can reach it from anywhere.<\/li>\n<li>It doubles as her route around the Hong Kong block (Module 01).<\/li>\n<li>It gives her bots one fixed address.<\/li>\n<\/ol>\n<p>For someone at a desk with nothing to run overnight, a laptop is often the whole answer.<\/p>\n<p><strong>A rented server does not make the AI smarter.<\/strong><\/p>\n<ul>\n<li>The AI's thinking happens on the AI company's computers, not on the machine you type into.<\/li>\n<li>A small server and a powerful laptop give the same answers.<\/li>\n<li>Only running a model on your own hardware needs a big machine. This course does not do that.<\/li>\n<\/ul>\n<p><strong>Annie's conclusion:<\/strong><\/p>\n<ul>\n<li>For anything you do at the keyboard, a laptop is fine.<\/li>\n<li>The laptop's real limit is being present, not being powerful.<\/li>\n<li>A job you must remember to start does not count as built.<\/li>\n<li>A weekly job on a laptop that is asleep counts as a fail, not a partial pass.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-03-s10\"><h2><span class=\"num\">03.10<\/span> Three Machines Compared: Laptop, Mac Mini or Rented Server<\/h2><p><em>Full course.<\/em><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>What you need<\/th>\n<th>Your laptop<\/th>\n<th>A Mac mini at home<\/th>\n<th>A rented server in Singapore<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Runs while you sleep or travel<\/td>\n<td>No. It sleeps and travels with you<\/td>\n<td>Yes, if power and home internet stay up<\/td>\n<td>Yes. Data centres have backup power<\/td>\n<\/tr>\n<tr>\n<td>Your laptop stays free for normal work<\/td>\n<td>No<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>Reach it from your phone anywhere<\/td>\n<td>Only while the laptop is awake and online<\/td>\n<td>Yes, with a private network<\/td>\n<td>Yes, with a private network<\/td>\n<\/tr>\n<tr>\n<td>Reaches AI companies that block Hong Kong<\/td>\n<td>No, not without a VPN<\/td>\n<td>No. It is still in Hong Kong<\/td>\n<td>Yes. Singapore is served<\/td>\n<\/tr>\n<tr>\n<td>Acts as your own route out of Hong Kong<\/td>\n<td>No<\/td>\n<td>No<\/td>\n<td>Yes (the server module (Module 08B))<\/td>\n<\/tr>\n<tr>\n<td>Up-front cost<\/td>\n<td>None<\/td>\n<td><strong>[COST]<\/strong><\/td>\n<td>None<\/td>\n<\/tr>\n<tr>\n<td>Monthly cost<\/td>\n<td>None<\/td>\n<td>Electricity<\/td>\n<td><strong>[COST]<\/strong><\/td>\n<\/tr>\n<tr>\n<td>You must keep it secure and updated<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>For students in Hong Kong, location is the deciding row.<\/strong><\/p>\n<ul>\n<li>A Mac mini at home is a strong machine.<\/li>\n<li>But it sits on a Hong Kong connection. So it cannot reach Claude without a VPN.<\/li>\n<li>A server in Singapore reaches every company directly.<\/li>\n<li>In the server module (Module 08B), it also becomes your own route out of Hong Kong.<\/li>\n<\/ul>\n<p><strong>Annie's advice is a rented server first.<\/strong> In her guide she calls it &quot;the version of this that never becomes a second hobby&quot;. A Mac mini can come later as an addition.<\/p>\n<p><strong>Keep in mind that one server can end up holding everything.<\/strong><\/p>\n<ul>\n<li>Annie's server holds the bot, a copy of the vault, the backups and the builder.<\/li>\n<li>If it fails, all of them stop together.<\/li>\n<li>The module on what breaks (Module 10) covers the backups that make this safe.<\/li>\n<\/ul>\n<p><strong>The Hong Kong factors<\/strong>:<\/p>\n<ul>\n<li><strong>Distance matters when you type.<\/strong> A server in Germany or the US adds about 150 to 250 milliseconds to every keystroke. Singapore adds about 35.<\/li>\n<li><strong>Heat and humidity.<\/strong> A machine running all day in a warm flat slows itself down to stay cool. Its parts also wear faster.<\/li>\n<li><strong>Typhoons and power cuts.<\/strong> A home machine stops when the power stops. A data centre has backup power.<\/li>\n<li><strong>Home internet often blocks servers.<\/strong>\n<ul>\n<li>Hong Kong home broadband commonly blocks the ports used to host anything.<\/li>\n<li>The private network in the server module (Module 08B) works around this, without opening your home router.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Paying from Hong Kong.<\/strong>\n<ul>\n<li>Some companies check where your card was issued.<\/li>\n<li>Facilitator: confirm before the session whether this affects the chosen server company.<\/li>\n<li>With Hetzner as the default, this means one check: does Hetzner accept a Hong Kong card and ID?<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-03-s11\"><h2><span class=\"num\">03.11<\/span> Telegram as the Front Door<\/h2><p>You will talk to your bot through Telegram, for three reasons:<\/p>\n<ol>\n<li><strong>Telegram's bot service is free and official.<\/strong>\n<ul>\n<li>You create a bot through Telegram's own @BotFather account, and receive a token.<\/li>\n<li>There is no fee and no grey area.<\/li>\n<\/ul>\n<\/li>\n<li><strong>It works in Hong Kong with no extra steps.<\/strong><\/li>\n<li><strong>Photos arrive ready to use.<\/strong>\n<ul>\n<li>Telegram rotates and resizes photos before the bot receives them.<\/li>\n<li>Send pictures as normal photos, never as files.<\/li>\n<li>That one habit made Annie's storage catalogue work with no extra software.<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<p><strong>The chat app does not decide what the bot can do.<\/strong><\/p>\n<ul>\n<li>Annie once asked whether WhatsApp or Telegram is the more powerful choice.<\/li>\n<li>Her builder checked: both connect to the same model, tools and memory.<\/li>\n<li>The program behind the chat app decides what the bot can do.<\/li>\n<\/ul>\n<p><strong>Why not WhatsApp?<\/strong><\/p>\n<ul>\n<li>Annie once built a WhatsApp connection. She removed it the same month.<\/li>\n<li>It used an unofficial program tied to her personal phone number.<\/li>\n<li>That breaks WhatsApp's terms, and it risked a ban on her number.<\/li>\n<li>Her bot now drafts a message, and she pastes it herself.<\/li>\n<\/ul>\n<p><strong>Know what Telegram can see.<\/strong><\/p>\n<ul>\n<li>Chats with a bot are not end-to-end encrypted.<\/li>\n<li>Whoever runs the bot receives every message (Module 02).<\/li>\n<li>Your Data Map decides what you send.<\/li>\n<\/ul>\n<p><strong>Check now:<\/strong> Telegram is installed, and two-factor sign-in is on (Settings, Privacy and Security, Two-Step Verification).<\/p>\n<\/section>\n<section class=\"card\" id=\"full-03-s12\"><h2><span class=\"num\">03.12<\/span> Order Your Server<\/h2><p><em>Full course. The facilitator sits beside each student.<\/em><\/p>\n<p><strong>Pick at least 2 processors and 4 GB of memory, in Singapore, running Ubuntu.<\/strong> <strong>[COST]<\/strong><\/p>\n<ul>\n<li>Memory is the limit on a small server, not processing power.<\/li>\n<li>Annie's server has 2 processors and about 3.7 GB of usable memory.<\/li>\n<li>It runs three bots, 26 scheduled jobs and her builder sessions (live check, 2 Oct 2026).<\/li>\n<\/ul>\n<p><strong>The course default is Hetzner, in Singapore.<\/strong><\/p>\n<ul>\n<li>Annie's own server is a Hetzner CPX22 in Singapore, running Ubuntu 26.04.<\/li>\n<li>So every step in this course has been done there.<\/li>\n<li>Use Hetzner unless you have a reason not to.<\/li>\n<\/ul>\n<p><strong>Step 1. Create an account with the server company.<\/strong> Turn on two-factor sign-in straight away.<\/p>\n<p><strong>Step 2. Choose the location: Singapore.<\/strong><\/p>\n<p><strong>Step 3. Choose the system: Ubuntu, the newest long-term support version<\/strong> (marked &quot;LTS&quot;).<\/p>\n<p><strong>Step 4. Choose the size: at least 2 processors and 4 GB of memory.<\/strong><\/p>\n<p><strong>Step 5. Leave SSH keys blank for now, if the page allows it.<\/strong><\/p>\n<ul>\n<li>An SSH key is the file that will let your laptop sign in to the server without a password.<\/li>\n<li>You will create it in the server module (Module 08B), with your builder.<\/li>\n<li>Facilitator: if the company insists on a key or a password at order time, follow its default. Note it for the server module (Module 08B).<\/li>\n<\/ul>\n<p><strong>Step 6. Turn on the backup option,<\/strong> if the company offers one. <strong>[COST]<\/strong><\/p>\n<ul>\n<li>On Annie's server, the whole-server backup is switched on.<\/li>\n<li>Her notes estimate a full restore at about 10 minutes.<\/li>\n<li>Nobody has timed one yet.<\/li>\n<\/ul>\n<p><strong>Step 7. Name the server something plain,<\/strong> such as <code>my-server<\/code>. Do not use your name or address.<\/p>\n<p>What success looks like:<\/p>\n<ul>\n<li>The company shows a running server and an IP address. The IP address is the server's number on the internet.<\/li>\n<li>Save the IP address in your password manager, not in your vault.<\/li>\n<\/ul>\n<p><strong>If it fails:<\/strong><\/p>\n<ul>\n<li>If the company asks for identity documents, upload them and wait.<\/li>\n<li>Nobody knows yet how long this takes for a Hong Kong sign-up. That is why you order now and not in the server module (Module 08B).<\/li>\n<li>If your card is refused, try another server company.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-03-s13\"><h2><span class=\"num\">03.13<\/span> Your Shape Decision, and What Your System Does at 11pm on a Bad Day<\/h2><p>Fill in the worksheet below. Then answer one last question, in one sentence:<\/p>\n<blockquote>\n<p><strong>What will your system do for you at 11pm on a bad day?<\/strong><\/p>\n<\/blockquote>\n<p>If the answer is &quot;nothing&quot;, the design does not fit you yet, however good it looks.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-03-s14\"><h2><span class=\"num\">03.14<\/span> Lessons From Real Mistakes<\/h2><p>Each line below is one lesson from a real mistake in Annie's own system. The full story behind each one is on the FAQ tab, the last tab at the top of the page.<\/p>\n<ul>\n<li>Choose one home for your notes, move everything in, and check before you delete.<\/li>\n<li>One real copy that every device reads is better than several copies kept in step.<\/li>\n<li>A move is finished only when every script and bot that refers to the old address has been updated.<\/li>\n<li>After any rename, search every script for the old name. Then run each affected job once by hand.<\/li>\n<li>Build around the place you already look every day.<\/li>\n<li><em>Full course only:<\/em> check what you already own before you buy.<\/li>\n<li><em>Full course only:<\/em> before you use any AI tool on a machine, check whose account it is on and how it bills.<\/li>\n<li><em>Full course only:<\/em> on a small server, memory runs out first. Close sessions you no longer use.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-03-s15\"><h2><span class=\"num\">03.15<\/span> Exercise<\/h2><ol>\n<li>List every place your notes, tasks and AI instructions live today. For each one, write one word:\n<ul>\n<li><strong>move<\/strong> (into the vault),<\/li>\n<li><strong>keep<\/strong> (it does a different job, such as the calendar), or<\/li>\n<li><strong>close<\/strong> (stop using it).<\/li>\n<\/ul>\n<\/li>\n<li>Which one place will you open first every morning?<\/li>\n<li>In a normal week, how many hours are you away from your laptop? Those are the hours your system cannot run on the laptop.<\/li>\n<li><strong>Homework:<\/strong> sketch your system on one page, with boxes and arrows. Use the parts table below.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"full-03-s16\"><h2><span class=\"num\">03.16<\/span> Worksheet: System Sketch and Shape Decision<\/h2><p><strong>My System Sketch<\/strong> (homework). Leave a part blank if you have not decided yet.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Part<\/th>\n<th>My version<\/th>\n<th>Where it will live<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Builder<\/td>\n<td>Claude Code / pi<\/td>\n<td>Laptop. Full course: also my server<\/td>\n<\/tr>\n<tr>\n<td>Bot<\/td>\n<td><\/td>\n<td>Full course: my server. Short course: none in the 10 hours; my server, if I take the optional sitting<\/td>\n<\/tr>\n<tr>\n<td>Vault<\/td>\n<td><\/td>\n<td>Laptop and phone. Full course: also my server<\/td>\n<\/tr>\n<tr>\n<td>Server<\/td>\n<td><\/td>\n<td>Full course, or the optional server sitting<\/td>\n<\/tr>\n<tr>\n<td>First scheduled job<\/td>\n<td><\/td>\n<td>Decided in Module 05, where you map your processes on paper<\/td>\n<\/tr>\n<tr>\n<td>Watchdog<\/td>\n<td><\/td>\n<td>The module on what breaks (Module 10)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>My daily starting point:<\/strong> ____________<\/p>\n<p><strong>My Shape Decision:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Question<\/th>\n<th>My answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Where my system runs<\/td>\n<td>Laptop / laptop plus server<\/td>\n<\/tr>\n<tr>\n<td>Joining the optional server sitting? (Short course)<\/td>\n<td>Yes / No / Later<\/td>\n<\/tr>\n<tr>\n<td>Server company, location and size (Full course)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Whole-server backup turned on? (Full course)<\/td>\n<td>Yes / No<\/td>\n<\/tr>\n<tr>\n<td>Date ordered, or the date I will order (Full course)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Server IP address saved in my password manager? (Full course)<\/td>\n<td>Yes / No<\/td>\n<\/tr>\n<tr>\n<td>Telegram installed, with two-factor sign-in on?<\/td>\n<td>Yes / No<\/td>\n<\/tr>\n<tr>\n<td>My phone (Android or iPhone)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My laptop (Mac or Windows)<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>", "count": 16, "sess": [1]}, {"id": "full-04", "label": "04", "title": "Module 04: The Demo", "minutes": 45, "read": 12, "toc": [["full-04-s1", "04.1", "What You Will Leave With"], ["full-04-s2", "04.2", "What You Need to Prepare"], ["full-04-s3", "04.3", "The Rule for the Whole Module"], ["full-04-s4", "04.4", "What This System Is For"], ["full-04-s5", "04.5", "A Photo Becomes a Record"], ["full-04-s6", "04.6", "The Jobs That Remove the Most Remembering"], ["full-04-s7", "04.7", "When the Bot Was Wrong"], ["full-04-s8", "04.8", "The Message From the Watchdog"], ["full-04-s9", "04.9", "What It Costs"], ["full-04-s10", "04.10", "Exercise: Your Wish List"], ["full-04-s11", "04.11", "How to Close the Module"], ["full-04-s12", "04.12", "What Not to Do"]], "body": "<section class=\"card\" id=\"full-04-s1\"><h2><span class=\"num\">04.1<\/span> What You Will Leave With<\/h2><p><strong>Your Wish List.<\/strong><\/p>\n<ul>\n<li>Three to five jobs you want your system to take over.<\/li>\n<li>Each one is scored by how much remembering it removes.<\/li>\n<li>Circle your top two. They go into the next module, where you map them on paper.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-04-s2\"><h2><span class=\"num\">04.2<\/span> What You Need to Prepare<\/h2><ul>\n<li><strong>Modules 01 to 03 finished.<\/strong> Bring your Data Map from Module 02.<\/li>\n<li><strong>A pen and the worksheet.<\/strong> This module is mostly watching, then one short exercise.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-04-s3\"><h2><span class=\"num\">04.3<\/span> The Rule for the Whole Module<\/h2><p><strong>Never show a capability without showing what it costs.<\/strong><\/p>\n<ul>\n<li>Every demo below comes with a failure, a bill or a trade-off.<\/li>\n<li>A demo that shows only wins makes the room feel behind.<\/li>\n<li>It also makes the facilitator hard to trust the first time a student's own build fails.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-04-s4\"><h2><span class=\"num\">04.4<\/span> What This System Is For<\/h2><p>Most AI marketing promises that you will do ten times more. Annie's system is built for a different reason.<\/p>\n<p>Her line: the real gift is clearing what drains you, so you can be present with the people in front of you, including yourself.<\/p>\n<p>It works in two directions:<\/p>\n<ul>\n<li><strong>Take things away.<\/strong> Admin, reminders, chasing, filing. Anything you hold in your head today because nothing else will.<\/li>\n<li><strong>Add depth.<\/strong> Research and learning on the things that matter to you.<\/li>\n<\/ul>\n<p>Annie judges every build by one rule: if a job only works when you remember to start it, it is not finished. Every demo below runs without her starting it.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-04-s5\"><h2><span class=\"num\">04.5<\/span> A Photo Becomes a Record<\/h2><p><strong>What it is.<\/strong> A photo catalogue of the family's storage units. A bot built it, and you can read it on a phone.<\/p>\n<p><strong>What the screenshots show.<\/strong><\/p>\n<ol>\n<li><strong><code>Storage Bot Logging Item (edited)<\/code>.<\/strong>\n<ul>\n<li>Annie sends a photo of a cap, with a short caption naming the unit.<\/li>\n<li>The bot replies &quot;Got it&quot;.<\/li>\n<li>It logs the item to Unsorted, and says it did not catch the unit.<\/li>\n<li>A minute later, it moves the item to the right unit as number 325.<\/li>\n<li>It asks her to reply if that is wrong.<\/li>\n<\/ul>\n<\/li>\n<li><strong><code>Storage Bot Finding Item (edited)<\/code>.<\/strong>\n<ul>\n<li>Annie asks where a playmat is.<\/li>\n<li>The bot answers with the item number.<\/li>\n<li>It says the playmat was lent to a friend, and quotes the note about a missing part.<\/li>\n<li>It also lists two near-matches, in case she meant one of those.<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<p><strong>The line to say.<\/strong> &quot;When it was unsure where the cap went, it said so and put it somewhere safe. It did not guess.&quot;<\/p>\n<p><strong>What else to point out.<\/strong><\/p>\n<ul>\n<li>The count of items comes from code, not from the AI.<\/li>\n<li>AI models are bad at counting.<\/li>\n<li>So Annie's rule is: code does the arithmetic, and the model only reads the result.<\/li>\n<\/ul>\n<p><strong>The cost of this one.<\/strong><\/p>\n<ol>\n<li>Annie's first answer from Claude was &quot;don't build it&quot;. Describing photos seemed to need a paid AI service.<\/li>\n<li>She removed that assumption in six words: &quot;I actually don't mind typing descriptions.&quot;<\/li>\n<li>It then turned out the bot already described photos, for about $0.001 each.<\/li>\n<\/ol>\n<p>The lesson: say out loud the one assumption your advice depends on. Then the other person can overturn it.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-04-s6\"><h2><span class=\"num\">04.6<\/span> The Jobs That Remove the Most Remembering<\/h2><p><em>Full course only.<\/em><\/p>\n<p>A mentor gave Annie a way to rank automations: by how much mental load each one removes from you. The most useful build is rarely the most impressive one. Show four jobs. Annie chose them herself. The calendar job has four short examples. The morning brief has two. The segment stays at 10 minutes, so move quickly.<\/p>\n<p><strong>1. Receipts that need claiming (<code>Health Insurer Claims 1 (edited)<\/code>).<\/strong><\/p>\n<ul>\n<li>At 20:00, one message arrives: two medical invoices came in today, file the insurance claim.<\/li>\n<li>Both files are attached, already renamed to fit the insurer's app.<\/li>\n<li>Annie taps, files the claim on her phone, and replies &quot;done!&quot;.<\/li>\n<li>The insurer requires a person to submit the claim. So that step stays with her.<\/li>\n<\/ul>\n<p><strong>2. Calendar jobs.<\/strong> Four examples, from simple to clever.<\/p>\n<p><strong>a. Her son's calendar, checked against his nap and his rules (<code>Kids Gym (edited)<\/code>).<\/strong><\/p>\n<ul>\n<li>Annie lists the times of a new gym class. She asks which one works, checked against his nap and his calendar.<\/li>\n<li>The bot answers with one working option: Friday at 9:30.<\/li>\n<li>It lists every other slot, with the reason each one is blocked.<\/li>\n<li>It asks before adding the class to his calendar.<\/li>\n<\/ul>\n<p><strong>b. A screenshot becomes calendar entries (<code>Class Provider Class Dates Times (edited)<\/code> and <code>2 (edited)<\/code>).<\/strong><\/p>\n<ul>\n<li>Annie sends a screenshot of her son's gym schedule.<\/li>\n<li>She asks the bot to make sure every class is on his calendar.<\/li>\n<li>The bot reports two classes already there and two missing. It asks before adding them.<\/li>\n<li>She says yes.<\/li>\n<li>It adds both, and confirms all four are now on the calendar.<\/li>\n<\/ul>\n<p><strong>c. A friend's messages become an event (<code>Beach Day Calendar Add (edited)<\/code>).<\/strong><\/p>\n<ul>\n<li>Annie pastes a friend's chat messages about a beach day, and adds &quot;pls put in annie cal&quot;.<\/li>\n<li>The bot checks all three calendars: personal, work and her son's.<\/li>\n<li>It proposes one event and asks for a yes.<\/li>\n<li>It leaves the second date off on purpose, because the friend said &quot;if things go well&quot;.<\/li>\n<li>It asks whether her son is coming.<\/li>\n<li>Annie changes the title and adds the second date as tentative. The bot reads both events back once they are in.<\/li>\n<\/ul>\n<p><strong>d. The anniversary catch (<code>Anniversary Clash 1 of 2 - Caught and Deleted (edited)<\/code> and <code>2 of 2 - Rule Learned (edited)<\/code>).<\/strong><\/p>\n<ol>\n<li>A friend proposes a playdate for one afternoon at 4pm. Annie asks the bot to add it.<\/li>\n<li>The bot checks her son's calendar. His nap and his gym class are both clear. It adds the playdate.<\/li>\n<li>Then it flags something nobody asked about: that evening is Annie's wedding anniversary.<\/li>\n<li>Annie deletes the playdate on the spot. So the evening has to stay free.<\/li>\n<li>The bot writes the rule into its scheduling skill. A day that already has something important, such as an anniversary or a birthday, does not get a competing plan.<\/li>\n<\/ol>\n<p><strong>The line to say for the anniversary.<\/strong> &quot;It didn't just add the event. It told me the day was my anniversary. Then it learned the rule, so I never have to catch it again.&quot;<\/p>\n<p><strong>3. A task typed once goes on the to-do list (<code>Adding Task to To Do List (edited)<\/code>).<\/strong><\/p>\n<ul>\n<li>At 5:30am, Annie types &quot;add to to do list:&quot; and the task, in Telegram.<\/li>\n<li>The bot writes the task into her one to-do list.<\/li>\n<li>It replies with a receipt that names the exact file it saved to.<\/li>\n<li>It notices a similar item already exists. It notes the difference, so the two are not confused.<\/li>\n<li>It leaves her ranking alone, because she gave the new item no rank.<\/li>\n<li>It writes down a first step.<\/li>\n<\/ul>\n<p><strong>Why the receipt matters.<\/strong> The bot once replied &quot;got it&quot; without saving anything. The rule now: write the task, check the file, then reply with where it went. Annie's line: &quot;If it says saved, it shows me where. That receipt is how I know it really did it.&quot;<\/p>\n<p><strong>4. The morning brief, two ways.<\/strong><\/p>\n<p><strong>a. Annie's bot (<code>Cal + Inbox Checker (edited)<\/code>).<\/strong><\/p>\n<ul>\n<li>At 7:00, two messages arrive.<\/li>\n<li>The first is today's calendar.<\/li>\n<li>The second is the overnight email, sorted into what needs a look and what is only newsletters.<\/li>\n<\/ul>\n<p><strong>b. The same idea in Gemini, for the helper (<code>Gemini/Daily Msg for Helper (edited)<\/code>).<\/strong><\/p>\n<ul>\n<li>Annie made a Gemini Skill called &quot;helper-day&quot;. It writes the daily message for the family's helper, from her son's calendar and his daily routines.<\/li>\n<li>Annie types &quot;Write today's helper message&quot;.<\/li>\n<li>Gemini writes the day in three timed lines: the drive to an appointment, the lunch delivery, and her son coming home from school.<\/li>\n<li>Then it lists what to check:\n<ul>\n<li><strong>A clash.<\/strong> The helper cannot drive to the appointment and also receive the lunch delivery and meet her son at home.<\/li>\n<li><strong>A missing event.<\/strong> There was no morning school event on the calendar, so it did not add a drop-off.<\/li>\n<li><strong>Events left out on purpose.<\/strong> Two events came from Annie's personal calendar, so it kept them out of the helper's message.<\/li>\n<\/ul>\n<\/li>\n<li>It asks whether everyone is home for dinner, and whether to add the times to the helper's calendar.<\/li>\n<li>The point for students: you can build this kind of daily message in Gemini, with no server and no bot. Consumer Gemini works in Hong Kong with no VPN.<\/li>\n<li><em>Optional second screenshot:<\/em> the Skill in Gemini's Skills list.<\/li>\n<\/ul>\n<p><strong>The line to say.<\/strong> &quot;None of these is clever. Each one removes something I used to have to remember.&quot;<\/p>\n<p><strong>The cost of this one.<\/strong><\/p>\n<ol>\n<li>Once, the receipt flow came back from the bot's own agents, marked as tested and working.<\/li>\n<li>An independent check found six bugs. Four of them were fatal.<\/li>\n<li>For example, the sender check could never match, and the email tool could not download attachments.<\/li>\n<\/ol>\n<p>The lesson: a report of success is a claim. Check the result yourself before you trust it.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-04-s7\"><h2><span class=\"num\">04.7<\/span> When the Bot Was Wrong<\/h2><p><strong>What happened.<\/strong><\/p>\n<ol>\n<li>Annie photographed a hard drive's warranty card and said &quot;save this&quot;.<\/li>\n<li>The bot filed it as a searchable page. It explained which folder it chose and why (<code>warranty-01<\/code>).<\/li>\n<li>Then it stated, confidently, that the warranty did not cover data recovery. That was wrong.<\/li>\n<\/ol>\n<p><strong>How it was corrected<\/strong> (<code>warranty-02<\/code>):<\/p>\n<ol>\n<li>Annie corrected it in one sentence.<\/li>\n<li>The bot checked the manufacturer's own data sheet. It quoted the line that includes data recovery.<\/li>\n<li>It replied &quot;You're right and I was wrong&quot;.<\/li>\n<li>It fixed the page, and put the source in it.<\/li>\n<li>It explained the two ways to claim. It named what was still missing: the receipt.<\/li>\n<\/ol>\n<p><strong>Later<\/strong> (<code>warranty-03<\/code>):<\/p>\n<ul>\n<li>Annie asked it to move the files into a subfolder.<\/li>\n<li>It did.<\/li>\n<li>It also found and fixed a link elsewhere in the vault that the move would have broken.<\/li>\n<\/ul>\n<p><strong>The line to say.<\/strong> &quot;The lesson is not that the bot is clever. I stayed in charge, and correcting it took one sentence.&quot;<\/p>\n<\/section>\n<section class=\"card\" id=\"full-04-s8\"><h2><span class=\"num\">04.8<\/span> The Message From the Watchdog<\/h2><p><em>Full course only.<\/em><\/p>\n<p><strong>What the screenshot shows (<code>Toby flagging problem (edited)<\/code>).<\/strong><\/p>\n<ul>\n<li>At 12:31 am, Annie's watchdog (Toby, the script that checks every hour that her system worked) sent one message.<\/li>\n<li>A note had been renamed. A link pointing at the old name now led nowhere.<\/li>\n<li>The watchdog had tried once to fix it, and could not.<\/li>\n<li>So it said exactly what to do, and that it would not retry.<\/li>\n<\/ul>\n<p><strong>The story to pair it with.<\/strong><\/p>\n<ol>\n<li>Once, Annie's nightly inbox sorter reported &quot;ok&quot; every night for weeks.<\/li>\n<li>It ran, sent a message and moved files.<\/li>\n<li>But it was moving them to the wrong folder.<\/li>\n<li>The message even named the right folder, while the file went somewhere else.<\/li>\n<li>Annie's words: &quot;a false 'ok' is just as bad or worse than something breaking down.&quot;<\/li>\n<li>After that, the watchdog checks that the work is right, not only that the job ran.<\/li>\n<\/ol>\n<p><strong>The line to say.<\/strong> &quot;A check that only tells you the job ran will tell you everything is fine while it is broken. This one checks the result.&quot;<\/p>\n<p>The module on keeping your system honest (Module 10) builds a small version of this watchdog.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-04-s9\"><h2><span class=\"num\">04.9<\/span> What It Costs<\/h2><p><strong>Show one slide with three numbers.<\/strong> No screenshot is needed, so nothing private can appear.<\/p>\n<ol>\n<li><strong>The monthly figure.<\/strong> What Annie's whole system costs per month. <strong>[COST]<\/strong>, with its date.<\/li>\n<li><strong>The cap.<\/strong>\n<ul>\n<li>Annie had set a $20 monthly spending cap on one AI account.<\/li>\n<li>The cap was reached, and the account paused.<\/li>\n<li>The cap did exactly its job.<\/li>\n<\/ul>\n<\/li>\n<li><strong>What filled it.<\/strong>\n<ul>\n<li>One chat conversation ran for three days.<\/li>\n<li>It used 19.06 million tokens, costing $8.36.<\/li>\n<li>Tokens are the small pieces of text that AI companies count and charge for.<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<p><strong>The line to say.<\/strong> &quot;I know what this costs to the cent. If you build this and do not know that, you will get a surprise you will not enjoy.&quot;<\/p>\n<\/section>\n<section class=\"card\" id=\"full-04-s10\"><h2><span class=\"num\">04.10<\/span> Exercise: Your Wish List<\/h2><ol>\n<li>Write down three to five jobs you would hand over today if you could.<\/li>\n<li>For each one, write what you have to remember today to get it done.<\/li>\n<li>Score how much remembering it removes, from 1 to 5. A job you think about every day scores higher than a monthly one.<\/li>\n<li>Mark the harm if it goes wrong.<\/li>\n<li>Circle your top two.<\/li>\n<\/ol>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Job<\/th>\n<th>What I have to remember today<\/th>\n<th>Remembering removed (1 to 5)<\/th>\n<th>Harm if it goes wrong (low, medium, high)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>My top two (these go to the next module):<\/strong><\/p>\n<ol>\n<li>\n<hr />\n<\/li>\n<li>\n<hr />\n<\/li>\n<\/ol>\n<p><strong>Check against your Data Map.<\/strong> Some jobs need Tier 3 data, such as passwords, ID numbers or bank details. Cross those jobs off. Or redesign them, so that data never enters the system.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-04-s11\"><h2><span class=\"num\">04.11<\/span> How to Close the Module<\/h2><p>Close with this line:<\/p>\n<p><em>&quot;Everything you just saw started as the same sheet of paper you are about to fill in. Nothing here was built in one go, and most of it was built after something broke.&quot;<\/em><\/p>\n<p>Then hand out the sticky notes for the next module.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-04-s12\"><h2><span class=\"num\">04.12<\/span> What Not to Do<\/h2><div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Do not<\/th>\n<th>Why<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Show a capability you would have to explain for five minutes<\/td>\n<td>If it needs a long introduction, it is not ready to show<\/td>\n<\/tr>\n<tr>\n<td>Show anything built in the last week<\/td>\n<td>New work has not met real use yet, and it may change before class<\/td>\n<\/tr>\n<tr>\n<td>Skip the failures<\/td>\n<td>The failure stories are what make the room trust the rest<\/td>\n<\/tr>\n<tr>\n<td>Show a student's real data on screen<\/td>\n<td>Module 02 applies to the demo too<\/td>\n<\/tr>\n<tr>\n<td>Let a segment run long<\/td>\n<td>Each segment has a hard stop. A long demo loses the room<\/td>\n<\/tr>\n<tr>\n<td>Take questions during a demo<\/td>\n<td>Write them on a visible list and answer at the end<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>", "count": 12, "sess": [2]}, {"id": "full-05", "label": "05", "title": "Module 05: Your Processes on Paper", "minutes": 60, "read": 9, "toc": [["full-05-s1", "05.1", "What You Will Leave With"], ["full-05-s2", "05.2", "What You Need to Prepare"], ["full-05-s3", "05.3", "Why Paper Comes First"], ["full-05-s4", "05.4", "The Six Parts of Every Process"], ["full-05-s5", "05.5", "Who Checks This?"], ["full-05-s6", "05.6", "Map Process One"], ["full-05-s7", "05.7", "Keep One To-Do List and One Inbox"], ["full-05-s8", "05.8", "Ten Questions to Answer Before You Build"], ["full-05-s9", "05.9", "Lessons From Real Mistakes"], ["full-05-s10", "05.10", "Exercise: A Partner Reads Your Map"], ["full-05-s11", "05.11", "Worksheet: Process Card"]], "body": "<section class=\"card\" id=\"full-05-s1\"><h2><span class=\"num\">05.1<\/span> What You Will Leave With<\/h2><p><strong>Two Process Cards.<\/strong> You make one for each of the top two jobs on your Wish List. Each card shows:<\/p>\n<ul>\n<li>what starts the process<\/li>\n<li>every step<\/li>\n<li>who checks it<\/li>\n<li>what it produces<\/li>\n<li>how you know it is finished<\/li>\n<\/ul>\n<p><strong>What happens to the cards later.<\/strong><\/p>\n<ul>\n<li>The script-or-AI module (Module 09) marks each step as a job for code, for an AI model, or for you.<\/li>\n<li>Your best candidate becomes your first automation in the skills and schedules module (Module 11).<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-05-s2\"><h2><span class=\"num\">05.2<\/span> What You Need to Prepare<\/h2><ul>\n<li><strong>Your Wish List from Module 04,<\/strong> with your top two jobs circled.<\/li>\n<li><strong>Your Data Map from Module 02.<\/strong><\/li>\n<li><strong>Sticky notes in five colours, and a marker.<\/strong> The facilitator supplies these. At home, any five colours work.<\/li>\n<li><strong>A real example.<\/strong> Your process may start with an email or a form. If so, have a recent one open on your phone.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-05-s3\"><h2><span class=\"num\">05.3<\/span> Why Paper Comes First<\/h2><p><strong>An unmapped process keeps its mistakes.<\/strong> If you automate it, the mistakes happen faster.<\/p>\n<p><strong>Annie's example.<\/strong> Annie once drew a map of her whole system before she added anything new. The map showed that her real problems were not missing features. They were problems like these:<\/p>\n<ul>\n<li>&quot;when I move a folder, three things silently break&quot;<\/li>\n<li>&quot;nobody is checking whether last night's job actually ran&quot;<\/li>\n<\/ul>\n<p><strong>Paper keeps the AI out of the room for now.<\/strong> You are not asking anything to be built. You are writing down what really happens. Later, the builder works from facts instead of guesses.<\/p>\n<p><strong>Aim for clarity, not tidiness.<\/strong> A messy sheet that shows a missing step is worth more than a neat sheet that hides it. For any process, you should know four things:<\/p>\n<ul>\n<li>what starts it<\/li>\n<li>what ends it<\/li>\n<li>who checks it<\/li>\n<li>where it waits<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-05-s4\"><h2><span class=\"num\">05.4<\/span> The Six Parts of Every Process<\/h2><p>Every process has six parts. Use the colours below. Output and done-signal are both green, because both sit at the end of the line.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Part<\/th>\n<th>Sticky note colour<\/th>\n<th>The question it answers<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Trigger<\/strong><\/td>\n<td>Blue<\/td>\n<td>What actually arrives that starts this?<\/td>\n<\/tr>\n<tr>\n<td><strong>Steps<\/strong><\/td>\n<td>Yellow<\/td>\n<td>What happens, one action per note?<\/td>\n<\/tr>\n<tr>\n<td><strong>Decisions<\/strong><\/td>\n<td>Pink<\/td>\n<td>Where does someone have to judge something?<\/td>\n<\/tr>\n<tr>\n<td><strong>Owner and approver<\/strong><\/td>\n<td>Orange<\/td>\n<td>Who checks it, and who must say yes before anything reaches another person?<\/td>\n<\/tr>\n<tr>\n<td><strong>Output<\/strong><\/td>\n<td>Green<\/td>\n<td>What real thing exists at the end: a file, a reply, a payment, a calendar entry?<\/td>\n<\/tr>\n<tr>\n<td><strong>Done-signal<\/strong><\/td>\n<td>Green<\/td>\n<td>How do you know it is finished, without checking by hand?<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Start from the thing that actually arrives.<\/strong> This is Annie's own design rule. It shaped one of her most useful automations.<\/p>\n<ul>\n<li>A medical receipt that needs an insurance claim arrives by email.<\/li>\n<li>Sometimes it arrives the day after the appointment.<\/li>\n<li>An automation that started from the appointment would look too early and miss receipts.<\/li>\n<li>So the email is the trigger.<\/li>\n<li>The calendar has one smaller job. If an expected receipt has not arrived after 4 days, the system says so once.<\/li>\n<\/ul>\n<p><strong>Write every small step.<\/strong> &quot;Do the claim&quot; is not a step. Written out, Annie's receipt chore has six steps:<\/p>\n<ol>\n<li>Check email.<\/li>\n<li>Find the file.<\/li>\n<li>Download it.<\/li>\n<li>Rename it to fit the claim app's 15-character limit.<\/li>\n<li>Upload it.<\/li>\n<li>Remember to do all of this on the right day.<\/li>\n<\/ol>\n<p>Small steps show you which steps a script could do from start to finish.<\/p>\n<h3>A Worked Example: Receipts That Need a Claim<\/h3>\n<p>This is the card Annie wrote for her receipt chore.<\/p>\n<ul>\n<li><strong>Trigger:<\/strong> an email with a receipt attached arrives from a known clinic.<\/li>\n<li><strong>Steps:<\/strong>\n<ol>\n<li>Find the email.<\/li>\n<li>Download the file.<\/li>\n<li>Rename it to 15 characters or fewer.<\/li>\n<li>Send it to my phone at a time I can act.<\/li>\n<li>Upload it to the claim app.<\/li>\n<li>Log that it is done.<\/li>\n<\/ol>\n<\/li>\n<li><strong>Decisions:<\/strong> Is this a receipt I can claim? Whose claim is it?<\/li>\n<li><strong>Owner and approver:<\/strong> Me. The insurer requires me to submit the claim myself.<\/li>\n<li><strong>Output:<\/strong> a claim submitted, with the file named correctly.<\/li>\n<li><strong>Done-signal:<\/strong> I reply &quot;done&quot; and the system logs it.<\/li>\n<li><strong>Never-arrives check:<\/strong> an appointment happened but no receipt came within 4 days. The system sends one message, once.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-05-s5\"><h2><span class=\"num\">05.5<\/span> Who Checks This?<\/h2><p><em>Full course segment. In the Short course, give the one-sentence version when students add the people to their map.<\/em><\/p>\n<p><strong>Ask this about every process: who checks the result?<\/strong> Then ask how quickly they would notice if it were wrong. This is not about who does the work. It is about who would see the mistake.<\/p>\n<p><strong>Mark a step &quot;nobody&quot; when no one checks it.<\/strong> This is often the most honest note on the sheet. Some &quot;nobody&quot; steps still get done. Usually you are doing them, in the margins, and no one notices.<\/p>\n<p><strong>A &quot;nobody&quot; step can be automated only after you name someone to check its results.<\/strong> An automation on an unchecked step makes it worse. It produces wrong results faster and with more confidence.<\/p>\n<p><strong>Annie's example.<\/strong> Her nightly filing job reported success every night for weeks. All that time, it was filing notes into the wrong folder. Nothing checked where the notes ended up.<\/p>\n<p><strong>So write a name next to every &quot;nobody&quot;.<\/strong> The name can be yours.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-05-s6\"><h2><span class=\"num\">05.6<\/span> Map Process One<\/h2><p><strong>Step 1. Write the trigger.<\/strong> Put one blue note at the left. Write what arrives, in plain words. If no thing arrives, write the time instead, such as &quot;every Sunday at 6 pm&quot;.<\/p>\n<p><strong>Step 2. Lay out the steps.<\/strong> Use one yellow note per action, from left to right. Use verbs: check, find, copy, rename, send, remember.<\/p>\n<p><strong>Step 3. Mark the decisions.<\/strong> Some steps need judgement. Swap each of those for a pink note. &quot;Is this urgent?&quot; is a decision. &quot;Copy the date&quot; is not.<\/p>\n<p><strong>Step 4. Add the people.<\/strong> Some steps need someone to say yes before something reaches another person. Put an orange note above each of those. Mark any step that no one checks as &quot;nobody&quot;.<\/p>\n<p><strong>Step 5. Score the pain.<\/strong> On each yellow note, write 1 to 3 for how much you dislike that step.<\/p>\n<p><strong>Step 6. Write the output and the done-signal.<\/strong> Use two green notes. One is the real thing produced. The other is how you know it is finished.<\/p>\n<p><strong>Step 7. Add the never-arrives check.<\/strong> Ask: what if the trigger never comes? Write what should happen on a final note.<\/p>\n<p><strong>What success looks like.<\/strong> Someone else can read your notes from left to right. They can do the job without asking you a question.<\/p>\n<p><strong>If you get stuck, your process is probably too big.<\/strong> Cut it in half and map only the first half.<\/p>\n<ul>\n<li>&quot;Manage family admin&quot; is too big.<\/li>\n<li>&quot;Book my son's classes without clashes&quot; is the right size.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-05-s7\"><h2><span class=\"num\">05.7<\/span> Keep One To-Do List and One Inbox<\/h2><p><em>Full course segment.<\/em><\/p>\n<p>Two habits make every later automation simpler.<\/p>\n<p><strong>Habit one: keep one to-do list, pinned.<\/strong><\/p>\n<ul>\n<li>Annie once had two to-do lists. So she trusted neither.<\/li>\n<li>She moved the one unique item across and deleted the extra list.<\/li>\n<li>She pinned the master list as <code>_TO DO.md<\/code> at the top of her inbox.<\/li>\n<li>The underscore keeps the list at the top of the folder.<\/li>\n<li>The underscore also tells her filing job to leave the list alone.<\/li>\n<li>This rule is written in two places: the job's code and the job's written rules. So both agree.<\/li>\n<\/ul>\n<p><strong>Habit two: keep the inbox as the only holding area.<\/strong><\/p>\n<ul>\n<li>Annie's filing job once moved notes into an in-between folder called <code>_processed<\/code>. It did not move them into their real homes.<\/li>\n<li>The folder looked like finished work, so nobody opened it.<\/li>\n<li>The notes sat there for weeks.<\/li>\n<li>Her rule since then: a note is either filed into its real home, or it stays in the inbox with a visible reason.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-05-s8\"><h2><span class=\"num\">05.8<\/span> Ten Questions to Answer Before You Build<\/h2><p>Answer these questions for process one. Annie asks these questions before she builds anything. Each one comes from something she learned while building.<\/p>\n<ol>\n<li>Which steps need judgement, and which only move information from one place to another?<\/li>\n<li>When it goes wrong today, who notices, and how fast?<\/li>\n<li>What information in this process must never leave your own accounts? Check your Data Map.<\/li>\n<li>If it worked perfectly, what would you do with the time back?<\/li>\n<li>Is this a task you dislike, that happens often, and where a mistake is cheap? Those are the best first projects.<\/li>\n<li>Have you tried to automate it before? What happened?<\/li>\n<li>Does anything in this process go to another person, such as a teacher, a helper or a family member? Who says yes before it does?<\/li>\n<li>What does a mistake cost: a redo, an apology, or real harm?<\/li>\n<li>Which apps or accounts would it need to read, and whose name is each one in?<\/li>\n<li>What would make you trust it enough to stop checking it by hand?<\/li>\n<\/ol>\n<p><strong>Your answer to question 10 is your definition of done.<\/strong> On day one, Annie wrote her measure of success: mental load removed, multiplied by trust. Some jobs run, but you still check them by hand. Those jobs have not removed the load.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-05-s9\"><h2><span class=\"num\">05.9<\/span> Lessons From Real Mistakes<\/h2><p>Each line below is one lesson from a real mistake in Annie's own system. The full story behind each one is on the FAQ tab, the last tab at the top of the page.<\/p>\n<ul>\n<li>Check the real trigger before you build. Judge an automation by whether it removes a chore.<\/li>\n<li>A note is not a task. Put tasks where tasks get done.<\/li>\n<li>A process is ready to hand over when each step is written down and each step prevents a mistake you have already seen.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-05-s10\"><h2><span class=\"num\">05.10<\/span> Exercise: A Partner Reads Your Map<\/h2><p><em>Full course. Short course students do this at home with a friend or family member.<\/em><\/p>\n<ol>\n<li>Choose the smaller of your two processes.<\/li>\n<li>Read your sticky notes aloud to a partner, from left to right. Do not add anything.<\/li>\n<li>Your partner writes down every question they would need to ask you.<\/li>\n<li>Each question is a missing note. Add them.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"full-05-s11\"><h2><span class=\"num\">05.11<\/span> Worksheet: Process Card<\/h2><p>Fill in one card per process.<\/p>\n<ol>\n<li>Copy the card into a note called <code>Process Map — &lt;name&gt;<\/code> in your vault's <code>AI System<\/code> folder.<\/li>\n<li>Paste in a photo of your sticky notes.<\/li>\n<\/ol>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Part<\/th>\n<th>Process one<\/th>\n<th>Process two<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Name<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Trigger (what actually arrives)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Steps (one action each), with pain 1 to 3<\/td>\n<td>1. 2. 3. 4. 5. 6.<\/td>\n<td>1. 2. 3. 4. 5. 6.<\/td>\n<\/tr>\n<tr>\n<td>Decisions (judgement needed)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Who checks it (&quot;nobody&quot; if no one)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>If &quot;nobody&quot;: who will check it from now on?<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Who says yes before anything reaches another person<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Apps and accounts it reads<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Output (the real thing produced)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Done-signal<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Never-arrives check<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Data Map tier of the information involved<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My definition of done (what would make me trust it enough to stop checking it by hand)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>How many to-do lists do I keep today?<\/strong> ____ <strong>Which one becomes the pinned list?<\/strong> ____________<\/p>\n<\/section>", "count": 11, "sess": [2]}, {"id": "full-06", "label": "06", "title": "Module 06: Introduce Yourself to the Machine", "minutes": 45, "read": 10, "toc": [["full-06-s1", "06.1", "What You Will Leave With"], ["full-06-s2", "06.2", "What You Need to Prepare"], ["full-06-s3", "06.3", "Why the Machine Needs to Know You"], ["full-06-s4", "06.4", "Let the AI Interview You"], ["full-06-s5", "06.5", "Your Success Sentence, and What You Will Give Up"], ["full-06-s6", "06.6", "Your Strengths, Written Down"], ["full-06-s7", "06.7", "Write Your USER.md"], ["full-06-s8", "06.8", "The Stranger Test"], ["full-06-s9", "06.9", "Lessons From Real Mistakes"], ["full-06-s10", "06.10", "Worksheet"]], "body": "<section class=\"card\" id=\"full-06-s1\"><h2><span class=\"num\">06.1<\/span> What You Will Leave With<\/h2><p><strong>Your USER.md.<\/strong> This is a short file that tells every AI tool in your system who you are. It covers:<\/p>\n<ul>\n<li>your work<\/li>\n<li>your people<\/li>\n<li>your week<\/li>\n<li>how you want to be spoken to<\/li>\n<li>what &quot;helped&quot; means to you<\/li>\n<li>your hard rules<\/li>\n<\/ul>\n<p>In the build, it goes into your AI assistant's instructions. In the Full course, it is also loaded into your bot.<\/p>\n<p><strong>Your table of who must never see what.<\/strong> This says what information must never reach whom. It stays in your vault, beside your Data Map. In the next module, it becomes rules.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-06-s2\"><h2><span class=\"num\">06.2<\/span> What You Need to Prepare<\/h2><ul>\n<li><strong>Your Data Map from Module 02.<\/strong> It decides what may go into this file.<\/li>\n<li><strong>Gemini, open on your phone or laptop.<\/strong> It works in Hong Kong without a VPN, so it is the default for this exercise. Any AI assistant you can reach works.<\/li>\n<li><strong>The interview prompt,<\/strong> copied from the course notes.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-06-s3\"><h2><span class=\"num\">06.3<\/span> Why the Machine Needs to Know You<\/h2><p><strong>An AI model starts every conversation knowing nothing about you.<\/strong> It talks to everyone the same way. So its advice suits an average person, not you.<\/p>\n<p><strong>The difference between &quot;a Claude&quot; and &quot;my Claude&quot; is a set of files.<\/strong> Annie found this out herself.<\/p>\n<ul>\n<li>She moved her builder onto her server.<\/li>\n<li>The same Claude Code that knew her on the laptop was a stranger on the server.<\/li>\n<li>Then three things were copied across: its instruction file, its memory files and its continuity note.<\/li>\n<li>A test from the server, with no history, then answered four questions that only those files could answer:\n<ul>\n<li>who she is<\/li>\n<li>two of her communication rules<\/li>\n<li>one thing never to reveal<\/li>\n<li>which machine it was on<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>There is no setup that suits everybody.<\/strong> A developer she worked with said this. Setting up an AI is very personal.<\/p>\n<p><strong>This file is about you. The next module is about the AI assistant.<\/strong> Keep the two apart.<\/p>\n<ul>\n<li>Facts about you and your people go in USER.md.<\/li>\n<li>The AI assistant's own personality and rules go in separate files, in the next module.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-06-s4\"><h2><span class=\"num\">06.4<\/span> Let the AI Interview You<\/h2><p>You will not write this file from a blank page. An AI will interview you, one question at a time. Then you turn your answers into the file. It takes about 15 minutes.<\/p>\n<p><strong>Step 1. Check your Data Map before you type anything.<\/strong> Your answers go to the AI company that runs the AI assistant.<\/p>\n<ul>\n<li>Look at your Tier 3 list: passwords, ID numbers, bank details, and the health details you listed.<\/li>\n<li>None of it goes into the interview.<\/li>\n<li>Name people by role or first name only.<\/li>\n<li>Give no phone numbers or emails.<\/li>\n<\/ul>\n<p><strong>Step 2. Open Gemini<\/strong> at gemini.google.com, or another AI assistant you can use.<\/p>\n<p><strong>Step 3. Paste this prompt as your first message.<\/strong><\/p>\n<pre><code class=\"language-text\">Help me write a short profile of myself that my personal AI assistant will read before every conversation.\n\nInterview me first. Ask ONE question at a time, then wait for my answer. Never give me a list of questions. Keep it warm and plain. I am smart but not technical.\n\nAsk about 8 to 10 questions, covering:\n1. Who I am: my work, my role, and the big things on my plate.\n2. My people: who they are by role, and what I would want an AI assistant to do for or with each.\n3. My week: fixed commitments, my best focus time, and times I must not be interrupted.\n4. How I like to be spoken to: long or short, gentle or blunt, reasons or just answers, and what annoys me.\n5. How my attention works on a busy day.\n6. The three things I most wish I could stop carrying in my head, and the honest reason I want them gone.\n7. What I do well, so my AI assistant protects it rather than taking it over.\n8. Two or three rules my AI assistant must always follow. Suggest these: never guess, say when you do not know, and tell me when I am wrong.\n\nFor every rule I give you, ask me why, and write the reason next to the rule.\n\nWhen we finish, write the profile in the first person, under clear headings, in short sentences, in under 1,300 characters. Do not include passwords, ID numbers, bank details or anyone's contact details.\n\nStart by introducing yourself in one line, then ask your first question.\n<\/code><\/pre>\n<p><strong>Step 4. Answer casually.<\/strong> Short answers are fine. If a question does not fit, say so and move on.<\/p>\n<p><strong>What success looks like.<\/strong> After 8 to 10 questions, the AI assistant writes a short profile. It is under headings, in the first person, with a reason beside each rule.<\/p>\n<p><strong>If it fails:<\/strong><\/p>\n<ul>\n<li><strong>The AI assistant asks all its questions at once.<\/strong> Reply &quot;one question at a time, please&quot;.<\/li>\n<li><strong>You cannot reach any AI assistant.<\/strong> Pair with a partner. Your partner reads the eight topics to you as questions and writes down your answers.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-06-s5\"><h2><span class=\"num\">06.5<\/span> Your Success Sentence, and What You Will Give Up<\/h2><p><em>Full course segment. Short course students take this from the interview question about the three things they most wish they could stop carrying.<\/em><\/p>\n<p><strong>Write one sentence that says what &quot;working&quot; will look like for you in a month.<\/strong><\/p>\n<p><strong>Annie's examples.<\/strong><\/p>\n<ul>\n<li><strong>For her whole system,<\/strong> written on day one: mental load removed, multiplied by trust.<\/li>\n<li><strong>For one feature, her daily learning card:<\/strong> &quot;future Annie needs to be able to school the current Annie.&quot;<\/li>\n<li>Her builder tested its own design against that sentence. It found three failures before anything was built.<\/li>\n<\/ul>\n<p><strong>Then answer two questions.<\/strong> They are short. They decide whether the system lasts.<\/p>\n<ul>\n<li><strong>What am I willing to give up for this?<\/strong> Time to set it up, a monthly cost, or some control over how things are done.<\/li>\n<li><strong>What will I do if it becomes another job to maintain?<\/strong> Every system needs upkeep. Decide now what &quot;too much&quot; looks like. Then you notice before you quietly stop using it.<\/li>\n<\/ul>\n<p><strong>Then write one pushback you would want.<\/strong> Annie wrote down one pushback she wanted. Sometimes she is about to send a slightly sharp email. Then the AI assistant should ask one question: is this the way she wants to speak to that person?<\/p>\n<\/section>\n<section class=\"card\" id=\"full-06-s6\"><h2><span class=\"num\">06.6<\/span> Your Strengths, Written Down<\/h2><p><em>Full course segment. Short course students take this from the interview question about what they do well.<\/em><\/p>\n<p><strong>Tell the machine what you do well.<\/strong> Then it supports those habits instead of quietly taking them over.<\/p>\n<p>Annie once asked for her working strengths to be written down, so her builder reads them. They include these:<\/p>\n<ul>\n<li>She catches warnings that were raised but never acted on.<\/li>\n<li>She corrects fast and decides fast, once.<\/li>\n<li>She writes down everything important.<\/li>\n<li>She asks how a thing works, not only for the result.<\/li>\n<li>She always needs one next action, because it keeps her focused.<\/li>\n<\/ul>\n<p><strong>What her builder does now.<\/strong><\/p>\n<ul>\n<li>It ends every answer with her next action.<\/li>\n<li>It names it out loud when one of her questions catches a problem.<\/li>\n<\/ul>\n<p><strong>List three of your own.<\/strong><\/p>\n<\/section>\n<section class=\"card\" id=\"full-06-s7\"><h2><span class=\"num\">06.7<\/span> Write Your USER.md<\/h2><ol>\n<li>Create a note called <code>USER<\/code> in your vault's <code>AI System<\/code> folder.<\/li>\n<li>Use the template below.<\/li>\n<li>Copy from your interview answers, then cut.<\/li>\n<\/ol>\n<h3>Every Rule Carries Its Reason<\/h3>\n<p><strong>A rule with its reason is followed better than a rule alone.<\/strong><\/p>\n<ul>\n<li>&quot;Keep messages short, because I read them on my phone between meetings&quot; works better than &quot;keep messages short&quot;.<\/li>\n<li>The reason also changes how the AI assistant follows the rule. Annie's own file shows this.<\/li>\n<\/ul>\n<p><strong>Two of Annie's lines, in her words:<\/strong><\/p>\n<ul>\n<li><strong>&quot;ADHD means how I say things decides whether they land.&quot;<\/strong> That one line changes every answer the AI assistant gives: short, one topic at a time, never a wall of text.<\/li>\n<li><strong>&quot;I want more time with my family instead of endless admin and mental load.&quot;<\/strong> This tells the AI assistant when to take work off her (admin). It also tells it when to push back (anything that eats family time).<\/li>\n<\/ul>\n<p><strong>One rule, two reasons.<\/strong> Annie asked her AI assistant to praise her. Here are two ways she could have written it.<\/p>\n<ul>\n<li><strong>Version one: &quot;Praise me, because I didn't get it growing up.&quot;<\/strong>\n<ul>\n<li>The AI assistant treats it as comfort.<\/li>\n<li>It says kind things.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Version two: &quot;Give me specific praise when I do something well, and name exactly what I did. In my parents' generation, in Chinese culture, children were not raised with praise, so I never learned what it looks like. I am learning it from you so I can use it with my son.&quot;<\/strong>\n<ul>\n<li>The AI assistant treats it as teaching.<\/li>\n<li>It names exactly what she did and why it mattered.<\/li>\n<li>So she can see how it is done and do the same for her son.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>The rule is the same. The reason changed what the AI assistant does.<\/strong> Many students will recognise the second reason from their own upbringing. Write your reasons as honestly as Annie wrote this one.<\/p>\n<h3>Keep It Under 1,375 Characters<\/h3>\n<p><strong>The AI assistant reads this file with every message you send.<\/strong> So every line costs something every time.<\/p>\n<ul>\n<li>Annie's bot cuts this file off at 1,375 characters (bot settings, checked 9 Oct 2026).<\/li>\n<li>Annie's own file is 1,167 characters.<\/li>\n<li>Obsidian shows the character count in the bottom bar when the word count is switched on.<\/li>\n<li>The empty template below is about 780 characters. So keep each line short.<\/li>\n<\/ul>\n<pre><code class=\"language-markdown\"># About Me\n\n## Who I Am\n- [Role]. I am responsible for [two things]. On my plate now: [one line].\n\n## My People\n- [Role or first name]: [what you may help with].\n- [Role or first name]: [same].\n\n## My Week\n- Focus time: [time]. Do not interrupt it, because [reason].\n- Messages are welcome at [times].\n\n## How to Talk to Me\n- [Length and tone], because [reason].\n- Give me one next action, or up to three options with your default.\n\n## What Helped Means\n- This is working in a month if: [success sentence].\n- Help me stop carrying: [1], [2], [3].\n- Push back when: [my chosen pushback].\n\n## Protect These\n- [Strength 1]. [Strength 2]. [Strength 3].\n\n## Hard Rules\n- Never guess. Say when you do not know.\n- Tell me when I am wrong.\n- Nothing goes to another person without my yes.\n<\/code><\/pre>\n<p><strong>What success looks like.<\/strong><\/p>\n<ul>\n<li>The file is under 1,375 characters.<\/li>\n<li>It uses these headings.<\/li>\n<li>Each rule has a reason beside it.<\/li>\n<li>It holds no Tier 3 data.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-06-s8\"><h2><span class=\"num\">06.8<\/span> The Stranger Test<\/h2><p><em>Full course segment. Short course students do this at home with a friend or family member.<\/em><\/p>\n<p>Give your USER.md to a partner who does not know you well. They answer three questions from it:<\/p>\n<ol>\n<li>What would this person want automated first?<\/li>\n<li>What would this person hate about how an AI assistant talks to them?<\/li>\n<li>What should this AI assistant refuse to do?<\/li>\n<\/ol>\n<p><strong>If your partner can answer all three,<\/strong> the file is clear enough for a machine. <strong>If not,<\/strong> the machine will guess too. Fix the gaps.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-06-s9\"><h2><span class=\"num\">06.9<\/span> Lessons From Real Mistakes<\/h2><p>Each line below is one lesson from a real mistake in Annie's own system. The full story behind each one is on the FAQ tab, the last tab at the top of the page.<\/p>\n<ul>\n<li>An AI only knows the parts of you that are written in the files it reads.<\/li>\n<li>Write the success sentence before you judge any design.<\/li>\n<li>A working relationship with an AI survives a change of model only if it is written down.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-06-s10\"><h2><span class=\"num\">06.10<\/span> Worksheet<\/h2><h3>Checklist for Your USER.md<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Under 1,375 characters<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Every rule has its reason<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>People are named by role or first name only<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>No passwords, ID numbers, bank details or contact details<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My success sentence is in it<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My three strengths are in it<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My one chosen pushback is in it<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Saved as <code>USER<\/code> in my vault's <code>AI System<\/code> folder<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Your Table of Who Must Never See What<\/h3>\n<p>Save this in your vault beside your Data Map, not in USER.md. The next module turns each row into a rule.<\/p>\n<div class=\"tablewrap\"><ta
