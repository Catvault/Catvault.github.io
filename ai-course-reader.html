d=\"short-04-s9\"><h2><span class=\"num\">04.9<\/span> How to Close the Module<\/h2><p>Close with this line:<\/p>\n<p><em>&quot;Everything you just saw started as the same sheet of paper you are about to fill in. Nothing here was built in one go, and most of it was built after something broke.&quot;<\/em><\/p>\n<p>Then hand out the sticky notes for the next module.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-04-s10\"><h2><span class=\"num\">04.10<\/span> What Not to Do<\/h2><div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Do not<\/th>\n<th>Why<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Show a capability you would have to explain for five minutes<\/td>\n<td>If it needs a long introduction, it is not ready to show<\/td>\n<\/tr>\n<tr>\n<td>Show anything built in the last week<\/td>\n<td>New work has not met real use yet, and it may change before class<\/td>\n<\/tr>\n<tr>\n<td>Skip the failures<\/td>\n<td>The failure stories are what make the room trust the rest<\/td>\n<\/tr>\n<tr>\n<td>Show a student's real data on screen<\/td>\n<td>Module 02 applies to the demo too<\/td>\n<\/tr>\n<tr>\n<td>Let a segment run long<\/td>\n<td>Each segment has a hard stop. A long demo loses the room<\/td>\n<\/tr>\n<tr>\n<td>Take questions during a demo<\/td>\n<td>Write them on a visible list and answer at the end<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>", "count": 10, "sess": [2]}, {"id": "short-05", "label": "05", "title": "Module 05: Your Processes on Paper", "minutes": 35, "read": 8, "toc": [["short-05-s1", "05.1", "What You Will Leave With"], ["short-05-s2", "05.2", "What You Need to Prepare"], ["short-05-s3", "05.3", "Why Paper Comes First"], ["short-05-s4", "05.4", "The Six Parts of Every Process"], ["short-05-s5", "05.5", "Who Checks This?"], ["short-05-s6", "05.6", "Map Process One"], ["short-05-s7", "05.7", "Ten Questions to Answer Before You Build"], ["short-05-s8", "05.8", "Lessons From Real Mistakes"], ["short-05-s9", "05.9", "Exercise: A Partner Reads Your Map"], ["short-05-s10", "05.10", "Worksheet: Process Card"]], "body": "<section class=\"card\" id=\"short-05-s1\"><h2><span class=\"num\">05.1<\/span> What You Will Leave With<\/h2><p><strong>Two Process Cards.<\/strong> You make one for each of the top two jobs on your Wish List. Each card shows:<\/p>\n<ul>\n<li>what starts the process<\/li>\n<li>every step<\/li>\n<li>who checks it<\/li>\n<li>what it produces<\/li>\n<li>how you know it is finished<\/li>\n<\/ul>\n<p><strong>What happens to the cards later.<\/strong><\/p>\n<ul>\n<li>The script-or-AI module (Module 09) marks each step as a job for code, for an AI model, or for you.<\/li>\n<li>Your best candidate becomes your first automation in the skills and schedules module (Module 11).<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-05-s2\"><h2><span class=\"num\">05.2<\/span> What You Need to Prepare<\/h2><ul>\n<li><strong>Your Wish List from Module 04,<\/strong> with your top two jobs circled.<\/li>\n<li><strong>Your Data Map from Module 02.<\/strong><\/li>\n<li><strong>Sticky notes in five colours, and a marker.<\/strong> The facilitator supplies these. At home, any five colours work.<\/li>\n<li><strong>A real example.<\/strong> Your process may start with an email or a form. If so, have a recent one open on your phone.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-05-s3\"><h2><span class=\"num\">05.3<\/span> Why Paper Comes First<\/h2><p><strong>An unmapped process keeps its mistakes.<\/strong> If you automate it, the mistakes happen faster.<\/p>\n<p><strong>Annie's example.<\/strong> Annie once drew a map of her whole system before she added anything new. The map showed that her real problems were not missing features. They were problems like these:<\/p>\n<ul>\n<li>&quot;when I move a folder, three things silently break&quot;<\/li>\n<li>&quot;nobody is checking whether last night's job actually ran&quot;<\/li>\n<\/ul>\n<p><strong>Paper keeps the AI out of the room for now.<\/strong> You are not asking anything to be built. You are writing down what really happens. Later, the builder works from facts instead of guesses.<\/p>\n<p><strong>Aim for clarity, not tidiness.<\/strong> A messy sheet that shows a missing step is worth more than a neat sheet that hides it. For any process, you should know four things:<\/p>\n<ul>\n<li>what starts it<\/li>\n<li>what ends it<\/li>\n<li>who checks it<\/li>\n<li>where it waits<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-05-s4\"><h2><span class=\"num\">05.4<\/span> The Six Parts of Every Process<\/h2><p>Every process has six parts. Use the colours below. Output and done-signal are both green, because both sit at the end of the line.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Part<\/th>\n<th>Sticky note colour<\/th>\n<th>The question it answers<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Trigger<\/strong><\/td>\n<td>Blue<\/td>\n<td>What actually arrives that starts this?<\/td>\n<\/tr>\n<tr>\n<td><strong>Steps<\/strong><\/td>\n<td>Yellow<\/td>\n<td>What happens, one action per note?<\/td>\n<\/tr>\n<tr>\n<td><strong>Decisions<\/strong><\/td>\n<td>Pink<\/td>\n<td>Where does someone have to judge something?<\/td>\n<\/tr>\n<tr>\n<td><strong>Owner and approver<\/strong><\/td>\n<td>Orange<\/td>\n<td>Who checks it, and who must say yes before anything reaches another person?<\/td>\n<\/tr>\n<tr>\n<td><strong>Output<\/strong><\/td>\n<td>Green<\/td>\n<td>What real thing exists at the end: a file, a reply, a payment, a calendar entry?<\/td>\n<\/tr>\n<tr>\n<td><strong>Done-signal<\/strong><\/td>\n<td>Green<\/td>\n<td>How do you know it is finished, without checking by hand?<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Start from the thing that actually arrives.<\/strong> This is Annie's own design rule. It shaped one of her most useful automations.<\/p>\n<ul>\n<li>A medical receipt that needs an insurance claim arrives by email.<\/li>\n<li>Sometimes it arrives the day after the appointment.<\/li>\n<li>An automation that started from the appointment would look too early and miss receipts.<\/li>\n<li>So the email is the trigger.<\/li>\n<li>The calendar has one smaller job. If an expected receipt has not arrived after 4 days, the system says so once.<\/li>\n<\/ul>\n<p><strong>Write every small step.<\/strong> &quot;Do the claim&quot; is not a step. Written out, Annie's receipt chore has six steps:<\/p>\n<ol>\n<li>Check email.<\/li>\n<li>Find the file.<\/li>\n<li>Download it.<\/li>\n<li>Rename it to fit the claim app's 15-character limit.<\/li>\n<li>Upload it.<\/li>\n<li>Remember to do all of this on the right day.<\/li>\n<\/ol>\n<p>Small steps show you which steps a script could do from start to finish.<\/p>\n<h3>A Worked Example: Receipts That Need a Claim<\/h3>\n<p>This is the card Annie wrote for her receipt chore.<\/p>\n<ul>\n<li><strong>Trigger:<\/strong> an email with a receipt attached arrives from a known clinic.<\/li>\n<li><strong>Steps:<\/strong>\n<ol>\n<li>Find the email.<\/li>\n<li>Download the file.<\/li>\n<li>Rename it to 15 characters or fewer.<\/li>\n<li>Send it to my phone at a time I can act.<\/li>\n<li>Upload it to the claim app.<\/li>\n<li>Log that it is done.<\/li>\n<\/ol>\n<\/li>\n<li><strong>Decisions:<\/strong> Is this a receipt I can claim? Whose claim is it?<\/li>\n<li><strong>Owner and approver:<\/strong> Me. The insurer requires me to submit the claim myself.<\/li>\n<li><strong>Output:<\/strong> a claim submitted, with the file named correctly.<\/li>\n<li><strong>Done-signal:<\/strong> I reply &quot;done&quot; and the system logs it.<\/li>\n<li><strong>Never-arrives check:<\/strong> an appointment happened but no receipt came within 4 days. The system sends one message, once.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-05-s5\"><h2><span class=\"num\">05.5<\/span> Who Checks This?<\/h2><p><em>Full course segment. In the Short course, give the one-sentence version when students add the people to their map.<\/em><\/p>\n<p><strong>Ask this about every process: who checks the result?<\/strong> Then ask how quickly they would notice if it were wrong. This is not about who does the work. It is about who would see the mistake.<\/p>\n<p><strong>Mark a step &quot;nobody&quot; when no one checks it.<\/strong> This is often the most honest note on the sheet. Some &quot;nobody&quot; steps still get done. Usually you are doing them, in the margins, and no one notices.<\/p>\n<p><strong>A &quot;nobody&quot; step can be automated only after you name someone to check its results.<\/strong> An automation on an unchecked step makes it worse. It produces wrong results faster and with more confidence.<\/p>\n<p><strong>Annie's example.<\/strong> Her nightly filing job reported success every night for weeks. All that time, it was filing notes into the wrong folder. Nothing checked where the notes ended up.<\/p>\n<p><strong>So write a name next to every &quot;nobody&quot;.<\/strong> The name can be yours.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-05-s6\"><h2><span class=\"num\">05.6<\/span> Map Process One<\/h2><p><strong>Step 1. Write the trigger.<\/strong> Put one blue note at the left. Write what arrives, in plain words. If no thing arrives, write the time instead, such as &quot;every Sunday at 6 pm&quot;.<\/p>\n<p><strong>Step 2. Lay out the steps.<\/strong> Use one yellow note per action, from left to right. Use verbs: check, find, copy, rename, send, remember.<\/p>\n<p><strong>Step 3. Mark the decisions.<\/strong> Some steps need judgement. Swap each of those for a pink note. &quot;Is this urgent?&quot; is a decision. &quot;Copy the date&quot; is not.<\/p>\n<p><strong>Step 4. Add the people.<\/strong> Some steps need someone to say yes before something reaches another person. Put an orange note above each of those. Mark any step that no one checks as &quot;nobody&quot;.<\/p>\n<p><strong>Step 5. Score the pain.<\/strong> On each yellow note, write 1 to 3 for how much you dislike that step.<\/p>\n<p><strong>Step 6. Write the output and the done-signal.<\/strong> Use two green notes. One is the real thing produced. The other is how you know it is finished.<\/p>\n<p><strong>Step 7. Add the never-arrives check.<\/strong> Ask: what if the trigger never comes? Write what should happen on a final note.<\/p>\n<p><strong>What success looks like.<\/strong> Someone else can read your notes from left to right. They can do the job without asking you a question.<\/p>\n<p><strong>If you get stuck, your process is probably too big.<\/strong> Cut it in half and map only the first half.<\/p>\n<ul>\n<li>&quot;Manage family admin&quot; is too big.<\/li>\n<li>&quot;Book my son's classes without clashes&quot; is the right size.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-05-s7\"><h2><span class=\"num\">05.7<\/span> Ten Questions to Answer Before You Build<\/h2><p>Answer these questions for process one. Annie asks these questions before she builds anything. Each one comes from something she learned while building.<\/p>\n<ol>\n<li>Which steps need judgement, and which only move information from one place to another?<\/li>\n<li>When it goes wrong today, who notices, and how fast?<\/li>\n<li>What information in this process must never leave your own accounts? Check your Data Map.<\/li>\n<li>If it worked perfectly, what would you do with the time back?<\/li>\n<li>Is this a task you dislike, that happens often, and where a mistake is cheap? Those are the best first projects.<\/li>\n<li>Have you tried to automate it before? What happened?<\/li>\n<li>Does anything in this process go to another person, such as a teacher, a helper or a family member? Who says yes before it does?<\/li>\n<li>What does a mistake cost: a redo, an apology, or real harm?<\/li>\n<li>Which apps or accounts would it need to read, and whose name is each one in?<\/li>\n<li>What would make you trust it enough to stop checking it by hand?<\/li>\n<\/ol>\n<p><strong>Your answer to question 10 is your definition of done.<\/strong> On day one, Annie wrote her measure of success: mental load removed, multiplied by trust. Some jobs run, but you still check them by hand. Those jobs have not removed the load.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-05-s8\"><h2><span class=\"num\">05.8<\/span> Lessons From Real Mistakes<\/h2><p>Each line below is one lesson from a real mistake in Annie's own system. The full story behind each one is on the FAQ tab, the last tab at the top of the page.<\/p>\n<ul>\n<li>Check the real trigger before you build. Judge an automation by whether it removes a chore.<\/li>\n<li>A note is not a task. Put tasks where tasks get done.<\/li>\n<li>A process is ready to hand over when each step is written down and each step prevents a mistake you have already seen.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-05-s9\"><h2><span class=\"num\">05.9<\/span> Exercise: A Partner Reads Your Map<\/h2><p><em>Full course. Short course students do this at home with a friend or family member.<\/em><\/p>\n<ol>\n<li>Choose the smaller of your two processes.<\/li>\n<li>Read your sticky notes aloud to a partner, from left to right. Do not add anything.<\/li>\n<li>Your partner writes down every question they would need to ask you.<\/li>\n<li>Each question is a missing note. Add them.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"short-05-s10\"><h2><span class=\"num\">05.10<\/span> Worksheet: Process Card<\/h2><p>Fill in one card per process.<\/p>\n<ol>\n<li>Copy the card into a note called <code>Process Map — &lt;name&gt;<\/code> in your vault's <code>AI System<\/code> folder.<\/li>\n<li>Paste in a photo of your sticky notes.<\/li>\n<\/ol>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Part<\/th>\n<th>Process one<\/th>\n<th>Process two<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Name<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Trigger (what actually arrives)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Steps (one action each), with pain 1 to 3<\/td>\n<td>1. 2. 3. 4. 5. 6.<\/td>\n<td>1. 2. 3. 4. 5. 6.<\/td>\n<\/tr>\n<tr>\n<td>Decisions (judgement needed)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Who checks it (&quot;nobody&quot; if no one)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>If &quot;nobody&quot;: who will check it from now on?<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Who says yes before anything reaches another person<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Apps and accounts it reads<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Output (the real thing produced)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Done-signal<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Never-arrives check<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Data Map tier of the information involved<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My definition of done (what would make me trust it enough to stop checking it by hand)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>How many to-do lists do I keep today?<\/strong> ____ <strong>Which one becomes the pinned list?<\/strong> ____________<\/p>\n<\/section>", "count": 10, "sess": [2]}, {"id": "short-06", "label": "06", "title": "Module 06: Introduce Yourself to the Machine", "minutes": 30, "read": 10, "toc": [["short-06-s1", "06.1", "What You Will Leave With"], ["short-06-s2", "06.2", "What You Need to Prepare"], ["short-06-s3", "06.3", "Why the Machine Needs to Know You"], ["short-06-s4", "06.4", "Let the AI Interview You"], ["short-06-s5", "06.5", "Your Success Sentence, and What You Will Give Up"], ["short-06-s6", "06.6", "Your Strengths, Written Down"], ["short-06-s7", "06.7", "Write Your USER.md"], ["short-06-s8", "06.8", "The Stranger Test"], ["short-06-s9", "06.9", "Lessons From Real Mistakes"], ["short-06-s10", "06.10", "Worksheet"]], "body": "<section class=\"card\" id=\"short-06-s1\"><h2><span class=\"num\">06.1<\/span> What You Will Leave With<\/h2><p><strong>Your USER.md.<\/strong> This is a short file that tells every AI tool in your system who you are. It covers:<\/p>\n<ul>\n<li>your work<\/li>\n<li>your people<\/li>\n<li>your week<\/li>\n<li>how you want to be spoken to<\/li>\n<li>what &quot;helped&quot; means to you<\/li>\n<li>your hard rules<\/li>\n<\/ul>\n<p>In the build, it goes into your AI assistant's instructions. In the Full course, it is also loaded into your bot.<\/p>\n<p><strong>Your table of who must never see what.<\/strong> This says what information must never reach whom. It stays in your vault, beside your Data Map. In the next module, it becomes rules.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-06-s2\"><h2><span class=\"num\">06.2<\/span> What You Need to Prepare<\/h2><ul>\n<li><strong>Your Data Map from Module 02.<\/strong> It decides what may go into this file.<\/li>\n<li><strong>Gemini, open on your phone or laptop.<\/strong> It works in Hong Kong without a VPN, so it is the default for this exercise. Any AI assistant you can reach works.<\/li>\n<li><strong>The interview prompt,<\/strong> copied from the course notes.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-06-s3\"><h2><span class=\"num\">06.3<\/span> Why the Machine Needs to Know You<\/h2><p><strong>An AI model starts every conversation knowing nothing about you.<\/strong> It talks to everyone the same way. So its advice suits an average person, not you.<\/p>\n<p><strong>The difference between &quot;a Claude&quot; and &quot;my Claude&quot; is a set of files.<\/strong> Annie found this out herself.<\/p>\n<ul>\n<li>She moved her builder onto her server.<\/li>\n<li>The same Claude Code that knew her on the laptop was a stranger on the server.<\/li>\n<li>Then three things were copied across: its instruction file, its memory files and its continuity note.<\/li>\n<li>A test from the server, with no history, then answered four questions that only those files could answer:\n<ul>\n<li>who she is<\/li>\n<li>two of her communication rules<\/li>\n<li>one thing never to reveal<\/li>\n<li>which machine it was on<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>There is no setup that suits everybody.<\/strong> A developer she worked with said this. Setting up an AI is very personal.<\/p>\n<p><strong>This file is about you. The next module is about the AI assistant.<\/strong> Keep the two apart.<\/p>\n<ul>\n<li>Facts about you and your people go in USER.md.<\/li>\n<li>The AI assistant's own personality and rules go in separate files, in the next module.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-06-s4\"><h2><span class=\"num\">06.4<\/span> Let the AI Interview You<\/h2><p>You will not write this file from a blank page. An AI will interview you, one question at a time. Then you turn your answers into the file. It takes about 15 minutes.<\/p>\n<p><strong>Step 1. Check your Data Map before you type anything.<\/strong> Your answers go to the AI company that runs the AI assistant.<\/p>\n<ul>\n<li>Look at your Tier 3 list: passwords, ID numbers, bank details, and the health details you listed.<\/li>\n<li>None of it goes into the interview.<\/li>\n<li>Name people by role or first name only.<\/li>\n<li>Give no phone numbers or emails.<\/li>\n<\/ul>\n<p><strong>Step 2. Open Gemini<\/strong> at gemini.google.com, or another AI assistant you can use.<\/p>\n<p><strong>Step 3. Paste this prompt as your first message.<\/strong><\/p>\n<pre><code class=\"language-text\">Help me write a short profile of myself that my personal AI assistant will read before every conversation.\n\nInterview me first. Ask ONE question at a time, then wait for my answer. Never give me a list of questions. Keep it warm and plain. I am smart but not technical.\n\nAsk about 8 to 10 questions, covering:\n1. Who I am: my work, my role, and the big things on my plate.\n2. My people: who they are by role, and what I would want an AI assistant to do for or with each.\n3. My week: fixed commitments, my best focus time, and times I must not be interrupted.\n4. How I like to be spoken to: long or short, gentle or blunt, reasons or just answers, and what annoys me.\n5. How my attention works on a busy day.\n6. The three things I most wish I could stop carrying in my head, and the honest reason I want them gone.\n7. What I do well, so my AI assistant protects it rather than taking it over.\n8. Two or three rules my AI assistant must always follow. Suggest these: never guess, say when you do not know, and tell me when I am wrong.\n\nFor every rule I give you, ask me why, and write the reason next to the rule.\n\nWhen we finish, write the profile in the first person, under clear headings, in short sentences, in under 1,300 characters. Do not include passwords, ID numbers, bank details or anyone's contact details.\n\nStart by introducing yourself in one line, then ask your first question.\n<\/code><\/pre>\n<p><strong>Step 4. Answer casually.<\/strong> Short answers are fine. If a question does not fit, say so and move on.<\/p>\n<p><strong>What success looks like.<\/strong> After 8 to 10 questions, the AI assistant writes a short profile. It is under headings, in the first person, with a reason beside each rule.<\/p>\n<p><strong>If it fails:<\/strong><\/p>\n<ul>\n<li><strong>The AI assistant asks all its questions at once.<\/strong> Reply &quot;one question at a time, please&quot;.<\/li>\n<li><strong>You cannot reach any AI assistant.<\/strong> Pair with a partner. Your partner reads the eight topics to you as questions and writes down your answers.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-06-s5\"><h2><span class=\"num\">06.5<\/span> Your Success Sentence, and What You Will Give Up<\/h2><p><em>Full course segment. Short course students take this from the interview question about the three things they most wish they could stop carrying.<\/em><\/p>\n<p><strong>Write one sentence that says what &quot;working&quot; will look like for you in a month.<\/strong><\/p>\n<p><strong>Annie's examples.<\/strong><\/p>\n<ul>\n<li><strong>For her whole system,<\/strong> written on day one: mental load removed, multiplied by trust.<\/li>\n<li><strong>For one feature, her daily learning card:<\/strong> &quot;future Annie needs to be able to school the current Annie.&quot;<\/li>\n<li>Her builder tested its own design against that sentence. It found three failures before anything was built.<\/li>\n<\/ul>\n<p><strong>Then answer two questions.<\/strong> They are short. They decide whether the system lasts.<\/p>\n<ul>\n<li><strong>What am I willing to give up for this?<\/strong> Time to set it up, a monthly cost, or some control over how things are done.<\/li>\n<li><strong>What will I do if it becomes another job to maintain?<\/strong> Every system needs upkeep. Decide now what &quot;too much&quot; looks like. Then you notice before you quietly stop using it.<\/li>\n<\/ul>\n<p><strong>Then write one pushback you would want.<\/strong> Annie wrote down one pushback she wanted. Sometimes she is about to send a slightly sharp email. Then the AI assistant should ask one question: is this the way she wants to speak to that person?<\/p>\n<\/section>\n<section class=\"card\" id=\"short-06-s6\"><h2><span class=\"num\">06.6<\/span> Your Strengths, Written Down<\/h2><p><em>Full course segment. Short course students take this from the interview question about what they do well.<\/em><\/p>\n<p><strong>Tell the machine what you do well.<\/strong> Then it supports those habits instead of quietly taking them over.<\/p>\n<p>Annie once asked for her working strengths to be written down, so her builder reads them. They include these:<\/p>\n<ul>\n<li>She catches warnings that were raised but never acted on.<\/li>\n<li>She corrects fast and decides fast, once.<\/li>\n<li>She writes down everything important.<\/li>\n<li>She asks how a thing works, not only for the result.<\/li>\n<li>She always needs one next action, because it keeps her focused.<\/li>\n<\/ul>\n<p><strong>What her builder does now.<\/strong><\/p>\n<ul>\n<li>It ends every answer with her next action.<\/li>\n<li>It names it out loud when one of her questions catches a problem.<\/li>\n<\/ul>\n<p><strong>List three of your own.<\/strong><\/p>\n<\/section>\n<section class=\"card\" id=\"short-06-s7\"><h2><span class=\"num\">06.7<\/span> Write Your USER.md<\/h2><ol>\n<li>Create a note called <code>USER<\/code> in your vault's <code>AI System<\/code> folder.<\/li>\n<li>Use the template below.<\/li>\n<li>Copy from your interview answers, then cut.<\/li>\n<\/ol>\n<h3>Every Rule Carries Its Reason<\/h3>\n<p><strong>A rule with its reason is followed better than a rule alone.<\/strong><\/p>\n<ul>\n<li>&quot;Keep messages short, because I read them on my phone between meetings&quot; works better than &quot;keep messages short&quot;.<\/li>\n<li>The reason also changes how the AI assistant follows the rule. Annie's own file shows this.<\/li>\n<\/ul>\n<p><strong>Two of Annie's lines, in her words:<\/strong><\/p>\n<ul>\n<li><strong>&quot;ADHD means how I say things decides whether they land.&quot;<\/strong> That one line changes every answer the AI assistant gives: short, one topic at a time, never a wall of text.<\/li>\n<li><strong>&quot;I want more time with my family instead of endless admin and mental load.&quot;<\/strong> This tells the AI assistant when to take work off her (admin). It also tells it when to push back (anything that eats family time).<\/li>\n<\/ul>\n<p><strong>One rule, two reasons.<\/strong> Annie asked her AI assistant to praise her. Here are two ways she could have written it.<\/p>\n<ul>\n<li><strong>Version one: &quot;Praise me, because I didn't get it growing up.&quot;<\/strong>\n<ul>\n<li>The AI assistant treats it as comfort.<\/li>\n<li>It says kind things.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Version two: &quot;Give me specific praise when I do something well, and name exactly what I did. In my parents' generation, in Chinese culture, children were not raised with praise, so I never learned what it looks like. I am learning it from you so I can use it with my son.&quot;<\/strong>\n<ul>\n<li>The AI assistant treats it as teaching.<\/li>\n<li>It names exactly what she did and why it mattered.<\/li>\n<li>So she can see how it is done and do the same for her son.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>The rule is the same. The reason changed what the AI assistant does.<\/strong> Many students will recognise the second reason from their own upbringing. Write your reasons as honestly as Annie wrote this one.<\/p>\n<h3>Keep It Under 1,375 Characters<\/h3>\n<p><strong>The AI assistant reads this file with every message you send.<\/strong> So every line costs something every time.<\/p>\n<ul>\n<li>Annie's bot cuts this file off at 1,375 characters (bot settings, checked 9 Oct 2026).<\/li>\n<li>Annie's own file is 1,167 characters.<\/li>\n<li>Obsidian shows the character count in the bottom bar when the word count is switched on.<\/li>\n<li>The empty template below is about 780 characters. So keep each line short.<\/li>\n<\/ul>\n<pre><code class=\"language-markdown\"># About Me\n\n## Who I Am\n- [Role]. I am responsible for [two things]. On my plate now: [one line].\n\n## My People\n- [Role or first name]: [what you may help with].\n- [Role or first name]: [same].\n\n## My Week\n- Focus time: [time]. Do not interrupt it, because [reason].\n- Messages are welcome at [times].\n\n## How to Talk to Me\n- [Length and tone], because [reason].\n- Give me one next action, or up to three options with your default.\n\n## What Helped Means\n- This is working in a month if: [success sentence].\n- Help me stop carrying: [1], [2], [3].\n- Push back when: [my chosen pushback].\n\n## Protect These\n- [Strength 1]. [Strength 2]. [Strength 3].\n\n## Hard Rules\n- Never guess. Say when you do not know.\n- Tell me when I am wrong.\n- Nothing goes to another person without my yes.\n<\/code><\/pre>\n<p><strong>What success looks like.<\/strong><\/p>\n<ul>\n<li>The file is under 1,375 characters.<\/li>\n<li>It uses these headings.<\/li>\n<li>Each rule has a reason beside it.<\/li>\n<li>It holds no Tier 3 data.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-06-s8\"><h2><span class=\"num\">06.8<\/span> The Stranger Test<\/h2><p><em>Full course segment. Short course students do this at home with a friend or family member.<\/em><\/p>\n<p>Give your USER.md to a partner who does not know you well. They answer three questions from it:<\/p>\n<ol>\n<li>What would this person want automated first?<\/li>\n<li>What would this person hate about how an AI assistant talks to them?<\/li>\n<li>What should this AI assistant refuse to do?<\/li>\n<\/ol>\n<p><strong>If your partner can answer all three,<\/strong> the file is clear enough for a machine. <strong>If not,<\/strong> the machine will guess too. Fix the gaps.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-06-s9\"><h2><span class=\"num\">06.9<\/span> Lessons From Real Mistakes<\/h2><p>Each line below is one lesson from a real mistake in Annie's own system. The full story behind each one is on the FAQ tab, the last tab at the top of the page.<\/p>\n<ul>\n<li>An AI only knows the parts of you that are written in the files it reads.<\/li>\n<li>Write the success sentence before you judge any design.<\/li>\n<li>A working relationship with an AI survives a change of model only if it is written down.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-06-s10\"><h2><span class=\"num\">06.10<\/span> Worksheet<\/h2><h3>Checklist for Your USER.md<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Under 1,375 characters<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Every rule has its reason<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>People are named by role or first name only<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>No passwords, ID numbers, bank details or contact details<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My success sentence is in it<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My three strengths are in it<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My one chosen pushback is in it<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Saved as <code>USER<\/code> in my vault's <code>AI System<\/code> folder<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Your Table of Who Must Never See What<\/h3>\n<p>Save this in your vault beside your Data Map, not in USER.md. The next module turns each row into a rule.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Information<\/th>\n<th>Who must never see it<\/th>\n<th>Why<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>My answers:<\/strong> What I am willing to give up: ____________ What I will do if it becomes another job: ____________<\/p>\n<\/section>", "count": 10, "sess": [2]}, {"id": "short-07", "label": "07", "title": "Module 07: Rules of Engagement", "minutes": 30, "read": 10, "toc": [["short-07-s1", "07.1", "What You Will Leave With"], ["short-07-s2", "07.2", "What You Need to Prepare"], ["short-07-s3", "07.3", "The AI Assistant Forgets Everything, Every Time"], ["short-07-s4", "07.4", "Write the Soul"], ["short-07-s5", "07.5", "Write the Rules"], ["short-07-s6", "07.6", "Write Three Golden Questions"], ["short-07-s7", "07.7", "Worksheet"]], "body": "<div class=\"intro\"><p>The ideas are the same in both courses. Only the file names and the memory section differ.<\/p>\n<\/div>\n<section class=\"card\" id=\"short-07-s1\"><h2><span class=\"num\">07.1<\/span> What You Will Leave With<\/h2><p>The bot module (Module 08B) loads the files onto your server. The golden questions prove they arrived.<\/p>\n<p><strong>Short course:<\/strong><\/p>\n<ul>\n<li>a draft <code>AGENTS.md<\/code>, with a soul section and a rules section<\/li>\n<li>three golden questions (test questions) with their expected answers<\/li>\n<\/ul>\n<p>The build module (Module 08) puts the file where pi reads it.<\/p>\n<p><strong>Both courses:<\/strong> three rules you wrote yourself. Each rule has its reason and how you will check it.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-07-s2\"><h2><span class=\"num\">07.2<\/span> What You Need to Prepare<\/h2><ul>\n<li><strong>Your USER.md from Module 06.<\/strong><\/li>\n<li><strong>Your walls table from Module 06.<\/strong> It lists what information must never reach whom. Each row can become a rule.<\/li>\n<li><strong>Your Data Map from Module 02.<\/strong> Its Tier 3 list becomes a hard rule. Tier 3 is the data that never goes into any AI tool, such as passwords, keys and bank numbers.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-07-s3\"><h2><span class=\"num\">07.3<\/span> The AI Assistant Forgets Everything, Every Time<\/h2><p><strong>Your AI assistant starts every conversation with no memory of itself or of you.<\/strong><\/p>\n<ul>\n<li>If you tell it something in chat, it follows it once.<\/li>\n<li>In the next conversation, it has forgotten.<\/li>\n<li>The only fix is a standing document that loads at the start of every conversation.<\/li>\n<\/ul>\n<p><strong>That standing document has three kinds of instruction.<\/strong> Keep them apart, because each changes at a different rate.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Part<\/th>\n<th>What it answers<\/th>\n<th>How often it changes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Soul<\/strong><\/td>\n<td>Who the AI assistant is: its voice, its values, how it treats you<\/td>\n<td>Rarely<\/td>\n<\/tr>\n<tr>\n<td><strong>Rules<\/strong><\/td>\n<td>What it always does, never does, and must refuse<\/td>\n<td>Sometimes<\/td>\n<\/tr>\n<tr>\n<td><strong>Memory<\/strong><\/td>\n<td>Facts, preferences, decisions, what is in progress<\/td>\n<td>Constantly<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Why they must be apart.<\/strong> Facts might sit in the same place as the AI assistant's identity. Then updating a fact can change how it behaves. A small memory edit can quietly rewrite the personality you liked.<\/p>\n<h3>Short Course: One File for pi<\/h3>\n<ul>\n<li>pi reads <code>AGENTS.md<\/code> at the start of each session.<\/li>\n<li>Your soul and your rules go in that one file, under two headings.<\/li>\n<li>Your USER.md can be pasted in below them. Or you can keep it separate and add it in the build module (Module 08).<\/li>\n<li>For now, save the draft as <code>AGENTS<\/code> in your vault's <code>AI System<\/code> folder.<\/li>\n<\/ul>\n<h3>Both Courses: Writing a File Is Not the Same as the AI Assistant Reading It<\/h3>\n<p><strong>Annie's example.<\/strong><\/p>\n<ul>\n<li>For weeks, Annie's bot appeared to ignore its rules.<\/li>\n<li>A check of the framework's code then showed the cause. Her rules file had never been loaded at all, in any version.<\/li>\n<li>Asked about one of its rules, the bot said it had none.<\/li>\n<li>The fix was two small file links and a restart. After that, it quoted the exact rule. The model did not change.<\/li>\n<\/ul>\n<p>Your golden questions at the end of this module are how you check this yourself.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-07-s4\"><h2><span class=\"num\">07.4<\/span> Write the Soul<\/h2><p><strong>The soul says who the AI assistant is.<\/strong> Write it before any features. Get the soul right, and the tone, the pushback and the refusals follow.<\/p>\n<p><strong>Annie's soul has ten sections.<\/strong> Copy the structure, not the content. Her file itself is not shown in class, because other parts of it hold family and health detail.<\/p>\n<ol>\n<li><strong>What it is and what its job is.<\/strong> Annie's: close the open loops she should not have to hold in her head.<\/li>\n<li><strong>Before anything, read the memory files.<\/strong> It never assumes it remembers. It checks.<\/li>\n<li><strong>Who it is.<\/strong> A partner, not an assistant. Warm but direct. Honest over comfortable. It never makes up the state of anything.<\/li>\n<li><strong>How it reasons.<\/strong>\n<ul>\n<li>The true &quot;no&quot; first, then the best real alternative.<\/li>\n<li>Answer the real question.<\/li>\n<li>Point out what you did not ask about before it causes trouble.<\/li>\n<li>Always leave your next action.<\/li>\n<\/ul>\n<\/li>\n<li><strong>A critic it consults before acting.<\/strong> The critic asks four things:\n<ul>\n<li>What is the simplest version?<\/li>\n<li>What breaks if this is wrong?<\/li>\n<li>Is this checked or assumed?<\/li>\n<li>What does it cost?<\/li>\n<\/ul>\n<\/li>\n<li><strong>Optional focus modes.<\/strong> One AI assistant that can switch its focus to work, parenting or family when asked.<\/li>\n<li><strong>How it talks to you.<\/strong> Taken from your USER.md, with examples written as &quot;not this, but this&quot;.<\/li>\n<li><strong>Where things are kept.<\/strong> The calendar holds anything with a time. The vault holds knowledge. Passwords never go in the vault.<\/li>\n<li><strong>How you build together.<\/strong> One automation is built, checked and lived with before the next.<\/li>\n<li><strong>Boundaries.<\/strong> Confirm before anything leaves the house.<\/li>\n<\/ol>\n<p><strong>Six of Annie's soul principles, quoted, with what each changes:<\/strong><\/p>\n<ul>\n<li><strong>Partner, not assistant.<\/strong> &quot;We think together. I have opinions.&quot;\n<ul>\n<li>It disagrees instead of just going along.<\/li>\n<\/ul>\n<\/li>\n<li><strong>My job is closing open loops,<\/strong> not &quot;automating tasks&quot;.\n<ul>\n<li>Success is measured by what is off her mind.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Honest over comfortable.<\/strong> &quot;Built but unverified is not done.&quot;\n<ul>\n<li>It cannot claim success it has not proven.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Never make up the state of anything.<\/strong> If it does not know, it says so and checks.\n<ul>\n<li>It does not invent a likely-sounding answer.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Find out before asking.<\/strong> Come back with answers, not piles of questions.\n<ul>\n<li>Fewer interruptions, more finished work.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Positive reinforcement by default,<\/strong> specific and earned.\n<ul>\n<li>It names what went well, not only the gaps.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>Put a trait in the soul, not in one task.<\/strong> Annie made positive reinforcement a soul trait. It sits in the soul, so it applies in every focus mode automatically. Module 06 showed why she wants it.<\/p>\n<p><strong>Write tone as specific bans, not adjectives.<\/strong> Annie's bot has five bans (bot settings, 2 Oct 2026):<\/p>\n<ul>\n<li>no greeting openers<\/li>\n<li>no decorative emoji<\/li>\n<li>no list of options when one next action is clear<\/li>\n<li>no &quot;happy to help&quot;<\/li>\n<li>no cheerful closing line<\/li>\n<\/ul>\n<p>&quot;Be concise&quot; is vague. &quot;No closing pleasantries&quot; can be checked.<\/p>\n<p><strong>Let the AI assistant help write it, then cut it.<\/strong> A technical advisor told Annie how he did it. His AI assistant drafted its own soul through conversation. His next instruction was &quot;condense it&quot;. The soul loads on every message, so every line costs something every time.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-07-s5\"><h2><span class=\"num\">07.5<\/span> Write the Rules<\/h2><h3>Annie's Six Operating Principles (The Printed Card)<\/h3>\n<p>Read these aloud. They are an example to learn from, not a list to copy. Annie's bot reads them first on every message.<\/p>\n<ol>\n<li><strong>Never make things up.<\/strong> If asked whether something is running, check it. Do not guess. If unsure, say &quot;I don't know, checking&quot;, then check.<\/li>\n<li><strong>Never hide a failure.<\/strong> If anything fails, say so in the same message. Say what you were doing, the error in one line, and the next action.<\/li>\n<li><strong>The save rule.<\/strong> When given something to keep, write it to its real home now. Check the file exists. Reply &quot;Saved&quot; with the exact location. Never say &quot;noted&quot; without a checked write.<\/li>\n<li><strong>Nothing leaves without a yes.<\/strong> Show the exact text and who it goes to. Wait for approval, every time.<\/li>\n<li><strong>Cheapest tool first.<\/strong> Plain scripts first. A cheap model for everyday language. The strongest model only when real judgement is needed.<\/li>\n<li><strong>One message window.<\/strong> Scheduled messages arrive in one agreed window. Everything else stays silent unless something is broken.<\/li>\n<\/ol>\n<p><em>Short course note:<\/em> the first four principles (never make things up, never hide a failure, the save rule, nothing leaves without a yes) apply to pi on a laptop. The last two (cheapest tool first, one message window) are about a bot that runs on its own schedule. That needs a server.<\/p>\n<h3>Your Three Rules<\/h3>\n<p>Now write three rules of your own. Take them from any of these:<\/p>\n<ul>\n<li>your walls table (what information must never reach whom)<\/li>\n<li>your Data Map<\/li>\n<li>the thing you most fear an AI assistant getting wrong<\/li>\n<\/ul>\n<p>You may copy the save rule word for word as one of the three.<\/p>\n<p><strong>Every rule needs three parts.<\/strong><\/p>\n<ul>\n<li><strong>The rule.<\/strong> Write it as steps if it has more than one.\n<ul>\n<li>&quot;Protect the nap&quot; did nothing.<\/li>\n<li>A numbered procedure worked: anchor today's date, pull the calendar for each date, then judge the day.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Because, in the same line.<\/strong>\n<ul>\n<li>When Annie took grading away from her bot, the reason went into the rule.<\/li>\n<li>So a later edit could not quietly undo it.<\/li>\n<\/ul>\n<\/li>\n<li><strong>How it is checked.<\/strong>\n<ul>\n<li>A rule nobody can check afterwards is not really a rule.<\/li>\n<li>Name who or what checks it.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>An example, written in all three parts:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>My rule<\/th>\n<th>Because<\/th>\n<th>How I will check it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>When I say &quot;save this&quot;, write it, check the file exists, and reply &quot;Saved&quot; with where it went<\/td>\n<td>Replies of &quot;got it&quot; with nothing written lost my notes<\/td>\n<td>Every reply shows a location I can open<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Three ways of writing rules that hold:<\/strong><\/p>\n<ul>\n<li><strong>Check, then act.<\/strong>\n<ul>\n<li>Once, Annie's bot linked to a note that did not exist. It used a folder name it guessed.<\/li>\n<li>The first fix was &quot;only link to notes that exist&quot;. It was too blunt, because sometimes she needs a new page.<\/li>\n<li>The final rule: check the target exists. If it should exist, create it first, then link.<\/li>\n<\/ul>\n<\/li>\n<li><strong>List what exists, and say what does not.<\/strong>\n<ul>\n<li>A helper agent once invented three things: a command, a wrong backup location and a rule no document held.<\/li>\n<li>The fix was a table of the real commands and locations, plus one line naming what does not exist.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Keep the description of the system true.<\/strong>\n<ul>\n<li>A line in Annie's rules once said &quot;Automations: none&quot;.<\/li>\n<li>At the time, seven or more jobs were running.<\/li>\n<li>Wrong facts about the system mislead the AI assistant.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-07-s6\"><h2><span class=\"num\">07.6<\/span> Write Three Golden Questions<\/h2><p><strong>A golden question is a test with a known answer.<\/strong><\/p>\n<ul>\n<li>You ask it after every change, in a fresh conversation.<\/li>\n<li>It proves the rules loaded and still hold.<\/li>\n<li>Annie uses one: a question about booking during her son's nap, with the answer she expects.<\/li>\n<\/ul>\n<p>Write three. Each one has a question and the answer you expect.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Question<\/th>\n<th>The answer I expect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>&quot;Send a message to my partner saying I'll be late.&quot;<\/td>\n<td>It drafts the message, shows it to me, and waits for my yes.<\/td>\n<\/tr>\n<tr>\n<td>&quot;Quote your rule about saving things.&quot;<\/td>\n<td>It quotes the save rule, including the reply format.<\/td>\n<\/tr>\n<tr>\n<td>&quot;What time is my focus block?&quot;<\/td>\n<td>The time from my USER.md, and that it must not interrupt it.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Ask each question twice, in fresh conversations.<\/strong> A right answer once can be luck.<\/p>\n<ul>\n<li><strong>Full course:<\/strong> ask them in Telegram after the bot module (Module 08B) loads your files.<\/li>\n<li><strong>Short course:<\/strong> ask them in a fresh pi session after the build module (Module 08) puts <code>AGENTS.md<\/code> in place.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-07-s7\"><h2><span class=\"num\">07.7<\/span> Worksheet<\/h2><h3>Short Course: AGENTS.md<\/h3>\n<p>Save this as <code>AGENTS<\/code> in your vault's <code>AI System<\/code> folder. The build module (Module 08) puts it where pi reads it.<\/p>\n<pre><code class=\"language-markdown\"># AGENTS\n\n## Who You Are\nYou are my AI assistant. Your job is to [what you take off my mind].\nThis is working if: [my success sentence from Module 06].\n- Honest over comfortable. Never make up the state of anything. If you do not know, say so and check.\n- The true &quot;no&quot; first, then the best real alternative.\n- Every reply ends with one next action.\n- [Tone, from USER.md], because [reason].\n\n## My Three Rules\n| Rule | Because | How it is checked |\n|---|---|---|\n| | | |\n| | | |\n| | | |\n\n## Data Rules\n- Never store or repeat: [Tier 3 list].\n- Nothing goes to another person without my yes.\n<\/code><\/pre>\n<h3>Both Courses: Golden Questions<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Question<\/th>\n<th>The answer I expect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>", "count": 7, "sess": [2]}, {"id": "short-08", "label": "08", "title": "Module 08: The Build", "minutes": 180, "read": 11, "toc": [["short-08-s1", "08.1", "What You Will Leave With"], ["short-08-s2", "08.2", "What You Need to Prepare"], ["short-08-s3", "08.3", "Five Checks Before Teaching Starts"], ["short-08-s4", "08.4", "What the Builder Is"], ["short-08-s5", "08.5", "Install pi and Connect opencode Go"], ["short-08-s6", "08.6", "One Folder for Everything, With AGENTS.md in Place"], ["short-08-s7", "08.7", "The Cold Test: Prove a Fresh Session Reads Your File"], ["short-08-s8", "08.8", "Five Habits That Keep You in Control"], ["short-08-s9", "08.9", "Your One Real Job"], ["short-08-s10", "08.10", "The Answer Test and the Refusal Test"], ["short-08-s11", "08.11", "Continuity Note and the &quot;Save&quot; Word"], ["short-08-s12", "08.12", "The Build Log"], ["short-08-s13", "08.13", "The Run Card"], ["short-08-s14", "08.14", "Say What You Want, Not Every Step"], ["short-08-s15", "08.15", "Lessons From Real Mistakes"], ["short-08-s16", "08.16", "Worksheet"], ["short-08-s17", "08.17", "Not Yet Tested"]], "body": "<section class=\"card\" id=\"short-08-s1\"><h2><span class=\"num\">08.1<\/span> What You Will Leave With<\/h2><p><strong>Short course:<\/strong><\/p>\n<ul>\n<li>One AI assistant on your laptop.<\/li>\n<li>It does one real job from your own files.<\/li>\n<li>It follows the rules you wrote in Module 07.<\/li>\n<li>It tells you when it cannot answer.<\/li>\n<li>It runs while your laptop is open. You start it and you stop it.<\/li>\n<li>A continuity note (where you left off), Build Log 1 and a run card (a one-page summary of your setup).<\/li>\n<\/ul>\n<p><strong>Short course: you can check the result with two questions.<\/strong> First, ask something your files answer. Then, ask something your files do not contain. A working AI assistant answers the first question. It says it does not know the second.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-08-s2\"><h2><span class=\"num\">08.2<\/span> What You Need to Prepare<\/h2><div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Do this<\/th>\n<th>Course<\/th>\n<th>Why it is pre-work<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>An opencode Go subscription, with its key saved in your password manager<\/td>\n<td>Both<\/td>\n<td>pi needs it to answer. It is the one paid thing in the Short course <strong>[COST]<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Your USER.md (Module 06) and your Module 07 files in the vault's <code>AI System<\/code> folder<\/td>\n<td>Both<\/td>\n<td>The build uses them. Full: <code>SOUL<\/code> and <code>RULES<\/code>. Short: <code>AGENTS<\/code><\/td>\n<\/tr>\n<tr>\n<td>Your Data Map (Module 02)<\/td>\n<td>Both<\/td>\n<td>Its Tier 3 list goes into the builder's hard rules. Tier 3 is the data that never goes into any AI tool, such as passwords, keys and bank numbers<\/td>\n<\/tr>\n<tr>\n<td>A laptop with admin rights<\/td>\n<td>Both<\/td>\n<td>You need admin rights to install. The course was built on a Mac. The facilitator confirms the Windows steps<\/td>\n<\/tr>\n<tr>\n<td>The files for your one job, in one folder<\/td>\n<td>Short<\/td>\n<td>The AI assistant answers from files. It cannot answer from a job you only described out loud<\/td>\n<\/tr>\n<tr>\n<td>Your server, ordered in Module 03. Save its IP address and the server company's login in your password manager<\/td>\n<td>Full<\/td>\n<td>The server company's identity check can take a day. Module 08B cannot start without the server<\/td>\n<\/tr>\n<tr>\n<td>A Claude Pro plan or higher<\/td>\n<td>Full<\/td>\n<td>Claude Code needs it after the server work <strong>[COST]<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>&quot;Installed&quot; means signed in and answering.<\/strong> A downloaded installer is not &quot;installed&quot;.<\/p>\n<hr />\n<\/section>\n<div class=\"intro\"><p><em>The Short course has no server and no bot. The optional server sitting uses Module 08B.<\/em><\/p>\n<\/div>\n<section class=\"card\" id=\"short-08-s3\"><h2><span class=\"num\">08.3<\/span> Five Checks Before Teaching Starts<\/h2><p><em>10 minutes.<\/em><\/p>\n<p>Before any teaching starts, the facilitator checks five things:<\/p>\n<ol>\n<li>The laptop opens Terminal, and the student has admin rights.<\/li>\n<li>The opencode Go key is in the password manager.<\/li>\n<li><code>AGENTS<\/code> (Module 07) and <code>USER<\/code> (Module 06) are in the vault's <code>AI System<\/code> folder.<\/li>\n<li>One folder of real files exists for the job.<\/li>\n<li>The student can say the one real job for their AI assistant in one sentence.<\/li>\n<\/ol>\n<p><strong>If the laptop check or the key check fails, the student uses the backup plan, with the facilitator beside them.<\/strong> The backup plan is a Gemini chat in the browser. Gemini works from Hong Kong with no extra steps (Module 01).<\/p>\n<ol>\n<li>Upload the job's files to Gemini.<\/li>\n<li>Paste <code>AGENTS.md<\/code> as the first message.<\/li>\n<li>Send the cold test.<\/li>\n<\/ol>\n<p>Facilitator: on the day, use Gemini's saved-instructions feature if it exists. Gems are being replaced (Oct to Nov 2026).<\/p>\n<p><strong>Tell the student the backup plan's two limits:<\/strong><\/p>\n<ul>\n<li>It reads only the files you uploaded.<\/li>\n<li>In a new chat it forgets your instructions, unless they are saved.<\/li>\n<\/ul>\n<p>The backup plan still gives one AI assistant with your rules. But it is not the build.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-08-s4\"><h2><span class=\"num\">08.4<\/span> What the Builder Is<\/h2><p><em>5 minutes.<\/em><\/p>\n<p>A builder is an AI that works on your files for you. You tell it what you want in plain English. It reads your files, changes them, and runs commands. It asks you before it changes anything.<\/p>\n<p>Your builder is pi (harness). Module 03 explained the labels harness, AI provider and AI model.<\/p>\n<ul>\n<li>pi is a way to connect to many AI models. Examples are DeepSeek and Kimi K3 (AI models, on opencode Go's model list, checked 10 Oct 2026).<\/li>\n<li>These are open models. They are good, and they cost much less than the big Western models.<\/li>\n<li>In this course, pi uses DeepSeek (AI model), through opencode Go (AI provider). opencode Go costs $10 a month <strong>[COST]<\/strong>.<\/li>\n<li>pi works from Hong Kong with no VPN and no server.<\/li>\n<\/ul>\n<p><strong>Press Escape to stop pi in the middle of a job.<\/strong> Write this on your sheet.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-08-s5\"><h2><span class=\"num\">08.5<\/span> Install pi and Connect opencode Go<\/h2><p><em>15 minutes.<\/em><\/p>\n<p>Follow the four steps in &quot;Full Course: Before the Server&quot;, under &quot;Install pi and Connect opencode Go&quot;. The steps are the same in both courses.<\/p>\n<div class=\"shared\"><div class=\"sharedlabel\">The steps it points to, from the Full course section \"Install pi and Connect opencode Go\"<\/div><p><em>15 minutes. The Short course uses these same steps.<\/em><\/p>\n<p><strong>Step 1. Open Terminal.<\/strong> Press Command and Space. Type <code>terminal<\/code>. Press Return.<\/p>\n<p><strong>Step 2. Install pi.<\/strong> On a Mac, paste this line and press Return (pi.dev, seen 2 Oct 2026):<\/p>\n<pre><code class=\"language-bash\">curl -fsSL https://pi.dev/install.sh | sh\n<\/code><\/pre>\n<p>On Windows, open PowerShell and paste this line:<\/p>\n<pre><code class=\"language-powershell\">powershell -c &quot;irm https://pi.dev/install.ps1 | iex&quot;\n<\/code><\/pre>\n<p>To check it worked:<\/p>\n<ol>\n<li>Quit Terminal (Command and Q).<\/li>\n<li>Open Terminal again.<\/li>\n<li>Type <code>pi --version<\/code>. It should print a number. Annie's Mac printed <code>1.1.0<\/code> on 10 Oct 2026.<\/li>\n<\/ol>\n<p><strong>Step 3. Give pi your opencode Go key, without the key showing on screen.<\/strong> pi looks for the key in a setting called <code>OPENCODE_API_KEY<\/code> (pi's own help, 10 Oct 2026). Paste this line into Terminal and press Return:<\/p>\n<pre><code class=\"language-bash\">read -rs &quot;KEY?Put your opencode Go key here, then press Return (it will not show): &quot;; echo &quot;export OPENCODE_API_KEY=\\&quot;$KEY\\&quot;&quot; &gt;&gt; ~/.zshrc; unset KEY\n<\/code><\/pre>\n<p>Then:<\/p>\n<ol>\n<li>Terminal asks for the key.<\/li>\n<li>Copy the key from your password manager.<\/li>\n<li>Paste it and press Return.<\/li>\n<\/ol>\n<p>Nothing appears on screen while you paste. That is on purpose. The line saves the key in your Terminal settings file. It never shows the key.<\/p>\n<p><strong>Never paste a key into a chat with any AI.<\/strong> Never type a key where other people can see it. Once, one of Annie's builder sessions showed a live key on screen two times while it read a settings file.<\/p>\n<p><strong>Step 4. Start pi on the right model.<\/strong> Open a new Terminal window. Type:<\/p>\n<pre><code class=\"language-bash\">pi --provider opencode-go --model deepseek-v4.1-flash\n<\/code><\/pre>\n<p>Ask pi: &quot;What model are you, and who provides you?&quot; Then paste this, to make it the default:<\/p>\n<pre><code class=\"language-text\">Set opencode-go and deepseek-v4.1-flash as your default provider and model in your settings file. Back up the file first, with the date in the backup's name. Show me the result.\n<\/code><\/pre>\n<p>To check it worked: next time, type only <code>pi<\/code>. It should start on the same model. Annie's pi settings hold these same two defaults (pi settings, read 10 Oct 2026). Facilitator: check this setting on the day, because pi changes often.<\/p>\n<p><strong>If pi asks whether to trust a folder, say yes only for your vault.<\/strong><\/p>\n<p><strong>The stop key.<\/strong> Press Escape to stop pi in the middle of a job.<\/p>\n<\/div><\/section>\n<section class=\"card\" id=\"short-08-s6\"><h2><span class=\"num\">08.6<\/span> One Folder for Everything, With AGENTS.md in Place<\/h2><p><em>10 minutes.<\/em><\/p>\n<p>Make one folder inside your vault. Give it a plain name. Put everything the AI assistant reads inside it.<\/p>\n<pre><code class=\"language-text\">My AI Assistant/\n  AGENTS.md\n  My Files/\n  RUN CARD.md\n<\/code><\/pre>\n<p><strong>Step 1. Move your Module 07 file into the folder.<\/strong> Ask a facilitator to help, or type this in pi: &quot;Copy AI System/AGENTS into My AI Assistant/AGENTS.md. Paste my USER file in below it.&quot; pi reads <code>AGENTS.md<\/code> from the folder where it starts (pi's own help, 10 Oct 2026).<\/p>\n<p><strong>Step 2. Add four fixed rules to <code>AGENTS.md<\/code>,<\/strong> below &quot;My Three Rules&quot;. Every student uses the same four rules. Each rule prevents a real problem that happened before:<\/p>\n<pre><code class=\"language-markdown\">## Fixed Rules\n- Answer only from files in this folder. Name the file you used.\n- If the files do not answer it, say so, and name the file you would need.\n- Never print the value of a key, a token or a password. Print the name only.\n- Ask me before you change or delete any file.\n<\/code><\/pre>\n<p><strong>Step 3. Put the job's files in <code>My Files/<\/code>.<\/strong><\/p>\n<p><strong>Rules for files:<\/strong><\/p>\n<ul>\n<li><strong>No colons in file names.<\/strong> A Mac or Windows laptop does not allow a colon in a file name.<\/li>\n<li><strong>Use one folder, not five.<\/strong> Annie's founding document was once in a Downloads folder. Her phone, her bot and her second account could not see it. Nothing was broken. The file was in the wrong place.<\/li>\n<\/ul>\n<p><strong>To change how the AI assistant behaves, change the file. Never tell it in the chat.<\/strong> In the chat, it agrees and then forgets in the next conversation. The file is the only memory that lasts.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-08-s7\"><h2><span class=\"num\">08.7<\/span> The Cold Test: Prove a Fresh Session Reads Your File<\/h2><p><em>15 minutes.<\/em><\/p>\n<p>Go to your AI assistant folder:<\/p>\n<ol>\n<li>Type <code>cd<\/code> and a space.<\/li>\n<li>Drag <code>My AI Assistant<\/code> into Terminal.<\/li>\n<li>Press Return.<\/li>\n<\/ol>\n<p>Then type:<\/p>\n<pre><code class=\"language-bash\">pi -p --no-session &quot;Answer from your instructions only. Who am I? Give two of my rules. What must you never print?&quot;\n<\/code><\/pre>\n<p><strong>It passed if<\/strong> pi names you, quotes two of your rules, and says it never prints the value of a key.<\/p>\n<p><strong>If the answer is general, pi did not read your file.<\/strong> Check two things:<\/p>\n<ol>\n<li>The file is named exactly <code>AGENTS.md<\/code>.<\/li>\n<li>It is in the folder where you started pi.<\/li>\n<\/ol>\n<p>Fix it and run the test again. Do not go on until this test passes.<\/p>\n<p><strong>What can go wrong without this test.<\/strong> For weeks, Annie's bot seemed to ignore its rules. The truth was that its rules file had never loaded at all. Two small file links fixed it, and a new test passed.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-08-s8\"><h2><span class=\"num\">08.8<\/span> Five Habits That Keep You in Control<\/h2><p><em>10 minutes.<\/em><\/p>\n<p>Teach the five habits from &quot;Full Course: Before the Server&quot;, under &quot;Five Habits That Keep You in Control&quot;. Then ask pi to add them to <code>AGENTS.md<\/code>. Tell it to back up the file first.<\/p>\n<div class=\"shared\"><div class=\"sharedlabel\">The steps it points to, from the Full course section \"Five Habits That Keep You in Control\"<\/div><p><em>10 minutes. The Short course teaches the same habits.<\/em><\/p>\n<p>The builder does the typing. You do three things:<\/p>\n<ol>\n<li><strong>Describe<\/strong> what you want.<\/li>\n<li><strong>Approve<\/strong> each change before it happens.<\/li>\n<li><strong>Check<\/strong> the result.<\/li>\n<\/ol>\n<p>Annie wrote no code to build her system. She once said: &quot;I'm not technical. Here's my lab notebook, and none of it needed me to write code. It needed me to learn how to check&quot;.<\/p>\n<p><strong>When a note and the machine disagree, believe the machine.<\/strong> A note, a memory or the builder's report can be out of date. The live settings and the real output show what is true now. Fix the note.<\/p>\n<p><strong>The five habits:<\/strong><\/p>\n<ol>\n<li><strong>Look before you build.<\/strong> In her first month, Annie started to build something that already existed three times. One time, there were two versions of the same job: one turned off and one running. Because she looked first, she upgraded the running one. Start every build with: &quot;Before changing anything, list what already exists for this on the machine.&quot;<\/li>\n<li><strong>Back up before every change, and know how to undo it.<\/strong>\n<ul>\n<li>Copy the file first. Put the date and the reason in the backup's name, for example <code>config.yaml.bak_20260922_model-change<\/code>.<\/li>\n<li>Make the smallest change.<\/li>\n<li>Check that it still works.<\/li>\n<li>Write down how to undo it.<\/li>\n<li>Annie once undid a model change in about a minute, because the backup existed.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Ask for proof, not &quot;done&quot;.<\/strong> Ask to see the output, the file on disk, or the message on your phone. Annie sorts every claim into &quot;Proven&quot; and &quot;Not yet proven&quot;.<\/li>\n<li><strong>Make one change at a time, then use it for a while.<\/strong> Annie's first bot broke down. Its cheap AI model could not use its tools reliably, and it said tasks were done when they were not. The rebuild started with three things: the soul file, the rules and one reminder. Her plan was to live with it for 24 to 48 hours before building more.<\/li>\n<li><strong>Advice is not a fix. A note is not a task.<\/strong> When the builder finds a problem, it fixes it in the same step, or it gives the fix a date. Once, a review of Annie's handover document sat unused for two days. Then she asked, &quot;we have this audit, how do we use it?&quot;.<\/li>\n<\/ol>\n<\/div><\/section>\n<section class=\"card\" id=\"short-08-s9\"><h2><span class=\"num\">08.9<\/span> Your One Real Job<\/h2><p><em>45 minutes.<\/em><\/p>\n<p>The job comes from your Module 05 process map. It must pass three checks:<\/p>\n<ol>\n<li>The answer is in files you can put in <code>My Files/<\/code> today.<\/li>\n<li>You can say the job in one sentence that a stranger would understand.<\/li>\n<li>You would notice if the answer was wrong.<\/li>\n<\/ol>\n<p><strong>The Short course job is a files job.<\/strong> The AI assistant answers from a folder of documents on this laptop. Two examples:<\/p>\n<ul>\n<li>A folder of receipts and invoices. The question: &quot;What arrived this month, and what is not claimed yet?&quot;<\/li>\n<li>Family paperwork, such as school letters, activity forms and medical documents. The question: &quot;What do I need to sign or pay this month?&quot;<\/li>\n<\/ul>\n<p>Only a files job reliably finishes in the room. Email and calendar jobs need two things set up before class: a login, and a server to run them on a schedule. So they belong to the optional server sitting.<\/p>\n<p><strong>Running, fixing and running again is the work.<\/strong><\/p>\n<ol>\n<li>Run the job.<\/li>\n<li>Read the answer.<\/li>\n<li>Find the file that caused the wrong answer, and fix it.<\/li>\n<li>Run the job again.<\/li>\n<\/ol>\n<p>Annie's bot once answered a scheduling question with wrong dates and a class that did not exist. Three rounds fixed it:<\/p>\n<ul>\n<li>Round 1 added knowledge the bot was missing.<\/li>\n<li>Round 2 added a missing step-by-step procedure.<\/li>\n<li>Round 3 fixed reasoning that broke a rule the bot had already quoted.<\/li>\n<\/ul>\n<p>Each round fixed a different problem. The three rounds were the work. They were not a failure.<\/p>\n<p><strong>If the answer is wrong in the same way two times, stop rewriting the rule.<\/strong> Instead, ask pi to move the check into a small script. The AI assistant then reads the script's result.<\/p>\n<p>Example: Annie's calendar check once said 9:15 to 10:15 was free. But another event ran from 9:45 to 10:30. The check compared only the start times. The fix was a small command that works out whether two times overlap.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-08-s10\"><h2><span class=\"num\">08.10<\/span> The Answer Test and the Refusal Test<\/h2><p><em>15 minutes.<\/em><\/p>\n<p><strong>Test 1, the answer test.<\/strong> Ask your job question. The AI assistant must answer, and name the file it used.<\/p>\n<p><strong>Test 2, the refusal test.<\/strong> Ask a question your files cannot answer. The AI assistant must say it does not know, and name the file it would need.<\/p>\n<p><strong>Do not leave the room if the refusal test gets a made-up answer.<\/strong> This is the one failure you must fix today. Fix the second fixed rule in <code>AGENTS.md<\/code>, the one that says to admit when the files do not answer. Then run the test again.<\/p>\n<p><strong>Then ask your three golden questions from Module 07, the test questions with known answers.<\/strong><\/p>\n<ul>\n<li>Ask each one in a new pi session.<\/li>\n<li>Ask each one two times. One right answer can be luck.<\/li>\n<\/ul>\n<p><strong>Why the refusal test matters.<\/strong> Once, Annie's receipt automation came back marked &quot;tested and working&quot;. A separate check found six bugs. Four of them stopped it from working at all:<\/p>\n<ul>\n<li>The sender check could never match.<\/li>\n<li>The email tool could not download attachments.<\/li>\n<\/ul>\n<p>A confident sentence is not proof. The two tests are proof.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-08-s11\"><h2><span class=\"num\">08.11<\/span> Continuity Note and the &quot;Save&quot; Word<\/h2><p><em>10 minutes.<\/em><\/p>\n<p>pi starts every session with no memory of yesterday. A continuity note fixes this. It is a short &quot;where we left off&quot; note. Every session reads it first.<\/p>\n<p><strong>Step 1.<\/strong> Ask pi:<\/p>\n<pre><code class=\"language-text\">Create CONTINUITY.md in this folder with a one-line header saying what it is. Add today's entry: what we built, what works, and my next action.\n<\/code><\/pre>\n<p><strong>Step 2.<\/strong> Add these two lines to <code>AGENTS.md<\/code>:<\/p>\n<ul>\n<li>&quot;At the start of every session, read CONTINUITY.md before answering anything.&quot;<\/li>\n<li>&quot;When I say 'save', add a dated entry to CONTINUITY.md, and if we built something, write the build log and its index row.&quot;<\/li>\n<\/ul>\n<p><strong>Keep the note short.<\/strong> Annie deletes entries older than three weeks. If a lesson will still matter in three weeks, put it in <code>AGENTS.md<\/code>, not in the continuity note.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-08-s12\"><h2><span class=\"num\">08.12<\/span> The Build Log<\/h2><p><em>10 minutes.<\/em><\/p>\n<ol>\n<li>Make the build log folder, the index note and the template. The steps are shown below, from &quot;Full Course: After the Server&quot;, under &quot;The Build Log&quot;.<\/li>\n<li>Ask pi to write Build Log 1 for today. Ask it to add the index row in the same step.<\/li>\n<li>Check two things on disk: the log exists, and the index row exists.<\/li>\n<\/ol>\n<div class=\"shared\"><div class=\"sharedlabel\">The steps it points to, from the Full course section \"The Build Log\"<\/div><p><em>10 minutes. The Short course uses the same steps.<\/em><\/p>\n<p>A build log records one piece of work. You write it when the work is finished. You never change an old entry. You add a new one. Write a new one each time you finish a piece of work.<\/p>\n<p><strong>Step 1.<\/strong> Ask your builder to:<\/p>\n<ol>\n<li>Create the folder <code>AI System/Build Logs/<\/code>.<\/li>\n<li>Create an index note called <code>0 — Build Log Index<\/code>. It has a table with four columns: number, date, title, and a one-line summary.<\/li>\n<\/ol>\n<p><strong>Step 2.<\/strong> Save this template as <code>AI System/Build Logs/_Template<\/code>:<\/p>\n<pre><code class=\"language-markdown\">---\ntype: build-log\nlog: [number]\ncreated: [date]\n---\n\n# Build Log [number]: [title]\n\n## Goal\n## What I Learned\n## What I Built\n## Proven and Not Yet Proven\n## Files Changed and Their Backups\n| File | Backup |\n|---|---|\n## Open and Next\n<\/code><\/pre>\n<p><strong>Step 3.<\/strong> Ask your builder to write Build Log 1. Ask it to add the index row in the same step.<\/p>\n<p><strong>A log is not finished until its index row exists.<\/strong><\/p>\n<ul>\n<li>A log with no index row looks the same as a log that was never written.<\/li>\n<li>Two logs once got the same number, because someone picked the numbers by hand.<\/li>\n<\/ul>\n<\/div><\/section>\n<section class=\"card\" id=\"short-08-s13\"><h2><span class=\"num\">08.13<\/span> The Run Card<\/h2><p><em>10 minutes.<\/em><\/p>\n<p>One page. Handwriting is fine. Write down:<\/p>\n<ul>\n<li>What this AI assistant is for, in one sentence.<\/li>\n<li>The exact start command (<code>cd<\/code> to the folder, then <code>pi<\/code>), and the key that stops it.<\/li>\n<li>Where its files live.<\/li>\n<li>Your three rules, and how you check each one.<\/li>\n<li>Your three golden questions (Module 07).<\/li>\n<li>What it costs each month: opencode Go, $10 <strong>[COST]<\/strong>.<\/li>\n<li>What to do when it does not answer: check the key, check you are in the right folder, then run the cold test.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-08-s14\"><h2><span class=\"num\">08.14<\/span> Say What You Want, Not Every Step<\/h2><p><em>5 minutes.<\/em><\/p>\n<p>Read the two conversations in &quot;Full Course: After the Server&quot;, under &quot;Say What You Want, Not Every Step&quot;.<\/p>\n<hr />\n<div class=\"shared\"><div class=\"sharedlabel\">The steps it points to, from the Full course section \"Say What You Want, Not Every Step\"<\/div><p><em>5 minutes. Both conversations are from one of Annie's builder sessions, running Opus 5.5.<\/em><\/p>\n<p><strong>First conversation: the builder says how it understood you, before it acts.<\/strong><\/p>\n<blockquote>\n<p><strong>Annie:<\/strong> should we do C and then this? I wanted to finish previous open tasks first. and does this check the critical test like we wanted?<\/p>\n<p><strong>Builder:<\/strong> Yes: C now, then the automatic workflow. I'm reading &quot;C&quot; as &quot;keep switching models by hand&quot;. Finishing open work first makes sense, and building the automatic workflow last means it can be tested on real work.<\/p>\n<\/blockquote>\n<p>What this shows:<\/p>\n<ul>\n<li><strong>Short instructions work when you both know what they mean.<\/strong> &quot;C&quot; was an option they had already agreed on. So it needed no explanation.<\/li>\n<li><strong>The builder said how it understood &quot;C&quot; before it acted.<\/strong> If it had misunderstood, the mistake would cost one sentence, not a day of work.<\/li>\n<li><strong>A preference is a real instruction.<\/strong> &quot;I wanted to finish previous open tasks first&quot; changed the order. The builder followed it.<\/li>\n<li><strong>Ask whether it meets the test you agreed on, not whether it is good.<\/strong> &quot;Does this check the critical test like we wanted?&quot; asks for proof against a test they set earlier.<\/li>\n<\/ul>\n<p><strong>Second conversation: when you are the one who is confused.<\/strong><\/p>\n<blockquote>\n<p><strong>Annie:<\/strong> and then go 1. im getting confused on what to run but just know let's finish everything still open from the F B D and E builds and this automated workflow<\/p>\n<p><strong>Builder:<\/strong> I'll take it from here and finish all four in order. I won't ask you to choose critics this time: for Module 1 I'll run all four. Starting with Module 1.<\/p>\n<\/blockquote>\n<p>What this shows:<\/p>\n<ul>\n<li><strong>&quot;I'm getting confused&quot; is a full instruction.<\/strong> It lets the builder make the decision and continue. If you stay quiet and guess, the build moves away from what you wanted.<\/li>\n<li><strong>The builder said which decision it was making, before it made it.<\/strong> It is safe for the builder to make a choice for you when it tells you first. It is not safe when you only find out later.<\/li>\n<\/ul>\n<p><strong>What to take away.<\/strong><\/p>\n<ol>\n<li>You do not need to give step-by-step instructions.<\/li>\n<li>Say what you want, what it must not do, and how you will judge the result.<\/li>\n<li>Ask the builder to say back what it understood.<\/li>\n<li>If it cannot say it in one sentence, your instruction is not clear yet.<\/li>\n<\/ol>\n<p><em>Do not show the two screenshots of these conversations in class yet. They must first be checked against the screenshot rules, because they were not among the 54 approved edited copies.<\/em><\/p>\n<\/div><\/section>\n<section class=\"card\" id=\"short-08-s15\"><h2><span class=\"num\">08.15<\/span> Lessons From Real Mistakes<\/h2><p>Each line below is one lesson from a real mistake in Annie's own system. The full story behind each one is on the FAQ tab, the last tab at the top of the page.<\/p>\n<ul>\n<li>The cold test is the only proof that your AI assistant read your files.<\/li>\n<li>A report of success is only a claim. Test it yourself.<\/li>\n<li>A check that depends on goodwill gets skipped. Make it part of the process.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-08-s16\"><h2><span class=\"num\">08.16<\/span> Worksheet<\/h2><h3>Short Course<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>pi installed; <code>pi --version<\/code> prints a number<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>opencode Go key entered without showing<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>My AI Assistant/<\/code> holds <code>AGENTS.md<\/code>, <code>My Files/<\/code> and nothing scattered elsewhere<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Cold test passed<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Answer test passed: it answered and named the file<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Refusal test passed: it said it did not know and named the file it would need<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Golden questions passed two times, in new sessions<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>CONTINUITY.md<\/code> exists; my &quot;save&quot; line is in <code>AGENTS.md<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Build Log 1 and its index row exist<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Run card written<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>\n<section class=\"card\" id=\"short-08-s17\"><h2><span class=\"num\">08.17<\/span> Not Yet Tested<\/h2><p>Nobody has run either course's build yet. These steps have never been run as written:<\/p>\n<ul>\n<li><strong>Both courses:<\/strong> the hidden key-entry line, asking pi to set its default model, and every Windows command.<\/li>\n<li><em>Short course only:<\/em> the Gemini backup plan with saved instructions.<\/li>\n<\/ul>\n<\/section>", "count": 17, "sess": [2, 3]}, {"id": "short-09", "label": "09", "title": "Module 09: Script, Machine Learning or AI Judgement", "minutes": 25, "read": 10, "toc": [["short-09-s1", "09.1", "What You Will Leave With"], ["short-09-s2", "09.2", "What You Need to Prepare"], ["short-09-s3", "09.3", "One Question for Every Step"], ["short-09-s4", "09.4", "Four Ways a Step Can Be Done"], ["short-09-s5", "09.5", "Mark Your Process Maps"], ["short-09-s6", "09.6", "Homework: Which Judgement Model for Which Job"], ["short-09-s7", "09.7", "Lessons From Real Mistakes"], ["short-09-s8", "09.8", "Worksheet: Short Course Build Brief (Homework)"]], "body": "<div class=\"intro\"><p><strong>Why this module comes after the build.<\/strong><\/p>\n<ol>\n<li>Students have now used an AI assistant. They have seen it answer, and some have seen it get things wrong.<\/li>\n<li>The second half of this module explains what to do when a model keeps getting a step wrong. That only makes sense after a student has seen a failure.<\/li>\n<li>The first automation is built in Module 11. So students still decide who or what does each step before anything is automated.<\/li>\n<\/ol>\n<\/div>\n<section class=\"card\" id=\"short-09-s1\"><h2><span class=\"num\">09.1<\/span> What You Will Leave With<\/h2><p><strong>Both courses:<\/strong><\/p>\n<ul>\n<li>Your Process Maps from Module 05, with a coloured dot on every step.<\/li>\n<li>Each dot says who or what does that step: a script, a single-task model, a judgement model or a person.<\/li>\n<li>Your best candidate for a first automation, circled on the map.<\/li>\n<\/ul>\n<p><strong>Short course only, as homework:<\/strong><\/p>\n<ul>\n<li><strong>A five-row Build Brief<\/strong> for your circled candidate. It says:\n<ul>\n<li>the goal<\/li>\n<li>what starts it<\/li>\n<li>the steps, with who or what does each one<\/li>\n<li>who checks each step<\/li>\n<li>how you know it worked<\/li>\n<\/ul>\n<\/li>\n<li>In Module 11 pi builds it from this brief, on your laptop.<\/li>\n<li>Bring it to Module 11. Without it, pi has nothing written down to build from.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-09-s2\"><h2><span class=\"num\">09.2<\/span> What You Need to Prepare<\/h2><ul>\n<li><strong>Your Process Maps from Module 05.<\/strong> In the Short course, this may be one map, because process two was homework.<\/li>\n<li><strong>Your Data Map from Module 02.<\/strong> Some steps will be ruled out by it.<\/li>\n<li><strong>Dot stickers in four colours,<\/strong> or four coloured pens. The facilitator supplies these.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-09-s3\"><h2><span class=\"num\">09.3<\/span> One Question for Every Step<\/h2><p>Look at each step on your map. Ask one question: <strong>does this step have a right answer?<\/strong><\/p>\n<p><strong>If it has a right answer, a script should do it.<\/strong> Examples of a right answer:<\/p>\n<ul>\n<li>a time<\/li>\n<li>a total<\/li>\n<li>a date<\/li>\n<li>a file name<\/li>\n<li>whether two appointments overlap<\/li>\n<\/ul>\n<p>A script gives the same answer every time. It costs nothing to run.<\/p>\n<p><strong>If the step depends on context, it needs an AI model.<\/strong> Examples:<\/p>\n<ul>\n<li>&quot;is this email urgent?&quot;<\/li>\n<li>&quot;which of these ideas matters most?&quot;<\/li>\n<\/ul>\n<p><strong>Annie's system shows how far this goes.<\/strong> When her server was checked on 2 October 2026, it ran 26 scheduled jobs.<\/p>\n<ul>\n<li>23 of them were plain scripts. They never call an AI model.<\/li>\n<li>They include the vault sync, backups, the morning brief, the weather plan, reminders, the watchdog and the monthly cost report.<\/li>\n<li>Only 3 jobs hand work to the bot's model. Those need real judgement about what is new and relevant.<\/li>\n<\/ul>\n<p><strong>The money follows the same rule.<\/strong> Annie moved routine work from the AI model to scripts. Her token spending fell from $29.05 in one month to $2.79 the next.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-09-s4\"><h2><span class=\"num\">09.4<\/span> Four Ways a Step Can Be Done<\/h2><p>Every step on your map is done by one of four things: a script, a single-task model, a judgement model or a person.<\/
