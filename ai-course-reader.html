>\n<p><strong>pi is already working, so pi makes the Claude Code changes for you.<\/strong> This is one benefit of installing pi first. Claude Code can also make these changes itself, in the desktop app or in the terminal (Annie, 10 Oct 2026). Start pi in your vault for each setting below.<\/p>\n<p><strong>1. Make copy and paste work.<\/strong> Claude Code takes control of the mouse. So when you highlight text, it does not copy. Ask pi:<\/p>\n<pre><code class=\"language-text\">Add the line export CLAUDE_CODE_DISABLE_MOUSE=1 to my ~/.zshrc file. Back up the file first.\n<\/code><\/pre>\n<p>Open a new Terminal window. Now Command and C copies, and Command and V pastes. Be careful: Control and C does something different. It stops whatever is running (Build Log 01).<\/p>\n<p><strong>2. Lock Claude Code to your subscription.<\/strong><\/p>\n<ul>\n<li>If an Anthropic API key is on your machine, Claude Code may use it. Then you pay for each use, on top of your plan.<\/li>\n<li>This happened to Annie. When she set up Claude Code on her server, it charged each use to her employer's account (Build Log 46).<\/li>\n<\/ul>\n<p>Ask pi:<\/p>\n<pre><code class=\"language-text\">In ~/.claude/settings.json, set &quot;forceLoginMethod&quot; to &quot;claudeai&quot;. Keep every other setting. Back up the file first, then show me the result.\n<\/code><\/pre>\n<p><strong>It passed if<\/strong> you type <code>/login<\/code> inside Claude Code and the subscription option is already selected.<\/p>\n<p><strong>3. Show what matters at the bottom of the window.<\/strong> <em>(Added by Annie, 10 Oct 2026.)<\/em><\/p>\n<ol>\n<li>Choose your status-line items from the list in Module 01.<\/li>\n<li>Ask pi to set up its own status line first. Annie's pi has one (pi settings backup, 5 Oct 2026).<\/li>\n<li>Then ask pi to set up Claude Code's status line.<\/li>\n<\/ol>\n<p>Facilitator: check on the day which items each builder can show. Also check whether &quot;money spent&quot; can show on a subscription.<\/p>\n<p><strong>4. Queue a message with Option and Enter.<\/strong> Module 01's key table explains each key.<\/p>\n<ul>\n<li>Claude Code's own queue key is hard to press: Control and X, then Enter.<\/li>\n<li>On 10 Oct 2026, Annie changed it to Option and Enter on her Mac.<\/li>\n<\/ul>\n<p>Ask your builder to do the same:<\/p>\n<pre><code class=\"language-text\">Create ~/.claude/keybindings.json with one binding in the Chat context: &quot;alt+enter&quot; runs &quot;chat:queueSubmit&quot;. Keep any bindings already in the file. Back up the file first.\n<\/code><\/pre>\n<p><strong>If you use Ghostty, it needs one more line.<\/strong> Ghostty does not send Option and Enter to Claude Code on its own.<\/p>\n<ol>\n<li>Ask your builder to add the line below to <code>~/.config/ghostty/config<\/code>.<\/li>\n<li>Reload Ghostty's settings: press Command, Shift and comma.<\/li>\n<\/ol>\n<pre><code class=\"language-text\">keybind = alt+enter=text:\\x1b\\r\n<\/code><\/pre>\n<p><em>Corrected 10 Oct 2026. The first version of this section said Control and Enter queues a message. That was wrong. Claude Code's key list says Control and Enter means &quot;send now&quot;. Queueing is a separate key. Still to test before teaching: what plain Enter does while a job runs, in the version the room installs (Merge Tracker, item 7).<\/em><\/p>\n<p><em>Answered 10 Oct 2026. Plain Enter does not stop the job. The message reaches Claude as soon as the current step finishes, inside the same job (Claude Code docs, &quot;When Claude Code sends what you queued&quot;). Annie saw this happen the same day. So only the queue key (Option and Enter here) waits for the whole job to end. pi works the same way. Its queue key, Alt and Enter, is built in (Control and Q on Windows). See Module 01's key table.<\/em><\/p>\n<\/section>\n<section class=\"card\" id=\"full-08c-s3\"><h2><span class=\"num\">08C.3<\/span> The Cold Test Again, for Claude Code<\/h2><p><em>10 minutes.<\/em><\/p>\n<p>Claude Code reads the same <code>CLAUDE.md<\/code> that pi read before the server work. Now prove it.<\/p>\n<ol>\n<li>Exit Claude Code: type <code>/exit<\/code>.<\/li>\n<li>Make sure the exit node is on.<\/li>\n<li>In your vault folder, type:<\/li>\n<\/ol>\n<pre><code class=\"language-bash\">claude -p &quot;Answer from your instructions only. Who am I? Give two of my rules for working with me. What must you never print?&quot;\n<\/code><\/pre>\n<p><strong>It passed if<\/strong> Claude Code gives the same answers pi gave. If Claude Code's answer is general and pi's was not, Claude Code started in a different folder.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08c-s4\"><h2><span class=\"num\">08C.4<\/span> Continuity and the Start-of-Session Hook<\/h2><p><em>15 minutes.<\/em><\/p>\n<p>Your builder starts every session with no memory of yesterday. A continuity note fixes this. It is a short &quot;where we left off&quot; note. Every session reads it first. Each entry has:<\/p>\n<ul>\n<li>the date<\/li>\n<li>what was done<\/li>\n<li>what is still in progress<\/li>\n<li>the next action<\/li>\n<\/ul>\n<p><strong>Step 1.<\/strong> Ask Claude Code:<\/p>\n<pre><code class=\"language-text\">Create Builder/CONTINUITY.md with a one-line header saying what it is. Add today's entry: what we built in Modules 08 and 08B, and my next action.\n<\/code><\/pre>\n<p><strong>Step 2. Make Claude Code read the note on its own.<\/strong><\/p>\n<p>Why this step exists:<\/p>\n<ol>\n<li>Annie's rules told her builder to read the continuity note first.<\/li>\n<li>One day she asked an urgent question. The builder answered without reading the note.<\/li>\n<li>A rule that the builder must remember can lose to an urgent question.<\/li>\n<li>The fix was a start-of-session hook. A hook is a setting that loads the note before the builder answers anything (Build Log 52).<\/li>\n<\/ol>\n<p>Ask Claude Code:<\/p>\n<pre><code class=\"language-text\">Add a SessionStart hook to ~/.claude/settings.json that prints the first 60 lines of Builder/CONTINUITY.md in my vault, so you read it at the start of every session. Back up the file first. Then show me how to test it.\n<\/code><\/pre>\n<p>To test it:<\/p>\n<ol>\n<li>Exit Claude Code.<\/li>\n<li>Start a new session.<\/li>\n<li>Ask &quot;where did we leave off?&quot;. The answer should come from the note.<\/li>\n<\/ol>\n<p>Facilitator: check the hook format against the current Claude Code hooks documentation on the day.<\/p>\n<p>pi has no hook here. pi reads the note only because <code>CLAUDE.md<\/code> tells it to. That is less reliable than a hook.<\/p>\n<p><strong>Step 3. Choose your &quot;save&quot; word.<\/strong> Add this line to <code>CLAUDE.md<\/code>: &quot;When I say 'save', add a dated entry to CONTINUITY.md, and if we built something, write the build log and its index row.&quot;<\/p>\n<p><strong>Keep the note short.<\/strong> Every session reads it, so a long note slows every session down. Annie deletes entries older than three weeks.<\/p>\n<p>Her test for where a lesson belongs: <strong>will it still matter in three weeks?<\/strong> If yes, put it in <code>CLAUDE.md<\/code> or the vault. Do not put it in the continuity note.<\/p>\n<p><strong>Read the note before you start a build.<\/strong> On 30 September 2026, two of Annie's sessions built the same fix at the same time. One was on the Mac and one was on the server. Both said they succeeded. The checking file ended up with two copies of each new check (Build Log 106). You now have two builders, so this can happen to you too.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08c-s5\"><h2><span class=\"num\">08C.5<\/span> The Build Log<\/h2><p><em>10 minutes. The Short course uses the same steps.<\/em><\/p>\n<p>A build log records one piece of work. You write it when the work is finished. You never change an old entry. You add a new one. This course comes from Annie's build logs. She has written more than 120 since May 2026.<\/p>\n<p><strong>Step 1.<\/strong> Ask your builder to:<\/p>\n<ol>\n<li>Create the folder <code>AI System/Build Logs/<\/code>.<\/li>\n<li>Create an index note called <code>0 — Build Log Index<\/code>. It has a table with four columns: number, date, title, and a one-line summary.<\/li>\n<\/ol>\n<p><strong>Step 2.<\/strong> Save this template as <code>AI System/Build Logs/_Template<\/code>:<\/p>\n<pre><code class=\"language-markdown\">---\ntype: build-log\nlog: [number]\ncreated: [date]\n---\n\n# Build Log [number]: [title]\n\n## Goal\n## What I Learned\n## What I Built\n## Proven and Not Yet Proven\n## Files Changed and Their Backups\n| File | Backup |\n|---|---|\n## Open and Next\n<\/code><\/pre>\n<p><strong>Step 3.<\/strong> Ask Claude Code to write Build Log 1 for today. It covers everything before the server work, Module 08B, and everything after it. Ask it to add the index row in the same step.<\/p>\n<p><strong>A log is not finished until its index row exists.<\/strong><\/p>\n<ul>\n<li>Some of Annie's logs had no index row for weeks. A log with no row looks the same as a log that was never written (Build Log 79).<\/li>\n<li>Two logs once got the same number, because someone picked the numbers by hand (Build Log 86).<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-08c-s6\"><h2><span class=\"num\">08C.6<\/span> The Run Card<\/h2><p><em>10 minutes. From v1. The Short course writes the same card.<\/em><\/p>\n<p>The run card is one page that sums up how to run your system. Handwriting is fine. Bring it to every later session. Write down:<\/p>\n<ul>\n<li>What your system is for, in one sentence.<\/li>\n<li>The exact start command for each builder, and the key that stops it.<\/li>\n<li>Where the files live: the vault folder, <code>CLAUDE.md<\/code>, and the bot's files on the server.<\/li>\n<li>Your daily routine from Module 08B.<\/li>\n<li>Your three rules, and how you check each one (Module 07).<\/li>\n<li>Your three golden questions, the test questions with known answers (Module 07).<\/li>\n<li>What it costs each month, and where each number came from <strong>[COST]<\/strong>.<\/li>\n<li>What to do when it does not answer: which builder still works, and how to reach the server company's website.<\/li>\n<\/ul>\n<p><strong>If you cannot write the start command from memory, write it down now.<\/strong> In a week you will need it (v1).<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08c-s7\"><h2><span class=\"num\">08C.7<\/span> Say What You Want, Not Every Step<\/h2><p><em>5 minutes. From v1, added 9 Oct 2026. Both conversations are from one of Annie's builder sessions on 9 October 2026, running Opus 5.5.<\/em><\/p>\n<p><strong>First conversation: the builder says how it understood you, before it acts.<\/strong><\/p>\n<blockquote>\n<p><strong>Annie:<\/strong> should we do C and then this? I wanted to finish previous open tasks first. and does this check the critical test like we wanted?<\/p>\n<p><strong>Builder:<\/strong> Yes: C now, then the automatic workflow. I'm reading &quot;C&quot; as &quot;keep switching models by hand&quot;. Finishing open work first makes sense, and building the automatic workflow last means it can be tested on real work.<\/p>\n<\/blockquote>\n<p>What this shows:<\/p>\n<ul>\n<li><strong>Short instructions work when you both know what they mean.<\/strong> &quot;C&quot; was an option they had already agreed on. So it needed no explanation.<\/li>\n<li><strong>The builder said how it understood &quot;C&quot; before it acted.<\/strong> If it had misunderstood, the mistake would cost one sentence, not a day of work.<\/li>\n<li><strong>A preference is a real instruction.<\/strong> &quot;I wanted to finish previous open tasks first&quot; changed the order. The builder followed it.<\/li>\n<li><strong>Ask whether it meets the test you agreed on, not whether it is good.<\/strong> &quot;Does this check the critical test like we wanted?&quot; asks for proof against a test they set earlier.<\/li>\n<\/ul>\n<p><strong>Second conversation: when you are the one who is confused.<\/strong><\/p>\n<blockquote>\n<p><strong>Annie:<\/strong> and then go 1. im getting confused on what to run but just know let's finish everything still open from the F B D and E builds and this automated workflow<\/p>\n<p><strong>Builder:<\/strong> I'll take it from here and finish all four in order. I won't ask you to choose critics this time: for Module 1 I'll run all four. Starting with Module 1.<\/p>\n<\/blockquote>\n<p>What this shows:<\/p>\n<ul>\n<li><strong>&quot;I'm getting confused&quot; is a full instruction.<\/strong> It lets the builder make the decision and continue. If you stay quiet and guess, the build moves away from what you wanted.<\/li>\n<li><strong>The builder said which decision it was making, before it made it.<\/strong> It is safe for the builder to make a choice for you when it tells you first. It is not safe when you only find out later.<\/li>\n<\/ul>\n<p><strong>What to take away.<\/strong><\/p>\n<ol>\n<li>You do not need to give step-by-step instructions.<\/li>\n<li>Say what you want, what it must not do, and how you will judge the result.<\/li>\n<li>Ask the builder to say back what it understood.<\/li>\n<li>If it cannot say it in one sentence, your instruction is not clear yet.<\/li>\n<\/ol>\n<p><em>Do not show the two screenshots of these conversations in class yet. They must first be checked against the screenshot rules, because they were not among the 54 approved edited copies.<\/em><\/p>\n<\/section>\n<section class=\"card\" id=\"full-08c-s8\"><h2><span class=\"num\">08C.8<\/span> The One Tool You Cannot Lose<\/h2><p><em>5 minutes. The Claude version's Module 01, question 3, moved here.<\/em><\/p>\n<p>Ask each student: <strong>which one tool, if it stopped working, would stop you from fixing everything else?<\/strong> Write its name on the run card.<\/p>\n<p>Annie learned this the hard way:<\/p>\n<ol>\n<li>In August 2026 she built two clever designs. They sent only some internet traffic through Singapore.<\/li>\n<li>Both designs put Tailscale in front of Claude Code.<\/li>\n<li>When Tailscale was off, Claude Code on the Mac stopped working.<\/li>\n<li>But Claude Code was the tool she used to fix everything else.<\/li>\n<li>She removed both designs the next day (Build Log 69).<\/li>\n<\/ol>\n<p>Her words: &quot;i don't ever want a situation where i can't reach claude code on my mac.&quot;<\/p>\n<p><strong>In this course, the answer is built in.<\/strong><\/p>\n<ul>\n<li>pi works when Tailscale is off, when the exit node is off, and when the server is down.<\/li>\n<li>Claude Code on the laptop needs the exit node.<\/li>\n<li>So the tool you cannot lose is pi. It does not depend on anything you built today. Keep it working.<\/li>\n<\/ul>\n<hr />\n<\/section>\n<section class=\"card\" id=\"full-08c-s9\"><h2><span class=\"num\">08C.9<\/span> From the Record<\/h2><p><strong>The rules that never loaded.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> For weeks in July 2026, Annie kept teaching her bot procedures. It kept failing to follow them. Nothing showed a problem, because every part of the setup seemed to work. In fact, its rules file had never loaded into the model, in any version of the setup. Two file links fixed it.<\/li>\n<li><strong>The lesson:<\/strong> the cold test is not a formality. It is the only proof that the AI assistant read your files.<\/li>\n<li><strong>Source:<\/strong> Build Log 32.<\/li>\n<\/ul>\n<p><strong>&quot;Tested and working&quot; was not true.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> In July 2026, the receipt automation was reported as tested and working. A separate check on the machine found six bugs. Four of them stopped it from working at all.<\/li>\n<li><strong>The lesson:<\/strong> a report of success is only a claim. Test it yourself.<\/li>\n<li><strong>Source:<\/strong> Build Log 30.<\/li>\n<\/ul>\n<p><strong>The wrong account in the right place.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> In August 2026, Annie's personal start command kept signing her in to her work account. The two accounts were set up separately, as planned. But the personal one held a work sign-in, because her browser was signed in to work when she logged in. The fix: sign out in the browser, log in again, and check which account each folder holds.<\/li>\n<li><strong>The lesson:<\/strong> when a setup looks broken, look at what is inside it before you rebuild it.<\/li>\n<li><strong>Source:<\/strong> Build Log 61.<\/li>\n<\/ul>\n<p><strong>The builder that skipped the paperwork.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> In July 2026, a builder rebuilt Annie's morning message with nobody watching. The new message met every requirement. But the builder skipped three things: the build log, the to-do list update, and one setting. It had backed up that setting but never changed it. The fix: every instruction now ends with the builder reading its checks as a checklist, and marking each one done or not done.<\/li>\n<li><strong>The lesson:<\/strong> a check that depends on goodwill gets skipped. Make it part of the process.<\/li>\n<li><strong>Source:<\/strong> Build Log 27.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-08c-s10\"><h2><span class=\"num\">08C.10<\/span> Worksheet<\/h2><h3>Full Course<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>pi installed; <code>pi --version<\/code> prints a number<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>opencode Go key entered without showing; <code>pi<\/code> starts on DeepSeek V4.1 Flash<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>CLAUDE.md<\/code> at the top of my vault, under one screen, with the five habits<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>pi cold test passed: it named me, two rules, and the never-print rule<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><em>(Module 08B finished)<\/em><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>loc=SG<\/code> with the exit node on<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Claude Code installed and signed in to my subscription<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Copy and paste work; <code>forceLoginMethod<\/code> set to <code>claudeai<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Status line shows what I chose<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>I know Escape stops, and which key queues<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Claude Code cold test passed, with the same answers as pi<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>Builder/CONTINUITY.md<\/code> exists; a new session knows where we left off<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My &quot;save&quot; word is in <code>CLAUDE.md<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Build Log 1 and its index row exist<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Run card written, including the one tool I cannot lose<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>\n<section class=\"card\" id=\"full-08c-s11\"><h2><span class=\"num\">08C.11<\/span> Teaching Notes<\/h2><ul>\n<li><strong>Cut the job down when time runs short (v1's clock rule).<\/strong>\n<ul>\n<li>Short course: at the two-hour mark, if the job is not working, make the job smaller until test 1 passes. An AI assistant that answers one question is a success. A half-built one that answers nothing is not.<\/li>\n<li>Full course: if Module 08B runs long, cut the 15 minutes of spare time first.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Never type on a student's keyboard.<\/strong> Sit beside them. Let them use their own device. If a student gets lost, you went too fast (Annie's seminar run sheet).<\/li>\n<li><strong>Entering the key is the riskiest moment for secrets.<\/strong> Watch each student paste the key into the hidden prompt. Make sure nobody pastes it into a chat or a note.<\/li>\n<li><strong>Fix the file, not the chat.<\/strong> Say this out loud two times: once while students write the instruction file, and once during the job (v1).<\/li>\n<li><strong>One job only.<\/strong> If a student starts a second build, they misunderstood the module. Tell them (v1).<\/li>\n<li><strong>Wifi.<\/strong> Every question to the AI goes over the internet. Have a phone hotspot ready (v1).<\/li>\n<li><strong>Never show a student's private files on the projector<\/strong> (v1).<\/li>\n<li><strong>Windows students:<\/strong> the course was built on a Mac. The key-entry line in &quot;Install pi and Connect opencode Go&quot; works only in a Mac's Terminal. It does not work in PowerShell. Facilitator: prepare the Windows version and test it before the course.<\/li>\n<li><strong>Developers may prefer git to dated backups.<\/strong> That is fine, if every change can be undone and the log records it.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-08c-s12\"><h2><span class=\"num\">08C.12<\/span> Not Yet Tested<\/h2><p>Nobody has run either course's build yet. These steps have never been run as written:<\/p>\n<ul>\n<li><strong>Full course:<\/strong>\n<ul>\n<li>the whole pi-first order (Annie's own test, Merge Tracker, item 6)<\/li>\n<li>the Claude Code steps after a route that pi built<\/li>\n<li>the start-of-session hook<\/li>\n<li>Annie's 10 Oct additions: terminal or desktop app, scrolling, the status line, and the Enter and Control and Enter keys (Merge Tracker, item 7)<\/li>\n<\/ul>\n<\/li>\n<li><strong>Both courses:<\/strong> the hidden key-entry line, asking pi to set its default model, and every Windows command.<\/li>\n<li><strong>Short course:<\/strong> the Gemini backup plan with saved instructions.<\/li>\n<\/ul>\n<\/section>\n<details class=\"card ref\" id=\"full-08c-s13\"><summary><span class=\"num\">08C.13<\/span> Where the Versions Went <span class=\"hint\">tap to open<\/span><\/summary><p><strong>From v1 Block 8:<\/strong> the five checks before teaching, the one-folder setup, the four fixed rules (Short), the cold test question, the one real job and its run, fix and run again cycle, the answer and refusal tests, the run card, the rule for cutting the job down when time runs short, the section on saying what you want instead of every step, and most facilitator notes.<\/p>\n<p><strong>From the Claude version's Module 10:<\/strong> the builder explanation, the install steps, three settings (now with the status line), <code>CLAUDE.md<\/code>, the cold test command, and choosing your window. Moved out: notifications and two accounts (not needed for the core build).<\/p>\n<p><strong>From the Claude version's Module 11:<\/strong> the three things you do (describe, approve, check), the five habits, the continuity note, the start-of-session hook, the &quot;save&quot; word and the build log. Moved out to the skills module (Module 11) (Pair 11): the build brief rewrite, the second opinion, and the &quot;sure and wrong&quot; list.<\/p>\n<p><strong>Moved in from other pairs:<\/strong> &quot;Same model, different program&quot; (from Pair 4) is in Module 08B, because it needs the bot. The Claude version's Module 01 question 3 is now &quot;The One Tool You Cannot Lose&quot;.<\/p>\n<p><strong>Added by Annie, 10 Oct 2026:<\/strong> terminal or Ghostty instead of the desktop app; scrolling; copy and paste set up by pi; the status line items; Enter steers, Control and Enter queues. Later the same day: the plain-words rewrite of this module; pi described as a way to connect to many models, including the bot's brain.<\/p>\n<p><strong>Errors fixed:<\/strong><\/p>\n<ul>\n<li>v1 had no <code>CLAUDE.md<\/code> step. The Full course now writes one <code>CLAUDE.md<\/code> that both builders read. The Short course uses <code>AGENTS.md<\/code>.<\/li>\n<li>v1's timing did not work: its Route C time came out of the two tests. The Short course has no server route, and the tests keep their 15 minutes.<\/li>\n<li>v1's numbering (1, 2, 2, 3, 4), the Log 38 story told twice, the missing minutes for the section on saying what you want, and the 30 June story with no source (now cited to Seminar Ideas, 30 Jun 2026).<\/li>\n<li>v1 said &quot;no card details&quot; and also &quot;one paid thing&quot;. The module now says plainly: opencode Go is the one paid thing in the Short course.<\/li>\n<li>v1's Route B (Telegram on the laptop) is dropped, because neither version had its steps.<\/li>\n<li>Wording: &quot;the safety net&quot;, &quot;holding the same thread&quot;, &quot;Confusion is data, not failure&quot;, &quot;Usually is not a promise&quot; and &quot;The machine is the ground truth&quot; are rewritten as plain sentences. No prose em dashes.<\/li>\n<li>The Claude version's VPN gap is gone in the Full course. No paid VPN is used, and pi builds the route because pi does not need one.<\/li>\n<li>10 Oct 2026: the paragraph &quot;A Claude plan does not cover pi&quot; was removed at Annie's request. Its source (Build Log 103) is still listed below for the other facts it supports.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"full-08c-s14\"><summary><span class=\"num\">08C.14<\/span> Sources <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>Build Log 00: version 2 started with one automation.<\/li>\n<li>Build Log 01: copy and paste; stop versus copy.<\/li>\n<li>Build Log 03: the instruction file as a short note that points elsewhere.<\/li>\n<li>Build Log 04: look before you build.<\/li>\n<li>Build Log 08: the founding document in the wrong folder.<\/li>\n<li>Build Log 26: advice is not a fix.<\/li>\n<li>Build Log 27: the skipped paperwork.<\/li>\n<li>Build Log 30: six bugs in &quot;tested and working&quot;.<\/li>\n<li>Build Log 32: the rules file that never loaded.<\/li>\n<li>Build Log 33: three rounds of fixes.<\/li>\n<li>Build Log 38: the calendar overlap check moved into a script.<\/li>\n<li>Build Log 46: the files make it &quot;my Claude&quot;; per-use charges to the wrong account.<\/li>\n<li>Build Log 47: the import line caught by a cold test.<\/li>\n<li>Build Log 52: the start-of-session hook.<\/li>\n<li>Build Log 61: the wrong account in the browser.<\/li>\n<li>Build Log 69: the routing designs that put Tailscale in front of Claude Code.<\/li>\n<li>Build Logs 79 and 86: missing index rows; duplicate numbers.<\/li>\n<li>Build Log 92: undo in about a minute.<\/li>\n<li>Build Log 94: proven and not yet proven.<\/li>\n<li>Build Logs 96 and 104: colons in file names.<\/li>\n<li>Build Log 103: pi on opencode Go from Hong Kong; keys shown on screen.<\/li>\n<li>Build Log 106: two sessions on one job.<\/li>\n<li>pi's own help text and Annie's pi settings, read on her Mac on 10 Oct 2026: <code>OPENCODE_API_KEY<\/code>, <code>-p<\/code>, <code>--no-session<\/code>, <code>AGENTS.md<\/code> and <code>CLAUDE.md<\/code> loading, default provider and model.<\/li>\n<li>opencode Go's model list, read through pi on Annie's Mac on 10 Oct 2026: includes <code>deepseek-v4.1-flash<\/code> and <code>kimi-k3<\/code>.<\/li>\n<li>The bots' settings on the server, read 10 Oct 2026: all three use provider <code>opencode-go<\/code> and model <code>deepseek-v4.1-flash<\/code>.<\/li>\n<li>pi.dev, seen 2 Oct 2026: install commands.<\/li>\n<li>Claude Code documentation, &quot;Run Claude Code programmatically&quot;, seen 2 Oct 2026.<\/li>\n<li>Seminar Ideas, 30 Jun 2026 (&quot;I can't&quot; meant &quot;not from this folder&quot;) and 2 Jul 2026 (the lab notebook).<\/li>\n<li>Seminar Starter Kit, file 03: chat versus builder.<\/li>\n<li>&quot;Why The Harness You Choose Matters&quot; note, 29 Sep 2026.<\/li>\n<li>How to Build Your Own Claudith guide, Part 5: golden questions asked two times.<\/li>\n<li>Annie, 10 Oct 2026: pi-first order; window, scrolling, status line and queue-key additions; plain-words register; pi described as the way to connect to many models.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"full-08c-s15\"><summary><span class=\"num\">08C.15<\/span> Related <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>07 — Rules of Engagement (Merged)<\/li>\n<li>08B — The Server and Your Bot (Merged)<\/li>\n<li>01 — What Works From Hong Kong (Merged)<\/li>\n<li>01 — Merge Tracker (Decisions, Hours, Checks)<\/li>\n<li>00 — Side-by-Side (9 Oct 2026) (Pair 8)<\/li>\n<\/ul>\n<\/details>", "count": 15}, {"id": "full-09", "label": "09", "title": "Module 09: Script, Machine Learning or AI Judgement", "minutes": 45, "read": 21, "toc": [["full-09-s1", "09.1", "What You Will Leave With"], ["full-09-s2", "09.2", "Before This Module"], ["full-09-s3", "09.3", "One Question for Every Step"], ["full-09-s4", "09.4", "Four Ways a Step Can Be Done"], ["full-09-s5", "09.5", "Mark Your Process Maps"], ["full-09-s6", "09.6", "Why AI Flatters, Guesses and Cannot Count"], ["full-09-s7", "09.7", "When the Model Keeps Getting It Wrong"], ["full-09-s8", "09.8", "Write Build Brief 1"], ["full-09-s9", "09.9", "Homework: Which Judgement Model for Which Job"], ["full-09-s10", "09.10", "From the Record"], ["full-09-s11", "09.11", "Worksheet: Build Brief 1"], ["full-09-s12", "09.12", "Teaching Notes"]], "body": "<div class=\"intro\"><p><strong>Why this module comes after the build.<\/strong><\/p>\n<ol>\n<li>Students have now used an AI assistant. They have seen it answer, and some have seen it get things wrong.<\/li>\n<li>The second half of this module explains what to do when a model keeps getting a step wrong. That only makes sense after a student has seen a failure.<\/li>\n<li>The first automation is built in Module 11. So students still decide who or what does each step before anything is automated.<\/li>\n<\/ol>\n<\/div>\n<section class=\"card\" id=\"full-09-s1\"><h2><span class=\"num\">09.1<\/span> What You Will Leave With<\/h2><p><strong>Both courses:<\/strong><\/p>\n<ul>\n<li>Your Process Maps from Module 05, with a coloured dot on every step.<\/li>\n<li>Each dot says who or what does that step: a script, a single-task model, a judgement model or a person.<\/li>\n<li>Your best candidate for a first automation, circled on the map.<\/li>\n<\/ul>\n<p><strong>Full course only:<\/strong><\/p>\n<ul>\n<li><strong>Build Brief 1.<\/strong> This is one page that describes your first automation. It says:\n<ul>\n<li>what starts it<\/li>\n<li>what each step is, and who checks it<\/li>\n<li>what it must never do<\/li>\n<li>how you will know it worked<\/li>\n<\/ul>\n<\/li>\n<li>In Module 11 your builder (pi or Claude Code) builds it from this brief.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-09-s2\"><h2><span class=\"num\">09.2<\/span> Before This Module<\/h2><ul>\n<li><strong>Your Process Maps from Module 05.<\/strong> In the Short course, this may be one map, because process two was homework.<\/li>\n<li><strong>Your Data Map from Module 02.<\/strong> Some steps will be ruled out by it.<\/li>\n<li><strong>Dot stickers in four colours,<\/strong> or four coloured pens. The facilitator supplies these.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-09-s3\"><h2><span class=\"num\">09.3<\/span> One Question for Every Step<\/h2><p>Look at each step on your map. Ask one question: <strong>does this step have a right answer?<\/strong><\/p>\n<p><strong>If it has a right answer, a script should do it.<\/strong> Examples of a right answer:<\/p>\n<ul>\n<li>a time<\/li>\n<li>a total<\/li>\n<li>a date<\/li>\n<li>a file name<\/li>\n<li>whether two appointments overlap<\/li>\n<\/ul>\n<p>A script gives the same answer every time. It costs nothing to run.<\/p>\n<p><strong>If the step depends on context, it needs an AI model.<\/strong> Examples:<\/p>\n<ul>\n<li>&quot;is this email urgent?&quot;<\/li>\n<li>&quot;which of these ideas matters most?&quot;<\/li>\n<\/ul>\n<p><strong>Annie's system shows how far this goes.<\/strong> On 2 October 2026 her server ran 26 scheduled jobs (live server check, 2 Oct 2026).<\/p>\n<ul>\n<li>23 of them were plain scripts. They never call an AI model.<\/li>\n<li>They include the vault sync, backups, the morning brief, the weather plan, reminders, the watchdog and the monthly cost report.<\/li>\n<li>Only 3 jobs hand work to the bot's model. Those need real judgement about what is new and relevant.<\/li>\n<\/ul>\n<p><strong>The money follows the same rule.<\/strong> Annie moved routine work from the AI model to scripts. Her token spending fell from $29.05 in July 2026 to $2.79 in August (Build Log 36).<\/p>\n<\/section>\n<section class=\"card\" id=\"full-09-s4\"><h2><span class=\"num\">09.4<\/span> Four Ways a Step Can Be Done<\/h2><p>Every step on your map is done by one of four things: a script, a single-task model, a judgement model or a person.<\/p>\n<p><strong>Script.<\/strong><\/p>\n<ul>\n<li>What it is: code that follows fixed steps.<\/li>\n<li>Good for: anything with a right answer. Times, counts, renames, overlaps and file moves.<\/li>\n<li>Annie's examples: the weather planner, the receipt scan and rename, the watchdog's checks, the overlap checker.<\/li>\n<li>Cost per run: $0.<\/li>\n<\/ul>\n<p><strong>Single-task model<\/strong> (machine learning).<\/p>\n<ul>\n<li>What it is: a small AI model trained to do one job only.<\/li>\n<li>Good for: turning messy input into data. Speech to text, reading a photo, sorting into a category.<\/li>\n<li>Annie's examples: voice notes transcribed on the server (Build Log 62), and an 80-minute talk transcribed on the Mac with no internet (Build Log 81).<\/li>\n<li>Cost per run: very small, or $0 if it runs on your own machine.<\/li>\n<\/ul>\n<p><strong>Judgement model<\/strong> (a large language model).<\/p>\n<ul>\n<li>What it is: a general AI model that reads and writes.<\/li>\n<li>Good for: decisions that depend on context, and writing in a voice.<\/li>\n<li>Annie's examples: grading a learning answer; finding the week's most useful idea; drafting a reply; the nightly filing job, which decides which folder each note belongs in (Build Logs 62 and 94).<\/li>\n<li>Cost per run: cents, and more for top models.<\/li>\n<\/ul>\n<p><strong>Person.<\/strong><\/p>\n<ul>\n<li>What it is: you, or someone you trust.<\/li>\n<li>Good for: approvals, anything that reaches another person, and sensitive submissions.<\/li>\n<li>Annie's examples: sending any email; submitting an insurance claim.<\/li>\n<li>Cost per run: your time.<\/li>\n<\/ul>\n<p><strong>The single-task model is the one people forget.<\/strong> It sits between a script and a full AI model.<\/p>\n<ul>\n<li>Annie's laptop turned an 80-minute recorded talk into 14,427 words of text.<\/li>\n<li>It used a free speech-to-text program called whisper.cpp.<\/li>\n<li>Nothing left the machine. So it needed no VPN and no account (Build Log 81).<\/li>\n<li>Her server transcribes voice notes sent to the bot in the same way (Build Log 62).<\/li>\n<\/ul>\n<p><strong>Keep a person on any step where a silent failure would touch sensitive data.<\/strong> Annie wanted her bot to file insurance claims from start to finish. The decision in May 2026 was this (Hermes Master Doc, 30 May 2026):<\/p>\n<ul>\n<li>The bot finds the receipt, downloads it and tells her.<\/li>\n<li>She submits the claim herself.<\/li>\n<li>The reason: insurers' websites block automated browsers, and a failure there could go unnoticed.<\/li>\n<\/ul>\n<p><strong>A scheduled job should not wake the AI just to ask you something.<\/strong> Annie's rule from day one: scheduled jobs are scripts, or scripts that hand a small task to a cheap model. Her first bot ended partly because AI prompts ran on timers and billed a paid account every day (How to Build Your Own Claudith guide, Part 1). If you want judgement, make it something you ask for when you need it.<\/p>\n<p><strong>Annie wrote this down as three cost levels for her bot's jobs in June 2026 (Build Log 15):<\/strong><\/p>\n<ol>\n<li><strong>Level 1: a plain script, with no AI.<\/strong> This is the cheapest, and it is the default.<\/li>\n<li><strong>Level 2: a script plus a small, cheap model.<\/strong> This is for light formatting and reading.<\/li>\n<li><strong>Level 3: the good, expensive model.<\/strong> This is for live conversation with Annie only.<\/li>\n<\/ol>\n<p>Scheduled jobs use Level 1 or Level 2. They never run the expensive model on a timer. The same log adds a second rule. Heavy building belongs on the powerful, expensive builder, because that is where the real work happens. The bot's job is to be reachable on the phone, so a cheap model is the right choice for it.<\/p>\n<p><strong>Where judgement is needed, let a script do the work around it.<\/strong> Annie's weekly idea job (Phoebe) needs real judgement. It runs in three steps (live server check, 2 Oct 2026):<\/p>\n<ol>\n<li>A script gathers the build logs and notes first, with no AI.<\/li>\n<li>Only then does it call Claude to think.<\/li>\n<li>Afterwards, the script checks that the weekly note actually exists before it reports success.<\/li>\n<\/ol>\n<h3>Practice: Sort Eight Example Steps<\/h3>\n<p>The facilitator hands out eight example steps, one per card. Decide whether each one is done by a script, a single-task model, a judgement model or a person. Then compare with a partner.<\/p>\n<ol>\n<li>Check whether a 3 pm call clashes with anything on your calendar.<\/li>\n<li>Rename a downloaded PDF to 15 characters or fewer.<\/li>\n<li>Turn a voice note into text.<\/li>\n<li>Decide which of this week's ten ideas is most worth your time.<\/li>\n<li>Send a reply to a client.<\/li>\n<li>Count how many items are in your storage inventory.<\/li>\n<li>Read a photo of a warranty card and pull out the serial number.<\/li>\n<li>Decide whether an email from your child's school needs action today.<\/li>\n<\/ol>\n<p><strong>Suggested answers.<\/strong><\/p>\n<ul>\n<li>Script: 1, 2 and 6.<\/li>\n<li>Single-task model: 3 and 7.<\/li>\n<li>Judgement model: 4 and 8.<\/li>\n<li>Person: 5.<\/li>\n<\/ul>\n<p>Step 8 can move towards a script if the school uses the same subject lines every time.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-09-s5\"><h2><span class=\"num\">09.5<\/span> Mark Your Process Maps<\/h2><p>Put one coloured dot on every step of your maps. The colour says who or what does that step.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Dot<\/th>\n<th>Who or what does the step<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Green<\/td>\n<td>Script<\/td>\n<\/tr>\n<tr>\n<td>Blue<\/td>\n<td>Single-task model<\/td>\n<\/tr>\n<tr>\n<td>Red<\/td>\n<td>Judgement model<\/td>\n<\/tr>\n<tr>\n<td>Black<\/td>\n<td>Person<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Question every red dot.<\/strong> A red dot means you marked the step for a judgement model. For each one, ask: could a script do this if it were given the right facts? Two of Annie's examples:<\/p>\n<ul>\n<li>Her overlap check started as a judgement step. It became a script (Build Log 38).<\/li>\n<li>Her storage photos started with an AI description. They ended with none, because she preferred her own words (Build Log 52).<\/li>\n<\/ul>\n<p><strong>Mark what the model needs to be told.<\/strong> Beside every red dot, write the facts a script should hand the model first.<\/p>\n<ul>\n<li>In July 2026 Annie's bot invented an answer about which class slot suited her son.<\/li>\n<li>It had no nap times and no rules to check against.<\/li>\n<li>The fix supplied the facts and a numbered checking procedure.<\/li>\n<li>Then the bot was tested against an answer worked out separately (Build Log 33).<\/li>\n<\/ul>\n<p><strong>Then circle your best candidate for a first automation.<\/strong> A good first candidate:<\/p>\n<ul>\n<li>has a clear trigger<\/li>\n<li>is mostly green dots, which means mostly script steps<\/li>\n<li>happens at least weekly<\/li>\n<li>causes small harm if it goes wrong<\/li>\n<li>uses only Tier 1 (open) or Tier 2 (personal) information from your Data Map<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-09-s6\"><h2><span class=\"num\">09.6<\/span> Why AI Flatters, Guesses and Cannot Count<\/h2><p><em>Full course segment.<\/em><\/p>\n<p>Annie worked this out in a learning session on 17 September 2026 (Build Log 81).<\/p>\n<ul>\n<li>AI models are tuned by people choosing which answers they prefer.<\/li>\n<li>So the model learns to be liked, not to be right.<\/li>\n<li>Her line: &quot;they are not training the model that what they like is what is right&quot;.<\/li>\n<\/ul>\n<p>Three habits follow from that one fact.<\/p>\n<ol>\n<li><strong>It agrees with you too easily,<\/strong> because agreement is liked.<\/li>\n<li><strong>It sounds sure when it is guessing,<\/strong> because sure answers are preferred, and the people rating them cannot check every fact.<\/li>\n<li><strong>It hands you the answer at once,<\/strong> because instant help feels good. This happens even when you needed to work it out yourself.<\/li>\n<\/ol>\n<p><strong>Never ask a model to count.<\/strong><\/p>\n<ul>\n<li>In September 2026 two of Annie's bots gave different totals for the same storage inventory.<\/li>\n<li>One said 184 items. The other said 158.<\/li>\n<li>The true number was 184.<\/li>\n<li>Neither bot should have been counting. The exact total already existed in a note that code rebuilds on every change.<\/li>\n<li>The fix pointed both bots at that number (Build Log 80; the figure 158 is from Seminar Ideas).<\/li>\n<\/ul>\n<p>The lesson is not &quot;pick the model that counts better&quot;. Anything that must be exact comes from code. That includes counts, lists, totals and dates. The model only puts the result into words.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-09-s7\"><h2><span class=\"num\">09.7<\/span> When the Model Keeps Getting It Wrong<\/h2><p><em>Full course segment.<\/em><\/p>\n<p><strong>Rewriting the instruction rarely fixes a mechanical mistake for good.<\/strong> Annie's builds use five ways to fix it instead, from weakest to strongest. Each one replaces a request with something that cannot go another way (Build Logs 38, 42, 43, 50 and 52).<\/p>\n<ol>\n<li><strong>A written instruction, with the exact failing case as an example.<\/strong> A worked example works better than a general rule.<\/li>\n<li><strong>Code does the calculation, and the model reads the result.<\/strong> The calendar overlap check moved into a command.<\/li>\n<li><strong>Code accepts whatever the model does.<\/strong> The model's edits once broke a script. The script now accepts both file shapes.<\/li>\n<li><strong>A guard blocks the wrong action.<\/strong> One bot cannot edit protected files at all.<\/li>\n<li><strong>The model is taken out of the step.<\/strong> Photos sent to the storage bot are filed by code before the model ever wakes up.<\/li>\n<\/ol>\n<p>Annie's summary from Build Log 50: an instruction is a request the model can decline, and a guard cannot be declined.<\/p>\n<p><strong>Taking the AI out moves the bugs into plain code.<\/strong> In September 2026 the storage bot showed &quot;typing&quot; all day and never replied (Build Log 100).<\/p>\n<ul>\n<li>Annie swapped the AI model. Nothing changed, because that step used no model at all.<\/li>\n<li>The real cause was one wrong word in a script.<\/li>\n<li>The script crashed on its first line. Its error messages were switched off, so it stopped without telling anyone.<\/li>\n<li>The fix was one line.<\/li>\n<\/ul>\n<p>The lesson: read the logs before you blame the model. Never switch off a script's errors.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-09-s8\"><h2><span class=\"num\">09.8<\/span> Write Build Brief 1<\/h2><p><em>Full course segment.<\/em><\/p>\n<p><strong>A build brief is one page.<\/strong> It tells the builder what to build and how you will judge it. Annie has used this method since July 2026 (Build Log 27; Build Briefs README).<\/p>\n<ol>\n<li>One session writes the brief and its checks.<\/li>\n<li>A builder works from it.<\/li>\n<li>She judges the result against the checks she wrote first.<\/li>\n<\/ol>\n<p><strong>Two rules come from her experience.<\/strong><\/p>\n<ul>\n<li><strong>You write the definition of done, and the builder may not change it.<\/strong> Otherwise the builder can &quot;pass&quot; by moving the target.<\/li>\n<li><strong>Decisions live in the written brief, not in a conversation.<\/strong> In July 2026 Annie's bot agreed at 7:37 am that a weather tool would be all script, with no AI. By that afternoon, the notes it wrote for itself had brought back an AI job on a timer. A separate review of the design caught it before the 6 pm build (Seminar Ideas, 15 Jul 2026).<\/li>\n<\/ul>\n<p><strong>Name who checks every step.<\/strong> This is the column v1 called &quot;Who verifies it?&quot;. The step that does the work should not be the only thing that checks it. For example, Annie's watchdog repairs one kind of broken link. After each repair it runs its own check again, and it reports a fix only if that check passes (Build Log 88). Module 10 covers this in full.<\/p>\n<p><strong>Find the step that would cost you most if it failed without anyone noticing.<\/strong> Give that step its own check first (from v1).<\/p>\n<p>Fill in the template in the worksheet below. Keep it to one page.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-09-s9\"><h2><span class=\"num\">09.9<\/span> Homework: Which Judgement Model for Which Job<\/h2><p><em>Full course, read at home. No class time.<\/em><\/p>\n<p><strong>Model quality changes month to month.<\/strong> This list is about the method, not a fixed ranking. Test models for yourself. These defaults come from v1's research of 29 Sep 2026.<\/p>\n<ul>\n<li><strong>Reasoning and careful analysis:<\/strong> a top model, or DeepSeek V4 Pro. DeepSeek's V4 models use the MIT licence. The Pro model is the strongest open-weight choice with independent evidence.<\/li>\n<li><strong>Writing and long documents:<\/strong> test two models. Do not assume. Voice matters more than test scores. Annie runs separate models for different writing styles for this reason.<\/li>\n<li><strong>Coding:<\/strong> a top model, or a model made for coding. Coding rewards raw ability more than most jobs do.<\/li>\n<li><strong>Cheap bulk work<\/strong> (sorting, filing, summarising): a small, cheap, fast model. Most of the cost is here, and the small model is usually good enough.<\/li>\n<li><strong>Reading photos:<\/strong> a model that can see images. Check that it really accepts images. A text-only model asked to read a photo will fail or invent an answer.<\/li>\n<li><strong>The widest range from one company:<\/strong> Qwen. It has the most models of the four open-weight makers (DeepSeek, Qwen, GLM and Kimi).<\/li>\n<li><strong>Jobs that run all the time:<\/strong> something cheap that is easy to reach. Do not put an expensive top model behind a job that runs every five minutes.<\/li>\n<\/ul>\n<p><strong>The question to ask is not &quot;which model is best?&quot;<\/strong> Ask: which model is right for this job, and what does it cost when it runs a thousand times?<\/p>\n<\/section>\n<section class=\"card\" id=\"full-09-s10\"><h2><span class=\"num\">09.10<\/span> From the Record<\/h2><p><strong>The cheap model that pretended.<\/strong> In May 2026 Annie's first bot ran on a cheaper open model (Build Logs 00 and 25; Annie's notes, 29 Sep 2026).<\/p>\n<ul>\n<li>It chatted well.<\/li>\n<li>It also said tasks were done when they were not.<\/li>\n<li>It wrote broken tools of its own instead of using the ones it had.<\/li>\n<li>It only added things to the calendar when given an exact command.<\/li>\n<li>Moving to Claude fixed it. The hidden cost was about a week of research, plus 13 logged hours of clean-up.<\/li>\n<li>By late September 2026 all three of Annie's bots ran well on a cheap DeepSeek model. By then the tools and guards around it were built.<\/li>\n<\/ul>\n<p>The lesson: test a model on the actions you need. Check what it touched, not what it says.<\/p>\n<p><strong>The overlap the bot could not see.<\/strong> In July 2026 Annie's bot kept saying a 9:15 to 10:15 class was free on a Friday (Build Log 38).<\/p>\n<ul>\n<li>Her son had an appointment from 9:45 to 10:30.<\/li>\n<li>The bot compared start times only, so it saw no problem.<\/li>\n<li>The fix was one rule that a script now applies to every slot. Two times clash if the first starts before the second ends, and ends after the second starts.<\/li>\n<\/ul>\n<p>The lesson: &quot;it checked&quot; and &quot;it checked correctly&quot; are different claims.<\/p>\n<p><strong>The grader that said &quot;exactly it&quot;.<\/strong> In August 2026 Annie's learning bot graded her answer to a question about who approves AI at a bank (Build Log 56).<\/p>\n<ul>\n<li>She named the chief executive, the finance chief and the board.<\/li>\n<li>The answer key named risk, security, legal and the data owner.<\/li>\n<li>The bot replied &quot;That's exactly it&quot;.<\/li>\n<li>Its log showed one model call and zero tool calls. So it had also saved nothing.<\/li>\n<li>Fixing the saving first would have recorded false passes. So the grading moved to Claude Code first.<\/li>\n<\/ul>\n<p>The lesson: a cheap model can be fine at sending and filing, and still too soft to judge. Fix the judgement before you fix the step that records it.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-09-s11\"><h2><span class=\"num\">09.11<\/span> Worksheet: Build Brief 1<\/h2><p><em>Full course.<\/em> Save this as <code>Build Brief 1 — &lt;name&gt;<\/code> in your vault's <code>AI System<\/code> folder.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Section<\/th>\n<th>My answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Goal<\/strong> (one plain paragraph: which chore disappears)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Trigger<\/strong> (what arrives, or what time)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Steps, each with who or what does it<\/strong><\/td>\n<td>1. ___ (script) 2. ___ (script) 3. ___ (judgement) ...<\/td>\n<\/tr>\n<tr>\n<td><strong>Who checks each step<\/strong> (a name, a script or a second check, never &quot;the step itself&quot;)<\/td>\n<td>1. ___ 2. ___ 3. ___<\/td>\n<\/tr>\n<tr>\n<td><strong>The step that would cost most if it failed unnoticed, and its own check<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Facts code must give the model<\/strong> (for every judgement step)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Information involved, and its Data Map tier<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Must never do<\/strong><\/td>\n<td>For example: send anything to another person; delete anything; touch Tier 3 (never) information<\/td>\n<\/tr>\n<tr>\n<td><strong>Needs my approval before<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Done-signal<\/strong> (how I know it worked, without checking by hand)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Acceptance checks<\/strong> (written now, never changed by the builder)<\/td>\n<td>1. 2. 3.<\/td>\n<\/tr>\n<tr>\n<td><strong>How I check it in two minutes<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>How to undo it<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Keep-or-kill date<\/strong> (two weeks after it goes live)<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>\n<section class=\"card\" id=\"full-09-s12\"><h2><span class=\"num\">09.12<\/span> Teaching Notes<\/h2><ul>\n<li><strong>Most students over-use AI on their first pass.<\/strong> Expect too many red dots (steps marked for a judgement model). The facilitator's main job here is to ask: &quot;could a script do this if it had the facts?&quot;<\/li>\n<li><strong>&quot;Machine learning&quot; confuses people.<\/strong> Explain it as a model trained for one narrow job, such as reading speech or photos. It does not reason. It turns messy input into data.<\/li>\n<li><strong>Developers in the room will move fast.<\/strong> Ask them to help a neighbour mark red dots (judgement model steps), not to start coding.<\/li>\n<li><strong>Do not promise that any model will behave.<\/strong> The point of sorting the steps is that the important ones do not depend on how a model behaves.<\/li>\n<li><strong>Three students at most.<\/strong> Check each student's red dots (judgement model steps) beside them while they mark their maps.<\/li>\n<li><strong>Timing risk: the brief takes longer than students expect.<\/strong> If time runs short, the goal, trigger, steps, who checks each step and the done-signal (how you know it worked) are the minimum. The rest can be homework.<\/li>\n<\/ul>\n<\/section>\n<details class=\"card ref\" id=\"full-09-s13\"><summary><span class=\"num\">09.13<\/span> Where the Two Versions Went <span class=\"hint\">tap to open<\/span><\/summary><p><strong>Kept from the Claude version:<\/strong><\/p>\n<ul>\n<li>the question &quot;does this step have a right answer?&quot;<\/li>\n<li>the four ways a step can be done, including a person<\/li>\n<li>the eight example steps to sort<\/li>\n<li>a coloured dot on every step of the process maps, for who or what does it<\/li>\n<li>why AI flatters, guesses and cannot count<\/li>\n<li>the five ways to fix a step the model keeps getting wrong<\/li>\n<li>Build Brief 1, the one-page plan for the first automation, and its worksheet<\/li>\n<li>all three stories in From the Record<\/li>\n<\/ul>\n<p><strong>Kept from v1:<\/strong><\/p>\n<ul>\n<li>the &quot;Who verifies it?&quot; column, now the &quot;Who checks each step&quot; row in the brief<\/li>\n<li>the question about which step would cost most if it failed unnoticed<\/li>\n<li>the Log 15 story, told as the three cost levels for Annie's bot jobs: a plain script, a script plus a cheap model, and the expensive model (from v1 Block 1, moved here in Pair 1)<\/li>\n<li>the &quot;Which model for what&quot; table, which says which model suits which job, as homework reading (from v1 Block 1, moved here in Pair 1)<\/li>\n<\/ul>\n<p><strong>Moved to the module on what breaks (Module 10) and how you would know (Module 10) (Pair 10):<\/strong><\/p>\n<ul>\n<li>v1's Rules 1 and 2: check the thing produced, not the report, and the thing that does the work must not be the only thing that checks it<\/li>\n<li>v1's eight-row table of jobs that reported success they did not have<\/li>\n<li>v1's From the Record stories (Logs 04, 25, 30, 37, 42, 43, 45, 51, 84, 88 and 90)<\/li>\n<li>v1's cost table, which multiplies cost per run by runs per day and days per year, and the company-watch story (92 credits down to 21)<\/li>\n<\/ul>\n<p><strong>Dropped from v1:<\/strong><\/p>\n<ul>\n<li><strong>The three engines (script, machine learning and large language model) and the seven-step decision tree of yes-or-no questions.<\/strong> The question &quot;does this step have a right answer?&quot; and the four ways a step can be done teach the same choice in less time.<\/li>\n<li><strong>The worked-examples table.<\/strong> Each of the four ways now carries Annie's examples.<\/li>\n<li><strong>The exercise columns &quot;cost per run&quot; and &quot;runs per year&quot;.<\/strong> Students have no price list to work from. Cost comes back in Pair 10.<\/li>\n<\/ul>\n<p><strong>Changed:<\/strong><\/p>\n<ul>\n<li><strong>The module sits after the build in both courses.<\/strong> This was the placement Annie agreed on 10 Oct 2026. The Claude version placed it before the build.<\/li>\n<li><strong>&quot;Pattern model&quot; is now &quot;single-task model&quot;.<\/strong> It says what the model does: one job only, such as turning speech into text. &quot;Skill&quot; was considered and not used, because Module 11 uses &quot;skill&quot; for an instruction file the AI assistant follows. Annie chose this on 10 Oct 2026.<\/li>\n<li><strong>The &quot;ladder&quot; is now &quot;five ways to fix a step the model keeps getting wrong, from weakest to strongest&quot;.<\/strong> This removes a metaphor. The five steps are unchanged.<\/li>\n<li><strong>The Short course gets a five-row Build Brief as homework.<\/strong> It has the goal, the trigger, the steps with who or what does each one, who checks each step, and the done-signal. Annie agreed on 10 Oct 2026, so that Module 11 has a written brief to build from in both courses.<\/li>\n<li><strong>The Short course runs 25 minutes:<\/strong> the question &quot;does this step have a right answer?&quot;, the four ways a step can be done, the eight example steps and a coloured dot on every step of the maps. Annie chose this on 10 Oct 2026. v1's short version dropped the whole block.<\/li>\n<\/ul>\n<p><strong>Errors fixed:<\/strong><\/p>\n<ul>\n<li><strong>The nightly filing job is a judgement model, not a single-task model<\/strong> (the Claude version called it a &quot;pattern model&quot;). Build Log 62 records &quot;inbox-sorter LLM 403/quota&quot;. Build Log 94 says &quot;both its models were invalid&quot;. The Claude version listed it as a single-task model.<\/li>\n<li><strong>The watchdog's check count is gone.<\/strong> The Claude version said 18, from a live count on 2 Oct 2026. Build Log 97 records 14 on 29 Sep. The number changes too often to print.<\/li>\n<li><strong>The figure 158 is cited to Seminar Ideas.<\/strong> Build Log 80 records the true total of 184, but not the wrong one.<\/li>\n<li><strong>The clash story uses the times in Build Log 38:<\/strong> class 9:15 to 10:15, appointment 9:45 to 10:30. v1 had the order backwards.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"full-09-s14\"><summary><span class=\"num\">09.14<\/span> Sources <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>Hermes Master Doc, 30 May 2026: claims stay manual.<\/li>\n<li>How to Build Your Own Claudith guide, Part 1: keep scheduled jobs simple.<\/li>\n<li>Build Logs 00 and 25: the cheap model that failed at doing.<\/li>\n<li>Build Log 15: the three cost levels for bot jobs (plain script, script plus cheap model, expensive model); heavy building on the powerful builder, delivery on the cheap bot.<\/li>\n<li>Build Log 27 and the Build Briefs README: the brief method.<\/li>\n<li>Build Log 33: supplying facts and a procedure.<\/li>\n<li>Build Log 36: token spending, July against August.<\/li>\n<li>Build Logs 38, 42, 43, 50 and 52: the five ways to fix a step.<\/li>\n<li>Build Log 56: the soft grader.<\/li>\n<li>Build Log 62: voice transcription on the server; the filing job's model call.<\/li>\n<li>Build Log 80: never let the model count.<\/li>\n<li>Build Log 81: local transcription; why models flatter.<\/li>\n<li>Build Log 88: the watchdog checks its own repair.<\/li>\n<li>Build Log 94: the filing job's two models.<\/li>\n<li>Build Log 100: the silent script crash.<\/li>\n<li>Seminar Ideas, 15 Jul 2026: the design that drifted.<\/li>\n<li>Seminar Ideas: the wrong count of 158.<\/li>\n<li>v1 Block 1, &quot;Which model for what&quot;, research of 29 Sep 2026.<\/li>\n<li>Live server check, 2 Oct 2026: 23 of 26 jobs are scripts; how Phoebe uses Claude.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"full-09-s15\"><summary><span class=\"num\">09.15<\/span> Related <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>05 — Your Processes on Paper (Merged)<\/li>\n<li>02 — Privacy, Security and Whose Law Reaches Your Data (Merged)<\/li>\n<li>08 — The Build (Merged)<\/li>\n<li>01 — Merge Tracker (Decisions, Hours, Checks)<\/li>\n<li>00 — Side-by-Side (9 Oct 2026) (Pair 9)<\/li>\n<\/ul>\n<\/details>", "count": 15}, {"id": "full-10", "label": "10", "title": "Module 10: What Breaks, and Keeping It Honest", "minutes": 50, "read": 24, "toc": [["full-10-s1", "10.1", "What You Will Leave With"], ["full-10-s2", "10.2", "Before This Module"], ["full-10-s3", "10.3", "The Three Ways a System Fails"], ["full-10-s4", "10.4", "Make a Backup and Restore One File"], ["full-10-s5", "10.5", "Choose Your Checks"], ["full-10-s6", "10.6", "Break It on Purpose"], ["full-10-s7", "10.7", "Set a Spending Cap"], ["full-10-s8", "10.8", "From the Record"], ["full-10-s9", "10.9", "Worksheet: Keeping It Honest"], ["full-10-s10", "10.10", "Teaching Notes"]], "body": "<div class=\"intro\"><p><strong>Why this module comes here.<\/strong><\/p>\n<ol>\n<li>Students now own a system that can break. In the Full course it is a bot on a server (Module 08B). In the Short course it is an AI assistant on a laptop (Module 08).<\/li>\n<li>The first automation is built in Module 11. So students learn how to check a job before they build one.<\/li>\n<\/ol>\n<\/div>\n<section class=\"card\" id=\"full-10-s1\"><h2><span class=\"num\">10.1<\/span> What You Will Leave With<\/h2><p><strong>Both courses:<\/strong><\/p>\n<ul>\n<li>One failure you have caused on purpose, and seen a check catch.<\/li>\n<li>A written note of what your check cannot see.<\/li>\n<li>A list of every paid account, with a cap on each one that charges per use.<\/li>\n<\/ul>\n<p><strong>Full course only:<\/strong><\/p>\n<ul>\n<li>A backup of your bot, and one file restored from it.<\/li>\n<li>A small watchdog on your server. It runs every hour and stays silent when everything is fine.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-10-s2\"><h2><span class=\"num\">10.2<\/span> Before This Module<\/h2><ul>\n<li><strong>Full course:<\/strong> your server and bot from Module 08B, working.<\/li>\n<li><strong>Short course:<\/strong> your AI assistant from Module 08, working on your laptop.<\/li>\n<li><strong>Both courses:<\/strong> your run card and your three golden questions from Module 07. Golden questions are test questions with known answers.<\/li>\n<li><strong>Both courses:<\/strong> a list of every account you pay for. Bring the login for each one.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-10-s3\"><h2><span class=\"num\">10.3<\/span> The Three Ways a System Fails<\/h2><p><em>10 minutes, both courses.<\/em><\/p>\n<p>Every failure is one of three kinds. They are not equally dangerous.<\/p>\n<p><strong>1. It stops.<\/strong> The bot does not answer, or the job does not run. You usually notice within a day, because something you expected does not arrive.<\/p>\n<ul>\n<li><strong>The story (Build Log 53).<\/strong> Annie's nightly backup also sent a copy to Google Drive.<\/li>\n<li>The upload used a Google sign-in that expired every 7 days. The app behind it was still in Google's &quot;Testing&quot; mode.<\/li>\n<li>The upload failed four mornings in a row, 20 to 23 August 2026. A failure message arrived each morning.<\/li>\n<li>Annie noticed the same message several mornings running and asked if it was a pattern.<\/li>\n<li>The fix moved the upload onto a published app whose sign-in does not expire. Nobody has to sign in again each week.<\/li>\n<\/ul>\n<p><strong>2. It runs, but does the wrong thing.<\/strong> The job finishes and nothing complains. The result is wrong.<\/p>\n<ul>\n<li><strong>The story (Build Log 82).<\/strong> In September 2026, Claude told Annie that her storage bot saved its own copy of each photo on the server. That was true.<\/li>\n<li>But the copy sat inside the synced vault. Annie read the answer as &quot;safe to delete the vault folder&quot;, and deleted it.<\/li>\n<li>One sync run removed 411 files everywhere: 262 storage photos, 147 photos for a series of picture books, and 2 other files.<\/li>\n<li>Annie had made the books for her son. She created a series of three books to help him through a big change.<\/li>\n<li>The books drew on the family's written plan for raising her son, with its guiding principles and examples. They also drew on deep research into attachment theory and how very young children cope with big changes.<\/li>\n<li>Her nightly backup had never included the vault.<\/li>\n<li>She got the storage photos back from Obsidian's own version history, which comes with the paid sync plan. She chose not to recover the 147 book photos as the finished books were already saved, so she let the photos go.<\/li>\n<li>The lesson: &quot;a separate copy&quot; means nothing until you know which copies it is separate from.<\/li>\n<\/ul>\n<p><strong>3. It says it worked when it did not.<\/strong> This is the most dangerous kind. The first two make you look for the problem. This one tells you there is nothing to look for.<\/p>\n<ul>\n<li>You have already met two of these stories. In Module 04, the nightly inbox sorter reported &quot;ok&quot; for weeks while it filed every note into the wrong folder (Build Log 74). In Module 09, the learning bot said &quot;That's exactly it&quot; to a wrong answer, after doing no work at all (Build Log 56).<\/li>\n<li><strong>The new story (Build Log 59).<\/strong> In August 2026, one of Annie's bots cleaned up a set of notes. It reported that the job was done and &quot;nothing dangles&quot;, meaning no links were left broken.<\/li>\n<li>The renames were real. The claim about the links was false.<\/li>\n<li>Annie had deleted a page earlier, and seven notes still linked to it. The bot had never checked.<\/li>\n<\/ul>\n<p>Annie's rule after Build Log 74: &quot;a false 'ok' is just as bad or worse than something breaking down.&quot;<\/p>\n<p><strong>What to aim for.<\/strong> You cannot stop every failure. Aim for this instead: every failure should either announce itself, or be caught by a check.<\/p>\n<p><strong>There are two times a failure can happen,<\/strong> so you need two kinds of check (from v1, Build Log 73).<\/p>\n<ul>\n<li><strong>While the job is running.<\/strong> The job must say so in the same message if it fails. This is rule 2 in your rules file from Module 07: never hide a failure.<\/li>\n<li><strong>When nobody is watching.<\/strong> A job that never ran, or a backup that stopped, sends no message at all. Only a check that runs on a timer can find it. In the Full course, that is the watchdog you write today.<\/li>\n<\/ul>\n<p><strong>Exercise (2 minutes).<\/strong> Name one failure you have already met in this course. Which of the three kinds was it?<\/p>\n<h3>Free and Cheap AI Models<\/h3>\n<p><em>Read this aloud in the Full course if time allows. It is also in the syllabus.<\/em><\/p>\n<p>Telegram, a free model tier, and the laptop you already own will run everything in this course. A free or cheap AI model costs less, but it is not as smart. So give each model the job it does well.<\/p>\n<p>Think about your household. You are the expensive model. You design the whole system for your home and your child: the routines, the rules, and what to do when something goes wrong. Helpers are not paid as highly as we are. They are not paid to design the household system. They are paid to carry out the routine you have set.<\/p>\n<p>AI works the same way. The smarter, more costly model builds the scripts and the rules. The cheap model runs them. When a cheap model was left to make its own judgement calls, it reported work it had not done (Logs 00, 52 and 56). By late September, all three of my bots ran well on a cheap model, because the scripts and checks were already built. This module shows you how to build those checks.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-10-s4\"><h2><span class=\"num\">10.4<\/span> Make a Backup and Restore One File<\/h2><p><em>10 minutes, Full course. Short course: homework.<\/em><\/p>\n<p><strong>A backup is everything your system needs to run again after the machine is gone.<\/strong> That list is longer than people expect.<\/p>\n<p><strong>Include the logins, not only the files (Build Log 44).<\/strong><\/p>\n<ul>\n<li>In August 2026 Annie's builder checked what her nightly backup contained.<\/li>\n<li>The backup held the bot's whole folder. It did not hold the sync service's login, which lived in a different folder.<\/li>\n<li>A server rebuilt from it would have come back signed out.<\/li>\n<li>The login folders were added to the backup.<\/li>\n<\/ul>\n<p><strong>Leave out what can be downloaded again (Build Log 97).<\/strong> By September 2026 Annie's backup had grown to about 2 GB, mostly program files that can be downloaded again. Leaving them out cut it to 184 MB.<\/p>\n<p><strong>The backup copy is as private as the server.<\/strong> Once login files are inside it, anyone who can open the backup can sign in as your bot. Keep it somewhere only you can reach.<\/p>\n<p><strong>Know what each copy holds (Build Log 101).<\/strong> The copy of Annie's vault on her server held only notes. Photos, PDFs and scripts never reached it. In September 2026 she found 59 files, including 13 baby-book photos, that existed only on her Mac. Every backup she believed she had held only her notes.<\/p>\n<p><strong>Annie's backups have three layers (Build Log 21).<\/strong><\/p>\n<ol>\n<li><strong>A whole-server copy<\/strong> kept by the server company. You turned this on in Module 03.<\/li>\n<li><strong>A nightly copy<\/strong> of everything a rebuild needs, made by a plain script at 3 am. It keeps the newest 7.<\/li>\n<li><strong>One copy kept somewhere else,<\/strong> so it survives if the server company loses the server.<\/li>\n<\/ol>\n<p><strong>A backup should message you only when it fails.<\/strong> A daily &quot;backup done&quot; message trains you to stop reading the messages. Then the one that says it failed looks like all the others. But silence is only safe when a check is watching. A backup that stops running also sends nothing. That is why the watchdog in the next segment checks the backup's age.<\/p>\n<h3>Full Course: Do It Now<\/h3>\n<p>Ask your builder:<\/p>\n<pre><code class=\"language-text\">Write a backup script for this server. Include the bot's folder (~/.hermes), the vault sync login, the Claude Code login files and the SSH authorized keys. Leave out virtual environments, caches and anything that can be downloaded again. Keep the newest 7 copies. Message me on Telegram only if it fails. Schedule it every night at 3 am. Then run it once now and show me the file it made.\n<\/code><\/pre>\n<p><strong>Then restore one file.<\/strong> Ask the builder to list what is inside the newest backup (<code>unzip -l<\/code>) and to test it (<code>unzip -t<\/code>). Find your SOUL file in the list. Then ask the builder to copy your SOUL file out of the backup into a test folder, and open it.<\/p>\n<p><strong>Why you restore a file, not just look at the list.<\/strong> Build Log 27 records a backup made before a change, and the change itself never happened. A backup existing proves only that a backup exists. Opening a file from it proves it works.<\/p>\n<p><strong>One copy kept somewhere else is homework.<\/strong> Connecting a cloud account in class takes too long. Ask the builder to suggest a place, and to tell you what access it needs before it sets anything up.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-10-s5\"><h2><span class=\"num\">10.5<\/span> Choose Your Checks<\/h2><p><em>10 minutes, Full course. 5 minutes, Short course.<\/em><\/p>\n<p><strong>Four checks cover most of what can go wrong.<\/strong><\/p>\n<ol>\n<li><strong>Is it running?<\/strong> Did the job run, and does its result exist? This is the cheapest check. It catches only the first kind of failure.<\/li>\n<li><strong>Is the answer still right?<\/strong> Ask your three golden questions again after every change. If an answer changes and you did not change the files, something broke.<\/li>\n<li><strong>Is the important thing still there?<\/strong> The folder exists, the file is present, the backup is recent.<\/li>\n<li><strong>Did it really do the job?<\/strong> Look at the result itself, not at the job's report. Open the file, list the folder, read the message.<\/li>\n<\/ol>\n<p><strong>Check the result, not the report (v1 Block 9, rule 1).<\/strong> A job's own message saying &quot;done&quot; is not proof. The result is the proof.<\/p>\n<p><strong>The job that does the work must not be the only thing that checks it (v1 Block 9, rule 2).<\/strong> Annie's watchdog fixes one kind of broken link by itself. After each fix it runs its own check again, and it reports &quot;fixed&quot; only if that check passes (Build Log 88).<\/p>\n<p><strong>The checker can fail too.<\/strong><\/p>\n<ul>\n<li><strong>The story (Build Log 97).<\/strong> Annie had a script that wrote her monthly cost report.<\/li>\n<li>It was being run by the wrong copy of Python, which lacked a part it needed. So it read nothing.<\/li>\n<li>It printed three warnings, then printed &quot;ok&quot;.<\/li>\n<li>An audit on 29 September 2026 also found it had never been scheduled, although an earlier log said it had (Build Logs 87 and 97).<\/li>\n<li>The audit's summary: every fault it found was in the part that reports on the system, not the part that does the work.<\/li>\n<\/ul>\n<p><strong>So write down what your check cannot see.<\/strong> A check with a known gap is useful. A check you believe sees everything is how you get surprised.<\/p>\n<h3>Full Course: A Small Watchdog<\/h3>\n<p>Annie's watchdog, Toby, is a plain script with no AI. It runs every hour and stays silent when everything is fine. Yours starts with three checks.<\/p>\n<p><strong>The rules Toby follows<\/strong> (Build Logs 66, 74 and 107):<\/p>\n<ol>\n<li><strong>Print only problems.<\/strong> If the script prints nothing, you get no message.<\/li>\n<li><strong>Every alert ends with the one thing to do.<\/strong><\/li>\n<li><strong>If a check cannot read what it is checking, it reports a problem.<\/strong> A check that cannot see must never say &quot;ok&quot;.<\/li>\n<li><strong>Always finish without an error code, even when reporting a problem.<\/strong> Toby once ended with an error code when he found a problem. The scheduler then marked Toby's own job as failed, and Toby reported that too, again and again (Build Log 66). The alert goes in the message.<\/li>\n<li><strong>Check often, message rarely.<\/strong> Check every hour. Repeat an unfixed problem only every 3 hours.<\/li>\n<li><strong>Stay quiet when nothing is expected.<\/strong> Toby checks that Annie's Mac has sent its sync signal. At 6:35 one morning he raised an alarm: the signal was 600 minutes old. Nothing was broken. The Mac had been asleep all night. Now he stays quiet from 8 pm to 8 am unless the Mac has been silent for more than 14 hours (Build Log 107). A check that raises false alarms every morning would train you to ignore it.<\/li>\n<\/ol>\n<p><strong>Your three checks.<\/strong><\/p>\n<ol>\n<li><strong>Is the bot running?<\/strong><\/li>\n<li><strong>Is the newest backup less than 26 hours old, and bigger than a minimum size?<\/strong><\/li>\n<li><strong>Does the server's Claude login expire within 4 days?<\/strong> The server's login lasts about 30 days, and using it does not extend it (Build Log 75). Module 08B promised this check.<\/li>\n<\/ol>\n<p>Ask your builder:<\/p>\n<pre><code class=\"language-text\">Write ~/.hermes/scripts/watchdog.py as a plain Python script with no AI.\nCheck 1: the bot is running.\nCheck 2: the newest backup in my backup folder is less than 26 hours old and bigger than [size].\nCheck 3: the Claude Code login on this server expires in more than 4 days.\nRules: print only problems; end each alert with the one action to take; if a check cannot read what it checks, report that as a problem; always exit 0; repeat an unfixed problem only every 3 hours, using a small state file; add a --status option that shows every check and its result.\nShow me the script and run --status. Then schedule it every hour at minute 30, as a job that sends its output to me on Telegram without calling an AI model.\n<\/code><\/pre>\n<p><strong>What success looks like.<\/strong> <code>--status<\/code> shows all three checks as green, and you get no message.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-10-s6\"><h2><span class=\"num\">10.6<\/span> Break It on Purpose<\/h2><p><em>15 minutes, both courses.<\/em><\/p>\n<p><strong>A check that has never gone red has not been tested.<\/strong> In September 2026 Annie's watchdog gained a check that her skill scripts had not been changed by accident. Her builder changed one script on purpose. The check went red, and the script was put back. On its first real run, the same check found a real script that had gone out of date (Build Log 106).<\/p>\n<p><strong>Plant the fault on a copy, never on the live system you depend on<\/strong> (Build Log 65).<\/p>\n<h3>Full Course<\/h3>\n<ol>\n<li>Ask the builder to point a copy of the watchdog at an empty test folder in place of the backup folder.<\/li>\n<li>Run the copy with <code>--status<\/code>. Check 2 should go red, because the test folder has no backup.<\/li>\n<li>Read the alert. Does it end with the one thing to do?<\/li>\n<li>Delete the copy.<\/li>\n<li>Run the real watchdog with <code>--status<\/code>. All three checks should be green.<\/li>\n<\/ol>\n<h3>Both Courses<\/h3>\n<p><strong>The check that stayed silent is the most useful answer.<\/strong> It shows you a failure your checks cannot see. Write it down in your build log, under &quot;what my checks cannot see&quot;.<\/p>\n<p><strong>Then fix the fault and check again.<\/strong> Every check should go green. If one stays red after the fault is fixed, the check itself is broken.<\/p>\n<p><strong>Check the alarm against reality, too.<\/strong><\/p>\n<ul>\n<li>In September 2026 Toby reported 292 broken links in Annie's vault. Only 15 were real.<\/li>\n<li>The checker was misreading three kinds of link that were correct.<\/li>\n<li>Claude nearly changed 234 rows of Annie's storage list to match the checker. That would have broken working links (Build Log 79).<\/li>\n<li>About a week later, Toby reported 249 broken photo links, and this time he was right (Build Log 85).<\/li>\n<\/ul>\n<p>Neither the alarm nor the silence is proof. Look at what the alarm points to.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-10-s7\"><h2><span class=\"num\">10.7<\/span> Set a Spending Cap<\/h2><p><em>5 minutes, both courses.<\/em><\/p>\n<p><strong>What it costs me.<\/strong> On average, my whole setup costs me about $57 a month. That covers three bots, a server and the subscriptions behind them. You can do this course for $0.<\/p>\n<p><strong>Why a spending cap matters.<\/strong> In September 2026, my bill was close to $80 instead of the usual $57. Two things happened. First, I was trying my AI assistant on Claude Sonnet, which costs more than the open-weight models I normally use. Second, I had built a script on my server named Toby, my system maintenance checker. Toby is also built to fix some problems automatically. By mistake, the automatic fixes used my API key instead of my Claude Pro subscription, so they billed the API. I found out because I had set a $20 monthly limit on my API key. When the limit was used up, Anthropic paused the key and emailed me.<\/p>\n<p><em>(Module 04 showed the cap. This is the full story. The arithmetic is in the handout.)<\/em><\/p>\n<p><strong>Find the cause before you raise a cap (Build Log 89).<\/strong> Claude's first advice was to raise the cap to $30. That was wrong. The account would have run out again within days, before the cause was fixed.<\/p>\n<p><strong>Cap the job, not only the account.<\/strong> The first run of Annie's company-watch job had no limit. It used 92 credits and never finished. Limited to 14 calls, it finished in 12 and used 21 credits (<code>Firecrawl — Use Cases<\/code> note). Her rule for Firecrawl: warn before the limit, and never top up automatically (Annie's Firecrawl notes).<\/p>\n<p><strong>Exercise.<\/strong><\/p>\n<ol>\n<li>List every account you pay for: server, AI plans, model provider, sync and any web service.<\/li>\n<li>Mark each one: does it charge a flat monthly price, or per use?<\/li>\n<li>A flat price cannot surprise you. Write its price on your run card.<\/li>\n<li>Every account that charges per use gets a cap today. Set it at the figure that would annoy you, not the one that would hurt you.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"full-10-s8\"><h2><span class=\"num\">10.8<\/span> From the Record<\/h2><p>The five stories told in class are above. These two are for students who ask for more. The handout has the rest, one line each.<\/p>\n<p><strong>The check that only asked w
