:\n<ol>\n<li>On 27 Sep 2026, Annie moved Claudith to a new provider.<\/li>\n<li>Some settings still named models that only the old provider offered.<\/li>\n<li>Those models stopped working at once. Nothing sent an alert.<\/li>\n<li>A scheduled job that used one of them failed overnight.<\/li>\n<\/ol>\n<\/li>\n<li><strong>The same model can act differently in two harnesses.<\/strong>\n<ul>\n<li>pi (harness) and Annie's bot, which runs on Hermes (harness), both use DeepSeek (AI model).<\/li>\n<li>But they give different answers to the same question.<\/li>\n<li>Module 08B shows this live (&quot;Same model, different program&quot;).<\/li>\n<\/ul>\n<\/li>\n<li><strong>The bill comes from the provider.<\/strong>\n<ul>\n<li>opencode Go (AI provider) costs $10 a month <strong>[COST]<\/strong>.<\/li>\n<li>A Claude subscription from Anthropic (AI provider) pays for Claude Code (harness).<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>One opencode Go plan does two jobs. A Claude plan cannot.<\/strong> <em>(Added 10 Oct 2026 at Annie's request.)<\/em><\/p>\n<ul>\n<li>With opencode Go (AI provider), one $10 a month plan <strong>[COST]<\/strong> pays for two things:\n<ol>\n<li>your PA bot's AI, through Hermes (harness) on the server<\/li>\n<li>pi (harness) in the terminal on your laptop<\/li>\n<\/ol>\n<\/li>\n<li>Both use the same models, such as DeepSeek (AI model), from the same plan.<\/li>\n<li>A Claude subscription from Anthropic (AI provider) cannot do this. Anthropic's own pages say so in two places (both read 10 Oct 2026):\n<ol>\n<li><strong>Claude Code's legal page:<\/strong> a Claude subscription sign-in is &quot;designed to support ordinary use of Claude Code and other native Anthropic applications&quot;. Other programs &quot;should use API key authentication&quot;. Anthropic does not allow other programs to &quot;route requests through Free, Pro, or Max plan credentials&quot;.<\/li>\n<li><strong>Anthropic's Consumer Terms (effective 8 Oct 2025), Section 3:<\/strong> you may not use the service &quot;through automated or non-human means, whether through a bot, script, or otherwise&quot;, except with an Anthropic API key or with Anthropic's explicit permission.<\/li>\n<\/ol>\n<\/li>\n<li><strong>The reason, in plain words:<\/strong>\n<ul>\n<li>A subscription is priced for one person using Anthropic's own apps.<\/li>\n<li>A bot or another program can send far more requests.<\/li>\n<li>So Anthropic wants those to go through an API key. With a key, you pay for each use, on top of any subscription.<\/li>\n<li>Anthropic's pages do not say this reason in these words. It is the reason the two rules point to.<\/li>\n<\/ul>\n<\/li>\n<li>News reports say Anthropic began blocking subscription sign-ins in other programs on 9 Jan 2026 (WinBuzzer and Gigazine, Feb 2026).<\/li>\n<li>Annie saw the block herself. When she signed pi into her Claude account, every request failed with &quot;Model access is disabled&quot; (Build Log 103).<\/li>\n<li>Facilitator: check both Anthropic pages again before teaching, because these rules can change. Anthropic says it may enforce them &quot;without prior notice&quot; (Claude Code legal page).<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-03-s6\"><h2><span class=\"num\">03.6<\/span> The Vault, and One Job Each for Calendar, Vault and Inbox<\/h2><p>A vault is a folder of plain text notes. The notes are written in a simple format called Markdown. Obsidian is a free app that shows the folder as a notebook. You own the files. They are not locked inside any company's app.<\/p>\n<p><strong>Why plain files and not Google Docs?<\/strong> Annie's bot's first memory was a Google Sheet. She replaced it in June 2026 for three reasons (How to Build Your Own Claudith guide, Part 2):<\/p>\n<ol>\n<li><strong>Speed and cost.<\/strong> A bot reads plain files on its own disk instantly and for free. Every read of a Google Doc is a signed-in request.<\/li>\n<li><strong>Shape.<\/strong> Notes work better as linked pages than as rows in a grid.<\/li>\n<li><strong>Ownership.<\/strong> You own the files, with no company in between.<\/li>\n<\/ol>\n<p>Google still does the jobs it does well: the calendar, email, and file backups.<\/p>\n<p><strong>Give each tool one job.<\/strong> Annie settled this in her first month (Build Log 00):<\/p>\n<ul>\n<li><strong>The calendar holds anything with a time.<\/strong> Appointments, deadlines, reminders.<\/li>\n<li><strong>The vault holds anything you want to keep.<\/strong> Notes, plans, rules, records.<\/li>\n<li><strong>An inbox folder holds anything you have not sorted yet.<\/strong> You capture first and file later. In the Full course, a nightly job will do the filing for you.<\/li>\n<\/ul>\n<p><strong>Pick the starting point you actually open every day.<\/strong> (Source: Build Log 00.)<\/p>\n<ul>\n<li>Annie set up a task board first. It stayed empty, because she never opened it.<\/li>\n<li>Her calendar became the main list instead, because she already lived in it.<\/li>\n<li>So choose your daily starting point from habit, not from what looks organised.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-03-s7\"><h2><span class=\"num\">03.7<\/span> Build Your Vault<\/h2><p>The facilitator sits beside each student for this.<\/p>\n<p><strong>Step 1. Install Obsidian on your laptop.<\/strong><\/p>\n<ul>\n<li>Go to obsidian.md.<\/li>\n<li>Download the installer for your system, and open it.<\/li>\n<\/ul>\n<p>What success looks like: Obsidian opens and offers to create a vault.<\/p>\n<p><strong>Step 2. Create the vault.<\/strong><\/p>\n<ul>\n<li>Choose &quot;Create new vault&quot;.<\/li>\n<li>Name it with your first name, for example <code>Jane Vault<\/code>.<\/li>\n<li>Put it in your Documents folder.<\/li>\n<li>Do not put it inside iCloud Drive, OneDrive or Google Drive. Those services and Obsidian's own sync can damage each other's files (Build Log 00).<\/li>\n<\/ul>\n<p>What success looks like: an empty vault opens, with your vault name at the top of the left panel.<\/p>\n<p><strong>Step 3. Create your top-level folders.<\/strong><\/p>\n<ul>\n<li>Annie's folders follow how she looks things up.<\/li>\n<li>Anything about her son's school is filed under her son, not under &quot;School&quot; (Build Log 00).<\/li>\n<li>Use the people and areas of your life.<\/li>\n<\/ul>\n<p>A starting set:<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Folder<\/th>\n<th>What goes in it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>00 Inbox<\/code><\/td>\n<td>Anything not yet sorted<\/td>\n<\/tr>\n<tr>\n<td><code>Me Personal<\/code><\/td>\n<td>Your own plans, health notes, learning<\/td>\n<\/tr>\n<tr>\n<td><code>Me Work<\/code><\/td>\n<td>Your work notes. Check your Data Map before anything confidential goes here<\/td>\n<\/tr>\n<tr>\n<td>One folder per family member<\/td>\n<td>Their school, appointments, records<\/td>\n<\/tr>\n<tr>\n<td><code>Household<\/code><\/td>\n<td>The home, bills, repairs, suppliers<\/td>\n<\/tr>\n<tr>\n<td><code>Builder<\/code><\/td>\n<td>Your builder's instructions, memory and continuity note<\/td>\n<\/tr>\n<tr>\n<td><code>AI System<\/code><\/td>\n<td>Your bot's rulebook, your build logs and your system map<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Right-click in the left panel and choose &quot;New folder&quot; for each one.<\/p>\n<p><strong>Step 4. Start flat.<\/strong> Do not create subfolders yet. Add one only when a folder gets crowded (Build Log 00).<\/p>\n<p><strong>Step 5. Create a map note.<\/strong><\/p>\n<ul>\n<li>In the top level of the vault, create a note called <code>Map of This Vault<\/code>.<\/li>\n<li>Write one line per folder saying what lives there.<\/li>\n<li>When a vault feels messy, the usual cause is an out-of-date map, not real chaos (Build Log 86).<\/li>\n<\/ul>\n<p><strong>Step 6. Move in your two worksheets.<\/strong><\/p>\n<ul>\n<li>Create notes called <code>Access Sheet<\/code> and <code>Data Map<\/code> inside <code>AI System<\/code>.<\/li>\n<li>Paste your Module 01 and 02 work into them.<\/li>\n<\/ul>\n<p><strong>Step 7. Install Obsidian on your phone.<\/strong><\/p>\n<ul>\n<li>Create the same vault name on the phone, stored on the phone itself.<\/li>\n<li>Do not connect the two yet.<\/li>\n<li>In the Full course, the server module (Module 08B) connects them.<\/li>\n<li>In the Short course, Obsidian's own sync service connects them, if you want your notes on your phone. It is optional. <strong>[COST]<\/strong><\/li>\n<\/ul>\n<p><strong>If it fails:<\/strong><\/p>\n<ul>\n<li>If Obsidian will not install on a company laptop, use your phone today. Install on a personal laptop before the next session.<\/li>\n<li>If you already use Obsidian, create a new vault for this course anyway. You can merge later.<\/li>\n<\/ul>\n<h3>Five Rules That Keep a Vault Safe<\/h3>\n<p>These come from things that broke in Annie's vault. Each one failed without any error message.<\/p>\n<ol>\n<li><strong>Never put a password or key in the vault.<\/strong> It copies to every device and to backups. Use a password manager (Build Log 00).<\/li>\n<li><strong>Never use these characters in a file name:<\/strong> <code>: / \\ * ? &quot; &lt; &gt; |<\/code>. A colon in a file name stopped a page from ever reaching Annie's Mac, with no warning (Build Logs 96 and 97).<\/li>\n<li><strong>Choose folder names now, and keep them.<\/strong>\n<ul>\n<li>Scripts will soon refer to these names.<\/li>\n<li>Plain names are easiest to type in a terminal.<\/li>\n<li>If you want emoji in names, add them today, not later.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Moving a file breaks every place that wrote down its address.<\/strong> Before moving or renaming, search for the old name everywhere (Build Logs 58 and 101).<\/li>\n<li><strong>Keep anything a bot must read as a Markdown note.<\/strong> A page saved as <code>.html<\/code> never reached Annie's server, so her bot could not read it (Build Log 58).<\/li>\n<\/ol>\n<\/section>\n<div class=\"partbar\">Where Your System Lives<\/div>\n<section class=\"card\" id=\"short-03-s8\"><h2><span class=\"num\">03.8<\/span> Three Questions and the Decision Tree<\/h2><p>Your system has to run on some machine. Choosing it is a decision about your life, not about technology. Answer each question yes or no.<\/p>\n<p><strong>1. Does anything need to run while you are asleep?<\/strong><\/p>\n<ul>\n<li>Morning summaries, the nightly inbox sort, backups and checks all run when you are not there.<\/li>\n<li>If yes, the machine must stay on when you are off.<\/li>\n<li>A laptop that sleeps will not do it.<\/li>\n<\/ul>\n<p><strong>2. Do you need it away from your desk?<\/strong><\/p>\n<ul>\n<li>If you only use it at your desk, the laptop is fine.<\/li>\n<li>If you want it on your phone while out, you need a bot.<\/li>\n<li>The bot is only as available as the machine it runs on.<\/li>\n<\/ul>\n<p><strong>3. What will you actually maintain?<\/strong><\/p>\n<ul>\n<li>Everything you run must be updated, backed up, and noticed when it breaks.<\/li>\n<li>The failure is rarely dramatic.<\/li>\n<li>On Annie's server, a login was blanked on 4 September 2026. Nobody noticed until 8 September (Build Log 75).<\/li>\n<\/ul>\n<p><strong>A one-person system should be as small as it can be while still doing the job.<\/strong><\/p>\n<pre><code class=\"language-text\">Do you need anything to run while you sleep?\n├── No  → Do you need it away from your desk?\n│          ├── No  → LAPTOP ONLY. Do not spend money.\n│          └── Yes → LAPTOP PLUS A TELEGRAM BOT.\n│                    The bot answers only while the laptop is awake.\n└── Yes → You need a machine that stays on.\n           ├── A machine at home in Hong Kong, such as a Mac mini:\n           │     it cannot reach Claude without a VPN.\n           │     Fine for companies that serve Hong Kong.\n           └── A RENTED SERVER IN SINGAPORE:\n                 reaches every company this course uses,\n                 and you can reach it from anywhere.\n<\/code><\/pre>\n<p><strong>Annie's own choice, honestly.<\/strong> She rented a server because four reasons combined:<\/p>\n<ol>\n<li>It stays on.<\/li>\n<li>She can reach it from anywhere.<\/li>\n<li>It doubles as her route around the Hong Kong block (Module 01).<\/li>\n<li>It gives her bots one fixed address.<\/li>\n<\/ol>\n<p>For someone at a desk with nothing to run overnight, a laptop is often the whole answer.<\/p>\n<p><strong>A rented server does not make the AI smarter.<\/strong> (Source: HK AI Hosting Landscape note.)<\/p>\n<ul>\n<li>The AI's thinking happens on the AI company's computers, not on the machine you type into.<\/li>\n<li>A small server and a powerful laptop give the same answers.<\/li>\n<li>Only running a model on your own hardware needs a big machine. This course does not do that.<\/li>\n<\/ul>\n<p><strong>Annie's ruling on 26 August 2026<\/strong> (Why Have My Own VPS note):<\/p>\n<ul>\n<li>For anything you do at the keyboard, a laptop is fine.<\/li>\n<li>The laptop's real limit is being present, not being powerful.<\/li>\n<li>A job you must remember to start does not count as built.<\/li>\n<li>A weekly job on a laptop that is asleep counts as a fail, not a partial pass.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-03-s9\"><h2><span class=\"num\">03.9<\/span> What the Optional Server Sitting Adds<\/h2><p><em>Short course.<\/em><\/p>\n<p>Your laptop does everything in this course while it is awake. The optional server sitting adds a small rented computer in Singapore that stays on. Three things change:<\/p>\n<ol>\n<li><strong>You get a Telegram bot that answers at any hour,<\/strong> even with the laptop closed.<\/li>\n<li><strong>Jobs can run while you sleep,<\/strong> such as a morning summary or a nightly sort of your inbox.<\/li>\n<li><strong>Your laptop stays as it is.<\/strong>\n<ul>\n<li>The sitting does not make the server a route to Claude.<\/li>\n<li>That needs Tailscale and an exit node, which the Full course teaches.<\/li>\n<li>Claude from your laptop still needs a VPN.<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<p><em>Corrected 10 Oct 2026 while merging Pair 8 in the Merge Tracker: the sitting is option 2a, which stops before Tailscale. The earlier third point said the server becomes your route to Claude with no paid VPN.<\/em><\/p>\n<p>What the sitting costs you:<\/p>\n<ul>\n<li>a monthly fee <strong>[COST]<\/strong><\/li>\n<li>a payment card<\/li>\n<li>an ID document for the server company<\/li>\n<li>one extra sitting<\/li>\n<\/ul>\n<p>Decide today whether you want it. You can also decide later, once the laptop's limits start to bother you.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-03-s10\"><h2><span class=\"num\">03.10<\/span> Telegram as the Front Door<\/h2><p>You will talk to your bot through Telegram, for three reasons:<\/p>\n<ol>\n<li><strong>Telegram's bot service is free and official.<\/strong>\n<ul>\n<li>You create a bot through Telegram's own @BotFather account, and receive a token.<\/li>\n<li>There is no fee and no grey area.<\/li>\n<\/ul>\n<\/li>\n<li><strong>It works in Hong Kong with no extra steps.<\/strong><\/li>\n<li><strong>Photos arrive ready to use.<\/strong>\n<ul>\n<li>Telegram rotates and resizes photos before the bot receives them.<\/li>\n<li>Send pictures as normal photos, never as files.<\/li>\n<li>That one habit made Annie's storage catalogue work with no extra software (Build Log 48).<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<p><strong>The chat app does not decide what the bot can do.<\/strong> (Source: Seminar Ideas, 15 Jul 2026.)<\/p>\n<ul>\n<li>Annie once asked whether WhatsApp or Telegram is the more powerful choice.<\/li>\n<li>Her builder checked: both connect to the same model, tools and memory.<\/li>\n<li>The program behind the chat app decides what the bot can do.<\/li>\n<\/ul>\n<p><strong>Why not WhatsApp?<\/strong> (Source: Claudith rulebook, rule 8.)<\/p>\n<ul>\n<li>Annie built a WhatsApp connection in July 2026. She removed it on 23 July.<\/li>\n<li>It used an unofficial program tied to her personal phone number.<\/li>\n<li>That breaks WhatsApp's terms, and it risked a ban on her number.<\/li>\n<li>Her bot now drafts a message, and she pastes it herself.<\/li>\n<\/ul>\n<p><strong>Know what Telegram can see.<\/strong><\/p>\n<ul>\n<li>Chats with a bot are not end-to-end encrypted.<\/li>\n<li>Whoever runs the bot receives every message (Module 02).<\/li>\n<li>Your Data Map decides what you send.<\/li>\n<\/ul>\n<p><strong>Check now:<\/strong> Telegram is installed, and two-factor sign-in is on (Settings, Privacy and Security, Two-Step Verification).<\/p>\n<\/section>\n<section class=\"card\" id=\"short-03-s11\"><h2><span class=\"num\">03.11<\/span> Your Shape Decision, and What Your System Does at 11pm on a Bad Day<\/h2><p>Fill in the worksheet below. Then answer one last question, in one sentence:<\/p>\n<blockquote>\n<p><strong>What will your system do for you at 11pm on a bad day?<\/strong><\/p>\n<\/blockquote>\n<p>If the answer is &quot;nothing&quot;, the design does not fit you yet, however good it looks.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-03-s12\"><h2><span class=\"num\">03.12<\/span> From the Record<\/h2><p><strong>Three homes down to one.<\/strong> (Source: Build Log 03.)<\/p>\n<ol>\n<li>In June 2026, Annie's notes about her bot lived on her Mac, in Obsidian and on the server.<\/li>\n<li>She never knew which copy was the real one.<\/li>\n<li>She moved the to-do list and a cheat sheet into Obsidian.<\/li>\n<li>She cut her builder's instruction file down to a short pointer.<\/li>\n<li>She deleted the server's duplicate only after checking it matched the vault copy byte for byte.<\/li>\n<\/ol>\n<p>The cost was one afternoon. The lesson: choose one home, move everything in, and check before you delete.<\/p>\n<p><strong>Four memories that drifted apart.<\/strong> (Source: Build Log 47.)<\/p>\n<ol>\n<li>By August 2026, Annie's builder had four separate memories on different machines and accounts.<\/li>\n<li>Each knew different things about her.<\/li>\n<li>She said: &quot;I just need one source of truth for Claudith and you, just as I need one source of truth for EVERYTHING we do.&quot;<\/li>\n<li>The fix merged 29 memory files into one vault folder, and linked every machine to it.<\/li>\n<li>A test from each machine, with no history, proved each one loaded the same instructions.<\/li>\n<\/ol>\n<p>The lesson: one real copy that every device reads is better than several copies kept in step.<\/p>\n<p><strong>The tidy-up that broke a bot for six days.<\/strong> (Source: Build Logs 58 and 80.)<\/p>\n<ol>\n<li>On 11 September 2026, Annie asked for a vault tidy-up. Many folders moved.<\/li>\n<li>A family member's tutor bot had 15 document addresses written into its skill.<\/li>\n<li>All 15 broke.<\/li>\n<li>The bot searched blindly and ran slowly for about six days before anyone noticed.<\/li>\n<\/ol>\n<p>The lesson: a move is finished only when every script and bot that refers to the old address has been updated.<\/p>\n<p><strong>The rename that broke five things.<\/strong> (Source: Build Log 101.)<\/p>\n<ol>\n<li>On 30 September 2026, the top-level vault folders were renamed to add icons.<\/li>\n<li>Nothing reported an error.<\/li>\n<li>Afterwards, Claude's memory link pointed at the old name. So a session started with no memory.<\/li>\n<li>Six links on the server broke. So Claude Code there ran with no global instructions, and four skills stopped working.<\/li>\n<li>The monthly cost script crashed on 1 October. That was the first time it ran after the rename.<\/li>\n<\/ol>\n<p>The lesson: after any rename, search every script for the old name. Then run each affected job once by hand.<\/p>\n<p><strong>The board nobody opened.<\/strong> (Source: Build Log 00.)<\/p>\n<ol>\n<li>In Annie's first month, her bot's rules said to use a task board.<\/li>\n<li>The board stayed empty, because she never opened it.<\/li>\n<li>Her calendar became the real list.<\/li>\n<\/ol>\n<p>The lesson: build around the place you already look every day.<\/p>\n<p><strong>The Mac mini question, answered without buying one.<\/strong> <em>Full course.<\/em> (Source: Build Log 46.)<\/p>\n<ol>\n<li>In August 2026, Annie wanted her own Claude Code on her phone, with her instructions and memory.<\/li>\n<li>The route she used kept her Mac awake and plugged in. That raised the question of buying a Mac mini.<\/li>\n<li>But she already rented a server that never sleeps, and her vault already reached it.<\/li>\n<li>So the builder was installed there in about 10 minutes, on the subscription she already paid for.<\/li>\n<\/ol>\n<p>The lesson: check what you already own before you buy.<\/p>\n<p><strong>The server was billing the wrong account.<\/strong> <em>Full course.<\/em> (Source: Build Log 46.)<\/p>\n<ol>\n<li>When Claude Code was set up on that server, it was already signed in to Annie's work account.<\/li>\n<li>That account was billed per use to her employer. She had not asked for that.<\/li>\n<li>The fix was to sign in with her personal subscription.<\/li>\n<li>Then a lock was set, so neither account can fall back to per-use billing.<\/li>\n<\/ol>\n<p>The lesson: before you use any AI tool on a machine, check whose account it is on and how it bills.<\/p>\n<p><strong>Six forgotten sessions filled the memory.<\/strong> <em>Full course.<\/em> (Source: Build Log 95.)<\/p>\n<ol>\n<li>In September 2026, the server began logging memory warnings every minute.<\/li>\n<li>The bots were not the cause. All three together used under 1 GB.<\/li>\n<li>Six abandoned Claude Code sessions, each 4 to 17 days old, held 1.5 GB between them.<\/li>\n<li>Closing them freed 1.37 GB.<\/li>\n<li>A 2 GB swap file was also added. A swap file is spare memory on the disk.<\/li>\n<\/ol>\n<p>The lesson: on a small server, memory runs out first. When it does, the system stops programs to make room. It may stop the one you depend on.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-03-s13\"><h2><span class=\"num\">03.13<\/span> Exercise<\/h2><ol>\n<li>List every place your notes, tasks and AI instructions live today. For each one, write one word:\n<ul>\n<li><strong>move<\/strong> (into the vault),<\/li>\n<li><strong>keep<\/strong> (it does a different job, such as the calendar), or<\/li>\n<li><strong>close<\/strong> (stop using it).<\/li>\n<\/ul>\n<\/li>\n<li>Which one place will you open first every morning?<\/li>\n<li>In a normal week, how many hours are you away from your laptop? Those are the hours your system cannot run on the laptop.<\/li>\n<li><strong>Homework:<\/strong> sketch your system on one page, with boxes and arrows. Use the parts table below.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"short-03-s14\"><h2><span class=\"num\">03.14<\/span> Worksheet: System Sketch and Shape Decision<\/h2><p><strong>My System Sketch<\/strong> (homework). Leave a part blank if you have not decided yet.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Part<\/th>\n<th>My version<\/th>\n<th>Where it will live<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Builder<\/td>\n<td>Claude Code / pi<\/td>\n<td>Laptop. Full course: also my server<\/td>\n<\/tr>\n<tr>\n<td>Bot<\/td>\n<td><\/td>\n<td>Full course: my server. Short course: none in the 10 hours; my server, if I take the optional sitting<\/td>\n<\/tr>\n<tr>\n<td>Vault<\/td>\n<td><\/td>\n<td>Laptop and phone. Full course: also my server<\/td>\n<\/tr>\n<tr>\n<td>Server<\/td>\n<td><\/td>\n<td>Full course, or the optional server sitting<\/td>\n<\/tr>\n<tr>\n<td>First scheduled job<\/td>\n<td><\/td>\n<td>Decided in Module 05, where you map your processes on paper<\/td>\n<\/tr>\n<tr>\n<td>Watchdog<\/td>\n<td><\/td>\n<td>The module on what breaks (Module 10)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>My daily starting point:<\/strong> ____________<\/p>\n<p><strong>My Shape Decision:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Question<\/th>\n<th>My answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Where my system runs<\/td>\n<td>Laptop / laptop plus server<\/td>\n<\/tr>\n<tr>\n<td>Joining the optional server sitting? (Short course)<\/td>\n<td>Yes / No / Later<\/td>\n<\/tr>\n<tr>\n<td>Server company, location and size (Full course)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Whole-server backup turned on? (Full course)<\/td>\n<td>Yes / No<\/td>\n<\/tr>\n<tr>\n<td>Date ordered, or the date I will order (Full course)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Server IP address saved in my password manager? (Full course)<\/td>\n<td>Yes / No<\/td>\n<\/tr>\n<tr>\n<td>Telegram installed, with two-factor sign-in on?<\/td>\n<td>Yes / No<\/td>\n<\/tr>\n<tr>\n<td>My phone (Android or iPhone)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My laptop (Mac or Windows)<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>\n<section class=\"card\" id=\"short-03-s15\"><h2><span class=\"num\">03.15<\/span> Teaching Notes<\/h2><ul>\n<li><strong>Three students at most in each class.<\/strong> Sit beside each student for the install. In the Full course, also sit beside them for the server order.<\/li>\n<li><strong>The difference between the builder and the bot is the idea most people miss.<\/strong> Repeat it at the start of the build sessions.<\/li>\n<li><strong>Some students already use Notion, OneNote or Apple Notes.<\/strong> Do not argue. Explain the plain-file reason once. Say they can move their notes over after the course. The bot needs plain files.<\/li>\n<li><strong>Windows students:<\/strong> Obsidian works the same way. Keep the vault out of OneDrive, which Windows often switches on for the Documents folder. Use a folder such as <code>C:\\Users\\&lt;you&gt;\\Vaults<\/code> instead.<\/li>\n<li><strong>Folder names cause long debates.<\/strong> Give students five minutes, then move on. Renames are possible, but costly once scripts exist.<\/li>\n<li><strong>Students will ask about the Mac mini.<\/strong> It is a good machine. In Hong Kong the deciding fact is location: it cannot reach Claude or act as your route out of Hong Kong.<\/li>\n<li><strong>Full course: push for ordering today.<\/strong> A student without a server by the server module (Module 08B) can follow it beside another student, and finish at home.<\/li>\n<li><strong>Do not let anyone paste a server password or IP address into a group chat.<\/strong><\/li>\n<li><strong>The diagrams render only in apps that understand Mermaid diagrams.<\/strong> Obsidian does. If you project from another tool, show the tables instead.<\/li>\n<li><strong>Developers may want a different server company or system.<\/strong> That is fine, but the course's commands assume Ubuntu. The course default is Hetzner in Singapore (added 10 Oct 2026). So a student who picks another company follows that company's order page on their own.<\/li>\n<\/ul>\n<p><strong>Where v1's stories went.<\/strong> v1 (the first version of the course) had five stories in its Block 3. In the merge they moved like this:<\/p>\n<ul>\n<li><strong>In this module:<\/strong> Logs 03 and 47, in the Claude version's shorter form.<\/li>\n<li><strong>To Module 06 (Introduce Yourself to the Machine) or Module 07 (Rules of Engagement):<\/strong> Log 26 (the working relationship lives in the files you wrote).<\/li>\n<li><strong>Facilitator reading:<\/strong> Log 07 (reference notes are overwritten, logs are only added to) and Log 62 (map the work before automating it).<\/li>\n<li><strong>Told here:<\/strong> Log 95. So the module on what breaks (Module 10) should refer back to it rather than tell it again.<\/li>\n<\/ul>\n<p><strong>Changed 10 Oct 2026 (plain-words rewrite):<\/strong><\/p>\n<ul>\n<li>&quot;Part A&quot; and &quot;Part B&quot; are now called by their names: &quot;A System That Fits How You Think&quot; and &quot;Where Your System Lives&quot;. Annie rejected labels the reader must remember.<\/li>\n<li>The bare minute sums are now &quot;How the minutes add up&quot;, in words.<\/li>\n<li>The six-parts table became a short list, because its cells were dense. Every fact is kept.<\/li>\n<li>The diagrams, the decision tree and all other tables are unchanged.<\/li>\n<\/ul>\n<\/section>\n<details class=\"card ref\" id=\"short-03-s16\"><summary><span class=\"num\">03.16<\/span> Sources <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>Build Log 00 (founding record): folders by person, start flat, no passwords in the vault, calendar for time, the unused task board.<\/li>\n<li>Build Log 03: three homes down to one.<\/li>\n<li>Build Log 23: the bot and the builder are different.<\/li>\n<li>Build Log 46: the builder moved to the server; the wrong billing account.<\/li>\n<li>Build Log 47: one source of truth; the guarded bot rulebook; a note written on the Mac reached the server about 80 seconds later.<\/li>\n<li>Build Log 48: Telegram photos.<\/li>\n<li>Build Log 54: a bot sealed to one family member.<\/li>\n<li>Build Logs 58, 80 and 101: moves and renames that broke addresses.<\/li>\n<li>Build Log 63: the server as a route out of Hong Kong.<\/li>\n<li>Build Log 75: the login blanked on 4 Sep and found on 8 Sep.<\/li>\n<li>Build Log 86: fixing the map instead of reorganising.<\/li>\n<li>Build Log 95: 3,809 MB of memory; six abandoned sessions.<\/li>\n<li>Build Logs 96 and 97: the colon in a file name.<\/li>\n<li>Build Logs 78 to 92: which part acts, which reports, which restarts bots and which builds.<\/li>\n<li>Alter-Ego Bots research note, 26 Jun 2026.<\/li>\n<li>Engine Map note (Claudith folder), read 9 Oct 2026: the vault's reading copy of the rulebook refreshes every minute, the push command backs up the live file first, and a check messages Annie if the two copies disagree.<\/li>\n<li>How to Build Your Own Claudith guide, Part 2: why plain files; &quot;a rented server first&quot;.<\/li>\n<li>Why Have My Own VPS note, 26 to 27 Aug 2026: a laptop's real limit is being present, not being powerful.<\/li>\n<li>HK AI Hosting Landscape note, 27 Aug 2026: a rented server does not make the AI smarter, the Hong Kong factors, typing delay.<\/li>\n<li>Boss Admin Moves note: whole-server backup enabled 4 Aug 2026; restore estimated at about 10 minutes.<\/li>\n<li>Claudith rulebook, rule 8: WhatsApp removed 23 Jul 2026.<\/li>\n<li>Toby check count: 24 checks, 9 Oct 2026 (Build Log 124).<\/li>\n<li>Live server check, 2 Oct 2026: 26 scheduled jobs, 23 plain scripts.<\/li>\n<li>Build Log 94: a model name works only with a provider that offers it (27 Sep 2026 provider move).<\/li>\n<li>Build Log 103: pi signed into a Claude account failed with &quot;Model access is disabled&quot;.<\/li>\n<li>Annie's pi settings and the bots' server settings, read 10 Oct 2026: harness, provider and model for each setup.<\/li>\n<li>Claude Code documentation, &quot;Legal and compliance&quot;, section &quot;Authentication and credential use&quot; (code.claude.com/docs/en/legal-and-compliance), read 10 Oct 2026.<\/li>\n<li>Anthropic Consumer Terms of Service, effective 8 Oct 2025, Section 3, item 7 (anthropic.com/legal/consumer-terms), read 10 Oct 2026.<\/li>\n<li>WinBuzzer, 19 Feb 2026, &quot;Anthropic Bans Claude Subscription OAuth in Third-Party Apps&quot;; Gigazine, 20 Feb 2026, &quot;Anthropic officially bans third-party subscription authentication&quot;: a Claude subscription sign-in works only in Anthropic's own programs.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"short-03-s17\"><summary><span class=\"num\">03.17<\/span> Related <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>01 — What Works From Hong Kong (Merged)<\/li>\n<li>02 — Privacy, Security and Whose Law Reaches Your Data (Merged)<\/li>\n<li>01 — Merge Tracker (Decisions, Hours, Checks)<\/li>\n<li>00 — Side-by-Side (9 Oct 2026) (Pair 3)<\/li>\n<\/ul>\n<\/details>", "count": 17}, {"id": "short-04", "label": "04", "title": "Module 04: The Demo", "minutes": 25, "read": 12, "toc": [["short-04-s1", "04.1", "What You Will Leave With"], ["short-04-s2", "04.2", "Before This Module"], ["short-04-s3", "04.3", "The Rule for the Whole Module"], ["short-04-s4", "04.4", "What This System Is For"], ["short-04-s5", "04.5", "Demo 1: A Photo Becomes a Record"], ["short-04-s6", "04.6", "Demo 3: When the Bot Was Wrong"], ["short-04-s7", "04.7", "Demo 5: What It Costs"], ["short-04-s8", "04.8", "Exercise: Your Wish List"], ["short-04-s9", "04.9", "How to Close the Module"], ["short-04-s10", "04.10", "What Not to Do"], ["short-04-s11", "04.11", "Teaching Notes"]], "body": "<section class=\"card\" id=\"short-04-s1\"><h2><span class=\"num\">04.1<\/span> What You Will Leave With<\/h2><p><strong>Your Wish List.<\/strong><\/p>\n<ul>\n<li>Three to five jobs you want your system to take over.<\/li>\n<li>Each one is scored by how much remembering it removes.<\/li>\n<li>Circle your top two. They go into the next module, where you map them on paper.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-04-s2\"><h2><span class=\"num\">04.2<\/span> Before This Module<\/h2><ul>\n<li><strong>Modules 01 to 03 finished.<\/strong> Bring your Data Map from Module 02.<\/li>\n<li><strong>A pen and the worksheet.<\/strong> This module is mostly watching, then one short exercise.<\/li>\n<li><strong>For the facilitator:<\/strong> the checklist at the end of this module, done before students arrive.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-04-s3\"><h2><span class=\"num\">04.3<\/span> The Rule for the Whole Module<\/h2><p><strong>Never show a capability without showing what it costs.<\/strong> (From v1.)<\/p>\n<ul>\n<li>Every demo below comes with a failure, a bill or a trade-off.<\/li>\n<li>A demo that shows only wins makes the room feel behind.<\/li>\n<li>It also makes the facilitator hard to trust the first time a student's own build fails.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-04-s4\"><h2><span class=\"num\">04.4<\/span> What This System Is For<\/h2><p>Most AI marketing promises that you will do ten times more. Annie's system is built for a different reason.<\/p>\n<p>Her line, written in August 2026: the real gift is clearing what drains you, so you can be present with the people in front of you, including yourself (Build Log 72).<\/p>\n<p>It works in two directions:<\/p>\n<ul>\n<li><strong>Take things away.<\/strong> Admin, reminders, chasing, filing. Anything you hold in your head today because nothing else will.<\/li>\n<li><strong>Add depth.<\/strong> Research and learning on the things that matter to you.<\/li>\n<\/ul>\n<p>Annie judges every build by one rule: if a job only works when you remember to start it, it is not finished (Annie's ruling, 27 Aug 2026). Every demo below runs without her starting it.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-04-s5\"><h2><span class=\"num\">04.5<\/span> Demo 1: A Photo Becomes a Record<\/h2><p><strong>What it is.<\/strong> A photo catalogue of the family's storage units. A bot built it, and you can read it on a phone (Build Log 48).<\/p>\n<p><strong>What the screenshots show.<\/strong><\/p>\n<ol>\n<li><strong><code>Storage Bot Logging Item (edited)<\/code>.<\/strong>\n<ul>\n<li>Annie sends a photo of a cap, with a short caption naming the unit.<\/li>\n<li>The bot replies &quot;Got it&quot;.<\/li>\n<li>It logs the item to Unsorted, and says it did not catch the unit.<\/li>\n<li>A minute later, it moves the item to the right unit as number 325.<\/li>\n<li>It asks her to reply if that is wrong.<\/li>\n<\/ul>\n<\/li>\n<li><strong><code>Storage Bot Finding Item (edited)<\/code>.<\/strong>\n<ul>\n<li>Annie asks where a playmat is.<\/li>\n<li>The bot answers with the item number.<\/li>\n<li>It says the playmat was lent to a friend, and quotes the note about a missing part.<\/li>\n<li>It also lists two near-matches, in case she meant one of those.<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<p><strong>The line to say.<\/strong> &quot;When it was unsure where the cap went, it said so and put it somewhere safe. It did not guess.&quot;<\/p>\n<p><strong>What else to point out.<\/strong> (Source: Build Log 80.)<\/p>\n<ul>\n<li>The count of items comes from code, not from the AI.<\/li>\n<li>AI models are bad at counting.<\/li>\n<li>So Annie's rule is: code does the arithmetic, and the model only reads the result.<\/li>\n<\/ul>\n<p><strong>The cost of this one.<\/strong> (Source: Build Log 48.)<\/p>\n<ol>\n<li>Annie's first answer from Claude was &quot;don't build it&quot;. Describing photos seemed to need a paid AI service.<\/li>\n<li>She removed that assumption in six words: &quot;I actually don't mind typing descriptions.&quot;<\/li>\n<li>It then turned out the bot already described photos, for about $0.001 each.<\/li>\n<\/ol>\n<p>The lesson: say out loud the one assumption your advice depends on. Then the other person can overturn it.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-04-s6\"><h2><span class=\"num\">04.6<\/span> Demo 3: When the Bot Was Wrong<\/h2><p><strong>What happened (1 Oct 2026).<\/strong><\/p>\n<ol>\n<li>Annie photographed a hard drive's warranty card and said &quot;save this&quot;.<\/li>\n<li>The bot filed it as a searchable page. It explained which folder it chose and why (<code>warranty-01<\/code>).<\/li>\n<li>Then it stated, confidently, that the warranty did not cover data recovery. That was wrong.<\/li>\n<\/ol>\n<p><strong>How it was corrected<\/strong> (<code>warranty-02<\/code>):<\/p>\n<ol>\n<li>Annie corrected it in one sentence.<\/li>\n<li>The bot checked the manufacturer's own data sheet. It quoted the line that includes data recovery.<\/li>\n<li>It replied &quot;You're right and I was wrong&quot;.<\/li>\n<li>It fixed the page, and put the source in it.<\/li>\n<li>It explained the two ways to claim. It named what was still missing: the receipt.<\/li>\n<\/ol>\n<p><strong>Later<\/strong> (<code>warranty-03<\/code>):<\/p>\n<ul>\n<li>Annie asked it to move the files into a subfolder.<\/li>\n<li>It did.<\/li>\n<li>It also found and fixed a link elsewhere in the vault that the move would have broken (Boss Admin Moves note, 1 Oct 2026).<\/li>\n<\/ul>\n<p><strong>The line to say.<\/strong> &quot;The lesson is not that the bot is clever. I stayed in charge, and correcting it took one sentence.&quot;<\/p>\n<\/section>\n<section class=\"card\" id=\"short-04-s7\"><h2><span class=\"num\">04.7<\/span> Demo 5: What It Costs<\/h2><p><strong>Show one slide with three numbers.<\/strong> No screenshot is needed, so nothing private can appear.<\/p>\n<ol>\n<li><strong>The monthly figure.<\/strong> What Annie's whole system costs per month. <strong>[COST]<\/strong>, with its date.<\/li>\n<li><strong>The cap.<\/strong> (Source: Build Log 89.)\n<ul>\n<li>In September 2026, Annie had set a $20 monthly spending cap on one AI account.<\/li>\n<li>The cap was reached, and the account paused.<\/li>\n<li>The cap did exactly its job.<\/li>\n<\/ul>\n<\/li>\n<li><strong>What filled it.<\/strong> (Source: Build Log 89.)\n<ul>\n<li>One chat conversation ran for three days.<\/li>\n<li>It used 19.06 million tokens, costing $8.36.<\/li>\n<li>Tokens are the small pieces of text that AI companies count and charge for.<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<p><strong>The line to say.<\/strong> &quot;I know what this costs to the cent. If you build this and do not know that, you will get a surprise you will not enjoy.&quot;<\/p>\n<\/section>\n<section class=\"card\" id=\"short-04-s8\"><h2><span class=\"num\">04.8<\/span> Exercise: Your Wish List<\/h2><ol>\n<li>Write down three to five jobs you would hand over today if you could.<\/li>\n<li>For each one, write what you have to remember today to get it done.<\/li>\n<li>Score how much remembering it removes, from 1 to 5. A job you think about every day scores higher than a monthly one.<\/li>\n<li>Mark the harm if it goes wrong.<\/li>\n<li>Circle your top two.<\/li>\n<\/ol>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Job<\/th>\n<th>What I have to remember today<\/th>\n<th>Remembering removed (1 to 5)<\/th>\n<th>Harm if it goes wrong (low, medium, high)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>My top two (these go to the next module):<\/strong><\/p>\n<ol>\n<li>\n<hr />\n<\/li>\n<li>\n<hr />\n<\/li>\n<\/ol>\n<p><strong>Check against your Data Map.<\/strong> Some jobs need Tier 3 data, such as passwords, ID numbers or bank details. Cross those jobs off. Or redesign them, so that data never enters the system.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-04-s9\"><h2><span class=\"num\">04.9<\/span> How to Close the Module<\/h2><p>Close with this line (from v1):<\/p>\n<p><em>&quot;Everything you just saw started as the same sheet of paper you are about to fill in. Nothing here was built in one go, and most of it was built after something broke.&quot;<\/em><\/p>\n<p>Then hand out the sticky notes for the next module.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-04-s10\"><h2><span class=\"num\">04.10<\/span> What Not to Do<\/h2><div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Do not<\/th>\n<th>Why<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Show a capability you would have to explain for five minutes<\/td>\n<td>If it needs a long introduction, it is not ready to show<\/td>\n<\/tr>\n<tr>\n<td>Show anything built in the last week<\/td>\n<td>New work has not met real use yet, and it may change before class<\/td>\n<\/tr>\n<tr>\n<td>Skip the failures<\/td>\n<td>The failure stories are what make the room trust the rest<\/td>\n<\/tr>\n<tr>\n<td>Show a student's real data on screen<\/td>\n<td>Module 02 applies to the demo too<\/td>\n<\/tr>\n<tr>\n<td>Let a segment run long<\/td>\n<td>Each segment has a hard stop. A long demo loses the room<\/td>\n<\/tr>\n<tr>\n<td>Take questions during a demo<\/td>\n<td>Write them on a visible list and answer at the end<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>\n<section class=\"card\" id=\"short-04-s11\"><h2><span class=\"num\">04.11<\/span> Teaching Notes<\/h2><ul>\n<li><strong>Expect &quot;can it do X for me?&quot; questions.<\/strong> Write each one on the board. Module 09 (Script, Machine Learning or AI Judgement) decides which ones need AI at all.<\/li>\n<li><strong>Do not let the demo turn into a sales pitch.<\/strong> Annie's notes describe this audience. They lose interest at hype, fear and shallow demos. They respond to real stories (Seminar research brief).<\/li>\n<li><strong>Watch the room.<\/strong> When a student's face changes at a demo, that job is probably on their Wish List. Mention it when they map their processes in the next module.<\/li>\n<li><strong>Say which demos they will build.<\/strong>\n<ul>\n<li>Full course: the storage-style bot, the scheduled jobs, the watchdog and the cost cap are all built later in the course.<\/li>\n<li>Short course: the laptop builds cover the filing and the Wish List jobs. A bot that runs while the laptop is closed needs the optional server sitting.<\/li>\n<\/ul>\n<\/li>\n<li><strong>The waiting-on list (the Chaser, which tracks things Annie is waiting on until she marks them done) is not shown.<\/strong> Both earlier versions described it as running. It has been paused since late September 2026 (Boss Admin Moves note, checked 6 Oct).<\/li>\n<li><strong>&quot;Same model, different program&quot; (pi and the bot give different answers with the same model) moved to the build module (Module 08).<\/strong> It needs pi running live, and students have pi open there anyway.<\/li>\n<li><strong>When the demo vault exists,<\/strong> live demos and recordings may come back, but only from that vault.<\/li>\n<li><strong>Do not quote the &quot;no two physical activities on the same day&quot; rule.<\/strong> It shows in <code>Kids Gym (edited)<\/code>, but Annie deleted it from the live bot on 24 Jul 2026. If someone asks to see it fire, it will not. Point at the nap check and the clash reasons instead (Boss Admin Moves note, warning box under &quot;Calendar with YOUR house rules&quot;).<\/li>\n<\/ul>\n<p><strong>Changed 10 Oct 2026 (Annie chose the Demo 2 jobs):<\/strong><\/p>\n<ul>\n<li>Demo 2 now shows the invoice claims, calendar jobs (four examples), and adding a task to the to-do list.<\/li>\n<li>New in Demo 2: her son's calendar checked against his nap and rules, a friend's messages becoming an event, the anniversary catch, and the to-do receipt. All four already had edited screenshots.<\/li>\n<li>The morning brief left Demo 2, then came back the same day at Annie's request, as &quot;the morning brief, two ways&quot;: her bot's brief, and the Gemini &quot;helper-day&quot; Skill with a real message it wrote. The segment stays at 10 minutes. Demo 2 now shows each screenshot in the page (Annie's request).<\/li>\n<li>The Chaser (open loops tracked until done) and the credit card bill watch were moved out of the Boss Admin Moves lineup into a new section, &quot;Built, But Not Useful&quot;. Neither was in this module.<\/li>\n<\/ul>\n<h3>Facilitator Checklist<\/h3>\n<p>Do this before the room arrives.<\/p>\n<ul>\n<li class=\"task\"><span class=\"box\"><\/span><strong>Show only the copies in <code>Seminar Screenshots/Edited (invented names)/<\/code>.<\/strong> Never open the folder above it in class. It holds the originals.<\/li>\n<li class=\"task\"><span class=\"box\"><\/span><strong>Never open <code>_Name Map (private).md<\/code> or <code>_Move Manifest.md<\/code> on the projector.<\/strong> They list the real names.<\/li>\n<li class=\"task\"><span class=\"box\"><\/span><strong>Do not say a real name aloud.<\/strong> Two family first names are the only real names on screen. Every other person, clinic and amount in the edited copies is invented. Use the names on the screen.<\/li>\n<li class=\"task\"><span class=\"box\"><\/span><strong>No client names, deal information or work methods<\/strong> appear anywhere.<\/li>\n<li class=\"task\"><span class=\"box\"><\/span><strong>Notifications are off<\/strong> on the laptop and the phone.<\/li>\n<li class=\"task\"><span class=\"box\"><\/span><strong>The screenshots are readable from the back row.<\/strong> Zoom in before class and check.<\/li>\n<li class=\"task\"><span class=\"box\"><\/span><strong>The screenshots are saved on the laptop,<\/strong> so the demo works without Wi-Fi.<\/li>\n<\/ul>\n<\/section>\n<details class=\"card ref\" id=\"short-04-s12\"><summary><span class=\"num\">04.12<\/span> Where the Two Versions Went <span class=\"hint\">tap to open<\/span><\/summary><p><strong>Taken from v1:<\/strong><\/p>\n<ul>\n<li>the rule for the whole module: never show a capability without its cost<\/li>\n<li>the cost demo<\/li>\n<li>the Log 74 story (the sorter that reported &quot;ok&quot; for weeks)<\/li>\n<li>&quot;What Not to Do&quot;<\/li>\n<li>the closing line that leads into the next module<\/li>\n<li>the &quot;watch the room&quot; note<\/li>\n<\/ul>\n<p><strong>Dropped from v1:<\/strong><\/p>\n<ul>\n<li>The live inbox sorter and the live bot conversation. Both would show real notes and real memory.<\/li>\n<li>&quot;The Rest of the Reel&quot;, v1's three extra demos cut for time. Its morning brief is in Demo 2, and its waiting-on list is paused. <em>(10 Oct 2026: the morning brief left Demo 2 when Annie chose the jobs. See the dated note in Teaching Notes.)<\/em><\/li>\n<\/ul>\n<p><strong>Taken from the Claude version:<\/strong><\/p>\n<ul>\n<li>the run sheet<\/li>\n<li>&quot;What This System Is For&quot;<\/li>\n<li>the storage demo<\/li>\n<li>the jobs demo<\/li>\n<li>the warranty card<\/li>\n<li>the Wish List<\/li>\n<li>the facilitator checklist<\/li>\n<\/ul>\n<p><strong>Changed from the Claude version:<\/strong><\/p>\n<ul>\n<li>The Wish List has four columns, not seven.<\/li>\n<li>The checklist's naming line now points at the edited copies.<\/li>\n<li>The Claude version's Demo D, the overnight sync jam (Log 44), is replaced by the watchdog screenshot. The reasons: the screenshot exists, and the jam story's claim that the watchdog messaged first has no source in Log 44.<\/li>\n<li>The weather planner, the Claude version's Demo E and the record stories from Logs 00 and 91 are dropped from this module.<\/li>\n<\/ul>\n<p><strong>Errors fixed:<\/strong><\/p>\n<ul>\n<li>The receipt times now come from the screenshot (20:00), not the Claude version's 5:45 pm and 6:05 pm.<\/li>\n<li>v1 claimed a bot refused to take credit for another AI assistant's work (Logs 54 and 93). That claim is dropped, because neither log records it.<\/li>\n<li>v1's &quot;six weeks&quot; for Log 75 is dropped, together with &quot;The Rest of the Reel&quot;.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"short-04-s13\"><summary><span class=\"num\">04.13<\/span> Sources <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>Build Log 30: the receipt flow and its six bugs.<\/li>\n<li>Build Log 48: the storage catalogue and the one assumption.<\/li>\n<li>Build Log 72: the presence framing.<\/li>\n<li>Build Log 74: the sorter that reported &quot;ok&quot; for weeks.<\/li>\n<li>Build Log 80: code counts, the model reads.<\/li>\n<li>Build Log 89: the $20 cap, and $8.36 for 19.06 million tokens.<\/li>\n<li>Annie's ruling, 27 Aug 2026: a job you must remember to start is not finished.<\/li>\n<li>Annie's ruling, 9 Oct 2026: edited screenshots now; live demos and recordings only from a demo vault.<\/li>\n<li>Seminar Ideas: What To Show People (29 Sep 2026) and Boss Admin Moves — Seminar Demo Lineup (warranty card, 1 Oct 2026; waiting-on list paused, checked 6 Oct).<\/li>\n<li>The edited screenshots named in the run sheet, each opened and read on 9 Oct 2026.<\/li>\n<li>Boss Admin Moves note, read 10 Oct 2026: the friend's-messages calendar add and the to-do receipt (6 Oct 2026); the anniversary catch (9 Oct 2026); the deleted &quot;no two physical activities&quot; rule (24 Jul 2026).<\/li>\n<li>The new Demo 2 screenshots (<code>Kids Gym<\/code>, <code>Beach Day Calendar Add<\/code>, both <code>Anniversary Clash<\/code> shots, <code>Adding Task to To Do List<\/code>, the Gemini Skills list <code>Gemini/Screenshot 2026-10-05 at 8.14.35 PM<\/code>, and <code>Gemini/Daily Msg for Helper<\/code>, added by Annie at 16:43, all edited copies), opened and read on 10 Oct 2026.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"short-04-s14\"><summary><span class=\"num\">04.14<\/span> Related <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>03 — Architecture and Where Your System Lives (Merged)<\/li>\n<li>02 — Privacy, Security and Whose Law Reaches Your Data (Merged)<\/li>\n<li>01 — Merge Tracker (Decisions, Hours, Checks)<\/li>\n<li>00 — Side-by-Side (9 Oct 2026) (Pair 4)<\/li>\n<\/ul>\n<\/details>", "count": 14}, {"id": "short-05", "label": "05", "title": "Module 05: Your Processes on Paper", "minutes": 35, "read": 13, "toc": [["short-05-s1", "05.1", "What You Will Leave With"], ["short-05-s2", "05.2", "Before This Module"], ["short-05-s3", "05.3", "Why Paper Comes First"], ["short-05-s4", "05.4", "The Six Parts of Every Process"], ["short-05-s5", "05.5", "Who Checks This?"], ["short-05-s6", "05.6", "Map Process One"], ["short-05-s7", "05.7", "Ten Questions to Answer Before You Build"], ["short-05-s8", "05.8", "From the Record"], ["short-05-s9", "05.9", "Exercise: A Partner Reads Your Map"], ["short-05-s10", "05.10", "Worksheet: Process Card"], ["short-05-s11", "05.11", "Teaching Notes"]], "body": "<section class=\"card\" id=\"short-05-s1\"><h2><span class=\"num\">05.1<\/span> What You Will Leave With<\/h2><p><strong>Two Process Cards.<\/strong> You make one for each of the top two jobs on your Wish List. Each card shows:<\/p>\n<ul>\n<li>what starts the process<\/li>\n<li>every step<\/li>\n<li>who checks it<\/li>\n<li>what it produces<\/li>\n<li>how you know it is finished<\/li>\n<\/ul>\n<p><strong>What happens to the cards later.<\/strong><\/p>\n<ul>\n<li>The script-or-AI module (Module 09) marks each step as a job for code, for an AI model, or for you.<\/li>\n<li>Your best candidate becomes your first automation in the skills and schedules module (Module 11).<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-05-s2\"><h2><span class=\"num\">05.2<\/span> Before This Module<\/h2><ul>\n<li><strong>Your Wish List from Module 04,<\/strong> with your top two jobs circled.<\/li>\n<li><strong>Your Data Map from Module 02.<\/strong><\/li>\n<li><strong>Sticky notes in five colours, and a marker.<\/strong> The facilitator supplies these. At home, any five colours work.<\/li>\n<li><strong>A real example.<\/strong> Your process may start with an email or a form. If so, have a recent one open on your phone.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-05-s3\"><h2><span class=\"num\">05.3<\/span> Why Paper Comes First<\/h2><p><strong>An unmapped process keeps its mistakes.<\/strong> If you automate it, the mistakes happen faster.<\/p>\n<p><strong>Annie's example.<\/strong> In August 2026 Annie drew a map of her whole system before she added anything new. The map showed that her real problems were not missing features. They were problems like these (Build Log 62):<\/p>\n<ul>\n<li>&quot;when I move a folder, three things silently break&quot;<\/li>\n<li>&quot;nobody is checking whether last night's job actually ran&quot;<\/li>\n<\/ul>\n<p><strong>Paper keeps the AI out of the room for now.<\/strong> You are not asking anything to be built. You are writing down what really happens. Later, the builder works from facts instead of guesses.<\/p>\n<p><strong>Aim for clarity, not tidiness.<\/strong> A messy sheet that shows a missing step is worth more than a neat sheet that hides it. For any process, you should know four things (from v1):<\/p>\n<ul>\n<li>what starts it<\/li>\n<li>what ends it<\/li>\n<li>who checks it<\/li>\n<li>where it waits<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-05-s4\"><h2><span class=\"num\">05.4<\/span> The Six Parts of Every Process<\/h2><p>Every process has six parts. Use the colours below. Output and done-signal are both green, because both sit at the end of the line.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Part<\/th>\n<th>Sticky note colour<\/th>\n<th>The question it answers<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Trigger<\/strong><\/td>\n<td>Blue<\/td>\n<td>What actually arrives that starts this?<\/td>\n<\/tr>\n<tr>\n<td><strong>Steps<\/strong><\/td>\n<td>Yellow<\/td>\n<td>What happens, one action per note?<\/td>\n<\/tr>\n<tr>\n<td><strong>Decisions<\/strong><\/td>\n<td>Pink<\/td>\n<td>Where does someone have to judge something?<\/td>\n<\/tr>\n<tr>\n<td><strong>Owner and approver<\/strong><\/td>\n<td>Orange<\/td>\n<td>Who checks it, and who must say yes before anything reaches another person?<\/td>\n<\/tr>\n<tr>\n<td><strong>Output<\/strong><\/td>\n<td>Green<\/td>\n<td>What real thing exists at the end: a file, a reply, a payment, a calendar entry?<\/td>\n<\/tr>\n<tr>\n<td><strong>Done-signal<\/strong><\/td>\n<td>Green<\/td>\n<td>How do you know it is finished, without checking by hand?<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Start from the thing that actually arrives.<\/strong> This is Annie's own design rule. It shaped one of her most useful automations (Build Log 30).<\/p>\n<ul>\n<li>A medical receipt that needs an insurance claim arrives by email.<\/li>\n<li>Sometimes it arrives the day after the appointment.<\/li>\n<li>An automation that started from the appointment would look too early and miss receipts.<\/li>\n<li>So the email is the trigger.<\/li>\n<li>The calendar has one smaller job. If an expected receipt has not arrived after 4 days, the system says so once.<\/li>\n<\/ul>\n<p><strong>Write every small step.<\/strong> &quot;Do the claim&quot; is not a step. Written out, Annie's receipt chore has six steps:<\/p>\n<ol>\n<li>Check email.<\/li>\n<li>Find the file.<\/li>\n<li>Download it.<\/li>\n<li>Rename it to fit the claim app's 15-character limit (Build Log 30).<\/li>\n<li>Upload it.<\/li>\n<li>Remember to do all of this on the right day.<\/li>\n<\/ol>\n<p>Small steps show you which steps a script could do from start to finish.<\/p>\n<h3>A Worked Example: Receipts That Need a Claim<\/h3>\n<p>This is the card Annie wrote for her receipt chore.<\/p>\n<ul>\n<li><strong>Trigger:<\/strong> an email with a receipt attached arrives from a known clinic.<\/li>\n<li><strong>Steps:<\/strong>\n<ol>\n<li>Find the email.<\/li>\n<li>Download the file.<\/li>\n<li>Rename it to 15 characters or fewer.<\/li>\n<li>Send it to my phone at a time I can act.<\/li>\n<li>Upload it to the claim app.<\/li>\n<li>Log that it is done.<\/li>\n<\/ol>\n<\/li>\n<li><strong>Decisions:<\/strong> Is this a receipt I can claim? Whose claim is it?<\/li>\n<li><strong>Owner and approver:<\/strong> Me. The insurer requires me to submit the claim myself.<\/li>\n<li><strong>Output:<\/strong> a claim submitted, with the file named correctly.<\/li>\n<li><strong>Done-signal:<\/strong> I reply &quot;done&quot; and the system logs it.<\/li>\n<li><strong>Never-arrives check:<\/strong> an appointment happened but no receipt came within 4 days. The system sends one message, once.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-05-s5\"><h2><span class=\"num\">05.5<\/span> Who Checks This?<\/h2><p><em>Full course segment. In the Short course, give the one-sentence version during Step 4.<\/em><\/p>\n<p><strong>Ask this about every process: who checks the result?<\/strong> Then ask how quickly they would notice if it were wrong. This is not about who does the work. It is about who would see the mistake.<\/p>\n<p><strong>Mark a step &quot;nobody&quot; when no one checks it.<\/strong> This is often the most honest note on the sheet. Some &quot;nobody&quot; steps still get done. Usually you are doing them, in the margins, and no one notices. (From v1.)<\/p>\n<p><strong>A &quot;nobody&quot; step can be automated only after you name someone to check its results.<\/strong> An automation on an unchecked step makes it worse. It produces wrong results faster and with more confidence.<\/p>\n<p><strong>Annie's example (Build Log 74).<\/strong> Her nightly filing job reported success every night for weeks. All that time, it was filing notes into the wrong folder. Nothing checked where the notes ended up.<\/p>\n<p><strong>So write a name next to every &quot;nobody&quot;.<\/strong> The name can be yours.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-05-s6\"><h2><span class=\"num\">05.6<\/span> Map Process One<\/h2><p><strong>Step 1. Write the trigger.<\/strong> Put one blue note at the left. Write what arrives, in plain words. If no thing arrives, write the time instead, such as &quot;every Sunday at 6 pm&quot;.<\/p>\n<p><strong>Step 2. Lay out the steps.<\/strong> Use one yellow note per action, from left to right. Use verbs: check, find, copy, rename, send, remember.<\/p>\n<p><strong>Step 3. Mark the decisions.<\/strong> Some steps need judgement. Swap each of those for a pink note. &quot;Is this urgent?&quot; is a decision. &quot;Copy the date&quot; is not.<\/p>\n<p><strong>Step 4. Add the people.<\/strong> Some steps need someone to say yes before something reaches another person. Put an orange note above each of those. Mark any step that no one checks as &quot;nobody&quot;.<\/p>\n<p><strong>Step 5. Score the pain.<\/strong> On each yellow note, write 1 to 3 for how much you dislike that step. (From v1.)<\/p>\n<p><strong>Step 6. Write the output and the done-signal.<\/strong> Use two green notes. One is the real thing produced. The other is how you know it is finished.<\/p>\n<p><strong>Step 7. Add the never-arrives check.<\/strong> Ask: what if the trigger never comes? Write what should happen on a final note.<\/p>\n<p><strong>What success looks like.<\/strong> Someone else can read your notes from left to right. They can do the job without asking you a question.<\/p>\n<p><strong>If you get stuck, your process is probably too big.<\/strong> Cut it in half and map only the first half.<\/p>\n<ul>\n<li>&quot;Manage family admin&quot; is too big.<\/li>\n<li>&quot;Book my son's classes without clashes&quot; is the right size.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-05-s7\"><h2><span class=\"num\">05.7<\/span> Ten Questions to Answer Before You Build<\/h2><p>Answer these questions for process one. Annie asks these questions before she builds anything. Each one comes from something she learned while building.<\/p>\n<ol>\n<li>Which steps need judgement, and which only move information from one place to another?<\/li>\n<li>When it goes wrong today, who notices, and how fast?<\/li>\n<li>What information in this process must never leave your own accounts? Check your Data Map.<\/li>\n<li>If it worked perfectly, what would you do with the time back?<\/li>\n<li>Is this a task you dislike, that happens often, and where a mistake is cheap? Those are the best first projects.<\/li>\n<li>Have you tried to automate it before? What happened?<\/li>\n<li>Does anything in this process go to another person, such as a teacher, a helper or a family member? Who says yes before it does?<\/li>\n<li>What does a mistake cost: a redo, an apology, or real harm?<\/li>\n<li>Which apps or accounts would it need to read, and whose name is each one in?<\/li>\n<li>What would make you trust it enough to stop checking it by hand?<\/li>\n<\/ol>\n<p><strong>Your answer to question 10 is your definition of done.<\/strong> On day one, Annie wrote her measure of success: mental load removed, multiplied by trust (Hermes Master Doc). Some jobs run, but you still check them by hand. Those jobs have not removed the load.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-05-s8\"><h2><span class=\"num\">05.8<\/span> From the Record<\/h2><p><strong>The bill reminder that ten minutes of checking stopped (Build Log 41).<\/strong><\/p>\n<ul>\n<li><strong>The plan, 27 Jul 2026.<\/strong> A credit card statement email arrives. The bot sends the amount and the due date. Annie replies &quot;paid&quot;.<\/li>\n<li><strong>The check.<\/strong> Annie read real emails for ten minutes before writing any code. This broke three assumptions:\n<ul>\n<li>One bank had not sent a statement email since May 2022.<\/li>\n<li>The other bank's alerts went to a family member's inbox.<\/li>\n<li>The alert email held no amount and no due date. It only said that a statement was ready.<\/li>\n<\/ul>\n<\/li>\n<li><strong>The result.<\/strong> A simpler version shipped. Annie retired it the same day. A message that can only say &quot;go and check the app&quot; does not remove enough work to earn a daily slot.<\/li>\n<li><strong>The lesson.<\/strong> Check the real trigger before you build. Judge an automation by whether it removes a chore.<\/li>\n<\/ul>\n<p><strong>Six places to look, one place to act (Build Log 55).<\/strong><\/p>\n<ul>\n<li><strong>The ask, August 2026.<\/strong> Annie asked to tidy her seminar notes. She believed the mess was three documents.<\/li>\n<li><strong>What a search found:<\/strong>\n<ul>\n<li>Six places, not three.<\/li>\n<li>The real tasks were split across two sections of her to-do list.<\/li>\n<li>Four bold notes said certain material must go into a teaching page. Each note was restated, and none was ever done. They were notes, not tasks, so nothing acted on them.<\/li>\n<\/ul>\n<\/li>\n<li><strong>The fix.<\/strong> All four notes became one item on the list.<\/li>\n<li><strong>The lesson.<\/strong> A note is not a task. Put tasks where tasks get done.<\/li>\n<\/ul>\n<p><strong>A process, finished (Build Log 19).<\/strong><\/p>\n<ul>\n<li>In June 2026 Annie taught her bot how she wants email replies drafted.<\/li>\n<li>At first the steps lived in chat and in the bot's small memory. That memory filled up.<\/li>\n<li>The steps were then written into the bot's reply instructions as six numbered steps:<\/li>\n<\/ul>\n<ol>\n<li>Find the thread by email address first.<\/li>\n<li>Draft from the account that received the original.<\/li>\n<li>Work out who is on each side from the thread itself.<\/li>\n<li>Check who is attending against the latest confirmation.<\/li>\n<li>Reply in the same thread, with the same subject.<\/li>\n<li>Show the account, subject and full text before sending.<\/li>\n<\/ol>\n<p>Every step prevents a mistake she had already seen. <strong>The lesson:<\/strong> this is what a process on paper looks like when it is ready to hand over.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-05-s9\"><h2><span class=\"num\">05.9<\/span> Exercise: A Partner Reads Your Map<\/h2><p><em>Full course. Short course students do this at home with a friend or family member.<\/em><\/p>\n<ol>\n<li>Choose the smaller of your two processes.<\/li>\n<li>Read your sticky notes aloud to a partner, from left to right. Do not add anything.<\/li>\n<li>Your partner writes down every question they would need to ask you.<\/li>\n<li>Each question is a missing note. Add them.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"short-05-s10\"><h2><span class=\"num\">05.10<\/span> Worksheet: Process Card<\/h2><p>Fill in one card per process.<\/p>\n<ol>\n<li>Copy the card into a note called <code>Process Map — &lt;name&gt;<\/code> in your vault's <code>AI System<\/code> folder.<\/li>\n<li>Paste in a photo of your sticky notes.<\/li>\n<\/ol>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Part<\/th>\n<th>Process one<\/th>\n<th>Process two<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Name<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Trigger (what actually arrives)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Steps (one action each), with pain 1 to 3<\/td>\n<td>1. 2. 3. 4. 5. 6.<\/td>\n<td>1. 2. 3. 4. 5. 6.<\/td>\n<\/tr>\n<tr>\n<td>Decisions (judgement needed)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Who checks it (&quot;nobody&quot; if no one)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>If &quot;nobody&quot;: who will check it from now on?<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Who says yes before anything reaches another person<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Apps and accounts it reads<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Output (the real thing produced)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Done-signal<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Never-arrives check<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Data Map tier of the information involved<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Answer to question 10 (my definition of done)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>How many to-do lists do I keep today?<\/strong> ____ <strong>Which one becomes the pinned list?<\/strong> ____________<\/p>\n<\/section>\n<section class=\"card\" id=\"short-05-s11\"><h2><span class=\"num\">05.11<\/span> Teaching Notes<\/h2><ul>\n<li><strong>Students pick processes that are too big.<\/strong> The usual fix is to cut the process in half. There are three students at most. Check each one's choice in the first five minutes of mapping.<\/li>\n<li><strong>The trigger question does the most work.<\/strong> Keep asking &quot;what actually arrives?&quot; Stop when the answer is a thing, not an intention.<\/li>\n<li><strong>Some students will want to talk about AI.<\/strong> Hold that for the later module that decides which steps a script or an AI should do (Module 09). Today is only about what happens now.<\/li>\n<li><strong>Sticky notes on a wall work better than on a desk.<\/strong> Students see the whole process and can move steps around.<\/li>\n<li><strong>Take a photo of each wall map.<\/strong> Students paste it into their vault note at the end.<\/li>\n<li><strong>Timing risk: the second map often runs over in the Full course.<\/strong> Make it homework if needed.<\/li>\n<\/ul>\n<h3>Where Students Get Stuck (From v1)<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Stuck point<\/th>\n<th>What to say<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>&quot;Everything is a process. This is too much.&quot;<\/td>\n<td>&quot;Pick the one with the highest pain score. That is enough for today.&quot;<\/td>\n<\/tr>\n<tr>\n<td>&quot;I don't have processes. I just do things.&quot;<\/td>\n<td>&quot;Tell me what you did last Tuesday. Anything you did twice is a process.&quot;<\/td>\n<\/tr>\n<tr>\n<td>&quot;Can I just use an app for this?&quot;<\/td>\n<td>&quot;Not yet. An app makes you file things before you have looked at them.&quot;<\/td>\n<\/tr>\n<tr>\n<td>&quot;My process is different every time.&quot;<\/td>\n<td>&quot;Then write down the parts that stay the same. That is your process.&quot;<\/td>\n<\/tr>\n<tr>\n<td>&quot;I have no idea who checks this.&quot;<\/td>\n<td>&quot;Write 'nobody'. That may be the most useful note on your sheet.&quot;<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>\n<details class=\"card ref\" id=\"short-05-s12\"><summary><span class=\"num\">05.12<\/span> Where the Two Versions Went <span class=\"hint\">tap to open<\/span><\/summary><p><strong>Kept from the Claude version:<\/strong><\/p>\n<ul>\n<li>the run sheet<\/li>\n<li>the six parts of every process, from trigger to done-signal<\/li>\n<li>the rule to start from the thing that actually arrives<\/li>\n<li>the receipt example<\/li>\n<li>the rule to cut a process in half when it is too big<\/li>\n<li>the two habits: one to-do list and one inbox<\/li>\n<li>the ten questions to answer before you build<\/li>\n<li>the Process Card<\/li>\n<li>three of its four stories<\/li>\n<\/ul>\n<p>Its fourth story (Log 74) is now told once, inside &quot;Who Checks This?&quot;. Before, it was told twice.<\/p>\n<p><strong>Kept from v1:<\/strong><\/p>\n<ul>\n<li>marking a step &quot;nobody&quot; when no one checks it<\/li>\n<li>the pain score<\/li>\n<li>the rule to aim for clarity, not tidiness<\/li>\n<li>the table of where students get stuck<\/li>\n<\/ul>\n<p><strong>Dropped from v1:<\/strong><\/p>\n<ul>\n<li><strong>The 40-note brain dump.<\/strong> The Wish List from Module 04 already picks the processes.<\/li>\n<li><strong>The flow drawing (loops, crossings, dead ends) and the circling step.<\/strong> Dropped for time.<\/li>\n<li><strong>Logs 57, 58, 59, 71 and 85.<\/strong> They teach system upkeep, not mapping. They suit the later module on what breaks in a running system (Module 10).<\/li>\n<\/ul>\n<p><strong>Changed:<\/strong><\/p>\n<ul>\n<li><strong>The conflict about steps that nobody checks is settled.<\/strong> v1 said unowned steps are the best candidates. The Claude version said automating them makes things worse. The module now says a &quot;nobody&quot; step is a candidate only after someone is named to check it.<\/li>\n<li><strong>Questions 7 and 9 of the ten questions are reworded for personal life.<\/strong> This was Annie's decision, 9 Oct 2026.<\/li>\n<li><strong>The question list carries no outside source name.<\/strong> This was the same decision.<\/li>\n<\/ul>\n<p><strong>Errors fixed:<\/strong><\/p>\n<ul>\n<li>The bill reminder is dated 27 Jul 2026, not August (Build Log 41).<\/li>\n<li>The colours now match the five-colour kit. Before, blue was used twice.<\/li>\n<li>The six receipt steps no longer cite the 15 Jul Seminar Ideas entry, which called it four steps. The 15-character limit is cited to Build Log 30.<\/li>\n<li>The success measure now matches the Master Doc's wording, &quot;mental load removed × trust&quot;.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"short-05-s13\"><summary><span class=\"num\">05.13<\/span> Sources <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>Hermes Master Doc, line 14: success is &quot;mental load removed × trust&quot;.<\/li>\n<li>Build Log 13: one pinned list and the underscore rule.<\/li>\n<li>Build Log 19: the six-step reply procedure.<\/li>\n<li>Build Log 30: start from what arrives; the 4-day never-arrives check; the 15-character limit.<\/li>\n<li>Build Log 41 (27 Jul 2026): the bill reminder retired the same day.<\/li>\n<li>Build Log 55: a note is not a task.<\/li>\n<li>Build Log 62: map the system before automating.<\/li>\n<li>Build Log 74: the filing job that reported success while filing into the wrong folder.<\/li>\n<li>Annie's decision, 9 Oct 2026: keep all ten questions, worded for personal life, with no outside source named in the course.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"short-05-s14\"><summary><span class=\"num\">05.14<\/span> Related <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>04 — The Demo (Merged)<\/li>\n<li>03 — Architecture and Where Your System Lives (Merged)<\/li>\n<li>01 — Merge Tracker (Decisions, Hours, Checks)<\/li>\n<li>00 — Side-by-Side (9 Oct 2026) (Pair 5)<\/li>\n<\/ul>\n<\/details>", "count": 14}, {"id": "short-06", "label": "06", "title": "Module 06: Introduce Yourself to the Machine", "minutes": 30, "read": 14, "toc": [["short-06-s1", "06.1", "What You Will Leave With"], ["short-06-s2", "06.2", "Before This Module"], ["short-06-s3", "06.3", "Why the Machine Needs to Know You"], ["short-06-s4", "06.4", "Let the AI Interview You"], ["short-06-s5", "06.5", "Your Success Sentence, and What You Will Give Up"], ["short-06-s6", "06.6", "Your Strengths, Written Down"], ["short-06-s7", "06.7", "Write Your USER.md"], ["short-06-s8", "06.8", "The Stranger Test"], ["short-06-s9", "06.9", "From the Record"], ["short-06-s10", "06.10", "Worksheet"], ["short-06-s11", "06.11", "Teaching Notes"]], "body": "<section class=\"card\" id=\"short-06-s1\"><h2><span class=\"num\">06.1<\/span> What You Will Leave With<\/h2><p><strong>Your USER.md.<\/strong> This is a short file that tells every AI tool in your system who you are. It covers:<\/p>\n<ul>\n<li>your work<\/li>\n<li>your people<\/li>\n<li>your week<\/li>\n<li>how you want to be spoken to<\/li>\n<li>what &quot;helped&quot; means to you<\/li>\n<li>your hard rules<\/li>\n<\/ul>\n<p>In the build, it goes into your AI assistant's instructions. In the Full course, it is also loaded into your bot.<\/p>\n<p><strong>Your table of who must never see what.<\/strong> This says what information must never reach whom. It stays in your vault, beside your Data Map. In the next module, it becomes rules.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-06-s2\"><h2><span class=\"num\">06.2<\/span> Before This Module<\/h2><ul>\n<li><strong>Your Data Map from Module 02.<\/strong> It decides what may go into this file.<\/li>\n<li><strong>Gemini, open on your phone or laptop.<\/strong> It works in Hong Kong without a VPN, so it is the default for this exercise. Any AI assistant you can reach works.<\/li>\n<li><strong>The interview prompt,<\/strong> copied from the course notes.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-06-s3\"><h2><span class=\"num\">06.3<\/span> Why the Machine Needs to Know You<\/h2><p><strong>An AI model starts every conversation knowing nothing about you.<\/strong> It talks to everyone the same way. So its advice suits an average person, not you.<\/p>\n<p><strong>The difference between &quot;a Claude&quot; and &quot;my Claude&quot; is a set of files.<\/strong> Annie found this out in August 2026 (Build Log 46).<\/p>\n<ul>\n<li>She moved her builder onto her server.<\/li>\n<li>The same Claude Code that knew her on the laptop was a stranger on the server.<\/li>\n<li>Then three things were copied across: its instruction file, its memory files and its continuity note.<\/li>\n<li>A test from the server, with no history, then answered four questions that only those files could answer:\n<ul>\n<li>who she is<\/li>\n<li>two of her communication rules<\/li>\n<li>one thing never to reveal<\/li>\n<li>which machine it was on<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>There is no setup that suits everybody.<\/strong> A developer she worked with said this in May 2026. Setting up an AI is very personal (May 2026 call notes).<\/p>\n<p><strong>This file is about you. The next module is about the AI assistant.<\/strong> Keep the two apart (Hermes Master Doc).<\/p>\n<ul>\n<li>Facts about you and your people go in USER.md.<\/li>\n<li>The AI assistant's own personality and rules go in separate files, in the next module.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-06-s4\"><h2><span class=\"num\">06.4<\/span> Let the AI Interview You<\/h2><p>You will not write this file from a blank page. An AI will interview you, one question at a time. Then you turn your answers into the file. This method comes from Annie's seminar starter kit, file 02. It takes about 15 minutes.<\/p>\n<p><strong>Step 1. Check your Data Map before you type anything.<\/strong> Your answers go to the AI company that runs the AI assistant.<\/p>\n<ul>\n<li>Look at your Tier 3 list: passwords, ID numbers, bank details, and the health details you listed.<\/li>\n<li>None of it goes into the interview.<\/li>\n<li>Name people by role or first name only.<\/li>\n<li>Give no phone numbers or emails.<\/li>\n<\/ul>\n<p><strong>Step 2. Open Gemini<\/strong> at gemini.google.com, or another AI assistant you can use.<\/p>\n<p><strong>Step 3. Paste this prompt as your first message.<\/strong><\/p>\n<pre><code class=\"language-text\">Help me write a short profile of myself that my personal AI assistant will read before every conversation.\n\nInterview me first. Ask ONE question at a time, then wait for my answer. Never give me a list of questions. Keep it warm and plain. I am smart but not technical.\n\nAsk about 8 to 10 questions, covering:\n1. Who I am: my work, my role, and the big things on my plate.\n2. My people: who they are by role, and what I would want an AI assistant to do for or with each.\n3. My week: fixed commitments, my best focus time, and times I must not be interrupted.\n4. How I like to be spoken to: long or short, gentle or blunt, reasons or just answers, and what annoys me.\n5. How my attention works on a busy day.\n6. The three things I most wish I could stop carrying in my head, and the honest reason I want them gone.\n7. What I do well, so my AI assistant protects it rather than taking it over.\n8. Two or three rules my AI assistant must always follow. Suggest these: never guess, say when you do not know, and tell me when I am wrong.\n\nFor every rule I give you, ask me why, and write the reason next to the rule.\n\nWhen we finish, write the profile in the first person, under clear headings, in short sentences, in under 1,300 characters. Do not include passwords, ID numbers, bank details or anyone's contact details.\n\nStart by introducing yourself in one line, then ask your first question.\n<\/code><\/pre>\n<p><strong>Step 4. Answer casually.<\/strong> Short answers are fine. If a question does not fit, say so and move on.<\/p>\n<p><strong>What success looks like.<\/strong> After 8 to 10 questions, the AI assistant writes a short profile. It is under headings, in the first person, with a reason beside each rule.<\/p>\n<p><strong>If it fails:<\/strong><\/p>\n<ul>\n<li><strong>The AI assistant asks all its questions at once.<\/strong> Reply &quot;one question at a time, please&quot;.<\/li>\n<li><strong>You cannot reach any AI assistant.<\/strong> Pair with a partner. Your partner reads the eight topics to you as questions and writes down your answers.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-06-s5\"><h2><span class=\"num\">06.5<\/span> Your Success Sentence, and What You Will Give Up<\/h2><p><em>Full course segment. Short course students take this from interview question 6.<\/em><\/p>\n<p><strong>Write one sentence that says what &quot;working&quot; will look like for you in a month.<\/strong><\/p>\n<p><strong>Annie's examples.<\/s
