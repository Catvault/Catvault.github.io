ut it had done nothing for about four weeks (Build Log 45). It did not show in <code>hermes cron list<\/code>, which is why nobody saw it (Build Log 51).<\/p>\n<\/div><\/section>\n<section class=\"card\" id=\"short-11-s7\"><h2><span class=\"num\">11.7<\/span> The Server Question<\/h2><p><em>10 minutes, Short course only.<\/em><\/p>\n<p>You have just seen that a laptop schedule only runs while the laptop is awake. So now the question is real: do you need a server?<\/p>\n<p><strong>What a server gives you:<\/strong><\/p>\n<ol>\n<li>Your AI assistant answers when your laptop is shut.<\/li>\n<li>Scheduled jobs run at 3 am.<\/li>\n<li>Your phone reaches it from anywhere.<\/li>\n<\/ol>\n<p><strong>What a server costs you:<\/strong><\/p>\n<ol>\n<li><strong>Money every month.<\/strong> [COST]<\/li>\n<li><strong>A second computer to look after.<\/strong> In September 2026 Annie's server kept warning that its memory was low. The cause was six Claude Code sessions she had left open. They were 4 to 17 days old and held 1.5 GB, of a server with 3.8 GB in total. None of them closed by itself (Build Log 95).<\/li>\n<li><strong>Logins that expire.<\/strong> Her server's Claude login expired without warning after about 30 days, while chat on her phone still worked (Build Log 75).<\/li>\n<\/ol>\n<p><strong>&quot;Not yet&quot; is an allowed answer.<\/strong> A laptop teaches the same lessons and costs nothing extra.<\/p>\n<p><strong>Exercise.<\/strong> Answer in one sentence on your run card: do I need a server, and why? If you freeze, write it instead of saying it.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-11-s8\"><h2><span class=\"num\">11.8<\/span> From the Record<\/h2><p>Two stories for students who ask for more.<\/p>\n<p><strong>The reminder that arrived twice (Build Log 37).<\/strong> On at least two nights in July 2026 Annie received two receipt reminders, but only one job existed. When she replied &quot;done&quot;, the bot sent the files again as a reply. The fix was a written rule: when she says &quot;done&quot;, log it and do not send the files again.<\/p>\n<p><strong>The bot fixed the wrong file (Build Log 42).<\/strong> In July 2026 Annie asked for a new format for her morning message. The bot said &quot;updated&quot;, and it changed its skill file correctly. The next two mornings still came in the old format. The scheduled job had its own stored instructions, which said &quot;EXACTLY this format&quot;, and those won every time. When a fix does not show up, find which file the job actually reads.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-11-s9\"><h2><span class=\"num\">11.9<\/span> Worksheet: Growing It<\/h2><div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Proof<\/th>\n<th>Course<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Five new brief rows written<\/td>\n<td>My brief<\/td>\n<td>Short<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Keep-or-kill date in my calendar<\/td>\n<td>My calendar<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>One tool I decided not to add, with my reason<\/td>\n<td>My run card<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Script prints the message, prints nothing when quiet, prints failures<\/td>\n<td><code>--dry-run<\/code> output<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>--dry-run<\/code> changed no file<\/td>\n<td>A second dry run<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>One &quot;🧪 TEST&quot; message arrived and I approved it<\/td>\n<td>My phone<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Job is on the schedule at the right time<\/td>\n<td><code>hermes cron list<\/code><\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Job ran once through the scheduler<\/td>\n<td>The message on my phone<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Skill folder holds one file named exactly <code>SKILL.md<\/code><\/td>\n<td>The folder listing<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Skill passed all three tests<\/td>\n<td>My notes<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Rules file points to the skill<\/td>\n<td>The line in my rules file<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>One-sentence answer to the server question<\/td>\n<td>My run card<\/td>\n<td>Short<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Today's build log written, with its index row<\/td>\n<td>The log and the index<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>\n<section class=\"card\" id=\"short-11-s10\"><h2><span class=\"num\">11.10<\/span> Teaching Notes<\/h2><ul>\n<li><strong>Check two things before the course.<\/strong> The <code>hermes cron create<\/code> options in the Hermes version the room installs. And that the pi version the room installs still reads skills from <code>~/.agents/skills/<\/code>.<\/li>\n<li><strong>The skill description is the hard part.<\/strong> v1 called the skill exercise &quot;the hardest fifteen minutes in the course for some students&quot;. Sit with each student and write the trigger phrases together.<\/li>\n<li><strong>The umbrella example is fine.<\/strong> A small job that works teaches more than a large one that does not finish.<\/li>\n<li><strong>Students will want a second job straight away.<\/strong> Point them to week 3 of the 30-day plan (Module 12).<\/li>\n<li><strong>Three students at most.<\/strong> In the Full course, the 40-minute build needs you at each keyboard in turn.<\/li>\n<li><strong>Timing risk:<\/strong> a brief that needs a login (email, calendar) runs long. Switch that student to the umbrella example and leave the real job as homework.<\/li>\n<\/ul>\n<\/section>\n<details class=\"card ref\" id=\"short-11-s11\"><summary><span class=\"num\">11.11<\/span> Where the Versions Went <span class=\"hint\">tap to open<\/span><\/summary><p><strong>Kept from the Claude version (Module 14):<\/strong> the print rule; the script prompt with <code>--dry-run<\/code>; the umbrella example; the &quot;🧪 TEST&quot; message; <code>hermes cron create --help<\/code>; the builder that may refuse (Log 78); one run through the scheduler; the second run; the skill on request; the keep-or-kill date; two &quot;From the Record&quot; stories.<\/p>\n<p><strong>Kept from v1 (Block 12):<\/strong> one thing at a time; why skills exist (Log 19); the skill facts from Logs 90 and 98; the server question, Short course only.<\/p>\n<p><strong>Added:<\/strong> the Log 28 story (moved from v1 Block 1, without the company name and without the &quot;rent the chef&quot; phrase); the five Build Brief rows for the Short course; the three-way skill test; the skill folder for pi, checked on Annie's Mac.<\/p>\n<p><strong>Moved to the handout:<\/strong> formatting for the phone; reading the web with a cap; pause and resume; the two other patterns for steps that need judgement.<\/p>\n<p><strong>Left out:<\/strong> &quot;Check the real trigger&quot; (Log 41), because the brief already asks for the trigger; the morning brief story (Log 27), because its two-week test is used instead; v1's &quot;the line for next month&quot;, which Module 12's 30-day plan replaces; v1's &quot;The model does not know what today is&quot; and &quot;The identity check takes about a day&quot;, which have nothing to do with choosing a server.<\/p>\n<p><strong>Errors fixed:<\/strong><\/p>\n<ul>\n<li><strong>Log 00's figures.<\/strong> v1 said &quot;half a day of logged work on top of a week of confusion&quot;. Log 00 says 13 logged hours, plus about a week of Annie's research.<\/li>\n<li><strong>Log 95's figures.<\/strong> v1 said the sessions were &quot;aged five to eighteen days&quot;. Log 95 says 4 to 17 days old.<\/li>\n<li><strong>The job outside the scheduler.<\/strong> The Claude version cited Log 42, which has no such story. Log 45 found it doing nothing for about four weeks, and Log 51 records it.<\/li>\n<li><strong>Log 00's cause.<\/strong> Earlier drafts said the first bot broke from a batch of untested automations. Log 00 says its cheap model could not use its tools and faked success. &quot;Don't add features in batches&quot; is from the rebuild notes, and the 24 to 48 hours was a plan.<\/li>\n<li><strong>&quot;No more Tier 3 cron prompts&quot; is not quoted.<\/strong> In Log 00, Tier 3 means a level of model. The course uses Tier 3 for data that never goes into AI (Module 02), so the quote would give students two meanings.<\/li>\n<li><strong>Log 37's fix<\/strong> was a written rule not to re-send the files, not the print-nothing change.<\/li>\n<li><strong>Log 48's lesson<\/strong> came from the client-document skill, then applied to Storage Inventory.<\/li>\n<li><strong>v1 contradicted itself.<\/strong> Its notes said one addition per student. Its exercise asked for a schedule and a skill. Now the Full course builds both, one after the other, each tested first, and the Short course builds one.<\/li>\n<li><strong>v1's heading &quot;The Description Is the Whole Routing Surface&quot;<\/strong> used a phrase the course register bans. It is now &quot;Three facts decide whether a skill works&quot;.<\/li>\n<li><strong>v1's unsourced claims were removed:<\/strong> &quot;the single most common reason a skill sits unused&quot;, &quot;usually about a month after you start depending on the thing&quot;, and the saying &quot;A server collects the things you forget to close.&quot;<\/li>\n<li><strong>v1 never said where a skill file goes.<\/strong> The table now gives the folder for each course.<\/li>\n<li><strong>The Claude version's &quot;break your job on purpose&quot; exercise had no time on its run sheet.<\/strong> Module 10 already does this, so it is not repeated.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"short-11-s12\"><summary><span class=\"num\">11.12<\/span> Sources <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>Build Log 00: the first bot's collapse; 13 logged hours; &quot;Don't add features in batches&quot;; version 2's three things.<\/li>\n<li>Build Log 19: the 2,200-character memory; facts in memory, procedures in skills.<\/li>\n<li>Build Log 27: new messages need her yes; the two-week test from 6 July 2026.<\/li>\n<li>Claudith Clean Brief Style note: the morning burst and the 6 pm admin slot.<\/li>\n<li>Build Log 28: the Hermes desktop app, 8 July 2026.<\/li>\n<li>Build Log 35: Annie's weather job.<\/li>\n<li>Build Log 37: the labelled test; the reminder that arrived twice.<\/li>\n<li>Build Log 42: the stored instructions that won.<\/li>\n<li>Build Logs 45 and 51: the job outside the scheduler, August 2026.<\/li>\n<li>Build Log 48: skills used reliably once the rules point to them.<\/li>\n<li>Build Log 75: the server login that expires.<\/li>\n<li>Build Log 78: the builder's safety check.<\/li>\n<li>Build Log 89: the API key used by mistake.<\/li>\n<li>Build Log 90: skill descriptions; 914 and 1,004 of 1,024 characters.<\/li>\n<li>Build Log 94: the model and provider fixed on a job.<\/li>\n<li>Build Log 95: six abandoned sessions, 1.5 GB.<\/li>\n<li>Build Log 98: the backup copy the AI assistant could not see.<\/li>\n<li>Live server check, 10 Oct 2026: &quot;no-agent (script stdout delivered directly)&quot;; <code>hermes cron<\/code> and <code>hermes skills<\/code> commands.<\/li>\n<li>pi on Annie's Mac, 10 Oct 2026: skills read from <code>~/.agents/skills/<\/code>.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"short-11-s13\"><summary><span class=\"num\">11.13<\/span> Related <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>07 — Rules of Engagement (Merged)<\/li>\n<li>08 — The Build (Merged)<\/li>\n<li>08B — The Server and Your Bot (Merged)<\/li>\n<li>09 — Script, Machine Learning or AI Judgement (Merged)<\/li>\n<li>10 — What Breaks, and Keeping It Honest (Merged)<\/li>\n<li>11 — Handout, More Ways to Grow Your System<\/li>\n<li>01 — Merge Tracker (Decisions, Hours, Checks)<\/li>\n<li>00 — Side-by-Side (9 Oct 2026) (Pair 11)<\/li>\n<\/ul>\n<\/details>", "count": 13}, {"id": "short-11h", "label": "11 Handout", "title": "Handout: More Ways to Grow Your System", "minutes": null, "read": 3, "toc": [["short-11h-s1", "11H.1", "Formatting Messages for the Phone"], ["short-11h-s2", "11H.2", "Reading the Web, With a Cap"], ["short-11h-s3", "11H.3", "Pausing and Restarting a Job"], ["short-11h-s4", "11H.4", "Two Ways to Use a Model on a Schedule"]], "body": "<div class=\"intro\"><p><em>A handout for Module 11, both courses. Read it at home, after your first job or skill has run for a week. Each section comes from Annie's build logs. Use one at a time.<\/em><\/p>\n<\/div>\n<section class=\"card\" id=\"short-11h-s1\"><h2><span class=\"num\">11H.1<\/span> Formatting Messages for the Phone<\/h2><p><strong>A correct message is not always a usable one.<\/strong> Annie's weather job worked out the weather correctly. She still said: &quot;in terms of how I want to read it, it's not quite right.&quot; The one line she could act on was hidden under a loud warning sign (Seminar Ideas, 15 and 19 July 2026).<\/p>\n<p><strong>Five of the seven rules in Annie's message format, approved on 15 July 2026<\/strong> (Claudith Clean Brief Style note):<\/p>\n<ol>\n<li>A bold first line that says what this is and when.<\/li>\n<li>A one-line summary under it.<\/li>\n<li>Short &quot;Label: value&quot; lines, with a blank line between items.<\/li>\n<li>Warning signs only where you need to act.<\/li>\n<li>Turn the unimportant items into a count. Send nothing when nothing matters.<\/li>\n<\/ol>\n<p><strong>Telegram shows only some formatting.<\/strong> Bold, italics, code and links work. Headings and quote blocks show as stray characters. Tables turn into bullet lists (Build Log 108).<\/p>\n<p><strong>Read the real message on your real phone.<\/strong> Annie's weather job took 18 changes in 6 days (Build Log 35). Each round of changes came from her reading the real message on her real phone (Seminar Ideas).<\/p>\n<\/section>\n<section class=\"card\" id=\"short-11h-s2\"><h2><span class=\"num\">11H.2<\/span> Reading the Web, With a Cap<\/h2><p>Many useful jobs read web pages. Annie's bots use Firecrawl. It turns a web page into clean text, and it can search. Its free plan gives 1,000 credits a month. A search costs about 2 credits (Annie's notes, 29 Sep 2026).<\/p>\n<p><strong>Cap the job, not only the account.<\/strong> The first run of Annie's company-watch job had no limit on how many searches the AI could make. It used 92 credits and never finished. Limited to 14 calls, it finished in 12 and used 21 credits (<code>Firecrawl — Use Cases<\/code> note).<\/p>\n<p><strong>Her rule for Firecrawl:<\/strong> warn before the limit, and never top up automatically (Annie's Firecrawl notes).<\/p>\n<\/section>\n<section class=\"card\" id=\"short-11h-s3\"><h2><span class=\"num\">11H.3<\/span> Pausing and Restarting a Job<\/h2><p>Pausing keeps the job but stops it from running. Use it on your keep-or-kill date if you are not sure yet.<\/p>\n<pre><code class=\"language-bash\">hermes cron pause &lt;job-id&gt;\nhermes cron resume &lt;job-id&gt;\n<\/code><\/pre>\n<p>Annie once paused a working bill reminder on the day she built it. It only told her to go and check an app, so it removed no work (Build Log 41).<\/p>\n<\/section>\n<section class=\"card\" id=\"short-11h-s4\"><h2><span class=\"num\">11H.4<\/span> Two Ways to Use a Model on a Schedule<\/h2><p>Try these only after week 4 of your 30-day plan (Module 12), with your test questions written first.<\/p>\n<p><strong>1. A model job with its model fixed.<\/strong> The scheduler hands a request to the bot's model. Fix the model and the provider on the job itself. Then a change to the default model cannot move the job without you knowing. Annie's scheduler refuses to run a job that has no fixed model if the default changed after the job was made (Build Log 84). Her command (Build Log 94):<\/p>\n<pre><code class=\"language-bash\">hermes cron edit &lt;job-id&gt; --model deepseek-v4.1-flash --provider opencode-go --pin\n<\/code><\/pre>\n<p><strong>2. The model writes, a script sends.<\/strong> In June 2026 Annie wanted her morning summary as several short messages. A scheduled model job could only send one reply, and the cheap model added its working notes to it. The fix used two jobs. The model job writes only the clean message to a file, and sends nothing. Five minutes later, a script job splits the file and sends each part as its own message (Build Log 15).<\/p>\n<\/section>\n<details class=\"card ref\" id=\"short-11h-s5\"><summary><span class=\"num\">11H.5<\/span> Sources <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>Build Log 15: the two-job pattern.<\/li>\n<li>Build Log 35: 18 changes in 6 days.<\/li>\n<li>Build Log 41: the bill reminder paused the same day.<\/li>\n<li>Build Log 84: the check on jobs with no fixed model.<\/li>\n<li>Build Log 94: fixing the model and provider on a job.<\/li>\n<li>Build Log 108: Telegram formatting.<\/li>\n<li>Claudith Clean Brief Style note, 15 July 2026.<\/li>\n<li>Seminar Ideas, 15 and 19 July 2026.<\/li>\n<li><code>Firecrawl — Use Cases<\/code> note.<\/li>\n<li>Annie's notes, 29 Sep 2026: Firecrawl credits.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"short-11h-s6\"><summary><span class=\"num\">11H.6<\/span> Related <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>11 — Growing It, Skills and Schedules (Merged)<\/li>\n<\/ul>\n<\/details>", "count": 6}, {"id": "short-12", "label": "12", "title": "Module 12: The Close, Your 30-Day Plan", "minutes": 15, "read": 11, "toc": [["short-12-s1", "12.1", "What You Will Leave With"], ["short-12-s2", "12.2", "The Promise, Checked"], ["short-12-s3", "12.3", "The Closing Question"], ["short-12-s4", "12.4", "Your 30-Day Plan"], ["short-12-s5", "12.5", "When It Breaks, and Where to Get Help"], ["short-12-s6", "12.6", "Worksheet: The Close"], ["short-12-s7", "12.7", "Teaching Notes"], ["short-12-s9", "12.9", "Open Points for Annie"]], "body": "<div class=\"intro\"><p><strong>Why this module comes last.<\/strong><\/p>\n<ol>\n<li>Students now own a system that does one real job (Modules 08 and 11).<\/li>\n<li>It has checks that tell them when it breaks (Module 10).<\/li>\n<li>So the last job is to check it against the course promise, and to plan the next four weeks.<\/li>\n<li>The course ends on the student's next action, not on a summary.<\/li>\n<\/ol>\n<\/div>\n<section class=\"card\" id=\"short-12-s1\"><h2><span class=\"num\">12.1<\/span> What You Will Leave With<\/h2><p><strong>Both courses:<\/strong><\/p>\n<ul>\n<li>Your system, checked against the course promise. Any row you cannot tick is written on your run card as work to do.<\/li>\n<li>A 30-day plan, one row for each week, with a stop condition for each week.<\/li>\n<li>The four steps to take when something breaks.<\/li>\n<li>The name of the group chat where you get help for four weeks, and the date of the class call.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-12-s2\"><h2><span class=\"num\">12.2<\/span> The Promise, Checked<\/h2><p><em>5 minutes, both courses.<\/em><\/p>\n<p>At the start, the course promised you a system you can check. Check it now, against what is in front of you.<\/p>\n<p><strong>Short course.<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>The claim<\/th>\n<th>The check<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>One AI assistant on your laptop<\/td>\n<td>Start pi in your folder, and ask it a question<\/td>\n<\/tr>\n<tr>\n<td>One real job<\/td>\n<td>Ask for the job, in the words from your skill's description<\/td>\n<\/tr>\n<tr>\n<td>Three rules you wrote<\/td>\n<td>Name them, and say how each one is checked<\/td>\n<\/tr>\n<tr>\n<td>It tells you when it cannot answer<\/td>\n<td>Ask one of your golden questions that it should refuse, and read the refusal<\/td>\n<\/tr>\n<tr>\n<td>You know what it costs<\/td>\n<td>Read the monthly figure off your run card<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>A row you cannot tick is work to do. It is not a failure.<\/strong> Write the row on your run card. Bring it to the group chat or the class call.<\/p>\n<p><strong>Why the Full course checks the watchdog, not a refusal.<\/strong> The Full course built checks that run by themselves (Module 10). A refusal tests a different thing: the rule about saying when the AI assistant does not know.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-12-s3\"><h2><span class=\"num\">12.3<\/span> The Closing Question<\/h2><p><em>5 minutes, Full course. Short course: homework, written on the run card.<\/em><\/p>\n<p><strong>&quot;What have I built, and what does it take off my mind?&quot;<\/strong><\/p>\n<p><strong>Answer it in one sentence.<\/strong> You can say it to the room, or write it down. If you can describe your system in one sentence, you know what it is for. Keep the sentence somewhere you will see it.<\/p>\n<p><strong>Annie's own sentence, for an example.<\/strong> In August 2026 she wrote what the whole effort is for: clearing what drains her, so she can be present with the people in front of her, including herself (Build Log 72).<\/p>\n<p><strong>The second question, written, not spoken.<\/strong> What would &quot;too much looking after&quot; be for you? For example: more than 30 minutes a week of fixing. Write your limit now. If you reach it later, you switch something off. You do not keep adding.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-12-s4\"><h2><span class=\"num\">12.4<\/span> Your 30-Day Plan<\/h2><p><em>Full course: 10 minutes. Short course: 5 minutes.<\/em><\/p>\n<p><strong>Add one tested thing at a time. Then live with it for a few days before you add the next.<\/strong> This is the rule from Module 11, and it applies after the course too. When Annie broke this rule in May 2026, the clean-up took 13 logged hours (Build Log 00).<\/p>\n<p><strong>Expect to change things many times.<\/strong> Annie built and reshaped her storage system across five days in August 2026. It took about 45 to 50 separate changes (Build Log 52). Changing your mind is how the system becomes yours.<\/p>\n<p><strong>Write your own plan.<\/strong> One row for each week. Each week has a stop condition: the thing that tells you the week is done.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Week<\/th>\n<th>What you do<\/th>\n<th>Stop condition<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1<\/strong><\/td>\n<td>Add nothing new. Use what you built today. Note anything that annoys you<\/td>\n<td>You used it at least three times, and you wrote down each annoyance<\/td>\n<\/tr>\n<tr>\n<td><strong>2<\/strong><\/td>\n<td>Your keep-or-kill date arrives (Module 11). Ask: did I actually use it? Keep it, change it, or switch it off. Bring your answer to the class call<\/td>\n<td>You decided, and you wrote down why<\/td>\n<\/tr>\n<tr>\n<td><strong>3<\/strong><\/td>\n<td>Add one more thing, from your Module 05 maps. One thing, one check, one sentence to describe it<\/td>\n<td>It passed its test, and it ran for three days<\/td>\n<\/tr>\n<tr>\n<td><strong>4<\/strong><\/td>\n<td>Try one task that needs AI judgement. Write your test questions with known answers first, then build it (Module 09)<\/td>\n<td>It passed your test questions. <strong>Full:<\/strong> your RULES file matches <code>hermes cron list<\/code>. <strong>Short:<\/strong> your <code>AGENTS.md<\/code> still describes everything your AI assistant does<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>How to size the week 3 thing.<\/strong> It is one thing. It has one check. You can describe it in one sentence. &quot;Send me the invoices that need a claim&quot; is one thing. &quot;Sort out my admin&quot; is not.<\/p>\n<p><strong>Switching something off counts as progress.<\/strong> On 27 July 2026 Annie built a job that watched for her credit card statement. Every test passed. She switched it off a few hours later. The bank's email never contained the amount or the due date, so the job could only ever say &quot;go and check the app&quot;. It did not remove a chore, so it did not earn a place (Build Log 41).<\/p>\n<p><strong>Short course, week 3:<\/strong> if you took the optional server sitting, your one more thing can be a scheduled job. Follow Module 11's Full course steps.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-12-s5\"><h2><span class=\"num\">12.5<\/span> When It Breaks, and Where to Get Help<\/h2><p><em>5 minutes, both courses.<\/em><\/p>\n<h3>The Four Steps<\/h3>\n<p>When something goes wrong, do these in order. Read the real thing before you guess.<\/p>\n<ol>\n<li><strong>Read what the AI assistant actually said,<\/strong> and what the file actually contains.<\/li>\n<li><strong>Check which folder it was started in.<\/strong> Most &quot;it forgot my rules&quot; problems are the wrong folder.<\/li>\n<li><strong>Check that the rule is written in a file.<\/strong> A rule you only said in a chat is gone after the chat ends.<\/li>\n<li><strong>Ask your builder one question, with the real output pasted in.<\/strong><\/li>\n<\/ol>\n<p><strong>If the four steps do not fix it, go to the group chat.<\/strong> Paste the real output there too. A copy of the error is quicker to answer than a description of it.<\/p>\n<h3>Help for Four Weeks After the Course<\/h3>\n<ul>\n<li><strong>A shared group chat for the class, for four weeks.<\/strong> It covers your whole 30-day plan.<\/li>\n<li><strong>Who answers:<\/strong> Annie or a co-teacher, as messages arrive. You should not lose a day of progress waiting for an answer.<\/li>\n<li><strong>The hours the chat is covered:<\/strong> [TO CONFIRM]. The co-teachers live in other time zones, so the hours are agreed after this draft.<\/li>\n<li><strong>One class call at the end of week 2,<\/strong> 30 to 45 minutes. This is when your keep-or-kill date arrives. Bring your answer, and any row from the promise check you could not tick.<\/li>\n<li><strong>Included in the course fee or paid extra:<\/strong> [COST].<\/li>\n<\/ul>\n<p><strong>Write on your run card:<\/strong> the chat's name, the date and time of the class call, and the four steps.<\/p>\n<h3>The Last Save<\/h3>\n<p><em>Full course: 5 minutes. Short course: at the end of the help segment.<\/em><\/p>\n<p>Say <strong>&quot;save&quot;<\/strong> to your builder. It updates your continuity note and writes today's build log with its index row, as you set up in Module 08. This is the last thing you do in the course.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-12-s6\"><h2><span class=\"num\">12.6<\/span> Worksheet: The Close<\/h2><div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Proof<\/th>\n<th>Course<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Every promise row checked<\/td>\n<td>My run card, with any row I could not tick<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>One sentence: what I built, and what it takes off my mind<\/td>\n<td>My run card<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My limit for &quot;too much looking after&quot;<\/td>\n<td>My run card<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Drill 1: alert action done, with no builder<\/td>\n<td>Watchdog <code>--status<\/code> all green<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Drill 2: deleted on the server, gone from the laptop<\/td>\n<td>Obsidian on my laptop<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>30-day plan, four rows, each with a stop condition<\/td>\n<td>My plan<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Keep-or-kill date still in my calendar<\/td>\n<td>My calendar<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>The four steps, the chat's name and the call date<\/td>\n<td>My run card<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Last save done<\/td>\n<td>My continuity note and build log<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>\n<section class=\"card\" id=\"short-12-s7\"><h2><span class=\"num\">12.7<\/span> Teaching Notes<\/h2><ul>\n<li><strong>End on the student's next action.<\/strong> The last thing each student hears is &quot;start week 1 tomorrow&quot;, not a summary.<\/li>\n<li><strong>Some adults freeze when asked to speak.<\/strong> Always allow a written answer to the closing question.<\/li>\n<li><strong>Students who used a fallback in the build<\/strong> (the umbrella example, or a browser) will have rows they cannot tick. Say plainly that this is work to do, not failure.<\/li>\n<li><strong>The drills are done without the builder on purpose.<\/strong> If a student opens Claude Code or pi, ask them to close it. The drill tests the run card, not the builder.<\/li>\n<li><strong>Prepare drill 1 before class.<\/strong> Print one sample alert for each student. Check each student's watchdog alert format in Module 10, so the sample looks like their own.<\/li>\n<li><strong>Drill 2 needs the vault on the server.<\/strong> Check this per student in Module 08B. A student without it skips the drill.<\/li>\n<li><strong>Name the group chat and set the call date before class.<\/strong> A student should leave with both written down, not &quot;we will let you know&quot;.<\/li>\n<li><strong>Three students at most.<\/strong> In the drills, you watch each screen in turn.<\/li>\n<\/ul>\n<\/section>\n<details class=\"card ref\" id=\"short-12-s8\"><summary><span class=\"num\">12.8<\/span> Where the Versions Went <span class=\"hint\">tap to open<\/span><\/summary><p><strong>Kept from v1 (Block 13):<\/strong> the promise, checked; the closing question and the &quot;too much looking after&quot; limit; how to size a next step; the switch-off story (now cited as Log 41); the four steps when it breaks; Annie's sentence (Log 72).<\/p>\n<p><strong>Kept from the Claude version (Module 15):<\/strong> the 30-day plan with a stop condition for each week; &quot;expect to change things many times&quot; (Log 52); the last save; ending on the student's next action.<\/p>\n<p><strong>Added:<\/strong><\/p>\n<ul>\n<li>The two owner drills, Full course only (moved here from Pair 10, Annie's call on 10 Oct 2026).<\/li>\n<li>Help after the course: the group chat for four weeks and the class call at the end of week 2 (Annie's decisions, 10 Oct 2026).<\/li>\n<li>A separate promise table for each course, because the two courses build different things.<\/li>\n<li>A Short course week 4 stop condition, because <code>hermes cron list<\/code> only works on a server.<\/li>\n<\/ul>\n<p><strong>Changed:<\/strong><\/p>\n<ul>\n<li><strong>The plan's weeks 2 and 3 swapped.<\/strong> The Claude version added a second job in week 2 and did keep-or-kill in week 3. Module 11 already sets the keep-or-kill date two weeks after the build. So keep-or-kill is now week 2, on the same week as the class call, and the second thing is added in week 3.<\/li>\n<li><strong>v1's two lines (&quot;the next thing I will add&quot;, &quot;the thing I will switch off&quot;)<\/strong> are now weeks 2 and 3 of the plan.<\/li>\n<\/ul>\n<p><strong>Left out:<\/strong> v1's &quot;Next&quot; section (&quot;bring your assistant to the next session only if you are asked to&quot;), because there is no next session; v1's &quot;rebuild it in an hour&quot; line, because it has no source.<\/p>\n<p><strong>Errors fixed:<\/strong><\/p>\n<ul>\n<li><strong>v1 promised three things and wrote two.<\/strong> The heading said &quot;The Next Three Things&quot;. The plan now has four weekly rows, and nothing promises three.<\/li>\n<li><strong>v1 said &quot;half a day of logged work&quot;.<\/strong> Log 00 says 13 logged hours.<\/li>\n<li><strong>v1's switch-off story had no log number.<\/strong> It is Log 41, 27 July 2026, switched off the same day.<\/li>\n<li><strong>v1's &quot;It tells you when it breaks&quot; row tested a refusal.<\/strong> In the Full course it now runs the watchdog. The Short course keeps the refusal, because its check is the golden questions (Module 10).<\/li>\n<li><strong>v1's run sheet said &quot;write where to get help&quot; but named no place.<\/strong> The group chat and the class call are now named.<\/li>\n<li><strong>The Claude version said Annie's second system started with one reminder &quot;lived with for two days&quot;.<\/strong> Log 00 records a plan to live with it for 24 to 48 hours. This module does not repeat the line.<\/li>\n<li><strong>Compressed sayings rewritten as plain sentences:<\/strong> &quot;Bring the failure, not the worry&quot;, &quot;Any row you cannot answer is work, not failure&quot;, and &quot;a chore announced rather than a chore removed&quot;.<\/li>\n<li><strong>v1's unsourced claim removed:<\/strong> &quot;Every problem in this course was solved by reading the real output.&quot;<\/li>\n<\/ul>\n<\/details>\n<section class=\"card\" id=\"short-12-s9\"><h2><span class=\"num\">12.9<\/span> Open Points for Annie<\/h2><ol>\n<li><strong>Group chat hours,<\/strong> parked to talk about with the co-teachers (tracker, question 5). The module says [TO CONFIRM] until then.<\/li>\n<li><strong>Module 11 points to the wrong week.<\/strong> Its teaching note says &quot;point them to week 2 of the 30-day plan&quot; for a second job. With weeks 2 and 3 swapped, that is now week 3. Module 11 is approved, so it is not changed without Annie's yes. <em>Done 11 Oct 2026: Annie accepted Claude's recommendation, and Module 11 now says week 3.<\/em><\/li>\n<\/ol>\n<\/section>\n<details class=\"card ref\" id=\"short-12-s10\"><summary><span class=\"num\">12.10<\/span> Sources <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>Build Log 00: 13 logged hours; one tested thing at a time; the 24 to 48 hour plan.<\/li>\n<li>Build Log 41: the credit card statement job, switched off on 27 July 2026, the same day; &quot;does it delete a chore&quot;.<\/li>\n<li>Build Log 52: about 45 to 50 changes across five days, 17 to 22 August 2026.<\/li>\n<li>Build Log 72: clearing what drains you so you can be present.<\/li>\n<li>Build Log 106: a delete only reaches every device if it is made on the server first.<\/li>\n<li>Merge Tracker, 10 Oct 2026: help after the course (both), who answers the chat, the two owner drills, the 40 and 15 minute split.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"short-12-s11\"><summary><span class=\"num\">12.11<\/span> Related <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>08 — The Build (Merged)<\/li>\n<li>08B — The Server and Your Bot (Merged)<\/li>\n<li>09 — Script, Machine Learning or AI Judgement (Merged)<\/li>\n<li>10 — What Breaks, and Keeping It Honest (Merged)<\/li>\n<li>11 — Growing It, Skills and Schedules (Merged)<\/li>\n<li>01 — Merge Tracker (Decisions, Hours, Checks)<\/li>\n<li>00 — Side-by-Side (9 Oct 2026) (Pair 12)<\/li>\n<\/ul>\n<\/details>", "count": 11}, {"id": "short-08b", "label": "08B Optional", "title": "Module 08B: The Server and Your Bot (Optional Server Sitting)", "minutes": 100, "read": 28, "toc": [["short-08b-s1", "08B.1", "What You Will Leave With"], ["short-08b-s2", "08B.2", "Before This Module"], ["short-08b-s3", "08B.3", "The Plan and the Four Safety Rules"], ["short-08b-s4", "08B.4", "Snapshot and SSH Key"], ["short-08b-s5", "08B.5", "First Login, Timezone and Updates"], ["short-08b-s6", "08B.6", "Secure the Server, in an Order That Cannot Lock You Out"], ["short-08b-s7", "08B.7", "Create the Telegram Bot"], ["short-08b-s8", "08B.8", "Install Hermes and Connect It"], ["short-08b-s9", "08B.9", "Load Your Files and Make It Restart on Its Own"], ["short-08b-s10", "08B.10", "Three Tests: Quoting Rules, Saying It Does Not Know, and Golden Questions"], ["short-08b-s11", "08B.11", "Same Model, Different Program: Why pi and the Bot Answer Differently"], ["short-08b-s12", "08B.12", "Homework: A Normal User, a Swap File and a Reboot Test"], ["short-08b-s13", "08B.13", "The Optional Short Course Server Session"], ["short-08b-s14", "08B.14", "From the Record"], ["short-08b-s15", "08B.15", "Worksheet: Server and Bot Checklist"], ["short-08b-s16", "08B.16", "Teaching Notes"], ["short-08b-s17", "08B.17", "Not Yet Tested"]], "body": "<div class=\"intro\"><p><strong>This order has not been run yet.<\/strong> Annie will run it herself before it is taught: on a fresh test server, from Hong Kong, with no VPN (Merge Tracker, Checks Before Teaching, item 6). If a step fails in her test, this module changes first.<\/p>\n<\/div>\n<section class=\"card\" id=\"short-08b-s1\"><h2><span class=\"num\">08B.1<\/span> What You Will Leave With<\/h2><p><strong>Optional Short course server session:<\/strong><\/p>\n<ul>\n<li>A locked server in Singapore that accepts only your key. It has a firewall and automatic bans.<\/li>\n<li>A Telegram bot lives on it. The bot answers only you, restarts by itself and quotes your rules.<\/li>\n<li>Your laptop and pi stay exactly as they were.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-08b-s2\"><h2><span class=\"num\">08B.2<\/span> Before This Module<\/h2><ul>\n<li><strong>Your server, ordered in Module 03.<\/strong> Its IP address and the provider's console login are in your password manager.<\/li>\n<li><strong>pi working on your laptop<\/strong> (Module 08, &quot;Full Course: Before the Server&quot; or &quot;Short Course&quot;), opening in your vault.<\/li>\n<li><strong>Your SOUL, RULES and USER files<\/strong> (Full) or your <code>AGENTS.md<\/code> and USER (Short), in the vault's <code>AI System<\/code> folder.<\/li>\n<li><strong>Telegram on your phone,<\/strong> with two-factor sign-in on.<\/li>\n<li><strong>Tailscale on your phone<\/strong> (Full only). Install the app now. You sign in during the module.<\/li>\n<li><strong>Obsidian Sync, bought before this module<\/strong> (Full only, and only if the vault goes on the server). About $4 to $5 a month <strong>[COST]<\/strong>. The Claude version's pre-work listed this a session too late.<\/li>\n<li><strong>If you already pay for a commercial VPN, switch it off before this module and leave it off.<\/strong> Two VPNs on one machine fight over the same settings (Build Log 64).<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-08b-s3\"><h2><span class=\"num\">08B.3<\/span> The Plan and the Four Safety Rules<\/h2><p><em>5 minutes. Both courses.<\/em><\/p>\n<p><strong>You will not type most of these commands. pi does, and you approve each one.<\/strong><\/p>\n<ul>\n<li>Annie's guide is direct about this. Let the builder (here, pi) drive the install. Do not follow random tutorials by hand. The builder reads the errors and fixes them (How to Build Your Own Claudith guide, Part 3).<\/li>\n<li>Each step shows <strong>what to ask pi<\/strong>, the commands it should run, and <strong>what success looks like<\/strong>.<\/li>\n<li>Read the command before you approve it.<\/li>\n<\/ul>\n<p><strong>Why pi, and not Claude Code.<\/strong><\/p>\n<ul>\n<li>pi answers from Hong Kong directly.<\/li>\n<li>Nothing in this module can cut pi off, because it never depends on the network you are building.<\/li>\n<li>Claude Code would need a route out before it could start (Module 08, &quot;Why pi comes first&quot;).<\/li>\n<\/ul>\n<p>Start pi in your vault and paste:<\/p>\n<pre><code class=\"language-text\">Today we set up my new Ubuntu server. Its IP address is in my password manager; I will paste it when you ask. You run commands on it over SSH from this laptop. Work one step at a time. Before each step, show me the command and what it changes. After each step, check it worked and show me the proof. Back up any file before editing it. Do not change anything I have not approved. If a command asks for a password or passphrase, give it to me to run myself in a second Terminal window. Keep a list of every change for my build log.\n<\/code><\/pre>\n<p><strong>The four safety rules.<\/strong> Annie learned each one on her own server.<\/p>\n<ol>\n<li><strong>Snapshot first.<\/strong> Before her first build in May 2026, Annie took a full snapshot of her server in the provider's console. If the build went wrong, she could return the server to that exact state (Build Log 00).<\/li>\n<li><strong>Every change that could lock you out needs an automatic undo.<\/strong> In September 2026 Annie changed which accounts may log in to her server (Build Log 103).\n<ul>\n<li>Before the change, she set a ten-minute timer. It would undo the change automatically if she was locked out.<\/li>\n<li>She cancelled the timer once the change was proven.<\/li>\n<\/ul>\n<\/li>\n<li><strong>One change at a time, tested before the next.<\/strong> In June 2026 her bot kept the same process number through every security change. That proved nothing had restarted or broken (Build Log 06).<\/li>\n<li><strong>The provider's web console still works when SSH does not.<\/strong> If anything locks you out, log in there.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"short-08b-s4\"><h2><span class=\"num\">08B.4<\/span> Snapshot and SSH Key<\/h2><p><em>10 minutes. Both courses.<\/em><\/p>\n<p><strong>Step 1. Take a snapshot.<\/strong> In your provider's web console, find the server. Choose &quot;Snapshot&quot; or &quot;Backup now&quot;. Name it <code>day-1-before-build<\/code>.<\/p>\n<p>What success looks like: the snapshot appears in the list.<\/p>\n<p><strong>Step 2. Make an SSH key on your laptop.<\/strong> An SSH key is a pair of files.<\/p>\n<ul>\n<li>The private file stays on your laptop. It proves who you are.<\/li>\n<li>The public file goes on the server.<\/li>\n<\/ul>\n<p>pi gives you this command to run yourself in a second Terminal window, because it asks for a passphrase:<\/p>\n<pre><code class=\"language-bash\">ssh-keygen -t ed25519 -C &quot;laptop-yourname&quot;\n<\/code><\/pre>\n<p><strong>Use a passphrase.<\/strong> Annie's first build log lists this as the one protection she had not set up. A passphrase makes a stolen key file useless on its own. Your Mac's keychain can remember it (Build Log 00).<\/p>\n<p><strong>Label every key with the device it belongs to.<\/strong> Annie's phone and tablet keys both arrived labelled <code>moshi<\/code>. So a list of keys could not tell them apart. She relabelled them by device (Build Log 103).<\/p>\n<p><strong>Step 3. Put the public key on the server.<\/strong> If your provider emailed you a root password, run this yourself in the second window:<\/p>\n<pre><code class=\"language-bash\">ssh-copy-id -i ~/.ssh/id_ed25519.pub root@&lt;your-server-ip&gt;\n<\/code><\/pre>\n<ul>\n<li>You type the root password once.<\/li>\n<li>If your provider asked for a key at order time, paste the contents of <code>~/.ssh/id_ed25519.pub<\/code> into the provider's console instead.<\/li>\n<li>On Windows, <code>ssh-copy-id<\/code> may not exist. Use the console.<\/li>\n<\/ul>\n<p>What success looks like: <code>ssh root@&lt;your-server-ip&gt;<\/code> logs you in without asking for the server password.<\/p>\n<p><strong>Only the file ending in <code>.pub<\/code> is safe to share.<\/strong> Never paste the private key anywhere.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-08b-s5\"><h2><span class=\"num\">08B.5<\/span> First Login, Timezone and Updates<\/h2><p><em>10 minutes. Both courses.<\/em><\/p>\n<p><strong>Step 4. Set the timezone.<\/strong> Servers arrive set to UTC (Build Logs 00 and 14).<\/p>\n<ul>\n<li>For about a month, Annie's bot gave tomorrow's date in the evenings.<\/li>\n<li>The cause: the server's clock ran eight hours behind Hong Kong.<\/li>\n<li>Her first build log said the timezone was set. It was not.<\/li>\n<\/ul>\n<pre><code class=\"language-bash\">timedatectl set-timezone Asia/Hong_Kong\ntimedatectl\n<\/code><\/pre>\n<p>What success looks like: the output shows <code>Asia/Hong_Kong<\/code>, and the local time matches your watch.<\/p>\n<p><strong>Step 5. Update the system.<\/strong><\/p>\n<pre><code class=\"language-bash\">apt update &amp;&amp; apt upgrade -y\n<\/code><\/pre>\n<p>What success looks like: it finishes without red errors. It may ask about a changed configuration file. If so, keep the version already installed.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-08b-s6\"><h2><span class=\"num\">08B.6<\/span> Secure the Server, in an Order That Cannot Lock You Out<\/h2><p><em>15 minutes. Both courses. From the Claude version's Module 12 and v1's Logs 05 and 06.<\/em><\/p>\n<p><strong>Annie's example (Build Logs 05 and 06).<\/strong><\/p>\n<ul>\n<li>For its first month, Annie's server had five secret files that any user on it could read. It had no firewall.<\/li>\n<li>Her guide says it plainly: nothing bad happened, and that was luck, not design (guide, Part 3, Step 6).<\/li>\n<li>Her review in June 2026 looked first and changed nothing. It sorted the fixes by risk.<\/li>\n<li>The next day the fixes went in, in an order that could not lock her out.<\/li>\n<\/ul>\n<p><strong>Step 6. Look first.<\/strong> Ask pi to report how SSH is set up and which ports are open. It must not change anything.<\/p>\n<pre><code class=\"language-bash\">sshd -T | grep -E 'passwordauthentication|permitrootlogin|pubkeyauthentication'\nss -tulnp\n<\/code><\/pre>\n<p>What success looks like: a short report. Only SSH (port 22) should face the internet.<\/p>\n<p><strong>Step 7. Prove your key works in a second window.<\/strong><\/p>\n<ul>\n<li>Open a new Terminal window and log in with <code>ssh root@&lt;your-server-ip&gt;<\/code>.<\/li>\n<li>Keep this window open for the rest of the module.<\/li>\n<li>If a change goes wrong, this window is still logged in and can undo it.<\/li>\n<\/ul>\n<p><strong>Step 8. Turn off password logins.<\/strong> Ask pi to write a small separate settings file. It should not edit the main one. Then each change is easy to see and undo (Build Log 103). The file <code>/etc/ssh/sshd_config.d/99-hardening.conf<\/code> should contain:<\/p>\n<pre><code class=\"language-text\">PasswordAuthentication no\nKbdInteractiveAuthentication no\nPermitRootLogin prohibit-password\n<\/code><\/pre>\n<p>Then check the settings before applying them, and reload:<\/p>\n<pre><code class=\"language-bash\">sshd -t &amp;&amp; systemctl reload ssh\n<\/code><\/pre>\n<p>What success looks like: <code>sshd -t<\/code> prints nothing, which means no errors. A third new window still logs in with your key.<\/p>\n<p><strong>Step 9. Turn on the firewall, allowing SSH first.<\/strong> The order matters. Allow SSH, then block everything else coming in. Annie's review named this as the only lockout risk in the whole security review (Build Log 05).<\/p>\n<pre><code class=\"language-bash\">ufw allow OpenSSH\nufw default deny incoming\nufw default allow outgoing\nufw --force enable\nufw status verbose\n<\/code><\/pre>\n<p>What success looks like (Build Log 05):<\/p>\n<ul>\n<li>The firewall is active, with SSH allowed.<\/li>\n<li>A new window still logs in.<\/li>\n<li>The bot only makes outgoing connections. So this firewall will not block it later.<\/li>\n<\/ul>\n<p><strong>Step 10. Ban repeated failed logins, and keep security updates automatic.<\/strong><\/p>\n<pre><code class=\"language-bash\">apt install -y fail2ban\nfail2ban-client status sshd\nsystemctl is-enabled unattended-upgrades\n<\/code><\/pre>\n<p>What success looks like: fail2ban reports an <code>sshd<\/code> jail, and unattended upgrades shows <code>enabled<\/code>. Annie's server runs both (live server check, 2 Oct 2026).<\/p>\n<p><strong>Lock the secret files as you add them.<\/strong> Any file holding a key or token gets <code>chmod 600<\/code>. Then only its owner can read it. Annie's five readable secret files were fixed this way (Build Log 06).<\/p>\n<p><strong>If you get locked out:<\/strong> log in through the provider's web console. Ask pi to undo the last change from its backup.<\/p>\n<p><strong>Optional Short course server session: the server steps stop here.<\/strong> Go to &quot;Create the Telegram Bot&quot;.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-08b-s7\"><h2><span class=\"num\">08B.7<\/span> Create the Telegram Bot<\/h2><p><em>10 minutes. Both courses.<\/em><\/p>\n<p><strong>Step 27. Open Telegram and search for <code>@BotFather<\/code>.<\/strong> Check for the blue verified tick. This is Telegram's official account for creating bots.<\/p>\n<p><strong>Step 28. Send <code>/newbot<\/code>.<\/strong> Give it a display name, then a username ending in <code>bot<\/code>. Choose a username that does not include your full name.<\/p>\n<p><strong>Step 29. Save the token (Build Log 103).<\/strong><\/p>\n<ul>\n<li>BotFather replies with a long token.<\/li>\n<li>Anyone with this token controls your bot.<\/li>\n<li>Save it in your password manager straight away.<\/li>\n<li>Never paste it into a chat with any AI, a note or your vault.<\/li>\n<\/ul>\n<p>What success looks like: the token is in your password manager, and your new bot appears in Telegram.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-08b-s8\"><h2><span class=\"num\">08B.8<\/span> Install Hermes and Connect It<\/h2><p><em>15 minutes. Both courses.<\/em><\/p>\n<p>A bot has four parts:<\/p>\n<ul>\n<li><strong>Framework:<\/strong> the program that runs the bot. It holds its tools, memory, schedules and rules.\n<ul>\n<li>This course uses Hermes Agent by Nous Research.<\/li>\n<li>Annie's server runs version 0.21.5 (live server check, 2 Oct 2026).<\/li>\n<\/ul>\n<\/li>\n<li><strong>Channel:<\/strong> where you type to it. This course uses Telegram.<\/li>\n<li><strong>Model:<\/strong> the AI that writes the answers. This course uses DeepSeek V4.1 Flash through opencode Go, the same as your pi.<\/li>\n<li><strong>Files:<\/strong> who it is and what it must do. This course uses your SOUL, RULES and USER.<\/li>\n<\/ul>\n<p><strong>Step 30. Install Hermes.<\/strong> Ask pi:<\/p>\n<pre><code class=\"language-text\">Install Hermes Agent on my server using the official install script from the NousResearch hermes-agent repository. Then set its timezone to Asia/Hong_Kong. Show me each command before running it. When it asks for my Telegram bot token or any key, stop and tell me how to enter it myself without it being shown on screen.\n<\/code><\/pre>\n<p>The commands it should use (official repository, seen 2 Oct 2026; Build Log 14):<\/p>\n<pre><code class=\"language-bash\">curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash\nhermes config set timezone Asia/Hong_Kong\n<\/code><\/pre>\n<p><strong>Set the timezone in Hermes as well as on the server.<\/strong> They are two separate settings. Annie's bot's own timezone setting was blank. That is what caused the month of wrong dates (Build Log 14).<\/p>\n<p><strong>Step 31. Connect Telegram, and allow only yourself.<\/strong> The set-up asks questions, so run it yourself in your SSH window:<\/p>\n<pre><code class=\"language-bash\">hermes gateway setup\n<\/code><\/pre>\n<ol>\n<li>Choose Telegram.<\/li>\n<li>Paste your bot token when asked.<\/li>\n<li>Enter your numeric Telegram user ID (Hermes Telegram documentation, seen 2 Oct 2026).<\/li>\n<\/ol>\n<p><strong>If you do not know your ID (Build Log 52):<\/strong><\/p>\n<ol>\n<li>Leave it blank.<\/li>\n<li>Send your bot one message from your phone.<\/li>\n<li>The bot's log will show your number, in a line saying a user was blocked.<\/li>\n<li>Add that number as the only allowed user.<\/li>\n<\/ol>\n<p>The setting is <code>TELEGRAM_ALLOWED_USERS<\/code>. It holds your number and nobody else's.<\/p>\n<p><strong>Step 32. Connect the model.<\/strong> Ask pi to add your opencode Go key to the bot's <code>.env<\/code> file without printing it. Ask it to set the model in <code>config.yaml<\/code>. Annie's live settings (Build Log 92; live server check, 2 Oct 2026):<\/p>\n<pre><code class=\"language-yaml\">model:\n  default: deepseek-v4.1-flash\n  provider: opencode-go\n  max_tokens: 2048\n<\/code><\/pre>\n<ul>\n<li>The key's name in <code>.env<\/code> on Annie's server is <code>OPENCODE_GO_API_KEY<\/code> (Build Log 94).<\/li>\n<li>Then lock the file: <code>chmod 600 ~/.hermes/.env<\/code>.<\/li>\n<li>Facilitator: confirm the provider set-up in the Hermes documentation on the day.<\/li>\n<\/ul>\n<p><strong>The output limit matters (Build Log 80).<\/strong> <code>max_tokens<\/code> caps how long one answer can be.<\/p>\n<ul>\n<li>Annie's son's tutor bot once wrote an answer of about 15,000 tokens.<\/li>\n<li>It took up to three minutes to reply.<\/li>\n<li>A short-answers rule and a 2,048-token cap brought replies well under a minute.<\/li>\n<\/ul>\n<p><strong>A model name works only on the provider that serves it.<\/strong> When Annie changed provider in September 2026, every model name the old provider used stopped working (Build Log 94).<\/p>\n<\/section>\n<section class=\"card\" id=\"short-08b-s9\"><h2><span class=\"num\">08B.9<\/span> Load Your Files and Make It Restart on Its Own<\/h2><p><em>10 minutes. Both courses.<\/em><\/p>\n<p><strong>Optional Short course server session first.<\/strong> Your Module 07 file is one <code>AGENTS.md<\/code>. Ask pi to split it into two files in your <code>AI System<\/code> folder:<\/p>\n<ul>\n<li><code>SOUL<\/code>: the &quot;Who You Are&quot; section<\/li>\n<li><code>RULES<\/code>: every rules section<\/li>\n<\/ul>\n<p>Hermes reads different files at different times (Hermes documentation, &quot;Which File Does What&quot;, seen 2 Oct 2026):<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Your file<\/th>\n<th>Where it goes on the server<\/th>\n<th>When Hermes reads it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>SOUL<\/td>\n<td><code>~/.hermes/SOUL.md<\/code><\/td>\n<td>At the start of every conversation, first<\/td>\n<\/tr>\n<tr>\n<td>RULES<\/td>\n<td>A file named <code>.hermes.md<\/code> in the bot's working folder<\/td>\n<td>At the start of every conversation<\/td>\n<\/tr>\n<tr>\n<td>USER<\/td>\n<td><code>~/.hermes/memories/USER.md<\/code><\/td>\n<td>At the start of every conversation<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Give the bot its own working folder<\/strong> (Annie's Hermes notes).<\/p>\n<ul>\n<li>Hermes reads <code>.hermes.md<\/code> from the folder set as the bot's working folder in its settings.<\/li>\n<li>Annie uses a dedicated folder, never <code>/root<\/code>. Then her other bots do not load the same rules.<\/li>\n<li>Facilitator: confirm the setting's name on the day.<\/li>\n<\/ul>\n<p><strong>Keep the user file short.<\/strong> Annie's settings cap it at 1,375 characters (bot settings, 9 Oct 2026).<\/p>\n<p><strong>Step 33. Copy the files.<\/strong> Ask pi:<\/p>\n<pre><code class=\"language-text\">Copy SOUL, RULES and USER from my vault's AI System folder into the places in this table on my server. Back up anything already there first. Then restart the bot and show me that the restart worked.\n<\/code><\/pre>\n<p><strong>Restart after any change, then start a fresh chat<\/strong> (Annie's Hermes notes).<\/p>\n<ul>\n<li>The bot loads its files when it starts.<\/li>\n<li>An open Telegram chat also keeps the instructions it started with, even after a restart.<\/li>\n<li>So send <code>/new<\/code> after every change.<\/li>\n<\/ul>\n<pre><code class=\"language-bash\">hermes gateway restart\n<\/code><\/pre>\n<p><strong>Step 34. Make it come back on its own.<\/strong> A bot that stops and stays stopped is worse than no bot, because you think it is working. In September 2026 two of Annie's bots stayed connected to nothing for days, and nobody knew (Build Log 76).<\/p>\n<pre><code class=\"language-bash\">hermes gateway install\n<\/code><\/pre>\n<p>This runs the bot as a service that starts with the server. Then ask pi to show you the service file and confirm the four lines below. Here is why they matter (Build Log 78):<\/p>\n<ul>\n<li>Hermes's Telegram connection gives up after about 10 reconnects and exits.<\/li>\n<li>It expects something to restart it.<\/li>\n<li>On 6 September 2026 nothing did.<\/li>\n<\/ul>\n<pre><code class=\"language-text\">Restart=always\nRestartSec=5\nRestartForceExitStatus=75\nStartLimitIntervalSec=0\n<\/code><\/pre>\n<p>Then check that it runs with nobody logged in:<\/p>\n<pre><code class=\"language-bash\">loginctl show-user root --property=Linger\n<\/code><\/pre>\n<p>What success looks like: <code>Linger=yes<\/code>. Annie's builder once reported the restart settings had &quot;vanished&quot;. It had looked in the wrong list of services (Build Log 80).<\/p>\n<\/section>\n<section class=\"card\" id=\"short-08b-s10\"><h2><span class=\"num\">08B.10<\/span> Three Tests: Quoting Rules, Saying It Does Not Know, and Golden Questions<\/h2><p><em>15 minutes. Both courses.<\/em><\/p>\n<p><strong>A restart proves nothing about whether the bot works.<\/strong> When the bot starts, it does not check its model key. Only a real message does (Build Log 94).<\/p>\n<p><strong>Step 35. The hello test.<\/strong> In Telegram, send <code>/new<\/code>, then <code>hello<\/code>. What success looks like: a reply within a few seconds.<\/p>\n<p><strong>Step 36. The quote test.<\/strong> Send:<\/p>\n<pre><code class=\"language-text\">Quote your rule about saving things, word for word.\n<\/code><\/pre>\n<p>Then:<\/p>\n<pre><code class=\"language-text\">What are your standing instructions? List their headings.\n<\/code><\/pre>\n<p>What success looks like: it quotes your save rule exactly and lists the headings from your RULES file.<\/p>\n<p><strong>If it cannot quote them, stop and fix it (Build Log 32).<\/strong><\/p>\n<ul>\n<li>For weeks in July 2026 Annie's rules file was never loaded into her bot.<\/li>\n<li>Asked about one of its rules, the bot said it had none.<\/li>\n<li>Two file links and a restart fixed it.<\/li>\n<li>Annie's guide calls this &quot;the single most instructive bug of the whole build&quot;.<\/li>\n<li>Nothing else you write matters until the bot can read its rules.<\/li>\n<\/ul>\n<p><strong>Step 37. The refusal test (from v1).<\/strong><\/p>\n<ul>\n<li>Send a question your files cannot answer, such as the name of a person you have never mentioned.<\/li>\n<li>The bot must say it does not know.<\/li>\n<li>A made-up answer here is the one failure you must not leave the room with.<\/li>\n<li>Fix the rule and test again.<\/li>\n<\/ul>\n<p><strong>Step 38. Your golden questions<\/strong> from Module 07. These are your test questions with known answers.<\/p>\n<ol>\n<li>Ask each one in a fresh conversation. Send <code>/new<\/code> before each.<\/li>\n<li>Then ask them all again. A right answer once can be luck (guide, Part 5).<\/li>\n<li>Write the results into your build log.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"short-08b-s11\"><h2><span class=\"num\">08B.11<\/span> Same Model, Different Program: Why pi and the Bot Answer Differently<\/h2><p><em>5 minutes. Both courses. Moved here from Module 04, the demo (Pair 4).<\/em><\/p>\n<p><strong>Your pi and your bot now run the same model:<\/strong> DeepSeek V4.1 Flash on opencode Go.<\/p>\n<ul>\n<li>Ask both the same question: &quot;What can you do with my files?&quot;<\/li>\n<li>The answers differ, because the program around the model differs.<\/li>\n<li>pi can read and edit the files on your laptop.<\/li>\n<li>The bot has its own skills and its own rules on the server.<\/li>\n<\/ul>\n<p><strong>The line to say.<\/strong> &quot;The model only answers. The program around it decides what it can read, what it remembers, and what it is allowed to do.&quot;<\/p>\n<p><strong>This is why Annie moved her bots to a new model in one evening.<\/strong> She changed one line in each bot's settings. The skills, rules and limits stayed the same (Build Log 92).<\/p>\n<p><strong>It is also why a Telegram bot is not limited by Telegram (Build Log 23).<\/strong><\/p>\n<ul>\n<li>Annie once assumed her bot could not build software because it was a Telegram bot.<\/li>\n<li>The real reason was that it had been set up as an AI assistant, with no tools to edit files.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-08b-s12\"><h2><span class=\"num\">08B.12<\/span> Homework: A Normal User, a Swap File and a Reboot Test<\/h2><p><strong>A normal user instead of root (Build Log 05; live server check, 2 Oct 2026).<\/strong><\/p>\n<ul>\n<li>Logging in as <code>root<\/code> means every command runs with full power over the machine.<\/li>\n<li>Annie's June 2026 review listed moving her bot off root as the highest-risk change. She deferred it.<\/li>\n<li>Her server still runs the bot as root.<\/li>\n<li>If you choose a normal user, do it before installing anything else, with the facilitator beside you.<\/li>\n<\/ul>\n<p><strong>A swap file (Build Log 95).<\/strong> Swap is disk space the server uses when its memory is full. Without it, a full server stops a program of its own choosing.<\/p>\n<ul>\n<li>In September 2026 Annie's server began logging memory warnings every minute.<\/li>\n<li>The cause: six forgotten Claude Code sessions held 1.5 GB between them.<\/li>\n<li>Closing them freed the memory.<\/li>\n<li>A 2 GB swap file was added, so the server has room to spare next time.<\/li>\n<\/ul>\n<p>What to do:<\/p>\n<ul>\n<li>Ask pi to add a 2 GB swap file that survives a restart, with swappiness set to 10.<\/li>\n<li>Facilitator: confirm the first command on the day, because Build Log 95 does not record how the empty file was made.<\/li>\n<li>Close Claude Code sessions with <code>/exit<\/code> when you finish.<\/li>\n<\/ul>\n<p><strong>The reboot test.<\/strong> &quot;It works&quot; and &quot;it survives a restart&quot; are different claims. Reboot the server once, then check:<\/p>\n<pre><code class=\"language-bash\">tailscale status\nsysctl net.ipv4.ip_forward\nufw status\ntimedatectl\nsystemctl --user status hermes-gateway\n<\/code><\/pre>\n<p>What success looks like:<\/p>\n<ul>\n<li>Tailscale is connected.<\/li>\n<li>Forwarding reads 1.<\/li>\n<li>The firewall is active.<\/li>\n<li>The timezone is Hong Kong.<\/li>\n<li>The bot answers <code>hello<\/code> in Telegram.<\/li>\n<\/ul>\n<p><strong>Private web pages, for later.<\/strong> You may want a small private page some day, such as a dashboard. Keep it reachable only through Tailscale.<\/p>\n<ul>\n<li>Annie first published one page publicly. She moved it back to private in August 2026, because it showed household items (Build Log 64).<\/li>\n<li><strong>A password box in front of a public page protects nothing.<\/strong> The page's content is still sent to anyone who asks. The box only hides it.<\/li>\n<li>To share a page with someone outside your network, encrypt the page itself. Then the public copy cannot be read without the password (Build Log 49).<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-08b-s13\"><h2><span class=\"num\">08B.13<\/span> The Optional Short Course Server Session<\/h2><p><em>Optional, outside the 10 hours. 100 minutes. Option 2a: a bot on a rented server, reached by plain SSH with a key.<\/em><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Min<\/th>\n<th>Segment<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5<\/td>\n<td>The plan and the four safety rules: snapshot first, an automatic undo timer, one change at a time, the web console<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Snapshot and SSH key<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>First login, timezone and updates<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>Secure the server, in an order that cannot lock you out<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Why this session stops before Tailscale<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Create the Telegram bot<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>Install Hermes and connect it<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Load your files and make it restart on its own<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>Three tests: the bot quotes your rules, says when it does not know, and answers your golden questions<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Same model, different program: why pi and the bot answer differently<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>How the minutes add up.<\/strong> The session takes 100 minutes. The plan and the four safety rules (snapshot first, an automatic undo timer, one change at a time, the web console) take 5 minutes. The snapshot and key take 10. First login takes 10. Securing the server takes 15. Why this session stops before Tailscale takes 5. Creating the bot takes 10. Installing Hermes takes 15. Loading your SOUL, RULES and USER files takes 10. Testing that the bot quotes its rules, says when it does not know and answers your golden questions takes 15. Asking pi and the bot the same question takes 5.<\/p>\n<p><strong>Why this session stops before Tailscale.<\/strong><\/p>\n<ul>\n<li>Tailscale makes the server invisible to the internet. But it adds one more thing to look after. With it off, there is no way in (Build Log 102).<\/li>\n<li>For one bot, a server that accepts only your key, with a firewall and automatic bans, is a sound setup.<\/li>\n<li>Annie's own server ran this way from June 2026 until she moved it behind Tailscale (Build Logs 05, 06 and 103).<\/li>\n<\/ul>\n<p><strong>Three things keep it safe:<\/strong><\/p>\n<ul>\n<li>Never switch password logins back on.<\/li>\n<li>Keep the passphrase on your key.<\/li>\n<li>Keep security updates automatic.<\/li>\n<\/ul>\n<p><strong>Your daily way in<\/strong> is <code>ssh root@&lt;your-server-ip&gt;<\/code>. Or ask pi to add a short name for it.<\/p>\n<p><strong>What the session does not add.<\/strong><\/p>\n<ul>\n<li>No Claude Code on the server, no exit node and no vault copy.<\/li>\n<li>The bot reads only the files you copied to it.<\/li>\n<li>Claude is still reachable from your laptop only through a VPN, as Module 01 explained.<\/li>\n<li>pi needs no VPN.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-08b-s14\"><h2><span class=\"num\">08B.14<\/span> From the Record<\/h2><p><strong>Luck, not design (Build Logs 05 and 06).<\/strong><\/p>\n<ul>\n<li>For its first month, Annie's server had five secret files that any user on the machine could read. It had no firewall.<\/li>\n<li>Her June 2026 review looked first and changed nothing. It found the gaps and sorted the fixes by risk.<\/li>\n<li>The next day the fixes went in. SSH was allowed before the firewall was switched on, with a second login window open.<\/li>\n<li>The bot kept the same process number throughout. That proved nothing broke.<\/li>\n<li><strong>The lesson.<\/strong> Look before you change. Change in an order that always leaves you able to log in.<\/li>\n<\/ul>\n<p><strong>One VPN instead of two (Build Logs 63 and 64).<\/strong><\/p>\n<ul>\n<li>In August 2026 Annie's phone could run only one VPN at a time.<\/li>\n<li>With her commercial VPN on, Claude worked and her private pages did not. With Tailscale on, the reverse.<\/li>\n<li>She made her Singapore server a Tailscale exit node. One switch did both jobs.<\/li>\n<li>The commercial VPN became unnecessary on the phone, then on the Mac.<\/li>\n<li><strong>The lesson.<\/strong> Before adding a second tool to solve a clash, ask whether the one you already have can do both jobs.<\/li>\n<\/ul>\n<p><strong>The login that expired quietly (Build Log 75).<\/strong><\/p>\n<ul>\n<li>In September 2026 Annie could not open Claude Code on her server from her phone.<\/li>\n<li>She suspected the VPN. But her phone's Claude chat was working at that moment, so the network was fine.<\/li>\n<li>The server's login had expired. Using Claude did not extend it.<\/li>\n<li>The watchdog now warns before the expiry date.<\/li>\n<li><strong>The lesson.<\/strong> When one tool works and another fails on the same device, look at what differs.<\/li>\n<\/ul>\n<p><strong>One provider move, three outages (Build Log 94).<\/strong><\/p>\n<ul>\n<li>On 27 September 2026 Annie moved her bots to a new model provider.<\/li>\n<li>Two bots went down. The new key sat only in the main bot's file, and each bot reads only its own.<\/li>\n<li>The nightly filing job failed. Its model names existed only on the old provider.<\/li>\n<li>Every restart looked healthy, because starting the bot never checks the key.<\/li>\n<li><strong>The lesson.<\/strong> After any change to keys or models, send a real message through every bot.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-08b-s15\"><h2><span class=\"num\">08B.15<\/span> Worksheet: Server and Bot Checklist<\/h2><div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Proof<\/th>\n<th>Course<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Snapshot taken before any change<\/td>\n<td>Snapshot listed in the console<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Key login works; passwords off<\/td>\n<td><code>sshd -T<\/code> shows <code>passwordauthentication no<\/code><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Firewall active<\/td>\n<td><code>ufw status verbose<\/code><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>fail2ban and security updates on<\/td>\n<td><code>fail2ban-client status sshd<\/code><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Timezone is Hong Kong, on the server and in Hermes<\/td>\n<td><code>timedatectl<\/code>; Hermes config<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Laptop, phone and server on Tailscale; key expiry off<\/td>\n<td>Tailscale admin page<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>SSH works only over Tailscale<\/td>\n<td><code>ssh myserver<\/code> works; the public address does not<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Exit node tested<\/td>\n<td><code>loc=SG<\/code> with it on<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Claude Code on the server, signed in, locked to the subscription<\/td>\n<td><code>claude -p<\/code> returns PONG<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Vault copied to the server<\/td>\n<td>A new laptop note appears on the server<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Bot token only in my password manager<\/td>\n<td><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Only my Telegram ID is allowed<\/td>\n<td>The allow-list holds one number<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>.env<\/code> readable by the owner only<\/td>\n<td><code>ls -l<\/code> shows <code>-rw-------<\/code><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Runs as a service with the four restart lines from Step 34; linger on<\/td>\n<td>The service file; <code>Linger=yes<\/code><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Quote test passed<\/td>\n<td>It quoted my save rule exactly<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Refusal test passed<\/td>\n<td>It said it did not know<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Golden questions passed twice, in fresh conversations<\/td>\n<td>My build log<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>\n<section class=\"card\" id=\"short-08b-s16\"><h2><span class=\"num\">08B.16<\/span> Teaching Notes<\/h2><ul>\n<li><strong>This is the hardest part of either course.<\/strong> There are three students at most. The facilitator sits beside each one in turn. Never take the keyboard.<\/li>\n<li><strong>The second SSH window is the most important habit.<\/strong> Check every student has one open before Step 8.<\/li>\n<li><strong>Some students' servers will not be ready.<\/strong> They sit beside a neighbour. They finish at home with this checklist, with the facilitator on a call for Steps 6 to 10. They must not do the lock-down steps alone without the second window.<\/li>\n<li><strong>pi cannot answer prompts that need typing.<\/strong> The student runs these in their own window, and pi gives them the command:\n<ul>\n<li>passphrases and passwords<\/li>\n<li><code>tailscale up<\/code> approvals<\/li>\n<li>the Claude sign-in<\/li>\n<li><code>hermes gateway setup<\/code><\/li>\n<\/ul>\n<\/li>\n<li><strong>Tokens and keys get pasted into the wrong places.<\/strong> Before the bot segments, remind every student that a bot token is a password.<\/li>\n<li><strong>Provider consoles differ.<\/strong> Show one provider on screen. Tell students to find the same button on theirs.<\/li>\n<li><strong>The exit node and the terms question:<\/strong> keep it factual, as in Module 01.<\/li>\n<li><strong>Timing risk: Tailscale and the exit node take longest.<\/strong> If the room is behind at 75 minutes, copying the vault to the server becomes homework.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-08b-s17\"><h2><span class=\"num\">08B.17<\/span> Not Yet Tested<\/h2><ul>\n<li><strong>The whole order, with pi running every step.<\/strong> Annie's own test on a fresh server, from Hong Kong, no VPN, exit node off (Merge Tracker, item 6).<\/li>\n<li><strong>From the Claude version, still untested:<\/strong>\n<ul>\n<li>the server sign-in flow for Claude Code<\/li>\n<li>the Obsidian server sync (no written steps)<\/li>\n<li>the normal-user change<\/li>\n<li>the swap file's first command<\/li>\n<li><code>ssh-copy-id<\/code> on Windows<\/li>\n<li>the Hermes install script<\/li>\n<li><code>hermes gateway setup<\/code><\/li>\n<li>the opencode Go set-up in Hermes<\/li>\n<li>the working-folder setting for <code>.hermes.md<\/code><\/li>\n<\/ul>\n<\/li>\n<li><strong>New here:<\/strong>\n<ul>\n<li>pi running server commands over SSH from the laptop<\/li>\n<li>splitting <code>AGENTS.md<\/code> into SOUL and RULES for the optional Short course server session<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/section>\n<details class=\"card ref\" id=\"short-08b-s18\"><summary><span class=\"num\">08B.18<\/span> Where the Versions Went <span class=\"hint\">tap to open<\/span><\/summary><p><strong>Kept from the Claude version's Module 12:<\/strong><\/p>\n<ul>\n<li>the four safety rules (snapshot first, an automatic undo timer, one change at a time, the web console)<\/li>\n<li>every server step<\/li>\n<li>Tailscale and the exit node<\/li>\n<li>Claude Code and the vault on the server<\/li>\n<li>the daily routine for opening Claude Code on the server<\/li>\n<li>swap, the reboot test and private pages (now homework)<\/li>\n<li>three of its stories<\/li>\n<\/ul>\n<p><strong>Kept from the Claude version's Module 13:<\/strong><\/p>\n<ul>\n<li>the Telegram bot<\/li>\n<li>the Hermes install<\/li>\n<li>the model settings block for <code>config.yaml<\/code><\/li>\n<li>the table of where each file goes on the server<\/li>\n<li>the restart settings<\/li>\n<li>the quote test (the bot quotes your rules word for word) and the golden questions (test questions with known answers)<\/li>\n<li>two stories<\/li>\n<\/ul>\n<p><strong>Moved out of Module 13:<\/strong> separate bots for other people, model testing and attack lists. They go to the module on growing your system (Module 11) (Pair 11).<\/p>\n<p><strong>Kept from v1:<\/strong> the refusal test, and the stories from Logs 05, 06, 49 and 63 (moved from Pair 2 and Pair 1).<\/p>\n<p><strong>Moved in from Pair 4:<\/strong> &quot;same model, different program&quot;, where you ask pi and the bot the same question. It needs the bot and pi on the same model.<\/p>\n<p><strong>Errors fixed:<\/strong><\/p>\n<ul>\n<li><strong>The Claude version's VPN gap.<\/strong> Its Module 12 told students to switch off any commercial VPN before Tailscale. That cut off Claude Code in Hong Kong until the exit node worked. Now pi drives every step, and pi needs no route out of Hong Kong.<\/li>\n<li><strong>The timer story.<\/strong> The Claude version said a ten-minute timer guarded the closing of public SSH. Build Log 103 says it guarded a change to which accounts may log in, and that public SSH was already closed. The story is corrected. The technique is still taught for closing public SSH.<\/li>\n<li><strong>The two-VPNs story<\/strong> is cited to Build Log 64, where it happened, not Build Log 63.<\/li>\n<li><strong>The server is in Singapore.<\/strong> Build Log 63 says &quot;the VPS lives in the EU&quot;. Build Log 64 records the Mac's address through the server as Singapore. v1's Log 63 story now says Singapore.<\/li>\n<li><strong>Obsidian Sync<\/strong> is now pre-work for this module, not the next session.<\/li>\n<li><strong>Register:<\/strong> four phrases are fixed.\n<ul>\n<li>&quot;Lock the Doors&quot; is now &quot;Secure the Server&quot;.<\/li>\n<li>The phrase &quot;your back door&quot; now says what the console does.<\/li>\n<li>The word &quot;cushion&quot; is rewritten.<\/li>\n<li>The phrase &quot;the moment of truth&quot; is gone.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"short-08b-s19\"><summary><span class=\"num\">08B.19<\/span> Sources <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>How to Build Your Own Claudith guide, Parts 3 and 5: let the builder drive; timezone first; luck, not design; golden questions twice.<\/li>\n<li>Build Log 00: the first snapshot; the passphrase not set; the timezone note that was wrong.<\/li>\n<li>Build Logs 02, 25, 97 and 104: the vault on the server and the sync facts.<\/li>\n<li>Build Logs 05 and 06: the review, the hardening order, the bot unbroken throughout.<\/li>\n<li>Build Log 14: the blank timezone setting in the bot.<\/li>\n<li>Build Log 23: the program behind the chat app decides what the bot can do.<\/li>\n<li>Build Log 32: the rules file that was never loaded; the quote test.<\/li>\n<li>Build Log 46: Claude Code moved to the server; the cold test there.<\/li>\n<li>Build Log 49: a password box protects nothing; encrypt the page.<\/li>\n<li>Build Log 52: allow-lists and finding your Telegram ID.<\/li>\n<li>Build Log 63: one VPN at a time; the exit node; the long pasted command.<\/li>\n<li>Build Log 64: the VPN that took over address lookups; Singapore; persistent forwarding; key expiry; a public page made private.<\/li>\n<li>Build Log 68: Android exclude mode.<\/li>\n<li>Build Log 69: the routing designs that were removed.<\/li>\n<li>Build Log 75: the server login that expired.<\/li>\n<li>Build Log 76: two bots that stopped in silence.<\/li>\n<li>Build Log 78: the four restart lines.<\/li>\n<li>Build Log 80: the slow tutor bot; checking the wrong list of services.<\/li>\n<li>Build Log 92: the model block; changing model in one line.<\/li>\n<li>Build Log 94: one provider move, three outages.<\/li>\n<li>Build Log 95: six forgotten sessions and the swap file.<\/li>\n<li>Build Log 102: locked out with Tailscale off.<\/li>\n<li>Build Log 103: small settings files; the ten-minute undo timer and <code>AllowUsers<\/code>; public SSH already closed; 403 from Hong Kong, 401 through Singapore; pi on the server; device-labelled keys.<\/li>\n<li>Build Log 105 and the &quot;How To Open Claude on the VPS&quot; note: first login from Hong Kong; the daily routine.<\/li>\n<li>Annie's Hermes notes: the rules file's working folder; a chat keeps its starting instructions until <code>/new<\/code>.<\/li>\n<li>Live server and system check, 2 Oct 2026; bot settings, 9 Oct 2026.<\/li>\n<li>Hermes Agent repository and documentation, Tailscale pricing and Obsidian Sync pricing, seen 2 Oct 2026.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"short-08b-s20\"><summary><span class=\"num\">08B.20<\/span> Related <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>08 — The Build (Merged)<\/li>\n<li>07 — Rules of Engagement (Merged)<\/li>\n<li>03 — Architecture and Where Your System Lives (Merged)<\/li>\n<li>01 — Merge Tracker (Decisions, Hours, Checks)<\/li>\n<li>00 — Side-by-Side (9 Oct 2026) (Pair 8)<\/li>\n<\/ul>\n<\/details>", "count": 20}]}};</script>
<script>
const D=window.COURSE;let course='full',tab=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function tabsOf(c){return [{id:c+'-ov',label:'Overview'}].concat(D[c].tabs)}
function show(id,noscroll){
  const c=id.split('-')[0];course=c;tab=id;
  document.querySelectorAll('.courses button').forEach(b=>b.classList.toggle('on',b.dataset.c===c));
  const T=tabsOf(c);
  $('.tabs').innerHTML=T.map(t=>`<button data-t="${t.id}" class="${t.id===id?'on':''}">${t.label}</button>`).join('');
  const i=T.findIndex(t=>t.id===id);const t=T[i];let h='';
  if(id.endsWith('-ov')){h=D[c].overview}
  else{
    const chips=[t.minutes?`<span class="chip">${t.minutes} min in class</span>`:'',`<span class="chip">about ${t.read} min to read</span>`,`<span class="chip">${t.count} sections</span>`].join('');
    const toc=t.toc.length?`<details class="toc"><summary>In this module (${t.toc.length})</summary><ol>${t.toc.map(x=>`<li><a href="#${x[0]}"><span class="num">${x[1]}</span> ${x[2]}</a></li>`).join('')}</ol></details>`:'';
    h=`<div class="modhead"><div class="kicker">${c==='full'?'Full':'Short'} course</div><h1>${esc(t.title)}</h1><div class="chips">${chips}</div></div>${toc}${t.body}`;
  }
  const prev=T[i-1],next=T[i+1];
  h+=`<div class="navbtns">${prev?`<button data-t="${prev.id}"><span>← Back</span>${esc(prev.title||prev.label)}</button>`:''}${next?`<button class="next" data-t="${next.id}"><span>Next →</span>${esc(next.title||next.label)}</button>`:''}</div>`;
  $('main').innerHTML=h;
  const on=$('.tabs .on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});
  if(!noscroll)window.scrollTo(0,0);
  history.replaceState(null,'','#'+id);try{localStorage.setItem('courseTab',id);localStorage.setItem('courseTab-'+c,id)}catch(e){}
  prog();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-t],[data-c],[data-go]');
  if(b){e.preventDefault();if(b.dataset.c){let l=null;try{l=localStorage.getItem('courseTab-'+b.dataset.c)}catch(x){};show(valid(l)?l:b.dataset.c+'-ov')}else{show(b.dataset.t||b.dataset.go)}return}
  const a=e.target.closest('a[href^="#"]');
  if(a){const el=document.getElementById(a.getAttribute('href').slice(1));if(el){e.preventDefault();if(el.tagName==='DETAILS')el.open=true;el.scrollIntoView({behavior:'smooth'})}}
});
function prog(){const h=document.documentElement;const p=h.scrollTop/Math.max(1,h.scrollHeight-h.clientHeight);$('.progress').style.width=(p*100)+'%'}
addEventListener('scroll',prog,{passive:true});
function valid(id){if(!id)return false;const c=id.split('-')[0];return D[c]&&tabsOf(c).some(t=>t.id===id)}
let start=location.hash.slice(1);let sec=null;
if(!valid(start)){const m=start.match(/^(.*)-s\d+$/);if(m&&valid(m[1])){sec=start;start=m[1]}else{try{start=localStorage.getItem('courseTab')}catch(e){start=null}}}
if(!valid(start))start='full-ov';
show(start);if(sec){const el=document.getElementById(sec);if(el){if(el.tagName==='DETAILS')el.open=true;el.scrollIntoView()}}
</script>
