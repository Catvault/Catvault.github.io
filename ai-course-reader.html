hether the job ran (Build Log 74).<\/strong> The watchdog checked that the inbox sorter ran, that the backups were fresh and that the folders existed. It never checked where the notes went. When a check of the result was added, it went red on the first run.<\/p>\n<p><strong>A model change that broke three jobs (Build Logs 92 and 94).<\/strong> In September 2026 Annie moved two of her three bots to a cheaper model from a new provider. The third was already on it. The move broke the teaching bot, the nightly inbox sorter and the calendar job. The cause was not the model. The keys and model names did not carry across from the old provider. A new watchdog check now catches a model name that its provider does not serve.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-10-s9\"><h2><span class=\"num\">10.9<\/span> Worksheet: Keeping It Honest<\/h2><div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Proof<\/th>\n<th>Course<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>I named one failure I have met, and its kind<\/td>\n<td>My notes<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Backup made, including logins, leaving out downloadable files<\/td>\n<td><code>unzip -l<\/code><\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>One file restored from the backup and opened<\/td>\n<td>My SOUL file opened from the test folder<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Backup copied to a second place, one file restored<\/td>\n<td>Homework<\/td>\n<td>Short<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Watchdog runs every hour and is silent when green<\/td>\n<td><code>--status<\/code><\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Watchdog checks the bot, the backup and the Claude login<\/td>\n<td><code>--status<\/code> lists all three<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>A planted fault made a check go red<\/td>\n<td>I saw it go red<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>What my checks cannot see, written down<\/td>\n<td>My build log<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Every paid account listed, flat or per use<\/td>\n<td>The table below<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>A cap on every account that charges per use<\/td>\n<td>The account's settings page<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>My paid accounts:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Account<\/th>\n<th>Price per month<\/th>\n<th>Flat or per use?<\/th>\n<th>Cap set?<\/th>\n<th>Where the cap is set<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>What my checks cannot see:<\/strong><\/p>\n<ol>\n<li>\n<hr />\n<\/li>\n<li>\n<hr />\n<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"full-10-s10\"><h2><span class=\"num\">10.10<\/span> Teaching Notes<\/h2><ul>\n<li><strong>Break something real.<\/strong> A demonstration where nothing breaks teaches nothing. Plant the fault on your own build first, in front of the room.<\/li>\n<li><strong>The silent check is the lesson.<\/strong> Ask every student which check stayed green during the fault. That answer is worth more than the one that went red.<\/li>\n<li><strong>Do not fix the system during the fault.<\/strong> Watch it fail first. Fix it after.<\/li>\n<li><strong>The restore is the step students skip.<\/strong> Ask each Full course student to show you their SOUL file opened from the backup.<\/li>\n<li><strong>Short course students may have no paid account that charges per use.<\/strong> opencode Go is a flat $10 a month. That is a good answer: write it on the run card and move on.<\/li>\n<li><strong>Three students at most.<\/strong> Sit beside each one during the planted fault.<\/li>\n<li><strong>Timing risk:<\/strong> the backup runs long if a student tries to connect a cloud account in class. Keep it on the server today. The copy kept somewhere else is homework.<\/li>\n<\/ul>\n<\/section>\n<details class=\"card ref\" id=\"full-10-s11\"><summary><span class=\"num\">10.11<\/span> Where the Versions Went <span class=\"hint\">tap to open<\/span><\/summary><p><strong>Kept from v1 Block 10:<\/strong><\/p>\n<ul>\n<li>the three ways a system fails, with &quot;it says it worked when it did not&quot; as the most dangerous<\/li>\n<li>the two times a failure can happen, and a check for each<\/li>\n<li>the checker can fail too, and writing down what a check cannot see<\/li>\n<li>the four checks<\/li>\n<li>the planted fault as a timed segment in both courses<\/li>\n<li>the Log 59 story<\/li>\n<\/ul>\n<p><strong>Kept from v1 Block 11:<\/strong><\/p>\n<ul>\n<li>what a backup must contain (Log 44) and the files that lived only on the Mac (Log 101)<\/li>\n<li>the three backup layers (Log 21) and the alert that fires only on failure<\/li>\n<li>the token that expired every 7 days (Log 53)<\/li>\n<li>restoring one file in class, and the Log 27 lesson behind it<\/li>\n<li>the cap exercise<\/li>\n<\/ul>\n<p><strong>Kept from v1 Block 9 (parked in Pair 9):<\/strong><\/p>\n<ul>\n<li>rule 1: check the result, not the report<\/li>\n<li>rule 2: the job that does the work must not be the only thing that checks it<\/li>\n<li>the eight-row table of false successes and the From the Record stories: moved to the handout<\/li>\n<\/ul>\n<p><strong>Kept from the Claude version's Module 15:<\/strong><\/p>\n<ul>\n<li>the watchdog rules and the builder prompt<\/li>\n<li>leaving out downloadable files (Log 97) and keeping the backup copy private<\/li>\n<li>the backup builder prompt, with the <code>unzip -l<\/code> and <code>unzip -t<\/code> checks<\/li>\n<li>&quot;find the cause before you raise a cap&quot; and &quot;cap the job, not only the account&quot;<\/li>\n<li>the false alarms checked against reality (Logs 79 and 85)<\/li>\n<\/ul>\n<p><strong>Moved to the handout:<\/strong><\/p>\n<ul>\n<li>every story not told in class, one line each, including v1 Block 5's Logs 57, 58, 59, 71 and 85, and v1 Block 9's stories (Logs 04, 25, 30, 37, 42, 43, 45, 51, 84, 88 and 90)<\/li>\n<li>the full September 2026 cost arithmetic<\/li>\n<\/ul>\n<p><strong>Moved to a later module or dropped:<\/strong><\/p>\n<ul>\n<li><strong>Self-healing (the script that restarts a stuck bot, and the short list of automatic fixes) and key rotation<\/strong> from the Claude version: moved to the handout. Beginners will not build the restart script, and key rotation is a rule for rare events, so both belong where students can look them up. Annie agreed on 10 Oct 2026.<\/li>\n<li><strong>The two owner drills<\/strong> from the Claude version: moved to the close (Module 12), Full course only, 10 minutes. A drill must be done, not read, and doing it at the end proves the student can run the system alone. Annie agreed on 10 Oct 2026.<\/li>\n<li><strong>The 30-day plan and the last build log<\/strong> from the Claude version: these belong to the close (Module 12).<\/li>\n<li><strong>&quot;Keeping the recurring work free&quot;<\/strong> from v1 Block 11: already taught in Module 09 (Annie's three cost levels).<\/li>\n<li><strong>Log 95<\/strong> (six forgotten sessions filled the memory): told in Module 03. Not told again here.<\/li>\n<\/ul>\n<p><strong>Changed:<\/strong><\/p>\n<ul>\n<li><strong>The planted fault is in both courses.<\/strong> The Claude version made it optional. Its own text said a watchdog you have never seen fire proves nothing.<\/li>\n<li><strong>The Short course's check is the golden questions,<\/strong> asked by hand. A laptop assistant has no timer to run a watchdog.<\/li>\n<li><strong>The cost section is in Annie's words,<\/strong> approved 10 Oct 2026.<\/li>\n<li><strong>The free and cheap model paragraph is in Annie's words,<\/strong> approved 10 Oct 2026. Its last sentence says &quot;This module&quot; here, in place of &quot;Module 10&quot; in the syllabus.<\/li>\n<\/ul>\n<p><strong>Errors fixed:<\/strong><\/p>\n<ul>\n<li><strong>What caused the $20 cap.<\/strong> v1 said &quot;every compression keeps the conversation alive at full size&quot;. Build Log 89 says compression waited for half of a 1 million token window, so it never ran. The chat was also only $8.36 of a $20.61 bill.<\/li>\n<li><strong>One September figure.<\/strong> v1 quoted $70.41 and about $67.22. The Claude version quoted about $56 plus about $11.55. This module uses &quot;about $57 on average&quot; and &quot;close to $80 in September&quot;, from the cost note and Build Log 89.<\/li>\n<li><strong>The company-watch story<\/strong> is cited to the <code>Firecrawl — Use Cases<\/code> note, not Build Log 100. It was 92 credits, not 92 searches.<\/li>\n<li><strong>The monthly cost script<\/strong> did not &quot;alert loudly&quot;. Build Log 97 found it printed &quot;ok&quot; after reading nothing and had never been scheduled.<\/li>\n<li><strong>&quot;She nearly edited 234 rows&quot;<\/strong> in the Claude version. Build Log 79 says it was Claude, not Annie.<\/li>\n<li><strong>The watchdog's check count is not printed.<\/strong> It changes too often.<\/li>\n<li><strong>v1's restore exercise had no backup to restore from.<\/strong> The Full course now makes the backup first, in the same segment.<\/li>\n<li><strong>The planted-fault story.<\/strong> v1 said Log 106's two new checks were proven red and later &quot;fired for real&quot;. Both checks were removed the same day, because a parallel session had built duplicates. This module uses the skill-scripts check from the same log, which went red on purpose and then caught a real fault.<\/li>\n<li><strong>Log 82's recovery.<\/strong> The Claude version said the photos came back. The 147 book photos did not.<\/li>\n<li><strong>Log 53.<\/strong> v1 said &quot;nobody was watching&quot;. A failure message arrived every morning, and Annie asked about it.<\/li>\n<li><strong>Log 107.<\/strong> The Claude version said the false alarm came every morning. The log records one, at 6:35 am.<\/li>\n<li><strong>Log 44<\/strong> was a check of what the backup contained, not a restore. The &quot;$4 a month&quot; and &quot;about 10 minutes&quot; figures the Claude version credited to it are not in Log 44.<\/li>\n<li><strong>The 249 real broken links<\/strong> came about a week after the 292 false ones, not a month.<\/li>\n<li><strong>Log 79's three misreadings<\/strong> were aliases, image links inside tables and links into subfolders, not links inside code formatting.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"full-10-s12\"><summary><span class=\"num\">10.12<\/span> Sources <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>Build Log 21: the three backup layers; the alert only on failure.<\/li>\n<li>Build Log 27: a backup made, and the change it protected never applied.<\/li>\n<li>Build Log 44: the restore test that found the missing sync login.<\/li>\n<li>Build Log 53: the sign-in that expired every 7 days.<\/li>\n<li>Build Log 56: the grader that said &quot;exactly it&quot; (told in Module 09).<\/li>\n<li>Build Log 59: the cleanup reported as done.<\/li>\n<li>Build Logs 65 and 66: test on a copy; the error-code loop.<\/li>\n<li>Build Log 73: two kinds of check.<\/li>\n<li>Build Log 74: the false &quot;ok&quot; (told in Module 04).<\/li>\n<li>Build Log 75: the server login that expires.<\/li>\n<li>Build Logs 79 and 85: the false alarms and the real ones.<\/li>\n<li>Build Log 82: the 411-file deletion and the version-history recovery.<\/li>\n<li>Build Log 88: the watchdog checks its own repair.<\/li>\n<li>Build Log 89: the $20 cap; the API key used by mistake.<\/li>\n<li>Build Log 97: the oversized backup; the cost script that read nothing.<\/li>\n<li>Build Log 101: the 59 files that lived only on the Mac.<\/li>\n<li>Build Log 106: two checks proven red before they were trusted.<\/li>\n<li>Build Log 107: the morning false alarm and the overnight quiet window.<\/li>\n<li>Monthly AI Ecosystem Cost note: June to September 2026.<\/li>\n<li><code>Firecrawl — Use Cases<\/code> note: 92 credits down to 21.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"full-10-s13\"><summary><span class=\"num\">10.13<\/span> Related <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>04 — The Demo (Merged)<\/li>\n<li>07 — Rules of Engagement (Merged)<\/li>\n<li>08 — The Build (Merged)<\/li>\n<li>08B — The Server and Your Bot (Merged)<\/li>\n<li>09 — Script, Machine Learning or AI Judgement (Merged)<\/li>\n<li>01 — Merge Tracker (Decisions, Hours, Checks)<\/li>\n<li>00 — Side-by-Side (9 Oct 2026) (Pair 10)<\/li>\n<\/ul>\n<\/details>", "count": 13}, {"id": "full-10h", "label": "10 Handout", "title": "Handout: What Broke in Annie's System", "minutes": null, "read": 6, "toc": [["full-10h-s1", "10H.1", "Two Rules"], ["full-10h-s2", "10H.2", "It Stopped"], ["full-10h-s3", "10H.3", "It Ran, but Did the Wrong Thing"], ["full-10h-s4", "10H.4", "It Said It Worked When It Did Not"], ["full-10h-s5", "10H.5", "The Checker Failed Too"], ["full-10h-s6", "10H.6", "Backups"], ["full-10h-s7", "10H.7", "When a Bot Looks Fine but Is Stuck"], ["full-10h-s8", "10H.8", "Keys and Passwords"], ["full-10h-s9", "10H.9", "Cost"]], "body": "<div class=\"intro\"><p><em>A handout for Module 10, both courses. One page, read at home. Each line is one real failure from Annie's build logs, with the log number. The stories told in class are not repeated here.<\/em><\/p>\n<\/div>\n<section class=\"card\" id=\"full-10h-s1\"><h2><span class=\"num\">10H.1<\/span> Two Rules<\/h2><ol>\n<li><strong>Check the result, not the report.<\/strong> A job saying &quot;done&quot; is not proof. Open the file, list the folder or read the message it produced.<\/li>\n<li><strong>The job that does the work must not be the only thing that checks it.<\/strong> Use something separate: a second check, a separate measurement, or a person looking.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"full-10h-s2\"><h2><span class=\"num\">10H.2<\/span> It Stopped<\/h2><ul>\n<li><strong>Log 14:<\/strong> an error handler that caught every error hid a missing import. So the sync function crashed on every call and had never worked once.<\/li>\n<li><strong>Log 43:<\/strong> the daily learning card crashed, because the bot re-saved its own file in a shape the script could not read.<\/li>\n<li><strong>Log 44:<\/strong> the vault sync jammed for six hours behind one frozen process.<\/li>\n<li><strong>Log 58:<\/strong> a vault reorganisation broke file addresses in four ways, including links outside the vault that a vault search could not find.<\/li>\n<li><strong>Log 61:<\/strong> three Google accounts failed with the same error. One account failing points to its login. Every account failing points to the app.<\/li>\n<li><strong>Log 75:<\/strong> the server's Claude login expired without warning after about 30 days, while chat on the phone still worked. The watchdog now warns 4 days ahead.<\/li>\n<li><strong>Log 94:<\/strong> moving to a new model provider broke three jobs, because keys and model names did not carry across. Only two of the three bots had changed model (Log 92).<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-10h-s3\"><h2><span class=\"num\">10H.3<\/span> It Ran, but Did the Wrong Thing<\/h2><ul>\n<li><strong>Log 04:<\/strong> the nightly sorter suggested the same inbox notes again every night.<\/li>\n<li><strong>Log 37:<\/strong> a second &quot;10 pm&quot; reminder that nobody had scheduled turned out to be the bot re-sending files when Annie replied &quot;done&quot;.<\/li>\n<li><strong>Log 51:<\/strong> a folder move left the old address in three files, so the bot found no deal documents for three weeks and said nothing.<\/li>\n<li><strong>Log 57:<\/strong> adding one storage unit meant editing five places. Missing any one would leave a gap nobody would see.<\/li>\n<li><strong>Log 71:<\/strong> before five notes were deleted, a search of the whole vault found one other note linking to all five. It was fixed first. This failure was prevented.<\/li>\n<li><strong>Log 85:<\/strong> the watchdog reported 249 broken photo links, and they were real. No step copied the photos into the vault.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-10h-s4\"><h2><span class=\"num\">10H.4<\/span> It Said It Worked When It Did Not<\/h2><ul>\n<li><strong>Log 25:<\/strong> after 36 days with no restarts, the bot looked healthy. Its sorter was failing on a usage limit, and its memory was full: 2,201 of 2,200 characters.<\/li>\n<li><strong>Log 30:<\/strong> a builder reported all tests passing. Its invoice code had 6 bugs, 4 of them fatal, and the main path had never run from start to finish.<\/li>\n<li><strong>Log 42:<\/strong> the bot fixed its rules correctly, but the job's own stored instruction said &quot;EXACTLY this format&quot;. So the morning message never changed.<\/li>\n<li><strong>Log 45:<\/strong> a nightly sync reported success for about four weeks while copying zero files. A folder move in July had broken its path.<\/li>\n<li><strong>Log 84:<\/strong> the bot sometimes said &quot;got it&quot; without saving the note. Now it saves, checks the file exists, and replies with where it saved it.<\/li>\n<li><strong>Log 90:<\/strong> &quot;save&quot; and &quot;write a build log&quot; became scripts that check their own writes on the disk. This failure was prevented.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-10h-s5\"><h2><span class=\"num\">10H.5<\/span> The Checker Failed Too<\/h2><ul>\n<li><strong>Log 66:<\/strong> the watchdog's first version ended with an error code when it found a problem. Then it reported its own job as failed, again and again.<\/li>\n<li><strong>Log 73:<\/strong> the bot must now report a failure in the same message. The watchdog looks for the failures nobody sees, every hour, at no cost.<\/li>\n<li><strong>Log 87:<\/strong> the cost meter logged every call to two Claude models at $0 for two months, because its price list did not include them.<\/li>\n<li><strong>Log 88:<\/strong> the watchdog now fixes broken vault links itself, with a $1 limit. It reports &quot;fixed&quot; only after its own check passes.<\/li>\n<li><strong>Log 102:<\/strong> the watchdog twice reported two healthy bots as down, because it read old status files.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-10h-s6\"><h2><span class=\"num\">10H.6<\/span> Backups<\/h2><ul>\n<li><strong>Log 21:<\/strong> the backup has three layers: a nightly copy on the server, a copy on Google Drive, and a message that arrives only if it fails. No AI model is involved.<\/li>\n<li><strong>Log 101:<\/strong> 59 files, including 13 baby-book photos, existed only on Annie's Mac. A daily copy from the Mac to the server now runs.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-10h-s7\"><h2><span class=\"num\">10H.7<\/span> When a Bot Looks Fine but Is Stuck<\/h2><ul>\n<li><strong>Log 78:<\/strong> one of Annie's bots showed as &quot;running&quot; for 12 hours while receiving nothing. Its program never stopped, so the automatic restart never started.<\/li>\n<li>A healthy bot keeps at least 2 open connections to Telegram. A stuck one keeps none.<\/li>\n<li>A separate script now checks every 5 minutes and restarts a bot with no connections. If it has to restart the same bot 3 times in 2 hours, it tells Annie.<\/li>\n<li><strong>Keep the list of automatic fixes short.<\/strong> Toby fixes only a few kinds of problem by himself. A dead backup, a stuck bot or an expired login still go to Annie (Log 88).<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-10h-s8\"><h2><span class=\"num\">10H.8<\/span> Keys and Passwords<\/h2><ul>\n<li><strong>Never print a key.<\/strong> When you look at settings, show the names of keys, not their values (Log 103).<\/li>\n<li><strong>Keep each key in one place.<\/strong> A key copied into several files must be changed in all of them. A half-finished change stops bots without warning (Log 103).<\/li>\n<li><strong>Change a key when any of these happens<\/strong> (Annie's notes, 30 Sep 2026):\n<ol>\n<li>A session is shared or shown to anyone.<\/li>\n<li>A new device joins your private network.<\/li>\n<li>A paid balance falls faster than your use explains.<\/li>\n<li>The server gains a second user.<\/li>\n<\/ol>\n<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-10h-s9\"><h2><span class=\"num\">10H.9<\/span> Cost<\/h2><ul>\n<li><strong>Log 36:<\/strong> measured from three meters in July 2026, running costs were about $14 a month in AI use plus $18 for the server. Building it cost about $85 to $90.<\/li>\n<\/ul>\n<p><strong>September 2026, in full.<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Line<\/th>\n<th>Amount<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Fixed subscriptions: server, server backup, Claude Pro, Obsidian Sync, VPN, the $10 model plan for the bots<\/td>\n<td>$55.67<\/td>\n<\/tr>\n<tr>\n<td>Bot use recorded by each bot's meter (the biggest line: the main bot on Claude Sonnet, $8.36)<\/td>\n<td>$11.55<\/td>\n<\/tr>\n<tr>\n<td><strong>Recorded by the cost note<\/strong><\/td>\n<td><strong>$67.22<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Anthropic API bill not recorded: $20.61, less the $8.36 already counted<\/td>\n<td>$12.25<\/td>\n<\/tr>\n<tr>\n<td><strong>Real total<\/strong><\/td>\n<td><strong>$79.47<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Of the $12.25, about $11 most likely came from Toby's automatic fixes using the API key by mistake, plus testing that day. One run by another assistant cost $1.30 (Build Log 89).<\/li>\n<li>June, July and August 2026 were $56.65, $55.69 and $57.97. That is about $57 on average. Months before 24 September may read slightly low, because the meter priced some Claude calls at $0 until then (Build Log 87).<\/li>\n<\/ul>\n<\/section>\n<details class=\"card ref\" id=\"full-10h-s10\"><summary><span class=\"num\">10H.10<\/span> Sources <span class=\"hint\">tap to open<\/span><\/summary><p>Hermes Build Logs 04, 14, 21, 25, 30, 36, 37, 42, 43, 44, 45, 51, 57, 58, 61, 66, 71, 73, 75, 78, 84, 85, 87, 88, 89, 90, 92, 94, 101, 102 and 103. Monthly AI Ecosystem Cost note. Annie's notes of 30 Sep 2026 on when to change a key. v1 Block 9, rules 1 and 2.<\/p>\n<\/details>\n<details class=\"card ref\" id=\"full-10h-s11\"><summary><span class=\"num\">10H.11<\/span> Related <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>10 — What Breaks, and Keeping It Honest (Merged)<\/li>\n<\/ul>\n<\/details>", "count": 11}, {"id": "full-11", "label": "11", "title": "Module 11: Growing It, Skills and Schedules", "minutes": 85, "read": 19, "toc": [["full-11-s1", "11.1", "What You Will Leave With"], ["full-11-s2", "11.2", "Before This Module"], ["full-11-s3", "11.3", "Add One Thing at a Time, and Saying No to a New Tool"], ["full-11-s4", "11.4", "How a Scheduled Job Sends Its Message"], ["full-11-s5", "11.5", "Build the Scheduled Job"], ["full-11-s6", "11.6", "Build and Test One Skill"], ["full-11-s7", "11.7", "Shown, Not Built: A Model on a Schedule"], ["full-11-s8", "11.8", "Set the Keep-or-Kill Date"], ["full-11-s9", "11.9", "From the Record"], ["full-11-s10", "11.10", "Worksheet: Growing It"], ["full-11-s11", "11.11", "Teaching Notes"]], "body": "<div class=\"intro\"><p><strong>Why this module comes here.<\/strong><\/p>\n<ol>\n<li>Students now own a working system (Module 08, and Module 08B in the Full course).<\/li>\n<li>They have sorted their steps into script, model and person (Module 09).<\/li>\n<li>They have seen how a system fails and how a check catches it (Module 10).<\/li>\n<li>So now they can add to it safely.<\/li>\n<\/ol>\n<p><strong>What each course builds.<\/strong><\/p>\n<ul>\n<li><strong>Full course (server):<\/strong> a scheduled job that sends a message to Telegram, then a skill. Each one is tested before the next one starts.<\/li>\n<li><strong>Short course (laptop):<\/strong> a skill. A laptop schedule only runs while the laptop is awake, so the schedule is shown, not built.<\/li>\n<\/ul>\n<\/div>\n<section class=\"card\" id=\"full-11-s1\"><h2><span class=\"num\">11.1<\/span> What You Will Leave With<\/h2><p><strong>Both courses:<\/strong><\/p>\n<ul>\n<li>One skill that works when you ask for it, tested three ways.<\/li>\n<li>One tool you decided not to add, with your reason written down.<\/li>\n<\/ul>\n<p><strong>Full course only:<\/strong><\/p>\n<ul>\n<li>One scheduled job that runs without you and sends its result to Telegram. It stays silent when there is nothing to say, and it tells you when it fails.<\/li>\n<li>A keep-or-kill date in your calendar, two weeks from today.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-11-s2\"><h2><span class=\"num\">11.2<\/span> Before This Module<\/h2><ul>\n<li><strong>Full course:<\/strong> your server and bot from Module 08B, working. Build Brief 1 from Module 09.<\/li>\n<li><strong>Short course:<\/strong> your AI assistant from Module 08, working on your laptop. The five-row Build Brief you wrote at home after Module 09.<\/li>\n<li><strong>Both courses:<\/strong> your run card.<\/li>\n<\/ul>\n<p><strong>If your brief is not ready, use the umbrella example.<\/strong> It answers one question: do I need an umbrella today in Hong Kong? It uses the free Open-Meteo weather service, which needs no account and no key. It is a small version of Annie's own weather job (Build Log 35).<\/p>\n<\/section>\n<section class=\"card\" id=\"full-11-s3\"><h2><span class=\"num\">11.3<\/span> Add One Thing at a Time, and Saying No to a New Tool<\/h2><p><em>10 minutes, both courses.<\/em><\/p>\n<h3>Add One Thing at a Time<\/h3>\n<p><strong>Add one new thing. Test it. Use it for a few days. Then add the next.<\/strong><\/p>\n<p><strong>Why:<\/strong> in May 2026 Annie's first bot broke down. Its cheap AI model could not use its tools reliably. It said tasks were done when they were not: the log calls this &quot;faked success&quot;. Finding the fix took about a week of Annie's own research. The clean-up took 13 logged hours more (Build Log 00).<\/p>\n<p>The rule from her rebuild notes: <strong>&quot;Don't add features in batches.&quot;<\/strong> Version 2 started with three things: the soul file, the rules and one reminder. Her plan was to live with it for 24 to 48 hours before building more (Build Log 00).<\/p>\n<p><strong>The reason the rule works.<\/strong> If you add one thing and something breaks, there is one place to look. If you add three things, there are three places to look, and they can affect each other.<\/p>\n<p><strong>Full course: you add two things today.<\/strong> That is allowed, because you finish and test the scheduled job before you start the skill. Do not start the skill until the job has passed its test.<\/p>\n<h3>Saying No to a New Tool<\/h3>\n<p>New AI tools appear every week. Most of them will be offered to you as something you need.<\/p>\n<p><strong>Annie's example (Build Log 28).<\/strong> On 8 July 2026 someone she works with asked whether she used the Hermes desktop app. He said it could read all the files on her computer. She checked it and decided not to add it. Her four reasons:<\/p>\n<ol>\n<li><strong>She could already do it.<\/strong> Claude Code already read her files and her vault, and reached her server.<\/li>\n<li><strong>Her phone was already covered.<\/strong> Her bot on Telegram already reached her anywhere.<\/li>\n<li><strong>Her own setup was better.<\/strong> She asked: <em>&quot;even if I used Codex, wouldn't I just connect it to Obsidian or a shared folder both tools read, like I do now?&quot;<\/em> She was right. Her notes and rules live in her own vault, so any tool can read them, and no company holds them.<\/li>\n<li><strong>It would cost her more than it gave.<\/strong> It meant a second AI assistant that was not her main one, a new way into her system, and a large update to her live server.<\/li>\n<\/ol>\n<p><strong>Exercise.<\/strong> Write down one tool you have been tempted to add. Answer two questions:<\/p>\n<ol>\n<li>What would it let me do that I cannot do now?<\/li>\n<li>What would I have to look after if I added it?<\/li>\n<\/ol>\n<p>If the first answer is &quot;nothing new&quot;, the answer is no for now. Write the reason on your run card.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-11-s4\"><h2><span class=\"num\">11.4<\/span> How a Scheduled Job Sends Its Message<\/h2><p><em>5 minutes, Full course only.<\/em><\/p>\n<p><strong>A scheduled job<\/strong> runs at set times without you. It is a timer plus a script.<\/p>\n<p><strong>In Hermes, whatever the script prints becomes the Telegram message.<\/strong> If it prints nothing, nothing is sent. Annie's server lists each of these jobs as &quot;no-agent (script stdout delivered directly)&quot; (live server check, 10 Oct 2026). This gives the script three rules:<\/p>\n<ol>\n<li><strong>Print the message when there is something to say.<\/strong><\/li>\n<li><strong>Print nothing when there is nothing to say.<\/strong> Silence is the right answer most days.<\/li>\n<li><strong>Print the failure when something breaks.<\/strong> A job that fails quietly is worse than no job (Module 10).<\/li>\n<\/ol>\n<p><strong>Check your brief now.<\/strong> Which of your steps print the message? What would the script print if a step failed?<\/p>\n<\/section>\n<section class=\"card\" id=\"full-11-s5\"><h2><span class=\"num\">11.5<\/span> Build the Scheduled Job<\/h2><p><em>40 minutes, Full course only.<\/em><\/p>\n<h3>Step 1. Write the Script and Test It Without Sending Anything (20 minutes)<\/h3>\n<p>Log in to your server with <code>ssh myserver<\/code>. Start Claude Code in your vault folder, as in Module 08B. Paste:<\/p>\n<pre><code class=\"language-text\">Read Build Brief 1 in my AI System folder. Ask me every question you have before you start.\nThen write a script in ~/.hermes/scripts/ that does the scripted steps.\nRules:\n- Print the message only when there is something to say. Print nothing otherwise.\n- If anything fails, print one line starting with a warning sign, saying what failed. Never fail silently.\n- Add a --dry-run option. It prints what it would send, sends nothing, and changes no saved file.\n- Back up any file before you edit it.\n- Follow the &quot;Must never do&quot; and &quot;Needs my approval before&quot; rows in my brief.\nShow me the script before you save it. Then run it with --dry-run and show me the output.\n<\/code><\/pre>\n<p><strong>The umbrella version, if you have no brief:<\/strong> ask for a script that gets today's hourly rain forecast for Hong Kong from Open-Meteo. If any hour is likely to rain, it prints &quot;Umbrella today&quot; with the wettest hours. On a dry day it prints nothing.<\/p>\n<p><strong>It passed if<\/strong> <code>--dry-run<\/code> prints the message you expect, and a second dry run shows that no file changed.<\/p>\n<p><strong>If it fails:<\/strong> read the line it printed. Most first failures are a missing library, a wrong file path or the wrong time zone. Ask the builder to explain the error in plain words before it fixes anything.<\/p>\n<p><strong>If your brief needs an email or calendar login,<\/strong> switch to the umbrella version today. Build your real job as homework. A login takes longer than the class has.<\/p>\n<h3>Step 2. Send One Labelled Test (5 minutes)<\/h3>\n<p>Ask the builder to send you one real message, with &quot;🧪 TEST&quot; at the start.<\/p>\n<p><strong>Why:<\/strong> this is Annie's habit. She sends herself one test labelled &quot;🧪 TEST&quot; and only lets the job go live after she approves it (Build Log 37). The label stops you mistaking a test for the real thing.<\/p>\n<p><strong>It passed if<\/strong> the message arrives on your phone, and it reads the way you want.<\/p>\n<h3>Step 3. Put It on the Schedule and Run It Once (15 minutes)<\/h3>\n<p><strong>Ask the builder to create the job.<\/strong> The exact options change between Hermes versions, so the builder reads the help first:<\/p>\n<pre><code class=\"language-text\">Run &quot;hermes cron create --help&quot; and read it. Then create a no-agent job that runs my script at [time] every [day], and delivers to my Telegram. Show me the command before running it.\n<\/code><\/pre>\n<p><strong>Choose a time when you want messages.<\/strong> Annie groups her scheduled messages into set times: a morning burst and a 6 pm admin slot. A new message must fit one of them, or it needs her yes (Build Log 27; Claudith Clean Brief Style note).<\/p>\n<p><strong>Your builder may refuse to create the job.<\/strong> In September 2026 Claude Code's own safety check stopped it from installing a permanent job on Annie's server. She typed the final command herself (Build Log 78). This is correct: the owner approves anything permanent. If it happens to you, read the command. If you agree with it, run it yourself.<\/p>\n<p><strong>Then run it once through the scheduler.<\/strong> A job that works when you run it by hand can still fail on the schedule.<\/p>\n<pre><code class=\"language-bash\">hermes cron list\nhermes cron run &lt;job-id&gt;\n<\/code><\/pre>\n<p><code>hermes cron run<\/code> runs the job at the scheduler's next check, so the message can take up to a minute.<\/p>\n<p><strong>It passed if<\/strong> the job is in the list with the right time, and the message arrives on your phone.<\/p>\n<p><strong>If your job checks for things it already sent, run it a second time.<\/strong> The second run should send nothing.<\/p>\n<p><strong>Keep every job in the one scheduler.<\/strong> In August 2026 Annie found a job installed outside Hermes, in the server's own scheduler. It ran every night and reported success, but it had done nothing for about four weeks (Build Log 45). It did not show in <code>hermes cron list<\/code>, which is why nobody saw it (Build Log 51).<\/p>\n<\/section>\n<section class=\"card\" id=\"full-11-s6\"><h2><span class=\"num\">11.6<\/span> Build and Test One Skill<\/h2><p><em>Full course: 20 minutes. Short course: 25 minutes.<\/em><\/p>\n<p><strong>A skill is a written procedure that the AI assistant reads only when it is needed.<\/strong><\/p>\n<p><strong>Why skills exist (Build Log 19).<\/strong> The AI assistant's built-in memory is small. Annie's bot has 2,200 characters, and it reads all of them with every message. A six-step procedure saved there filled it, and left no room for facts. So the rule is: <strong>facts in memory, procedures in skills.<\/strong> The Full course met this rule in Module 07.<\/p>\n<h3>What a Skill Is<\/h3>\n<p>A skill is a folder. Inside it is one file, named exactly <code>SKILL.md<\/code>. The file starts with a short description, then the steps.<\/p>\n<p><strong>Three facts decide whether a skill works (Build Logs 90 and 98):<\/strong><\/p>\n<ol>\n<li><strong>The AI assistant reads only the name and description at the start.<\/strong> It reads the steps only when your request matches the description.<\/li>\n<li><strong>So the description must say when to use the skill, in the words you would type.<\/strong> A phrase that is not in the description will not start the skill. The limit is 1,024 characters. Annie's continuity and build-log skills use 914 and 1,004.<\/li>\n<li><strong>The file name must be exactly <code>SKILL.md<\/code>.<\/strong> In September 2026 one of Annie's skill folders held a backup copy named <code>SKILL.md.bak-20260929-170928<\/code>. The AI assistant could not see it, because the name was different (Build Log 98).<\/li>\n<\/ol>\n<p><strong>A skill is used reliably once the rules file points to it.<\/strong> On Annie's bot, a skill starting by itself has never been enough. Her client-document skill was used reliably once her rules file pointed to it, so she did the same for her Storage Inventory skill (Build Log 48). So the last step is to add one line to your rules file.<\/p>\n<h3>What Your Skill Does<\/h3>\n<ul>\n<li><strong>Full course:<\/strong> it runs the scheduled job's script when you ask, and sends you the result. So you can ask &quot;do I need an umbrella?&quot; at any time, not only at 7 am.<\/li>\n<li><strong>Short course:<\/strong> it does the job from your Build Brief when you ask for it.<\/li>\n<\/ul>\n<h3>Where the Skill Goes<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Course<\/th>\n<th>Folder<\/th>\n<th>How to check it loaded<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Full<\/td>\n<td><code>~/.hermes/skills/&lt;skill-name&gt;/SKILL.md<\/code> on the server<\/td>\n<td><code>hermes skills list<\/code> shows it. Then type <code>/new<\/code> in Telegram, because an open chat keeps the instructions it started with<\/td>\n<\/tr>\n<tr>\n<td>Short<\/td>\n<td><code>~/.agents/skills/&lt;skill-name&gt;/SKILL.md<\/code> on the laptop<\/td>\n<td>Start a new pi session. pi read skills from this folder on Annie's Mac (checked 10 Oct 2026)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Build It<\/h3>\n<p>Paste this to your builder (Claude Code in the Full course, pi in the Short course):<\/p>\n<pre><code class=\"language-text\">Make a skill for [the job from my Build Brief / my scheduled job's script].\nPut it in [the folder from the table], in a folder named [skill-name], with one file named exactly SKILL.md.\nWrite the description as a list of the phrases I would actually type to ask for it, such as &quot;do I need an umbrella&quot;.\nFollow the &quot;Must never do&quot; and &quot;Needs my approval before&quot; rows in my brief.\nThen add one line to my rules file that names the skill and says when to use it.\nShow me the SKILL.md before you save it.\n<\/code><\/pre>\n<h3>Test It Three Ways<\/h3>\n<ol>\n<li><strong>Ask in the words from the description.<\/strong> The AI assistant should use the skill.<\/li>\n<li><strong>Ask in different words you would also use.<\/strong> If it does not use the skill, add those words to the description and test again.<\/li>\n<li><strong>Ask something unrelated.<\/strong> The AI assistant should not use the skill.<\/li>\n<\/ol>\n<p><strong>It passed if<\/strong> all three tests give the right result, and your three acceptance checks from the brief pass.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-11-s7\"><h2><span class=\"num\">11.7<\/span> Shown, Not Built: A Model on a Schedule<\/h2><p><em>5 minutes, Full course only.<\/em><\/p>\n<p><strong>In class, no scheduled job calls an AI model.<\/strong> The jobs you build today are fixed steps only.<\/p>\n<p><strong>Why:<\/strong> a job that runs at 3 am with nobody watching should do the same thing every time. A model can give a different answer each time, and it can report success when it failed. That happened with Annie's first bot (Build Log 00). Since her rebuild, her scheduled jobs are scripts first. A job does not hand its judgement work to her top model (Build Log 00).<\/p>\n<p><strong>How Annie's system does it now, for when you are ready:<\/strong><\/p>\n<ul>\n<li><strong>Only one of her scheduled jobs hands the whole job to a model.<\/strong> Some of her scripts also ask a model for one step. On that one job, the model and the provider are fixed on the job itself, so a change to the default cannot move it without her knowing (Build Log 94).<\/li>\n<li><strong>Phoebe, her weekly idea job, calls Claude from a script.<\/strong> The script uses <code>claude -p<\/code> on her subscription. In September 2026 a script on her server picked up an API key from its surroundings, and it billed the paid API by mistake (Build Log 89). If you ever build this, make sure the script cannot see any API key.<\/li>\n<\/ul>\n<p><strong>This course does not teach <code>claude -p<\/code> as a step.<\/strong> We have no checked source on whether a subscription allows scheduled use.<\/p>\n<p><strong>When to try it:<\/strong> week 4 of your 30-day plan (Module 12). Write the test questions first, then build it.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-11-s8\"><h2><span class=\"num\">11.8<\/span> Set the Keep-or-Kill Date<\/h2><p><em>5 minutes, Full course only. The Short course set its date in &quot;Finish the Build Brief&quot;.<\/em><\/p>\n<p><strong>Put a review date two weeks from today in your calendar.<\/strong> On that date, ask one question: did I actually use it?<\/p>\n<p>If not, pause it without guilt. Keep the script for later. Annie set this test for her morning brief when it went live on 6 July 2026 (Build Log 27).<\/p>\n<p>Then ask your builder to write today's build log, with its index row. It records the brief, the script, the job, the skill, the test results and the keep-or-kill date.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-11-s9\"><h2><span class=\"num\">11.9<\/span> From the Record<\/h2><p>Two stories for students who ask for more.<\/p>\n<p><strong>The reminder that arrived twice (Build Log 37).<\/strong> On at least two nights in July 2026 Annie received two receipt reminders, but only one job existed. When she replied &quot;done&quot;, the bot sent the files again as a reply. The fix was a written rule: when she says &quot;done&quot;, log it and do not send the files again.<\/p>\n<p><strong>The bot fixed the wrong file (Build Log 42).<\/strong> In July 2026 Annie asked for a new format for her morning message. The bot said &quot;updated&quot;, and it changed its skill file correctly. The next two mornings still came in the old format. The scheduled job had its own stored instructions, which said &quot;EXACTLY this format&quot;, and those won every time. When a fix does not show up, find which file the job actually reads.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-11-s10\"><h2><span class=\"num\">11.10<\/span> Worksheet: Growing It<\/h2><div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Proof<\/th>\n<th>Course<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Five new brief rows written<\/td>\n<td>My brief<\/td>\n<td>Short<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Keep-or-kill date in my calendar<\/td>\n<td>My calendar<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>One tool I decided not to add, with my reason<\/td>\n<td>My run card<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Script prints the message, prints nothing when quiet, prints failures<\/td>\n<td><code>--dry-run<\/code> output<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>--dry-run<\/code> changed no file<\/td>\n<td>A second dry run<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>One &quot;🧪 TEST&quot; message arrived and I approved it<\/td>\n<td>My phone<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Job is on the schedule at the right time<\/td>\n<td><code>hermes cron list<\/code><\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Job ran once through the scheduler<\/td>\n<td>The message on my phone<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Skill folder holds one file named exactly <code>SKILL.md<\/code><\/td>\n<td>The folder listing<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Skill passed all three tests<\/td>\n<td>My notes<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Rules file points to the skill<\/td>\n<td>The line in my rules file<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>One-sentence answer to the server question<\/td>\n<td>My run card<\/td>\n<td>Short<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Today's build log written, with its index row<\/td>\n<td>The log and the index<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>\n<section class=\"card\" id=\"full-11-s11\"><h2><span class=\"num\">11.11<\/span> Teaching Notes<\/h2><ul>\n<li><strong>Check two things before the course.<\/strong> The <code>hermes cron create<\/code> options in the Hermes version the room installs. And that the pi version the room installs still reads skills from <code>~/.agents/skills/<\/code>.<\/li>\n<li><strong>The skill description is the hard part.<\/strong> v1 called the skill exercise &quot;the hardest fifteen minutes in the course for some students&quot;. Sit with each student and write the trigger phrases together.<\/li>\n<li><strong>The umbrella example is fine.<\/strong> A small job that works teaches more than a large one that does not finish.<\/li>\n<li><strong>Students will want a second job straight away.<\/strong> Point them to week 3 of the 30-day plan (Module 12).<\/li>\n<li><strong>Three students at most.<\/strong> In the Full course, the 40-minute build needs you at each keyboard in turn.<\/li>\n<li><strong>Timing risk:<\/strong> a brief that needs a login (email, calendar) runs long. Switch that student to the umbrella example and leave the real job as homework.<\/li>\n<\/ul>\n<\/section>\n<details class=\"card ref\" id=\"full-11-s12\"><summary><span class=\"num\">11.12<\/span> Where the Versions Went <span class=\"hint\">tap to open<\/span><\/summary><p><strong>Kept from the Claude version (Module 14):<\/strong> the print rule; the script prompt with <code>--dry-run<\/code>; the umbrella example; the &quot;🧪 TEST&quot; message; <code>hermes cron create --help<\/code>; the builder that may refuse (Log 78); one run through the scheduler; the second run; the skill on request; the keep-or-kill date; two &quot;From the Record&quot; stories.<\/p>\n<p><strong>Kept from v1 (Block 12):<\/strong> one thing at a time; why skills exist (Log 19); the skill facts from Logs 90 and 98; the server question, Short course only.<\/p>\n<p><strong>Added:<\/strong> the Log 28 story (moved from v1 Block 1, without the company name and without the &quot;rent the chef&quot; phrase); the five Build Brief rows for the Short course; the three-way skill test; the skill folder for pi, checked on Annie's Mac.<\/p>\n<p><strong>Moved to the handout:<\/strong> formatting for the phone; reading the web with a cap; pause and resume; the two other patterns for steps that need judgement.<\/p>\n<p><strong>Left out:<\/strong> &quot;Check the real trigger&quot; (Log 41), because the brief already asks for the trigger; the morning brief story (Log 27), because its two-week test is used instead; v1's &quot;the line for next month&quot;, which Module 12's 30-day plan replaces; v1's &quot;The model does not know what today is&quot; and &quot;The identity check takes about a day&quot;, which have nothing to do with choosing a server.<\/p>\n<p><strong>Errors fixed:<\/strong><\/p>\n<ul>\n<li><strong>Log 00's figures.<\/strong> v1 said &quot;half a day of logged work on top of a week of confusion&quot;. Log 00 says 13 logged hours, plus about a week of Annie's research.<\/li>\n<li><strong>Log 95's figures.<\/strong> v1 said the sessions were &quot;aged five to eighteen days&quot;. Log 95 says 4 to 17 days old.<\/li>\n<li><strong>The job outside the scheduler.<\/strong> The Claude version cited Log 42, which has no such story. Log 45 found it doing nothing for about four weeks, and Log 51 records it.<\/li>\n<li><strong>Log 00's cause.<\/strong> Earlier drafts said the first bot broke from a batch of untested automations. Log 00 says its cheap model could not use its tools and faked success. &quot;Don't add features in batches&quot; is from the rebuild notes, and the 24 to 48 hours was a plan.<\/li>\n<li><strong>&quot;No more Tier 3 cron prompts&quot; is not quoted.<\/strong> In Log 00, Tier 3 means a level of model. The course uses Tier 3 for data that never goes into AI (Module 02), so the quote would give students two meanings.<\/li>\n<li><strong>Log 37's fix<\/strong> was a written rule not to re-send the files, not the print-nothing change.<\/li>\n<li><strong>Log 48's lesson<\/strong> came from the client-document skill, then applied to Storage Inventory.<\/li>\n<li><strong>v1 contradicted itself.<\/strong> Its notes said one addition per student. Its exercise asked for a schedule and a skill. Now the Full course builds both, one after the other, each tested first, and the Short course builds one.<\/li>\n<li><strong>v1's heading &quot;The Description Is the Whole Routing Surface&quot;<\/strong> used a phrase the course register bans. It is now &quot;Three facts decide whether a skill works&quot;.<\/li>\n<li><strong>v1's unsourced claims were removed:<\/strong> &quot;the single most common reason a skill sits unused&quot;, &quot;usually about a month after you start depending on the thing&quot;, and the saying &quot;A server collects the things you forget to close.&quot;<\/li>\n<li><strong>v1 never said where a skill file goes.<\/strong> The table now gives the folder for each course.<\/li>\n<li><strong>The Claude version's &quot;break your job on purpose&quot; exercise had no time on its run sheet.<\/strong> Module 10 already does this, so it is not repeated.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"full-11-s13\"><summary><span class=\"num\">11.13<\/span> Sources <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>Build Log 00: the first bot's collapse; 13 logged hours; &quot;Don't add features in batches&quot;; version 2's three things.<\/li>\n<li>Build Log 19: the 2,200-character memory; facts in memory, procedures in skills.<\/li>\n<li>Build Log 27: new messages need her yes; the two-week test from 6 July 2026.<\/li>\n<li>Claudith Clean Brief Style note: the morning burst and the 6 pm admin slot.<\/li>\n<li>Build Log 28: the Hermes desktop app, 8 July 2026.<\/li>\n<li>Build Log 35: Annie's weather job.<\/li>\n<li>Build Log 37: the labelled test; the reminder that arrived twice.<\/li>\n<li>Build Log 42: the stored instructions that won.<\/li>\n<li>Build Logs 45 and 51: the job outside the scheduler, August 2026.<\/li>\n<li>Build Log 48: skills used reliably once the rules point to them.<\/li>\n<li>Build Log 75: the server login that expires.<\/li>\n<li>Build Log 78: the builder's safety check.<\/li>\n<li>Build Log 89: the API key used by mistake.<\/li>\n<li>Build Log 90: skill descriptions; 914 and 1,004 of 1,024 characters.<\/li>\n<li>Build Log 94: the model and provider fixed on a job.<\/li>\n<li>Build Log 95: six abandoned sessions, 1.5 GB.<\/li>\n<li>Build Log 98: the backup copy the AI assistant could not see.<\/li>\n<li>Live server check, 10 Oct 2026: &quot;no-agent (script stdout delivered directly)&quot;; <code>hermes cron<\/code> and <code>hermes skills<\/code> commands.<\/li>\n<li>pi on Annie's Mac, 10 Oct 2026: skills read from <code>~/.agents/skills/<\/code>.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"full-11-s14\"><summary><span class=\"num\">11.14<\/span> Related <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>07 — Rules of Engagement (Merged)<\/li>\n<li>08 — The Build (Merged)<\/li>\n<li>08B — The Server and Your Bot (Merged)<\/li>\n<li>09 — Script, Machine Learning or AI Judgement (Merged)<\/li>\n<li>10 — What Breaks, and Keeping It Honest (Merged)<\/li>\n<li>11 — Handout, More Ways to Grow Your System<\/li>\n<li>01 — Merge Tracker (Decisions, Hours, Checks)<\/li>\n<li>00 — Side-by-Side (9 Oct 2026) (Pair 11)<\/li>\n<\/ul>\n<\/details>", "count": 14}, {"id": "full-11h", "label": "11 Handout", "title": "Handout: More Ways to Grow Your System", "minutes": null, "read": 3, "toc": [["full-11h-s1", "11H.1", "Formatting Messages for the Phone"], ["full-11h-s2", "11H.2", "Reading the Web, With a Cap"], ["full-11h-s3", "11H.3", "Pausing and Restarting a Job"], ["full-11h-s4", "11H.4", "Two Ways to Use a Model on a Schedule"]], "body": "<div class=\"intro\"><p><em>A handout for Module 11, both courses. Read it at home, after your first job or skill has run for a week. Each section comes from Annie's build logs. Use one at a time.<\/em><\/p>\n<\/div>\n<section class=\"card\" id=\"full-11h-s1\"><h2><span class=\"num\">11H.1<\/span> Formatting Messages for the Phone<\/h2><p><strong>A correct message is not always a usable one.<\/strong> Annie's weather job worked out the weather correctly. She still said: &quot;in terms of how I want to read it, it's not quite right.&quot; The one line she could act on was hidden under a loud warning sign (Seminar Ideas, 15 and 19 July 2026).<\/p>\n<p><strong>Five of the seven rules in Annie's message format, approved on 15 July 2026<\/strong> (Claudith Clean Brief Style note):<\/p>\n<ol>\n<li>A bold first line that says what this is and when.<\/li>\n<li>A one-line summary under it.<\/li>\n<li>Short &quot;Label: value&quot; lines, with a blank line between items.<\/li>\n<li>Warning signs only where you need to act.<\/li>\n<li>Turn the unimportant items into a count. Send nothing when nothing matters.<\/li>\n<\/ol>\n<p><strong>Telegram shows only some formatting.<\/strong> Bold, italics, code and links work. Headings and quote blocks show as stray characters. Tables turn into bullet lists (Build Log 108).<\/p>\n<p><strong>Read the real message on your real phone.<\/strong> Annie's weather job took 18 changes in 6 days (Build Log 35). Each round of changes came from her reading the real message on her real phone (Seminar Ideas).<\/p>\n<\/section>\n<section class=\"card\" id=\"full-11h-s2\"><h2><span class=\"num\">11H.2<\/span> Reading the Web, With a Cap<\/h2><p>Many useful jobs read web pages. Annie's bots use Firecrawl. It turns a web page into clean text, and it can search. Its free plan gives 1,000 credits a month. A search costs about 2 credits (Annie's notes, 29 Sep 2026).<\/p>\n<p><strong>Cap the job, not only the account.<\/strong> The first run of Annie's company-watch job had no limit on how many searches the AI could make. It used 92 credits and never finished. Limited to 14 calls, it finished in 12 and used 21 credits (<code>Firecrawl — Use Cases<\/code> note).<\/p>\n<p><strong>Her rule for Firecrawl:<\/strong> warn before the limit, and never top up automatically (Annie's Firecrawl notes).<\/p>\n<\/section>\n<section class=\"card\" id=\"full-11h-s3\"><h2><span class=\"num\">11H.3<\/span> Pausing and Restarting a Job<\/h2><p>Pausing keeps the job but stops it from running. Use it on your keep-or-kill date if you are not sure yet.<\/p>\n<pre><code class=\"language-bash\">hermes cron pause &lt;job-id&gt;\nhermes cron resume &lt;job-id&gt;\n<\/code><\/pre>\n<p>Annie once paused a working bill reminder on the day she built it. It only told her to go and check an app, so it removed no work (Build Log 41).<\/p>\n<\/section>\n<section class=\"card\" id=\"full-11h-s4\"><h2><span class=\"num\">11H.4<\/span> Two Ways to Use a Model on a Schedule<\/h2><p>Try these only after week 4 of your 30-day plan (Module 12), with your test questions written first.<\/p>\n<p><strong>1. A model job with its model fixed.<\/strong> The scheduler hands a request to the bot's model. Fix the model and the provider on the job itself. Then a change to the default model cannot move the job without you knowing. Annie's scheduler refuses to run a job that has no fixed model if the default changed after the job was made (Build Log 84). Her command (Build Log 94):<\/p>\n<pre><code class=\"language-bash\">hermes cron edit &lt;job-id&gt; --model deepseek-v4.1-flash --provider opencode-go --pin\n<\/code><\/pre>\n<p><strong>2. The model writes, a script sends.<\/strong> In June 2026 Annie wanted her morning summary as several short messages. A scheduled model job could only send one reply, and the cheap model added its working notes to it. The fix used two jobs. The model job writes only the clean message to a file, and sends nothing. Five minutes later, a script job splits the file and sends each part as its own message (Build Log 15).<\/p>\n<\/section>\n<details class=\"card ref\" id=\"full-11h-s5\"><summary><span class=\"num\">11H.5<\/span> Sources <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>Build Log 15: the two-job pattern.<\/li>\n<li>Build Log 35: 18 changes in 6 days.<\/li>\n<li>Build Log 41: the bill reminder paused the same day.<\/li>\n<li>Build Log 84: the check on jobs with no fixed model.<\/li>\n<li>Build Log 94: fixing the model and provider on a job.<\/li>\n<li>Build Log 108: Telegram formatting.<\/li>\n<li>Claudith Clean Brief Style note, 15 July 2026.<\/li>\n<li>Seminar Ideas, 15 and 19 July 2026.<\/li>\n<li><code>Firecrawl — Use Cases<\/code> note.<\/li>\n<li>Annie's notes, 29 Sep 2026: Firecrawl credits.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"full-11h-s6\"><summary><span class=\"num\">11H.6<\/span> Related <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>11 — Growing It, Skills and Schedules (Merged)<\/li>\n<\/ul>\n<\/details>", "count": 6}, {"id": "full-12", "label": "12", "title": "Module 12: The Close, Your 30-Day Plan", "minutes": 40, "read": 13, "toc": [["full-12-s1", "12.1", "What You Will Leave With"], ["full-12-s2", "12.2", "The Promise, Checked"], ["full-12-s3", "12.3", "The Closing Question"], ["full-12-s4", "12.4", "Owner Drill 1: An Alert, Without the Builder"], ["full-12-s5", "12.5", "Your 30-Day Plan"], ["full-12-s6", "12.6", "Owner Drill 2: A Delete That Sticks"], ["full-12-s7", "12.7", "When It Breaks, and Where to Get Help"], ["full-12-s8", "12.8", "Worksheet: The Close"], ["full-12-s9", "12.9", "Teaching Notes"], ["full-12-s11", "12.11", "Open Points for Annie"]], "body": "<div class=\"intro\"><p><strong>Why this module comes last.<\/strong><\/p>\n<ol>\n<li>Students now own a system that does one real job (Modules 08 and 11).<\/li>\n<li>It has checks that tell them when it breaks (Module 10).<\/li>\n<li>So the last job is to check it against the course promise, and to plan the next four weeks.<\/li>\n<li>The course ends on the student's next action, not on a summary.<\/li>\n<\/ol>\n<\/div>\n<section class=\"card\" id=\"full-12-s1\"><h2><span class=\"num\">12.1<\/span> What You Will Leave With<\/h2><p><strong>Both courses:<\/strong><\/p>\n<ul>\n<li>Your system, checked against the course promise. Any row you cannot tick is written on your run card as work to do.<\/li>\n<li>A 30-day plan, one row for each week, with a stop condition for each week.<\/li>\n<li>The four steps to take when something breaks.<\/li>\n<li>The name of the group chat where you get help for four weeks, and the date of the class call.<\/li>\n<\/ul>\n<p><strong>Full course only:<\/strong><\/p>\n<ul>\n<li>Proof that you can run your system alone: you did one alert's action and one delete that sticks, with no builder.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-12-s2\"><h2><span class=\"num\">12.2<\/span> The Promise, Checked<\/h2><p><em>5 minutes, both courses.<\/em><\/p>\n<p>At the start, the course promised you a system you can check. Check it now, against what is in front of you.<\/p>\n<p><strong>Full course.<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>The claim<\/th>\n<th>The check<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>One AI assistant you can reach from your phone<\/td>\n<td>Send your bot a message on Telegram, and read the answer<\/td>\n<\/tr>\n<tr>\n<td>One real job that runs without you<\/td>\n<td>Run <code>hermes cron list<\/code> and find your scheduled job from Module 11<\/td>\n<\/tr>\n<tr>\n<td>Three rules you wrote<\/td>\n<td>Name them, and say how each one is checked<\/td>\n<\/tr>\n<tr>\n<td>It tells you when it breaks<\/td>\n<td>Run your watchdog with <code>--status<\/code>. All three checks are green<\/td>\n<\/tr>\n<tr>\n<td>You know what it costs<\/td>\n<td>Read the monthly figure off your run card<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>A row you cannot tick is work to do. It is not a failure.<\/strong> Write the row on your run card. Bring it to the group chat or the class call.<\/p>\n<p><strong>Why the Full course checks the watchdog, not a refusal.<\/strong> The Full course built checks that run by themselves (Module 10). A refusal tests a different thing: the rule about saying when the AI assistant does not know.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-12-s3\"><h2><span class=\"num\">12.3<\/span> The Closing Question<\/h2><p><em>5 minutes, Full course. Short course: homework, written on the run card.<\/em><\/p>\n<p><strong>&quot;What have I built, and what does it take off my mind?&quot;<\/strong><\/p>\n<p><strong>Answer it in one sentence.<\/strong> You can say it to the room, or write it down. If you can describe your system in one sentence, you know what it is for. Keep the sentence somewhere you will see it.<\/p>\n<p><strong>Annie's own sentence, for an example.<\/strong> In August 2026 she wrote what the whole effort is for: clearing what drains her, so she can be present with the people in front of her, including herself (Build Log 72).<\/p>\n<p><strong>The second question, written, not spoken.<\/strong> What would &quot;too much looking after&quot; be for you? For example: more than 30 minutes a week of fixing. Write your limit now. If you reach it later, you switch something off. You do not keep adding.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-12-s4\"><h2><span class=\"num\">12.4<\/span> Owner Drill 1: An Alert, Without the Builder<\/h2><p><em>5 minutes, Full course only.<\/em><\/p>\n<p><strong>Why this drill exists.<\/strong> After today, nobody sits beside you. Your watchdog will one day send you an alert. You must be able to do its one action yourself, even if your builder is not working.<\/p>\n<p><strong>What the facilitator gives you.<\/strong> A printed alert, in the same format as your own watchdog's messages:<\/p>\n<pre><code class=\"language-text\">⚠️ Backup is 31 hours old (limit 26).\nDo this: run the backup script now, then run the watchdog with --status.\n<\/code><\/pre>\n<p><strong>What you do. Do not open Claude Code or pi.<\/strong><\/p>\n<ol>\n<li>Log in to your server: <code>ssh myserver<\/code>.<\/li>\n<li>Find your backup script: <code>ls ~/.hermes/scripts/<\/code>. Your run card should also have its name.<\/li>\n<li>Run it: <code>python3 ~/.hermes/scripts/&lt;your backup script&gt;<\/code>.<\/li>\n<li>Run your watchdog: <code>python3 ~/.hermes/scripts/watchdog.py --status<\/code>.<\/li>\n<\/ol>\n<p><strong>It passed if<\/strong> check 2 is green, and you did not ask a builder.<\/p>\n<p><strong>If you got stuck,<\/strong> write down the step where you stopped. Add the missing command to your run card now. That is the point of the drill: the run card must hold what you need.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-12-s5\"><h2><span class=\"num\">12.5<\/span> Your 30-Day Plan<\/h2><p><em>Full course: 10 minutes. Short course: 5 minutes.<\/em><\/p>\n<p><strong>Add one tested thing at a time. Then live with it for a few days before you add the next.<\/strong> This is the rule from Module 11, and it applies after the course too. When Annie broke this rule in May 2026, the clean-up took 13 logged hours (Build Log 00).<\/p>\n<p><strong>Expect to change things many times.<\/strong> Annie built and reshaped her storage system across five days in August 2026. It took about 45 to 50 separate changes (Build Log 52). Changing your mind is how the system becomes yours.<\/p>\n<p><strong>Write your own plan.<\/strong> One row for each week. Each week has a stop condition: the thing that tells you the week is done.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Week<\/th>\n<th>What you do<\/th>\n<th>Stop condition<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1<\/strong><\/td>\n<td>Add nothing new. Use what you built today. Note anything that annoys you<\/td>\n<td>You used it at least three times, and you wrote down each annoyance<\/td>\n<\/tr>\n<tr>\n<td><strong>2<\/strong><\/td>\n<td>Your keep-or-kill date arrives (Module 11). Ask: did I actually use it? Keep it, change it, or switch it off. Bring your answer to the class call<\/td>\n<td>You decided, and you wrote down why<\/td>\n<\/tr>\n<tr>\n<td><strong>3<\/strong><\/td>\n<td>Add one more thing, from your Module 05 maps. One thing, one check, one sentence to describe it<\/td>\n<td>It passed its test, and it ran for three days<\/td>\n<\/tr>\n<tr>\n<td><strong>4<\/strong><\/td>\n<td>Try one task that needs AI judgement. Write your test questions with known answers first, then build it (Module 09)<\/td>\n<td>It passed your test questions. <strong>Full:<\/strong> your RULES file matches <code>hermes cron list<\/code>. <strong>Short:<\/strong> your <code>AGENTS.md<\/code> still describes everything your AI assistant does<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>How to size the week 3 thing.<\/strong> It is one thing. It has one check. You can describe it in one sentence. &quot;Send me the invoices that need a claim&quot; is one thing. &quot;Sort out my admin&quot; is not.<\/p>\n<p><strong>Switching something off counts as progress.<\/strong> On 27 July 2026 Annie built a job that watched for her credit card statement. Every test passed. She switched it off a few hours later. The bank's email never contained the amount or the due date, so the job could only ever say &quot;go and check the app&quot;. It did not remove a chore, so it did not earn a place (Build Log 41).<\/p>\n<\/section>\n<section class=\"card\" id=\"full-12-s6\"><h2><span class=\"num\">12.6<\/span> Owner Drill 2: A Delete That Sticks<\/h2><p><em>5 minutes, Full course only. Skip it if your vault is not on your server, and use the time for your plan.<\/em><\/p>\n<p><strong>Why this drill exists.<\/strong> In Annie's setup, a note deleted on her laptop can come back. A delete made on the server first does reach every device (Build Log 106). Module 08B told you this. Now you do it once, so you remember it.<\/p>\n<ol>\n<li>On your laptop, in Obsidian, make a note called <code>Drill test note<\/code>.<\/li>\n<li>Wait for it to sync. Then check it is on the server: <code>ls ~/&lt;your vault folder&gt;/<\/code>.<\/li>\n<li>Delete it on the server: <code>rm ~/&quot;&lt;your vault folder&gt;/Drill test note.md&quot;<\/code>. Keep the quote marks, because the file name has spaces.<\/li>\n<li>Wait for the next sync run. Look in Obsidian on your laptop.<\/li>\n<\/ol>\n<p><strong>It passed if<\/strong> the note is gone from your laptop too.<\/p>\n<p><strong>Write the rule on your run card:<\/strong> &quot;To delete a note for good, delete it on the server first.&quot;<\/p>\n<\/section>\n<section class=\"card\" id=\"full-12-s7\"><h2><span class=\"num\">12.7<\/span> When It Breaks, and Where to Get Help<\/h2><p><em>5 minutes, both courses.<\/em><\/p>\n<h3>The Four Steps<\/h3>\n<p>When something goes wrong, do these in order. Read the real thing before you guess.<\/p>\n<ol>\n<li><strong>Read what the AI assistant actually said,<\/strong> and what the file actually contains.<\/li>\n<li><strong>Check which folder it was started in.<\/strong> Most &quot;it forgot my rules&quot; problems are the wrong folder.<\/li>\n<li><strong>Check that the rule is written in a file.<\/strong> A rule you only said in a chat is gone after the chat ends.<\/li>\n<li><strong>Ask your builder one question, with the real output pasted in.<\/strong><\/li>\n<\/ol>\n<p><strong>If the four steps do not fix it, go to the group chat.<\/strong> Paste the real output there too. A copy of the error is quicker to answer than a description of it.<\/p>\n<h3>Help for Four Weeks After the Course<\/h3>\n<ul>\n<li><strong>A shared group chat for the class, for four weeks.<\/strong> It covers your whole 30-day plan.<\/li>\n<li><strong>Who answers:<\/strong> Annie or a co-teacher, as messages arrive. You should not lose a day of progress waiting for an answer.<\/li>\n<li><strong>The hours the chat is covered:<\/strong> [TO CONFIRM]. The co-teachers live in other time zones, so the hours are agreed after this draft.<\/li>\n<li><strong>One class call at the end of week 2,<\/strong> 30 to 45 minutes. This is when your keep-or-kill date arrives. Bring your answer, and any row from the promise check you could not tick.<\/li>\n<li><strong>Included in the course fee or paid extra:<\/strong> [COST].<\/li>\n<\/ul>\n<p><strong>Write on your run card:<\/strong> the chat's name, the date and time of the class call, and the four steps.<\/p>\n<h3>The Last Save<\/h3>\n<p><em>Full course: 5 minutes. Short course: at the end of the help segment.<\/em><\/p>\n<p>Say <strong>&quot;save&quot;<\/strong> to your builder. It updates your continuity note and writes today's build log with its index row, as you set up in Module 08. This is the last thing you do in the course.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-12-s8\"><h2><span class=\"num\">12.8<\/span> Worksheet: The Close<\/h2><div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Proof<\/th>\n<th>Course<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Every promise row checked<\/td>\n<td>My run card, with any row I could not tick<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>One sentence: what I built, and what it takes off my mind<\/td>\n<td>My run card<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My limit for &quot;too much looking after&quot;<\/td>\n<td>My run card<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Drill 1: alert action done, with no builder<\/td>\n<td>Watchdog <code>--status<\/code> all green<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Drill 2: deleted on the server, gone from the laptop<\/td>\n<td>Obsidian on my laptop<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>30-day plan, four rows, each with a stop condition<\/td>\n<td>My plan<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Keep-or-kill date still in my calendar<\/td>\n<td>My calendar<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>The four steps, the chat's name and the call date<\/td>\n<td>My run card<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Last save done<\/td>\n<td>My continuity note and build log<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>\n<section class=\"card\" id=\"full-12-s9\"><h2><span class=\"num\">12.9<\/span> Teaching Notes<\/h2><ul>\n<li><strong>End on the student's next action.<\/strong> The last thing each student hears is &quot;start week 1 tomorrow&quot;, not a summary.<\/li>\n<li><strong>Some adults freeze when asked to speak.<\/strong> Always allow a written answer to the closing question.<\/li>\n<li><strong>Students who used a fallback in the build<\/strong> (the umbrella example, or a browser) will have rows they cannot tick. Say plainly that this is work to do, not failure.<\/li>\n<li><strong>The drills are done without the builder on purpose.<\/strong> If a student opens Claude Code or pi, ask them to close it. The drill tests the run card, not the builder.<\/li>\n<li><strong>Prepare drill 1 before class.<\/strong> Print one sample alert for each student. Check each student's watchdog alert format in Module 10, so the sample looks like their own.<\/li>\n<li><strong>Drill 2 needs the vault on the server.<\/strong> Check this per student in Module 08B. A student without it skips the drill.<\/li>\n<li><strong>Name the group chat and set the call date before class.<\/strong> A student should leave with both written down, not &quot;we will let you know&quot;.<\/li>\n<li><strong>Three students at most.<\/strong> In the drills, you watch each screen in turn.<\/li>\n<\/ul>\n<\/section>\n<details class=\"card ref\" id=\"full-12-s10\"><summary><span class=\"num\">12.10<\/span> Where the Versions Went <span class=\"hint\">tap to open<\/span><\/summary><p><strong>Kept from v1 (Block 13):<\/strong> the promise, checked; the closing question and the &quot;too much looking after&quot; limit; how to size a next step; the switch-off story (now cited as Log 41); the four steps when it breaks; Annie's sentence (Log 72).<\/p>\n<p><strong>Kept from the Claude version (Module 15):<\/strong> the 30-day plan with a stop condition for each week; &quot;expect to change things many times&quot; (Log 52); the last save; ending on the student's next action.<\/p>\n<p><strong>Added:<\/strong><\/p>\n<ul>\n<li>The two owner drills, Full course only (moved here from Pair 10, Annie's call on 10 Oct 2026).<\/li>\n<li>Help after the course: the group chat for four weeks and the class call at the end of week 2 (Annie's decisions, 10 Oct 2026).<\/li>\n<li>A separate promise table for each course, because the two courses build different things.<\/li>\n<li>A Short course week 4 stop condition, because <code>hermes cron list<\/code> only works on a server.<\/li>\n<\/ul>\n<p><strong>Changed:<\/strong><\/p>\n<ul>\n<li><strong>The plan's weeks 2 and 3 swapped.<\/strong> The Claude version added a second job in week 2 and did keep-or-kill in week 3. Module 11 already sets the keep-or-kill date two weeks after the build. So keep-or-kill is now week 2, on the same week as the class call, and the second thing is added in week 3.<\/li>\n<li><strong>v1's two lines (&quot;the next thing I will add&quot;, &quot;the thing I will switch off&quot;)<\/strong> are now weeks 2 and 3 of the plan.<\/li>\n<\/ul>\n<p><strong>Left out:<\/strong> v1's &quot;Next&quot; section (&quot;bring your assistant to the next session only if you are asked to&quot;), because there is no next session; v1's &quot;rebuild it in an hour&quot; line, because it has no source.<\/p>\n<p><strong>Errors fixed:<\/strong><\/p>\n<ul>\n<li><strong>v1 promised three things and wrote two.<\/strong> The heading said &quot;The Next Three Things&quot;. The plan now has four weekly rows, and nothing promises three.<\/li>\n<li><strong>v1 said &quot;half a day of logged work&quot;.<\/strong> Log 00 says 13 logged hours.<\/li>\n<li><strong>v1's switch-off story had no log number.<\/strong> It is Log 41, 27 July 2026, switched off the same day.<\/li>\n<li><strong>v1's &quot;It tells you when it breaks&quot; row tested a refusal.<\/strong> In the Full course it now runs the watchdog. The Short course keeps the refusal, because its check is the golden questions (Module 10).<\/li>\n<li><strong>v1's run sheet said &quot;write where to get help&quot; but named no place.<\/strong> The group chat and the class call are now named.<\/li>\n<li><strong>The Claude version said Annie's second system started with one reminder &quot;lived with for two days&quot;.<\/strong> Log 00 records a plan to live with it for 24 to 48 hours. This module does not repeat the line.<\/li>\n<li><strong>Compressed sayings rewritten as plain sentences:<\/strong> &quot;Bring the failure, not the worry&quot;, &quot;Any row you cannot answer is work, not failure&quot;, and &quot;a chore announced rather than a chore removed&quot;.<\/li>\n<li><strong>v1's unsourced claim removed:<\/strong> &quot;Every problem in this course was solved by reading the real output.&quot;<\/li>\n<\/ul>\n<\/details>\n<section class=\"card\" id=\"full-12-s11\"><h2><span class=\"num\">12.11<\/span> Open Points for Annie<\/h2><ol>\n<li><strong>Group chat hours,<\/strong> parked to talk about with the co-teachers (tracker, question 5). The module says [TO CONFIRM] until then.<\/li>\n<li><strong>Module 11 points to the wrong week.<\/strong> Its teaching note says &quot;point them to week 2 of the 30-day plan&quot; for a second job. With weeks 2 and 3 swapped, that is now week 3. Module 11 is approved, so it is not changed without Annie's yes. <em>Done 11 Oct 2026: Annie accepted Claude's recommendation, and Module 11 now says week 3.<\/em><\/li>\n<\/ol>\n<\/section>\n<details class=\"card ref\" id=\"full-12-s12\"><summary><span class=\"num\">12.12<\/span> Sources <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>Build Log 00: 13 logged hours; one tested thing at a time; the 24 to 48 hour plan.<\/li>\n<li>Build Log 41: the credit card statement job, switched off on 27 July 2026, the same day; &quot;does it delete a chore&quot;.<\/li>\n<li>Build Log 52: about 45 to 50 changes across five days, 17 to 22 August 2026.<\/li>\n<li>Build Log 72: clearing what drains you so you can be present.<\/li>\n<li>Build Log 106: a delete only reaches every device if it is made on the server first.<\/li>\n<li>Merge Tracker, 10 Oct 2026: help after the course (both), who answers the chat, the two owner drills, the 40 and 15 minute split.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"full-12-s13\"><summary><span class=\"num\">12.13<\/span> Related <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>08 — The Build (Merged)<\/li>\n<li>08B — The Server and Your Bot (Merged)<\/li>\n<li>09 — Script, Machine Learning or AI Judgement (Merged)<\/li>\n<li>10 — What Breaks, and Keeping It Honest (Merged)<\/li>\n<li>11 — Growing It, Skills and Schedules (Merged)<\/li>\n<li>01 — Merge Tracker (Decisions, Hours, Checks)<\/li>\n<li>00 — Side-by-Side (9 Oct 2026) (Pair 12)<\/li>\n<\/ul>\n<\/details>", "count": 13}]}, "short": {"overview": "<section class=\"card hero\">\n<h1>Short Course<\/h1>\n<p class=\"sub\">10 hours · laptop first<\/p>\n<p>Students build one AI assistant on their laptop with pi, give it one real job, and prove it works with two tests. A server is an optional extra sitting.<\/p>\n<\/section>\n<section class=\"card\"><h2>Syllabus<\/h2>\n<p class=\"muted\">The session split is a draft. The session format is still open (Merge Tracker, question 4).<\/p>\n<div class=\"sess\"><div class=\"sesshead\"><b>Session 1<\/b><span class=\"min big\">150 min<\/span><\/div><ul><li><a href=\"#short-01\" data-go=\"short-01\">01: What Works From Hong Kong<\/a> <span class=\"min\">45 min<\/span><\/li><li><a href=\"#short-02\" data-go=\"short-02\">02: Privacy, Security and Whose Law Reaches Your Data<\/a> <span class=\"min\">35 min<\/span><\/li><li><a href=\"#short-03\" data-go=\"short-03\">03: Architecture and Where Your System Lives<\/a> <span class=\"min\">70 min<\/span><\/li><\/ul><\/div><div class=\"sess\"><div class=\"sesshead\"><b>Session 2<\/b><span class=\"min big\">150 min<\/span><\/div><ul><li><a href=\"#short-04\" data-go=\"short-04\">04: The Demo<\/a> <span class=\"min\">25 min<\/span><\/li><li><a href=\"#short-05\" data-go=\"short-05\">05: Your Processes on Paper<\/a> <span class=\"min\">35 min<\/span><\/li><li><a href=\"#short-06\" data-go=\"short-06\">06: Introduce Yourself to the Machine<\/a> <span class=\"min\">30 min<\/span><\/li><li><a href=\"#short-07\" data-go=\"short-07\">07: Rules of Engagement<\/a> <span class=\"min\">30 min<\/span><\/li><li><a href=\"#short-08\" data-go=\"short-08\">08 The Build: first 30 minutes<\/a> <span class=\"min\">30 min<\/span><\/li><\/ul><\/div><div class=\"sess\"><div class=\"sesshead\"><b>Session 3<\/b><span class=\"min big\">150 min<\/span><\/div><ul><li><a href=\"#short-08\" data-go=\"short-08\">08 The Build: the rest<\/a> <span class=\"min\">150 min<\/span><\/li><\/ul><\/div><div class=\"sess\"><div class=\"sesshead\"><b>Session 4<\/b><span class=\"min big\">140 min<\/span><\/div><ul><li><a href=\"#short-09\" data-go=\"short-09\">09: Script, Machine Learning or AI Judgement<\/a> <span class=\"min\">25 min<\/span><\/li><li><a href=\"#short-10\" data-go=\"short-10\">10: What Breaks, and Keeping It Honest<\/a> <span class=\"min\">35 min<\/span><\/li><li><a href=\"#short-11\" data-go=\"short-11\">11: Growing It, Skills and Schedules<\/a> <span class=\"min\">65 min<\/span><\/li><li><a href=\"#short-12\" data-go=\"short-12\">12: The Close, Your 30-Day Plan<\/a> <span class=\"min\">15 min<\/span><\/li><\/ul><\/div><div class=\"sess opt\"><div class=\"sesshead\"><b>Optional server sitting (outside the 10 hours)<\/b><span class=\"min big\">100 min<\/span><\/div><ul><li><a href=\"#short-08b\" data-go=\"short-08b\">08B: The Server and Your Bot<\/a> <span class=\"min\">100 min<\/span><\/li><\/ul><\/div>\n<p class=\"total\"><b>Total:<\/b> 590 of 600 minutes. That leaves 10 minutes spare.<\/p>\n<\/section>\n<section class=\"card\"><h2>How to Use This Page<\/h2>\n<ol>\n<li><b>One module per tab.<\/b> Tap a number at the top. Each tab is one module, so you only read one thing at a time.<\/li>\n<li><b>Every section has a number,<\/b> like <span class=\"num\">3.4<\/span>. It means module 3, section 4
