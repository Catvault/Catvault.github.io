odel made in China. It works under an agreement about where data is kept. So the company's country, the model maker's country and the place the data sits are three different answers.<\/li>\n<li><strong>Students will want a verdict on Chinese against US companies.<\/strong> Do not give one. Give the facts in the company list. Let each student place each kind of data. The answer differs by kind of data.<\/li>\n<li><strong>Keep the CLOUD Act factual.<\/strong> Say what the law allows and when it was passed. Do not guess how often it is used.<\/li>\n<li><strong>Annie's own stories carry this module.<\/strong> Read them as written. They show a careful owner who still found gaps. That is more convincing than a list of rules.<\/li>\n<li><strong>Developers will ask about encryption and key management.<\/strong> Point them to the server module (Module 08B) (one source for each secret). Point them to the module on what breaks (Module 10) for replacing keys.<\/li>\n<li><strong>The company list can turn into a long debate.<\/strong> Keep it to 10 minutes.<\/li>\n<li><strong>Do not show real screenshots.<\/strong> Any example on a slide uses invented names. Never show codes, account numbers or web addresses that contain keys.<\/li>\n<\/ul>\n<p><strong>Where v1's other stories went.<\/strong> v1's Block 2 carried eleven stories. In the merge they moved like this:<\/p>\n<ul>\n<li><strong>To the server module (Module 08B):<\/strong> Logs 05 and 06 (the firewall order).<\/li>\n<li><strong>To the module on what breaks (Module 10):<\/strong>\n<ul>\n<li>Logs 21, 53 and 95.<\/li>\n<li>Log 82's deletion of 411 files.<\/li>\n<li>Log 14's second lesson (a catch-all error handler hid a bug).<\/li>\n<li>Log 61's &quot;one account failing or all accounts failing&quot; check.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Placed in Module 08B, homework section (10 Oct 2026):<\/strong> Log 49 (a password box does not protect a public page).<\/li>\n<li><strong>In Module 01 and the server module (Module 08B):<\/strong> Logs 63, 68 and 69.<\/li>\n<li><strong>In Module 01:<\/strong> Log 75.<\/li>\n<li><strong>In this module:<\/strong> Log 61's line about disconnecting is now part of the habit &quot;Revoke at the source&quot;.<\/li>\n<\/ul>\n<p><strong>Changed 10 Oct 2026 (plain-words rewrite):<\/strong><\/p>\n<ul>\n<li>opencode Go is labelled as the AI provider, and DeepSeek V4.1 Flash as the AI model. This matches Module 03's harness, provider and model labels.<\/li>\n<li>The company table and the client-data table became short lists, because their cells were dense. The table of six deployment levels became a numbered list. Every fact in them is kept.<\/li>\n<li>Nothing else changed in substance.<\/li>\n<\/ul>\n<p><strong>Added 10 Oct 2026 (Annie's request):<\/strong> under &quot;Renting a server is choosing a country&quot;, a new line and a four-point list showing which country reaches which slice of Annie's own data. Hetzner's company location was checked on Hetzner's pages on 10 Oct 2026. A line about Annie's own disk encryption was taken out the same day at her request, because it described her security setup in student material.<\/p>\n<\/section>\n<details class=\"card ref\" id=\"full-02-s15\"><summary><span class=\"num\">02.15<\/span> Sources <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>Build Log 00 (founding record): the one-line rule, the pasting rule, the server in Singapore.<\/li>\n<li>Build Log 14: Google permissions do not shrink.<\/li>\n<li>Build Log 16: revoke before you delete.<\/li>\n<li>Build Log 18: read-only by design.<\/li>\n<li>Build Log 20: no drafts-only permission.<\/li>\n<li>Build Log 28: ownership compared with sovereignty.<\/li>\n<li>Build Log 54: a narrow calendar script for a sealed bot.<\/li>\n<li>Build Log 61: disconnecting in a chat tool does not revoke.<\/li>\n<li>Build Log 82: photos reach the gallery before the bot.<\/li>\n<li>Build Logs 92 and 94: two bots moved to one model, and the outage that followed.<\/li>\n<li>Build Log 103: moving a key is not replacing it; never print a key.<\/li>\n<li>&quot;The Rented Brain&quot; write-up (Seminar Ideas, July 2026): the six deployment levels, the four ways a rented model can change, keeping files portable.<\/li>\n<li>Simon Willison, 16 Jun 2025: the &quot;lethal trifecta&quot; for AI agents.<\/li>\n<li>US CLOUD Act, 2018, 18 U.S.C. section 2713.<\/li>\n<li>DeepSeek privacy policy, read 9 Oct 2026: data stored in the People's Republic of China; training, with a right to opt out.<\/li>\n<li>opencode Go and Zen documentation and privacy policy, read 9 Oct 2026: company in San Francisco; per-model training and retention; DeepSeek agreement valid to 31 Oct 2026; Zen models run in the US and EU.<\/li>\n<li>Telegram privacy policy, read 9 Oct 2026: company locations, cloud chats, secret chats, what bots receive.<\/li>\n<li>Anthropic, &quot;Updates to Consumer Terms and Privacy Policy&quot;, Aug 2025: 5 years with training, 30 days without.<\/li>\n<li>OpenAI ChatGPT release notes and Ars Technica, Aug 2025: GPT-4o removed, then restored for paid users.<\/li>\n<li>PCPD, &quot;Protecting Personal Data Privacy in the Use of Agentic AI&quot;, 25 Aug 2026; Dentons Hong Kong, 1 Sep 2026; Bird &amp; Bird, 27 Aug 2026.<\/li>\n<li>Baker McKenzie Cloud Compliance Center and Tanner De Witt, seen 9 Oct 2026: Section 33 not in force.<\/li>\n<li>v1 Block 2, provider-page checks of 29 Sep 2026: zero data retention at OpenAI, Anthropic and Google; OpenRouter's metadata.<\/li>\n<li>Hetzner, &quot;Data Protection at Hetzner&quot; and the Singapore location press release (6 Aug 2024), read 10 Oct 2026: Hetzner Online GmbH is in Germany; Singapore uses rented space in another company's data centre; encryption is the customer's job.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"full-02-s16\"><summary><span class=\"num\">02.16<\/span> Related <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>01 — What Works From Hong Kong (Merged)<\/li>\n<li>01 — Merge Tracker (Decisions, Hours, Checks)<\/li>\n<li>00 — Side-by-Side (9 Oct 2026) (Pair 2)<\/li>\n<\/ul>\n<\/details>", "count": 16}, {"id": "full-03", "label": "03", "title": "Module 03: Architecture and Where Your System Lives", "minutes": 100, "read": 36, "toc": [["full-03-s1", "03.1", "What You Will Leave With"], ["full-03-s2", "03.2", "Before This Module"], ["full-03-s3", "03.3", "Where Is the One Real Copy?"], ["full-03-s4", "03.4", "Five Questions About How You Work"], ["full-03-s5", "03.5", "The Parts of the System"], ["full-03-s6", "03.6", "The Vault, and One Job Each for Calendar, Vault and Inbox"], ["full-03-s7", "03.7", "Two Kinds of Instruction File, and One Bot or Several"], ["full-03-s8", "03.8", "Build Your Vault"], ["full-03-s9", "03.9", "Three Questions and the Decision Tree"], ["full-03-s10", "03.10", "Three Machines Compared: Laptop, Mac Mini or Rented Server"], ["full-03-s11", "03.11", "Telegram as the Front Door"], ["full-03-s12", "03.12", "Order Your Server"], ["full-03-s13", "03.13", "Your Shape Decision, and What Your System Does at 11pm on a Bad Day"], ["full-03-s14", "03.14", "From the Record"], ["full-03-s15", "03.15", "Exercise"], ["full-03-s16", "03.16", "Worksheet: System Sketch and Shape Decision"], ["full-03-s17", "03.17", "Teaching Notes"]], "body": "<div class=\"intro\"><p>The module has two halves:<\/p>\n<ol>\n<li><strong>&quot;A System That Fits How You Think&quot;.<\/strong> This half fits the system to the person and builds the notes vault.<\/li>\n<li><strong>&quot;Where Your System Lives&quot;.<\/strong> This half decides which machine the system runs on.<\/li>\n<\/ol>\n<p>You can teach the second half in the next session. In the Full course, teach it at least a day before the server module (Module 08B). The reason: the server company's identity check can take time.<\/p>\n<p>Prices are marked <strong>[COST]<\/strong>. They go in last.<\/p>\n<\/div>\n<section class=\"card\" id=\"full-03-s1\"><h2><span class=\"num\">03.1<\/span> What You Will Leave With<\/h2><ul>\n<li><strong>Your worksheet answers.<\/strong> Six lines about how you find, capture, plan and share.<\/li>\n<li><strong>A working vault.<\/strong> This is an Obsidian folder on your laptop and your phone. It holds your folders, an inbox, a map note (one line per folder saying what lives there), your Access Sheet and your Data Map.<\/li>\n<li><strong>Your Shape Decision.<\/strong> It says which machine runs your system. Telegram is ready on your phone. In the Full course, it also records the server you ordered.<\/li>\n<li><strong>Homework:<\/strong> a one-page System Sketch: your system drawn as boxes and arrows.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-03-s2\"><h2><span class=\"num\">03.2<\/span> Before This Module<\/h2><ul>\n<li><strong>Modules 01 and 02 finished.<\/strong> Bring the Access Sheet and the Data Map.<\/li>\n<li><strong>Admin rights on your laptop.<\/strong> You will install one app.<\/li>\n<li><strong>Your phone, with Telegram installed.<\/strong><\/li>\n<li><strong>Full course only: a payment card and an ID document,<\/strong> for the server company. Its identity check can take time. That is why you order in this module.<\/li>\n<\/ul>\n<\/section>\n<div class=\"partbar\">A System That Fits How You Think<\/div>\n<section class=\"card\" id=\"full-03-s3\"><h2><span class=\"num\">03.3<\/span> Where Is the One Real Copy?<\/h2><p>Count the places your notes and instructions live today. Most people find four to six. For example:<\/p>\n<ul>\n<li>a notes app<\/li>\n<li>email drafts<\/li>\n<li>a to-do app<\/li>\n<li>documents in Downloads<\/li>\n<li>a chat with an AI that remembers some things<\/li>\n<li>a paper notebook<\/li>\n<\/ul>\n<p>Annie's own system had this problem twice:<\/p>\n<ol>\n<li><strong>June 2026.<\/strong> Her notes about the bot lived in three places: a folder on her Mac, Obsidian, and the bot's server (Build Log 03).<\/li>\n<li><strong>August 2026.<\/strong> Her builder had four separate memories: two accounts on the Mac, one on the server, and an old project folder. They had drifted apart. The version on her phone felt like a stranger, because it read a different copy of her (Build Log 47).<\/li>\n<\/ol>\n<p><strong>Two copies of one file slowly become different from each other. Then you cannot trust either one.<\/strong> That is the reason for this module. The fix is one real copy that every device and every tool reads.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-03-s4\"><h2><span class=\"num\">03.4<\/span> Five Questions About How You Work<\/h2><p><strong>There is no correct design. There is only the one that fits the person using it.<\/strong><\/p>\n<ul>\n<li>Most AI advice hands everyone the same tools and the same folders.<\/li>\n<li>When it does not stick, people blame their own discipline.<\/li>\n<li>The real cause is usually that the system was built for someone else's habits.<\/li>\n<li>A system that is awkward to use gets abandoned within a few weeks.<\/li>\n<\/ul>\n<p>These five questions change the design.<\/p>\n<p><strong>1. How do you find things again?<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>If you remember...<\/th>\n<th>Then your system should...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><em>Where<\/em> you saw something<\/td>\n<td>Be organised by place: folders, projects, people<\/td>\n<\/tr>\n<tr>\n<td><em>When<\/em> you saw it<\/td>\n<td>Be organised by time: dated notes and logs<\/td>\n<\/tr>\n<tr>\n<td><em>What it was about<\/em><\/td>\n<td>Be searchable, with notes that link to each other<\/td>\n<\/tr>\n<tr>\n<td>Nothing reliably<\/td>\n<td>Capture things for you automatically, with no filing decision<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The last row matters most for people with busy heads. If saving a thought costs a filing decision, the thought gets lost.<\/p>\n<p><strong>2. How do you capture?<\/strong><\/p>\n<ul>\n<li>Typing, voice, photos, or forwarding things on.<\/li>\n<li>Whatever you actually use is the front door.<\/li>\n<li>A system with a front door you avoid will not be used.<\/li>\n<\/ul>\n<p><strong>3. When are you at your best?<\/strong><\/p>\n<ul>\n<li>Some people plan in the morning and act at night. Others do the reverse.<\/li>\n<li>Your automations should arrive before the moment they are useful.<\/li>\n<li>A 7am summary helps someone who plans early. For someone who plans late, it is a message they will mute.<\/li>\n<\/ul>\n<p><strong>4. What do you dread doing?<\/strong><\/p>\n<ul>\n<li>For example: chasing invoices, filing receipts, copying between systems, writing the same email.<\/li>\n<li>The best first automation is the one you dread, not the cleverest one.<\/li>\n<li>The dread is what keeps you maintaining it.<\/li>\n<\/ul>\n<p><strong>5. Who else has to work with you?<\/strong><\/p>\n<ul>\n<li>If nobody else touches your system, build it for one person.<\/li>\n<li>Once a spouse, an assistant or a colleague needs access, you must be able to separate your private notes from shared ones.<\/li>\n<li>Annie has bots sealed to one person and one purpose, such as a tutor for her son. Those bots must not see the rest of her life (Build Log 54).<\/li>\n<\/ul>\n<h3>Worksheet: How I Work<\/h3>\n<p>Answer in one line each. Do not overthink.<\/p>\n<ol>\n<li>When you need something you saved six months ago, what do you search for: the <strong>place<\/strong>, the <strong>date<\/strong>, or the <strong>topic<\/strong>?<\/li>\n<li>How do you capture a thought at 2am: type it, say it, or lose it?<\/li>\n<li>Which single task do you dread most, and when does it come up?<\/li>\n<li>When do you plan, and when do you act?<\/li>\n<li>Who else will ever need to see your notes, and who must never?<\/li>\n<li>What have you tried before and abandoned, and why? This is the most useful answer on the page.<\/li>\n<\/ol>\n<h3>Annie's Answers, as a Worked Example<\/h3>\n<p>This is not a template to copy. It shows one person's habits turned into design choices.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>How Annie works<\/th>\n<th>What she built<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Thinks in linked ideas, not folders<\/td>\n<td>One vault where notes link to each other<\/td>\n<\/tr>\n<tr>\n<td>Loses anything that needs a filing decision<\/td>\n<td>One inbox, sorted every night by a scheduled job<\/td>\n<\/tr>\n<tr>\n<td>Works across two accounts and several devices<\/td>\n<td>A continuity note, so the next session picks up where the last one stopped<\/td>\n<\/tr>\n<tr>\n<td>Uses her laptop, her phone and different times of day<\/td>\n<td>Several ways in, all reading one set of notes<\/td>\n<\/tr>\n<tr>\n<td>Dreads admin above everything else<\/td>\n<td>Admin handed over first: briefs, filing, reminders, chasing<\/td>\n<\/tr>\n<tr>\n<td>Family time is fixed<\/td>\n<td>Bots sealed to family jobs, and a system that protects that time<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Six Ways a Personal System Fails<\/h3>\n<ol>\n<li><strong>Copying someone else's system whole.<\/strong> It was built for how they think.<\/li>\n<li><strong>Building the clever thing before the needed thing.<\/strong> The clever thing gets abandoned. The needed thing gets maintained.<\/li>\n<li><strong>Keeping two places to look.<\/strong> One of them is always out of date.<\/li>\n<li><strong>Designing for a tidier version of yourself.<\/strong> Build for the person who actually shows up.<\/li>\n<li><strong>Making capture cost a decision.<\/strong> If saving something needs a choice, it does not get saved.<\/li>\n<li><strong>Building for the demo instead of a normal day.<\/strong> Ask whether it still helps on an ordinary, tired weekday.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"full-03-s5\"><h2><span class=\"num\">03.5<\/span> The Parts of the System<\/h2><p><strong>Each part has one job.<\/strong> When one part tries to do another part's job, things go wrong in ways that are hard to see.<\/p>\n<p>Annie's summary from September 2026 (Build Logs 78 to 92):<\/p>\n<ul>\n<li>The bots act.<\/li>\n<li>The watchdog only reports.<\/li>\n<li>A separate script restarts stuck bots.<\/li>\n<li>Claude Code builds.<\/li>\n<\/ul>\n<p><strong>The builder and the bot are different.<\/strong> People mix them up. (Source: Build Log 23.)<\/p>\n<ul>\n<li><strong>The bot<\/strong> is the AI assistant you message from your phone. It has a personality, a small set of skills, and low running costs.<\/li>\n<li><strong>The builder<\/strong> is the tool you use at your desk to build or fix something real. It can read every file and change the system itself.<\/li>\n<li>You build the builder first. Then you use it to build the bot.<\/li>\n<\/ul>\n<h3>Full Course: Six Parts, With a Server<\/h3>\n<pre><code class=\"language-mermaid\">flowchart LR\n  You((You)) -- &quot;messages on your phone&quot; --&gt; Bot\n  You -- &quot;plain-English requests&quot; --&gt; Builder\n  subgraph Server[&quot;Your rented server (always on)&quot;]\n    Bot[&quot;The bot&quot;]\n    Jobs[&quot;Scheduled jobs&quot;]\n    Watchdog[&quot;The watchdog&quot;]\n    VaultCopy[(&quot;Copy of your vault&quot;)]\n  end\n  Builder[&quot;The builder (Claude Code, and pi)&quot;] -- &quot;installs, edits, repairs&quot; --&gt; Server\n  Vault[(&quot;Your vault on laptop and phone&quot;)] &lt;-- &quot;Obsidian Sync&quot; --&gt; VaultCopy\n  Bot -- &quot;asks for an answer&quot; --&gt; Model[&quot;A rented AI model&quot;]\n  Watchdog -- &quot;only when something is wrong&quot; --&gt; You\n<\/code><\/pre>\n<p><strong>The six parts, with Annie's version of each.<\/strong><\/p>\n<p><strong>1. The builder<\/strong><\/p>\n<ul>\n<li>What it does: writes, installs and repairs everything while you describe what you want.<\/li>\n<li>Annie's version: Claude Code on her Mac and her server, with pi as a second builder.<\/li>\n<\/ul>\n<p><strong>2. The bot<\/strong><\/p>\n<ul>\n<li>What it does: it is the AI assistant you message from your phone, all day.<\/li>\n<li>Annie's version: Claudith, a Telegram bot.<\/li>\n<\/ul>\n<p><strong>3. The server<\/strong><\/p>\n<ul>\n<li>What it does: it is a small rented computer that never sleeps.<\/li>\n<li>Annie's version: a server in Singapore with 2 processors and about 3.7 GB of usable memory (3,809 MB, Build Log 95).<\/li>\n<\/ul>\n<p><strong>4. The vault<\/strong><\/p>\n<ul>\n<li>What it does: it is one home for notes, rules and memory.<\/li>\n<li>Annie's version: an Obsidian vault on her laptop, phone and server.<\/li>\n<\/ul>\n<p><strong>5. Scheduled jobs<\/strong><\/p>\n<ul>\n<li>What they do: work that runs at set times without you.<\/li>\n<li>Annie's version: 26 jobs. 23 of them are plain scripts that never call an AI model (checked 2 Oct 2026).<\/li>\n<\/ul>\n<p><strong>6. The watchdog<\/strong><\/p>\n<ul>\n<li>What it does: checks every hour that things worked. It stays silent when they did.<\/li>\n<li>Annie's version: Toby, with 24 checks (9 Oct 2026).<\/li>\n<\/ul>\n<h3>How Your Builder and Your Bot Reach an AI: Harness, Provider, Model<\/h3>\n<p><em>Added 10 Oct 2026 at Annie's request. Both courses.<\/em><\/p>\n<p>The diagrams above show an arrow to &quot;a rented AI model&quot;. That arrow has three parts. You will hear the three words all through this course.<\/p>\n<p><strong>You → harness → AI provider → AI model.<\/strong> Then the answer comes back the same way.<\/p>\n<p><strong>The short version, with pi.<\/strong> <em>(Added 10 Oct 2026. Annie: &quot;it needs to be in there&quot;.)<\/em><\/p>\n<ul>\n<li><strong>pi is the harness.<\/strong> It is the program you type into. It sends your words to the AI. It lets the AI read your files and run commands.<\/li>\n<li><strong>opencode Go is the AI provider.<\/strong> It is the company that runs the AI on its own computers. It charges you $10 a month <strong>[COST]<\/strong>. pi connects to it with your key.<\/li>\n<li><strong>DeepSeek is the AI model.<\/strong> It is the AI that writes the answers. opencode Go offers many models. DeepSeek is the one this course uses. Kimi K3 is another.<\/li>\n<\/ul>\n<p><strong>The order:<\/strong> you → pi (harness) → opencode Go (AI provider) → DeepSeek (AI model). The answer comes back the same way.<\/p>\n<p><strong>The same pattern for Claude:<\/strong> Claude Code is the harness. Anthropic is the AI provider. Opus 5.5 is the AI model.<\/p>\n<p><strong>And Annie's bot:<\/strong> Hermes is the harness. opencode Go is the AI provider. DeepSeek is the AI model.<\/p>\n<ul>\n<li>That is why one opencode Go plan pays for both pi and the bot.<\/li>\n<li>They are two harnesses using the same provider and the same model.<\/li>\n<\/ul>\n<p>The rest of this section explains each part in more detail.<\/p>\n<p><strong>1. The harness.<\/strong> The harness is the program you use.<\/p>\n<ul>\n<li>It takes your words and sends them to the AI.<\/li>\n<li>It lets the AI do things, such as read your files and run commands.<\/li>\n<li>It decides how the AI works: what it can touch, and what it must ask you first.<\/li>\n<li>Examples: pi and Claude Code are harnesses for building. Hermes is the harness Annie's bots run on.<\/li>\n<\/ul>\n<p><strong>2. The AI provider.<\/strong> The provider is the company that runs the AI on its own computers.<\/p>\n<ul>\n<li>You pay the provider, by subscription or by use.<\/li>\n<li>Your harness connects to the provider with a key or a sign-in. A key is a long password that lets a program use your account.<\/li>\n<li>Examples: opencode Go and Anthropic.<\/li>\n<li>Hong Kong blocks happen here, at the provider (Module 01).<\/li>\n<\/ul>\n<p><strong>3. The AI model.<\/strong> The model is the AI that writes the answers. It is your bot's &quot;brain&quot;.<\/p>\n<ul>\n<li>One provider can offer many models.<\/li>\n<li>Examples: DeepSeek V4.1 Flash and Kimi K3 (both on opencode Go), and Claude Opus 5.5 (on Anthropic).<\/li>\n<\/ul>\n<p><strong>Annie's three setups (checked 10 Oct 2026):<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Harness<\/th>\n<th>Provider<\/th>\n<th>Model<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Her building at the desk<\/td>\n<td>Claude Code<\/td>\n<td>Anthropic, through her Claude subscription<\/td>\n<td>Claude Opus 5.5<\/td>\n<\/tr>\n<tr>\n<td>Her second builder<\/td>\n<td>pi<\/td>\n<td>opencode Go<\/td>\n<td>DeepSeek V4.1 Flash<\/td>\n<\/tr>\n<tr>\n<td>Her three bots<\/td>\n<td>Hermes<\/td>\n<td>opencode Go<\/td>\n<td>DeepSeek V4.1 Flash<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Sources: Annie's pi settings and the bots' settings on her server, both read 10 Oct 2026.<\/p>\n<p><strong>Why the three parts matter:<\/strong><\/p>\n<ul>\n<li><strong>You can change one part and keep the others.<\/strong>\n<ul>\n<li>To give your bot a different &quot;brain&quot;, you change one setting: the model name.<\/li>\n<li>The harness and your files stay the same.<\/li>\n<\/ul>\n<\/li>\n<li><strong>A model name works only with a provider that offers it.<\/strong> Here is what happened (Build Log 94):\n<ol>\n<li>On 27 Sep 2026, Annie moved Claudith to a new provider.<\/li>\n<li>Some settings still named models that only the old provider offered.<\/li>\n<li>Those models stopped working at once. Nothing sent an alert.<\/li>\n<li>A scheduled job that used one of them failed overnight.<\/li>\n<\/ol>\n<\/li>\n<li><strong>The same model can act differently in two harnesses.<\/strong>\n<ul>\n<li>pi (harness) and Annie's bot, which runs on Hermes (harness), both use DeepSeek (AI model).<\/li>\n<li>But they give different answers to the same question.<\/li>\n<li>Module 08B shows this live (&quot;Same model, different program&quot;).<\/li>\n<\/ul>\n<\/li>\n<li><strong>The bill comes from the provider.<\/strong>\n<ul>\n<li>opencode Go (AI provider) costs $10 a month <strong>[COST]<\/strong>.<\/li>\n<li>A Claude subscription from Anthropic (AI provider) pays for Claude Code (harness).<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>One opencode Go plan does two jobs. A Claude plan cannot.<\/strong> <em>(Added 10 Oct 2026 at Annie's request.)<\/em><\/p>\n<ul>\n<li>With opencode Go (AI provider), one $10 a month plan <strong>[COST]<\/strong> pays for two things:\n<ol>\n<li>your PA bot's AI, through Hermes (harness) on the server<\/li>\n<li>pi (harness) in the terminal on your laptop<\/li>\n<\/ol>\n<\/li>\n<li>Both use the same models, such as DeepSeek (AI model), from the same plan.<\/li>\n<li>A Claude subscription from Anthropic (AI provider) cannot do this. Anthropic's own pages say so in two places (both read 10 Oct 2026):\n<ol>\n<li><strong>Claude Code's legal page:<\/strong> a Claude subscription sign-in is &quot;designed to support ordinary use of Claude Code and other native Anthropic applications&quot;. Other programs &quot;should use API key authentication&quot;. Anthropic does not allow other programs to &quot;route requests through Free, Pro, or Max plan credentials&quot;.<\/li>\n<li><strong>Anthropic's Consumer Terms (effective 8 Oct 2025), Section 3:<\/strong> you may not use the service &quot;through automated or non-human means, whether through a bot, script, or otherwise&quot;, except with an Anthropic API key or with Anthropic's explicit permission.<\/li>\n<\/ol>\n<\/li>\n<li><strong>The reason, in plain words:<\/strong>\n<ul>\n<li>A subscription is priced for one person using Anthropic's own apps.<\/li>\n<li>A bot or another program can send far more requests.<\/li>\n<li>So Anthropic wants those to go through an API key. With a key, you pay for each use, on top of any subscription.<\/li>\n<li>Anthropic's pages do not say this reason in these words. It is the reason the two rules point to.<\/li>\n<\/ul>\n<\/li>\n<li>News reports say Anthropic began blocking subscription sign-ins in other programs on 9 Jan 2026 (WinBuzzer and Gigazine, Feb 2026).<\/li>\n<li>Annie saw the block herself. When she signed pi into her Claude account, every request failed with &quot;Model access is disabled&quot; (Build Log 103).<\/li>\n<li>Facilitator: check both Anthropic pages again before teaching, because these rules can change. Anthropic says it may enforce them &quot;without prior notice&quot; (Claude Code legal page).<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-03-s6\"><h2><span class=\"num\">03.6<\/span> The Vault, and One Job Each for Calendar, Vault and Inbox<\/h2><p>A vault is a folder of plain text notes. The notes are written in a simple format called Markdown. Obsidian is a free app that shows the folder as a notebook. You own the files. They are not locked inside any company's app.<\/p>\n<p><strong>Why plain files and not Google Docs?<\/strong> Annie's bot's first memory was a Google Sheet. She replaced it in June 2026 for three reasons (How to Build Your Own Claudith guide, Part 2):<\/p>\n<ol>\n<li><strong>Speed and cost.<\/strong> A bot reads plain files on its own disk instantly and for free. Every read of a Google Doc is a signed-in request.<\/li>\n<li><strong>Shape.<\/strong> Notes work better as linked pages than as rows in a grid.<\/li>\n<li><strong>Ownership.<\/strong> You own the files, with no company in between.<\/li>\n<\/ol>\n<p>Google still does the jobs it does well: the calendar, email, and file backups.<\/p>\n<p><strong>Give each tool one job.<\/strong> Annie settled this in her first month (Build Log 00):<\/p>\n<ul>\n<li><strong>The calendar holds anything with a time.<\/strong> Appointments, deadlines, reminders.<\/li>\n<li><strong>The vault holds anything you want to keep.<\/strong> Notes, plans, rules, records.<\/li>\n<li><strong>An inbox folder holds anything you have not sorted yet.<\/strong> You capture first and file later. In the Full course, a nightly job will do the filing for you.<\/li>\n<\/ul>\n<p><strong>Pick the starting point you actually open every day.<\/strong> (Source: Build Log 00.)<\/p>\n<ul>\n<li>Annie set up a task board first. It stayed empty, because she never opened it.<\/li>\n<li>Her calendar became the main list instead, because she already lived in it.<\/li>\n<li>So choose your daily starting point from habit, not from what looks organised.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-03-s7\"><h2><span class=\"num\">03.7<\/span> Two Kinds of Instruction File, and One Bot or Several<\/h2><p><em>Full course.<\/em><\/p>\n<p>Your system will have two sets of instructions. They are stored differently on purpose.<\/p>\n<p><strong>The builder's files are shared everywhere.<\/strong><\/p>\n<ul>\n<li>The builder reads its instructions only when you start a session.<\/li>\n<li>So it is safe for every device to read one shared copy in the vault.<\/li>\n<li>After Annie set this up, a note written on her Mac appeared on her server about 80 seconds later (Build Log 47).<\/li>\n<\/ul>\n<p><strong>The bot's rulebook is guarded.<\/strong> (Source: Engine Map note; Build Log 47.)<\/p>\n<ul>\n<li>The bot reads its rulebook on every message, all day.<\/li>\n<li>If that file changed halfway through an edit, or a sync stalled, the bot could break in the middle of a conversation.<\/li>\n<li>So Annie keeps the live rulebook on the server, next to the bot.<\/li>\n<li>The vault holds a copy for reading. It refreshes every minute.<\/li>\n<li>To change the bot, she edits a draft and runs a push command. The push backs up the old live file first.<\/li>\n<li>A scheduled check messages her if the live file and the copy ever disagree outside a push.<\/li>\n<\/ul>\n<p><strong>The question to ask about any shared file:<\/strong> what breaks if it changes halfway through?<\/p>\n<ul>\n<li>If the answer is &quot;nothing much&quot;, share it.<\/li>\n<li>If people depend on it, guard it.<\/li>\n<\/ul>\n<p><strong>One bot or several?<\/strong><\/p>\n<p>In June 2026 Annie considered four bots: one for work, one for parenting, one for her marriage, one for friends. Research on 26 June recommended one bot instead. She can ask that one bot to take on different roles (Alter-Ego Bots research note).<\/p>\n<p>Four bots had three problems:<\/p>\n<ol>\n<li>She would have to decide which bot to tell each thought to.<\/li>\n<li>They could not see across her life. So they would miss a work call that clashes with a child's appointment.<\/li>\n<li>They would cost about four times as much.<\/li>\n<\/ol>\n<p>Her system later gained more bots, for a different reason: different people use them.<\/p>\n<p><strong>Split bots by who uses them and what they may see, not by your moods.<\/strong><\/p>\n<\/section>\n<section class=\"card\" id=\"full-03-s8\"><h2><span class=\"num\">03.8<\/span> Build Your Vault<\/h2><p>The facilitator sits beside each student for this.<\/p>\n<p><strong>Step 1. Install Obsidian on your laptop.<\/strong><\/p>\n<ul>\n<li>Go to obsidian.md.<\/li>\n<li>Download the installer for your system, and open it.<\/li>\n<\/ul>\n<p>What success looks like: Obsidian opens and offers to create a vault.<\/p>\n<p><strong>Step 2. Create the vault.<\/strong><\/p>\n<ul>\n<li>Choose &quot;Create new vault&quot;.<\/li>\n<li>Name it with your first name, for example <code>Jane Vault<\/code>.<\/li>\n<li>Put it in your Documents folder.<\/li>\n<li>Do not put it inside iCloud Drive, OneDrive or Google Drive. Those services and Obsidian's own sync can damage each other's files (Build Log 00).<\/li>\n<\/ul>\n<p>What success looks like: an empty vault opens, with your vault name at the top of the left panel.<\/p>\n<p><strong>Step 3. Create your top-level folders.<\/strong><\/p>\n<ul>\n<li>Annie's folders follow how she looks things up.<\/li>\n<li>Anything about her son's school is filed under her son, not under &quot;School&quot; (Build Log 00).<\/li>\n<li>Use the people and areas of your life.<\/li>\n<\/ul>\n<p>A starting set:<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Folder<\/th>\n<th>What goes in it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>00 Inbox<\/code><\/td>\n<td>Anything not yet sorted<\/td>\n<\/tr>\n<tr>\n<td><code>Me Personal<\/code><\/td>\n<td>Your own plans, health notes, learning<\/td>\n<\/tr>\n<tr>\n<td><code>Me Work<\/code><\/td>\n<td>Your work notes. Check your Data Map before anything confidential goes here<\/td>\n<\/tr>\n<tr>\n<td>One folder per family member<\/td>\n<td>Their school, appointments, records<\/td>\n<\/tr>\n<tr>\n<td><code>Household<\/code><\/td>\n<td>The home, bills, repairs, suppliers<\/td>\n<\/tr>\n<tr>\n<td><code>Builder<\/code><\/td>\n<td>Your builder's instructions, memory and continuity note<\/td>\n<\/tr>\n<tr>\n<td><code>AI System<\/code><\/td>\n<td>Your bot's rulebook, your build logs and your system map<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Right-click in the left panel and choose &quot;New folder&quot; for each one.<\/p>\n<p><strong>Step 4. Start flat.<\/strong> Do not create subfolders yet. Add one only when a folder gets crowded (Build Log 00).<\/p>\n<p><strong>Step 5. Create a map note.<\/strong><\/p>\n<ul>\n<li>In the top level of the vault, create a note called <code>Map of This Vault<\/code>.<\/li>\n<li>Write one line per folder saying what lives there.<\/li>\n<li>When a vault feels messy, the usual cause is an out-of-date map, not real chaos (Build Log 86).<\/li>\n<\/ul>\n<p><strong>Step 6. Move in your two worksheets.<\/strong><\/p>\n<ul>\n<li>Create notes called <code>Access Sheet<\/code> and <code>Data Map<\/code> inside <code>AI System<\/code>.<\/li>\n<li>Paste your Module 01 and 02 work into them.<\/li>\n<\/ul>\n<p><strong>Step 7. Install Obsidian on your phone.<\/strong><\/p>\n<ul>\n<li>Create the same vault name on the phone, stored on the phone itself.<\/li>\n<li>Do not connect the two yet.<\/li>\n<li>In the Full course, the server module (Module 08B) connects them.<\/li>\n<li>In the Short course, Obsidian's own sync service connects them, if you want your notes on your phone. It is optional. <strong>[COST]<\/strong><\/li>\n<\/ul>\n<p><strong>If it fails:<\/strong><\/p>\n<ul>\n<li>If Obsidian will not install on a company laptop, use your phone today. Install on a personal laptop before the next session.<\/li>\n<li>If you already use Obsidian, create a new vault for this course anyway. You can merge later.<\/li>\n<\/ul>\n<h3>Five Rules That Keep a Vault Safe<\/h3>\n<p>These come from things that broke in Annie's vault. Each one failed without any error message.<\/p>\n<ol>\n<li><strong>Never put a password or key in the vault.<\/strong> It copies to every device and to backups. Use a password manager (Build Log 00).<\/li>\n<li><strong>Never use these characters in a file name:<\/strong> <code>: / \\ * ? &quot; &lt; &gt; |<\/code>. A colon in a file name stopped a page from ever reaching Annie's Mac, with no warning (Build Logs 96 and 97).<\/li>\n<li><strong>Choose folder names now, and keep them.<\/strong>\n<ul>\n<li>Scripts will soon refer to these names.<\/li>\n<li>Plain names are easiest to type in a terminal.<\/li>\n<li>If you want emoji in names, add them today, not later.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Moving a file breaks every place that wrote down its address.<\/strong> Before moving or renaming, search for the old name everywhere (Build Logs 58 and 101).<\/li>\n<li><strong>Keep anything a bot must read as a Markdown note.<\/strong> A page saved as <code>.html<\/code> never reached Annie's server, so her bot could not read it (Build Log 58).<\/li>\n<\/ol>\n<\/section>\n<div class=\"partbar\">Where Your System Lives<\/div>\n<section class=\"card\" id=\"full-03-s9\"><h2><span class=\"num\">03.9<\/span> Three Questions and the Decision Tree<\/h2><p>Your system has to run on some machine. Choosing it is a decision about your life, not about technology. Answer each question yes or no.<\/p>\n<p><strong>1. Does anything need to run while you are asleep?<\/strong><\/p>\n<ul>\n<li>Morning summaries, the nightly inbox sort, backups and checks all run when you are not there.<\/li>\n<li>If yes, the machine must stay on when you are off.<\/li>\n<li>A laptop that sleeps will not do it.<\/li>\n<\/ul>\n<p><strong>2. Do you need it away from your desk?<\/strong><\/p>\n<ul>\n<li>If you only use it at your desk, the laptop is fine.<\/li>\n<li>If you want it on your phone while out, you need a bot.<\/li>\n<li>The bot is only as available as the machine it runs on.<\/li>\n<\/ul>\n<p><strong>3. What will you actually maintain?<\/strong><\/p>\n<ul>\n<li>Everything you run must be updated, backed up, and noticed when it breaks.<\/li>\n<li>The failure is rarely dramatic.<\/li>\n<li>On Annie's server, a login was blanked on 4 September 2026. Nobody noticed until 8 September (Build Log 75).<\/li>\n<\/ul>\n<p><strong>A one-person system should be as small as it can be while still doing the job.<\/strong><\/p>\n<pre><code class=\"language-text\">Do you need anything to run while you sleep?\n├── No  → Do you need it away from your desk?\n│          ├── No  → LAPTOP ONLY. Do not spend money.\n│          └── Yes → LAPTOP PLUS A TELEGRAM BOT.\n│                    The bot answers only while the laptop is awake.\n└── Yes → You need a machine that stays on.\n           ├── A machine at home in Hong Kong, such as a Mac mini:\n           │     it cannot reach Claude without a VPN.\n           │     Fine for companies that serve Hong Kong.\n           └── A RENTED SERVER IN SINGAPORE:\n                 reaches every company this course uses,\n                 and you can reach it from anywhere.\n<\/code><\/pre>\n<p><strong>Annie's own choice, honestly.<\/strong> She rented a server because four reasons combined:<\/p>\n<ol>\n<li>It stays on.<\/li>\n<li>She can reach it from anywhere.<\/li>\n<li>It doubles as her route around the Hong Kong block (Module 01).<\/li>\n<li>It gives her bots one fixed address.<\/li>\n<\/ol>\n<p>For someone at a desk with nothing to run overnight, a laptop is often the whole answer.<\/p>\n<p><strong>A rented server does not make the AI smarter.<\/strong> (Source: HK AI Hosting Landscape note.)<\/p>\n<ul>\n<li>The AI's thinking happens on the AI company's computers, not on the machine you type into.<\/li>\n<li>A small server and a powerful laptop give the same answers.<\/li>\n<li>Only running a model on your own hardware needs a big machine. This course does not do that.<\/li>\n<\/ul>\n<p><strong>Annie's ruling on 26 August 2026<\/strong> (Why Have My Own VPS note):<\/p>\n<ul>\n<li>For anything you do at the keyboard, a laptop is fine.<\/li>\n<li>The laptop's real limit is being present, not being powerful.<\/li>\n<li>A job you must remember to start does not count as built.<\/li>\n<li>A weekly job on a laptop that is asleep counts as a fail, not a partial pass.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-03-s10\"><h2><span class=\"num\">03.10<\/span> Three Machines Compared: Laptop, Mac Mini or Rented Server<\/h2><p><em>Full course.<\/em><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>What you need<\/th>\n<th>Your laptop<\/th>\n<th>A Mac mini at home<\/th>\n<th>A rented server in Singapore<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Runs while you sleep or travel<\/td>\n<td>No. It sleeps and travels with you<\/td>\n<td>Yes, if power and home internet stay up<\/td>\n<td>Yes. Data centres have backup power<\/td>\n<\/tr>\n<tr>\n<td>Your laptop stays free for normal work<\/td>\n<td>No<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>Reach it from your phone anywhere<\/td>\n<td>Only while the laptop is awake and online<\/td>\n<td>Yes, with a private network<\/td>\n<td>Yes, with a private network<\/td>\n<\/tr>\n<tr>\n<td>Reaches AI companies that block Hong Kong<\/td>\n<td>No, not without a VPN<\/td>\n<td>No. It is still in Hong Kong<\/td>\n<td>Yes. Singapore is served<\/td>\n<\/tr>\n<tr>\n<td>Acts as your own route out of Hong Kong<\/td>\n<td>No<\/td>\n<td>No<\/td>\n<td>Yes (the server module (Module 08B))<\/td>\n<\/tr>\n<tr>\n<td>Up-front cost<\/td>\n<td>None<\/td>\n<td><strong>[COST]<\/strong><\/td>\n<td>None<\/td>\n<\/tr>\n<tr>\n<td>Monthly cost<\/td>\n<td>None<\/td>\n<td>Electricity<\/td>\n<td><strong>[COST]<\/strong><\/td>\n<\/tr>\n<tr>\n<td>You must keep it secure and updated<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>For students in Hong Kong, location is the deciding row.<\/strong> (Source: Build Log 63.)<\/p>\n<ul>\n<li>A Mac mini at home is a strong machine.<\/li>\n<li>But it sits on a Hong Kong connection. So it cannot reach Claude without a VPN.<\/li>\n<li>A server in Singapore reaches every company directly.<\/li>\n<li>In the server module (Module 08B), it also becomes your own route out of Hong Kong.<\/li>\n<\/ul>\n<p><strong>Annie's advice is a rented server first.<\/strong> In her guide she calls it &quot;the version of this that never becomes a second hobby&quot; (How to Build Your Own Claudith guide, Part 2). A Mac mini can come later as an addition.<\/p>\n<p><strong>Keep in mind that one server can end up holding everything.<\/strong><\/p>\n<ul>\n<li>Annie's server holds the bot, a copy of the vault, the backups and the builder.<\/li>\n<li>If it fails, all of them stop together.<\/li>\n<li>The module on what breaks (Module 10) covers the backups that make this safe.<\/li>\n<\/ul>\n<p><strong>The Hong Kong factors<\/strong> (Annie's landscape note, 27 Aug 2026):<\/p>\n<ul>\n<li><strong>Distance matters when you type.<\/strong> A server in Germany or the US adds about 150 to 250 milliseconds to every keystroke. Singapore adds about 35.<\/li>\n<li><strong>Heat and humidity.<\/strong> A machine running all day in a warm flat slows itself down to stay cool. Its parts also wear faster.<\/li>\n<li><strong>Typhoons and power cuts.<\/strong> A home machine stops when the power stops. A data centre has backup power.<\/li>\n<li><strong>Home internet often blocks servers.<\/strong>\n<ul>\n<li>Hong Kong home broadband commonly blocks the ports used to host anything.<\/li>\n<li>The private network in the server module (Module 08B) works around this, without opening your home router.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Paying from Hong Kong.<\/strong>\n<ul>\n<li>Some companies check where your card was issued.<\/li>\n<li>Facilitator: confirm before the session whether this affects the chosen server company.<\/li>\n<li>With Hetzner as the default, this means one check: does Hetzner accept a Hong Kong card and ID? (Added 10 Oct 2026.)<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-03-s11\"><h2><span class=\"num\">03.11<\/span> Telegram as the Front Door<\/h2><p>You will talk to your bot through Telegram, for three reasons:<\/p>\n<ol>\n<li><strong>Telegram's bot service is free and official.<\/strong>\n<ul>\n<li>You create a bot through Telegram's own @BotFather account, and receive a token.<\/li>\n<li>There is no fee and no grey area.<\/li>\n<\/ul>\n<\/li>\n<li><strong>It works in Hong Kong with no extra steps.<\/strong><\/li>\n<li><strong>Photos arrive ready to use.<\/strong>\n<ul>\n<li>Telegram rotates and resizes photos before the bot receives them.<\/li>\n<li>Send pictures as normal photos, never as files.<\/li>\n<li>That one habit made Annie's storage catalogue work with no extra software (Build Log 48).<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<p><strong>The chat app does not decide what the bot can do.<\/strong> (Source: Seminar Ideas, 15 Jul 2026.)<\/p>\n<ul>\n<li>Annie once asked whether WhatsApp or Telegram is the more powerful choice.<\/li>\n<li>Her builder checked: both connect to the same model, tools and memory.<\/li>\n<li>The program behind the chat app decides what the bot can do.<\/li>\n<\/ul>\n<p><strong>Why not WhatsApp?<\/strong> (Source: Claudith rulebook, rule 8.)<\/p>\n<ul>\n<li>Annie built a WhatsApp connection in July 2026. She removed it on 23 July.<\/li>\n<li>It used an unofficial program tied to her personal phone number.<\/li>\n<li>That breaks WhatsApp's terms, and it risked a ban on her number.<\/li>\n<li>Her bot now drafts a message, and she pastes it herself.<\/li>\n<\/ul>\n<p><strong>Know what Telegram can see.<\/strong><\/p>\n<ul>\n<li>Chats with a bot are not end-to-end encrypted.<\/li>\n<li>Whoever runs the bot receives every message (Module 02).<\/li>\n<li>Your Data Map decides what you send.<\/li>\n<\/ul>\n<p><strong>Check now:<\/strong> Telegram is installed, and two-factor sign-in is on (Settings, Privacy and Security, Two-Step Verification).<\/p>\n<\/section>\n<section class=\"card\" id=\"full-03-s12\"><h2><span class=\"num\">03.12<\/span> Order Your Server<\/h2><p><em>Full course. The facilitator sits beside each student.<\/em><\/p>\n<p><strong>Pick at least 2 processors and 4 GB of memory, in Singapore, running Ubuntu.<\/strong> <strong>[COST]<\/strong><\/p>\n<ul>\n<li>Memory is the limit on a small server, not processing power.<\/li>\n<li>Annie's server has 2 processors and about 3.7 GB of usable memory.<\/li>\n<li>It runs three bots, 26 scheduled jobs and her builder sessions (live check, 2 Oct 2026; Build Log 95).<\/li>\n<\/ul>\n<p><strong>The course default is Hetzner, in Singapore.<\/strong> <em>(Added 10 Oct 2026, Annie's ruling.)<\/em><\/p>\n<ul>\n<li>Annie's own server is a Hetzner CPX22 in Singapore, running Ubuntu 26.04 (Build Log 00).<\/li>\n<li>So every step in this course has been done there.<\/li>\n<li>Use Hetzner unless you have a reason not to.<\/li>\n<\/ul>\n<p><strong>Step 1. Create an account with the server company.<\/strong> Turn on two-factor sign-in straight away.<\/p>\n<p><strong>Step 2. Choose the location: Singapore.<\/strong><\/p>\n<p><strong>Step 3. Choose the system: Ubuntu, the newest long-term support version<\/strong> (marked &quot;LTS&quot;).<\/p>\n<p><strong>Step 4. Choose the size: at least 2 processors and 4 GB of memory.<\/strong><\/p>\n<p><strong>Step 5. Leave SSH keys blank for now, if the page allows it.<\/strong><\/p>\n<ul>\n<li>An SSH key is the file that will let your laptop sign in to the server without a password.<\/li>\n<li>You will create it in the server module (Module 08B), with your builder.<\/li>\n<li>Facilitator: if the company insists on a key or a password at order time, follow its default. Note it for the server module (Module 08B).<\/li>\n<\/ul>\n<p><strong>Step 6. Turn on the backup option,<\/strong> if the company offers one. <strong>[COST]<\/strong> (Source: Boss Admin Moves note.)<\/p>\n<ul>\n<li>On Annie's server, the whole-server backup was switched on on 4 Aug 2026.<\/li>\n<li>Her notes estimate a full restore at about 10 minutes.<\/li>\n<li>Nobody has timed one yet.<\/li>\n<\/ul>\n<p><strong>Step 7. Name the server something plain,<\/strong> such as <code>my-server<\/code>. Do not use your name or address.<\/p>\n<p>What success looks like:<\/p>\n<ul>\n<li>The company shows a running server and an IP address. The IP address is the server's number on the internet.<\/li>\n<li>Save the IP address in your password manager, not in your vault.<\/li>\n<\/ul>\n<p><strong>If it fails:<\/strong><\/p>\n<ul>\n<li>If the company asks for identity documents, upload them and wait.<\/li>\n<li>Nobody has recorded how long this takes for a Hong Kong sign-up. That is why you order now and not in the server module (Module 08B).<\/li>\n<li>If your card is refused, try another server company.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-03-s13\"><h2><span class=\"num\">03.13<\/span> Your Shape Decision, and What Your System Does at 11pm on a Bad Day<\/h2><p>Fill in the worksheet below. Then answer one last question, in one sentence:<\/p>\n<blockquote>\n<p><strong>What will your system do for you at 11pm on a bad day?<\/strong><\/p>\n<\/blockquote>\n<p>If the answer is &quot;nothing&quot;, the design does not fit you yet, however good it looks.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-03-s14\"><h2><span class=\"num\">03.14<\/span> From the Record<\/h2><p><strong>Three homes down to one.<\/strong> (Source: Build Log 03.)<\/p>\n<ol>\n<li>In June 2026, Annie's notes about her bot lived on her Mac, in Obsidian and on the server.<\/li>\n<li>She never knew which copy was the real one.<\/li>\n<li>She moved the to-do list and a cheat sheet into Obsidian.<\/li>\n<li>She cut her builder's instruction file down to a short pointer.<\/li>\n<li>She deleted the server's duplicate only after checking it matched the vault copy byte for byte.<\/li>\n<\/ol>\n<p>The cost was one afternoon. The lesson: choose one home, move everything in, and check before you delete.<\/p>\n<p><strong>Four memories that drifted apart.<\/strong> (Source: Build Log 47.)<\/p>\n<ol>\n<li>By August 2026, Annie's builder had four separate memories on different machines and accounts.<\/li>\n<li>Each knew different things about her.<\/li>\n<li>She said: &quot;I just need one source of truth for Claudith and you, just as I need one source of truth for EVERYTHING we do.&quot;<\/li>\n<li>The fix merged 29 memory files into one vault folder, and linked every machine to it.<\/li>\n<li>A test from each machine, with no history, proved each one loaded the same instructions.<\/li>\n<\/ol>\n<p>The lesson: one real copy that every device reads is better than several copies kept in step.<\/p>\n<p><strong>The tidy-up that broke a bot for six days.<\/strong> (Source: Build Logs 58 and 80.)<\/p>\n<ol>\n<li>On 11 September 2026, Annie asked for a vault tidy-up. Many folders moved.<\/li>\n<li>A family member's tutor bot had 15 document addresses written into its skill.<\/li>\n<li>All 15 broke.<\/li>\n<li>The bot searched blindly and ran slowly for about six days before anyone noticed.<\/li>\n<\/ol>\n<p>The lesson: a move is finished only when every script and bot that refers to the old address has been updated.<\/p>\n<p><strong>The rename that broke five things.<\/strong> (Source: Build Log 101.)<\/p>\n<ol>\n<li>On 30 September 2026, the top-level vault folders were renamed to add icons.<\/li>\n<li>Nothing reported an error.<\/li>\n<li>Afterwards, Claude's memory link pointed at the old name. So a session started with no memory.<\/li>\n<li>Six links on the server broke. So Claude Code there ran with no global instructions, and four skills stopped working.<\/li>\n<li>The monthly cost script crashed on 1 October. That was the first time it ran after the rename.<\/li>\n<\/ol>\n<p>The lesson: after any rename, search every script for the old name. Then run each affected job once by hand.<\/p>\n<p><strong>The board nobody opened.<\/strong> (Source: Build Log 00.)<\/p>\n<ol>\n<li>In Annie's first month, her bot's rules said to use a task board.<\/li>\n<li>The board stayed empty, because she never opened it.<\/li>\n<li>Her calendar became the real list.<\/li>\n<\/ol>\n<p>The lesson: build around the place you already look every day.<\/p>\n<p><strong>The Mac mini question, answered without buying one.<\/strong> <em>Full course.<\/em> (Source: Build Log 46.)<\/p>\n<ol>\n<li>In August 2026, Annie wanted her own Claude Code on her phone, with her instructions and memory.<\/li>\n<li>The route she used kept her Mac awake and plugged in. That raised the question of buying a Mac mini.<\/li>\n<li>But she already rented a server that never sleeps, and her vault already reached it.<\/li>\n<li>So the builder was installed there in about 10 minutes, on the subscription she already paid for.<\/li>\n<\/ol>\n<p>The lesson: check what you already own before you buy.<\/p>\n<p><strong>The server was billing the wrong account.<\/strong> <em>Full course.<\/em> (Source: Build Log 46.)<\/p>\n<ol>\n<li>When Claude Code was set up on that server, it was already signed in to Annie's work account.<\/li>\n<li>That account was billed per use to her employer. She had not asked for that.<\/li>\n<li>The fix was to sign in with her personal subscription.<\/li>\n<li>Then a lock was set, so neither account can fall back to per-use billing.<\/li>\n<\/ol>\n<p>The lesson: before you use any AI tool on a machine, check whose account it is on and how it bills.<\/p>\n<p><strong>Six forgotten sessions filled the memory.<\/strong> <em>Full course.<\/em> (Source: Build Log 95.)<\/p>\n<ol>\n<li>In September 2026, the server began logging memory warnings every minute.<\/li>\n<li>The bots were not the cause. All three together used under 1 GB.<\/li>\n<li>Six abandoned Claude Code sessions, each 4 to 17 days old, held 1.5 GB between them.<\/li>\n<li>Closing them freed 1.37 GB.<\/li>\n<li>A 2 GB swap file was also added. A swap file is spare memory on the disk.<\/li>\n<\/ol>\n<p>The lesson: on a small server, memory runs out first. When it does, the system stops programs to make room. It may stop the one you depend on.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-03-s15\"><h2><span class=\"num\">03.15<\/span> Exercise<\/h2><ol>\n<li>List every place your notes, tasks and AI instructions live today. For each one, write one word:\n<ul>\n<li><strong>move<\/strong> (into the vault),<\/li>\n<li><strong>keep<\/strong> (it does a different job, such as the calendar), or<\/li>\n<li><strong>close<\/strong> (stop using it).<\/li>\n<\/ul>\n<\/li>\n<li>Which one place will you open first every morning?<\/li>\n<li>In a normal week, how many hours are you away from your laptop? Those are the hours your system cannot run on the laptop.<\/li>\n<li><strong>Homework:<\/strong> sketch your system on one page, with boxes and arrows. Use the parts table below.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"full-03-s16\"><h2><span class=\"num\">03.16<\/span> Worksheet: System Sketch and Shape Decision<\/h2><p><strong>My System Sketch<\/strong> (homework). Leave a part blank if you have not decided yet.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Part<\/th>\n<th>My version<\/th>\n<th>Where it will live<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Builder<\/td>\n<td>Claude Code / pi<\/td>\n<td>Laptop. Full course: also my server<\/td>\n<\/tr>\n<tr>\n<td>Bot<\/td>\n<td><\/td>\n<td>Full course: my server. Short course: none in the 10 hours; my server, if I take the optional sitting<\/td>\n<\/tr>\n<tr>\n<td>Vault<\/td>\n<td><\/td>\n<td>Laptop and phone. Full course: also my server<\/td>\n<\/tr>\n<tr>\n<td>Server<\/td>\n<td><\/td>\n<td>Full course, or the optional server sitting<\/td>\n<\/tr>\n<tr>\n<td>First scheduled job<\/td>\n<td><\/td>\n<td>Decided in Module 05, where you map your processes on paper<\/td>\n<\/tr>\n<tr>\n<td>Watchdog<\/td>\n<td><\/td>\n<td>The module on what breaks (Module 10)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>My daily starting point:<\/strong> ____________<\/p>\n<p><strong>My Shape Decision:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Question<\/th>\n<th>My answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Where my system runs<\/td>\n<td>Laptop / laptop plus server<\/td>\n<\/tr>\n<tr>\n<td>Joining the optional server sitting? (Short course)<\/td>\n<td>Yes / No / Later<\/td>\n<\/tr>\n<tr>\n<td>Server company, location and size (Full course)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Whole-server backup turned on? (Full course)<\/td>\n<td>Yes / No<\/td>\n<\/tr>\n<tr>\n<td>Date ordered, or the date I will order (Full course)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Server IP address saved in my password manager? (Full course)<\/td>\n<td>Yes / No<\/td>\n<\/tr>\n<tr>\n<td>Telegram installed, with two-factor sign-in on?<\/td>\n<td>Yes / No<\/td>\n<\/tr>\n<tr>\n<td>My phone (Android or iPhone)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My laptop (Mac or Windows)<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>\n<section class=\"card\" id=\"full-03-s17\"><h2><span class=\"num\">03.17<\/span> Teaching Notes<\/h2><ul>\n<li><strong>Three students at most in each class.<\/strong> Sit beside each student for the install. In the Full course, also sit beside them for the server order.<\/li>\n<li><strong>The difference between the builder and the bot is the idea most people miss.<\/strong> Repeat it at the start of the build sessions.<\/li>\n<li><strong>Some students already use Notion, OneNote or Apple Notes.<\/strong> Do not argue. Explain the plain-file reason once. Say they can move their notes over after the course. The bot needs plain files.<\/li>\n<li><strong>Windows students:<\/strong> Obsidian works the same way. Keep the vault out of OneDrive, which Windows often switches on for the Documents folder. Use a folder such as <code>C:\\Users\\&lt;you&gt;\\Vaults<\/code> instead.<\/li>\n<li><strong>Folder names cause long debates.<\/strong> Give students five minutes, then move on. Renames are possible, but costly once scripts exist.<\/li>\n<li><strong>Students will ask about the Mac mini.<\/strong> It is a good machine. In Hong Kong the deciding fact is location: it cannot reach Claude or act as your route out of Hong Kong.<\/li>\n<li><strong>Full course: push for ordering today.<\/strong> A student without a server by the server module (Module 08B) can follow it beside another student, and finish at home.<\/li>\n<li><strong>Do not let anyone paste a server password or IP address into a group chat.<\/strong><\/li>\n<li><strong>The diagrams render only in apps that understand Mermaid diagrams.<\/strong> Obsidian does. If you project from another tool, show the tables instead.<\/li>\n<li><strong>Developers may want a different server company or system.<\/strong> That is fine, but the course's commands assume Ubuntu. The course default is Hetzner in Singapore (added 10 Oct 2026). So a student who picks another company follows that company's order page on their own.<\/li>\n<\/ul>\n<p><strong>Where v1's stories went.<\/strong> v1 (the first version of the course) had five stories in its Block 3. In the merge they moved like this:<\/p>\n<ul>\n<li><strong>In this module:<\/strong> Logs 03 and 47, in the Claude version's shorter form.<\/li>\n<li><strong>To Module 06 (Introduce Yourself to the Machine) or Module 07 (Rules of Engagement):<\/strong> Log 26 (the working relationship lives in the files you wrote).<\/li>\n<li><strong>Facilitator reading:<\/strong> Log 07 (reference notes are overwritten, logs are only added to) and Log 62 (map the work before automating it).<\/li>\n<li><strong>Told here:<\/strong> Log 95. So the module on what breaks (Module 10) should refer back to it rather than tell it again.<\/li>\n<\/ul>\n<p><strong>Changed 10 Oct 2026 (plain-words rewrite):<\/strong><\/p>\n<ul>\n<li>&quot;Part A&quot; and &quot;Part B&quot; are now called by their names: &quot;A System That Fits How You Think&quot; and &quot;Where Your System Lives&quot;. Annie rejected labels the reader must remember.<\/li>\n<li>The bare minute sums are now &quot;How the minutes add up&quot;, in words.<\/li>\n<li>The six-parts table became a short list, because its cells were dense. Every fact is kept.<\/li>\n<li>The diagrams, the decision tree and all other tables are unchanged.<\/li>\n<\/ul>\n<\/section>\n<details class=\"card ref\" id=\"full-03-s18\"><summary><span class=\"num\">03.18<\/span> Sources <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>Build Log 00 (founding record): folders by person, start flat, no passwords in the vault, calendar for time, the unused task board.<\/li>\n<li>Build Log 03: three homes down to one.<\/li>\n<li>Build Log 23: the bot and the builder are different.<\/li>\n<li>Build Log 46: the builder moved to the server; the wrong billing account.<\/li>\n<li>Build Log 47: one source of truth; the guarded bot rulebook; a note written on the Mac reached the server about 80 seconds later.<\/li>\n<li>Build Log 48: Telegram photos.<\/li>\n<li>Build Log 54: a bot sealed to one family member.<\/li>\n<li>Build Logs 58, 80 and 101: moves and renames that broke addresses.<\/li>\n<li>Build Log 63: the server as a route out of Hong Kong.<\/li>\n<li>Build Log 75: the login blanked on 4 Sep and found on 8 Sep.<\/li>\n<li>Build Log 86: fixing the map instead of reorganising.<\/li>\n<li>Build Log 95: 3,809 MB of memory; six abandoned sessions.<\/li>\n<li>Build Logs 96 and 97: the colon in a file name.<\/li>\n<li>Build Logs 78 to 92: which part acts, which reports, which restarts bots and which builds.<\/li>\n<li>Alter-Ego Bots research note, 26 Jun 2026.<\/li>\n<li>Engine Map note (Claudith folder), read 9 Oct 2026: the vault's reading copy of the rulebook refreshes every minute, the push command backs up the live file first, and a check messages Annie if the two copies disagree.<\/li>\n<li>How to Build Your Own Claudith guide, Part 2: why plain files; &quot;a rented server first&quot;.<\/li>\n<li>Why Have My Own VPS note, 26 to 27 Aug 2026: a laptop's real limit is being present, not being powerful.<\/li>\n<li>HK AI Hosting Landscape note, 27 Aug 2026: a rented server does not make the AI smarter, the Hong Kong factors, typing delay.<\/li>\n<li>Boss Admin Moves note: whole-server backup enabled 4 Aug 2026; restore estimated at about 10 minutes.<\/li>\n<li>Claudith rulebook, rule 8: WhatsApp removed 23 Jul 2026.<\/li>\n<li>Toby check count: 24 checks, 9 Oct 2026 (Build Log 124).<\/li>\n<li>Live server check, 2 Oct 2026: 26 scheduled jobs, 23 plain scripts.<\/li>\n<li>Build Log 94: a model name works only with a provider that offers it (27 Sep 2026 provider move).<\/li>\n<li>Build Log 103: pi signed into a Claude account failed with &quot;Model access is disabled&quot;.<\/li>\n<li>Annie's pi settings and the bots' server settings, read 10 Oct 2026: harness, provider and model for each setup.<\/li>\n<li>Claude Code documentation, &quot;Legal and compliance&quot;, section &quot;Authentication and credential use&quot; (code.claude.com/docs/en/legal-and-compliance), read 10 Oct 2026.<\/li>\n<li>Anthropic Consumer Terms of Service, effective 8 Oct 2025, Section 3, item 7 (anthropic.com/legal/consumer-terms), read 10 Oct 2026.<\/li>\n<li>WinBuzzer, 19 Feb 2026, &quot;Anthropic Bans Claude Subscription OAuth in Third-Party Apps&quot;; Gigazine, 20 Feb 2026, &quot;Anthropic officially bans third-party subscription authentication&quot;: a Claude subscription sign-in works only in Anthropic's own programs.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"full-03-s19\"><summary><span class=\"num\">03.19<\/span> Related <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>01 — What Works From Hong Kong (Merged)<\/li>\n<li>02 — Privacy, Security and Whose Law Reaches Your Data (Merged)<\/li>\n<li>01 — Merge Tracker (Decisions, Hours, Checks)<\/li>\n<li>00 — Side-by-Side (9 Oct 2026) (Pair 3)<\/li>\n<\/ul>\n<\/details>", "count": 19}, {"id": "full-04", "label": "04", "title": "Module 04: The Demo", "minutes": 45, "read": 18, "toc": [["full-04-s1", "04.1", "What You Will Leave With"], ["full-04-s2", "04.2", "Before This Module"], ["full-04-s3", "04.3", "The Rule for the Whole Module"], ["full-04-s4", "04.4", "What This System Is For"], ["full-04-s5", "04.5", "Demo 1: A Photo Becomes a Record"], ["full-04-s6", "04.6", "Demo 2: The Jobs That Remove the Most Remembering"], ["full-04-s7", "04.7", "Demo 3: When the Bot Was Wrong"], ["full-04-s8", "04.8", "Demo 4: The Message From the Watchdog"], ["full-04-s9", "04.9", "Demo 5: What It Costs"], ["full-04-s10", "04.10", "Exercise: Your Wish List"], ["full-04-s11", "04.11", "How to Close the Module"], ["full-04-s12", "04.12", "What Not to Do"], ["full-04-s13", "04.13", "Teaching Notes"]], "body": "<section class=\"card\" id=\"full-04-s1\"><h2><span class=\"num\">04.1<\/span> What You Will Leave With<\/h2><p><strong>Your Wish List.<\/strong><\/p>\n<ul>\n<li>Three to five jobs you want your system to take over.<\/li>\n<li>Each one is scored by how much remembering it removes.<\/li>\n<li>Circle your top two. They go into the next module, where you map them on paper.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-04-s2\"><h2><span class=\"num\">04.2<\/span> Before This Module<\/h2><ul>\n<li><strong>Modules 01 to 03 finished.<\/strong> Bring your Data Map from Module 02.<\/li>\n<li><strong>A pen and the worksheet.<\/strong> This module is mostly watching, then one short exercise.<\/li>\n<li><strong>For the facilitator:<\/strong> the checklist at the end of this module, done before students arrive.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-04-s3\"><h2><span class=\"num\">04.3<\/span> The Rule for the Whole Module<\/h2><p><strong>Never show a capability without showing what it costs.<\/strong> (From v1.)<\/p>\n<ul>\n<li>Every demo below comes with a failure, a bill or a trade-off.<\/li>\n<li>A demo that shows only wins makes the room feel behind.<\/li>\n<li>It also makes the facilitator hard to trust the first time a student's own build fails.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-04-s4\"><h2><span class=\"num\">04.4<\/span> What This System Is For<\/h2><p>Most AI marketing promises that you will do ten times more. Annie's system is built for a different reason.<\/p>\n<p>Her line, written in August 2026: the real gift is clearing what drains you, so you can be present with the people in front of you, including yourself (Build Log 72).<\/p>\n<p>It works in two directions:<\/p>\n<ul>\n<li><strong>Take things away.<\/strong> Admin, reminders, chasing, filing. Anything you hold in your head today because nothing else will.<\/li>\n<li><strong>Add depth.<\/strong> Research and learning on the things that matter to you.<\/li>\n<\/ul>\n<p>Annie judges every build by one rule: if a job only works when you remember to start it, it is not finished (Annie's ruling, 27 Aug 2026). Every demo below runs without her starting it.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-04-s5\"><h2><span class=\"num\">04.5<\/span> Demo 1: A Photo Becomes a Record<\/h2><p><strong>What it is.<\/strong> A photo catalogue of the family's storage units. A bot built it, and you can read it on a phone (Build Log 48).<\/p>\n<p><strong>What the screenshots show.<\/strong><\/p>\n<ol>\n<li><strong><code>Storage Bot Logging Item (edited)<\/code>.<\/strong>\n<ul>\n<li>Annie sends a photo of a cap, with a short caption naming the unit.<\/li>\n<li>The bot replies &quot;Got it&quot;.<\/li>\n<li>It logs the item to Unsorted, and says it did not catch the unit.<\/li>\n<li>A minute later, it moves the item to the right unit as number 325.<\/li>\n<li>It asks her to reply if that is wrong.<\/li>\n<\/ul>\n<\/li>\n<li><strong><code>Storage Bot Finding Item (edited)<\/code>.<\/strong>\n<ul>\n<li>Annie asks where a playmat is.<\/li>\n<li>The bot answers with the item number.<\/li>\n<li>It says the playmat was lent to a friend, and quotes the note about a missing part.<\/li>\n<li>It also lists two near-matches, in case she meant one of those.<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<p><strong>The line to say.<\/strong> &quot;When it was unsure where the cap went, it said so and put it somewhere safe. It did not guess.&quot;<\/p>\n<p><strong>What else to point out.<\/strong> (Source: Build Log 80.)<\/p>\n<ul>\n<li>The count of items comes from code, not from the AI.<\/li>\n<li>AI models are bad at counting.<\/li>\n<li>So Annie's rule is: code does the arithmetic, and the model only reads the result.<\/li>\n<\/ul>\n<p><strong>The cost of this one.<\/strong> (Source: Build Log 48.)<\/p>\n<ol>\n<li>Annie's first answer from Claude was &quot;don't build it&quot;. Describing photos seemed to need a paid AI service.<\/li>\n<li>She removed that assumption in six words: &quot;I actually don't mind typing descriptions.&quot;<\/li>\n<li>It then turned out the bot already described photos, for about $0.001 each.<\/li>\n<\/ol>\n<p>The lesson: say out loud the one assumption your advice depends on. Then the other person can overturn it.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-04-s6\"><h2><span class=\"num\">04.6<\/span> Demo 2: The Jobs That Remove the Most Remembering<\/h2><p><em>Full course only.<\/em><\/p>\n<p>A mentor gave Annie a way to rank automations: by how much mental load each one removes from you. The most useful build is rarely the most impressive one (Boss Admin Moves note, 26 Jul 2026). Show four jobs. Annie chose them on 10 Oct 2026. The calendar job has four short examples. The morning brief has two. The segment stays at 10 minutes (Annie's ruling), so move quickly.<\/p>\n<p><strong>1. Receipts that need claiming (<code>Health Insurer Claims 1 (edited)<\/code>).<\/strong><\/p>\n<ul>\n<li>At 20:00, one message arrives: two medical invoices came in today, file the insurance claim.<\/li>\n<li>Both files are attached, already renamed to fit the insurer's app.<\/li>\n<li>Annie taps, files the claim on her phone, and replies &quot;done!&quot;.<\/li>\n<li>The insurer requires a person to submit the claim. So that step stays with her.<\/li>\n<\/ul>\n<p><strong>2. Calendar jobs.<\/strong> Four examples, from simple to clever.<\/p>\n<p><strong>a. Her son's calendar, checked against his nap and his rules (<code>Kids Gym (edited)<\/code>).<\/strong><\/p>\n<ul>\n<li>Annie lists the times of a new gym class. She asks which one works, checked against his nap and his calendar.<\/li>\n<li>The bot answers with one working option: Friday at 9:30.<\/li>\n<li>It lists every other slot, with the reason each one is blocked.<\/li>\n<li>It asks before adding the class to his calendar.<\/li>\n<\/ul>\n<p><strong>b. A screenshot becomes calendar entries (<code>Class Provider Class Dates Times (edited)<\/code> and <code>2 (edited)<\/code>).<\/strong><\/p>\n<ul>\n<li>Annie sends a screenshot of her son's gym schedule.<\/li>\n<li>She asks the bot to make sure every class is on his calendar.<\/li>\n<li>The bot reports two classes already there and two missing. It asks before adding them.<\/li>\n<li>She says yes.<\/li>\n<li>It adds both, and confirms all four are now on the calendar.<\/li>\n<\/ul>\n<p><strong>c. A friend's messages become an event (<code>Beach Day Calendar Add (edited)<\/code>).<\/strong> (Source: Boss Admin Moves note, 6 Oct 2026.)<\/p>\n<ul>\n<li>Annie pastes a friend's chat messages about a beach day, and adds &quot;pls put in annie cal&quot;.<\/li>\n<li>The bot checks all three calendars: personal, work and her son's.<\/li>\n<li>It proposes one event and asks for a yes.<\/li>\n<li>It leaves the second date off on purpose, because the friend said &quot;if things go well&quot;.<\/li>\n<li>It asks whether her son is coming.<\/li>\n<li>Annie changes the title and adds the second date as tentative. The bot reads both events back once they are in.<\/li>\n<\/ul>\n<p><strong>d. The anniversary catch (<code>Anniversary Clash 1 of 2 - Caught and Deleted (edited)<\/code> and <code>2 of 2 - Rule Learned (edited)<\/code>).<\/strong> (Source: Boss Admin Moves note, 9 Oct 2026.)<\/p>\n<ol>\n<li>A friend proposes a playdate for one afternoon at 4pm. Annie asks the bot to add it.<\/li>\n<li>The bot checks her son's calendar. His nap and his gym class are both clear. It adds the playdate.<\/li>\n<li>Then it flags something nobody asked about: that evening is Annie's wedding anniversary.<\/li>\n<li>Annie deletes the playdate on the spot. So the evening has to stay free.<\/li>\n<li>The bot writes the rule into its scheduling skill. A day that already has something important, such as an anniversary or a birthday, does not get a competing plan.<\/li>\n<\/ol>\n<p><strong>The line to say for the anniversary.<\/strong> &quot;It didn't just add the event. It told me the day was my anniversary. Then it learned the rule, so I never have to catch it again.&quot;<\/p>\n<p><strong>3. A task typed once goes on the to-do list (<code>Adding Task to To Do List (edited)<\/code>).<\/strong> (Source: Boss Admin Moves note, 6 Oct 2026.)<\/p>\n<ul>\n<li>At 5:30am, Annie types &quot;add to to do list:&quot; and the task, in Telegram.<\/li>\n<li>The bot writes the task into her one to-do list.<\/li>\n<li>It replies with a receipt that names the exact file it saved to.<\/li>\n<li>It notices a similar item already exists. It notes the difference, so the two are not confused.<\/li>\n<li>It leaves her ranking alone, because she gave the new item no rank.<\/li>\n<li>It writes down a first step.<\/li>\n<\/ul>\n<p><strong>Why the receipt matters.<\/strong> The bot once replied &quot;got it&quot; without saving anything. The rule now: write the task, check the file, then reply with where it went. Annie's line: &quot;If it says saved, it shows me where. That receipt is how I know it really did it.&quot;<\/p>\n<p><strong>4. The morning brief, two ways.<\/strong> <em>(Added 10 Oct 2026, Annie's request.)<\/em><\/p>\n<p><strong>a. Annie's bot (<code>Cal + Inbox Checker (edited)<\/code>).<\/strong><\/p>\n<ul>\n<li>At 7:00, two messages arrive.<\/li>\n<li>The first is today's calendar.<\/li>\n<li>The second is the overnight email, sorted into what needs a look and what is only newsletters.<\/li>\n<\/ul>\n<p><strong>b. The same idea in Gemini, for the helper (<code>Gemini/Daily Msg for Helper (edited)<\/code>).<\/strong><\/p>\n<ul>\n<li>Annie made a Gemini Skill called &quot;helper-day&quot;. It writes the daily message for the family's helper, from her son's calendar and his daily routines.<\/li>\n<li>Annie types &quot;Write today's helper message&quot;.<\/li>\n<li>Gemini writes the day in three timed lines: the drive to an appointment, the lunch delivery, and her son coming home from school.<\/li>\n<li>Then it lists what to check:\n<ul>\n<li><strong>A clash.<\/strong> The helper cannot drive to the appointment and also receive the lunch delivery and meet her son at home.<\/li>\n<li><strong>A missing event.<\/strong> There was no morning school event on the calendar, so it did not add a drop-off.<\/li>\n<li><strong>Events left out on purpose.<\/strong> Two events came from Annie's personal calendar, so it kept them out of the helper's message.<\/li>\n<\/ul>\n<\/li>\n<li>It asks whether everyone is home for dinner, and whether to add the times to the helper's calendar.<\/li>\n<li>The point for students: you can build this kind of daily message in Gemini, with no server and no bot. Consumer Gemini works in Hong Kong with no VPN.<\/li>\n<li><em>Optional second screenshot:<\/em> the Skill in Gemini's Skills list (<code>Gemini/Screenshot 2026-10-05 at 8.14.35 PM (edited)<\/code>).<\/li>\n<\/ul>\n<p><strong>The line to say.<\/strong> &quot;None of these is clever. Each one removes something I used to have to remember.&quot;<\/p>\n<p><strong>The cost of this one.<\/strong> (Source: Build Log 30.)<\/p>\n<ol>\n<li>In July 2026, the receipt flow came back from the bot's own agents, marked as tested and working.<\/li>\n<li>An independent check found six bugs. Four of them were fatal.<\/li>\n<li>For example, the sender check could never match, and the email tool could not download attachments.<\/li>\n<\/ol>\n<p>The lesson: a report of success is a claim. Check the result yourself before you trust it.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-04-s7\"><h2><span class=\"num\">04.7<\/span> Demo 3: When the Bot Was Wrong<\/h2><p><strong>What happened (1 Oct 2026).<\/strong><\/p>\n<ol>\n<li>Annie photographed a hard drive's warranty card and said &quot;save this&quot;.<\/li>\n<li>The bot filed it as a searchable page. It explained which folder it chose and why (<code>warranty-01<\/code>).<\/li>\n<li>Then it stated, confidently, that the warranty did not cover data recovery. That was wrong.<\/li>\n<\/ol>\n<p><strong>How it was corrected<\/strong> (<code>warranty-02<\/code>):<\/p>\n<ol>\n<li>Annie corrected it in one sentence.<\/li>\n<li>The bot checked the manufacturer's own data sheet. It quoted the line that includes data recovery.<\/li>\n<li>It replied &quot;You're right and I was wrong&quot;.<\/li>\n<li>It fixed the page, and put the source in it.<\/li>\n<li>It explained the two ways to claim. It named what was still missing: the receipt.<\/li>\n<\/ol>\n<p><strong>Later<\/strong> (<code>warranty-03<\/code>):<\/p>\n<ul>\n<li>Annie asked it to move the files into a subfolder.<\/li>\n<li>It did.<\/li>\n<li>It also found and fixed a link elsewhere in the vault that the move would have broken (Boss Admin Moves note, 1 Oct 2026).<\/li>\n<\/ul>\n<p><strong>The line to say.<\/strong> &quot;The lesson is not that the bot is clever. I stayed in charge, and correcting it took one sentence.&quot;<\/p>\n<\/section>\n<section class=\"card\" id=\"full-04-s8\"><h2><span class=\"num\">04.8<\/span> Demo 4: The Message From the Watchdog<\/h2><p><em>Full course only.<\/em><\/p>\n<p><strong>What the screenshot shows (<code>Toby flagging problem (edited)<\/code>).<\/strong><\/p>\n<ul>\n<li>At 12:31 am, Annie's watchdog (Toby, the script that checks every hour that her system worked) sent one message.<\/li>\n<li>A note had been renamed. A link pointing at the old name now led nowhere.<\/li>\n<li>The watchdog had tried once to fix it, and could not.<\/li>\n<li>So it said exactly what to do, and that it would not retry.<\/li>\n<\/ul>\n<p><strong>The story to pair it with.<\/strong> (Source: Build Log 74.)<\/p>\n<ol>\n<li>In September 2026, Annie's nightly inbox sorter reported &quot;ok&quot; every night for weeks.<\/li>\n<li>It ran, sent a message and moved files.<\/li>\n<li>But it was moving them to the wrong folder.<\/li>\n<li>The message even named the right folder, while the file went somewhere else.<\/li>\n<li>Annie's words: &quot;a false 'ok' is just as bad or worse than something breaking down.&quot;<\/li>\n<li>After that, the watchdog checks that the work is right, not only that the job ran.<\/li>\n<\/ol>\n<p><strong>The line to say.<\/strong> &quot;A check that only tells you the job ran will tell you everything is fine while it is broken. This one checks the result.&quot;<\/p>\n<p>The module on keeping your system honest (Module 10) builds a small version of this watchdog.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-04-s9\"><h2><span class=\"num\">04.9<\/span> Demo 5: What It Costs<\/h2><p><strong>Show one slide with three numbers.<\/strong> No screenshot is needed, so nothing private can appear.<\/p>\n<ol>\n<li><strong>The monthly figure.<\/strong> What Annie's whole system costs per month. <strong>[COST]<\/strong>, with its date.<\/li>\n<li><strong>The cap.<\/strong> (Source: Build Log 89.)\n<ul>\n<li>In September 2026, Annie had set a $20 monthly spending cap on one AI account.<\/li>\n<li>The cap was reached, and the account paused.<\/li>\n<li>The cap did exactly its job.<\/li>\n<\/ul>\n<\/li>\n<li><strong>What filled it.<\/strong> (Source: Build Log 89.)\n<ul>\n<li>One chat conversation ran for three days.<\/li>\n<li>It used 19.06 million tokens, costing $8.36.<\/li>\n<li>Tokens are the small pieces of text that AI companies count and charge for.<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<p><strong>The line to say.<\/strong> &quot;I know what this costs to the cent. If you build this and do not know that, you will get a surprise you will not enjoy.&quot;<\/p>\n<\/section>\n<section class=\"card\" id=\"full-04-s10\"><h2><span class=\"num\">04.10<\/span> Exercise: Your Wish List<\/h2><ol>\n<li>Write down three to five jobs you would hand over today if you could.<\/li>\n<li>For each one, write what you have to remember today to get it done.<\/li>\n<li>Score how much remembering it removes, from 1 to 5. A job you think about every day scores higher than a monthly one.<\/li>\n<li>Mark the harm if it goes wrong.<\/li>\n<li>Circle your top two.<\/li>\n<\/ol>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Job<\/th>\n<th>What I have to remember today<\/th>\n<th>Remembering removed (1 to 5)<\/th>\n<th>Harm if it goes wrong (low, medium, high)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>My top two (these go to the next module):<\/strong><\/p>\n<ol>\n<li>\n<hr />\n<\/li>\n<li>\n<hr />\n<\/li>\n<\/ol>\n<p><strong>Check against y
