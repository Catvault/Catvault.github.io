r on<\/td>\n<td>The service file; <code>Linger=yes<\/code><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Quote test passed<\/td>\n<td>It quoted my save rule exactly<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Refusal test passed<\/td>\n<td>It said it did not know<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Golden questions passed twice, in fresh conversations<\/td>\n<td>My build log<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>\n<section class=\"card\" id=\"full-08b-s20\"><h2><span class=\"num\">08B.20<\/span> Not Yet Tested<\/h2><ul>\n<li><strong>The whole order, with pi running every step.<\/strong> Annie's own test on a fresh server, from Hong Kong, no VPN, exit node off.<\/li>\n<li><strong>Still untested:<\/strong>\n<ul>\n<li>the server sign-in flow for Claude Code<\/li>\n<li>the Obsidian server sync (no written steps)<\/li>\n<li>the normal-user change<\/li>\n<li>the swap file's first command<\/li>\n<li><code>ssh-copy-id<\/code> on Windows<\/li>\n<li>the Hermes install script<\/li>\n<li><code>hermes gateway setup<\/code><\/li>\n<li>the opencode Go set-up in Hermes<\/li>\n<li>the working-folder setting for <code>.hermes.md<\/code><\/li>\n<\/ul>\n<\/li>\n<li><strong>Also untested:<\/strong>\n<ul>\n<li>pi running server commands over SSH from the laptop<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/section>", "count": 20, "sess": [3]}, {"id": "full-08c", "label": "08C Build", "title": "Module 08C: The Build, After the Server", "minutes": 100, "read": 13, "toc": [["full-08c-s1", "08C.1", "Claude Code Through Your Own Route"], ["full-08c-s2", "08C.2", "Your Window and Four Settings"], ["full-08c-s3", "08C.3", "The Cold Test Again, for Claude Code"], ["full-08c-s4", "08C.4", "Continuity and the Start-of-Session Hook"], ["full-08c-s5", "08C.5", "The Build Log"], ["full-08c-s6", "08C.6", "The Run Card"], ["full-08c-s7", "08C.7", "Say What You Want, Not Every Step"], ["full-08c-s8", "08C.8", "The One Tool You Cannot Lose"], ["full-08c-s9", "08C.9", "Lessons From Real Mistakes"], ["full-08c-s10", "08C.10", "Worksheet"], ["full-08c-s11", "08C.11", "Not Yet Tested"]], "body": "<div class=\"intro\"><p><em>Start this half only after Module 08B's exit node test passes.<\/em><\/p>\n<\/div>\n<section class=\"card\" id=\"full-08c-s1\"><h2><span class=\"num\">08C.1<\/span> Claude Code Through Your Own Route<\/h2><p><em>15 minutes.<\/em><\/p>\n<p>Your server is now your route out of Hong Kong.<\/p>\n<ul>\n<li><strong>Exit node on:<\/strong> your laptop's internet traffic goes out through Singapore. Anthropic serves Singapore.<\/li>\n<li><strong>Exit node off:<\/strong> your laptop is a normal Hong Kong laptop again (Module 08B).<\/li>\n<\/ul>\n<p><strong>Step 1. Turn the exit node on.<\/strong> In the Tailscale menu, choose your server as the exit node.<\/p>\n<p><strong>Step 2. Check where your laptop appears to be.<\/strong><\/p>\n<pre><code class=\"language-bash\">curl -s https://1.1.1.1/cdn-cgi/trace | grep loc\n<\/code><\/pre>\n<p><strong>It passed if<\/strong> it prints <code>loc=SG<\/code>. If it prints <code>loc=HK<\/code>, the exit node is not on. Stop here and fix that first.<\/p>\n<p><strong>Step 3. Install Claude Code.<\/strong><\/p>\n<pre><code class=\"language-bash\">curl -fsSL https://claude.ai/install.sh | bash\n<\/code><\/pre>\n<p>On Windows, in PowerShell (facilitator: check Anthropic's install page on the day):<\/p>\n<pre><code class=\"language-powershell\">irm https://claude.ai/install.ps1 | iex\n<\/code><\/pre>\n<p>To check it worked: quit and reopen Terminal. Type <code>claude --version<\/code>. It should print a number.<\/p>\n<p><strong>Step 4. Start Claude Code in your vault and sign in.<\/strong><\/p>\n<ol>\n<li>Go to your vault folder.<\/li>\n<li>Type <code>claude<\/code>.<\/li>\n<li>Choose <strong>&quot;Claude account with subscription&quot;<\/strong>.<\/li>\n<li>A browser opens. Sign in there.<\/li>\n<li>When it asks whether to trust this folder, answer <strong>Yes<\/strong>.<\/li>\n<\/ol>\n<p><strong>If it signs in to the wrong account:<\/strong><\/p>\n<ol>\n<li>Sign out of claude.ai in your browser.<\/li>\n<li>Type <code>/login<\/code> inside Claude Code.<\/li>\n<\/ol>\n<p>Claude Code signs in to whichever account your browser has open.<\/p>\n<p><strong>Claude Code on the laptop needs the exit node on, every time.<\/strong> pi does not. Annie keeps her exit node off most of the time. She turns it on when she wants Claude on the laptop. She can also use Claude Code on the server, which needs no route (Module 08B, &quot;Your Daily Routine&quot;).<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08c-s2\"><h2><span class=\"num\">08C.2<\/span> Your Window and Four Settings<\/h2><p><em>15 minutes.<\/em><\/p>\n<h3>Where You Run It<\/h3>\n<p>Module 01 showed you your terminal window and Annie's notes on it (Module 01, &quot;Your Terminal Window for the Rest of the Course&quot;). The notes cover:<\/p>\n<ul>\n<li>using a terminal (Terminal or Ghostty) instead of the desktop app<\/li>\n<li>scrolling<\/li>\n<li>copy and paste<\/li>\n<li>the status line<\/li>\n<li>the keys<\/li>\n<\/ul>\n<p>In this section you make the changes, because both builders are now installed.<\/p>\n<h3>Let pi Make the Changes<\/h3>\n<p><strong>pi is already working, so pi makes the Claude Code changes for you.<\/strong> This is one benefit of installing pi first. Claude Code can also make these changes itself, in the desktop app or in the terminal. Start pi in your vault for each setting below.<\/p>\n<p><strong>1. Make copy and paste work.<\/strong> Claude Code takes control of the mouse. So when you highlight text, it does not copy. Ask pi:<\/p>\n<pre><code class=\"language-text\">Add the line export CLAUDE_CODE_DISABLE_MOUSE=1 to my ~/.zshrc file. Back up the file first.\n<\/code><\/pre>\n<p>Open a new Terminal window. Now Command and C copies, and Command and V pastes. Be careful: Control and C does something different. It stops whatever is running.<\/p>\n<p><strong>2. Lock Claude Code to your subscription.<\/strong><\/p>\n<ul>\n<li>If an Anthropic API key is on your machine, Claude Code may use it. Then you pay for each use, on top of your plan.<\/li>\n<li>This happened to Annie. When she set up Claude Code on her server, it charged each use to her employer's account.<\/li>\n<\/ul>\n<p>Ask pi:<\/p>\n<pre><code class=\"language-text\">In ~/.claude/settings.json, set &quot;forceLoginMethod&quot; to &quot;claudeai&quot;. Keep every other setting. Back up the file first, then show me the result.\n<\/code><\/pre>\n<p><strong>It passed if<\/strong> you type <code>/login<\/code> inside Claude Code and the subscription option is already selected.<\/p>\n<p><strong>3. Show what matters at the bottom of the window.<\/strong><\/p>\n<ol>\n<li>Choose your status-line items from the list in Module 01.<\/li>\n<li>Ask pi to set up its own status line first. Annie's pi has one.<\/li>\n<li>Then ask pi to set up Claude Code's status line.<\/li>\n<\/ol>\n<p>Facilitator: check on the day which items each builder can show. Also check whether &quot;money spent&quot; can show on a subscription.<\/p>\n<p><strong>4. Queue a message with Option and Enter.<\/strong> Module 01's key table explains each key.<\/p>\n<ul>\n<li>Claude Code's own queue key is hard to press: Control and X, then Enter.<\/li>\n<li>Annie changed it to Option and Enter on her Mac.<\/li>\n<\/ul>\n<p>Ask your builder to do the same:<\/p>\n<pre><code class=\"language-text\">Create ~/.claude/keybindings.json with one binding in the Chat context: &quot;alt+enter&quot; runs &quot;chat:queueSubmit&quot;. Keep any bindings already in the file. Back up the file first.\n<\/code><\/pre>\n<p><strong>If you use Ghostty, it needs one more line.<\/strong> Ghostty does not send Option and Enter to Claude Code on its own.<\/p>\n<ol>\n<li>Ask your builder to add the line below to <code>~/.config/ghostty/config<\/code>.<\/li>\n<li>Reload Ghostty's settings: press Command, Shift and comma.<\/li>\n<\/ol>\n<pre><code class=\"language-text\">keybind = alt+enter=text:\\x1b\\r\n<\/code><\/pre>\n<p><em>Plain Enter does not stop the job. The message reaches Claude as soon as the current step finishes, inside the same job (Claude Code docs, &quot;When Claude Code sends what you queued&quot;). Annie saw this happen herself. So only the queue key (Option and Enter here) waits for the whole job to end. pi works the same way. Its queue key, Alt and Enter, is built in (Control and Q on Windows). See Module 01's key table.<\/em><\/p>\n<\/section>\n<section class=\"card\" id=\"full-08c-s3\"><h2><span class=\"num\">08C.3<\/span> The Cold Test Again, for Claude Code<\/h2><p><em>10 minutes.<\/em><\/p>\n<p>Claude Code reads the same <code>CLAUDE.md<\/code> that pi read before the server work. Now prove it.<\/p>\n<ol>\n<li>Exit Claude Code: type <code>/exit<\/code>.<\/li>\n<li>Make sure the exit node is on.<\/li>\n<li>In your vault folder, type:<\/li>\n<\/ol>\n<pre><code class=\"language-bash\">claude -p &quot;Answer from your instructions only. Who am I? Give two of my rules for working with me. What must you never print?&quot;\n<\/code><\/pre>\n<p><strong>It passed if<\/strong> Claude Code gives the same answers pi gave. If Claude Code's answer is general and pi's was not, Claude Code started in a different folder.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08c-s4\"><h2><span class=\"num\">08C.4<\/span> Continuity and the Start-of-Session Hook<\/h2><p><em>15 minutes.<\/em><\/p>\n<p>Your builder starts every session with no memory of yesterday. A continuity note fixes this. It is a short &quot;where we left off&quot; note. Every session reads it first. Each entry has:<\/p>\n<ul>\n<li>the date<\/li>\n<li>what was done<\/li>\n<li>what is still in progress<\/li>\n<li>the next action<\/li>\n<\/ul>\n<p><strong>Step 1.<\/strong> Ask Claude Code:<\/p>\n<pre><code class=\"language-text\">Create Builder/CONTINUITY.md with a one-line header saying what it is. Add today's entry: what we built in Modules 08 and 08B, and my next action.\n<\/code><\/pre>\n<p><strong>Step 2. Make Claude Code read the note on its own.<\/strong><\/p>\n<p>Why this step exists:<\/p>\n<ol>\n<li>Annie's rules told her builder to read the continuity note first.<\/li>\n<li>One day she asked an urgent question. The builder answered without reading the note.<\/li>\n<li>A rule that the builder must remember can lose to an urgent question.<\/li>\n<li>The fix was a start-of-session hook. A hook is a setting that loads the note before the builder answers anything.<\/li>\n<\/ol>\n<p>Ask Claude Code:<\/p>\n<pre><code class=\"language-text\">Add a SessionStart hook to ~/.claude/settings.json that prints the first 60 lines of Builder/CONTINUITY.md in my vault, so you read it at the start of every session. Back up the file first. Then show me how to test it.\n<\/code><\/pre>\n<p>To test it:<\/p>\n<ol>\n<li>Exit Claude Code.<\/li>\n<li>Start a new session.<\/li>\n<li>Ask &quot;where did we leave off?&quot;. The answer should come from the note.<\/li>\n<\/ol>\n<p>Facilitator: check the hook format against the current Claude Code hooks documentation on the day.<\/p>\n<p>pi has no hook here. pi reads the note only because <code>CLAUDE.md<\/code> tells it to. That is less reliable than a hook.<\/p>\n<p><strong>Step 3. Choose your &quot;save&quot; word.<\/strong> Add this line to <code>CLAUDE.md<\/code>: &quot;When I say 'save', add a dated entry to CONTINUITY.md, and if we built something, write the build log and its index row.&quot;<\/p>\n<p><strong>Keep the note short.<\/strong> Every session reads it, so a long note slows every session down. Annie deletes entries older than three weeks.<\/p>\n<p>Her test for where a lesson belongs: <strong>will it still matter in three weeks?<\/strong> If yes, put it in <code>CLAUDE.md<\/code> or the vault. Do not put it in the continuity note.<\/p>\n<p><strong>Read the note before you start a build.<\/strong> Once, two of Annie's sessions built the same fix at the same time. One was on the Mac and one was on the server. Both said they succeeded. The checking file ended up with two copies of each new check. You now have two builders, so this can happen to you too.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08c-s5\"><h2><span class=\"num\">08C.5<\/span> The Build Log<\/h2><p><em>10 minutes. The Short course uses the same steps.<\/em><\/p>\n<p>A build log records one piece of work. You write it when the work is finished. You never change an old entry. You add a new one. Write a new one each time you finish a piece of work.<\/p>\n<p><strong>Step 1.<\/strong> Ask your builder to:<\/p>\n<ol>\n<li>Create the folder <code>AI System/Build Logs/<\/code>.<\/li>\n<li>Create an index note called <code>0 — Build Log Index<\/code>. It has a table with four columns: number, date, title, and a one-line summary.<\/li>\n<\/ol>\n<p><strong>Step 2.<\/strong> Save this template as <code>AI System/Build Logs/_Template<\/code>:<\/p>\n<pre><code class=\"language-markdown\">---\ntype: build-log\nlog: [number]\ncreated: [date]\n---\n\n# Build Log [number]: [title]\n\n## Goal\n## What I Learned\n## What I Built\n## Proven and Not Yet Proven\n## Files Changed and Their Backups\n| File | Backup |\n|---|---|\n## Open and Next\n<\/code><\/pre>\n<p><strong>Step 3.<\/strong> Ask your builder to write Build Log 1. Ask it to add the index row in the same step.<\/p>\n<p><strong>A log is not finished until its index row exists.<\/strong><\/p>\n<ul>\n<li>A log with no index row looks the same as a log that was never written.<\/li>\n<li>Two logs once got the same number, because someone picked the numbers by hand.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-08c-s6\"><h2><span class=\"num\">08C.6<\/span> The Run Card<\/h2><p><em>10 minutes. The Short course writes the same card.<\/em><\/p>\n<p>The run card is one page that sums up how to run your system. Handwriting is fine. Bring it to every later session. Write down:<\/p>\n<ul>\n<li>What your system is for, in one sentence.<\/li>\n<li>The exact start command for each builder, and the key that stops it.<\/li>\n<li>Where the files live: the vault folder, <code>CLAUDE.md<\/code>, and the bot's files on the server.<\/li>\n<li>Your daily routine from Module 08B.<\/li>\n<li>Your three rules, and how you check each one (Module 07).<\/li>\n<li>Your three golden questions, the test questions with known answers (Module 07).<\/li>\n<li>What it costs each month, and where each number came from <strong>[COST]<\/strong>.<\/li>\n<li>What to do when it does not answer: which builder still works, and how to reach the server company's website.<\/li>\n<\/ul>\n<p><strong>If you cannot write the start command from memory, write it down now.<\/strong> In a week you will need it.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-08c-s7\"><h2><span class=\"num\">08C.7<\/span> Say What You Want, Not Every Step<\/h2><p><em>5 minutes. Both conversations are from one of Annie's builder sessions, running Opus 5.5.<\/em><\/p>\n<p><strong>First conversation: the builder says how it understood you, before it acts.<\/strong><\/p>\n<blockquote>\n<p><strong>Annie:<\/strong> should we do C and then this? I wanted to finish previous open tasks first. and does this check the critical test like we wanted?<\/p>\n<p><strong>Builder:<\/strong> Yes: C now, then the automatic workflow. I'm reading &quot;C&quot; as &quot;keep switching models by hand&quot;. Finishing open work first makes sense, and building the automatic workflow last means it can be tested on real work.<\/p>\n<\/blockquote>\n<p>What this shows:<\/p>\n<ul>\n<li><strong>Short instructions work when you both know what they mean.<\/strong> &quot;C&quot; was an option they had already agreed on. So it needed no explanation.<\/li>\n<li><strong>The builder said how it understood &quot;C&quot; before it acted.<\/strong> If it had misunderstood, the mistake would cost one sentence, not a day of work.<\/li>\n<li><strong>A preference is a real instruction.<\/strong> &quot;I wanted to finish previous open tasks first&quot; changed the order. The builder followed it.<\/li>\n<li><strong>Ask whether it meets the test you agreed on, not whether it is good.<\/strong> &quot;Does this check the critical test like we wanted?&quot; asks for proof against a test they set earlier.<\/li>\n<\/ul>\n<p><strong>Second conversation: when you are the one who is confused.<\/strong><\/p>\n<blockquote>\n<p><strong>Annie:<\/strong> and then go 1. im getting confused on what to run but just know let's finish everything still open from the F B D and E builds and this automated workflow<\/p>\n<p><strong>Builder:<\/strong> I'll take it from here and finish all four in order. I won't ask you to choose critics this time: for Module 1 I'll run all four. Starting with Module 1.<\/p>\n<\/blockquote>\n<p>What this shows:<\/p>\n<ul>\n<li><strong>&quot;I'm getting confused&quot; is a full instruction.<\/strong> It lets the builder make the decision and continue. If you stay quiet and guess, the build moves away from what you wanted.<\/li>\n<li><strong>The builder said which decision it was making, before it made it.<\/strong> It is safe for the builder to make a choice for you when it tells you first. It is not safe when you only find out later.<\/li>\n<\/ul>\n<p><strong>What to take away.<\/strong><\/p>\n<ol>\n<li>You do not need to give step-by-step instructions.<\/li>\n<li>Say what you want, what it must not do, and how you will judge the result.<\/li>\n<li>Ask the builder to say back what it understood.<\/li>\n<li>If it cannot say it in one sentence, your instruction is not clear yet.<\/li>\n<\/ol>\n<p><em>Do not show the two screenshots of these conversations in class yet. They must first be checked against the screenshot rules, because they were not among the 54 approved edited copies.<\/em><\/p>\n<\/section>\n<section class=\"card\" id=\"full-08c-s8\"><h2><span class=\"num\">08C.8<\/span> The One Tool You Cannot Lose<\/h2><p><em>5 minutes.<\/em><\/p>\n<p>Ask each student: <strong>which one tool, if it stopped working, would stop you from fixing everything else?<\/strong> Write its name on the run card.<\/p>\n<p>Annie learned this the hard way:<\/p>\n<ol>\n<li>She once built two clever designs. They sent only some internet traffic through Singapore.<\/li>\n<li>Both designs put Tailscale in front of Claude Code.<\/li>\n<li>When Tailscale was off, Claude Code on the Mac stopped working.<\/li>\n<li>But Claude Code was the tool she used to fix everything else.<\/li>\n<li>She removed both designs the next day.<\/li>\n<\/ol>\n<p>Her words: &quot;i don't ever want a situation where i can't reach claude code on my mac.&quot;<\/p>\n<p><strong>In this course, the answer is built in.<\/strong><\/p>\n<ul>\n<li>pi works when Tailscale is off, when the exit node is off, and when the server is down.<\/li>\n<li>Claude Code on the laptop needs the exit node.<\/li>\n<li>So the tool you cannot lose is pi. It does not depend on anything you built today. Keep it working.<\/li>\n<\/ul>\n<hr />\n<\/section>\n<section class=\"card\" id=\"full-08c-s9\"><h2><span class=\"num\">08C.9<\/span> Lessons From Real Mistakes<\/h2><p>Each line below is one lesson from a real mistake in Annie's own system. The full story behind each one is on the FAQ tab, the last tab at the top of the page.<\/p>\n<ul>\n<li>The cold test is the only proof that your AI assistant read your files.<\/li>\n<li>A report of success is only a claim. Test it yourself.<\/li>\n<li><em>Full course only:<\/em> when a setup looks broken, look at what is inside it before you rebuild it.<\/li>\n<li>A check that depends on goodwill gets skipped. Make it part of the process.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-08c-s10\"><h2><span class=\"num\">08C.10<\/span> Worksheet<\/h2><h3>Full Course<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>pi installed; <code>pi --version<\/code> prints a number<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>opencode Go key entered without showing; <code>pi<\/code> starts on DeepSeek V4.1 Flash<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>CLAUDE.md<\/code> at the top of my vault, under one screen, with the five habits<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>pi cold test passed: it named me, two rules, and the never-print rule<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><em>(Module 08B finished)<\/em><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>loc=SG<\/code> with the exit node on<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Claude Code installed and signed in to my subscription<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Copy and paste work; <code>forceLoginMethod<\/code> set to <code>claudeai<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Status line shows what I chose<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>I know Escape stops, and which key queues<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Claude Code cold test passed, with the same answers as pi<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>Builder/CONTINUITY.md<\/code> exists; a new session knows where we left off<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My &quot;save&quot; word is in <code>CLAUDE.md<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Build Log 1 and its index row exist<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Run card written, including the one tool I cannot lose<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>\n<section class=\"card\" id=\"full-08c-s11\"><h2><span class=\"num\">08C.11<\/span> Not Yet Tested<\/h2><p>Nobody has run either course's build yet. These steps have never been run as written:<\/p>\n<ul>\n<li><em>Full course only:<\/em> the whole pi-first order.<\/li>\n<li><em>Full course only:<\/em> the Claude Code steps after a route that pi built.<\/li>\n<li><em>Full course only:<\/em> the start-of-session hook.<\/li>\n<li><em>Full course only:<\/em> Annie's window additions: terminal or desktop app, scrolling, the status line, and the Enter and Control and Enter keys.<\/li>\n<li><strong>Both courses:<\/strong> the hidden key-entry line, asking pi to set its default model, and every Windows command.<\/li>\n<\/ul>\n<\/section>", "count": 11, "sess": [3]}, {"id": "full-09", "label": "09", "title": "Module 09: Script, Machine Learning or AI Judgement", "minutes": 45, "read": 14, "toc": [["full-09-s1", "09.1", "What You Will Leave With"], ["full-09-s2", "09.2", "What You Need to Prepare"], ["full-09-s3", "09.3", "One Question for Every Step"], ["full-09-s4", "09.4", "Four Ways a Step Can Be Done"], ["full-09-s5", "09.5", "Mark Your Process Maps"], ["full-09-s6", "09.6", "Why AI Flatters, Guesses and Cannot Count"], ["full-09-s7", "09.7", "When the Model Keeps Getting It Wrong"], ["full-09-s8", "09.8", "Write Build Brief 1"], ["full-09-s9", "09.9", "Homework: Which Judgement Model for Which Job"], ["full-09-s10", "09.10", "Lessons From Real Mistakes"], ["full-09-s11", "09.11", "Worksheet: Build Brief 1"]], "body": "<div class=\"intro\"><p><strong>Why this module comes after the build.<\/strong><\/p>\n<ol>\n<li>Students have now used an AI assistant. They have seen it answer, and some have seen it get things wrong.<\/li>\n<li>The second half of this module explains what to do when a model keeps getting a step wrong. That only makes sense after a student has seen a failure.<\/li>\n<li>The first automation is built in Module 11. So students still decide who or what does each step before anything is automated.<\/li>\n<\/ol>\n<\/div>\n<section class=\"card\" id=\"full-09-s1\"><h2><span class=\"num\">09.1<\/span> What You Will Leave With<\/h2><p><strong>Both courses:<\/strong><\/p>\n<ul>\n<li>Your Process Maps from Module 05, with a coloured dot on every step.<\/li>\n<li>Each dot says who or what does that step: a script, a single-task model, a judgement model or a person.<\/li>\n<li>Your best candidate for a first automation, circled on the map.<\/li>\n<\/ul>\n<p><strong>Full course only:<\/strong><\/p>\n<ul>\n<li><strong>Build Brief 1.<\/strong> This is one page that describes your first automation. It says:\n<ul>\n<li>what starts it<\/li>\n<li>what each step is, and who checks it<\/li>\n<li>what it must never do<\/li>\n<li>how you will know it worked<\/li>\n<\/ul>\n<\/li>\n<li>In Module 11 your builder (pi or Claude Code) builds it from this brief.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-09-s2\"><h2><span class=\"num\">09.2<\/span> What You Need to Prepare<\/h2><ul>\n<li><strong>Your Process Maps from Module 05.<\/strong> In the Short course, this may be one map, because process two was homework.<\/li>\n<li><strong>Your Data Map from Module 02.<\/strong> Some steps will be ruled out by it.<\/li>\n<li><strong>Dot stickers in four colours,<\/strong> or four coloured pens. The facilitator supplies these.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-09-s3\"><h2><span class=\"num\">09.3<\/span> One Question for Every Step<\/h2><p>Look at each step on your map. Ask one question: <strong>does this step have a right answer?<\/strong><\/p>\n<p><strong>If it has a right answer, a script should do it.<\/strong> Examples of a right answer:<\/p>\n<ul>\n<li>a time<\/li>\n<li>a total<\/li>\n<li>a date<\/li>\n<li>a file name<\/li>\n<li>whether two appointments overlap<\/li>\n<\/ul>\n<p>A script gives the same answer every time. It costs nothing to run.<\/p>\n<p><strong>If the step depends on context, it needs an AI model.<\/strong> Examples:<\/p>\n<ul>\n<li>&quot;is this email urgent?&quot;<\/li>\n<li>&quot;which of these ideas matters most?&quot;<\/li>\n<\/ul>\n<p><strong>Annie's system shows how far this goes.<\/strong> When her server was checked on 2 October 2026, it ran 26 scheduled jobs.<\/p>\n<ul>\n<li>23 of them were plain scripts. They never call an AI model.<\/li>\n<li>They include the vault sync, backups, the morning brief, the weather plan, reminders, the watchdog and the monthly cost report.<\/li>\n<li>Only 3 jobs hand work to the bot's model. Those need real judgement about what is new and relevant.<\/li>\n<\/ul>\n<p><strong>The money follows the same rule.<\/strong> Annie moved routine work from the AI model to scripts. Her token spending fell from $29.05 in one month to $2.79 the next.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-09-s4\"><h2><span class=\"num\">09.4<\/span> Four Ways a Step Can Be Done<\/h2><p>Every step on your map is done by one of four things: a script, a single-task model, a judgement model or a person.<\/p>\n<p><strong>Script.<\/strong><\/p>\n<ul>\n<li>What it is: code that follows fixed steps.<\/li>\n<li>Good for: anything with a right answer. Times, counts, renames, overlaps and file moves.<\/li>\n<li>Annie's examples: the weather planner, the receipt scan and rename, the watchdog's checks, the overlap checker.<\/li>\n<li>Cost per run: $0.<\/li>\n<\/ul>\n<p><strong>Single-task model<\/strong> (machine learning).<\/p>\n<ul>\n<li>What it is: a small AI model trained to do one job only.<\/li>\n<li>Good for: turning messy input into data. Speech to text, reading a photo, sorting into a category.<\/li>\n<li>Annie's examples: voice notes transcribed on the server, and an 80-minute talk transcribed on the Mac with no internet.<\/li>\n<li>Cost per run: very small, or $0 if it runs on your own machine.<\/li>\n<\/ul>\n<p><strong>Judgement model<\/strong> (a large language model).<\/p>\n<ul>\n<li>What it is: a general AI model that reads and writes.<\/li>\n<li>Good for: decisions that depend on context, and writing in a voice.<\/li>\n<li>Annie's examples: grading a learning answer; finding the week's most useful idea; drafting a reply; the nightly filing job, which decides which folder each note belongs in.<\/li>\n<li>Cost per run: cents, and more for top models.<\/li>\n<\/ul>\n<p><strong>Person.<\/strong><\/p>\n<ul>\n<li>What it is: you, or someone you trust.<\/li>\n<li>Good for: approvals, anything that reaches another person, and sensitive submissions.<\/li>\n<li>Annie's examples: sending any email; submitting an insurance claim.<\/li>\n<li>Cost per run: your time.<\/li>\n<\/ul>\n<p><strong>The single-task model is the one people forget.<\/strong> It sits between a script and a full AI model.<\/p>\n<ul>\n<li>Annie's laptop turned an 80-minute recorded talk into 14,427 words of text.<\/li>\n<li>It used a free speech-to-text program called whisper.cpp.<\/li>\n<li>Nothing left the machine. So it needed no VPN and no account.<\/li>\n<li>Her server transcribes voice notes sent to the bot in the same way.<\/li>\n<\/ul>\n<p><strong>Keep a person on any step where a silent failure would touch sensitive data.<\/strong> Annie wanted her bot to file insurance claims from start to finish. Her decision was this:<\/p>\n<ul>\n<li>The bot finds the receipt, downloads it and tells her.<\/li>\n<li>She submits the claim herself.<\/li>\n<li>The reason: insurers' websites block automated browsers, and a failure there could go unnoticed.<\/li>\n<\/ul>\n<p><strong>A scheduled job should not wake the AI just to ask you something.<\/strong> Annie's rule from day one: scheduled jobs are scripts, or scripts that hand a small task to a cheap model. Her first bot ended partly because AI prompts ran on timers and billed a paid account every day. If you want judgement, make it something you ask for when you need it.<\/p>\n<p><strong>Annie wrote this down as three cost levels for her bot's jobs:<\/strong><\/p>\n<ol>\n<li><strong>Level 1: a plain script, with no AI.<\/strong> This is the cheapest, and it is the default.<\/li>\n<li><strong>Level 2: a script plus a small, cheap model.<\/strong> This is for light formatting and reading.<\/li>\n<li><strong>Level 3: the good, expensive model.<\/strong> This is for live conversation with Annie only.<\/li>\n<\/ol>\n<p>Scheduled jobs use Level 1 or Level 2. They never run the expensive model on a timer. Her notes add a second rule. Heavy building belongs on the powerful, expensive builder, because that is where the real work happens. The bot's job is to be reachable on the phone, so a cheap model is the right choice for it.<\/p>\n<p><strong>Where judgement is needed, let a script do the work around it.<\/strong> Annie's weekly idea job (Phoebe) needs real judgement. It runs in three steps:<\/p>\n<ol>\n<li>A script gathers her notes first, with no AI.<\/li>\n<li>Only then does it call Claude to think.<\/li>\n<li>Afterwards, the script checks that the weekly note actually exists before it reports success.<\/li>\n<\/ol>\n<h3>Practice: Sort Eight Example Steps<\/h3>\n<p>The facilitator hands out eight example steps, one per card. Decide whether each one is done by a script, a single-task model, a judgement model or a person. Then compare with a partner.<\/p>\n<ol>\n<li>Check whether a 3 pm call clashes with anything on your calendar.<\/li>\n<li>Rename a downloaded PDF to 15 characters or fewer.<\/li>\n<li>Turn a voice note into text.<\/li>\n<li>Decide which of this week's ten ideas is most worth your time.<\/li>\n<li>Send a reply to a client.<\/li>\n<li>Count how many items are in your storage inventory.<\/li>\n<li>Read a photo of a warranty card and pull out the serial number.<\/li>\n<li>Decide whether an email from your child's school needs action today.<\/li>\n<\/ol>\n<p><strong>Suggested answers.<\/strong><\/p>\n<ul>\n<li>Script: 1, 2 and 6.<\/li>\n<li>Single-task model: 3 and 7.<\/li>\n<li>Judgement model: 4 and 8.<\/li>\n<li>Person: 5.<\/li>\n<\/ul>\n<p>Deciding about the school email can move towards a script if the school uses the same subject lines every time.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-09-s5\"><h2><span class=\"num\">09.5<\/span> Mark Your Process Maps<\/h2><p>Put one coloured dot on every step of your maps. The colour says who or what does that step.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Dot<\/th>\n<th>Who or what does the step<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Green<\/td>\n<td>Script<\/td>\n<\/tr>\n<tr>\n<td>Blue<\/td>\n<td>Single-task model<\/td>\n<\/tr>\n<tr>\n<td>Red<\/td>\n<td>Judgement model<\/td>\n<\/tr>\n<tr>\n<td>Black<\/td>\n<td>Person<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Question every red dot.<\/strong> A red dot means you marked the step for a judgement model. For each one, ask: could a script do this if it were given the right facts? Two of Annie's examples:<\/p>\n<ul>\n<li>Her overlap check started as a judgement step. It became a script.<\/li>\n<li>Her storage photos started with an AI description. They ended with none, because she preferred her own words.<\/li>\n<\/ul>\n<p><strong>Mark what the model needs to be told.<\/strong> Beside every red dot, write the facts a script should hand the model first.<\/p>\n<ul>\n<li>Once, Annie's bot invented an answer about which class slot suited her son.<\/li>\n<li>It had no nap times and no rules to check against.<\/li>\n<li>The fix supplied the facts and a numbered checking procedure.<\/li>\n<li>Then the bot was tested against an answer worked out separately.<\/li>\n<\/ul>\n<p><strong>Then circle your best candidate for a first automation.<\/strong> A good first candidate:<\/p>\n<ul>\n<li>has a clear trigger<\/li>\n<li>is mostly green dots, which means mostly script steps<\/li>\n<li>happens at least weekly<\/li>\n<li>causes small harm if it goes wrong<\/li>\n<li>uses only Tier 1 (open) or Tier 2 (personal) information from your Data Map<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-09-s6\"><h2><span class=\"num\">09.6<\/span> Why AI Flatters, Guesses and Cannot Count<\/h2><p><em>Full course segment.<\/em><\/p>\n<p>Annie worked this out in one of her learning sessions.<\/p>\n<ul>\n<li>AI models are tuned by people choosing which answers they prefer.<\/li>\n<li>So the model learns to be liked, not to be right.<\/li>\n<li>Her line: &quot;they are not training the model that what they like is what is right&quot;.<\/li>\n<\/ul>\n<p>Three habits follow from that one fact.<\/p>\n<ol>\n<li><strong>It agrees with you too easily,<\/strong> because agreement is liked.<\/li>\n<li><strong>It sounds sure when it is guessing,<\/strong> because sure answers are preferred, and the people rating them cannot check every fact.<\/li>\n<li><strong>It hands you the answer at once,<\/strong> because instant help feels good. This happens even when you needed to work it out yourself.<\/li>\n<\/ol>\n<p><strong>Never ask a model to count.<\/strong><\/p>\n<ul>\n<li>Once, two of Annie's bots gave different totals for the same storage inventory.<\/li>\n<li>One said 184 items. The other said 158.<\/li>\n<li>The true number was 184.<\/li>\n<li>Neither bot should have been counting. The exact total already existed in a note that code rebuilds on every change.<\/li>\n<li>The fix pointed both bots at that number.<\/li>\n<\/ul>\n<p>The lesson is not &quot;pick the model that counts better&quot;. Anything that must be exact comes from code. That includes counts, lists, totals and dates. The model only puts the result into words.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-09-s7\"><h2><span class=\"num\">09.7<\/span> When the Model Keeps Getting It Wrong<\/h2><p><em>Full course segment.<\/em><\/p>\n<p><strong>Rewriting the instruction rarely fixes a mechanical mistake for good.<\/strong> Annie's builds use five ways to fix it instead, from weakest to strongest. Each one replaces a request with something that cannot go another way.<\/p>\n<ol>\n<li><strong>A written instruction, with the exact failing case as an example.<\/strong> A worked example works better than a general rule.<\/li>\n<li><strong>Code does the calculation, and the model reads the result.<\/strong> The calendar overlap check moved into a command.<\/li>\n<li><strong>Code accepts whatever the model does.<\/strong> The model's edits once broke a script. The script now accepts both file shapes.<\/li>\n<li><strong>A guard blocks the wrong action.<\/strong> One bot cannot edit protected files at all.<\/li>\n<li><strong>The model is taken out of the step.<\/strong> Photos sent to the storage bot are filed by code before the model ever wakes up.<\/li>\n<\/ol>\n<p>Annie's summary: an instruction is a request the model can decline, and a guard cannot be declined.<\/p>\n<p><strong>Taking the AI out moves the bugs into plain code.<\/strong> Once, the storage bot showed &quot;typing&quot; all day and never replied.<\/p>\n<ul>\n<li>Annie swapped the AI model. Nothing changed, because that step used no model at all.<\/li>\n<li>The real cause was one wrong word in a script.<\/li>\n<li>The script crashed on its first line. Its error messages were switched off, so it stopped without telling anyone.<\/li>\n<li>The fix was one line.<\/li>\n<\/ul>\n<p>The lesson: read the logs before you blame the model. Never switch off a script's errors.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-09-s8\"><h2><span class=\"num\">09.8<\/span> Write Build Brief 1<\/h2><p><em>Full course segment.<\/em><\/p>\n<p><strong>A build brief is one page.<\/strong> It tells the builder what to build and how you will judge it. Annie uses this method for her own builds.<\/p>\n<ol>\n<li>One session writes the brief and its checks.<\/li>\n<li>A builder works from it.<\/li>\n<li>She judges the result against the checks she wrote first.<\/li>\n<\/ol>\n<p><strong>Two rules come from her experience.<\/strong><\/p>\n<ul>\n<li><strong>You write the definition of done, and the builder may not change it.<\/strong> Otherwise the builder can &quot;pass&quot; by moving the target.<\/li>\n<li><strong>Decisions live in the written brief, not in a conversation.<\/strong> Once, Annie's bot agreed at 7:37 am that a weather tool would be all script, with no AI. By that afternoon, the notes it wrote for itself had brought back an AI job on a timer. A separate review of the design caught it before the 6 pm build.<\/li>\n<\/ul>\n<p><strong>Name who checks every step.<\/strong> The step that does the work should not be the only thing that checks it. For example, Annie's watchdog repairs one kind of broken link. After each repair it runs its own check again, and it reports a fix only if that check passes. Module 10 covers this in full.<\/p>\n<p><strong>Find the step that would cost you most if it failed without anyone noticing.<\/strong> Give that step its own check first.<\/p>\n<p>Fill in the Build Brief 1 worksheet at the end of this module. Keep it to one page.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-09-s9\"><h2><span class=\"num\">09.9<\/span> Homework: Which Judgement Model for Which Job<\/h2><p><em>Read at home. No class time.<\/em><\/p>\n<p><strong>Model quality changes month to month.<\/strong> This list is about the method, not a fixed ranking. Test models for yourself. These defaults come from research done on 29 Sep 2026.<\/p>\n<ul>\n<li><strong>Reasoning and careful analysis:<\/strong> a top model, or DeepSeek V4 Pro. DeepSeek's V4 models use the MIT licence. The Pro model is the strongest open-weight choice with independent evidence.<\/li>\n<li><strong>Writing and long documents:<\/strong> test two models. Do not assume. Voice matters more than test scores. Annie runs separate models for different writing styles for this reason.<\/li>\n<li><strong>Coding:<\/strong> a top model, or a model made for coding. Coding rewards raw ability more than most jobs do.<\/li>\n<li><strong>Cheap bulk work<\/strong> (sorting, filing, summarising): a small, cheap, fast model. Most of the cost is here, and the small model is usually good enough.<\/li>\n<li><strong>Reading photos:<\/strong> a model that can see images. Check that it really accepts images. A text-only model asked to read a photo will fail or invent an answer.<\/li>\n<li><strong>The widest range from one company:<\/strong> Qwen. It has the most models of the four open-weight makers (DeepSeek, Qwen, GLM and Kimi).<\/li>\n<li><strong>Jobs that run all the time:<\/strong> something cheap that is easy to reach. Do not put an expensive top model behind a job that runs every five minutes.<\/li>\n<\/ul>\n<p><strong>The question to ask is not &quot;which model is best?&quot;<\/strong> Ask: which model is right for this job, and what does it cost when it runs a thousand times?<\/p>\n<\/section>\n<section class=\"card\" id=\"full-09-s10\"><h2><span class=\"num\">09.10<\/span> Lessons From Real Mistakes<\/h2><p>Each line below is one lesson from a real mistake in Annie's own system. The full story behind each one is on the FAQ tab, the last tab at the top of the page.<\/p>\n<ul>\n<li>Test a model on the actions you need. Check what it touched, not what it says.<\/li>\n<li>A bot that says it checked has not always checked correctly. Give any check with a right answer to a script.<\/li>\n<li>A cheap model can be fine at sending and filing, and still too soft to judge. Fix the judgement before you fix the step that records it.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-09-s11\"><h2><span class=\"num\">09.11<\/span> Worksheet: Build Brief 1<\/h2><p><em>Full course.<\/em> Save this as <code>Build Brief 1 — &lt;name&gt;<\/code> in your vault's <code>AI System<\/code> folder.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Section<\/th>\n<th>My answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Goal<\/strong> (one plain paragraph: which chore disappears)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Trigger<\/strong> (what arrives, or what time)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Steps, each with who or what does it<\/strong><\/td>\n<td>1. ___ (script) 2. ___ (script) 3. ___ (judgement) ...<\/td>\n<\/tr>\n<tr>\n<td><strong>Who checks each step<\/strong> (a name, a script or a second check, never &quot;the step itself&quot;)<\/td>\n<td>1. ___ 2. ___ 3. ___<\/td>\n<\/tr>\n<tr>\n<td><strong>The step that would cost most if it failed unnoticed, and its own check<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Facts code must give the model<\/strong> (for every judgement step)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Information involved, and its Data Map tier<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Must never do<\/strong><\/td>\n<td>For example: send anything to another person; delete anything; touch Tier 3 (never) information<\/td>\n<\/tr>\n<tr>\n<td><strong>Needs my approval before<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Done-signal<\/strong> (how I know it worked, without checking by hand)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Acceptance checks<\/strong> (written now, never changed by the builder)<\/td>\n<td>1. 2. 3.<\/td>\n<\/tr>\n<tr>\n<td><strong>How I check it in two minutes<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>How to undo it<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Keep-or-kill date<\/strong> (two weeks after it goes live)<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>", "count": 11, "sess": [4]}, {"id": "full-10", "label": "10", "title": "Module 10: What Breaks, and Keeping It Honest", "minutes": 50, "read": 16, "toc": [["full-10-s1", "10.1", "What You Will Leave With"], ["full-10-s2", "10.2", "What You Need to Prepare"], ["full-10-s3", "10.3", "The Three Ways a System Fails"], ["full-10-s4", "10.4", "Make a Backup and Restore One File"], ["full-10-s5", "10.5", "Choose Your Checks"], ["full-10-s6", "10.6", "Break It on Purpose"], ["full-10-s7", "10.7", "Set a Spending Cap"], ["full-10-s8", "10.8", "Lessons From Real Mistakes"], ["full-10-s9", "10.9", "Worksheet: Keeping It Honest"]], "body": "<div class=\"intro\"><p><strong>Why this module comes here.<\/strong><\/p>\n<ol>\n<li>Students now own a system that can break. In the Full course it is a bot on a server (Module 08B). In the Short course it is an AI assistant on a laptop (Module 08).<\/li>\n<li>The first automation is built in Module 11. So students learn how to check a job before they build one.<\/li>\n<\/ol>\n<\/div>\n<section class=\"card\" id=\"full-10-s1\"><h2><span class=\"num\">10.1<\/span> What You Will Leave With<\/h2><p><strong>Both courses:<\/strong><\/p>\n<ul>\n<li>One failure you have caused on purpose, and seen a check catch.<\/li>\n<li>A written note of what your check cannot see.<\/li>\n<li>A list of every paid account, with a cap on each one that charges per use.<\/li>\n<\/ul>\n<p><strong>Full course only:<\/strong><\/p>\n<ul>\n<li>A backup of your bot, and one file restored from it.<\/li>\n<li>A small watchdog on your server. It runs every hour and stays silent when everything is fine.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-10-s2\"><h2><span class=\"num\">10.2<\/span> What You Need to Prepare<\/h2><ul>\n<li><strong>Full course:<\/strong> your server and bot from Module 08B, working.<\/li>\n<li><strong>Short course:<\/strong> your AI assistant from Module 08, working on your laptop.<\/li>\n<li><strong>Both courses:<\/strong> your run card and your three golden questions from Module 07. Golden questions are test questions with known answers.<\/li>\n<li><strong>Both courses:<\/strong> a list of every account you pay for. Bring the login for each one.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-10-s3\"><h2><span class=\"num\">10.3<\/span> The Three Ways a System Fails<\/h2><p><em>10 minutes, both courses.<\/em><\/p>\n<p>Every failure is one of three kinds. They are not equally dangerous.<\/p>\n<p><strong>1. It stops.<\/strong> The bot does not answer, or the job does not run. You usually notice within a day, because something you expected does not arrive.<\/p>\n<ul>\n<li><strong>The story.<\/strong> Annie's nightly backup also sent a copy to Google Drive.<\/li>\n<li>The upload used a Google sign-in that expired every 7 days. The app behind it was still in Google's &quot;Testing&quot; mode.<\/li>\n<li>The upload failed four mornings in a row. A failure message arrived each morning.<\/li>\n<li>Annie noticed the same message several mornings running and asked if it was a pattern.<\/li>\n<li>The fix moved the upload onto a published app whose sign-in does not expire. Nobody has to sign in again each week.<\/li>\n<\/ul>\n<p><strong>2. It runs, but does the wrong thing.<\/strong> The job finishes and nothing complains. The result is wrong.<\/p>\n<ul>\n<li><strong>The story.<\/strong> Claude told Annie that her storage bot saved its own copy of each photo on the server. That was true.<\/li>\n<li>But the copy sat inside the synced vault. Annie read the answer as &quot;safe to delete the vault folder&quot;, and deleted it.<\/li>\n<li>One sync run removed 411 files everywhere: 262 storage photos, 147 photos for a series of picture books, and 2 other files.<\/li>\n<li>Annie had made the books for her son. She created a series of three books to help him through a big change.<\/li>\n<li>The books drew on the family's written plan for raising her son, with its guiding principles and examples. They also drew on deep research into attachment theory and how very young children cope with big changes.<\/li>\n<li>Her nightly backup had never included the vault.<\/li>\n<li>She got the storage photos back from Obsidian's own version history, which comes with the paid sync plan. She chose not to recover the 147 book photos as the finished books were already saved, so she let the photos go.<\/li>\n<li>The lesson: &quot;a separate copy&quot; means nothing until you know which copies it is separate from.<\/li>\n<\/ul>\n<p><strong>3. It says it worked when it did not.<\/strong> This is the most dangerous kind. The first two make you look for the problem. This one tells you there is nothing to look for.<\/p>\n<ul>\n<li>Two of these stories are also on the FAQ tab. The nightly inbox sorter reported &quot;ok&quot; for weeks while it filed every note into the wrong folder. The learning bot said &quot;That's exactly it&quot; to a wrong answer, after doing no work at all.<\/li>\n<li><strong>The new story.<\/strong> One of Annie's bots cleaned up a set of notes. It reported that the job was done and &quot;nothing dangles&quot;, meaning no links were left broken.<\/li>\n<li>The renames were real. The claim about the links was false.<\/li>\n<li>Annie had deleted a page earlier, and seven notes still linked to it. The bot had never checked.<\/li>\n<\/ul>\n<p>Annie's rule after the inbox sorter story: &quot;a false 'ok' is just as bad or worse than something breaking down.&quot;<\/p>\n<p><strong>What to aim for.<\/strong> You cannot stop every failure. Aim for this instead: every failure should either announce itself, or be caught by a check.<\/p>\n<p><strong>There are two times a failure can happen,<\/strong> so you need two kinds of check.<\/p>\n<ul>\n<li><strong>While the job is running.<\/strong> The job must say so in the same message if it fails. Your rules file from Module 07 already says this: never hide a failure.<\/li>\n<li><strong>When nobody is watching.<\/strong> A job that never ran, or a backup that stopped, sends no message at all. Only a check that runs on a timer can find it. In the Full course, that is the watchdog you write today.<\/li>\n<\/ul>\n<p><strong>Exercise (2 minutes).<\/strong> Name one failure you have already met in this course. Which of the three kinds was it?<\/p>\n<h3>Free and Cheap AI Models<\/h3>\n<p><em>Read this aloud in the Full course if time allows. It is also in the syllabus.<\/em><\/p>\n<p>Telegram, a free model tier, and the laptop you already own will run everything in this course. A free or cheap AI model costs less, but it is not as smart. So give each model the job it does well.<\/p>\n<p>Think about your household. You are the expensive model. You design the whole system for your home and your child: the routines, the rules, and what to do when something goes wrong. Helpers are not paid as highly as we are. They are not paid to design the household system. They are paid to carry out the routine you have set.<\/p>\n<p>AI works the same way. The smarter, more costly model builds the scripts and the rules. The cheap model runs them. When a cheap model was left to make its own judgement calls, it reported work it had not done. Later, all three of my bots ran well on a cheap model, because the scripts and checks were already built. This module shows you how to build those checks.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-10-s4\"><h2><span class=\"num\">10.4<\/span> Make a Backup and Restore One File<\/h2><p><em>10 minutes, Full course. Short course: homework.<\/em><\/p>\n<p><strong>A backup is everything your system needs to run again after the machine is gone.<\/strong> That list is longer than people expect.<\/p>\n<p><strong>Include the logins, not only the files.<\/strong><\/p>\n<ul>\n<li>Annie's builder once checked what her nightly backup contained.<\/li>\n<li>The backup held the bot's whole folder. It did not hold the sync service's login, which lived in a different folder.<\/li>\n<li>A server rebuilt from it would have come back signed out.<\/li>\n<li>The login folders were added to the backup.<\/li>\n<\/ul>\n<p><strong>Leave out what can be downloaded again.<\/strong> Annie's backup once grew to about 2 GB, mostly program files that can be downloaded again. Leaving them out cut it to 184 MB.<\/p>\n<p><strong>The backup copy is as private as the server.<\/strong> Once login files are inside it, anyone who can open the backup can sign in as your bot. Keep it somewhere only you can reach.<\/p>\n<p><strong>Know what each copy holds.<\/strong> The copy of Annie's vault on her server held only notes. Photos, PDFs and scripts never reached it. Later she found 59 files, including 13 baby-book photos, that existed only on her Mac. Every backup she believed she had held only her notes.<\/p>\n<p><strong>Annie's backups have three layers.<\/strong><\/p>\n<ol>\n<li><strong>A whole-server copy<\/strong> kept by the server company. You turned this on in Module 03.<\/li>\n<li><strong>A nightly copy<\/strong> of everything a rebuild needs, made by a plain script at 3 am. It keeps the newest 7.<\/li>\n<li><strong>One copy kept somewhere else,<\/strong> so it survives if the server company loses the server.<\/li>\n<\/ol>\n<p><strong>A backup should message you only when it fails.<\/strong> A daily &quot;backup done&quot; message trains you to stop reading the messages. Then the one that says it failed looks like all the others. But silence is only safe when a check is watching. A backup that stops running also sends nothing. That is why the watchdog you write in this module checks the backup's age.<\/p>\n<h3>Full Course: Do It Now<\/h3>\n<p>Ask your builder:<\/p>\n<pre><code class=\"language-text\">Write a backup script for this server. Include the bot's folder (~/.hermes), the vault sync login, the Claude Code login files and the SSH authorized keys. Leave out virtual environments, caches and anything that can be downloaded again. Keep the newest 7 copies. Message me on Telegram only if it fails. Schedule it every night at 3 am. Then run it once now and show me the file it made.\n<\/code><\/pre>\n<p><strong>Then restore one file.<\/strong> Ask the builder to list what is inside the newest backup (<code>unzip -l<\/code>) and to test it (<code>unzip -t<\/code>). Find your SOUL file in the list. Then ask the builder to copy your SOUL file out of the backup into a test folder, and open it.<\/p>\n<p><strong>Why you restore a file, not just look at the list.<\/strong> In one of Annie's examples, a backup was made before a change, and the change itself never happened. A backup existing proves only that a backup exists. Opening a file from it proves it works.<\/p>\n<p><strong>One copy kept somewhere else is homework.<\/strong> Connecting a cloud account in class takes too long. Ask the builder to suggest a place, and to tell you what access it needs before it sets anything up.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-10-s5\"><h2><span class=\"num\">10.5<\/span> Choose Your Checks<\/h2><p><em>10 minutes, Full course. 5 minutes, Short course.<\/em><\/p>\n<p><strong>Four checks cover most of what can go wrong.<\/strong><\/p>\n<ol>\n<li><strong>Is it running?<\/strong> Did the job run, and does its result exist? This is the cheapest check. It catches only the first kind of failure.<\/li>\n<li><strong>Is the answer still right?<\/strong> Ask your three golden questions again after every change. If an answer changes and you did not change the files, something broke.<\/li>\n<li><strong>Is the important thing still there?<\/strong> The folder exists, the file is present, the backup is recent.<\/li>\n<li><strong>Did it really do the job?<\/strong> Look at the result itself, not at the job's report. Open the file, list the folder, read the message.<\/li>\n<\/ol>\n<p><strong>Check the result, not the report.<\/strong> A job's own message saying &quot;done&quot; is not proof. The result is the proof.<\/p>\n<p><strong>The job that does the work must not be the only thing that checks it.<\/strong> Annie's watchdog fixes one kind of broken link by itself. After each fix it runs its own check again, and it reports &quot;fixed&quot; only if that check passes.<\/p>\n<p><strong>The checker can fail too.<\/strong><\/p>\n<ul>\n<li><strong>The story.<\/strong> Annie had a script that wrote her monthly cost report.<\/li>\n<li>It was being run by the wrong copy of Python, which lacked a part it needed. So it read nothing.<\/li>\n<li>It printed three warnings, then printed &quot;ok&quot;.<\/li>\n<li>An audit also found it had never been scheduled, although an earlier note said it had.<\/li>\n<li>The audit's summary: every fault it found was in the part that reports on the system, not the part that does the work.<\/li>\n<\/ul>\n<p><strong>So write down what your check cannot see.<\/strong> A check with a known gap is useful. A check you believe sees everything is how you get surprised.<\/p>\n<h3>Full Course: A Small Watchdog<\/h3>\n<p>Annie's watchdog, Toby, is a plain script with no AI. It runs every hour and stays silent when everything is fine. Yours starts with three checks.<\/p>\n<p><strong>The rules Toby follows<\/strong>:<\/p>\n<ol>\n<li><strong>Print only problems.<\/strong> If the script prints nothing, you get no message.<\/li>\n<li><strong>Every alert ends with the one thing to do.<\/strong><\/li>\n<li><strong>If a check cannot read what it is checking, it reports a problem.<\/strong> A check that cannot see must never say &quot;ok&quot;.<\/li>\n<li><strong>Always finish without an error code, even when reporting a problem.<\/strong> Toby once ended with an error code when he found a problem. The scheduler then marked Toby's own job as failed, and Toby reported that too, again and again. The alert goes in the message.<\/li>\n<li><strong>Check often, message rarely.<\/strong> Check every hour. Repeat an unfixed problem only every 3 hours.<\/li>\n<li><strong>Stay quiet when nothing is expected.<\/strong> Toby checks that Annie's Mac has sent its sync signal. At 6:35 one morning he raised an alarm: the signal was 600 minutes old. Nothing was broken. The Mac had been asleep all night. Now he stays quiet from 8 pm to 8 am unless the Mac has been silent for more than 14 hours. A check that raises false alarms every morning would train you to ignore it.<\/li>\n<\/ol>\n<p><strong>Your three checks.<\/strong><\/p>\n<ol>\n<li><strong>Is the bot running?<\/strong><\/li>\n<li><strong>Is the newest backup less than 26 hours old, and bigger than a minimum size?<\/strong><\/li>\n<li><strong>Does the server's Claude login expire within 4 days?<\/strong> The server's login lasts about 30 days, and using it does not extend it. Module 08B promised this check.<\/li>\n<\/ol>\n<p>Ask your builder:<\/p>\n<pre><code class=\"language-text\">Write ~/.hermes/scripts/watchdog.py as a plain Python script with no AI.\nCheck 1: the bot is running.\nCheck 2: the newest backup in my backup folder is less than 26 hours old and bigger than [size].\nCheck 3: the Claude Code login on this server expires in more than 4 days.\nRules: print only problems; end each alert with the one action to take; if a check cannot read what it checks, report that as a problem; always exit 0; repeat an unfixed problem only every 3 hours, using a small state file; add a --status option that shows every check and its result.\nShow me the script and run --status. Then schedule it every hour at minute 30, as a job that sends its output to me on Telegram without calling an AI model.\n<\/code><\/pre>\n<p><strong>What success looks like.<\/strong> <code>--status<\/code> shows all three checks as green, and you get no message.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-10-s6\"><h2><span class=\"num\">10.6<\/span> Break It on Purpose<\/h2><p><em>15 minutes, both courses.<\/em><\/p>\n<p><strong>A check that has never gone red has not been tested.<\/strong> Annie's watchdog once gained a check that her skill scripts had not been changed by accident. Her builder changed one script on purpose. The check went red, and the script was put back. On its first real run, the same check found a real script that had gone out of date.<\/p>\n<p><strong>Plant the fault on a copy, never on the live system you depend on<\/strong>.<\/p>\n<h3>Full Course<\/h3>\n<ol>\n<li>Ask the builder to point a copy of the watchdog at an empty test folder in place of the backup folder.<\/li>\n<li>Run the copy with <code>--status<\/code>. The backup check should go red, because the test folder has no backup.<\/li>\n<li>Read the alert. Does it end with the one thing to do?<\/li>\n<li>Delete the copy.<\/li>\n<li>Run the real watchdog with <code>--status<\/code>. All three checks should be green.<\/li>\n<\/ol>\n<h3>Both Courses<\/h3>\n<p><strong>The check that stayed silent is the most useful answer.<\/strong> It shows you a failure your checks cannot see. Write it down in your build log, under &quot;what my checks cannot see&quot;.<\/p>\n<p><strong>Then fix the fault and check again.<\/strong> Every check should go green. If one stays red after the fault is fixed, the check itself is broken.<\/p>\n<p><strong>Check the alarm against reality, too.<\/strong><\/p>\n<ul>\n<li>Once, Toby reported 292 broken links in Annie's vault. Only 15 were real.<\/li>\n<li>The checker was misreading three kinds of link that were correct.<\/li>\n<li>Claude nearly changed 234 rows of Annie's storage list to match the checker. That would have broken working links.<\/li>\n<li>About a week later, Toby reported 249 broken photo links, and this time he was right.<\/li>\n<\/ul>\n<p>Neither the alarm nor the silence is proof. Look at what the alarm points to.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-10-s7\"><h2><span class=\"num\">10.7<\/span> Set a Spending Cap<\/h2><p><em>5 minutes, both courses.<\/em><\/p>\n<p><strong>What it costs me.<\/strong> On average, my whole setup costs me about $57 a month. That covers three bots, a server and the subscriptions behind them. You can do this course for $0.<\/p>\n<p><strong>Why a spending cap matters.<\/strong> One month, my bill was close to $80 instead of the usual $57. Two things happened. First, I was trying my AI assistant on Claude Sonnet, which costs more than the open-weight models I normally use. Second, I had built a script on my server named Toby, my system maintenance checker. Toby is also built to fix some problems automatically. By mistake, the automatic fixes used my API key instead of my Claude Pro subscription, so they billed the API. I found out because I had set a $20 monthly limit on my API key. When the limit was used up, Anthropic paused the key and emailed me.<\/p>\n<p><em>(Module 04 showed the cap. This is the full story. The arithmetic is in the handout.)<\/em><\/p>\n<p><strong>Find the cause before you raise a cap.<\/strong> Claude's first advice was to raise the cap to $30. That was wrong. The account would have run out again within days, before the cause was fixed.<\/p>\n<p><strong>Cap the job, not only the account.<\/strong> The first run of Annie's company-watch job had no limit. It used 92 credits and never finished. Limited to 14 calls, it finished in 12 and used 21 credits. Her rule for Firecrawl: warn before the limit, and never top up automatically.<\/p>\n<p><strong>Exercise.<\/strong><\/p>\n<ol>\n<li>List every account you pay for: server, AI plans, model provider, sync and any web service.<\/li>\n<li>Mark each one: does it charge a flat monthly price, or per use?<\/li>\n<li>A flat price cannot surprise you. Write its price on your run card.<\/li>\n<li>Every account that charges per use gets a cap today. Set it at the figure that would annoy you, not the one that would hurt you.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"full-10-s8\"><h2><span class=\"num\">10.8<\/span> Lessons From Real Mistakes<\/h2><p>Each line below is one lesson from a real mistake in Annie's own system. The full story behind each one is on the FAQ tab, the last tab at the top of the page. More short examples are in this module's handout, the next tab.<\/p>\n<ul>\n<li>A check that a job ran does not check what the job did. Check the result too.<\/li>\n<li>When jobs break after a model change, check the keys and the model names before you blame the model.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-10-s9\"><h2><span class=\"num\">10.9<\/span> Worksheet: Keeping It Honest<\/h2><div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Proof<\/th>\n<th>Course<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>I named one failure I have met, and its kind<\/td>\n<td>My notes<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Backup made, including logins, leaving out downloadable files<\/td>\n<td><code>unzip -l<\/code><\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>One file restored from the backup and opened<\/td>\n<td>My SOUL file opened from the test folder<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Backup copied to a second place, one file restored<\/td>\n<td>Homework<\/td>\n<td>Short<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Watchdog runs every hour and is silent when green<\/td>\n<td><code>--status<\/code><\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Watchdog checks the bot, the backup and the Claude login<\/td>\n<td><code>--status<\/code> lists all three<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>A planted fault made a check go red<\/td>\n<td>I saw it go red<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>What my checks cannot see, written down<\/td>\n<td>My build log<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Every paid account listed, flat or per use<\/td>\n<td>The table below<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>A cap on every account that charges per use<\/td>\n<td>The account's settings page<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>My paid accounts:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Account<\/th>\n<th>Price per month<\/th>\n<th>Flat or per use?<\/th>\n<th>Cap set?<\/th>\n<th>Where the cap is set<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>What my checks cannot see:<\/strong><\/p>\n<ol>\n<li>\n<hr />\n<\/li>\n<li>\n<hr />\n<\/li>\n<\/ol>\n<\/section>", "count": 9, "sess": [4]}, {"id": "full-10h", "label": "10 Handout", "title": "Handout: What Broke in Annie's System", "minutes": null, "read": 5, "toc": [["full-10h-s1", "10H.1", "Two Rules"], ["full-10h-s2", "10H.2", "It Stopped"], ["full-10h-s3", "10H.3", "It Ran, but Did the Wrong Thing"], ["full-10h-s4", "10H.4", "It Said It Worked When It Did Not"], ["full-10h-s5", "10H.5", "The Checker Failed Too"], ["full-10h-s6", "10H.6", "Backups"], ["full-10h-s7", "10H.7", "When a Bot Looks Fine but Is Stuck"], ["full-10h-s8", "10H.8", "Keys and Passwords"], ["full-10h-s9", "10H.9", "Cost"]], "body": "<div class=\"intro\"><p><em>A handout for Module 10, both courses. One page, read at home. Each line is one real failure from Annie's own system. The stories told in class are not repeated here.<\/em><\/p>\n<\/div>\n<section class=\"card\" id=\"full-10h-s1\"><h2><span class=\"num\">10H.1<\/span> Two Rules<\/h2><ol>\n<li><strong>Check the result, not the report.<\/strong> A job saying &quot;done&quot; is not proof. Open the file, list the folder or read the message it produced.<\/li>\n<li><strong>The job that does the work must not be the only thing that checks it.<\/strong> Use something separate: a second check, a separate measurement, or a person looking.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"full-10h-s2\"><h2><span class=\"num\">10H.2<\/span> It Stopped<\/h2><ul>\n<li>An error handler that caught every error hid a missing import. So the sync function crashed on every call and had never worked once.<\/li>\n<li>The daily learning card crashed, because the bot re-saved its own file in a shape the script could not read.<\/li>\n<li>The vault sync jammed for six hours behind one frozen process.<\/li>\n<li>A vault reorganisation broke file addresses in four ways, including links outside the vault that a vault search could not find.<\/li>\n<li>Three Google accounts failed with the same error. One account failing points to its login. Every account failing points to the app.<\/li>\n<li>The server's Claude login expired without warning after about 30 days, while chat on the phone still worked. The watchdog now warns 4 days ahead.<\/li>\n<li>Moving to a new model provider broke three jobs, because keys and model names did not carry across. Only two of the three bots had changed model.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-10h-s3\"><h2><span class=\"num\">10H.3<\/span> It Ran, but Did the Wrong Thing<\/h2><ul>\n<li>The nightly sorter suggested the same inbox notes again every night.<\/li>\n<li>A second &quot;10 pm&quot; reminder that nobody had scheduled turned out to be the bot re-sending files when Annie replied &quot;done&quot;.<\/li>\n<li>A folder move left the old address in three files, so the bot found no deal documents for three weeks and said nothing.<\/li>\n<li>Adding one storage unit meant editing five places. Missing any one would leave a gap nobody would see.<\/li>\n<li>Before five notes were deleted, a search of the whole vault found one other note linking to all five. It was fixed first. This failure was prevented.<\/li>\n<li>The watchdog reported 249 broken photo links, and they were real. No step copied the photos into the vault.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-10h-s4\"><h2><span class=\"num\">10H.4<\/span> It Said It Worked When It Did Not<\/h2><ul>\n<li>After 36 days with no restarts, the bot looked healthy. Its sorter was failing on a usage limit, and its memory was full: 2,201 of 2,200 characters.<\/li>\n<li>A builder reported all tests passing. Its invoice code had 6 bugs, 4 of them fatal, and the main path had never run from start to finish.<\/li>\n<li>The bot fixed its rules correctly, but the job's own stored instruction said &quot;EXACTLY this format&quot;. So the morning message never changed.<\/li>\n<li>A nightly sync reported success for about four weeks while copying zero files. A folder move had broken its path.<\/li>\n<li>The bot sometimes said &quot;got it&quot; without saving the note. Now it saves, checks the file exists, and replies with where it saved it.<\/li>\n<li>&quot;save&quot; and &quot;write a build log&quot; became scripts that check their own writes on the disk. This failure was prevented.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-10h-s5\"><h2><span class=\"num\">10H.5<\/span> The Checker Failed Too<\/h2><ul>\n<li>The watchdog's first version ended with an error code when it found a problem. Then it reported its own job as failed, again and again.<\/li>\n<li>The bot must now report a failure in the same message. The watchdog looks for the failures nobody sees, every hour, at no cost.<\/li>\n<li>The cost meter logged every call to two Claude models at $0 for two months, because its price list did not include them.<\/li>\n<li>The watchdog now fixes broken vault links itself, with a $1 limit. It reports &quot;fixed&quot; only after its own check passes.<\/li>\n<li>The watchdog twice reported two healthy bots as down, because it read old status files.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-10h-s6\"><h2><span class=\"num\">10H.6<\/span> Backups<\/h2><ul>\n<li>The backup has three layers: a nightly copy on the server, a copy on Google Drive, and a message that arrives only if it fails. No AI model is involved.<\/li>\n<li>59 files, including 13 baby-book photos, existed only on Annie's Mac. A daily copy from the Mac to the server now runs.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-10h-s7\"><h2><span class=\"num\">10H.7<\/span> When a Bot Looks Fine but Is Stuck<\/h2><ul>\n<li>One of Annie's bots showed as &quot;running&quot; for 12 hours while receiving nothing. Its program never stopped, so the automatic restart never started.<\/li>\n<li>A healthy bot keeps at least 2 open connections to Telegram. A stuck one keeps none.<\/li>\n<li>A separate script now checks every 5 minutes and restarts a bot with no connections. If it has to restart the same bot 3 times in 2 hours, it tells Annie.<\/li>\n<li><strong>Keep the list of automatic fixes short.<\/strong> Toby fixes only a few kinds of problem by himself. A dead backup, a stuck bot or an expired login still go to Annie.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-10h-s8\"><h2><span class=\"num\">10H.8<\/span> Keys and Passwords<\/h2><ul>\n<li><strong>Never print a key.<\/strong> When you look at settings, show the names of keys, not their values.<\/li>\n<li><strong>Keep each key in one place.<\/strong> A key copied into several files must be changed in all of them. A half-finished change stops bots without warning.<\/li>\n<li><strong>Change a key when any of these happens<\/strong>:\n<ol>\n<li>A session is shared or shown to anyone.<\/li>\n<li>A new device joins your private network.<\/li>\n<li>A paid balance falls faster than your use explains.<\/li>\n<li>The server gains a second user.<\/li>\n<\/ol>\n<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-10h-s9\"><h2><span class=\"num\">10H.9<\/span> Cost<\/h2><ul>\n<li>Measured from three meters in July 2026, running costs were about $14 a month in AI use plus $18 for the server. Building it cost about $85 to $90.<\/li>\n<\/ul>\n<p><strong>The month the bill reached about $80, in full.<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Line<\/th>\n<th>Amount<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Fixed subscriptions: server, server backup, Claude Pro, Obsidian Sync, VPN, the $10 model plan for the bots<\/td>\n<td>$55.67<\/td>\n<\/tr>\n<tr>\n<td>Bot use recorded by each bot's meter (the biggest line: the main bot on Claude Sonnet, $8.36)<\/td>\n<td>$11.55<\/td>\n<\/tr>\n<tr>\n<td><strong>Recorded by the cost note<\/strong><\/td>\n<td><strong>$67.22<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Anthropic API bill not recorded: $20.61, less the $8.36 already counted<\/td>\n<td>$12.25<\/td>\n<\/tr>\n<tr>\n<td><strong>Real total<\/strong><\/td>\n<td><strong>$79.47<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Of the $12.25, about $11 most likely came from Toby's automatic fixes using the API key by mistake, plus testing that day. One run by another assistant cost $1.30.<\/li>\n<li>The three months before it were $56.65, $55.69 and $57.97. That is about $57 on average. Those months may read slightly low, because the meter priced some Claude calls at $0 at the time.<\/li>\n<\/ul>\n<\/section>", "count": 9, "sess": [4]}, {"id": "full-11", "label": "11", "title": "Module 11: Growing It, Skills and Schedules", "minutes": 85, "read": 14, "toc": [["full-11-s1", "11.1", "What You Will Leave With"], ["full-11-s2", "11.2", "What You Need to Prepare"], ["full-11-s3", "11.3", "Add One Thing at a Time, and Saying No to a New Tool"], ["full-11-s4", "11.4", "How a Scheduled Job Sends Its Message"], ["full-11-s5", "11.5", "Build the Scheduled Job"], ["full-11-s6", "11.6", "Build and Test One Skill"], ["full-11-s7", "11.7", "Shown, Not Built: A Model on a Schedule"], ["full-11-s8", "11.8", "Set the Keep-or-Kill Date"], ["full-11-s9", "11.9", "Lessons From Real Mistakes"], ["full-11-s10", "11.10", "Worksheet: Growing It"]], "body": "<div class=\"intro\"><p><strong>Why this module comes here.<\/strong><\/p>\n<ol>\n<li>Students now own a working system (Module 08, and Module 08B in the Full course).<\/li>\n<li>They have sorted their steps into script, model and person (Module 09).<\/li>\n<li>They have seen how a system fails and how a check catches it (Module 10).<\/li>\n<li>So now they can add to it safely.<\/li>\n<\/ol>\n<p><strong>What each course builds.<\/strong><\/p>\n<ul>\n<li><strong>Full course (server):<\/strong> a scheduled job that sends a message to Telegram, then a skill. Each one is tested before the next one starts.<\/li>\n<li><strong>Short course (laptop):<\/strong> a skill. A laptop schedule only runs while the laptop is awake, so the schedule is shown, not built.<\/li>\n<\/ul>\n<\/div>\n<section class=\"card\" id=\"full-11-s1\"><h2><span class=\"num\">11.1<\/span> What You Will Leave With<\/h2><p><strong>Both courses:<\/strong><\/p>\n<ul>\n<li>One skill that works when you ask for it, tested three ways.<\/li>\n<li>One tool you decided not to add, with your reason written down.<\/li>\n<\/ul>\n<p><strong>Full course only:<\/strong><\/p>\n<ul>\n<li>One scheduled job that runs without you and sends its result to Telegram. It stays silent when there is nothing to say, and it tells you when it fails.<\/li>\n<li>A keep-or-kill date in your calendar, two weeks from today.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-11-s2\"><h2><span class=\"num\">11.2<\/span> What You Need to Prepare<\/h2><ul>\n<li><strong>Full course:<\/strong> your server and bot from Module 08B, working. Build Brief 1 from Module 09.<\/li>\n<li><strong>Short course:<\/strong> your AI assistant from Module 08, working on your laptop. The five-row Build Brief you wrote at home after Module 09.<\/li>\n<li><strong>Both courses:<\/strong> your run card.<\/li>\n<\/ul>\n<p><strong>If your brief is not ready, use the umbrella example.<\/strong> It answers one question: do I need an umbrella today in Hong Kong? It uses the free Open-Meteo weather service, which needs no account and no key. It is a small version of Annie's own weather job.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-11-s3\"><h2><span class=\"num\">11.3<\/span> Add One Thing at a Time, and Saying No to a New Tool<\/h2><p><em>10 minutes, both courses.<\/em><\/p>\n<h3>Add One Thing at a Time<\/h3>\n<p><strong>Add one new thing. Test it. Use it for a few days. Then add the next.<\/strong><\/p>\n<p><strong>Why:<\/strong> Annie's first bot broke down. Its cheap AI model could not use its tools reliably. It said tasks were done when they were not: Annie calls this &quot;faked success&quot;. Finding the fix took about a week of Annie's own research. The clean-up took 13 logged hours more.<\/p>\n<p>The rule from her rebuild notes: <strong>&quot;Don't add features in batches.&quot;<\/strong> Her rebuilt bot started with three things: the soul file, the rules and one reminder. Her plan was to live with it for 24 to 48 hours before building more.<\/p>\n<p><strong>The reason the rule works.<\/strong> If you add one thing and something breaks, there is one place to look. If you add three things, there are three places to look, and they can affect each other.<\/p>\n<p><strong>Full course: you add two things today.<\/strong> That is allowed, because you finish and test the scheduled job before you start the skill. Do not start the skill until the job has passed its test.<\/p>\n<h3>Saying No to a New Tool<\/h3>\n<p>New AI tools appear every week. Most of them will be offered to you as something you need.<\/p>\n<p><strong>Annie's example.<\/strong> Someone she works with once asked whether she used the Hermes desktop app. He said it could read all the files on her computer. She checked it and decided not to add it. Her four reasons:<\/p>\n<ol>\n<li><strong>She could already do it.<\/strong> Claude Code already read her files and her vault, and reached her server.<\/li>\n<li><strong>Her phone was already covered.<\/strong> Her bot on Telegram already reached her anywhere.<\/li>\n<li><strong>Her own setup was better.<\/strong> She asked: <em>&quot;even if I used Codex, wouldn't I just connect it to Obsidian or a shared folder both tools read, like I do now?&quot;<\/em> She was right. Her notes and rules live in her own vault, so any tool can read them, and no company holds them.<\/li>\n<li><strong>It would cost her more than it gave.<\/strong> It meant a second AI assistant that was not her main one, a new way into her system, and a large update to her live server.<\/li>\n<\/ol>\n<p><strong>Exercise.<\/strong> Write down one tool you have been tempted to add. Answer two questions:<\/p>\n<ol>\n<li>What would it let me do that I cannot do now?<\/li>\n<li>What would I have to look after if I added it?<\/li>\n<\/ol>\n<p>If the first answer is &quot;nothing new&quot;, the answer is no for now. Write the reason on your run card.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-11-s4\"><h2><span class=\"num\">11.4<\/span> How a Scheduled Job Sends Its Message<\/h2><p><em>5 minutes, Full course only.<\/em><\/p>\n<p><strong>A scheduled job<\/strong> runs at set times without you. It is a timer plus a script.<\/p>\n<p><strong>In Hermes, whatever the script prints becomes the Telegram message.<\/strong> If it prints nothing, nothing is sent. Annie's server lists each of t
