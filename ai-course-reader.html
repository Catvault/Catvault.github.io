p>\n<p><strong>Script.<\/strong><\/p>\n<ul>\n<li>What it is: code that follows fixed steps.<\/li>\n<li>Good for: anything with a right answer. Times, counts, renames, overlaps and file moves.<\/li>\n<li>Annie's examples: the weather planner, the receipt scan and rename, the watchdog's checks, the overlap checker.<\/li>\n<li>Cost per run: $0.<\/li>\n<\/ul>\n<p><strong>Single-task model<\/strong> (machine learning).<\/p>\n<ul>\n<li>What it is: a small AI model trained to do one job only.<\/li>\n<li>Good for: turning messy input into data. Speech to text, reading a photo, sorting into a category.<\/li>\n<li>Annie's examples: voice notes transcribed on the server, and an 80-minute talk transcribed on the Mac with no internet.<\/li>\n<li>Cost per run: very small, or $0 if it runs on your own machine.<\/li>\n<\/ul>\n<p><strong>Judgement model<\/strong> (a large language model).<\/p>\n<ul>\n<li>What it is: a general AI model that reads and writes.<\/li>\n<li>Good for: decisions that depend on context, and writing in a voice.<\/li>\n<li>Annie's examples: grading a learning answer; finding the week's most useful idea; drafting a reply; the nightly filing job, which decides which folder each note belongs in.<\/li>\n<li>Cost per run: cents, and more for top models.<\/li>\n<\/ul>\n<p><strong>Person.<\/strong><\/p>\n<ul>\n<li>What it is: you, or someone you trust.<\/li>\n<li>Good for: approvals, anything that reaches another person, and sensitive submissions.<\/li>\n<li>Annie's examples: sending any email; submitting an insurance claim.<\/li>\n<li>Cost per run: your time.<\/li>\n<\/ul>\n<p><strong>The single-task model is the one people forget.<\/strong> It sits between a script and a full AI model.<\/p>\n<ul>\n<li>Annie's laptop turned an 80-minute recorded talk into 14,427 words of text.<\/li>\n<li>It used a free speech-to-text program called whisper.cpp.<\/li>\n<li>Nothing left the machine. So it needed no VPN and no account.<\/li>\n<li>Her server transcribes voice notes sent to the bot in the same way.<\/li>\n<\/ul>\n<p><strong>Keep a person on any step where a silent failure would touch sensitive data.<\/strong> Annie wanted her bot to file insurance claims from start to finish. Her decision was this:<\/p>\n<ul>\n<li>The bot finds the receipt, downloads it and tells her.<\/li>\n<li>She submits the claim herself.<\/li>\n<li>The reason: insurers' websites block automated browsers, and a failure there could go unnoticed.<\/li>\n<\/ul>\n<p><strong>A scheduled job should not wake the AI just to ask you something.<\/strong> Annie's rule from day one: scheduled jobs are scripts, or scripts that hand a small task to a cheap model. Her first bot ended partly because AI prompts ran on timers and billed a paid account every day. If you want judgement, make it something you ask for when you need it.<\/p>\n<p><strong>Annie wrote this down as three cost levels for her bot's jobs:<\/strong><\/p>\n<ol>\n<li><strong>Level 1: a plain script, with no AI.<\/strong> This is the cheapest, and it is the default.<\/li>\n<li><strong>Level 2: a script plus a small, cheap model.<\/strong> This is for light formatting and reading.<\/li>\n<li><strong>Level 3: the good, expensive model.<\/strong> This is for live conversation with Annie only.<\/li>\n<\/ol>\n<p>Scheduled jobs use Level 1 or Level 2. They never run the expensive model on a timer. Her notes add a second rule. Heavy building belongs on the powerful, expensive builder, because that is where the real work happens. The bot's job is to be reachable on the phone, so a cheap model is the right choice for it.<\/p>\n<p><strong>Where judgement is needed, let a script do the work around it.<\/strong> Annie's weekly idea job (Phoebe) needs real judgement. It runs in three steps:<\/p>\n<ol>\n<li>A script gathers her notes first, with no AI.<\/li>\n<li>Only then does it call Claude to think.<\/li>\n<li>Afterwards, the script checks that the weekly note actually exists before it reports success.<\/li>\n<\/ol>\n<h3>Practice: Sort Eight Example Steps<\/h3>\n<p>The facilitator hands out eight example steps, one per card. Decide whether each one is done by a script, a single-task model, a judgement model or a person. Then compare with a partner.<\/p>\n<ol>\n<li>Check whether a 3 pm call clashes with anything on your calendar.<\/li>\n<li>Rename a downloaded PDF to 15 characters or fewer.<\/li>\n<li>Turn a voice note into text.<\/li>\n<li>Decide which of this week's ten ideas is most worth your time.<\/li>\n<li>Send a reply to a client.<\/li>\n<li>Count how many items are in your storage inventory.<\/li>\n<li>Read a photo of a warranty card and pull out the serial number.<\/li>\n<li>Decide whether an email from your child's school needs action today.<\/li>\n<\/ol>\n<p><strong>Suggested answers.<\/strong><\/p>\n<ul>\n<li>Script: 1, 2 and 6.<\/li>\n<li>Single-task model: 3 and 7.<\/li>\n<li>Judgement model: 4 and 8.<\/li>\n<li>Person: 5.<\/li>\n<\/ul>\n<p>Deciding about the school email can move towards a script if the school uses the same subject lines every time.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-09-s5\"><h2><span class=\"num\">09.5<\/span> Mark Your Process Maps<\/h2><p>Put one coloured dot on every step of your maps. The colour says who or what does that step.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Dot<\/th>\n<th>Who or what does the step<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Green<\/td>\n<td>Script<\/td>\n<\/tr>\n<tr>\n<td>Blue<\/td>\n<td>Single-task model<\/td>\n<\/tr>\n<tr>\n<td>Red<\/td>\n<td>Judgement model<\/td>\n<\/tr>\n<tr>\n<td>Black<\/td>\n<td>Person<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Question every red dot.<\/strong> A red dot means you marked the step for a judgement model. For each one, ask: could a script do this if it were given the right facts? Two of Annie's examples:<\/p>\n<ul>\n<li>Her overlap check started as a judgement step. It became a script.<\/li>\n<li>Her storage photos started with an AI description. They ended with none, because she preferred her own words.<\/li>\n<\/ul>\n<p><strong>Mark what the model needs to be told.<\/strong> Beside every red dot, write the facts a script should hand the model first.<\/p>\n<ul>\n<li>Once, Annie's bot invented an answer about which class slot suited her son.<\/li>\n<li>It had no nap times and no rules to check against.<\/li>\n<li>The fix supplied the facts and a numbered checking procedure.<\/li>\n<li>Then the bot was tested against an answer worked out separately.<\/li>\n<\/ul>\n<p><strong>Then circle your best candidate for a first automation.<\/strong> A good first candidate:<\/p>\n<ul>\n<li>has a clear trigger<\/li>\n<li>is mostly green dots, which means mostly script steps<\/li>\n<li>happens at least weekly<\/li>\n<li>causes small harm if it goes wrong<\/li>\n<li>uses only Tier 1 (open) or Tier 2 (personal) information from your Data Map<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-09-s6\"><h2><span class=\"num\">09.6<\/span> Homework: Which Judgement Model for Which Job<\/h2><p><em>Read at home. No class time.<\/em><\/p>\n<p><strong>Model quality changes month to month.<\/strong> This list is about the method, not a fixed ranking. Test models for yourself. These defaults come from research done on 29 Sep 2026.<\/p>\n<ul>\n<li><strong>Reasoning and careful analysis:<\/strong> a top model, or DeepSeek V4 Pro. DeepSeek's V4 models use the MIT licence. The Pro model is the strongest open-weight choice with independent evidence.<\/li>\n<li><strong>Writing and long documents:<\/strong> test two models. Do not assume. Voice matters more than test scores. Annie runs separate models for different writing styles for this reason.<\/li>\n<li><strong>Coding:<\/strong> a top model, or a model made for coding. Coding rewards raw ability more than most jobs do.<\/li>\n<li><strong>Cheap bulk work<\/strong> (sorting, filing, summarising): a small, cheap, fast model. Most of the cost is here, and the small model is usually good enough.<\/li>\n<li><strong>Reading photos:<\/strong> a model that can see images. Check that it really accepts images. A text-only model asked to read a photo will fail or invent an answer.<\/li>\n<li><strong>The widest range from one company:<\/strong> Qwen. It has the most models of the four open-weight makers (DeepSeek, Qwen, GLM and Kimi).<\/li>\n<li><strong>Jobs that run all the time:<\/strong> something cheap that is easy to reach. Do not put an expensive top model behind a job that runs every five minutes.<\/li>\n<\/ul>\n<p><strong>The question to ask is not &quot;which model is best?&quot;<\/strong> Ask: which model is right for this job, and what does it cost when it runs a thousand times?<\/p>\n<\/section>\n<section class=\"card\" id=\"short-09-s7\"><h2><span class=\"num\">09.7<\/span> Lessons From Real Mistakes<\/h2><p>Each line below is one lesson from a real mistake in Annie's own system. The full story behind each one is on the FAQ tab, the last tab at the top of the page.<\/p>\n<ul>\n<li>Test a model on the actions you need. Check what it touched, not what it says.<\/li>\n<li>A bot that says it checked has not always checked correctly. Give any check with a right answer to a script.<\/li>\n<li>A cheap model can be fine at sending and filing, and still too soft to judge. Fix the judgement before you fix the step that records it.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-09-s8\"><h2><span class=\"num\">09.8<\/span> Worksheet: Short Course Build Brief (Homework)<\/h2><p><em>Short course.<\/em> This is the Full course brief, cut to five rows. Do it at home after this module. Save it as <code>Build Brief 1 — &lt;name&gt;<\/code> in your vault's <code>AI System<\/code> folder.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Section<\/th>\n<th>My answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Goal<\/strong> (one plain paragraph: which chore disappears)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Trigger<\/strong> (what arrives, or what time)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Steps, each with who or what does it<\/strong> (script, single-task model, judgement model or person)<\/td>\n<td>1. ___ (script) 2. ___ (script) 3. ___ (judgement) ...<\/td>\n<\/tr>\n<tr>\n<td><strong>Who checks each step<\/strong> (a name, a script or a second check, never &quot;the step itself&quot;)<\/td>\n<td>1. ___ 2. ___ 3. ___<\/td>\n<\/tr>\n<tr>\n<td><strong>Done-signal<\/strong> (how I know it worked, without checking by hand)<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Why these five rows.<\/strong> They are the minimum a brief needs when time runs short. They are enough for pi to build from. The other Full course rows (what it must never do, approvals, acceptance checks, how to undo it, a keep-or-kill date) are covered in Module 11 before anything is built.<\/p>\n<\/section>", "count": 8, "sess": [4]}, {"id": "short-10", "label": "10", "title": "Module 10: What Breaks, and Keeping It Honest", "minutes": 35, "read": 13, "toc": [["short-10-s1", "10.1", "What You Will Leave With"], ["short-10-s2", "10.2", "What You Need to Prepare"], ["short-10-s3", "10.3", "The Three Ways a System Fails"], ["short-10-s4", "10.4", "Make a Backup and Restore One File"], ["short-10-s5", "10.5", "Choose Your Checks"], ["short-10-s6", "10.6", "Break It on Purpose"], ["short-10-s7", "10.7", "Set a Spending Cap"], ["short-10-s8", "10.8", "Lessons From Real Mistakes"], ["short-10-s9", "10.9", "Worksheet: Keeping It Honest"]], "body": "<div class=\"intro\"><p><strong>Why this module comes here.<\/strong><\/p>\n<ol>\n<li>Students now own a system that can break. In the Full course it is a bot on a server (Module 08B). In the Short course it is an AI assistant on a laptop (Module 08).<\/li>\n<li>The first automation is built in Module 11. So students learn how to check a job before they build one.<\/li>\n<\/ol>\n<\/div>\n<section class=\"card\" id=\"short-10-s1\"><h2><span class=\"num\">10.1<\/span> What You Will Leave With<\/h2><p><strong>Both courses:<\/strong><\/p>\n<ul>\n<li>One failure you have caused on purpose, and seen a check catch.<\/li>\n<li>A written note of what your check cannot see.<\/li>\n<li>A list of every paid account, with a cap on each one that charges per use.<\/li>\n<\/ul>\n<p><strong>Short course only, as homework:<\/strong><\/p>\n<ul>\n<li>A copy of your AI assistant's folder in a second place, and one file restored from it.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-10-s2\"><h2><span class=\"num\">10.2<\/span> What You Need to Prepare<\/h2><ul>\n<li><strong>Full course:<\/strong> your server and bot from Module 08B, working.<\/li>\n<li><strong>Short course:<\/strong> your AI assistant from Module 08, working on your laptop.<\/li>\n<li><strong>Both courses:<\/strong> your run card and your three golden questions from Module 07. Golden questions are test questions with known answers.<\/li>\n<li><strong>Both courses:<\/strong> a list of every account you pay for. Bring the login for each one.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-10-s3\"><h2><span class=\"num\">10.3<\/span> The Three Ways a System Fails<\/h2><p><em>10 minutes, both courses.<\/em><\/p>\n<p>Every failure is one of three kinds. They are not equally dangerous.<\/p>\n<p><strong>1. It stops.<\/strong> The bot does not answer, or the job does not run. You usually notice within a day, because something you expected does not arrive.<\/p>\n<ul>\n<li><strong>The story.<\/strong> Annie's nightly backup also sent a copy to Google Drive.<\/li>\n<li>The upload used a Google sign-in that expired every 7 days. The app behind it was still in Google's &quot;Testing&quot; mode.<\/li>\n<li>The upload failed four mornings in a row. A failure message arrived each morning.<\/li>\n<li>Annie noticed the same message several mornings running and asked if it was a pattern.<\/li>\n<li>The fix moved the upload onto a published app whose sign-in does not expire. Nobody has to sign in again each week.<\/li>\n<\/ul>\n<p><strong>2. It runs, but does the wrong thing.<\/strong> The job finishes and nothing complains. The result is wrong.<\/p>\n<ul>\n<li><strong>The story.<\/strong> Claude told Annie that her storage bot saved its own copy of each photo on the server. That was true.<\/li>\n<li>But the copy sat inside the synced vault. Annie read the answer as &quot;safe to delete the vault folder&quot;, and deleted it.<\/li>\n<li>One sync run removed 411 files everywhere: 262 storage photos, 147 photos for a series of picture books, and 2 other files.<\/li>\n<li>Annie had made the books for her son. She created a series of three books to help him through a big change.<\/li>\n<li>The books drew on the family's written plan for raising her son, with its guiding principles and examples. They also drew on deep research into attachment theory and how very young children cope with big changes.<\/li>\n<li>Her nightly backup had never included the vault.<\/li>\n<li>She got the storage photos back from Obsidian's own version history, which comes with the paid sync plan. She chose not to recover the 147 book photos as the finished books were already saved, so she let the photos go.<\/li>\n<li>The lesson: &quot;a separate copy&quot; means nothing until you know which copies it is separate from.<\/li>\n<\/ul>\n<p><strong>3. It says it worked when it did not.<\/strong> This is the most dangerous kind. The first two make you look for the problem. This one tells you there is nothing to look for.<\/p>\n<ul>\n<li>Two of these stories are also on the FAQ tab. The nightly inbox sorter reported &quot;ok&quot; for weeks while it filed every note into the wrong folder. The learning bot said &quot;That's exactly it&quot; to a wrong answer, after doing no work at all.<\/li>\n<li><strong>The new story.<\/strong> One of Annie's bots cleaned up a set of notes. It reported that the job was done and &quot;nothing dangles&quot;, meaning no links were left broken.<\/li>\n<li>The renames were real. The claim about the links was false.<\/li>\n<li>Annie had deleted a page earlier, and seven notes still linked to it. The bot had never checked.<\/li>\n<\/ul>\n<p>Annie's rule after the inbox sorter story: &quot;a false 'ok' is just as bad or worse than something breaking down.&quot;<\/p>\n<p><strong>What to aim for.<\/strong> You cannot stop every failure. Aim for this instead: every failure should either announce itself, or be caught by a check.<\/p>\n<p><strong>There are two times a failure can happen,<\/strong> so you need two kinds of check.<\/p>\n<ul>\n<li><strong>While the job is running.<\/strong> The job must say so in the same message if it fails. Your rules file from Module 07 already says this: never hide a failure.<\/li>\n<li><strong>When nobody is watching.<\/strong> A job that never ran, or a backup that stopped, sends no message at all. Only a check that runs on a timer can find it. In the Full course, that is the watchdog you write today.<\/li>\n<\/ul>\n<p><strong>Exercise (2 minutes).<\/strong> Name one failure you have already met in this course. Which of the three kinds was it?<\/p>\n<h3>Free and Cheap AI Models<\/h3>\n<p><em>Read this aloud in the Full course if time allows. It is also in the syllabus.<\/em><\/p>\n<p>Telegram, a free model tier, and the laptop you already own will run everything in this course. A free or cheap AI model costs less, but it is not as smart. So give each model the job it does well.<\/p>\n<p>Think about your household. You are the expensive model. You design the whole system for your home and your child: the routines, the rules, and what to do when something goes wrong. Helpers are not paid as highly as we are. They are not paid to design the household system. They are paid to carry out the routine you have set.<\/p>\n<p>AI works the same way. The smarter, more costly model builds the scripts and the rules. The cheap model runs them. When a cheap model was left to make its own judgement calls, it reported work it had not done. Later, all three of my bots ran well on a cheap model, because the scripts and checks were already built. This module shows you how to build those checks.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-10-s4\"><h2><span class=\"num\">10.4<\/span> Make a Backup and Restore One File<\/h2><p><em>10 minutes, Full course. Short course: homework.<\/em><\/p>\n<p><strong>A backup is everything your system needs to run again after the machine is gone.<\/strong> That list is longer than people expect.<\/p>\n<p><strong>Include the logins, not only the files.<\/strong><\/p>\n<ul>\n<li>Annie's builder once checked what her nightly backup contained.<\/li>\n<li>The backup held the bot's whole folder. It did not hold the sync service's login, which lived in a different folder.<\/li>\n<li>A server rebuilt from it would have come back signed out.<\/li>\n<li>The login folders were added to the backup.<\/li>\n<\/ul>\n<p><strong>Leave out what can be downloaded again.<\/strong> Annie's backup once grew to about 2 GB, mostly program files that can be downloaded again. Leaving them out cut it to 184 MB.<\/p>\n<p><strong>The backup copy is as private as the server.<\/strong> Once login files are inside it, anyone who can open the backup can sign in as your bot. Keep it somewhere only you can reach.<\/p>\n<p><strong>Know what each copy holds.<\/strong> The copy of Annie's vault on her server held only notes. Photos, PDFs and scripts never reached it. Later she found 59 files, including 13 baby-book photos, that existed only on her Mac. Every backup she believed she had held only her notes.<\/p>\n<p><strong>Annie's backups have three layers.<\/strong><\/p>\n<ol>\n<li><strong>A whole-server copy<\/strong> kept by the server company. You turned this on in Module 03.<\/li>\n<li><strong>A nightly copy<\/strong> of everything a rebuild needs, made by a plain script at 3 am. It keeps the newest 7.<\/li>\n<li><strong>One copy kept somewhere else,<\/strong> so it survives if the server company loses the server.<\/li>\n<\/ol>\n<p><strong>A backup should message you only when it fails.<\/strong> A daily &quot;backup done&quot; message trains you to stop reading the messages. Then the one that says it failed looks like all the others. But silence is only safe when a check is watching. A backup that stops running also sends nothing. That is why the watchdog you write in this module checks the backup's age.<\/p>\n<h3>Short Course: Homework<\/h3>\n<ol>\n<li>Copy your whole <code>My AI Assistant<\/code> folder to a second place: a USB drive, or a cloud folder you already use.<\/li>\n<li>Put the date in the copy's name, for example <code>My AI Assistant backup 2026-11-02<\/code>.<\/li>\n<li>Restore one file. Delete a test file from the real folder, then copy it back from the backup. Open it.<\/li>\n<li>Write on your run card where the backup is and when you made it.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"short-10-s5\"><h2><span class=\"num\">10.5<\/span> Choose Your Checks<\/h2><p><em>10 minutes, Full course. 5 minutes, Short course.<\/em><\/p>\n<p><strong>Four checks cover most of what can go wrong.<\/strong><\/p>\n<ol>\n<li><strong>Is it running?<\/strong> Did the job run, and does its result exist? This is the cheapest check. It catches only the first kind of failure.<\/li>\n<li><strong>Is the answer still right?<\/strong> Ask your three golden questions again after every change. If an answer changes and you did not change the files, something broke.<\/li>\n<li><strong>Is the important thing still there?<\/strong> The folder exists, the file is present, the backup is recent.<\/li>\n<li><strong>Did it really do the job?<\/strong> Look at the result itself, not at the job's report. Open the file, list the folder, read the message.<\/li>\n<\/ol>\n<p><strong>Check the result, not the report.<\/strong> A job's own message saying &quot;done&quot; is not proof. The result is the proof.<\/p>\n<p><strong>The job that does the work must not be the only thing that checks it.<\/strong> Annie's watchdog fixes one kind of broken link by itself. After each fix it runs its own check again, and it reports &quot;fixed&quot; only if that check passes.<\/p>\n<p><strong>The checker can fail too.<\/strong><\/p>\n<ul>\n<li><strong>The story.<\/strong> Annie had a script that wrote her monthly cost report.<\/li>\n<li>It was being run by the wrong copy of Python, which lacked a part it needed. So it read nothing.<\/li>\n<li>It printed three warnings, then printed &quot;ok&quot;.<\/li>\n<li>An audit also found it had never been scheduled, although an earlier note said it had.<\/li>\n<li>The audit's summary: every fault it found was in the part that reports on the system, not the part that does the work.<\/li>\n<\/ul>\n<p><strong>So write down what your check cannot see.<\/strong> A check with a known gap is useful. A check you believe sees everything is how you get surprised.<\/p>\n<h3>Short Course: Your Golden Questions Are the Check<\/h3>\n<p>Your AI assistant runs only when you open it. So the check is you, asking your three golden questions. Write on your run card: &quot;after every change, ask the three golden questions.&quot; Then go to the next segment.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-10-s6\"><h2><span class=\"num\">10.6<\/span> Break It on Purpose<\/h2><p><em>15 minutes, both courses.<\/em><\/p>\n<p><strong>A check that has never gone red has not been tested.<\/strong> Annie's watchdog once gained a check that her skill scripts had not been changed by accident. Her builder changed one script on purpose. The check went red, and the script was put back. On its first real run, the same check found a real script that had gone out of date.<\/p>\n<p><strong>Plant the fault on a copy, never on the live system you depend on<\/strong>.<\/p>\n<h3>Short Course<\/h3>\n<ol>\n<li>Copy your <code>My AI Assistant<\/code> folder to a test folder. Work in the copy.<\/li>\n<li>Plant one fault. Choose one:\n<ul>\n<li>Change one word in <code>AGENTS.md<\/code>, so one rule says something wrong.<\/li>\n<li>Move one file out of <code>My Files/<\/code>.<\/li>\n<\/ul>\n<\/li>\n<li>Open the AI assistant in the test folder. Ask your three golden questions.<\/li>\n<li>Write down which question caught the fault, and which questions still looked fine.<\/li>\n<\/ol>\n<h3>Both Courses<\/h3>\n<p><strong>The check that stayed silent is the most useful answer.<\/strong> It shows you a failure your checks cannot see. Write it down in your build log, under &quot;what my checks cannot see&quot;.<\/p>\n<p><strong>Then fix the fault and check again.<\/strong> Every check should go green. If one stays red after the fault is fixed, the check itself is broken.<\/p>\n<p><strong>Check the alarm against reality, too.<\/strong><\/p>\n<ul>\n<li>Once, Toby reported 292 broken links in Annie's vault. Only 15 were real.<\/li>\n<li>The checker was misreading three kinds of link that were correct.<\/li>\n<li>Claude nearly changed 234 rows of Annie's storage list to match the checker. That would have broken working links.<\/li>\n<li>About a week later, Toby reported 249 broken photo links, and this time he was right.<\/li>\n<\/ul>\n<p>Neither the alarm nor the silence is proof. Look at what the alarm points to.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-10-s7\"><h2><span class=\"num\">10.7<\/span> Set a Spending Cap<\/h2><p><em>5 minutes, both courses.<\/em><\/p>\n<p><strong>What it costs me.<\/strong> On average, my whole setup costs me about $57 a month. That covers three bots, a server and the subscriptions behind them. You can do this course for $0.<\/p>\n<p><strong>Why a spending cap matters.<\/strong> One month, my bill was close to $80 instead of the usual $57. Two things happened. First, I was trying my AI assistant on Claude Sonnet, which costs more than the open-weight models I normally use. Second, I had built a script on my server named Toby, my system maintenance checker. Toby is also built to fix some problems automatically. By mistake, the automatic fixes used my API key instead of my Claude Pro subscription, so they billed the API. I found out because I had set a $20 monthly limit on my API key. When the limit was used up, Anthropic paused the key and emailed me.<\/p>\n<p><em>(Module 04 showed the cap. This is the full story. The arithmetic is in the handout.)<\/em><\/p>\n<p><strong>Find the cause before you raise a cap.<\/strong> Claude's first advice was to raise the cap to $30. That was wrong. The account would have run out again within days, before the cause was fixed.<\/p>\n<p><strong>Cap the job, not only the account.<\/strong> The first run of Annie's company-watch job had no limit. It used 92 credits and never finished. Limited to 14 calls, it finished in 12 and used 21 credits. Her rule for Firecrawl: warn before the limit, and never top up automatically.<\/p>\n<p><strong>Exercise.<\/strong><\/p>\n<ol>\n<li>List every account you pay for: server, AI plans, model provider, sync and any web service.<\/li>\n<li>Mark each one: does it charge a flat monthly price, or per use?<\/li>\n<li>A flat price cannot surprise you. Write its price on your run card.<\/li>\n<li>Every account that charges per use gets a cap today. Set it at the figure that would annoy you, not the one that would hurt you.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"short-10-s8\"><h2><span class=\"num\">10.8<\/span> Lessons From Real Mistakes<\/h2><p>Each line below is one lesson from a real mistake in Annie's own system. The full story behind each one is on the FAQ tab, the last tab at the top of the page. More short examples are in this module's handout, the next tab.<\/p>\n<ul>\n<li>A check that a job ran does not check what the job did. Check the result too.<\/li>\n<li>When jobs break after a model change, check the keys and the model names before you blame the model.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-10-s9\"><h2><span class=\"num\">10.9<\/span> Worksheet: Keeping It Honest<\/h2><div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Proof<\/th>\n<th>Course<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>I named one failure I have met, and its kind<\/td>\n<td>My notes<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Backup made, including logins, leaving out downloadable files<\/td>\n<td><code>unzip -l<\/code><\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>One file restored from the backup and opened<\/td>\n<td>My SOUL file opened from the test folder<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Backup copied to a second place, one file restored<\/td>\n<td>Homework<\/td>\n<td>Short<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Watchdog runs every hour and is silent when green<\/td>\n<td><code>--status<\/code><\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Watchdog checks the bot, the backup and the Claude login<\/td>\n<td><code>--status<\/code> lists all three<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>A planted fault made a check go red<\/td>\n<td>I saw it go red<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>What my checks cannot see, written down<\/td>\n<td>My build log<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Every paid account listed, flat or per use<\/td>\n<td>The table below<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>A cap on every account that charges per use<\/td>\n<td>The account's settings page<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>My paid accounts:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Account<\/th>\n<th>Price per month<\/th>\n<th>Flat or per use?<\/th>\n<th>Cap set?<\/th>\n<th>Where the cap is set<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>What my checks cannot see:<\/strong><\/p>\n<ol>\n<li>\n<hr />\n<\/li>\n<li>\n<hr />\n<\/li>\n<\/ol>\n<\/section>", "count": 9, "sess": [4]}, {"id": "short-10h", "label": "10 Handout", "title": "Handout: What Broke in Annie's System", "minutes": null, "read": 5, "toc": [["short-10h-s1", "10H.1", "Two Rules"], ["short-10h-s2", "10H.2", "It Stopped"], ["short-10h-s3", "10H.3", "It Ran, but Did the Wrong Thing"], ["short-10h-s4", "10H.4", "It Said It Worked When It Did Not"], ["short-10h-s5", "10H.5", "The Checker Failed Too"], ["short-10h-s6", "10H.6", "Backups"], ["short-10h-s7", "10H.7", "When a Bot Looks Fine but Is Stuck"], ["short-10h-s8", "10H.8", "Keys and Passwords"], ["short-10h-s9", "10H.9", "Cost"]], "body": "<div class=\"intro\"><p><em>A handout for Module 10, both courses. One page, read at home. Each line is one real failure from Annie's own system. The stories told in class are not repeated here.<\/em><\/p>\n<\/div>\n<section class=\"card\" id=\"short-10h-s1\"><h2><span class=\"num\">10H.1<\/span> Two Rules<\/h2><ol>\n<li><strong>Check the result, not the report.<\/strong> A job saying &quot;done&quot; is not proof. Open the file, list the folder or read the message it produced.<\/li>\n<li><strong>The job that does the work must not be the only thing that checks it.<\/strong> Use something separate: a second check, a separate measurement, or a person looking.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"short-10h-s2\"><h2><span class=\"num\">10H.2<\/span> It Stopped<\/h2><ul>\n<li>An error handler that caught every error hid a missing import. So the sync function crashed on every call and had never worked once.<\/li>\n<li>The daily learning card crashed, because the bot re-saved its own file in a shape the script could not read.<\/li>\n<li>The vault sync jammed for six hours behind one frozen process.<\/li>\n<li>A vault reorganisation broke file addresses in four ways, including links outside the vault that a vault search could not find.<\/li>\n<li>Three Google accounts failed with the same error. One account failing points to its login. Every account failing points to the app.<\/li>\n<li>The server's Claude login expired without warning after about 30 days, while chat on the phone still worked. The watchdog now warns 4 days ahead.<\/li>\n<li>Moving to a new model provider broke three jobs, because keys and model names did not carry across. Only two of the three bots had changed model.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-10h-s3\"><h2><span class=\"num\">10H.3<\/span> It Ran, but Did the Wrong Thing<\/h2><ul>\n<li>The nightly sorter suggested the same inbox notes again every night.<\/li>\n<li>A second &quot;10 pm&quot; reminder that nobody had scheduled turned out to be the bot re-sending files when Annie replied &quot;done&quot;.<\/li>\n<li>A folder move left the old address in three files, so the bot found no deal documents for three weeks and said nothing.<\/li>\n<li>Adding one storage unit meant editing five places. Missing any one would leave a gap nobody would see.<\/li>\n<li>Before five notes were deleted, a search of the whole vault found one other note linking to all five. It was fixed first. This failure was prevented.<\/li>\n<li>The watchdog reported 249 broken photo links, and they were real. No step copied the photos into the vault.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-10h-s4\"><h2><span class=\"num\">10H.4<\/span> It Said It Worked When It Did Not<\/h2><ul>\n<li>After 36 days with no restarts, the bot looked healthy. Its sorter was failing on a usage limit, and its memory was full: 2,201 of 2,200 characters.<\/li>\n<li>A builder reported all tests passing. Its invoice code had 6 bugs, 4 of them fatal, and the main path had never run from start to finish.<\/li>\n<li>The bot fixed its rules correctly, but the job's own stored instruction said &quot;EXACTLY this format&quot;. So the morning message never changed.<\/li>\n<li>A nightly sync reported success for about four weeks while copying zero files. A folder move had broken its path.<\/li>\n<li>The bot sometimes said &quot;got it&quot; without saving the note. Now it saves, checks the file exists, and replies with where it saved it.<\/li>\n<li>&quot;save&quot; and &quot;write a build log&quot; became scripts that check their own writes on the disk. This failure was prevented.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-10h-s5\"><h2><span class=\"num\">10H.5<\/span> The Checker Failed Too<\/h2><ul>\n<li>The watchdog's first version ended with an error code when it found a problem. Then it reported its own job as failed, again and again.<\/li>\n<li>The bot must now report a failure in the same message. The watchdog looks for the failures nobody sees, every hour, at no cost.<\/li>\n<li>The cost meter logged every call to two Claude models at $0 for two months, because its price list did not include them.<\/li>\n<li>The watchdog now fixes broken vault links itself, with a $1 limit. It reports &quot;fixed&quot; only after its own check passes.<\/li>\n<li>The watchdog twice reported two healthy bots as down, because it read old status files.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-10h-s6\"><h2><span class=\"num\">10H.6<\/span> Backups<\/h2><ul>\n<li>The backup has three layers: a nightly copy on the server, a copy on Google Drive, and a message that arrives only if it fails. No AI model is involved.<\/li>\n<li>59 files, including 13 baby-book photos, existed only on Annie's Mac. A daily copy from the Mac to the server now runs.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-10h-s7\"><h2><span class=\"num\">10H.7<\/span> When a Bot Looks Fine but Is Stuck<\/h2><ul>\n<li>One of Annie's bots showed as &quot;running&quot; for 12 hours while receiving nothing. Its program never stopped, so the automatic restart never started.<\/li>\n<li>A healthy bot keeps at least 2 open connections to Telegram. A stuck one keeps none.<\/li>\n<li>A separate script now checks every 5 minutes and restarts a bot with no connections. If it has to restart the same bot 3 times in 2 hours, it tells Annie.<\/li>\n<li><strong>Keep the list of automatic fixes short.<\/strong> Toby fixes only a few kinds of problem by himself. A dead backup, a stuck bot or an expired login still go to Annie.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-10h-s8\"><h2><span class=\"num\">10H.8<\/span> Keys and Passwords<\/h2><ul>\n<li><strong>Never print a key.<\/strong> When you look at settings, show the names of keys, not their values.<\/li>\n<li><strong>Keep each key in one place.<\/strong> A key copied into several files must be changed in all of them. A half-finished change stops bots without warning.<\/li>\n<li><strong>Change a key when any of these happens<\/strong>:\n<ol>\n<li>A session is shared or shown to anyone.<\/li>\n<li>A new device joins your private network.<\/li>\n<li>A paid balance falls faster than your use explains.<\/li>\n<li>The server gains a second user.<\/li>\n<\/ol>\n<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-10h-s9\"><h2><span class=\"num\">10H.9<\/span> Cost<\/h2><ul>\n<li>Measured from three meters in July 2026, running costs were about $14 a month in AI use plus $18 for the server. Building it cost about $85 to $90.<\/li>\n<\/ul>\n<p><strong>The month the bill reached about $80, in full.<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Line<\/th>\n<th>Amount<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Fixed subscriptions: server, server backup, Claude Pro, Obsidian Sync, VPN, the $10 model plan for the bots<\/td>\n<td>$55.67<\/td>\n<\/tr>\n<tr>\n<td>Bot use recorded by each bot's meter (the biggest line: the main bot on Claude Sonnet, $8.36)<\/td>\n<td>$11.55<\/td>\n<\/tr>\n<tr>\n<td><strong>Recorded by the cost note<\/strong><\/td>\n<td><strong>$67.22<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Anthropic API bill not recorded: $20.61, less the $8.36 already counted<\/td>\n<td>$12.25<\/td>\n<\/tr>\n<tr>\n<td><strong>Real total<\/strong><\/td>\n<td><strong>$79.47<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Of the $12.25, about $11 most likely came from Toby's automatic fixes using the API key by mistake, plus testing that day. One run by another assistant cost $1.30.<\/li>\n<li>The three months before it were $56.65, $55.69 and $57.97. That is about $57 on average. Those months may read slightly low, because the meter priced some Claude calls at $0 at the time.<\/li>\n<\/ul>\n<\/section>", "count": 9, "sess": [4]}, {"id": "short-11", "label": "11", "title": "Module 11: Growing It, Skills and Schedules", "minutes": 65, "read": 10, "toc": [["short-11-s1", "11.1", "What You Will Leave With"], ["short-11-s2", "11.2", "What You Need to Prepare"], ["short-11-s3", "11.3", "Finish the Build Brief"], ["short-11-s4", "11.4", "Add One Thing at a Time, and Saying No to a New Tool"], ["short-11-s5", "11.5", "Build and Test One Skill"], ["short-11-s6", "11.6", "Shown, Not Built: A Schedule on a Laptop"], ["short-11-s7", "11.7", "The Server Question"], ["short-11-s8", "11.8", "Lessons From Real Mistakes"], ["short-11-s9", "11.9", "Worksheet: Growing It"]], "body": "<div class=\"intro\"><p><strong>Why this module comes here.<\/strong><\/p>\n<ol>\n<li>Students now own a working system (Module 08, and Module 08B in the Full course).<\/li>\n<li>They have sorted their steps into script, model and person (Module 09).<\/li>\n<li>They have seen how a system fails and how a check catches it (Module 10).<\/li>\n<li>So now they can add to it safely.<\/li>\n<\/ol>\n<p><strong>What each course builds.<\/strong><\/p>\n<ul>\n<li><strong>Full course (server):<\/strong> a scheduled job that sends a message to Telegram, then a skill. Each one is tested before the next one starts.<\/li>\n<li><strong>Short course (laptop):<\/strong> a skill. A laptop schedule only runs while the laptop is awake, so the schedule is shown, not built.<\/li>\n<\/ul>\n<\/div>\n<section class=\"card\" id=\"short-11-s1\"><h2><span class=\"num\">11.1<\/span> What You Will Leave With<\/h2><p><strong>Both courses:<\/strong><\/p>\n<ul>\n<li>One skill that works when you ask for it, tested three ways.<\/li>\n<li>One tool you decided not to add, with your reason written down.<\/li>\n<\/ul>\n<p><strong>Short course only:<\/strong><\/p>\n<ul>\n<li>A finished Build Brief, with the five rows that make it safe to build.<\/li>\n<li>A one-sentence answer to the question &quot;do I need a server?&quot;<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-11-s2\"><h2><span class=\"num\">11.2<\/span> What You Need to Prepare<\/h2><ul>\n<li><strong>Full course:<\/strong> your server and bot from Module 08B, working. Build Brief 1 from Module 09.<\/li>\n<li><strong>Short course:<\/strong> your AI assistant from Module 08, working on your laptop. The five-row Build Brief you wrote at home after Module 09.<\/li>\n<li><strong>Both courses:<\/strong> your run card.<\/li>\n<\/ul>\n<p><strong>If your brief is not ready, use the umbrella example.<\/strong> It answers one question: do I need an umbrella today in Hong Kong? It uses the free Open-Meteo weather service, which needs no account and no key. It is a small version of Annie's own weather job.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-11-s3\"><h2><span class=\"num\">11.3<\/span> Finish the Build Brief<\/h2><p><em>15 minutes, Short course only. The Full course filled in these rows in Module 09.<\/em><\/p>\n<p>Your brief from Module 09 says what the job does. These five rows say what keeps it safe. Write them before anything is built, because the builder works from the brief.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Row<\/th>\n<th>What to write<\/th>\n<th>Why it matters<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Must never do<\/strong><\/td>\n<td>For example: send anything to another person; delete anything; touch Tier 3 information<\/td>\n<td>The AI assistant follows written limits. It cannot follow limits you only meant.<\/td>\n<\/tr>\n<tr>\n<td><strong>Needs my approval before<\/strong><\/td>\n<td>Any step where the AI assistant should stop and ask you first<\/td>\n<td>You decide the risky steps. The AI assistant does the rest.<\/td>\n<\/tr>\n<tr>\n<td><strong>Acceptance checks<\/strong><\/td>\n<td>Three checks, written now. The builder never changes them.<\/td>\n<td>If the builder can change the test, a test pass proves nothing.<\/td>\n<\/tr>\n<tr>\n<td><strong>How to undo it<\/strong><\/td>\n<td>What you would do to remove it, in one or two lines<\/td>\n<td>If you cannot undo it, you will be afraid to try it.<\/td>\n<\/tr>\n<tr>\n<td><strong>Keep-or-kill date<\/strong><\/td>\n<td>Two weeks after it starts working<\/td>\n<td>On that date you ask one question: did I use it?<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Tier 3<\/strong> is the information that never goes into any AI tool, such as passwords, keys and bank numbers (Module 02).<\/p>\n<p><strong>Put the keep-or-kill date in your calendar now.<\/strong> Annie set this two-week test for her morning brief when it went live.<\/p>\n<p><strong>In the Short course, your brief becomes a skill.<\/strong> The AI assistant does the job when you ask for it, instead of at a set time. Later in this module you build it.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-11-s4\"><h2><span class=\"num\">11.4<\/span> Add One Thing at a Time, and Saying No to a New Tool<\/h2><p><em>10 minutes, both courses.<\/em><\/p>\n<h3>Add One Thing at a Time<\/h3>\n<p><strong>Add one new thing. Test it. Use it for a few days. Then add the next.<\/strong><\/p>\n<p><strong>Why:<\/strong> Annie's first bot broke down. Its cheap AI model could not use its tools reliably. It said tasks were done when they were not: Annie calls this &quot;faked success&quot;. Finding the fix took about a week of Annie's own research. The clean-up took 13 logged hours more.<\/p>\n<p>The rule from her rebuild notes: <strong>&quot;Don't add features in batches.&quot;<\/strong> Her rebuilt bot started with three things: the soul file, the rules and one reminder. Her plan was to live with it for 24 to 48 hours before building more.<\/p>\n<p><strong>The reason the rule works.<\/strong> If you add one thing and something breaks, there is one place to look. If you add three things, there are three places to look, and they can affect each other.<\/p>\n<h3>Saying No to a New Tool<\/h3>\n<p>New AI tools appear every week. Most of them will be offered to you as something you need.<\/p>\n<p><strong>Annie's example.<\/strong> Someone she works with once asked whether she used the Hermes desktop app. He said it could read all the files on her computer. She checked it and decided not to add it. Her four reasons:<\/p>\n<ol>\n<li><strong>She could already do it.<\/strong> Claude Code already read her files and her vault, and reached her server.<\/li>\n<li><strong>Her phone was already covered.<\/strong> Her bot on Telegram already reached her anywhere.<\/li>\n<li><strong>Her own setup was better.<\/strong> She asked: <em>&quot;even if I used Codex, wouldn't I just connect it to Obsidian or a shared folder both tools read, like I do now?&quot;<\/em> She was right. Her notes and rules live in her own vault, so any tool can read them, and no company holds them.<\/li>\n<li><strong>It would cost her more than it gave.<\/strong> It meant a second AI assistant that was not her main one, a new way into her system, and a large update to her live server.<\/li>\n<\/ol>\n<p><strong>Exercise.<\/strong> Write down one tool you have been tempted to add. Answer two questions:<\/p>\n<ol>\n<li>What would it let me do that I cannot do now?<\/li>\n<li>What would I have to look after if I added it?<\/li>\n<\/ol>\n<p>If the first answer is &quot;nothing new&quot;, the answer is no for now. Write the reason on your run card.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-11-s5\"><h2><span class=\"num\">11.5<\/span> Build and Test One Skill<\/h2><p><em>Full course: 20 minutes. Short course: 25 minutes.<\/em><\/p>\n<p><strong>A skill is a written procedure that the AI assistant reads only when it is needed.<\/strong><\/p>\n<p><strong>Why skills exist.<\/strong> The AI assistant's built-in memory is small. Annie's bot has 2,200 characters, and it reads all of them with every message. A six-step procedure saved there filled it, and left no room for facts. So the rule is: <strong>facts in memory, procedures in skills.<\/strong> The Full course met this rule in Module 07.<\/p>\n<h3>What a Skill Is<\/h3>\n<p>A skill is a folder. Inside it is one file, named exactly <code>SKILL.md<\/code>. The file starts with a short description, then the steps.<\/p>\n<p><strong>Three facts decide whether a skill works:<\/strong><\/p>\n<ol>\n<li><strong>The AI assistant reads only the name and description at the start.<\/strong> It reads the steps only when your request matches the description.<\/li>\n<li><strong>So the description must say when to use the skill, in the words you would type.<\/strong> A phrase that is not in the description will not start the skill. The limit is 1,024 characters. Annie's continuity and build-log skills use 914 and 1,004.<\/li>\n<li><strong>The file name must be exactly <code>SKILL.md<\/code>.<\/strong> Once, one of Annie's skill folders held a backup copy named <code>SKILL.md.bak-20260929-170928<\/code>. The AI assistant could not see it, because the name was different.<\/li>\n<\/ol>\n<p><strong>A skill is used reliably once the rules file points to it.<\/strong> On Annie's bot, a skill starting by itself has never been enough. Her client-document skill was used reliably once her rules file pointed to it, so she did the same for her Storage Inventory skill. So the last step is to add one line to your rules file.<\/p>\n<h3>What Your Skill Does<\/h3>\n<ul>\n<li><strong>Full course:<\/strong> it runs the scheduled job's script when you ask, and sends you the result. So you can ask &quot;do I need an umbrella?&quot; at any time, not only at 7 am.<\/li>\n<li><strong>Short course:<\/strong> it does the job from your Build Brief when you ask for it.<\/li>\n<\/ul>\n<h3>Where the Skill Goes<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Course<\/th>\n<th>Folder<\/th>\n<th>How to check it loaded<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Full<\/td>\n<td><code>~/.hermes/skills/&lt;skill-name&gt;/SKILL.md<\/code> on the server<\/td>\n<td><code>hermes skills list<\/code> shows it. Then type <code>/new<\/code> in Telegram, because an open chat keeps the instructions it started with<\/td>\n<\/tr>\n<tr>\n<td>Short<\/td>\n<td><code>~/.agents/skills/&lt;skill-name&gt;/SKILL.md<\/code> on the laptop<\/td>\n<td>Start a new pi session. pi read skills from this folder on Annie's Mac (checked 10 Oct 2026)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Build It<\/h3>\n<p>Paste this to your builder (Claude Code in the Full course, pi in the Short course):<\/p>\n<pre><code class=\"language-text\">Make a skill for [the job from my Build Brief / my scheduled job's script].\nPut it in [the folder from the table], in a folder named [skill-name], with one file named exactly SKILL.md.\nWrite the description as a list of the phrases I would actually type to ask for it, such as &quot;do I need an umbrella&quot;.\nFollow the &quot;Must never do&quot; and &quot;Needs my approval before&quot; rows in my brief.\nThen add one line to my rules file that names the skill and says when to use it.\nShow me the SKILL.md before you save it.\n<\/code><\/pre>\n<h3>Test It Three Ways<\/h3>\n<ol>\n<li><strong>Ask in the words from the description.<\/strong> The AI assistant should use the skill.<\/li>\n<li><strong>Ask in different words you would also use.<\/strong> If it does not use the skill, add those words to the description and test again.<\/li>\n<li><strong>Ask something unrelated.<\/strong> The AI assistant should not use the skill.<\/li>\n<\/ol>\n<p><strong>It passed if<\/strong> all three tests give the right result, and your three acceptance checks from the brief pass.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-11-s6\"><h2><span class=\"num\">11.6<\/span> Shown, Not Built: A Schedule on a Laptop<\/h2><p><em>5 minutes, Short course only.<\/em><\/p>\n<p>A laptop can run a job at a set time. But it runs only while the laptop is awake. If the lid is shut at 7 am, the 7 am job does not run, and nothing tells you.<\/p>\n<p><strong>That is why the Short course builds a skill today.<\/strong> A skill works whenever the laptop is on and you ask for it.<\/p>\n<p><strong>If you took the optional server sitting,<\/strong> build a scheduled job as homework. Follow the Full course steps in &quot;Build the Scheduled Job&quot;. Bring questions to Module 12.<\/p>\n<div class=\"shared\"><div class=\"sharedlabel\">The steps it points to, from the Full course section \"Build the Scheduled Job\"<\/div><p><em>40 minutes, Full course only.<\/em><\/p>\n<h3>Step 1. Write the Script and Test It Without Sending Anything (20 minutes)<\/h3>\n<p>Log in to your server with <code>ssh myserver<\/code>. Start Claude Code in your vault folder, as in Module 08B. Paste:<\/p>\n<pre><code class=\"language-text\">Read Build Brief 1 in my AI System folder. Ask me every question you have before you start.\nThen write a script in ~/.hermes/scripts/ that does the scripted steps.\nRules:\n- Print the message only when there is something to say. Print nothing otherwise.\n- If anything fails, print one line starting with a warning sign, saying what failed. Never fail silently.\n- Add a --dry-run option. It prints what it would send, sends nothing, and changes no saved file.\n- Back up any file before you edit it.\n- Follow the &quot;Must never do&quot; and &quot;Needs my approval before&quot; rows in my brief.\nShow me the script before you save it. Then run it with --dry-run and show me the output.\n<\/code><\/pre>\n<p><strong>The umbrella version, if you have no brief:<\/strong> ask for a script that gets today's hourly rain forecast for Hong Kong from Open-Meteo. If any hour is likely to rain, it prints &quot;Umbrella today&quot; with the wettest hours. On a dry day it prints nothing.<\/p>\n<p><strong>It passed if<\/strong> <code>--dry-run<\/code> prints the message you expect, and a second dry run shows that no file changed.<\/p>\n<p><strong>If it fails:<\/strong> read the line it printed. Most first failures are a missing library, a wrong file path or the wrong time zone. Ask the builder to explain the error in plain words before it fixes anything.<\/p>\n<p><strong>If your brief needs an email or calendar login,<\/strong> switch to the umbrella version today. Build your real job as homework. A login takes longer than the class has.<\/p>\n<h3>Step 2. Send One Labelled Test (5 minutes)<\/h3>\n<p>Ask the builder to send you one real message, with &quot;🧪 TEST&quot; at the start.<\/p>\n<p><strong>Why:<\/strong> this is Annie's habit. She sends herself one test labelled &quot;🧪 TEST&quot; and only lets the job go live after she approves it. The label stops you mistaking a test for the real thing.<\/p>\n<p><strong>It passed if<\/strong> the message arrives on your phone, and it reads the way you want.<\/p>\n<h3>Step 3. Put It on the Schedule and Run It Once (15 minutes)<\/h3>\n<p><strong>Ask the builder to create the job.<\/strong> The exact options change between Hermes versions, so the builder reads the help first:<\/p>\n<pre><code class=\"language-text\">Run &quot;hermes cron create --help&quot; and read it. Then create a no-agent job that runs my script at [time] every [day], and delivers to my Telegram. Show me the command before running it.\n<\/code><\/pre>\n<p><strong>Choose a time when you want messages.<\/strong> Annie groups her scheduled messages into set times: a morning burst and a 6 pm admin slot. A new message must fit one of them, or it needs her yes.<\/p>\n<p><strong>Your builder may refuse to create the job.<\/strong> Once, Claude Code's own safety check stopped it from installing a permanent job on Annie's server. She typed the final command herself. This is correct: the owner approves anything permanent. If it happens to you, read the command. If you agree with it, run it yourself.<\/p>\n<p><strong>Then run it once through the scheduler.<\/strong> A job that works when you run it by hand can still fail on the schedule.<\/p>\n<pre><code class=\"language-bash\">hermes cron list\nhermes cron run &lt;job-id&gt;\n<\/code><\/pre>\n<p><code>hermes cron run<\/code> runs the job at the scheduler's next check, so the message can take up to a minute.<\/p>\n<p><strong>It passed if<\/strong> the job is in the list with the right time, and the message arrives on your phone.<\/p>\n<p><strong>If your job checks for things it already sent, run it a second time.<\/strong> The second run should send nothing.<\/p>\n<p><strong>Keep every job in the one scheduler.<\/strong> Annie once found a job installed outside Hermes, in the server's own scheduler. It ran every night and reported success, but it had done nothing for about four weeks. It did not show in <code>hermes cron list<\/code>, which is why nobody saw it.<\/p>\n<\/div><\/section>\n<section class=\"card\" id=\"short-11-s7\"><h2><span class=\"num\">11.7<\/span> The Server Question<\/h2><p><em>10 minutes, Short course only.<\/em><\/p>\n<p>You have just seen that a laptop schedule only runs while the laptop is awake. So now the question is real: do you need a server?<\/p>\n<p><strong>What a server gives you:<\/strong><\/p>\n<ol>\n<li>Your AI assistant answers when your laptop is shut.<\/li>\n<li>Scheduled jobs run at 3 am.<\/li>\n<li>Your phone reaches it from anywhere.<\/li>\n<\/ol>\n<p><strong>What a server costs you:<\/strong><\/p>\n<ol>\n<li><strong>Money every month.<\/strong> [COST]<\/li>\n<li><strong>A second computer to look after.<\/strong> Annie's server once kept warning that its memory was low. The cause was six Claude Code sessions she had left open. They were 4 to 17 days old and held 1.5 GB, of a server with 3.8 GB in total. None of them closed by itself.<\/li>\n<li><strong>Logins that expire.<\/strong> Her server's Claude login expired without warning after about 30 days, while chat on her phone still worked.<\/li>\n<\/ol>\n<p><strong>&quot;Not yet&quot; is an allowed answer.<\/strong> A laptop teaches the same lessons and costs nothing extra.<\/p>\n<p><strong>Exercise.<\/strong> Answer in one sentence on your run card: do I need a server, and why? If you freeze, write it instead of saying it.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-11-s8\"><h2><span class=\"num\">11.8<\/span> Lessons From Real Mistakes<\/h2><p>Each line below is one lesson from a real mistake in Annie's own system. The full story behind each one is on the FAQ tab, the last tab at the top of the page.<\/p>\n<ul>\n<li>A message that arrives twice may not come from a second job. Check what the bot does when you reply.<\/li>\n<li>When a fix does not show up, find which file the job actually reads.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-11-s9\"><h2><span class=\"num\">11.9<\/span> Worksheet: Growing It<\/h2><div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Proof<\/th>\n<th>Course<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Five new brief rows written<\/td>\n<td>My brief<\/td>\n<td>Short<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Keep-or-kill date in my calendar<\/td>\n<td>My calendar<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>One tool I decided not to add, with my reason<\/td>\n<td>My run card<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Script prints the message, prints nothing when quiet, prints failures<\/td>\n<td><code>--dry-run<\/code> output<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>--dry-run<\/code> changed no file<\/td>\n<td>A second dry run<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>One &quot;🧪 TEST&quot; message arrived and I approved it<\/td>\n<td>My phone<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Job is on the schedule at the right time<\/td>\n<td><code>hermes cron list<\/code><\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Job ran once through the scheduler<\/td>\n<td>The message on my phone<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Skill folder holds one file named exactly <code>SKILL.md<\/code><\/td>\n<td>The folder listing<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Skill passed all three tests<\/td>\n<td>My notes<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Rules file points to the skill<\/td>\n<td>The line in my rules file<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>One-sentence answer to the server question<\/td>\n<td>My run card<\/td>\n<td>Short<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Today's build log written, with its index row<\/td>\n<td>The log and the index<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>", "count": 9, "sess": [4]}, {"id": "short-11h", "label": "11 Handout", "title": "Handout: More Ways to Grow Your System", "minutes": null, "read": 3, "toc": [["short-11h-s1", "11H.1", "Formatting Messages for the Phone"], ["short-11h-s2", "11H.2", "Reading the Web, With a Cap"], ["short-11h-s3", "11H.3", "Pausing and Restarting a Job"], ["short-11h-s4", "11H.4", "Two Ways to Use a Model on a Schedule"]], "body": "<div class=\"intro\"><p><em>A handout for Module 11, both courses. Read it at home, after your first job or skill has run for a week. Each section comes from Annie's own system. Use one at a time.<\/em><\/p>\n<\/div>\n<section class=\"card\" id=\"short-11h-s1\"><h2><span class=\"num\">11H.1<\/span> Formatting Messages for the Phone<\/h2><p><strong>A correct message is not always a usable one.<\/strong> Annie's weather job worked out the weather correctly. She still said: &quot;in terms of how I want to read it, it's not quite right.&quot; The one line she could act on was hidden under a loud warning sign.<\/p>\n<p><strong>Five of the seven rules in Annie's message format:<\/strong><\/p>\n<ol>\n<li>A bold first line that says what this is and when.<\/li>\n<li>A one-line summary under it.<\/li>\n<li>Short &quot;Label: value&quot; lines, with a blank line between items.<\/li>\n<li>Warning signs only where you need to act.<\/li>\n<li>Turn the unimportant items into a count. Send nothing when nothing matters.<\/li>\n<\/ol>\n<p><strong>Telegram shows only some formatting.<\/strong> Bold, italics, code and links work. Headings and quote blocks show as stray characters. Tables turn into bullet lists.<\/p>\n<p><strong>Read the real message on your real phone.<\/strong> Annie's weather job took 18 changes in 6 days. Each round of changes came from her reading the real message on her real phone.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-11h-s2\"><h2><span class=\"num\">11H.2<\/span> Reading the Web, With a Cap<\/h2><p>Many useful jobs read web pages. Annie's bots use Firecrawl. It turns a web page into clean text, and it can search. Its free plan gives 1,000 credits a month. A search costs about 2 credits.<\/p>\n<p><strong>Cap the job, not only the account.<\/strong> The first run of Annie's company-watch job had no limit on how many searches the AI could make. It used 92 credits and never finished. Limited to 14 calls, it finished in 12 and used 21 credits.<\/p>\n<p><strong>Her rule for Firecrawl:<\/strong> warn before the limit, and never top up automatically.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-11h-s3\"><h2><span class=\"num\">11H.3<\/span> Pausing and Restarting a Job<\/h2><p>Pausing keeps the job but stops it from running. Use it on your keep-or-kill date if you are not sure yet.<\/p>\n<pre><code class=\"language-bash\">hermes cron pause &lt;job-id&gt;\nhermes cron resume &lt;job-id&gt;\n<\/code><\/pre>\n<p>Annie once paused a working bill reminder on the day she built it. It only told her to go and check an app, so it removed no work.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-11h-s4\"><h2><span class=\"num\">11H.4<\/span> Two Ways to Use a Model on a Schedule<\/h2><p>Try these only after week 4 of your 30-day plan (Module 12), with your test questions written first.<\/p>\n<p><strong>1. A model job with its model fixed.<\/strong> The scheduler hands a request to the bot's model. Fix the model and the provider on the job itself. Then a change to the default model cannot move the job without you knowing. Annie's scheduler refuses to run a job that has no fixed model if the default changed after the job was made. Her command:<\/p>\n<pre><code class=\"language-bash\">hermes cron edit &lt;job-id&gt; --model deepseek-v4.1-flash --provider opencode-go --pin\n<\/code><\/pre>\n<p><strong>2. The model writes, a script sends.<\/strong> Annie once wanted her morning summary as several short messages. A scheduled model job could only send one reply, and the cheap model added its working notes to it. The fix used two jobs. The model job writes only the clean message to a file, and sends nothing. Five minutes later, a script job splits the file and sends each part as its own message.<\/p>\n<\/section>", "count": 4, "sess": [4]}, {"id": "short-12", "label": "12", "title": "Module 12: The Close, Your 30-Day Plan", "minutes": 15, "read": 6, "toc": [["short-12-s1", "12.1", "What You Will Leave With"], ["short-12-s2", "12.2", "The Promise, Checked"], ["short-12-s3", "12.3", "The Closing Question"], ["short-12-s4", "12.4", "Your 30-Day Plan"], ["short-12-s5", "12.5", "When It Breaks, and Where to Get Help"], ["short-12-s6", "12.6", "Worksheet: The Close"]], "body": "<div class=\"intro\"><p><strong>Why this module comes last.<\/strong><\/p>\n<ol>\n<li>Students now own a system that does one real job (Modules 08 and 11).<\/li>\n<li>It has checks that tell them when it breaks (Module 10).<\/li>\n<li>So the last job is to check it against the course promise, and to plan the next four weeks.<\/li>\n<li>The course ends on the student's next action, not on a summary.<\/li>\n<\/ol>\n<\/div>\n<section class=\"card\" id=\"short-12-s1\"><h2><span class=\"num\">12.1<\/span> What You Will Leave With<\/h2><p><strong>Both courses:<\/strong><\/p>\n<ul>\n<li>Your system, checked against the course promise. Any row you cannot tick is written on your run card as work to do.<\/li>\n<li>A 30-day plan, one row for each week, with a stop condition for each week.<\/li>\n<li>The four steps to take when something breaks.<\/li>\n<li>The name of the group chat where you get help for four weeks, and the date of the class call.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-12-s2\"><h2><span class=\"num\">12.2<\/span> The Promise, Checked<\/h2><p><em>5 minutes, both courses.<\/em><\/p>\n<p>At the start, the course promised you a system you can check. Check it now, against what is in front of you.<\/p>\n<p><strong>Short course.<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>The claim<\/th>\n<th>The check<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>One AI assistant on your laptop<\/td>\n<td>Start pi in your folder, and ask it a question<\/td>\n<\/tr>\n<tr>\n<td>One real job<\/td>\n<td>Ask for the job, in the words from your skill's description<\/td>\n<\/tr>\n<tr>\n<td>Three rules you wrote<\/td>\n<td>Name them, and say how each one is checked<\/td>\n<\/tr>\n<tr>\n<td>It tells you when it cannot answer<\/td>\n<td>Ask one of your golden questions that it should refuse, and read the refusal<\/td>\n<\/tr>\n<tr>\n<td>You know what it costs<\/td>\n<td>Read the monthly figure off your run card<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>A row you cannot tick is work to do. It is not a failure.<\/strong> Write the row on your run card. Bring it to the group chat or the class call.<\/p>\n<p><strong>Why the Full course checks the watchdog, not a refusal.<\/strong> The Full course built checks that run by themselves (Module 10). A refusal tests a different thing: the rule about saying when the AI assistant does not know.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-12-s3\"><h2><span class=\"num\">12.3<\/span> The Closing Question<\/h2><p><em>5 minutes, Full course. Short course: homework, written on the run card.<\/em><\/p>\n<p><strong>&quot;What have I built, and what does it take off my mind?&quot;<\/strong><\/p>\n<p><strong>Answer it in one sentence.<\/strong> You can say it to the room, or write it down. If you can describe your system in one sentence, you know what it is for. Keep the sentence somewhere you will see it.<\/p>\n<p><strong>Annie's own sentence, for an example.<\/strong> She once wrote what the whole effort is for: clearing what drains her, so she can be present with the people in front of her, including herself.<\/p>\n<p><strong>The second question, written, not spoken.<\/strong> What would &quot;too much looking after&quot; be for you? For example: more than 30 minutes a week of fixing. Write your limit now. If you reach it later, you switch something off. You do not keep adding.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-12-s4\"><h2><span class=\"num\">12.4<\/span> Your 30-Day Plan<\/h2><p><em>Full course: 10 minutes. Short course: 5 minutes.<\/em><\/p>\n<p><strong>Add one tested thing at a time. Then live with it for a few days before you add the next.<\/strong> This is the rule from Module 11, and it applies after the course too. When Annie broke this rule with her first bot, the clean-up took 13 logged hours.<\/p>\n<p><strong>Expect to change things many times.<\/strong> Annie built and reshaped her storage system across five days. It took about 45 to 50 separate changes. Changing your mind is how the system becomes yours.<\/p>\n<p><strong>Write your own plan.<\/strong> One row for each week. Each week has a stop condition: the thing that tells you the week is done.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Week<\/th>\n<th>What you do<\/th>\n<th>Stop condition<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1<\/strong><\/td>\n<td>Add nothing new. Use what you built today. Note anything that annoys you<\/td>\n<td>You used it at least three times, and you wrote down each annoyance<\/td>\n<\/tr>\n<tr>\n<td><strong>2<\/strong><\/td>\n<td>Your keep-or-kill date arrives (Module 11). Ask: did I actually use it? Keep it, change it, or switch it off. Bring your answer to the class call<\/td>\n<td>You decided, and you wrote down why<\/td>\n<\/tr>\n<tr>\n<td><strong>3<\/strong><\/td>\n<td>Add one more thing, from your Module 05 maps. One thing, one check, one sentence to describe it<\/td>\n<td>It passed its test, and it ran for three days<\/td>\n<\/tr>\n<tr>\n<td><strong>4<\/strong><\/td>\n<td>Try one task that needs AI judgement. Write your test questions with known answers first, then build it (Module 09)<\/td>\n<td>It passed your test questions. <strong>Full:<\/strong> your RULES file matches <code>hermes cron list<\/code>. <strong>Short:<\/strong> your <code>AGENTS.md<\/code> still describes everything your AI assistant does<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>How to size the week 3 thing.<\/strong> It is one thing. It has one check. You can describe it in one sentence. &quot;Send me the invoices that need a claim&quot; is one thing. &quot;Sort out my admin&quot; is not.<\/p>\n<p><strong>Switching something off counts as progress.<\/strong> Annie once built a job that watched for her credit card statement. Every test passed. She switched it off a few hours later. The bank's email never contained the amount or the due date, so the job could only ever say &quot;go and check the app&quot;. It did not remove a chore, so it did not earn a place.<\/p>\n<p><strong>Short course, week 3:<\/strong> if you took the optional server sitting, your one more thing can be a scheduled job. Follow Module 11's Full course steps.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-12-s5\"><h2><span class=\"num\">12.5<\/span> When It Breaks, and Where to Get Help<\/h2><p><em>5 minutes, both courses.<\/em><\/p>\n<h3>The Four Steps<\/h3>\n<p>When something goes wrong, do these in order. Read the real thing before you guess.<\/p>\n<ol>\n<li><strong>Read what the AI assistant actually said,<\/strong> and what the file actually contains.<\/li>\n<li><strong>Check which folder it was started in.<\/strong> Most &quot;it forgot my rules&quot; problems are the wrong folder.<\/li>\n<li><strong>Check that the rule is written in a file.<\/strong> A rule you only said in a chat is gone after the chat ends.<\/li>\n<li><strong>Ask your builder one question, with the real output pasted in.<\/strong><\/li>\n<\/ol>\n<p><strong>If the four steps do not fix it, go to the group chat.<\/strong> Paste the real output there too. A copy of the error is quicker to answer than a description of it.<\/p>\n<h3>Help for Four Weeks After the Course<\/h3>\n<ul>\n<li><strong>A shared group chat for the class, for four weeks.<\/strong> It covers your whole 30-day plan.<\/li>\n<li><strong>Who answers:<\/strong> Annie or a co-teacher, as messages arrive. You should not lose a day of progress waiting for an answer.<\/li>\n<li><strong>The hours the chat is covered:<\/strong> [TO CONFIRM]. The co-teachers live in other time zones, so the hours are agreed after this draft.<\/li>\n<li><strong>One class call at the end of week 2,<\/strong> 30 to 45 minutes. This is when your keep-or-kill date arrives. Bring your answer, and any row from the promise check you could not tick.<\/li>\n<li><strong>Included in the course fee or paid extra:<\/strong> [COST].<\/li>\n<\/ul>\n<p><strong>Write on your run card:<\/strong> the chat's name, the date and time of the class call, and the four steps.<\/p>\n<h3>The Last Save<\/h3>\n<p><em>Full course: 5 minutes. Short course: at the end of the help segment.<\/em><\/p>\n<p>Say <strong>&quot;save&quot;<\/strong> to your builder. It updates your continuity note and writes today's build log with its index row, as you set up in Module 08. This is the last thing you do in the course.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-12-s6\"><h2><span class=\"num\">12.6<\/span> Worksheet: The Close<\/h2><div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Proof<\/th>\n<th>Course<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Every promise row checked<\/td>\n<td>My run card, with any row I could not tick<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>One sentence: what I built, and what it takes off my mind<\/td>\n<td>My run card<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My limit for &quot;too much looking after&quot;<\/td>\n<td>My run card<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Drill 1: alert action done, with no builder<\/td>\n<td>Watchdog <code>--status<\/code> all green<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Drill 2: deleted on the server, gone from the laptop<\/td>\n<td>Obsidian on my laptop<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>30-day plan, four rows, each with a stop condition<\/td>\n<td>My plan<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Keep-or-kill date still in my calendar<\/td>\n<td>My calendar<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>The four steps, the chat's name and the call date<\/td>\n<td>My run card<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Last save done<\/td>\n<td>My continuity note and build log<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>", "count": 6, "sess": [4]}, {"id": "short-08b", "label": "08B Optional", "title": "Module 08B: The Server and Your Bot (Optional Server Sitting)", "minutes": 100, "read": 21, "toc": [["short-08b-s1", "08B.1", "What You Will Leave With"], ["short-08b-s2", "08B.2", "What You Need to Prepare"], ["short-08b-s3", "08B.3", "The Plan and the Four Safety Rules"], ["short-08b-s4", "08B.4", "Snapshot and SSH Key"], ["short-08b-s5", "08B.5", "First Login, Timezone and Updates"], ["short-08b-s6", "08B.6", "Secure the Server, in an Order That Cannot Lock You Out"], ["short-08b-s7", "08B.7", "Create the Telegram Bot"], ["short-08b-s8", "08B.8", "Install Hermes and Connect It"], ["short-08b-s9", "08B.9", "Load Your Files and Make It Restart on Its Own"], ["short-08b-s10", "08B.10", "Three Tests: Quoting Rules, Saying It Does Not Know, and Golden Questions"], ["short-08b-s11", "08B.11", "Same Model, Different Program: Why pi and the Bot Answer Differently"], ["short-08b-s12", "08B.12", "Homework: A Normal User, a Swap File and a Reboot Test"], ["short-08b-s13", "08B.13", "The Optional Short Course Server Session"], ["short-08b-s14", "08B.14", "Lessons From Real Mistakes"], ["short-08b-s15", "08B.15", "Worksheet: Server and Bot Checklist"], ["short-08b-s16", "08B.16", "Not Yet Tested"]], "body": "<div class=\"intro\"><p><strong>This order has not been run yet.<\/strong> Annie will run it herself before it is taught: on a fresh test server, from Hong Kong, with no VPN. If a step fails in her test, this module changes first.<\/p>\n<\/div>\n<section class=\"card\" id=\"short-08b-s1\"><h2><span class=\"num\">08B.1<\/span> What You Will Leave With<\/h2><p><strong>Short course, optional server session:<\/strong><\/p>\n<ul>\n<li>A locked server in Singapore that accepts only your key. It has a firewall and automatic bans.<\/li>\n<li>A Telegram bot lives on it. The bot answers only you, restarts by itself and quotes your rules.<\/li>\n<li>Your laptop and pi stay exactly as they were.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-08b-s2\"><h2><span class=\"num\">08B.2<\/span> What You Need to Prepare<\/h2><ul>\n<li><strong>Your server, ordered in Module 03.<\/strong> Its IP address and the provider's console login are in your password manager.<\/li>\n<li><strong>pi working on your laptop<\/strong> (Module 08, &quot;Full Course: Before the Server&quot; or &quot;Short Course&quot;), opening in your vault.<\/li>\n<li><strong>Your SOUL, RULES and USER files<\/strong> (Full) or your <code>AGENTS.md<\/code> and USER (Short), in the vault's <code>AI System<\/code> folder.<\/li>\n<li><strong>Telegram on your phone,<\/strong> with two-factor sign-in on.<\/li>\n<li><strong>Tailscale on your phone<\/strong> (Full only). Install the app now. You sign in during the module.<\/li>\n<li><strong>Obsidian Sync, bought before this module<\/strong> (Full only, and only if the vault goes on the server). About $4 to $5 a month <strong>[COST]<\/strong>.<\/li>\n<li><strong>If you already pay for a commercial VPN, switch it off before this module and leave it off.<\/strong> Two VPNs on one machine fight over the same settings.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-08b-s3\"><h2><span class=\"num\">08B.3<\/span> The Plan and the Four Safety Rules<\/h2><p><em>5 minutes. Both courses.<\/em><\/p>\n<p><strong>You will not type most of these commands. pi does, and you approve each one.<\/strong><\/p>\n<ul>\n<li>Annie's advice is direct about this. Let the builder (here, pi) drive the install. Do not follow random tutorials by hand. The builder reads the errors and fixes them.<\/li>\n<li>Each step shows <strong>what to ask pi<\/strong>, the commands it should run, and <strong>what success looks like<\/strong>.<\/li>\n<li>Read the command before you approve it.<\/li>\n<\/ul>\n<p><strong>Why pi, and not Claude Code.<\/strong><\/p>\n<ul>\n<li>pi answers from Hong Kong directly.<\/li>\n<li>Nothing in this module can cut pi off, because it never depends on the network you are building.<\/li>\n<li>Claude Code would need a route out before it could start (Module 08, &quot;Why pi comes first&quot;).<\/li>\n<\/ul>\n<p>Start pi in your vault and paste:<\/p>\n<pre><code class=\"language-text\">Today we set up my new Ubuntu server. Its IP address is in my password manager; I will paste it when you ask. You run commands on it over SSH from this laptop. Work one step at a time. Before each step, show me the command and what it changes. After each step, check it worked and show me the proof. Back up any file before editing it. Do not change anything I have not approved. If a command asks for a password or passphrase, give it to me to run myself in a second Terminal window. Keep a list of every change for my build log.\n<\/code><\/pre>\n<p><strong>The four safety rules.<\/strong> Annie learned each one on her own server.<\/p>\n<ol>\n<li><strong>Snapshot first.<\/strong> Before her first build, Annie took a full snapshot of her server in the provider's console. If the build went wrong, she could return the server to that exact state.<\/li>\n<li><strong>Every change that could lock you out needs an automatic undo.<\/strong> Once, Annie changed which accounts may log in to her server.\n<ul>\n<li>Before the change, she set a ten-minute timer. It would undo the change automatically if she was locked out.<\/li>\n<li>She cancelled the timer once the change was proven.<\/li>\n<\/ul>\n<\/li>\n<li><strong>One change at a time, tested before the next.<\/strong> Her bot kept the same process number through every security change. That proved nothing had restarted or broken.<\/li>\n<li><strong>The provider's web console still works when SSH does not.<\/strong> If anything locks you out, log in there.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"short-08b-s4\"><h2><span class=\"num\">08B.4<\/span> Snapshot and SSH Key<\/h2><p><em>10 minutes. Both courses.<\/em><\/p>\n<p><strong>Step 1. Take a snapshot.<\/strong> In your provider's web console, find the server. Choose &quot;Snapshot&quot; or &quot;Backup now&quot;. Name it <code>day-1-before-build<\/code>.<\/p>\n<p>What success looks like: the snapshot appears in the list.<\/p>\n<p><strong>Step 2. Make an SSH key on your laptop.<\/strong> An SSH key is a pair of
