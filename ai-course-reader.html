.<\/li>\n<li><b>To change something,<\/b> tell Claude the course, the number and the change. For example: <i>\"Full, 3.4: make the first list shorter.\"<\/i><\/li>\n<li><b>Your place is saved.<\/b> The page opens on the last tab you read.<\/li>\n<\/ol><\/section>", "tabs": [{"id": "short-01", "label": "01", "title": "Module 01: What Works From Hong Kong", "minutes": 45, "read": 25, "toc": [["short-01-s1", "01.1", "What You Will Leave With"], ["short-01-s2", "01.2", "Before This Module"], ["short-01-s3", "01.3", "Why Access Comes First"], ["short-01-s4", "01.4", "Which AI Tools Work From Hong Kong"], ["short-01-s5", "01.5", "Live Test: Read the Code the Provider Sends Back"], ["short-01-s6", "01.6", "Your Builder, and Claude If You Want It"], ["short-01-s7", "01.7", "Phones and the Mac"], ["short-01-s8", "01.8", "From the Record"], ["short-01-s9", "01.9", "Exercise"], ["short-01-s10", "01.10", "Worksheet: Your Access Sheet"], ["short-01-s11", "01.11", "Teaching Notes"]], "body": "<section class=\"card\" id=\"short-01-s1\"><h2><span class=\"num\">01.1<\/span> What You Will Leave With<\/h2><p><strong>Your Access Sheet.<\/strong> It is one page. It lists:<\/p>\n<ul>\n<li>every account you have or need<\/li>\n<li>which tools work directly from Hong Kong<\/li>\n<li>your route for each tool that does not work directly<\/li>\n<li>the date you tested each one, because what works can change<\/li>\n<\/ul>\n<p>You use this sheet when you install your builder. You use it again if you build your own server.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-01-s2\"><h2><span class=\"num\">01.2<\/span> Before This Module<\/h2><ul>\n<li><strong>A laptop you control.<\/strong>\n<ul>\n<li>A personal Mac is the easiest.<\/li>\n<li>A Windows laptop works. The Windows commands are shown where they are different.<\/li>\n<li>A company laptop often blocks installs and network tools. Do not bring one if you can avoid it.<\/li>\n<\/ul>\n<\/li>\n<li><strong>A phone with Telegram installed.<\/strong> You do not use Telegram today. You need it later, when you meet your bot.<\/li>\n<li><strong>A Google account.<\/strong> Gemini works in Hong Kong with no extra steps. So today it is the tool we know works, to compare the others against.<\/li>\n<li><strong>Nothing else.<\/strong> Do not buy a VPN or a server before this session. This module explains what you need.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-01-s3\"><h2><span class=\"num\">01.3<\/span> Why Access Comes First<\/h2><p>This course builds a personal AI system. It has up to three parts:<\/p>\n<ul>\n<li><strong>The builder<\/strong> is an AI that writes and fixes code for you. You describe what you want in plain English.<\/li>\n<li><strong>The bot<\/strong> is an AI you send messages to on your phone.<\/li>\n<li><strong>The server<\/strong> is a small rented computer in another country. It runs all day.<\/li>\n<\/ul>\n<p>Each part talks to an AI company over the internet. From Hong Kong, some of those companies do not answer.<\/p>\n<p>If you choose your tools before you know which ones answer, you build a system you cannot reach. Annie lost about a week to one of these blocks in May 2026 (Build Log 00). This module helps you avoid that.<\/p>\n<p><strong>Three words you will hear all day:<\/strong><\/p>\n<ul>\n<li><strong>VPN.<\/strong> A VPN sends your internet traffic through a computer in another country. The AI company then sees that country, not Hong Kong.<\/li>\n<li><strong>API.<\/strong> An API is how a program talks to an AI company. A person types in a chat window. A program uses an API instead. Your builder and your bot both use one.<\/li>\n<li><strong>Open-weight model.<\/strong> An AI model whose makers publish it, so many companies can run it. DeepSeek, Qwen, GLM and Kimi are open-weight models. They answer from Hong Kong.<\/li>\n<\/ul>\n<p>Module 03 adds three more words: harness, AI provider and AI model.<\/p>\n<p><strong>The block comes from the AI companies, not from Hong Kong.<\/strong><\/p>\n<ul>\n<li>Many people think the Hong Kong government blocks these tools. It does not.<\/li>\n<li>Hong Kong's internet is open. You can reach any website.<\/li>\n<li>The AI companies choose not to serve Hong Kong. Their own pages give no reason.<\/li>\n<li>So the check happens at the company, every time you send a request.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-01-s4\"><h2><span class=\"num\">01.4<\/span> Which AI Tools Work From Hong Kong<\/h2><p>This table was checked on 2 October 2026. The Anthropic, OpenAI and opencode rows were checked again on 9 October 2026.<\/p>\n<p><strong>What works can change, so the date matters.<\/strong> In March 2026 the Gemini row changed from blocked to open. Annie's own notes stayed wrong until someone checked (Build Log 83). Check this table again in the week before you teach it.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Company or tool<\/th>\n<th>From a Hong Kong connection<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Google Gemini (consumer app)<\/td>\n<td>Works directly<\/td>\n<td>Web from 16 March 2026, mobile from 27 March 2026 (Hong Kong Free Press, 16 Mar 2026). The paid Pro tier works too. A seminar room in Hong Kong paid for it on 6 October 2026 (Build Log 123).<\/td>\n<\/tr>\n<tr>\n<td>Google AI Studio, Antigravity and other Google developer tools<\/td>\n<td>Blocked<\/td>\n<td>Consumer Gemini is open. The developer tools are not.<\/td>\n<\/tr>\n<tr>\n<td>Anthropic: claude.ai, the Claude apps, Claude Code and the API<\/td>\n<td>Blocked<\/td>\n<td>Hong Kong is not on Anthropic's list of supported countries (checked 9 Oct 2026). The phone apps are blocked too. Tested on Android with the VPN off on 27 Aug 2026 (Build Log 68).<\/td>\n<\/tr>\n<tr>\n<td>OpenAI: ChatGPT and the API<\/td>\n<td>Blocked<\/td>\n<td>Hong Kong is not on OpenAI's list of supported countries (checked 9 Oct 2026). OpenAI refuses Hong Kong phone numbers at sign-up (PTS Consulting, seen 2 Oct 2026).<\/td>\n<\/tr>\n<tr>\n<td>DeepSeek, Kimi (Moonshot), GLM (Zhipu), Qwen (Alibaba)<\/td>\n<td>Work directly<\/td>\n<td>Open-weight models. You can reach them directly, or through a company that resells them.<\/td>\n<\/tr>\n<tr>\n<td>opencode Go (a monthly AI provider plan)<\/td>\n<td>Works directly<\/td>\n<td>It answered from Hong Kong on 30 Sep 2026 (Build Log 103) and again on 9 Oct 2026. Annie's three bots use it. Its model list also has one Claude model. See &quot;Every Route to Claude&quot;.<\/td>\n<\/tr>\n<tr>\n<td>OpenRouter (a company that resells many models)<\/td>\n<td>Works for open-weight models only<\/td>\n<td>Annie tested her OpenRouter key. Every Anthropic, OpenAI and Google model returned a 403 error, &quot;provider Terms of Service&quot;, even for a plain hello. The open-weight models answered on the same key (Build Logs 29, 80 and 84).<\/td>\n<\/tr>\n<tr>\n<td>Mistral, Grok, Perplexity, Microsoft Copilot<\/td>\n<td>Reported to work directly<\/td>\n<td>Not tested for this course. Facilitator: test these before teaching, or remove the row.<\/td>\n<\/tr>\n<tr>\n<td>Telegram, Tailscale, Obsidian<\/td>\n<td>Work directly<\/td>\n<td>The messaging app, the private network and the notes app. None of them is an AI company.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>There are three kinds of block. A fix for one does not fix the others.<\/strong><\/p>\n<ol>\n<li><strong>Your connection.<\/strong> The company sees a Hong Kong address and refuses. A VPN or your own server fixes this one.<\/li>\n<li><strong>Your sign-up details.<\/strong> OpenAI refuses Hong Kong phone numbers. A VPN does not change your phone number.<\/li>\n<li><strong>Your billing address.<\/strong> In May 2026, Anthropic's developer website did not accept a Hong Kong billing address. A VPN changed nothing, because the check was on the card, not the connection (Build Log 00). Annie's system stopped using that service on 25 September 2026 (Build Log 89). So you may never need it. It is still worth knowing, because it cost her a week.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"short-01-s5\"><h2><span class=\"num\">01.5<\/span> Live Test: Read the Code the Provider Sends Back<\/h2><p>You do not need to guess whether a tool is blocked. Ask the company's server, and read the number it sends back. Every web request gets a number back, called a status code. Five codes matter here.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Code<\/th>\n<th>What it means for you<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>403<\/td>\n<td>Forbidden. The company refused you. From Hong Kong this is usually the regional block.<\/td>\n<\/tr>\n<tr>\n<td>401<\/td>\n<td>Unauthorised. The company answered and asked for a key. Access works.<\/td>\n<\/tr>\n<tr>\n<td>405<\/td>\n<td>Wrong method. The company answered, but expected a different kind of request. Access works.<\/td>\n<\/tr>\n<tr>\n<td>404<\/td>\n<td>Not found. The company answered, but not at that address. Check that you copied the whole command.<\/td>\n<\/tr>\n<tr>\n<td>No answer (a timeout)<\/td>\n<td>A network problem, not the company's decision. Check your Wi-Fi or VPN.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Step 1. Open a terminal.<\/strong><\/p>\n<ul>\n<li>On a Mac: press Command and Space, type Terminal, and press Return.<\/li>\n<li>On Windows: open the Start menu, type PowerShell, and press Return.<\/li>\n<\/ul>\n<p><strong>Step 2. Test Anthropic.<\/strong> Paste this line and press Return. It asks Anthropic's API for a page, and prints only the status code.<\/p>\n<p>On a Mac:<\/p>\n<pre><code class=\"language-bash\">curl -s -o /dev/null -w &quot;%{http_code}\\n&quot; https://api.anthropic.com/v1/messages\n<\/code><\/pre>\n<p>On Windows (PowerShell):<\/p>\n<pre><code class=\"language-powershell\">curl.exe -s -o NUL -w &quot;%{http_code}&quot; https://api.anthropic.com/v1/messages\n<\/code><\/pre>\n<p><strong>What you should see:<\/strong> a three-digit number on the next line.<\/p>\n<ul>\n<li>From a Hong Kong connection with no VPN: 403.<\/li>\n<li>With a VPN on: 405 or 401. Both mean the company answered.<\/li>\n<\/ul>\n<p>Write your code on your sheet.<\/p>\n<p><strong>Step 3. Test opencode, an AI provider for open models.<\/strong> This line is different from Step 2. It ends in <code>-X POST<\/code>, because opencode only answers that kind of request at this address.<\/p>\n<p>On a Mac:<\/p>\n<pre><code class=\"language-bash\">curl -s -o /dev/null -w &quot;%{http_code}\\n&quot; -X POST https://opencode.ai/zen/go/v1/chat/completions\n<\/code><\/pre>\n<p>On Windows (PowerShell):<\/p>\n<pre><code class=\"language-powershell\">curl.exe -s -o NUL -w &quot;%{http_code}&quot; -X POST https://opencode.ai/zen/go/v1/chat/completions\n<\/code><\/pre>\n<p><strong>What you should see:<\/strong> 401. The company answered and wants a key. If you see 404, you left out <code>-X POST<\/code>.<\/p>\n<p><strong>If it fails:<\/strong><\/p>\n<ul>\n<li>If you see &quot;command not found&quot;, you are probably in the wrong program. Close it. Open Terminal or PowerShell again.<\/li>\n<li>If nothing prints for 30 seconds, press Control and C. Then check your Wi-Fi.<\/li>\n<\/ul>\n<h3>Your Terminal Window for the Rest of the Course<\/h3>\n<p><em>Annie's notes, 10 Oct 2026. Reading only, no extra minutes. You make these settings in the build module (Module 08), once a builder is installed.<\/em><\/p>\n<p>This is the first time you open a terminal. Your builders run in a terminal for the rest of the course. So choose your window now.<\/p>\n<p><strong>Your choices:<\/strong><\/p>\n<ul>\n<li>the plain Terminal app that came with your Mac<\/li>\n<li>Ghostty, a free terminal app (ghostty.org)<\/li>\n<li>the Claude desktop app's Code tab<\/li>\n<\/ul>\n<p>All three run the same builder (Seminar Ideas, 30 Jun 2026). Facilitator: Ghostty is for Mac. Confirm the Windows choice on the day.<\/p>\n<p><strong>Annie's advice: use a terminal (Terminal or Ghostty), not the desktop app.<\/strong> Her reason is that it uses fewer tokens. This is what she noticed from daily use. It is not a measurement (Merge Tracker, Checks Before Teaching, item 7).<\/p>\n<p><strong>Four things to know now. The build module (Module 08) sets them up.<\/strong><\/p>\n<ol>\n<li>\n<p><strong>Scrolling back can stop working while Claude Code runs in a terminal.<\/strong><\/p>\n<ul>\n<li>Why: Claude Code's &quot;fullscreen&quot; display keeps old messages inside Claude Code, not in the terminal's own history. With the mouse turned off, the scroll wheel cannot reach them.<\/li>\n<li>The fix is one setting: <code>&quot;tui&quot;: &quot;default&quot;<\/code> in Claude Code's settings file. This switches to the classic display. Every message then stays in the terminal's history. The scroll wheel and normal text selection work.<\/li>\n<li>Annie made this change on 10 Oct 2026 (Claude Code settings documentation, &quot;tui&quot;).<\/li>\n<li>In the fullscreen display, Page Up and Page Down still scroll. Control and O opens the full conversation.<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>Copy and paste does not work at first in Claude Code,<\/strong> because Claude Code takes control of the mouse. In the Full course, pi changes this setting for you, because pi is installed first. Claude Code can also change it itself.<\/p>\n<\/li>\n<li>\n<p><strong>You can choose what shows at the bottom of the window.<\/strong> This line is called the status line. It can show:<\/p>\n<ul>\n<li>how much of the conversation space is used<\/li>\n<li>money spent<\/li>\n<li>the model name and effort level<\/li>\n<li>the folder the builder opened in<\/li>\n<li>the mode, for example auto or planning<\/li>\n<\/ul>\n<p>The status line belongs to the builder, not to the window. So pi and Claude Code show different items. You set up each one separately.<\/p>\n<\/li>\n<li>\n<p><strong>The keys that control a builder while it works:<\/strong><\/p>\n<\/li>\n<\/ol>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Key<\/th>\n<th>What it does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Escape<\/td>\n<td>Stops the builder in the middle of a job. Annie used the tools for weeks before she knew this<\/td>\n<\/tr>\n<tr>\n<td>Enter<\/td>\n<td>Sends your message. While the builder works, Enter does not stop the job. But it does not wait for the job to end either. Both builders read your message as soon as the current step finishes, inside the same job. So it can change what the builder does next. This is true in Claude Code and in pi<\/td>\n<\/tr>\n<tr>\n<td>Control and Enter<\/td>\n<td>Claude Code only. Sends your waiting messages at once. If Claude is only writing its answer, this interrupts it. Work that runs in the background keeps running<\/td>\n<\/tr>\n<tr>\n<td>Control and X, then Enter<\/td>\n<td>Claude Code's built-in key to queue a message for after the job. The message waits its turn and never interrupts the job. Annie moved this to Option and Enter on her Mac on 10 Oct 2026. The build module (Module 08) shows how<\/td>\n<\/tr>\n<tr>\n<td>Option and Enter (Mac), Control and Q (Windows)<\/td>\n<td>pi's default key to queue a message for after the job. Nothing needs setting up. pi holds the message until the whole job is finished. On Windows it is Control and Q, because Windows Terminal already uses Alt and Enter for full screen. Option and Up arrow (Alt and Q on Windows) brings waiting messages back so you can edit them<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><em>Corrected 10 Oct 2026. The first version of this table said Enter makes messages wait until the job is finished. That was wrong.<\/em><\/p>\n<ul>\n<li><em>Claude Code's documentation says a message sent with Enter reaches Claude &quot;as soon as those tool calls finish, within the same turn&quot; (Claude Code docs, &quot;When Claude Code sends what you queued&quot;).<\/em><\/li>\n<li><em>pi's documentation says the same: Enter &quot;guides the next response&quot;, and Alt and Enter &quot;waits until Pi finishes the current task&quot; (pi docs, usage, &quot;Follow Pi's work&quot;).<\/em><\/li>\n<li><em>Annie proved the Claude Code behaviour on 10 Oct 2026. A question she typed in the middle of a job was answered inside that same job.<\/em><\/li>\n<li><em>The Windows keys come from pi's keybindings page. Nobody has tested them on a Windows machine.<\/em><\/li>\n<\/ul>\n<p><strong>Why Enter counts as steering, even when the builder answers your first question first.<\/strong> This confused Annie at first. Here it is in plain steps (Annie and Claude, 10 Oct 2026).<\/p>\n<ol>\n<li><strong>One reply is many small steps.<\/strong> When you ask the builder something, it does not answer in one go. It might search a file, then check a setting, then write the answer. That is three steps inside one reply.<\/li>\n<li><strong>A message sent with Enter arrives between steps.<\/strong> If you press Enter while the builder is busy, it reads your message as soon as the current step finishes. That is before the job is done.<\/li>\n<li><strong>Then the builder decides what to do with it.<\/strong> Annie once typed &quot;what's 4 + 4?&quot; in the middle of a job. It had nothing to do with the job. So the builder carried on and answered both questions at the end. From the outside, that looked like a queue.<\/li>\n<li><strong>It counts as steering, because it could have changed the rest of the job.<\/strong> Suppose Annie had typed &quot;stop, don't touch the settings files&quot; instead. The builder would have read it before its next step, and skipped that work. Her message changed nothing only because 4 + 4 was unrelated.<\/li>\n<li><strong>The queue key is different.<\/strong> With Option and Enter, the builder does not see your message until the whole reply is finished. A &quot;don't touch the settings files&quot; sent that way would arrive too late, after the files were already changed.<\/li>\n<\/ol>\n<p><strong>In short:<\/strong><\/p>\n<ul>\n<li>Enter means &quot;read this at your next step, and change course if it matters&quot;.<\/li>\n<li>Option and Enter means &quot;don't show me this until you're finished&quot;.<\/li>\n<\/ul>\n<p><strong>When to use which:<\/strong><\/p>\n<ul>\n<li>Use Enter to correct the builder in the middle of a job.<\/li>\n<li>Use Option and Enter for a new, unrelated task that should not pull the builder away from the current one.<\/li>\n<\/ul>\n<p><strong>You can change any of these keys, and add your own.<\/strong> You can move most keys in a builder to a key you prefer. Annie does not know every shortcut, and nobody needs to. To find them:<\/p>\n<ul>\n<li>search the web for the builder's name and &quot;keyboard shortcuts&quot;, for example &quot;Claude Code keyboard shortcuts&quot;, or<\/li>\n<li>ask your builder to list its shortcuts and change one for you (Annie, 10 Oct 2026).<\/li>\n<\/ul>\n<p><em>Short course:<\/em> you build with pi only. So the two Claude Code rows apply only if you add Claude later.<\/p>\n<p><strong>What these tests returned when this module was checked:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Test<\/th>\n<th>Where the request came from<\/th>\n<th>Code<\/th>\n<th>Source<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Anthropic, Step 2<\/td>\n<td>Hong Kong<\/td>\n<td>403<\/td>\n<td>9 Oct 2026, through a service that sends requests from a chosen country (see trap 3 under &quot;Control Tests&quot; below: check where your test really came from)<\/td>\n<\/tr>\n<tr>\n<td>Anthropic, Step 2<\/td>\n<td>Taiwan and Singapore<\/td>\n<td>405<\/td>\n<td>9 Oct 2026<\/td>\n<\/tr>\n<tr>\n<td>opencode, Step 3<\/td>\n<td>Hong Kong<\/td>\n<td>401<\/td>\n<td>Build Log 103, 30 Sep 2026<\/td>\n<\/tr>\n<tr>\n<td>opencode, Step 3<\/td>\n<td>Taiwan and Singapore<\/td>\n<td>401<\/td>\n<td>9 Oct 2026<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>\n<section class=\"card\" id=\"short-01-s6\"><h2><span class=\"num\">01.6<\/span> Your Builder, and Claude If You Want It<\/h2><p><em>Short course.<\/em><\/p>\n<p>You need a builder for this course. A builder is the AI that installs software, edits files and fixes problems while you describe what you want in plain English.<\/p>\n<p><strong>In this course you build with pi (harness), connected to opencode Go (AI provider).<\/strong><\/p>\n<ul>\n<li>pi is a way to connect to many AI models, such as DeepSeek and Kimi K3. These open models are good, and they cost much less than the big Western models. <strong>[COST]<\/strong><\/li>\n<li>pi answers from Hong Kong directly. You need no VPN and no server (Build Log 103).<\/li>\n<li>pi understands unclear instructions less well than Claude Code. So your instructions need to be clear. This course shows you how to write them.<\/li>\n<\/ul>\n<p><strong>If you want Claude, a VPN is a very good option.<\/strong><\/p>\n<ul>\n<li>With a VPN on, Claude Code works on your laptop. <strong>[COST]<\/strong><\/li>\n<li>Annie found Claude Code much easier for a non-developer building something new. It works out what you meant from an unclear description (Annie's notes, 29 Sep 2026).<\/li>\n<li>She reached Claude through a paid VPN before she had her own server.<\/li>\n<li>Anthropic's terms may not allow use from a region it does not serve. So whether to use a VPN is your own decision.<\/li>\n<\/ul>\n<p><strong>A Claude model through opencode: being checked.<\/strong><\/p>\n<ul>\n<li>opencode Go's model list has one Claude model: Claude Haiku 5.5, the smallest one.<\/li>\n<li>On 9 October 2026 it answered through Annie's opencode Go plan from a Taiwan connection.<\/li>\n<li>It has not been tested from Hong Kong yet.<\/li>\n<li>Facilitator: run the check in the Merge Tracker before teaching. Then update this paragraph with the result.<\/li>\n<li>On opencode, the larger Claude models are pay-per-use only. They are not on the Go plan. <strong>[COST]<\/strong><\/li>\n<\/ul>\n<p><strong>The optional server sitting.<\/strong> Students who choose it build their own server in Singapore. The server then becomes their route to Claude, with no paid VPN. It runs as a separate sitting, outside this course's 10 hours.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>pi (harness) with opencode Go (AI provider)<\/th>\n<th>Claude Code (harness) through a VPN<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Works from a Hong Kong connection<\/td>\n<td>Yes<\/td>\n<td>Yes, with the VPN on<\/td>\n<\/tr>\n<tr>\n<td>Monthly cost<\/td>\n<td><strong>[COST]<\/strong><\/td>\n<td><strong>[COST]<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Strength<\/td>\n<td>Cheap, fast, and no VPN<\/td>\n<td>Understands unclear, plain-English requests<\/td>\n<\/tr>\n<tr>\n<td>Weakness<\/td>\n<td>Needs clearer instructions from you<\/td>\n<td>Needs the VPN on, and may break Anthropic's terms (see above)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>\n<section class=\"card\" id=\"short-01-s7\"><h2><span class=\"num\">01.7<\/span> Phones and the Mac<\/h2><p><em>Full course, and the Short course's optional server sitting.<\/em><\/p>\n<p>You use your phone to talk to your bot and to open your private pages. Phones and laptops differ in one way that matters here: can you choose which apps use the route out?<\/p>\n<p><strong>Android can choose app by app.<\/strong><\/p>\n<ul>\n<li>In the Tailscale app, use <strong>exclude mode<\/strong>.<\/li>\n<li>Tick only the apps that should stay on your Hong Kong connection, such as Chrome and your banking apps. Everything else uses the route out.<\/li>\n<li>Do not use include mode. It looks safer, but it breaks. Android's address lookup is not an app you can tick. So website names stop working, and the phone can log itself out of Tailscale (Build Log 68).<\/li>\n<\/ul>\n<p><strong>An iPhone routes everything or nothing.<\/strong> There is no app-by-app choice on an iPhone.<\/p>\n<p><strong>The Mac also routes everything or nothing.<\/strong><\/p>\n<ul>\n<li>Annie uses one command that switches her Mac between two states: everything through her server, or her real Hong Kong connection.<\/li>\n<li>The same command prints the address the Mac is using. So she checks the state instead of guessing it (Build Log 103).<\/li>\n<\/ul>\n<p><strong>Trust a test, not a status label.<\/strong><\/p>\n<ul>\n<li>During the Android setup, the Tailscale app showed &quot;Logged out&quot;, but traffic was still going through it.<\/li>\n<li>Claude misread the label. It wrongly decided that the Claude app worked without a VPN.<\/li>\n<li>Annie caught the mistake. A test across the private network proved the connection was up the whole time (Build Log 68).<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-01-s8\"><h2><span class=\"num\">01.8<\/span> From the Record<\/h2><p><strong>The test that was not clean.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> In August 2026 Claude suggested two times that the Claude phone app might work in Hong Kong without a VPN. The first time, Tailscale was still connected during the test. The second time, Claude misread a &quot;Logged out&quot; label as &quot;VPN is down&quot;. Both conclusions were wrong, and Annie caught both.<\/li>\n<li><strong>The cost:<\/strong> two wasted rounds of testing.<\/li>\n<li><strong>The lesson:<\/strong> when a test seems to disprove something you already know, check that the test was clean before you believe it.<\/li>\n<li><strong>Source:<\/strong> Build Log 68.<\/li>\n<\/ul>\n<p><strong>The models on the price list that would not answer.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> In September 2026 Claude recommended two Western models for Annie's bots. Both were blocked for her reseller account, and her notes already said so. Annie asked, &quot;is Haiku better than GLM? try again.&quot; A one-line hello through her OpenRouter key returned 403 for every Anthropic and Google model. Only the open-weight models answered.<\/li>\n<li><strong>The cost:<\/strong> a bot that would not have worked was nearly built.<\/li>\n<li><strong>The lesson:<\/strong> a model on a price list may still refuse you. Before you recommend one, send it a hello from the machine and key that will really use it.<\/li>\n<li><strong>Source:<\/strong> Build Logs 80 and 84.<\/li>\n<\/ul>\n<p><strong>The table that went out of date.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> For months, Annie's notes said that Google's AI was blocked in Hong Kong. In March 2026, consumer Gemini opened to Hong Kong. Nobody noticed until September, when a beginner seminar was being planned and Annie found the change herself.<\/li>\n<li><strong>The cost:<\/strong> a seminar was nearly designed around a tool the audience could not use. The tool they could use was already open.<\/li>\n<li><strong>The lesson:<\/strong> put a date on every fact about what works. Check it again before you teach or build on it.<\/li>\n<li><strong>Source:<\/strong> Build Log 83.<\/li>\n<\/ul>\n<p><strong>The block that a VPN cannot fix.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> In May 2026 Annie needed to buy API credit for her first bot. The developer website refused a Hong Kong billing address. A VPN changed nothing, because the check was on the card. It took about a week of her own research to find a way.<\/li>\n<li><strong>The lesson:<\/strong> your connection, your sign-up details and your billing address are three separate checks. A fix for one does not fix the others.<\/li>\n<li><strong>Source:<\/strong> Build Log 00.<\/li>\n<\/ul>\n<p><strong>The test that came from the wrong country.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> On 9 October 2026, this module's own Hong Kong test came back &quot;405, access works&quot; two times. The first run went out through Taiwan. The second went out through an address on New York time. A third run, from a setting that had passed a location check, returned 403.<\/li>\n<li><strong>The cost:<\/strong> nothing, because the third run happened before the table was written.<\/li>\n<li><strong>The lesson:<\/strong> before you trust a location test, prove where the request came from.<\/li>\n<li><strong>Source:<\/strong> the Merge Tracker, 9 Oct 2026.<\/li>\n<\/ul>\n<p><strong>Why the Mac uses an on/off switch.<\/strong> <em>Full course.<\/em><\/p>\n<ul>\n<li><strong>What happened:<\/strong> In August 2026 Annie's Mac was set up to send only Claude's traffic through her server, and keep everything else in Hong Kong. It was built two times and removed once. Each time, a fragile setting sat in front of her most important tool. Once, an empty settings box broke it with no warning. On 30 September it was replaced with the simple on/off switch above. The switch was safe because pi, which needs no route, was now her second builder.<\/li>\n<li><strong>The lesson:<\/strong> do not put a fragile setting between you and the tool you depend on most. Keep a second tool that does not need that setting.<\/li>\n<li><strong>Sources:<\/strong> Build Logs 69 and 103.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-01-s9\"><h2><span class=\"num\">01.9<\/span> Exercise<\/h2><p>Run the live test for both companies. Then answer three questions in writing.<\/p>\n<ol>\n<li>Which status code did each company return, and what does that code mean?<\/li>\n<li>Which builder will you use? What is your route to Claude, if you want one? Give your reason in one sentence.<\/li>\n<li>Which AI tools have you been reaching through another route, such as a VPN or a work network? Did you know you were doing that?<\/li>\n<\/ol>\n<p>Most people find at least one tool for question 3.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-01-s10\"><h2><span class=\"num\">01.10<\/span> Worksheet: Your Access Sheet<\/h2><p>Copy this table into a new note called <code>Access Sheet<\/code> in your notes app. You move it into your notes folder later in the course.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Tool<\/th>\n<th>What I use it for<\/th>\n<th>Works from Hong Kong directly? (Y / N / test code)<\/th>\n<th>My route<\/th>\n<th>Account created?<\/th>\n<th>Tested on (date)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Gemini (consumer)<\/td>\n<td><\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My builder (pi, and Claude Code in the Full course)<\/td>\n<td>Building and fixing<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Claude, if I want it<\/td>\n<td><\/td>\n<td><\/td>\n<td>VPN, my server, or opencode<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>opencode Go (AI provider)<\/td>\n<td>The models for my bot and for pi<\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Telegram<\/td>\n<td>Talking to my bot<\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Obsidian<\/td>\n<td>My notes, in one place<\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Tailscale (Full course, or the server sitting)<\/td>\n<td>Private network and route out<\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Server company (Full course, or the server sitting)<\/td>\n<td>Computer that is always on<\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Other:<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>My open question for the facilitator:<\/strong><\/p>\n<\/section>\n<section class=\"card\" id=\"short-01-s11\"><h2><span class=\"num\">01.11<\/span> Teaching Notes<\/h2><ul>\n<li><strong>Three students at most in each class<\/strong> (Annie's rule, 9 Oct 2026). Hard material cannot be taught well to a bigger group. Sit beside each student for their first terminal command. Never take the keyboard. The student must be able to do it again at home, alone.<\/li>\n<li><strong>Expect the terms question early.<\/strong> Someone will ask whether a VPN is legal or allowed. Answer with facts only:\n<ul>\n<li>The block is the company's choice.<\/li>\n<li>A workaround may break the company's terms.<\/li>\n<li>Each person decides.<\/li>\n<li>Do not promise that any route will keep working.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Never say Claude Code or the Claude apps work in Hong Kong without a route.<\/strong> This includes the phone apps. If a Claude screen seems to work without a route, the usual reason is that the session is really running on a server in another country. The one open question is a Claude model through opencode. Until that check passes from Hong Kong, call it &quot;being checked&quot;.<\/li>\n<li><strong>The terminal is new for most students.<\/strong> Say &quot;unfamiliar, not hard&quot;.<\/li>\n<li><strong>Windows students need different commands.<\/strong> Keep the PowerShell lines on the slide next to the Mac lines. Nobody has run the Windows lines on a Windows laptop yet. Run them once before teaching.<\/li>\n<li><strong>Company laptops cause most failures.<\/strong> Firewalls and company settings often block the test. If a student has one, they run the live test at home on a personal laptop. They write the result on their sheet for the next session.<\/li>\n<li><strong>If the Wi-Fi is slow,<\/strong> make the live test homework. Do not drop the Access Sheet, because later modules use it.<\/li>\n<li><strong>Full course students will build systems themselves.<\/strong> For them, the method matters more than today's table: date every fact, run a control, and prove where a test came from. Spend the control-test minutes on that.<\/li>\n<\/ul>\n<p><strong>Where v1's other stories went.<\/strong> v1's Block 1 had eleven stories. In the merge:<\/p>\n<ul>\n<li>Log 20 (the drafts permission) moves to the privacy module (Module 02).<\/li>\n<li>Log 15 and v1's &quot;Which Model for What&quot; table move to the script, machine learning or AI judgement module.<\/li>\n<li>Log 28 (the desktop app) moves to the architecture module (Module 03).<\/li>\n<li>Log 63 (the server as exit node) moves to the server module (Module 08B), with the server's location corrected to Singapore.<\/li>\n<li>Log 70 (the leftover proxy setting) is already in the builder module (Module 08).<\/li>\n<li>Logs 92 and 94 (the provider move that broke three things) move to the module on what breaks (Module 10), corrected: only two of the three bots changed model.<\/li>\n<li>Log 77 (YouTube) and v1's recommendation of the Log 69 setup are cut.<\/li>\n<li>Log 29 stays here. Log 69 survives only as the history behind the Mac switch.<\/li>\n<\/ul>\n<p><strong>Changed 10 Oct 2026 (plain-words rewrite):<\/strong><\/p>\n<ul>\n<li>The Full course builder section now matches the pi-first decision. It had said &quot;You build with Claude Code. Until your server is working, Claude Code needs a VPN.&quot; The Full course now uses no paid VPN: pi comes first and builds the route.<\/li>\n<li>pi is described as a way to connect to many models (Annie's wording), not &quot;a small open builder&quot;.<\/li>\n<li>The line &quot;a Claude subscription does not work inside pi&quot; moved out. Module 03 now explains it, with Anthropic's own terms.<\/li>\n<li>Harness, AI provider and AI model labels added where builders are named.<\/li>\n<\/ul>\n<\/section>\n<details class=\"card ref\" id=\"short-01-s12\"><summary><span class=\"num\">01.12<\/span> Sources <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>Build Log 00 (founding record): the billing block and the week of research, verdict dated 25 May 2026.<\/li>\n<li>Build Log 29: Gemini refused from the server, with the Qwen control.<\/li>\n<li>Build Log 63: the paid VPN fighting the private network; the server becomes the route out.<\/li>\n<li>Build Log 68: Android exclude mode, the &quot;Logged out&quot; label, the rule on phone apps.<\/li>\n<li>Build Log 69: the claude.ai bot check; the Mac route-by-address setup, removed 28 Aug 2026.<\/li>\n<li>Build Log 75: the working tool that ruled out the network.<\/li>\n<li>Build Logs 80 and 84: the OpenRouter 403 on Anthropic, OpenAI and Google models.<\/li>\n<li>Build Log 83: the Gemini change and the beginner seminar.<\/li>\n<li>Build Log 89: the system stops using the Anthropic API.<\/li>\n<li>Build Log 103: Anthropic 403 from Hong Kong and 401 through the server; opencode 401 from both; the Mac on/off switch; pi as the second builder; &quot;Model access is disabled&quot;.<\/li>\n<li>Build Log 105: Claude Code on the server, and the first sign-in from Hong Kong.<\/li>\n<li>Build Log 123: a Hong Kong seminar room paying for Gemini Pro, 6 Oct 2026.<\/li>\n<li>Anthropic and OpenAI supported-countries pages, read 9 Oct 2026: Singapore, Japan and Taiwan listed; Hong Kong and Macau absent.<\/li>\n<li>Live tests, 9 Oct 2026: Anthropic 403 from a Hong Kong address; 405 from Taiwan and Singapore; opencode 401 from Taiwan and Singapore; Claude Haiku 5.5 answering through opencode Go from Taiwan. Recorded in the Merge Tracker.<\/li>\n<li>opencode Go's model list, read through pi on Annie's Mac on 10 Oct 2026: includes <code>deepseek-v4.1-flash<\/code> and <code>kimi-k3<\/code>.<\/li>\n<li>Hong Kong Free Press, 16 Mar 2026: Gemini opens to all Hong Kong users.<\/li>\n<li>PTS Consulting, &quot;Is ChatGPT Banned in Hong Kong?&quot;, seen 2 Oct 2026: OpenAI status.<\/li>\n<li>Annie's notes, 29 Sep 2026: Claude Code against an open-model builder for a non-developer.<\/li>\n<li>Merge Tracker, 10 Oct 2026: the pi-first order and no paid VPN in the Full course.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"short-01-s13\"><summary><span class=\"num\">01.13<\/span> Related <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>00 — Side-by-Side (9 Oct 2026) (Pair 1)<\/li>\n<li>01 — Merge Tracker (Decisions, Hours, Checks)<\/li>\n<\/ul>\n<\/details>", "count": 13}, {"id": "short-02", "label": "02", "title": "Module 02: Privacy, Security and Whose Law Reaches Your Data", "minutes": 35, "read": 17, "toc": [["short-02-s1", "02.1", "What You Will Leave With"], ["short-02-s2", "02.2", "Before This Module"], ["short-02-s3", "02.3", "Why This Comes Before Any Connection"], ["short-02-s4", "02.4", "Whose Law Can Reach Your Data"], ["short-02-s5", "02.5", "Your One-Line Rule and the Four Habits That Enforce It"], ["short-02-s6", "02.6", "Build Your Data Map"], ["short-02-s7", "02.7", "From the Record"], ["short-02-s8", "02.8", "Exercise"], ["short-02-s9", "02.9", "Worksheet: Your Data Map"], ["short-02-s10", "02.10", "Teaching Notes"]], "body": "<section class=\"card\" id=\"short-02-s1\"><h2><span class=\"num\">02.1<\/span> What You Will Leave With<\/h2><p><strong>Your Data Map.<\/strong> It sorts your information into three tiers: open, personal and never.<\/p>\n<ul>\n<li>For each tier, it names the companies you allow.<\/li>\n<li>For each tier, it names the places the data may be stored.<\/li>\n<li>It ends with a short list of things that never go into any AI tool.<\/li>\n<li>It also has a protection checklist for your accounts.<\/li>\n<\/ul>\n<p>Two later modules use the map:<\/p>\n<ul>\n<li>The rules module (Module 07) turns the map into rules your bot must follow.<\/li>\n<li>The builder module (Module 08) copies your list of things that never go into any AI tool into your builder's instructions.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-02-s2\"><h2><span class=\"num\">02.2<\/span> Before This Module<\/h2><ul>\n<li><strong>Module 01 finished.<\/strong> You need your Access Sheet. It lists the tools you are about to sort.<\/li>\n<li><strong>A list of your accounts.<\/strong> Email, calendar, cloud storage, password manager, and any AI tools you already use.<\/li>\n<li><strong>Your phone.<\/strong> You will check two-factor sign-in on it.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-02-s3\"><h2><span class=\"num\">02.3<\/span> Why This Comes Before Any Connection<\/h2><p>Every tool you connect in this course gets a permission. A permission given in a hurry is hard to take back.<\/p>\n<p>Here is what happened to Annie (Build Log 14):<\/p>\n<ol>\n<li>In June 2026, Annie asked Google to give her bot less access to her email.<\/li>\n<li>Google kept the old, wider permission anyway.<\/li>\n<li>The reason: a smaller request does not cancel a larger one you granted before.<\/li>\n<li>She had to remove the app's access completely and start again.<\/li>\n<\/ol>\n<p>So the order matters:<\/p>\n<ol>\n<li>First, decide what data goes where. This module gives you those decisions.<\/li>\n<li>Then, connect only the tools that fit those decisions. The build module (Module 08)s make those connections.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"short-02-s4\"><h2><span class=\"num\">02.4<\/span> Whose Law Can Reach Your Data<\/h2><p>People use three words as if they mean the same thing. They do not.<\/p>\n<ul>\n<li><strong>Where the data sits.<\/strong> This is the country the computer holding it is in. Lawyers call this residency.<\/li>\n<li><strong>Whose law can reach it.<\/strong> This is which government can order someone to hand the data over. It depends mostly on where the company is based. It does not depend only on where the computer is. In meetings you will hear this called <strong>sovereignty<\/strong>.<\/li>\n<li><strong>Who can read it.<\/strong> This depends on the company's settings, its contract with you, and the people who run it. This is confidentiality.<\/li>\n<\/ul>\n<p><strong>Where the data sits does not decide whose law reaches it.<\/strong><\/p>\n<ul>\n<li>A US company storing your data in Singapore still has to answer US legal orders.<\/li>\n<li>The law behind this is the US CLOUD Act (2018, 18 U.S.C. section 2713).<\/li>\n<li>It lets US authorities require a US company to hand over data in its control. This applies wherever the data is stored.<\/li>\n<\/ul>\n<p>Annie described her own system honestly in July 2026 (Build Log 28):<\/p>\n<ul>\n<li>Her data sits on machines she controls. That is ownership.<\/li>\n<li>Her backups and models still pass through companies under foreign law. So it is not full sovereignty.<\/li>\n<\/ul>\n<p><strong>Renting a server is choosing a country.<\/strong> You pick a data centre when you sign up. Most people never notice they chose.<\/p>\n<ul>\n<li>Annie's server sits in Singapore (Build Log 00).<\/li>\n<li>She rents it from a company based in Germany.<\/li>\n<li>So two countries are involved: the one where the data sits, and the one where the company is based.<\/li>\n<\/ul>\n<p><strong>The server company's country and the data centre's country can both reach everything on the server. Each AI company's country can reach only what you send it.<\/strong><\/p>\n<p>Here is how that works for Annie's own data. Each country reaches a different slice. (Checked 10 Oct 2026.)<\/p>\n<ol>\n<li><strong>The United States, through Claude and other US companies.<\/strong>\n<ul>\n<li>US law reaches what Annie sends to Claude, such as her chats and the files Claude reads.<\/li>\n<li>It does not reach her whole server.<\/li>\n<li>Claude is not her only US company. opencode, which runs her bots, is in San Francisco. Google holds her email, her calendar and her password-locked backups on Google Drive.<\/li>\n<li>So US law reaches more of her data than Claude alone.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Singapore, because the server sits there.<\/strong>\n<ul>\n<li>Singapore law reaches everything on the server.<\/li>\n<li>The reason: the whole disk is physically in Singapore.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Germany, because Hetzner is a German company.<\/strong>\n<ul>\n<li>The company is Hetzner Online GmbH, in Gunzenhausen, Germany.<\/li>\n<li>German law also reaches everything on the server, because Hetzner controls the machine.<\/li>\n<li>Hetzner's terms say encryption is the customer's job, not Hetzner's.<\/li>\n<\/ul>\n<\/li>\n<li><strong>The British Virgin Islands and Dubai, through Telegram.<\/strong>\n<ul>\n<li>Annie's chats with her bot pass through Telegram's companies in those two places.<\/li>\n<li>Bot chats are not end-to-end encrypted.<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<p><strong>In short:<\/strong> Singapore and Germany can reach the whole server. The United States can reach whatever passes through its companies, and for Annie that is a lot. This is what Annie meant by &quot;ownership, not full sovereignty&quot; (Build Log 28). She owns the machine. Several countries can still reach parts of it.<\/p>\n<p><strong>The companies this course uses or mentions.<\/strong> Policies change. Check each company before you rely on what is written here.<\/p>\n<p><strong>Anthropic (Claude), OpenAI, Google, Microsoft<\/strong><\/p>\n<ul>\n<li>Based in: the United States.<\/li>\n<li>What it means for you: US law can reach your data, wherever it is stored.<\/li>\n<\/ul>\n<p><strong>opencode Go (AI provider: the model subscription your bot uses)<\/strong><\/p>\n<ul>\n<li>Based in: the United States. The company is Anomaly, in San Francisco.<\/li>\n<li>US law reaches opencode.<\/li>\n<li>For the AI model DeepSeek V4.1 Flash on the Go plan, opencode states two things:\n<ul>\n<li>The data is not used for training.<\/li>\n<li>The data is kept for 0 days.<\/li>\n<\/ul>\n<\/li>\n<li>That rests on an agreement with DeepSeek. opencode renews it monthly. It is currently valid to 31 Oct 2026.<\/li>\n<li>The Go page does not say which country runs the model.<\/li>\n<li>opencode's separate pay-per-use service (Zen) says its models run in the US and the EU.<\/li>\n<li>Source: opencode Go and Zen pages, and privacy policy, read 9 Oct 2026.<\/li>\n<\/ul>\n<p><strong>DeepSeek (its own app and API)<\/strong><\/p>\n<ul>\n<li>Based in: mainland China.<\/li>\n<li>Its privacy policy says it collects, processes and stores personal data in the People's Republic of China.<\/li>\n<li>It uses data to train its models.<\/li>\n<li>You have the right to opt out.<\/li>\n<li>Source: DeepSeek privacy policy, read 9 Oct 2026.<\/li>\n<\/ul>\n<p><strong>Qwen (Alibaba), Kimi (Moonshot), GLM (Zhipu), each through its own app<\/strong><\/p>\n<ul>\n<li>Based in: mainland China.<\/li>\n<li>The same question applies to each company's own app. Read each policy.<\/li>\n<\/ul>\n<p><strong>A Chinese-made model reached through another company<\/strong><\/p>\n<ul>\n<li>Based in: wherever that other company is based.<\/li>\n<li>You are bound by the host's policy, not the model maker's.<\/li>\n<li>opencode above is the example: a US company serving models made in China.<\/li>\n<\/ul>\n<p><strong>Mistral<\/strong><\/p>\n<ul>\n<li>Based in: France (European Union).<\/li>\n<li>EU data protection law (GDPR) applies.<\/li>\n<\/ul>\n<p><strong>Telegram<\/strong><\/p>\n<ul>\n<li>Based in: Telegram Group Inc. is in the British Virgin Islands. Telegram FZ-LLC is in Dubai.<\/li>\n<li>Chats with a bot are cloud chats. They are not end-to-end encrypted.<\/li>\n<li>Only Telegram's secret chats are end-to-end encrypted. Bots cannot use secret chats.<\/li>\n<li>Whoever runs the bot receives every message you send it.<\/li>\n<li>Source: Telegram privacy policy, sections 3.3 and 6, read 9 Oct 2026.<\/li>\n<\/ul>\n<p><strong>Your rented server (Full course, or the optional server sitting)<\/strong><\/p>\n<ul>\n<li>Based in: the server company's country, plus the data centre you pick.<\/li>\n<li>Pick the data centre on purpose.<\/li>\n<\/ul>\n<p><strong>Hong Kong's own privacy law also applies to you.<\/strong> It is the Personal Data (Privacy) Ordinance (PDPO).<\/p>\n<ul>\n<li>It covers personal data you put into any tool.<\/li>\n<li>That includes data about other people.<\/li>\n<li>Your family's and your friends' details belong to them as well as to you.<\/li>\n<\/ul>\n<p><strong>Training on your data is a setting, not a fact.<\/strong><\/p>\n<ul>\n<li>Since August 2025, people on Claude's Free, Pro and Max plans choose whether their chats and coding sessions train future models.<\/li>\n<li>If you allow it, Anthropic keeps the data for up to 5 years.<\/li>\n<li>If you do not allow it, Anthropic keeps it for 30 days.<\/li>\n<li>Source: Anthropic, &quot;Updates to Consumer Terms and Privacy Policy&quot;, Aug 2025.<\/li>\n<\/ul>\n<p>Check this setting today on every AI account you hold.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-02-s5\"><h2><span class=\"num\">02.5<\/span> Your One-Line Rule and the Four Habits That Enforce It<\/h2><p>Annie wrote one rule in June 2026. She tested every later connection against it (Build Log 00 and the trust-boundary session of 24 Jun 2026):<\/p>\n<blockquote>\n<p><strong>Read freely. Write to my own notes freely. Anything that goes to another person needs my yes, every time.<\/strong><\/p>\n<\/blockquote>\n<p><strong>Why this one rule matters.<\/strong> In June 2025 the writer Simon Willison named the most dangerous combination in AI tools. It is an AI assistant that does all three of these:<\/p>\n<ol>\n<li>It holds your private data.<\/li>\n<li>It reads content from strangers, such as incoming email.<\/li>\n<li>It has a way to send data out.<\/li>\n<\/ol>\n<p>Take away the way out. Then an instruction hidden in a stranger's email cannot send your data anywhere.<\/p>\n<p>Four habits make the rule real.<\/p>\n<p><strong>Habit 1: Put the limit in the permission, not in the instructions.<\/strong><\/p>\n<ul>\n<li>A sentence such as &quot;never send email&quot; is a request. The model can misread it.<\/li>\n<li>Annie's email tool has read-only access at Google's end.<\/li>\n<li>Its script also has no command that sends.<\/li>\n<li>So Google refuses a send even if something tries one (Build Log 18).<\/li>\n<li>That is two separate protections. Neither depends on the model behaving.<\/li>\n<\/ul>\n<p><strong>Habit 2: Give each tool the smallest access that does the job.<\/strong><\/p>\n<ul>\n<li>Say a bot needs one calendar.<\/li>\n<li>Give it a small script that can only read that one calendar.<\/li>\n<li>Do not give it your whole account plus a sentence asking it to stay in one corner.<\/li>\n<li>Annie built exactly this for a family member's tutor bot (Build Log 54).<\/li>\n<\/ul>\n<p><strong>Habit 3: Revoke at the source before you delete anything.<\/strong><\/p>\n<ul>\n<li>Deleting a file that holds a login does not cancel the login.<\/li>\n<li>The login still works from any backup copy.<\/li>\n<li>In June 2026, an old Google login on Annie's server still had wide calendar access. Her bot used it once, even though its rules said never to (Build Log 16).<\/li>\n<li>The fix had three steps, in this order:\n<ol>\n<li>Cancel the login at Google.<\/li>\n<li>Check that Google refused it.<\/li>\n<li>Only then delete the files.<\/li>\n<\/ol>\n<\/li>\n<li>The same applies inside chat apps. Disconnecting a tool inside a chat app does not cancel its permission at the company that granted it. The permission stays live until you remove it there too (Build Log 61).<\/li>\n<\/ul>\n<p><strong>Habit 4: Label every paste before you paste it.<\/strong><\/p>\n<ul>\n<li>Before your builder asks you to paste anything, it should say which kind it is:\n<ul>\n<li>safe to paste,<\/li>\n<li>remove the secret first, or<\/li>\n<li>never paste.<\/li>\n<\/ul>\n<\/li>\n<li>Never paste passwords, API keys, tokens or private keys into any chat (Build Log 00).<\/li>\n<li>You will put this rule into your builder's instructions in the builder module (Module 08).<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-02-s6\"><h2><span class=\"num\">02.6<\/span> Build Your Data Map<\/h2><ol>\n<li>Fill in the worksheet below.<\/li>\n<li>Then fill in the protection checklist.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"short-02-s7\"><h2><span class=\"num\">02.7<\/span> From the Record<\/h2><p><strong>The drafts request.<\/strong> (Source: Build Log 20.)<\/p>\n<ol>\n<li>In June 2026, Annie asked whether her bot could save approved email replies into her Gmail drafts folder.<\/li>\n<li>Her builder checked the real permissions before answering.<\/li>\n<li>Google has no permission that allows drafts but not sending. The smallest permission that writes drafts can also send.<\/li>\n<li>So the change would turn &quot;sending is impossible&quot; into &quot;sending is possible but unused&quot;.<\/li>\n<li>Annie shelved the feature. She called the explanation &quot;huge to me&quot;.<\/li>\n<\/ol>\n<p>The cost was one convenience given up. The lesson: when the exact control you want does not exist, choose the stricter control you can prove.<\/p>\n<p><strong>A smaller request is not a revoke.<\/strong> (Source: Build Log 14.)<\/p>\n<ol>\n<li>In June 2026, Annie tried twice to give her email tool read-only access.<\/li>\n<li>Each time, Google handed back the old send permission. New consent adds to old consent.<\/li>\n<li>The only fix was to remove the app's access fully, through Google's revoke page.<\/li>\n<li>Then she approved it again from a clean start.<\/li>\n<\/ol>\n<p>The lesson: taking access back is a deliberate act at the company. It is not a smaller request.<\/p>\n<p><strong>Moving a key is not securing it.<\/strong> (Source: Build Log 103.)<\/p>\n<ol>\n<li>On 30 September 2026, the builder moved a web-service key out of one settings file and into its own file.<\/li>\n<li>It called this a security improvement.<\/li>\n<li>Annie asked one question: &quot;did we not move the old credential straight to the secrets.env file?&quot;<\/li>\n<li>She was right. The same key now existed in nine places on the server.<\/li>\n<li>Only replacing the key with a new one retires every old copy.<\/li>\n<li>A one-command script now does three things: it updates every live copy, restarts the programs that read it, and checks they reconnect.<\/li>\n<\/ol>\n<p>The lesson: count every copy of a secret before you claim it is safe.<\/p>\n<p><strong>The photo reached the gallery first.<\/strong> (Source: Build Log 82.)<\/p>\n<ol>\n<li>Annie wanted photos she sent to her storage bot kept out of Google Photos.<\/li>\n<li>Her builder recorded her real steps on screen. It read the video frame by frame.<\/li>\n<li>Taking a photo with the camera writes a copy to the phone's public gallery. This happens before Telegram or any bot is involved.<\/li>\n<li>No setting in the chat app can stop that.<\/li>\n<\/ol>\n<p>The lesson: check where your phone has already put private material before you worry about the bot.<\/p>\n<p><strong>Two printed keys.<\/strong> (Source: Build Log 103 and Annie's notes.)<\/p>\n<ol>\n<li>Twice on 30 September 2026, a session inspected a settings file to see its structure.<\/li>\n<li>Both times, it printed a live key on screen.<\/li>\n<li>Both times, it looked like a harmless check.<\/li>\n<li>The terminal keeps a record. So do AI tools.<\/li>\n<\/ol>\n<p>The house rule since then: when you inspect settings, print the names of keys, never their values.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-02-s8\"><h2><span class=\"num\">02.8<\/span> Exercise<\/h2><p>Take three real things you want your system to handle. For example: your family calendar, your expense receipts, and your meeting notes.<\/p>\n<p>For each one, answer on paper:<\/p>\n<ol>\n<li>Which tier is it in: open, personal, or never?<\/li>\n<li>Which company will process it? Which country's law reaches that company?<\/li>\n<li>If that company changed its terms tomorrow, which of your files would you need to keep?<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"short-02-s9\"><h2><span class=\"num\">02.9<\/span> Worksheet: Your Data Map<\/h2><p><strong>My one-line rule:<\/strong> ____________________________________________<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Tier<\/th>\n<th>What belongs here<\/th>\n<th>My examples<\/th>\n<th>Companies I allow<\/th>\n<th>Where it may be stored<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Open<\/td>\n<td>Public information, research, drafts I would publish anyway<\/td>\n<td><\/td>\n<td>Any company on my Access Sheet<\/td>\n<td>Anywhere<\/td>\n<\/tr>\n<tr>\n<td>2. Personal<\/td>\n<td>My notes, plans, calendar, family admin<\/td>\n<td><\/td>\n<td>Only companies I chose on purpose, with training switched off<\/td>\n<td>My laptop and my notes. My own server, if I have one<\/td>\n<\/tr>\n<tr>\n<td>3. Never<\/td>\n<td>Passwords, keys, ID numbers, bank and card numbers, other people's confidential business<\/td>\n<td><\/td>\n<td>None. These never go into any AI tool or bot chat<\/td>\n<td>A password manager only<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Client or employer information:<\/strong> keep it out of your personal bot, unless your organisation has approved a tool for it. Write your organisation's rule here: ____________<\/p>\n<p><strong>Protection checklist<\/strong> (tick each one before the builder module (Module 08)):<\/p>\n<ul>\n<li class=\"task\"><span class=\"box\"><\/span>Disk encryption is on for my laptop (FileVault on Mac, BitLocker or Device Encryption on Windows).<\/li>\n<li class=\"task\"><span class=\"box\"><\/span>I use a password manager, and no password lives in my notes.<\/li>\n<li class=\"task\"><span class=\"box\"><\/span>Two-factor sign-in is on for my email, Telegram, every AI account, and my server company if I have one.<\/li>\n<li class=\"task\"><span class=\"box\"><\/span>I have checked the &quot;use my data for training&quot; setting on every AI account.<\/li>\n<li class=\"task\"><span class=\"box\"><\/span>I know which of my accounts are work accounts and which are personal.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-02-s10\"><h2><span class=\"num\">02.10<\/span> Teaching Notes<\/h2><ul>\n<li><strong>Three students at most in each class.<\/strong> Walk through each student's Data Map with them. The map is personal. Do it beside them, not on the projector.<\/li>\n<li><strong>Both courses use the personal frame.<\/strong> The Full course adds &quot;When the Data Is Your Clients'&quot; for awareness only. Say so when you teach it: this is what to think about. It is not a licence to handle client data alone.<\/li>\n<li><strong>opencode is the best example in the module.<\/strong> It is a US company. It serves a model made in China. It works under an agreement about where data is kept. So the company's country, the model maker's country and the place the data sits are three different answers.<\/li>\n<li><strong>Students will want a verdict on Chinese against US companies.<\/strong> Do not give one. Give the facts in the company list. Let each student place each kind of data. The answer differs by kind of data.<\/li>\n<li><strong>Keep the CLOUD Act factual.<\/strong> Say what the law allows and when it was passed. Do not guess how often it is used.<\/li>\n<li><strong>Annie's own stories carry this module.<\/strong> Read them as written. They show a careful owner who still found gaps. That is more convincing than a list of rules.<\/li>\n<li><strong>Developers will ask about encryption and key management.<\/strong> Point them to the server module (Module 08B) (one source for each secret). Point them to the module on what breaks (Module 10) for replacing keys.<\/li>\n<li><strong>The company list can turn into a long debate.<\/strong> Keep it to 10 minutes.<\/li>\n<li><strong>Do not show real screenshots.<\/strong> Any example on a slide uses invented names. Never show codes, account numbers or web addresses that contain keys.<\/li>\n<\/ul>\n<p><strong>Where v1's other stories went.<\/strong> v1's Block 2 carried eleven stories. In the merge they moved like this:<\/p>\n<ul>\n<li><strong>To the server module (Module 08B):<\/strong> Logs 05 and 06 (the firewall order).<\/li>\n<li><strong>To the module on what breaks (Module 10):<\/strong>\n<ul>\n<li>Logs 21, 53 and 95.<\/li>\n<li>Log 82's deletion of 411 files.<\/li>\n<li>Log 14's second lesson (a catch-all error handler hid a bug).<\/li>\n<li>Log 61's &quot;one account failing or all accounts failing&quot; check.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Placed in Module 08B, homework section (10 Oct 2026):<\/strong> Log 49 (a password box does not protect a public page).<\/li>\n<li><strong>In Module 01 and the server module (Module 08B):<\/strong> Logs 63, 68 and 69.<\/li>\n<li><strong>In Module 01:<\/strong> Log 75.<\/li>\n<li><strong>In this module:<\/strong> Log 61's line about disconnecting is now part of the habit &quot;Revoke at the source&quot;.<\/li>\n<\/ul>\n<p><strong>Changed 10 Oct 2026 (plain-words rewrite):<\/strong><\/p>\n<ul>\n<li>opencode Go is labelled as the AI provider, and DeepSeek V4.1 Flash as the AI model. This matches Module 03's harness, provider and model labels.<\/li>\n<li>The company table and the client-data table became short lists, because their cells were dense. The table of six deployment levels became a numbered list. Every fact in them is kept.<\/li>\n<li>Nothing else changed in substance.<\/li>\n<\/ul>\n<p><strong>Added 10 Oct 2026 (Annie's request):<\/strong> under &quot;Renting a server is choosing a country&quot;, a new line and a four-point list showing which country reaches which slice of Annie's own data. Hetzner's company location was checked on Hetzner's pages on 10 Oct 2026. A line about Annie's own disk encryption was taken out the same day at her request, because it described her security setup in student material.<\/p>\n<\/section>\n<details class=\"card ref\" id=\"short-02-s11\"><summary><span class=\"num\">02.11<\/span> Sources <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>Build Log 00 (founding record): the one-line rule, the pasting rule, the server in Singapore.<\/li>\n<li>Build Log 14: Google permissions do not shrink.<\/li>\n<li>Build Log 16: revoke before you delete.<\/li>\n<li>Build Log 18: read-only by design.<\/li>\n<li>Build Log 20: no drafts-only permission.<\/li>\n<li>Build Log 28: ownership compared with sovereignty.<\/li>\n<li>Build Log 54: a narrow calendar script for a sealed bot.<\/li>\n<li>Build Log 61: disconnecting in a chat tool does not revoke.<\/li>\n<li>Build Log 82: photos reach the gallery before the bot.<\/li>\n<li>Build Logs 92 and 94: two bots moved to one model, and the outage that followed.<\/li>\n<li>Build Log 103: moving a key is not replacing it; never print a key.<\/li>\n<li>&quot;The Rented Brain&quot; write-up (Seminar Ideas, July 2026): the six deployment levels, the four ways a rented model can change, keeping files portable.<\/li>\n<li>Simon Willison, 16 Jun 2025: the &quot;lethal trifecta&quot; for AI agents.<\/li>\n<li>US CLOUD Act, 2018, 18 U.S.C. section 2713.<\/li>\n<li>DeepSeek privacy policy, read 9 Oct 2026: data stored in the People's Republic of China; training, with a right to opt out.<\/li>\n<li>opencode Go and Zen documentation and privacy policy, read 9 Oct 2026: company in San Francisco; per-model training and retention; DeepSeek agreement valid to 31 Oct 2026; Zen models run in the US and EU.<\/li>\n<li>Telegram privacy policy, read 9 Oct 2026: company locations, cloud chats, secret chats, what bots receive.<\/li>\n<li>Anthropic, &quot;Updates to Consumer Terms and Privacy Policy&quot;, Aug 2025: 5 years with training, 30 days without.<\/li>\n<li>OpenAI ChatGPT release notes and Ars Technica, Aug 2025: GPT-4o removed, then restored for paid users.<\/li>\n<li>PCPD, &quot;Protecting Personal Data Privacy in the Use of Agentic AI&quot;, 25 Aug 2026; Dentons Hong Kong, 1 Sep 2026; Bird &amp; Bird, 27 Aug 2026.<\/li>\n<li>Baker McKenzie Cloud Compliance Center and Tanner De Witt, seen 9 Oct 2026: Section 33 not in force.<\/li>\n<li>v1 Block 2, provider-page checks of 29 Sep 2026: zero data retention at OpenAI, Anthropic and Google; OpenRouter's metadata.<\/li>\n<li>Hetzner, &quot;Data Protection at Hetzner&quot; and the Singapore location press release (6 Aug 2024), read 10 Oct 2026: Hetzner Online GmbH is in Germany; Singapore uses rented space in another company's data centre; encryption is the customer's job.<\/li>\n<\/ul>\n<\/details>\n<details class=\"card ref\" id=\"short-02-s12\"><summary><span class=\"num\">02.12<\/span> Related <span class=\"hint\">tap to open<\/span><\/summary><ul>\n<li>01 — What Works From Hong Kong (Merged)<\/li>\n<li>01 — Merge Tracker (Decisions, Hours, Checks)<\/li>\n<li>00 — Side-by-Side (9 Oct 2026) (Pair 2)<\/li>\n<\/ul>\n<\/details>", "count": 12}, {"id": "short-03", "label": "03", "title": "Module 03: Architecture and Where Your System Lives", "minutes": 70, "read": 31, "toc": [["short-03-s1", "03.1", "What You Will Leave With"], ["short-03-s2", "03.2", "Before This Module"], ["short-03-s3", "03.3", "Where Is the One Real Copy?"], ["short-03-s4", "03.4", "Five Questions About How You Work"], ["short-03-s5", "03.5", "The Parts of the System"], ["short-03-s6", "03.6", "The Vault, and One Job Each for Calendar, Vault and Inbox"], ["short-03-s7", "03.7", "Build Your Vault"], ["short-03-s8", "03.8", "Three Questions and the Decision Tree"], ["short-03-s9", "03.9", "What the Optional Server Sitting Adds"], ["short-03-s10", "03.10", "Telegram as the Front Door"], ["short-03-s11", "03.11", "Your Shape Decision, and What Your System Does at 11pm on a Bad Day"], ["short-03-s12", "03.12", "From the Record"], ["short-03-s13", "03.13", "Exercise"], ["short-03-s14", "03.14", "Worksheet: System Sketch and Shape Decision"], ["short-03-s15", "03.15", "Teaching Notes"]], "body": "<div class=\"intro\"><p>The module has two halves:<\/p>\n<ol>\n<li><strong>&quot;A System That Fits How You Think&quot;.<\/strong> This half fits the system to the person and builds the notes vault.<\/li>\n<li><strong>&quot;Where Your System Lives&quot;.<\/strong> This half decides which machine the system runs on.<\/li>\n<\/ol>\n<p>You can teach the second half in the next session. In the Full course, teach it at least a day before the server module (Module 08B). The reason: the server company's identity check can take time.<\/p>\n<p>Prices are marked <strong>[COST]<\/strong>. They go in last.<\/p>\n<\/div>\n<section class=\"card\" id=\"short-03-s1\"><h2><span class=\"num\">03.1<\/span> What You Will Leave With<\/h2><ul>\n<li><strong>Your worksheet answers.<\/strong> Six lines about how you find, capture, plan and share.<\/li>\n<li><strong>A working vault.<\/strong> This is an Obsidian folder on your laptop and your phone. It holds your folders, an inbox, a map note (one line per folder saying what lives there), your Access Sheet and your Data Map.<\/li>\n<li><strong>Your Shape Decision.<\/strong> It says which machine runs your system. Telegram is ready on your phone. In the Full course, it also records the server you ordered.<\/li>\n<li><strong>Homework:<\/strong> a one-page System Sketch: your system drawn as boxes and arrows.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-03-s2\"><h2><span class=\"num\">03.2<\/span> Before This Module<\/h2><ul>\n<li><strong>Modules 01 and 02 finished.<\/strong> Bring the Access Sheet and the Data Map.<\/li>\n<li><strong>Admin rights on your laptop.<\/strong> You will install one app.<\/li>\n<li><strong>Your phone, with Telegram installed.<\/strong><\/li>\n<\/ul>\n<\/section>\n<div class=\"partbar\">A System That Fits How You Think<\/div>\n<section class=\"card\" id=\"short-03-s3\"><h2><span class=\"num\">03.3<\/span> Where Is the One Real Copy?<\/h2><p>Count the places your notes and instructions live today. Most people find four to six. For example:<\/p>\n<ul>\n<li>a notes app<\/li>\n<li>email drafts<\/li>\n<li>a to-do app<\/li>\n<li>documents in Downloads<\/li>\n<li>a chat with an AI that remembers some things<\/li>\n<li>a paper notebook<\/li>\n<\/ul>\n<p>Annie's own system had this problem twice:<\/p>\n<ol>\n<li><strong>June 2026.<\/strong> Her notes about the bot lived in three places: a folder on her Mac, Obsidian, and the bot's server (Build Log 03).<\/li>\n<li><strong>August 2026.<\/strong> Her builder had four separate memories: two accounts on the Mac, one on the server, and an old project folder. They had drifted apart. The version on her phone felt like a stranger, because it read a different copy of her (Build Log 47).<\/li>\n<\/ol>\n<p><strong>Two copies of one file slowly become different from each other. Then you cannot trust either one.<\/strong> That is the reason for this module. The fix is one real copy that every device and every tool reads.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-03-s4\"><h2><span class=\"num\">03.4<\/span> Five Questions About How You Work<\/h2><p><strong>There is no correct design. There is only the one that fits the person using it.<\/strong><\/p>\n<ul>\n<li>Most AI advice hands everyone the same tools and the same folders.<\/li>\n<li>When it does not stick, people blame their own discipline.<\/li>\n<li>The real cause is usually that the system was built for someone else's habits.<\/li>\n<li>A system that is awkward to use gets abandoned within a few weeks.<\/li>\n<\/ul>\n<p>These five questions change the design.<\/p>\n<p><strong>1. How do you find things again?<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>If you remember...<\/th>\n<th>Then your system should...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><em>Where<\/em> you saw something<\/td>\n<td>Be organised by place: folders, projects, people<\/td>\n<\/tr>\n<tr>\n<td><em>When<\/em> you saw it<\/td>\n<td>Be organised by time: dated notes and logs<\/td>\n<\/tr>\n<tr>\n<td><em>What it was about<\/em><\/td>\n<td>Be searchable, with notes that link to each other<\/td>\n<\/tr>\n<tr>\n<td>Nothing reliably<\/td>\n<td>Capture things for you automatically, with no filing decision<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The last row matters most for people with busy heads. If saving a thought costs a filing decision, the thought gets lost.<\/p>\n<p><strong>2. How do you capture?<\/strong><\/p>\n<ul>\n<li>Typing, voice, photos, or forwarding things on.<\/li>\n<li>Whatever you actually use is the front door.<\/li>\n<li>A system with a front door you avoid will not be used.<\/li>\n<\/ul>\n<p><strong>3. When are you at your best?<\/strong><\/p>\n<ul>\n<li>Some people plan in the morning and act at night. Others do the reverse.<\/li>\n<li>Your automations should arrive before the moment they are useful.<\/li>\n<li>A 7am summary helps someone who plans early. For someone who plans late, it is a message they will mute.<\/li>\n<\/ul>\n<p><strong>4. What do you dread doing?<\/strong><\/p>\n<ul>\n<li>For example: chasing invoices, filing receipts, copying between systems, writing the same email.<\/li>\n<li>The best first automation is the one you dread, not the cleverest one.<\/li>\n<li>The dread is what keeps you maintaining it.<\/li>\n<\/ul>\n<p><strong>5. Who else has to work with you?<\/strong><\/p>\n<ul>\n<li>If nobody else touches your system, build it for one person.<\/li>\n<li>Once a spouse, an assistant or a colleague needs access, you must be able to separate your private notes from shared ones.<\/li>\n<li>Annie has bots sealed to one person and one purpose, such as a tutor for her son. Those bots must not see the rest of her life (Build Log 54).<\/li>\n<\/ul>\n<h3>Worksheet: How I Work<\/h3>\n<p>Answer in one line each. Do not overthink.<\/p>\n<ol>\n<li>When you need something you saved six months ago, what do you search for: the <strong>place<\/strong>, the <strong>date<\/strong>, or the <strong>topic<\/strong>?<\/li>\n<li>How do you capture a thought at 2am: type it, say it, or lose it?<\/li>\n<li>Which single task do you dread most, and when does it come up?<\/li>\n<li>When do you plan, and when do you act?<\/li>\n<li>Who else will ever need to see your notes, and who must never?<\/li>\n<li>What have you tried before and abandoned, and why? This is the most useful answer on the page.<\/li>\n<\/ol>\n<h3>Annie's Answers, as a Worked Example<\/h3>\n<p>This is not a template to copy. It shows one person's habits turned into design choices.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>How Annie works<\/th>\n<th>What she built<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Thinks in linked ideas, not folders<\/td>\n<td>One vault where notes link to each other<\/td>\n<\/tr>\n<tr>\n<td>Loses anything that needs a filing decision<\/td>\n<td>One inbox, sorted every night by a scheduled job<\/td>\n<\/tr>\n<tr>\n<td>Works across two accounts and several devices<\/td>\n<td>A continuity note, so the next session picks up where the last one stopped<\/td>\n<\/tr>\n<tr>\n<td>Uses her laptop, her phone and different times of day<\/td>\n<td>Several ways in, all reading one set of notes<\/td>\n<\/tr>\n<tr>\n<td>Dreads admin above everything else<\/td>\n<td>Admin handed over first: briefs, filing, reminders, chasing<\/td>\n<\/tr>\n<tr>\n<td>Family time is fixed<\/td>\n<td>Bots sealed to family jobs, and a system that protects that time<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Six Ways a Personal System Fails<\/h3>\n<ol>\n<li><strong>Copying someone else's system whole.<\/strong> It was built for how they think.<\/li>\n<li><strong>Building the clever thing before the needed thing.<\/strong> The clever thing gets abandoned. The needed thing gets maintained.<\/li>\n<li><strong>Keeping two places to look.<\/strong> One of them is always out of date.<\/li>\n<li><strong>Designing for a tidier version of yourself.<\/strong> Build for the person who actually shows up.<\/li>\n<li><strong>Making capture cost a decision.<\/strong> If saving something needs a choice, it does not get saved.<\/li>\n<li><strong>Building for the demo instead of a normal day.<\/strong> Ask whether it still helps on an ordinary, tired weekday.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"short-03-s5\"><h2><span class=\"num\">03.5<\/span> The Parts of the System<\/h2><p><strong>Each part has one job.<\/strong> When one part tries to do another part's job, things go wrong in ways that are hard to see.<\/p>\n<p>Annie's summary from September 2026 (Build Logs 78 to 92):<\/p>\n<ul>\n<li>The bots act.<\/li>\n<li>The watchdog only reports.<\/li>\n<li>A separate script restarts stuck bots.<\/li>\n<li>Claude Code builds.<\/li>\n<\/ul>\n<p><strong>The builder and the bot are different.<\/strong> People mix them up. (Source: Build Log 23.)<\/p>\n<ul>\n<li><strong>The bot<\/strong> is the AI assistant you message from your phone. It has a personality, a small set of skills, and low running costs.<\/li>\n<li><strong>The builder<\/strong> is the tool you use at your desk to build or fix something real. It can read every file and change the system itself.<\/li>\n<li>You build the builder first. Then you use it to build the bot.<\/li>\n<\/ul>\n<h3>Short Course: The Laptop Version<\/h3>\n<pre><code class=\"language-mermaid\">flowchart LR\n  You((You)) -- &quot;plain-English requests&quot; --&gt; Builder\n  subgraph Laptop[&quot;Your laptop (only while it is open)&quot;]\n    Builder[&quot;Your AI assistant (pi)&quot;]\n    Vault[(&quot;Your vault&quot;)]\n  end\n  Builder -- &quot;reads and edits&quot; --&gt; Vault\n  Builder -- &quot;asks for an answer&quot; --&gt; Model[&quot;A rented AI model&quot;]\n<\/code><\/pre>\n<p>In this course, everything runs on your laptop.<\/p>\n<ul>\n<li>Your AI assistant and your vault live there.<\/li>\n<li>There is no bot.<\/li>\n<li>The AI assistant works while the laptop is open. You talk to it in the terminal.<\/li>\n<\/ul>\n<p>Some things need a machine that stays on:<\/p>\n<ul>\n<li>a bot you can message from your phone<\/li>\n<li>jobs that run while you sleep<\/li>\n<li>a watchdog that checks every hour<\/li>\n<\/ul>\n<p>That is what the optional server sitting adds.<\/p>\n<p><em>Corrected 10 Oct 2026 while merging Pair 8 in the Merge Tracker: the Short course has no bot in its 10 hours (Merge Tracker, 10 Oct decision). The earlier text said the builder, the bot and the vault all lived on the laptop.<\/em><\/p>\n<h3>How Your Builder and Your Bot Reach an AI: Harness, Provider, Model<\/h3>\n<p><em>Added 10 Oct 2026 at Annie's request. Both courses.<\/em><\/p>\n<p>The diagrams above show an arrow to &quot;a rented AI model&quot;. That arrow has three parts. You will hear the three words all through this course.<\/p>\n<p><strong>You → harness → AI provider → AI model.<\/strong> Then the answer comes back the same way.<\/p>\n<p><strong>The short version, with pi.<\/strong> <em>(Added 10 Oct 2026. Annie: &quot;it needs to be in there&quot;.)<\/em><\/p>\n<ul>\n<li><strong>pi is the harness.<\/strong> It is the program you type into. It sends your words to the AI. It lets the AI read your files and run commands.<\/li>\n<li><strong>opencode Go is the AI provider.<\/strong> It is the company that runs the AI on its own computers. It charges you $10 a month <strong>[COST]<\/strong>. pi connects to it with your key.<\/li>\n<li><strong>DeepSeek is the AI model.<\/strong> It is the AI that writes the answers. opencode Go offers many models. DeepSeek is the one this course uses. Kimi K3 is another.<\/li>\n<\/ul>\n<p><strong>The order:<\/strong> you → pi (harness) → opencode Go (AI provider) → DeepSeek (AI model). The answer comes back the same way.<\/p>\n<p><strong>The same pattern for Claude:<\/strong> Claude Code is the harness. Anthropic is the AI provider. Opus 5.5 is the AI model.<\/p>\n<p><strong>And Annie's bot:<\/strong> Hermes is the harness. opencode Go is the AI provider. DeepSeek is the AI model.<\/p>\n<ul>\n<li>That is why one opencode Go plan pays for both pi and the bot.<\/li>\n<li>They are two harnesses using the same provider and the same model.<\/li>\n<\/ul>\n<p>The rest of this section explains each part in more detail.<\/p>\n<p><strong>1. The harness.<\/strong> The harness is the program you use.<\/p>\n<ul>\n<li>It takes your words and sends them to the AI.<\/li>\n<li>It lets the AI do things, such as read your files and run commands.<\/li>\n<li>It decides how the AI works: what it can touch, and what it must ask you first.<\/li>\n<li>Examples: pi and Claude Code are harnesses for building. Hermes is the harness Annie's bots run on.<\/li>\n<\/ul>\n<p><strong>2. The AI provider.<\/strong> The provider is the company that runs the AI on its own computers.<\/p>\n<ul>\n<li>You pay the provider, by subscription or by use.<\/li>\n<li>Your harness connects to the provider with a key or a sign-in. A key is a long password that lets a program use your account.<\/li>\n<li>Examples: opencode Go and Anthropic.<\/li>\n<li>Hong Kong blocks happen here, at the provider (Module 01).<\/li>\n<\/ul>\n<p><strong>3. The AI model.<\/strong> The model is the AI that writes the answers. It is your bot's &quot;brain&quot;.<\/p>\n<ul>\n<li>One provider can offer many models.<\/li>\n<li>Examples: DeepSeek V4.1 Flash and Kimi K3 (both on opencode Go), and Claude Opus 5.5 (on Anthropic).<\/li>\n<\/ul>\n<p><strong>Annie's three setups (checked 10 Oct 2026):<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Harness<\/th>\n<th>Provider<\/th>\n<th>Model<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Her building at the desk<\/td>\n<td>Claude Code<\/td>\n<td>Anthropic, through her Claude subscription<\/td>\n<td>Claude Opus 5.5<\/td>\n<\/tr>\n<tr>\n<td>Her second builder<\/td>\n<td>pi<\/td>\n<td>opencode Go<\/td>\n<td>DeepSeek V4.1 Flash<\/td>\n<\/tr>\n<tr>\n<td>Her three bots<\/td>\n<td>Hermes<\/td>\n<td>opencode Go<\/td>\n<td>DeepSeek V4.1 Flash<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Sources: Annie's pi settings and the bots' settings on her server, both read 10 Oct 2026.<\/p>\n<p><strong>Why the three parts matter:<\/strong><\/p>\n<ul>\n<li><strong>You can change one part and keep the others.<\/strong>\n<ul>\n<li>To give your bot a different &quot;brain&quot;, you change one setting: the model name.<\/li>\n<li>The harness and your files stay the same.<\/li>\n<\/ul>\n<\/li>\n<li><strong>A model name works only with a provider that offers it.<\/strong> Here is what happened (Build Log 94)
