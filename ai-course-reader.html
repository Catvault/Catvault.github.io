 files.<\/p>\n<ul>\n<li>The private file stays on your laptop. It proves who you are.<\/li>\n<li>The public file goes on the server.<\/li>\n<\/ul>\n<p>pi gives you this command to run yourself in a second Terminal window, because it asks for a passphrase:<\/p>\n<pre><code class=\"language-bash\">ssh-keygen -t ed25519 -C &quot;laptop-yourname&quot;\n<\/code><\/pre>\n<p><strong>Use a passphrase.<\/strong> This was the one protection Annie had not set up on her first server. A passphrase makes a stolen key file useless on its own. Your Mac's keychain can remember it.<\/p>\n<p><strong>Label every key with the device it belongs to.<\/strong> Annie's phone and tablet keys both arrived labelled <code>moshi<\/code>. So a list of keys could not tell them apart. She relabelled them by device.<\/p>\n<p><strong>Step 3. Put the public key on the server.<\/strong> If your provider emailed you a root password, run this yourself in the second window:<\/p>\n<pre><code class=\"language-bash\">ssh-copy-id -i ~/.ssh/id_ed25519.pub root@&lt;your-server-ip&gt;\n<\/code><\/pre>\n<ul>\n<li>You type the root password once.<\/li>\n<li>If your provider asked for a key at order time, paste the contents of <code>~/.ssh/id_ed25519.pub<\/code> into the provider's console instead.<\/li>\n<li>On Windows, <code>ssh-copy-id<\/code> may not exist. Use the console.<\/li>\n<\/ul>\n<p>What success looks like: <code>ssh root@&lt;your-server-ip&gt;<\/code> logs you in without asking for the server password.<\/p>\n<p><strong>Only the file ending in <code>.pub<\/code> is safe to share.<\/strong> Never paste the private key anywhere.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-08b-s5\"><h2><span class=\"num\">08B.5<\/span> First Login, Timezone and Updates<\/h2><p><em>10 minutes. Both courses.<\/em><\/p>\n<p><strong>Step 4. Set the timezone.<\/strong> Servers arrive set to UTC.<\/p>\n<ul>\n<li>For about a month, Annie's bot gave tomorrow's date in the evenings.<\/li>\n<li>The cause: the server's clock ran eight hours behind Hong Kong.<\/li>\n<li>Her notes from the first build said the timezone was set. It was not.<\/li>\n<\/ul>\n<pre><code class=\"language-bash\">timedatectl set-timezone Asia/Hong_Kong\ntimedatectl\n<\/code><\/pre>\n<p>What success looks like: the output shows <code>Asia/Hong_Kong<\/code>, and the local time matches your watch.<\/p>\n<p><strong>Step 5. Update the system.<\/strong><\/p>\n<pre><code class=\"language-bash\">apt update &amp;&amp; apt upgrade -y\n<\/code><\/pre>\n<p>What success looks like: it finishes without red errors. It may ask about a changed configuration file. If so, keep the version already installed.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-08b-s6\"><h2><span class=\"num\">08B.6<\/span> Secure the Server, in an Order That Cannot Lock You Out<\/h2><p><em>15 minutes. Both courses.<\/em><\/p>\n<p><strong>Annie's example.<\/strong><\/p>\n<ul>\n<li>For its first month, Annie's server had five secret files that any user on it could read. It had no firewall.<\/li>\n<li>Annie puts it plainly: nothing bad happened, and that was luck, not design.<\/li>\n<li>Her first security review looked first and changed nothing. It sorted the fixes by risk.<\/li>\n<li>The next day the fixes went in, in an order that could not lock her out.<\/li>\n<\/ul>\n<p><strong>Step 6. Look first.<\/strong> Ask pi to report how SSH is set up and which ports are open. It must not change anything.<\/p>\n<pre><code class=\"language-bash\">sshd -T | grep -E 'passwordauthentication|permitrootlogin|pubkeyauthentication'\nss -tulnp\n<\/code><\/pre>\n<p>What success looks like: a short report. Only SSH (port 22) should face the internet.<\/p>\n<p><strong>Step 7. Prove your key works in a second window.<\/strong><\/p>\n<ul>\n<li>Open a new Terminal window and log in with <code>ssh root@&lt;your-server-ip&gt;<\/code>.<\/li>\n<li>Keep this window open for the rest of the module.<\/li>\n<li>If a change goes wrong, this window is still logged in and can undo it.<\/li>\n<\/ul>\n<p><strong>Step 8. Turn off password logins.<\/strong> Ask pi to write a small separate settings file. It should not edit the main one. Then each change is easy to see and undo. The file <code>/etc/ssh/sshd_config.d/99-hardening.conf<\/code> should contain:<\/p>\n<pre><code class=\"language-text\">PasswordAuthentication no\nKbdInteractiveAuthentication no\nPermitRootLogin prohibit-password\n<\/code><\/pre>\n<p>Then check the settings before applying them, and reload:<\/p>\n<pre><code class=\"language-bash\">sshd -t &amp;&amp; systemctl reload ssh\n<\/code><\/pre>\n<p>What success looks like: <code>sshd -t<\/code> prints nothing, which means no errors. A third new window still logs in with your key.<\/p>\n<p><strong>Step 9. Turn on the firewall, allowing SSH first.<\/strong> The order matters. Allow SSH, then block everything else coming in. Annie's review named this as the only lockout risk in the whole security review.<\/p>\n<pre><code class=\"language-bash\">ufw allow OpenSSH\nufw default deny incoming\nufw default allow outgoing\nufw --force enable\nufw status verbose\n<\/code><\/pre>\n<p>What success looks like:<\/p>\n<ul>\n<li>The firewall is active, with SSH allowed.<\/li>\n<li>A new window still logs in.<\/li>\n<li>The bot only makes outgoing connections. So this firewall will not block it later.<\/li>\n<\/ul>\n<p><strong>Step 10. Ban repeated failed logins, and keep security updates automatic.<\/strong><\/p>\n<pre><code class=\"language-bash\">apt install -y fail2ban\nfail2ban-client status sshd\nsystemctl is-enabled unattended-upgrades\n<\/code><\/pre>\n<p>What success looks like: fail2ban reports an <code>sshd<\/code> jail, and unattended upgrades shows <code>enabled<\/code>. Annie's server runs both (live server check, 2 Oct 2026).<\/p>\n<p><strong>Lock the secret files as you add them.<\/strong> Any file holding a key or token gets <code>chmod 600<\/code>. Then only its owner can read it. Annie's five readable secret files were fixed this way.<\/p>\n<p><strong>If you get locked out:<\/strong> log in through the provider's web console. Ask pi to undo the last change from its backup.<\/p>\n<p><strong>Short course only: the server steps stop here.<\/strong> Go to &quot;Create the Telegram Bot&quot;.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-08b-s7\"><h2><span class=\"num\">08B.7<\/span> Create the Telegram Bot<\/h2><p><em>10 minutes. Both courses.<\/em><\/p>\n<p><strong>Step 27. Open Telegram and search for <code>@BotFather<\/code>.<\/strong> Check for the blue verified tick. This is Telegram's official account for creating bots.<\/p>\n<p><strong>Step 28. Send <code>/newbot<\/code>.<\/strong> Give it a display name, then a username ending in <code>bot<\/code>. Choose a username that does not include your full name.<\/p>\n<p><strong>Step 29. Save the token.<\/strong><\/p>\n<ul>\n<li>BotFather replies with a long token.<\/li>\n<li>Anyone with this token controls your bot.<\/li>\n<li>Save it in your password manager straight away.<\/li>\n<li>Never paste it into a chat with any AI, a note or your vault.<\/li>\n<\/ul>\n<p>What success looks like: the token is in your password manager, and your new bot appears in Telegram.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-08b-s8\"><h2><span class=\"num\">08B.8<\/span> Install Hermes and Connect It<\/h2><p><em>15 minutes. Both courses.<\/em><\/p>\n<p>A bot has four parts:<\/p>\n<ul>\n<li><strong>Framework:<\/strong> the program that runs the bot. It holds its tools, memory, schedules and rules.\n<ul>\n<li>This course uses Hermes Agent by Nous Research.<\/li>\n<li>Annie's server runs version 0.21.5 (live server check, 2 Oct 2026).<\/li>\n<\/ul>\n<\/li>\n<li><strong>Channel:<\/strong> where you type to it. This course uses Telegram.<\/li>\n<li><strong>Model:<\/strong> the AI that writes the answers. This course uses DeepSeek V4.1 Flash through opencode Go, the same as your pi.<\/li>\n<li><strong>Files:<\/strong> who it is and what it must do. This course uses your SOUL, RULES and USER.<\/li>\n<\/ul>\n<p><strong>Step 30. Install Hermes.<\/strong> Ask pi:<\/p>\n<pre><code class=\"language-text\">Install Hermes Agent on my server using the official install script from the NousResearch hermes-agent repository. Then set its timezone to Asia/Hong_Kong. Show me each command before running it. When it asks for my Telegram bot token or any key, stop and tell me how to enter it myself without it being shown on screen.\n<\/code><\/pre>\n<p>The commands it should use (official repository, seen 2 Oct 2026):<\/p>\n<pre><code class=\"language-bash\">curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash\nhermes config set timezone Asia/Hong_Kong\n<\/code><\/pre>\n<p><strong>Set the timezone in Hermes as well as on the server.<\/strong> They are two separate settings. Annie's bot's own timezone setting was blank. That is what caused the month of wrong dates.<\/p>\n<p><strong>Step 31. Connect Telegram, and allow only yourself.<\/strong> The set-up asks questions, so run it yourself in your SSH window:<\/p>\n<pre><code class=\"language-bash\">hermes gateway setup\n<\/code><\/pre>\n<ol>\n<li>Choose Telegram.<\/li>\n<li>Paste your bot token when asked.<\/li>\n<li>Enter your numeric Telegram user ID (Hermes Telegram documentation, seen 2 Oct 2026).<\/li>\n<\/ol>\n<p><strong>If you do not know your ID:<\/strong><\/p>\n<ol>\n<li>Leave it blank.<\/li>\n<li>Send your bot one message from your phone.<\/li>\n<li>The bot's log will show your number, in a line saying a user was blocked.<\/li>\n<li>Add that number as the only allowed user.<\/li>\n<\/ol>\n<p>The setting is <code>TELEGRAM_ALLOWED_USERS<\/code>. It holds your number and nobody else's.<\/p>\n<p><strong>Step 32. Connect the model.<\/strong> Ask pi to add your opencode Go key to the bot's <code>.env<\/code> file without printing it. Ask it to set the model in <code>config.yaml<\/code>. Annie's live settings (live server check, 2 Oct 2026):<\/p>\n<pre><code class=\"language-yaml\">model:\n  default: deepseek-v4.1-flash\n  provider: opencode-go\n  max_tokens: 2048\n<\/code><\/pre>\n<ul>\n<li>The key's name in <code>.env<\/code> on Annie's server is <code>OPENCODE_GO_API_KEY<\/code>.<\/li>\n<li>Then lock the file: <code>chmod 600 ~/.hermes/.env<\/code>.<\/li>\n<li>Facilitator: confirm the provider set-up in the Hermes documentation on the day.<\/li>\n<\/ul>\n<p><strong>The output limit matters.<\/strong> <code>max_tokens<\/code> caps how long one answer can be.<\/p>\n<ul>\n<li>Annie's son's tutor bot once wrote an answer of about 15,000 tokens.<\/li>\n<li>It took up to three minutes to reply.<\/li>\n<li>A short-answers rule and a 2,048-token cap brought replies well under a minute.<\/li>\n<\/ul>\n<p><strong>A model name works only on the provider that serves it.<\/strong> When Annie changed provider, every model name the old provider used stopped working.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-08b-s9\"><h2><span class=\"num\">08B.9<\/span> Load Your Files and Make It Restart on Its Own<\/h2><p><em>10 minutes. Both courses.<\/em><\/p>\n<p><strong>Short course only: do this first.<\/strong> Your Module 07 file is one <code>AGENTS.md<\/code>. Ask pi to split it into two files in your <code>AI System<\/code> folder:<\/p>\n<ul>\n<li><code>SOUL<\/code>: the &quot;Who You Are&quot; section<\/li>\n<li><code>RULES<\/code>: every rules section<\/li>\n<\/ul>\n<p>Hermes reads different files at different times (Hermes documentation, &quot;Which File Does What&quot;, seen 2 Oct 2026):<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Your file<\/th>\n<th>Where it goes on the server<\/th>\n<th>When Hermes reads it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>SOUL<\/td>\n<td><code>~/.hermes/SOUL.md<\/code><\/td>\n<td>At the start of every conversation, first<\/td>\n<\/tr>\n<tr>\n<td>RULES<\/td>\n<td>A file named <code>.hermes.md<\/code> in the bot's working folder<\/td>\n<td>At the start of every conversation<\/td>\n<\/tr>\n<tr>\n<td>USER<\/td>\n<td><code>~/.hermes/memories/USER.md<\/code><\/td>\n<td>At the start of every conversation<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Give the bot its own working folder<\/strong>.<\/p>\n<ul>\n<li>Hermes reads <code>.hermes.md<\/code> from the folder set as the bot's working folder in its settings.<\/li>\n<li>Annie uses a dedicated folder, never <code>/root<\/code>. Then her other bots do not load the same rules.<\/li>\n<li>Facilitator: confirm the setting's name on the day.<\/li>\n<\/ul>\n<p><strong>Keep the user file short.<\/strong> Annie's settings cap it at 1,375 characters (bot settings, 9 Oct 2026).<\/p>\n<p><strong>Step 33. Copy the files.<\/strong> Ask pi:<\/p>\n<pre><code class=\"language-text\">Copy SOUL, RULES and USER from my vault's AI System folder into the places in this table on my server. Back up anything already there first. Then restart the bot and show me that the restart worked.\n<\/code><\/pre>\n<p><strong>Restart after any change, then start a fresh chat<\/strong>.<\/p>\n<ul>\n<li>The bot loads its files when it starts.<\/li>\n<li>An open Telegram chat also keeps the instructions it started with, even after a restart.<\/li>\n<li>So send <code>/new<\/code> after every change.<\/li>\n<\/ul>\n<pre><code class=\"language-bash\">hermes gateway restart\n<\/code><\/pre>\n<p><strong>Step 34. Make it come back on its own.<\/strong> A bot that stops and stays stopped is worse than no bot, because you think it is working. Once, two of Annie's bots stayed connected to nothing for days, and nobody knew.<\/p>\n<pre><code class=\"language-bash\">hermes gateway install\n<\/code><\/pre>\n<p>This runs the bot as a service that starts with the server. Then ask pi to show you the service file and confirm the four lines below. Here is why they matter:<\/p>\n<ul>\n<li>Hermes's Telegram connection gives up after about 10 reconnects and exits.<\/li>\n<li>It expects something to restart it.<\/li>\n<li>One day, nothing did.<\/li>\n<\/ul>\n<pre><code class=\"language-text\">Restart=always\nRestartSec=5\nRestartForceExitStatus=75\nStartLimitIntervalSec=0\n<\/code><\/pre>\n<p>Then check that it runs with nobody logged in:<\/p>\n<pre><code class=\"language-bash\">loginctl show-user root --property=Linger\n<\/code><\/pre>\n<p>What success looks like: <code>Linger=yes<\/code>. Annie's builder once reported the restart settings had &quot;vanished&quot;. It had looked in the wrong list of services.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-08b-s10\"><h2><span class=\"num\">08B.10<\/span> Three Tests: Quoting Rules, Saying It Does Not Know, and Golden Questions<\/h2><p><em>15 minutes. Both courses.<\/em><\/p>\n<p><strong>A restart proves nothing about whether the bot works.<\/strong> When the bot starts, it does not check its model key. Only a real message does.<\/p>\n<p><strong>Step 35. The hello test.<\/strong> In Telegram, send <code>/new<\/code>, then <code>hello<\/code>. What success looks like: a reply within a few seconds.<\/p>\n<p><strong>Step 36. The quote test.<\/strong> Send:<\/p>\n<pre><code class=\"language-text\">Quote your rule about saving things, word for word.\n<\/code><\/pre>\n<p>Then:<\/p>\n<pre><code class=\"language-text\">What are your standing instructions? List their headings.\n<\/code><\/pre>\n<p>What success looks like: it quotes your save rule exactly and lists the headings from your RULES file.<\/p>\n<p><strong>If it cannot quote them, stop and fix it.<\/strong><\/p>\n<ul>\n<li>For weeks, Annie's rules file was never loaded into her bot.<\/li>\n<li>Asked about one of its rules, the bot said it had none.<\/li>\n<li>Two file links and a restart fixed it.<\/li>\n<li>Annie calls this &quot;the single most instructive bug of the whole build&quot;.<\/li>\n<li>Nothing else you write matters until the bot can read its rules.<\/li>\n<\/ul>\n<p><strong>Step 37. The refusal test.<\/strong><\/p>\n<ul>\n<li>Send a question your files cannot answer, such as the name of a person you have never mentioned.<\/li>\n<li>The bot must say it does not know.<\/li>\n<li>A made-up answer here is the one failure you must not leave the room with.<\/li>\n<li>Fix the rule and test again.<\/li>\n<\/ul>\n<p><strong>Step 38. Your golden questions<\/strong> from Module 07. These are your test questions with known answers.<\/p>\n<ol>\n<li>Ask each one in a fresh conversation. Send <code>/new<\/code> before each.<\/li>\n<li>Then ask them all again. A right answer once can be luck.<\/li>\n<li>Write the results into your build log.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"short-08b-s11\"><h2><span class=\"num\">08B.11<\/span> Same Model, Different Program: Why pi and the Bot Answer Differently<\/h2><p><em>5 minutes. Both courses.<\/em><\/p>\n<p><strong>Your pi and your bot now run the same model:<\/strong> DeepSeek V4.1 Flash on opencode Go.<\/p>\n<ul>\n<li>Ask both the same question: &quot;What can you do with my files?&quot;<\/li>\n<li>The answers differ, because the program around the model differs.<\/li>\n<li>pi can read and edit the files on your laptop.<\/li>\n<li>The bot has its own skills and its own rules on the server.<\/li>\n<\/ul>\n<p><strong>The line to say.<\/strong> &quot;The model only answers. The program around it decides what it can read, what it remembers, and what it is allowed to do.&quot;<\/p>\n<p><strong>This is why Annie moved her bots to a new model in one evening.<\/strong> She changed one line in each bot's settings. The skills, rules and limits stayed the same.<\/p>\n<p><strong>It is also why a Telegram bot is not limited by Telegram.<\/strong><\/p>\n<ul>\n<li>Annie once assumed her bot could not build software because it was a Telegram bot.<\/li>\n<li>The real reason was that it had been set up as an AI assistant, with no tools to edit files.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-08b-s12\"><h2><span class=\"num\">08B.12<\/span> Homework: A Normal User, a Swap File and a Reboot Test<\/h2><p><strong>A normal user instead of root (live server check, 2 Oct 2026).<\/strong><\/p>\n<ul>\n<li>Logging in as <code>root<\/code> means every command runs with full power over the machine.<\/li>\n<li>Annie's first security review listed moving her bot off root as the highest-risk change. She deferred it.<\/li>\n<li>Her server still runs the bot as root.<\/li>\n<li>If you choose a normal user, do it before installing anything else, with the facilitator beside you.<\/li>\n<\/ul>\n<p><strong>A swap file.<\/strong> Swap is disk space the server uses when its memory is full. Without it, a full server stops a program of its own choosing.<\/p>\n<ul>\n<li>Once, Annie's server began logging memory warnings every minute.<\/li>\n<li>The cause: six forgotten Claude Code sessions held 1.5 GB between them.<\/li>\n<li>Closing them freed the memory.<\/li>\n<li>A 2 GB swap file was added, so the server has room to spare next time.<\/li>\n<\/ul>\n<p>What to do:<\/p>\n<ul>\n<li>Ask pi to add a 2 GB swap file that survives a restart, with swappiness set to 10.<\/li>\n<li>Facilitator: confirm the first command on the day, because Annie's notes do not record how the empty file was made.<\/li>\n<li>Close Claude Code sessions with <code>/exit<\/code> when you finish.<\/li>\n<\/ul>\n<p><strong>The reboot test.<\/strong> &quot;It works&quot; and &quot;it survives a restart&quot; are different claims. Reboot the server once, then check:<\/p>\n<pre><code class=\"language-bash\">tailscale status\nsysctl net.ipv4.ip_forward\nufw status\ntimedatectl\nsystemctl --user status hermes-gateway\n<\/code><\/pre>\n<p>What success looks like:<\/p>\n<ul>\n<li>Tailscale is connected.<\/li>\n<li>Forwarding reads 1.<\/li>\n<li>The firewall is active.<\/li>\n<li>The timezone is Hong Kong.<\/li>\n<li>The bot answers <code>hello<\/code> in Telegram.<\/li>\n<\/ul>\n<p><strong>Private web pages, for later.<\/strong> You may want a small private page some day, such as a dashboard. Keep it reachable only through Tailscale.<\/p>\n<ul>\n<li>Annie first published one page publicly. She later moved it back to private, because it showed household items.<\/li>\n<li><strong>A password box in front of a public page protects nothing.<\/strong> The page's content is still sent to anyone who asks. The box only hides it.<\/li>\n<li>To share a page with someone outside your network, encrypt the page itself. Then the public copy cannot be read without the password.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-08b-s13\"><h2><span class=\"num\">08B.13<\/span> The Optional Short Course Server Session<\/h2><p><em>Optional, outside the 10 hours. 100 minutes. A bot on a rented server, reached by plain SSH with a key.<\/em><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Min<\/th>\n<th>Segment<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5<\/td>\n<td>The plan and the four safety rules: snapshot first, an automatic undo timer, one change at a time, the web console<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Snapshot and SSH key<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>First login, timezone and updates<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>Secure the server, in an order that cannot lock you out<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Why this session stops before Tailscale<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Create the Telegram bot<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>Install Hermes and connect it<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Load your files and make it restart on its own<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>Three tests: the bot quotes your rules, says when it does not know, and answers your golden questions<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Same model, different program: why pi and the bot answer differently<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>How the minutes add up.<\/strong> The session takes 100 minutes. The plan and the four safety rules (snapshot first, an automatic undo timer, one change at a time, the web console) take 5 minutes. The snapshot and key take 10. First login takes 10. Securing the server takes 15. Why this session stops before Tailscale takes 5. Creating the bot takes 10. Installing Hermes takes 15. Loading your SOUL, RULES and USER files takes 10. Testing that the bot quotes its rules, says when it does not know and answers your golden questions takes 15. Asking pi and the bot the same question takes 5.<\/p>\n<p><strong>Why this session stops before Tailscale.<\/strong><\/p>\n<ul>\n<li>Tailscale makes the server invisible to the internet. But it adds one more thing to look after. With it off, there is no way in.<\/li>\n<li>For one bot, a server that accepts only your key, with a firewall and automatic bans, is a sound setup.<\/li>\n<li>Annie's own server ran this way until she moved it behind Tailscale.<\/li>\n<\/ul>\n<p><strong>Three things keep it safe:<\/strong><\/p>\n<ul>\n<li>Never switch password logins back on.<\/li>\n<li>Keep the passphrase on your key.<\/li>\n<li>Keep security updates automatic.<\/li>\n<\/ul>\n<p><strong>Your daily way in<\/strong> is <code>ssh root@&lt;your-server-ip&gt;<\/code>. Or ask pi to add a short name for it.<\/p>\n<p><strong>What the session does not add.<\/strong><\/p>\n<ul>\n<li>No Claude Code on the server, no exit node and no vault copy.<\/li>\n<li>The bot reads only the files you copied to it.<\/li>\n<li>Claude is still reachable from your laptop only through a VPN, as Module 01 explained.<\/li>\n<li>pi needs no VPN.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-08b-s14\"><h2><span class=\"num\">08B.14<\/span> Lessons From Real Mistakes<\/h2><p>Each line below is one lesson from a real mistake in Annie's own system. The full story behind each one is on the FAQ tab, the last tab at the top of the page.<\/p>\n<ul>\n<li>Look before you change. Change in an order that always leaves you able to log in.<\/li>\n<li>After any change to keys or models, send a real message through every bot.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-08b-s15\"><h2><span class=\"num\">08B.15<\/span> Worksheet: Server and Bot Checklist<\/h2><div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Proof<\/th>\n<th>Course<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Snapshot taken before any change<\/td>\n<td>Snapshot listed in the console<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Key login works; passwords off<\/td>\n<td><code>sshd -T<\/code> shows <code>passwordauthentication no<\/code><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Firewall active<\/td>\n<td><code>ufw status verbose<\/code><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>fail2ban and security updates on<\/td>\n<td><code>fail2ban-client status sshd<\/code><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Timezone is Hong Kong, on the server and in Hermes<\/td>\n<td><code>timedatectl<\/code>; Hermes config<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Laptop, phone and server on Tailscale; key expiry off<\/td>\n<td>Tailscale admin page<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>SSH works only over Tailscale<\/td>\n<td><code>ssh myserver<\/code> works; the public address does not<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Exit node tested<\/td>\n<td><code>loc=SG<\/code> with it on<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Claude Code on the server, signed in, locked to the subscription<\/td>\n<td><code>claude -p<\/code> returns PONG<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Vault copied to the server<\/td>\n<td>A new laptop note appears on the server<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Bot token only in my password manager<\/td>\n<td><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Only my Telegram ID is allowed<\/td>\n<td>The allow-list holds one number<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>.env<\/code> readable by the owner only<\/td>\n<td><code>ls -l<\/code> shows <code>-rw-------<\/code><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Runs as a service with the four restart lines; linger on<\/td>\n<td>The service file; <code>Linger=yes<\/code><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Quote test passed<\/td>\n<td>It quoted my save rule exactly<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Refusal test passed<\/td>\n<td>It said it did not know<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Golden questions passed twice, in fresh conversations<\/td>\n<td>My build log<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>\n<section class=\"card\" id=\"short-08b-s16\"><h2><span class=\"num\">08B.16<\/span> Not Yet Tested<\/h2><ul>\n<li><strong>The whole order, with pi running every step.<\/strong> Annie's own test on a fresh server, from Hong Kong, no VPN, exit node off.<\/li>\n<li><strong>Still untested:<\/strong>\n<ul>\n<li>the server sign-in flow for Claude Code<\/li>\n<li>the Obsidian server sync (no written steps)<\/li>\n<li>the normal-user change<\/li>\n<li>the swap file's first command<\/li>\n<li><code>ssh-copy-id<\/code> on Windows<\/li>\n<li>the Hermes install script<\/li>\n<li><code>hermes gateway setup<\/code><\/li>\n<li>the opencode Go set-up in Hermes<\/li>\n<li>the working-folder setting for <code>.hermes.md<\/code><\/li>\n<\/ul>\n<\/li>\n<li><strong>Also untested:<\/strong>\n<ul>\n<li>pi running server commands over SSH from the laptop<\/li>\n<li><em>Short course only:<\/em> splitting <code>AGENTS.md<\/code> into SOUL and RULES for the optional server session<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/section>", "count": 16, "sess": [0]}, {"id": "short-faq", "label": "FAQ", "title": "Frequently Asked Questions", "minutes": null, "read": 17, "toc": [["short-faq-s1", "FAQ.1", "Module 01: The Claude app seemed to work in Hong Kong without a VPN. Does it?"], ["short-faq-s2", "FAQ.2", "Module 01: A model is on my AI provider's price list. Will it answer me?"], ["short-faq-s3", "FAQ.3", "Module 01: Is Google's AI blocked in Hong Kong?"], ["short-faq-s4", "FAQ.4", "Module 01: My VPN is on, but a payment page still refuses me. Why?"], ["short-faq-s5", "FAQ.5", "Module 01: My test from Hong Kong says 405, &quot;access works&quot;. Has Claude opened to Hong Kong?"], ["short-faq-s6", "FAQ.6", "Module 02: Can my bot save email drafts without being able to send email?"], ["short-faq-s7", "FAQ.7", "Module 02: I asked Google for less access. Why does my tool still have the old access?"], ["short-faq-s8", "FAQ.8", "Module 02: I moved my key into its own file. Is it safe now?"], ["short-faq-s9", "FAQ.9", "Module 02: How do I keep the photos I send my bot out of my phone's gallery?"], ["short-faq-s10", "FAQ.10", "Module 02: Is it safe to look inside a settings file that holds keys?"], ["short-faq-s11", "FAQ.11", "Module 03: My notes live in several places. How do I get down to one?"], ["short-faq-s12", "FAQ.12", "Module 03: I use my AI builder on several machines. Why does it know different things on each one?"], ["short-faq-s13", "FAQ.13", "Module 03: Is it safe to tidy up the folders in my vault?"], ["short-faq-s14", "FAQ.14", "Module 03: I renamed some folders and nothing showed an error. Is everything fine?"], ["short-faq-s15", "FAQ.15", "Module 03: Should I use a task board for my to-do list?"], ["short-faq-s16", "FAQ.16", "Module 05: Should I read my real emails before I automate a reminder?"], ["short-faq-s17", "FAQ.17", "Module 05: I keep writing &quot;this must be done&quot; notes. Why do they never get done?"], ["short-faq-s18", "FAQ.18", "Module 05: How do I know a process is written down well enough to hand over?"], ["short-faq-s19", "FAQ.19", "Module 06: I copied my AI's files to a new machine. Why does it only know half of me?"], ["short-faq-s20", "FAQ.20", "Module 06: Why should I write a success sentence before I design anything?"], ["short-faq-s21", "FAQ.21", "Module 06: What happens to how my AI works with me if I change AI models?"], ["short-faq-s22", "FAQ.22", "Module 08: My AI assistant keeps ignoring the rules I gave it. Why?"], ["short-faq-s23", "FAQ.23", "Module 08: My builder says the job is tested and working. Can I trust that?"], ["short-faq-s24", "FAQ.24", "Module 08: My builder finished the job. Did it do everything?"], ["short-faq-s25", "FAQ.25", "Module 08B: Nothing bad has happened to my server. Does that mean it is safe?"], ["short-faq-s26", "FAQ.26", "Module 08B: I changed my bot's model and restarted it. The restart looked fine. Is the bot working?"], ["short-faq-s27", "FAQ.27", "Module 09: Can I run my bot on a cheaper AI model?"], ["short-faq-s28", "FAQ.28", "Module 09: My bot says it checked my calendar for clashes. Can I trust it?"], ["short-faq-s29", "FAQ.29", "Module 09: Can a cheap model grade my answers?"], ["short-faq-s30", "FAQ.30", "Module 10: My watchdog says every job ran. Is everything fine?"], ["short-faq-s31", "FAQ.31", "Module 10: I moved my bots to a cheaper model and some jobs broke. Is the new model the problem?"], ["short-faq-s32", "FAQ.32", "Module 11: I get the same reminder twice, but I only have one job. Why?"], ["short-faq-s33", "FAQ.33", "Module 11: The bot said it updated my message format, but the next message looked the same. Why?"]], "body": "<div class=\"intro\"><p>These are real questions, answered with real stories from Annie's own system. Each answer ends with what to do. Read them when you hit the problem, not before.<\/p>\n<\/div>\n<section class=\"card\" id=\"short-faq-s1\"><h2><span class=\"num\">FAQ.1<\/span> Module 01: The Claude app seemed to work in Hong Kong without a VPN. Does it?<\/h2><p>No. Claude and the Claude apps are blocked in Hong Kong. This includes the phone apps.<\/p>\n<p><strong>What happened.<\/strong> Claude twice suggested that the Claude phone app might work in Hong Kong with no VPN. Both times the test was not clean.<\/p>\n<ul>\n<li>The first time, Tailscale (a private network app) was still connected. So the phone was not really on its Hong Kong connection.<\/li>\n<li>The second time, Claude read a &quot;Logged out&quot; label as &quot;the VPN is off&quot;. The VPN was still on.<\/li>\n<li>Annie caught both mistakes. They cost two wasted rounds of testing.<\/li>\n<\/ul>\n<p><strong>What to do.<\/strong> When a test seems to disprove something you already know, first check that the test was clean.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s2\"><h2><span class=\"num\">FAQ.2<\/span> Module 01: A model is on my AI provider's price list. Will it answer me?<\/h2><p>Not always.<\/p>\n<p><strong>What happened.<\/strong> Claude recommended two Western models for Annie's bots. Both were blocked for her reseller account, and her notes already said so. Annie asked it to check again. A one-line hello through her reseller key returned 403 for every Anthropic and Google model. Only the open-weight models answered. A bot that would not have worked was nearly built.<\/p>\n<p><strong>What to do.<\/strong> Before you choose a model, send it a short hello. Send it from the machine and the key that will really use it.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s3\"><h2><span class=\"num\">FAQ.3<\/span> Module 01: Is Google's AI blocked in Hong Kong?<\/h2><p>Consumer Gemini is not blocked. It opened to Hong Kong in March 2026. Google's developer tools, such as AI Studio, are still blocked.<\/p>\n<p><strong>What happened.<\/strong> Annie's notes said Google's AI was blocked for months after it had opened. Nobody noticed until she was planning a beginner seminar and found the change herself. The seminar was nearly designed around a tool the audience could not use, while the right tool was already open.<\/p>\n<p><strong>What to do.<\/strong> Write the date next to every fact about what works. Check it again before you teach or build on it.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s4\"><h2><span class=\"num\">FAQ.4<\/span> Module 01: My VPN is on, but a payment page still refuses me. Why?<\/h2><p>The page is checking your card, not your connection.<\/p>\n<p><strong>What happened.<\/strong> Annie needed to buy API credit for her first bot. The developer website refused her Hong Kong billing address. A VPN changed nothing, because the check was on the card. It took her about a week of research to find a way.<\/p>\n<p><strong>What to do.<\/strong> Remember that there are three separate checks:<\/p>\n<ol>\n<li>your connection<\/li>\n<li>your sign-up details, such as your phone number<\/li>\n<li>your billing address<\/li>\n<\/ol>\n<p>A VPN fixes only the first one.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s5\"><h2><span class=\"num\">FAQ.5<\/span> Module 01: My test from Hong Kong says 405, &quot;access works&quot;. Has Claude opened to Hong Kong?<\/h2><p>Probably not. Your request probably came from another country.<\/p>\n<p><strong>What happened.<\/strong> Annie tested from Hong Kong for Module 01. Two of her three tries returned 405.<\/p>\n<ul>\n<li>The first try went out through Taiwan.<\/li>\n<li>The second try went out through an address on New York time.<\/li>\n<li>Anthropic answered both tries, so both said &quot;access works&quot;.<\/li>\n<li>The third try came from a setting that had passed a location check, which said Hong Kong. It returned 403, the block.<\/li>\n<\/ul>\n<p><strong>What to do.<\/strong> Before you trust a location test, check which country your request came from. On the same laptop and the same connection, search the web for &quot;what is my IP location&quot;.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s6\"><h2><span class=\"num\">FAQ.6<\/span> Module 02: Can my bot save email drafts without being able to send email?<\/h2><p>Not with Google. The smallest Google permission that writes drafts can also send.<\/p>\n<p><strong>What happened.<\/strong> Annie asked whether her bot could save approved email replies into her Gmail drafts folder. Her builder checked the real permissions before answering. Google has no permission that allows drafts but not sending. So the change would turn &quot;sending is impossible&quot; into &quot;sending is possible but unused&quot;. Annie shelved the feature. She called the explanation &quot;huge to me&quot;.<\/p>\n<p><strong>What to do.<\/strong> When the exact control you want does not exist, choose the stricter control you can prove.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s7\"><h2><span class=\"num\">FAQ.7<\/span> Module 02: I asked Google for less access. Why does my tool still have the old access?<\/h2><p>Because a smaller request does not cancel a larger one. New consent adds to old consent.<\/p>\n<p><strong>What happened.<\/strong> Annie tried twice to give her email tool read-only access. Each time, Google handed back the old send permission. The only fix was to remove the app's access fully, through Google's revoke page. Then she approved it again from a clean start.<\/p>\n<p><strong>What to do.<\/strong> To take access back, remove it at the company. Then approve the smaller access from a clean start.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s8\"><h2><span class=\"num\">FAQ.8<\/span> Module 02: I moved my key into its own file. Is it safe now?<\/h2><p>Not yet. The old copies of the key still work.<\/p>\n<p><strong>What happened.<\/strong> The builder moved a web-service key out of one settings file and into its own file. It called this a security improvement. Annie asked one question: &quot;did we not move the old credential straight to the secrets.env file?&quot; She was right. The same key now existed in nine places on the server.<\/p>\n<ul>\n<li>Only replacing the key with a new one retires every old copy.<\/li>\n<li>A one-command script now does three things: it updates every live copy, restarts the programs that read it, and checks they reconnect.<\/li>\n<\/ul>\n<p><strong>What to do.<\/strong> Count every copy of a secret before you claim it is safe. To retire the old copies, replace the key with a new one.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s9\"><h2><span class=\"num\">FAQ.9<\/span> Module 02: How do I keep the photos I send my bot out of my phone's gallery?<\/h2><p>No setting in the chat app can do this. The camera saves a copy to your gallery first.<\/p>\n<p><strong>What happened.<\/strong> Annie wanted photos she sent to her storage bot kept out of Google Photos. Her builder recorded her real steps on screen and read the video frame by frame. Taking a photo with the camera writes a copy to the phone's public gallery. This happens before Telegram or any bot is involved.<\/p>\n<p><strong>What to do.<\/strong> Check where your phone has already put private material before you worry about the bot.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s10\"><h2><span class=\"num\">FAQ.10<\/span> Module 02: Is it safe to look inside a settings file that holds keys?<\/h2><p>Yes, if you show only the names of the keys.<\/p>\n<p><strong>What happened.<\/strong> Twice in one day, a session inspected a settings file to see its structure. Both times, it printed a live key on screen. Both times, it looked like a harmless check. The terminal keeps a copy of what it shows. So do AI tools.<\/p>\n<p><strong>What to do.<\/strong> When you inspect settings, print the names of keys, never their values.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s11\"><h2><span class=\"num\">FAQ.11<\/span> Module 03: My notes live in several places. How do I get down to one?<\/h2><p>Choose one home, move everything in, and check before you delete.<\/p>\n<p><strong>What happened.<\/strong> Annie's notes about her bot lived on her Mac, in Obsidian and on the server. She never knew which copy was the real one.<\/p>\n<ul>\n<li>She moved the to-do list and a cheat sheet into Obsidian.<\/li>\n<li>She cut her builder's instruction file down to a short pointer.<\/li>\n<li>She deleted the server's duplicate only after checking it matched the vault copy byte for byte.<\/li>\n<\/ul>\n<p>It took one afternoon.<\/p>\n<p><strong>What to do.<\/strong> Choose one home and move everything into it. Before you delete a duplicate, check that it matches the copy you keep.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s12\"><h2><span class=\"num\">FAQ.12<\/span> Module 03: I use my AI builder on several machines. Why does it know different things on each one?<\/h2><p>Each machine is probably reading its own copy of the builder's memory.<\/p>\n<p><strong>What happened.<\/strong> Annie's builder had four separate memories on different machines and accounts. Each knew different things about her. She said: &quot;I just need one source of truth for Claudith and you, just as I need one source of truth for EVERYTHING we do.&quot; The fix merged 29 memory files into one vault folder, and linked every machine to it. A test from each machine, with no history, proved each one loaded the same instructions.<\/p>\n<p><strong>What to do.<\/strong> Keep one real copy that every device reads. It is better than several copies kept in step.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s13\"><h2><span class=\"num\">FAQ.13<\/span> Module 03: Is it safe to tidy up the folders in my vault?<\/h2><p>Yes, but a move is not finished when the files have moved.<\/p>\n<p><strong>What happened.<\/strong> Annie asked for a vault tidy-up. Many folders moved. A family member's tutor bot had 15 document addresses written into its skill. All 15 broke. The bot searched blindly and ran slowly for about six days before anyone noticed.<\/p>\n<p><strong>What to do.<\/strong> A move is finished only when every script and bot that refers to the old address has been updated.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s14\"><h2><span class=\"num\">FAQ.14<\/span> Module 03: I renamed some folders and nothing showed an error. Is everything fine?<\/h2><p>Not always. A rename can break things with no error message.<\/p>\n<p><strong>What happened.<\/strong> The top-level vault folders were renamed to add icons. Nothing reported an error.<\/p>\n<ul>\n<li>Claude's memory link pointed at the old name. So a session started with no memory.<\/li>\n<li>Six links on the server broke. So Claude Code there ran with no global instructions, and four skills stopped working.<\/li>\n<li>The monthly cost script crashed the first time it ran after the rename.<\/li>\n<\/ul>\n<p><strong>What to do.<\/strong> After any rename, search every script for the old name. Then run each affected job once by hand.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s15\"><h2><span class=\"num\">FAQ.15<\/span> Module 03: Should I use a task board for my to-do list?<\/h2><p>Only if you already open it every day.<\/p>\n<p><strong>What happened.<\/strong> In Annie's first month, her bot's rules said to use a task board. The board stayed empty, because she never opened it. Her calendar became the real list.<\/p>\n<p><strong>What to do.<\/strong> Build around the place you already look every day.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s16\"><h2><span class=\"num\">FAQ.16<\/span> Module 05: Should I read my real emails before I automate a reminder?<\/h2><p>Yes. Ten minutes of reading can save you a build that does not help.<\/p>\n<p><strong>What happened.<\/strong> Annie planned a bill reminder. A credit card statement email would arrive. The bot would send the amount and the due date. Annie would reply &quot;paid&quot;. Before writing any code, she read real emails for ten minutes. This broke three assumptions:<\/p>\n<ul>\n<li>One bank had not sent a statement email since May 2022.<\/li>\n<li>The other bank's alerts went to a family member's inbox.<\/li>\n<li>The alert email held no amount and no due date. It only said that a statement was ready.<\/li>\n<\/ul>\n<p>A simpler version shipped. Annie retired it the same day. A message that can only say &quot;go and check the app&quot; does not remove enough work to earn a daily slot.<\/p>\n<p><strong>What to do.<\/strong> Check the real trigger before you build. Judge an automation by whether it removes a chore.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s17\"><h2><span class=\"num\">FAQ.17<\/span> Module 05: I keep writing &quot;this must be done&quot; notes. Why do they never get done?<\/h2><p>Because a note is not a task. Nothing acts on a note.<\/p>\n<p><strong>What happened.<\/strong> Annie asked to tidy her seminar notes. She believed the mess was three documents. A search found six places, not three. The real tasks were split across two sections of her to-do list. Four bold notes said certain material must go into a teaching page. Each note was restated, and none was ever done. All four notes became one item on the list.<\/p>\n<p><strong>What to do.<\/strong> Put tasks where tasks get done: on your one to-do list.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s18\"><h2><span class=\"num\">FAQ.18<\/span> Module 05: How do I know a process is written down well enough to hand over?<\/h2><p>Each step is written down, in order, and each step prevents a mistake you have already seen.<\/p>\n<p><strong>What happened.<\/strong> Annie taught her bot how she wants email replies drafted. At first the steps lived in chat and in the bot's small memory. That memory filled up. The steps were then written into the bot's reply instructions as six numbered steps:<\/p>\n<ol>\n<li>Find the thread by email address first.<\/li>\n<li>Draft from the account that received the original.<\/li>\n<li>Work out who is on each side from the thread itself.<\/li>\n<li>Check who is attending against the latest confirmation.<\/li>\n<li>Reply in the same thread, with the same subject.<\/li>\n<li>Show the account, subject and full text before sending.<\/li>\n<\/ol>\n<p>Every step prevents a mistake she had already seen.<\/p>\n<p><strong>What to do.<\/strong> Write your process as numbered steps in the instructions the bot reads, not only in chat. The bot's small memory can fill up.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s19\"><h2><span class=\"num\">FAQ.19<\/span> Module 06: I copied my AI's files to a new machine. Why does it only know half of me?<\/h2><p>Because it only knows what is in the files you copied. If you copied the wrong set, it knows the wrong half.<\/p>\n<p><strong>What happened.<\/strong> Annie's builder moved onto her server. A test from the server passed all four questions about her. Then Annie noticed something missing. The server's Claude knew her work side but not her personal side. Her two Mac accounts held two different sets of memory, and the work set had been copied. The fix copied the personal memory across.<\/p>\n<p><strong>What to do.<\/strong> Remember that an AI only knows the parts of you that are written in the files it reads. After a move, check both sides of your life, not only the one you tested.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s20\"><h2><span class=\"num\">FAQ.20<\/span> Module 06: Why should I write a success sentence before I design anything?<\/h2><p>Because the sentence is the test. Without it, you cannot tell whether a design works.<\/p>\n<p><strong>What happened.<\/strong> Annie's first daily learning card sent her a ready-made explanation each morning. It had an optional &quot;reply in your own words&quot;. She stated her test: future Annie must be able to school current Annie. Against that sentence, the design failed three ways:<\/p>\n<ul>\n<li>Reading answers builds recognition, not recall.<\/li>\n<li>The step where learning happens was optional. Optional steps do not survive a busy day.<\/li>\n<li>Nothing was recorded. So there was no earlier answer to beat.<\/li>\n<\/ul>\n<p>The card was rebuilt as a question she answers first.<\/p>\n<p><strong>What to do.<\/strong> Write the success sentence before you judge any design.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s21\"><h2><span class=\"num\">FAQ.21<\/span> Module 06: What happens to how my AI works with me if I change AI models?<\/h2><p>You lose it, unless it is written down.<\/p>\n<p><strong>What happened.<\/strong> Annie was about to lose access to the AI model she had built her working style with. She asked it to write down how it reasons with her. She also asked it to record her strengths, so future sessions would protect them. The document now loads on every device she uses.<\/p>\n<p><strong>What to do.<\/strong> Write down how your AI works with you, and what you do well. A working relationship with an AI survives a change of model only if it is written down.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s22\"><h2><span class=\"num\">FAQ.22<\/span> Module 08: My AI assistant keeps ignoring the rules I gave it. Why?<\/h2><p>Its rules file may never have loaded. Nothing warns you when that happens.<\/p>\n<p><strong>What happened.<\/strong> For weeks, Annie kept teaching her bot procedures. It kept failing to follow them.<\/p>\n<ul>\n<li>Nothing showed a problem, because every part of the setup seemed to work.<\/li>\n<li>In fact, its rules file had never loaded into the model at all.<\/li>\n<li>Two file links fixed it.<\/li>\n<\/ul>\n<p><strong>What to do.<\/strong> Run the cold test: a fresh session that proves your file loads. It is the only proof that the AI assistant read your files.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s23\"><h2><span class=\"num\">FAQ.23<\/span> Module 08: My builder says the job is tested and working. Can I trust that?<\/h2><p>Not yet. A report of success is only a claim.<\/p>\n<p><strong>What happened.<\/strong> Annie's receipt automation was reported as tested and working. A separate check on the machine found six bugs. Four of them stopped it from working at all. For example:<\/p>\n<ul>\n<li>The sender check could never match.<\/li>\n<li>The email tool could not download attachments.<\/li>\n<\/ul>\n<p><strong>What to do.<\/strong> Test it yourself. A confident sentence is not proof. The answer test and the refusal test are proof.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s24\"><h2><span class=\"num\">FAQ.24<\/span> Module 08: My builder finished the job. Did it do everything?<\/h2><p>Not always. Check its list, not just the result.<\/p>\n<p><strong>What happened.<\/strong> A builder rebuilt Annie's morning message with nobody watching. The new message met every requirement. But the builder skipped three things:<\/p>\n<ol>\n<li>the build log<\/li>\n<li>the to-do list update<\/li>\n<li>one setting. It had backed up that setting but never changed it.<\/li>\n<\/ol>\n<p>The fix: every instruction now ends with the builder reading its checks as a checklist, and marking each one done or not done.<\/p>\n<p><strong>What to do.<\/strong> A check that depends on goodwill gets skipped. Make it part of the process.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s25\"><h2><span class=\"num\">FAQ.25<\/span> Module 08B: Nothing bad has happened to my server. Does that mean it is safe?<\/h2><p>Not necessarily. It may just be luck.<\/p>\n<p><strong>What happened.<\/strong> For its first month, Annie's server had five secret files that any user on the machine could read. It had no firewall. Nothing bad happened, and that was luck, not design.<\/p>\n<ul>\n<li>Her first security review looked first and changed nothing. It found the gaps and sorted the fixes by risk.<\/li>\n<li>The next day the fixes went in. SSH was allowed before the firewall was switched on, with a second login window open.<\/li>\n<li>The bot kept the same process number throughout. That proved nothing broke.<\/li>\n<\/ul>\n<p><strong>What to do.<\/strong> Look before you change. Change in an order that always leaves you able to log in.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s26\"><h2><span class=\"num\">FAQ.26<\/span> Module 08B: I changed my bot's model and restarted it. The restart looked fine. Is the bot working?<\/h2><p>Not until it answers a real message. Starting the bot never checks the key.<\/p>\n<p><strong>What happened.<\/strong> Annie moved her bots to a new model provider. This caused three outages.<\/p>\n<ul>\n<li>Two bots went down. The new key sat only in the main bot's file, and each bot reads only its own.<\/li>\n<li>The nightly filing job failed. Its model names existed only on the old provider.<\/li>\n<li>Every restart looked healthy, because starting the bot never checks the key.<\/li>\n<\/ul>\n<p><strong>What to do.<\/strong> After any change to keys or models, send a real message through every bot.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s27\"><h2><span class=\"num\">FAQ.27<\/span> Module 09: Can I run my bot on a cheaper AI model?<\/h2><p>Yes, but only once the tools and checks around it are built.<\/p>\n<p><strong>What happened.<\/strong> Annie's first bot ran on a cheaper open model.<\/p>\n<ul>\n<li>It chatted well.<\/li>\n<li>It also said tasks were done when they were not.<\/li>\n<li>It wrote broken tools of its own instead of using the ones it had.<\/li>\n<li>It only added things to the calendar when given an exact command.<\/li>\n<li>Moving to Claude fixed it. The hidden cost was about a week of research, plus 13 logged hours of clean-up.<\/li>\n<li>Later, all three of Annie's bots ran well on a cheap DeepSeek model. By then the tools and guards around it were built.<\/li>\n<\/ul>\n<p><strong>What to do.<\/strong> Test a model on the actions you need. Check what it touched, not what it says.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s28\"><h2><span class=\"num\">FAQ.28<\/span> Module 09: My bot says it checked my calendar for clashes. Can I trust it?<\/h2><p>Not on its word alone. A bot that says it checked has not always checked correctly.<\/p>\n<p><strong>What happened.<\/strong> Annie's bot kept saying a 9:15 to 10:15 class was free on a Friday.<\/p>\n<ul>\n<li>Her son had an appointment from 9:45 to 10:30.<\/li>\n<li>The bot compared start times only, so it saw no problem.<\/li>\n<li>The fix was one rule that a script now applies to every slot. Two times clash if the first starts before the second ends, and ends after the second starts.<\/li>\n<\/ul>\n<p><strong>What to do.<\/strong> Give any check with a right answer, such as a time clash, to a script.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s29\"><h2><span class=\"num\">FAQ.29<\/span> Module 09: Can a cheap model grade my answers?<\/h2><p>Often not. A cheap model can be fine at sending and filing, and still too soft to judge.<\/p>\n<p><strong>What happened.<\/strong> Annie's learning bot graded her answer to a question about who approves AI at a bank.<\/p>\n<ul>\n<li>She named the chief executive, the finance chief and the board.<\/li>\n<li>The answer key named risk, security, legal and the data owner.<\/li>\n<li>The bot replied &quot;That's exactly it&quot;.<\/li>\n<li>It had made one model call and zero tool calls. So it had also saved nothing.<\/li>\n<li>Fixing the saving first would have recorded false passes. So the grading moved to Claude Code first.<\/li>\n<\/ul>\n<p><strong>What to do.<\/strong> Fix the judgement before you fix the step that records it.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s30\"><h2><span class=\"num\">FAQ.30<\/span> Module 10: My watchdog says every job ran. Is everything fine?<\/h2><p>Not always. A check that a job ran does not check what the job did.<\/p>\n<p><strong>What happened.<\/strong> Annie's watchdog checked three things: that the inbox sorter ran, that the backups were fresh and that the folders existed. It never checked where the notes went. For weeks the sorter reported &quot;ok&quot; while it filed every note into the wrong folder. When a check of the result was added, it went red on the first run.<\/p>\n<p><strong>What to do.<\/strong> Check the result, not only that the job ran. Open the file, list the folder or read the message the job produced.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s31\"><h2><span class=\"num\">FAQ.31<\/span> Module 10: I moved my bots to a cheaper model and some jobs broke. Is the new model the problem?<\/h2><p>Probably not. Check the keys and the model names first.<\/p>\n<p><strong>What happened.<\/strong> Annie moved two of her three bots to a cheaper model from a new provider. The third was already on it.<\/p>\n<ul>\n<li>The move broke the teaching bot, the nightly inbox sorter and the calendar job.<\/li>\n<li>The cause was not the model. The keys and model names did not carry across from the old provider.<\/li>\n<li>A new watchdog check now catches a model name that its provider does not serve.<\/li>\n<\/ul>\n<p><strong>What to do.<\/strong> When you change provider, check that every job has a key and a model name that the new provider accepts.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s32\"><h2><span class=\"num\">FAQ.32<\/span> Module 11: I get the same reminder twice, but I only have one job. Why?<\/h2><p>The bot may be sending it again when you reply.<\/p>\n<p><strong>What happened.<\/strong> On at least two nights Annie received two receipt reminders, but only one job existed. When she replied &quot;done&quot;, the bot sent the files again as a reply. The fix was a written rule: when she says &quot;done&quot;, note it and do not send the files again.<\/p>\n<p><strong>What to do.<\/strong> When a message arrives twice, check what the bot does when you reply, not only the schedule.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-faq-s33\"><h2><span class=\"num\">FAQ.33<\/span> Module 11: The bot said it updated my message format, but the next message looked the same. Why?<\/h2><p>The job may read a different file from the one the bot changed.<\/p>\n<p><strong>What happened.<\/strong> Annie asked for a new format for her morning message. The bot said &quot;updated&quot;, and it changed its skill file correctly. The next two mornings still came in the old format. The scheduled job had its own stored instructions, which said &quot;EXACTLY this format&quot;, and those won every time.<\/p>\n<p><strong>What to do.<\/strong> When a fix does not show up, find which file the job actually reads.<\/p>\n<\/section>", "count": 33, "sess": null}]}};</script>
<script>
const D=window.COURSE;let course='full',tab=null;
const $=s=>document.querySelector(s);
const hm=m=>{const h=Math.floor(m/60),r=m%60;return h?(r?`${h} hr ${r} min`:`${h} hr`):`${r} min`};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function tabsOf(c){return [{id:c+'-ov',label:'Overview'}].concat(D[c].tabs)}
function show(id,noscroll){
  const c=id.split('-')[0];course=c;tab=id;
  document.querySelectorAll('.courses button').forEach(b=>b.classList.toggle('on',b.dataset.c===c));
  const T=tabsOf(c);
  $('.tabs').innerHTML=T.map(t=>`<button data-t="${t.id}" class="${t.sess?'sc s'+t.sess.join(' s')+(t.sess.length>1?' split':''):''}${t.id===id?' on':''}" style="${t.sess&&t.sess.length>1?`--a:var(--s${t.sess[0]});--b:var(--s${t.sess[1]});--at:var(--s${t.sess[0]}t);--bt:var(--s${t.sess[1]}t)`:''}">${t.label}</button>`).join('');
  const i=T.findIndex(t=>t.id===id);const t=T[i];let h='';
  if(id.endsWith('-ov')){h=D[c].overview}
  else{
    const chips=[t.minutes?`<span class="chip">${hm(t.minutes)} in class</span>`:'',`<span class="chip">about ${t.read} min to read</span>`,`<span class="chip">${t.count} sections</span>`].join('');
    const toc=t.toc.length?`<details class="toc"><summary>In this module (${t.toc.length})</summary><ol>${t.toc.map(x=>`<li><a href="#${x[0]}"><span class="num">${x[1]}</span> ${x[2]}</a></li>`).join('')}</ol></details>`:'';
    h=`<div class="modhead"><div class="kicker">${c==='full'?'Full':'Short'} course</div><h1>${esc(t.title)}</h1><div class="chips">${chips}</div></div>${toc}${t.body}`;
  }
  const prev=T[i-1],next=T[i+1];
  h+=`<div class="navbtns">${prev?`<button data-t="${prev.id}"><span>← Back</span>${esc(prev.title||prev.label)}</button>`:''}${next?`<button class="next" data-t="${next.id}"><span>Next →</span>${esc(next.title||next.label)}</button>`:''}</div>`;
  $('main').innerHTML=h;
  const on=$('.tabs .on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});
  if(!noscroll)window.scrollTo(0,0);
  history.replaceState(null,'','#'+id);try{localStorage.setItem('courseTab',id);localStorage.setItem('courseTab-'+c,id)}catch(e){}
  prog();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-t],[data-c],[data-go]');
  if(b){e.preventDefault();if(b.dataset.c){let l=null;try{l=localStorage.getItem('courseTab-'+b.dataset.c)}catch(x){};show(valid(l)?l:b.dataset.c+'-ov')}else{show(b.dataset.t||b.dataset.go)}return}
  const a=e.target.closest('a[href^="#"]');
  if(a){const el=document.getElementById(a.getAttribute('href').slice(1));if(el){e.preventDefault();if(el.tagName==='DETAILS')el.open=true;el.scrollIntoView({behavior:'smooth'})}}
});
function prog(){const h=document.documentElement;const p=h.scrollTop/Math.max(1,h.scrollHeight-h.clientHeight);$('.progress').style.width=(p*100)+'%'}
addEventListener('scroll',prog,{passive:true});
function valid(id){if(!id)return false;const c=id.split('-')[0];return D[c]&&tabsOf(c).some(t=>t.id===id)}
let start=location.hash.slice(1);let sec=null;
if(!valid(start)){const m=start.match(/^(.*)-s\d+$/);if(m&&valid(m[1])){sec=start;start=m[1]}else{try{start=localStorage.getItem('courseTab')}catch(e){start=null}}}
if(!valid(start))start='full-ov';
show(start);if(sec){const el=document.getElementById(sec);if(el){if(el.tagName==='DETAILS')el.open=true;el.scrollIntoView()}}
</script>
</body></html>
