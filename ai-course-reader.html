"num\">01.5<\/span> Live Test: Read the Error Code the AI Provider Sends Back<\/h2><p>You do not need to guess whether a tool is blocked. Ask the company's server, and read the number it sends back. Every web request gets a number back, called a status code. Five codes matter here.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Code<\/th>\n<th>What it means for you<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>403<\/td>\n<td>Forbidden. The company refused you. From Hong Kong this is usually the regional block.<\/td>\n<\/tr>\n<tr>\n<td>401<\/td>\n<td>Unauthorised. The company answered and asked for a key. Access works.<\/td>\n<\/tr>\n<tr>\n<td>405<\/td>\n<td>Wrong method. The company answered, but expected a different kind of request. Access works.<\/td>\n<\/tr>\n<tr>\n<td>404<\/td>\n<td>Not found. The company answered, but not at that address. Check that you copied the whole command.<\/td>\n<\/tr>\n<tr>\n<td>No answer (a timeout)<\/td>\n<td>A network problem, not the company's decision. Check your Wi-Fi or VPN.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Step 1. Open a terminal.<\/strong><\/p>\n<ul>\n<li>On a Mac: press Command and Space, type Terminal, and press Return.<\/li>\n<li>On Windows: open the Start menu, type PowerShell, and press Return.<\/li>\n<\/ul>\n<p><strong>Step 2. Test Anthropic.<\/strong> Paste this line and press Return. It asks Anthropic's API for a page, and prints only the status code.<\/p>\n<p>On a Mac:<\/p>\n<pre><code class=\"language-bash\">curl -s -o /dev/null -w &quot;%{http_code}\\n&quot; https://api.anthropic.com/v1/messages\n<\/code><\/pre>\n<p>On Windows (PowerShell):<\/p>\n<pre><code class=\"language-powershell\">curl.exe -s -o NUL -w &quot;%{http_code}&quot; https://api.anthropic.com/v1/messages\n<\/code><\/pre>\n<p><strong>What you should see:<\/strong> a three-digit number on the next line.<\/p>\n<ul>\n<li>From a Hong Kong connection with no VPN: 403.<\/li>\n<li>With a VPN on: 405 or 401. Both mean the company answered.<\/li>\n<\/ul>\n<p>Write your code on your sheet.<\/p>\n<p><strong>Step 3. Test opencode, an AI provider for open models.<\/strong> This line is different from the Anthropic line. It ends in <code>-X POST<\/code>, because opencode only answers that kind of request at this address.<\/p>\n<p>On a Mac:<\/p>\n<pre><code class=\"language-bash\">curl -s -o /dev/null -w &quot;%{http_code}\\n&quot; -X POST https://opencode.ai/zen/go/v1/chat/completions\n<\/code><\/pre>\n<p>On Windows (PowerShell):<\/p>\n<pre><code class=\"language-powershell\">curl.exe -s -o NUL -w &quot;%{http_code}&quot; -X POST https://opencode.ai/zen/go/v1/chat/completions\n<\/code><\/pre>\n<p><strong>What you should see:<\/strong> 401. The company answered and wants a key. If you see 404, you left out <code>-X POST<\/code>.<\/p>\n<p><strong>If it fails:<\/strong><\/p>\n<ul>\n<li>If you see &quot;command not found&quot;, you are probably in the wrong program. Close it. Open Terminal or PowerShell again.<\/li>\n<li>If nothing prints for 30 seconds, press Control and C. Then check your Wi-Fi.<\/li>\n<\/ul>\n<h3>Your Terminal Window for the Rest of the Course<\/h3>\n<p><em>You make these settings in the build module (Module 08), once a builder is installed.<\/em><\/p>\n<p>This is the first time you open a terminal. Your builders run in a terminal for the rest of the course. So choose your window now.<\/p>\n<p><strong>Your choices:<\/strong><\/p>\n<ul>\n<li>the plain Terminal app that came with your Mac<\/li>\n<li>Ghostty, a free terminal app (ghostty.org)<\/li>\n<li>the Claude desktop app's Code tab<\/li>\n<\/ul>\n<p>All three run the same builder. Facilitator: Ghostty is for Mac. Confirm the Windows choice on the day.<\/p>\n<p><strong>Annie's advice: use a terminal (Terminal or Ghostty), not the desktop app.<\/strong> Her reason is that it uses fewer tokens. This is what she noticed from daily use. It is not a measurement.<\/p>\n<p><strong>Four things to know now. The build module (Module 08) sets them up.<\/strong><\/p>\n<ol>\n<li>\n<p><strong>Scrolling back can stop working while Claude Code runs in a terminal.<\/strong><\/p>\n<ul>\n<li>Why: Claude Code's &quot;fullscreen&quot; display keeps old messages inside Claude Code, not in the terminal's own history. With the mouse turned off, the scroll wheel cannot reach them.<\/li>\n<li>The fix is one setting: <code>&quot;tui&quot;: &quot;default&quot;<\/code> in Claude Code's settings file. This switches to the classic display. Every message then stays in the terminal's history. The scroll wheel and normal text selection work.<\/li>\n<li>Annie made this change herself (Claude Code settings documentation, &quot;tui&quot;).<\/li>\n<li>In the fullscreen display, Page Up and Page Down still scroll. Control and O opens the full conversation.<\/li>\n<\/ul>\n<\/li>\n<li>\n<p><strong>Copy and paste does not work at first in Claude Code,<\/strong> because Claude Code takes control of the mouse. In the Full course, pi changes this setting for you, because pi is installed first. Claude Code can also change it itself.<\/p>\n<\/li>\n<li>\n<p><strong>You can choose what shows at the bottom of the window.<\/strong> This line is called the status line. It can show:<\/p>\n<ul>\n<li>how much of the conversation space is used<\/li>\n<li>money spent<\/li>\n<li>the model name and effort level<\/li>\n<li>the folder the builder opened in<\/li>\n<li>the mode, for example auto or planning<\/li>\n<\/ul>\n<p>The status line belongs to the builder, not to the window. So pi and Claude Code show different items. You set up each one separately.<\/p>\n<\/li>\n<li>\n<p><strong>The keys that control a builder while it works:<\/strong><\/p>\n<\/li>\n<\/ol>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Key<\/th>\n<th>What it does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Escape<\/td>\n<td>Stops the builder in the middle of a job. Annie used the tools for weeks before she knew this<\/td>\n<\/tr>\n<tr>\n<td>Enter<\/td>\n<td>Sends your message. While the builder works, Enter does not stop the job. But it does not wait for the job to end either. Both builders read your message as soon as the current step finishes, inside the same job. So it can change what the builder does next. This is true in Claude Code and in pi<\/td>\n<\/tr>\n<tr>\n<td>Control and Enter<\/td>\n<td>Claude Code only. Sends your waiting messages at once. If Claude is only writing its answer, this interrupts it. Work that runs in the background keeps running<\/td>\n<\/tr>\n<tr>\n<td>Control and X, then Enter<\/td>\n<td>Claude Code's built-in key to queue a message for after the job. The message waits its turn and never interrupts the job. Annie moved this to Option and Enter on her Mac. The build module (Module 08) shows how<\/td>\n<\/tr>\n<tr>\n<td>Option and Enter (Mac), Control and Q (Windows)<\/td>\n<td>pi's default key to queue a message for after the job. Nothing needs setting up. pi holds the message until the whole job is finished. On Windows it is Control and Q, because Windows Terminal already uses Alt and Enter for full screen. Option and Up arrow (Alt and Q on Windows) brings waiting messages back so you can edit them<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><em>Where this table comes from:<\/em><\/p>\n<ul>\n<li><em>Claude Code's documentation says a message sent with Enter reaches Claude &quot;as soon as those tool calls finish, within the same turn&quot; (Claude Code docs, &quot;When Claude Code sends what you queued&quot;).<\/em><\/li>\n<li><em>pi's documentation says the same: Enter &quot;guides the next response&quot;, and Alt and Enter &quot;waits until Pi finishes the current task&quot; (pi docs, usage, &quot;Follow Pi's work&quot;).<\/em><\/li>\n<li><em>Annie proved the Claude Code behaviour herself. A question she typed in the middle of a job was answered inside that same job.<\/em><\/li>\n<li><em>The Windows keys come from pi's keybindings page. Nobody has tested them on a Windows machine.<\/em><\/li>\n<\/ul>\n<p><strong>Why Enter counts as steering, even when the builder answers your first question first.<\/strong> This confused Annie at first. Here it is in plain steps.<\/p>\n<ol>\n<li><strong>One reply is many small steps.<\/strong> When you ask the builder something, it does not answer in one go. It might search a file, then check a setting, then write the answer. That is three steps inside one reply.<\/li>\n<li><strong>A message sent with Enter arrives between steps.<\/strong> If you press Enter while the builder is busy, it reads your message as soon as the current step finishes. That is before the job is done.<\/li>\n<li><strong>Then the builder decides what to do with it.<\/strong> Annie once typed &quot;what's 4 + 4?&quot; in the middle of a job. It had nothing to do with the job. So the builder carried on and answered both questions at the end. From the outside, that looked like a queue.<\/li>\n<li><strong>It counts as steering, because it could have changed the rest of the job.<\/strong> Suppose Annie had typed &quot;stop, don't touch the settings files&quot; instead. The builder would have read it before its next step, and skipped that work. Her message changed nothing only because 4 + 4 was unrelated.<\/li>\n<li><strong>The queue key is different.<\/strong> With Option and Enter, the builder does not see your message until the whole reply is finished. A &quot;don't touch the settings files&quot; sent that way would arrive too late, after the files were already changed.<\/li>\n<\/ol>\n<p><strong>In short:<\/strong><\/p>\n<ul>\n<li>Enter means &quot;read this at your next step, and change course if it matters&quot;.<\/li>\n<li>Option and Enter means &quot;don't show me this until you're finished&quot;.<\/li>\n<\/ul>\n<p><strong>When to use which:<\/strong><\/p>\n<ul>\n<li>Use Enter to correct the builder in the middle of a job.<\/li>\n<li>Use Option and Enter for a new, unrelated task that should not pull the builder away from the current one.<\/li>\n<\/ul>\n<p><strong>You can change any of these keys, and add your own.<\/strong> You can move most keys in a builder to a key you prefer. Annie does not know every shortcut, and nobody needs to. To find them:<\/p>\n<ul>\n<li>search the web for the builder's name and &quot;keyboard shortcuts&quot;, for example &quot;Claude Code keyboard shortcuts&quot;, or<\/li>\n<li>ask your builder to list its shortcuts and change one for you.<\/li>\n<\/ul>\n<p><em>Short course:<\/em> you build with pi only. So the two Claude Code rows apply only if you add Claude later.<\/p>\n<p><strong>What these tests returned when Annie ran them:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Test<\/th>\n<th>Where the request came from<\/th>\n<th>Code<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Anthropic<\/td>\n<td>Hong Kong<\/td>\n<td>403<\/td>\n<\/tr>\n<tr>\n<td>Anthropic<\/td>\n<td>Taiwan and Singapore<\/td>\n<td>405<\/td>\n<\/tr>\n<tr>\n<td>opencode<\/td>\n<td>Hong Kong<\/td>\n<td>401<\/td>\n<\/tr>\n<tr>\n<td>opencode<\/td>\n<td>Taiwan and Singapore<\/td>\n<td>401<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The Hong Kong result for Anthropic took three tries. The first two tries quietly came from other countries. The next section shows how to check where your test really came from.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-01-s6\"><h2><span class=\"num\">01.6<\/span> Your Builder, and Claude If You Want It<\/h2><p><em>Short course.<\/em><\/p>\n<p>You need a builder for this course. A builder is the AI that installs software, edits files and fixes problems while you describe what you want in plain English.<\/p>\n<p><strong>In this course you build with pi (harness), connected to opencode Go (AI provider).<\/strong><\/p>\n<ul>\n<li>pi is a way to connect to many AI models, such as DeepSeek and Kimi K3. These open models are good, and they cost much less than the big Western models. <strong>[COST]<\/strong><\/li>\n<li>pi answers from Hong Kong directly. You need no VPN and no server.<\/li>\n<li>pi understands unclear instructions less well than Claude Code. So your instructions need to be clear. This course shows you how to write them.<\/li>\n<\/ul>\n<p><strong>If you want Claude, a VPN is a very good option.<\/strong><\/p>\n<ul>\n<li>With a VPN on, Claude Code works on your laptop. <strong>[COST]<\/strong><\/li>\n<li>Annie found Claude Code much easier for a non-developer building something new. It works out what you meant from an unclear description.<\/li>\n<li>Annie used a paid VPN for a long time to reach Claude.<\/li>\n<li>Anthropic's terms may not allow use from a region it does not serve. So whether to use a VPN is your own decision.<\/li>\n<\/ul>\n<p><strong>A Claude model through opencode: being checked.<\/strong><\/p>\n<ul>\n<li>opencode Go's model list has one Claude model: Claude Haiku 5.5, the smallest one.<\/li>\n<li>It answered through Annie's opencode Go plan from a Taiwan connection.<\/li>\n<li>It has not been tested from Hong Kong yet.<\/li>\n<li>Facilitator: run this check again before teaching. Then update this paragraph with the result.<\/li>\n<li>On opencode, the larger Claude models are pay-per-use only. They are not on the Go plan. <strong>[COST]<\/strong><\/li>\n<\/ul>\n<p><strong>The optional server sitting.<\/strong> Students who choose it build their own server in Singapore. The server then becomes their route to Claude, with no paid VPN. It runs as a separate sitting, outside this course's 10 hours.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>pi (harness) with opencode Go (AI provider)<\/th>\n<th>Claude Code (harness) through a VPN<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Works from a Hong Kong connection<\/td>\n<td>Yes<\/td>\n<td>Yes, with the VPN on<\/td>\n<\/tr>\n<tr>\n<td>Monthly cost<\/td>\n<td><strong>[COST]<\/strong><\/td>\n<td><strong>[COST]<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Strength<\/td>\n<td>Cheap, fast, and no VPN<\/td>\n<td>Understands unclear, plain-English requests<\/td>\n<\/tr>\n<tr>\n<td>Weakness<\/td>\n<td>Needs clearer instructions from you<\/td>\n<td>Needs the VPN on, and may break Anthropic's terms<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>\n<section class=\"card\" id=\"short-01-s7\"><h2><span class=\"num\">01.7<\/span> Phones and the Mac<\/h2><p><em>Full course, and the Short course's optional server sitting.<\/em><\/p>\n<p>You use your phone to talk to your bot and to open your private pages. Phones and laptops differ in one way that matters here: can you choose which apps use the route out?<\/p>\n<p><strong>Android can choose app by app.<\/strong><\/p>\n<ul>\n<li>In the Tailscale app, use <strong>exclude mode<\/strong>.<\/li>\n<li>Tick only the apps that should stay on your Hong Kong connection, such as Chrome and your banking apps. Everything else uses the route out.<\/li>\n<li>Do not use include mode. It looks safer, but it breaks. Android's address lookup is not an app you can tick. So website names stop working, and the phone can log itself out of Tailscale.<\/li>\n<\/ul>\n<p><strong>An iPhone routes everything or nothing.<\/strong> There is no app-by-app choice on an iPhone.<\/p>\n<p><strong>The Mac also routes everything or nothing.<\/strong><\/p>\n<ul>\n<li>Annie uses one command that switches her Mac between two states: everything through her server, or her real Hong Kong connection.<\/li>\n<li>The same command prints the address the Mac is using. So she checks the state instead of guessing it.<\/li>\n<\/ul>\n<p><strong>Trust a test, not a status label.<\/strong><\/p>\n<ul>\n<li>During the Android setup, the Tailscale app showed &quot;Logged out&quot;, but traffic was still going through it.<\/li>\n<li>Claude misread the label. It wrongly decided that the Claude app worked without a VPN.<\/li>\n<li>Annie caught the mistake. A test across the private network proved the connection was up the whole time.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-01-s8\"><h2><span class=\"num\">01.8<\/span> Lessons From Real Mistakes<\/h2><p>Each line below is one lesson from a real mistake in Annie's own system. The full story behind each one is on the FAQ tab, the last tab at the top of the page.<\/p>\n<ul>\n<li>Before you believe a test that disproves what you already know, check that the test was clean.<\/li>\n<li>A model on a price list may still refuse you. Send it a short hello first, from the machine and the key that will use it.<\/li>\n<li>Write the date next to every fact about what works. Check it again before you rely on it.<\/li>\n<li>Your connection, your sign-up details and your billing address are three separate checks. A VPN fixes only your connection.<\/li>\n<li>Before you trust a location test, check which country the request came from.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-01-s9\"><h2><span class=\"num\">01.9<\/span> Exercise<\/h2><p>Run the live test for Anthropic and for opencode. Then answer three questions in writing.<\/p>\n<ol>\n<li>Which status code did Anthropic return? Which code did opencode return? What does each code mean?<\/li>\n<li>Which builder will you use? What is your route to Claude, if you want one? Give your reason in one sentence.<\/li>\n<li>Which AI tools have you been reaching through another route, such as a VPN or a work network? Did you know you were doing that?<\/li>\n<\/ol>\n<p>Most people find at least one tool for question 3.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-01-s10\"><h2><span class=\"num\">01.10<\/span> Worksheet: Your Access Sheet<\/h2><p>Copy this table into a new note called <code>Access Sheet<\/code> in your notes app. You move it into your notes folder later in the course.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Tool<\/th>\n<th>What I use it for<\/th>\n<th>Works from Hong Kong directly? (Y / N / test code)<\/th>\n<th>My route<\/th>\n<th>Account created?<\/th>\n<th>Tested on (date)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Gemini (consumer)<\/td>\n<td><\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My builder (pi, and Claude Code in the Full course)<\/td>\n<td>Building and fixing<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Claude, if I want it<\/td>\n<td><\/td>\n<td><\/td>\n<td>VPN, my server, or opencode<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>opencode Go (AI provider)<\/td>\n<td>The models for my bot and for pi<\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Telegram<\/td>\n<td>Talking to my bot<\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Obsidian<\/td>\n<td>My notes, in one place<\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Tailscale (Full course, or the server sitting)<\/td>\n<td>Private network and route out<\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Server company (Full course, or the server sitting)<\/td>\n<td>Computer that is always on<\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Other:<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>My open question for the facilitator:<\/strong><\/p>\n<\/section>", "count": 10, "sess": [1]}, {"id": "short-02", "label": "02", "title": "Module 02: Privacy, Security and Whose Law Reaches Your Data", "minutes": 35, "read": 11, "toc": [["short-02-s1", "02.1", "What You Will Leave With"], ["short-02-s2", "02.2", "What You Need to Prepare"], ["short-02-s3", "02.3", "Why This Comes Before Any Connection"], ["short-02-s4", "02.4", "Whose Law Can Reach Your Data"], ["short-02-s5", "02.5", "Your One-Line Rule and the Four Habits That Enforce It"], ["short-02-s6", "02.6", "Build Your Data Map"], ["short-02-s7", "02.7", "Lessons From Real Mistakes"], ["short-02-s8", "02.8", "Exercise"], ["short-02-s9", "02.9", "Worksheet: Your Data Map"]], "body": "<section class=\"card\" id=\"short-02-s1\"><h2><span class=\"num\">02.1<\/span> What You Will Leave With<\/h2><p><strong>Your Data Map.<\/strong> It sorts your information into three tiers: open, personal and never.<\/p>\n<ul>\n<li>For each tier, it names the companies you allow.<\/li>\n<li>For each tier, it names the places the data may be stored.<\/li>\n<li>It ends with a short list of things that never go into any AI tool.<\/li>\n<li>It also has a protection checklist for your accounts.<\/li>\n<\/ul>\n<p>Two later modules use the map:<\/p>\n<ul>\n<li>The rules module (Module 07) turns the map into rules your bot must follow.<\/li>\n<li>The builder module (Module 08) copies your list of things that never go into any AI tool into your builder's instructions.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-02-s2\"><h2><span class=\"num\">02.2<\/span> What You Need to Prepare<\/h2><ul>\n<li><strong>Module 01 finished.<\/strong> You need your Access Sheet. It lists the tools you are about to sort.<\/li>\n<li><strong>A list of your accounts.<\/strong> Email, calendar, cloud storage, password manager, and any AI tools you already use.<\/li>\n<li><strong>Your phone.<\/strong> You will check two-factor sign-in on it.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-02-s3\"><h2><span class=\"num\">02.3<\/span> Why This Comes Before Any Connection<\/h2><p>Every tool you connect in this course gets a permission. A permission given in a hurry is hard to take back.<\/p>\n<p>Here is what happened to Annie:<\/p>\n<ol>\n<li>Annie asked Google to give her bot less access to her email.<\/li>\n<li>Google kept the old, wider permission anyway.<\/li>\n<li>The reason: a smaller request does not cancel a larger one you granted before.<\/li>\n<li>She had to remove the app's access completely and start again.<\/li>\n<\/ol>\n<p>So the order matters:<\/p>\n<ol>\n<li>First, decide what data goes where. This module gives you those decisions.<\/li>\n<li>Then, connect only the tools that fit those decisions. The build modules (Module 08 and Module 08B) make those connections.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"short-02-s4\"><h2><span class=\"num\">02.4<\/span> Whose Law Can Reach Your Data<\/h2><p>People use three words as if they mean the same thing. They do not.<\/p>\n<ul>\n<li><strong>Where the data sits.<\/strong> This is the country the computer holding it is in. Lawyers call this residency.<\/li>\n<li><strong>Whose law can reach it.<\/strong> This is which government can order someone to hand the data over. It depends mostly on where the company is based. It does not depend only on where the computer is. In meetings you will hear this called <strong>sovereignty<\/strong>.<\/li>\n<li><strong>Who can read it.<\/strong> This depends on the company's settings, its contract with you, and the people who run it. This is confidentiality.<\/li>\n<\/ul>\n<p><strong>Where the data sits does not decide whose law reaches it.<\/strong><\/p>\n<ul>\n<li>A US company storing your data in Singapore still has to answer US legal orders.<\/li>\n<li>The law behind this is the US CLOUD Act (2018, 18 U.S.C. section 2713).<\/li>\n<li>It lets US authorities require a US company to hand over data in its control. This applies wherever the data is stored.<\/li>\n<\/ul>\n<p>Annie described her own system honestly:<\/p>\n<ul>\n<li>Her data sits on machines she controls. That is ownership.<\/li>\n<li>Her backups and models still pass through companies under foreign law. So it is not full sovereignty.<\/li>\n<\/ul>\n<p><strong>Renting a server is choosing a country.<\/strong> You pick a data centre when you sign up. Most people never notice they chose.<\/p>\n<ul>\n<li>Annie's server sits in Singapore.<\/li>\n<li>She rents it from a company based in Germany.<\/li>\n<li>So two countries are involved: the one where the data sits, and the one where the company is based.<\/li>\n<\/ul>\n<p><strong>The server company's country and the data centre's country can both reach everything on the server. Each AI company's country can reach only what you send it.<\/strong><\/p>\n<p>Here is how that works for Annie's own data. Each country reaches a different slice. (Checked 10 Oct 2026.)<\/p>\n<ol>\n<li><strong>The United States, through Claude and other US companies.<\/strong>\n<ul>\n<li>US law reaches what Annie sends to Claude, such as her chats and the files Claude reads.<\/li>\n<li>It does not reach her whole server.<\/li>\n<li>Claude is not her only US company. opencode, which runs her bots, is in San Francisco. Google holds her email, her calendar and her password-locked backups on Google Drive.<\/li>\n<li>So US law reaches more of her data than Claude alone.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Singapore, because the server sits there.<\/strong>\n<ul>\n<li>Singapore law reaches everything on the server.<\/li>\n<li>The reason: the whole disk is physically in Singapore.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Germany, because Hetzner is a German company.<\/strong>\n<ul>\n<li>The company is Hetzner Online GmbH, in Gunzenhausen, Germany.<\/li>\n<li>German law also reaches everything on the server, because Hetzner controls the machine.<\/li>\n<li>Hetzner's terms say encryption is the customer's job, not Hetzner's.<\/li>\n<\/ul>\n<\/li>\n<li><strong>The British Virgin Islands and Dubai, through Telegram.<\/strong>\n<ul>\n<li>Annie's chats with her bot pass through Telegram's companies in those two places.<\/li>\n<li>Bot chats are not end-to-end encrypted.<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<p><strong>In short:<\/strong> Singapore and Germany can reach the whole server. The United States can reach whatever passes through its companies, and for Annie that is a lot. This is what Annie meant by &quot;ownership, not full sovereignty&quot;. She owns the machine. Several countries can still reach parts of it.<\/p>\n<p><strong>The companies this course uses or mentions.<\/strong> Policies change. Check each company before you rely on what is written here.<\/p>\n<p><strong>Anthropic (Claude), OpenAI, Google, Microsoft<\/strong><\/p>\n<ul>\n<li>Based in: the United States.<\/li>\n<li>What it means for you: US law can reach your data, wherever it is stored.<\/li>\n<\/ul>\n<p><strong>opencode Go (AI provider: the model subscription your bot uses)<\/strong><\/p>\n<ul>\n<li>Based in: the United States. The company is Anomaly, in San Francisco.<\/li>\n<li>US law reaches opencode.<\/li>\n<li>For the AI model DeepSeek V4.1 Flash on the Go plan, opencode states two things:\n<ul>\n<li>The data is not used for training.<\/li>\n<li>The data is kept for 0 days.<\/li>\n<\/ul>\n<\/li>\n<li>That rests on an agreement with DeepSeek. opencode renews it monthly. It is currently valid to 31 Oct 2026.<\/li>\n<li>The Go page does not say which country runs the model.<\/li>\n<li>opencode's separate pay-per-use service (Zen) says its models run in the US and the EU.<\/li>\n<li>Source: opencode Go and Zen pages, and privacy policy, read 9 Oct 2026.<\/li>\n<\/ul>\n<p><strong>DeepSeek (its own app and API)<\/strong><\/p>\n<ul>\n<li>Based in: mainland China.<\/li>\n<li>Its privacy policy says it collects, processes and stores personal data in the People's Republic of China.<\/li>\n<li>It uses data to train its models.<\/li>\n<li>You have the right to opt out.<\/li>\n<li>Source: DeepSeek privacy policy, read 9 Oct 2026.<\/li>\n<\/ul>\n<p><strong>Qwen (Alibaba), Kimi (Moonshot), GLM (Zhipu), each through its own app<\/strong><\/p>\n<ul>\n<li>Based in: mainland China.<\/li>\n<li>The same question applies to each company's own app. Read each policy.<\/li>\n<\/ul>\n<p><strong>A Chinese-made model reached through another company<\/strong><\/p>\n<ul>\n<li>Based in: wherever that other company is based.<\/li>\n<li>You are bound by the host's policy, not the model maker's.<\/li>\n<li>opencode above is the example: a US company serving models made in China.<\/li>\n<\/ul>\n<p><strong>Mistral<\/strong><\/p>\n<ul>\n<li>Based in: France (European Union).<\/li>\n<li>EU data protection law (GDPR) applies.<\/li>\n<\/ul>\n<p><strong>Telegram<\/strong><\/p>\n<ul>\n<li>Based in: Telegram Group Inc. is in the British Virgin Islands. Telegram FZ-LLC is in Dubai.<\/li>\n<li>Chats with a bot are cloud chats. They are not end-to-end encrypted.<\/li>\n<li>Only Telegram's secret chats are end-to-end encrypted. Bots cannot use secret chats.<\/li>\n<li>Whoever runs the bot receives every message you send it.<\/li>\n<li>Source: Telegram privacy policy, sections 3.3 and 6, read 9 Oct 2026.<\/li>\n<\/ul>\n<p><strong>Your rented server (Full course, or the optional server sitting)<\/strong><\/p>\n<ul>\n<li>Based in: the server company's country, plus the data centre you pick.<\/li>\n<li>Pick the data centre on purpose.<\/li>\n<\/ul>\n<p><strong>Hong Kong's own privacy law also applies to you.<\/strong> It is the Personal Data (Privacy) Ordinance (PDPO).<\/p>\n<ul>\n<li>It covers personal data you put into any tool.<\/li>\n<li>That includes data about other people.<\/li>\n<li>Your family's and your friends' details belong to them as well as to you.<\/li>\n<\/ul>\n<p><strong>Training on your data is a setting, not a fact.<\/strong><\/p>\n<ul>\n<li>Since August 2025, people on Claude's Free, Pro and Max plans choose whether their chats and coding sessions train future models.<\/li>\n<li>If you allow it, Anthropic keeps the data for up to 5 years.<\/li>\n<li>If you do not allow it, Anthropic keeps it for 30 days.<\/li>\n<li>Source: Anthropic, &quot;Updates to Consumer Terms and Privacy Policy&quot;, Aug 2025.<\/li>\n<\/ul>\n<p>Check this setting today on every AI account you hold.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-02-s5\"><h2><span class=\"num\">02.5<\/span> Your One-Line Rule and the Four Habits That Enforce It<\/h2><p>Annie wrote one rule early on. She tested every later connection against it:<\/p>\n<blockquote>\n<p><strong>Read freely. Write to my own notes freely. Anything that goes to another person needs my yes, every time.<\/strong><\/p>\n<\/blockquote>\n<p><strong>Why this one rule matters.<\/strong> In June 2025 the writer Simon Willison named the most dangerous combination in AI tools. It is an AI assistant that does all three of these:<\/p>\n<ol>\n<li>It holds your private data.<\/li>\n<li>It reads content from strangers, such as incoming email.<\/li>\n<li>It has a way to send data out.<\/li>\n<\/ol>\n<p>Take away the way out. Then an instruction hidden in a stranger's email cannot send your data anywhere.<\/p>\n<p>Four habits make the rule real.<\/p>\n<p><strong>Habit 1: Put the limit in the permission, not in the instructions.<\/strong><\/p>\n<ul>\n<li>A sentence such as &quot;never send email&quot; is a request. The model can misread it.<\/li>\n<li>Annie's email tool has read-only access at Google's end.<\/li>\n<li>Its script also has no command that sends.<\/li>\n<li>So Google refuses a send even if something tries one.<\/li>\n<li>That is two separate protections. Neither depends on the model behaving.<\/li>\n<\/ul>\n<p><strong>Habit 2: Give each tool the smallest access that does the job.<\/strong><\/p>\n<ul>\n<li>Say a bot needs one calendar.<\/li>\n<li>Give it a small script that can only read that one calendar.<\/li>\n<li>Do not give it your whole account plus a sentence asking it to stay in one corner.<\/li>\n<li>Annie built exactly this for a family member's tutor bot.<\/li>\n<\/ul>\n<p><strong>Habit 3: Revoke at the source before you delete anything.<\/strong><\/p>\n<ul>\n<li>Deleting a file that holds a login does not cancel the login.<\/li>\n<li>The login still works from any backup copy.<\/li>\n<li>Once, an old Google login on Annie's server still had wide calendar access. Her bot used it once, even though its rules said never to.<\/li>\n<li>The fix had three steps, in this order:\n<ol>\n<li>Cancel the login at Google.<\/li>\n<li>Check that Google refused it.<\/li>\n<li>Only then delete the files.<\/li>\n<\/ol>\n<\/li>\n<li>The same applies inside chat apps. Disconnecting a tool inside a chat app does not cancel its permission at the company that granted it. The permission stays live until you remove it there too.<\/li>\n<\/ul>\n<p><strong>Habit 4: Label every paste before you paste it.<\/strong><\/p>\n<ul>\n<li>Before your builder asks you to paste anything, it should say which kind it is:\n<ul>\n<li>safe to paste,<\/li>\n<li>remove the secret first, or<\/li>\n<li>never paste.<\/li>\n<\/ul>\n<\/li>\n<li>Never paste passwords, API keys, tokens or private keys into any chat.<\/li>\n<li>You will put this rule into your builder's instructions in the builder module (Module 08).<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-02-s6\"><h2><span class=\"num\">02.6<\/span> Build Your Data Map<\/h2><ol>\n<li>Fill in the worksheet below.<\/li>\n<li>Then fill in the protection checklist.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"short-02-s7\"><h2><span class=\"num\">02.7<\/span> Lessons From Real Mistakes<\/h2><p>Each line below is one lesson from a real mistake in Annie's own system. The full story behind each one is on the FAQ tab, the last tab at the top of the page.<\/p>\n<ul>\n<li>When the exact control you want does not exist, choose the stricter control you can prove.<\/li>\n<li>Taking access back is a deliberate act at the company. It is not a smaller request.<\/li>\n<li>Count every copy of a secret before you claim it is safe.<\/li>\n<li>Check where your phone has already put private material before you worry about the bot.<\/li>\n<li>When you inspect settings, print the names of keys, never their values.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-02-s8\"><h2><span class=\"num\">02.8<\/span> Exercise<\/h2><p>Take three real things you want your system to handle. For example: your family calendar, your expense receipts, and your meeting notes.<\/p>\n<p>For each one, answer on paper:<\/p>\n<ol>\n<li>Which tier is it in: open, personal, or never?<\/li>\n<li>Which company will process it? Which country's law reaches that company?<\/li>\n<li>If that company changed its terms tomorrow, which of your files would you need to keep?<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"short-02-s9\"><h2><span class=\"num\">02.9<\/span> Worksheet: Your Data Map<\/h2><p><strong>My one-line rule:<\/strong> ____________________________________________<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Tier<\/th>\n<th>What belongs here<\/th>\n<th>My examples<\/th>\n<th>Companies I allow<\/th>\n<th>Where it may be stored<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Open<\/td>\n<td>Public information, research, drafts I would publish anyway<\/td>\n<td><\/td>\n<td>Any company on my Access Sheet<\/td>\n<td>Anywhere<\/td>\n<\/tr>\n<tr>\n<td>2. Personal<\/td>\n<td>My notes, plans, calendar, family admin<\/td>\n<td><\/td>\n<td>Only companies I chose on purpose, with training switched off<\/td>\n<td>My laptop and my notes. My own server, if I have one<\/td>\n<\/tr>\n<tr>\n<td>3. Never<\/td>\n<td>Passwords, keys, ID numbers, bank and card numbers, other people's confidential business<\/td>\n<td><\/td>\n<td>None. These never go into any AI tool or bot chat<\/td>\n<td>A password manager only<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Client or employer information:<\/strong> keep it out of your personal bot, unless your organisation has approved a tool for it. Write your organisation's rule here: ____________<\/p>\n<p><strong>Protection checklist<\/strong> (tick each one before the builder module (Module 08)):<\/p>\n<ul>\n<li class=\"task\"><span class=\"box\"><\/span>Disk encryption is on for my laptop (FileVault on Mac, BitLocker or Device Encryption on Windows).<\/li>\n<li class=\"task\"><span class=\"box\"><\/span>I use a password manager, and no password lives in my notes.<\/li>\n<li class=\"task\"><span class=\"box\"><\/span>Two-factor sign-in is on for my email, Telegram, every AI account, and my server company if I have one.<\/li>\n<li class=\"task\"><span class=\"box\"><\/span>I have checked the &quot;use my data for training&quot; setting on every AI account.<\/li>\n<li class=\"task\"><span class=\"box\"><\/span>I know which of my accounts are work accounts and which are personal.<\/li>\n<\/ul>\n<\/section>", "count": 9, "sess": [1]}, {"id": "short-03", "label": "03", "title": "Module 03: Architecture and Where Your System Lives", "minutes": 70, "read": 22, "toc": [["short-03-s1", "03.1", "What You Will Leave With"], ["short-03-s2", "03.2", "What You Need to Prepare"], ["short-03-s3", "03.3", "Where Is the One Real Copy?"], ["short-03-s4", "03.4", "Five Questions About How You Work"], ["short-03-s5", "03.5", "The Parts of the System"], ["short-03-s6", "03.6", "The Vault, and One Job Each for Calendar, Vault and Inbox"], ["short-03-s7", "03.7", "Build Your Vault"], ["short-03-s8", "03.8", "Three Questions and the Decision Tree"], ["short-03-s9", "03.9", "What the Optional Server Sitting Adds"], ["short-03-s10", "03.10", "Telegram as the Front Door"], ["short-03-s11", "03.11", "Your Shape Decision, and What Your System Does at 11pm on a Bad Day"], ["short-03-s12", "03.12", "Lessons From Real Mistakes"], ["short-03-s13", "03.13", "Exercise"], ["short-03-s14", "03.14", "Worksheet: System Sketch and Shape Decision"]], "body": "<div class=\"intro\"><p>The module has two halves:<\/p>\n<ol>\n<li><strong>&quot;A System That Fits How You Think&quot;.<\/strong> This half fits the system to the person and builds the notes vault.<\/li>\n<li><strong>&quot;Where Your System Lives&quot;.<\/strong> This half decides which machine the system runs on.<\/li>\n<\/ol>\n<p>You can teach the second half in the next session. In the Full course, teach it at least a day before the server module (Module 08B). The reason: the server company's identity check can take time.<\/p>\n<p>Prices are marked <strong>[COST]<\/strong>. They go in last.<\/p>\n<\/div>\n<section class=\"card\" id=\"short-03-s1\"><h2><span class=\"num\">03.1<\/span> What You Will Leave With<\/h2><ul>\n<li><strong>Your worksheet answers.<\/strong> Six lines about how you find, capture, plan and share.<\/li>\n<li><strong>A working vault.<\/strong> This is an Obsidian folder on your laptop and your phone. It holds your folders, an inbox, a map note (one line per folder saying what lives there), your Access Sheet and your Data Map.<\/li>\n<li><strong>Your Shape Decision.<\/strong> It says which machine runs your system. Telegram is ready on your phone. In the Full course, it also records the server you ordered.<\/li>\n<li><strong>Homework:<\/strong> a one-page System Sketch: your system drawn as boxes and arrows.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-03-s2\"><h2><span class=\"num\">03.2<\/span> What You Need to Prepare<\/h2><ul>\n<li><strong>Modules 01 and 02 finished.<\/strong> Bring the Access Sheet and the Data Map.<\/li>\n<li><strong>Admin rights on your laptop.<\/strong> You will install one app.<\/li>\n<li><strong>Your phone, with Telegram installed.<\/strong><\/li>\n<\/ul>\n<\/section>\n<div class=\"partbar\">A System That Fits How You Think<\/div>\n<section class=\"card\" id=\"short-03-s3\"><h2><span class=\"num\">03.3<\/span> Where Is the One Real Copy?<\/h2><p>Count the places your notes and instructions live today. Most people find four to six. For example:<\/p>\n<ul>\n<li>a notes app<\/li>\n<li>email drafts<\/li>\n<li>a to-do app<\/li>\n<li>documents in Downloads<\/li>\n<li>a chat with an AI that remembers some things<\/li>\n<li>a paper notebook<\/li>\n<\/ul>\n<p>Annie's own system had this problem twice:<\/p>\n<ol>\n<li><strong>Her notes about the bot.<\/strong> They lived in three places: a folder on her Mac, Obsidian, and the bot's server.<\/li>\n<li><strong>Her builder's memory.<\/strong> Her builder had four separate memories: two accounts on the Mac, one on the server, and an old project folder. They had drifted apart. The version on her phone felt like a stranger, because it read a different copy of her.<\/li>\n<\/ol>\n<p><strong>Two copies of one file slowly become different from each other. Then you cannot trust either one.<\/strong> That is the reason for this module. The fix is one real copy that every device and every tool reads.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-03-s4\"><h2><span class=\"num\">03.4<\/span> Five Questions About How You Work<\/h2><p><strong>There is no correct design. There is only the one that fits the person using it.<\/strong><\/p>\n<ul>\n<li>Most AI advice hands everyone the same tools and the same folders.<\/li>\n<li>When it does not stick, people blame their own discipline.<\/li>\n<li>The real cause is usually that the system was built for someone else's habits.<\/li>\n<li>A system that is awkward to use gets abandoned within a few weeks.<\/li>\n<\/ul>\n<p>These five questions change the design.<\/p>\n<p><strong>1. How do you find things again?<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>If you remember...<\/th>\n<th>Then your system should...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><em>Where<\/em> you saw something<\/td>\n<td>Be organised by place: folders, projects, people<\/td>\n<\/tr>\n<tr>\n<td><em>When<\/em> you saw it<\/td>\n<td>Be organised by time: dated notes and logs<\/td>\n<\/tr>\n<tr>\n<td><em>What it was about<\/em><\/td>\n<td>Be searchable, with notes that link to each other<\/td>\n<\/tr>\n<tr>\n<td>Nothing reliably<\/td>\n<td>Capture things for you automatically, with no filing decision<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The last row matters most for people with busy heads. If saving a thought costs a filing decision, the thought gets lost.<\/p>\n<p><strong>2. How do you capture?<\/strong><\/p>\n<ul>\n<li>Typing, voice, photos, or forwarding things on.<\/li>\n<li>Whatever you actually use is the front door.<\/li>\n<li>A system with a front door you avoid will not be used.<\/li>\n<\/ul>\n<p><strong>3. When are you at your best?<\/strong><\/p>\n<ul>\n<li>Some people plan in the morning and act at night. Others do the reverse.<\/li>\n<li>Your automations should arrive before the moment they are useful.<\/li>\n<li>A 7am summary helps someone who plans early. For someone who plans late, it is a message they will mute.<\/li>\n<\/ul>\n<p><strong>4. What do you dread doing?<\/strong><\/p>\n<ul>\n<li>For example: chasing invoices, filing receipts, copying between systems, writing the same email.<\/li>\n<li>The best first automation is the one you dread, not the cleverest one.<\/li>\n<li>The dread is what keeps you maintaining it.<\/li>\n<\/ul>\n<p><strong>5. Who else has to work with you?<\/strong><\/p>\n<ul>\n<li>If nobody else touches your system, build it for one person.<\/li>\n<li>Once a spouse, an assistant or a colleague needs access, you must be able to separate your private notes from shared ones.<\/li>\n<li>Annie has bots sealed to one person and one purpose, such as a tutor for her son. Those bots must not see the rest of her life.<\/li>\n<\/ul>\n<h3>Worksheet: How I Work<\/h3>\n<p>Answer in one line each. Do not overthink.<\/p>\n<ol>\n<li>When you need something you saved six months ago, what do you search for: the <strong>place<\/strong>, the <strong>date<\/strong>, or the <strong>topic<\/strong>?<\/li>\n<li>How do you capture a thought at 2am: type it, say it, or lose it?<\/li>\n<li>Which single task do you dread most, and when does it come up?<\/li>\n<li>When do you plan, and when do you act?<\/li>\n<li>Who else will ever need to see your notes, and who must never?<\/li>\n<li>What have you tried before and abandoned, and why? This is the most useful answer on the page.<\/li>\n<\/ol>\n<h3>Annie's Answers, as a Worked Example<\/h3>\n<p>This is not a template to copy. It shows one person's habits turned into design choices.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>How Annie works<\/th>\n<th>What she built<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Thinks in linked ideas, not folders<\/td>\n<td>One vault where notes link to each other<\/td>\n<\/tr>\n<tr>\n<td>Loses anything that needs a filing decision<\/td>\n<td>One inbox, sorted every night by a scheduled job<\/td>\n<\/tr>\n<tr>\n<td>Works across two accounts and several devices<\/td>\n<td>A continuity note, so the next session picks up where the last one stopped<\/td>\n<\/tr>\n<tr>\n<td>Uses her laptop, her phone and different times of day<\/td>\n<td>Several ways in, all reading one set of notes<\/td>\n<\/tr>\n<tr>\n<td>Dreads admin above everything else<\/td>\n<td>Admin handed over first: briefs, filing, reminders, chasing<\/td>\n<\/tr>\n<tr>\n<td>Family time is fixed<\/td>\n<td>Bots sealed to family jobs, and a system that protects that time<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Six Ways a Personal System Fails<\/h3>\n<ol>\n<li><strong>Copying someone else's system whole.<\/strong> It was built for how they think.<\/li>\n<li><strong>Building the clever thing before the needed thing.<\/strong> The clever thing gets abandoned. The needed thing gets maintained.<\/li>\n<li><strong>Keeping two places to look.<\/strong> One of them is always out of date.<\/li>\n<li><strong>Designing for a tidier version of yourself.<\/strong> Build for the person who actually shows up.<\/li>\n<li><strong>Making capture cost a decision.<\/strong> If saving something needs a choice, it does not get saved.<\/li>\n<li><strong>Building for the demo instead of a normal day.<\/strong> Ask whether it still helps on an ordinary, tired weekday.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"short-03-s5\"><h2><span class=\"num\">03.5<\/span> The Parts of the System<\/h2><p><strong>Each part has one job.<\/strong> When one part tries to do another part's job, things go wrong in ways that are hard to see.<\/p>\n<p>Annie's summary:<\/p>\n<ul>\n<li>The bots act.<\/li>\n<li>The watchdog only reports.<\/li>\n<li>A separate script restarts stuck bots.<\/li>\n<li>Claude Code builds.<\/li>\n<\/ul>\n<p><strong>The builder and the bot are different.<\/strong> People mix them up.<\/p>\n<ul>\n<li><strong>The bot<\/strong> is the AI assistant you message from your phone. It has a personality, a small set of skills, and low running costs.<\/li>\n<li><strong>The builder<\/strong> is the tool you use at your desk to build or fix something real. It can read every file and change the system itself.<\/li>\n<li>You build the builder first. Then you use it to build the bot.<\/li>\n<\/ul>\n<h3>Short Course: The Laptop Version<\/h3>\n<pre><code class=\"language-mermaid\">flowchart LR\n  You((You)) -- &quot;plain-English requests&quot; --&gt; Builder\n  subgraph Laptop[&quot;Your laptop (only while it is open)&quot;]\n    Builder[&quot;Your AI assistant (pi)&quot;]\n    Vault[(&quot;Your vault&quot;)]\n  end\n  Builder -- &quot;reads and edits&quot; --&gt; Vault\n  Builder -- &quot;asks for an answer&quot; --&gt; Model[&quot;A rented AI model&quot;]\n<\/code><\/pre>\n<p>In this course, everything runs on your laptop.<\/p>\n<ul>\n<li>Your AI assistant and your vault live there.<\/li>\n<li>There is no bot.<\/li>\n<li>The AI assistant works while the laptop is open. You talk to it in the terminal.<\/li>\n<\/ul>\n<p>Some things need a machine that stays on:<\/p>\n<ul>\n<li>a bot you can message from your phone<\/li>\n<li>jobs that run while you sleep<\/li>\n<li>a watchdog that checks every hour<\/li>\n<\/ul>\n<p>That is what the optional server sitting adds.<\/p>\n<h3>How Your Builder and Your Bot Reach an AI: Harness, Provider, Model<\/h3>\n<p>The diagrams above show an arrow to &quot;a rented AI model&quot;. That arrow has three parts. You will hear the three words all through this course.<\/p>\n<p><strong>You → harness → AI provider → AI model.<\/strong> Then the answer comes back the same way.<\/p>\n<p><strong>The short version, with pi.<\/strong><\/p>\n<ul>\n<li><strong>pi is the harness.<\/strong> It is the program you type into. It sends your words to the AI. It lets the AI read your files and run commands.<\/li>\n<li><strong>opencode Go is the AI provider.<\/strong> It is the company that runs the AI on its own computers. It charges you $10 a month <strong>[COST]<\/strong>. pi connects to it with your key.<\/li>\n<li><strong>DeepSeek is the AI model.<\/strong> It is the AI that writes the answers. opencode Go offers many models. DeepSeek is the one this course uses. Kimi K3 is another.<\/li>\n<\/ul>\n<p><strong>The order:<\/strong> you → pi (harness) → opencode Go (AI provider) → DeepSeek (AI model). The answer comes back the same way.<\/p>\n<p><strong>The same pattern for Claude:<\/strong> Claude Code is the harness. Anthropic is the AI provider. Opus 5.5 is the AI model.<\/p>\n<p><strong>And Annie's bot:<\/strong> Hermes is the harness. opencode Go is the AI provider. DeepSeek is the AI model.<\/p>\n<ul>\n<li>That is why one opencode Go plan pays for both pi and the bot.<\/li>\n<li>They are two harnesses using the same provider and the same model.<\/li>\n<\/ul>\n<p>The rest of this section explains each part in more detail.<\/p>\n<p><strong>1. The harness.<\/strong> The harness is the program you use.<\/p>\n<ul>\n<li>It takes your words and sends them to the AI.<\/li>\n<li>It lets the AI do things, such as read your files and run commands.<\/li>\n<li>It decides how the AI works: what it can touch, and what it must ask you first.<\/li>\n<li>Examples: pi and Claude Code are harnesses for building. Hermes is the harness Annie's bots run on.<\/li>\n<\/ul>\n<p><strong>2. The AI provider.<\/strong> The provider is the company that runs the AI on its own computers.<\/p>\n<ul>\n<li>You pay the provider, by subscription or by use.<\/li>\n<li>Your harness connects to the provider with a key or a sign-in. A key is a long password that lets a program use your account.<\/li>\n<li>Examples: opencode Go and Anthropic.<\/li>\n<li>Hong Kong blocks happen here, at the provider (Module 01).<\/li>\n<\/ul>\n<p><strong>3. The AI model.<\/strong> The model is the AI that writes the answers. It is your bot's &quot;brain&quot;.<\/p>\n<ul>\n<li>One provider can offer many models.<\/li>\n<li>Examples: DeepSeek V4.1 Flash and Kimi K3 (both on opencode Go), and Claude Opus 5.5 (on Anthropic).<\/li>\n<\/ul>\n<p><strong>Annie's three setups (checked 10 Oct 2026):<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Harness<\/th>\n<th>Provider<\/th>\n<th>Model<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Her building at the desk<\/td>\n<td>Claude Code<\/td>\n<td>Anthropic, through her Claude subscription<\/td>\n<td>Claude Opus 5.5<\/td>\n<\/tr>\n<tr>\n<td>Her second builder<\/td>\n<td>pi<\/td>\n<td>opencode Go<\/td>\n<td>DeepSeek V4.1 Flash<\/td>\n<\/tr>\n<tr>\n<td>Her three bots<\/td>\n<td>Hermes<\/td>\n<td>opencode Go<\/td>\n<td>DeepSeek V4.1 Flash<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Sources: Annie's pi settings and the bots' settings on her server, both read 10 Oct 2026.<\/p>\n<p><strong>Why the three parts matter:<\/strong><\/p>\n<ul>\n<li><strong>You can change one part and keep the others.<\/strong>\n<ul>\n<li>To give your bot a different &quot;brain&quot;, you change one setting: the model name.<\/li>\n<li>The harness and your files stay the same.<\/li>\n<\/ul>\n<\/li>\n<li><strong>A model name works only with a provider that offers it.<\/strong> Here is what happened:\n<ol>\n<li>Once, Annie moved Claudith to a new provider.<\/li>\n<li>Some settings still named models that only the old provider offered.<\/li>\n<li>Those models stopped working at once. Nothing sent an alert.<\/li>\n<li>A scheduled job that used one of them failed overnight.<\/li>\n<\/ol>\n<\/li>\n<li><strong>The same model can act differently in two harnesses.<\/strong>\n<ul>\n<li>pi (harness) and Annie's bot, which runs on Hermes (harness), both use DeepSeek (AI model).<\/li>\n<li>But they give different answers to the same question.<\/li>\n<li>Module 08B shows this live (&quot;Same model, different program&quot;).<\/li>\n<\/ul>\n<\/li>\n<li><strong>The bill comes from the provider.<\/strong>\n<ul>\n<li>opencode Go (AI provider) costs $10 a month <strong>[COST]<\/strong>.<\/li>\n<li>A Claude subscription from Anthropic (AI provider) pays for Claude Code (harness).<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>One opencode Go plan does two jobs. A Claude plan cannot.<\/strong><\/p>\n<ul>\n<li>With opencode Go (AI provider), one $10 a month plan <strong>[COST]<\/strong> pays for two things:\n<ol>\n<li>your PA bot's AI, through Hermes (harness) on the server<\/li>\n<li>pi (harness) in the terminal on your laptop<\/li>\n<\/ol>\n<\/li>\n<li>Both use the same models, such as DeepSeek (AI model), from the same plan.<\/li>\n<li>A Claude subscription from Anthropic (AI provider) cannot do this. Anthropic's own pages say so in two places (both read 10 Oct 2026):\n<ol>\n<li><strong>Claude Code's legal page:<\/strong> a Claude subscription sign-in is &quot;designed to support ordinary use of Claude Code and other native Anthropic applications&quot;. Other programs &quot;should use API key authentication&quot;. Anthropic does not allow other programs to &quot;route requests through Free, Pro, or Max plan credentials&quot;.<\/li>\n<li><strong>Anthropic's Consumer Terms (effective 8 Oct 2025), Section 3:<\/strong> you may not use the service &quot;through automated or non-human means, whether through a bot, script, or otherwise&quot;, except with an Anthropic API key or with Anthropic's explicit permission.<\/li>\n<\/ol>\n<\/li>\n<li><strong>The reason, in plain words:<\/strong>\n<ul>\n<li>A subscription is priced for one person using Anthropic's own apps.<\/li>\n<li>A bot or another program can send far more requests.<\/li>\n<li>So Anthropic wants those to go through an API key. With a key, you pay for each use, on top of any subscription.<\/li>\n<li>Anthropic's pages do not say this reason in these words. It is the reason the two rules point to.<\/li>\n<\/ul>\n<\/li>\n<li>News reports say Anthropic began blocking subscription sign-ins in other programs on 9 Jan 2026 (WinBuzzer and Gigazine, Feb 2026).<\/li>\n<li>Annie saw the block herself. When she signed pi into her Claude account, every request failed with &quot;Model access is disabled&quot;.<\/li>\n<li>Facilitator: check both Anthropic pages again before teaching, because these rules can change. Anthropic says it may enforce them &quot;without prior notice&quot; (Claude Code legal page).<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-03-s6\"><h2><span class=\"num\">03.6<\/span> The Vault, and One Job Each for Calendar, Vault and Inbox<\/h2><p>A vault is a folder of plain text notes. The notes are written in a simple format called Markdown. Obsidian is a free app that shows the folder as a notebook. You own the files. They are not locked inside any company's app.<\/p>\n<p><strong>Why plain files and not Google Docs?<\/strong> Annie's bot's first memory was a Google Sheet. She replaced it for three reasons:<\/p>\n<ol>\n<li><strong>Speed and cost.<\/strong> A bot reads plain files on its own disk instantly and for free. Every read of a Google Doc is a signed-in request.<\/li>\n<li><strong>Shape.<\/strong> Notes work better as linked pages than as rows in a grid.<\/li>\n<li><strong>Ownership.<\/strong> You own the files, with no company in between.<\/li>\n<\/ol>\n<p>Google still does the jobs it does well: the calendar, email, and file backups.<\/p>\n<p><strong>Give each tool one job.<\/strong> Annie settled this in her first month:<\/p>\n<ul>\n<li><strong>The calendar holds anything with a time.<\/strong> Appointments, deadlines, reminders.<\/li>\n<li><strong>The vault holds anything you want to keep.<\/strong> Notes, plans, rules, records.<\/li>\n<li><strong>An inbox folder holds anything you have not sorted yet.<\/strong> You capture first and file later. In the Full course, a nightly job will do the filing for you.<\/li>\n<\/ul>\n<p><strong>Pick the starting point you actually open every day.<\/strong><\/p>\n<ul>\n<li>Annie set up a task board first. It stayed empty, because she never opened it.<\/li>\n<li>Her calendar became the main list instead, because she already lived in it.<\/li>\n<li>So choose your daily starting point from habit, not from what looks organised.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-03-s7\"><h2><span class=\"num\">03.7<\/span> Build Your Vault<\/h2><p>The facilitator sits beside each student for this.<\/p>\n<p><strong>Step 1. Install Obsidian on your laptop.<\/strong><\/p>\n<ul>\n<li>Go to obsidian.md.<\/li>\n<li>Download the installer for your system, and open it.<\/li>\n<\/ul>\n<p>What success looks like: Obsidian opens and offers to create a vault.<\/p>\n<p><strong>Step 2. Create the vault.<\/strong><\/p>\n<ul>\n<li>Choose &quot;Create new vault&quot;.<\/li>\n<li>Name it with your first name, for example <code>Jane Vault<\/code>.<\/li>\n<li>Put it in your Documents folder.<\/li>\n<li>Do not put it inside iCloud Drive, OneDrive or Google Drive. Those services and Obsidian's own sync can damage each other's files.<\/li>\n<\/ul>\n<p>What success looks like: an empty vault opens, with your vault name at the top of the left panel.<\/p>\n<p><strong>Step 3. Create your top-level folders.<\/strong><\/p>\n<ul>\n<li>Annie's folders follow how she looks things up.<\/li>\n<li>Anything about her son's school is filed under her son, not under &quot;School&quot;.<\/li>\n<li>Use the people and areas of your life.<\/li>\n<\/ul>\n<p>A starting set:<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Folder<\/th>\n<th>What goes in it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>00 Inbox<\/code><\/td>\n<td>Anything not yet sorted<\/td>\n<\/tr>\n<tr>\n<td><code>Me Personal<\/code><\/td>\n<td>Your own plans, health notes, learning<\/td>\n<\/tr>\n<tr>\n<td><code>Me Work<\/code><\/td>\n<td>Your work notes. Check your Data Map before anything confidential goes here<\/td>\n<\/tr>\n<tr>\n<td>One folder per family member<\/td>\n<td>Their school, appointments, records<\/td>\n<\/tr>\n<tr>\n<td><code>Household<\/code><\/td>\n<td>The home, bills, repairs, suppliers<\/td>\n<\/tr>\n<tr>\n<td><code>Builder<\/code><\/td>\n<td>Your builder's instructions, memory and continuity note<\/td>\n<\/tr>\n<tr>\n<td><code>AI System<\/code><\/td>\n<td>Your bot's rulebook, your build logs and your system map<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Right-click in the left panel and choose &quot;New folder&quot; for each one.<\/p>\n<p><strong>Step 4. Start flat.<\/strong> Do not create subfolders yet. Add one only when a folder gets crowded.<\/p>\n<p><strong>Step 5. Create a map note.<\/strong><\/p>\n<ul>\n<li>In the top level of the vault, create a note called <code>Map of This Vault<\/code>.<\/li>\n<li>Write one line per folder saying what lives there.<\/li>\n<li>When a vault feels messy, the usual cause is an out-of-date map, not real chaos.<\/li>\n<\/ul>\n<p><strong>Step 6. Move in your two worksheets.<\/strong><\/p>\n<ul>\n<li>Create notes called <code>Access Sheet<\/code> and <code>Data Map<\/code> inside <code>AI System<\/code>.<\/li>\n<li>Paste your Module 01 and 02 work into them.<\/li>\n<\/ul>\n<p><strong>Step 7. Install Obsidian on your phone.<\/strong><\/p>\n<ul>\n<li>Create the same vault name on the phone, stored on the phone itself.<\/li>\n<li>Do not connect the two yet.<\/li>\n<li>In the Full course, the server module (Module 08B) connects them.<\/li>\n<li>In the Short course, Obsidian's own sync service connects them, if you want your notes on your phone. It is optional. <strong>[COST]<\/strong><\/li>\n<\/ul>\n<p><strong>If it fails:<\/strong><\/p>\n<ul>\n<li>If Obsidian will not install on a company laptop, use your phone today. Install on a personal laptop before the next session.<\/li>\n<li>If you already use Obsidian, create a new vault for this course anyway. You can merge later.<\/li>\n<\/ul>\n<h3>Five Rules That Keep a Vault Safe<\/h3>\n<p>These come from things that broke in Annie's vault. Each one failed without any error message.<\/p>\n<ol>\n<li><strong>Never put a password or key in the vault.<\/strong> It copies to every device and to backups. Use a password manager.<\/li>\n<li><strong>Never use these characters in a file name:<\/strong> <code>: / \\ * ? &quot; &lt; &gt; |<\/code>. A colon in a file name stopped a page from ever reaching Annie's Mac, with no warning.<\/li>\n<li><strong>Choose folder names now, and keep them.<\/strong>\n<ul>\n<li>Scripts will soon refer to these names.<\/li>\n<li>Plain names are easiest to type in a terminal.<\/li>\n<li>If you want emoji in names, add them today, not later.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Moving a file breaks every place that wrote down its address.<\/strong> Before moving or renaming, search for the old name everywhere.<\/li>\n<li><strong>Keep anything a bot must read as a Markdown note.<\/strong> A page saved as <code>.html<\/code> never reached Annie's server, so her bot could not read it.<\/li>\n<\/ol>\n<\/section>\n<div class=\"partbar\">Where Your System Lives<\/div>\n<section class=\"card\" id=\"short-03-s8\"><h2><span class=\"num\">03.8<\/span> Three Questions and the Decision Tree<\/h2><p>Your system has to run on some machine. Choosing it is a decision about your life, not about technology. Answer each question yes or no.<\/p>\n<p><strong>1. Does anything need to run while you are asleep?<\/strong><\/p>\n<ul>\n<li>Morning summaries, the nightly inbox sort, backups and checks all run when you are not there.<\/li>\n<li>If yes, the machine must stay on when you are off.<\/li>\n<li>A laptop that sleeps will not do it.<\/li>\n<\/ul>\n<p><strong>2. Do you need it away from your desk?<\/strong><\/p>\n<ul>\n<li>If you only use it at your desk, the laptop is fine.<\/li>\n<li>If you want it on your phone while out, you need a bot.<\/li>\n<li>The bot is only as available as the machine it runs on.<\/li>\n<\/ul>\n<p><strong>3. What will you actually maintain?<\/strong><\/p>\n<ul>\n<li>Everything you run must be updated, backed up, and noticed when it breaks.<\/li>\n<li>The failure is rarely dramatic.<\/li>\n<li>On Annie's server, a login was once blanked. Nobody noticed for four days.<\/li>\n<\/ul>\n<p><strong>A one-person system should be as small as it can be while still doing the job.<\/strong><\/p>\n<pre><code class=\"language-text\">Do you need anything to run while you sleep?\n├── No  → Do you need it away from your desk?\n│          ├── No  → LAPTOP ONLY. Do not spend money.\n│          └── Yes → LAPTOP PLUS A TELEGRAM BOT.\n│                    The bot answers only while the laptop is awake.\n└── Yes → You need a machine that stays on.\n           ├── A machine at home in Hong Kong, such as a Mac mini:\n           │     it cannot reach Claude without a VPN.\n           │     Fine for companies that serve Hong Kong.\n           └── A RENTED SERVER IN SINGAPORE:\n                 reaches every company this course uses,\n                 and you can reach it from anywhere.\n<\/code><\/pre>\n<p><strong>Annie's own choice, honestly.<\/strong> She rented a server because four reasons combined:<\/p>\n<ol>\n<li>It stays on.<\/li>\n<li>She can reach it from anywhere.<\/li>\n<li>It doubles as her route around the Hong Kong block (Module 01).<\/li>\n<li>It gives her bots one fixed address.<\/li>\n<\/ol>\n<p>For someone at a desk with nothing to run overnight, a laptop is often the whole answer.<\/p>\n<p><strong>A rented server does not make the AI smarter.<\/strong><\/p>\n<ul>\n<li>The AI's thinking happens on the AI company's computers, not on the machine you type into.<\/li>\n<li>A small server and a powerful laptop give the same answers.<\/li>\n<li>Only running a model on your own hardware needs a big machine. This course does not do that.<\/li>\n<\/ul>\n<p><strong>Annie's conclusion:<\/strong><\/p>\n<ul>\n<li>For anything you do at the keyboard, a laptop is fine.<\/li>\n<li>The laptop's real limit is being present, not being powerful.<\/li>\n<li>A job you must remember to start does not count as built.<\/li>\n<li>A weekly job on a laptop that is asleep counts as a fail, not a partial pass.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-03-s9\"><h2><span class=\"num\">03.9<\/span> What the Optional Server Sitting Adds<\/h2><p><em>Short course.<\/em><\/p>\n<p>Your laptop does everything in this course while it is awake. The optional server sitting adds a small rented computer in Singapore that stays on. Three things change:<\/p>\n<ol>\n<li><strong>You get a Telegram bot that answers at any hour,<\/strong> even with the laptop closed.<\/li>\n<li><strong>Jobs can run while you sleep,<\/strong> such as a morning summary or a nightly sort of your inbox.<\/li>\n<li><strong>Your laptop stays as it is.<\/strong>\n<ul>\n<li>The sitting does not make the server a route to Claude.<\/li>\n<li>That needs Tailscale and an exit node, which the Full course teaches.<\/li>\n<li>Claude from your laptop still needs a VPN.<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<p>What the sitting costs you:<\/p>\n<ul>\n<li>a monthly fee <strong>[COST]<\/strong><\/li>\n<li>a payment card<\/li>\n<li>an ID document for the server company<\/li>\n<li>one extra sitting<\/li>\n<\/ul>\n<p>Decide today whether you want it. You can also decide later, once the laptop's limits start to bother you.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-03-s10\"><h2><span class=\"num\">03.10<\/span> Telegram as the Front Door<\/h2><p>You will talk to your bot through Telegram, for three reasons:<\/p>\n<ol>\n<li><strong>Telegram's bot service is free and official.<\/strong>\n<ul>\n<li>You create a bot through Telegram's own @BotFather account, and receive a token.<\/li>\n<li>There is no fee and no grey area.<\/li>\n<\/ul>\n<\/li>\n<li><strong>It works in Hong Kong with no extra steps.<\/strong><\/li>\n<li><strong>Photos arrive ready to use.<\/strong>\n<ul>\n<li>Telegram rotates and resizes photos before the bot receives them.<\/li>\n<li>Send pictures as normal photos, never as files.<\/li>\n<li>That one habit made Annie's storage catalogue work with no extra software.<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<p><strong>The chat app does not decide what the bot can do.<\/strong><\/p>\n<ul>\n<li>Annie once asked whether WhatsApp or Telegram is the more powerful choice.<\/li>\n<li>Her builder checked: both connect to the same model, tools and memory.<\/li>\n<li>The program behind the chat app decides what the bot can do.<\/li>\n<\/ul>\n<p><strong>Why not WhatsApp?<\/strong><\/p>\n<ul>\n<li>Annie once built a WhatsApp connection. She removed it the same month.<\/li>\n<li>It used an unofficial program tied to her personal phone number.<\/li>\n<li>That breaks WhatsApp's terms, and it risked a ban on her number.<\/li>\n<li>Her bot now drafts a message, and she pastes it herself.<\/li>\n<\/ul>\n<p><strong>Know what Telegram can see.<\/strong><\/p>\n<ul>\n<li>Chats with a bot are not end-to-end encrypted.<\/li>\n<li>Whoever runs the bot receives every message (Module 02).<\/li>\n<li>Your Data Map decides what you send.<\/li>\n<\/ul>\n<p><strong>Check now:<\/strong> Telegram is installed, and two-factor sign-in is on (Settings, Privacy and Security, Two-Step Verification).<\/p>\n<\/section>\n<section class=\"card\" id=\"short-03-s11\"><h2><span class=\"num\">03.11<\/span> Your Shape Decision, and What Your System Does at 11pm on a Bad Day<\/h2><p>Fill in the worksheet below. Then answer one last question, in one sentence:<\/p>\n<blockquote>\n<p><strong>What will your system do for you at 11pm on a bad day?<\/strong><\/p>\n<\/blockquote>\n<p>If the answer is &quot;nothing&quot;, the design does not fit you yet, however good it looks.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-03-s12\"><h2><span class=\"num\">03.12<\/span> Lessons From Real Mistakes<\/h2><p>Each line below is one lesson from a real mistake in Annie's own system. The full story behind each one is on the FAQ tab, the last tab at the top of the page.<\/p>\n<ul>\n<li>Choose one home for your notes, move everything in, and check before you delete.<\/li>\n<li>One real copy that every device reads is better than several copies kept in step.<\/li>\n<li>A move is finished only when every script and bot that refers to the old address has been updated.<\/li>\n<li>After any rename, search every script for the old name. Then run each affected job once by hand.<\/li>\n<li>Build around the place you already look every day.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-03-s13\"><h2><span class=\"num\">03.13<\/span> Exercise<\/h2><ol>\n<li>List every place your notes, tasks and AI instructions live today. For each one, write one word:\n<ul>\n<li><strong>move<\/strong> (into the vault),<\/li>\n<li><strong>keep<\/strong> (it does a different job, such as the calendar), or<\/li>\n<li><strong>close<\/strong> (stop using it).<\/li>\n<\/ul>\n<\/li>\n<li>Which one place will you open first every morning?<\/li>\n<li>In a normal week, how many hours are you away from your laptop? Those are the hours your system cannot run on the laptop.<\/li>\n<li><strong>Homework:<\/strong> sketch your system on one page, with boxes and arrows. Use the parts table below.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"short-03-s14\"><h2><span class=\"num\">03.14<\/span> Worksheet: System Sketch and Shape Decision<\/h2><p><strong>My System Sketch<\/strong> (homework). Leave a part blank if you have not decided yet.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Part<\/th>\n<th>My version<\/th>\n<th>Where it will live<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Builder<\/td>\n<td>Claude Code / pi<\/td>\n<td>Laptop. Full course: also my server<\/td>\n<\/tr>\n<tr>\n<td>Bot<\/td>\n<td><\/td>\n<td>Full course: my server. Short course: none in the 10 hours; my server, if I take the optional sitting<\/td>\n<\/tr>\n<tr>\n<td>Vault<\/td>\n<td><\/td>\n<td>Laptop and phone. Full course: also my server<\/td>\n<\/tr>\n<tr>\n<td>Server<\/td>\n<td><\/td>\n<td>Full course, or the optional server sitting<\/td>\n<\/tr>\n<tr>\n<td>First scheduled job<\/td>\n<td><\/td>\n<td>Decided in Module 05, where you map your processes on paper<\/td>\n<\/tr>\n<tr>\n<td>Watchdog<\/td>\n<td><\/td>\n<td>The module on what breaks (Module 10)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>My daily starting point:<\/strong> ____________<\/p>\n<p><strong>My Shape Decision:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Question<\/th>\n<th>My answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Where my system runs<\/td>\n<td>Laptop / laptop plus server<\/td>\n<\/tr>\n<tr>\n<td>Joining the optional server sitting? (Short course)<\/td>\n<td>Yes / No / Later<\/td>\n<\/tr>\n<tr>\n<td>Server company, location and size (Full course)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Whole-server backup turned on? (Full course)<\/td>\n<td>Yes / No<\/td>\n<\/tr>\n<tr>\n<td>Date ordered, or the date I will order (Full course)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Server IP address saved in my password manager? (Full course)<\/td>\n<td>Yes / No<\/td>\n<\/tr>\n<tr>\n<td>Telegram installed, with two-factor sign-in on?<\/td>\n<td>Yes / No<\/td>\n<\/tr>\n<tr>\n<td>My phone (Android or iPhone)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My laptop (Mac or Windows)<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>", "count": 14, "sess": [1]}, {"id": "short-04", "label": "04", "title": "Module 04: The Demo", "minutes": 25, "read": 6, "toc": [["short-04-s1", "04.1", "What You Will Leave With"], ["short-04-s2", "04.2", "What You Need to Prepare"], ["short-04-s3", "04.3", "The Rule for the Whole Module"], ["short-04-s4", "04.4", "What This System Is For"], ["short-04-s5", "04.5", "A Photo Becomes a Record"], ["short-04-s6", "04.6", "When the Bot Was Wrong"], ["short-04-s7", "04.7", "What It Costs"], ["short-04-s8", "04.8", "Exercise: Your Wish List"], ["short-04-s9", "04.9", "How to Close the Module"], ["short-04-s10", "04.10", "What Not to Do"]], "body": "<section class=\"card\" id=\"short-04-s1\"><h2><span class=\"num\">04.1<\/span> What You Will Leave With<\/h2><p><strong>Your Wish List.<\/strong><\/p>\n<ul>\n<li>Three to five jobs you want your system to take over.<\/li>\n<li>Each one is scored by how much remembering it removes.<\/li>\n<li>Circle your top two. They go into the next module, where you map them on paper.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-04-s2\"><h2><span class=\"num\">04.2<\/span> What You Need to Prepare<\/h2><ul>\n<li><strong>Modules 01 to 03 finished.<\/strong> Bring your Data Map from Module 02.<\/li>\n<li><strong>A pen and the worksheet.<\/strong> This module is mostly watching, then one short exercise.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-04-s3\"><h2><span class=\"num\">04.3<\/span> The Rule for the Whole Module<\/h2><p><strong>Never show a capability without showing what it costs.<\/strong><\/p>\n<ul>\n<li>Every demo below comes with a failure, a bill or a trade-off.<\/li>\n<li>A demo that shows only wins makes the room feel behind.<\/li>\n<li>It also makes the facilitator hard to trust the first time a student's own build fails.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-04-s4\"><h2><span class=\"num\">04.4<\/span> What This System Is For<\/h2><p>Most AI marketing promises that you will do ten times more. Annie's system is built for a different reason.<\/p>\n<p>Her line: the real gift is clearing what drains you, so you can be present with the people in front of you, including yourself.<\/p>\n<p>It works in two directions:<\/p>\n<ul>\n<li><strong>Take things away.<\/strong> Admin, reminders, chasing, filing. Anything you hold in your head today because nothing else will.<\/li>\n<li><strong>Add depth.<\/strong> Research and learning on the things that matter to you.<\/li>\n<\/ul>\n<p>Annie judges every build by one rule: if a job only works when you remember to start it, it is not finished. Every demo below runs without her starting it.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-04-s5\"><h2><span class=\"num\">04.5<\/span> A Photo Becomes a Record<\/h2><p><strong>What it is.<\/strong> A photo catalogue of the family's storage units. A bot built it, and you can read it on a phone.<\/p>\n<p><strong>What the screenshots show.<\/strong><\/p>\n<ol>\n<li><strong><code>Storage Bot Logging Item (edited)<\/code>.<\/strong>\n<ul>\n<li>Annie sends a photo of a cap, with a short caption naming the unit.<\/li>\n<li>The bot replies &quot;Got it&quot;.<\/li>\n<li>It logs the item to Unsorted, and says it did not catch the unit.<\/li>\n<li>A minute later, it moves the item to the right unit as number 325.<\/li>\n<li>It asks her to reply if that is wrong.<\/li>\n<\/ul>\n<\/li>\n<li><strong><code>Storage Bot Finding Item (edited)<\/code>.<\/strong>\n<ul>\n<li>Annie asks where a playmat is.<\/li>\n<li>The bot answers with the item number.<\/li>\n<li>It says the playmat was lent to a friend, and quotes the note about a missing part.<\/li>\n<li>It also lists two near-matches, in case she meant one of those.<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<p><strong>The line to say.<\/strong> &quot;When it was unsure where the cap went, it said so and put it somewhere safe. It did not guess.&quot;<\/p>\n<p><strong>What else to point out.<\/strong><\/p>\n<ul>\n<li>The count of items comes from code, not from the AI.<\/li>\n<li>AI models are bad at counting.<\/li>\n<li>So Annie's rule is: code does the arithmetic, and the model only reads the result.<\/li>\n<\/ul>\n<p><strong>The cost of this one.<\/strong><\/p>\n<ol>\n<li>Annie's first answer from Claude was &quot;don't build it&quot;. Describing photos seemed to need a paid AI service.<\/li>\n<li>She removed that assumption in six words: &quot;I actually don't mind typing descriptions.&quot;<\/li>\n<li>It then turned out the bot already described photos, for about $0.001 each.<\/li>\n<\/ol>\n<p>The lesson: say out loud the one assumption your advice depends on. Then the other person can overturn it.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-04-s6\"><h2><span class=\"num\">04.6<\/span> When the Bot Was Wrong<\/h2><p><strong>What happened.<\/strong><\/p>\n<ol>\n<li>Annie photographed a hard drive's warranty card and said &quot;save this&quot;.<\/li>\n<li>The bot filed it as a searchable page. It explained which folder it chose and why (<code>warranty-01<\/code>).<\/li>\n<li>Then it stated, confidently, that the warranty did not cover data recovery. That was wrong.<\/li>\n<\/ol>\n<p><strong>How it was corrected<\/strong> (<code>warranty-02<\/code>):<\/p>\n<ol>\n<li>Annie corrected it in one sentence.<\/li>\n<li>The bot checked the manufacturer's own data sheet. It quoted the line that includes data recovery.<\/li>\n<li>It replied &quot;You're right and I was wrong&quot;.<\/li>\n<li>It fixed the page, and put the source in it.<\/li>\n<li>It explained the two ways to claim. It named what was still missing: the receipt.<\/li>\n<\/ol>\n<p><strong>Later<\/strong> (<code>warranty-03<\/code>):<\/p>\n<ul>\n<li>Annie asked it to move the files into a subfolder.<\/li>\n<li>It did.<\/li>\n<li>It also found and fixed a link elsewhere in the vault that the move would have broken.<\/li>\n<\/ul>\n<p><strong>The line to say.<\/strong> &quot;The lesson is not that the bot is clever. I stayed in charge, and correcting it took one sentence.&quot;<\/p>\n<\/section>\n<section class=\"card\" id=\"short-04-s7\"><h2><span class=\"num\">04.7<\/span> What It Costs<\/h2><p><strong>Show one slide with three numbers.<\/strong> No screenshot is needed, so nothing private can appear.<\/p>\n<ol>\n<li><strong>The monthly figure.<\/strong> What Annie's whole system costs per month. <strong>[COST]<\/strong>, with its date.<\/li>\n<li><strong>The cap.<\/strong>\n<ul>\n<li>Annie had set a $20 monthly spending cap on one AI account.<\/li>\n<li>The cap was reached, and the account paused.<\/li>\n<li>The cap did exactly its job.<\/li>\n<\/ul>\n<\/li>\n<li><strong>What filled it.<\/strong>\n<ul>\n<li>One chat conversation ran for three days.<\/li>\n<li>It used 19.06 million tokens, costing $8.36.<\/li>\n<li>Tokens are the small pieces of text that AI companies count and charge for.<\/li>\n<\/ul>\n<\/li>\n<\/ol>\n<p><strong>The line to say.<\/strong> &quot;I know what this costs to the cent. If you build this and do not know that, you will get a surprise you will not enjoy.&quot;<\/p>\n<\/section>\n<section class=\"card\" id=\"short-04-s8\"><h2><span class=\"num\">04.8<\/span> Exercise: Your Wish List<\/h2><ol>\n<li>Write down three to five jobs you would hand over today if you could.<\/li>\n<li>For each one, write what you have to remember today to get it done.<\/li>\n<li>Score how much remembering it removes, from 1 to 5. A job you think about every day scores higher than a monthly one.<\/li>\n<li>Mark the harm if it goes wrong.<\/li>\n<li>Circle your top two.<\/li>\n<\/ol>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Job<\/th>\n<th>What I have to remember today<\/th>\n<th>Remembering removed (1 to 5)<\/th>\n<th>Harm if it goes wrong (low, medium, high)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>My top two (these go to the next module):<\/strong><\/p>\n<ol>\n<li>\n<hr />\n<\/li>\n<li>\n<hr />\n<\/li>\n<\/ol>\n<p><strong>Check against your Data Map.<\/strong> Some jobs need Tier 3 data, such as passwords, ID numbers or bank details. Cross those jobs off. Or redesign them, so that data never enters the system.<\/p>\n<\/section>\n<section class=\"card\" i
