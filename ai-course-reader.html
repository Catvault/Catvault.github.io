hese jobs as &quot;no-agent (script stdout delivered directly)&quot;. This gives the script three rules:<\/p>\n<ol>\n<li><strong>Print the message when there is something to say.<\/strong><\/li>\n<li><strong>Print nothing when there is nothing to say.<\/strong> Silence is the right answer most days.<\/li>\n<li><strong>Print the failure when something breaks.<\/strong> A job that fails quietly is worse than no job (Module 10).<\/li>\n<\/ol>\n<p><strong>Check your brief now.<\/strong> Which of your steps print the message? What would the script print if a step failed?<\/p>\n<\/section>\n<section class=\"card\" id=\"full-11-s5\"><h2><span class=\"num\">11.5<\/span> Build the Scheduled Job<\/h2><p><em>40 minutes, Full course only.<\/em><\/p>\n<h3>Step 1. Write the Script and Test It Without Sending Anything (20 minutes)<\/h3>\n<p>Log in to your server with <code>ssh myserver<\/code>. Start Claude Code in your vault folder, as in Module 08B. Paste:<\/p>\n<pre><code class=\"language-text\">Read Build Brief 1 in my AI System folder. Ask me every question you have before you start.\nThen write a script in ~/.hermes/scripts/ that does the scripted steps.\nRules:\n- Print the message only when there is something to say. Print nothing otherwise.\n- If anything fails, print one line starting with a warning sign, saying what failed. Never fail silently.\n- Add a --dry-run option. It prints what it would send, sends nothing, and changes no saved file.\n- Back up any file before you edit it.\n- Follow the &quot;Must never do&quot; and &quot;Needs my approval before&quot; rows in my brief.\nShow me the script before you save it. Then run it with --dry-run and show me the output.\n<\/code><\/pre>\n<p><strong>The umbrella version, if you have no brief:<\/strong> ask for a script that gets today's hourly rain forecast for Hong Kong from Open-Meteo. If any hour is likely to rain, it prints &quot;Umbrella today&quot; with the wettest hours. On a dry day it prints nothing.<\/p>\n<p><strong>It passed if<\/strong> <code>--dry-run<\/code> prints the message you expect, and a second dry run shows that no file changed.<\/p>\n<p><strong>If it fails:<\/strong> read the line it printed. Most first failures are a missing library, a wrong file path or the wrong time zone. Ask the builder to explain the error in plain words before it fixes anything.<\/p>\n<p><strong>If your brief needs an email or calendar login,<\/strong> switch to the umbrella version today. Build your real job as homework. A login takes longer than the class has.<\/p>\n<h3>Step 2. Send One Labelled Test (5 minutes)<\/h3>\n<p>Ask the builder to send you one real message, with &quot;🧪 TEST&quot; at the start.<\/p>\n<p><strong>Why:<\/strong> this is Annie's habit. She sends herself one test labelled &quot;🧪 TEST&quot; and only lets the job go live after she approves it. The label stops you mistaking a test for the real thing.<\/p>\n<p><strong>It passed if<\/strong> the message arrives on your phone, and it reads the way you want.<\/p>\n<h3>Step 3. Put It on the Schedule and Run It Once (15 minutes)<\/h3>\n<p><strong>Ask the builder to create the job.<\/strong> The exact options change between Hermes versions, so the builder reads the help first:<\/p>\n<pre><code class=\"language-text\">Run &quot;hermes cron create --help&quot; and read it. Then create a no-agent job that runs my script at [time] every [day], and delivers to my Telegram. Show me the command before running it.\n<\/code><\/pre>\n<p><strong>Choose a time when you want messages.<\/strong> Annie groups her scheduled messages into set times: a morning burst and a 6 pm admin slot. A new message must fit one of them, or it needs her yes.<\/p>\n<p><strong>Your builder may refuse to create the job.<\/strong> Once, Claude Code's own safety check stopped it from installing a permanent job on Annie's server. She typed the final command herself. This is correct: the owner approves anything permanent. If it happens to you, read the command. If you agree with it, run it yourself.<\/p>\n<p><strong>Then run it once through the scheduler.<\/strong> A job that works when you run it by hand can still fail on the schedule.<\/p>\n<pre><code class=\"language-bash\">hermes cron list\nhermes cron run &lt;job-id&gt;\n<\/code><\/pre>\n<p><code>hermes cron run<\/code> runs the job at the scheduler's next check, so the message can take up to a minute.<\/p>\n<p><strong>It passed if<\/strong> the job is in the list with the right time, and the message arrives on your phone.<\/p>\n<p><strong>If your job checks for things it already sent, run it a second time.<\/strong> The second run should send nothing.<\/p>\n<p><strong>Keep every job in the one scheduler.<\/strong> Annie once found a job installed outside Hermes, in the server's own scheduler. It ran every night and reported success, but it had done nothing for about four weeks. It did not show in <code>hermes cron list<\/code>, which is why nobody saw it.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-11-s6\"><h2><span class=\"num\">11.6<\/span> Build and Test One Skill<\/h2><p><em>Full course: 20 minutes. Short course: 25 minutes.<\/em><\/p>\n<p><strong>A skill is a written procedure that the AI assistant reads only when it is needed.<\/strong><\/p>\n<p><strong>Why skills exist.<\/strong> The AI assistant's built-in memory is small. Annie's bot has 2,200 characters, and it reads all of them with every message. A six-step procedure saved there filled it, and left no room for facts. So the rule is: <strong>facts in memory, procedures in skills.<\/strong> The Full course met this rule in Module 07.<\/p>\n<h3>What a Skill Is<\/h3>\n<p>A skill is a folder. Inside it is one file, named exactly <code>SKILL.md<\/code>. The file starts with a short description, then the steps.<\/p>\n<p><strong>Three facts decide whether a skill works:<\/strong><\/p>\n<ol>\n<li><strong>The AI assistant reads only the name and description at the start.<\/strong> It reads the steps only when your request matches the description.<\/li>\n<li><strong>So the description must say when to use the skill, in the words you would type.<\/strong> A phrase that is not in the description will not start the skill. The limit is 1,024 characters. Annie's continuity and build-log skills use 914 and 1,004.<\/li>\n<li><strong>The file name must be exactly <code>SKILL.md<\/code>.<\/strong> Once, one of Annie's skill folders held a backup copy named <code>SKILL.md.bak-20260929-170928<\/code>. The AI assistant could not see it, because the name was different.<\/li>\n<\/ol>\n<p><strong>A skill is used reliably once the rules file points to it.<\/strong> On Annie's bot, a skill starting by itself has never been enough. Her client-document skill was used reliably once her rules file pointed to it, so she did the same for her Storage Inventory skill. So the last step is to add one line to your rules file.<\/p>\n<h3>What Your Skill Does<\/h3>\n<ul>\n<li><strong>Full course:<\/strong> it runs the scheduled job's script when you ask, and sends you the result. So you can ask &quot;do I need an umbrella?&quot; at any time, not only at 7 am.<\/li>\n<li><strong>Short course:<\/strong> it does the job from your Build Brief when you ask for it.<\/li>\n<\/ul>\n<h3>Where the Skill Goes<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Course<\/th>\n<th>Folder<\/th>\n<th>How to check it loaded<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Full<\/td>\n<td><code>~/.hermes/skills/&lt;skill-name&gt;/SKILL.md<\/code> on the server<\/td>\n<td><code>hermes skills list<\/code> shows it. Then type <code>/new<\/code> in Telegram, because an open chat keeps the instructions it started with<\/td>\n<\/tr>\n<tr>\n<td>Short<\/td>\n<td><code>~/.agents/skills/&lt;skill-name&gt;/SKILL.md<\/code> on the laptop<\/td>\n<td>Start a new pi session. pi read skills from this folder on Annie's Mac (checked 10 Oct 2026)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Build It<\/h3>\n<p>Paste this to your builder (Claude Code in the Full course, pi in the Short course):<\/p>\n<pre><code class=\"language-text\">Make a skill for [the job from my Build Brief / my scheduled job's script].\nPut it in [the folder from the table], in a folder named [skill-name], with one file named exactly SKILL.md.\nWrite the description as a list of the phrases I would actually type to ask for it, such as &quot;do I need an umbrella&quot;.\nFollow the &quot;Must never do&quot; and &quot;Needs my approval before&quot; rows in my brief.\nThen add one line to my rules file that names the skill and says when to use it.\nShow me the SKILL.md before you save it.\n<\/code><\/pre>\n<h3>Test It Three Ways<\/h3>\n<ol>\n<li><strong>Ask in the words from the description.<\/strong> The AI assistant should use the skill.<\/li>\n<li><strong>Ask in different words you would also use.<\/strong> If it does not use the skill, add those words to the description and test again.<\/li>\n<li><strong>Ask something unrelated.<\/strong> The AI assistant should not use the skill.<\/li>\n<\/ol>\n<p><strong>It passed if<\/strong> all three tests give the right result, and your three acceptance checks from the brief pass.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-11-s7\"><h2><span class=\"num\">11.7<\/span> Shown, Not Built: A Model on a Schedule<\/h2><p><em>5 minutes, Full course only.<\/em><\/p>\n<p><strong>In class, no scheduled job calls an AI model.<\/strong> The jobs you build today are fixed steps only.<\/p>\n<p><strong>Why:<\/strong> a job that runs at 3 am with nobody watching should do the same thing every time. A model can give a different answer each time, and it can report success when it failed. That happened with Annie's first bot. Since her rebuild, her scheduled jobs are scripts first. A job does not hand its judgement work to her top model.<\/p>\n<p><strong>How Annie's system does it now, for when you are ready:<\/strong><\/p>\n<ul>\n<li><strong>Only one of her scheduled jobs hands the whole job to a model.<\/strong> Some of her scripts also ask a model for one step. On that one job, the model and the provider are fixed on the job itself, so a change to the default cannot move it without her knowing.<\/li>\n<li><strong>Phoebe, her weekly idea job, calls Claude from a script.<\/strong> The script uses <code>claude -p<\/code> on her subscription. Once, a script on her server picked up an API key from its surroundings, and it billed the paid API by mistake. If you ever build this, make sure the script cannot see any API key.<\/li>\n<\/ul>\n<p><strong>This course does not teach <code>claude -p<\/code> as a step.<\/strong> We have no checked source on whether a subscription allows scheduled use.<\/p>\n<p><strong>When to try it:<\/strong> week 4 of your 30-day plan (Module 12). Write the test questions first, then build it.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-11-s8\"><h2><span class=\"num\">11.8<\/span> Set the Keep-or-Kill Date<\/h2><p><em>5 minutes, Full course only. The Short course set its date in &quot;Finish the Build Brief&quot;.<\/em><\/p>\n<p><strong>Put a review date two weeks from today in your calendar.<\/strong> On that date, ask one question: did I actually use it?<\/p>\n<p>If not, pause it without guilt. Keep the script for later. Annie set this test for her morning brief when it went live.<\/p>\n<p>Then ask your builder to write today's build log, with its index row. It records the brief, the script, the job, the skill, the test results and the keep-or-kill date.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-11-s9\"><h2><span class=\"num\">11.9<\/span> Lessons From Real Mistakes<\/h2><p>Each line below is one lesson from a real mistake in Annie's own system. The full story behind each one is on the FAQ tab, the last tab at the top of the page.<\/p>\n<ul>\n<li>A message that arrives twice may not come from a second job. Check what the bot does when you reply.<\/li>\n<li>When a fix does not show up, find which file the job actually reads.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-11-s10\"><h2><span class=\"num\">11.10<\/span> Worksheet: Growing It<\/h2><div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Proof<\/th>\n<th>Course<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Five new brief rows written<\/td>\n<td>My brief<\/td>\n<td>Short<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Keep-or-kill date in my calendar<\/td>\n<td>My calendar<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>One tool I decided not to add, with my reason<\/td>\n<td>My run card<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Script prints the message, prints nothing when quiet, prints failures<\/td>\n<td><code>--dry-run<\/code> output<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>--dry-run<\/code> changed no file<\/td>\n<td>A second dry run<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>One &quot;🧪 TEST&quot; message arrived and I approved it<\/td>\n<td>My phone<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Job is on the schedule at the right time<\/td>\n<td><code>hermes cron list<\/code><\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Job ran once through the scheduler<\/td>\n<td>The message on my phone<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Skill folder holds one file named exactly <code>SKILL.md<\/code><\/td>\n<td>The folder listing<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Skill passed all three tests<\/td>\n<td>My notes<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Rules file points to the skill<\/td>\n<td>The line in my rules file<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>One-sentence answer to the server question<\/td>\n<td>My run card<\/td>\n<td>Short<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Today's build log written, with its index row<\/td>\n<td>The log and the index<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>", "count": 10, "sess": [4]}, {"id": "full-11h", "label": "11 Handout", "title": "Handout: More Ways to Grow Your System", "minutes": null, "read": 3, "toc": [["full-11h-s1", "11H.1", "Formatting Messages for the Phone"], ["full-11h-s2", "11H.2", "Reading the Web, With a Cap"], ["full-11h-s3", "11H.3", "Pausing and Restarting a Job"], ["full-11h-s4", "11H.4", "Two Ways to Use a Model on a Schedule"]], "body": "<div class=\"intro\"><p><em>A handout for Module 11, both courses. Read it at home, after your first job or skill has run for a week. Each section comes from Annie's own system. Use one at a time.<\/em><\/p>\n<\/div>\n<section class=\"card\" id=\"full-11h-s1\"><h2><span class=\"num\">11H.1<\/span> Formatting Messages for the Phone<\/h2><p><strong>A correct message is not always a usable one.<\/strong> Annie's weather job worked out the weather correctly. She still said: &quot;in terms of how I want to read it, it's not quite right.&quot; The one line she could act on was hidden under a loud warning sign.<\/p>\n<p><strong>Five of the seven rules in Annie's message format:<\/strong><\/p>\n<ol>\n<li>A bold first line that says what this is and when.<\/li>\n<li>A one-line summary under it.<\/li>\n<li>Short &quot;Label: value&quot; lines, with a blank line between items.<\/li>\n<li>Warning signs only where you need to act.<\/li>\n<li>Turn the unimportant items into a count. Send nothing when nothing matters.<\/li>\n<\/ol>\n<p><strong>Telegram shows only some formatting.<\/strong> Bold, italics, code and links work. Headings and quote blocks show as stray characters. Tables turn into bullet lists.<\/p>\n<p><strong>Read the real message on your real phone.<\/strong> Annie's weather job took 18 changes in 6 days. Each round of changes came from her reading the real message on her real phone.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-11h-s2\"><h2><span class=\"num\">11H.2<\/span> Reading the Web, With a Cap<\/h2><p>Many useful jobs read web pages. Annie's bots use Firecrawl. It turns a web page into clean text, and it can search. Its free plan gives 1,000 credits a month. A search costs about 2 credits.<\/p>\n<p><strong>Cap the job, not only the account.<\/strong> The first run of Annie's company-watch job had no limit on how many searches the AI could make. It used 92 credits and never finished. Limited to 14 calls, it finished in 12 and used 21 credits.<\/p>\n<p><strong>Her rule for Firecrawl:<\/strong> warn before the limit, and never top up automatically.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-11h-s3\"><h2><span class=\"num\">11H.3<\/span> Pausing and Restarting a Job<\/h2><p>Pausing keeps the job but stops it from running. Use it on your keep-or-kill date if you are not sure yet.<\/p>\n<pre><code class=\"language-bash\">hermes cron pause &lt;job-id&gt;\nhermes cron resume &lt;job-id&gt;\n<\/code><\/pre>\n<p>Annie once paused a working bill reminder on the day she built it. It only told her to go and check an app, so it removed no work.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-11h-s4\"><h2><span class=\"num\">11H.4<\/span> Two Ways to Use a Model on a Schedule<\/h2><p>Try these only after week 4 of your 30-day plan (Module 12), with your test questions written first.<\/p>\n<p><strong>1. A model job with its model fixed.<\/strong> The scheduler hands a request to the bot's model. Fix the model and the provider on the job itself. Then a change to the default model cannot move the job without you knowing. Annie's scheduler refuses to run a job that has no fixed model if the default changed after the job was made. Her command:<\/p>\n<pre><code class=\"language-bash\">hermes cron edit &lt;job-id&gt; --model deepseek-v4.1-flash --provider opencode-go --pin\n<\/code><\/pre>\n<p><strong>2. The model writes, a script sends.<\/strong> Annie once wanted her morning summary as several short messages. A scheduled model job could only send one reply, and the cheap model added its working notes to it. The fix used two jobs. The model job writes only the clean message to a file, and sends nothing. Five minutes later, a script job splits the file and sends each part as its own message.<\/p>\n<\/section>", "count": 4, "sess": [4]}, {"id": "full-12", "label": "12", "title": "Module 12: The Close, Your 30-Day Plan", "minutes": 40, "read": 8, "toc": [["full-12-s1", "12.1", "What You Will Leave With"], ["full-12-s2", "12.2", "The Promise, Checked"], ["full-12-s3", "12.3", "The Closing Question"], ["full-12-s4", "12.4", "Owner Drill 1: An Alert, Without the Builder"], ["full-12-s5", "12.5", "Your 30-Day Plan"], ["full-12-s6", "12.6", "Owner Drill 2: A Delete That Sticks"], ["full-12-s7", "12.7", "When It Breaks, and Where to Get Help"], ["full-12-s8", "12.8", "Worksheet: The Close"]], "body": "<div class=\"intro\"><p><strong>Why this module comes last.<\/strong><\/p>\n<ol>\n<li>Students now own a system that does one real job (Modules 08 and 11).<\/li>\n<li>It has checks that tell them when it breaks (Module 10).<\/li>\n<li>So the last job is to check it against the course promise, and to plan the next four weeks.<\/li>\n<li>The course ends on the student's next action, not on a summary.<\/li>\n<\/ol>\n<\/div>\n<section class=\"card\" id=\"full-12-s1\"><h2><span class=\"num\">12.1<\/span> What You Will Leave With<\/h2><p><strong>Both courses:<\/strong><\/p>\n<ul>\n<li>Your system, checked against the course promise. Any row you cannot tick is written on your run card as work to do.<\/li>\n<li>A 30-day plan, one row for each week, with a stop condition for each week.<\/li>\n<li>The four steps to take when something breaks.<\/li>\n<li>The name of the group chat where you get help for four weeks, and the date of the class call.<\/li>\n<\/ul>\n<p><strong>Full course only:<\/strong><\/p>\n<ul>\n<li>Proof that you can run your system alone: you did one alert's action and one delete that sticks, with no builder.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"full-12-s2\"><h2><span class=\"num\">12.2<\/span> The Promise, Checked<\/h2><p><em>5 minutes, both courses.<\/em><\/p>\n<p>At the start, the course promised you a system you can check. Check it now, against what is in front of you.<\/p>\n<p><strong>Full course.<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>The claim<\/th>\n<th>The check<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>One AI assistant you can reach from your phone<\/td>\n<td>Send your bot a message on Telegram, and read the answer<\/td>\n<\/tr>\n<tr>\n<td>One real job that runs without you<\/td>\n<td>Run <code>hermes cron list<\/code> and find your scheduled job from Module 11<\/td>\n<\/tr>\n<tr>\n<td>Three rules you wrote<\/td>\n<td>Name them, and say how each one is checked<\/td>\n<\/tr>\n<tr>\n<td>It tells you when it breaks<\/td>\n<td>Run your watchdog with <code>--status<\/code>. All three checks are green<\/td>\n<\/tr>\n<tr>\n<td>You know what it costs<\/td>\n<td>Read the monthly figure off your run card<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>A row you cannot tick is work to do. It is not a failure.<\/strong> Write the row on your run card. Bring it to the group chat or the class call.<\/p>\n<p><strong>Why the Full course checks the watchdog, not a refusal.<\/strong> The Full course built checks that run by themselves (Module 10). A refusal tests a different thing: the rule about saying when the AI assistant does not know.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-12-s3\"><h2><span class=\"num\">12.3<\/span> The Closing Question<\/h2><p><em>5 minutes, Full course. Short course: homework, written on the run card.<\/em><\/p>\n<p><strong>&quot;What have I built, and what does it take off my mind?&quot;<\/strong><\/p>\n<p><strong>Answer it in one sentence.<\/strong> You can say it to the room, or write it down. If you can describe your system in one sentence, you know what it is for. Keep the sentence somewhere you will see it.<\/p>\n<p><strong>Annie's own sentence, for an example.<\/strong> She once wrote what the whole effort is for: clearing what drains her, so she can be present with the people in front of her, including herself.<\/p>\n<p><strong>The second question, written, not spoken.<\/strong> What would &quot;too much looking after&quot; be for you? For example: more than 30 minutes a week of fixing. Write your limit now. If you reach it later, you switch something off. You do not keep adding.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-12-s4\"><h2><span class=\"num\">12.4<\/span> Owner Drill 1: An Alert, Without the Builder<\/h2><p><em>5 minutes, Full course only.<\/em><\/p>\n<p><strong>Why this drill exists.<\/strong> After today, nobody sits beside you. Your watchdog will one day send you an alert. You must be able to do its one action yourself, even if your builder is not working.<\/p>\n<p><strong>What the facilitator gives you.<\/strong> A printed alert, in the same format as your own watchdog's messages:<\/p>\n<pre><code class=\"language-text\">⚠️ Backup is 31 hours old (limit 26).\nDo this: run the backup script now, then run the watchdog with --status.\n<\/code><\/pre>\n<p><strong>What you do. Do not open Claude Code or pi.<\/strong><\/p>\n<ol>\n<li>Log in to your server: <code>ssh myserver<\/code>.<\/li>\n<li>Find your backup script: <code>ls ~/.hermes/scripts/<\/code>. Your run card should also have its name.<\/li>\n<li>Run it: <code>python3 ~/.hermes/scripts/&lt;your backup script&gt;<\/code>.<\/li>\n<li>Run your watchdog: <code>python3 ~/.hermes/scripts/watchdog.py --status<\/code>.<\/li>\n<\/ol>\n<p><strong>It passed if<\/strong> the backup check is green, and you did not ask a builder.<\/p>\n<p><strong>If you got stuck,<\/strong> write down the step where you stopped. Add the missing command to your run card now. That is the point of the drill: the run card must hold what you need.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-12-s5\"><h2><span class=\"num\">12.5<\/span> Your 30-Day Plan<\/h2><p><em>Full course: 10 minutes. Short course: 5 minutes.<\/em><\/p>\n<p><strong>Add one tested thing at a time. Then live with it for a few days before you add the next.<\/strong> This is the rule from Module 11, and it applies after the course too. When Annie broke this rule with her first bot, the clean-up took 13 logged hours.<\/p>\n<p><strong>Expect to change things many times.<\/strong> Annie built and reshaped her storage system across five days. It took about 45 to 50 separate changes. Changing your mind is how the system becomes yours.<\/p>\n<p><strong>Write your own plan.<\/strong> One row for each week. Each week has a stop condition: the thing that tells you the week is done.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Week<\/th>\n<th>What you do<\/th>\n<th>Stop condition<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1<\/strong><\/td>\n<td>Add nothing new. Use what you built today. Note anything that annoys you<\/td>\n<td>You used it at least three times, and you wrote down each annoyance<\/td>\n<\/tr>\n<tr>\n<td><strong>2<\/strong><\/td>\n<td>Your keep-or-kill date arrives (Module 11). Ask: did I actually use it? Keep it, change it, or switch it off. Bring your answer to the class call<\/td>\n<td>You decided, and you wrote down why<\/td>\n<\/tr>\n<tr>\n<td><strong>3<\/strong><\/td>\n<td>Add one more thing, from your Module 05 maps. One thing, one check, one sentence to describe it<\/td>\n<td>It passed its test, and it ran for three days<\/td>\n<\/tr>\n<tr>\n<td><strong>4<\/strong><\/td>\n<td>Try one task that needs AI judgement. Write your test questions with known answers first, then build it (Module 09)<\/td>\n<td>It passed your test questions. <strong>Full:<\/strong> your RULES file matches <code>hermes cron list<\/code>. <strong>Short:<\/strong> your <code>AGENTS.md<\/code> still describes everything your AI assistant does<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>How to size the week 3 thing.<\/strong> It is one thing. It has one check. You can describe it in one sentence. &quot;Send me the invoices that need a claim&quot; is one thing. &quot;Sort out my admin&quot; is not.<\/p>\n<p><strong>Switching something off counts as progress.<\/strong> Annie once built a job that watched for her credit card statement. Every test passed. She switched it off a few hours later. The bank's email never contained the amount or the due date, so the job could only ever say &quot;go and check the app&quot;. It did not remove a chore, so it did not earn a place.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-12-s6\"><h2><span class=\"num\">12.6<\/span> Owner Drill 2: A Delete That Sticks<\/h2><p><em>5 minutes, Full course only. Skip it if your vault is not on your server, and use the time for your plan.<\/em><\/p>\n<p><strong>Why this drill exists.<\/strong> In Annie's setup, a note deleted on her laptop can come back. A delete made on the server first does reach every device. Module 08B told you this. Now you do it once, so you remember it.<\/p>\n<ol>\n<li>On your laptop, in Obsidian, make a note called <code>Drill test note<\/code>.<\/li>\n<li>Wait for it to sync. Then check it is on the server: <code>ls ~/&lt;your vault folder&gt;/<\/code>.<\/li>\n<li>Delete it on the server: <code>rm ~/&quot;&lt;your vault folder&gt;/Drill test note.md&quot;<\/code>. Keep the quote marks, because the file name has spaces.<\/li>\n<li>Wait for the next sync run. Look in Obsidian on your laptop.<\/li>\n<\/ol>\n<p><strong>It passed if<\/strong> the note is gone from your laptop too.<\/p>\n<p><strong>Write the rule on your run card:<\/strong> &quot;To delete a note for good, delete it on the server first.&quot;<\/p>\n<\/section>\n<section class=\"card\" id=\"full-12-s7\"><h2><span class=\"num\">12.7<\/span> When It Breaks, and Where to Get Help<\/h2><p><em>5 minutes, both courses.<\/em><\/p>\n<h3>The Four Steps<\/h3>\n<p>When something goes wrong, do these in order. Read the real thing before you guess.<\/p>\n<ol>\n<li><strong>Read what the AI assistant actually said,<\/strong> and what the file actually contains.<\/li>\n<li><strong>Check which folder it was started in.<\/strong> Most &quot;it forgot my rules&quot; problems are the wrong folder.<\/li>\n<li><strong>Check that the rule is written in a file.<\/strong> A rule you only said in a chat is gone after the chat ends.<\/li>\n<li><strong>Ask your builder one question, with the real output pasted in.<\/strong><\/li>\n<\/ol>\n<p><strong>If the four steps do not fix it, go to the group chat.<\/strong> Paste the real output there too. A copy of the error is quicker to answer than a description of it.<\/p>\n<h3>Help for Four Weeks After the Course<\/h3>\n<ul>\n<li><strong>A shared group chat for the class, for four weeks.<\/strong> It covers your whole 30-day plan.<\/li>\n<li><strong>Who answers:<\/strong> Annie or a co-teacher, as messages arrive. You should not lose a day of progress waiting for an answer.<\/li>\n<li><strong>The hours the chat is covered:<\/strong> [TO CONFIRM]. The co-teachers live in other time zones, so the hours are agreed after this draft.<\/li>\n<li><strong>One class call at the end of week 2,<\/strong> 30 to 45 minutes. This is when your keep-or-kill date arrives. Bring your answer, and any row from the promise check you could not tick.<\/li>\n<li><strong>Included in the course fee or paid extra:<\/strong> [COST].<\/li>\n<\/ul>\n<p><strong>Write on your run card:<\/strong> the chat's name, the date and time of the class call, and the four steps.<\/p>\n<h3>The Last Save<\/h3>\n<p><em>Full course: 5 minutes. Short course: at the end of the help segment.<\/em><\/p>\n<p>Say <strong>&quot;save&quot;<\/strong> to your builder. It updates your continuity note and writes today's build log with its index row, as you set up in Module 08. This is the last thing you do in the course.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-12-s8\"><h2><span class=\"num\">12.8<\/span> Worksheet: The Close<\/h2><div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Proof<\/th>\n<th>Course<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Every promise row checked<\/td>\n<td>My run card, with any row I could not tick<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>One sentence: what I built, and what it takes off my mind<\/td>\n<td>My run card<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My limit for &quot;too much looking after&quot;<\/td>\n<td>My run card<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Drill 1: alert action done, with no builder<\/td>\n<td>Watchdog <code>--status<\/code> all green<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Drill 2: deleted on the server, gone from the laptop<\/td>\n<td>Obsidian on my laptop<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>30-day plan, four rows, each with a stop condition<\/td>\n<td>My plan<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Keep-or-kill date still in my calendar<\/td>\n<td>My calendar<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>The four steps, the chat's name and the call date<\/td>\n<td>My run card<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Last save done<\/td>\n<td>My continuity note and build log<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/section>", "count": 8, "sess": [4]}, {"id": "full-faq", "label": "FAQ", "title": "Frequently Asked Questions", "minutes": null, "read": 20, "toc": [["full-faq-s1", "FAQ.1", "Module 01: The Claude app seemed to work in Hong Kong without a VPN. Does it?"], ["full-faq-s2", "FAQ.2", "Module 01: A model is on my AI provider's price list. Will it answer me?"], ["full-faq-s3", "FAQ.3", "Module 01: Is Google's AI blocked in Hong Kong?"], ["full-faq-s4", "FAQ.4", "Module 01: My VPN is on, but a payment page still refuses me. Why?"], ["full-faq-s5", "FAQ.5", "Module 01: My test from Hong Kong says 405, &quot;access works&quot;. Has Claude opened to Hong Kong?"], ["full-faq-s6", "FAQ.6", "Module 01: Why does Annie's Mac use a simple on/off switch for its route out?"], ["full-faq-s7", "FAQ.7", "Module 02: Can my bot save email drafts without being able to send email?"], ["full-faq-s8", "FAQ.8", "Module 02: I asked Google for less access. Why does my tool still have the old access?"], ["full-faq-s9", "FAQ.9", "Module 02: I moved my key into its own file. Is it safe now?"], ["full-faq-s10", "FAQ.10", "Module 02: How do I keep the photos I send my bot out of my phone's gallery?"], ["full-faq-s11", "FAQ.11", "Module 02: Is it safe to look inside a settings file that holds keys?"], ["full-faq-s12", "FAQ.12", "Module 03: My notes live in several places. How do I get down to one?"], ["full-faq-s13", "FAQ.13", "Module 03: I use my AI builder on several machines. Why does it know different things on each one?"], ["full-faq-s14", "FAQ.14", "Module 03: Is it safe to tidy up the folders in my vault?"], ["full-faq-s15", "FAQ.15", "Module 03: I renamed some folders and nothing showed an error. Is everything fine?"], ["full-faq-s16", "FAQ.16", "Module 03: Should I use a task board for my to-do list?"], ["full-faq-s17", "FAQ.17", "Module 03: Do I need to buy a Mac mini to keep my builder running?"], ["full-faq-s18", "FAQ.18", "Module 03: How do I know which account an AI tool on my server is billing?"], ["full-faq-s19", "FAQ.19", "Module 03: My small server keeps running out of memory. Are my bots the cause?"], ["full-faq-s20", "FAQ.20", "Module 05: Should I read my real emails before I automate a reminder?"], ["full-faq-s21", "FAQ.21", "Module 05: I keep writing &quot;this must be done&quot; notes. Why do they never get done?"], ["full-faq-s22", "FAQ.22", "Module 05: How do I know a process is written down well enough to hand over?"], ["full-faq-s23", "FAQ.23", "Module 06: I copied my AI's files to a new machine. Why does it only know half of me?"], ["full-faq-s24", "FAQ.24", "Module 06: Why should I write a success sentence before I design anything?"], ["full-faq-s25", "FAQ.25", "Module 06: What happens to how my AI works with me if I change AI models?"], ["full-faq-s26", "FAQ.26", "Module 08: My AI assistant keeps ignoring the rules I gave it. Why?"], ["full-faq-s27", "FAQ.27", "Module 08: My builder says the job is tested and working. Can I trust that?"], ["full-faq-s28", "FAQ.28", "Module 08: Claude Code keeps signing me in to the wrong account. What is wrong?"], ["full-faq-s29", "FAQ.29", "Module 08: My builder finished the job. Did it do everything?"], ["full-faq-s30", "FAQ.30", "Module 08B: Nothing bad has happened to my server. Does that mean it is safe?"], ["full-faq-s31", "FAQ.31", "Module 08B: Do I need a paid VPN as well as Tailscale?"], ["full-faq-s32", "FAQ.32", "Module 08B: Claude Code on my server will not open, but Claude works on my phone. Is it the VPN?"], ["full-faq-s33", "FAQ.33", "Module 08B: I changed my bot's model and restarted it. The restart looked fine. Is the bot working?"], ["full-faq-s34", "FAQ.34", "Module 09: Can I run my bot on a cheaper AI model?"], ["full-faq-s35", "FAQ.35", "Module 09: My bot says it checked my calendar for clashes. Can I trust it?"], ["full-faq-s36", "FAQ.36", "Module 09: Can a cheap model grade my answers?"], ["full-faq-s37", "FAQ.37", "Module 10: My watchdog says every job ran. Is everything fine?"], ["full-faq-s38", "FAQ.38", "Module 10: I moved my bots to a cheaper model and some jobs broke. Is the new model the problem?"], ["full-faq-s39", "FAQ.39", "Module 11: I get the same reminder twice, but I only have one job. Why?"], ["full-faq-s40", "FAQ.40", "Module 11: The bot said it updated my message format, but the next message looked the same. Why?"]], "body": "<div class=\"intro\"><p>These are real questions, answered with real stories from Annie's own system. Each answer ends with what to do. Read them when you hit the problem, not before.<\/p>\n<\/div>\n<section class=\"card\" id=\"full-faq-s1\"><h2><span class=\"num\">FAQ.1<\/span> Module 01: The Claude app seemed to work in Hong Kong without a VPN. Does it?<\/h2><p>No. Claude and the Claude apps are blocked in Hong Kong. This includes the phone apps.<\/p>\n<p><strong>What happened.<\/strong> Claude twice suggested that the Claude phone app might work in Hong Kong with no VPN. Both times the test was not clean.<\/p>\n<ul>\n<li>The first time, Tailscale (a private network app) was still connected. So the phone was not really on its Hong Kong connection.<\/li>\n<li>The second time, Claude read a &quot;Logged out&quot; label as &quot;the VPN is off&quot;. The VPN was still on.<\/li>\n<li>Annie caught both mistakes. They cost two wasted rounds of testing.<\/li>\n<\/ul>\n<p><strong>What to do.<\/strong> When a test seems to disprove something you already know, first check that the test was clean.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s2\"><h2><span class=\"num\">FAQ.2<\/span> Module 01: A model is on my AI provider's price list. Will it answer me?<\/h2><p>Not always.<\/p>\n<p><strong>What happened.<\/strong> Claude recommended two Western models for Annie's bots. Both were blocked for her reseller account, and her notes already said so. Annie asked it to check again. A one-line hello through her reseller key returned 403 for every Anthropic and Google model. Only the open-weight models answered. A bot that would not have worked was nearly built.<\/p>\n<p><strong>What to do.<\/strong> Before you choose a model, send it a short hello. Send it from the machine and the key that will really use it.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s3\"><h2><span class=\"num\">FAQ.3<\/span> Module 01: Is Google's AI blocked in Hong Kong?<\/h2><p>Consumer Gemini is not blocked. It opened to Hong Kong in March 2026. Google's developer tools, such as AI Studio, are still blocked.<\/p>\n<p><strong>What happened.<\/strong> Annie's notes said Google's AI was blocked for months after it had opened. Nobody noticed until she was planning a beginner seminar and found the change herself. The seminar was nearly designed around a tool the audience could not use, while the right tool was already open.<\/p>\n<p><strong>What to do.<\/strong> Write the date next to every fact about what works. Check it again before you teach or build on it.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s4\"><h2><span class=\"num\">FAQ.4<\/span> Module 01: My VPN is on, but a payment page still refuses me. Why?<\/h2><p>The page is checking your card, not your connection.<\/p>\n<p><strong>What happened.<\/strong> Annie needed to buy API credit for her first bot. The developer website refused her Hong Kong billing address. A VPN changed nothing, because the check was on the card. It took her about a week of research to find a way.<\/p>\n<p><strong>What to do.<\/strong> Remember that there are three separate checks:<\/p>\n<ol>\n<li>your connection<\/li>\n<li>your sign-up details, such as your phone number<\/li>\n<li>your billing address<\/li>\n<\/ol>\n<p>A VPN fixes only the first one.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s5\"><h2><span class=\"num\">FAQ.5<\/span> Module 01: My test from Hong Kong says 405, &quot;access works&quot;. Has Claude opened to Hong Kong?<\/h2><p>Probably not. Your request probably came from another country.<\/p>\n<p><strong>What happened.<\/strong> Annie tested from Hong Kong for Module 01. Two of her three tries returned 405.<\/p>\n<ul>\n<li>The first try went out through Taiwan.<\/li>\n<li>The second try went out through an address on New York time.<\/li>\n<li>Anthropic answered both tries, so both said &quot;access works&quot;.<\/li>\n<li>The third try came from a setting that had passed a location check, which said Hong Kong. It returned 403, the block.<\/li>\n<\/ul>\n<p><strong>What to do.<\/strong> Before you trust a location test, check which country your request came from. On the same laptop and the same connection, search the web for &quot;what is my IP location&quot;.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s6\"><h2><span class=\"num\">FAQ.6<\/span> Module 01: Why does Annie's Mac use a simple on/off switch for its route out?<\/h2><p><em>Full course only.<\/em><\/p>\n<p>Because a cleverer setup kept breaking her most important tool.<\/p>\n<p><strong>What happened.<\/strong> Annie's Mac was once set up to send only Claude's traffic through her server, and keep everything else on her Hong Kong connection. It was built two times and removed once. Each time, a fragile setting sat between her and her main builder. Once, an empty settings box broke it with no warning. It was replaced with one switch: everything through the server, or everything on Hong Kong. The switch was safe because pi, which needs no route, was now her second builder.<\/p>\n<p><strong>What to do.<\/strong> Do not put a fragile setting between you and the tool you depend on most. Keep a second tool that does not need that setting.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s7\"><h2><span class=\"num\">FAQ.7<\/span> Module 02: Can my bot save email drafts without being able to send email?<\/h2><p>Not with Google. The smallest Google permission that writes drafts can also send.<\/p>\n<p><strong>What happened.<\/strong> Annie asked whether her bot could save approved email replies into her Gmail drafts folder. Her builder checked the real permissions before answering. Google has no permission that allows drafts but not sending. So the change would turn &quot;sending is impossible&quot; into &quot;sending is possible but unused&quot;. Annie shelved the feature. She called the explanation &quot;huge to me&quot;.<\/p>\n<p><strong>What to do.<\/strong> When the exact control you want does not exist, choose the stricter control you can prove.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s8\"><h2><span class=\"num\">FAQ.8<\/span> Module 02: I asked Google for less access. Why does my tool still have the old access?<\/h2><p>Because a smaller request does not cancel a larger one. New consent adds to old consent.<\/p>\n<p><strong>What happened.<\/strong> Annie tried twice to give her email tool read-only access. Each time, Google handed back the old send permission. The only fix was to remove the app's access fully, through Google's revoke page. Then she approved it again from a clean start.<\/p>\n<p><strong>What to do.<\/strong> To take access back, remove it at the company. Then approve the smaller access from a clean start.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s9\"><h2><span class=\"num\">FAQ.9<\/span> Module 02: I moved my key into its own file. Is it safe now?<\/h2><p>Not yet. The old copies of the key still work.<\/p>\n<p><strong>What happened.<\/strong> The builder moved a web-service key out of one settings file and into its own file. It called this a security improvement. Annie asked one question: &quot;did we not move the old credential straight to the secrets.env file?&quot; She was right. The same key now existed in nine places on the server.<\/p>\n<ul>\n<li>Only replacing the key with a new one retires every old copy.<\/li>\n<li>A one-command script now does three things: it updates every live copy, restarts the programs that read it, and checks they reconnect.<\/li>\n<\/ul>\n<p><strong>What to do.<\/strong> Count every copy of a secret before you claim it is safe. To retire the old copies, replace the key with a new one.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s10\"><h2><span class=\"num\">FAQ.10<\/span> Module 02: How do I keep the photos I send my bot out of my phone's gallery?<\/h2><p>No setting in the chat app can do this. The camera saves a copy to your gallery first.<\/p>\n<p><strong>What happened.<\/strong> Annie wanted photos she sent to her storage bot kept out of Google Photos. Her builder recorded her real steps on screen and read the video frame by frame. Taking a photo with the camera writes a copy to the phone's public gallery. This happens before Telegram or any bot is involved.<\/p>\n<p><strong>What to do.<\/strong> Check where your phone has already put private material before you worry about the bot.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s11\"><h2><span class=\"num\">FAQ.11<\/span> Module 02: Is it safe to look inside a settings file that holds keys?<\/h2><p>Yes, if you show only the names of the keys.<\/p>\n<p><strong>What happened.<\/strong> Twice in one day, a session inspected a settings file to see its structure. Both times, it printed a live key on screen. Both times, it looked like a harmless check. The terminal keeps a copy of what it shows. So do AI tools.<\/p>\n<p><strong>What to do.<\/strong> When you inspect settings, print the names of keys, never their values.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s12\"><h2><span class=\"num\">FAQ.12<\/span> Module 03: My notes live in several places. How do I get down to one?<\/h2><p>Choose one home, move everything in, and check before you delete.<\/p>\n<p><strong>What happened.<\/strong> Annie's notes about her bot lived on her Mac, in Obsidian and on the server. She never knew which copy was the real one.<\/p>\n<ul>\n<li>She moved the to-do list and a cheat sheet into Obsidian.<\/li>\n<li>She cut her builder's instruction file down to a short pointer.<\/li>\n<li>She deleted the server's duplicate only after checking it matched the vault copy byte for byte.<\/li>\n<\/ul>\n<p>It took one afternoon.<\/p>\n<p><strong>What to do.<\/strong> Choose one home and move everything into it. Before you delete a duplicate, check that it matches the copy you keep.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s13\"><h2><span class=\"num\">FAQ.13<\/span> Module 03: I use my AI builder on several machines. Why does it know different things on each one?<\/h2><p>Each machine is probably reading its own copy of the builder's memory.<\/p>\n<p><strong>What happened.<\/strong> Annie's builder had four separate memories on different machines and accounts. Each knew different things about her. She said: &quot;I just need one source of truth for Claudith and you, just as I need one source of truth for EVERYTHING we do.&quot; The fix merged 29 memory files into one vault folder, and linked every machine to it. A test from each machine, with no history, proved each one loaded the same instructions.<\/p>\n<p><strong>What to do.<\/strong> Keep one real copy that every device reads. It is better than several copies kept in step.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s14\"><h2><span class=\"num\">FAQ.14<\/span> Module 03: Is it safe to tidy up the folders in my vault?<\/h2><p>Yes, but a move is not finished when the files have moved.<\/p>\n<p><strong>What happened.<\/strong> Annie asked for a vault tidy-up. Many folders moved. A family member's tutor bot had 15 document addresses written into its skill. All 15 broke. The bot searched blindly and ran slowly for about six days before anyone noticed.<\/p>\n<p><strong>What to do.<\/strong> A move is finished only when every script and bot that refers to the old address has been updated.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s15\"><h2><span class=\"num\">FAQ.15<\/span> Module 03: I renamed some folders and nothing showed an error. Is everything fine?<\/h2><p>Not always. A rename can break things with no error message.<\/p>\n<p><strong>What happened.<\/strong> The top-level vault folders were renamed to add icons. Nothing reported an error.<\/p>\n<ul>\n<li>Claude's memory link pointed at the old name. So a session started with no memory.<\/li>\n<li>Six links on the server broke. So Claude Code there ran with no global instructions, and four skills stopped working.<\/li>\n<li>The monthly cost script crashed the first time it ran after the rename.<\/li>\n<\/ul>\n<p><strong>What to do.<\/strong> After any rename, search every script for the old name. Then run each affected job once by hand.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s16\"><h2><span class=\"num\">FAQ.16<\/span> Module 03: Should I use a task board for my to-do list?<\/h2><p>Only if you already open it every day.<\/p>\n<p><strong>What happened.<\/strong> In Annie's first month, her bot's rules said to use a task board. The board stayed empty, because she never opened it. Her calendar became the real list.<\/p>\n<p><strong>What to do.<\/strong> Build around the place you already look every day.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s17\"><h2><span class=\"num\">FAQ.17<\/span> Module 03: Do I need to buy a Mac mini to keep my builder running?<\/h2><p><em>Full course only.<\/em><\/p>\n<p>Not if you already have a machine that stays on.<\/p>\n<p><strong>What happened.<\/strong> Annie wanted her own Claude Code on her phone, with her instructions and memory. The route she used kept her Mac awake and plugged in. That raised the question of buying a Mac mini. But she already rented a server that never sleeps, and her vault already reached it. So the builder was installed there in about 10 minutes, on the subscription she already paid for.<\/p>\n<p><strong>What to do.<\/strong> Check what you already own before you buy.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s18\"><h2><span class=\"num\">FAQ.18<\/span> Module 03: How do I know which account an AI tool on my server is billing?<\/h2><p><em>Full course only.<\/em><\/p>\n<p>Check before you use it. It may already be signed in to an account you did not choose.<\/p>\n<p><strong>What happened.<\/strong> When Claude Code was set up on Annie's server, it was already signed in to her work account. That account was billed per use to her employer. She had not asked for that.<\/p>\n<ul>\n<li>The fix was to sign in with her personal subscription.<\/li>\n<li>Then a lock was set, so neither account can fall back to per-use billing.<\/li>\n<\/ul>\n<p><strong>What to do.<\/strong> Before you use any AI tool on a machine, check whose account it is on and how it bills.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s19\"><h2><span class=\"num\">FAQ.19<\/span> Module 03: My small server keeps running out of memory. Are my bots the cause?<\/h2><p><em>Full course only.<\/em><\/p>\n<p>Maybe not. Look for old sessions that were never closed.<\/p>\n<p><strong>What happened.<\/strong> The server began showing memory warnings every minute. The bots were not the cause. All three together used under 1 GB.<\/p>\n<ul>\n<li>Six abandoned Claude Code sessions, each 4 to 17 days old, held 1.5 GB between them.<\/li>\n<li>Closing them freed 1.37 GB.<\/li>\n<li>A 2 GB swap file was also added. A swap file is spare memory on the disk.<\/li>\n<\/ul>\n<p><strong>What to do.<\/strong> On a small server, memory runs out first. When it does, the system stops programs to make room. It may stop the one you depend on. Close sessions you no longer use.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s20\"><h2><span class=\"num\">FAQ.20<\/span> Module 05: Should I read my real emails before I automate a reminder?<\/h2><p>Yes. Ten minutes of reading can save you a build that does not help.<\/p>\n<p><strong>What happened.<\/strong> Annie planned a bill reminder. A credit card statement email would arrive. The bot would send the amount and the due date. Annie would reply &quot;paid&quot;. Before writing any code, she read real emails for ten minutes. This broke three assumptions:<\/p>\n<ul>\n<li>One bank had not sent a statement email since May 2022.<\/li>\n<li>The other bank's alerts went to a family member's inbox.<\/li>\n<li>The alert email held no amount and no due date. It only said that a statement was ready.<\/li>\n<\/ul>\n<p>A simpler version shipped. Annie retired it the same day. A message that can only say &quot;go and check the app&quot; does not remove enough work to earn a daily slot.<\/p>\n<p><strong>What to do.<\/strong> Check the real trigger before you build. Judge an automation by whether it removes a chore.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s21\"><h2><span class=\"num\">FAQ.21<\/span> Module 05: I keep writing &quot;this must be done&quot; notes. Why do they never get done?<\/h2><p>Because a note is not a task. Nothing acts on a note.<\/p>\n<p><strong>What happened.<\/strong> Annie asked to tidy her seminar notes. She believed the mess was three documents. A search found six places, not three. The real tasks were split across two sections of her to-do list. Four bold notes said certain material must go into a teaching page. Each note was restated, and none was ever done. All four notes became one item on the list.<\/p>\n<p><strong>What to do.<\/strong> Put tasks where tasks get done: on your one to-do list.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s22\"><h2><span class=\"num\">FAQ.22<\/span> Module 05: How do I know a process is written down well enough to hand over?<\/h2><p>Each step is written down, in order, and each step prevents a mistake you have already seen.<\/p>\n<p><strong>What happened.<\/strong> Annie taught her bot how she wants email replies drafted. At first the steps lived in chat and in the bot's small memory. That memory filled up. The steps were then written into the bot's reply instructions as six numbered steps:<\/p>\n<ol>\n<li>Find the thread by email address first.<\/li>\n<li>Draft from the account that received the original.<\/li>\n<li>Work out who is on each side from the thread itself.<\/li>\n<li>Check who is attending against the latest confirmation.<\/li>\n<li>Reply in the same thread, with the same subject.<\/li>\n<li>Show the account, subject and full text before sending.<\/li>\n<\/ol>\n<p>Every step prevents a mistake she had already seen.<\/p>\n<p><strong>What to do.<\/strong> Write your process as numbered steps in the instructions the bot reads, not only in chat. The bot's small memory can fill up.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s23\"><h2><span class=\"num\">FAQ.23<\/span> Module 06: I copied my AI's files to a new machine. Why does it only know half of me?<\/h2><p>Because it only knows what is in the files you copied. If you copied the wrong set, it knows the wrong half.<\/p>\n<p><strong>What happened.<\/strong> Annie's builder moved onto her server. A test from the server passed all four questions about her. Then Annie noticed something missing. The server's Claude knew her work side but not her personal side. Her two Mac accounts held two different sets of memory, and the work set had been copied. The fix copied the personal memory across.<\/p>\n<p><strong>What to do.<\/strong> Remember that an AI only knows the parts of you that are written in the files it reads. After a move, check both sides of your life, not only the one you tested.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s24\"><h2><span class=\"num\">FAQ.24<\/span> Module 06: Why should I write a success sentence before I design anything?<\/h2><p>Because the sentence is the test. Without it, you cannot tell whether a design works.<\/p>\n<p><strong>What happened.<\/strong> Annie's first daily learning card sent her a ready-made explanation each morning. It had an optional &quot;reply in your own words&quot;. She stated her test: future Annie must be able to school current Annie. Against that sentence, the design failed three ways:<\/p>\n<ul>\n<li>Reading answers builds recognition, not recall.<\/li>\n<li>The step where learning happens was optional. Optional steps do not survive a busy day.<\/li>\n<li>Nothing was recorded. So there was no earlier answer to beat.<\/li>\n<\/ul>\n<p>The card was rebuilt as a question she answers first.<\/p>\n<p><strong>What to do.<\/strong> Write the success sentence before you judge any design.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s25\"><h2><span class=\"num\">FAQ.25<\/span> Module 06: What happens to how my AI works with me if I change AI models?<\/h2><p>You lose it, unless it is written down.<\/p>\n<p><strong>What happened.<\/strong> Annie was about to lose access to the AI model she had built her working style with. She asked it to write down how it reasons with her. She also asked it to record her strengths, so future sessions would protect them. The document now loads on every device she uses.<\/p>\n<p><strong>What to do.<\/strong> Write down how your AI works with you, and what you do well. A working relationship with an AI survives a change of model only if it is written down.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s26\"><h2><span class=\"num\">FAQ.26<\/span> Module 08: My AI assistant keeps ignoring the rules I gave it. Why?<\/h2><p>Its rules file may never have loaded. Nothing warns you when that happens.<\/p>\n<p><strong>What happened.<\/strong> For weeks, Annie kept teaching her bot procedures. It kept failing to follow them.<\/p>\n<ul>\n<li>Nothing showed a problem, because every part of the setup seemed to work.<\/li>\n<li>In fact, its rules file had never loaded into the model at all.<\/li>\n<li>Two file links fixed it.<\/li>\n<\/ul>\n<p><strong>What to do.<\/strong> Run the cold test: a fresh session that proves your file loads. It is the only proof that the AI assistant read your files.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s27\"><h2><span class=\"num\">FAQ.27<\/span> Module 08: My builder says the job is tested and working. Can I trust that?<\/h2><p>Not yet. A report of success is only a claim.<\/p>\n<p><strong>What happened.<\/strong> Annie's receipt automation was reported as tested and working. A separate check on the machine found six bugs. Four of them stopped it from working at all. For example:<\/p>\n<ul>\n<li>The sender check could never match.<\/li>\n<li>The email tool could not download attachments.<\/li>\n<\/ul>\n<p><strong>What to do.<\/strong> Test it yourself. A confident sentence is not proof. The answer test and the refusal test are proof.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s28\"><h2><span class=\"num\">FAQ.28<\/span> Module 08: Claude Code keeps signing me in to the wrong account. What is wrong?<\/h2><p><em>Full course only.<\/em><\/p>\n<p>Claude Code signs in to whichever account your browser has open.<\/p>\n<p><strong>What happened.<\/strong> Annie's personal start command kept signing her in to her work account.<\/p>\n<ul>\n<li>The two accounts were set up separately, as planned.<\/li>\n<li>But the personal one held a work sign-in, because her browser was signed in to work when she logged in.<\/li>\n<li>The fix: sign out in the browser, log in again, and check which account each folder holds.<\/li>\n<\/ul>\n<p><strong>What to do.<\/strong> When a setup looks broken, look at what is inside it before you rebuild it.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s29\"><h2><span class=\"num\">FAQ.29<\/span> Module 08: My builder finished the job. Did it do everything?<\/h2><p>Not always. Check its list, not just the result.<\/p>\n<p><strong>What happened.<\/strong> A builder rebuilt Annie's morning message with nobody watching. The new message met every requirement. But the builder skipped three things:<\/p>\n<ol>\n<li>the build log<\/li>\n<li>the to-do list update<\/li>\n<li>one setting. It had backed up that setting but never changed it.<\/li>\n<\/ol>\n<p>The fix: every instruction now ends with the builder reading its checks as a checklist, and marking each one done or not done.<\/p>\n<p><strong>What to do.<\/strong> A check that depends on goodwill gets skipped. Make it part of the process.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s30\"><h2><span class=\"num\">FAQ.30<\/span> Module 08B: Nothing bad has happened to my server. Does that mean it is safe?<\/h2><p>Not necessarily. It may just be luck.<\/p>\n<p><strong>What happened.<\/strong> For its first month, Annie's server had five secret files that any user on the machine could read. It had no firewall. Nothing bad happened, and that was luck, not design.<\/p>\n<ul>\n<li>Her first security review looked first and changed nothing. It found the gaps and sorted the fixes by risk.<\/li>\n<li>The next day the fixes went in. SSH was allowed before the firewall was switched on, with a second login window open.<\/li>\n<li>The bot kept the same process number throughout. That proved nothing broke.<\/li>\n<\/ul>\n<p><strong>What to do.<\/strong> Look before you change. Change in an order that always leaves you able to log in.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s31\"><h2><span class=\"num\">FAQ.31<\/span> Module 08B: Do I need a paid VPN as well as Tailscale?<\/h2><p><em>Full course only.<\/em><\/p>\n<p>Not if your server is an exit node. Then one switch does both jobs.<\/p>\n<p><strong>What happened.<\/strong> Annie's phone could run only one VPN at a time.<\/p>\n<ul>\n<li>With her paid VPN on, Claude worked and her private pages did not.<\/li>\n<li>With Tailscale on, the private pages worked and Claude did not.<\/li>\n<li>She made her Singapore server a Tailscale exit node. One switch did both jobs.<\/li>\n<li>The paid VPN became unnecessary on the phone, then on the Mac.<\/li>\n<\/ul>\n<p><strong>What to do.<\/strong> Before you add a second tool to solve a clash, ask whether the tool you already have can do both jobs.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s32\"><h2><span class=\"num\">FAQ.32<\/span> Module 08B: Claude Code on my server will not open, but Claude works on my phone. Is it the VPN?<\/h2><p><em>Full course only.<\/em><\/p>\n<p>Probably not. Check the server's login.<\/p>\n<p><strong>What happened.<\/strong> Annie could not open Claude Code on her server from her phone.<\/p>\n<ul>\n<li>She suspected the VPN. But her phone's Claude chat was working at that moment, so the network was fine.<\/li>\n<li>The server's login had expired. Using Claude did not extend it.<\/li>\n<li>The watchdog now warns her before the expiry date.<\/li>\n<\/ul>\n<p><strong>What to do.<\/strong> When one tool works and another fails on the same device, look at what differs.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s33\"><h2><span class=\"num\">FAQ.33<\/span> Module 08B: I changed my bot's model and restarted it. The restart looked fine. Is the bot working?<\/h2><p>Not until it answers a real message. Starting the bot never checks the key.<\/p>\n<p><strong>What happened.<\/strong> Annie moved her bots to a new model provider. This caused three outages.<\/p>\n<ul>\n<li>Two bots went down. The new key sat only in the main bot's file, and each bot reads only its own.<\/li>\n<li>The nightly filing job failed. Its model names existed only on the old provider.<\/li>\n<li>Every restart looked healthy, because starting the bot never checks the key.<\/li>\n<\/ul>\n<p><strong>What to do.<\/strong> After any change to keys or models, send a real message through every bot.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s34\"><h2><span class=\"num\">FAQ.34<\/span> Module 09: Can I run my bot on a cheaper AI model?<\/h2><p>Yes, but only once the tools and checks around it are built.<\/p>\n<p><strong>What happened.<\/strong> Annie's first bot ran on a cheaper open model.<\/p>\n<ul>\n<li>It chatted well.<\/li>\n<li>It also said tasks were done when they were not.<\/li>\n<li>It wrote broken tools of its own instead of using the ones it had.<\/li>\n<li>It only added things to the calendar when given an exact command.<\/li>\n<li>Moving to Claude fixed it. The hidden cost was about a week of research, plus 13 logged hours of clean-up.<\/li>\n<li>Later, all three of Annie's bots ran well on a cheap DeepSeek model. By then the tools and guards around it were built.<\/li>\n<\/ul>\n<p><strong>What to do.<\/strong> Test a model on the actions you need. Check what it touched, not what it says.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s35\"><h2><span class=\"num\">FAQ.35<\/span> Module 09: My bot says it checked my calendar for clashes. Can I trust it?<\/h2><p>Not on its word alone. A bot that says it checked has not always checked correctly.<\/p>\n<p><strong>What happened.<\/strong> Annie's bot kept saying a 9:15 to 10:15 class was free on a Friday.<\/p>\n<ul>\n<li>Her son had an appointment from 9:45 to 10:30.<\/li>\n<li>The bot compared start times only, so it saw no problem.<\/li>\n<li>The fix was one rule that a script now applies to every slot. Two times clash if the first starts before the second ends, and ends after the second starts.<\/li>\n<\/ul>\n<p><strong>What to do.<\/strong> Give any check with a right answer, such as a time clash, to a script.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s36\"><h2><span class=\"num\">FAQ.36<\/span> Module 09: Can a cheap model grade my answers?<\/h2><p>Often not. A cheap model can be fine at sending and filing, and still too soft to judge.<\/p>\n<p><strong>What happened.<\/strong> Annie's learning bot graded her answer to a question about who approves AI at a bank.<\/p>\n<ul>\n<li>She named the chief executive, the finance chief and the board.<\/li>\n<li>The answer key named risk, security, legal and the data owner.<\/li>\n<li>The bot replied &quot;That's exactly it&quot;.<\/li>\n<li>It had made one model call and zero tool calls. So it had also saved nothing.<\/li>\n<li>Fixing the saving first would have recorded false passes. So the grading moved to Claude Code first.<\/li>\n<\/ul>\n<p><strong>What to do.<\/strong> Fix the judgement before you fix the step that records it.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s37\"><h2><span class=\"num\">FAQ.37<\/span> Module 10: My watchdog says every job ran. Is everything fine?<\/h2><p>Not always. A check that a job ran does not check what the job did.<\/p>\n<p><strong>What happened.<\/strong> Annie's watchdog checked three things: that the inbox sorter ran, that the backups were fresh and that the folders existed. It never checked where the notes went. For weeks the sorter reported &quot;ok&quot; while it filed every note into the wrong folder. When a check of the result was added, it went red on the first run.<\/p>\n<p><strong>What to do.<\/strong> Check the result, not only that the job ran. Open the file, list the folder or read the message the job produced.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s38\"><h2><span class=\"num\">FAQ.38<\/span> Module 10: I moved my bots to a cheaper model and some jobs broke. Is the new model the problem?<\/h2><p>Probably not. Check the keys and the model names first.<\/p>\n<p><strong>What happened.<\/strong> Annie moved two of her three bots to a cheaper model from a new provider. The third was already on it.<\/p>\n<ul>\n<li>The move broke the teaching bot, the nightly inbox sorter and the calendar job.<\/li>\n<li>The cause was not the model. The keys and model names did not carry across from the old provider.<\/li>\n<li>A new watchdog check now catches a model name that its provider does not serve.<\/li>\n<\/ul>\n<p><strong>What to do.<\/strong> When you change provider, check that every job has a key and a model name that the new provider accepts.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s39\"><h2><span class=\"num\">FAQ.39<\/span> Module 11: I get the same reminder twice, but I only have one job. Why?<\/h2><p>The bot may be sending it again when you reply.<\/p>\n<p><strong>What happened.<\/strong> On at least two nights Annie received two receipt reminders, but only one job existed. When she replied &quot;done&quot;, the bot sent the files again as a reply. The fix was a written rule: when she says &quot;done&quot;, note it and do not send the files again.<\/p>\n<p><strong>What to do.<\/strong> When a message arrives twice, check what the bot does when you reply, not only the schedule.<\/p>\n<\/section>\n<section class=\"card\" id=\"full-faq-s40\"><h2><span class=\"num\">FAQ.40<\/span> Module 11: The bot said it updated my message format, but the next message looked the same. Why?<\/h2><p>The job may read a different file from the one the bot changed.<\/p>\n<p><strong>What happened.<\/strong> Annie asked for a new format for her morning message. The bot said &quot;updated&quot;, and it changed its skill file correctly. The next two mornings still came in the old format. The scheduled job had its own stored instructions, which said &quot;EXACTLY this format&quot;, and those won every time.<\/p>\n<p><strong>What to do.<\/strong> When a fix does not show up, find which file the job actually reads.<\/p>\n<\/section>", "count": 40, "sess": null}]}, "short": {"overview": "<section class=\"card hero\">\n<h1>Short Course<\/h1>\n<p class=\"sub\">10 hours · laptop first<\/p>\n<p>Students build one AI assistant on their laptop with pi, give it one real job, and prove it works with two tests. A server is an optional extra sitting.<\/p>\n<\/section>\n<section class=\"card\"><h2>Syllabus<\/h2>\n<p class=\"muted\">Each session has its own colour. The tabs at the top use the same colours. The session split is a draft. The session format is still open.<\/p>\n<div class=\"sess s1\"><div class=\"sesshead\"><b>Session 1<\/b><span class=\"min big\">2 hr 30 min<\/span><\/div><ul><li><a href=\"#short-01\" data-go=\"short-01\">01: What Works From Hong Kong<\/a> <span class=\"min\">45 min<\/span><\/li><li><a href=\"#short-02\" data-go=\"short-02\">02: Privacy, Security and Whose Law Reaches Your Data<\/a> <span class=\"min\">35 min<\/span><\/li><li><a href=\"#short-03\" data-go=\"short-03\">03: Architecture and Where Your System Lives<\/a> <span class=\"min\">1 hr 10 min<\/span><\/li><\/ul><\/div><div class=\"sess s2\"><div class=\"sesshead\"><b>Session 2<\/b><span class=\"min big\">2 hr 30 min<\/span><\/div><ul><li><a href=\"#short-04\" data-go=\"short-04\">04: The Demo<\/a> <span class=\"min\">25 min<\/span><\/li><li><a href=\"#short-05\" data-go=\"short-05\">05: Your Processes on Paper<\/a> <span class=\"min\">35 min<\/span><\/li><li><a href=\"#short-06\" data-go=\"short-06\">06: Introduce Yourself to the Machine<\/a> <span class=\"min\">30 min<\/span><\/li><li><a href=\"#short-07\" data-go=\"short-07\">07: Rules of Engagement<\/a> <span class=\"min\">30 min<\/span><\/li><li><a href=\"#short-08\" data-go=\"short-08\">08 The Build: first 30 minutes<\/a> <span class=\"min\">30 min<\/span><\/li><\/ul><\/div><div class=\"sess s3\"><div class=\"sesshead\"><b>Session 3<\/b><span class=\"min big\">2 hr 30 min<\/span><\/div><ul><li><a href=\"#short-08\" data-go=\"short-08\">08 The Build: the rest<\/a> <span class=\"min\">2 hr 30 min<\/span><\/li><\/ul><\/div><div class=\"sess s4\"><div class=\"sesshead\"><b>Session 4<\/b><span class=\"min big\">2 hr 20 min<\/span><\/div><ul><li><a href=\"#short-09\" data-go=\"short-09\">09: Script, Machine Learning or AI Judgement<\/a> <span class=\"min\">25 min<\/span><\/li><li><a href=\"#short-10\" data-go=\"short-10\">10: What Breaks, and Keeping It Honest<\/a> <span class=\"min\">35 min<\/span><\/li><li><a href=\"#short-11\" data-go=\"short-11\">11: Growing It, Skills and Schedules<\/a> <span class=\"min\">1 hr 5 min<\/span><\/li><li><a href=\"#short-12\" data-go=\"short-12\">12: The Close, Your 30-Day Plan<\/a> <span class=\"min\">15 min<\/span><\/li><\/ul><\/div><div class=\"sess s0 opt\"><div class=\"sesshead\"><b>Optional server sitting (outside the 10 hours)<\/b><span class=\"min big\">1 hr 40 min<\/span><\/div><ul><li><a href=\"#short-08b\" data-go=\"short-08b\">08B: The Server and Your Bot<\/a> <span class=\"min\">1 hr 40 min<\/span><\/li><\/ul><\/div>\n<p class=\"total\"><b>Total:<\/b> 9 hr 50 min of 10 hr. That leaves 10 min spare.<\/p>\n<\/section>\n<section class=\"card\"><h2>How to Use This Page<\/h2>\n<ol>\n<li><b>One module per tab.<\/b> Tap a number at the top. Each tab is one module, so you only read one thing at a time.<\/li>\n<li><b>Every section has a number,<\/b> like <span class=\"num\">3.4<\/span>. It means module 3, section 4.<\/li>\n<li><b>To change something,<\/b> tell Claude the course, the number and the change. For example: <i>\"Full, 3.4: make the first list shorter.\"<\/i><\/li>\n<li><b>Your place is saved.<\/b> The page opens on the last tab you read.<\/li>\n<\/ol><\/section>", "tabs": [{"id": "short-01", "label": "01", "title": "Module 01: What Works From Hong Kong", "minutes": 45, "read": 18, "toc": [["short-01-s1", "01.1", "What You Will Leave With"], ["short-01-s2", "01.2", "What You Need to Prepare"], ["short-01-s3", "01.3", "AI Jargon You Need to Know"], ["short-01-s4", "01.4", "Which AI Tools Work From Hong Kong"], ["short-01-s5", "01.5", "Live Test: Read the Error Code the AI Provider Sends Back"], ["short-01-s6", "01.6", "Your Builder, and Claude If You Want It"], ["short-01-s7", "01.7", "Phones and the Mac"], ["short-01-s8", "01.8", "Lessons From Real Mistakes"], ["short-01-s9", "01.9", "Exercise"], ["short-01-s10", "01.10", "Worksheet: Your Access Sheet"]], "body": "<section class=\"card\" id=\"short-01-s1\"><h2><span class=\"num\">01.1<\/span> What You Will Leave With<\/h2><p><strong>Your Access Sheet.<\/strong> It is one page. It lists:<\/p>\n<ul>\n<li>every account you have or need<\/li>\n<li>which tools work directly from Hong Kong<\/li>\n<li>your route for each tool that does not work directly<\/li>\n<li>the date you tested each one, because what works can change<\/li>\n<\/ul>\n<p>You use this sheet when you install your builder. You use it again if you build your own server.<\/p>\n<\/section>\n<section class=\"card\" id=\"short-01-s2\"><h2><span class=\"num\">01.2<\/span> What You Need to Prepare<\/h2><ul>\n<li><strong>A laptop you control.<\/strong>\n<ul>\n<li>A personal Mac is the easiest.<\/li>\n<li>A Windows laptop works. The Windows commands are shown where they are different.<\/li>\n<li>A company laptop often blocks installs and network tools. Do not bring one if you can avoid it.<\/li>\n<\/ul>\n<\/li>\n<li><strong>A phone with Telegram installed.<\/strong> You do not use Telegram today. You need it later, when you meet your bot.<\/li>\n<li><strong>A Google account.<\/strong> Gemini works in Hong Kong with no extra steps. So today it is the tool we know works, to compare the others against.<\/li>\n<li><strong>Nothing else.<\/strong> Do not buy a VPN or a server before this session. This module explains what you need.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-01-s3\"><h2><span class=\"num\">01.3<\/span> AI Jargon You Need to Know<\/h2><p>This course builds a personal AI system. It has up to three parts:<\/p>\n<ul>\n<li><strong>The builder<\/strong> is an AI that writes and fixes code for you. You describe what you want in plain English.<\/li>\n<li><strong>The bot<\/strong> is an AI you send messages to on your phone.<\/li>\n<li><strong>The server<\/strong> is a small rented computer in another country. It runs all day.<\/li>\n<\/ul>\n<p>Each part talks to an AI company over the internet. From Hong Kong, some of those companies do not answer.<\/p>\n<p>If you choose your tools before you know which ones answer, you build a system you cannot reach. Annie lost about a week to one of these blocks. This module helps you avoid that.<\/p>\n<p><strong>Three words you will hear all day:<\/strong><\/p>\n<ul>\n<li><strong>VPN.<\/strong> A VPN sends your internet traffic through a computer in another country. The AI company then sees that country, not Hong Kong.<\/li>\n<li><strong>API.<\/strong> An API is how a program talks to an AI company. A person types in a chat window. A program uses an API instead. Your builder and your bot both use one.<\/li>\n<li><strong>Open-weight model.<\/strong> An AI model whose makers publish it, so many companies can run it. DeepSeek, Qwen, GLM and Kimi are open-weight models. They answer from Hong Kong.<\/li>\n<\/ul>\n<p>Module 03 adds three more words: harness, AI provider and AI model.<\/p>\n<p><strong>The block comes from the AI companies, not from Hong Kong.<\/strong><\/p>\n<ul>\n<li>Many people think the Hong Kong government blocks these tools. It does not.<\/li>\n<li>Hong Kong's internet is open. You can reach any website.<\/li>\n<li>The AI companies choose not to serve Hong Kong. Their own pages give no reason.<\/li>\n<li>So the check happens at the company, every time you send a request.<\/li>\n<\/ul>\n<\/section>\n<section class=\"card\" id=\"short-01-s4\"><h2><span class=\"num\">01.4<\/span> Which AI Tools Work From Hong Kong<\/h2><p>This table was checked on 2 October 2026. The Anthropic, OpenAI and opencode rows were checked again on 9 October 2026.<\/p>\n<p><strong>What works can change, so the date matters.<\/strong> In March 2026 the Gemini row changed from blocked to open. Annie's own notes stayed wrong until someone checked. Check this table again in the week before you teach it.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>Company or tool<\/th>\n<th>From a Hong Kong connection<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Google Gemini (consumer app)<\/td>\n<td>Works directly<\/td>\n<td>Web from 16 March 2026, mobile from 27 March 2026 (Hong Kong Free Press, 16 Mar 2026). The paid Pro tier works too. A seminar room in Hong Kong paid for it on 6 October 2026.<\/td>\n<\/tr>\n<tr>\n<td>Google AI Studio, Antigravity and other Google developer tools<\/td>\n<td>Blocked<\/td>\n<td>Consumer Gemini is open. The developer tools are not.<\/td>\n<\/tr>\n<tr>\n<td>Anthropic: claude.ai, the Claude apps, Claude Code and the API<\/td>\n<td>Blocked<\/td>\n<td>Hong Kong is not on Anthropic's list of supported countries (checked 9 Oct 2026). The phone apps are blocked too. Tested on Android with the VPN off on 27 Aug 2026.<\/td>\n<\/tr>\n<tr>\n<td>OpenAI: ChatGPT and the API<\/td>\n<td>Blocked<\/td>\n<td>Hong Kong is not on OpenAI's list of supported countries (checked 9 Oct 2026). OpenAI refuses Hong Kong phone numbers at sign-up (PTS Consulting, seen 2 Oct 2026).<\/td>\n<\/tr>\n<tr>\n<td>DeepSeek, Kimi (Moonshot), GLM (Zhipu), Qwen (Alibaba)<\/td>\n<td>Work directly<\/td>\n<td>Open-weight models. You can reach them directly, or through a company that resells them.<\/td>\n<\/tr>\n<tr>\n<td>opencode Go (a monthly AI provider plan)<\/td>\n<td>Works directly<\/td>\n<td>It answered from Hong Kong on 30 Sep 2026 and again on 9 Oct 2026. Annie's three bots use it. Its model list also has one Claude model. The routes to Claude are explained later in this module.<\/td>\n<\/tr>\n<tr>\n<td>OpenRouter (a company that resells many models)<\/td>\n<td>Works for open-weight models only<\/td>\n<td>Annie tested her OpenRouter key. Every Anthropic, OpenAI and Google model returned a 403 error, &quot;provider Terms of Service&quot;, even for a plain hello. The open-weight models answered on the same key.<\/td>\n<\/tr>\n<tr>\n<td>Mistral, Grok, Perplexity, Microsoft Copilot<\/td>\n<td>Reported to work directly<\/td>\n<td>Not tested for this course. Facilitator: test these before teaching, or remove the row.<\/td>\n<\/tr>\n<tr>\n<td>Telegram, Tailscale, Obsidian<\/td>\n<td>Work directly<\/td>\n<td>The messaging app, the private network and the notes app. None of them is an AI company.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>There are three kinds of block. A fix for one does not fix the others.<\/strong><\/p>\n<ol>\n<li><strong>Your connection.<\/strong> The company sees a Hong Kong address and refuses. A VPN or your own server fixes this one.<\/li>\n<li><strong>Your sign-up details.<\/strong> OpenAI refuses Hong Kong phone numbers. A VPN does not change your phone number.<\/li>\n<li><strong>Your billing address.<\/strong> In May 2026, Anthropic's developer website did not accept a Hong Kong billing address. A VPN changed nothing, because the check was on the card, not the connection. Annie's system stopped using that service on 25 September 2026. So you may never need it. It is still worth knowing, because it cost her a week.<\/li>\n<\/ol>\n<\/section>\n<section class=\"card\" id=\"short-01-s5\"><h2><span class=\
