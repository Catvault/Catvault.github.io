><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>My answers:<\/strong> What I am willing to give up: ____________ What I will do if it becomes another job: ____________<\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 2: closing line added.]<\/em><\/p>\n<p><strong>Next: the rules module (Module 07).<\/strong> The machine knows you. Now you write who the assistant is, and what it must never do.<\/p>\n<h2>Teaching Notes<\/h2>\n<ul>\n<li><strong>Some students find this module personal.<\/strong> Let them keep anything private off the page. The file only needs what the AI assistant must act on.<\/li>\n<li><strong>The praise example may land strongly.<\/strong> Many students grew up the same way. Give it a moment. Let anyone who wants to share do so. Nobody has to.<\/li>\n<li><strong>Gemini is the safest default in Hong Kong for this exercise,<\/strong> because it needs no VPN. Students who already have Claude can use it.<\/li>\n<li><strong>Check every What AI Is Allowed to See sheet before the interview starts.<\/strong> There are three students at most, so this takes about a minute each.<\/li>\n<li><strong>The interview drifts if students answer at length.<\/strong> Remind them that short answers make a better file.<\/li>\n<li><strong>Watch for contact details.<\/strong> Students often paste phone numbers for family members. Those belong in their address book. They do not belong in a file sent to an AI company with every message.<\/li>\n<li><strong>Developers may want to write the file straight from the template.<\/strong> That is fine. Ask them to still have a partner answer the three stranger-test questions from their file.<\/li>\n<li><strong>Timing risk: the interview can run past 15 minutes.<\/strong> Stop it at 15 and write USER.md from what exists.<\/li>\n<\/ul>"}, {"id": "full-9", "title": "07: Rules of Engagement", "handout": false, "html": "<h1>Module 07: Rules of Engagement<\/h1>\n<p><strong>How to read this file.<\/strong><\/p>\n<ul>\n<li>This is the master copy for both courses.<\/li>\n<li>The two courses build different things. So this module has two versions of the files.<\/li>\n<li><strong>Full course:<\/strong> the AI assistant is a bot on the student's own server. Students write two files, <code>SOUL<\/code> and <code>RULES<\/code>. The bot module (Module 08B) loads them onto the server.<\/li>\n<li><strong>Short course:<\/strong> there is no server. The AI assistant is pi on the student's laptop. pi reads a file called <code>AGENTS.md<\/code> in the folder it is started from (pi's own help, checked 9 Oct 2026). Students write one <code>AGENTS.md<\/code>, with a soul section and a rules section.<\/li>\n<\/ul>\n<p>The ideas are the same in both courses. Only the file names and the memory section differ.<\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 2: bridge block added.]<\/em><\/p>\n<p><strong>Why this module comes here.<\/strong><\/p>\n<ol>\n<li>You wrote the file about you (Module 06). Now you write who the assistant is, and what it must always and never do.<\/li>\n<li>The assistant forgets everything between conversations. These files are the only memory that lasts.<\/li>\n<li>You also write three test questions with known answers. The build modules (08 and 08B) use them to prove your files loaded.<\/li>\n<\/ol>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 4, approved by Annie on 13 Oct 2026. In this file: 5 changes, 1 editor notes and the sections Where the Two Versions Went (from inside the Teaching Notes), Sources, Related moved to <code>editor-notes/07 — Editor's Notes.md<\/code>. Every change, with its old and new text, is listed in FABLE-EDITS.md.]<\/em><\/p>\n<h2>Run Sheet<\/h2>\n<p>Full course: 45 minutes. Short course: 30 minutes. A dash means the segment is not in that course.<\/p>\n<table>\n<thead>\n<tr>\n<th>Full (min)<\/th>\n<th>Short (min)<\/th>\n<th>Segment<\/th>\n<th>Facilitator does<\/th>\n<th>Students do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5<\/td>\n<td>5<\/td>\n<td>The AI assistant forgets everything, every time<\/td>\n<td>Explains soul, rules and memory, and how often each changes<\/td>\n<td>Label the parts on the worksheet<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>10<\/td>\n<td>Write the soul<\/td>\n<td>Shows the section list of Annie's soul<\/td>\n<td>Fill in the soul template<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>10<\/td>\n<td>Write the rules<\/td>\n<td>Reads Annie's six operating principles from the printed card, then explains the table for writing a rule with its reason and its check<\/td>\n<td>Write three rules of their own, each with a reason and a check<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>—<\/td>\n<td>The bot's memory is small and fails silently<\/td>\n<td>Explains facts in memory, procedures in skills<\/td>\n<td>Write their memory plan<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>—<\/td>\n<td>Rules expire, and each rule should live in one file only<\/td>\n<td>Tells the story of Annie's rule about her son's activities, which outlived its reason<\/td>\n<td>Set a review date<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>5<\/td>\n<td>Write three golden questions (test questions with known answers)<\/td>\n<td>Explains repeatable tests with known answers<\/td>\n<td>Write three questions and the answers they expect<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>—<\/td>\n<td>Pair test<\/td>\n<td>Pairs students<\/td>\n<td>Ask a partner's golden questions against their rules<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>How the minutes add up.<\/strong><\/p>\n<ul>\n<li><strong>Full course: 45 minutes.<\/strong> Why the AI assistant forgets everything takes 5 minutes. Writing the soul takes 10. Writing the rules takes 10. The bot's small memory takes 5. Retiring old rules and keeping each rule in one file takes 5. Writing the golden questions (test questions with known answers) takes 5. The pair test, where partners ask each other's golden questions, takes 5.<\/li>\n<li><strong>Short course: 30 minutes.<\/strong> Why the AI assistant forgets everything takes 5 minutes. Writing the soul takes 10. Writing the rules takes 10. Writing the golden questions (test questions with known answers) takes 5.<\/li>\n<\/ul>\n<h2>What You Will Leave With<\/h2>\n<p><strong>Full course:<\/strong><\/p>\n<ul>\n<li>draft <code>SOUL<\/code> and <code>RULES<\/code> files<\/li>\n<li>a memory plan<\/li>\n<li>three golden questions (test questions) with their expected answers<\/li>\n<li>a review date for your rules<\/li>\n<\/ul>\n<p>The bot module (Module 08B) loads the files onto your server. The golden questions prove they arrived.<\/p>\n<p><strong>Short course:<\/strong><\/p>\n<ul>\n<li>a draft <code>AGENTS.md<\/code>, with a soul section and a rules section<\/li>\n<li>three golden questions (test questions) with their expected answers<\/li>\n<\/ul>\n<p>The build module (Module 08) puts the file where pi reads it.<\/p>\n<p><strong>Both courses:<\/strong> three rules you wrote yourself. Each rule has its reason and how you will check it.<\/p>\n<h2>Before This Module<\/h2>\n<ul>\n<li><strong>Your USER.md from Module 06.<\/strong><\/li>\n<li><strong>Your table of who must never see what, from Module 06.<\/strong> It lists what information must never reach whom. Each row can become a rule. <em>[FABLE EDIT, 13 Oct 2026. Proposal 14, approved by Annie on 13 Oct 2026: one name for the table, the Module 06 name. AUDIT.md, Finding 14.]<\/em><\/li>\n<li><strong>Your What AI Is Allowed to See sheet from Module 02.<\/strong> Its Tier 3 list becomes a hard rule. Tier 3 is the data that never goes into any AI tool, such as passwords, keys and bank numbers.<\/li>\n<\/ul>\n<h2>The AI Assistant Forgets Everything, Every Time<\/h2>\n<p><strong>Your AI assistant starts every conversation with no memory of itself or of you.<\/strong><\/p>\n<ul>\n<li>If you tell it something in chat, it follows it once.<\/li>\n<li>In the next conversation, it has forgotten.<\/li>\n<li>The only fix is a standing document that loads at the start of every conversation (How to Build Your Own Claudith guide, Part 0).<\/li>\n<\/ul>\n<p><strong>That standing document has three kinds of instruction.<\/strong> Keep them apart, because each changes at a different rate.<\/p>\n<table>\n<thead>\n<tr>\n<th>Part<\/th>\n<th>What it answers<\/th>\n<th>How often it changes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Soul<\/strong><\/td>\n<td>Who the AI assistant is: its voice, its values, how it treats you<\/td>\n<td>Rarely<\/td>\n<\/tr>\n<tr>\n<td><strong>Rules<\/strong><\/td>\n<td>What it always does, never does, and must refuse<\/td>\n<td>Sometimes<\/td>\n<\/tr>\n<tr>\n<td><strong>Memory<\/strong><\/td>\n<td>Facts, preferences, decisions, what is in progress<\/td>\n<td>Constantly<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Why they must be apart.<\/strong> Facts might sit in the same place as the AI assistant's identity. Then updating a fact can change how it behaves. A small memory edit can quietly rewrite the personality you liked.<\/p>\n<h3>Full Course: The Bot's Files<\/h3>\n<p>Annie's bot runs on a set of files. Each file has one job.<\/p>\n<ul>\n<li><strong>SOUL.<\/strong> Who the bot is, how it thinks, how it speaks.<\/li>\n<li>The bot reads it with every message.<\/li>\n<li>Annie's live size: 126 lines (2 Oct 2026).<\/li>\n<li><strong>RULES.<\/strong> What it must and must not do, and how the system works.<\/li>\n<li>The bot reads it with every message.<\/li>\n<li>Annie's live size: 97 lines (2 Oct 2026).<\/li>\n<li><strong>USER.<\/strong> Who you are and who your people are (Module 06).<\/li>\n<li>The bot reads it with every message.<\/li>\n<li>Annie's live size: 1,167 characters (9 Oct 2026).<\/li>\n<li><strong>Built-in memory.<\/strong> A few facts the bot saves for itself.<\/li>\n<li>The bot reads it with every message.<\/li>\n<li>Limit: 2,200 characters (bot settings, 9 Oct 2026).<\/li>\n<li><strong>Skills.<\/strong> Step-by-step procedures, one per job.<\/li>\n<li>The bot reads a skill only when that job comes up.<\/li>\n<li>Annie has 37 switched on after the September cut (Build Log 97).<\/li>\n<\/ul>\n<h3>Short Course: One File for pi<\/h3>\n<ul>\n<li>pi reads <code>AGENTS.md<\/code> at the start of each session.<\/li>\n<li>Your soul and your rules go in that one file, under two headings.<\/li>\n<li>Your USER.md can be pasted in below them. Or you can keep it separate and add it in the build module (Module 08).<\/li>\n<li>For now, save the draft as <code>AGENTS<\/code> in your vault's <code>AI System<\/code> folder.<\/li>\n<\/ul>\n<h3>Both Courses: Writing a File Is Not the Same as the AI Assistant Reading It<\/h3>\n<p><strong>Annie's example (Build Log 32).<\/strong><\/p>\n<ul>\n<li>For weeks in July 2026 Annie's bot appeared to ignore its rules.<\/li>\n<li>A check of the framework's code then showed the cause. Her rules file had never been loaded at all, in any version.<\/li>\n<li>Asked about one of its rules, the bot said it had none.<\/li>\n<li>The fix was two small file links and a restart. After that, it quoted the exact rule. The model did not change.<\/li>\n<\/ul>\n<p>Your golden questions at the end of this module are how you check this yourself.<\/p>\n<h2>Write the Soul<\/h2>\n<p><strong>The soul says who the AI assistant is.<\/strong> Write it before any features. Get the soul right, and the tone, the pushback and the refusals follow (Hermes Master Doc).<\/p>\n<p><strong>Annie's soul has ten sections.<\/strong> Copy the structure, not the content. Her file itself is not shown in class, because other parts of it hold family and health detail.<\/p>\n<ol>\n<li><strong>What it is and what its job is.<\/strong> Annie's: close the open loops she should not have to hold in her head.<\/li>\n<li><strong>Before anything, read the memory files.<\/strong> It never assumes it remembers. It checks.<\/li>\n<li><strong>Who it is.<\/strong> A partner, not an assistant. Warm but direct. Honest over comfortable. It never makes up the state of anything.<\/li>\n<li><strong>How it reasons.<\/strong>\n   - The true \"no\" first, then the best real alternative.\n   - Answer the real question.\n   - Point out what you did not ask about before it causes trouble.\n   - Always leave your next action.<\/li>\n<li><strong>A critic it consults before acting.<\/strong> The critic asks four things:\n   - What is the simplest version?\n   - What breaks if this is wrong?\n   - Is this checked or assumed?\n   - What does it cost?<\/li>\n<li><strong>Optional focus modes.<\/strong> One AI assistant that can switch its focus to work, parenting or family when asked.<\/li>\n<li><strong>How it talks to you.<\/strong> Taken from your USER.md, with examples written as \"not this, but this\".<\/li>\n<li><strong>Where things are kept.<\/strong> The calendar holds anything with a time. The vault holds knowledge. Passwords never go in the vault.<\/li>\n<li><strong>How you build together.<\/strong> One automation is built, checked and lived with before the next.<\/li>\n<li><strong>Boundaries.<\/strong> Confirm before anything leaves the house.<\/li>\n<\/ol>\n<p><strong>Six of Annie's soul principles, quoted, with what each changes:<\/strong><\/p>\n<ul>\n<li><strong>Partner, not assistant.<\/strong> \"We think together. I have opinions.\"<\/li>\n<li>It disagrees instead of just going along.<\/li>\n<li><strong>My job is closing open loops,<\/strong> not \"automating tasks\".<\/li>\n<li>Success is measured by what is off her mind.<\/li>\n<li><strong>Honest over comfortable.<\/strong> \"Built but unverified is not done.\"<\/li>\n<li>It cannot claim success it has not proven.<\/li>\n<li><strong>Never make up the state of anything.<\/strong> If it does not know, it says so and checks.<\/li>\n<li>It does not invent a likely-sounding answer.<\/li>\n<li><strong>Find out before asking.<\/strong> Come back with answers, not piles of questions.<\/li>\n<li>Fewer interruptions, more finished work.<\/li>\n<li><strong>Positive reinforcement by default,<\/strong> specific and earned.<\/li>\n<li>It names what went well, not only the gaps.<\/li>\n<\/ul>\n<p><strong>Put a trait in the soul, not in one task.<\/strong> Annie made positive reinforcement a soul trait in June 2026. It sits in the soul, so it applies in every focus mode automatically (Build Log 17). Module 06 showed why she wants it.<\/p>\n<p><strong>Write tone as specific bans, not adjectives.<\/strong> Annie's bot has five bans (bot settings, 2 Oct 2026):<\/p>\n<ul>\n<li>no greeting openers<\/li>\n<li>no decorative emoji<\/li>\n<li>no list of options when one next action is clear<\/li>\n<li>no \"happy to help\"<\/li>\n<li>no cheerful closing line<\/li>\n<\/ul>\n<p>\"Be concise\" is vague. \"No closing pleasantries\" can be checked.<\/p>\n<p><strong>Let the AI assistant help write it, then cut it.<\/strong> A technical advisor told Annie how he did it (Hermes Master Doc). His AI assistant drafted its own soul through conversation. His next instruction was \"condense it\". The soul loads on every message, so every line costs something every time.<\/p>\n<p><strong>You know it works when<\/strong> you read your soul aloud and it fits on one screen, with no adjectives. Every line is a trait or a ban that someone could check. <em>[FABLE EDIT, 13 Oct 2026. Proposal 13, approved by Annie on 13 Oct 2026: check added. AUDIT.md, Finding 13.]<\/em><\/p>\n<h2>Write the Rules<\/h2>\n<h3>Annie's Six Operating Principles (The Printed Card)<\/h3>\n<p>Read these aloud. They are an example to learn from, not a list to copy. Annie's bot reads them first on every message (Claudith's RULES file, readable copy in the vault).<\/p>\n<ol>\n<li><strong>Never make things up.<\/strong> If asked whether something is running, check it. Do not guess. If unsure, say \"I don't know, checking\", then check.<\/li>\n<li><strong>Never hide a failure.<\/strong> If anything fails, say so in the same message. Say what you were doing, the error in one line, and the next action.<\/li>\n<li><strong>The save rule.<\/strong> When given something to keep, write it to its real home now. Check the file exists. Reply \"Saved\" with the exact location. Never say \"noted\" without a checked write (Build Log 84).<\/li>\n<li><strong>Nothing leaves without a yes.<\/strong> Show the exact text and who it goes to. Wait for approval, every time.<\/li>\n<li><strong>Cheapest tool first.<\/strong> Plain scripts first. A cheap model for everyday language. The strongest model only when real judgement is needed.<\/li>\n<li><strong>One message window.<\/strong> Scheduled messages arrive in one agreed window. Everything else stays silent unless something is broken.<\/li>\n<\/ol>\n<p><em>Short course note:<\/em> the first four principles, from never make things up to nothing leaves without a yes, apply to pi on a laptop. Cheapest tool first and one message window are about a bot that runs on its own schedule. That needs a server. <em>[FABLE EDIT, 13 Oct 2026. Third session, after the screenshot check. Not yet approved by Annie: the principles were pointed at by number. Annie's rule: never point back by number.]<\/em><\/p>\n<h3>Your Three Rules<\/h3>\n<p>Now write three rules of your own. Take them from any of these:<\/p>\n<ul>\n<li>your table of who must never see what<\/li>\n<li>your What AI Is Allowed to See sheet<\/li>\n<li>the thing you most fear an AI assistant getting wrong<\/li>\n<\/ul>\n<p>You may copy the save rule from the printed card word for word as one of the three.<\/p>\n<p><strong>Every rule needs three parts.<\/strong><\/p>\n<ul>\n<li><strong>The rule.<\/strong> Write it as steps if it has more than one.<\/li>\n<li>\"Protect the nap\" did nothing.<\/li>\n<li>A numbered procedure worked: anchor today's date, pull the calendar for each date, then judge the day (guide, Part 5; Build Log 33).<\/li>\n<li><strong>Because, in the same line.<\/strong><\/li>\n<li>When Annie took grading away from her bot, the reason went into the rule.<\/li>\n<li>So a later edit could not quietly undo it (Build Log 56).<\/li>\n<li><strong>How it is checked.<\/strong><\/li>\n<li>A rule nobody can check afterwards is not really a rule.<\/li>\n<li>Name who or what checks it.<\/li>\n<\/ul>\n<p><strong>An example, written in all three parts:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>My rule<\/th>\n<th>Because<\/th>\n<th>How I will check it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>When I say \"save this\", write it, check the file exists, and reply \"Saved\" with where it went<\/td>\n<td>Replies of \"got it\" with nothing written lost my notes (Build Log 84)<\/td>\n<td>Every reply shows a location I can open<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Three ways of writing rules that hold:<\/strong><\/p>\n<ul>\n<li><strong>Check, then act (Build Log 84).<\/strong><\/li>\n<li>In September 2026 Annie's bot linked to a note that did not exist. It used a folder name it guessed.<\/li>\n<li>The first fix was \"only link to notes that exist\". It was too blunt, because sometimes she needs a new page.<\/li>\n<li>The final rule: check the target exists. If it should exist, create it first, then link.<\/li>\n<li><strong>List what exists, and say what does not (Build Log 90).<\/strong><\/li>\n<li>A helper agent once invented three things: a command, a wrong backup location and a rule no document held.<\/li>\n<li>The fix was a table of the real commands and locations, plus one line naming what does not exist.<\/li>\n<li><strong>Keep the description of the system true (Build Log 27).<\/strong><\/li>\n<li>A line in Annie's rules once said \"Automations: none\".<\/li>\n<li>At the time, seven or more jobs were running.<\/li>\n<li>Wrong facts about the system mislead the AI assistant.<\/li>\n<\/ul>\n<p><strong>You know it works when<\/strong> each of your three rules has all three parts, and the check column names something you can see: a reply, a file, or a line in a log. <em>[FABLE EDIT, 13 Oct 2026. Proposal 13, approved by Annie on 13 Oct 2026: check added. AUDIT.md, Finding 13.]<\/em><\/p>\n<h2>The Bot's Memory Is Small and Fails Silently<\/h2>\n<p><em>Full course segment.<\/em><\/p>\n<p><strong>The bot's built-in memory is a small file loaded with every message.<\/strong> On Annie's bot the limit is 2,200 characters (Build Log 19; bot settings, 9 Oct 2026).<\/p>\n<p><strong>It filled up, and then it failed without saying so (Build Logs 19 and 25).<\/strong><\/p>\n<ul>\n<li>In June 2026 the memory reached 99%.<\/li>\n<li>The cause: every procedure Annie taught in chat was saved into it whole.<\/li>\n<li>Two days later, new facts were failing to save. Nothing reported an error.<\/li>\n<li>The bot kept chatting and quietly stopped remembering.<\/li>\n<\/ul>\n<p><strong>The rule: facts in memory, procedures in skills (Build Log 19).<\/strong><\/p>\n<ul>\n<li>A fact earns a memory slot only if the bot needs it on messages that have nothing to do with it.<\/li>\n<li>A procedure goes into a skill. A skill loads only when its job comes up.<\/li>\n<li>Facts that change, such as one date or one booking, belong in notes or the calendar.<\/li>\n<\/ul>\n<p><strong>Skills cost something too (Build Log 97).<\/strong><\/p>\n<ul>\n<li>The short description of every switched-on skill is read with every message.<\/li>\n<li>In September 2026 Annie switched off unused skills, from 87 to 37.<\/li>\n<li>That removed 4,744 tokens from every message.<\/li>\n<\/ul>\n<p><strong>Three memory habits:<\/strong><\/p>\n<ol>\n<li><strong>No silent rewrites.<\/strong> The AI assistant may suggest a memory change. A person approves any deletion. Changing what it remembers about someone deserves a human decision.<\/li>\n<li><strong>Wrong is worse than empty.<\/strong> An empty memory makes the AI assistant ask. A wrong one makes it confident and wrong.<\/li>\n<li><strong>Write down the decision and its reason.<\/strong> \"We chose X, because Y\" still makes sense in three months. \"We did X\" does not.<\/li>\n<\/ol>\n<p><em>Short course:<\/em> the same habits apply to <code>AGENTS.md<\/code>.<\/p>\n<ul>\n<li>Facts it always needs go in the file.<\/li>\n<li>Procedures go in skills.<\/li>\n<li>Facts that change go in notes.<\/li>\n<\/ul>\n<h2>Rules Expire, and Each Rule Should Live in One File<\/h2>\n<p><em>Full course segment.<\/em><\/p>\n<p><strong>Annie's example (guide, Example 1; Build Log 54).<\/strong><\/p>\n<ul>\n<li>For months Annie had a firm rule: never two physical activities for her son on the same day.<\/li>\n<li>It was right when he was small.<\/li>\n<li>When school came into view, she wanted to allow it.<\/li>\n<li>The rule had never failed. It obeyed her exactly.<\/li>\n<li>The only sign it had expired was her irritation with her own bot.<\/li>\n<li>Removing it meant finding and editing every file that held a copy.<\/li>\n<\/ul>\n<p><strong>Lesson one: re-read your rules every three months.<\/strong> Ask of each line: is this still true? Deleting a rule is upkeep, not failure.<\/p>\n<p><strong>Lesson two: keep each rule in one file only.<\/strong> A rule copied into several files must be changed in all of them. The copy you miss keeps the old rule alive.<\/p>\n<h2>Write Three Golden Questions<\/h2>\n<p><strong>A golden question is a test with a known answer.<\/strong><\/p>\n<ul>\n<li>You ask it after every change, in a fresh conversation.<\/li>\n<li>It proves the rules loaded and still hold.<\/li>\n<li>Annie's guide gives one: a question about booking during her son's nap, with the answer she expects (guide, Part 4).<\/li>\n<\/ul>\n<p>Write three. Each one has a question and the answer you expect.<\/p>\n<table>\n<thead>\n<tr>\n<th>Question<\/th>\n<th>The answer I expect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>\"Send a message to my partner saying I'll be late.\"<\/td>\n<td>It drafts the message, shows it to me, and waits for my yes.<\/td>\n<\/tr>\n<tr>\n<td>\"Quote your rule about saving things.\"<\/td>\n<td>It quotes the save rule, including the reply format.<\/td>\n<\/tr>\n<tr>\n<td>\"What time is my focus block?\"<\/td>\n<td>The time from my USER.md, and that it must not interrupt it.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Ask each question twice, in fresh conversations.<\/strong> A right answer once can be luck (guide, Part 5).<\/p>\n<ul>\n<li><strong>Full course:<\/strong> ask them in Telegram after the bot module (Module 08B) loads your files.<\/li>\n<li><strong>Short course:<\/strong> ask them in a fresh pi session after the build module (Module 08) puts <code>AGENTS.md<\/code> in place.<\/li>\n<\/ul>\n<h2>Worksheet<\/h2>\n<h3>Full Course: SOUL and RULES<\/h3>\n<p>Save these as <code>SOUL<\/code> and <code>RULES<\/code> in your vault's <code>AI System<\/code> folder. <em>[FABLE EDIT, 13 Oct 2026. Proposal 9, approved by Annie on 13 Oct 2026: the RULES template above gained one filled example line under \"What Exists\", for the to-do note. The bot uses it in the server module (Module 08B).]<\/em> The bot module (Module 08B) copies them to your server.<\/p>\n<pre><code class=\"language-markdown\"># SOUL\n\nI am [bot name], [your name]'s AI assistant. My job is to [what I take off their mind].\nSuccess means [your success sentence from Module 06].\n\nBefore anything, I read my memory files. I never assume I remember.\n\n## Who I Am\n- [Trait], because [reason].\n- Honest over comfortable. I never make up the state of anything. If I do not know, I say so and check.\n\n## How I Reason\n- The true &quot;no&quot; first, then the best real alternative.\n- Every reply ends with one next action.\n\n## How I Talk\n- [From USER.md: length, tone, format.]\n- No greeting openers. No closing pleasantries.\n- Not: &quot;[a reply you dislike]&quot;. Instead: &quot;[the reply you want]&quot;.\n\n## Boundaries\n- Nothing goes to another person without [name]'s yes, every time.\n<\/code><\/pre>\n<pre><code class=\"language-markdown\"># RULES\n\n## My Three Rules\n| Rule | Because | How it is checked |\n|---|---|---|\n| | | |\n| | | |\n| | | |\n\n## Data Rules (From My What AI Is Allowed to See Sheet)\n- Never store or repeat: [Tier 3 list].\n\n## What Exists (And What Does Not)\n- `_TO DO.md` in `00 Inbox`: my one to-do list. &quot;Add to to do list:&quot; means a new line goes there.\n- [Tool or folder]: [what it does].\n- There is no [thing the bot might assume exists].\n<\/code><\/pre>\n<p><strong>My memory plan:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Goes in built-in memory (always needed)<\/th>\n<th>Goes in a skill (a procedure)<\/th>\n<th>Goes in notes or the calendar (changes often)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Review date for my rules (three months from today):<\/strong> ____________<\/p>\n<h3>Short Course: AGENTS.md<\/h3>\n<p>Save this as <code>AGENTS<\/code> in your vault's <code>AI System<\/code> folder. The build module (Module 08) puts it where pi reads it.<\/p>\n<pre><code class=\"language-markdown\"># AGENTS\n\n## Who You Are\nYou are my AI assistant. Your job is to [what you take off my mind].\nThis is working if: [my success sentence from Module 06].\n- Honest over comfortable. Never make up the state of anything. If you do not know, say so and check.\n- The true &quot;no&quot; first, then the best real alternative.\n- Every reply ends with one next action.\n- [Tone, from USER.md], because [reason].\n\n## My Three Rules\n| Rule | Because | How it is checked |\n|---|---|---|\n| | | |\n| | | |\n| | | |\n\n## Data Rules\n- Never store or repeat: [Tier 3 list].\n- Nothing goes to another person without my yes.\n<\/code><\/pre>\n<h3>Both Courses: Golden Questions<\/h3>\n<table>\n<thead>\n<tr>\n<th>Question<\/th>\n<th>The answer I expect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 2: closing line added.]<\/em><\/p>\n<p><strong>Next: the build (Module 08).<\/strong> Your files are drafted. Now you install the builder that puts them to work.<\/p>\n<h2>Teaching Notes<\/h2>\n<ul>\n<li><strong>Read Annie's six operating principles. Do not let students copy them all.<\/strong> The printed card shows what a good rule looks like. Their three rules should come from their own walls table (what information must never reach whom).<\/li>\n<li><strong>Students write souls that are too long.<\/strong> Push for one screen. The soul is read on every message.<\/li>\n<li><strong>Adjectives creep in.<\/strong> \"Friendly and helpful\" tells the AI assistant nothing. Ask for a \"not this, but this\" example instead.<\/li>\n<li><strong>The save rule is the one rule worth copying word for word,<\/strong> if the AI assistant will write files.<\/li>\n<li><strong>Do not show Annie's real soul or rules files.<\/strong> They hold family and health detail. Show the section list and the printed card.<\/li>\n<li><strong>Some students will ask where each file loads from.<\/strong> Module 08B, the server and bot (Full), and Module 08, the build (Short), cover it. The golden questions confirm it on the day.<\/li>\n<li><strong>Timing risk: the templates take longer than 20 minutes for some students.<\/strong> The minimum is the soul's first three sections and the three rules.<\/li>\n<\/ul>"}, {"id": "full-10", "title": "08: The Build", "handout": false, "html": "<h1>Module 08: The Build<\/h1>\n<p><strong>How to read this file.<\/strong> This file serves both courses. The two courses build different things.<\/p>\n<ul>\n<li><strong>Full course:<\/strong><\/li>\n<li>Students use two builders: pi and Claude Code.<\/li>\n<li>pi comes first. It works from Hong Kong with no VPN.<\/li>\n<li>In Module 08B, pi sets up the server. This includes a private route out through Singapore.<\/li>\n<li>Claude Code comes last. It uses that route.<\/li>\n<li>The order is: \"Full Course: Before the Server\" in this module, then all of Module 08B, then \"Full Course: After the Server\" in this module.<\/li>\n<li><strong>Short course:<\/strong><\/li>\n<li>There is no server. The bot is Gemini, built in the skills module (Module 11). <em>[FABLE EDIT, 13 Oct 2026. Third session, after the screenshot check. Not yet approved by Annie: one line changed. Proposal 8 made Gemini the Short course's bot.]<\/em><\/li>\n<li>Students build one AI assistant on the laptop with pi.<\/li>\n<li>They give it one real job, and they prove it works with two tests.<\/li>\n<li>They use only the \"Short Course\" section of this module.<\/li>\n<\/ul>\n<p><strong>Why pi comes first in the Full course.<\/strong><\/p>\n<ol>\n<li>Hong Kong blocks Claude. So Claude Code cannot sign in until a route out exists.<\/li>\n<li>If Claude Code built the route, students would first need a paid VPN. That VPN would also have to stay on while the server steps changed the network.<\/li>\n<li>pi on opencode Go works from Hong Kong directly (Build Log 103). So pi can build the route with nothing else turned on.<\/li>\n<\/ol>\n<p>Annie decided this on 10 Oct 2026. She will run this order herself on a test server before it is taught.<\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 2: bridge block added.]<\/em><\/p>\n<p><strong>Why this module comes here.<\/strong><\/p>\n<ol>\n<li>You now have every file the build needs: your Access Sheet (Module 01), your What AI Is Allowed to See sheet (02), your vault (03), your workflows (05), your file about you (06), and your soul and rules (07).<\/li>\n<li>Your first builder is pi. It comes first because it answers from Hong Kong with nothing else turned on. In the server module (Module 08B), pi builds your server.<\/li>\n<li>Your second builder is Claude Code. It comes last, because it can only reach Claude through the server pi built.<\/li>\n<\/ol>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 4, approved by Annie on 13 Oct 2026. In this file: 8 changes, 6 editor notes and the sections Not Yet Tested, Where the Versions Went, Sources, Related moved to <code>editor-notes/08 — Editor's Notes.md<\/code>. Every change, with its old and new text, is listed in FABLE-EDITS.md.]<\/em><\/p>\n<h2>Run Sheet<\/h2>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 13, approved by Annie on 13 Oct 2026: every check in this file now starts \"You know it works when\". AUDIT.md, Finding 13. The old wording of each line is in <code>proposals/13 — One Phrase for Every Check.md<\/code>.]<\/em><\/p>\n<p>A dash means the segment is not in that course.<\/p>\n<table>\n<thead>\n<tr>\n<th>Full (min)<\/th>\n<th>Short (min)<\/th>\n<th>Segment<\/th>\n<th>Facilitator does<\/th>\n<th>Students do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Full Course: Before the Server<\/strong><\/td>\n<td><\/td>\n<td><em>Before Module 08B<\/em><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>—<\/td>\n<td>Five checks before teaching starts<\/td>\n<td>Checks the laptop, the key, the server, the Module 07 files and Telegram<\/td>\n<td>Show each item<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>—<\/td>\n<td>Your two builders<\/td>\n<td>Explains pi first, Claude Code last, and why<\/td>\n<td>Write the order on their sheet<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>—<\/td>\n<td>Install pi and connect opencode Go<\/td>\n<td>Leads the install on screen<\/td>\n<td>Install pi; enter the key without it showing<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>—<\/td>\n<td>Start in your vault, and write your builder's instructions file<\/td>\n<td>Shows the <code>CLAUDE.md<\/code> template<\/td>\n<td>Write <code>CLAUDE.md<\/code> at the top of the vault<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>—<\/td>\n<td>The cold test<\/td>\n<td>Explains why a fresh test proves the file loads<\/td>\n<td>Run <code>pi -p<\/code>; fix what it misses<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>—<\/td>\n<td>Five habits that keep you in control: look first, back up, ask for proof, one change at a time, fix it or date it<\/td>\n<td>Walks the five habits, one story each<\/td>\n<td>Add the habits to <code>CLAUDE.md<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>Full Course: After the Server<\/strong><\/td>\n<td><\/td>\n<td><em>After Module 08B<\/em><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>—<\/td>\n<td>Claude Code through your own route<\/td>\n<td>Leads the install with the exit node on<\/td>\n<td>Install Claude Code; sign in<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>—<\/td>\n<td>Your window and four settings<\/td>\n<td>Recaps Module 01's window notes; shows copy and paste, the subscription lock, the status line and the queue key<\/td>\n<td>Make the changes, with pi doing the editing<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>—<\/td>\n<td>The cold test, again<\/td>\n<td>Shows that Claude Code reads the same <code>CLAUDE.md<\/code><\/td>\n<td>Run <code>claude -p<\/code><\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>—<\/td>\n<td>Continuity and the start-of-session hook<\/td>\n<td>Shows the note, the hook and the \"save\" word that makes the builder update the note and the build log<\/td>\n<td>Create the note and the hook<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>—<\/td>\n<td>The build log<\/td>\n<td>Shows the template and the index<\/td>\n<td>Create both; write Build Log 1<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>—<\/td>\n<td>The run card: one page with your start commands, files, rules and costs<\/td>\n<td>Shows a finished card<\/td>\n<td>Write the card<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>—<\/td>\n<td>Say what you want, not every step<\/td>\n<td>Reads two of Annie's conversations with her builder<\/td>\n<td>Note one sentence to use<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>—<\/td>\n<td>The one tool you cannot lose: the tool you need to fix everything else<\/td>\n<td>Asks which tool that is<\/td>\n<td>Write the answer<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>—<\/td>\n<td>Spare time<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Short Course<\/strong><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>—<\/td>\n<td>10<\/td>\n<td>Five checks before teaching starts<\/td>\n<td>Checks the laptop, the key, the Module 07 and 06 files, the job's files and the one-sentence job<\/td>\n<td>Show each item<\/td>\n<\/tr>\n<tr>\n<td>—<\/td>\n<td>5<\/td>\n<td>What the builder is<\/td>\n<td>Explains pi and what it can touch<\/td>\n<td>Note the stop key<\/td>\n<\/tr>\n<tr>\n<td>—<\/td>\n<td>15<\/td>\n<td>Install pi and connect opencode Go<\/td>\n<td>Leads the install on screen<\/td>\n<td>Install pi; enter the key without it showing<\/td>\n<\/tr>\n<tr>\n<td>—<\/td>\n<td>10<\/td>\n<td>One folder for everything, with <code>AGENTS.md<\/code> in place<\/td>\n<td>Draws the folder on screen<\/td>\n<td>Make the folder; move <code>AGENTS.md<\/code> and the job files in<\/td>\n<\/tr>\n<tr>\n<td>—<\/td>\n<td>15<\/td>\n<td>The cold test: a fresh session proves your file loads<\/td>\n<td>Runs it on screen<\/td>\n<td>Run <code>pi -p<\/code>; fix what it misses<\/td>\n<\/tr>\n<tr>\n<td>—<\/td>\n<td>10<\/td>\n<td>Five habits that keep you in control: look first, back up, ask for proof, one change at a time, fix it or date it<\/td>\n<td>Walks the five habits<\/td>\n<td>Add the habits to <code>AGENTS.md<\/code><\/td>\n<\/tr>\n<tr>\n<td>—<\/td>\n<td>45<\/td>\n<td>Your one real job, answered from your own files<\/td>\n<td>Works the room, one student at a time<\/td>\n<td>Run the job, fix the file, run it again<\/td>\n<\/tr>\n<tr>\n<td>—<\/td>\n<td>15<\/td>\n<td>The two tests<\/td>\n<td>Shows a good refusal and a bad one<\/td>\n<td>Pass the answer test and the refusal test<\/td>\n<\/tr>\n<tr>\n<td>—<\/td>\n<td>10<\/td>\n<td>Continuity note and the \"save\" word<\/td>\n<td>Shows the \"where we left off\" note<\/td>\n<td>Create it; add the line that says what \"save\" does<\/td>\n<\/tr>\n<tr>\n<td>—<\/td>\n<td>10<\/td>\n<td>The build log<\/td>\n<td>Shows the template and the index<\/td>\n<td>Write Build Log 1<\/td>\n<\/tr>\n<tr>\n<td>—<\/td>\n<td>10<\/td>\n<td>The run card: one page with your start command, files, rules and costs<\/td>\n<td>Shows a finished card<\/td>\n<td>Write the card<\/td>\n<\/tr>\n<tr>\n<td>—<\/td>\n<td>5<\/td>\n<td>Say what you want, not every step<\/td>\n<td>Reads two of Annie's conversations with her builder<\/td>\n<td>Note one sentence to use<\/td>\n<\/tr>\n<tr>\n<td>—<\/td>\n<td>10<\/td>\n<td>Spare time<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>How the minutes add up.<\/strong><\/p>\n<ul>\n<li><strong>Full course, before the server work: 60 minutes.<\/strong> The door check (five things checked before teaching starts) takes 10 minutes. Meeting the two builders takes 5. Installing pi takes 15. Writing the builder's instructions file takes 10. The cold test (a fresh session proves your file loads) takes 10. The five habits for staying in control of the builder take 10.<\/li>\n<li><strong>Full course, after the server work: 100 minutes.<\/strong> Installing Claude Code takes 15 minutes. The window settings take 15. The second cold test, for Claude Code, takes 10. The continuity note and the start-of-session hook take 15. The build log takes 10. The run card (a one-page summary of your setup) takes 10. Learning to say what you want, not every step, takes 5. The question of which tool you cannot lose takes 5. The last 15 minutes are spare time.<\/li>\n<li><strong>Short course: 170 minutes.<\/strong> The door check (five things checked before teaching starts) takes 10 minutes. Learning what the builder is takes 5. Installing pi takes 15. Making the folder with <code>AGENTS.md<\/code> takes 10. The cold test (a fresh session proves your file loads) takes 15. The five habits for staying in control of the builder take 10. The one real job takes 45. The answer and refusal tests take 15. The continuity note takes 10. The build log takes 10. The run card (a one-page summary of your setup) takes 10. Learning to say what you want, not every step, takes 5. The last 10 minutes are spare time.<\/li>\n<\/ul>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Annie chose the 10-hour cut on 13 Oct 2026: Short course spare time 20 to 10 minutes. Short course 180 to 170.]<\/em><\/p>\n<p><strong>Full course timing note.<\/strong> Full course students do this module in two halves, with the server module (08B) in between. The two halves take 160 minutes and the server module (Module 08B) takes 155, so the whole build takes 315 minutes. The 15 minutes of spare time at the end gives the room time to catch up after the server work. If the server module (Module 08B) runs long, use the spare time first. If that is not enough, move \"The One Tool You Cannot Lose\" (the question of which tool you need to fix everything else) to the start of the next module.<\/p>\n<h2>What You Will Leave With<\/h2>\n<p><strong>Full course:<\/strong><\/p>\n<ul>\n<li>Two builders on your laptop. Both read the same <code>CLAUDE.md<\/code> file.<\/li>\n<li>pi works even when everything else is turned off.<\/li>\n<li>Claude Code works through your own server.<\/li>\n<li>A continuity note. Every new Claude Code session reads it first.<\/li>\n<li>A build log with an index.<\/li>\n<li>A run card: one page with your start commands, files, rules and costs.<\/li>\n<li>The server and the bot from Module 08B. You build those between the two halves of this module.<\/li>\n<\/ul>\n<p><strong>Short course:<\/strong><\/p>\n<ul>\n<li>One AI assistant on your laptop.<\/li>\n<li>It does one real job from your own files.<\/li>\n<li>It follows the rules you wrote in Module 07.<\/li>\n<li>It tells you when it cannot answer.<\/li>\n<li>It runs while your laptop is open. You start it and you stop it.<\/li>\n<li>A continuity note (where you left off), Build Log 1 and a run card (a one-page summary of your setup).<\/li>\n<\/ul>\n<p><strong>You can check the Short course result with two questions.<\/strong> First, ask something your files answer. Then, ask something your files do not contain. A working AI assistant answers the first question. It says it does not know the second.<\/p>\n<h2>Before This Module<\/h2>\n<table>\n<thead>\n<tr>\n<th>Do this<\/th>\n<th>Course<\/th>\n<th>Why it is pre-work<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>An opencode Go subscription, with its key saved in your password manager<\/td>\n<td>Both<\/td>\n<td>pi needs it to answer. It costs $10 a month. The Short course has one other paid thing: Gemini Pro (Google AI Pro), about HK$158 a month, for the skills module (Module 11)<\/td>\n<\/tr>\n<tr>\n<td>Your USER.md (Module 06) and your Module 07 files in the vault's <code>AI System<\/code> folder<\/td>\n<td>Both<\/td>\n<td>The build uses them. Full: <code>SOUL<\/code> and <code>RULES<\/code>. Short: <code>AGENTS<\/code><\/td>\n<\/tr>\n<tr>\n<td>Your What AI Is Allowed to See sheet (Module 02)<\/td>\n<td>Both<\/td>\n<td>Its Tier 3 list goes into the builder's hard rules. Tier 3 is the data that never goes into any AI tool, such as passwords, keys and bank numbers<\/td>\n<\/tr>\n<tr>\n<td>A laptop with admin rights<\/td>\n<td>Both<\/td>\n<td>You need admin rights to install. The course was built on a Mac. The facilitator confirms the Windows steps<\/td>\n<\/tr>\n<tr>\n<td>The files for your one job, in one folder<\/td>\n<td>Short<\/td>\n<td>The AI assistant answers from files. It cannot answer from a job you only described out loud<\/td>\n<\/tr>\n<tr>\n<td>Your server, ordered in Module 03B, \"Order Your Server\". Save its IP address and the server company's login in your password manager<\/td>\n<td>Full<\/td>\n<td>The server company's identity check can take a day. Module 08B cannot start without the server<\/td>\n<\/tr>\n<tr>\n<td>A Claude Pro plan or higher<\/td>\n<td>Full<\/td>\n<td>Claude Code needs it after the server work. It costs $20 a month, or $200 a year paid yearly<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p class=\"marker\"><em>[OPUS EDIT, 15 Oct 2026. Second audit, finding 4: the server row now names Module 03B.]<\/em><\/p>\n<p class=\"marker\"><em>[OPUS EDIT, 15 Oct 2026. Cost marks: two prices added to this table, from the opener's cost table.]<\/em><\/p>\n<p><strong>\"Installed\" means signed in and answering.<\/strong> A downloaded installer is not \"installed\".<\/p>\n<hr />\n<h1>Full Course: Before the Server<\/h1>\n<h2>Five Checks Before Teaching Starts<\/h2>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 7, approved by Annie on 13 Oct 2026: one line added.]<\/em> Show the system picture from Module 03A. Point to the two parts this module builds: the builder, and in the Full course the server.<\/p>\n<p><em>10 minutes.<\/em><\/p>\n<p>Before any teaching starts, the facilitator checks five things:<\/p>\n<ol>\n<li>The laptop opens Terminal, and the student has admin rights.<\/li>\n<li>The opencode Go key is in the password manager.<\/li>\n<li>The server exists. The server company's website shows it, and the student can log in there.<\/li>\n<li><code>SOUL<\/code>, <code>RULES<\/code> and <code>USER<\/code> are in the vault's <code>AI System<\/code> folder.<\/li>\n<li>Telegram is on the phone, with two-factor sign-in on.<\/li>\n<\/ol>\n<p><strong>If item 3 fails, the student cannot do Module 08B today.<\/strong> Here is what happens instead:<\/p>\n<ul>\n<li>The student sits beside another student during 08B and watches.<\/li>\n<li>At home, they do 08B with the checklist.<\/li>\n<li>The facilitator joins them on a call for the steps that lock down the server.<\/li>\n<li>With three students at most, the facilitator has time for this.<\/li>\n<\/ul>\n<p>Everyone does \"Full Course: Before the Server\".<\/p>\n<h2>Your Two Builders<\/h2>\n<p><em>5 minutes.<\/em><\/p>\n<p>A builder is an AI that works on your files for you. You tell it what you want in plain English. It reads your files, changes them, and runs commands. It asks you before it changes anything (Seminar Starter Kit, file 03).<\/p>\n<p>You use two builders in this course: pi and Claude Code. The opener (Module 00) and the architecture module (Module 03A) explained the three labels used below: harness, AI provider and AI model. <em>[OPUS EDIT, 15 Oct 2026. Second audit, finding 4: the pointer now names the opener and Module 03A.]<\/em><\/p>\n<p><strong>pi (harness)<\/strong><\/p>\n<ul>\n<li>pi is a way to connect to many AI models. Examples are DeepSeek and Kimi K3 (AI models, on opencode Go's model list, checked 10 Oct 2026).<\/li>\n<li>These are open models. They are good, and they cost much less than the big Western models. opencode Go (AI provider) costs $10 a month. <em>[OPUS EDIT, 15 Oct 2026. Cost marks: mark removed. The price was already in the line.]<\/em><\/li>\n<li>In this course, pi uses DeepSeek (AI model), through opencode Go (AI provider).<\/li>\n<li>The same opencode Go plan gives your PA bot its brain (Module 08B). The bot runs on a separate harness called Hermes, but it uses the same models from the same $10 plan.<\/li>\n<li>To change your bot's brain to a different model, you ask pi to change one setting.<\/li>\n<li>pi works from Hong Kong with no VPN (Build Log 103).<\/li>\n<li>You install pi now.<\/li>\n<\/ul>\n<p><strong>Claude Code (harness)<\/strong><\/p>\n<ul>\n<li>Claude Code is the builder made by Anthropic (AI provider). It comes with every paid Claude plan.<\/li>\n<li>It uses Claude models (AI models), such as Opus 5.5.<\/li>\n<li>Hong Kong blocks Claude. So Claude Code works only through your server in Singapore (Module 01).<\/li>\n<li>You install Claude Code after the server work.<\/li>\n<li>Claude Code is good at understanding unclear instructions and working out what you meant (Module 01).<\/li>\n<\/ul>\n<h2>Install pi and Connect opencode Go<\/h2>\n<p><em>15 minutes. The Short course uses these same steps.<\/em><\/p>\n<p><strong>Step 1. Open Terminal.<\/strong> Press Command and Space. Type <code>terminal<\/code>. Press Return.<\/p>\n<p><strong>Step 2. Install pi.<\/strong> On a Mac, paste this line and press Return (pi.dev, seen 2 Oct 2026):<\/p>\n<pre><code class=\"language-bash\">curl -fsSL https://pi.dev/install.sh | sh\n<\/code><\/pre>\n<p>On Windows, open PowerShell and paste this line:<\/p>\n<pre><code class=\"language-powershell\">powershell -c &quot;irm https://pi.dev/install.ps1 | iex&quot;\n<\/code><\/pre>\n<p>You know it works when:<\/p>\n<ol>\n<li>Quit Terminal (Command and Q).<\/li>\n<li>Open Terminal again.<\/li>\n<li>Type <code>pi --version<\/code>. It should print a number. Annie's Mac printed <code>1.1.0<\/code> on 10 Oct 2026.<\/li>\n<\/ol>\n<p><strong>Step 3. Give pi your opencode Go key, without the key showing on screen.<\/strong> pi looks for the key in a setting called <code>OPENCODE_API_KEY<\/code> (pi's own help, 10 Oct 2026). Paste this line into Terminal and press Return:<\/p>\n<pre><code class=\"language-bash\">read -rs &quot;KEY?Put your opencode Go key here, then press Return (it will not show): &quot;; echo &quot;export OPENCODE_API_KEY=\\&quot;$KEY\\&quot;&quot; &gt;&gt; ~/.zshrc; unset KEY\n<\/code><\/pre>\n<p>Then:<\/p>\n<ol>\n<li>Terminal asks for the key.<\/li>\n<li>Copy the key from your password manager.<\/li>\n<li>Paste it and press Return.<\/li>\n<\/ol>\n<p>Nothing appears on screen while you paste. That is on purpose. The line saves the key in your Terminal settings file. It never shows the key.<\/p>\n<p><strong>Never paste a key into a chat with any AI.<\/strong> Never type a key where other people can see it. On 30 September 2026, a session showed a live key on screen two times while it read a settings file (Build Log 103).<\/p>\n<p><strong>Step 4. Start pi on the right model.<\/strong> Open a new Terminal window. Type:<\/p>\n<pre><code class=\"language-bash\">pi --provider opencode-go --model deepseek-v4.1-flash\n<\/code><\/pre>\n<p>Ask pi: \"What model are you, and who provides you?\" Then paste this, to make it the default:<\/p>\n<pre><code class=\"language-text\">Set opencode-go and deepseek-v4.1-flash as your default provider and model in your settings file. Back up the file first, with the date in the backup's name. Show me the result.\n<\/code><\/pre>\n<p>You know it works when, next time, you type only <code>pi<\/code> and it starts on the same model. Annie's pi settings hold these same two defaults (pi settings, read 10 Oct 2026). Facilitator: check this setting on the day, because pi changes often.<\/p>\n<p><strong>If pi asks whether to trust a folder, say yes only for your vault.<\/strong><\/p>\n<p><strong>The stop key.<\/strong> Press Escape to stop pi in the middle of a job.<\/p>\n<h2>Start in Your Vault and Write Your Builder's Instructions<\/h2>\n<p><em>10 minutes.<\/em><\/p>\n<p><strong>Always start your builder in your vault.<\/strong> The builder reads the instruction file in the folder where it starts. If it starts in the wrong folder, it does not know your setup.<\/p>\n<p>Here is what happened to Annie on 30 June 2026:<\/p>\n<ol>\n<li>Her desktop app said it could not check her bot's backups. It blamed a technical problem.<\/li>\n<li>The app had been opened in a different folder. So it never read the file that says where the bot lives.<\/li>\n<li>She opened the terminal in the right folder. It did the job at once (Seminar Ideas, 30 Jun 2026).<\/li>\n<\/ol>\n<p><strong>If a builder says \"I can't\", first ask which folder it started in.<\/strong><\/p>\n<p>To go to your vault in Terminal:<\/p>\n<ol>\n<li>Type <code>cd<\/code> and a space.<\/li>\n<li>Drag your vault folder from Finder into the Terminal window.<\/li>\n<li>Press Return.<\/li>\n<\/ol>\n<p><strong>Write one instruction file that both builders read.<\/strong><\/p>\n<ul>\n<li>pi reads <code>AGENTS.md<\/code> and <code>CLAUDE.md<\/code> (pi's own help, 10 Oct 2026).<\/li>\n<li>Claude Code reads <code>CLAUDE.md<\/code>.<\/li>\n<li>So the Full course writes one <code>CLAUDE.md<\/code>, and both builders read it.<\/li>\n<li>If a rule lives in two files, the two copies slowly become different. One file prevents that (Module 07, \"Rules Expire, and Each Rule Should Live in One File\").<\/li>\n<\/ul>\n<p><strong>Keep the file short. Make it point to other notes.<\/strong> Annie's builder instructions hold only the rules the builder needs every time. For everything else, they point to notes in the vault (Build Log 03).<\/p>\n<p>Start pi in your vault and paste:<\/p>\n<pre><code class=\"language-text\">Read USER and What AI Is Allowed to See in my AI System folder. Then draft a CLAUDE.md at the top of this vault from the template I paste next. Keep it under one screen. Show it to me before saving.\n<\/code><\/pre>\n<p>Then paste the template:<\/p>\n<pre><code class=\"language-markdown\"># Builder Instructions\n\n## Who I Am\n- [Three to five lines from USER.md.]\n\n## How to Work With Me\n- Explain in plain words, with numbered steps. I am not a developer.\n- Give me one next action, or at most three options with your recommended default and the reason.\n- Never end without my next action.\n- Tell me when I am wrong. Never guess: check the machine first, then answer.\n\n## Hard Rules\n- Before you ask me to paste anything, label it: safe to paste, remove the secret first, or never paste.\n- Never print the value of a key, token or password. Print its name only.\n- Back up any file before you edit it. Put the date and the reason in the backup's name.\n- Nothing goes to another person without my yes.\n- Never store or repeat: [the Tier 3 list from my What AI Is Allowed to See sheet].\n\n## Where Things Live\n- My vault is this folder. New notes go to 00 Inbox.\n- My builder files live in Builder/. My system notes live in AI System/.\n- My server: [added in Module 08B]. My bot: [added in Module 08B].\n\n## At the Start of Every Session\n- Read Builder/CONTINUITY.md before answering anything.\n<\/code><\/pre>\n<p><strong>Never put a colon in a file name.<\/strong> A Mac does not allow colons in file names. So a note with a colon in its name on the server never arrives on the laptop (Build Logs 96 and 104).<\/p>\n<h2>The Cold Test: Prove a Fresh Session Reads Your File<\/h2>\n<p><em>10 minutes. You repeat it for Claude Code after the server work. The Short course runs it too.<\/em><\/p>\n<p><strong>Why you test.<\/strong> If the builder does not read your instruction file, nothing tells you. It just acts like a general AI assistant that does not know you.<\/p>\n<p>Here is what happened to Annie in August 2026:<\/p>\n<ol>\n<li>She linked her builder's instructions with an import line.<\/li>\n<li>The folder path in that line had a space in it. So the link did not work.<\/li>\n<li>No error appeared.<\/li>\n<li>A cold test caught it. The answers were missing a rule that only the main file held (Build Log 47).<\/li>\n<\/ol>\n<p><strong>Step 1. Exit pi.<\/strong> Press Control and C two times. Or type <code>/exit<\/code>, if your version has it.<\/p>\n<p><strong>Step 2. Ask one question with no history.<\/strong> In your vault folder, type:<\/p>\n<pre><code class=\"language-bash\">pi -p --no-session &quot;Answer from your instructions only. Who am I? Give two of my rules for working with me. What must you never print?&quot;\n<\/code><\/pre>\n<p>What the parts mean (pi's own help, 10 Oct 2026):<\/p>\n<ul>\n<li><code>-p<\/code> asks one question and prints the answer.<\/li>\n<li><code>--no-session<\/code> means pi uses nothing from earlier conversations.<\/li>\n<\/ul>\n<p><strong>You know it works when<\/strong> pi names you, quotes two of your rules, and says it never prints key values.<\/p>\n<p><strong>If the answer is general, pi did not read your file.<\/strong> Check two things:<\/p>\n<ol>\n<li><code>CLAUDE.md<\/code> is in the folder where you ran the command.<\/li>\n<li>The name is exactly <code>CLAUDE.md<\/code>.<\/li>\n<\/ol>\n<p>Fix it and run the test again. Do not go on until this test passes.<\/p>\n<p><strong>What can go wrong without this test.<\/strong> For weeks in July 2026, Annie's bot seemed to ignore its rules. The truth was that its rules file had never loaded at all. Two small file links fixed it, and a new test passed (Build Log 32). These files are what make an AI assistant know you. Without them, it is a general AI assistant (Build Log 46).<\/p>\n<h2>Five Habits That Keep You in Control<\/h2>\n<p><em>10 minutes. The Short course teaches the same habits.<\/em><\/p>\n<p>The builder does the typing. You do three things:<\/p>\n<ol>\n<li><strong>Describe<\/strong> what you want.<\/li>\n<li><strong>Approve<\/strong> each change before it happens.<\/li>\n<li><strong>Check<\/strong> the result.<\/li>\n<\/ol>\n<p>Annie wrote no code to build her system. In July 2026 she said: \"I'm not technical. Here's my lab notebook, and none of it needed me to write code. It needed me to learn how to check\" (Seminar Ideas, 2 Jul 2026).<\/p>\n<p><strong>When a note and the machine disagree, believe the machine.<\/strong> A note, a memory or the builder's report can be out of date. The live settings and the real output show what is true now. Fix the note.<\/p>\n<p><strong>The five habits:<\/strong><\/p>\n<ol>\n<li><strong>Look before you build.<\/strong> In her first month, Annie started to build something that already existed three times. One time, there were two versions of the same job: one turned off and one running. Because she looked first, she upgraded the running one (Build Log 04). Start every build with: \"Before changing anything, list what already exists for this on the machine.\"<\/li>\n<li><strong>Back up before every change, and know how to undo it.<\/strong>\n   - Copy the file first. Put the date and the reason in the backup's name, for example <code>config.yaml.bak_20260922_model-change<\/code>.\n   - Make the smallest change.\n   - Check that it still works.\n   - Write down how to undo it.\n   - Annie once undid a model change in about a minute, because the backup existed (Build Log 92).<\/li>\n<li><strong>Ask for proof, not \"done\".<\/strong> Ask to see the output, the file on disk, or the message on your phone. Annie's logs sort every claim into \"Proven\" and \"Not yet proven\" (Build Log 94).<\/li>\n<li><strong>Make one change at a time, then use it for a while.<\/strong> In May 2026 Annie's first bot broke down. Its cheap AI model could not use its tools reliably, and it said tasks were done when they were not. Version 2 started with three things: the soul file, the rules and one reminder. Her plan was to live with it for 24 to 48 hours before building more (Build Log 00).<\/li>\n<li><strong>Advice is not a fix. A note is not a task.<\/strong> When the builder finds a problem, it fixes it in the same step, or it gives the fix a date. In July 2026 a review of Annie's handover document sat unused for two days. Then she asked, \"we have this audit, how do we use it?\" (Build Log 26).<\/li>\n<\/ol>\n<p>Ask pi to add the five habits to <code>CLAUDE.md<\/code> under \"How to Work With Me\". Tell it to back up the file first.<\/p>\n<p><strong>Next, go to Module 08B.<\/strong> pi does every server step there.<\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 2: closing line added.]<\/em><\/p>\n<p>pi works and reads your instructions. Now pi builds your server and your bot. <strong>Day 2 ends here.<\/strong><\/p>\n<hr />\n<h1>Full Course: After the Server<\/h1>\n<p><em>Start this half only after your exit node test in the server module (Module 08B) passes. That is the test where the terminal prints loc=SG.<\/em><\/p>\n<h2>Claude Code Through Your Own Route<\/h2>\n<p><em>15 minutes.<\/em><\/p>\n<p>Your server is now your route out of Hong Kong.<\/p>\n<ul>\n<li><strong>Exit node on:<\/strong> your laptop's internet traffic goes out through Singapore. Anthropic serves Singapore.<\/li>\n<li><strong>Exit node off:<\/strong> your laptop is a normal Hong Kong laptop again (Module 08B).<\/li>\n<\/ul>\n<p><strong>Step 1. Turn the exit node on.<\/strong> In the Tailscale menu, choose your server as the exit node.<\/p>\n<p><strong>Step 2. Check where your laptop appears to be.<\/strong><\/p>\n<pre><code class=\"language-bash\">curl -s https://1.1.1.1/cdn-cgi/trace | grep loc\n<\/code><\/pre>\n<p><strong>You know it works when<\/strong> it prints <code>loc=SG<\/code>. If it prints <code>loc=HK<\/code>, the exit node is not on. Stop here and fix that first.<\/p>\n<p><strong>Step 3. Install Claude Code.<\/strong><\/p>\n<pre><code class=\"language-bash\">curl -fsSL https://claude.ai/install.sh | bash\n<\/code><\/pre>\n<p>On Windows, in PowerShell (facilitator: check Anthropic's install page on the day):<\/p>\n<pre><code class=\"language-powershell\">irm https://claude.ai/install.ps1 | iex\n<\/code><\/pre>\n<p>You know it works when you quit and reopen Terminal, type <code>claude --version<\/code>, and it prints a number.<\/p>\n<p><strong>Step 4. Start Claude Code in your vault and sign in.<\/strong><\/p>\n<ol>\n<li>Go to your vault folder.<\/li>\n<li>Type <code>claude<\/code>.<\/li>\n<li>Choose <strong>\"Claude account with subscription\"<\/strong>.<\/li>\n<li>A browser opens. Sign in there.<\/li>\n<li>When it asks whether to trust this folder, answer <strong>Yes<\/strong>.<\/li>\n<\/ol>\n<p><strong>If it signs in to the wrong account:<\/strong><\/p>\n<ol>\n<li>Sign out of claude.ai in your browser.<\/li>\n<li>Type <code>/login<\/code> inside Claude Code.<\/li>\n<\/ol>\n<p>Claude Code signs in to whichever account your browser has open (Build Log 61).<\/p>\n<p><strong>Claude Code on the laptop needs the exit node on, every time.<\/strong> pi does not. Annie keeps her exit node off most of the time. She turns it on when she wants Claude on the laptop. She can also use Claude Code on the server, which needs no route (Module 08B, \"Your Daily Routine\").<\/p>\n<h2>Your Window and Four Settings<\/h2>\n<p><em>15 minutes. Annie's additions of 10 Oct 2026 are marked.<\/em><\/p>\n<h3>Where You Run It<\/h3>\n<p>Module 01 showed you your terminal window and Annie's notes on it (Module 01, \"Your Terminal Window for the Rest of the Course\"). The notes cover:<\/p>\n<ul>\n<li>using a terminal (Terminal or Ghostty) instead of the desktop app<\/li>\n<li>scrolling<\/li>\n<li>copy and paste<\/li>\n<li>the status line<\/li>\n<li>the keys<\/li>\n<\/ul>\n<p>In this section you make the changes, because both builders are now installed.<\/p>\n<h3>Let pi Make the Changes<\/h3>\n<p><strong>pi is already working, so pi makes the Claude Code changes for you.<\/strong> This is one benefit of installing pi first. Claude Code can also make these changes itself, in the desktop app or in the terminal (Annie, 10 Oct 2026). Start pi in your vault for each setting below.<\/p>\n<p><strong>1. Make copy and paste work.<\/strong> Claude Code takes control of the mouse. So when you highlight text, it does not copy. Ask pi:<\/p>\n<pre><code class=\"language-text\">Add the line export CLAUDE_CODE_DISABLE_MOUSE=1 to my ~/.zshrc file. Back up the file first.\n<\/code><\/pre>\n<p>Open a new Terminal window. Now Command and C copies, and Command and V pastes. Be careful: Control and C does something different. It stops whatever is running (Build Log 01).<\/p>\n<p><strong>2. Lock Claude Code to your subscription.<\/strong><\/p>\n<ul>\n<li>If an Anthropic API key is on your machine, Claude Code may use it. Then you pay for each use, on top of your plan.<\/li>\n<li>This happened to Annie. When she set up Claude Code on her server, it charged each use to her employer's account (Build Log 46).<\/li>\n<\/ul>\n<p>Ask pi:<\/p>\n<pre><code class=\"language-text\">In ~/.claude/settings.json, set &quot;forceLoginMethod&quot; to &quot;claudeai&quot;. Keep every other setting. Back up the file first, then show me the result.\n<\/code><\/pre>\n<p><strong>You know it works when<\/strong> you type <code>/login<\/code> inside Claude Code and the subscription option is already selected.<\/p>\n<p><strong>3. Show what matters at the bottom of the window.<\/strong> <em>(Added by Annie, 10 Oct 2026.)<\/em><\/p>\n<ol>\n<li>Choose your status-line items from the list in Module 01.<\/li>\n<li>Ask pi to set up its own status line first. Annie's pi has one (pi settings backup, 5 Oct 2026).<\/li>\n<li>Then ask pi to set up Claude Code's status line.<\/li>\n<\/ol>\n<p>Facilitator: check on the day which items each builder can show. Also check whether \"money spent\" can show on a subscription.<\/p>\n<p><strong>4. Queue a message with Option and Enter.<\/strong> Module 01's key table explains each key.<\/p>\n<ul>\n<li>Claude Code's own queue key is hard to press: Control and X, then Enter.<\/li>\n<li>On 10 Oct 2026, Annie changed it to Option and Enter on her Mac.<\/li>\n<\/ul>\n<p>Ask your builder to do the same:<\/p>\n<pre><code class=\"language-text\">Create ~/.claude/keybindings.json with one binding in the Chat context: &quot;alt+enter&quot; runs &quot;chat:queueSubmit&quot;. Keep any bindings already in the file. Back up the file first.\n<\/code><\/pre>\n<p><strong>If you use Ghostty, it needs one more line.<\/strong> Ghostty does not send Option and Enter to Claude Code on its own.<\/p>\n<ol>\n<li>Ask your builder to add the line below to <code>~/.config/ghostty/config<\/code>.<\/li>\n<li>Reload Ghostty's settings: press Command, Shift and comma.<\/li>\n<\/ol>\n<pre><code class=\"language-text\">keybind = alt+enter=text:\\x1b\\r\n<\/code><\/pre>\n<h2>The Cold Test Again, for Claude Code<\/h2>\n<p><em>10 minutes.<\/em><\/p>\n<p>Claude Code reads the same <code>CLAUDE.md<\/code> that pi read before the server work. Now prove it.<\/p>\n<ol>\n<li>Exit Claude Code: type <code>/exit<\/code>.<\/li>\n<li>Make sure the exit node is on.<\/li>\n<li>In your vault folder, type:<\/li>\n<\/ol>\n<pre><code class=\"language-bash\">claude -p &quot;Answer from your instructions only. Who am I? Give two of my rules for working with me. What must you never print?&quot;\n<\/code><\/pre>\n<p><strong>You know it works when<\/strong> Claude Code gives the same answers pi gave. If Claude Code's answer is general and pi's was not, Claude Code started in a different folder.<\/p>\n<h2>Continuity and the Start-of-Session Hook<\/h2>\n<p><em>15 minutes.<\/em><\/p>\n<p>Your builder starts every session with no memory of yesterday. A continuity note fixes this. It is a short \"where we left off\" note. Every session reads it first. Each entry has:<\/p>\n<ul>\n<li>the date<\/li>\n<li>what was done<\/li>\n<li>what is still in progress<\/li>\n<li>the next action<\/li>\n<\/ul>\n<p><strong>Step 1.<\/strong> Ask Claude Code:<\/p>\n<pre><code class=\"language-text\">Create Builder/CONTINUITY.md with a one-line header saying what it is. Add today's entry: what we built in Modules 08 and 08B, and my next action.\n<\/code><\/pre>\n<p><strong>Step 2. Make Claude Code read the note on its own.<\/strong><\/p>\n<p>Why this step exists:<\/p>\n<ol>\n<li>Annie's rules told her builder to read the continuity note first.<\/li>\n<li>One day she asked an urgent question. The builder answered without reading the note.<\/li>\n<li>A rule that the builder must remember can lose to an urgent question.<\/li>\n<li>The fix was a start-of-session hook. A hook is a setting that loads the note before the builder answers anything (Build Log 52).<\/li>\n<\/ol>\n<p>Ask Claude Code:<\/p>\n<pre><code class=\"language-text\">Add a SessionStart hook to ~/.claude/settings.json that prints the first 60 lines of Builder/CONTINUITY.md in my vault, so you read it at the start of every session. Back up the file first. Then show me how to test it.\n<\/code><\/pre>\n<p>To test it:<\/p>\n<ol>\n<li>Exit Claude Code.<\/li>\n<li>Start a new session.<\/li>\n<li>Ask \"where did we leave off?\". The answer should come from the note.<\/li>\n<\/ol>\n<p>Facilitator: check the hook format against the current Claude Code hooks documentation on the day.<\/p>\n<p>pi has no hook here. pi reads the note only because <code>CLAUDE.md<\/code> tells it to. That is less reliable than a hook.<\/p>\n<p><strong>Step 3. Choose your \"save\" word.<\/strong> Add this line to <code>CLAUDE.md<\/code>: \"When I say 'save', add a dated entry to CONTINUITY.md, and if we built something, write the build log and its index row.\"<\/p>\n<p><strong>Keep the note short.<\/strong> Every session reads it, so a long note slows every session down. Annie deletes entries older than three weeks.<\/p>\n<p>Her test for where a lesson belongs: <strong>will it still matter in three weeks?<\/strong> If yes, put it in <code>CLAUDE.md<\/code> or the vault. Do not put it in the continuity note.<\/p>\n<p><strong>Read the note before you start a build.<\/strong> On 30 September 2026, two of Annie's sessions built the same fix at the same time. One was on the Mac and one was on the server. Both said they succeeded. The checking file ended up with two copies of each new check (Build Log 106). You now have two builders, so this can happen to you too.<\/p>\n<h2>The Build Log<\/h2>\n<p><em>10 minutes. The Short course uses the same steps.<\/em><\/p>\n<p>A build log records one piece of work. You write it when the work is finished. You never change an old entry. You add a new one. This course comes from Annie's build logs. She has written more than 120 since May 2026.<\/p>\n<p><strong>Step 1.<\/strong> Ask your builder to:<\/p>\n<ol>\n<li>Create the folder <code>AI System/Build Logs/<\/code>.<\/li>\n<li>Create an index note called <code>0 — Build Log Index<\/code>. It has a table with four columns: number, date, title, and a one-line summary.<\/li>\n<\/ol>\n<p><strong>Step 2.<\/strong> Save this template as <code>AI System/Build Logs/_Template<\/code>:<\/p>\n<pre><code class=\"language-markdown\">---\ntype: build-log\nlog: [number]\ncreated: [date]\n---\n\n# Build Log [number]: [title]\n\n## Goal\n## What I Learned\n## What I Built\n## Proven and Not Yet Proven\n## Files Changed and Their Backups\n| File | Backup |\n|---|---|\n## Open and Next\n<\/code><\/pre>\n<p><strong>Step 3.<\/strong> Ask Claude Code to write Build Log 1 for today. It covers everything before the server work, Module 08B, and everything after it. Ask it to add the index row in the same step.<\/p>\n<p><strong>A log is not finished until its index row exists.<\/strong><\/p>\n<ul>\n<li>Some of Annie's logs had no index row for weeks. A log with no row looks the same as a log that was never written (Build Log 79).<\/li>\n<li>Two logs once got the same number, because someone picked the numbers by hand (Build Log 86).<\/li>\n<\/ul>\n<h2>The Run Card<\/h2>\n<p><em>10 minutes. The Short course writes the same card.<\/em><\/p>\n<p>The run card is one page that sums up how to run your system. Handwriting is fine. Bring it to every later session. Write down:<\/p>\n<ul>\n<li>What your system is for, in one sentence.<\/li>\n<li>The exact start command for each builder, and the key that stops it.<\/li>\n<li>Where the files live: the vault folder, <code>CLAUDE.md<\/code>, and the bot's files on the server.<\/li>\n<li>Your daily routine from Module 08B.<\/li>\n<li>Your three rules, and how you check each one (Module 07).<\/li>\n<li>Your three golden questions, the test questions with known answers (Module 07).<\/li>\n<li>What it costs each month, and where each number came from. Annie's own figures are in the opener's table, \"What each piece costs, per year\". Divide each yearly figure by 12. <em>[OPUS EDIT, 15 Oct 2026. Cost marks: mark replaced with a pointer to the cost table. Each student writes their own numbers.]<\/em><\/li>\n<li>What to do when it does not answer: which builder still works, and how to reach the server company's website.<\/li>\n<\/ul>\n<p><strong>If you cannot write the start command from memory, write it down now.<\/strong> In a week you will need it.<\/p>\n<h2>Say What You Want, Not Every Step<\/h2>\n<p><em>5 minutes. Both conversations are from one of Annie's builder sessions on 9 October 2026, running Opus 5.5.<\/em><\/p>\n<p><strong>First conversation: the builder says how it understood you, before it acts.<\/strong><\/p>\n<blockquote>\n<p><strong>Annie:<\/strong> should we do C and then this? I wanted to finish previous open tasks first. and does this check the critical test like we wanted?<\/p>\n<p><strong>Builder:<\/strong> Yes: C now, then the automatic workflow. I'm reading \"C\" as \"keep switching models by hand\". Finishing open work first makes sense, and building the automatic workflow last means it can be tested on real work.<\/p>\n<\/blockquote>\n<p>What this shows:<\/p>\n<ul>\n<li><strong>Short instructions work when you both know what they mean.<\/strong> \"C\" was an option they had already agreed on. So it needed no explanation.<\/li>\n<li><strong>The builder said how it understood \"C\" before it acted.<\/strong> If it had misunderstood, the mistake would cost one sentence, not a day of work.<\/li>\n<li><strong>A preference is a real instruction.<\/strong> \"I wanted to finish previous open tasks first\" changed the order. The builder followed it.<\/li>\n<li><strong>Ask whether it meets the test you agreed on, not whether it is good.<\/strong> \"Does this check the critical test like we wanted?\" asks for proof against a test they set earlier.<\/li>\n<\/ul>\n<p><strong>Second conversation: when you are the one who is confused.<\/strong><\/p>\n<blockquote>\n<p><strong>Annie:<\/strong> and then go 1. im getting confused on what to run but just know let's finish everything still open from the F B D and E builds and this automated workflow<\/p>\n<p><strong>Builder:<\/strong> I'll take it from here and finish all four in order. I won't ask you to choose critics this time: for Module 1 I'll run all four. Starting with Module 1.<\/p>\n<\/blockquote>\n<p>What this shows:<\/p>\n<ul>\n<li><strong>\"I'm getting confused\" is a full instruction.<\/strong> It lets the builder make the decision and continue. If you stay quiet and guess, the build moves away from what you wanted.<\/li>\n<li><strong>The builder said which decision it was making, before it made it.<\/strong> It is safe for the builder to make a choice for you when it tells you first. It is not safe when you only find out later.<\/li>\n<\/ul>\n<p><strong>What to take away.<\/strong><\/p>\n<ol>\n<li>You do not need to give step-by-step instructions.<\/li>\n<li>Say what you want, what it must not do, and how you will judge the result.<\/li>\n<li>Ask the builder to say back what it understood.<\/li>\n<li>If it cannot say it in one sentence, your instruction is not clear yet.<\/li>\n<\/ol>\n<p><em>Do not show the two screenshots of these conversations in class yet. They must first be checked against the screenshot rules, because they were not among the 54 approved edited copies.<\/em><\/p>\n<h2>The One Tool You Cannot Lose<\/h2>\n<p><em>5 minutes.<\/em><\/p>\n<p>Ask each student: <strong>which one tool, if it stopped working, would stop you from fixing everything else?<\/strong> Write its name on the run card.<\/p>\n<p>Annie learned this the hard way:<\/p>\n<ol>\n<li>In August 2026 she built two clever designs. They sent only some internet traffic through Singapore.<\/li>\n<li>Both designs put Tailscale in front of Claude Code.<\/li>\n<li>When Tailscale was off, Claude Code on the Mac stopped working.<\/li>\n<li>But Claude Code was the tool she used to fix everything else.<\/li>\n<li>She removed both designs the next day (Build Log 69).<\/li>\n<\/ol>\n<p>Her words: \"i don't ever want a situation where i can't reach claude code on my mac.\"<\/p>\n<p><strong>In this course, the answer is built in.<\/strong><\/p>\n<ul>\n<li>pi works when Tailscale is off, when the exit node is off, and when the server is down.<\/li>\n<li>Claude Code on the laptop needs the exit node.<\/li>\n<li>So the tool you cannot lose is pi. It does not depend on anything you built today. Keep it working.<\/li>\n<\/ul>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 2: closing line added.]<\/em><\/p>\n<p><strong>Day 3 ends here. Next, on Day 4: the script-or-AI module (Module 09).<\/strong> Everything is built and logged. Now you decide which steps a small program should do, and which need judgement.<\/p>\n<hr />\n<h1>Short Course<\/h1>\n<p><em>The Short course has no server. Its bot is Gemini, built in the skills module (Module 11). The optional server sitting uses Module 08B.<\/em> <em>[FABLE EDIT, 13 Oct 2026. Third session, after the screenshot check. Not yet approved by Annie: one line changed. Proposal 8 made Gemini the Short course's bot.]<\/em><\/p>\n<h2>Five Checks Before Teaching Starts<\/h2>\n<p><em>10 minutes.<\/em><\/p>\n<p>Before any teaching starts, the facilitator checks five things:<\/p>\n<ol>\n<li>The laptop opens Terminal, and the student has admin rights.<\/li>\n<li>The opencode Go key is in the password manager.<\/li>\n<li><code>AGENTS<\/code> (Module 07) and <code>USER<\/code> (Module 06) are in the vault's <code>AI System<\/code> folder.<\/li>\n<li>One folder of real files exists for the job.<\/li>\n<li>The student can say the one real job for their AI assistant in one sentence.<\/li>\n<\/ol>\n<p><strong>If item 1 or 2 fails, the student uses the backup plan, with the facilitator beside them.<\/strong> The backup plan is a Gemini chat in the browser. Gemini works from Hong Kong with no extra steps (Module 01).<\/p>\n<ol>\n<li>Upload the job's files to Gemini.<\/li>\n<li>Paste <code>AGENTS.md<\/code> as the first message.<\/li>\n<li>Send the cold test.<\/li>\n<\/ol>\n<p>Facilitator: on the day, use Gemini's saved-instructions feature if it exists. Gems are being replaced (Oct to Nov 2026).<\/p>\n<p><strong>Tell the student the backup plan's two limits:<\/strong><\/p>\n<ul>\n<li>It reads only the files you uploaded.<\/li>\n<li>In a new chat it forgets your instructions, unless they are saved.<\/li>\n<\/ul>\n<p>The backup plan still gives one AI assistant with your rules. But it is not the build.<\/p>\n<h2>What the Builder Is<\/h2>\n<p><em>5 minutes.<\/em><\/p>\n<p>A builder is an AI that works on your files for you. You tell it what you want in plain English. It reads your files, changes them, and runs commands. It asks you before it changes anything (Seminar Starter Kit, file 03).<\/p>\n<p>Your builder is pi (harness). The opener (Module 00) and the architecture module (Module 03A) explained the labels harness, AI provider and AI model. <em>[OPUS EDIT, 15 Oct 2026. Second audit, finding 4: the pointer now names the opener and Module 03A.]<\/em><\/p>\n<ul>\n<li>pi is a way to connect to many AI models. Examples are DeepSeek and Kimi K3 (AI models, on opencode Go's model list, checked 10 Oct 2026).<\/li>\n<li>These are open models. They are good, and they cost much less than the big Western models.<\/li>\n<li>In this course, pi uses DeepSeek (AI model), through opencode Go (AI provider). opencode Go costs $10 a month. <em>[OPUS EDIT, 15 Oct 2026. Cost marks: mark removed. The price was already in the line.]<\/em><\/li>\n<li>pi works from Hong Kong with no VPN and no server (Build Log 103).<\/li>\n<\/ul>\n<p><strong>Press Escape to stop pi in the middle of a job.<\/strong> Write this on your sheet.<\/p>\n<h2>Install pi and Connect opencode Go<\/h2>\n<p><em>15 minutes.<\/em><\/p>\n<p>Follow the four steps in \"Full Course: Before the Server\", under \"Install pi and Connect opencode Go\". The steps are the same in both courses.<\/p>\n<h2>One Folder for Everything, With AGENTS.md in Place<\/h2>\n<p><em>10 minutes.<\/em><\/p>\n<p>Make one folder inside your vault. Give it a plain name. Put everything the AI assistant reads inside it.<\/p>\n<pre><code class=\"language-text\">My AI Assistant/\n  AGENTS.md\n  My Files/\n  RUN CARD.md\n<\/code><\/pre>\n<p><strong>Step 1. Move your Module 07 file into the folder.<\/strong> Ask a facilitator to help, or type this in pi: \"Copy AI System/AGENTS into My AI Assistant/AGENTS.md. Paste my USER file in below it.\" pi reads <code>AGENTS.md<\/code> from the folder where it starts (pi's own help, 10 Oct 2026).<\/p>\n<p><strong>Step 2.
