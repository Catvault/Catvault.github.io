start.<\/p>\n<p><strong>The gap between Day 2 and Day 3 matters.<\/strong> The Gemini homework is done at home before Day 3: pay for Gemini Pro, connect your calendar, write your instructions for Gemini, and put the app on your phone. The handout for the skills module (Module 11) has the steps.<\/p>\n<p><strong>The optional server sitting<\/strong> is a separate session after Day 3, for students who want a bot that does more. It is not in the 10 hours.<\/p>\n<p><strong>Next: the access module (Module 01).<\/strong> You have seen what it does. Now you find out which tools will answer you from Hong Kong.<\/p>\n<h2>Teaching Notes<\/h2>\n<ul>\n<li><strong>Three students at most.<\/strong> Learn their names before the five sentences.<\/li>\n<li><strong>Do not explain the five sentences.<\/strong> Read them. Every one is taught in full later.<\/li>\n<li><strong>Say the bot and the builder apart every time you name one.<\/strong> This is the idea most people miss. The architecture module (Module 03A) says the same in its teaching notes.<\/li>\n<li><strong>The Wish List is a first draft.<\/strong> Students add to it after the demo (Module 04). Do not polish it today.<\/li>\n<li><strong>Every screenshot rule from the demo (Module 04) applies here.<\/strong> Use the edited copies only. Never say a real name aloud.<\/li>\n<\/ul>"}, {"id": "short-1", "title": "01: What Works From Hong Kong", "handout": false, "html": "<h1>Module 01: What Works From Hong Kong<\/h1>\n<p><strong>How to read this file.<\/strong> This is the Short course copy: 10 hours over three days, built with pi on your laptop and Gemini on your phone. Every segment in it is taught. The master copy for both courses is in <code>modules/<\/code>.<\/p>\n<p><strong>Why this module comes here.<\/strong><\/p>\n<ol>\n<li>The opener (Module 00) showed you what the system does. Now you find out which AI companies will answer you from Hong Kong.<\/li>\n<li>Every later module connects to one of those companies. If you pick a tool that does not answer, you build something you cannot reach.<\/li>\n<li>You leave with your Access Sheet: one page listing each tool, whether it works from Hong Kong, and your way to reach it. The privacy module (Module 02) sorts those tools by what each one may see.<\/li>\n<\/ol>\n<h2>Run Sheet<\/h2>\n<p>35 minutes.<\/p>\n<table>\n<thead>\n<tr>\n<th>Min<\/th>\n<th>Segment<\/th>\n<th>Facilitator does<\/th>\n<th>Students do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5<\/td>\n<td>Why access comes first<\/td>\n<td>Explains why every later module depends on this one. Defines VPN, API and open-weight model<\/td>\n<td>Open laptop and phone, join the Wi-Fi<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Which AI tools work from Hong Kong<\/td>\n<td>Walks the dated table of tools, and the three kinds of block: your connection, your sign-up details and your billing address<\/td>\n<td>Mark the tools they already use<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Your builder, and Claude if you want it<\/td>\n<td>Explains pi with opencode Go, the VPN option for Claude, and what the optional server sitting (a separate session to build your own server) adds<\/td>\n<td>Pick a route and write down why<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Fill in your Access Sheet<\/td>\n<td>Checks each sheet and answers questions<\/td>\n<td>Complete the Access Sheet<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>How the minutes add up.<\/strong><\/p>\n<ul>\n<li><strong>35 minutes.<\/strong> Why access comes first takes 5 minutes. The table of which AI tools work from Hong Kong takes 10. Your builder takes 10. The Access Sheet takes 10. You do not run the live test today. You meet the terminal in the build module (Module 08), where pi's first answer proves the connection.<\/li>\n<\/ul>\n<h2>What You Will Leave With<\/h2>\n<p><strong>Your Access Sheet.<\/strong> It is one page. It lists:<\/p>\n<ul>\n<li>every account you have or need<\/li>\n<li>which tools work directly from Hong Kong<\/li>\n<li>your route for each tool that does not work directly<\/li>\n<li>the date you tested each one, because what works can change<\/li>\n<\/ul>\n<p>You use this sheet when you install your builder. You use it again if you build your own server.<\/p>\n<h2>Before This Module<\/h2>\n<ul>\n<li><strong>A laptop you control.<\/strong><\/li>\n<li>A personal Mac is the easiest.<\/li>\n<li>A Windows laptop works. The Windows commands are shown where they are different.<\/li>\n<li>A company laptop often blocks installs and network tools. Do not bring one if you can avoid it.<\/li>\n<li><strong>No phone app today.<\/strong> You install the Gemini app on your phone before the skills module (Module 11).<\/li>\n<li><strong>A Google account.<\/strong> Gemini works in Hong Kong with no extra steps. So today it is the tool we know works, to compare the others against.<\/li>\n<li><strong>Nothing else.<\/strong> Do not buy a VPN or a server before this session. This module explains what you need.<\/li>\n<\/ul>\n<h2>Why Access Comes First<\/h2>\n<p>This course builds a personal AI system. You met two of its parts in the opener (Module 00). It has up to three:<\/p>\n<ul>\n<li><strong>The builder<\/strong> is an AI that writes and fixes code for you. You describe what you want in plain English.<\/li>\n<li><strong>The bot<\/strong> is an AI you send messages to on your phone.<\/li>\n<li><strong>The server<\/strong> is a small rented computer in another country. It runs all day.<\/li>\n<\/ul>\n<p>Each part talks to an AI company over the internet. From Hong Kong, some of those companies do not answer.<\/p>\n<p>If you choose your tools before you know which ones answer, you build a system you cannot reach. Annie lost about a week to one of these blocks in May 2026 (Build Log 00). This module helps you avoid that.<\/p>\n<p><strong>Three words you will hear all day:<\/strong><\/p>\n<ul>\n<li><strong>VPN.<\/strong> A VPN sends your internet traffic through a computer in another country. The AI company then sees that country, not Hong Kong.<\/li>\n<li><strong>API.<\/strong> An API is how a program talks to an AI company. A person types in a chat window. A program uses an API instead. Your builder and your bot both use one.<\/li>\n<li><strong>Open-weight model.<\/strong> An AI model whose makers publish it, so many companies can run it. DeepSeek, Qwen, GLM and Kimi are open-weight models. They answer from Hong Kong.<\/li>\n<\/ul>\n<p>The opener (Module 00) gave you three more: harness, AI provider and AI model. The architecture module (Module 03A) explains each one in more detail.<\/p>\n<p><strong>The block comes from the AI companies, not from Hong Kong.<\/strong><\/p>\n<ul>\n<li>Many people think the Hong Kong government blocks these tools. It does not.<\/li>\n<li>Hong Kong's internet is open. You can reach any website.<\/li>\n<li>The AI companies choose not to serve Hong Kong. Their own pages give no reason.<\/li>\n<li>So the check happens at the company, every time you send a request.<\/li>\n<\/ul>\n<h2>Which AI Tools Work From Hong Kong<\/h2>\n<p>This table was checked on 2 October 2026. The Anthropic, OpenAI and opencode rows were checked again on 9 October 2026.<\/p>\n<p><strong>What works can change, so the date matters.<\/strong> In March 2026 the Gemini row changed from blocked to open. Annie's own notes stayed wrong until someone checked (Build Log 83). Check this table again in the week before you teach it.<\/p>\n<table>\n<thead>\n<tr>\n<th>Company or tool<\/th>\n<th>From a Hong Kong connection<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Google Gemini (consumer app)<\/td>\n<td>Works directly<\/td>\n<td>Web from 16 March 2026, mobile from 27 March 2026 (Hong Kong Free Press, 16 Mar 2026). The paid Pro tier works too. A seminar room in Hong Kong paid for it on 6 October 2026 (Build Log 123).<\/td>\n<\/tr>\n<tr>\n<td>Google AI Studio, Antigravity and other Google developer tools<\/td>\n<td>Blocked<\/td>\n<td>Consumer Gemini is open. The developer tools are not.<\/td>\n<\/tr>\n<tr>\n<td>Anthropic: claude.ai, the Claude apps, Claude Code and the API<\/td>\n<td>Blocked<\/td>\n<td>Hong Kong is not on Anthropic's list of supported countries (checked 9 Oct 2026). The phone apps are blocked too. Tested on Android with the VPN off on 27 Aug 2026 (Build Log 68).<\/td>\n<\/tr>\n<tr>\n<td>OpenAI: ChatGPT and the API<\/td>\n<td>Blocked<\/td>\n<td>Hong Kong is not on OpenAI's list of supported countries (checked 9 Oct 2026). OpenAI refuses Hong Kong phone numbers at sign-up (PTS Consulting, seen 2 Oct 2026).<\/td>\n<\/tr>\n<tr>\n<td>DeepSeek, Kimi (Moonshot), GLM (Zhipu), Qwen (Alibaba)<\/td>\n<td>Work directly<\/td>\n<td>Open-weight models. You can reach them directly, or through a company that resells them.<\/td>\n<\/tr>\n<tr>\n<td>opencode Go (a monthly AI provider plan)<\/td>\n<td>Works directly<\/td>\n<td>It answered from Hong Kong on 30 Sep 2026 (Build Log 103) and again on 9 Oct 2026. Annie's three bots use it. Its model list also has one Claude model. The optional server sitting (Module 08B) explains it, under \"Other Ways to Reach Claude\".<\/td>\n<\/tr>\n<tr>\n<td>OpenRouter (a company that resells many models)<\/td>\n<td>Works for open-weight models only<\/td>\n<td>Annie tested her OpenRouter key. Every Anthropic, OpenAI and Google model returned a 403 error, \"provider Terms of Service\", even for a plain hello. The open-weight models answered on the same key (Build Logs 29, 80 and 84).<\/td>\n<\/tr>\n<tr>\n<td>Mistral, Grok, Perplexity, Microsoft Copilot<\/td>\n<td>Reported to work directly<\/td>\n<td>Not tested for this course. Facilitator: test these before teaching, or remove the row.<\/td>\n<\/tr>\n<tr>\n<td>Telegram, Tailscale, Obsidian<\/td>\n<td>Work directly<\/td>\n<td>The messaging app, the private network and the notes app. None of them is an AI company.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>There are three kinds of block. A fix for one does not fix the others.<\/strong><\/p>\n<ol>\n<li><strong>Your connection.<\/strong> The company sees a Hong Kong address and refuses. A VPN or your own server fixes this one.<\/li>\n<li><strong>Your sign-up details.<\/strong> OpenAI refuses Hong Kong phone numbers. A VPN does not change your phone number.<\/li>\n<li><strong>Your billing address.<\/strong> In May 2026, Anthropic's developer website did not accept a Hong Kong billing address. A VPN changed nothing, because the check was on the card, not the connection (Build Log 00). Annie's system stopped using that service on 25 September 2026 (Build Log 89). So you may never need it. It is still worth knowing, because it cost her a week.<\/li>\n<\/ol>\n<h2>Your Terminal Window for the Rest of the Course<\/h2>\n<p><em>Read at home, no class minutes. You make these settings in the build module (Module 08), once pi is installed.<\/em><\/p>\n<p>You open a terminal for the first time in the build module (Module 08). Your builder runs in a terminal for the rest of the course. So choose your window now.<\/p>\n<p><strong>Your choices:<\/strong><\/p>\n<ul>\n<li>the plain Terminal app that came with your Mac<\/li>\n<li>Ghostty, a free terminal app (ghostty.org)<\/li>\n<li>the Claude desktop app's Code tab<\/li>\n<\/ul>\n<p>All three run the same builder (Seminar Ideas, 30 Jun 2026). Facilitator: Ghostty is for Mac. Confirm the Windows choice on the day.<\/p>\n<p><strong>Annie's advice: use a terminal (Terminal or Ghostty), not the desktop app.<\/strong> Her reason is that it uses fewer tokens. This is what she noticed from daily use. It is not a measurement.<\/p>\n<p><strong>Four things to know now. The build module (Module 08) sets them up.<\/strong><\/p>\n<ol>\n<li><strong>Scrolling back can stop working while Claude Code runs in a terminal.<\/strong>\n   - Why: Claude Code's \"fullscreen\" display keeps old messages inside Claude Code, not in the terminal's own history. With the mouse turned off, the scroll wheel cannot reach them.\n   - The fix is one setting: <code>\"tui\": \"default\"<\/code> in Claude Code's settings file. This switches to the classic display. Every message then stays in the terminal's history. The scroll wheel and normal text selection work.\n   - Annie made this change on 10 Oct 2026 (Claude Code settings documentation, \"tui\").\n   - In the fullscreen display, Page Up and Page Down still scroll. Control and O opens the full conversation.<\/li>\n<li><strong>Copy and paste does not work at first in Claude Code,<\/strong> because Claude Code takes control of the mouse. If you add Claude Code later, pi can change this setting for you.<\/li>\n<li><strong>You can choose what shows at the bottom of the window.<\/strong> This line is called the status line. It can show:\n   - how much of the conversation space is used\n   - money spent\n   - the model name and effort level\n   - the folder the builder opened in\n   - the mode, for example auto or planning<\/li>\n<\/ol>\n<p>The status line belongs to the builder, not to the window. So pi and Claude Code show different items. You set up each one separately.\n4. <strong>The keys that control a builder while it works:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Key<\/th>\n<th>What it does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Escape<\/td>\n<td>Stops the builder in the middle of a job. Annie used the tools for weeks before she knew this<\/td>\n<\/tr>\n<tr>\n<td>Enter<\/td>\n<td>Sends your message. While the builder works, Enter does not stop the job. But it does not wait for the job to end either. Both builders read your message as soon as the current step finishes, inside the same job. So it can change what the builder does next. This is true in Claude Code and in pi<\/td>\n<\/tr>\n<tr>\n<td>Control and Enter<\/td>\n<td>Claude Code only. Sends your waiting messages at once. If Claude is only writing its answer, this interrupts it. Work that runs in the background keeps running<\/td>\n<\/tr>\n<tr>\n<td>Control and X, then Enter<\/td>\n<td>Claude Code's built-in key to queue a message for after the job. The message waits its turn and never interrupts the job. Annie moved this to Option and Enter on her Mac on 10 Oct 2026. The build module (Module 08) shows how<\/td>\n<\/tr>\n<tr>\n<td>Option and Enter (Mac), Control and Q (Windows)<\/td>\n<td>pi's default key to queue a message for after the job. Nothing needs setting up. pi holds the message until the whole job is finished. On Windows it is Control and Q, because Windows Terminal already uses Alt and Enter for full screen. Option and Up arrow (Alt and Q on Windows) brings waiting messages back so you can edit them<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>Corrected 10 Oct 2026. The first version of this table said Enter makes messages wait until the job is finished. That was wrong.<\/em><\/p>\n<ul>\n<li><em>Claude Code's documentation says a message sent with Enter reaches Claude \"as soon as those tool calls finish, within the same turn\" (Claude Code docs, \"When Claude Code sends what you queued\").<\/em><\/li>\n<li><em>pi's documentation says the same: Enter \"guides the next response\", and Alt and Enter \"waits until Pi finishes the current task\" (pi docs, usage, \"Follow Pi's work\").<\/em><\/li>\n<li><em>Annie proved the Claude Code behaviour on 10 Oct 2026. A question she typed in the middle of a job was answered inside that same job.<\/em><\/li>\n<li><em>The Windows keys come from pi's keybindings page. Nobody has tested them on a Windows machine.<\/em><\/li>\n<\/ul>\n<p><strong>Why Enter counts as steering, even when the builder answers your first question first.<\/strong> This confused Annie at first. Here it is in plain steps (Annie and Claude, 10 Oct 2026).<\/p>\n<ol>\n<li><strong>One reply is many small steps.<\/strong> When you ask the builder something, it does not answer in one go. It might search a file, then check a setting, then write the answer. That is three steps inside one reply.<\/li>\n<li><strong>A message sent with Enter arrives between steps.<\/strong> If you press Enter while the builder is busy, it reads your message as soon as the current step finishes. That is before the job is done.<\/li>\n<li><strong>Then the builder decides what to do with it.<\/strong> Annie once typed \"what's 4 + 4?\" in the middle of a job. It had nothing to do with the job. So the builder carried on and answered both questions at the end. From the outside, that looked like a queue.<\/li>\n<li><strong>It counts as steering, because it could have changed the rest of the job.<\/strong> Suppose Annie had typed \"stop, don't touch the settings files\" instead. The builder would have read it before its next step, and skipped that work. Her message changed nothing only because 4 + 4 was unrelated.<\/li>\n<li><strong>The queue key is different.<\/strong> With Option and Enter, the builder does not see your message until the whole reply is finished. A \"don't touch the settings files\" sent that way would arrive too late, after the files were already changed.<\/li>\n<\/ol>\n<p><strong>In short:<\/strong><\/p>\n<ul>\n<li>Enter means \"read this at your next step, and change course if it matters\".<\/li>\n<li>Option and Enter means \"don't show me this until you're finished\".<\/li>\n<\/ul>\n<p><strong>When to use which:<\/strong><\/p>\n<ul>\n<li>Use Enter to correct the builder in the middle of a job.<\/li>\n<li>Use Option and Enter for a new, unrelated task that should not pull the builder away from the current one.<\/li>\n<\/ul>\n<p><strong>You can change any of these keys, and add your own.<\/strong> You can move most keys in a builder to a key you prefer. Annie does not know every shortcut, and nobody needs to. To find them:<\/p>\n<ul>\n<li>search the web for the builder's name and \"keyboard shortcuts\", for example \"Claude Code keyboard shortcuts\", or<\/li>\n<li>ask your builder to list its shortcuts and change one for you (Annie, 10 Oct 2026).<\/li>\n<\/ul>\n<p>You build with pi only. So the two Claude Code rows apply only if you add Claude later.<\/p>\n<h2>Your Builder, and Claude If You Want It<\/h2>\n<p>You need a builder for this course. A builder is the AI that installs software, edits files and fixes problems while you describe what you want in plain English.<\/p>\n<p><strong>In this course you build with pi (harness), connected to opencode Go (AI provider).<\/strong><\/p>\n<ul>\n<li>pi is a way to connect to many AI models, such as DeepSeek and Kimi K3. These open models are good, and they cost much less than the big Western models. opencode Go costs $10 a month.<\/li>\n<li>pi answers from Hong Kong directly. You need no VPN and no server (Build Log 103).<\/li>\n<li>pi understands unclear instructions less well than Claude Code. So your instructions need to be clear. This course shows you how to write them.<\/li>\n<\/ul>\n<p><strong>If you want Claude, a VPN is a very good option.<\/strong><\/p>\n<ul>\n<li>With a VPN on, Claude Code works on your laptop. A VPN costs about $3 a month. Annie pays that for ExpressVPN. Claude Pro costs $17 to $20 a month on top.<\/li>\n<li>Annie found Claude Code much easier for a non-developer building something new. It works out what you meant from an unclear description (Annie's notes, 29 Sep 2026).<\/li>\n<li>She reached Claude through a paid VPN before she had her own server.<\/li>\n<li>Anthropic's terms may not allow use from a region it does not serve. So whether to use a VPN is your own decision.<\/li>\n<\/ul>\n<p><strong>The optional server sitting.<\/strong> Students who choose it build their own server in Singapore. The server then becomes their route to Claude, with no paid VPN. It runs as a separate sitting, outside this course's 10 hours.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>pi (harness) with opencode Go (AI provider)<\/th>\n<th>Claude Code (harness) through a VPN<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Works from a Hong Kong connection<\/td>\n<td>Yes<\/td>\n<td>Yes, with the VPN on<\/td>\n<\/tr>\n<tr>\n<td>Monthly cost<\/td>\n<td>$10 for opencode Go<\/td>\n<td>About $20 to $23: Claude Pro plus the VPN<\/td>\n<\/tr>\n<tr>\n<td>Strength<\/td>\n<td>Cheap, fast, and no VPN<\/td>\n<td>Understands unclear, plain-English requests<\/td>\n<\/tr>\n<tr>\n<td>Weakness<\/td>\n<td>Needs clearer instructions from you<\/td>\n<td>Needs the VPN on, and may break Anthropic's terms (see above)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>From the Record<\/h2>\n<p><strong>The test that was not clean.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> In August 2026 Claude suggested two times that the Claude phone app might work in Hong Kong without a VPN. The first time, Tailscale was still connected during the test. The second time, Claude misread a \"Logged out\" label as \"VPN is down\". Both conclusions were wrong, and Annie caught both.<\/li>\n<li><strong>The cost:<\/strong> two wasted rounds of testing.<\/li>\n<li><strong>The lesson:<\/strong> when a test seems to disprove something you already know, check that the test was clean before you believe it.<\/li>\n<li><strong>Source:<\/strong> Build Log 68.<\/li>\n<\/ul>\n<p><strong>The models on the price list that would not answer.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> In September 2026 Claude recommended two Western models for Annie's bots. Both were blocked for her reseller account, and her notes already said so. Annie asked, \"is Haiku better than GLM? try again.\" A one-line hello through her OpenRouter key returned 403 for every Anthropic and Google model. Only the open-weight models answered.<\/li>\n<li><strong>The cost:<\/strong> a bot that would not have worked was nearly built.<\/li>\n<li><strong>The lesson:<\/strong> a model on a price list may still refuse you. Before you recommend one, send it a hello from the machine and key that will really use it.<\/li>\n<li><strong>Source:<\/strong> Build Logs 80 and 84.<\/li>\n<\/ul>\n<p><strong>The table that went out of date.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> For months, Annie's notes said that Google's AI was blocked in Hong Kong. In March 2026, consumer Gemini opened to Hong Kong. Nobody noticed until September, when a beginner seminar was being planned and Annie found the change herself.<\/li>\n<li><strong>The cost:<\/strong> a seminar was nearly designed around a tool the audience could not use. The tool they could use was already open.<\/li>\n<li><strong>The lesson:<\/strong> put a date on every fact about what works. Check it again before you teach or build on it.<\/li>\n<li><strong>Source:<\/strong> Build Log 83.<\/li>\n<\/ul>\n<p><strong>The block that a VPN cannot fix.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> In May 2026 Annie needed to buy API credit for her first bot. The developer website refused a Hong Kong billing address. A VPN changed nothing, because the check was on the card. It took about a week of her own research to find a way.<\/li>\n<li><strong>The lesson:<\/strong> your connection, your sign-up details and your billing address are three separate checks. A fix for one does not fix the others.<\/li>\n<li><strong>Source:<\/strong> Build Log 00.<\/li>\n<\/ul>\n<p><strong>The test that came from the wrong country.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> On 9 October 2026, this module's own Hong Kong test came back \"405, access works\" two times. The first run went out through Taiwan. The second went out through an address on New York time. A third run, from a setting that had passed a location check, returned 403.<\/li>\n<li><strong>The cost:<\/strong> nothing, because the third run happened before the table was written.<\/li>\n<li><strong>The lesson:<\/strong> before you trust a location test, prove where the request came from.<\/li>\n<li><strong>Source:<\/strong> this module's own test, 9 Oct 2026.<\/li>\n<\/ul>\n<h2>Exercise<\/h2>\n<p>Answer two questions in writing.<\/p>\n<ol>\n<li>Which builder will you use? What is your route to Claude, if you want one? Give your reason in one sentence.<\/li>\n<li>Which AI tools have you been reaching through another route, such as a VPN or a work network? Did you know you were doing that?<\/li>\n<\/ol>\n<p>Most people find at least one tool they reach through another route.<\/p>\n<h2>Worksheet: Your Access Sheet<\/h2>\n<p>Copy this table into a new note called <code>Access Sheet<\/code> in your notes app. You move it into your notes folder later in the course.<\/p>\n<table>\n<thead>\n<tr>\n<th>Tool<\/th>\n<th>What I use it for<\/th>\n<th>Works from Hong Kong directly? (Y / N / test code)<\/th>\n<th>My route<\/th>\n<th>Account created?<\/th>\n<th>Tested on (date)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Gemini (consumer)<\/td>\n<td><\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My builder (pi)<\/td>\n<td>Building and fixing<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Claude, if I want it<\/td>\n<td><\/td>\n<td><\/td>\n<td>VPN, or my own server if I take the optional server sitting<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>opencode Go (AI provider)<\/td>\n<td>The models for pi<\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Gemini, on my phone<\/td>\n<td>My morning message<\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Obsidian<\/td>\n<td>My notes, in one place<\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Tailscale (only with the optional server sitting)<\/td>\n<td>Private network and route out<\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Server company (only with the optional server sitting)<\/td>\n<td>Computer that is always on<\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Other:<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>My open question for the facilitator:<\/strong><\/p>\n<p><strong>Next: the privacy module (Module 02).<\/strong> You know which tools answer. Now you decide what each one is allowed to see.<\/p>\n<h2>Teaching Notes<\/h2>\n<ul>\n<li><strong>Three students at most in each class<\/strong> (Annie's rule, 9 Oct 2026). Hard material cannot be taught well to a bigger group. Never take the keyboard. The student must be able to do it again at home, alone.<\/li>\n<li><strong>Expect the terms question early.<\/strong> Someone will ask whether a VPN is legal or allowed. Answer with facts only:<\/li>\n<li>The block is the company's choice.<\/li>\n<li>A workaround may break the company's terms.<\/li>\n<li>Each person decides.<\/li>\n<li>Do not promise that any route will keep working.<\/li>\n<li><strong>A Claude model through opencode is being checked.<\/strong> opencode Go's model list has one Claude model, Claude Haiku 5.5, the smallest one. On 9 October 2026 it answered through Annie's opencode Go plan from a Taiwan connection. It has not been tested from Hong Kong. Run the check in the Merge Tracker before teaching. Until it passes from Hong Kong, call it \"being checked\". The larger Claude models are pay-per-use only on opencode, not on the Go plan.<\/li>\n<li><strong>Never say Claude Code or the Claude apps work in Hong Kong without a route.<\/strong> This includes the phone apps. If a Claude screen seems to work without a route, the usual reason is that the session is really running on a server in another country. The one open question is a Claude model through opencode. Until that check passes from Hong Kong, call it \"being checked\".<\/li>\n<li><strong>The terminal is new for most students.<\/strong> They first open it in the build module (Module 08). Say \"unfamiliar, not hard\".<\/li>\n<li><strong>Windows students need different commands.<\/strong> Keep the PowerShell lines on the slide next to the Mac lines. Nobody has run the Windows lines on a Windows laptop yet. Run them once before teaching.<\/li>\n<li><strong>Company laptops cause most failures.<\/strong> Firewalls and company settings often block the test. If a student has one, they do the install in the build module (Module 08) at home, on a personal laptop.<\/li>\n<\/ul>"}, {"id": "short-2", "title": "02: Privacy, Security and Whose Law Reaches Your Data", "handout": false, "html": "<h1>Module 02: Privacy, Security and Whose Law Reaches Your Data<\/h1>\n<p><strong>How to read this file.<\/strong> This is the Short course copy: 10 hours over three days, built with pi on your laptop and Gemini on your phone. Every segment in it is taught. The master copy for both courses is in <code>modules/<\/code>.<\/p>\n<ul>\n<li><strong>The reading is in the handout,<\/strong> <code>02 — Handout, More on Privacy and the Law (Short)<\/code>: six ways to run an AI tool, when the model you rent changes, Hong Kong law, and four stories from Annie's record.<\/li>\n<\/ul>\n<p><strong>Why this module comes here.<\/strong><\/p>\n<ol>\n<li>The access module (Module 01) told you which tools answer. Before you connect any of them, you decide what each one may see.<\/li>\n<li>A permission given in a hurry is hard to take back. When Annie asked Google for less access to her email, Google kept the wider access she had given before.<\/li>\n<li>You leave with your What AI Is Allowed to See sheet. The rules module (Module 07) and the build module (Module 08) turn it into rules your AI must follow.<\/li>\n<\/ol>\n<h2>Run Sheet<\/h2>\n<table>\n<thead>\n<tr>\n<th>Min<\/th>\n<th>Segment<\/th>\n<th>Facilitator does<\/th>\n<th>Students do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5<\/td>\n<td>Your one-line rule, and the three-part danger<\/td>\n<td>Reads Annie's rule. Explains the three things an AI assistant must never have all at once: your private data, content from strangers, and a way to send data out<\/td>\n<td>Write their own one-line rule on the worksheet<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>The four habits that enforce the rule<\/td>\n<td>Walks the four habits. Tells Annie's Google story under \"revoke at the source\"<\/td>\n<td>Mark which habits they already keep<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Whose law can reach your data<\/td>\n<td>Defines where data sits, whose law can reach it, and who can read it. Walks the company list and the setting that lets a company train on your data<\/td>\n<td>Mark the companies they already use<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Build your What AI Is Allowed to See sheet<\/td>\n<td>Checks each sheet<\/td>\n<td>Fill in the three tiers and the protection checklist<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>How the minutes add up.<\/strong><\/p>\n<ul>\n<li><strong>35 minutes.<\/strong> The one-line rule and the three-part danger take 5 minutes. The four habits take 10. Whose law takes 10. The What AI Is Allowed to See sheet takes 10.<\/li>\n<\/ul>\n<h2>What You Will Leave With<\/h2>\n<p><strong>Your What AI Is Allowed to See sheet.<\/strong> It sorts your information into three tiers: open, personal and never.<\/p>\n<ul>\n<li>For each tier, it names the companies you allow.<\/li>\n<li>For each tier, it names the places the data may be stored.<\/li>\n<li>It ends with a short list of things that never go into any AI tool.<\/li>\n<li>It also has a protection checklist for your accounts.<\/li>\n<\/ul>\n<p>Two later modules use the map:<\/p>\n<ul>\n<li>The rules module (Module 07) turns the map into rules your AI assistant must follow.<\/li>\n<li>The builder module (Module 08) copies your list of things that never go into any AI tool into your builder's instructions.<\/li>\n<\/ul>\n<h2>Before This Module<\/h2>\n<ul>\n<li><strong>Module 01 finished.<\/strong> You need your Access Sheet. It lists the tools you are about to sort.<\/li>\n<li><strong>A list of your accounts.<\/strong> Email, calendar, cloud storage, password manager, and any AI tools you already use.<\/li>\n<li><strong>Your phone.<\/strong> You will check two-factor sign-in on it.<\/li>\n<\/ul>\n<h2>Your One-Line Rule, and the Three-Part Danger<\/h2>\n<p><em>5 minutes.<\/em><\/p>\n<p>Annie wrote one rule in June 2026. She tested every later connection against it (Build Log 00 and the trust-boundary session of 24 Jun 2026):<\/p>\n<blockquote>\n<p><strong>Read freely. Write to my own notes freely. Anything that goes to another person needs my yes, every time.<\/strong><\/p>\n<\/blockquote>\n<p><strong>Why this one rule matters.<\/strong> In June 2025 the writer Simon Willison named the most dangerous combination in AI tools. It is an AI assistant that does all three of these:<\/p>\n<ol>\n<li>It holds your private data.<\/li>\n<li>It reads content from strangers, such as incoming email.<\/li>\n<li>It has a way to send data out.<\/li>\n<\/ol>\n<p>Take away the way out. Then an instruction hidden in a stranger's email cannot send your data anywhere.<\/p>\n<p>So the order in this course matters:<\/p>\n<ol>\n<li>First, decide what data goes where. This module gives you those decisions.<\/li>\n<li>Then, connect only the tools that fit those decisions. The build module (Module 08) makes those connections.<\/li>\n<\/ol>\n<h2>The Four Habits That Enforce the Rule<\/h2>\n<p><em>10 minutes.<\/em><\/p>\n<p>Four habits make the rule real.<\/p>\n<p><strong>Habit 1: Put the limit in the permission, not in the instructions.<\/strong><\/p>\n<ul>\n<li>A sentence such as \"never send email\" is a request. The model can misread it.<\/li>\n<li>Annie's email tool has read-only access at Google's end.<\/li>\n<li>Its script also has no command that sends.<\/li>\n<li>So Google refuses a send even if something tries one (Build Log 18).<\/li>\n<li>That is two separate protections. Neither depends on the model behaving.<\/li>\n<\/ul>\n<p><strong>Habit 2: Give each tool the smallest access that does the job.<\/strong><\/p>\n<ul>\n<li>Say a bot needs one calendar.<\/li>\n<li>Give it a small script that can only read that one calendar.<\/li>\n<li>Do not give it your whole account plus a sentence asking it to stay in one corner.<\/li>\n<li>Annie built exactly this for a family member's tutor bot (Build Log 54).<\/li>\n<\/ul>\n<p><strong>Habit 3: Revoke at the source before you delete anything.<\/strong><\/p>\n<ul>\n<li>A permission given in a hurry is hard to take back. Here is what happened to Annie (Build Log 14):\n  1. In June 2026, Annie asked Google to give her bot less access to her email.\n  2. Google kept the old, wider permission anyway.\n  3. The reason: a smaller request does not cancel a larger one you granted before.\n  4. She had to remove the app's access completely and start again.<\/li>\n<li>Deleting a file that holds a login does not cancel the login either.<\/li>\n<li>The login still works from any backup copy.<\/li>\n<li>In June 2026, an old Google login on Annie's server still had wide calendar access. Her bot used it once, even though its rules said never to (Build Log 16).<\/li>\n<li>The fix had three steps, in this order:\n  1. Cancel the login at Google.\n  2. Check that Google refused it.\n  3. Only then delete the files.<\/li>\n<li>The same applies inside chat apps. Disconnecting a tool inside a chat app does not cancel its permission at the company that granted it. The permission stays live until you remove it there too (Build Log 61).<\/li>\n<\/ul>\n<p><strong>Habit 4: Label every paste before you paste it.<\/strong><\/p>\n<ul>\n<li>Before your builder asks you to paste anything, it should say which kind it is:<\/li>\n<li>safe to paste,<\/li>\n<li>remove the secret first, or<\/li>\n<li>never paste.<\/li>\n<li>Never paste passwords, API keys, tokens or private keys into any chat (Build Log 00).<\/li>\n<li>You will put this rule into your builder's instructions in the builder module (Module 08).<\/li>\n<\/ul>\n<h2>Whose Law Can Reach Your Data<\/h2>\n<p>People use three words as if they mean the same thing. They do not.<\/p>\n<ul>\n<li><strong>Where the data sits.<\/strong> This is the country the computer holding it is in. Lawyers call this residency.<\/li>\n<li><strong>Whose law can reach it.<\/strong> This is which government can order someone to hand the data over. It depends mostly on where the company is based. It does not depend only on where the computer is. In meetings you will hear this called <strong>sovereignty<\/strong>.<\/li>\n<li><strong>Who can read it.<\/strong> This depends on the company's settings, its contract with you, and the people who run it. This is confidentiality.<\/li>\n<\/ul>\n<p><strong>Where the data sits does not decide whose law reaches it.<\/strong><\/p>\n<ul>\n<li>A US company storing your data in Singapore still has to answer US legal orders.<\/li>\n<li>The law behind this is the US CLOUD Act (2018, 18 U.S.C. section 2713).<\/li>\n<li>It lets US authorities require a US company to hand over data in its control. This applies wherever the data is stored.<\/li>\n<\/ul>\n<p>Annie described her own system honestly in July 2026 (Build Log 28):<\/p>\n<ul>\n<li>Her data sits on machines she controls. That is ownership.<\/li>\n<li>Her backups and models still pass through companies under foreign law. So it is not full sovereignty.<\/li>\n<\/ul>\n<p><strong>Renting a server is choosing a country.<\/strong> You pick a data centre when you sign up. Most people never notice they chose.<\/p>\n<ul>\n<li>Annie's server sits in Singapore (Build Log 00).<\/li>\n<li>She rents it from a company based in Germany.<\/li>\n<li>So two countries are involved: the one where the data sits, and the one where the company is based.<\/li>\n<\/ul>\n<p><strong>The server company's country and the data centre's country can both reach everything on the server. Each AI company's country can reach only what you send it.<\/strong><\/p>\n<p>Here is how that works for Annie's own data. Each country reaches a different slice. (Checked 10 Oct 2026.)<\/p>\n<ol>\n<li><strong>The United States, through Claude and other US companies.<\/strong>\n   - US law reaches what Annie sends to Claude, such as her chats and the files Claude reads.\n   - It does not reach her whole server.\n   - Claude is not her only US company. opencode, which runs her bots, is in San Francisco. Google holds her email, her calendar and her password-locked backups on Google Drive.\n   - So US law reaches more of her data than Claude alone.<\/li>\n<li><strong>Singapore, because the server sits there.<\/strong>\n   - Singapore law reaches everything on the server.\n   - The reason: the whole disk is physically in Singapore.<\/li>\n<li><strong>Germany, because Hetzner is a German company.<\/strong>\n   - The company is Hetzner Online GmbH, in Gunzenhausen, Germany.\n   - German law also reaches everything on the server, because Hetzner controls the machine.\n   - Hetzner's terms say encryption is the customer's job, not Hetzner's.<\/li>\n<li><strong>The British Virgin Islands and Dubai, through Telegram.<\/strong>\n   - Annie's chats with her bot pass through Telegram's companies in those two places.\n   - Bot chats are not end-to-end encrypted.<\/li>\n<\/ol>\n<p><strong>In short:<\/strong> Singapore and Germany can reach the whole server. The United States can reach whatever passes through its companies, and for Annie that is a lot. This is what Annie meant by \"ownership, not full sovereignty\" (Build Log 28). She owns the machine. Several countries can still reach parts of it.<\/p>\n<p><strong>The companies this course uses or mentions.<\/strong> Policies change. Check each company before you rely on what is written here.<\/p>\n<p><strong>Anthropic (Claude), OpenAI, Google, Microsoft<\/strong><\/p>\n<ul>\n<li>Based in: the United States.<\/li>\n<li>What it means for you: US law can reach your data, wherever it is stored.<\/li>\n<\/ul>\n<p><strong>opencode Go (AI provider: the model subscription pi uses)<\/strong><\/p>\n<ul>\n<li>Based in: the United States. The company is Anomaly, in San Francisco.<\/li>\n<li>US law reaches opencode.<\/li>\n<li>For the AI model DeepSeek V4.1 Flash on the Go plan, opencode states two things:<\/li>\n<li>The data is not used for training.<\/li>\n<li>The data is kept for 0 days.<\/li>\n<li>That rests on an agreement with DeepSeek. opencode renews it monthly. It is currently valid to 31 Oct 2026.<\/li>\n<li>The Go page does not say which country runs the model.<\/li>\n<li>opencode's separate pay-per-use service (Zen) says its models run in the US and the EU.<\/li>\n<li>Source: opencode Go and Zen pages, and privacy policy, read 9 Oct 2026.<\/li>\n<\/ul>\n<p><strong>DeepSeek (its own app and API)<\/strong><\/p>\n<ul>\n<li>Based in: mainland China.<\/li>\n<li>Its privacy policy says it collects, processes and stores personal data in the People's Republic of China.<\/li>\n<li>It uses data to train its models.<\/li>\n<li>You have the right to opt out.<\/li>\n<li>Source: DeepSeek privacy policy, read 9 Oct 2026.<\/li>\n<\/ul>\n<p><strong>Qwen (Alibaba), Kimi (Moonshot), GLM (Zhipu), each through its own app<\/strong><\/p>\n<ul>\n<li>Based in: mainland China.<\/li>\n<li>The same question applies to each company's own app. Read each policy.<\/li>\n<\/ul>\n<p><strong>A Chinese-made model reached through another company<\/strong><\/p>\n<ul>\n<li>Based in: wherever that other company is based.<\/li>\n<li>You are bound by the host's policy, not the model maker's.<\/li>\n<li>opencode above is the example: a US company serving models made in China.<\/li>\n<\/ul>\n<p><strong>Mistral<\/strong><\/p>\n<ul>\n<li>Based in: France (European Union).<\/li>\n<li>EU data protection law (GDPR) applies.<\/li>\n<\/ul>\n<p><strong>Telegram<\/strong><\/p>\n<ul>\n<li>Based in: Telegram Group Inc. is in the British Virgin Islands. Telegram FZ-LLC is in Dubai.<\/li>\n<li>Chats with a bot are cloud chats. They are not end-to-end encrypted.<\/li>\n<li>Only Telegram's secret chats are end-to-end encrypted. Bots cannot use secret chats.<\/li>\n<li>Whoever runs the bot receives every message you send it.<\/li>\n<li>Source: Telegram privacy policy, sections 3.3 and 6, read 9 Oct 2026.<\/li>\n<\/ul>\n<p><strong>Your rented server (only if you take the optional server sitting)<\/strong><\/p>\n<ul>\n<li>Based in: the server company's country, plus the data centre you pick.<\/li>\n<li>Pick the data centre on purpose.<\/li>\n<\/ul>\n<p><strong>Hong Kong's own privacy law also applies to you.<\/strong> It is the Personal Data (Privacy) Ordinance (PDPO).<\/p>\n<p>The handout, <code>02 — Handout, More on Privacy and the Law (Short)<\/code>, has the five-minute version of the law.<\/p>\n<ul>\n<li>It covers personal data you put into any tool.<\/li>\n<li>That includes data about other people.<\/li>\n<li>Your family's and your friends' details belong to them as well as to you.<\/li>\n<\/ul>\n<p><strong>Training on your data is a setting, not a fact.<\/strong><\/p>\n<ul>\n<li>Since August 2025, people on Claude's Free, Pro and Max plans choose whether their chats and coding sessions train future models.<\/li>\n<li>If you allow it, Anthropic keeps the data for up to 5 years.<\/li>\n<li>If you do not allow it, Anthropic keeps it for 30 days.<\/li>\n<li>Source: Anthropic, \"Updates to Consumer Terms and Privacy Policy\", Aug 2025.<\/li>\n<\/ul>\n<p>Check this setting today on every AI account you hold.<\/p>\n<h2>Build Your What AI Is Allowed to See Sheet<\/h2>\n<ol>\n<li>Fill in the worksheet below.<\/li>\n<li>Then fill in the protection checklist.<\/li>\n<\/ol>\n<h2>Exercise<\/h2>\n<p>Take three real things you want your system to handle. For example: your family calendar, your expense receipts, and your meeting notes.<\/p>\n<p>For each one, answer on paper:<\/p>\n<ol>\n<li>Which tier is it in: open, personal, or never?<\/li>\n<li>Which company will process it? Which country's law reaches that company?<\/li>\n<li>If that company changed its terms tomorrow, which of your files would you need to keep?<\/li>\n<\/ol>\n<h2>Worksheet: What AI Is Allowed to See<\/h2>\n<p><strong>My one-line rule:<\/strong> ____________________________________________<\/p>\n<table>\n<thead>\n<tr>\n<th>Tier<\/th>\n<th>What belongs here<\/th>\n<th>My examples<\/th>\n<th>Companies I allow<\/th>\n<th>Where it may be stored<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Open<\/td>\n<td>Public information, research, drafts I would publish anyway<\/td>\n<td><\/td>\n<td>Any company on my Access Sheet<\/td>\n<td>Anywhere<\/td>\n<\/tr>\n<tr>\n<td>2. Personal<\/td>\n<td>My notes, plans, calendar, family admin<\/td>\n<td><\/td>\n<td>Only companies I chose on purpose, with training switched off<\/td>\n<td>My laptop and my notes. My own server, if I have one<\/td>\n<\/tr>\n<tr>\n<td>3. Never<\/td>\n<td>Passwords, keys, ID numbers, bank and card numbers, other people's confidential business<\/td>\n<td><\/td>\n<td>None. These never go into any AI tool or bot chat<\/td>\n<td>A password manager only<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Client or employer information:<\/strong> keep it out of your personal bot, unless your organisation has approved a tool for it. Write your organisation's rule here: ____________<\/p>\n<p><strong>Protection checklist<\/strong> (tick each one before the builder module (Module 08)):<\/p>\n<ul>\n<li>[ ] Disk encryption is on for my laptop (FileVault on Mac, BitLocker or Device Encryption on Windows).<\/li>\n<li>[ ] I use a password manager, and no password lives in my notes.<\/li>\n<li>[ ] Two-factor sign-in is on for my email, my Google account, every AI account, and my server company if I have one.<\/li>\n<li>[ ] I have unchecked the \"use my data for training\" setting on every AI account.<\/li>\n<li>[ ] I know which of my accounts are work accounts and which are personal.<\/li>\n<\/ul>\n<p><strong>Next: how your system fits you (Module 03A).<\/strong> You know what your AI may see. Now you build the one place your notes go. Then, in Module 03B, you choose where everything lives.<\/p>\n<h2>Teaching Notes<\/h2>\n<ul>\n<li><strong>Three students at most in each class.<\/strong> Walk through each student's What AI Is Allowed to See sheet with them. The sheet is personal. Do it beside them, not on the projector.<\/li>\n<li><strong>opencode is the best example in the module.<\/strong> It is a US company. It serves a model made in China. It works under an agreement about where data is kept. So the company's country, the model maker's country and the place the data sits are three different answers.<\/li>\n<li><strong>Students will want a verdict on Chinese against US companies.<\/strong> Do not give one. Give the facts in the company list. Let each student place each kind of data. The answer differs by kind of data.<\/li>\n<li><strong>Keep the CLOUD Act factual.<\/strong> Say what the law allows and when it was passed. Do not guess how often it is used.<\/li>\n<li><strong>The stories inside the four habits carry this module.<\/strong> Read them as written. They show a careful owner who still found gaps. That is more convincing than a list of rules. The handout has four more.<\/li>\n<li><strong>Developers will ask about encryption and key management.<\/strong> Point them to the optional server sitting (Module 08B) (one source for each secret). Point them to the module on what breaks (Module 10) for replacing keys.<\/li>\n<li><strong>The company list can turn into a long debate.<\/strong> Keep it to 10 minutes.<\/li>\n<li><strong>Do not show real screenshots.<\/strong> Any example on a slide uses invented names. Never show codes, account numbers or web addresses that contain keys.<\/li>\n<\/ul>"}, {"id": "short-3", "title": "02: Handout, More on Privacy and the Law", "handout": true, "html": "<h1>More on Privacy and the Law<\/h1>\n<p><em>A handout for Module 02, both courses. Read at home. The one-line rule and the four habits were taught in class. This is the background.<\/em><\/p>\n<h2>Six Ways to Run an AI Tool, From App to Offline Machine<\/h2>\n<p>Most people think there are two choices: use the app, or run your own model. In fact there are six levels. Each level up gives you more control. Each level up also gives you more work. (Source: Annie's write-up \"The Rented Brain\", July 2026.)<\/p>\n<ol>\n<li><strong>A consumer app<\/strong> (free or paid personal plan).\n   - Fine for: low-stakes personal use.\n   - Your data may train the model unless you turn that off.<\/li>\n<li><strong>A business or team plan.<\/strong>\n   - Fine for: work use.\n   - It has admin controls. It usually does not train on your data by default.<\/li>\n<li><strong>The API under business terms, or through a cloud platform you already trust.<\/strong>\n   - Fine for: confidential work.\n   - Contracts can forbid training. Contracts can also set where data is processed.<\/li>\n<li><strong>A private deployment for your organisation.<\/strong>\n   - Fine for: regulated work at scale.<\/li>\n<li><strong>An open-weight model file run on your own hardware.<\/strong>\n   - Fine for: data that must not leave your control.\n   - You now own the updates and the security.<\/li>\n<li><strong>The same, on a machine with no internet connection.<\/strong>\n   - Fine for: the most sensitive data.\n   - It is hard to keep up to date.<\/li>\n<\/ol>\n<p><strong>Using an app and running a model file are different things.<\/strong> (Source: The Rented Brain, July 2026.)<\/p>\n<ul>\n<li>The DeepSeek app sends your data to servers in mainland China.<\/li>\n<li>Several governments banned the app on official devices for that reason.<\/li>\n<li>Those bans do not cover the model file itself.<\/li>\n<li>Running the model file on your own machine sends nothing to China.<\/li>\n<\/ul>\n<p>Your builder in this course, pi, uses a hosted model through a subscription. That is level 1 to 3, not level 5. Gemini on your phone is level 1. So the company list in the privacy module (Module 02) applies to you.<\/p>\n<p><strong>Pick a level for each kind of data, not one level for everything.<\/strong> Personal notes and family admin can sit at a lower level than anything more sensitive. Write that choice on your What AI Is Allowed to See sheet.<\/p>\n<p><strong>One question for your own tools.<\/strong> Take three real things you want your system to handle. For each one: which of the six levels, from consumer app to offline machine, is acceptable for it?<\/p>\n<h2>When the Model You Rent Changes<\/h2>\n<p>You do not own the model. You rent it, and the company can change it. There are four ways this can hurt you (The Rented Brain, verified 6 Jul 2026).<\/p>\n<ol>\n<li><strong>It is taken away.<\/strong>\n   - OpenAI removed GPT-4o from ChatGPT on 7 August 2025. That was the day GPT-5 launched.\n   - After complaints, GPT-4o came back for paid users a few days later (OpenAI release notes; Ars Technica, Aug 2025).\n   - Users had no warning before it was removed.\n   - Notice periods for API models range from 60 days to 6 months. Consumer apps owe no notice at all.<\/li>\n<li><strong>It changes without a new name.<\/strong>\n   - Anthropic's own September 2025 report described three server bugs.\n   - They lowered answer quality for about a month.\n   - The model itself was unchanged.<\/li>\n<li><strong>Your data sits in someone else's systems.<\/strong>\n   - In the New York Times case against OpenAI, a court ordered a sample of 20 million conversations to be handed over.<\/li>\n<li><strong>The price, the terms or the countries served change.<\/strong>\n   - Module 01 showed how much the countries matter from Hong Kong.<\/li>\n<\/ol>\n<p><strong>Keep everything except the model in your own files.<\/strong><\/p>\n<ul>\n<li>Your rules, your memory, your instructions and your notes live in plain files in your notes folder.<\/li>\n<li>Then a model change is a small edit.<\/li>\n<\/ul>\n<p>Here is Annie's example:<\/p>\n<ol>\n<li>In September 2026, Annie moved two of her bots onto the model her main bot already used.<\/li>\n<li>The change was a short edit to each bot's settings file (Build Log 92).<\/li>\n<li>It still broke both bots, until each bot was given its own key (Build Log 94).<\/li>\n<li>The reason: each bot reads only its own settings file.<\/li>\n<li>A restart looked healthy. Every real message still failed.<\/li>\n<\/ol>\n<p>So a model change is small, and it still needs a real test message for each piece.<\/p>\n<p>Keep a short list of real questions with known good answers. Then you can test any replacement quickly. The rules module (Module 07) builds that list.<\/p>\n<h2>Hong Kong Law in Five Minutes<\/h2>\n<p><strong>The PDPO applies to personal data you put into any tool.<\/strong> That includes data about other people.<\/p>\n<p><strong>Section 33 is not in force.<\/strong><\/p>\n<ul>\n<li>It would restrict sending personal data outside Hong Kong.<\/li>\n<li>It has been in the law since the PDPO took effect in 1996.<\/li>\n<li>It has never been switched on.<\/li>\n<li>Law firms now say it may never come into force (Baker McKenzie; Tanner De Witt, seen 9 Oct 2026).<\/li>\n<li>That is a reason to build good habits now. It is not a reason to relax.<\/li>\n<li>The Privacy Commissioner (PCPD) still publishes guidance on sending data abroad.<\/li>\n<\/ul>\n<p><strong>Agentic AI guidance, 25 August 2026.<\/strong><\/p>\n<ul>\n<li>The PCPD published \"Protecting Personal Data Privacy in the Use of Agentic AI\".<\/li>\n<li>It adds to the PCPD's June 2024 AI framework.<\/li>\n<li>It is written for organisations and individuals.<\/li>\n<li>It is guidance, not a binding rulebook (PCPD; Dentons Hong Kong, 1 Sep 2026; Bird &amp; Bird, 27 Aug 2026).<\/li>\n<li>Its first recommendation: do not collect more personal data than the agent needs.<\/li>\n<li>That is the same idea as this module's Habit 2: give each tool the smallest access that does the job.<\/li>\n<\/ul>\n<p>Facilitator: bring the current PCPD guidance to the session (pcpd.org.hk, under Artificial Intelligence).<\/p>\n<h2>From the Record<\/h2>\n<p><strong>The drafts request.<\/strong> (Source: Build Log 20.)<\/p>\n<ol>\n<li>In June 2026, Annie asked whether her bot could save approved email replies into her Gmail drafts folder.<\/li>\n<li>Her builder checked the real permissions before answering.<\/li>\n<li>Google has no permission that allows drafts but not sending. The smallest permission that writes drafts can also send.<\/li>\n<li>So the change would turn \"sending is impossible\" into \"sending is possible but unused\".<\/li>\n<li>Annie shelved the feature. She called the explanation \"huge to me\".<\/li>\n<\/ol>\n<p>The cost was one convenience given up. The lesson: when the exact control you want does not exist, choose the stricter control you can prove.<\/p>\n<p><strong>Moving a key is not securing it.<\/strong> (Source: Build Log 103.)<\/p>\n<ol>\n<li>On 30 September 2026, the builder moved a web-service key out of one settings file and into its own file.<\/li>\n<li>It called this a security improvement.<\/li>\n<li>Annie asked one question: \"did we not move the old credential straight to the secrets.env file?\"<\/li>\n<li>She was right. The same key now existed in nine places on the server.<\/li>\n<li>Only replacing the key with a new one retires every old copy.<\/li>\n<li>A one-command script now does three things: it updates every live copy, restarts the programs that read it, and checks they reconnect.<\/li>\n<\/ol>\n<p>The lesson: count every copy of a secret before you claim it is safe.<\/p>\n<p><strong>The photo reached the gallery first.<\/strong> (Source: Build Log 82.)<\/p>\n<ol>\n<li>Annie wanted photos she sent to her storage bot kept out of Google Photos.<\/li>\n<li>Her builder recorded her real steps on screen. It read the video frame by frame.<\/li>\n<li>Taking a photo with the camera writes a copy to the phone's public gallery. This happens before Telegram or any bot is involved.<\/li>\n<li>No setting in the chat app can stop that.<\/li>\n<\/ol>\n<p>The lesson: check where your phone has already put private material before you worry about the bot.<\/p>\n<p><strong>Two printed keys.<\/strong> (Source: Build Log 103 and Annie's notes.)<\/p>\n<ol>\n<li>Twice on 30 September 2026, a session inspected a settings file to see its structure.<\/li>\n<li>Both times, it printed a live key on screen.<\/li>\n<li>Both times, it looked like a harmless check.<\/li>\n<li>The terminal keeps a record. So do AI tools.<\/li>\n<\/ol>\n<p>The house rule since then: when you inspect settings, print the names of keys, never their values.<\/p>"}, {"id": "short-4", "title": "03A: A System That Fits How You Think", "handout": false, "html": "<h1>Module 03A: A System That Fits How You Think<\/h1>\n<p><strong>How to read this file.<\/strong> This is the Short course copy: 10 hours over three days, built with pi on your laptop and Gemini on your phone. Every segment in it is taught. The master copy for both courses is in <code>modules/<\/code>.<\/p>\n<p>This is the first half of what was Module 03. It fits the system to the person and builds the notes vault. The second half, which picks the machine, is <code>03B — Where Your System Lives<\/code>. Both are taught on Day 1.<\/p>\n<p><strong>Why this module comes here.<\/strong><\/p>\n<ol>\n<li>You know your tools (Module 01) and your limits (Module 02). Now you fit the system to how you work, and give your notes a home.<\/li>\n<li>Two copies of one file drift apart. So you build one folder of plain notes, called a vault, that every tool reads.<\/li>\n<li>You leave with a working vault on your laptop. Every later module reads from it.<\/li>\n<\/ol>\n<h2>Run Sheet<\/h2>\n<table>\n<thead>\n<tr>\n<th>Min<\/th>\n<th>Segment<\/th>\n<th>Facilitator does<\/th>\n<th>Students do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5<\/td>\n<td>Where is the one real copy?<\/td>\n<td>Asks where each student's notes, tasks and instructions live today<\/td>\n<td>Count their current homes on paper<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>Five questions about how you work<\/td>\n<td>Explains the five questions and Annie's worked example<\/td>\n<td>Answer the six-line worksheet<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>The parts of the system<\/td>\n<td>Walks the diagram<\/td>\n<td>Label the diagram on the worksheet<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>The vault, and one job each for calendar, vault and inbox<\/td>\n<td>Explains calendar for time, vault for knowledge, inbox for capture<\/td>\n<td>Choose their daily starting point<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>Build your vault<\/td>\n<td>Sits beside each student through the install<\/td>\n<td>Install Obsidian, create the vault and folders, move in the Access Sheet and What AI Is Allowed to See sheet<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>How the minutes add up.<\/strong><\/p>\n<ul>\n<li><strong>47 minutes.<\/strong> Counting where your notes live today takes 5 minutes. The five questions about how you work take 15. The parts of the system take 7. The vault, with one job each for calendar, vault and inbox, takes 5. Building the vault takes 15.<\/li>\n<\/ul>\n<p>In both courses, the one-page System Sketch (your system drawn as boxes and arrows) is homework.<\/p>\n<h2>What You Will Leave With<\/h2>\n<ul>\n<li><strong>Your worksheet answers.<\/strong> Six lines about how you find, capture, plan and share.<\/li>\n<li><strong>A working vault.<\/strong> This is an Obsidian folder on your laptop and your phone. It holds your folders, an inbox, a map note (one line per folder saying what lives there), your Access Sheet and your What AI Is Allowed to See sheet.<\/li>\n<li><strong>Homework:<\/strong> a one-page System Sketch: your system drawn as boxes and arrows.<\/li>\n<\/ul>\n<h2>Before This Module<\/h2>\n<ul>\n<li><strong>Modules 01 and 02 finished.<\/strong> Bring the Access Sheet and the What AI Is Allowed to See sheet.<\/li>\n<li><strong>Admin rights on your laptop.<\/strong> You will install one app.<\/li>\n<\/ul>\n<h2>Where Is the One Real Copy?<\/h2>\n<p>Count the places your notes and instructions live today. Most people find four to six. For example:<\/p>\n<ul>\n<li>a notes app<\/li>\n<li>email drafts<\/li>\n<li>a to-do app<\/li>\n<li>documents in Downloads<\/li>\n<li>a chat with an AI that remembers some things<\/li>\n<li>a paper notebook<\/li>\n<\/ul>\n<p>Annie's own system had this problem twice:<\/p>\n<ol>\n<li><strong>June 2026.<\/strong> Her notes about the bot lived in three places: a folder on her Mac, Obsidian, and the bot's server (Build Log 03).<\/li>\n<li><strong>August 2026.<\/strong> Her builder had four separate memories: two accounts on the Mac, one on the server, and an old project folder. They had drifted apart. The version on her phone felt like a stranger, because it read a different copy of her (Build Log 47).<\/li>\n<\/ol>\n<p><strong>Two copies of one file slowly become different from each other. Then you cannot trust either one.<\/strong> That is the reason for this module. The fix is one real copy that every device and every tool reads.<\/p>\n<h2>Claude Only, or Your Own System?<\/h2>\n<p>Many people use one AI app, such as Claude Desktop, and nothing else. That is a reasonable choice. This course builds your own system instead. Here is how to choose between them.<\/p>\n<p><strong>Reasons to use Claude only:<\/strong><\/p>\n<ul>\n<li><strong>Nothing to set up.<\/strong> You sign in and start.<\/li>\n<li><strong>Nothing to maintain.<\/strong> There is no server, no backup and no update to look after.<\/li>\n<li><strong>A large security team protects it.<\/strong> A one-person system is only as safe as its owner keeps it.<\/li>\n<li><strong>One monthly price.<\/strong> There is no second bill for a server or a second AI company.<\/li>\n<\/ul>\n<p><strong>Reasons to build your own system:<\/strong><\/p>\n<ul>\n<li><strong>You own your data.<\/strong> Your notes, rules and memory are plain files on your own machine. No company holds the only copy.<\/li>\n<li><strong>No single company can take it away.<\/strong> If an AI company shuts down, raises its price or blocks your country, you connect your system to another company. Your files stay where they are.<\/li>\n<li><strong>You choose the AI for each job.<\/strong> For example, Annie's bot uses a cheap AI for everyday messages and a stronger one when she asks for it.<\/li>\n<li><strong>You decide who sees what.<\/strong> You choose which company reads which data. The What AI Is Allowed to See sheet in Module 02 is how you decide.<\/li>\n<li><strong>It works away from your desk.<\/strong> A bot on your phone can answer, and scheduled jobs run while you sleep.<\/li>\n<\/ul>\n<p><strong>Annie's view.<\/strong> If any AI company shut down tomorrow, Annie would lose nothing that matters. Her notes, rules and memory live in plain files in her own vault. She would connect her system to the next company and carry on. Someone who keeps everything inside Claude Desktop would lose their chats, projects and saved memory at the same time. Annie says she would feel that same panic if Google went under, because her email and documents live there.<\/p>\n<p><strong>Two honest limits:<\/strong><\/p>\n<ul>\n<li><strong>A download is not a system.<\/strong> Claude lets you download a copy of your data: Settings, then Privacy, then Export data. On a Team or Enterprise plan, only the account owner can do this (Claude Help Center, checked 13 Oct 2026). That gives you a pile of old conversations. It is not a set of working rules and notes you can switch on somewhere else.<\/li>\n<li><strong>Your own system still uses other companies.<\/strong> Annie's uses a rented server, Obsidian to keep her devices in step, and Telegram for her bot. The difference is that her files are plain text with backups in more than one place. So each of those companies can be replaced too.<\/li>\n<\/ul>\n<p><strong>A third choice: a shared memory service.<\/strong> Some new services sell one memory that all your AI apps can read. One example is Living Brain (livingbrain.com, in early access, checked 13 Oct 2026). It looks like an easy version of this course. It is built the opposite way.<\/p>\n<ul>\n<li><strong>Where your notes live.<\/strong> In this course, they live in your own folder. In Living Brain, they live on the company's servers.<\/li>\n<li><strong>Who writes the notes.<\/strong> In this course, you write them and the AI reads them. In Living Brain, the service rewrites what you give it into its own pages. It can merge pages, split them or mark them as not used recently.<\/li>\n<li><strong>If the company closes.<\/strong> In this course, nothing changes. With Living Brain, you keep only your last export. A developer can export the whole memory as one plain text file through its API, so you can leave.<\/li>\n<li><strong>Setup time.<\/strong> This course takes hours. Living Brain's own guide says its setup takes about five minutes.<\/li>\n<\/ul>\n<p>Choose a service like this if you want speed. Choose your own folder if you want control. Annie's view for a bank or a government client is your own folder. Their data usually cannot sit on a new company's servers.<\/p>\n<p><strong>A one-question test.<\/strong> Ask yourself: \"If this company closed tomorrow, what would I lose?\" If the answer is \"a few chats\", Claude alone is fine. If the answer is \"my notes, my rules and how I work\", keep those in your own files.<\/p>\n<h2>Five Questions About How You Work<\/h2>\n<p><strong>There is no correct design. There is only the one that fits the person using it.<\/strong><\/p>\n<ul>\n<li>Most AI advice hands everyone the same tools and the same folders.<\/li>\n<li>When it does not stick, people blame their own discipline.<\/li>\n<li>The real cause is usually that the system was built for someone else's habits.<\/li>\n<li>A system that is awkward to use gets abandoned within a few weeks.<\/li>\n<\/ul>\n<p>These five questions change the design.<\/p>\n<p><strong>1. How do you find things again?<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>If you remember...<\/th>\n<th>Then your system should...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><em>Where<\/em> you saw something<\/td>\n<td>Be organised by place: folders, projects, people<\/td>\n<\/tr>\n<tr>\n<td><em>When<\/em> you saw it<\/td>\n<td>Be organised by time: dated notes and logs<\/td>\n<\/tr>\n<tr>\n<td><em>What it was about<\/em><\/td>\n<td>Be searchable, with notes that link to each other<\/td>\n<\/tr>\n<tr>\n<td>Nothing reliably<\/td>\n<td>Capture things for you automatically, with no filing decision<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The last row matters most for people with busy heads. If saving a thought costs a filing decision, the thought gets lost.<\/p>\n<p><strong>2. How do you capture?<\/strong><\/p>\n<ul>\n<li>Typing, voice, photos, or forwarding things on.<\/li>\n<li>Whatever you actually use is the front door.<\/li>\n<li>A system with a front door you avoid will not be used.<\/li>\n<\/ul>\n<p><strong>3. When are you at your best?<\/strong><\/p>\n<ul>\n<li>Some people plan in the morning and act at night. Others do the reverse.<\/li>\n<li>Your automations should arrive before the moment they are useful.<\/li>\n<li>A 7am summary helps someone who plans early. For someone who plans late, it is a message they will mute.<\/li>\n<\/ul>\n<p><strong>4. What do you dread doing?<\/strong><\/p>\n<ul>\n<li>For example: chasing invoices, filing receipts, copying between systems, writing the same email.<\/li>\n<li>The best first automation is the one you dread, not the cleverest one.<\/li>\n<li>The dread is what keeps you maintaining it.<\/li>\n<\/ul>\n<p><strong>5. Who else has to work with you?<\/strong><\/p>\n<ul>\n<li>If nobody else touches your system, build it for one person.<\/li>\n<li>Once a spouse, an assistant or a colleague needs access, you must be able to separate your private notes from shared ones.<\/li>\n<li>Annie has bots sealed to one person and one purpose, such as a tutor for her son. Those bots must not see the rest of her life (Build Log 54).<\/li>\n<\/ul>\n<h3>Worksheet: How I Work<\/h3>\n<p>Answer in one line each. Do not overthink.<\/p>\n<ol>\n<li>When you need something you saved six months ago, what do you search for: the <strong>place<\/strong>, the <strong>date<\/strong>, or the <strong>topic<\/strong>?<\/li>\n<li>How do you capture a thought at 2am: type it, say it, or lose it?<\/li>\n<li>Which single task do you dread most, and when does it come up?<\/li>\n<li>When do you plan, and when do you act?<\/li>\n<li>Who else will ever need to see your notes, and who must never?<\/li>\n<li>What have you tried before and abandoned, and why? This is the most useful answer on the page.<\/li>\n<\/ol>\n<h3>Annie's Answers, as a Worked Example<\/h3>\n<p>This is not a template to copy. It shows one person's habits turned into design choices.<\/p>\n<table>\n<thead>\n<tr>\n<th>How Annie works<\/th>\n<th>What she built<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Thinks in linked ideas, not folders<\/td>\n<td>One vault where notes link to each other<\/td>\n<\/tr>\n<tr>\n<td>Loses anything that needs a filing decision<\/td>\n<td>One inbox, sorted every night by a scheduled job<\/td>\n<\/tr>\n<tr>\n<td>Works across two accounts and several devices<\/td>\n<td>A continuity note, so the next session picks up where the last one stopped<\/td>\n<\/tr>\n<tr>\n<td>Uses her laptop, her phone and different times of day<\/td>\n<td>Several ways in, all reading one set of notes<\/td>\n<\/tr>\n<tr>\n<td>Dreads admin above everything else<\/td>\n<td>Admin handed over first: briefs, filing, reminders, chasing<\/td>\n<\/tr>\n<tr>\n<td>Family time is fixed<\/td>\n<td>Bots sealed to family jobs, and a system that protects that time<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Six Ways a Personal System Fails<\/h3>\n<ol>\n<li><strong>Copying someone else's system whole.<\/strong> It was built for how they think.<\/li>\n<li><strong>Building the clever thing before the needed thing.<\/strong> The clever thing gets abandoned. The needed thing gets maintained.<\/li>\n<li><strong>Keeping two places to look.<\/strong> One of them is always out of date.<\/li>\n<li><strong>Designing for a tidier version of yourself.<\/strong> Build for the person who actually shows up.<\/li>\n<li><strong>Making capture cost a decision.<\/strong> If saving something needs a choice, it does not get saved.<\/li>\n<li><strong>Building for the demo instead of a normal day.<\/strong> Ask whether it still helps on an ordinary, tired weekday.<\/li>\n<\/ol>\n<h2>The Parts of the System<\/h2>\n<p><strong>Each part has one job.<\/strong> When one part tries to do another part's job, things go wrong in ways that are hard to see.<\/p>\n<p>Annie's summary from September 2026 (Build Logs 78 to 92):<\/p>\n<ul>\n<li>The bots act.<\/li>\n<li>The watchdog only reports.<\/li>\n<li>A separate script restarts stuck bots.<\/li>\n<li>Claude Code builds.<\/li>\n<\/ul>\n<p><strong>The builder and the bot are different.<\/strong> The opener (Module 00) showed you the two cards. Here is each one in Annie's system. (Source: Build Log 23.)<\/p>\n<ul>\n<li><strong>The bot<\/strong> is the AI assistant you message from your phone. It has a personality, a small set of skills, and low running costs.<\/li>\n<li><strong>The builder<\/strong> is the tool you use at your desk to build or fix something real. It can read every file and change the system itself.<\/li>\n<li>You build the builder first. Then you use it to build the bot.<\/li>\n<\/ul>\n<h3>Your System: The Laptop Version, With Gemini as Your Bot<\/h3>\n<pre><code class=\"language-mermaid\">flowchart LR\n  You((You)) -- &quot;plain-English requests&quot; --&gt; Builder\n  subgraph Laptop[&quot;Your laptop (only while it is open)&quot;]\n    Builder[&quot;Your AI assistant (pi)&quot;]\n    Vault[(&quot;Your vault&quot;)]\n  end\n  Builder -- &quot;reads and edits&quot; --&gt; Vault\n  Builder -- &quot;asks for an answer&quot; --&gt; Model[&quot;A rented AI model&quot;]\n  subgraph Google[&quot;Google's computers (always on)&quot;]\n    Gemini[&quot;Your bot (Gemini)&quot;]\n  end\n  Gemini -- &quot;your morning message, every weekday&quot; --&gt; Phone[&quot;Your phone&quot;]\n<\/code><\/pre>\n<p>[image: your system. Export this diagram once from Obsidian as a picture and put it on the slides. The same picture is shown again in the build module (Module 08) and the close (Module 12).]<\/p>\n<p>In this course, your builder and your vault run on your laptop.<\/p>\n<ul>\n<li>Your AI assistant and your vault live there.<\/li>\n<li>The AI assistant works while the laptop is open. You talk to it in the terminal.<\/li>\n<li>Your bot is Gemini. Gemini runs on Google's computers, not on your laptop. So your morning message arrives on your phone every weekday, even when the laptop is closed or switched off. You build it in the skills module (Module 11).<\/li>\n<\/ul>\n<p>Some things need a machine of your own that stays on:<\/p>\n<ul>\n<li>a bot that reads your vault and runs your own jobs<\/li>\n<li>jobs that run while you sleep<\/li>\n<li>a watchdog that checks every hour<\/li>\n<\/ul>\n<p>That is what the optional server sitting adds.<\/p>\n<h3>How Your Builder and Your Bot Reach an AI: Harness, Provider, Model<\/h3>\n<p>The diagram above shows an arrow to \"a rented AI model\". That arrow has three parts. You will hear the three words all through this course.<\/p>\n<p><strong>You → harness → AI provider → AI model.<\/strong> Then the answer comes back the same way.<\/p>\n<p>The opener (Module 00) gave you the short version: you, then pi (harness), then opencode Go (AI provider), then DeepSeek (AI model). Here is each part in more detail.<\/p>\n<p><strong>1. The harness.<\/strong> The harness is the program you use.<\/p>\n<ul>\n<li>It takes your words and sends them to the AI.<\/li>\n<li>It lets the AI do things, such as read your files and run commands.<\/li>\n<li>It decides how the AI works: what it can touch, and what it must ask you first.<\/li>\n<li>Examples: pi and Claude Code are harnesses for building. Hermes is the harness Annie's bots run on.<\/li>\n<\/ul>\n<p><strong>2. The AI provider.<\/strong> The provider is the company that runs the AI on its own computers.<\/p>\n<ul>\n<li>You pay the provider, by subscription or by use.<\/li>\n<li>Your harness connects to the provider with a key or a sign-in. A key is a long password that lets a program use your account.<\/li>\n<li>Examples: opencode Go and Anthropic.<\/li>\n<li>Hong Kong blocks happen here, at the provider (Module 01).<\/li>\n<\/ul>\n<p><strong>3. The AI model.<\/strong> The model is the AI that writes the answers. It is your bot's \"brain\".<\/p>\n<ul>\n<li>One provider can offer many models.<\/li>\n<li>Examples: DeepSeek V4.1 Flash and Kimi K3 (both on opencode Go), and Claude Opus 5.5 (on Anthropic).<\/li>\n<\/ul>\n<p><strong>Annie's three setups (checked 10 Oct 2026):<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>What<\/th>\n<th>Harness<\/th>\n<th>Provider<\/th>\n<th>Model<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Her building at the desk<\/td>\n<td>Claude Code<\/td>\n<td>Anthropic, through her Claude subscription<\/td>\n<td>Claude Opus 5.5<\/td>\n<\/tr>\n<tr>\n<td>Her second builder<\/td>\n<td>pi<\/td>\n<td>opencode Go<\/td>\n<td>DeepSeek V4.1 Flash<\/td>\n<\/tr>\n<tr>\n<td>Her three bots<\/td>\n<td>Hermes<\/td>\n<td>opencode Go<\/td>\n<td>DeepSeek V4.1 Flash<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Sources: Annie's pi settings and the bots' settings on her server, both read 10 Oct 2026.<\/p>\n<p><strong>Why the three parts matter:<\/strong><\/p>\n<ul>\n<li><strong>You can change one part and keep the others.<\/strong><\/li>\n<li>To give your bot a different \"brain\", you change one setting: the model name.<\/li>\n<li>The harness and your files stay the same.<\/li>\n<li><strong>A model name works only with a provider that offers it.<\/strong> Here is what happened (Build Log 94):\n  1. On 27 Sep 2026, Annie moved Claudith to a new provider.\n  2. Some settings still named models that only the old provider offered.\n  3. Those models stopped working at once. Nothing sent an alert.\n  4. A scheduled job that used one of them failed overnight.<\/li>\n<li><strong>The same model can act differently in two harnesses.<\/strong><\/li>\n<li>pi (harness) and Annie's bot, which runs on Hermes (harness), both use DeepSeek (AI model).<\/li>\n<li>But they give different answers to the same question.<\/li>\n<li>The optional server sitting (Module 08B) shows this live (\"Same model, different program\").<\/li>\n<li><strong>The bill comes from the provider.<\/strong><\/li>\n<li>opencode Go (AI provider) costs $10 a month.<\/li>\n<li>A Claude subscription from Anthropic (AI provider) pays for Claude Code (harness).<\/li>\n<\/ul>\n<p><strong>One opencode Go plan does two jobs. A Claude plan cannot.<\/strong> <em>(Added 10 Oct 2026 at Annie's request.)<\/em><\/p>\n<ul>\n<li>With opencode Go (AI provider), one $10 a month plan pays for two things:\n  1. a bot's AI, through Hermes (harness) on a server\n  2. pi (harness) in the terminal on your laptop<\/li>\n<li>Both use the same models, such as DeepSeek (AI model), from the same plan.<\/li>\n<li>A Claude subscription from Anthropic (AI provider) cannot do this. Anthropic's own pages say so in two places (both read 10 Oct 2026):\n  1. <strong>Claude Code's legal page:<\/strong> a Claude subscription sign-in is \"designed to support ordinary use of Claude Code and other native Anthropic applications\". Other programs \"should use API key authentication\". Anthropic does not allow other programs to \"route requests through Free, Pro, or Max plan credentials\".\n  2. <strong>Anthropic's Consumer Terms (effective 8 Oct 2025), Section 3:<\/strong> you may not use the service \"through automated or non-human means, whether through a bot, script, or otherwise\", except with an Anthropic API key or with Anthropic's explicit permission.<\/li>\n<li><strong>The reason, in plain words:<\/strong><\/li>\n<li>A subscription is priced for one person using Anthropic's own apps.<\/li>\n<li>A bot or another program can send far more requests.<\/li>\n<li>So Anthropic wants those to go through an API key. With a key, you pay for each use, on top of any subscription.<\/li>\n<li>Anthropic's pages do not say this reason in these words. It is the reason the two rules point to.<\/li>\n<li>News reports say Anthropic began blocking subscription sign-ins in other programs on 9 Jan 2026 (WinBuzzer and Gigazine, Feb 2026).<\/li>\n<li>Annie saw the block herself. When she signed pi into her Claude account, every request failed with \"Model access is disabled\" (Build Log 103).<\/li>\n<li>Facilitator: check both Anthropic pages again before teaching, because these rules can change. Anthropic says it may enforce them \"without prior notice\" (Claude Code legal page).<\/li>\n<\/ul>\n<h2>The Vault, and One Job Each for Calendar, Vault and Inbox<\/h2>\n<p>A vault is a folder of plain text notes. The notes are written in a simple format called Markdown. Obsidian is a free app that shows the folder as a notebook. You own the files. They are not locked inside any company's app.<\/p>\n<p><strong>Why plain files and not Google Docs?<\/strong> Annie's bot's first memory was a Google Sheet. She replaced it in June 2026 for three reasons (How to Build Your Own Claudith guide, Part 2):<\/p>\n<ol>\n<li><strong>Speed and cost.<\/strong> A bot reads plain files on its own disk instantly and for free. Every read of a Google Doc is a signed-in request.<\/li>\n<li><strong>Shape.<\/strong> Notes work better as linked pages than as rows in a grid.<\/li>\n<li><strong>Ownership.<\/strong> You own the files, with no company in between.<\/li>\n<\/ol>\n<p>Google still does the jobs it does well: the calendar, email, and file backups.<\/p>\n<p><strong>Give each tool one job.<\/strong> Annie settled this in her first month (Build Log 00):<\/p>\n<ul>\n<li><strong>The calendar holds anything with a time.<\/strong> Appointments, deadlines, reminders.<\/li>\n<li><
