>\n<td>No<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>Reach it from your phone anywhere<\/td>\n<td>Only while the laptop is awake and online<\/td>\n<td>Yes, with a private network<\/td>\n<td>Yes, with a private network<\/td>\n<\/tr>\n<tr>\n<td>Reaches AI companies that block Hong Kong<\/td>\n<td>No, not without a VPN<\/td>\n<td>No. It is still in Hong Kong<\/td>\n<td>Yes. Singapore is served<\/td>\n<\/tr>\n<tr>\n<td>Acts as your own route out of Hong Kong<\/td>\n<td>No<\/td>\n<td>No<\/td>\n<td>Yes (the server module (Module 08B))<\/td>\n<\/tr>\n<tr>\n<td>Up-front cost<\/td>\n<td>None<\/td>\n<td>The machine. $0 if you reuse one you own<\/td>\n<td>None<\/td>\n<\/tr>\n<tr>\n<td>Monthly cost<\/td>\n<td>None<\/td>\n<td>Electricity, about $1 to $3<\/td>\n<td>About $27, with the backup<\/td>\n<\/tr>\n<tr>\n<td>You must keep it secure and updated<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<td>Yes<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p class=\"marker\"><em>[OPUS EDIT, 15 Oct 2026. Cost marks: three cells filled. Server price is Annie's answer of 15 Oct 2026. Electricity is the Merge Tracker's estimate, not measured. No Mac mini price is given, because the course has no checked one. The server price is $27 a month with backup, the price for a new order today. Annie pays $22 because she ordered before Hetzner raised prices (Annie's answer, 15 Oct 2026).]<\/em><\/p>\n<p><strong>For students in Hong Kong, location is the deciding row.<\/strong> (Source: Build Log 63.)<\/p>\n<ul>\n<li>A Mac mini at home is a strong machine.<\/li>\n<li>But it sits on a Hong Kong connection. So it cannot reach Claude without a VPN.<\/li>\n<li>A server in Singapore reaches every company directly.<\/li>\n<li>In the server module (Module 08B), it also becomes your own route out of Hong Kong.<\/li>\n<\/ul>\n<p><strong>Annie's advice is a rented server first.<\/strong> In her guide she calls it \"the version of this that never becomes a second hobby\" (How to Build Your Own Claudith guide, Part 2). A Mac mini can come later as an addition.<\/p>\n<p><strong>Keep in mind that one server can end up holding everything.<\/strong><\/p>\n<ul>\n<li>Annie's server holds the bot, a copy of the vault, the backups and the builder.<\/li>\n<li>If it fails, all of them stop together.<\/li>\n<li>The module on what breaks (Module 10) covers the backups that make this safe.<\/li>\n<\/ul>\n<p><strong>The Hong Kong factors<\/strong> (Annie's landscape note, 27 Aug 2026):<\/p>\n<ul>\n<li><strong>Distance matters when you type.<\/strong> A server in Germany or the US adds about 150 to 250 milliseconds to every keystroke. Singapore adds about 35.<\/li>\n<li><strong>Heat and humidity.<\/strong> A machine running all day in a warm flat slows itself down to stay cool. Its parts also wear faster.<\/li>\n<li><strong>Typhoons and power cuts.<\/strong> A home machine stops when the power stops. A data centre has backup power.<\/li>\n<li><strong>Home internet often blocks servers.<\/strong><\/li>\n<li>Hong Kong home broadband commonly blocks the ports used to host anything.<\/li>\n<li>The private network in the server module (Module 08B) works around this, without opening your home router.<\/li>\n<li><strong>Paying from Hong Kong.<\/strong><\/li>\n<li>Some companies check where your card was issued.<\/li>\n<li>Facilitator: confirm before the session whether this affects the chosen server company.<\/li>\n<li>With Hetzner as the default, this means one check: does Hetzner accept a Hong Kong card and ID? (Added 10 Oct 2026.)<\/li>\n<\/ul>\n<h2>What the Optional Server Sitting Adds<\/h2>\n<p><em>Short course. Read at home. The skills module (Module 11) asks you the server question in class.<\/em><\/p>\n<p>Your laptop does everything in this course while it is awake. The optional server sitting adds a small rented computer in Singapore that stays on. Three things change:<\/p>\n<ol>\n<li><strong>You get a Telegram bot that answers at any hour,<\/strong> even with the laptop closed.<\/li>\n<li><strong>Jobs can run while you sleep,<\/strong> such as a morning summary or a nightly sort of your inbox.<\/li>\n<li><strong>Your laptop stays as it is.<\/strong>\n   - The sitting does not make the server a route to Claude.\n   - That needs Tailscale and an exit node, which the Full course teaches.\n   - Claude from your laptop still needs a VPN.<\/li>\n<\/ol>\n<p>What the sitting costs you:<\/p>\n<ul>\n<li>a monthly fee: about $27, with the backup <em>[OPUS EDIT, 15 Oct 2026. Cost marks: price for a new order (Annie's answer, 15 Oct 2026).]<\/em><\/li>\n<li>a payment card<\/li>\n<li>an ID document for the server company<\/li>\n<li>one extra sitting<\/li>\n<\/ul>\n<p>Decide today whether you want it. You can also decide later, once the laptop's limits start to bother you.<\/p>\n<h2>Telegram as the Front Door<\/h2>\n<p><em>Full course. 5 minutes. Short course students who take the optional server sitting read this before the sitting.<\/em><\/p>\n<p>You will talk to your bot through Telegram, for three reasons:<\/p>\n<ol>\n<li><strong>Telegram's bot service is free and official.<\/strong>\n   - You create a bot through Telegram's own @BotFather account, and receive a token.\n   - There is no fee and no grey area.<\/li>\n<li><strong>It works in Hong Kong with no extra steps.<\/strong><\/li>\n<li><strong>Photos arrive ready to use.<\/strong>\n   - Telegram rotates and resizes photos before the bot receives them.\n   - Send pictures as normal photos, never as files.\n   - That one habit made Annie's storage catalogue work with no extra software (Build Log 48).<\/li>\n<\/ol>\n<p><strong>The chat app does not decide what the bot can do.<\/strong> (Source: Seminar Ideas, 15 Jul 2026.)<\/p>\n<ul>\n<li>Annie once asked whether WhatsApp or Telegram is the more powerful choice.<\/li>\n<li>Her builder checked: both connect to the same model, tools and memory.<\/li>\n<li>The program behind the chat app decides what the bot can do.<\/li>\n<\/ul>\n<p><strong>Why not WhatsApp?<\/strong> (Source: Claudith rulebook, rule 8.)<\/p>\n<ul>\n<li>Annie built a WhatsApp connection in July 2026. She removed it on 23 July.<\/li>\n<li>It used an unofficial program tied to her personal phone number.<\/li>\n<li>That breaks WhatsApp's terms, and it risked a ban on her number.<\/li>\n<li>Her bot now drafts a message, and she pastes it herself.<\/li>\n<\/ul>\n<p><strong>Know what Telegram can see.<\/strong><\/p>\n<ul>\n<li>Chats with a bot are not end-to-end encrypted.<\/li>\n<li>Whoever runs the bot receives every message (Module 02).<\/li>\n<li>Your What AI Is Allowed to See sheet decides what you send.<\/li>\n<\/ul>\n<p><strong>Check now, Full course:<\/strong> Telegram is installed, and two-factor sign-in is on (Settings, Privacy and Security, Two-Step Verification).<\/p>\n<h2>Order Your Server<\/h2>\n<p><em>Full course. The facilitator sits beside each student.<\/em><\/p>\n<p><strong>Pick at least 2 processors and 4 GB of memory, in Singapore, running Ubuntu.<\/strong> At Hetzner a new server costs about $27 a month, with the backup option on. <em>[OPUS EDIT, 15 Oct 2026. Cost marks: price for a new order (Annie's answer, 15 Oct 2026). Annie pays $22, because she ordered earlier.]<\/em><\/p>\n<ul>\n<li>Memory is the limit on a small server, not processing power.<\/li>\n<li>Annie's server has 2 processors and about 3.7 GB of usable memory.<\/li>\n<li>It runs three bots, 26 scheduled jobs and her builder sessions (live check, 2 Oct 2026; Build Log 95).<\/li>\n<\/ul>\n<p><strong>The course default is Hetzner, in Singapore.<\/strong> <em>(Added 10 Oct 2026, Annie's ruling.)<\/em><\/p>\n<ul>\n<li>Annie's own server is a Hetzner CPX22 in Singapore, running Ubuntu 26.04 (Build Log 00).<\/li>\n<li>So every step in this course has been done there.<\/li>\n<li>Use Hetzner unless you have a reason not to.<\/li>\n<\/ul>\n<p><strong>Step 1. Create an account with the server company.<\/strong> Turn on two-factor sign-in straight away.<\/p>\n<p><strong>Step 2. Choose the location: Singapore.<\/strong><\/p>\n<p><strong>Step 3. Choose the system: Ubuntu, the newest long-term support version<\/strong> (marked \"LTS\").<\/p>\n<p><strong>Step 4. Choose the size: at least 2 processors and 4 GB of memory.<\/strong><\/p>\n<p><strong>Step 5. Leave SSH keys blank for now, if the page allows it.<\/strong><\/p>\n<ul>\n<li>An SSH key is the file that will let your laptop sign in to the server without a password.<\/li>\n<li>You will create it in the server module (Module 08B), with your builder.<\/li>\n<li>Facilitator: if the company insists on a key or a password at order time, follow its default. Note it for the server module (Module 08B).<\/li>\n<\/ul>\n<p><strong>Step 6. Turn on the backup option,<\/strong> if the company offers one. At Hetzner it is part of the $27 a month above. (Source: Boss Admin Moves note.) <em>[OPUS EDIT, 15 Oct 2026. Cost marks: price for a new order (Annie's answer, 15 Oct 2026).]<\/em><\/p>\n<ul>\n<li>On Annie's server, the whole-server backup was switched on on 4 Aug 2026.<\/li>\n<li>Her notes estimate a full restore at about 10 minutes.<\/li>\n<li>Nobody has timed one yet.<\/li>\n<\/ul>\n<p><strong>Step 7. Name the server something plain,<\/strong> such as <code>my-server<\/code>. Do not use your name or address.<\/p>\n<p>You know it works when:<\/p>\n<ul>\n<li>The company shows a running server and an IP address. The IP address is the server's number on the internet.<\/li>\n<li>Save the IP address in your password manager, not in your vault.<\/li>\n<\/ul>\n<p><strong>If it fails:<\/strong><\/p>\n<ul>\n<li>If the company asks for identity documents, upload them and wait.<\/li>\n<li>Nobody has recorded how long this takes for a Hong Kong sign-up. That is why you order now and not in the server module (Module 08B).<\/li>\n<li>If your card is refused, try another server company.<\/li>\n<\/ul>\n<h2>Your Shape Decision, and What Your System Does at 11pm on a Bad Day<\/h2>\n<p>Fill in the worksheet below. Then answer one last question, in one sentence:<\/p>\n<blockquote>\n<p><strong>What will your system do for you at 11pm on a bad day?<\/strong><\/p>\n<\/blockquote>\n<p>If the answer is \"nothing\", the design does not fit you yet, however good it looks.<\/p>\n<h2>From the Record<\/h2>\n<p><strong>The Mac mini question, answered without buying one.<\/strong> <em>Full course.<\/em> (Source: Build Log 46.)<\/p>\n<ol>\n<li>In August 2026, Annie wanted her own Claude Code on her phone, with her instructions and memory.<\/li>\n<li>The route she used kept her Mac awake and plugged in. That raised the question of buying a Mac mini.<\/li>\n<li>But she already rented a server that never sleeps, and her vault already reached it.<\/li>\n<li>So the builder was installed there in about 10 minutes, on the subscription she already paid for.<\/li>\n<\/ol>\n<p>The lesson: check what you already own before you buy.<\/p>\n<p><strong>The server was billing the wrong account.<\/strong> <em>Full course.<\/em> (Source: Build Log 46.)<\/p>\n<ol>\n<li>When Claude Code was set up on that server, it was already signed in to Annie's work account.<\/li>\n<li>That account was billed per use to her employer. She had not asked for that.<\/li>\n<li>The fix was to sign in with her personal subscription.<\/li>\n<li>Then a lock was set, so neither account can fall back to per-use billing.<\/li>\n<\/ol>\n<p>The lesson: before you use any AI tool on a machine, check whose account it is on and how it bills.<\/p>\n<p><strong>Six forgotten sessions filled the memory.<\/strong> <em>Full course.<\/em> (Source: Build Log 95.)<\/p>\n<ol>\n<li>In September 2026, the server began logging memory warnings every minute.<\/li>\n<li>The bots were not the cause. All three together used under 1 GB.<\/li>\n<li>Six abandoned Claude Code sessions, each 4 to 17 days old, held 1.5 GB between them.<\/li>\n<li>Closing them freed 1.37 GB.<\/li>\n<li>A 2 GB swap file was also added. A swap file is spare memory on the disk.<\/li>\n<\/ol>\n<p>The lesson: on a small server, memory runs out first. When it does, the system stops programs to make room. It may stop the one you depend on.<\/p>\n<h2>Worksheet: Shape Decision<\/h2>\n<p><strong>My Shape Decision:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Question<\/th>\n<th>My answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Where my system runs<\/td>\n<td>Laptop / laptop plus server<\/td>\n<\/tr>\n<tr>\n<td>Joining the optional server sitting? (Short course)<\/td>\n<td>Yes / No / Later<\/td>\n<\/tr>\n<tr>\n<td>Server company, location and size (Full course)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Whole-server backup turned on? (Full course)<\/td>\n<td>Yes / No<\/td>\n<\/tr>\n<tr>\n<td>Date ordered, or the date I will order (Full course)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Server IP address saved in my password manager? (Full course)<\/td>\n<td>Yes / No<\/td>\n<\/tr>\n<tr>\n<td>Telegram installed, with two-factor sign-in on? (Full course)<\/td>\n<td>Yes / No<\/td>\n<\/tr>\n<tr>\n<td>My phone (Android or iPhone)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My laptop (Mac or Windows)<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 2: closing line added.]<\/em><\/p>\n<p><strong>Day 1 ends here. Next, on Day 2: the demo (Module 04).<\/strong> You have seen two demos. Now you see the jobs that remove the most remembering, and pick your own top two.<\/p>\n<h2>Teaching Notes<\/h2>\n<ul>\n<li><strong>Three students at most in each class.<\/strong> In the Full course, sit beside each student for the server order.<\/li>\n<li><strong>Students will ask about the Mac mini.<\/strong> It is a good machine. In Hong Kong the deciding fact is location: it cannot reach Claude or act as your route out of Hong Kong.<\/li>\n<li><strong>Full course: push for ordering today.<\/strong> A student without a server by the server module (Module 08B) can follow it beside another student, and finish at home.<\/li>\n<li><strong>Do not let anyone paste a server password or IP address into a group chat.<\/strong><\/li>\n<li><strong>Developers may want a different server company or system.<\/strong> That is fine, but the course's commands assume Ubuntu. The course default is Hetzner in Singapore (added 10 Oct 2026). So a student who picks another company follows that company's order page on their own.<\/li>\n<\/ul>"}, {"id": "full-6", "title": "04: The Demo", "handout": false, "html": "<h1>Module 04: The Demo<\/h1>\n<p><strong>How to read this file.<\/strong> This file serves both courses.<\/p>\n<ul>\n<li><strong>Full course:<\/strong> runs every segment.<\/li>\n<li><strong>Short course:<\/strong> runs only the segments that have minutes in its column.<\/li>\n<li><strong>Every demo is shown from edited screenshots.<\/strong> They are in <code>Annie Work 💼/Seminar Screenshots/Edited (invented names)/<\/code>.<\/li>\n<li><strong>Live demos and screen recordings wait<\/strong> for a separate demo vault with invented names (Annie's ruling, 9 Oct 2026).<\/li>\n<\/ul>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 2: bridge block added.]<\/em><\/p>\n<p><strong>Why this module comes here.<\/strong><\/p>\n<ol>\n<li>The opener (Module 00) showed you two demos. Now you see the jobs that remove the most remembering, and the hourly checker that tells Annie when something breaks.<\/li>\n<li>Everything shown here runs on the kind of setup you chose in the module on where your system lives (Module 03B).<\/li>\n<li>You leave with your top two jobs circled. The workflows module (Module 05) puts them on paper.<\/li>\n<\/ol>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 4, approved by Annie on 13 Oct 2026. In this file: 10 changes, 2 editor notes and the sections Where the Two Versions Went (from inside the Teaching Notes), Sources, Related moved to <code>editor-notes/04 — Editor's Notes.md<\/code>. Every change, with its old and new text, is listed in FABLE-EDITS.md.]<\/em><\/p>\n<h2>Run Sheet<\/h2>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 1: the run sheet was 45 minutes (Full) and 25 (Short). \"What this system is for\", the storage demo, the warranty demo, the cost slide and the Wish List draft moved to the opener (Module 00). Approved by Annie on 13 Oct 2026.]<\/em><\/p>\n<p>A dash means the segment is not in that course.<\/p>\n<table>\n<thead>\n<tr>\n<th>Full (min)<\/th>\n<th>Short (min)<\/th>\n<th>Segment<\/th>\n<th>Shown with<\/th>\n<th>Students do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>10<\/td>\n<td>—<\/td>\n<td>The jobs that remove the most remembering<\/td>\n<td><code>Health Insurer Claims 1 (edited)<\/code>, <code>Kids Gym (edited)<\/code>, <code>Class Provider Class Dates Times (edited)<\/code> and <code>2 (edited)<\/code>, <code>Beach Day Calendar Add (edited)<\/code>, <code>Anniversary Clash 1 of 2<\/code> and <code>2 of 2 (edited)<\/code>, <code>Adding Task to To Do List (edited)<\/code>, <code>Cal + Inbox Checker (edited)<\/code>, <code>Gemini/Daily Msg for Helper (edited)<\/code><\/td>\n<td>Tick any job that matches their own life<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>—<\/td>\n<td>The message from the watchdog (Toby, the hourly checker)<\/td>\n<td><code>Toby flagging problem (edited)<\/code><\/td>\n<td>Ask questions<\/td>\n<\/tr>\n<tr>\n<td>—<\/td>\n<td>3<\/td>\n<td>The morning message from Gemini: what you build in the skills module (Module 11)<\/td>\n<td><code>Gemini/Daily Msg for Helper (edited)<\/code>, under \"The same idea in Gemini, for the helper\" below<\/td>\n<td>Write one line: what would my morning message say?<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>5<\/td>\n<td>Circle your top two on the Wish List<\/td>\n<td>The Wish List worksheet from the opener (Module 00)<\/td>\n<td>Circle two jobs. Check them against the What AI Is Allowed to See sheet<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>How the minutes add up.<\/strong><\/p>\n<ul>\n<li><strong>Full course: 20 minutes.<\/strong> The demo of jobs that remove the most remembering takes 10. The watchdog's message takes 5. Circling the top two takes 5.<\/li>\n<li><strong>Short course: 8 minutes.<\/strong> The Gemini morning message takes 3. Circling the top two takes 5. Short course students saw the storage demo, the warranty card and the cost slide in the opener (Module 00).<\/li>\n<\/ul>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 8, approved by Annie on 13 Oct 2026: one Short course row added, 3 minutes. The Gemini screenshot was Full course only, inside the jobs demo. AUDIT.md, Finding 12.]<\/em><\/p>\n<p><strong>Why this order.<\/strong><\/p>\n<ul>\n<li><strong>The storage demo, the warranty card and the cost slide are in the opener (Module 00).<\/strong> So students know what they are building before the access module (Module 01).<\/li>\n<li><strong>The jobs demo comes here,<\/strong> after students have chosen their setup in the module on where your system lives (Module 03B). So every job shown runs on a setup they understand.<\/li>\n<li><strong>The top two are circled last,<\/strong> when every demo has been seen.<\/li>\n<\/ul>\n<h2>What You Will Leave With<\/h2>\n<p><strong>Your Wish List, with your top two circled.<\/strong><\/p>\n<ul>\n<li>You drafted the list in the opener (Module 00): three to five jobs, each scored by how much remembering it removes.<\/li>\n<li>Today you circle your top two. They go into the next module, where you map them on paper.<\/li>\n<\/ul>\n<h2>Before This Module<\/h2>\n<ul>\n<li><strong>Modules 00 to 03 finished.<\/strong> Bring your Wish List draft from the opener (Module 00) and your What AI Is Allowed to See sheet from the privacy module (Module 02).<\/li>\n<li><strong>A pen.<\/strong> This module is mostly watching, then one short exercise.<\/li>\n<li><strong>For the facilitator:<\/strong> the checklist at the end of this module, done before students arrive.<\/li>\n<\/ul>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 1: four sections moved from here to the opener (Module 00), word for word: \"The Rule for the Whole Module\", \"What This System Is For\", \"Demo 1: A Photo Becomes a Record\", \"Demo 3: When the Bot Was Wrong\" and \"Demo 5: What It Costs\". The rule \"never show a capability without showing what it costs\" still applies to every demo below.]<\/em><\/p>\n<h2>Demo: The Jobs That Remove the Most Remembering<\/h2>\n<p><em>Full course only.<\/em><\/p>\n<p>A mentor gave Annie a way to rank automations: by how much mental load each one removes from you. The most useful build is rarely the most impressive one (Boss Admin Moves note, 26 Jul 2026). Show four jobs. Annie chose them on 10 Oct 2026. The calendar job has four short examples. The morning brief has two. The segment stays at 10 minutes (Annie's ruling), so move quickly.<\/p>\n<p><strong>1. Receipts that need claiming (<code>Health Insurer Claims 1 (edited)<\/code>).<\/strong><\/p>\n<div class=\"shot\">Screenshot: Health Insurer Claims 1 (edited)<\/div>\n\n<ul>\n<li>At 20:00, one message arrives: two medical invoices came in today, file the insurance claim.<\/li>\n<li>Both files are attached, already renamed to fit the insurer's app.<\/li>\n<li>Annie taps, files the claim on her phone, and replies \"done!\".<\/li>\n<li>The insurer requires a person to submit the claim. So that step stays with her.<\/li>\n<\/ul>\n<p><strong>2. Calendar jobs.<\/strong> Four examples, from simple to clever.<\/p>\n<p><strong>a. Her son's calendar, checked against his nap and his rules (<code>Kids Gym (edited)<\/code>).<\/strong><\/p>\n<div class=\"shot\">Screenshot: Kids Gym (edited)<\/div>\n\n<ul>\n<li>Annie lists the times of a new gym class. She asks which one works, checked against his nap and his calendar.<\/li>\n<li>The bot answers with one working option: Friday at 9:30.<\/li>\n<li>It lists every other slot, with the reason each one is blocked.<\/li>\n<li>It asks before adding the class to his calendar.<\/li>\n<\/ul>\n<p><strong>b. A screenshot becomes calendar entries (<code>Class Provider Class Dates Times (edited)<\/code> and <code>2 (edited)<\/code>).<\/strong><\/p>\n<div class=\"shot\">Screenshot: Class Provider Class Dates Times (edited)<\/div>\n<div class=\"shot\">Screenshot: Class Provider Class Dates Times 2 (edited)<\/div>\n\n<ul>\n<li>Annie sends a screenshot of her son's gym schedule.<\/li>\n<li>She asks the bot to make sure every class is on his calendar.<\/li>\n<li>The bot reports two classes already there and two missing. It asks before adding them.<\/li>\n<li>She says yes.<\/li>\n<li>It adds both, and confirms all four are now on the calendar.<\/li>\n<\/ul>\n<p><strong>c. A friend's messages become an event (<code>Beach Day Calendar Add (edited)<\/code>).<\/strong> (Source: Boss Admin Moves note, 6 Oct 2026.)<\/p>\n<div class=\"shot\">Screenshot: Beach Day Calendar Add (edited)<\/div>\n\n<ul>\n<li>Annie pastes a friend's chat messages about a beach day, and adds \"pls put in annie cal\".<\/li>\n<li>The bot checks all three calendars: personal, work and her son's.<\/li>\n<li>It proposes one event and asks for a yes.<\/li>\n<li>It leaves the second date off on purpose, because the friend said \"if things go well\".<\/li>\n<li>It asks whether her son is coming.<\/li>\n<li>Annie changes the title and adds the second date as tentative. The bot reads both events back once they are in.<\/li>\n<\/ul>\n<p><strong>d. The anniversary catch (<code>Anniversary Clash 1 of 2 - Caught and Deleted (edited)<\/code> and <code>2 of 2 - Rule Learned (edited)<\/code>).<\/strong> (Source: Boss Admin Moves note, 9 Oct 2026.)<\/p>\n<div class=\"shot\">Screenshot: Anniversary Clash 1 of 2 - Caught and Deleted (edited)<\/div>\n<div class=\"shot\">Screenshot: Anniversary Clash 2 of 2 - Rule Learned (edited)<\/div>\n\n<ol>\n<li>A friend proposes a playdate for one afternoon at 4pm. Annie asks the bot to add it.<\/li>\n<li>The bot checks her son's calendar. His nap and his gym class are both clear. It adds the playdate.<\/li>\n<li>Then it flags something nobody asked about: that evening is Annie's wedding anniversary.<\/li>\n<li>Annie deletes the playdate on the spot. So the evening has to stay free.<\/li>\n<li>The bot writes the rule into its scheduling skill. A day that already has something important, such as an anniversary or a birthday, does not get a competing plan.<\/li>\n<\/ol>\n<p><strong>The line to say for the anniversary.<\/strong> \"It didn't just add the event. It told me the day was my anniversary. Then it learned the rule, so I never have to catch it again.\"<\/p>\n<p><strong>3. A task typed once goes on the to-do list (<code>Adding Task to To Do List (edited)<\/code>).<\/strong> (Source: Boss Admin Moves note, 6 Oct 2026.)<\/p>\n<div class=\"shot\">Screenshot: Adding Task to To Do List (edited)<\/div>\n\n<ul>\n<li>At 5:30am, Annie types \"add to to do list:\" and the task, in Telegram.<\/li>\n<li>The bot writes the task into her one to-do list.<\/li>\n<li>It replies with a receipt that names the exact file it saved to.<\/li>\n<li>It notices a similar item already exists. It notes the difference, so the two are not confused.<\/li>\n<li>It leaves her ranking alone, because she gave the new item no rank.<\/li>\n<li>It writes down a first step.<\/li>\n<\/ul>\n<p><strong>Why the receipt matters.<\/strong> The bot once replied \"got it\" without saving anything. The rule now: write the task, check the file, then reply with where it went. Annie's line: \"If it says saved, it shows me where. That receipt is how I know it really did it.\"<\/p>\n<p><strong>4. The morning brief, two ways.<\/strong> <em>(Added 10 Oct 2026, Annie's request.)<\/em><\/p>\n<p><strong>a. Annie's bot (<code>Cal + Inbox Checker (edited)<\/code>).<\/strong><\/p>\n<div class=\"shot\">Screenshot: Cal + Inbox Checker (edited)<\/div>\n\n<ul>\n<li>At 7:00, two messages arrive.<\/li>\n<li>The first is today's calendar.<\/li>\n<li>The second is the overnight email, sorted into what needs a look and what is only newsletters.<\/li>\n<\/ul>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 12, approved by Annie on 13 Oct 2026: one paragraph added. AUDIT.md, Finding 11.]<\/em><\/p>\n<p><strong>For work, it is the same job.<\/strong> Tomorrow's meetings, and overnight email sorted into what needs a reply and what does not. A founder's morning brief and a parent's morning brief are the same build with a different calendar.<\/p>\n<p><strong>b. The same idea in Gemini, for the helper (<code>Gemini/Daily Msg for Helper (edited)<\/code>).<\/strong><\/p>\n<div class=\"shot\">Screenshot: Daily Msg for Helper (edited)<\/div>\n\n<ul>\n<li>Annie made a Gemini Skill called \"helper-day\". It writes the daily message for the family's helper, from her son's calendar and his daily routines.<\/li>\n<li>Annie types \"Write today's helper message\".<\/li>\n<li>Gemini writes the day in three timed lines: the drive to an appointment, the lunch delivery, and her son coming home from school.<\/li>\n<li>Then it lists what to check:<\/li>\n<li><strong>A clash.<\/strong> The helper cannot drive to the appointment and also receive the lunch delivery and meet her son at home.<\/li>\n<li><strong>A missing event.<\/strong> There was no morning school event on the calendar, so it did not add a drop-off.<\/li>\n<li><strong>Events left out on purpose.<\/strong> Two events came from Annie's personal calendar, so it kept them out of the helper's message.<\/li>\n<li>It asks whether everyone is home for dinner, and whether to add the times to the helper's calendar.<\/li>\n<li>The point for students: you can build this kind of daily message in Gemini, with no server and no bot. Consumer Gemini works in Hong Kong with no VPN.<\/li>\n<li><em>Optional second screenshot:<\/em> the Skill in Gemini's Skills list (<code>Gemini/Screenshot 2026-10-05 at 8.14.35 PM (edited)<\/code>).<\/li>\n<\/ul>\n<p><strong>The line to say.<\/strong> \"None of these is clever. Each one removes something I used to have to remember.\"<\/p>\n<p><strong>The cost of this one.<\/strong> (Source: Build Log 30.)<\/p>\n<ol>\n<li>In July 2026, the receipt flow came back from the bot's own agents, marked as tested and working.<\/li>\n<li>An independent check found six bugs. Four of them were fatal.<\/li>\n<li>For example, the sender check could never match, and the email tool could not download attachments.<\/li>\n<\/ol>\n<p>The lesson: a report of success is a claim. Check the result yourself before you trust it.<\/p>\n<h2>Demo: The Message From the Watchdog<\/h2>\n<p><em>Full course only.<\/em><\/p>\n<p><strong>What the screenshot shows (<code>Toby flagging problem (edited)<\/code>).<\/strong><\/p>\n<ul>\n<li>At 12:31 am, Annie's watchdog (Toby, the script that checks every hour that her system worked) sent one message.<\/li>\n<li>A note had been renamed. A link pointing at the old name now led nowhere.<\/li>\n<li>The watchdog had tried once to fix it, and could not.<\/li>\n<li>So it said exactly what to do, and that it would not retry.<\/li>\n<\/ul>\n<p><strong>The story to pair it with.<\/strong> (Source: Build Log 74.)<\/p>\n<ol>\n<li>In September 2026, Annie's nightly inbox sorter reported \"ok\" every night for weeks.<\/li>\n<li>It ran, sent a message and moved files.<\/li>\n<li>But it was moving them to the wrong folder.<\/li>\n<li>The message even named the right folder, while the file went somewhere else.<\/li>\n<li>Annie's words: \"a false 'ok' is just as bad or worse than something breaking down.\"<\/li>\n<li>After that, the watchdog checks that the work is right, not only that the job ran.<\/li>\n<\/ol>\n<p><strong>The line to say.<\/strong> \"A check that only tells you the job ran will tell you everything is fine while it is broken. This one checks the result.\"<\/p>\n<p>The module on keeping your system honest (Module 10) builds a small version of this watchdog.<\/p>\n<h2>Circle Your Top Two<\/h2>\n<p><em>5 minutes, both courses.<\/em><\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 1: new short section. The Wish List draft, with its table, is in the opener (Module 00). This section replaces \"Exercise: Your Wish List\".]<\/em><\/p>\n<p>Take out the Wish List you drafted in the opener (Module 00). You have now seen every demo. Add any job the demos reminded you of. Then circle your top two.<\/p>\n<p><strong>My top two (these go to the next module):<\/strong><\/p>\n<ol>\n<li>\n<hr />\n<\/li>\n<li>\n<hr />\n<\/li>\n<\/ol>\n<p><strong>Check against your What AI Is Allowed to See sheet.<\/strong> Some jobs need Tier 3 data, such as passwords, ID numbers or bank details. Cross those jobs off. Or redesign them, so that data never enters the system.<\/p>\n<h2>How to Close the Module<\/h2>\n<p>Close with this line:<\/p>\n<p><em>\"Everything you just saw started as the same sheet of paper you are about to fill in. Nothing here was built in one go, and most of it was built after something broke.\"<\/em><\/p>\n<p>Then hand out the sticky notes for the next module.<\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 2: closing line added.]<\/em><\/p>\n<p><strong>Next: the workflows module (Module 05).<\/strong> Pick up the sticky notes. Your two jobs become two workflows.<\/p>\n<h2>What Not to Do<\/h2>\n<table>\n<thead>\n<tr>\n<th>Do not<\/th>\n<th>Why<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Show a capability you would have to explain for five minutes<\/td>\n<td>If it needs a long introduction, it is not ready to show<\/td>\n<\/tr>\n<tr>\n<td>Show anything built in the last week<\/td>\n<td>New work has not met real use yet, and it may change before class<\/td>\n<\/tr>\n<tr>\n<td>Skip the failures<\/td>\n<td>The failure stories are what make the room trust the rest<\/td>\n<\/tr>\n<tr>\n<td>Show a student's real data on screen<\/td>\n<td>Module 02 applies to the demo too<\/td>\n<\/tr>\n<tr>\n<td>Let a segment run long<\/td>\n<td>Each segment has a hard stop. A long demo loses the room<\/td>\n<\/tr>\n<tr>\n<td>Take questions during a demo<\/td>\n<td>Write them on a visible list and answer at the end<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Teaching Notes<\/h2>\n<ul>\n<li><strong>Expect \"can it do X for me?\" questions.<\/strong> Write each one on the board. Module 09 (Script, Machine Learning or AI Judgement) decides which ones need AI at all.<\/li>\n<li><strong>Do not let the demo turn into a sales pitch.<\/strong> Annie's notes describe this audience. They lose interest at hype, fear and shallow demos. They respond to real stories (Seminar research brief).<\/li>\n<li><strong>Watch the room.<\/strong> When a student's face changes at a demo, that job is probably on their Wish List. Mention it when they map their processes in the next module.<\/li>\n<li><strong>Say which demos they will build.<\/strong><\/li>\n<li>Full course: the storage-style bot, the scheduled jobs, the watchdog and the cost cap are all built later in the course.<\/li>\n<li>Short course: the build module (Module 08) builds one job that answers from a folder of your own files, and the skills module (Module 11) builds the Gemini morning message. A bot that does more than that needs the optional server sitting. <em>[FABLE EDIT, 13 Oct 2026. Proposal 1: wording corrected. It said the laptop builds cover the Wish List jobs.]<\/em><\/li>\n<li><strong>The waiting-on list (the Chaser, which tracks things Annie is waiting on until she marks them done) is not shown.<\/strong> Both earlier versions described it as running. It has been paused since late September 2026 (Boss Admin Moves note, checked 6 Oct).<\/li>\n<li><strong>\"Same model, different program\" (pi and the bot give different answers with the same model) moved to the build module (Module 08).<\/strong> It needs pi running live, and students have pi open there anyway.<\/li>\n<li><strong>When the demo vault exists,<\/strong> live demos and recordings may come back, but only from that vault.<\/li>\n<li><strong>Do not quote the \"no two physical activities on the same day\" rule.<\/strong> It shows in <code>Kids Gym (edited)<\/code>, but Annie deleted it from the live bot on 24 Jul 2026. If someone asks to see it fire, it will not. Point at the nap check and the clash reasons instead (Boss Admin Moves note, warning box under \"Calendar with YOUR house rules\").<\/li>\n<\/ul>\n<p><strong>Changed 10 Oct 2026 (Annie chose the jobs for the jobs demo):<\/strong><\/p>\n<ul>\n<li>The jobs demo now shows the invoice claims, calendar jobs (four examples), and adding a task to the to-do list.<\/li>\n<li>New in the jobs demo: her son's calendar checked against his nap and rules, a friend's messages becoming an event, the anniversary catch, and the to-do receipt. All four already had edited screenshots.<\/li>\n<li>The morning brief left the jobs demo, then came back the same day at Annie's request, as \"the morning brief, two ways\": her bot's brief, and the Gemini \"helper-day\" Skill with a real message it wrote. The segment stays at 10 minutes. The jobs demo now shows each screenshot in the page (Annie's request).<\/li>\n<li>The Chaser (open loops tracked until done) and the credit card bill watch were moved out of the Boss Admin Moves lineup into a new section, \"Built, But Not Useful\". Neither was in this module.<\/li>\n<\/ul>\n<h3>Facilitator Checklist<\/h3>\n<p>Do this before the room arrives.<\/p>\n<ul>\n<li>[ ] <strong>Show only the copies in <code>Seminar Screenshots/Edited (invented names)/<\/code>.<\/strong> Never open the folder above it in class. It holds the originals.<\/li>\n<li>[ ] <strong>Never open <code>_Name Map (private).md<\/code> or <code>_Move Manifest.md<\/code> on the projector.<\/strong> They list the real names.<\/li>\n<li>[ ] <strong>Do not say a real name aloud.<\/strong> Two family first names are the only real names on screen. Every other person, clinic and amount in the edited copies is invented. Use the names on the screen.<\/li>\n<li>[ ] <strong>No client names, deal information or work methods<\/strong> appear anywhere.<\/li>\n<li>[ ] <strong>Notifications are off<\/strong> on the laptop and the phone.<\/li>\n<li>[ ] <strong>The screenshots are readable from the back row.<\/strong> Zoom in before class and check.<\/li>\n<li>[ ] <strong>The screenshots are saved on the laptop,<\/strong> so the demo works without Wi-Fi.<\/li>\n<\/ul>"}, {"id": "full-7", "title": "05: Your Processes on Paper", "handout": false, "html": "<h1>Module 05: Your Workflows on Paper<\/h1>\n<p><strong>How to read this file.<\/strong><\/p>\n<ul>\n<li>This is the master copy for both courses.<\/li>\n<li>The Full course runs every segment.<\/li>\n<li>The Short course runs only the segments with minutes in its column.<\/li>\n<li>In the Short course, process two is homework.<\/li>\n<li>This module is all paper. Students need no laptops until they save their workflows at the end.<\/li>\n<\/ul>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 2: bridge block added.]<\/em><\/p>\n<p><strong>Why this module comes here.<\/strong><\/p>\n<ol>\n<li>You circled two jobs in the demo (Module 04). Before anything is built, you write down what really happens today, step by step.<\/li>\n<li>A process you have not written down keeps its mistakes. Automating it makes the mistakes faster.<\/li>\n<li>Your sticky notes come back twice: in the script-or-AI module (Module 09), where you mark who does each step, and in the skills module (Module 11), where you build one. The wait is on purpose. You meet the builder first.<\/li>\n<\/ol>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 4, approved by Annie on 13 Oct 2026. In this file: 7 changes, 1 editor notes and the sections Where the Two Versions Went (from inside the Teaching Notes), Sources, Related moved to <code>editor-notes/05 — Editor's Notes.md<\/code>. Every change, with its old and new text, is listed in FABLE-EDITS.md.]<\/em><\/p>\n<h2>Run Sheet<\/h2>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 13, approved by Annie on 13 Oct 2026: every check in this file now starts \"You know it works when\". AUDIT.md, Finding 13. The old wording of each line is in <code>proposals/13 — One Phrase for Every Check.md<\/code>.]<\/em><\/p>\n<p>Full course: 60 minutes. Short course: 35 minutes. A dash means the segment is not in that course.<\/p>\n<table>\n<thead>\n<tr>\n<th>Full (min)<\/th>\n<th>Short (min)<\/th>\n<th>Segment<\/th>\n<th>Facilitator does<\/th>\n<th>Students do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5<\/td>\n<td>5<\/td>\n<td>Why paper comes first<\/td>\n<td>Explains that automating an unmapped process automates its mistakes<\/td>\n<td>Pick their top job from the Wish List<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>10<\/td>\n<td>The six parts of every process (trigger, steps, decisions, owner and approver, output, done-signal)<\/td>\n<td>Walks the receipt example<\/td>\n<td>Copy the six headings onto a sheet<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>—<\/td>\n<td>Who checks this?<\/td>\n<td>Explains why a step that no one checks is marked \"nobody\"<\/td>\n<td>Name who checks their first process<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>15<\/td>\n<td>Map process one<\/td>\n<td>Walks the room and asks \"what actually arrives?\"<\/td>\n<td>Map their first process with sticky notes<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>—<\/td>\n<td>Map process two<\/td>\n<td>Same as above<\/td>\n<td>Map their second process<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>—<\/td>\n<td>Keep one to-do list and one inbox<\/td>\n<td>Explains the pinned list and the inbox as the only holding area<\/td>\n<td>Count their current to-do lists<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>5<\/td>\n<td>Ten questions to answer before you build<\/td>\n<td>Reads the questions aloud<\/td>\n<td>Answer them for process one<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>—<\/td>\n<td>A partner reads your map<\/td>\n<td>Pairs students<\/td>\n<td>Find one missing step in a partner's map<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>How the minutes add up.<\/strong><\/p>\n<ul>\n<li><strong>Full course: 60 minutes.<\/strong> Why paper comes first takes 5 minutes. Learning the six parts of a process (trigger to done-signal) takes 10. Asking who checks each process takes 5. Mapping process one takes 15. Mapping process two takes 10. Keeping one to-do list and one inbox takes 5. Answering the ten questions before you build takes 5. A partner reading your map for missing steps takes 5.<\/li>\n<li><strong>Short course: 35 minutes.<\/strong> Why paper comes first takes 5 minutes. Learning the six parts of a process (trigger to done-signal) takes 10. Mapping process one takes 15. Answering the ten questions before you build takes 5.<\/li>\n<\/ul>\n<p><strong>Marking a step \"nobody\" in the Short course.<\/strong> A step that no one checks is still marked \"nobody\" on the workflow. The facilitator explains it in one sentence when the students add the people to their notes.<\/p>\n<h2>What You Will Leave With<\/h2>\n<p><strong>Two workflows.<\/strong> You write the workflow of each job or task you want to build: the top two on your Wish List. Each workflow shows:<\/p>\n<ul>\n<li>what starts the process<\/li>\n<li>every step<\/li>\n<li>who checks it<\/li>\n<li>what it produces<\/li>\n<li>how you know it is finished<\/li>\n<\/ul>\n<p><strong>What happens to the cards later.<\/strong><\/p>\n<ul>\n<li>The script-or-AI module (Module 09) marks each step as a job for code, for an AI model, or for you.<\/li>\n<li>Your best candidate becomes your first automation in the skills and schedules module (Module 11).<\/li>\n<\/ul>\n<h2>Before This Module<\/h2>\n<ul>\n<li><strong>Your Wish List from Module 04,<\/strong> with your top two jobs circled.<\/li>\n<li><strong>Your What AI Is Allowed to See sheet from Module 02.<\/strong><\/li>\n<li><strong>Sticky notes in five colours, and a marker.<\/strong> The facilitator supplies these. At home, any five colours work.<\/li>\n<li><strong>A real example.<\/strong> Your process may start with an email or a form. If so, have a recent one open on your phone.<\/li>\n<\/ul>\n<h2>Why Paper Comes First<\/h2>\n<p><strong>An unmapped process keeps its mistakes.<\/strong> If you automate it, the mistakes happen faster.<\/p>\n<p><strong>Annie's example.<\/strong> In August 2026 Annie drew a map of her whole system before she added anything new. The map showed that her real problems were not missing features. They were problems like these (Build Log 62):<\/p>\n<ul>\n<li>\"when I move a folder, three things silently break\"<\/li>\n<li>\"nobody is checking whether last night's job actually ran\"<\/li>\n<\/ul>\n<p><strong>Paper keeps the AI out of the room for now.<\/strong> You are not asking anything to be built. You are writing down what really happens. Later, the builder works from facts instead of guesses.<\/p>\n<p><strong>Aim for clarity, not tidiness.<\/strong> A messy sheet that shows a missing step is worth more than a neat sheet that hides it. For any process, you should know four things:<\/p>\n<ul>\n<li>what starts it<\/li>\n<li>what ends it<\/li>\n<li>who checks it<\/li>\n<li>where it waits<\/li>\n<\/ul>\n<h2>The Six Parts of Every Process<\/h2>\n<p>Every process has six parts. Use the colours below. Output and done-signal are both green, because both sit at the end of the line.<\/p>\n<table>\n<thead>\n<tr>\n<th>Part<\/th>\n<th>Sticky note colour<\/th>\n<th>The question it answers<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Trigger<\/strong><\/td>\n<td>Blue<\/td>\n<td>What actually arrives that starts this?<\/td>\n<\/tr>\n<tr>\n<td><strong>Steps<\/strong><\/td>\n<td>Yellow<\/td>\n<td>What happens, one action per note?<\/td>\n<\/tr>\n<tr>\n<td><strong>Decisions<\/strong><\/td>\n<td>Pink<\/td>\n<td>Where does someone have to judge something?<\/td>\n<\/tr>\n<tr>\n<td><strong>Owner and approver<\/strong><\/td>\n<td>Orange<\/td>\n<td>Who checks it, and who must say yes before anything reaches another person?<\/td>\n<\/tr>\n<tr>\n<td><strong>Output<\/strong><\/td>\n<td>Green<\/td>\n<td>What real thing exists at the end: a file, a reply, a payment, a calendar entry?<\/td>\n<\/tr>\n<tr>\n<td><strong>Done-signal<\/strong><\/td>\n<td>Green<\/td>\n<td>How do you know it is finished, without checking by hand?<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Start from the thing that actually arrives.<\/strong> This is Annie's own design rule. It shaped one of her most useful automations (Build Log 30).<\/p>\n<ul>\n<li>A medical receipt that needs an insurance claim arrives by email.<\/li>\n<li>Sometimes it arrives the day after the appointment.<\/li>\n<li>An automation that started from the appointment would look too early and miss receipts.<\/li>\n<li>So the email is the trigger.<\/li>\n<li>The calendar has one smaller job. If an expected receipt has not arrived after 4 days, the system says so once.<\/li>\n<\/ul>\n<p><strong>Write every small step.<\/strong> \"Do the claim\" is not a step. Written out, Annie's receipt chore has six steps:<\/p>\n<ol>\n<li>Check email.<\/li>\n<li>Find the file.<\/li>\n<li>Download it.<\/li>\n<li>Rename it to fit the claim app's 15-character limit (Build Log 30).<\/li>\n<li>Upload it.<\/li>\n<li>Remember to do all of this on the right day.<\/li>\n<\/ol>\n<p>Small steps show you which steps a script could do from start to finish.<\/p>\n<h3>A Worked Example: Receipts That Need a Claim<\/h3>\n<p>This is the card Annie wrote for her receipt chore.<\/p>\n<ul>\n<li><strong>Trigger:<\/strong> an email with a receipt attached arrives from a known clinic.<\/li>\n<li><strong>Steps:<\/strong>\n  1. Find the email.\n  2. Download the file.\n  3. Rename it to 15 characters or fewer.\n  4. Send it to my phone at a time I can act.\n  5. Upload it to the claim app.\n  6. Log that it is done.<\/li>\n<li><strong>Decisions:<\/strong> Is this a receipt I can claim? Whose claim is it?<\/li>\n<li><strong>Owner and approver:<\/strong> Me. The insurer requires me to submit the claim myself.<\/li>\n<li><strong>Output:<\/strong> a claim submitted, with the file named correctly.<\/li>\n<li><strong>Done-signal:<\/strong> I reply \"done\" and the system logs it.<\/li>\n<li><strong>Never-arrives check:<\/strong> an appointment happened but no receipt came within 4 days. The system sends one message, once.<\/li>\n<\/ul>\n<h3>A Second Worked Example: Chase an Unpaid Invoice<\/h3>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 12, approved by Annie on 13 Oct 2026: new card. The facilitator shows the card that fits the room. AUDIT.md, Finding 11.]<\/em><\/p>\n<p>This is the same card for a work chore. A founder or a freelancer can copy it.<\/p>\n<ul>\n<li><strong>Trigger:<\/strong> an invoice I sent is 30 days old and not marked paid.<\/li>\n<li><strong>Steps:<\/strong>\n  1. Find the invoice.\n  2. Check my bank for the payment.\n  3. Draft a reminder in my own words.\n  4. Send the draft to me.\n  5. After my yes, send it to the client.\n  6. Log the date I chased.<\/li>\n<li><strong>Decisions:<\/strong> Has it really not been paid? Is this a client I chase by email, or one I call?<\/li>\n<li><strong>Owner and approver:<\/strong> Me. Nothing reaches a client without my yes.<\/li>\n<li><strong>Output:<\/strong> a reminder sent, logged with the date.<\/li>\n<li><strong>Done-signal:<\/strong> the payment arrives, and the invoice is marked paid.<\/li>\n<li><strong>Never-arrives check:<\/strong> 14 days after the reminder, still no payment. The system sends me one message, once.<\/li>\n<\/ul>\n<h2>Who Checks This?<\/h2>\n<p><em>Full course segment. In the Short course, give the one-sentence version when the students add the people to their notes.<\/em><\/p>\n<p><strong>Ask this about every process: who checks the result?<\/strong> Then ask how quickly they would notice if it were wrong. This is not about who does the work. It is about who would see the mistake.<\/p>\n<p><strong>Mark a step \"nobody\" when no one checks it.<\/strong> This is often the most honest note on the sheet. Some \"nobody\" steps still get done. Usually you are doing them, in the margins, and no one notices.<\/p>\n<p><strong>A \"nobody\" step can be automated only after you name someone to check its results.<\/strong> An automation on an unchecked step makes it worse. It produces wrong results faster and with more confidence.<\/p>\n<p><strong>Annie's example (Build Log 74).<\/strong> Her nightly filing job reported success every night for weeks. All that time, it was filing notes into the wrong folder. Nothing checked where the notes ended up.<\/p>\n<p><strong>So write a name next to every \"nobody\".<\/strong> The name can be yours.<\/p>\n<h2>Map Process One<\/h2>\n<p><strong>Step 1. Write the trigger.<\/strong> Put one blue note at the left. Write what arrives, in plain words. If no thing arrives, write the time instead, such as \"every Sunday at 6 pm\".<\/p>\n<p><strong>Step 2. Lay out the steps.<\/strong> Use one yellow note per action, from left to right. Use verbs: check, find, copy, rename, send, remember.<\/p>\n<p><strong>Step 3. Mark the decisions.<\/strong> Some steps need judgement. Swap each of those for a pink note. \"Is this urgent?\" is a decision. \"Copy the date\" is not.<\/p>\n<p><strong>Step 4. Add the people.<\/strong> Some steps need someone to say yes before something reaches another person. Put an orange note above each of those. Mark any step that no one checks as \"nobody\".<\/p>\n<p><strong>Step 5. Score the pain.<\/strong> On each yellow note, write 1 to 3 for how much you dislike that step.<\/p>\n<p><strong>Step 6. Write the output and the done-signal.<\/strong> Use two green notes. One is the real thing produced. The other is how you know it is finished.<\/p>\n<p><strong>Step 7. Add the never-arrives check.<\/strong> Ask: what if the trigger never comes? Write what should happen on a final note.<\/p>\n<p><strong>You know it works when<\/strong> someone else can read your notes from left to right and do the job without asking you a question.<\/p>\n<p><strong>If you get stuck, your process is probably too big.<\/strong> Cut it in half and map only the first half.<\/p>\n<ul>\n<li>\"Manage family admin\" is too big.<\/li>\n<li>\"Book my son's classes without clashes\" is the right size.<\/li>\n<\/ul>\n<h2>Keep One To-Do List and One Inbox<\/h2>\n<p><em>Full course segment.<\/em><\/p>\n<p>Two habits make every later automation simpler.<\/p>\n<p><strong>Habit one: keep one to-do list, pinned (Build Log 13).<\/strong><\/p>\n<ul>\n<li>In June 2026 Annie had two to-do lists. So she trusted neither.<\/li>\n<li>She moved the one unique item across and deleted the extra list.<\/li>\n<li>She pinned the master list as <code>_TO DO.md<\/code> at the top of her inbox.<\/li>\n<li>The underscore keeps the list at the top of the folder.<\/li>\n<li>The underscore also tells her filing job to leave the list alone.<\/li>\n<li>This rule is written in two places: the job's code and the job's written rules. So both agree.<\/li>\n<\/ul>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 9, approved by Annie on 13 Oct 2026: one paragraph added. The bot writes to this note in the server module (Module 08B).]<\/em><\/p>\n<p><strong>Do it now.<\/strong> If your pinned list is not already a note in your vault, create the note <code>_TO DO.md<\/code> in your <code>00 Inbox<\/code> folder and paste your list into it. Your bot writes to this note in the server module (Module 08B).<\/p>\n<p><strong>Habit two: keep the inbox as the only holding area (Build Log 74).<\/strong><\/p>\n<ul>\n<li>Annie's filing job once moved notes into an in-between folder called <code>_processed<\/code>. It did not move them into their real homes.<\/li>\n<li>The folder looked like finished work, so nobody opened it.<\/li>\n<li>The notes sat there for weeks.<\/li>\n<li>Her rule since then: a note is either filed into its real home, or it stays in the inbox with a visible reason.<\/li>\n<\/ul>\n<h2>Ten Questions to Answer Before You Build<\/h2>\n<p>Answer these questions for process one. Annie asks these questions before she builds anything. Each one comes from something she learned while building.<\/p>\n<ol>\n<li>Which steps need judgement, and which only move information from one place to another?<\/li>\n<li>When it goes wrong today, who notices, and how fast?<\/li>\n<li>What information in this process must never leave your own accounts? Check your What AI Is Allowed to See sheet.<\/li>\n<li>If it worked perfectly, what would you do with the time back?<\/li>\n<li>Is this a task you dislike, that happens often, and where a mistake is cheap? Those are the best first projects.<\/li>\n<li>Have you tried to automate it before? What happened?<\/li>\n<li>Does anything in this process go to another person, such as a teacher, a helper or a family member? Who says yes before it does?<\/li>\n<li>What does a mistake cost: a redo, an apology, or real harm?<\/li>\n<li>Which apps or accounts would it need to read, and whose name is each one in?<\/li>\n<li>What would make you trust it enough to stop checking it by hand?<\/li>\n<\/ol>\n<p><strong>Your answer to the last question, what would make you trust it enough to stop checking, is your definition of done.<\/strong> On day one, Annie wrote her measure of success: mental load removed, multiplied by trust (Hermes Master Doc). Some jobs run, but you still check them by hand. Those jobs have not removed the load.<\/p>\n<h2>From the Record<\/h2>\n<p><strong>The bill reminder that ten minutes of checking stopped (Build Log 41).<\/strong><\/p>\n<ul>\n<li><strong>The plan, 27 Jul 2026.<\/strong> A credit card statement email arrives. The bot sends the amount and the due date. Annie replies \"paid\".<\/li>\n<li><strong>The check.<\/strong> Annie read real emails for ten minutes before writing any code. This broke three assumptions:<\/li>\n<li>One bank had not sent a statement email since May 2022.<\/li>\n<li>The other bank's alerts went to a family member's inbox.<\/li>\n<li>The alert email held no amount and no due date. It only said that a statement was ready.<\/li>\n<li><strong>The result.<\/strong> A simpler version shipped. Annie retired it the same day. A message that can only say \"go and check the app\" does not remove enough work to earn a daily slot.<\/li>\n<li><strong>The lesson.<\/strong> Check the real trigger before you build. Judge an automation by whether it removes a chore.<\/li>\n<\/ul>\n<p><strong>Six places to look, one place to act (Build Log 55).<\/strong><\/p>\n<ul>\n<li><strong>The ask, August 2026.<\/strong> Annie asked to tidy her seminar notes. She believed the mess was three documents.<\/li>\n<li><strong>What a search found:<\/strong><\/li>\n<li>Six places, not three.<\/li>\n<li>The real tasks were split across two sections of her to-do list.<\/li>\n<li>Four bold notes said certain material must go into a teaching page. Each note was restated, and none was ever done. They were notes, not tasks, so nothing acted on them.<\/li>\n<li><strong>The fix.<\/strong> All four notes became one item on the list.<\/li>\n<li><strong>The lesson.<\/strong> A note is not a task. Put tasks where tasks get done.<\/li>\n<\/ul>\n<p><strong>A process, finished (Build Log 19).<\/strong><\/p>\n<ul>\n<li>In June 2026 Annie taught her bot how she wants email replies drafted.<\/li>\n<li>At first the steps lived in chat and in the bot's small memory. That memory filled up.<\/li>\n<li>The steps were then written into the bot's reply instructions as six numbered steps:<\/li>\n<\/ul>\n<ol>\n<li>Find the thread by email address first.<\/li>\n<li>Draft from the account that received the original.<\/li>\n<li>Work out who is on each side from the thread itself.<\/li>\n<li>Check who is attending against the latest confirmation.<\/li>\n<li>Reply in the same thread, with the same subject.<\/li>\n<li>Show the account, subject and full text before sending.<\/li>\n<\/ol>\n<p>Every step prevents a mistake she had already seen. <strong>The lesson:<\/strong> this is what a process on paper looks like when it is ready to hand over.<\/p>\n<h2>Exercise: A Partner Reads Your Map<\/h2>\n<p><em>Full course. Short course students do this at home with a friend or family member.<\/em><\/p>\n<ol>\n<li>Choose the smaller of your two processes.<\/li>\n<li>Read your sticky notes aloud to a partner, from left to right. Do not add anything.<\/li>\n<li>Your partner writes down every question they would need to ask you.<\/li>\n<li>Each question is a missing note. Add them.<\/li>\n<\/ol>\n<h2>Worksheet: Workflow<\/h2>\n<p>Write one workflow for each job or task you want to build.<\/p>\n<ol>\n<li>Copy the table into a note called <code>Workflow — &lt;name&gt;<\/code> in your vault's <code>AI System<\/code> folder.<\/li>\n<li>Paste in a photo of your sticky notes.<\/li>\n<\/ol>\n<table>\n<thead>\n<tr>\n<th>Part<\/th>\n<th>Workflow one<\/th>\n<th>Workflow two<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Name<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Trigger (what actually arrives)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Steps (one action each), with pain 1 to 3<\/td>\n<td>1. 2. 3. 4. 5. 6.<\/td>\n<td>1. 2. 3. 4. 5. 6.<\/td>\n<\/tr>\n<tr>\n<td>Decisions (judgement needed)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Who checks it (\"nobody\" if no one)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>If \"nobody\": who will check it from now on?<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Who says yes before anything reaches another person<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Apps and accounts it reads<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Output (the real thing produced)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Done-signal<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Never-arrives check<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Tier of the information involved (from your What AI Is Allowed to See sheet)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>What would make me trust it enough to stop checking (my definition of done)<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>How many to-do lists do I keep today?<\/strong> ____ <strong>Which one becomes the pinned list?<\/strong> ____________<\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 2: closing line added.]<\/em><\/p>\n<p><strong>Next: the file about you (Module 06).<\/strong> Your jobs are on paper. Now the machine learns who you are. Keep the sticky notes. They come back on Day 4, in the script-or-AI module (Module 09), after you have built your system. <em>[FABLE EDIT, 13 Oct 2026. Proposal 11, approved by Annie on 13 Oct 2026: one sentence added to the closing line.]<\/em><\/p>\n<h2>Teaching Notes<\/h2>\n<ul>\n<li><strong>Students pick processes that are too big.<\/strong> The usual fix is to cut the process in half. There are three students at most. Check each one's choice in the first five minutes of mapping.<\/li>\n<li><strong>The trigger question does the most work.<\/strong> Keep asking \"what actually arrives?\" Stop when the answer is a thing, not an intention.<\/li>\n<li><strong>Some students will want to talk about AI.<\/strong> Hold that for the later module that decides which steps a script or an AI should do (Module 09). Today is only about what happens now.<\/li>\n<li><strong>Sticky notes on a wall work better than on a desk.<\/strong> Students see the whole process and can move steps around.<\/li>\n<li><strong>Take a photo of each wall map.<\/strong> Students paste it into their vault note at the end.<\/li>\n<li><strong>Timing risk: the second map often runs over in the Full course.<\/strong> Make it homework if needed.<\/li>\n<\/ul>\n<h3>Where Students Get Stuck<\/h3>\n<table>\n<thead>\n<tr>\n<th>Stuck point<\/th>\n<th>What to say<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>\"Everything is a process. This is too much.\"<\/td>\n<td>\"Pick the one with the highest pain score. That is enough for today.\"<\/td>\n<\/tr>\n<tr>\n<td>\"I don't have processes. I just do things.\"<\/td>\n<td>\"Tell me what you did last Tuesday. Anything you did twice is a process.\"<\/td>\n<\/tr>\n<tr>\n<td>\"Can I just use an app for this?\"<\/td>\n<td>\"Not yet. An app makes you file things before you have looked at them.\"<\/td>\n<\/tr>\n<tr>\n<td>\"My process is different every time.\"<\/td>\n<td>\"Then write down the parts that stay the same. That is your process.\"<\/td>\n<\/tr>\n<tr>\n<td>\"I have no idea who checks this.\"<\/td>\n<td>\"Write 'nobody'. That may be the most useful note on your sheet.\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table>"}, {"id": "full-8", "title": "06: Introduce Yourself to the Machine", "handout": false, "html": "<h1>Module 06: Introduce Yourself to the Machine<\/h1>\n<p><strong>How to read this file.<\/strong><\/p>\n<ul>\n<li>This is the master copy for both courses.<\/li>\n<li>The Full course runs every segment.<\/li>\n<li>The Short course runs only the segments with minutes in its column.<\/li>\n<li>In the Short course, the success sentence and the strengths come from the interview answers.<\/li>\n<li>In the Short course, the stranger test is homework. In this test, a partner reads your file and answers three questions about you.<\/li>\n<\/ul>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 2: bridge block added.]<\/em><\/p>\n<p><strong>Why this module comes here.<\/strong><\/p>\n<ol>\n<li>Your workflows (Module 05) say what to do. This file says who it is for.<\/li>\n<li>An AI knows you only through files about you. Nothing you tell it in chat lasts past that chat.<\/li>\n<li>The rules module (Module 07) writes the assistant's own files. Keep the two apart: this one is about you.<\/li>\n<\/ol>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 4, approved by Annie on 13 Oct 2026. In this file: 4 changes, 1 editor notes and the sections Where the Two Versions Went (from inside the Teaching Notes), Sources, Related moved to <code>editor-notes/06 — Editor's Notes.md<\/code>. Every change, with its old and new text, is listed in FABLE-EDITS.md.]<\/em><\/p>\n<h2>Run Sheet<\/h2>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 13, approved by Annie on 13 Oct 2026: every check in this file now starts \"You know it works when\". AUDIT.md, Finding 13. The old wording of each line is in <code>proposals/13 — One Phrase for Every Check.md<\/code>.]<\/em><\/p>\n<p>Full course: 45 minutes. Short course: 30 minutes. A dash means the segment is not in that course.<\/p>\n<table>\n<thead>\n<tr>\n<th>Full (min)<\/th>\n<th>Short (min)<\/th>\n<th>Segment<\/th>\n<th>Facilitator does<\/th>\n<th>Students do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5<\/td>\n<td>5<\/td>\n<td>Why the machine needs to know you<\/td>\n<td>Explains that \"my AI\" is a set of files about you<\/td>\n<td>Listen<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>15<\/td>\n<td>Let the AI interview you<\/td>\n<td>Checks each student's What AI Is Allowed to See sheet first, then hands out the prompt<\/td>\n<td>Run the interview in Gemini, one question at a time<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>—<\/td>\n<td>Your success sentence, and what you will give up<\/td>\n<td>Shows Annie's examples<\/td>\n<td>Write their success sentence and two short answers<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>—<\/td>\n<td>Your strengths, written down<\/td>\n<td>Explains why the machine should know what to protect<\/td>\n<td>List three things they do well<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>10<\/td>\n<td>Write your USER.md<\/td>\n<td>Shows the template and the example of one rule written with two different reasons<\/td>\n<td>Turn the interview into USER.md, under 1,375 characters<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>—<\/td>\n<td>The stranger test: a partner reads your file<\/td>\n<td>Pairs students<\/td>\n<td>Answer three questions about a partner's file<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>How the minutes add up.<\/strong><\/p>\n<ul>\n<li><strong>Full course: 45 minutes.<\/strong> Why the machine needs to know you takes 5 minutes. The AI interview takes 15. Writing your success sentence and what you will give up takes 5. Listing three of your strengths takes 5. Writing USER.md takes 10. A partner answering three questions from your file takes 5.<\/li>\n<li><strong>Short course: 30 minutes.<\/strong> Why the machine needs to know you takes 5 minutes. The AI interview takes 15. Writing USER.md takes 10.<\/li>\n<\/ul>\n<h2>What You Will Leave With<\/h2>\n<p><strong>Your USER.md.<\/strong> This is a short file that tells every AI tool in your system who you are. It covers:<\/p>\n<ul>\n<li>your work<\/li>\n<li>your people<\/li>\n<li>your week<\/li>\n<li>how you want to be spoken to<\/li>\n<li>what \"helped\" means to you<\/li>\n<li>your hard rules<\/li>\n<\/ul>\n<p>In the build, it goes into your AI assistant's instructions. In the Full course, it is also loaded into your bot.<\/p>\n<p><strong>Your table of who must never see what.<\/strong> This says what information must never reach whom. It stays in your vault, beside your What AI Is Allowed to See sheet. In the next module, it becomes rules.<\/p>\n<h2>Before This Module<\/h2>\n<ul>\n<li><strong>Your What AI Is Allowed to See sheet from Module 02.<\/strong> It decides what may go into this file.<\/li>\n<li><strong>Gemini, open on your phone or laptop.<\/strong> It works in Hong Kong without a VPN, so it is the default for this exercise. Any AI assistant you can reach works.<\/li>\n<li><strong>The interview prompt,<\/strong> copied from the course notes.<\/li>\n<\/ul>\n<h2>Why the Machine Needs to Know You<\/h2>\n<p><strong>An AI model starts every conversation knowing nothing about you.<\/strong> It talks to everyone the same way. So its advice suits an average person, not you.<\/p>\n<p><strong>The difference between \"a Claude\" and \"my Claude\" is a set of files.<\/strong> Annie found this out in August 2026 (Build Log 46).<\/p>\n<ul>\n<li>She moved her builder onto her server.<\/li>\n<li>The same Claude Code that knew her on the laptop was a stranger on the server.<\/li>\n<li>Then three things were copied across: its instruction file, its memory files and its continuity note.<\/li>\n<li>A test from the server, with no history, then answered four questions that only those files could answer:<\/li>\n<li>who she is<\/li>\n<li>two of her communication rules<\/li>\n<li>one thing never to reveal<\/li>\n<li>which machine it was on<\/li>\n<\/ul>\n<p><strong>There is no setup that suits everybody.<\/strong> A developer she worked with said this in May 2026. Setting up an AI is very personal (May 2026 call notes).<\/p>\n<p><strong>This file is about you. The next module is about the AI assistant.<\/strong> Keep the two apart (Hermes Master Doc).<\/p>\n<ul>\n<li>Facts about you and your people go in USER.md.<\/li>\n<li>The AI assistant's own personality and rules go in separate files, in the next module.<\/li>\n<\/ul>\n<h2>Let the AI Interview You<\/h2>\n<p>You will not write this file from a blank page. An AI will interview you, one question at a time. Then you turn your answers into the file. This method comes from Annie's seminar starter kit, file 02. It takes about 15 minutes.<\/p>\n<p><strong>Step 1. Check your What AI Is Allowed to See sheet before you type anything.<\/strong> Your answers go to the AI company that runs the AI assistant.<\/p>\n<ul>\n<li>Look at your Tier 3 list: passwords, ID numbers, bank details, and the health details you listed.<\/li>\n<li>None of it goes into the interview.<\/li>\n<li>Name people by role or first name only.<\/li>\n<li>Give no phone numbers or emails.<\/li>\n<\/ul>\n<p><strong>Step 2. Open Gemini<\/strong> at gemini.google.com, or another AI assistant you can use.<\/p>\n<p><strong>Step 3. Paste this prompt as your first message.<\/strong><\/p>\n<pre><code class=\"language-text\">Help me write a short profile of myself that my personal AI assistant will read before every conversation.\n\nInterview me first. Ask ONE question at a time, then wait for my answer. Never give me a list of questions. Keep it warm and plain. I am smart but not technical.\n\nAsk about 8 to 10 questions, covering:\n1. Who I am: my work, my role, and the big things on my plate.\n2. My people: who they are by role, and what I would want an AI assistant to do for or with each.\n3. My week: fixed commitments, my best focus time, and times I must not be interrupted.\n4. How I like to be spoken to: long or short, gentle or blunt, reasons or just answers, and what annoys me.\n5. How my attention works on a busy day.\n6. The three things I most wish I could stop carrying in my head, and the honest reason I want them gone.\n7. What I do well, so my AI assistant protects it rather than taking it over.\n8. Two or three rules my AI assistant must always follow. Suggest these: never guess, say when you do not know, and tell me when I am wrong.\n\nFor every rule I give you, ask me why, and write the reason next to the rule.\n\nWhen we finish, write the profile in the first person, under clear headings, in short sentences, in under 1,300 characters. Do not include passwords, ID numbers, bank details or anyone's contact details.\n\nStart by introducing yourself in one line, then ask your first question.\n<\/code><\/pre>\n<p><strong>Step 4. Answer casually.<\/strong> Short answers are fine. If a question does not fit, say so and move on.<\/p>\n<p><strong>You know it works when<\/strong> the AI assistant writes a short profile after 8 to 10 questions. It is under headings, in the first person, with a reason beside each rule.<\/p>\n<p><strong>If it fails:<\/strong><\/p>\n<ul>\n<li><strong>The AI assistant asks all its questions at once.<\/strong> Reply \"one question at a time, please\".<\/li>\n<li><strong>You cannot reach any AI assistant.<\/strong> Pair with a partner. Your partner reads the eight topics to you as questions and writes down your answers.<\/li>\n<\/ul>\n<h2>Your Success Sentence, and What You Will Give Up<\/h2>\n<p><em>Full course segment. Short course students take this from their interview answer about the three things they most wish they could stop carrying.<\/em><\/p>\n<p><strong>Write one sentence that says what \"working\" will look like for you in a month.<\/strong><\/p>\n<p><strong>Annie's examples.<\/strong><\/p>\n<ul>\n<li><strong>For her whole system,<\/strong> written on day one: mental load removed, multiplied by trust (Hermes Master Doc).<\/li>\n<li><strong>For one feature, her daily learning card:<\/strong> \"future Annie needs to be able to school the current Annie.\"<\/li>\n<li>Her builder tested its own design against that sentence. It found three failures before anything was built (Build Log 40).<\/li>\n<\/ul>\n<p><strong>Then answer two questions.<\/strong> They are short. They decide whether the system lasts.<\/p>\n<ul>\n<li><strong>What am I willing to give up for this?<\/strong> Time to set it up, a monthly cost, or some control over how things are done.<\/li>\n<li><strong>What will I do if it becomes another job to maintain?<\/strong> Every system needs upkeep. Decide now what \"too much\" looks like. Then you notice before you quietly stop using it.<\/li>\n<\/ul>\n<p><strong>Then write one pushback you would want.<\/strong> Annie wrote down one pushback she wanted (Hermes Master Doc, 26 Jun 2026). Sometimes she is about to send a slightly sharp email. Then the AI assistant should ask one question: is this the way she wants to speak to that person?<\/p>\n<h2>Your Strengths, Written Down<\/h2>\n<p><em>Full course segment. Short course students take this from their interview answer about what they do well.<\/em><\/p>\n<p><strong>Tell the machine what you do well.<\/strong> Then it supports those habits instead of quietly taking them over.<\/p>\n<p>In July 2026 Annie asked for her working strengths to be written into her builder's records (Build Log 26). They include these:<\/p>\n<ul>\n<li>She catches warnings that were raised but never acted on.<\/li>\n<li>She corrects fast and decides fast, once.<\/li>\n<li>She writes down everything important.<\/li>\n<li>She asks how a thing works, not only for the result.<\/li>\n<li>She always needs one next action, because it keeps her focused.<\/li>\n<\/ul>\n<p><strong>What her builder does now.<\/strong><\/p>\n<ul>\n<li>It ends every answer with her next action.<\/li>\n<li>It names it out loud when one of her questions catches a problem.<\/li>\n<\/ul>\n<p><strong>List three of your own.<\/strong><\/p>\n<h2>Write Your USER.md<\/h2>\n<ol>\n<li>Create a note called <code>USER<\/code> in your vault's <code>AI System<\/code> folder.<\/li>\n<li>Use the template below.<\/li>\n<li>Copy from your interview answers, then cut.<\/li>\n<\/ol>\n<h3>Every Rule Carries Its Reason<\/h3>\n<p><strong>A rule with its reason is followed better than a rule alone.<\/strong><\/p>\n<ul>\n<li>\"Keep messages short, because I read them on my phone between meetings\" works better than \"keep messages short\".<\/li>\n<li>The reason also changes how the AI assistant follows the rule. Annie's own file shows this.<\/li>\n<\/ul>\n<p><strong>Two of Annie's lines, in her words:<\/strong><\/p>\n<ul>\n<li><strong>\"ADHD means how I say things decides whether they land.\"<\/strong> That one line changes every answer the AI assistant gives: short, one topic at a time, never a wall of text.<\/li>\n<li><strong>\"I want more time with my family instead of endless admin and mental load.\"<\/strong> This tells the AI assistant when to take work off her (admin). It also tells it when to push back (anything that eats family time).<\/li>\n<\/ul>\n<p><strong>One rule, two reasons.<\/strong> Annie asked her AI assistant to praise her. Here are two ways she could have written it.<\/p>\n<ul>\n<li><strong>Version one: \"Praise me, because I didn't get it growing up.\"<\/strong><\/li>\n<li>The AI assistant treats it as comfort.<\/li>\n<li>It says kind things.<\/li>\n<li><strong>Version two: \"Give me specific praise when I do something well, and name exactly what I did. In my parents' generation, in Chinese culture, children were not raised with praise, so I never learned what it looks like. I am learning it from you so I can use it with my son.\"<\/strong><\/li>\n<li>The AI assistant treats it as teaching.<\/li>\n<li>It names exactly what she did and why it mattered.<\/li>\n<li>So she can see how it is done and do the same for her son.<\/li>\n<\/ul>\n<p><strong>The rule is the same. The reason changed what the AI assistant does.<\/strong> Many students will recognise the second reason from their own upbringing. Write your reasons as honestly as Annie wrote this one.<\/p>\n<h3>Keep It Under 1,375 Characters<\/h3>\n<p><strong>The AI assistant reads this file with every message you send.<\/strong> So every line costs something every time.<\/p>\n<ul>\n<li>Annie's bot cuts this file off at 1,375 characters (bot settings, checked 9 Oct 2026; Build Log 19).<\/li>\n<li>Annie's own file is 1,167 characters.<\/li>\n<li>Obsidian shows the character count in the bottom bar when the word count is switched on.<\/li>\n<li>The empty template below is about 780 characters. So keep each line short.<\/li>\n<\/ul>\n<pre><code class=\"language-markdown\"># About Me\n\n## Who I Am\n- [Role]. I am responsible for [two things]. On my plate now: [one line].\n\n## My People\n- [Role or first name]: [what you may help with].\n- [Role or first name]: [same].\n\n## My Week\n- Focus time: [time]. Do not interrupt it, because [reason].\n- Messages are welcome at [times].\n\n## How to Talk to Me\n- [Length and tone], because [reason].\n- Give me one next action, or up to three options with your default.\n\n## What Helped Means\n- This is working in a month if: [success sentence].\n- Help me stop carrying: [1], [2], [3].\n- Push back when: [my chosen pushback].\n\n## Protect These\n- [Strength 1]. [Strength 2]. [Strength 3].\n\n## Hard Rules\n- Never guess. Say when you do not know.\n- Tell me when I am wrong.\n- Nothing goes to another person without my yes.\n<\/code><\/pre>\n<p><strong>You know it works when:<\/strong><\/p>\n<ul>\n<li>The file is under 1,375 characters.<\/li>\n<li>It uses these headings.<\/li>\n<li>Each rule has a reason beside it.<\/li>\n<li>It holds no Tier 3 data.<\/li>\n<\/ul>\n<h2>The Stranger Test<\/h2>\n<p><em>Full course segment. Short course students do this at home with a friend or family member.<\/em><\/p>\n<p>Give your USER.md to a partner who does not know you well. They answer three questions from it:<\/p>\n<ol>\n<li>What would this person want automated first?<\/li>\n<li>What would this person hate about how an AI assistant talks to them?<\/li>\n<li>What should this AI assistant refuse to do?<\/li>\n<\/ol>\n<p><strong>If your partner can answer all three,<\/strong> the file is clear enough for a machine. <strong>If not,<\/strong> the machine will guess too. Fix the gaps.<\/p>\n<h2>From the Record<\/h2>\n<p><strong>The server copied the wrong half of her (Build Log 46).<\/strong><\/p>\n<ul>\n<li>In August 2026 Annie's builder moved onto her server.<\/li>\n<li>The test from the server passed all four questions.<\/li>\n<li>Then Annie noticed something missing. The server's Claude knew her work side but not her personal side.<\/li>\n<li>The cause: her two Mac accounts held two different sets of memory, and the work set had been copied.<\/li>\n<li>The fix copied the personal memory across.<\/li>\n<li><strong>The lesson.<\/strong> An AI only knows the parts of you that are written in the files it reads.<\/li>\n<\/ul>\n<p><strong>One sentence that rebuilt a feature (Build Log 40).<\/strong><\/p>\n<ul>\n<li>In July 2026 Annie's first daily learning card sent her a ready-made explanation each morning. It had an optional \"reply in your own words\".<\/li>\n<li>She stated her test: future Annie must be able to school current Annie.<\/li>\n<li>Against that sentence, the design failed three ways:<\/li>\n<li>Reading answers builds recognition, not recall.<\/li>\n<li>The step where learning happens was optional. Optional steps do not survive a busy day.<\/li>\n<li>Nothing was recorded. So there was no earlier answer to beat.<\/li>\n<li>The card was rebuilt as a question she answers first.<\/li>\n<li><strong>The lesson.<\/strong> Write the success sentence before you judge any design.<\/li>\n<\/ul>\n<p><strong>Writing down what works (Build Log 26).<\/strong><\/p>\n<ul>\n<li>In July 2026 Annie was about to lose access to the AI model she had built her working style with.<\/li>\n<li>She asked it to write down how it reasons with her.<\/li>\n<li>She also asked it to record her strengths, so future sessions would protect them.<\/li>\n<li>The document now loads on every device she uses.<\/li>\n<li><strong>The lesson.<\/strong> A working relationship with an AI survives a change of model only if it is written down.<\/li>\n<\/ul>\n<h2>Worksheet<\/h2>\n<h3>Checklist for Your USER.md<\/h3>\n<table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Under 1,375 characters<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Every rule has its reason<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>People are named by role or first name only<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>No passwords, ID numbers, bank details or contact details<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My success sentence is in it<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My three strengths are in it<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My one chosen pushback is in it<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Saved as <code>USER<\/code> in my vault's <code>AI System<\/code> folder<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Your Table of Who Must Never See What<\/h3>\n<p>Save this in your vault beside your What AI Is Allowed to See sheet, not in USER.md. The next module turns each row into a rule.<\/p>\n<table>\n<thead>\n<tr>\n<th>Information<\/th>\n<th>Who must never see it<\/th>\n<th>Why<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td
