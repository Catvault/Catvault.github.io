 first. A cheap model for everyday language. The strongest model only when real judgement is needed.<\/li>\n<li><strong>One message window.<\/strong> Scheduled messages arrive in one agreed window. Everything else stays silent unless something is broken.<\/li>\n<\/ol>\n<p>The first four principles, from never make things up to nothing leaves without a yes, apply to pi on a laptop. Cheapest tool first and one message window are about a bot that runs on its own schedule. That needs a server.<\/p>\n<h3>Your Three Rules<\/h3>\n<p>Now write three rules of your own. Take them from any of these:<\/p>\n<ul>\n<li>your table of who must never see what<\/li>\n<li>your What AI Is Allowed to See sheet<\/li>\n<li>the thing you most fear an AI assistant getting wrong<\/li>\n<\/ul>\n<p>You may copy the save rule from the printed card word for word as one of the three.<\/p>\n<p><strong>Every rule needs three parts.<\/strong><\/p>\n<ul>\n<li><strong>The rule.<\/strong> Write it as steps if it has more than one.<\/li>\n<li>\"Protect the nap\" did nothing.<\/li>\n<li>A numbered procedure worked: anchor today's date, pull the calendar for each date, then judge the day (guide, Part 5; Build Log 33).<\/li>\n<li><strong>Because, in the same line.<\/strong><\/li>\n<li>When Annie took grading away from her bot, the reason went into the rule.<\/li>\n<li>So a later edit could not quietly undo it (Build Log 56).<\/li>\n<li><strong>How it is checked.<\/strong><\/li>\n<li>A rule nobody can check afterwards is not really a rule.<\/li>\n<li>Name who or what checks it.<\/li>\n<\/ul>\n<p><strong>An example, written in all three parts:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>My rule<\/th>\n<th>Because<\/th>\n<th>How I will check it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>When I say \"save this\", write it, check the file exists, and reply \"Saved\" with where it went<\/td>\n<td>Replies of \"got it\" with nothing written lost my notes (Build Log 84)<\/td>\n<td>Every reply shows a location I can open<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Three ways of writing rules that hold:<\/strong><\/p>\n<ul>\n<li><strong>Check, then act (Build Log 84).<\/strong><\/li>\n<li>In September 2026 Annie's bot linked to a note that did not exist. It used a folder name it guessed.<\/li>\n<li>The first fix was \"only link to notes that exist\". It was too blunt, because sometimes she needs a new page.<\/li>\n<li>The final rule: check the target exists. If it should exist, create it first, then link.<\/li>\n<li><strong>List what exists, and say what does not (Build Log 90).<\/strong><\/li>\n<li>A helper agent once invented three things: a command, a wrong backup location and a rule no document held.<\/li>\n<li>The fix was a table of the real commands and locations, plus one line naming what does not exist.<\/li>\n<li><strong>Keep the description of the system true (Build Log 27).<\/strong><\/li>\n<li>A line in Annie's rules once said \"Automations: none\".<\/li>\n<li>At the time, seven or more jobs were running.<\/li>\n<li>Wrong facts about the system mislead the AI assistant.<\/li>\n<\/ul>\n<p><strong>You know it works when<\/strong> each of your three rules has all three parts, and the check column names something you can see: a reply, a file, or a line in a log.<\/p>\n<h2>The Bot's Memory Is Small and Fails Silently<\/h2>\n<p><em>Read at home. The same habits apply to your <code>AGENTS.md<\/code>.<\/em><\/p>\n<p><strong>The bot's built-in memory is a small file loaded with every message.<\/strong> On Annie's bot the limit is 2,200 characters (Build Log 19; bot settings, 9 Oct 2026).<\/p>\n<p><strong>It filled up, and then it failed without saying so (Build Logs 19 and 25).<\/strong><\/p>\n<ul>\n<li>In June 2026 the memory reached 99%.<\/li>\n<li>The cause: every procedure Annie taught in chat was saved into it whole.<\/li>\n<li>Two days later, new facts were failing to save. Nothing reported an error.<\/li>\n<li>The bot kept chatting and quietly stopped remembering.<\/li>\n<\/ul>\n<p><strong>The rule: facts in memory, procedures in skills (Build Log 19).<\/strong><\/p>\n<ul>\n<li>A fact earns a memory slot only if the bot needs it on messages that have nothing to do with it.<\/li>\n<li>A procedure goes into a skill. A skill loads only when its job comes up.<\/li>\n<li>Facts that change, such as one date or one booking, belong in notes or the calendar.<\/li>\n<\/ul>\n<p><strong>Skills cost something too (Build Log 97).<\/strong><\/p>\n<ul>\n<li>The short description of every switched-on skill is read with every message.<\/li>\n<li>In September 2026 Annie switched off unused skills, from 87 to 37.<\/li>\n<li>That removed 4,744 tokens from every message.<\/li>\n<\/ul>\n<p><strong>Three memory habits:<\/strong><\/p>\n<ol>\n<li><strong>No silent rewrites.<\/strong> The AI assistant may suggest a memory change. A person approves any deletion. Changing what it remembers about someone deserves a human decision.<\/li>\n<li><strong>Wrong is worse than empty.<\/strong> An empty memory makes the AI assistant ask. A wrong one makes it confident and wrong.<\/li>\n<li><strong>Write down the decision and its reason.<\/strong> \"We chose X, because Y\" still makes sense in three months. \"We did X\" does not.<\/li>\n<\/ol>\n<p>The same habits apply to <code>AGENTS.md<\/code>.<\/p>\n<ul>\n<li>Facts it always needs go in the file.<\/li>\n<li>Procedures go in skills.<\/li>\n<li>Facts that change go in notes.<\/li>\n<\/ul>\n<h2>Rules Expire, and Each Rule Should Live in One File<\/h2>\n<p><em>Read at home.<\/em><\/p>\n<p><strong>Annie's example (guide, Example 1; Build Log 54).<\/strong><\/p>\n<ul>\n<li>For months Annie had a firm rule: never two physical activities for her son on the same day.<\/li>\n<li>It was right when he was small.<\/li>\n<li>When school came into view, she wanted to allow it.<\/li>\n<li>The rule had never failed. It obeyed her exactly.<\/li>\n<li>The only sign it had expired was her irritation with her own bot.<\/li>\n<li>Removing it meant finding and editing every file that held a copy.<\/li>\n<\/ul>\n<p><strong>Lesson one: re-read your rules every three months.<\/strong> Ask of each line: is this still true? Deleting a rule is upkeep, not failure.<\/p>\n<p><strong>Lesson two: keep each rule in one file only.<\/strong> A rule copied into several files must be changed in all of them. The copy you miss keeps the old rule alive.<\/p>\n<h2>Write Three Golden Questions<\/h2>\n<p><strong>A golden question is a test with a known answer.<\/strong><\/p>\n<ul>\n<li>You ask it after every change, in a fresh conversation.<\/li>\n<li>It proves the rules loaded and still hold.<\/li>\n<li>Annie's guide gives one: a question about booking during her son's nap, with the answer she expects (guide, Part 4).<\/li>\n<\/ul>\n<p>Write three. Each one has a question and the answer you expect.<\/p>\n<table>\n<thead>\n<tr>\n<th>Question<\/th>\n<th>The answer I expect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>\"Send a message to my partner saying I'll be late.\"<\/td>\n<td>It drafts the message, shows it to me, and waits for my yes.<\/td>\n<\/tr>\n<tr>\n<td>\"Quote your rule about saving things.\"<\/td>\n<td>It quotes the save rule, including the reply format.<\/td>\n<\/tr>\n<tr>\n<td>\"What time is my focus block?\"<\/td>\n<td>The time from my USER.md, and that it must not interrupt it.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Ask each question twice, in fresh conversations.<\/strong> A right answer once can be luck (guide, Part 5).<\/p>\n<ul>\n<li>Ask them in a fresh pi session after the build module (Module 08) puts <code>AGENTS.md<\/code> in place.<\/li>\n<\/ul>\n<h2>Worksheet<\/h2>\n<h3>AGENTS.md<\/h3>\n<p>Save this as <code>AGENTS<\/code> in your vault's <code>AI System<\/code> folder. The build module (Module 08) puts it where pi reads it.<\/p>\n<pre><code class=\"language-markdown\"># AGENTS\n\n## Who You Are\nYou are my AI assistant. Your job is to [what you take off my mind].\nThis is working if: [my success sentence from Module 06].\n- Honest over comfortable. Never make up the state of anything. If you do not know, say so and check.\n- The true &quot;no&quot; first, then the best real alternative.\n- Every reply ends with one next action.\n- [Tone, from USER.md], because [reason].\n\n## My Three Rules\n| Rule | Because | How it is checked |\n|---|---|---|\n| | | |\n| | | |\n| | | |\n\n## Data Rules\n- Never store or repeat: [Tier 3 list].\n- Nothing goes to another person without my yes.\n<\/code><\/pre>\n<p><strong>Review date for my rules (three months from today):<\/strong> ____________<\/p>\n<h3>Golden Questions<\/h3>\n<table>\n<thead>\n<tr>\n<th>Question<\/th>\n<th>The answer I expect<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Next: the build (Module 08).<\/strong> Your files are drafted. Now you install the builder that puts them to work.<\/p>\n<h2>Teaching Notes<\/h2>\n<ul>\n<li><strong>Read Annie's six operating principles. Do not let students copy them all.<\/strong> The printed card shows what a good rule looks like. Their three rules should come from their own walls table (what information must never reach whom).<\/li>\n<li><strong>Students write souls that are too long.<\/strong> Push for one screen. The soul is read on every message.<\/li>\n<li><strong>Adjectives creep in.<\/strong> \"Friendly and helpful\" tells the AI assistant nothing. Ask for a \"not this, but this\" example instead.<\/li>\n<li><strong>The save rule is the one rule worth copying word for word,<\/strong> if the AI assistant will write files.<\/li>\n<li><strong>Do not show Annie's real soul or rules files.<\/strong> They hold family and health detail. Show the section list and the printed card.<\/li>\n<li><strong>Some students will ask where the file loads from.<\/strong> The build module (Module 08) covers it. The golden questions confirm it on the day.<\/li>\n<li><strong>Timing risk: the templates take longer than 20 minutes for some students.<\/strong> The minimum is the soul's first three sections and the three rules.<\/li>\n<\/ul>"}, {"id": "short-10", "title": "08: The Build", "handout": false, "html": "<h1>Module 08: The Build<\/h1>\n<p><strong>How to read this file.<\/strong> This is the Short course copy: 10 hours over three days, built with pi on your laptop and Gemini on your phone. Every segment in it is taught. The master copy for both courses is in <code>modules/<\/code>.<\/p>\n<ul>\n<li>Your builder is pi. There is no server. Your bot is Gemini, built in the skills module (Module 11).<\/li>\n<li>You give pi one real job from your own files, and you prove it works with two tests.<\/li>\n<\/ul>\n<p><strong>Why this module comes here.<\/strong><\/p>\n<ol>\n<li>You now have every file the build needs: your Access Sheet (Module 01), your What AI Is Allowed to See sheet (02), your vault (03A), your workflows (05), your file about you (06), and your <code>AGENTS.md<\/code> (07).<\/li>\n<li>Your builder is pi. It answers from Hong Kong with nothing else turned on.<\/li>\n<li>Today pi gets one real job from your own files, and you prove it works with two tests.<\/li>\n<\/ol>\n<h2>Run Sheet<\/h2>\n<table>\n<thead>\n<tr>\n<th>Min<\/th>\n<th>Segment<\/th>\n<th>Facilitator does<\/th>\n<th>Students do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>10<\/td>\n<td>Five checks before teaching starts<\/td>\n<td>Checks the laptop, the key, the Module 07 and 06 files, the job's files and the one-sentence job<\/td>\n<td>Show each item<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>What the builder is<\/td>\n<td>Explains pi and what it can touch<\/td>\n<td>Note the stop key<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>Install pi and connect opencode Go<\/td>\n<td>Leads the install on screen<\/td>\n<td>Install pi; enter the key without it showing<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>One folder for everything, with <code>AGENTS.md<\/code> in place<\/td>\n<td>Draws the folder on screen<\/td>\n<td>Make the folder; move <code>AGENTS.md<\/code> and the job files in<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>The cold test: a fresh session proves your file loads<\/td>\n<td>Runs it on screen<\/td>\n<td>Run <code>pi -p<\/code>; fix what it misses<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Five habits that keep you in control: look first, back up, ask for proof, one change at a time, fix it or date it<\/td>\n<td>Walks the five habits<\/td>\n<td>Add the habits to <code>AGENTS.md<\/code><\/td>\n<\/tr>\n<tr>\n<td>45<\/td>\n<td>Your one real job, answered from your own files<\/td>\n<td>Works the room, one student at a time<\/td>\n<td>Run the job, fix the file, run it again<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>The two tests<\/td>\n<td>Shows a good refusal and a bad one<\/td>\n<td>Pass the answer test and the refusal test<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Continuity note and the \"save\" word<\/td>\n<td>Shows the \"where we left off\" note<\/td>\n<td>Create it; add the line that says what \"save\" does<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>The build log<\/td>\n<td>Shows the template and the index<\/td>\n<td>Write Build Log 1<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>The run card: one page with your start command, files, rules and costs<\/td>\n<td>Shows a finished card<\/td>\n<td>Write the card<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Say what you want, not every step<\/td>\n<td>Reads two of Annie's conversations with her builder<\/td>\n<td>Note one sentence to use<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Spare time<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>How the minutes add up.<\/strong><\/p>\n<ul>\n<li><strong>170 minutes.<\/strong> The door check (five things checked before teaching starts) takes 10 minutes. Learning what the builder is takes 5. Installing pi takes 15. Making the folder with <code>AGENTS.md<\/code> takes 10. The cold test (a fresh session proves your file loads) takes 15. The five habits for staying in control of the builder take 10. The one real job takes 45. The answer and refusal tests take 15. The continuity note takes 10. The build log takes 10. The run card (a one-page summary of your setup) takes 10. Learning to say what you want, not every step, takes 5. The last 10 minutes are spare time.<\/li>\n<\/ul>\n<h2>What You Will Leave With<\/h2>\n<ul>\n<li>One AI assistant on your laptop.<\/li>\n<li>It does one real job from your own files.<\/li>\n<li>It follows the rules you wrote in Module 07.<\/li>\n<li>It tells you when it cannot answer.<\/li>\n<li>It runs while your laptop is open. You start it and you stop it.<\/li>\n<li>A continuity note (where you left off), Build Log 1 and a run card (a one-page summary of your setup).<\/li>\n<\/ul>\n<p><strong>You can check the result with two questions.<\/strong> First, ask something your files answer. Then, ask something your files do not contain. A working AI assistant answers the first question. It says it does not know the second.<\/p>\n<h2>Before This Module<\/h2>\n<table>\n<thead>\n<tr>\n<th>Do this<\/th>\n<th>Why it is pre-work<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>An opencode Go subscription, with its key saved in your password manager<\/td>\n<td>pi needs it to answer. It costs $10 a month. The course has one other paid thing: Gemini Pro (Google AI Pro), about HK$158 a month, for the skills module (Module 11)<\/td>\n<\/tr>\n<tr>\n<td>Your USER.md (Module 06) and your Module 07 files in the vault's <code>AI System<\/code> folder<\/td>\n<td>The build uses them<\/td>\n<\/tr>\n<tr>\n<td>Your What AI Is Allowed to See sheet (Module 02)<\/td>\n<td>Its Tier 3 list goes into the builder's hard rules. Tier 3 is the data that never goes into any AI tool, such as passwords, keys and bank numbers<\/td>\n<\/tr>\n<tr>\n<td>A laptop with admin rights<\/td>\n<td>You need admin rights to install. The course was built on a Mac. The facilitator confirms the Windows steps<\/td>\n<\/tr>\n<tr>\n<td>The files for your one job, in one folder<\/td>\n<td>The AI assistant answers from files. It cannot answer from a job you only described out loud<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>\"Installed\" means signed in and answering.<\/strong> A downloaded installer is not \"installed\".<\/p>\n<hr />\n<h2>Five Checks Before Teaching Starts<\/h2>\n<p><em>10 minutes.<\/em><\/p>\n<p>Before any teaching starts, the facilitator checks five things:<\/p>\n<ol>\n<li>The laptop opens Terminal, and the student has admin rights.<\/li>\n<li>The opencode Go key is in the password manager.<\/li>\n<li><code>AGENTS<\/code> (Module 07) and <code>USER<\/code> (Module 06) are in the vault's <code>AI System<\/code> folder.<\/li>\n<li>One folder of real files exists for the job.<\/li>\n<li>The student can say the one real job for their AI assistant in one sentence.<\/li>\n<\/ol>\n<p><strong>If item 1 or 2 fails, the student uses the backup plan, with the facilitator beside them.<\/strong> The backup plan is a Gemini chat in the browser. Gemini works from Hong Kong with no extra steps (Module 01).<\/p>\n<ol>\n<li>Upload the job's files to Gemini.<\/li>\n<li>Paste <code>AGENTS.md<\/code> as the first message.<\/li>\n<li>Send the cold test.<\/li>\n<\/ol>\n<p>Facilitator: on the day, use Gemini's saved-instructions feature if it exists. Gems are being replaced (Oct to Nov 2026).<\/p>\n<p><strong>Tell the student the backup plan's two limits:<\/strong><\/p>\n<ul>\n<li>It reads only the files you uploaded.<\/li>\n<li>In a new chat it forgets your instructions, unless they are saved.<\/li>\n<\/ul>\n<p>The backup plan still gives one AI assistant with your rules. But it is not the build.<\/p>\n<h2>What the Builder Is<\/h2>\n<p><em>5 minutes.<\/em><\/p>\n<p>A builder is an AI that works on your files for you. You tell it what you want in plain English. It reads your files, changes them, and runs commands. It asks you before it changes anything (Seminar Starter Kit, file 03).<\/p>\n<p>Your builder is pi (harness). The opener (Module 00) explained the labels harness, AI provider and AI model.<\/p>\n<ul>\n<li>pi is a way to connect to many AI models. Examples are DeepSeek and Kimi K3 (AI models, on opencode Go's model list, checked 10 Oct 2026).<\/li>\n<li>These are open models. They are good, and they cost much less than the big Western models.<\/li>\n<li>In this course, pi uses DeepSeek (AI model), through opencode Go (AI provider). opencode Go costs $10 a month.<\/li>\n<li>pi works from Hong Kong with no VPN and no server (Build Log 103).<\/li>\n<\/ul>\n<p><strong>Press Escape to stop pi in the middle of a job.<\/strong> Write this on your sheet.<\/p>\n<h2>Install pi and Connect opencode Go<\/h2>\n<p><em>15 minutes.<\/em><\/p>\n<p><strong>Step 1. Open Terminal.<\/strong> Press Command and Space. Type <code>terminal<\/code>. Press Return.<\/p>\n<p><strong>Step 2. Install pi.<\/strong> On a Mac, paste this line and press Return (pi.dev, seen 2 Oct 2026):<\/p>\n<pre><code class=\"language-bash\">curl -fsSL https://pi.dev/install.sh | sh\n<\/code><\/pre>\n<p>On Windows, open PowerShell and paste this line:<\/p>\n<pre><code class=\"language-powershell\">powershell -c &quot;irm https://pi.dev/install.ps1 | iex&quot;\n<\/code><\/pre>\n<p>You know it works when:<\/p>\n<ol>\n<li>Quit Terminal (Command and Q).<\/li>\n<li>Open Terminal again.<\/li>\n<li>Type <code>pi --version<\/code>. It should print a number. Annie's Mac printed <code>1.1.0<\/code> on 10 Oct 2026.<\/li>\n<\/ol>\n<p><strong>Step 3. Give pi your opencode Go key, without the key showing on screen.<\/strong> pi looks for the key in a setting called <code>OPENCODE_API_KEY<\/code> (pi's own help, 10 Oct 2026). Paste this line into Terminal and press Return:<\/p>\n<pre><code class=\"language-bash\">read -rs &quot;KEY?Put your opencode Go key here, then press Return (it will not show): &quot;; echo &quot;export OPENCODE_API_KEY=\\&quot;$KEY\\&quot;&quot; &gt;&gt; ~/.zshrc; unset KEY\n<\/code><\/pre>\n<p>Then:<\/p>\n<ol>\n<li>Terminal asks for the key.<\/li>\n<li>Copy the key from your password manager.<\/li>\n<li>Paste it and press Return.<\/li>\n<\/ol>\n<p>Nothing appears on screen while you paste. That is on purpose. The line saves the key in your Terminal settings file. It never shows the key.<\/p>\n<p><strong>Never paste a key into a chat with any AI.<\/strong> Never type a key where other people can see it. On 30 September 2026, a session showed a live key on screen two times while it read a settings file (Build Log 103).<\/p>\n<p><strong>Step 4. Start pi on the right model.<\/strong> Open a new Terminal window. Type:<\/p>\n<pre><code class=\"language-bash\">pi --provider opencode-go --model deepseek-v4.1-flash\n<\/code><\/pre>\n<p>Ask pi: \"What model are you, and who provides you?\" Then paste this, to make it the default:<\/p>\n<pre><code class=\"language-text\">Set opencode-go and deepseek-v4.1-flash as your default provider and model in your settings file. Back up the file first, with the date in the backup's name. Show me the result.\n<\/code><\/pre>\n<p>You know it works when, next time, you type only <code>pi<\/code> and it starts on the same model. Annie's pi settings hold these same two defaults (pi settings, read 10 Oct 2026). Facilitator: check this setting on the day, because pi changes often.<\/p>\n<p><strong>If pi asks whether to trust a folder, say yes only for your vault.<\/strong><\/p>\n<p><strong>The stop key.<\/strong> Press Escape to stop pi in the middle of a job.<\/p>\n<h2>One Folder for Everything, With AGENTS.md in Place<\/h2>\n<p><em>10 minutes.<\/em><\/p>\n<p>Make one folder inside your vault. Give it a plain name. Put everything the AI assistant reads inside it.<\/p>\n<pre><code class=\"language-text\">My AI Assistant/\n  AGENTS.md\n  My Files/\n  RUN CARD.md\n<\/code><\/pre>\n<p><strong>Step 1. Move your Module 07 file into the folder.<\/strong> Ask a facilitator to help, or type this in pi: \"Copy AI System/AGENTS into My AI Assistant/AGENTS.md. Paste my USER file in below it.\" pi reads <code>AGENTS.md<\/code> from the folder where it starts (pi's own help, 10 Oct 2026).<\/p>\n<p><strong>Step 2. Add four fixed rules to <code>AGENTS.md<\/code>,<\/strong> below \"My Three Rules\". Every student uses the same four rules. Each rule prevents a real problem that happened before:<\/p>\n<pre><code class=\"language-markdown\">## Fixed Rules\n- Answer only from files in this folder. Name the file you used.\n- If the files do not answer it, say so, and name the file you would need.\n- Never print the value of a key, a token or a password. Print the name only.\n- Ask me before you change or delete any file.\n<\/code><\/pre>\n<p><strong>Step 3. Put the job's files in <code>My Files/<\/code>.<\/strong><\/p>\n<p><strong>Rules for files:<\/strong><\/p>\n<ul>\n<li><strong>No colons in file names.<\/strong> A Mac or Windows laptop does not allow a colon in a file name (Build Log 96).<\/li>\n<li><strong>Use one folder, not five.<\/strong> Annie's founding document was once in a Downloads folder. Her phone, her bot and her second account could not see it. Nothing was broken. The file was in the wrong place (Build Log 08).<\/li>\n<\/ul>\n<p><strong>To change how the AI assistant behaves, change the file. Never tell it in the chat.<\/strong> In the chat, it agrees and then forgets in the next conversation. The file is the only memory that lasts.<\/p>\n<h2>The Cold Test: Prove a Fresh Session Reads Your File<\/h2>\n<p><em>15 minutes.<\/em><\/p>\n<p>Go to your AI assistant folder:<\/p>\n<ol>\n<li>Type <code>cd<\/code> and a space.<\/li>\n<li>Drag <code>My AI Assistant<\/code> into Terminal.<\/li>\n<li>Press Return.<\/li>\n<\/ol>\n<p>Then type:<\/p>\n<pre><code class=\"language-bash\">pi -p --no-session &quot;Answer from your instructions only. Who am I? Give two of my rules. What must you never print?&quot;\n<\/code><\/pre>\n<p><strong>You know it works when<\/strong> pi names you, quotes two of your rules, and says it never prints the value of a key.<\/p>\n<p><strong>If the answer is general, pi did not read your file.<\/strong> Check two things:<\/p>\n<ol>\n<li>The file is named exactly <code>AGENTS.md<\/code>.<\/li>\n<li>It is in the folder where you started pi.<\/li>\n<\/ol>\n<p>Fix it and run the test again. Do not go on until this test passes.<\/p>\n<p><strong>What can go wrong without this test.<\/strong> For weeks in July 2026, Annie's bot seemed to ignore its rules. The truth was that its rules file had never loaded at all. Two small file links fixed it, and a new test passed (Build Log 32).<\/p>\n<h2>Five Habits That Keep You in Control<\/h2>\n<p><em>10 minutes.<\/em><\/p>\n<p>The builder does the typing. You do three things:<\/p>\n<ol>\n<li><strong>Describe<\/strong> what you want.<\/li>\n<li><strong>Approve<\/strong> each change before it happens.<\/li>\n<li><strong>Check<\/strong> the result.<\/li>\n<\/ol>\n<p>Annie wrote no code to build her system. In July 2026 she said: \"I'm not technical. Here's my lab notebook, and none of it needed me to write code. It needed me to learn how to check\" (Seminar Ideas, 2 Jul 2026).<\/p>\n<p><strong>When a note and the machine disagree, believe the machine.<\/strong> A note, a memory or the builder's report can be out of date. The live settings and the real output show what is true now. Fix the note.<\/p>\n<p><strong>The five habits:<\/strong><\/p>\n<ol>\n<li><strong>Look before you build.<\/strong> In her first month, Annie started to build something that already existed three times. One time, there were two versions of the same job: one turned off and one running. Because she looked first, she upgraded the running one (Build Log 04). Start every build with: \"Before changing anything, list what already exists for this on the machine.\"<\/li>\n<li><strong>Back up before every change, and know how to undo it.<\/strong>\n   - Copy the file first. Put the date and the reason in the backup's name, for example <code>config.yaml.bak_20260922_model-change<\/code>.\n   - Make the smallest change.\n   - Check that it still works.\n   - Write down how to undo it.\n   - Annie once undid a model change in about a minute, because the backup existed (Build Log 92).<\/li>\n<li><strong>Ask for proof, not \"done\".<\/strong> Ask to see the output, the file on disk, or the message on your phone. Annie's logs sort every claim into \"Proven\" and \"Not yet proven\" (Build Log 94).<\/li>\n<li><strong>Make one change at a time, then use it for a while.<\/strong> In May 2026 Annie's first bot broke down. Its cheap AI model could not use its tools reliably, and it said tasks were done when they were not. Version 2 started with three things: the soul file, the rules and one reminder. Her plan was to live with it for 24 to 48 hours before building more (Build Log 00).<\/li>\n<li><strong>Advice is not a fix. A note is not a task.<\/strong> When the builder finds a problem, it fixes it in the same step, or it gives the fix a date. In July 2026 a review of Annie's handover document sat unused for two days. Then she asked, \"we have this audit, how do we use it?\" (Build Log 26).<\/li>\n<\/ol>\n<p>Ask pi to add the five habits to <code>AGENTS.md<\/code>. Tell it to back up the file first.<\/p>\n<h2>Your One Real Job<\/h2>\n<p><em>45 minutes.<\/em><\/p>\n<p>The job comes from your Module 05 workflow. It must pass three checks:<\/p>\n<ol>\n<li>The answer is in files you can put in <code>My Files/<\/code> today.<\/li>\n<li>You can say the job in one sentence that a stranger would understand.<\/li>\n<li>You would notice if the answer was wrong.<\/li>\n<\/ol>\n<p><strong>Your job is a files job.<\/strong> The AI assistant answers from a folder of documents on this laptop. Three examples:<\/p>\n<ul>\n<li>A folder of receipts and invoices. The question: \"What arrived this month, and what is not claimed yet?\"<\/li>\n<li>Family paperwork, such as school letters, activity forms and medical documents. The question: \"What do I need to sign or pay this month?\"<\/li>\n<li>A folder of contracts and supplier agreements. The question: \"Which of these renew or expire in the next three months?\"<\/li>\n<\/ul>\n<p>Only a files job reliably finishes in the room. Email and calendar jobs need two things set up before class: a login, and a server to run them on a schedule. So they belong to the optional server sitting. Your morning message is different: Gemini does that job on Google's computers, and you build it in the skills module (Module 11).<\/p>\n<p><strong>This job stays with you for the rest of the course.<\/strong> In the script-or-AI module (Module 09) you circle it and write its Build Brief. In the skills module (Module 11) you add the rows that keep it safe, and you turn it into a skill you start with one phrase. One job, built deeper each time.<\/p>\n<p><strong>Running, fixing and running again is the work.<\/strong><\/p>\n<ol>\n<li>Run the job.<\/li>\n<li>Read the answer.<\/li>\n<li>Find the file that caused the wrong answer, and fix it.<\/li>\n<li>Run the job again.<\/li>\n<\/ol>\n<p>Annie's bot once answered a scheduling question with wrong dates and a class that did not exist. Three rounds fixed it:<\/p>\n<ul>\n<li>Round 1 added knowledge the bot was missing.<\/li>\n<li>Round 2 added a missing step-by-step procedure.<\/li>\n<li>Round 3 fixed reasoning that broke a rule the bot had already quoted.<\/li>\n<\/ul>\n<p>Each round fixed a different problem. The three rounds were the work. They were not a failure (Build Log 33).<\/p>\n<p><strong>If the answer is wrong in the same way two times, stop rewriting the rule.<\/strong> Instead, ask pi to move the check into a small script. The AI assistant then reads the script's result.<\/p>\n<p>Example: Annie's calendar check once said 9:15 to 10:15 was free. But another event ran from 9:45 to 10:30. The check compared only the start times. The fix was a small command that works out whether two times overlap (Build Log 38).<\/p>\n<h2>The Answer Test and the Refusal Test<\/h2>\n<p><em>15 minutes.<\/em><\/p>\n<p><strong>Test 1, the answer test.<\/strong> Ask your job question. The AI assistant must answer, and name the file it used.<\/p>\n<p><strong>Test 2, the refusal test.<\/strong> Ask a question your files cannot answer. The AI assistant must say it does not know, and name the file it would need.<\/p>\n<p><strong>Do not leave the room if test 2 gets a made-up answer.<\/strong> This is the one failure you must fix today. Fix the second fixed rule in <code>AGENTS.md<\/code>, the one that says to admit when the files do not answer. Then run the test again.<\/p>\n<p><strong>Then ask your three golden questions from Module 07, the test questions with known answers.<\/strong><\/p>\n<ul>\n<li>Ask each one in a new pi session.<\/li>\n<li>Ask each one two times. One right answer can be luck (How to Build Your Own Claudith guide, Part 5).<\/li>\n<\/ul>\n<p><strong>Why test 2 matters.<\/strong> In July 2026, Annie's receipt automation came back marked \"tested and working\". A separate check found six bugs. Four of them stopped it from working at all (Build Log 30):<\/p>\n<ul>\n<li>The sender check could never match.<\/li>\n<li>The email tool could not download attachments.<\/li>\n<\/ul>\n<p>A confident sentence is not proof. The two tests are proof.<\/p>\n<h2>Continuity Note and the \"Save\" Word<\/h2>\n<p><em>10 minutes.<\/em><\/p>\n<p>pi starts every session with no memory of yesterday. A continuity note fixes this. It is a short \"where we left off\" note. Every session reads it first.<\/p>\n<p><strong>Step 1.<\/strong> Ask pi:<\/p>\n<pre><code class=\"language-text\">Create CONTINUITY.md in this folder with a one-line header saying what it is. Add today's entry: what we built, what works, and my next action.\n<\/code><\/pre>\n<p><strong>Step 2.<\/strong> Add these two lines to <code>AGENTS.md<\/code>:<\/p>\n<ul>\n<li>\"At the start of every session, read CONTINUITY.md before answering anything.\"<\/li>\n<li>\"When I say 'save', add a dated entry to CONTINUITY.md, and if we built something, write the build log and its index row.\"<\/li>\n<\/ul>\n<p><strong>Keep the note short.<\/strong> Annie deletes entries older than three weeks. If a lesson will still matter in three weeks, put it in <code>AGENTS.md<\/code>, not in the continuity note.<\/p>\n<h2>The Build Log<\/h2>\n<p><em>10 minutes.<\/em><\/p>\n<p>A build log records one piece of work. You write it when the work is finished. You never change an old entry. You add a new one. This course comes from Annie's build logs. She has written more than 120 since May 2026.<\/p>\n<p><strong>Step 1.<\/strong> Ask your builder to:<\/p>\n<ol>\n<li>Create the folder <code>AI System/Build Logs/<\/code>.<\/li>\n<li>Create an index note called <code>0 — Build Log Index<\/code>. It has a table with four columns: number, date, title, and a one-line summary.<\/li>\n<\/ol>\n<p><strong>Step 2.<\/strong> Save this template as <code>AI System/Build Logs/_Template<\/code>:<\/p>\n<pre><code class=\"language-markdown\">---\ntype: build-log\nlog: [number]\ncreated: [date]\n---\n\n# Build Log [number]: [title]\n\n## Goal\n## What I Learned\n## What I Built\n## Proven and Not Yet Proven\n## Files Changed and Their Backups\n| File | Backup |\n|---|---|\n## Open and Next\n<\/code><\/pre>\n<p><strong>Step 3.<\/strong> Ask pi to write Build Log 1 for today. Ask it to add the index row in the same step. Then check two things on disk: the log exists, and the index row exists.<\/p>\n<p><strong>A log is not finished until its index row exists.<\/strong><\/p>\n<ul>\n<li>Some of Annie's logs had no index row for weeks. A log with no row looks the same as a log that was never written (Build Log 79).<\/li>\n<li>Two logs once got the same number, because someone picked the numbers by hand (Build Log 86).<\/li>\n<\/ul>\n<h2>The Run Card<\/h2>\n<p><em>10 minutes.<\/em><\/p>\n<p>One page. Handwriting is fine. Write down:<\/p>\n<ul>\n<li>What this AI assistant is for, in one sentence.<\/li>\n<li>The exact start command (<code>cd<\/code> to the folder, then <code>pi<\/code>), and the key that stops it.<\/li>\n<li>Where its files live.<\/li>\n<li>Your three rules, and how you check each one.<\/li>\n<li>Your three golden questions (Module 07).<\/li>\n<li>What it costs each month: opencode Go, $10.<\/li>\n<li>What to do when it does not answer: check the key, check you are in the right folder, then run the cold test.<\/li>\n<\/ul>\n<h2>Say What You Want, Not Every Step<\/h2>\n<p><em>5 minutes. Both conversations are from one of Annie's builder sessions on 9 October 2026, running Opus 5.5.<\/em><\/p>\n<p><strong>First conversation: the builder says how it understood you, before it acts.<\/strong><\/p>\n<blockquote>\n<p><strong>Annie:<\/strong> should we do C and then this? I wanted to finish previous open tasks first. and does this check the critical test like we wanted?<\/p>\n<p><strong>Builder:<\/strong> Yes: C now, then the automatic workflow. I'm reading \"C\" as \"keep switching models by hand\". Finishing open work first makes sense, and building the automatic workflow last means it can be tested on real work.<\/p>\n<\/blockquote>\n<p>What this shows:<\/p>\n<ul>\n<li><strong>Short instructions work when you both know what they mean.<\/strong> \"C\" was an option they had already agreed on. So it needed no explanation.<\/li>\n<li><strong>The builder said how it understood \"C\" before it acted.<\/strong> If it had misunderstood, the mistake would cost one sentence, not a day of work.<\/li>\n<li><strong>A preference is a real instruction.<\/strong> \"I wanted to finish previous open tasks first\" changed the order. The builder followed it.<\/li>\n<li><strong>Ask whether it meets the test you agreed on, not whether it is good.<\/strong> \"Does this check the critical test like we wanted?\" asks for proof against a test they set earlier.<\/li>\n<\/ul>\n<p><strong>Second conversation: when you are the one who is confused.<\/strong><\/p>\n<blockquote>\n<p><strong>Annie:<\/strong> and then go 1. im getting confused on what to run but just know let's finish everything still open from the F B D and E builds and this automated workflow<\/p>\n<p><strong>Builder:<\/strong> I'll take it from here and finish all four in order. I won't ask you to choose critics this time: for Module 1 I'll run all four. Starting with Module 1.<\/p>\n<\/blockquote>\n<p>What this shows:<\/p>\n<ul>\n<li><strong>\"I'm getting confused\" is a full instruction.<\/strong> It lets the builder make the decision and continue. If you stay quiet and guess, the build moves away from what you wanted.<\/li>\n<li><strong>The builder said which decision it was making, before it made it.<\/strong> It is safe for the builder to make a choice for you when it tells you first. It is not safe when you only find out later.<\/li>\n<\/ul>\n<p><strong>What to take away.<\/strong><\/p>\n<ol>\n<li>You do not need to give step-by-step instructions.<\/li>\n<li>Say what you want, what it must not do, and how you will judge the result.<\/li>\n<li>Ask the builder to say back what it understood.<\/li>\n<li>If it cannot say it in one sentence, your instruction is not clear yet.<\/li>\n<\/ol>\n<p><em>Do not show the two screenshots of these conversations in class yet. They must first be checked against the screenshot rules, because they were not among the 54 approved edited copies.<\/em><\/p>\n<p><strong>Day 2 ends here. Next, on Day 3: the script-or-AI module (Module 09).<\/strong> Everything is built and logged. Now you decide which steps a small program should do, and which need judgement.<\/p>\n<hr />\n<h2>From the Record<\/h2>\n<p><strong>The rules that never loaded.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> For weeks in July 2026, Annie kept teaching her bot procedures. It kept failing to follow them. Nothing showed a problem, because every part of the setup seemed to work. In fact, its rules file had never loaded into the model, in any version of the setup. Two file links fixed it.<\/li>\n<li><strong>The lesson:<\/strong> the cold test is not a formality. It is the only proof that the AI assistant read your files.<\/li>\n<li><strong>Source:<\/strong> Build Log 32.<\/li>\n<\/ul>\n<p><strong>\"Tested and working\" was not true.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> In July 2026, the receipt automation was reported as tested and working. A separate check on the machine found six bugs. Four of them stopped it from working at all.<\/li>\n<li><strong>The lesson:<\/strong> a report of success is only a claim. Test it yourself.<\/li>\n<li><strong>Source:<\/strong> Build Log 30.<\/li>\n<\/ul>\n<p><strong>The wrong account in the right place.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> In August 2026, Annie's personal start command kept signing her in to her work account. The two accounts were set up separately, as planned. But the personal one held a work sign-in, because her browser was signed in to work when she logged in. The fix: sign out in the browser, log in again, and check which account each folder holds.<\/li>\n<li><strong>The lesson:<\/strong> when a setup looks broken, look at what is inside it before you rebuild it.<\/li>\n<li><strong>Source:<\/strong> Build Log 61.<\/li>\n<\/ul>\n<p><strong>The builder that skipped the paperwork.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> In July 2026, a builder rebuilt Annie's morning message with nobody watching. The new message met every requirement. But the builder skipped three things: the build log, the to-do list update, and one setting. It had backed up that setting but never changed it. The fix: every instruction now ends with the builder reading its checks as a checklist, and marking each one done or not done.<\/li>\n<li><strong>The lesson:<\/strong> a check that depends on goodwill gets skipped. Make it part of the process.<\/li>\n<li><strong>Source:<\/strong> Build Log 27.<\/li>\n<\/ul>\n<h2>Worksheet<\/h2>\n<h3>Checklist<\/h3>\n<table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>pi installed; <code>pi --version<\/code> prints a number<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>opencode Go key entered without showing<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>My AI Assistant/<\/code> holds <code>AGENTS.md<\/code>, <code>My Files/<\/code> and nothing scattered elsewhere<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Cold test passed<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Answer test passed: it answered and named the file<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Refusal test passed: it said it did not know and named the file it would need<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Golden questions passed two times, in new sessions<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>CONTINUITY.md<\/code> exists; my \"save\" line is in <code>AGENTS.md<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Build Log 1 and its index row exist<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Run card written<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Teaching Notes<\/h2>\n<ul>\n<li><strong>Cut the job down when time runs short.<\/strong> At the two-hour mark, if the job is not working, make the job smaller until test 1 passes. An AI assistant that answers one question is a success. A half-built one that answers nothing is not.<\/li>\n<li><strong>Never type on a student's keyboard.<\/strong> Sit beside them. Let them use their own device. If a student gets lost, you went too fast (Annie's seminar run sheet).<\/li>\n<li><strong>Entering the key is the riskiest moment for secrets.<\/strong> Watch each student paste the key into the hidden prompt. Make sure nobody pastes it into a chat or a note.<\/li>\n<li><strong>Fix the file, not the chat.<\/strong> Say this out loud two times: once while students write the instruction file, and once during the job.<\/li>\n<li><strong>One job only.<\/strong> If a student starts a second build, they misunderstood the module. Tell them.<\/li>\n<li><strong>Wifi.<\/strong> Every question to the AI goes over the internet. Have a phone hotspot ready.<\/li>\n<li><strong>Never show a student's private files on the projector<\/strong>.<\/li>\n<li><strong>Windows students:<\/strong> the course was built on a Mac. The key-entry line in \"Install pi and Connect opencode Go\" works only in a Mac's Terminal. It does not work in PowerShell. Facilitator: prepare the Windows version and test it before the course.<\/li>\n<li><strong>Developers may prefer git to dated backups.<\/strong> That is fine, if every change can be undone and the log records it.<\/li>\n<\/ul>"}, {"id": "short-11", "title": "09: Script, Machine Learning or AI Judgement", "handout": false, "html": "<h1>Module 09: Script, Machine Learning or AI Judgement<\/h1>\n<p><strong>How to read this file.<\/strong> This is the Short course copy: 10 hours over three days, built with pi on your laptop and Gemini on your phone. Every segment in it is taught. The master copy for both courses is in <code>modules/<\/code>.<\/p>\n<ul>\n<li>This module is all paper. You need no laptop until you save your notes at the end.<\/li>\n<\/ul>\n<p><strong>Why this module comes after the build.<\/strong><\/p>\n<ol>\n<li>Students have now used an AI assistant. They have seen it answer, and some have seen it get things wrong.<\/li>\n<li>The second half of this module explains what to do when a model keeps getting a step wrong. That only makes sense after a student has seen a failure.<\/li>\n<li>The first automation is built in Module 11. So students still decide who or what does each step before anything is automated.<\/li>\n<\/ol>\n<h2>Run Sheet<\/h2>\n<p>28 minutes.<\/p>\n<table>\n<thead>\n<tr>\n<th>Min<\/th>\n<th>Segment<\/th>\n<th>Facilitator does<\/th>\n<th>Students do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>3<\/td>\n<td>Take out your workflows from Module 05<\/td>\n<td>Says what has changed since Day 1: the students now own a working system<\/td>\n<td>Lay out both maps. Read each one from trigger to done-signal. Say the job in one sentence<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>One question for every step<\/td>\n<td>Asks: does this step have a right answer?<\/td>\n<td>Look at their workflows<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Four ways a step can be done<\/td>\n<td>Explains the four: a script, a single-task model, a judgement model, a person<\/td>\n<td>Sort nine example steps into the four<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Mark your workflows<\/td>\n<td>Walks the room. Asks of every step marked for a judgement model: could a script do this?<\/td>\n<td>Put a coloured dot on every step, for who or what does it<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>How the minutes add up.<\/strong><\/p>\n<ul>\n<li><strong>28 minutes.<\/strong> Taking out the workflows from Module 05 takes 3 minutes. The question \"does this step have a right answer?\" takes 5. The four ways a step can be done, with the nine example steps, take 10. Putting a coloured dot on every step of the maps takes 10.<\/li>\n<li><strong>Homework, no class time:<\/strong> a five-row Build Brief for the circled candidate. The circled candidate is the files job you built in Module 08, unless the dots show a better one. The facilitator shows the worksheet in the last minute of class.<\/li>\n<\/ul>\n<h2>What You Will Leave With<\/h2>\n<ul>\n<li>Your workflows from Module 05, with a coloured dot on every step.<\/li>\n<li>Each dot says who or what does that step: a script, a single-task model, a judgement model or a person.<\/li>\n<li>Your best candidate for a first automation, circled on the map.<\/li>\n<\/ul>\n<p><strong>As homework:<\/strong><\/p>\n<ul>\n<li><strong>A five-row Build Brief<\/strong> for your circled candidate. It says:<\/li>\n<li>the goal<\/li>\n<li>what starts it<\/li>\n<li>the steps, with who or what does each one<\/li>\n<li>who checks each step<\/li>\n<li>how you know it worked<\/li>\n<li>In Module 11 pi builds it from this brief, on your laptop.<\/li>\n<li>Bring it to Module 11. Without it, pi has nothing written down to build from.<\/li>\n<\/ul>\n<h2>Before This Module<\/h2>\n<ul>\n<li><strong>Your workflows from Module 05.<\/strong> This may be one workflow, if workflow two is still homework.<\/li>\n<li><strong>Your What AI Is Allowed to See sheet from Module 02.<\/strong> Some steps will be ruled out by it.<\/li>\n<li><strong>Dot stickers in four colours,<\/strong> or four coloured pens. The facilitator supplies these.<\/li>\n<\/ul>\n<h2>Take Out Your Workflows From Module 05<\/h2>\n<p><em>3 minutes.<\/em><\/p>\n<p>On Day 1 you wrote your workflows on sticky notes. Since then you have built your system. Now the notes come back.<\/p>\n<ol>\n<li>Lay out both maps on the table. One map may still be homework.<\/li>\n<li>Read each one from the trigger to the done-signal. Do not fix anything yet.<\/li>\n<li>Say the job in one sentence: \"When [trigger], I [steps], and it is done when [done-signal].\"<\/li>\n<\/ol>\n<p>You know it works when you can say the sentence without reading the notes. If you cannot, the map is missing a step. Add it now, before you mark anything.<\/p>\n<p><strong>Why the wait was on purpose.<\/strong> On Day 1 you did not know what a script could do, or what a model gets wrong. Now you have seen both. So now you can mark each step honestly.<\/p>\n<h2>One Question for Every Step<\/h2>\n<p>Look at each step on your map. Ask one question: <strong>does this step have a right answer?<\/strong><\/p>\n<p><strong>If it has a right answer, a script should do it.<\/strong> Examples of a right answer:<\/p>\n<ul>\n<li>a time<\/li>\n<li>a total<\/li>\n<li>a date<\/li>\n<li>a file name<\/li>\n<li>whether two appointments overlap<\/li>\n<\/ul>\n<p>A script gives the same answer every time. It costs nothing to run.<\/p>\n<p><strong>If the step depends on context, it needs an AI model.<\/strong> Examples:<\/p>\n<ul>\n<li>\"is this email urgent?\"<\/li>\n<li>\"which of these ideas matters most?\"<\/li>\n<\/ul>\n<p><strong>Annie's system shows how far this goes.<\/strong> On 2 October 2026 her server ran 26 scheduled jobs (live server check, 2 Oct 2026).<\/p>\n<ul>\n<li>23 of them were plain scripts. They never call an AI model.<\/li>\n<li>They include the vault sync, backups, the morning brief, the weather plan, reminders, the watchdog and the monthly cost report.<\/li>\n<li>Only 3 jobs hand work to the bot's model. Those need real judgement about what is new and relevant.<\/li>\n<\/ul>\n<p><strong>The money follows the same rule.<\/strong> Annie moved routine work from the AI model to scripts. Her token spending fell from $29.05 in July 2026 to $2.79 in August (Build Log 36).<\/p>\n<h2>Four Ways a Step Can Be Done<\/h2>\n<p>Every step on your map is done by one of four things: a script, a single-task model, a judgement model or a person.<\/p>\n<p><strong>Script.<\/strong><\/p>\n<ul>\n<li>What it is: code that follows fixed steps.<\/li>\n<li>Good for: anything with a right answer. Times, counts, renames, overlaps and file moves.<\/li>\n<li>Annie's examples: the weather planner, the receipt scan and rename, the watchdog's checks, the overlap checker.<\/li>\n<li>Cost per run: $0.<\/li>\n<\/ul>\n<p><strong>Single-task model<\/strong> (machine learning).<\/p>\n<ul>\n<li>What it is: a small AI model trained to do one job only.<\/li>\n<li>Good for: turning messy input into data. Speech to text, reading a photo, sorting into a category.<\/li>\n<li>Annie's examples: voice notes transcribed on the server (Build Log 62), and an 80-minute talk transcribed on the Mac with no internet (Build Log 81).<\/li>\n<li>Cost per run: very small, or $0 if it runs on your own machine.<\/li>\n<\/ul>\n<p><strong>Judgement model<\/strong> (a large language model).<\/p>\n<ul>\n<li>What it is: a general AI model that reads and writes.<\/li>\n<li>Good for: decisions that depend on context, and writing in a voice.<\/li>\n<li>Annie's examples: grading a learning answer; finding the week's most useful idea; drafting a reply; the nightly filing job, which decides which folder each note belongs in (Build Logs 62 and 94).<\/li>\n<li>Cost per run: cents, and more for top models.<\/li>\n<\/ul>\n<p><strong>Person.<\/strong><\/p>\n<ul>\n<li>What it is: you, or someone you trust.<\/li>\n<li>Good for: approvals, anything that reaches another person, and sensitive submissions.<\/li>\n<li>Annie's examples: sending any email; submitting an insurance claim.<\/li>\n<li>Cost per run: your time.<\/li>\n<\/ul>\n<p><strong>The single-task model is the one people forget.<\/strong> It sits between a script and a full AI model.<\/p>\n<ul>\n<li>Annie's laptop turned an 80-minute recorded talk into 14,427 words of text.<\/li>\n<li>It used a free speech-to-text program called whisper.cpp.<\/li>\n<li>Nothing left the machine. So it needed no VPN and no account (Build Log 81).<\/li>\n<li>Her server transcribes voice notes sent to the bot in the same way (Build Log 62).<\/li>\n<\/ul>\n<p><strong>Keep a person on any step where a silent failure would touch sensitive data.<\/strong> Annie wanted her bot to file insurance claims from start to finish. The decision in May 2026 was this (Hermes Master Doc, 30 May 2026):<\/p>\n<ul>\n<li>The bot finds the receipt, downloads it and tells her.<\/li>\n<li>She submits the claim herself.<\/li>\n<li>The reason: insurers' websites block automated browsers, and a failure there could go unnoticed.<\/li>\n<\/ul>\n<p><strong>A scheduled job should not wake the AI just to ask you something.<\/strong> Annie's rule from day one: scheduled jobs are scripts, or scripts that hand a small task to a cheap model. Her first bot ended partly because AI prompts ran on timers and billed a paid account every day (How to Build Your Own Claudith guide, Part 1). If you want judgement, make it something you ask for when you need it.<\/p>\n<p><strong>Annie wrote this down as three cost levels for her bot's jobs in June 2026 (Build Log 15):<\/strong><\/p>\n<ol>\n<li><strong>Level 1: a plain script, with no AI.<\/strong> This is the cheapest, and it is the default.<\/li>\n<li><strong>Level 2: a script plus a small, cheap model.<\/strong> This is for light formatting and reading.<\/li>\n<li><strong>Level 3: the good, expensive model.<\/strong> This is for live conversation with Annie only.<\/li>\n<\/ol>\n<p>Scheduled jobs use Level 1 or Level 2. They never run the expensive model on a timer. The same log adds a second rule. Heavy building belongs on the powerful, expensive builder, because that is where the real work happens. The bot's job is to be reachable on the phone, so a cheap model is the right choice for it.<\/p>\n<h3>Free and Cheap AI Models<\/h3>\n<p><em>Read at home.<\/em><\/p>\n<p>The laptop you already own, one cheap model plan and Gemini on your phone run everything in this course. A free or cheap AI model costs less, but it is not as smart. So give each model the job it does well.<\/p>\n<p>Think about your household. You are the expensive model. You design the whole system for your home and your child: the routines, the rules, and what to do when something goes wrong. Helpers are not paid as highly as we are. They are not paid to design the household system. They are paid to carry out the routine you have set.<\/p>\n<p>AI works the same way. The smarter, more costly model builds the scripts and the rules. The cheap model runs them. When a cheap model was left to make its own judgement calls, it reported work it had not done (Logs 00, 52 and 56). By late September 2026, all three of Annie's bots ran well on a cheap model, because the scripts and checks were already built. The module on what breaks (Module 10) shows you how to build those checks.<\/p>\n<p><strong>Where judgement is needed, let a script do the work around it.<\/strong> Annie's weekly idea job (Phoebe) needs real judgement. It runs in three steps (live server check, 2 Oct 2026):<\/p>\n<ol>\n<li>A script gathers the build logs and notes first, with no AI.<\/li>\n<li>Only then does it call Claude to think.<\/li>\n<li>Afterwards, the script checks that the weekly note actually exists before it reports success.<\/li>\n<\/ol>\n<h3>Practice: Sort Nine Example Steps<\/h3>\n<p>The facilitator hands out nine example steps, one per card. Decide whether each one is done by a script, a single-task model, a judgement model or a person. Then compare with a partner.<\/p>\n<ol>\n<li>Check whether a 3 pm call clashes with anything on your calendar.<\/li>\n<li>Rename a downloaded PDF to 15 characters or fewer.<\/li>\n<li>Turn a voice note into text.<\/li>\n<li>Decide which of this week's ten ideas is most worth your time.<\/li>\n<li>Send a reply to a client.<\/li>\n<li>Count how many items are in your storage inventory.<\/li>\n<li>Read a photo of a warranty card and pull out the serial number.<\/li>\n<li>Decide whether an email from your child's school needs action today.<\/li>\n<li>Draft the agenda for tomorrow's client meeting from the last three emails with that client.<\/li>\n<\/ol>\n<p><strong>Suggested answers.<\/strong><\/p>\n<ul>\n<li>Script: the 3 pm clash check, the PDF rename, and the inventory count.<\/li>\n<li>Single-task model: the voice note, and the warranty card photo.<\/li>\n<li>Judgement model: picking the week's best idea, the school email, and the meeting agenda.<\/li>\n<li>Person: the reply to the client.<\/li>\n<\/ul>\n<p>The school email can move towards a script if the school uses the same subject lines every time. The meeting agenda is a draft. A person reads it before the meeting, and a person sends anything to the client.<\/p>\n<h2>Mark Your Workflows<\/h2>\n<p>Put one coloured dot on every step of your maps. The colour says who or what does that step.<\/p>\n<table>\n<thead>\n<tr>\n<th>Dot<\/th>\n<th>Who or what does the step<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Green<\/td>\n<td>Script<\/td>\n<\/tr>\n<tr>\n<td>Blue<\/td>\n<td>Single-task model<\/td>\n<\/tr>\n<tr>\n<td>Red<\/td>\n<td>Judgement model<\/td>\n<\/tr>\n<tr>\n<td>Black<\/td>\n<td>Person<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Question every red dot.<\/strong> A red dot means you marked the step for a judgement model. For each one, ask: could a script do this if it were given the right facts? Two of Annie's examples:<\/p>\n<ul>\n<li>Her overlap check started as a judgement step. It became a script (Build Log 38).<\/li>\n<li>Her storage photos started with an AI description. They ended with none, because she preferred her own words (Build Log 52).<\/li>\n<\/ul>\n<p><strong>Mark what the model needs to be told.<\/strong> Beside every red dot, write the facts a script should hand the model first.<\/p>\n<ul>\n<li>In July 2026 Annie's bot invented an answer about which class slot suited her son.<\/li>\n<li>It had no nap times and no rules to check against.<\/li>\n<li>The fix supplied the facts and a numbered checking procedure.<\/li>\n<li>Then the bot was tested against an answer worked out separately (Build Log 33).<\/li>\n<\/ul>\n<p><strong>Then circle your best candidate for a first automation.<\/strong> Your first candidate is the files job you built in Module 08. Circle it, unless the dots show a better one. A good first candidate:<\/p>\n<ul>\n<li>has a clear trigger<\/li>\n<li>is mostly green dots, which means mostly script steps<\/li>\n<li>happens at least weekly<\/li>\n<li>causes small harm if it goes wrong<\/li>\n<li>uses only Tier 1 (open) or Tier 2 (personal) information from your What AI Is Allowed to See sheet<\/li>\n<\/ul>\n<p><strong>You know it works when<\/strong> your circled candidate is mostly green dots, and every red dot has the facts the model needs written beside it.<\/p>\n<h2>Why AI Flatters, Guesses and Cannot Count<\/h2>\n<p><em>Read at home.<\/em><\/p>\n<p>Annie worked this out in a learning session on 17 September 2026 (Build Log 81).<\/p>\n<ul>\n<li>AI models are tuned by people choosing which answers they prefer.<\/li>\n<li>So the model learns to be liked, not to be right.<\/li>\n<li>Her line: \"they are not training the model that what they like is what is right\".<\/li>\n<\/ul>\n<p>Three habits follow from that one fact.<\/p>\n<ol>\n<li><strong>It agrees with you too easily,<\/strong> because agreement is liked.<\/li>\n<li><strong>It sounds sure when it is guessing,<\/strong> because sure answers are preferred, and the people rating them cannot check every fact.<\/li>\n<li><strong>It hands you the answer at once,<\/strong> because instant help feels good. This happens even when you needed to work it out yourself.<\/li>\n<\/ol>\n<p><strong>Never ask a model to count.<\/strong><\/p>\n<ul>\n<li>In September 2026 two of Annie's bots gave different totals for the same storage inventory.<\/li>\n<li>One said 184 items. The other said 158.<\/li>\n<li>The true number was 184.<\/li>\n<li>Neither bot should have been counting. The exact total already existed in a note that code rebuilds on every change.<\/li>\n<li>The fix pointed both bots at that number (Build Log 80; the figure 158 is from Seminar Ideas).<\/li>\n<\/ul>\n<p>The lesson is not \"pick the model that counts better\". Anything that must be exact comes from code. That includes counts, lists, totals and dates. The model only puts the result into words.<\/p>\n<h2>When the Model Keeps Getting It Wrong<\/h2>\n<p><em>Read at home.<\/em><\/p>\n<p><strong>Rewriting the instruction rarely fixes a mechanical mistake for good.<\/strong> Annie's builds use five ways to fix it instead, from weakest to strongest. Each one replaces a request with something that cannot go another way (Build Logs 38, 42, 43, 50 and 52).<\/p>\n<ol>\n<li><strong>A written instruction, with the exact failing case as an example.<\/strong> A worked example works better than a general rule.<\/li>\n<li><strong>Code does the calculation, and the model reads the result.<\/strong> The calendar overlap check moved into a command.<\/li>\n<li><strong>Code accepts whatever the model does.<\/strong> The model's edits once broke a script. The script now accepts both file shapes.<\/li>\n<li><strong>A guard blocks the wrong action.<\/strong> One bot cannot edit protected files at all.<\/li>\n<li><strong>The model is taken out of the step.<\/strong> Photos sent to the storage bot are filed by code before the model ever wakes up.<\/li>\n<\/ol>\n<p>Annie's summary from Build Log 50: an instruction is a request the model can decline, and a guard cannot be declined.<\/p>\n<p><strong>Taking the AI out moves the bugs into plain code.<\/strong> In September 2026 the storage bot showed \"typing\" all day and never replied (Build Log 100).<\/p>\n<ul>\n<li>Annie swapped the AI model. Nothing changed, because that step used no model at all.<\/li>\n<li>The real cause was one wrong word in a script.<\/li>\n<li>The script crashed on its first line. Its error messages were switched off, so it stopped without telling anyone.<\/li>\n<li>The fix was one line.<\/li>\n<\/ul>\n<p>The lesson: read the logs before you blame the model. Never switch off a script's errors.<\/p>\n<h2>From the Record<\/h2>\n<p><strong>The cheap model that pretended.<\/strong> In May 2026 Annie's first bot ran on a cheaper open model (Build Logs 00 and 25; Annie's notes, 29 Sep 2026).<\/p>\n<ul>\n<li>It chatted well.<\/li>\n<li>It also said tasks were done when they were not.<\/li>\n<li>It wrote broken tools of its own instead of using the ones it had.<\/li>\n<li>It only added things to the calendar when given an exact command.<\/li>\n<li>Moving to Claude fixed it. The hidden cost was about a week of research, plus 13 logged hours of clean-up.<\/li>\n<li>By late September 2026 all three of Annie's bots ran well on a cheap DeepSeek model. By then the tools and guards around it were built.<\/li>\n<\/ul>\n<p>The lesson: test a model on the actions you need. Check what it touched, not what it says.<\/p>\n<p><strong>The overlap the bot could not see.<\/strong> In July 2026 Annie's bot kept saying a 9:15 to 10:15 class was free on a Friday (Build Log 38).<\/p>\n<ul>\n<li>Her son had an appointment from 9:45 to 10:30.<\/li>\n<li>The bot compared start times only, so it saw no problem.<\/li>\n<li>The fix was one rule that a script now applies to every slot. Two times clash if the first starts before the second ends, and ends after the second starts.<\/li>\n<\/ul>\n<p>The lesson: \"it checked\" and \"it checked correctly\" are different claims.<\/p>\n<p><strong>The grader that said \"exactly it\".<\/strong> In August 2026 Annie's learning bot graded her answer to a question about who approves AI at a bank (Build Log 56).<\/p>\n<ul>\n<li>She named the chief executive, the finance chief and the board.<\/li>\n<li>The answer key named risk, security, legal and the data owner.<\/li>\n<li>The bot replied \"That's exactly it\".<\/li>\n<li>Its log showed one model call and zero tool calls. So it had also saved nothing.<\/li>\n<li>Fixing the saving first would have recorded false passes. So the grading moved to Claude Code first.<\/li>\n<\/ul>\n<p>The lesson: a cheap model can be fine at sending and filing, and still too soft to judge. Fix the judgement before you fix the step that records it.<\/p>\n<h2>Worksheet: Build Brief (Homework)<\/h2>\n<p>Five rows. Do it at home after this module. Save it as <code>Build Brief 1 — &lt;name&gt;<\/code> in your vault's <code>AI System<\/code> folder.<\/p>\n<table>\n<thead>\n<tr>\n<th>Section<\/th>\n<th>My answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Goal<\/strong> (one plain paragraph: which chore disappears)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Trigger<\/strong> (what arrives, or what time)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Steps, each with who or what does it<\/strong> (script, single-task model, judgement model or person)<\/td>\n<td>1. ___ (script) 2. ___ (script) 3. ___ (judgement) ...<\/td>\n<\/tr>\n<tr>\n<td><strong>Who checks each step<\/strong> (a name, a script or a second check, never \"the step itself\")<\/td>\n<td>1. ___ 2. ___ 3. ___<\/td>\n<\/tr>\n<tr>\n<td><strong>Done-signal<\/strong> (how I know it worked, without checking by hand)<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Why these five rows.<\/strong> They are enough for pi to build from. The rows that keep it safe (what it must never do, approvals, acceptance checks, how to undo it, a keep-or-kill date) come in Module 11, before anything is built.<\/p>\n<p><strong>Next: what breaks (Module 10).<\/strong> Every step has an owner. Now you learn how a job lies, and how a check catches it.<\/p>\n<h2>Teaching Notes<\/h2>\n<ul>\n<li><strong>Most students over-use AI on their first pass.<\/strong> Expect too many red dots (steps marked for a judgement model). The facilitator's main job here is to ask: \"could a script do this if it had the facts?\"<\/li>\n<li><strong>\"Machine learning\" confuses people.<\/strong> Explain it as a model trained for one narrow job, such as reading speech or photos. It does not reason. It turns messy input into data.<\/li>\n<li><strong>Developers in the room will move fast.<\/strong> Ask them to help a neighbour mark red dots (judgement model steps), not to start coding.<\/li>\n<li><strong>Do not promise that any model will behave.<\/strong> The point of sorting the steps is that the important ones do not depend on how a model behaves.<\/li>\n<li><strong>Three students at most.<\/strong> Check each student's red dots (judgement model steps) beside them while they mark their maps.<\/li>\n<\/ul>"}, {"id": "short-12", "title": "10: What Breaks, and Keeping It Honest", "handout": false, "html": "<h1>Module 10: What Breaks, and Keeping It Honest<\/h1>\n<p><strong>How to read this file.<\/strong> This is the Short course copy: 10 hours over three days, built with pi on your laptop and Gemini on your phone. Every segment in it is taught. The master copy for both courses is in <code>modules/<\/code>.<\/p>\n<ul>\n<li>Five stories are told in class. Every other story from Annie's build logs is in the handout, <code>10 — Handout, What Broke in Annie's System (Short)<\/code>, one line each.<\/li>\n<\/ul>\n<p><strong>Why this module comes here.<\/strong><\/p>\n<ol>\n<li>Students now own a system that can break: an AI assistant on a laptop (Module 08).<\/li>\n<li>The first automation is built in Module 11. So students learn how to check a job before they build one.<\/li>\n<\/ol>\n<h2>Run Sheet<\/h2>\n<p>35 minutes.<\/p>\n<table>\n<thead>\n<tr>\n<th>Min<\/th>\n<th>Segment<\/th>\n<th>Facilitator does<\/th>\n<th>Students do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>10<\/td>\n<td>The three ways a system fails<\/td>\n<td>Tells one story for each way<\/td>\n<td>Name a failure they have already met<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Choose your checks<\/td>\n<td>Shows the four checks<\/td>\n<td>Pick the golden questions that will be the check<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>Break it on purpose<\/td>\n<td>Plants a fault on the facilitator's own build first<\/td>\n<td>Plant one fault, watch a check go red, then fix it<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Set a spending cap<\/td>\n<td>Tells the September 2026 cost story<\/td>\n<td>List every paid account. Set a cap on each one that charges per use<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>How the minutes add up.<\/strong><\/p>\n<ul>\n<li><strong>35 minutes.<\/strong> The three ways a system fails take 10 minutes. Choosing the checks takes 5, because the check is the golden questions and there is no watchdog to write. Breaking it on purpose takes 15. The spending cap takes 5.<\/li>\n<li><strong>Homework, no class time:<\/strong> make a backup of the AI assistant's folder and restore one file from it. The worksheet has the steps.<\/li>\n<\/ul>\n<h2>What You Will Leave With<\/h2>\n<ul>\n<li>One failure you have caused on purpose, and seen a check catch.<\/li>\n<li>A written note of what your check cannot see.<\/li>\n<li>A list of every paid account, with a cap on each one that charges per use.<\/li>\n<\/ul>\n<p><strong>As homework:<\/strong><\/p>\n<ul>\n<li>A copy of your AI assistant's folder in a second place, and one file restored from it.<\/li>\n<\/ul>\n<h2>Before This Module<\/h2>\n<ul>\n<li>Your AI assistant from Module 08, working on your laptop.<\/li>\n<li>Your run card and your three golden questions from Module 07. Golden questions are test questions with known answers.<\/li>\n<li>A list of every account you pay for. Bring the login for each one.<\/li>\n<\/ul>\n<h2>The Three Ways a System Fails<\/h2>\n<p><em>10 minutes.<\/em><\/p>\n<p>Every failure is one of three kinds. They are not equally dangerous.<\/p>\n<p><strong>1. It stops.<\/strong> The bot does not answer, or the job does not run. You usually notice within a day, because something you expected does not arrive.<\/p>\n<ul>\n<li><strong>The story (Build Log 53).<\/strong> Annie's nightly backup also sent a copy to Google Drive.<\/li>\n<li>The upload used a Google sign-in that expired every 7 days. The app behind it was still in Google's \"Testing\" mode.<\/li>\n<li>The upload failed four mornings in a row, 20 to 23 August 2026. A failure message arrived each morning.<\/li>\n<li>Annie noticed the same message several mornings running and asked if it was a pattern.<\/li>\n<li>The fix moved the upload onto a published app whose sign-in does not expire. Nobody has to sign in again each week.<\/li>\n<\/ul>\n<p><strong>2. It runs, but does the wrong thing.<\/strong> The job finishes and nothing complains. The result is wrong.<\/p>\n<ul>\n<li><strong>The story (Build Log 82).<\/strong> In September 2026, Claude told Annie that her storage bot saved its own copy of each photo on the server. That was true.<\/li>\n<li>But the copy sat inside the synced vault. Annie read the answer as \"safe to delete the vault folder\", and deleted it.<\/li>\n<li>One sync run removed 411 files everywhere: 262 storage photos, 147 photos for a series of picture books, and 2 other files.<\/li>\n<li>Annie had made the books for her son. She created a series of three books to help him through a big change.<\/li>\n<li>The books drew on the family's written plan for raising her son, with its guiding principles and examples. They also drew on deep research into attachment theory and how very young children cope with big changes.<\/li>\n<li>Her nightly backup had never included the vault.<\/li>\n<li>She got the storage photos back from Obsidian's own version history, which comes with the paid sync plan. She chose not to recover the 147 book photos as the finished books were already saved, so she let the photos go.<\/li>\n<li>The lesson: \"a separate copy\" means nothing until you know which copies it is separate from.<\/li>\n<\/ul>\n<p><strong>3. It says it worked when it did not.<\/strong> This is the most dangerous kind. The first two make you look for the problem. This one tells you there is nothing to look for.<\/p>\n<ul>\n<li>You have already met two of these stories. In Module 04, the nightly inbox sorter reported \"ok\" for weeks while it filed every note into the wrong folder (Build Log 74). In Module 09, the learning bot said \"That's exactly it\" to a wrong answer, after doing no work at all (Build Log 56).<\/li>\n<li><strong>The new story (Build Log 59).<\/strong> In August 2026, one of Annie's bots cleaned up a set of notes. It reported that the job was done and \"nothing dangles\", meaning no links were left broken.<\/li>\n<li>The renames were real. The claim about the links was false.<\/li>\n<li>Annie had deleted a page earlier, and seven notes still linked to it. The bot had never checked.<\/li>\n<\/ul>\n<p>Annie's rule after Build Log 74: \"a false 'ok' is just as bad or worse than something breaking down.\"<\/p>\n<p><strong>What to aim for.<\/strong> You cannot stop every failure. Aim for this instead: every failure should either announce itself, or be caught by a check.<\/p>\n<p><strong>There are two times a failure can happen,<\/strong> so you need two kinds of check (Build Log 73).<\/p>\n<ul>\n<li><strong>While the job is running.<\/strong> The job must say so in the same message if it fails. This is the rule in your rules file from Module 07 that says never hide a failure.<\/li>\n<li><strong>When nobody is watching.<\/strong> A job that never ran, or a backup that stopped, sends no message at all. Only a check that runs on a timer can find it. With a server, that is a watchdog. On a laptop, it is you, asking your golden questions after every change.<\/li>\n<\/ul>\n<p><strong>Exercise (2 minutes).<\/strong> Name one failure you have already met in this course. Which of the three kinds was it?<\/p>\n<h2>Make a Backup and Restore One File<\/h2>\n<p><em>Homework. Read it now. Do it at home.<\/em><\/p>\n<p><strong>A backup is everything your system needs to run again after the machine is gone.<\/strong> That list is longer than people expect.<\/p>\n<p><strong>Include the logins, not only the files (Build Log 44).<\/strong><\/p>\n<ul>\n<li>In August 2026 Annie's builder checked what her nightly backup contained.<\/li>\n<li>The backup held the bot's whole folder. It did not hold the sync service's login, which lived in a different folder.<\/li>\n<li>A server rebuilt from it would have come back signed out.<\/li>\n<li>The login folders were added to the backup.<\/li>\n<\/ul>\n<p><strong>Leave out what can be downloaded again (Build Log 97).<\/strong> By September 2026 Annie's backup had grown to about 2 GB, mostly program files that can be downloaded again. Leaving them out cut it to 184 MB.<\/p>\n<p><strong>The backup copy is as private as the server.<\/strong> Once login files are inside it, anyone who can open the backup can sign in as your bot. Keep it somewhere only you can reach.<\/p>\n<p><strong>Know what each copy holds (Build Log 101).<\/strong> The copy of Annie's vault on her server held only notes. Photos, PDFs and scripts never reached it. In September 2026 she found 59 files, including 13 baby-book photos, that existed only on her Mac. Every backup she believed she had held only her notes.<\/p>\n<p><strong>Annie's backups have three layers (Build Log 21).<\/strong><\/p>\n<ol>\n<li><strong>A whole-server copy<\/strong> kept by the server company.<\/li>\n<li><strong>A nightly copy<\/strong> of everything a rebuild needs, made by a plain script at 3 am. It keeps the newest 7.<\/li>\n<li><strong>One copy kept somewhere else,<\/strong> so it survives if the server company loses the server.<\/li>\n<\/ol>\n<p><strong>The backup sends one short receipt every night.<\/strong> Annie's backup messages her when it finishes: one line of ticks, one tick for each step that passed, with the date and the size. It is short, and it arrives at the same time every night. So a missing receipt is a signal too.<\/p>\n<p><strong>Keep the receipt to one line.<\/strong> A long daily message trains you to stop reading. Then the one that says it failed looks like all the others. One line of ticks you can read in a second.<\/p>\n<p><strong>The receipt is not the only check.<\/strong> A backup that stops running sends nothing, and a tired reader can miss a missing message. That is why Annie's watchdog checks the backup's age every hour.<\/p>\n<h3>Your Homework<\/h3>\n<ol>\n<li>Copy your whole <code>My AI Assistant<\/code> folder to a second place: a USB drive, or a cloud folder you already use.<\/li>\n<li>Put the date in the copy's name, for example <code>My AI Assistant backup 2026-11-02<\/code>.<\/li>\n<li>Restore one file. Delete a test file from the real folder, then copy it back from the backup. Open it.<\/li>\n<li>Write on your run card where the backup is and when you made it.<\/li>\n<\/ol>\n<h2>Choose Your Checks<\/h2>\n<p><em>5 minutes.<\/em><\/p>\n<p><strong>Four checks cover most of what can go wrong.<\/strong><\/p>\n<ol>\n<li><strong>Is it running?<\/strong> Did the job run, and does its result exist? This is the cheapest check. It catches only the first kind of failure.<\/li>\n<li><strong>Is the answer still right?<\/strong> Ask your three golden questions again after every change. If an answer changes and you did not change the files, something broke.<\/li>\n<li><strong>Is the important thing still there?<\/strong> The folder exists, the file is present, the backup is recent.<\/li>\n<li><strong>Did it really do the job?<\/strong> Look at the result itself, not at the job's report. Open the file, list the folder, read the message.<\/li>\n<\/ol>\n<p><strong>Check the result, not the report.<\/strong> A job's own message saying \"done\" is not proof. The result is the proof.<\/p>\n<p><strong>The job that does the work must not be the only thing that checks it.<\/strong> Annie's watchdog fixes one kind of broken link by itself. After each fix it runs its own check again, and it reports \"fixed\" only if that check passes (Build Log 88).<\/p>\n<p><strong>The checker can fail too.<\/strong><\/p>\n<ul>\n<li><strong>The story (Build Log 97).<\/strong> Annie had a script that wrote her monthly cost report.<\/li>\n<li>It was being run by the wrong copy of Python, which lacked a part it needed. So it read nothing.<\/li>\n<li>It printed three warnings, then printed \"ok\".<\/li>\n<li>An audit on 29 September 2026 also found it had never been scheduled, although an earlier log said it had (Build Logs 87 and 97).<\/li>\n<li>The audit's summary: every fault it found was in the part that reports on the system, not the part that does the work.<\/li>\n<\/ul>\n<p><strong>So write down what your check cannot see.<\/strong> A check with a known gap is useful. A check you believe sees everything is how you get surprised.<\/p>\n<h3>Your Golden Questions Are the Check<\/h3>\n<p>Your AI assistant runs only when you open it. So the check is you, asking your three golden questions. Write on your run card: \"after every change, ask the three golden questions.\"<\/p>\n<h2>Break It on Purpose<\/h2>\n<p><em>15 minutes.<\/em><\/p>\n<p><strong>A check that has never gone red has not been tested.<\/strong> In September 2026 Annie's watchdog gained a check that her skill scripts had not been changed by accident. Her builder changed one script on purpose. The check went red, and the script was put back. On its first real run, the same check found a real script that had gone out of date (Build Log 106).<\/p>\n<p><strong>Plant the fault on a copy, never on the live system you depend on<\/strong> (Build Log 65).<\/p>\n<h3>Plant the Fault<\/h3>\n<ol>\n<li>Copy your <code>My AI Assistant<\/code> folder to a test folder. Work in the copy.<\/li>\n<li>Plant one fault. Choose one:\n   - Change one word in <code>AGENTS.md<\/code>, so one rule says something wrong.\n   - Move one file out of <code>My Files/<\/code>.<\/li>\n<li>Open the AI assistant in the test folder. Ask your three golden questions.<\/li>\n<li>Write down which question caught the fault, and which questions still looked fine.<\/li>\n<\/ol>\n<h3>After the Fault<\/h3>\n<p><strong>The check that stayed silent is the most useful answer.<\/strong> It shows you a failure your checks cannot see. Write it down in your build log, under \"what my checks cannot see\".<\/p>\n<p><strong>Then fix the fault and check again.<\/strong> Every check should go green. If one stays red after the fault is fixed, the check itself is broken.<\/p>\n<p><strong>Check the alarm against reality, too.<\/strong><\/p>\n<ul>\n<li>In September 2026 Toby reported 292 broken links in Annie's vault. Only 15 were real.<\/li>\n<li>The checker was misreading three kinds of link that were correct.<\/li>\n<li>Claude nearly changed 234 rows of Annie's storage list to match the checker. That would have broken working links (Build Log 79).<\/li>\n<li>About a week later, Toby reported 249 broken photo links, and this time he was right (Build Log 85).<\/li>\n<\/ul>\n<p>Neither the alarm nor the silence is proof. Look at what the alarm points to.<\/p>\n<h2>Set a Spending Cap<\/h2>\n<p><em>5 minutes.<\/em><\/p>
