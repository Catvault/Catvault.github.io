n<td>Runs as a service with the four restart lines from the make-it-come-back step; linger on<\/td>\n<td>The service file; <code>Linger=yes<\/code><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Quote test passed<\/td>\n<td>It quoted my save rule exactly<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Refusal test passed<\/td>\n<td>It said it did not know<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Golden questions passed twice, in fresh conversations<\/td>\n<td>My build log<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>First boss admin move: the task is in <code>_TO DO.md<\/code> on my laptop<\/td>\n<td>Obsidian on the laptop<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 2: closing line added.]<\/em><\/p>\n<p><strong>Next: the second half of the build (Module 08).<\/strong> Your bot quotes your rules and has done its first job. Now Claude Code joins, through your own server.<\/p>\n<h2>Teaching Notes<\/h2>\n<ul>\n<li><em>[FABLE EDIT, 13 Oct 2026. Proposal 10, approved by Annie on 13 Oct 2026: ]<\/em> <strong>Check Obsidian's help page for headless sync once before teaching.<\/strong> The vault steps in this module come from the <code>ob<\/code> README, version 0.0.14. If the page or a newer version adds a step, this module changes first.<\/li>\n<li><strong>This is the hardest part of either course.<\/strong> There are three students at most. The facilitator sits beside each one in turn. Never take the keyboard.<\/li>\n<li><strong>The second SSH window is the most important habit.<\/strong> Check every student has one open before anyone turns off password logins.<\/li>\n<li><strong>Some students' servers will not be ready.<\/strong> They sit beside a neighbour. They finish at home with this checklist, with the facilitator on a call for the lock-down steps, from looking first to banning repeated failed logins. They must not do the lock-down steps alone without the second window.<\/li>\n<li><strong>pi cannot answer prompts that need typing.<\/strong> The student runs these in their own window, and pi gives them the command:<\/li>\n<li>passphrases and passwords<\/li>\n<li><code>tailscale up<\/code> approvals<\/li>\n<li>the Claude sign-in<\/li>\n<li><code>hermes gateway setup<\/code><\/li>\n<li><strong>Tokens and keys get pasted into the wrong places.<\/strong> Before the bot segments, remind every student that a bot token is a password.<\/li>\n<li><strong>Provider consoles differ.<\/strong> Show one provider on screen. Tell students to find the same button on theirs.<\/li>\n<li><strong>The exit node and the terms question:<\/strong> keep it factual, as in Module 01.<\/li>\n<li><strong>Timing risk: Tailscale and the exit node take longest.<\/strong> If the room is behind at 75 minutes, copying the vault to the server becomes homework. Then the first boss admin move goes home with it. In class, ask pi to show the last three lines of <code>_TO DO.md<\/code> on the server instead. <em>[FABLE EDIT, 13 Oct 2026. Second audit, finding 1, fixed at Annie's request on 13 Oct 2026: two sentences added.]<\/em><\/li>\n<\/ul>"}, {"id": "full-12", "title": "09: Script, Machine Learning or AI Judgement", "handout": false, "html": "<h1>Module 09: Script, Machine Learning or AI Judgement<\/h1>\n<p><strong>How to read this file.<\/strong><\/p>\n<ul>\n<li>This is the master copy for both courses.<\/li>\n<li>The Full course runs every segment.<\/li>\n<li>The Short course runs only the segments with minutes in its column.<\/li>\n<li>This module is all paper. Students need no laptops until they save their notes at the end.<\/li>\n<\/ul>\n<p><strong>Why this module comes after the build.<\/strong><\/p>\n<ol>\n<li>Students have now used an AI assistant. They have seen it answer, and some have seen it get things wrong.<\/li>\n<li>The second half of this module explains what to do when a model keeps getting a step wrong. That only makes sense after a student has seen a failure.<\/li>\n<li>The first automation is built in Module 11. So students still decide who or what does each step before anything is automated.<\/li>\n<\/ol>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 4, approved by Annie on 13 Oct 2026. In this file: 2 changes, 1 editor notes and the sections Where the Two Versions Went (from inside the Teaching Notes), Sources, Related moved to <code>editor-notes/09 — Editor's Notes.md<\/code>. Every change, with its old and new text, is listed in FABLE-EDITS.md.]<\/em><\/p>\n<h2>Run Sheet<\/h2>\n<p>Full course: 48 minutes. Short course: 28 minutes. A dash means the segment is not in that course.<\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 11, approved by Annie on 13 Oct 2026: one 3-minute row added at the top, both courses. Full 45 to 48, Short 25 to 28. AUDIT.md, Finding 10.]<\/em><\/p>\n<table>\n<thead>\n<tr>\n<th>Full (min)<\/th>\n<th>Short (min)<\/th>\n<th>Segment<\/th>\n<th>Facilitator does<\/th>\n<th>Students do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>3<\/td>\n<td>3<\/td>\n<td>Take out your workflows from Module 05<\/td>\n<td>Says what has changed since Day 2: the students now own a working system<\/td>\n<td>Lay out both maps. Read each one from trigger to done-signal. Say the job in one sentence<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>5<\/td>\n<td>One question for every step<\/td>\n<td>Asks: does this step have a right answer?<\/td>\n<td>Look at their workflows<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>10<\/td>\n<td>Four ways a step can be done<\/td>\n<td>Explains the four: a script, a single-task model, a judgement model, a person<\/td>\n<td>Sort nine example steps into the four<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>10<\/td>\n<td>Mark your workflows<\/td>\n<td>Walks the room. Asks of every step marked for a judgement model: could a script do this?<\/td>\n<td>Put a coloured dot on every step, for who or what does it<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>—<\/td>\n<td>Why AI flatters, guesses and cannot count<\/td>\n<td>Explains how models are trained, and what follows<\/td>\n<td>Ask questions<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>—<\/td>\n<td>When the model keeps getting it wrong<\/td>\n<td>Walks five ways to fix a step the model keeps getting wrong, from weakest to strongest<\/td>\n<td>Note the five ways<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>—<\/td>\n<td>Write Build Brief 1, a one-page plan for the first automation<\/td>\n<td>Shows the one-page template<\/td>\n<td>Fill in the brief for their best candidate<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>How the minutes add up.<\/strong><\/p>\n<ul>\n<li><strong>Full course: 48 minutes.<\/strong> Taking out the workflows from Module 05 takes 3 minutes. The question \"does this step have a right answer?\" takes 5. The four ways a step can be done, with the nine example steps, take 10. Putting a coloured dot on every step of the maps takes 10. Why AI flatters, guesses and cannot count takes 5. The five ways to fix a step the model keeps getting wrong take 5. Writing Build Brief 1, the one-page plan for the first automation, takes 10.<\/li>\n<li><strong>Short course: 28 minutes.<\/strong> Taking out the workflows from Module 05 takes 3 minutes. The question \"does this step have a right answer?\" takes 5. The four ways a step can be done, with the nine example steps, take 10. Putting a coloured dot on every step of the maps takes 10.<\/li>\n<li><strong>Short course homework, no class time:<\/strong> a five-row Build Brief for the circled candidate. In the Short course the circled candidate is the files job you built in Module 08, unless the dots show a better one. The facilitator shows the worksheet in the last minute of class. <em>[FABLE EDIT, 13 Oct 2026. Annie chose on 13 Oct 2026: in the Short course, the files job from Module 08 and the skill from Module 11 are the same job. AUDIT.md, question 3. One sentence added.]<\/em><\/li>\n<\/ul>\n<h2>What You Will Leave With<\/h2>\n<p><strong>Both courses:<\/strong><\/p>\n<ul>\n<li>Your workflows from Module 05, with a coloured dot on every step.<\/li>\n<li>Each dot says who or what does that step: a script, a single-task model, a judgement model or a person.<\/li>\n<li>Your best candidate for a first automation, circled on the map.<\/li>\n<\/ul>\n<p><strong>Full course only:<\/strong><\/p>\n<ul>\n<li><strong>Build Brief 1.<\/strong> This is one page that describes your first automation. It says:<\/li>\n<li>what starts it<\/li>\n<li>what each step is, and who checks it<\/li>\n<li>what it must never do<\/li>\n<li>how you will know it worked<\/li>\n<li>In Module 11 your builder (pi or Claude Code) builds it from this brief.<\/li>\n<\/ul>\n<p><strong>Short course only, as homework:<\/strong><\/p>\n<ul>\n<li><strong>A five-row Build Brief<\/strong> for your circled candidate. It says:<\/li>\n<li>the goal<\/li>\n<li>what starts it<\/li>\n<li>the steps, with who or what does each one<\/li>\n<li>who checks each step<\/li>\n<li>how you know it worked<\/li>\n<li>In Module 11 pi builds it from this brief, on your laptop.<\/li>\n<li>Bring it to Module 11. Without it, pi has nothing written down to build from.<\/li>\n<\/ul>\n<h2>Before This Module<\/h2>\n<ul>\n<li><strong>Your workflows from Module 05.<\/strong> In the Short course, this may be one workflow, because workflow two was homework.<\/li>\n<li><strong>Your What AI Is Allowed to See sheet from Module 02.<\/strong> Some steps will be ruled out by it.<\/li>\n<li><strong>Dot stickers in four colours,<\/strong> or four coloured pens. The facilitator supplies these.<\/li>\n<\/ul>\n<h2>Take Out Your Workflows From Module 05<\/h2>\n<p><em>3 minutes. Both courses.<\/em><\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 11, approved by Annie on 13 Oct 2026: new section. AUDIT.md, Finding 10.]<\/em><\/p>\n<p>Two days ago you wrote your workflows on sticky notes. Since then you have built your system. Now the notes come back.<\/p>\n<ol>\n<li>Lay out both maps on the table. In the Short course, one map may be homework.<\/li>\n<li>Read each one from the trigger to the done-signal. Do not fix anything yet.<\/li>\n<li>Say the job in one sentence: \"When [trigger], I [steps], and it is done when [done-signal].\"<\/li>\n<\/ol>\n<p>You know it works when you can say the sentence without reading the notes. If you cannot, the map is missing a step. Add it now, before you mark anything.<\/p>\n<p><strong>Why the wait was on purpose.<\/strong> On Day 2 you did not know what a script could do, or what a model gets wrong. Now you have seen both. So now you can mark each step honestly.<\/p>\n<h2>One Question for Every Step<\/h2>\n<p>Look at each step on your map. Ask one question: <strong>does this step have a right answer?<\/strong><\/p>\n<p><strong>If it has a right answer, a script should do it.<\/strong> Examples of a right answer:<\/p>\n<ul>\n<li>a time<\/li>\n<li>a total<\/li>\n<li>a date<\/li>\n<li>a file name<\/li>\n<li>whether two appointments overlap<\/li>\n<\/ul>\n<p>A script gives the same answer every time. It costs nothing to run.<\/p>\n<p><strong>If the step depends on context, it needs an AI model.<\/strong> Examples:<\/p>\n<ul>\n<li>\"is this email urgent?\"<\/li>\n<li>\"which of these ideas matters most?\"<\/li>\n<\/ul>\n<p><strong>Annie's system shows how far this goes.<\/strong> On 2 October 2026 her server ran 26 scheduled jobs (live server check, 2 Oct 2026).<\/p>\n<ul>\n<li>23 of them were plain scripts. They never call an AI model.<\/li>\n<li>They include the vault sync, backups, the morning brief, the weather plan, reminders, the watchdog and the monthly cost report.<\/li>\n<li>Only 3 jobs hand work to the bot's model. Those need real judgement about what is new and relevant.<\/li>\n<\/ul>\n<p><strong>The money follows the same rule.<\/strong> Annie moved routine work from the AI model to scripts. Her token spending fell from $29.05 in July 2026 to $2.79 in August (Build Log 36).<\/p>\n<h2>Four Ways a Step Can Be Done<\/h2>\n<p>Every step on your map is done by one of four things: a script, a single-task model, a judgement model or a person.<\/p>\n<p><strong>Script.<\/strong><\/p>\n<ul>\n<li>What it is: code that follows fixed steps.<\/li>\n<li>Good for: anything with a right answer. Times, counts, renames, overlaps and file moves.<\/li>\n<li>Annie's examples: the weather planner, the receipt scan and rename, the watchdog's checks, the overlap checker.<\/li>\n<li>Cost per run: $0.<\/li>\n<\/ul>\n<p><strong>Single-task model<\/strong> (machine learning).<\/p>\n<ul>\n<li>What it is: a small AI model trained to do one job only.<\/li>\n<li>Good for: turning messy input into data. Speech to text, reading a photo, sorting into a category.<\/li>\n<li>Annie's examples: voice notes transcribed on the server (Build Log 62), and an 80-minute talk transcribed on the Mac with no internet (Build Log 81).<\/li>\n<li>Cost per run: very small, or $0 if it runs on your own machine.<\/li>\n<\/ul>\n<p><strong>Judgement model<\/strong> (a large language model).<\/p>\n<ul>\n<li>What it is: a general AI model that reads and writes.<\/li>\n<li>Good for: decisions that depend on context, and writing in a voice.<\/li>\n<li>Annie's examples: grading a learning answer; finding the week's most useful idea; drafting a reply; the nightly filing job, which decides which folder each note belongs in (Build Logs 62 and 94).<\/li>\n<li>Cost per run: cents, and more for top models.<\/li>\n<\/ul>\n<p><strong>Person.<\/strong><\/p>\n<ul>\n<li>What it is: you, or someone you trust.<\/li>\n<li>Good for: approvals, anything that reaches another person, and sensitive submissions.<\/li>\n<li>Annie's examples: sending any email; submitting an insurance claim.<\/li>\n<li>Cost per run: your time.<\/li>\n<\/ul>\n<p><strong>The single-task model is the one people forget.<\/strong> It sits between a script and a full AI model.<\/p>\n<ul>\n<li>Annie's laptop turned an 80-minute recorded talk into 14,427 words of text.<\/li>\n<li>It used a free speech-to-text program called whisper.cpp.<\/li>\n<li>Nothing left the machine. So it needed no VPN and no account (Build Log 81).<\/li>\n<li>Her server transcribes voice notes sent to the bot in the same way (Build Log 62).<\/li>\n<\/ul>\n<p><strong>Keep a person on any step where a silent failure would touch sensitive data.<\/strong> Annie wanted her bot to file insurance claims from start to finish. The decision in May 2026 was this (Hermes Master Doc, 30 May 2026):<\/p>\n<ul>\n<li>The bot finds the receipt, downloads it and tells her.<\/li>\n<li>She submits the claim herself.<\/li>\n<li>The reason: insurers' websites block automated browsers, and a failure there could go unnoticed.<\/li>\n<\/ul>\n<p><strong>A scheduled job should not wake the AI just to ask you something.<\/strong> Annie's rule from day one: scheduled jobs are scripts, or scripts that hand a small task to a cheap model. Her first bot ended partly because AI prompts ran on timers and billed a paid account every day (How to Build Your Own Claudith guide, Part 1). If you want judgement, make it something you ask for when you need it.<\/p>\n<p><strong>Annie wrote this down as three cost levels for her bot's jobs in June 2026 (Build Log 15):<\/strong><\/p>\n<ol>\n<li><strong>Level 1: a plain script, with no AI.<\/strong> This is the cheapest, and it is the default.<\/li>\n<li><strong>Level 2: a script plus a small, cheap model.<\/strong> This is for light formatting and reading.<\/li>\n<li><strong>Level 3: the good, expensive model.<\/strong> This is for live conversation with Annie only.<\/li>\n<\/ol>\n<p>Scheduled jobs use Level 1 or Level 2. They never run the expensive model on a timer. The same log adds a second rule. Heavy building belongs on the powerful, expensive builder, because that is where the real work happens. The bot's job is to be reachable on the phone, so a cheap model is the right choice for it.<\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 14, approved by Annie on 13 Oct 2026: the subsection below moved here from the module on what breaks (Module 10). Its last two sentences are now in Annie's voice. AUDIT.md, Finding 14.]<\/em><\/p>\n<h3>Free and Cheap AI Models<\/h3>\n<p><em>Read this aloud in the Full course if time allows. It is also in the syllabus.<\/em><\/p>\n<p>Telegram, a free model tier, and the laptop you already own will run everything in this course. A free or cheap AI model costs less, but it is not as smart. So give each model the job it does well.<\/p>\n<p>Think about your household. You are the expensive model. You design the whole system for your home and your child: the routines, the rules, and what to do when something goes wrong. Helpers are not paid as highly as we are. They are not paid to design the household system. They are paid to carry out the routine you have set.<\/p>\n<p>AI works the same way. The smarter, more costly model builds the scripts and the rules. The cheap model runs them. When a cheap model was left to make its own judgement calls, it reported work it had not done (Logs 00, 52 and 56). By late September 2026, all three of Annie's bots ran well on a cheap model, because the scripts and checks were already built. The module on what breaks (Module 10) shows you how to build those checks.<\/p>\n<p><strong>Where judgement is needed, let a script do the work around it.<\/strong> Annie's weekly idea job (Phoebe) needs real judgement. It runs in three steps (live server check, 2 Oct 2026):<\/p>\n<ol>\n<li>A script gathers the build logs and notes first, with no AI.<\/li>\n<li>Only then does it call Claude to think.<\/li>\n<li>Afterwards, the script checks that the weekly note actually exists before it reports success.<\/li>\n<\/ol>\n<h3>Practice: Sort Nine Example Steps<\/h3>\n<p>The facilitator hands out nine example steps, one per card. <em>[FABLE EDIT, 13 Oct 2026. Proposal 12, approved by Annie on 13 Oct 2026: a ninth step added, and the suggested answers now name each step instead of its number. AUDIT.md, Finding 11.]<\/em> Decide whether each one is done by a script, a single-task model, a judgement model or a person. Then compare with a partner.<\/p>\n<ol>\n<li>Check whether a 3 pm call clashes with anything on your calendar.<\/li>\n<li>Rename a downloaded PDF to 15 characters or fewer.<\/li>\n<li>Turn a voice note into text.<\/li>\n<li>Decide which of this week's ten ideas is most worth your time.<\/li>\n<li>Send a reply to a client.<\/li>\n<li>Count how many items are in your storage inventory.<\/li>\n<li>Read a photo of a warranty card and pull out the serial number.<\/li>\n<li>Decide whether an email from your child's school needs action today.<\/li>\n<li>Draft the agenda for tomorrow's client meeting from the last three emails with that client.<\/li>\n<\/ol>\n<p><strong>Suggested answers.<\/strong><\/p>\n<ul>\n<li>Script: the 3 pm clash check, the PDF rename, and the inventory count.<\/li>\n<li>Single-task model: the voice note, and the warranty card photo.<\/li>\n<li>Judgement model: picking the week's best idea, the school email, and the meeting agenda.<\/li>\n<li>Person: the reply to the client.<\/li>\n<\/ul>\n<p>The school email can move towards a script if the school uses the same subject lines every time. The meeting agenda is a draft. A person reads it before the meeting, and a person sends anything to the client.<\/p>\n<h2>Mark Your Workflows<\/h2>\n<p>Put one coloured dot on every step of your maps. The colour says who or what does that step.<\/p>\n<table>\n<thead>\n<tr>\n<th>Dot<\/th>\n<th>Who or what does the step<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Green<\/td>\n<td>Script<\/td>\n<\/tr>\n<tr>\n<td>Blue<\/td>\n<td>Single-task model<\/td>\n<\/tr>\n<tr>\n<td>Red<\/td>\n<td>Judgement model<\/td>\n<\/tr>\n<tr>\n<td>Black<\/td>\n<td>Person<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Question every red dot.<\/strong> A red dot means you marked the step for a judgement model. For each one, ask: could a script do this if it were given the right facts? Two of Annie's examples:<\/p>\n<ul>\n<li>Her overlap check started as a judgement step. It became a script (Build Log 38).<\/li>\n<li>Her storage photos started with an AI description. They ended with none, because she preferred her own words (Build Log 52).<\/li>\n<\/ul>\n<p><strong>Mark what the model needs to be told.<\/strong> Beside every red dot, write the facts a script should hand the model first.<\/p>\n<ul>\n<li>In July 2026 Annie's bot invented an answer about which class slot suited her son.<\/li>\n<li>It had no nap times and no rules to check against.<\/li>\n<li>The fix supplied the facts and a numbered checking procedure.<\/li>\n<li>Then the bot was tested against an answer worked out separately (Build Log 33).<\/li>\n<\/ul>\n<p><strong>Then circle your best candidate for a first automation.<\/strong> Short course: your first candidate is the files job you built in Module 08. Circle it, unless the dots show a better one. A good first candidate:<\/p>\n<ul>\n<li>has a clear trigger<\/li>\n<li>is mostly green dots, which means mostly script steps<\/li>\n<li>happens at least weekly<\/li>\n<li>causes small harm if it goes wrong<\/li>\n<li>uses only Tier 1 (open) or Tier 2 (personal) information from your What AI Is Allowed to See sheet<\/li>\n<\/ul>\n<p><strong>You know it works when<\/strong> your circled candidate is mostly green dots, and every red dot has the facts the model needs written beside it. <em>[FABLE EDIT, 13 Oct 2026. Proposal 13, approved by Annie on 13 Oct 2026: check added. AUDIT.md, Finding 13.]<\/em><\/p>\n<h2>Why AI Flatters, Guesses and Cannot Count<\/h2>\n<p><em>Full course segment.<\/em><\/p>\n<p>Annie worked this out in a learning session on 17 September 2026 (Build Log 81).<\/p>\n<ul>\n<li>AI models are tuned by people choosing which answers they prefer.<\/li>\n<li>So the model learns to be liked, not to be right.<\/li>\n<li>Her line: \"they are not training the model that what they like is what is right\".<\/li>\n<\/ul>\n<p>Three habits follow from that one fact.<\/p>\n<ol>\n<li><strong>It agrees with you too easily,<\/strong> because agreement is liked.<\/li>\n<li><strong>It sounds sure when it is guessing,<\/strong> because sure answers are preferred, and the people rating them cannot check every fact.<\/li>\n<li><strong>It hands you the answer at once,<\/strong> because instant help feels good. This happens even when you needed to work it out yourself.<\/li>\n<\/ol>\n<p><strong>Never ask a model to count.<\/strong><\/p>\n<ul>\n<li>In September 2026 two of Annie's bots gave different totals for the same storage inventory.<\/li>\n<li>One said 184 items. The other said 158.<\/li>\n<li>The true number was 184.<\/li>\n<li>Neither bot should have been counting. The exact total already existed in a note that code rebuilds on every change.<\/li>\n<li>The fix pointed both bots at that number (Build Log 80; the figure 158 is from Seminar Ideas).<\/li>\n<\/ul>\n<p>The lesson is not \"pick the model that counts better\". Anything that must be exact comes from code. That includes counts, lists, totals and dates. The model only puts the result into words.<\/p>\n<h2>When the Model Keeps Getting It Wrong<\/h2>\n<p><em>Full course segment.<\/em><\/p>\n<p><strong>Rewriting the instruction rarely fixes a mechanical mistake for good.<\/strong> Annie's builds use five ways to fix it instead, from weakest to strongest. Each one replaces a request with something that cannot go another way (Build Logs 38, 42, 43, 50 and 52).<\/p>\n<ol>\n<li><strong>A written instruction, with the exact failing case as an example.<\/strong> A worked example works better than a general rule.<\/li>\n<li><strong>Code does the calculation, and the model reads the result.<\/strong> The calendar overlap check moved into a command.<\/li>\n<li><strong>Code accepts whatever the model does.<\/strong> The model's edits once broke a script. The script now accepts both file shapes.<\/li>\n<li><strong>A guard blocks the wrong action.<\/strong> One bot cannot edit protected files at all.<\/li>\n<li><strong>The model is taken out of the step.<\/strong> Photos sent to the storage bot are filed by code before the model ever wakes up.<\/li>\n<\/ol>\n<p>Annie's summary from Build Log 50: an instruction is a request the model can decline, and a guard cannot be declined.<\/p>\n<p><strong>Taking the AI out moves the bugs into plain code.<\/strong> In September 2026 the storage bot showed \"typing\" all day and never replied (Build Log 100).<\/p>\n<ul>\n<li>Annie swapped the AI model. Nothing changed, because that step used no model at all.<\/li>\n<li>The real cause was one wrong word in a script.<\/li>\n<li>The script crashed on its first line. Its error messages were switched off, so it stopped without telling anyone.<\/li>\n<li>The fix was one line.<\/li>\n<\/ul>\n<p>The lesson: read the logs before you blame the model. Never switch off a script's errors.<\/p>\n<h2>Write Build Brief 1<\/h2>\n<p><em>Full course segment.<\/em><\/p>\n<p><strong>A build brief is one page.<\/strong> It tells the builder what to build and how you will judge it. Annie has used this method since July 2026 (Build Log 27; Build Briefs README).<\/p>\n<ol>\n<li>One session writes the brief and its checks.<\/li>\n<li>A builder works from it.<\/li>\n<li>She judges the result against the checks she wrote first.<\/li>\n<\/ol>\n<p><strong>Two rules come from her experience.<\/strong><\/p>\n<ul>\n<li><strong>You write the definition of done, and the builder may not change it.<\/strong> Otherwise the builder can \"pass\" by moving the target.<\/li>\n<li><strong>Decisions live in the written brief, not in a conversation.<\/strong> In July 2026 Annie's bot agreed at 7:37 am that a weather tool would be all script, with no AI. By that afternoon, the notes it wrote for itself had brought back an AI job on a timer. A separate review of the design caught it before the 6 pm build (Seminar Ideas, 15 Jul 2026).<\/li>\n<\/ul>\n<p><strong>Name who checks every step.<\/strong> This is the \"Who verifies it?\" column. <em>[FABLE EDIT, 13 Oct 2026. Third session, after the screenshot check. Not yet approved by Annie: one version tag removed, the way Proposal 4 did elsewhere.]<\/em> The step that does the work should not be the only thing that checks it. For example, Annie's watchdog repairs one kind of broken link. After each repair it runs its own check again, and it reports a fix only if that check passes (Build Log 88). Module 10 covers this in full.<\/p>\n<p><strong>Find the step that would cost you most if it failed without anyone noticing.<\/strong> Give that step its own check first.<\/p>\n<p>Fill in the template in the worksheet below. Keep it to one page.<\/p>\n<h2>Homework: Which Judgement Model for Which Job<\/h2>\n<p><em>Full course, read at home. No class time.<\/em><\/p>\n<p><strong>Model quality changes month to month.<\/strong> This list is about the method, not a fixed ranking. Test models for yourself. These defaults come from Annie's research of 29 Sep 2026.<\/p>\n<ul>\n<li><strong>Reasoning and careful analysis:<\/strong> a top model, or DeepSeek V4 Pro. DeepSeek's V4 models use the MIT licence. The Pro model is the strongest open-weight choice with independent evidence.<\/li>\n<li><strong>Writing and long documents:<\/strong> test two models. Do not assume. Voice matters more than test scores. Annie runs separate models for different writing styles for this reason.<\/li>\n<li><strong>Coding:<\/strong> a top model, or a model made for coding. Coding rewards raw ability more than most jobs do.<\/li>\n<li><strong>Cheap bulk work<\/strong> (sorting, filing, summarising): a small, cheap, fast model. Most of the cost is here, and the small model is usually good enough.<\/li>\n<li><strong>Reading photos:<\/strong> a model that can see images. Check that it really accepts images. A text-only model asked to read a photo will fail or invent an answer.<\/li>\n<li><strong>The widest range from one company:<\/strong> Qwen. It has the most models of the four open-weight makers (DeepSeek, Qwen, GLM and Kimi).<\/li>\n<li><strong>Jobs that run all the time:<\/strong> something cheap that is easy to reach. Do not put an expensive top model behind a job that runs every five minutes.<\/li>\n<\/ul>\n<p><strong>The question to ask is not \"which model is best?\"<\/strong> Ask: which model is right for this job, and what does it cost when it runs a thousand times?<\/p>\n<h2>From the Record<\/h2>\n<p><strong>The cheap model that pretended.<\/strong> In May 2026 Annie's first bot ran on a cheaper open model (Build Logs 00 and 25; Annie's notes, 29 Sep 2026).<\/p>\n<ul>\n<li>It chatted well.<\/li>\n<li>It also said tasks were done when they were not.<\/li>\n<li>It wrote broken tools of its own instead of using the ones it had.<\/li>\n<li>It only added things to the calendar when given an exact command.<\/li>\n<li>Moving to Claude fixed it. The hidden cost was about a week of research, plus 13 logged hours of clean-up.<\/li>\n<li>By late September 2026 all three of Annie's bots ran well on a cheap DeepSeek model. By then the tools and guards around it were built.<\/li>\n<\/ul>\n<p>The lesson: test a model on the actions you need. Check what it touched, not what it says.<\/p>\n<p><strong>The overlap the bot could not see.<\/strong> In July 2026 Annie's bot kept saying a 9:15 to 10:15 class was free on a Friday (Build Log 38).<\/p>\n<ul>\n<li>Her son had an appointment from 9:45 to 10:30.<\/li>\n<li>The bot compared start times only, so it saw no problem.<\/li>\n<li>The fix was one rule that a script now applies to every slot. Two times clash if the first starts before the second ends, and ends after the second starts.<\/li>\n<\/ul>\n<p>The lesson: \"it checked\" and \"it checked correctly\" are different claims.<\/p>\n<p><strong>The grader that said \"exactly it\".<\/strong> In August 2026 Annie's learning bot graded her answer to a question about who approves AI at a bank (Build Log 56).<\/p>\n<ul>\n<li>She named the chief executive, the finance chief and the board.<\/li>\n<li>The answer key named risk, security, legal and the data owner.<\/li>\n<li>The bot replied \"That's exactly it\".<\/li>\n<li>Its log showed one model call and zero tool calls. So it had also saved nothing.<\/li>\n<li>Fixing the saving first would have recorded false passes. So the grading moved to Claude Code first.<\/li>\n<\/ul>\n<p>The lesson: a cheap model can be fine at sending and filing, and still too soft to judge. Fix the judgement before you fix the step that records it.<\/p>\n<h2>Worksheet: Build Brief 1<\/h2>\n<p><em>Full course.<\/em> Save this as <code>Build Brief 1 — &lt;name&gt;<\/code> in your vault's <code>AI System<\/code> folder.<\/p>\n<table>\n<thead>\n<tr>\n<th>Section<\/th>\n<th>My answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Goal<\/strong> (one plain paragraph: which chore disappears)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Trigger<\/strong> (what arrives, or what time)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Steps, each with who or what does it<\/strong><\/td>\n<td>1. ___ (script) 2. ___ (script) 3. ___ (judgement) ...<\/td>\n<\/tr>\n<tr>\n<td><strong>Who checks each step<\/strong> (a name, a script or a second check, never \"the step itself\")<\/td>\n<td>1. ___ 2. ___ 3. ___<\/td>\n<\/tr>\n<tr>\n<td><strong>The step that would cost most if it failed unnoticed, and its own check<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Facts code must give the model<\/strong> (for every judgement step)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Information involved, and its tier on your What AI Is Allowed to See sheet<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Must never do<\/strong><\/td>\n<td>For example: send anything to another person; delete anything; touch Tier 3 (never) information<\/td>\n<\/tr>\n<tr>\n<td><strong>Needs my approval before<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Done-signal<\/strong> (how I know it worked, without checking by hand)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Acceptance checks<\/strong> (written now, never changed by the builder)<\/td>\n<td>1. 2. 3.<\/td>\n<\/tr>\n<tr>\n<td><strong>How I check it in two minutes<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>How to undo it<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Keep-or-kill date<\/strong> (two weeks after it goes live)<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Worksheet: Short Course Build Brief (Homework)<\/h2>\n<p><em>Short course.<\/em> This is the Full course brief, cut to five rows. Do it at home after this module. Save it as <code>Build Brief 1 — &lt;name&gt;<\/code> in your vault's <code>AI System<\/code> folder.<\/p>\n<table>\n<thead>\n<tr>\n<th>Section<\/th>\n<th>My answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Goal<\/strong> (one plain paragraph: which chore disappears)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Trigger<\/strong> (what arrives, or what time)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>Steps, each with who or what does it<\/strong> (script, single-task model, judgement model or person)<\/td>\n<td>1. ___ (script) 2. ___ (script) 3. ___ (judgement) ...<\/td>\n<\/tr>\n<tr>\n<td><strong>Who checks each step<\/strong> (a name, a script or a second check, never \"the step itself\")<\/td>\n<td>1. ___ 2. ___ 3. ___<\/td>\n<\/tr>\n<tr>\n<td><strong>Done-signal<\/strong> (how I know it worked, without checking by hand)<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Why these five rows.<\/strong> They are the minimum the Full course teaching note names when time runs short. They are enough for pi to build from. The other Full course rows (what it must never do, approvals, acceptance checks, how to undo it, a keep-or-kill date) are covered in Module 11 before anything is built.<\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 2: closing line added.]<\/em><\/p>\n<p><strong>Next: what breaks (Module 10).<\/strong> Every step has an owner. Now you learn how a job lies, and how a check catches it.<\/p>\n<h2>Teaching Notes<\/h2>\n<ul>\n<li><strong>Most students over-use AI on their first pass.<\/strong> Expect too many red dots (steps marked for a judgement model). The facilitator's main job here is to ask: \"could a script do this if it had the facts?\"<\/li>\n<li><strong>\"Machine learning\" confuses people.<\/strong> Explain it as a model trained for one narrow job, such as reading speech or photos. It does not reason. It turns messy input into data.<\/li>\n<li><strong>Developers in the room will move fast.<\/strong> Ask them to help a neighbour mark red dots (judgement model steps), not to start coding.<\/li>\n<li><strong>Do not promise that any model will behave.<\/strong> The point of sorting the steps is that the important ones do not depend on how a model behaves.<\/li>\n<li><strong>Three students at most.<\/strong> Check each student's red dots (judgement model steps) beside them while they mark their maps.<\/li>\n<li><strong>Timing risk: the brief takes longer than students expect.<\/strong> If time runs short, the goal, trigger, steps, who checks each step and the done-signal (how you know it worked) are the minimum. The rest can be homework.<\/li>\n<\/ul>"}, {"id": "full-13", "title": "10: What Breaks, and Keeping It Honest", "handout": false, "html": "<h1>Module 10: What Breaks, and Keeping It Honest<\/h1>\n<p><strong>How to read this file.<\/strong><\/p>\n<ul>\n<li>This is the master copy for both courses.<\/li>\n<li>The Full course runs every segment.<\/li>\n<li>The Short course runs only the segments with minutes in its column.<\/li>\n<li>Five stories are told in class. Every other story from Annie's build logs is in the handout, <code>10 — Handout, What Broke in Annie's System<\/code>, one line each.<\/li>\n<\/ul>\n<p><strong>Why this module comes here.<\/strong><\/p>\n<ol>\n<li>Students now own a system that can break. In the Full course it is a bot on a server (Module 08B). In the Short course it is an AI assistant on a laptop (Module 08).<\/li>\n<li>The first automation is built in Module 11. So students learn how to check a job before they build one.<\/li>\n<\/ol>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 4, approved by Annie on 13 Oct 2026. In this file: 1 changes, 1 editor notes and the sections Where the Versions Went, Sources, Related moved to <code>editor-notes/10 — Editor's Notes.md<\/code>. Every change, with its old and new text, is listed in FABLE-EDITS.md.]<\/em><\/p>\n<h2>Run Sheet<\/h2>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 13, approved by Annie on 13 Oct 2026: every check in this file now starts \"You know it works when\". AUDIT.md, Finding 13. The old wording of each line is in <code>proposals/13 — One Phrase for Every Check.md<\/code>.]<\/em><\/p>\n<p>Full course: 50 minutes. Short course: 35 minutes. A dash means the segment is not in that course.<\/p>\n<table>\n<thead>\n<tr>\n<th>Full (min)<\/th>\n<th>Short (min)<\/th>\n<th>Segment<\/th>\n<th>Facilitator does<\/th>\n<th>Students do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>10<\/td>\n<td>10<\/td>\n<td>The three ways a system fails<\/td>\n<td>Tells one story for each way<\/td>\n<td>Name a failure they have already met<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>—<\/td>\n<td>Make a backup and restore one file<\/td>\n<td>Shows the backup on screen<\/td>\n<td>Make a backup, then restore one file from it<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>5<\/td>\n<td>Choose your checks<\/td>\n<td>Shows the four checks. Full: shows the watchdog rules<\/td>\n<td>Full: have the builder write a small watchdog. Short: pick the golden questions that will be the check<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>15<\/td>\n<td>Break it on purpose<\/td>\n<td>Plants a fault on the facilitator's own build first<\/td>\n<td>Plant one fault, watch a check go red, then fix it<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>5<\/td>\n<td>Set a spending cap<\/td>\n<td>Tells the September 2026 cost story<\/td>\n<td>List every paid account. Set a cap on each one that charges per use<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>How the minutes add up.<\/strong><\/p>\n<ul>\n<li><strong>Full course: 50 minutes.<\/strong> The three ways a system fails take 10 minutes. The backup and the restore take 10. Choosing the checks and writing the watchdog take 10. Breaking it on purpose takes 15. The spending cap takes 5.<\/li>\n<li><strong>Short course: 35 minutes.<\/strong> The three ways a system fails take 10 minutes. Choosing the checks takes 5, because the check is the golden questions and there is no watchdog to write. Breaking it on purpose takes 15. The spending cap takes 5.<\/li>\n<li><strong>Short course homework, no class time:<\/strong> make a backup of the AI assistant's folder and restore one file from it. The worksheet has the steps.<\/li>\n<\/ul>\n<p><strong>Why the backup comes before the checks in the Full course.<\/strong> The watchdog checks that the newest backup is recent. So the backup has to exist first.<\/p>\n<h2>What You Will Leave With<\/h2>\n<p><strong>Both courses:<\/strong><\/p>\n<ul>\n<li>One failure you have caused on purpose, and seen a check catch.<\/li>\n<li>A written note of what your check cannot see.<\/li>\n<li>A list of every paid account, with a cap on each one that charges per use.<\/li>\n<\/ul>\n<p><strong>Full course only:<\/strong><\/p>\n<ul>\n<li>A backup of your bot, and one file restored from it. It sends you one short receipt every night.<\/li>\n<li>A small watchdog on your server. It runs every hour and stays silent when everything is fine.<\/li>\n<\/ul>\n<p><strong>Short course only, as homework:<\/strong><\/p>\n<ul>\n<li>A copy of your AI assistant's folder in a second place, and one file restored from it.<\/li>\n<\/ul>\n<h2>Before This Module<\/h2>\n<ul>\n<li><strong>Full course:<\/strong> your server and bot from Module 08B, working.<\/li>\n<li><strong>Short course:<\/strong> your AI assistant from Module 08, working on your laptop.<\/li>\n<li><strong>Both courses:<\/strong> your run card and your three golden questions from Module 07. Golden questions are test questions with known answers.<\/li>\n<li><strong>Both courses:<\/strong> a list of every account you pay for. Bring the login for each one.<\/li>\n<\/ul>\n<h2>The Three Ways a System Fails<\/h2>\n<p><em>10 minutes, both courses.<\/em><\/p>\n<p>Every failure is one of three kinds. They are not equally dangerous.<\/p>\n<p><strong>1. It stops.<\/strong> The bot does not answer, or the job does not run. You usually notice within a day, because something you expected does not arrive.<\/p>\n<ul>\n<li><strong>The story (Build Log 53).<\/strong> Annie's nightly backup also sent a copy to Google Drive.<\/li>\n<li>The upload used a Google sign-in that expired every 7 days. The app behind it was still in Google's \"Testing\" mode.<\/li>\n<li>The upload failed four mornings in a row, 20 to 23 August 2026. A failure message arrived each morning.<\/li>\n<li>Annie noticed the same message several mornings running and asked if it was a pattern.<\/li>\n<li>The fix moved the upload onto a published app whose sign-in does not expire. Nobody has to sign in again each week.<\/li>\n<\/ul>\n<p><strong>2. It runs, but does the wrong thing.<\/strong> The job finishes and nothing complains. The result is wrong.<\/p>\n<ul>\n<li><strong>The story (Build Log 82).<\/strong> In September 2026, Claude told Annie that her storage bot saved its own copy of each photo on the server. That was true.<\/li>\n<li>But the copy sat inside the synced vault. Annie read the answer as \"safe to delete the vault folder\", and deleted it.<\/li>\n<li>One sync run removed 411 files everywhere: 262 storage photos, 147 photos for a series of picture books, and 2 other files.<\/li>\n<li>Annie had made the books for her son. She created a series of three books to help him through a big change.<\/li>\n<li>The books drew on the family's written plan for raising her son, with its guiding principles and examples. They also drew on deep research into attachment theory and how very young children cope with big changes.<\/li>\n<li>Her nightly backup had never included the vault.<\/li>\n<li>She got the storage photos back from Obsidian's own version history, which comes with the paid sync plan. She chose not to recover the 147 book photos as the finished books were already saved, so she let the photos go.<\/li>\n<li>The lesson: \"a separate copy\" means nothing until you know which copies it is separate from.<\/li>\n<\/ul>\n<p><strong>3. It says it worked when it did not.<\/strong> This is the most dangerous kind. The first two make you look for the problem. This one tells you there is nothing to look for.<\/p>\n<ul>\n<li>You have already met two of these stories. In Module 04, the nightly inbox sorter reported \"ok\" for weeks while it filed every note into the wrong folder (Build Log 74). In Module 09, the learning bot said \"That's exactly it\" to a wrong answer, after doing no work at all (Build Log 56).<\/li>\n<li><strong>The new story (Build Log 59).<\/strong> In August 2026, one of Annie's bots cleaned up a set of notes. It reported that the job was done and \"nothing dangles\", meaning no links were left broken.<\/li>\n<li>The renames were real. The claim about the links was false.<\/li>\n<li>Annie had deleted a page earlier, and seven notes still linked to it. The bot had never checked.<\/li>\n<\/ul>\n<p>Annie's rule after Build Log 74: \"a false 'ok' is just as bad or worse than something breaking down.\"<\/p>\n<p><strong>What to aim for.<\/strong> You cannot stop every failure. Aim for this instead: every failure should either announce itself, or be caught by a check.<\/p>\n<p><strong>There are two times a failure can happen,<\/strong> so you need two kinds of check (Build Log 73).<\/p>\n<ul>\n<li><strong>While the job is running.<\/strong> The job must say so in the same message if it fails. This is the rule in your rules file from Module 07 that says never hide a failure.<\/li>\n<li><strong>When nobody is watching.<\/strong> A job that never ran, or a backup that stopped, sends no message at all. Only a check that runs on a timer can find it. In the Full course, that is the watchdog you write today.<\/li>\n<\/ul>\n<p><strong>Exercise (2 minutes).<\/strong> Name one failure you have already met in this course. Which of the three kinds was it?<\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 14, approved by Annie on 13 Oct 2026: the subsection \"Free and Cheap AI Models\" moved to the script-or-AI module (Module 09), beside the three cost levels. AUDIT.md, Finding 14.]<\/em><\/p>\n<h2>Make a Backup and Restore One File<\/h2>\n<p><em>10 minutes, Full course. Short course: homework.<\/em><\/p>\n<p><strong>A backup is everything your system needs to run again after the machine is gone.<\/strong> That list is longer than people expect.<\/p>\n<p><strong>Include the logins, not only the files (Build Log 44).<\/strong><\/p>\n<ul>\n<li>In August 2026 Annie's builder checked what her nightly backup contained.<\/li>\n<li>The backup held the bot's whole folder. It did not hold the sync service's login, which lived in a different folder.<\/li>\n<li>A server rebuilt from it would have come back signed out.<\/li>\n<li>The login folders were added to the backup.<\/li>\n<\/ul>\n<p><strong>Leave out what can be downloaded again (Build Log 97).<\/strong> By September 2026 Annie's backup had grown to about 2 GB, mostly program files that can be downloaded again. Leaving them out cut it to 184 MB.<\/p>\n<p><strong>The backup copy is as private as the server.<\/strong> Once login files are inside it, anyone who can open the backup can sign in as your bot. Keep it somewhere only you can reach.<\/p>\n<p><strong>Know what each copy holds (Build Log 101).<\/strong> The copy of Annie's vault on her server held only notes. Photos, PDFs and scripts never reached it. In September 2026 she found 59 files, including 13 baby-book photos, that existed only on her Mac. Every backup she believed she had held only her notes.<\/p>\n<p><strong>Annie's backups have three layers (Build Log 21).<\/strong><\/p>\n<ol>\n<li><strong>A whole-server copy<\/strong> kept by the server company. You turned this on in Module 03B, \"Order Your Server\". <em>[OPUS EDIT, 15 Oct 2026. Second audit, finding 4: the pointer now names Module 03B.]<\/em><\/li>\n<li><strong>A nightly copy<\/strong> of everything a rebuild needs, made by a plain script at 3 am. It keeps the newest 7.<\/li>\n<li><strong>One copy kept somewhere else,<\/strong> so it survives if the server company loses the server.<\/li>\n<\/ol>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Annie chose on 13 Oct 2026 to teach the nightly receipt, the way her live system works since October 2026. AUDIT.md, question 2. The old paragraph taught \"message only when it fails\". It is in FABLE-EDITS.md.]<\/em><\/p>\n<p><strong>The backup sends one short receipt every night.<\/strong> Annie's backup messages her when it finishes: one line of ticks, one tick for each step that passed, with the date and the size. It is short, and it arrives at the same time every night. So a missing receipt is a signal too.<\/p>\n<p><strong>Keep the receipt to one line.<\/strong> A long daily message trains you to stop reading. Then the one that says it failed looks like all the others. One line of ticks you can read in a second.<\/p>\n<p><strong>The receipt is not the only check.<\/strong> A backup that stops running sends nothing, and a tired reader can miss a missing message. That is why the watchdog in the next segment checks the backup's age every hour.<\/p>\n<h3>Full Course: Do It Now<\/h3>\n<p>Ask your builder:<\/p>\n<pre><code class=\"language-text\">Write a backup script for this server. Include the bot's folder (~/.hermes), the vault sync login, the Claude Code login files and the SSH authorized keys. Leave out virtual environments, caches and anything that can be downloaded again. Keep the newest 7 copies. When it finishes, send me one short message on Telegram: one line of ticks, one tick for each step that passed, with the date and the size of the file. If a step fails, say which step and what to do. Schedule it every night at 3 am. Then run it once now and show me the file it made.\n<\/code><\/pre>\n<p><strong>Then restore one file.<\/strong> Ask the builder to list what is inside the newest backup (<code>unzip -l<\/code>) and to test it (<code>unzip -t<\/code>). Find your SOUL file in the list. Then ask the builder to copy your SOUL file out of the backup into a test folder, and open it.<\/p>\n<p><strong>Why you restore a file, not just look at the list.<\/strong> Build Log 27 records a backup made before a change, and the change itself never happened. A backup existing proves only that a backup exists. Opening a file from it proves it works.<\/p>\n<p><strong>One copy kept somewhere else is homework.<\/strong> Connecting a cloud account in class takes too long. Ask the builder to suggest a place, and to tell you what access it needs before it sets anything up.<\/p>\n<h3>Short Course: Homework<\/h3>\n<ol>\n<li>Copy your whole <code>My AI Assistant<\/code> folder to a second place: a USB drive, or a cloud folder you already use.<\/li>\n<li>Put the date in the copy's name, for example <code>My AI Assistant backup 2026-11-02<\/code>.<\/li>\n<li>Restore one file. Delete a test file from the real folder, then copy it back from the backup. Open it.<\/li>\n<li>Write on your run card where the backup is and when you made it.<\/li>\n<\/ol>\n<h2>Choose Your Checks<\/h2>\n<p><em>10 minutes, Full course. 5 minutes, Short course.<\/em><\/p>\n<p><strong>Four checks cover most of what can go wrong.<\/strong><\/p>\n<ol>\n<li><strong>Is it running?<\/strong> Did the job run, and does its result exist? This is the cheapest check. It catches only the first kind of failure.<\/li>\n<li><strong>Is the answer still right?<\/strong> Ask your three golden questions again after every change. If an answer changes and you did not change the files, something broke.<\/li>\n<li><strong>Is the important thing still there?<\/strong> The folder exists, the file is present, the backup is recent.<\/li>\n<li><strong>Did it really do the job?<\/strong> Look at the result itself, not at the job's report. Open the file, list the folder, read the message.<\/li>\n<\/ol>\n<p><strong>Check the result, not the report.<\/strong> <em>[FABLE EDIT, 13 Oct 2026. Third session, after the screenshot check. Not yet approved by Annie: two version tags removed from this paragraph and the next, the way Proposal 4 did elsewhere.]<\/em> A job's own message saying \"done\" is not proof. The result is the proof.<\/p>\n<p><strong>The job that does the work must not be the only thing that checks it.<\/strong> Annie's watchdog fixes one kind of broken link by itself. After each fix it runs its own check again, and it reports \"fixed\" only if that check passes (Build Log 88).<\/p>\n<p><strong>The checker can fail too.<\/strong><\/p>\n<ul>\n<li><strong>The story (Build Log 97).<\/strong> Annie had a script that wrote her monthly cost report.<\/li>\n<li>It was being run by the wrong copy of Python, which lacked a part it needed. So it read nothing.<\/li>\n<li>It printed three warnings, then printed \"ok\".<\/li>\n<li>An audit on 29 September 2026 also found it had never been scheduled, although an earlier log said it had (Build Logs 87 and 97).<\/li>\n<li>The audit's summary: every fault it found was in the part that reports on the system, not the part that does the work.<\/li>\n<\/ul>\n<p><strong>So write down what your check cannot see.<\/strong> A check with a known gap is useful. A check you believe sees everything is how you get surprised.<\/p>\n<h3>Short Course: Your Golden Questions Are the Check<\/h3>\n<p>Your AI assistant runs only when you open it. So the check is you, asking your three golden questions. Write on your run card: \"after every change, ask the three golden questions.\" Then go to the next segment.<\/p>\n<h3>Full Course: A Small Watchdog<\/h3>\n<p>Annie's watchdog, Toby, is a plain script with no AI. It runs every hour and stays silent when everything is fine. Yours starts with three checks.<\/p>\n<p><strong>The rules Toby follows<\/strong> (Build Logs 66, 74 and 107):<\/p>\n<ol>\n<li><strong>Print only problems.<\/strong> If the script prints nothing, you get no message.<\/li>\n<li><strong>Every alert ends with the one thing to do.<\/strong><\/li>\n<li><strong>If a check cannot read what it is checking, it reports a problem.<\/strong> A check that cannot see must never say \"ok\".<\/li>\n<li><strong>Always finish without an error code, even when reporting a problem.<\/strong> Toby once ended with an error code when he found a problem. The scheduler then marked Toby's own job as failed, and Toby reported that too, again and again (Build Log 66). The alert goes in the message.<\/li>\n<li><strong>Check often, message rarely.<\/strong> Check every hour. Repeat an unfixed problem only every 3 hours.<\/li>\n<li><strong>Stay quiet when nothing is expected.<\/strong> Toby checks that Annie's Mac has sent its sync signal. At 6:35 one morning he raised an alarm: the signal was 600 minutes old. Nothing was broken. The Mac had been asleep all night. Now he stays quiet from 8 pm to 8 am unless the Mac has been silent for more than 14 hours (Build Log 107). A check that raises false alarms every morning would train you to ignore it.<\/li>\n<\/ol>\n<p><strong>Your three checks.<\/strong><\/p>\n<ol>\n<li><strong>Is the bot running?<\/strong><\/li>\n<li><strong>Is the newest backup less than 26 hours old, and bigger than a minimum size?<\/strong><\/li>\n<li><strong>Does the server's Claude login expire within 4 days?<\/strong> The server's login lasts about 30 days, and using it does not extend it (Build Log 75). Module 08B promised this check.<\/li>\n<\/ol>\n<p>Ask your builder:<\/p>\n<pre><code class=\"language-text\">Write ~/.hermes/scripts/watchdog.py as a plain Python script with no AI.\nCheck 1: the bot is running.\nCheck 2: the newest backup in my backup folder is less than 26 hours old and bigger than [size].\nCheck 3: the Claude Code login on this server expires in more than 4 days.\nRules: print only problems; end each alert with the one action to take; if a check cannot read what it checks, report that as a problem; always exit 0; repeat an unfixed problem only every 3 hours, using a small state file; add a --status option that shows every check and its result.\nShow me the script and run --status. Then schedule it every hour at minute 30, as a job that sends its output to me on Telegram without calling an AI model.\n<\/code><\/pre>\n<p><strong>You know it works when<\/strong> <code>--status<\/code> shows all three checks as green, and you get no message.<\/p>\n<h2>Break It on Purpose<\/h2>\n<p><em>15 minutes, both courses.<\/em><\/p>\n<p><strong>A check that has never gone red has not been tested.<\/strong> In September 2026 Annie's watchdog gained a check that her skill scripts had not been changed by accident. Her builder changed one script on purpose. The check went red, and the script was put back. On its first real run, the same check found a real script that had gone out of date (Build Log 106).<\/p>\n<p><strong>Plant the fault on a copy, never on the live system you depend on<\/strong> (Build Log 65).<\/p>\n<h3>Full Course<\/h3>\n<ol>\n<li>Ask the builder to point a copy of the watchdog at an empty test folder in place of the backup folder.<\/li>\n<li>Run the copy with <code>--status<\/code>. The backup check should go red, because the test folder has no backup. <em>[FABLE EDIT, 13 Oct 2026. Third session, after the screenshot check. Not yet approved by Annie: \"Check 2\" became \"the backup check\". Annie's rule: never point back by number.]<\/em><\/li>\n<li>Read the alert. Does it end with the one thing to do?<\/li>\n<li>Delete the copy.<\/li>\n<li>Run the real watchdog with <code>--status<\/code>. All three checks should be green.<\/li>\n<\/ol>\n<h3>Short Course<\/h3>\n<ol>\n<li>Copy your <code>My AI Assistant<\/code> folder to a test folder. Work in the copy.<\/li>\n<li>Plant one fault. Choose one:\n   - Change one word in <code>AGENTS.md<\/code>, so one rule says something wrong.\n   - Move one file out of <code>My Files/<\/code>.<\/li>\n<li>Open the AI assistant in the test folder. Ask your three golden questions.<\/li>\n<li>Write down which question caught the fault, and which questions still looked fine.<\/li>\n<\/ol>\n<h3>Both Courses<\/h3>\n<p><strong>The check that stayed silent is the most useful answer.<\/strong> It shows you a failure your checks cannot see. Write it down in your build log, under \"what my checks cannot see\".<\/p>\n<p><strong>Then fix the fault and check again.<\/strong> Every check should go green. If one stays red after the fault is fixed, the check itself is broken.<\/p>\n<p><strong>Check the alarm against reality, too.<\/strong><\/p>\n<ul>\n<li>In September 2026 Toby reported 292 broken links in Annie's vault. Only 15 were real.<\/li>\n<li>The checker was misreading three kinds of link that were correct.<\/li>\n<li>Claude nearly changed 234 rows of Annie's storage list to match the checker. That would have broken working links (Build Log 79).<\/li>\n<li>About a week later, Toby reported 249 broken photo links, and this time he was right (Build Log 85).<\/li>\n<\/ul>\n<p>Neither the alarm nor the silence is proof. Look at what the alarm points to.<\/p>\n<h2>Set a Spending Cap<\/h2>\n<p><em>5 minutes, both courses.<\/em><\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 14, approved by Annie on 13 Oct 2026: two paragraphs rewritten from \"I\" to \"Annie\", the voice of every other module. The old text is in FABLE-EDITS.md. AUDIT.md, Finding 14.]<\/em><\/p>\n<p><strong>What it costs Annie.<\/strong> On average, her whole setup costs about $57 a month, measured from June to August 2026. That covers three bots, a server and the subscriptions behind them. The opener's table shows the full list price with every plan included, about $70. You can do this course for $0.<\/p>\n<p><strong>Why a spending cap matters.<\/strong> In September 2026, Annie's bill was close to $80 instead of the usual $57. Two things happened. First, she was trying her AI assistant on Claude Sonnet, which costs more than the open-weight models she normally uses. Second, she had built a script on her server named Toby, her system maintenance checker. Toby is also built to fix some problems automatically. By mistake, the automatic fixes used her API key instead of her Claude Pro subscription, so they billed the API. She found out because she had set a $20 monthly limit on her API key. When the limit was used up, Anthropic paused the key and emailed her.<\/p>\n<p><em>(The opener (Module 00) showed the cap. This is the full story. The arithmetic is in the handout.)<\/em><\/p>\n<p><strong>Find the cause before you raise a cap (Build Log 89).<\/strong> Claude's first advice was to raise the cap to $30. That was wrong. The account would have run out again within days, before the cause was fixed.<\/p>\n<p><strong>Cap the job, not only the account.<\/strong> The first run of Annie's company-watch job had no limit. It used 92 credits and never finished. Limited to 14 calls, it finished in 12 and used 21 credits (<code>Firecrawl — Use Cases<\/code> note). Her rule for Firecrawl: warn before the limit, and never top up automatically (Annie's Firecrawl notes).<\/p>\n<p><strong>Exercise.<\/strong><\/p>\n<ol>\n<li>List every account you pay for: server, AI plans, model provider, sync and any web service.<\/li>\n<li>Mark each one: does it charge a flat monthly price, or per use?<\/li>\n<li>A flat price cannot surprise you. Write its price on your run card.<\/li>\n<li>Every account that charges per use gets a cap today. Set it at the figure that would annoy you, not the one that would hurt you.<\/li>\n<\/ol>\n<h2>From the Record<\/h2>\n<p>The five stories told in class are above. These two are for students who ask for more. The handout has the rest, one line each.<\/p>\n<p><strong>The check that only asked whether the job ran (Build Log 74).<\/strong> The watchdog checked that the inbox sorter ran, that the backups were fresh and that the folders existed. It never checked where the notes went. When a check of the result was added, it went red on the first run.<\/p>\n<p><strong>A model change that broke three jobs (Build Logs 92 and 94).<\/strong> In September 2026 Annie moved two of her three bots to a cheaper model from a new provider. The third was already on it. The move broke the teaching bot, the nightly inbox sorter and the calendar job. The cause was not the model. The keys and model names did not carry across from the old provider. A new watchdog check now catches a model name that its provider does not serve.<\/p>\n<h2>Worksheet: Keeping It Honest<\/h2>\n<table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Proof<\/th>\n<th>Course<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>I named one failure I have met, and its kind<\/td>\n<td>My notes<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Backup made, including logins, leaving out downloadable files<\/td>\n<td><code>unzip -l<\/code><\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>One file restored from the backup and opened<\/td>\n<td>My SOUL file opened from the test folder<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>The backup's receipt arrived: one line of ticks<\/td>\n<td>Telegram, after the first run<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Backup copied to a second place, one file restored<\/td>\n<td>Homework<\/td>\n<td>Short<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Watchdog runs every hour and is silent when green<\/td>\n<td><code>--status<\/code><\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Watchdog checks the bot, the backup and the Claude login<\/td>\n<td><code>--status<\/code> lists all three<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>A planted fault made a check go red<\/td>\n<td>I saw it go red<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>What my checks cannot see, written down<\/td>\n<td>My build log<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Every paid account listed, flat or per use<\/td>\n<td>The table below<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>A cap on every account that charges per use<\/td>\n<td>The account's settings page<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>My paid accounts:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Account<\/th>\n<th>Price per month<\/th>\n<th>Flat or per use?<\/th>\n<th>Cap set?<\/th>\n<th>Where the cap is set<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>What my checks cannot see:<\/strong><\/p>\n<ol>\n<li>\n<hr />\n<\/li>\n<li>\n<hr />\n<\/li>\n<\/ol>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 2: closing line added.]<\/em><\/p>\n<p><strong>Next: skills and schedules (Module 11).<\/strong> Your checks are in place. Now you add one job and one skill, safely.<\/p>\n<h2>Teaching Notes<\/h2>\n<ul>\n<li><strong>Break something real.<\/strong> A demonstration where nothing breaks teaches nothing. Plant the fault on your own build first, in front of the room.<\/li>\n<li><strong>The silent check is the lesson.<\/strong> Ask every student which check stayed green during the fault. That answer is worth more than the one that went red.<\/li>\n<li><strong>Do not fix the system during the fault.<\/strong> Watch it fail first. Fix it after.<\/li>\n<li><strong>The restore is the step students skip.<\/strong> Ask each Full course student to show you their SOUL file opened from the backup.<\/li>\n<li><strong>Short course students may have no paid account that charges per use.<\/strong> opencode Go is a flat $10 a month. That is a good answer: write it on the run card and move on.<\/li>\n<li><strong>Three students at most.<\/strong> Sit beside each one during the planted fault.<\/li>\n<li><strong>Timing risk:<\/strong> the backup runs long if a student tries to connect a cloud account in class. Keep it on the server today. The copy kept somewhere else is homework.<\/li>\n<\/ul>"}, {"id": "full-14", "title": "10: Handout, What Broke in Annie's System", "handout": true, "html": "<h1>What Broke in Annie's System<\/h1>\n<p><em>A handout for Module 10, both courses. One page, read at home. Each line is one real failure from Annie's build logs, with the log number. The stories told in class are not repeated here.<\/em><\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 4, approved by Annie on 13 Oct 2026. In this file: 0 changes, 0 editor notes and the sections Sources, Related moved to <code>editor-notes/10 — Handout, Editor's Notes.md<\/code>. Every change, with its old and new text, is listed in FABLE-EDITS.md.]<\/em><\/p>\n<h2>Two Rules<\/h2>\n<ol>\n<li><strong>Check the result, not the report.<\/strong> A job saying \"done\" is not proof. Open the file, list the folder or read the message it produced.<\/li>\n<li><strong>The job that does the work must not be the only thing that checks it.<\/strong> Use something separate: a second check, a separate measurement, or a person looking.<\/li>\n<\/ol>\n<h2>It Stopped<\/h2>\n<ul>\n<li><strong>Log 14:<\/strong> an error handler that caught every error hid a missing import. So the sync function crashed on every call and had never worked once.<\/li>\n<li><strong>Log 43:<\/strong> the daily learning card crashed, because the bot re-saved its own file in a shape the script could not read.<\/li>\n<li><strong>Log 44:<\/strong> the vault sync jammed for six hours behind one frozen process.<\/li>\n<li><strong>Log 58:<\/strong> a vault reorganisation broke file addresses in four ways, including links outside the vault that a vault search could not find.<\/li>\n<li><strong>Log 61:<\/strong> three Google accounts failed with the same error. One account failing points to its login. Every account failing points to the app.<\/li>\n<li><strong>Log 75:<\/strong> the server's Claude login expired without warning after about 30 days, while chat on the phone still worked. The watchdog now warns 4 days ahead.<\/li>\n<li><strong>Log 94:<\/strong> moving to a new model provider broke three jobs, because keys and model names did not carry across. Only two of the three bots had changed model (Log 92).<\/li>\n<\/ul>\n<h2>It Ran, but Did the Wrong Thing<\/h2>\n<ul>\n<li><strong>Log 04:<\/strong> the nightly sorter suggested the same inbox notes again every night.<\/li>\n<li><strong>Log 37:<\/strong> a second \"10 pm\" reminder that nobody had scheduled turned out to be the bot re-sending files when Annie replied \"done\".<\/li>\n<li><strong>Log 51:<\/strong> a folder move left the old address in three files, so the bot found no deal documents for three weeks and said nothing.<\/li>\n<li><strong>Log 57:<\/strong> adding one storage unit meant editing five places. Missing any one would leave a gap nobody would see.<\/li>\n<li><strong>Log 71:<\/strong> before five notes were deleted, a search of the whole vault found one other note linking to all five. It was fixed first. This failure was prevented.<\/li>\n<li><strong>Log 85:<\/strong> the watchdog reported 249 broken photo links, and they were real. No step copied the photos into the vault.<\/li>\n<\/ul>\n<h2>It Said It Worked When It Did Not<\/h2>\n<ul>\n<li><strong>Log 25:<\/strong> after 36 days with no restarts, the bot looked healthy. Its sorter was failing on a usage limit, and its memory was full: 2,201 of 2,200 characters.<\/li>\n<li><strong>Log 30:<\/strong> a builder reported all tests passing. Its invoice code had 6 bugs, 4 of them fatal, and the main path had never run from start to finish.<\/li>\n<li><strong>Log 42:<\/strong> the bot fixed its rules correctly, but the job's own stored instruction said \"EXACTLY this format\". So the morning message never changed.<\/li>\n<li><strong>Log 45:<\/strong> a nightly sync reported success for about four weeks while copying zero files. A folder move in July had broken its path.<\/li>\n<li><strong>Log 84:<\/strong> the bot sometimes said \"got it\" without saving the note. Now it saves, checks the file exists, and replies with where it saved it.<\/li>\n<li><strong>Log 90:<\/strong> \"save\" and \"write a build log\" became scripts that check their own writes on the disk. This failure was prevented.<\/li>\n<\/ul>\n<h2>The Checker Failed Too<\/h2>\n<ul>\n<li><strong>Log 66:<\/strong> the watchdog's first version ended with an error code when it found a problem. Then it reported its own job as failed, again and again.<\/li>\n<li><strong>Log 73:<\/strong> the bot must now report a failure in the same message. The watchdog looks for the failures nobody sees, every hour, at no cost.<\/li>\n<li><strong>Log 87:<\/strong> the cost meter logged every call to two Claude models at $0 for two months, because its price list did not include them.<\/li>\n<li><strong>Log 88:<\/strong> the watchdog now fixes broken vault links itself, with a $1 limit. It reports \"fixed\" only after its own check passes.<\/li>\n<li><strong>Log 102:<\/strong> the watchdog twice reported two healthy bots as down, because it read old status files.<\/li>\n<\/ul>\n<h2>Backups<\/h2>\n<ul>\n<li><strong>Log 21:<\/strong> the backup has three layers: a nightly copy on the server, a copy on Google Drive, and one short receipt every night. Until October 2026 it messaged only when it failed. No AI model is involved. <em>[FABLE EDIT, 13 Oct 2026. Annie chose on 13 Oct 2026 to teach the nightly receipt, the way her live system works since October 2026. AUDIT.md, question 2. ]<\/em><\/li>\n<li><strong>Log 101:<\/strong> 59 files, including 13 baby-book photos, existed only on Annie's Mac. A daily copy from the Mac to the server now runs.<\/li>\n<\/ul>\n<h2>When a Bot Looks Fine but Is Stuck<\/h2>\n<ul>\n<li><strong>Log 78:<\/strong> one of Annie's bots showed as \"running\" for 12 hours while receiving nothing. Its program never stopped, so the automatic restart never started.<\/li>\n<li>A healthy bot keeps at least 2 open connections to Telegram. A stuck one keeps none.<\/li>\n<li>A separate script now checks every 5 minutes and restarts a bot with no connections. If it has to restart the same bot 3 times in 2 hours, it tells Annie.<\/li>\n<li><strong>Keep the list of automatic fixes short.<\/strong> Toby fixes only a few kinds of problem by himself. A dead backup, a stuck bot or an expired login still go to Annie (Log 88).<\/li>\n<\/ul>\n<h2>Keys and Passwords<\/h2>\n<ul>\n<li><strong>Never print a key.<\/strong> When you look at settings, show the names of keys, not their values (Log 103).<\/li>\n<li><strong>Keep each key in one place.<\/strong> A key copied into several files must be changed in all of them. A half-finished change stops bots without warning (Log 103).<\/li>\n<li><strong>Change a key when any of these happens<\/strong> (Annie's notes, 30 Sep 2026):\n  1. A session is shared or shown to anyone.\n  2. A new device joins your private network.\n  3. A paid balance falls faster than your use explains.\n  4. The server gains a second user.<\/li>\n<\/ul>\n<h2>Cost<\/h2>\n<ul>\n<li><strong>Log 36:<\/strong> measured from three meters in July 2026, running costs were about $14 a month in AI use plus $18 for the server. Building it cost about $85 to $90.<\/li>\n<\/ul>\n<p><strong>September 2026, in full.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Line<\/th>\n<th>Amount<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Fixed subscriptions: server, server backup, Claude Pro, Obsidian Sync, VPN, the $10 model plan for the bots<\/td>\n<td>$55.67<\/td>\n<\/tr>\n<tr>\n<td>Bot use recorded by each bot's meter (the biggest line: the main bot on Claude Sonnet, $8.36)<\/td>\n<td>$11.55<\/td>\n<\/tr>\n<tr>\n<td><strong>Recorded by the cost note<\/strong><\/td>\n<td><strong>$67.22<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Anthropic API bill not recorded: $20.61, less the $8.36 already counted<\/td>\n<td>$12.25<\/td>\n<\/tr>\n<tr>\n<td><strong>Real total<\/strong><\/td>\n<td><strong>$79.47<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>Of the $12.25, about $11 most likely came from Toby's automatic fixes using the API key by mistake, plus testing that day. One run by another assistant cost $1.30 (Build Log 89).<\/li>\n<li>June, July and August 2026 were $56.65, $55.69 and $57.97. That is about $57 on average. Months before 24 September may read slightly low, because the meter priced some Claude calls at $0 until then (Build Log 87).<\/li>\n<\/ul>"}, {"id": "full-15", "title": "11: Growing It, Skills and Schedules", "handout": false, "html": "<h1>Module 11: Growing It, Skills and Schedules<\/h1>\n<p><strong>How to read this file.<\/strong><\/p>\n<ul>\n<li>This is the master copy for both courses.<\/li>\n<li>The Full course runs every segment with minutes in its column.<\/li>\n<li>The Short course runs only the segments with minutes in its column.<\/li>\n<li>Extra material that is useful after the course is in the handout, <code>11 — Handout, More Ways to Grow Your System<\/code>.<\/li>\n<\/ul>\n<p><strong>Why this module comes here.<\/strong><\/p>\n<ol>\n<li>Students now own a working system (Module 08, and Module 08B in the Full course).<\/li>\n<li>They have sorted their steps into script, model and person (Module 09).<\/li>\n<li>They have seen how a system fails and how a check catches it (Module 10).<\/li>\n<li>So now they can add to it safely.<\/li>\n<\/ol>\n<p><strong>What each course builds.<\/strong><\/p>\n<ul>\n<li><strong>Full course (server):<\/strong> a scheduled job that sends a message to Telegram, then a skill. Each one is tested before the next one starts.<\/li>\n<li><strong>Short course (laptop):<\/strong> a skill in pi, then a Gemini skill and a Gemini scheduled action. Gemini runs on Google's computers, not on the laptop. So the scheduled action runs every morning even when the laptop is closed or switched off.<\/li>\n<\/ul>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 8, approved by Annie on 13 Oct 2026: the Short course now builds its Gemini skill and scheduled action here. Annie chose on 13 Oct 2026 what a Short student leaves with. Short course 65 to 80 minutes.]<\/em><\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 4, approved by Annie on 13 Oct 2026. In this file: 1 changes, 1 editor notes and the sections Where the Versions Went, Sources, Related moved to <code>editor-notes/11 — Editor's Notes.md<\/code>. Every change, with its old and new text, is listed in FABLE-EDITS.md.]<\/em><\/p>\n<h2>Run Sheet<\/h2>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 13, approved by Annie on 13 Oct 2026: every check in this file now starts \"You know it works when\". AUDIT.md, Finding 13. The old wording of each line is in <code>proposals/13 — One Phrase for Every Check.md<\/code>.]<\/em><\/p>\n<p>Full course: 85 minutes. Short course: 75 minutes. A dash means the segment is not in that course.<\/p>\n<table>\n<thead>\n<tr>\n<th>Full (min)<\/th>\n<th>Short (min)<\/th>\n<th>Segment<\/th>\n<th>Facilitator does<\/th>\n<th>Students do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>—<\/td>\n<td>15<\/td>\n<td>Finish the Build Brief<\/td>\n<td>Walks the five new rows<\/td>\n<td>Add the five rows to their brief<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>10<\/td>\n<td>Add one thing at a time, and saying no to a new tool<\/td>\n<td>Tells the Log 00 and Log 28 stories<\/td>\n<td>Write down one tool they are tempted by, and answer two questions about it<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>—<\/td>\n<td>How a scheduled job sends its message<\/td>\n<td>Explains the print rule<\/td>\n<td>Check their brief against it<\/td>\n<\/tr>\n<tr>\n<td>40<\/td>\n<td>—<\/td>\n<td>Build the scheduled job<\/td>\n<td>Walks the room; checks every script has a trial run<\/td>\n<td>Build, test and schedule the job<\/td>\n<\/tr>\n<tr>\n<td>20<\/td>\n<td>25<\/td>\n<td>Build and test one skill<\/td>\n<td>Shows a finished skill file<\/td>\n<td>Write the skill and test it three ways<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>—<\/td>\n<td>Shown, not built: a model on a schedule<\/td>\n<td>Shows how Annie's system does it<\/td>\n<td>Listen<\/td>\n<\/tr>\n<tr>\n<td>—<\/td>\n<td>20<\/td>\n<td>Build your Gemini skill and scheduled action<\/td>\n<td>Walks the room through the three steps<\/td>\n<td>Build the skill, schedule it, test it on the phone<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>—<\/td>\n<td>Set the keep-or-kill date<\/td>\n<td>Explains the two-week question<\/td>\n<td>Put the date in their calendar<\/td>\n<\/tr>\n<tr>\n<td>—<\/td>\n<td>5<\/td>\n<td>The server question<\/td>\n<td>Explains what a server gives and what it costs<\/td>\n<td>Answer it in one sentence on the run card<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>How the minutes add up.<\/strong><\/p>\n<ul>\n<li><strong>Full course: 85 minutes.<\/strong> One thing at a time takes 10 minutes. The print rule takes 5. The scheduled job takes 40: the script and its trial run 20, the labelled test 5, the schedule and one run through it 15. The skill takes 20. The model on a schedule takes 5. The keep-or-kill date takes 5.<\/li>\n<li><strong>Short course: 75 minutes.<\/strong> Finishing the brief takes 15 minutes. One thing at a time takes 10. The skill takes 25, because it is the first thing the student builds from a brief. The Gemini skill and scheduled action take 20: the skill 10, the schedule 5, the phone test 5. The server question takes 5.<\/li>\n<\/ul>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Annie chose the 10-hour cut on 13 Oct 2026: the server question 10 to 5 minutes. Short course 80 to 75. The sum line said 65, which was stale since Proposal 8.]<\/em><\/p>\n<p><strong>The Full course runs 963 minutes, about 16 hours.<\/strong> Annie chose on 10 Oct 2026 to build the skill in class, because Full course students will be builders too. <em>[FABLE EDIT, 13 Oct 2026. Proposal 14, approved by Annie on 13 Oct 2026: the total was \"about 15 minutes over\", and the sentence \"The cut will be found once Module 12 is written\" is gone. AUDIT.md, Finding 16.]<\/em><\/p>\n<h2>What You Will Leave With<\/h2>\n<p><strong>Both courses:<\/strong><\/p>\n<ul>\n<li>One skill that works when you ask for it, tested three ways.<\/li>\n<li>One tool you decided not to add, with your reason written down.<\/li>\n<\/ul>\n<p><strong>Full course only:<\/strong><\/p>\n<ul>\n<li>One scheduled job that runs without you and sends its result to Telegram. It stays silent when there is nothing to say, and it tells you when it fails.<\/li>\n<li>A keep-or-kill date in your calendar, two weeks from today.<\/li>\n<\/ul>\n<p><strong>Short course only:<\/strong><\/p>\n<ul>\n<li>A finished Build Brief, with the five rows that make it safe to build.<\/li>\n<li>A Gemini skill that writes your morning message, and a scheduled action that sends it to your phone every weekday.<\/li>\n<li>A one-sentence answer to the question \"do I need a server?\"<\/li>\n<\/ul>\n<h2>Before This Module<\/h2>\n<ul>\n<li><strong>Full course:<\/strong> your server and bot from Module 08B, working. Build Brief 1 from Module 09.<\/li>\n<li><strong>Short course:<\/strong> your AI assistant from Module 08, working on your laptop. The five-row Build Brief you wrote at home after Module 09. The Gemini homework done, from the handout <code>11 — Handout, Your Gemini Morning Message (Short Course)<\/code>: Gemini Pro paid for, your calendar connected, your instructions for Gemini written, and the Gemini app on your phone.<\/li>\n<
