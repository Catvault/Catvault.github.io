\n<p><strong>What it costs Annie.<\/strong> On average, her whole setup costs about $57 a month, measured from June to August 2026. That covers three bots, a server and the subscriptions behind them. The opener's table shows the full list price with every plan included, about $70. You can do this course for $0.<\/p>\n<p><strong>Why a spending cap matters.<\/strong> In September 2026, Annie's bill was close to $80 instead of the usual $57. Two things happened. First, she was trying her AI assistant on Claude Sonnet, which costs more than the open-weight models she normally uses. Second, she had built a script on her server named Toby, her system maintenance checker. Toby is also built to fix some problems automatically. By mistake, the automatic fixes used her API key instead of her Claude Pro subscription, so they billed the API. She found out because she had set a $20 monthly limit on her API key. When the limit was used up, Anthropic paused the key and emailed her.<\/p>\n<p><em>(The opener (Module 00) showed the cap. This is the full story. The arithmetic is in the handout.)<\/em><\/p>\n<p><strong>Find the cause before you raise a cap (Build Log 89).<\/strong> Claude's first advice was to raise the cap to $30. That was wrong. The account would have run out again within days, before the cause was fixed.<\/p>\n<p><strong>Cap the job, not only the account.<\/strong> The first run of Annie's company-watch job had no limit. It used 92 credits and never finished. Limited to 14 calls, it finished in 12 and used 21 credits (<code>Firecrawl — Use Cases<\/code> note). Her rule for Firecrawl: warn before the limit, and never top up automatically (Annie's Firecrawl notes).<\/p>\n<p><strong>Exercise.<\/strong><\/p>\n<ol>\n<li>List every account you pay for: server, AI plans, model provider, sync and any web service.<\/li>\n<li>Mark each one: does it charge a flat monthly price, or per use?<\/li>\n<li>A flat price cannot surprise you. Write its price on your run card.<\/li>\n<li>Every account that charges per use gets a cap today. Set it at the figure that would annoy you, not the one that would hurt you.<\/li>\n<\/ol>\n<h2>From the Record<\/h2>\n<p>The five stories told in class are above. These two are for students who ask for more. The handout has the rest, one line each.<\/p>\n<p><strong>The check that only asked whether the job ran (Build Log 74).<\/strong> The watchdog checked that the inbox sorter ran, that the backups were fresh and that the folders existed. It never checked where the notes went. When a check of the result was added, it went red on the first run.<\/p>\n<p><strong>A model change that broke three jobs (Build Logs 92 and 94).<\/strong> In September 2026 Annie moved two of her three bots to a cheaper model from a new provider. The third was already on it. The move broke the teaching bot, the nightly inbox sorter and the calendar job. The cause was not the model. The keys and model names did not carry across from the old provider. A new watchdog check now catches a model name that its provider does not serve.<\/p>\n<h2>Worksheet: Keeping It Honest<\/h2>\n<table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Proof<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>I named one failure I have met, and its kind<\/td>\n<td>My notes<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Backup copied to a second place, one file restored<\/td>\n<td>Homework<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>A planted fault made a check go red<\/td>\n<td>I saw it go red<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>What my checks cannot see, written down<\/td>\n<td>My build log<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Every paid account listed, flat or per use<\/td>\n<td>The table below<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>A cap on every account that charges per use<\/td>\n<td>The account's settings page<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>My paid accounts:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Account<\/th>\n<th>Price per month<\/th>\n<th>Flat or per use?<\/th>\n<th>Cap set?<\/th>\n<th>Where the cap is set<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>What my checks cannot see:<\/strong><\/p>\n<ol>\n<li>\n<hr />\n<\/li>\n<li>\n<hr />\n<\/li>\n<\/ol>\n<p><strong>Next: skills and schedules (Module 11).<\/strong> Your checks are in place. Now you turn your job into a skill, and build your Gemini morning message.<\/p>\n<h2>Teaching Notes<\/h2>\n<ul>\n<li><strong>Break something real.<\/strong> A demonstration where nothing breaks teaches nothing. Plant the fault on your own build first, in front of the room.<\/li>\n<li><strong>The silent check is the lesson.<\/strong> Ask every student which check stayed green during the fault. That answer is worth more than the one that went red.<\/li>\n<li><strong>Do not fix the system during the fault.<\/strong> Watch it fail first. Fix it after.<\/li>\n<li><strong>The restore is the step students skip.<\/strong> At the next session, ask each student to show you the file they restored from their backup.<\/li>\n<li><strong>Students may have no paid account that charges per use.<\/strong> opencode Go is a flat $10 a month. That is a good answer: write it on the run card and move on.<\/li>\n<li><strong>Three students at most.<\/strong> Sit beside each one during the planted fault.<\/li>\n<\/ul>"}, {"id": "short-13", "title": "10: Handout, What Broke in Annie's System", "handout": true, "html": "<h1>What Broke in Annie's System<\/h1>\n<p><em>A handout for Module 10, both courses. One page, read at home. Each line is one real failure from Annie's build logs, with the log number. The stories told in class are not repeated here.<\/em><\/p>\n<h2>Two Rules<\/h2>\n<ol>\n<li><strong>Check the result, not the report.<\/strong> A job saying \"done\" is not proof. Open the file, list the folder or read the message it produced.<\/li>\n<li><strong>The job that does the work must not be the only thing that checks it.<\/strong> Use something separate: a second check, a separate measurement, or a person looking.<\/li>\n<\/ol>\n<h2>It Stopped<\/h2>\n<ul>\n<li><strong>Log 14:<\/strong> an error handler that caught every error hid a missing import. So the sync function crashed on every call and had never worked once.<\/li>\n<li><strong>Log 43:<\/strong> the daily learning card crashed, because the bot re-saved its own file in a shape the script could not read.<\/li>\n<li><strong>Log 44:<\/strong> the vault sync jammed for six hours behind one frozen process.<\/li>\n<li><strong>Log 58:<\/strong> a vault reorganisation broke file addresses in four ways, including links outside the vault that a vault search could not find.<\/li>\n<li><strong>Log 61:<\/strong> three Google accounts failed with the same error. One account failing points to its login. Every account failing points to the app.<\/li>\n<li><strong>Log 75:<\/strong> the server's Claude login expired without warning after about 30 days, while chat on the phone still worked. The watchdog now warns 4 days ahead.<\/li>\n<li><strong>Log 94:<\/strong> moving to a new model provider broke three jobs, because keys and model names did not carry across. Only two of the three bots had changed model (Log 92).<\/li>\n<\/ul>\n<h2>It Ran, but Did the Wrong Thing<\/h2>\n<ul>\n<li><strong>Log 04:<\/strong> the nightly sorter suggested the same inbox notes again every night.<\/li>\n<li><strong>Log 37:<\/strong> a second \"10 pm\" reminder that nobody had scheduled turned out to be the bot re-sending files when Annie replied \"done\".<\/li>\n<li><strong>Log 51:<\/strong> a folder move left the old address in three files, so the bot found no deal documents for three weeks and said nothing.<\/li>\n<li><strong>Log 57:<\/strong> adding one storage unit meant editing five places. Missing any one would leave a gap nobody would see.<\/li>\n<li><strong>Log 71:<\/strong> before five notes were deleted, a search of the whole vault found one other note linking to all five. It was fixed first. This failure was prevented.<\/li>\n<li><strong>Log 85:<\/strong> the watchdog reported 249 broken photo links, and they were real. No step copied the photos into the vault.<\/li>\n<\/ul>\n<h2>It Said It Worked When It Did Not<\/h2>\n<ul>\n<li><strong>Log 25:<\/strong> after 36 days with no restarts, the bot looked healthy. Its sorter was failing on a usage limit, and its memory was full: 2,201 of 2,200 characters.<\/li>\n<li><strong>Log 30:<\/strong> a builder reported all tests passing. Its invoice code had 6 bugs, 4 of them fatal, and the main path had never run from start to finish.<\/li>\n<li><strong>Log 42:<\/strong> the bot fixed its rules correctly, but the job's own stored instruction said \"EXACTLY this format\". So the morning message never changed.<\/li>\n<li><strong>Log 45:<\/strong> a nightly sync reported success for about four weeks while copying zero files. A folder move in July had broken its path.<\/li>\n<li><strong>Log 84:<\/strong> the bot sometimes said \"got it\" without saving the note. Now it saves, checks the file exists, and replies with where it saved it.<\/li>\n<li><strong>Log 90:<\/strong> \"save\" and \"write a build log\" became scripts that check their own writes on the disk. This failure was prevented.<\/li>\n<\/ul>\n<h2>The Checker Failed Too<\/h2>\n<ul>\n<li><strong>Log 66:<\/strong> the watchdog's first version ended with an error code when it found a problem. Then it reported its own job as failed, again and again.<\/li>\n<li><strong>Log 73:<\/strong> the bot must now report a failure in the same message. The watchdog looks for the failures nobody sees, every hour, at no cost.<\/li>\n<li><strong>Log 87:<\/strong> the cost meter logged every call to two Claude models at $0 for two months, because its price list did not include them.<\/li>\n<li><strong>Log 88:<\/strong> the watchdog now fixes broken vault links itself, with a $1 limit. It reports \"fixed\" only after its own check passes.<\/li>\n<li><strong>Log 102:<\/strong> the watchdog twice reported two healthy bots as down, because it read old status files.<\/li>\n<\/ul>\n<h2>Backups<\/h2>\n<ul>\n<li><strong>Log 21:<\/strong> the backup has three layers: a nightly copy on the server, a copy on Google Drive, and one short receipt every night. Until October 2026 it messaged only when it failed. No AI model is involved.<\/li>\n<li><strong>Log 101:<\/strong> 59 files, including 13 baby-book photos, existed only on Annie's Mac. A daily copy from the Mac to the server now runs.<\/li>\n<\/ul>\n<h2>When a Bot Looks Fine but Is Stuck<\/h2>\n<ul>\n<li><strong>Log 78:<\/strong> one of Annie's bots showed as \"running\" for 12 hours while receiving nothing. Its program never stopped, so the automatic restart never started.<\/li>\n<li>A healthy bot keeps at least 2 open connections to Telegram. A stuck one keeps none.<\/li>\n<li>A separate script now checks every 5 minutes and restarts a bot with no connections. If it has to restart the same bot 3 times in 2 hours, it tells Annie.<\/li>\n<li><strong>Keep the list of automatic fixes short.<\/strong> Toby fixes only a few kinds of problem by himself. A dead backup, a stuck bot or an expired login still go to Annie (Log 88).<\/li>\n<\/ul>\n<h2>Keys and Passwords<\/h2>\n<ul>\n<li><strong>Never print a key.<\/strong> When you look at settings, show the names of keys, not their values (Log 103).<\/li>\n<li><strong>Keep each key in one place.<\/strong> A key copied into several files must be changed in all of them. A half-finished change stops bots without warning (Log 103).<\/li>\n<li><strong>Change a key when any of these happens<\/strong> (Annie's notes, 30 Sep 2026):\n  1. A session is shared or shown to anyone.\n  2. A new device joins your private network.\n  3. A paid balance falls faster than your use explains.\n  4. The server gains a second user.<\/li>\n<\/ul>\n<h2>Cost<\/h2>\n<ul>\n<li><strong>Log 36:<\/strong> measured from three meters in July 2026, running costs were about $14 a month in AI use plus $18 for the server. Building it cost about $85 to $90.<\/li>\n<\/ul>\n<p><strong>September 2026, in full.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Line<\/th>\n<th>Amount<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Fixed subscriptions: server, server backup, Claude Pro, Obsidian Sync, VPN, the $10 model plan for the bots<\/td>\n<td>$55.67<\/td>\n<\/tr>\n<tr>\n<td>Bot use recorded by each bot's meter (the biggest line: the main bot on Claude Sonnet, $8.36)<\/td>\n<td>$11.55<\/td>\n<\/tr>\n<tr>\n<td><strong>Recorded by the cost note<\/strong><\/td>\n<td><strong>$67.22<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Anthropic API bill not recorded: $20.61, less the $8.36 already counted<\/td>\n<td>$12.25<\/td>\n<\/tr>\n<tr>\n<td><strong>Real total<\/strong><\/td>\n<td><strong>$79.47<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>Of the $12.25, about $11 most likely came from Toby's automatic fixes using the API key by mistake, plus testing that day. One run by another assistant cost $1.30 (Build Log 89).<\/li>\n<li>June, July and August 2026 were $56.65, $55.69 and $57.97. That is about $57 on average. Months before 24 September may read slightly low, because the meter priced some Claude calls at $0 until then (Build Log 87).<\/li>\n<\/ul>"}, {"id": "short-14", "title": "11: Growing It, Skills and Schedules", "handout": false, "html": "<h1>Module 11: Growing It, Skills and Schedules<\/h1>\n<p><strong>How to read this file.<\/strong> This is the Short course copy: 10 hours over three days, built with pi on your laptop and Gemini on your phone. Every segment in it is taught. The master copy for both courses is in <code>modules/<\/code>.<\/p>\n<ul>\n<li>Extra material that is useful after the course is in the handout, <code>11 — Handout, More Ways to Grow Your System (Short)<\/code>.<\/li>\n<li>The Gemini homework is in the handout, <code>11 — Handout, Your Gemini Morning Message (Short)<\/code>.<\/li>\n<\/ul>\n<p><strong>Why this module comes here.<\/strong><\/p>\n<ol>\n<li>Students now own a working system (Module 08).<\/li>\n<li>They have sorted their steps into script, model and person (Module 09).<\/li>\n<li>They have seen how a system fails and how a check catches it (Module 10).<\/li>\n<li>So now they can add to it safely.<\/li>\n<\/ol>\n<p><strong>What you build today.<\/strong> A skill in pi, then a Gemini skill and a Gemini scheduled action. Gemini runs on Google's computers, not on the laptop. So the scheduled action runs every morning even when the laptop is closed or switched off.<\/p>\n<h2>Run Sheet<\/h2>\n<p>75 minutes.<\/p>\n<table>\n<thead>\n<tr>\n<th>Min<\/th>\n<th>Segment<\/th>\n<th>Facilitator does<\/th>\n<th>Students do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>15<\/td>\n<td>Finish the Build Brief<\/td>\n<td>Walks the five new rows<\/td>\n<td>Add the five rows to their brief<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Add one thing at a time, and saying no to a new tool<\/td>\n<td>Tells the Log 00 and Log 28 stories<\/td>\n<td>Write down one tool they are tempted by, and answer two questions about it<\/td>\n<\/tr>\n<tr>\n<td>25<\/td>\n<td>Build and test one skill<\/td>\n<td>Shows a finished skill file<\/td>\n<td>Write the skill and test it three ways<\/td>\n<\/tr>\n<tr>\n<td>20<\/td>\n<td>Build your Gemini skill and scheduled action<\/td>\n<td>Walks the room through the three steps<\/td>\n<td>Build the skill, schedule it, test it on the phone<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>The server question<\/td>\n<td>Explains what a server gives and what it costs<\/td>\n<td>Answer it in one sentence on the run card<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>How the minutes add up.<\/strong><\/p>\n<ul>\n<li><strong>75 minutes.<\/strong> Finishing the brief takes 15 minutes. One thing at a time takes 10. The skill takes 25, because it is the first thing the student builds from a brief. The Gemini skill and scheduled action take 20: the skill 10, the schedule 5, the phone test 5. The server question takes 5.<\/li>\n<\/ul>\n<h2>What You Will Leave With<\/h2>\n<ul>\n<li>One skill that works when you ask for it, tested three ways.<\/li>\n<li>\n<p>One tool you decided not to add, with your reason written down.<\/p>\n<\/li>\n<li>\n<p>A finished Build Brief, with the five rows that make it safe to build.<\/p>\n<\/li>\n<li>A Gemini skill that writes your morning message, and a scheduled action that sends it to your phone every weekday.<\/li>\n<li>A one-sentence answer to the question \"do I need a server?\"<\/li>\n<li>A keep-or-kill date in your calendar, two weeks from today.<\/li>\n<\/ul>\n<h2>Before This Module<\/h2>\n<ul>\n<li>Your AI assistant from Module 08, working on your laptop. The five-row Build Brief you wrote at home after Module 09. The Gemini homework done, from the handout <code>11 — Handout, Your Gemini Morning Message (Short)<\/code>: Gemini Pro paid for, your calendar connected, your instructions for Gemini written, and the Gemini app on your phone.<\/li>\n<li>Your run card.<\/li>\n<\/ul>\n<p><strong>If your brief is not ready, use the umbrella example.<\/strong> It answers one question: do I need an umbrella today in Hong Kong? It uses the free Open-Meteo weather service, which needs no account and no key. It is a small version of Annie's own weather job (Build Log 35).<\/p>\n<h2>Finish the Build Brief<\/h2>\n<p><em>15 minutes.<\/em><\/p>\n<p>Your brief from Module 09 says what the job does. These five rows say what keeps it safe. Write them before anything is built, because the builder works from the brief.<\/p>\n<table>\n<thead>\n<tr>\n<th>Row<\/th>\n<th>What to write<\/th>\n<th>Why it matters<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Must never do<\/strong><\/td>\n<td>For example: send anything to another person; delete anything; touch Tier 3 information<\/td>\n<td>The AI assistant follows written limits. It cannot follow limits you only meant.<\/td>\n<\/tr>\n<tr>\n<td><strong>Needs my approval before<\/strong><\/td>\n<td>Any step where the AI assistant should stop and ask you first<\/td>\n<td>You decide the risky steps. The AI assistant does the rest.<\/td>\n<\/tr>\n<tr>\n<td><strong>Acceptance checks<\/strong><\/td>\n<td>Three checks, written now. The builder never changes them.<\/td>\n<td>If the builder can change the test, a test pass proves nothing.<\/td>\n<\/tr>\n<tr>\n<td><strong>How to undo it<\/strong><\/td>\n<td>What you would do to remove it, in one or two lines<\/td>\n<td>If you cannot undo it, you will be afraid to try it.<\/td>\n<\/tr>\n<tr>\n<td><strong>Keep-or-kill date<\/strong><\/td>\n<td>Two weeks after it starts working<\/td>\n<td>On that date you ask one question: did I use it?<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Tier 3<\/strong> is the information that never goes into any AI tool, such as passwords, keys and bank numbers (Module 02).<\/p>\n<p><strong>Put the keep-or-kill date in your calendar now.<\/strong> Annie set this two-week test for her morning brief when it went live on 6 July 2026 (Build Log 27).<\/p>\n<p><strong>Your brief becomes a skill.<\/strong> It is the files job you built in Module 08, now with the five rows that keep it safe. The AI assistant does the job when you ask for it, with one phrase, instead of you typing the whole question each time. Later in this module you build it.<\/p>\n<h2>Add One Thing at a Time, and Saying No to a New Tool<\/h2>\n<p><em>10 minutes.<\/em><\/p>\n<h3>Add One Thing at a Time<\/h3>\n<p><strong>Add one new thing. Test it. Use it for a few days. Then add the next.<\/strong><\/p>\n<p><strong>Why:<\/strong> in May 2026 Annie's first bot broke down. Its cheap AI model could not use its tools reliably. It said tasks were done when they were not: the log calls this \"faked success\". Finding the fix took about a week of Annie's own research. The clean-up took 13 logged hours more (Build Log 00).<\/p>\n<p>The rule from her rebuild notes: <strong>\"Don't add features in batches.\"<\/strong> Version 2 started with three things: the soul file, the rules and one reminder. Her plan was to live with it for 24 to 48 hours before building more (Build Log 00).<\/p>\n<p><strong>The reason the rule works.<\/strong> If you add one thing and something breaks, there is one place to look. If you add three things, there are three places to look, and they can affect each other.<\/p>\n<p><strong>Today you add two things, in order.<\/strong> That is allowed, because you finish and test the pi skill before you start the Gemini build. Do not start the Gemini build until the pi skill has passed its three tests.<\/p>\n<h3>Saying No to a New Tool<\/h3>\n<p>New AI tools appear every week. Most of them will be offered to you as something you need.<\/p>\n<p><strong>Annie's example (Build Log 28).<\/strong> On 8 July 2026 someone she works with asked whether she used the Hermes desktop app. He said it could read all the files on her computer. She checked it and decided not to add it. Her four reasons:<\/p>\n<ol>\n<li><strong>She could already do it.<\/strong> Claude Code already read her files and her vault, and reached her server.<\/li>\n<li><strong>Her phone was already covered.<\/strong> Her bot on Telegram already reached her anywhere.<\/li>\n<li><strong>Her own setup was better.<\/strong> She asked: <em>\"even if I used Codex, wouldn't I just connect it to Obsidian or a shared folder both tools read, like I do now?\"<\/em> She was right. Her notes and rules live in her own vault, so any tool can read them, and no company holds them.<\/li>\n<li><strong>It would cost her more than it gave.<\/strong> It meant a second AI assistant that was not her main one, a new way into her system, and a large update to her live server.<\/li>\n<\/ol>\n<p><strong>Exercise.<\/strong> Write down one tool you have been tempted to add. Answer two questions:<\/p>\n<ol>\n<li>What would it let me do that I cannot do now?<\/li>\n<li>What would I have to look after if I added it?<\/li>\n<\/ol>\n<p>If the first answer is \"nothing new\", the answer is no for now. Write the reason on your run card.<\/p>\n<h2>Build and Test One Skill<\/h2>\n<p><em>25 minutes.<\/em><\/p>\n<p><strong>A skill is a written procedure that the AI assistant reads only when it is needed.<\/strong><\/p>\n<p><strong>Why skills exist (Build Log 19).<\/strong> The AI assistant's built-in memory is small. Annie's bot has 2,200 characters, and it reads all of them with every message. A six-step procedure saved there filled it, and left no room for facts. So the rule is: <strong>facts in memory, procedures in skills.<\/strong> The Full course met this rule in Module 07.<\/p>\n<h3>What a Skill Is<\/h3>\n<p>A skill is a folder. Inside it is one file, named exactly <code>SKILL.md<\/code>. The file starts with a short description, then the steps.<\/p>\n<p><strong>Three facts decide whether a skill works (Build Logs 90 and 98):<\/strong><\/p>\n<ol>\n<li><strong>The AI assistant reads only the name and description at the start.<\/strong> It reads the steps only when your request matches the description.<\/li>\n<li><strong>So the description must say when to use the skill, in the words you would type.<\/strong> A phrase that is not in the description will not start the skill. The limit is 1,024 characters. Annie's continuity and build-log skills use 914 and 1,004.<\/li>\n<li><strong>The file name must be exactly <code>SKILL.md<\/code>.<\/strong> In September 2026 one of Annie's skill folders held a backup copy named <code>SKILL.md.bak-20260929-170928<\/code>. The AI assistant could not see it, because the name was different (Build Log 98).<\/li>\n<\/ol>\n<p><strong>A skill is used reliably once your <code>AGENTS.md<\/code> points to it.<\/strong> On Annie's bot, a skill starting by itself has never been enough. Her client-document skill was used reliably once her rules file pointed to it, so she did the same for her Storage Inventory skill (Build Log 48). So the last step is to add one line to your rules file.<\/p>\n<h3>What Your Skill Does<\/h3>\n<p>It does the files job you built in Module 08, from your Build Brief, when you ask for it with one phrase.<\/p>\n<h3>Where the Skill Goes<\/h3>\n<table>\n<thead>\n<tr>\n<th>Folder<\/th>\n<th>How to check it loaded<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>~/.agents/skills/&lt;skill-name&gt;/SKILL.md<\/code> on the laptop<\/td>\n<td>Start a new pi session. pi read skills from this folder on Annie's Mac (checked 10 Oct 2026)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Build It<\/h3>\n<p>Paste this to pi:<\/p>\n<pre><code class=\"language-text\">Make a skill for [the job from my Build Brief].\nPut it in [the folder from the table], in a folder named [skill-name], with one file named exactly SKILL.md.\nWrite the description as a list of the phrases I would actually type to ask for it, such as &quot;do I need an umbrella&quot;.\nFollow the &quot;Must never do&quot; and &quot;Needs my approval before&quot; rows in my brief.\nThen add one line to my AGENTS.md that names the skill and says when to use it.\nShow me the SKILL.md before you save it.\n<\/code><\/pre>\n<h3>Test It Three Ways<\/h3>\n<ol>\n<li><strong>Ask in the words from the description.<\/strong> The AI assistant should use the skill.<\/li>\n<li><strong>Ask in different words you would also use.<\/strong> If it does not use the skill, add those words to the description and test again.<\/li>\n<li><strong>Ask something unrelated.<\/strong> The AI assistant should not use the skill.<\/li>\n<\/ol>\n<p><strong>You know it works when<\/strong> all three tests give the right result, and your three acceptance checks from the brief pass.<\/p>\n<h2>Build Your Gemini Skill and Scheduled Action<\/h2>\n<p><em>20 minutes.<\/em><\/p>\n<p>A laptop can run a job at a set time. But it runs only while the laptop is awake. If the laptop is closed at 7 am, the 7 am job does not run, and nothing tells you.<\/p>\n<p>Gemini is different. Gemini runs on Google's computers, not on your laptop. So a scheduled action in Gemini runs every morning even when your laptop is closed or switched off. The message arrives in the Gemini app on your phone.<\/p>\n<p>You did the setup at home, from the handout: Gemini Pro, your calendar connected, your instructions for Gemini written, and the app on your phone. Now you build.<\/p>\n<p><strong>Step 1. Build the skill (10 minutes).<\/strong> On the laptop, open a new chat in Gemini and type one line. Fill the brackets:<\/p>\n<pre><code class=\"language-text\">Build me a skill called &quot;[name]&quot;. Every morning I want a message I can copy and paste to [who]. From [calendar], show [what]. Leave out anything private. Before you save it, ask me what you need to know.\n<\/code><\/pre>\n<p>Gemini asks you questions. Answer in plain words, as you would brief new staff. When it saves, say \"overwrite the old one\". Without that, Gemini saves a second copy.<\/p>\n<p>You know it works when \"Write today's message\" gives a message in plain lines, with nothing private in it.<\/p>\n<p><strong>Step 2. Schedule it (5 minutes).<\/strong> Type:<\/p>\n<pre><code class=\"language-text\">Every weekday at 7:30am, send me today's message.\n<\/code><\/pre>\n<p>You know it works when Settings, then Scheduled actions, shows it.<\/p>\n<p><strong>Step 3. Test it on your phone (5 minutes).<\/strong> Open the Gemini app. Ask for today's message.<\/p>\n<p>You know it works when the app's model picker shows Pro, and the message arrives.<\/p>\n<p><strong>Do not set up automatic sending into WhatsApp.<\/strong> It can get your number banned. Copy and paste by hand.<\/p>\n<p><strong>If you took the optional server sitting,<\/strong> also build a scheduled job on the server as homework. Follow the master Module 11 in <code>modules/<\/code>, under \"Build the Scheduled Job\". Bring questions to Module 12.<\/p>\n<h2>The Server Question<\/h2>\n<p><em>5 minutes.<\/em><\/p>\n<p>Your Gemini message now arrives every morning because it runs on Google's computers, not on your laptop. pi runs on your laptop, so it stops when the laptop does. So now the question is real: do you need a server?<\/p>\n<p><strong>What a server gives you:<\/strong><\/p>\n<ol>\n<li>Your AI assistant answers when your laptop is shut.<\/li>\n<li>Scheduled jobs run at 3 am.<\/li>\n<li>Your phone reaches it from anywhere.<\/li>\n<\/ol>\n<p><strong>What a server costs you:<\/strong><\/p>\n<ol>\n<li><strong>Money every month.<\/strong> About $27 for a server with its whole-server backup, at Hetzner.<\/li>\n<li><strong>A second computer to look after.<\/strong> In September 2026 Annie's server kept warning that its memory was low. The cause was six Claude Code sessions she had left open. They were 4 to 17 days old and held 1.5 GB, of a server with 3.8 GB in total. None of them closed by itself (Build Log 95).<\/li>\n<li><strong>Logins that expire.<\/strong> Her server's Claude login expired without warning after about 30 days, while chat on her phone still worked (Build Log 75).<\/li>\n<\/ol>\n<p><strong>\"Not yet\" is an allowed answer.<\/strong> A laptop teaches the same lessons and costs nothing extra.<\/p>\n<p><strong>Exercise.<\/strong> Answer in one sentence on your run card: do I need a server, and why? If you freeze, write it instead of saying it.<\/p>\n<h2>From the Record<\/h2>\n<p>Two stories for students who ask for more.<\/p>\n<p><strong>The reminder that arrived twice (Build Log 37).<\/strong> On at least two nights in July 2026 Annie received two receipt reminders, but only one job existed. When she replied \"done\", the bot sent the files again as a reply. The fix was a written rule: when she says \"done\", log it and do not send the files again.<\/p>\n<p><strong>The bot fixed the wrong file (Build Log 42).<\/strong> In July 2026 Annie asked for a new format for her morning message. The bot said \"updated\", and it changed its skill file correctly. The next two mornings still came in the old format. The scheduled job had its own stored instructions, which said \"EXACTLY this format\", and those won every time. When a fix does not show up, find which file the job actually reads.<\/p>\n<h2>Worksheet: Growing It<\/h2>\n<table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Proof<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Five new brief rows written<\/td>\n<td>My brief<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Gemini skill tested: today's message has nothing private in it<\/td>\n<td>Gemini, on the laptop<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Scheduled action set, and the message reached the phone<\/td>\n<td>Settings, then Scheduled actions; the Gemini app<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Keep-or-kill date in my calendar<\/td>\n<td>My calendar<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>One tool I decided not to add, with my reason<\/td>\n<td>My run card<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Skill folder holds one file named exactly <code>SKILL.md<\/code><\/td>\n<td>The folder listing<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Skill passed all three tests<\/td>\n<td>My notes<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>AGENTS.md<\/code> points to the skill<\/td>\n<td>The line in <code>AGENTS.md<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>One-sentence answer to the server question<\/td>\n<td>My run card<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Next: the close (Module 12).<\/strong> Your morning message runs without you. Now you check your system against the promise, and plan the next 30 days.<\/p>\n<h2>Teaching Notes<\/h2>\n<ul>\n<li><strong>Check one thing before the course:<\/strong> that the pi version the room installs still reads skills from <code>~/.agents/skills/<\/code>.<\/li>\n<li><strong>The skill description is the hard part.<\/strong> An early version of the course called the skill exercise \"the hardest fifteen minutes in the course for some students\". Sit with each student and write the trigger phrases together.<\/li>\n<li><strong>The umbrella example is fine.<\/strong> A small job that works teaches more than a large one that does not finish.<\/li>\n<li><strong>Students will want a second job straight away.<\/strong> Point them to week 3 of the 30-day plan (Module 12).<\/li>\n<li><strong>Three students at most.<\/strong> The two builds need you at each keyboard in turn.<\/li>\n<li><strong>Timing risk:<\/strong> a brief that needs a login (email, calendar) runs long. Switch that student to the umbrella example and leave the real job as homework.<\/li>\n<\/ul>"}, {"id": "short-15", "title": "11: Handout, More Ways to Grow Your System", "handout": true, "html": "<h1>More Ways to Grow Your System<\/h1>\n<p><em>A handout for Module 11, both courses. Read it at home, after your first job or skill has run for a week. Each section comes from Annie's build logs. Use one at a time.<\/em><\/p>\n<h2>Formatting Messages for the Phone<\/h2>\n<p><strong>A correct message is not always a usable one.<\/strong> Annie's weather job worked out the weather correctly. She still said: \"in terms of how I want to read it, it's not quite right.\" The one line she could act on was hidden under a loud warning sign (Seminar Ideas, 15 and 19 July 2026).<\/p>\n<p><strong>Five of the seven rules in Annie's message format, approved on 15 July 2026<\/strong> (Claudith Clean Brief Style note):<\/p>\n<ol>\n<li>A bold first line that says what this is and when.<\/li>\n<li>A one-line summary under it.<\/li>\n<li>Short \"Label: value\" lines, with a blank line between items.<\/li>\n<li>Warning signs only where you need to act.<\/li>\n<li>Turn the unimportant items into a count. Send nothing when nothing matters.<\/li>\n<\/ol>\n<p><strong>Telegram shows only some formatting.<\/strong> Bold, italics, code and links work. Headings and quote blocks show as stray characters. Tables turn into bullet lists (Build Log 108).<\/p>\n<p><strong>Read the real message on your real phone.<\/strong> Annie's weather job took 18 changes in 6 days (Build Log 35). Each round of changes came from her reading the real message on her real phone (Seminar Ideas).<\/p>\n<h2>Reading the Web, With a Cap<\/h2>\n<p>Many useful jobs read web pages. Annie's bots use Firecrawl. It turns a web page into clean text, and it can search. Its free plan gives 1,000 credits a month. A search costs about 2 credits (Annie's notes, 29 Sep 2026).<\/p>\n<p><strong>Cap the job, not only the account.<\/strong> The first run of Annie's company-watch job had no limit on how many searches the AI could make. It used 92 credits and never finished. Limited to 14 calls, it finished in 12 and used 21 credits (<code>Firecrawl — Use Cases<\/code> note).<\/p>\n<p><strong>Her rule for Firecrawl:<\/strong> warn before the limit, and never top up automatically (Annie's Firecrawl notes).<\/p>\n<h2>Pausing and Restarting a Job<\/h2>\n<p>Pausing keeps the job but stops it from running. Use it on your keep-or-kill date if you are not sure yet.<\/p>\n<pre><code class=\"language-bash\">hermes cron pause &lt;job-id&gt;\nhermes cron resume &lt;job-id&gt;\n<\/code><\/pre>\n<p>Annie once paused a working bill reminder on the day she built it. It only told her to go and check an app, so it removed no work (Build Log 41).<\/p>\n<h2>Two Ways to Use a Model on a Schedule<\/h2>\n<p>Try these only after week 4 of your 30-day plan (Module 12), with your test questions written first.<\/p>\n<p><strong>1. A model job with its model fixed.<\/strong> The scheduler hands a request to the bot's model. Fix the model and the provider on the job itself. Then a change to the default model cannot move the job without you knowing. Annie's scheduler refuses to run a job that has no fixed model if the default changed after the job was made (Build Log 84). Her command (Build Log 94):<\/p>\n<pre><code class=\"language-bash\">hermes cron edit &lt;job-id&gt; --model deepseek-v4.1-flash --provider opencode-go --pin\n<\/code><\/pre>\n<p><strong>2. The model writes, a script sends.<\/strong> In June 2026 Annie wanted her morning summary as several short messages. A scheduled model job could only send one reply, and the cheap model added its working notes to it. The fix used two jobs. The model job writes only the clean message to a file, and sends nothing. Five minutes later, a script job splits the file and sends each part as its own message (Build Log 15).<\/p>"}, {"id": "short-16", "title": "11: Handout, Your Gemini Morning Message", "handout": true, "html": "<h1>Your Gemini Morning Message (Short Course)<\/h1>\n<p><em>A handout for Module 11, Short course. Do the steps at home before the module, up to the end of \"Teach Gemini How To Talk To You\". The skill and the schedule are built in class. Keep the rest for when something goes wrong.<\/em><\/p>\n<h2>Step 1. Check These<\/h2>\n<p>You are on a personal Google account. Not a work one, not a school one.\nKeep Activity is ON. Go to myactivity.google.com/product/gemini.\nMost problems today come from one of these. So we check them first.<\/p>\n<h2>Step 1. Check These (2)<\/h2>\n<p>Smart features in other Google products is ON, in your Gmail settings. (screenshot)<\/p>\n<h2>Step 2. Pay For Gemini Pro<\/h2>\n<p><em>(table: Plan · Price · What you get)<\/em><\/p>\n<ul>\n<li>Free · HK$0 · Flash-Lite from 9 October 2026. Weak, and often wrong.<\/li>\n<li>Google AI Plus · about HK$38/month · Gemini Pro for now. It loses Pro on a date Google emails you.<\/li>\n<li>Google AI Pro · about HK$158/month · Gemini Pro, kept. This is the one to buy.<\/li>\n<li>Work Workspace · varies · May include Gemini, if your office switched it on.\nWhy pay: the free and cheaper models are weak and get things wrong. To pay, open Google One, or tap the upgrade button inside Gemini.\nThe morning message itself is free. HK$158 is the price of the Pro model, not a fee for a schedule.<\/li>\n<\/ul>\n<h2>Step 3. Open Gemini On Your Laptop<\/h2>\n<p>Go to gemini.google.com in your browser. Sign in with the Google account you paid from. Look at the model picker at the top of the chat. Choose Pro.\nYou know it works when the model picker shows Pro.\nNo Pro? Check the account name in the top corner. It must be the account you paid from.<\/p>\n<h2>Step 4. Set Up A Household / Helper / Kid's Calendar<\/h2>\n<p>If you only have your personal Google account and no separate one for your household, set up a new Google account for your household. This protects your own privacy.\nEach Google account can have multiple calendars within it. You can choose to make one calendar per kid and helper, or combine all their tasks and events into one calendar. Do whichever works for your household.\nIf you don't know how to do this, ask Gemini Pro. The more you use it, the better a PA it becomes.\nName the calendars, not the people. Your helper never logs in to anything.\nAlready have these calendars on another Google account? Share them to yours. The next section shows how.<\/p>\n<h2>Step 4. Share Household/Kid's Calendar To Your Personal Account<\/h2>\n<p><em>(three screenshot slides)<\/em><\/p>\n<ol>\n<li>Open that calendar's settings<\/li>\n<li>Shared with → + Add people<\/li>\n<li>Choose \"See event details\"<\/li>\n<\/ol>\n<h2>Step 4. Connect Your Calendar To Gemini<\/h2>\n<p>Back in Gemini, open a new chat. Type @ and choose Google Calendar. Then type: \"What is on my calendar today?\"\nIt worked when Gemini reads back real events from your day. Nothing? Settings, then Personal Intelligence, then Connected apps: switch Calendar on.<\/p>\n<h2>Step 5. Teach Gemini How To Talk To You<\/h2>\n<p>In Gemini: Settings → Personal Intelligence → Instructions for Gemini. (screenshot)<\/p>\n<h2>Step 5. Teach Gemini How To Talk To You: Personality<\/h2>\n<p>Type your instructions. Save. It applies to every chat from now on.\nThis is how every answer in my own Gemini starts with a summary and ends with a next step.\nMy own example: Write in short, plain sentences. Always include a summary and bullet points if possible. No paragraph should be longer than 3 sentences. Always end with a suggested next action, giving options and explaining your recommendation and why. Never use my personal calendar unless specified.<\/p>\n<h2>Step 6. Build Your Skill The Easy Way<\/h2>\n<p>Currently, a Google bug stops skills saving in the phone app so best to do from laptop.\nOpen a new chat and type the line below. Gemini asks you questions. Answer in plain words, as you would brief new staff.\n\"Build me a skill called \"Helper Daily Msg\". I want a daily message that I can copy-paste to Whatsapp for my helper. Drawing from XYZ calendar(s), it should show my household events so she knows what to do. Before you save it, ask me what you need to know about my house, my helper and our daily routine.\"<\/p>\n<h2>Step 6. Or Paste A Full Skill Manually (part 1 of 2)<\/h2>\n<p>A full 13-rule skill prompt (household, calendars, how to write the message, 30 minutes travel time). Copy it from tinyurl.com/zonta-gemini, fill the brackets, and send it as one message.<\/p>\n<h2>Step 6. Or Paste A Full Skill Manually (part 2 of 2)<\/h2>\n<p>The rules that matter: never mention anything private; a journey is not an appointment; add daily things that are on no calendar; after the message add up to 5 \"Check these\" lines; end with \"Shall I add these to the Helper calendar?\"; when the day changes, rewrite the whole message.\nThis is the skill I use every morning, with my family's names taken out.<\/p>\n<h2>Step 6. Change Your Skill Later<\/h2>\n<p><em>(table: You want to → Type this)<\/em><\/p>\n<p>Change the travel time · Ask about dinner · Drop the please · Read what it saved.\nAlways say \"overwrite the old one\". Without it, Gemini saves a second copy called Helper day v2.\nGemini cannot delete a skill for you. Settings, then Skills, then the three dots on its row, then Delete.<\/p>\n<h2>Step 7. Ask For Today's Message<\/h2>\n<p>This is the only line you type from now on: \"Write today's helper message.\"\nRead the message before you send it. Not quite right? Say what to change, as you would to staff.\nIt ends with Check these, and asks to add missing jobs to your Helper calendar. Say yes, and it stops forgetting them.<\/p>\n<h2>Step 7. Test The Privacy Before You Trust It<\/h2>\n<p>Type: \"List every event you put in today's helper message, and tell me which calendar each one came from.\"\nCheck that your private event is not in the list. Check that the journeys are there: the drop-off, the collection, the drive.\nNo private event today? Name one you would expect it to leave out, and check that one.\nA private event got in? It is on the wrong calendar. Move it to your personal calendar, and check your instructions for Gemini are saved.<\/p>\n<h2>Step 8. Schedule Your Helper Message<\/h2>\n<p>Type: \"Every weekday at 7:30am, send me today's helper message.\" It needs no paid plan.\nSee or change it in Settings, then Scheduled actions. You can have up to 10.\nDo not set up automatic sending into WhatsApp. It can get your number banned. Copy and paste by hand.<\/p>\n<h2>Step 9. Put It On Your Phone<\/h2>\n<p>Open the app store on your phone. Search for Google Gemini, and install it. Sign in with the same Google account. Open the app.\nYou know it works when the app's model picker shows Pro.\nBuild or change skills on the laptop, never by hand in the phone app.<\/p>\n<h2>What Your AI PA Can Do: Calendar Checker<\/h2>\n<p><em>(screenshot)<\/em><\/p>\n<h2>Build The Calendar Checker Skill<\/h2>\n<p>Build this once, the same way as Helper day. Then paste the times you were offered, and it tells you which are free.\n\"Build me a skill called \"Calendar checker\". When I give you suggested times, check them against my calendar and [child]'s calendar. Tell me which are free and which clash. Protect [child]'s routine: [nap 1pm to 3pm, bath 6pm, bed 8:15pm].\"\nI built mine by typing one line: \"check my calendar and my son's against suggested times [insert times here]\". Gemini did the rest.<\/p>\n<h2>If Something Goes Wrong<\/h2>\n<p><em>(table: What you see → What to do)<\/em><\/p>\n<p>No Pro in the model picker → Sign in to the Google account you paid from.\nIt cannot see your calendar → Say: Please connect to my Google Calendar.\nA calendar is missing → Share it to your account, with See event details.\nIt gave you a table, not a message → Say: Rewrite that as one plain message, ready to copy and paste.\nYour private event is in the message → Move it to your diary calendar. Check your instructions for Gemini are saved.\nNo Skills in your settings → You are on a work or school account. Use a personal one.\nNothing saves → Turn on Keep Activity at myactivity.google.com/product/gemini.\nThe morning message stopped → Settings, then Scheduled actions. Switch it back on.\nA skill you want to delete → Settings, then Skills, then the three dots on the old one, then Delete.<\/p>"}, {"id": "short-17", "title": "12: The Close, Your 30-Day Plan", "handout": false, "html": "<h1>Module 12: The Close, Your 30-Day Plan<\/h1>\n<p><strong>How to read this file.<\/strong> This is the Short course copy: 10 hours over three days, built with pi on your laptop and Gemini on your phone. Every segment in it is taught. The master copy for both courses is in <code>modules/<\/code>.<\/p>\n<p><strong>Why this module comes last.<\/strong><\/p>\n<ol>\n<li>Students now own a system that does one real job (Modules 08 and 11).<\/li>\n<li>It has checks that tell them when it breaks (Module 10).<\/li>\n<li>So the last job is to check it against the course promise, and to plan the next four weeks.<\/li>\n<li>The course ends on the student's next action, not on a summary.<\/li>\n<\/ol>\n<h2>Run Sheet<\/h2>\n<p>15 minutes.<\/p>\n<table>\n<thead>\n<tr>\n<th>Min<\/th>\n<th>Segment<\/th>\n<th>Facilitator does<\/th>\n<th>Students do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5<\/td>\n<td>The promise, checked<\/td>\n<td>Reads the rows for this course<\/td>\n<td>Check their own system, row by row<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Your 30-day plan<\/td>\n<td>Shows a filled-in plan<\/td>\n<td>Write their own four weeks<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>When it breaks, and where to get help<\/td>\n<td>Explains the four steps and the group chat<\/td>\n<td>Write the four steps and the chat name on the run card<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>How the minutes add up.<\/strong><\/p>\n<ul>\n<li><strong>15 minutes.<\/strong> The promise takes 5. The plan takes 5. When it breaks and where to get help takes 5. The closing question is homework, written on the run card. The last save is said at the end of the help segment, with no extra minutes.<\/li>\n<\/ul>\n<h2>What You Will Leave With<\/h2>\n<ul>\n<li>Your system, checked against the course promise. Any row you cannot tick is written on your run card as work to do.<\/li>\n<li>A 30-day plan, one row for each week, with a stop condition for each week.<\/li>\n<li>The four steps to take when something breaks.<\/li>\n<li>The name of the group chat where you get help for four weeks, and the date of the class call.<\/li>\n<\/ul>\n<h2>The Promise, Checked<\/h2>\n<p>Facilitator: show the system picture from Module 03A. Every box on it now exists.<\/p>\n<p><em>5 minutes.<\/em><\/p>\n<p>At the start, the course promised you a system you can check. Check it now, against what is in front of you.<\/p>\n<table>\n<thead>\n<tr>\n<th>The claim<\/th>\n<th>The check<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>One AI assistant on your laptop<\/td>\n<td>Start pi in your folder, and ask it a question<\/td>\n<\/tr>\n<tr>\n<td>One real job<\/td>\n<td>Ask for the job, in the words from your skill's description<\/td>\n<\/tr>\n<tr>\n<td>Three rules you wrote<\/td>\n<td>Name them, and say how each one is checked<\/td>\n<\/tr>\n<tr>\n<td>It tells you when it cannot answer<\/td>\n<td>Ask one of your golden questions that it should refuse, and read the refusal<\/td>\n<\/tr>\n<tr>\n<td>You know what it costs<\/td>\n<td>Read the monthly figure off your run card<\/td>\n<\/tr>\n<tr>\n<td>Your morning message arrived today without you<\/td>\n<td>Open the Gemini app on your phone and read it<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>A row you cannot tick is work to do. It is not a failure.<\/strong> Write the row on your run card. Bring it to the group chat or the class call.<\/p>\n<h2>The Closing Question<\/h2>\n<p><em>Homework, written on your run card.<\/em><\/p>\n<p><strong>\"What have I built, and what does it take off my mind?\"<\/strong><\/p>\n<p><strong>Answer it in one sentence.<\/strong> Write it on your run card. If you can describe your system in one sentence, you know what it is for. Keep the sentence somewhere you will see it.<\/p>\n<p><strong>Annie's own sentence, for an example.<\/strong> In August 2026 she wrote what the whole effort is for: clearing what drains her, so she can be present with the people in front of her, including herself (Build Log 72).<\/p>\n<p><strong>The second question, written, not spoken.<\/strong> What would \"too much looking after\" be for you? For example: more than 30 minutes a week of fixing. Write your limit now. If you reach it later, you switch something off. You do not keep adding.<\/p>\n<h2>Your 30-Day Plan<\/h2>\n<p><em>5 minutes.<\/em><\/p>\n<p><strong>Add one tested thing at a time. Then live with it for a few days before you add the next.<\/strong> This is the rule from Module 11, and it applies after the course too. When Annie broke this rule in May 2026, the clean-up took 13 logged hours (Build Log 00).<\/p>\n<p><strong>Expect to change things many times.<\/strong> Annie built and reshaped her storage system across five days in August 2026. It took about 45 to 50 separate changes (Build Log 52). Changing your mind is how the system becomes yours.<\/p>\n<p><strong>Write your own plan.<\/strong> One row for each week. Each week has a stop condition: the thing that tells you the week is done.<\/p>\n<table>\n<thead>\n<tr>\n<th>Week<\/th>\n<th>What you do<\/th>\n<th>Stop condition<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1<\/strong><\/td>\n<td>Add nothing new. Use what you built today. Note anything that annoys you<\/td>\n<td>You used it at least three times, and you wrote down each annoyance<\/td>\n<\/tr>\n<tr>\n<td><strong>2<\/strong><\/td>\n<td>Your keep-or-kill date arrives (Module 11). Ask: did I actually use it? Keep it, change it, or switch it off. Bring your answer to the class call<\/td>\n<td>You decided, and you wrote down why<\/td>\n<\/tr>\n<tr>\n<td><strong>3<\/strong><\/td>\n<td>Add one more thing, from your Module 05 maps. One thing, one check, one sentence to describe it<\/td>\n<td>It passed its test, and it ran for three days<\/td>\n<\/tr>\n<tr>\n<td><strong>4<\/strong><\/td>\n<td>Try one task that needs AI judgement. Write your test questions with known answers first, then build it (Module 09)<\/td>\n<td>It passed your test questions, and your <code>AGENTS.md<\/code> still describes everything your AI assistant does<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>How to size the week 3 thing.<\/strong> It is one thing. It has one check. You can describe it in one sentence. \"Send me the invoices that need a claim\" is one thing. \"Sort out my admin\" is not.<\/p>\n<p><strong>Switching something off counts as progress.<\/strong> On 27 July 2026 Annie built a job that watched for her credit card statement. Every test passed. She switched it off a few hours later. The bank's email never contained the amount or the due date, so the job could only ever say \"go and check the app\". It did not remove a chore, so it did not earn a place (Build Log 41).<\/p>\n<p><strong>Week 3, if you took the optional server sitting:<\/strong> your one more thing can be a scheduled job on the server. Follow the master Module 11 in <code>modules/<\/code>, under \"Build the Scheduled Job\".<\/p>\n<h2>When It Breaks, and Where to Get Help<\/h2>\n<p><em>5 minutes.<\/em><\/p>\n<h3>The Four Steps<\/h3>\n<p>When something goes wrong, do these in order. Read the real thing before you guess.<\/p>\n<ol>\n<li><strong>Read what the AI assistant actually said,<\/strong> and what the file actually contains.<\/li>\n<li><strong>Check which folder it was started in.<\/strong> Most \"it forgot my rules\" problems are the wrong folder.<\/li>\n<li><strong>Check that the rule is written in a file.<\/strong> A rule you only said in a chat is gone after the chat ends.<\/li>\n<li><strong>Ask your builder one question, with the real output pasted in.<\/strong><\/li>\n<\/ol>\n<p><strong>If the four steps do not fix it, go to the group chat.<\/strong> Paste the real output there too. A copy of the error is quicker to answer than a description of it.<\/p>\n<h3>Help for Four Weeks After the Course<\/h3>\n<ul>\n<li><strong>A shared group chat for the class, for four weeks.<\/strong> It covers your whole 30-day plan.<\/li>\n<li><strong>Who answers:<\/strong> Annie or a co-teacher, as messages arrive. You should not lose a day of progress waiting for an answer.<\/li>\n<li><strong>The hours the chat is covered:<\/strong> [TO CONFIRM]. The co-teachers live in other time zones, so the hours are agreed after this draft.<\/li>\n<li><strong>One class call at the end of week 2,<\/strong> 30 to 45 minutes. This is when your keep-or-kill date arrives. Bring your answer, and any row from the promise check you could not tick.<\/li>\n<li><strong>Included in the course fee.<\/strong> The chat and the class call cost nothing extra.<\/li>\n<\/ul>\n<p><strong>Write on your run card:<\/strong> the chat's name, the date and time of the class call, and the four steps.<\/p>\n<h3>The Last Save<\/h3>\n<p><em>At the end of the help segment.<\/em><\/p>\n<p>Say <strong>\"save\"<\/strong> to your builder. It updates your continuity note and writes today's build log with its index row, as you set up in Module 08. This is the last thing you do in the course.<\/p>\n<h2>Worksheet: The Close<\/h2>\n<table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Proof<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Every promise row checked<\/td>\n<td>My run card, with any row I could not tick<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>One sentence: what I built, and what it takes off my mind<\/td>\n<td>My run card<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My limit for \"too much looking after\"<\/td>\n<td>My run card<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>30-day plan, four rows, each with a stop condition<\/td>\n<td>My plan<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Keep-or-kill date still in my calendar<\/td>\n<td>My calendar<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>The four steps, the chat's name and the call date<\/td>\n<td>My run card<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Last save done<\/td>\n<td>My continuity note and build log<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Teaching Notes<\/h2>\n<ul>\n<li><strong>End on the student's next action.<\/strong> The last thing each student hears is \"start week 1 tomorrow\", not a summary.<\/li>\n<li><strong>Some adults freeze when asked to speak.<\/strong> Always allow a written answer to the closing question.<\/li>\n<li><strong>Students who used a fallback in the build<\/strong> (the umbrella example, or a browser) will have rows they cannot tick. Say plainly that this is work to do, not failure.<\/li>\n<li><strong>Name the group chat and set the call date before class.<\/strong> A student should leave with both written down, not \"we will let you know\".<\/li>\n<li><strong>Three students at most.<\/strong> Check each student's promise rows beside them.<\/li>\n<\/ul>"}]};
const nav = document.getElementById('nav');
const doc = document.getElementById('doc');
const pager = document.getElementById('pager');

function parse() {
  const h = location.hash.slice(1);
  const course = h.startsWith('short') ? 'short' : 'full';
  const item = DATA[course].find(m => m.id === h) || DATA[course][0];
  return { course, item };
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function show() {
  const { course, item } = parse();
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.course === course));
  const list = DATA[course];
  nav.innerHTML = list.map(m =>
    `<a href="#${m.id}" class="${m.handout ? 'handout' : ''} ${m.id === item.id ? 'on' : ''}">${esc(m.title)}</a>`).join('');
  doc.innerHTML = item.html;
  doc.querySelectorAll('table').forEach(t => {
    const w = document.createElement('div'); w.className = 'tbl'; t.replaceWith(w); w.appendChild(t);
  });
  const i = list.indexOf(item);
  const prev = list[i - 1], next = list[i + 1];
  pager.innerHTML = (prev ? `<a href="#${prev.id}">&larr; ${esc(prev.title)}</a>` : '<span></span>') +
                    (next ? `<a href="#${next.id}">${esc(next.title)} &rarr;</a>` : '<span></span>');
  nav.classList.remove('open');
  window.scrollTo(0, 0);
}

document.querySelectorAll('.tabs button').forEach(b =>
  b.addEventListener('click', () => { location.hash = DATA[b.dataset.course][0].id; }));
document.getElementById('menu').addEventListener('click', () => nav.classList.toggle('open'));
window.addEventListener('hashchange', show);
show();
</script>
</body>
</html>
