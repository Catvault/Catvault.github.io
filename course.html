<style>

  .pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); }

<script>
const DATA = {"full": [{"id": "full-0", "title": "00: The Opener, What You Are Building", "handout": false, "html": "<h1>Module 00: The Opener, What You Are Building<\/h1>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 1: new module, approved by Annie on 13 Oct 2026. Five sections moved here from the demo (Module 04), word for word apart from their headings: \"The Rule for the Whole Module\", \"What This System Is For\", the storage demo, the warranty demo, the cost slide and the Wish List draft. The five sentences, the two cards and the four-day agenda are new (Proposals 1 and 2).]<\/em><\/p>\n<p><strong>How to read this file.<\/strong> This file serves both courses. Every segment is in both courses. One of the five sentences has a Short course version. It is marked.<\/p>\n<p><strong>Why this module comes here.<\/strong><\/p>\n<ol>\n<li>Both of Annie's models of good teaching open with the ending. You hear what you leave with before you do anything.<\/li>\n<li>The first thing you write in this course is about you: a list of the jobs you want gone.<\/li>\n<li>Every later module has a home in one of the five sentences below.<\/li>\n<\/ol>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 4, approved by Annie on 13 Oct 2026. In this file: 1 changes, 0 editor notes and the sections Sources, Related moved to <code>editor-notes/00 — Editor's Notes.md<\/code>. Every change, with its old and new text, is listed in FABLE-EDITS.md.]<\/em><\/p>\n<h2>Run Sheet<\/h2>\n<p>Full course: 43 minutes. Short course: 43 minutes.<\/p>\n<table>\n<thead>\n<tr>\n<th>Min<\/th>\n<th>Segment<\/th>\n<th>Facilitator does<\/th>\n<th>Students do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5<\/td>\n<td>The whole course in five sentences<\/td>\n<td>Reads the five sentences<\/td>\n<td>Listen<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>The two things people mix up, and the three words you will hear all day<\/td>\n<td>Shows the two cards, then the chain: you, harness, provider, model<\/td>\n<td>Write one line for each card<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Demo: a photo becomes a record<\/td>\n<td><code>Storage Bot Logging Item (edited)<\/code>, <code>Storage Bot Finding Item (edited)<\/code><\/td>\n<td>Note what the bot did when it was unsure<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Demo: when the bot was wrong<\/td>\n<td><code>warranty-01-send-filed (edited)<\/code>, <code>warranty-02-caught-corrected (edited)<\/code>, <code>warranty-03-reorganised (edited)<\/code><\/td>\n<td>Note how the correction was made<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Demo: what it costs<\/td>\n<td>One slide with three numbers, no screenshot<\/td>\n<td>Write the question \"what would this cost me?\"<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Your Wish List, first draft<\/td>\n<td>Hands out the worksheet<\/td>\n<td>List three to five jobs and score them<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Today's agenda<\/td>\n<td>Shows the day plan with its break<\/td>\n<td>Mark the break time<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>How the minutes add up.<\/strong> The five sentences take 5 minutes. The bot, the builder and the three words take 8. The storage demo takes 7. The warranty demo takes 5. The cost slide takes 5. The Wish List draft takes 10. The agenda takes 3.<\/p>\n<h2>What You Will Leave With<\/h2>\n<ul>\n<li>You can say, in one sentence, what this course builds.<\/li>\n<li>You can tell the bot from the builder.<\/li>\n<li>You can say what a harness, an AI provider and an AI model are.<\/li>\n<li>A first draft of your Wish List: three to five jobs you want your system to take over, each scored by how much remembering it removes. You finish it in the demo (Module 04).<\/li>\n<\/ul>\n<h2>Before This Module<\/h2>\n<ul>\n<li><strong>Nothing.<\/strong> Bring a pen. Your laptop stays closed.<\/li>\n<li><strong>For the facilitator:<\/strong> the checklist at the end of the demo (Module 04), done before students arrive. The same screenshot rules apply here.<\/li>\n<\/ul>\n<h2>The Whole Course in Five Sentences<\/h2>\n<p>Read these aloud. Every detail in the course has a home in one of them.<\/p>\n<ol>\n<li>You end up with two AIs. A bot, which you message on your phone, does your daily jobs. A builder, which you talk to on your laptop, makes everything.<\/li>\n<li>The bot lives on a small rented server in Singapore that never sleeps. So it answers at 3am with your laptop closed. The same server is your way to reach Claude from Hong Kong.<\/li>\n<li>Both AIs forget everything between conversations. Plain text files cure that: a file about you, a file that says who the bot is and what it must never do, and a short \"where we left off\" note for the builder. Those files are the real product.<\/li>\n<li>Your notes app holds the one real copy of everything. Every device and both AIs read it.<\/li>\n<li>Every job goes in one of two lanes. Same steps every time becomes a small program, called a script, that runs for free. Needs judgement goes to the AI. That one choice is why the whole thing runs for about $70 a month.<\/li>\n<\/ol>\n<p><strong>Short course: sentence 2 reads:<\/strong> \"In this course the assistant lives on your laptop. It works while the laptop is open. Your morning message comes from Gemini. Gemini runs on Google's computers, not on your laptop. So the message arrives on your phone every morning, even when your laptop is closed or switched off. A rented server is an optional extra sitting.\"<\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 8, approved by Annie on 13 Oct 2026: the Short course sentence now names Gemini. Annie chose on 13 Oct 2026 what a Short student leaves with.]<\/em><\/p>\n<h2>The Two Things People Mix Up<\/h2>\n<p>This course has two AIs. People confuse them, because both run on AI. Keep them apart from the first day.<\/p>\n<p><strong>The bot. The assistant.<\/strong><\/p>\n<ul>\n<li>Lives on a rented server, awake all day and all night.<\/li>\n<li>You reach it in Telegram, by text.<\/li>\n<li>Its job: run the daily jobs, read the calendar and email, answer using your rules.<\/li>\n<li>Its memory: a soul file and a rules file, read again on every conversation.<\/li>\n<li>It cannot build or change itself. It has no building tools. That is on purpose.<\/li>\n<\/ul>\n<p><strong>The builder. pi, and Claude Code.<\/strong><\/p>\n<ul>\n<li>Lives on your own computer, only while you have it open.<\/li>\n<li>You reach it by opening it on your laptop.<\/li>\n<li>Its job: build, fix and run the bot. It writes the files and logs in to the server.<\/li>\n<li>Its memory: a \"where we left off\" note, read at the start of every session.<\/li>\n<li>It is not in your Telegram. It never answers you as the assistant.<\/li>\n<\/ul>\n<p><strong>When the bot is wrong, you do not tell the bot. You tell the builder.<\/strong> The builder changes the bot's files.<\/p>\n<p><strong>Short course:<\/strong> in the 10 hours, your builder is pi on your laptop. Your bot is Gemini: a skill you write, and a scheduled action that messages you every morning. Gemini runs on Google's computers, not on your laptop. So the message arrives on your phone every morning, even when your laptop is closed or switched off. The two cards still matter. The server sitting adds a bot that does more.<\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 5, approved by Annie on 13 Oct 2026: the three words moved here from the architecture module (now Module 03A), in fewer words. Module 03A keeps the long version. The segment grew from 5 to 8 minutes.]<\/em><\/p>\n<p><strong>Three words you will hear all day.<\/strong> Every AI in this course is reached the same way: you, then a harness, then an AI provider, then an AI model. The answer comes back the same way.<\/p>\n<ul>\n<li><strong>The harness<\/strong> is the program you type into. It sends your words to the AI. It lets the AI read your files and run commands. pi is a harness. Claude Code is a harness. Hermes, the program the bot runs on, is a harness too.<\/li>\n<li><strong>The AI provider<\/strong> is the company that runs the AI on its own computers. It sends the bill. opencode Go is a provider. Anthropic is a provider.<\/li>\n<li><strong>The AI model<\/strong> is the AI that writes the answers. DeepSeek is a model. Claude is a model.<\/li>\n<\/ul>\n<p><strong>The chain for pi:<\/strong> you, then pi (harness), then opencode Go (AI provider), then DeepSeek (AI model).<\/p>\n<p><strong>The chain for Annie's bot:<\/strong> you, then Hermes (harness), then opencode Go (AI provider), then DeepSeek (AI model).<\/p>\n<p>The two chains share a provider and a model. That is why one opencode Go plan, at $10 a month, pays for both pi and the bot. The architecture module (Module 03A) explains each of the three parts in more detail.<\/p>\n<h2>The Rule for the Whole Module<\/h2>\n<p><strong>Never show a capability without showing what it costs.<\/strong><\/p>\n<ul>\n<li>Every demo below comes with a failure, a bill or a trade-off.<\/li>\n<li>A demo that shows only wins makes the room feel behind.<\/li>\n<li>It also makes the facilitator hard to trust the first time a student's own build fails.<\/li>\n<\/ul>\n<h2>What This System Is For<\/h2>\n<p>Most AI marketing promises that you will do ten times more. Annie's system is built for a different reason.<\/p>\n<p>Her line, written in August 2026: the real gift is clearing what drains you, so you can be present with the people in front of you, including yourself (Build Log 72).<\/p>\n<p>It works in two directions:<\/p>\n<ul>\n<li><strong>Take things away.<\/strong> Admin, reminders, chasing, filing. Anything you hold in your head today because nothing else will.<\/li>\n<li><strong>Add depth.<\/strong> Research and learning on the things that matter to you.<\/li>\n<\/ul>\n<p>Annie judges every build by one rule: if a job only works when you remember to start it, it is not finished (Annie's ruling, 27 Aug 2026). Every demo in this course runs without her starting it.<\/p>\n<h2>Demo: A Photo Becomes a Record<\/h2>\n<p><strong>What it is.<\/strong> A photo catalogue of the family's storage units. A bot built it, and you can read it on a phone (Build Log 48).<\/p>\n<p><strong>What the screenshots show.<\/strong><\/p>\n<ol>\n<li><strong><code>Storage Bot Logging Item (edited)<\/code>.<\/strong>\n   - Annie sends a photo of a cap, with a short caption naming the unit.\n   - The bot replies \"Got it\".\n   - It logs the item to Unsorted, and says it did not catch the unit.\n   - A minute later, it moves the item to the right unit as number 325.\n   - It asks her to reply if that is wrong.<\/li>\n<li><strong><code>Storage Bot Finding Item (edited)<\/code>.<\/strong>\n   - Annie asks where a playmat is.\n   - The bot answers with the item number.\n   - It says the playmat was lent to a friend, and quotes the note about a missing part.\n   - It also lists two near-matches, in case she meant one of those.<\/li>\n<\/ol>\n<p><strong>The line to say.<\/strong> \"When it was unsure where the cap went, it said so and put it somewhere safe. It did not guess.\"<\/p>\n<p><strong>What else to point out.<\/strong> (Source: Build Log 80.)<\/p>\n<ul>\n<li>The count of items comes from code, not from the AI.<\/li>\n<li>AI models are bad at counting.<\/li>\n<li>So Annie's rule is: code does the arithmetic, and the model only reads the result.<\/li>\n<\/ul>\n<p><strong>The cost of this one.<\/strong> (Source: Build Log 48.)<\/p>\n<ol>\n<li>Annie's first answer from Claude was \"don't build it\". Describing photos seemed to need a paid AI service.<\/li>\n<li>She removed that assumption in six words: \"I actually don't mind typing descriptions.\"<\/li>\n<li>It then turned out the bot already described photos, for about $0.001 each.<\/li>\n<\/ol>\n<p>The lesson: say out loud the one assumption your advice depends on. Then the other person can overturn it.<\/p>\n<h2>Demo: When the Bot Was Wrong<\/h2>\n<p><strong>What happened (1 Oct 2026).<\/strong><\/p>\n<ol>\n<li>Annie photographed a hard drive's warranty card and said \"save this\".<\/li>\n<li>The bot filed it as a searchable page. It explained which folder it chose and why (<code>warranty-01<\/code>).<\/li>\n<li>Then it stated, confidently, that the warranty did not cover data recovery. That was wrong.<\/li>\n<\/ol>\n<p><strong>How it was corrected<\/strong> (<code>warranty-02<\/code>):<\/p>\n<ol>\n<li>Annie corrected it in one sentence.<\/li>\n<li>The bot checked the manufacturer's own data sheet. It quoted the line that includes data recovery.<\/li>\n<li>It replied \"You're right and I was wrong\".<\/li>\n<li>It fixed the page, and put the source in it.<\/li>\n<li>It explained the two ways to claim. It named what was still missing: the receipt.<\/li>\n<\/ol>\n<p><strong>Later<\/strong> (<code>warranty-03<\/code>):<\/p>\n<ul>\n<li>Annie asked it to move the files into a subfolder.<\/li>\n<li>It did.<\/li>\n<li>It also found and fixed a link elsewhere in the vault that the move would have broken (Boss Admin Moves note, 1 Oct 2026).<\/li>\n<\/ul>\n<p><strong>The line to say.<\/strong> \"The lesson is not that the bot is clever. I stayed in charge, and correcting it took one sentence.\"<\/p>\n<h2>Demo: What It Costs<\/h2>\n<p><strong>Show one slide with three numbers.<\/strong> No screenshot is needed, so nothing private can appear.<\/p>\n<ol>\n<li><strong>The monthly figure.<\/strong> About $70 a month, about $840 a year. Annie's own meters, October 2026. The table below shows every piece.<\/li>\n<li><strong>The cap.<\/strong> (Source: Build Log 89.)\n   - In September 2026, Annie had set a $20 monthly spending cap on one AI account.\n   - The cap was reached, and the account paused.\n   - The cap did exactly its job.<\/li>\n<li><strong>What filled it.<\/strong> (Source: Build Log 89.)\n   - One chat conversation ran for three days.\n   - It used 19.06 million tokens, costing $8.36.\n   - Tokens are the small pieces of text that AI companies count and charge for.<\/li>\n<\/ol>\n<p><strong>The line to say.<\/strong> \"I know what this costs to the cent. If you build this and do not know that, you will get a surprise you will not enjoy.\"<\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Annie asked for this table while reviewing the branch. It is the itemised table from the Boss Admin Moves page, in plain words, with one row added: opencode Go, the company that serves pi its models, at $10 a month. The two totals are the page's totals plus that row.]<\/em><\/p>\n<p><strong>What each piece costs, per year.<\/strong> Show this after the three numbers, or hand it out.<\/p>\n<table>\n<thead>\n<tr>\n<th>Piece<\/th>\n<th>What it does<\/th>\n<th>Per year<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Rented server (Hetzner)<\/td>\n<td>The bot's house. Always on. Runs everything.<\/td>\n<td>$216<\/td>\n<\/tr>\n<tr>\n<td>AI tokens for the bot<\/td>\n<td>Every conversation, and the one scheduled job that uses the AI. A meter, not a flat bill. Check your own.<\/td>\n<td>About $180 to $240<\/td>\n<\/tr>\n<tr>\n<td>Claude subscription (Pro plan)<\/td>\n<td>The builder, Claude Code. Flat rate. All the expensive build thinking.<\/td>\n<td>$200<\/td>\n<\/tr>\n<tr>\n<td>opencode Go<\/td>\n<td>The company that serves pi its models. Flat rate.<\/td>\n<td>$120 ($10 a month)<\/td>\n<\/tr>\n<tr>\n<td>Gemini Pro (Google AI Pro)<\/td>\n<td>The Short course's bot. It sends the morning message.<\/td>\n<td>$0*<\/td>\n<\/tr>\n<tr>\n<td>Obsidian Sync (Standard plan)<\/td>\n<td>Keeps every copy of your notes identical: phone, laptop and the bot's server.<\/td>\n<td>$48<\/td>\n<\/tr>\n<tr>\n<td>Obsidian app, Hermes (the bot software), Telegram<\/td>\n<td>The notes app, the bot's body, the messaging app.<\/td>\n<td>$0<\/td>\n<\/tr>\n<tr>\n<td>Weather, calendar and email data<\/td>\n<td>Everything the bot reads to help you.<\/td>\n<td>$0<\/td>\n<\/tr>\n<tr>\n<td>Nightly off-site backup (Google Drive, free tier)<\/td>\n<td>The safety net. Data only.<\/td>\n<td>$0<\/td>\n<\/tr>\n<tr>\n<td>Hetzner whole-server backup<\/td>\n<td>Turns \"server died\" into a 10-minute fix instead of a 1 to 2 hour rebuild.<\/td>\n<td>$48 ($4 a month)<\/td>\n<\/tr>\n<tr>\n<td><strong>Total<\/strong><\/td>\n<td><\/td>\n<td><strong>About $812 to $872 a year. About $68 to $73 a month.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>*Annie pays nothing extra, because her 2TB Google storage plan includes Gemini Pro. Without that plan, Gemini Pro costs about HK$158 a month. <em>[OPUS EDIT, 15 Oct 2026. Annie's request: Gemini Pro row added at $0, with this note (Annie chose the wording after the audit). The totals do not change.]<\/em><\/p>\n<p><strong>Two things to point out.<\/strong> More than half the yearly cost is flat rate: the two builder plans and notes sync. No meter, no surprises. And every $0 row does real work. The free pieces are most of the system.<\/p>\n<h2>Exercise: Your Wish List, First Draft<\/h2>\n<p>You finish this list in the demo (Module 04), after you have seen every demo. Today is the first draft.<\/p>\n<ol>\n<li>Write down three to five jobs you would hand over today if you could.<\/li>\n<li>For each one, write what you have to remember today to get it done.<\/li>\n<li>Score how much remembering it removes, from 1 to 5. A job you think about every day scores higher than a monthly one.<\/li>\n<li>Mark the harm if it goes wrong.<\/li>\n<\/ol>\n<table>\n<thead>\n<tr>\n<th>Job<\/th>\n<th>What I have to remember today<\/th>\n<th>Remembering removed (1 to 5)<\/th>\n<th>Harm if it goes wrong (low, medium, high)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Keep this sheet. You bring it to the demo (Module 04).<\/p>\n<h2>Today's Agenda<\/h2>\n<p><em>3 minutes.<\/em><\/p>\n<p>Show the day plan. Say where the break is. Full course: four days of about 4 hours each.<\/p>\n<table>\n<thead>\n<tr>\n<th>Day<\/th>\n<th>Modules<\/th>\n<th>You leave with<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>The opener (00), 01, 02, 03A, 03B<\/td>\n<td>You know what you are building. You know which tools answer from Hong Kong. You know what your AI may see. Your notes have one home. Your server is ordered.<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>04, 05, 06, 07, the first half of 08<\/td>\n<td>Two workflows on paper. A file about you. A file that says who your bot is and what it must never do. pi working on your laptop and reading your instructions.<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>08B, the second half of 08<\/td>\n<td>A locked server only you can reach. A bot in Telegram that quotes your rules back and has done its first job. Claude Code working through your own server. A build log and a run card.<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>09, 10, 11, 12<\/td>\n<td>Every step sorted into script, model or person. A backup, an hourly checker and a spending cap. One scheduled job and one skill. A 30-day plan.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Each day opens the same way.<\/strong> Read the \"You leave with\" line for the day. Show the day's modules with the break. Then start.<\/p>\n<p><strong>Day 3 is the long day.<\/strong> Days 1, 2 and 4 run about 4 hours, 3 hours 50 and 3 hours 45. Day 3 runs about 4 hours 20, because it holds the whole server build and the Claude Code half. Say so today, so nobody plans a hard stop at 4 hours. <em>[FABLE EDIT, 13 Oct 2026. Second audit, finding 3. Annie chose on 13 Oct 2026 to keep Day 3 as it is and say so on Day 1. One paragraph added.]<\/em><\/p>\n<p><strong>The gap between Day 1 and Day 3 matters.<\/strong> The server is ordered on Day 1. The server company checks your identity, and that can take a day or more. Day 3 cannot start without it. Keep at least two days between Day 1 and Day 3.<\/p>\n<p><strong>Short course:<\/strong> it runs three days. Its plan is in the Short copy of this module. <em>[OPUS EDIT, 15 Oct 2026. Second audit, finding 5: the Day 1 row now says 03A, 03B, and this line replaces \"still to be made\". Module 08B's front matter now says 160 minutes.]<\/em><\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 2: closing line.]<\/em><\/p>\n<p><strong>Next: the access module (Module 01).<\/strong> You have seen what it does. Now you find out which tools will answer you from Hong Kong.<\/p>\n<h2>Teaching Notes<\/h2>\n<ul>\n<li><strong>Three students at most.<\/strong> Learn their names before the five sentences.<\/li>\n<li><strong>Do not explain the five sentences.<\/strong> Read them. Every one is taught in full later.<\/li>\n<li><strong>Say the bot and the builder apart every time you name one.<\/strong> This is the idea most people miss. The architecture module (Module 03A) says the same in its teaching notes.<\/li>\n<li><strong>The Wish List is a first draft.<\/strong> Students add to it after the demo (Module 04). Do not polish it today.<\/li>\n<li><strong>Every screenshot rule from the demo (Module 04) applies here.<\/strong> Use the edited copies only. Never say a real name aloud.<\/li>\n<\/ul>"}, {"id": "full-1", "title": "01: What Works From Hong Kong", "handout": false, "html": "<h1>Module 01: What Works From Hong Kong<\/h1>\n<p><strong>How to read this file.<\/strong> This file serves both courses.<\/p>\n<ul>\n<li>The Full course (16 hours, with a server) uses every segment.<\/li>\n<li>The Short course (10 hours, laptop first) uses only the segments with minutes in its column.<\/li>\n<\/ul>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 2: bridge block added.]<\/em><\/p>\n<p><strong>Why this module comes here.<\/strong><\/p>\n<ol>\n<li>The opener (Module 00) showed you what the system does. Now you find out which AI companies will answer you from Hong Kong.<\/li>\n<li>Every later module connects to one of those companies. If you pick a tool that does not answer, you build something you cannot reach.<\/li>\n<li>You leave with your Access Sheet: one page listing each tool, whether it works from Hong Kong, and your way to reach it. The privacy module (Module 02) sorts those tools by what each one may see.<\/li>\n<\/ol>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 4, approved by Annie on 13 Oct 2026. In this file: 6 changes, 4 editor notes and the sections Sources, Related moved to <code>editor-notes/01 — Editor's Notes.md<\/code>. Every change, with its old and new text, is listed in FABLE-EDITS.md.]<\/em><\/p>\n<h2>Run Sheet<\/h2>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 13, approved by Annie on 13 Oct 2026: every check in this file now starts \"You know it works when\". AUDIT.md, Finding 13. The old wording of each line is in <code>proposals/13 — One Phrase for Every Check.md<\/code>.]<\/em><\/p>\n<p>Full course: 60 minutes. Short course: 35 minutes. A dash means the segment is not in that course.<\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Annie chose the 10-hour cut on 13 Oct 2026: the live terminal test left the Short course. A Short student first opens a terminal in the build module (Module 08), and pi's first answer proves the connection. Short course 45 to 35 minutes. Annie's Running List had parked \"no terminal at the start\".]<\/em><\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 3: the run sheet row \"Every route to Claude from Hong Kong, and your builders\" (15 min) is now \"Your two builders, and the one decision\" (5 min). The row \"Phones and the Mac\" (5 min) moved to the server module (Module 08B). Full course total was 75 minutes.]<\/em><\/p>\n<table>\n<thead>\n<tr>\n<th>Full (min)<\/th>\n<th>Short (min)<\/th>\n<th>Segment<\/th>\n<th>Facilitator does<\/th>\n<th>Students do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5<\/td>\n<td>5<\/td>\n<td>Why access comes first<\/td>\n<td>Explains why every later module depends on this one. Defines VPN, API and open-weight model<\/td>\n<td>Open laptop and phone, join the Wi-Fi<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>10<\/td>\n<td>Which AI tools work from Hong Kong<\/td>\n<td>Walks the dated table of tools, and the three kinds of block: your connection, your sign-up details and your billing address<\/td>\n<td>Mark the tools they already use<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>—<\/td>\n<td>Check the company's own page<\/td>\n<td>Shows the two supported-countries pages, with Singapore as the known answer that proves each page loaded<\/td>\n<td>Search each page for \"Hong Kong\" and \"Singapore\"<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>—<\/td>\n<td>Live test: read the code the provider sends back<\/td>\n<td>Sits beside each student for their first terminal command<\/td>\n<td>Run both tests and write down each code<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>—<\/td>\n<td>Control tests: how to know what is really blocked<\/td>\n<td>Walks the Gemini control-test table and the three ways a test misled Annie<\/td>\n<td>Name the control in each example<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>—<\/td>\n<td>Your two builders, and the one decision<\/td>\n<td>Explains pi now, Claude Code later through your own server, and the terms question<\/td>\n<td>Write the decision on their sheet<\/td>\n<\/tr>\n<tr>\n<td>—<\/td>\n<td>10<\/td>\n<td>Your builder, and Claude if you want it<\/td>\n<td>Explains pi with opencode Go, the VPN option for Claude, and what the optional server sitting (a separate session to build your own server) adds<\/td>\n<td>Pick a route and write down why<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>10<\/td>\n<td>Fill in your Access Sheet<\/td>\n<td>Checks each sheet and answers questions<\/td>\n<td>Complete the Access Sheet<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>—<\/td>\n<td>Questions, and what the server adds<\/td>\n<td>Previews the server module (Module 08B)<\/td>\n<td>Write one open question on the sheet<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>How the minutes add up.<\/strong><\/p>\n<ul>\n<li><strong>Full course: 60 minutes.<\/strong> Why access comes first takes 5 minutes. The table of which AI tools work from Hong Kong takes 10. Checking the company's page takes 5. The live test takes 10. Control tests take 10. Your two builders and the one decision take 5. The Access Sheet takes 10. Questions take 5.<\/li>\n<li><strong>Short course: 35 minutes.<\/strong> Why access comes first takes 5 minutes. The table of which AI tools work from Hong Kong takes 10. Your builder takes 10. The Access Sheet takes 10. Short course students do not run the live test. They meet the terminal in the build module (Module 08), where pi's first answer proves the connection.<\/li>\n<\/ul>\n<h2>What You Will Leave With<\/h2>\n<p><strong>Your Access Sheet.<\/strong> It is one page. It lists:<\/p>\n<ul>\n<li>every account you have or need<\/li>\n<li>which tools work directly from Hong Kong<\/li>\n<li>your route for each tool that does not work directly<\/li>\n<li>the date you tested each one, because what works can change<\/li>\n<\/ul>\n<p>You use this sheet when you install your builder. You use it again if you build your own server.<\/p>\n<h2>Before This Module<\/h2>\n<ul>\n<li><strong>A laptop you control.<\/strong><\/li>\n<li>A personal Mac is the easiest.<\/li>\n<li>A Windows laptop works. The Windows commands are shown where they are different.<\/li>\n<li>A company laptop often blocks installs and network tools. Do not bring one if you can avoid it.<\/li>\n<li><strong>Full course: a phone with Telegram installed.<\/strong> You do not use Telegram today. You need it later, when you meet your bot. Short course: the Gemini app instead, later, in the skills module (Module 11). <em>[FABLE EDIT, 13 Oct 2026. Proposal 8, approved by Annie on 13 Oct 2026: Telegram is Full course only. The Short course's bot is Gemini.]<\/em><\/li>\n<li><strong>A Google account.<\/strong> Gemini works in Hong Kong with no extra steps. So today it is the tool we know works, to compare the others against.<\/li>\n<li><strong>Nothing else.<\/strong> Do not buy a VPN or a server before this session. This module explains what you need.<\/li>\n<\/ul>\n<h2>Why Access Comes First<\/h2>\n<p>This course builds a personal AI system. You met two of its parts in the opener (Module 00). It has up to three:<\/p>\n<ul>\n<li><strong>The builder<\/strong> is an AI that writes and fixes code for you. You describe what you want in plain English.<\/li>\n<li><strong>The bot<\/strong> is an AI you send messages to on your phone.<\/li>\n<li><strong>The server<\/strong> is a small rented computer in another country. It runs all day.<\/li>\n<\/ul>\n<p>Each part talks to an AI company over the internet. From Hong Kong, some of those companies do not answer.<\/p>\n<p>If you choose your tools before you know which ones answer, you build a system you cannot reach. Annie lost about a week to one of these blocks in May 2026 (Build Log 00). This module helps you avoid that.<\/p>\n<p><strong>Three words you will hear all day:<\/strong><\/p>\n<ul>\n<li><strong>VPN.<\/strong> A VPN sends your internet traffic through a computer in another country. The AI company then sees that country, not Hong Kong.<\/li>\n<li><strong>API.<\/strong> An API is how a program talks to an AI company. A person types in a chat window. A program uses an API instead. Your builder and your bot both use one.<\/li>\n<li><strong>Open-weight model.<\/strong> An AI model whose makers publish it, so many companies can run it. DeepSeek, Qwen, GLM and Kimi are open-weight models. They answer from Hong Kong.<\/li>\n<\/ul>\n<p>The opener (Module 00) gave you three more: harness, AI provider and AI model. The architecture module (Module 03A) explains each one in more detail.<\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 5, approved by Annie on 13 Oct 2026: two lines changed to point at the opener. The old lines are in FABLE-EDITS.md.]<\/em><\/p>\n<p><strong>The block comes from the AI companies, not from Hong Kong.<\/strong><\/p>\n<ul>\n<li>Many people think the Hong Kong government blocks these tools. It does not.<\/li>\n<li>Hong Kong's internet is open. You can reach any website.<\/li>\n<li>The AI companies choose not to serve Hong Kong. Their own pages give no reason.<\/li>\n<li>So the check happens at the company, every time you send a request.<\/li>\n<\/ul>\n<h2>Which AI Tools Work From Hong Kong<\/h2>\n<p>This table was checked on 2 October 2026. The Anthropic, OpenAI and opencode rows were checked again on 9 October 2026.<\/p>\n<p><strong>What works can change, so the date matters.<\/strong> In March 2026 the Gemini row changed from blocked to open. Annie's own notes stayed wrong until someone checked (Build Log 83). Check this table again in the week before you teach it.<\/p>\n<table>\n<thead>\n<tr>\n<th>Company or tool<\/th>\n<th>From a Hong Kong connection<\/th>\n<th>Notes<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Google Gemini (consumer app)<\/td>\n<td>Works directly<\/td>\n<td>Web from 16 March 2026, mobile from 27 March 2026 (Hong Kong Free Press, 16 Mar 2026). The paid Pro tier works too. A seminar room in Hong Kong paid for it on 6 October 2026 (Build Log 123).<\/td>\n<\/tr>\n<tr>\n<td>Google AI Studio, Antigravity and other Google developer tools<\/td>\n<td>Blocked<\/td>\n<td>Consumer Gemini is open. The developer tools are not.<\/td>\n<\/tr>\n<tr>\n<td>Anthropic: claude.ai, the Claude apps, Claude Code and the API<\/td>\n<td>Blocked<\/td>\n<td>Hong Kong is not on Anthropic's list of supported countries (checked 9 Oct 2026). The phone apps are blocked too. Tested on Android with the VPN off on 27 Aug 2026 (Build Log 68).<\/td>\n<\/tr>\n<tr>\n<td>OpenAI: ChatGPT and the API<\/td>\n<td>Blocked<\/td>\n<td>Hong Kong is not on OpenAI's list of supported countries (checked 9 Oct 2026). OpenAI refuses Hong Kong phone numbers at sign-up (PTS Consulting, seen 2 Oct 2026).<\/td>\n<\/tr>\n<tr>\n<td>DeepSeek, Kimi (Moonshot), GLM (Zhipu), Qwen (Alibaba)<\/td>\n<td>Work directly<\/td>\n<td>Open-weight models. You can reach them directly, or through a company that resells them.<\/td>\n<\/tr>\n<tr>\n<td>opencode Go (a monthly AI provider plan)<\/td>\n<td>Works directly<\/td>\n<td>It answered from Hong Kong on 30 Sep 2026 (Build Log 103) and again on 9 Oct 2026. Annie's three bots use it. Its model list also has one Claude model. The optional server sitting, or the server module (Module 08B), explains it, under \"Other Ways to Reach Claude\".<\/td>\n<\/tr>\n<tr>\n<td>OpenRouter (a company that resells many models)<\/td>\n<td>Works for open-weight models only<\/td>\n<td>Annie tested her OpenRouter key. Every Anthropic, OpenAI and Google model returned a 403 error, \"provider Terms of Service\", even for a plain hello. The open-weight models answered on the same key (Build Logs 29, 80 and 84).<\/td>\n<\/tr>\n<tr>\n<td>Mistral, Grok, Perplexity, Microsoft Copilot<\/td>\n<td>Reported to work directly<\/td>\n<td>Not tested for this course. Facilitator: test these before teaching, or remove the row.<\/td>\n<\/tr>\n<tr>\n<td>Telegram, Tailscale, Obsidian<\/td>\n<td>Work directly<\/td>\n<td>The messaging app, the private network and the notes app. None of them is an AI company.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p class=\"marker\"><em>[OPUS EDIT, 15 Oct 2026. Second audit, finding 7: the opencode Go row now names the optional server sitting as well.]<\/em><\/p>\n<p><strong>There are three kinds of block. A fix for one does not fix the others.<\/strong><\/p>\n<ol>\n<li><strong>Your connection.<\/strong> The company sees a Hong Kong address and refuses. A VPN or your own server fixes this one.<\/li>\n<li><strong>Your sign-up details.<\/strong> OpenAI refuses Hong Kong phone numbers. A VPN does not change your phone number.<\/li>\n<li><strong>Your billing address.<\/strong> In May 2026, Anthropic's developer website did not accept a Hong Kong billing address. A VPN changed nothing, because the check was on the card, not the connection (Build Log 00). Annie's system stopped using that service on 25 September 2026 (Build Log 89). So you may never need it. It is still worth knowing, because it cost her a week.<\/li>\n<\/ol>\n<h2>Check the Company's Own Page<\/h2>\n<p><em>Full course.<\/em><\/p>\n<p>You can check a block without a terminal. Open the company's list of supported countries and search it.<\/p>\n<ol>\n<li>Open Anthropic's page: <code>https://www.anthropic.com/supported-countries<\/code>. Search it for \"Hong Kong\". It is not there.<\/li>\n<li>Search the same page for \"Singapore\". It is there.<\/li>\n<li>Do the same on OpenAI's page: <code>https://developers.openai.com/api/docs/supported-countries<\/code>.<\/li>\n<\/ol>\n<p><strong>Why step 2 matters.<\/strong><\/p>\n<ul>\n<li>If a page does not load, your search finds nothing.<\/li>\n<li>If a page loads but has no Hong Kong, your search also finds nothing.<\/li>\n<li>These two look the same. Finding Singapore proves the page loaded. So the missing Hong Kong is real.<\/li>\n<\/ul>\n<p>This kind of check is called a <strong>control<\/strong>. A control is a check where you already know the answer. You run it next to the check you are unsure of.<\/p>\n<p>On 9 October 2026, both pages listed Singapore, Japan and Taiwan. Neither listed Hong Kong or Macau.<\/p>\n<h2>Live Test: Read the Code the Provider Sends Back<\/h2>\n<p>You do not need to guess whether a tool is blocked. Ask the company's server, and read the number it sends back. Every web request gets a number back, called a status code. Five codes matter here.<\/p>\n<table>\n<thead>\n<tr>\n<th>Code<\/th>\n<th>What it means for you<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>403<\/td>\n<td>Forbidden. The company refused you. From Hong Kong this is usually the regional block.<\/td>\n<\/tr>\n<tr>\n<td>401<\/td>\n<td>Unauthorised. The company answered and asked for a key. Access works.<\/td>\n<\/tr>\n<tr>\n<td>405<\/td>\n<td>Wrong method. The company answered, but expected a different kind of request. Access works.<\/td>\n<\/tr>\n<tr>\n<td>404<\/td>\n<td>Not found. The company answered, but not at that address. Check that you copied the whole command.<\/td>\n<\/tr>\n<tr>\n<td>No answer (a timeout)<\/td>\n<td>A network problem, not the company's decision. Check your Wi-Fi or VPN.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Step 1. Open a terminal.<\/strong><\/p>\n<ul>\n<li>On a Mac: press Command and Space, type Terminal, and press Return.<\/li>\n<li>On Windows: open the Start menu, type PowerShell, and press Return.<\/li>\n<\/ul>\n<p><strong>Step 2. Test Anthropic.<\/strong> Paste this line and press Return. It asks Anthropic's API for a page, and prints only the status code.<\/p>\n<p>On a Mac:<\/p>\n<pre><code class=\"language-bash\">curl -s -o /dev/null -w &quot;%{http_code}\\n&quot; https://api.anthropic.com/v1/messages\n<\/code><\/pre>\n<p>On Windows (PowerShell):<\/p>\n<pre><code class=\"language-powershell\">curl.exe -s -o NUL -w &quot;%{http_code}&quot; https://api.anthropic.com/v1/messages\n<\/code><\/pre>\n<p><strong>You know it works when<\/strong> a three-digit number appears on the next line.<\/p>\n<ul>\n<li>From a Hong Kong connection with no VPN: 403.<\/li>\n<li>With a VPN on: 405 or 401. Both mean the company answered.<\/li>\n<\/ul>\n<p>Write your code on your sheet.<\/p>\n<p><strong>Step 3. Test opencode, an AI provider for open models.<\/strong> This line is different from the Anthropic line. It ends in <code>-X POST<\/code>, because opencode only answers that kind of request at this address.<\/p>\n<p>On a Mac:<\/p>\n<pre><code class=\"language-bash\">curl -s -o /dev/null -w &quot;%{http_code}\\n&quot; -X POST https://opencode.ai/zen/go/v1/chat/completions\n<\/code><\/pre>\n<p>On Windows (PowerShell):<\/p>\n<pre><code class=\"language-powershell\">curl.exe -s -o NUL -w &quot;%{http_code}&quot; -X POST https://opencode.ai/zen/go/v1/chat/completions\n<\/code><\/pre>\n<p><strong>You know it works when<\/strong> it prints 401. The company answered and wants a key. If you see 404, you left out <code>-X POST<\/code>.<\/p>\n<p><strong>If it fails:<\/strong><\/p>\n<ul>\n<li>If you see \"command not found\", you are probably in the wrong program. Close it. Open Terminal or PowerShell again.<\/li>\n<li>If nothing prints for 30 seconds, press Control and C. Then check your Wi-Fi.<\/li>\n<\/ul>\n<h3>Your Terminal Window for the Rest of the Course<\/h3>\n<p><em>Annie's notes, 10 Oct 2026. Reading only, no extra minutes. You make these settings in the build module (Module 08), once a builder is installed.<\/em><\/p>\n<p>This is the first time you open a terminal. Your builders run in a terminal for the rest of the course. So choose your window now.<\/p>\n<p><strong>Your choices:<\/strong><\/p>\n<ul>\n<li>the plain Terminal app that came with your Mac<\/li>\n<li>Ghostty, a free terminal app (ghostty.org)<\/li>\n<li>the Claude desktop app's Code tab<\/li>\n<\/ul>\n<p>All three run the same builder (Seminar Ideas, 30 Jun 2026). Facilitator: Ghostty is for Mac. Confirm the Windows choice on the day.<\/p>\n<p><strong>Annie's advice: use a terminal (Terminal or Ghostty), not the desktop app.<\/strong> Her reason is that it uses fewer tokens. This is what she noticed from daily use. It is not a measurement.<\/p>\n<p><strong>Four things to know now. The build module (Module 08) sets them up.<\/strong><\/p>\n<ol>\n<li><strong>Scrolling back can stop working while Claude Code runs in a terminal.<\/strong>\n   - Why: Claude Code's \"fullscreen\" display keeps old messages inside Claude Code, not in the terminal's own history. With the mouse turned off, the scroll wheel cannot reach them.\n   - The fix is one setting: <code>\"tui\": \"default\"<\/code> in Claude Code's settings file. This switches to the classic display. Every message then stays in the terminal's history. The scroll wheel and normal text selection work.\n   - Annie made this change on 10 Oct 2026 (Claude Code settings documentation, \"tui\").\n   - In the fullscreen display, Page Up and Page Down still scroll. Control and O opens the full conversation.<\/li>\n<li><strong>Copy and paste does not work at first in Claude Code,<\/strong> because Claude Code takes control of the mouse. In the Full course, pi changes this setting for you, because pi is installed first. Claude Code can also change it itself.<\/li>\n<li><strong>You can choose what shows at the bottom of the window.<\/strong> This line is called the status line. It can show:\n   - how much of the conversation space is used\n   - money spent\n   - the model name and effort level\n   - the folder the builder opened in\n   - the mode, for example auto or planning<\/li>\n<\/ol>\n<p>The status line belongs to the builder, not to the window. So pi and Claude Code show different items. You set up each one separately.\n4. <strong>The keys that control a builder while it works:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Key<\/th>\n<th>What it does<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Escape<\/td>\n<td>Stops the builder in the middle of a job. Annie used the tools for weeks before she knew this<\/td>\n<\/tr>\n<tr>\n<td>Enter<\/td>\n<td>Sends your message. While the builder works, Enter does not stop the job. But it does not wait for the job to end either. Both builders read your message as soon as the current step finishes, inside the same job. So it can change what the builder does next. This is true in Claude Code and in pi<\/td>\n<\/tr>\n<tr>\n<td>Control and Enter<\/td>\n<td>Claude Code only. Sends your waiting messages at once. If Claude is only writing its answer, this interrupts it. Work that runs in the background keeps running<\/td>\n<\/tr>\n<tr>\n<td>Control and X, then Enter<\/td>\n<td>Claude Code's built-in key to queue a message for after the job. The message waits its turn and never interrupts the job. Annie moved this to Option and Enter on her Mac on 10 Oct 2026. The build module (Module 08) shows how<\/td>\n<\/tr>\n<tr>\n<td>Option and Enter (Mac), Control and Q (Windows)<\/td>\n<td>pi's default key to queue a message for after the job. Nothing needs setting up. pi holds the message until the whole job is finished. On Windows it is Control and Q, because Windows Terminal already uses Alt and Enter for full screen. Option and Up arrow (Alt and Q on Windows) brings waiting messages back so you can edit them<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>Corrected 10 Oct 2026. The first version of this table said Enter makes messages wait until the job is finished. That was wrong.<\/em><\/p>\n<ul>\n<li><em>Claude Code's documentation says a message sent with Enter reaches Claude \"as soon as those tool calls finish, within the same turn\" (Claude Code docs, \"When Claude Code sends what you queued\").<\/em><\/li>\n<li><em>pi's documentation says the same: Enter \"guides the next response\", and Alt and Enter \"waits until Pi finishes the current task\" (pi docs, usage, \"Follow Pi's work\").<\/em><\/li>\n<li><em>Annie proved the Claude Code behaviour on 10 Oct 2026. A question she typed in the middle of a job was answered inside that same job.<\/em><\/li>\n<li><em>The Windows keys come from pi's keybindings page. Nobody has tested them on a Windows machine.<\/em><\/li>\n<\/ul>\n<p><strong>Why Enter counts as steering, even when the builder answers your first question first.<\/strong> This confused Annie at first. Here it is in plain steps (Annie and Claude, 10 Oct 2026).<\/p>\n<ol>\n<li><strong>One reply is many small steps.<\/strong> When you ask the builder something, it does not answer in one go. It might search a file, then check a setting, then write the answer. That is three steps inside one reply.<\/li>\n<li><strong>A message sent with Enter arrives between steps.<\/strong> If you press Enter while the builder is busy, it reads your message as soon as the current step finishes. That is before the job is done.<\/li>\n<li><strong>Then the builder decides what to do with it.<\/strong> Annie once typed \"what's 4 + 4?\" in the middle of a job. It had nothing to do with the job. So the builder carried on and answered both questions at the end. From the outside, that looked like a queue.<\/li>\n<li><strong>It counts as steering, because it could have changed the rest of the job.<\/strong> Suppose Annie had typed \"stop, don't touch the settings files\" instead. The builder would have read it before its next step, and skipped that work. Her message changed nothing only because 4 + 4 was unrelated.<\/li>\n<li><strong>The queue key is different.<\/strong> With Option and Enter, the builder does not see your message until the whole reply is finished. A \"don't touch the settings files\" sent that way would arrive too late, after the files were already changed.<\/li>\n<\/ol>\n<p><strong>In short:<\/strong><\/p>\n<ul>\n<li>Enter means \"read this at your next step, and change course if it matters\".<\/li>\n<li>Option and Enter means \"don't show me this until you're finished\".<\/li>\n<\/ul>\n<p><strong>When to use which:<\/strong><\/p>\n<ul>\n<li>Use Enter to correct the builder in the middle of a job.<\/li>\n<li>Use Option and Enter for a new, unrelated task that should not pull the builder away from the current one.<\/li>\n<\/ul>\n<p><strong>You can change any of these keys, and add your own.<\/strong> You can move most keys in a builder to a key you prefer. Annie does not know every shortcut, and nobody needs to. To find them:<\/p>\n<ul>\n<li>search the web for the builder's name and \"keyboard shortcuts\", for example \"Claude Code keyboard shortcuts\", or<\/li>\n<li>ask your builder to list its shortcuts and change one for you (Annie, 10 Oct 2026).<\/li>\n<\/ul>\n<p><em>Short course:<\/em> you build with pi only. So the two Claude Code rows apply only if you add Claude later.<\/p>\n<p><strong>What these tests returned when this module was checked:<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>Test<\/th>\n<th>Where the request came from<\/th>\n<th>Code<\/th>\n<th>Source<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>The Anthropic test<\/td>\n<td>Hong Kong<\/td>\n<td>403<\/td>\n<td>9 Oct 2026, through a service that sends requests from a chosen country (see trap 3 under \"Control Tests\" below: check where your test really came from)<\/td>\n<\/tr>\n<tr>\n<td>The Anthropic test<\/td>\n<td>Taiwan and Singapore<\/td>\n<td>405<\/td>\n<td>9 Oct 2026<\/td>\n<\/tr>\n<tr>\n<td>The opencode test<\/td>\n<td>Hong Kong<\/td>\n<td>401<\/td>\n<td>Build Log 103, 30 Sep 2026<\/td>\n<\/tr>\n<tr>\n<td>The opencode test<\/td>\n<td>Taiwan and Singapore<\/td>\n<td>401<\/td>\n<td>9 Oct 2026<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Control Tests: How to Know What Is Really Blocked<\/h2>\n<p><em>Full course.<\/em><\/p>\n<p>\"It is broken\" and \"I am refused\" are different. Only one of them tells you what to do next. A control test tells them apart.<\/p>\n<ul>\n<li>Run the thing you are unsure of.<\/li>\n<li>At the same moment, from the same machine, run a thing you know works.<\/li>\n<li>Compare the two results.<\/li>\n<\/ul>\n<p><strong>The example from Annie's record.<\/strong> A note in Annie's system said Gemini could not be used from her server. She asked whether that was true. This is how it was proved (Build Log 29):<\/p>\n<table>\n<thead>\n<tr>\n<th>Test, from the server, same key, same moment<\/th>\n<th>Result<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Google Gemini 2.5 Flash, through the reseller<\/td>\n<td>403<\/td>\n<\/tr>\n<tr>\n<td>Google Gemini 2.5 Pro, through the reseller<\/td>\n<td>403<\/td>\n<\/tr>\n<tr>\n<td>Qwen3 Coder, through the reseller<\/td>\n<td>200 (it worked)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>The third line is the control.<\/p>\n<ul>\n<li>The key worked for Qwen. So the key was fine, and Google was refusing.<\/li>\n<li>The error said \"violation of provider Terms Of Service\".<\/li>\n<li>The usual explanation is that Google refuses Gemini requests from data-centre addresses. But that is a guess. The error does not say it.<\/li>\n<li>So the note was rewritten to say only what the server returned.<\/li>\n<\/ul>\n<p><strong>Three traps Annie's record already found.<\/strong><\/p>\n<ol>\n<li><strong>Do not test the website with this command.<\/strong>\n   - In August 2026 a test of claude.ai returned 403, even from the Singapore server, where Claude is supported.\n   - The page was a check for bots. A real browser passes it. A terminal command cannot.\n   - The API address gives an honest answer (Build Log 69).<\/li>\n<li><strong>A working tool from the same company tells you where not to look.<\/strong>\n   - In September 2026 Annie could not open Claude Code on her server from her phone. She thought the VPN was the cause.\n   - At the same moment, on the same phone, through the same route, her phone chat with Claude worked. So the network was fine.\n   - The real cause was an expired login on the server (Build Log 75).<\/li>\n<li><strong>Check where your test really came from.<\/strong> On 9 October 2026, this module's Hong Kong test came back from the wrong country two times.\n   - The first run came from a laptop whose connection went out through Taiwan. Anthropic serves Taiwan, so it returned 405.\n   - The second run used a service that sends web requests from a chosen country. Asked for Hong Kong, it switched to another address without saying so. Its report showed New York time. It also returned 405.\n   - The third run used a setting that had already passed a location check: a page that reports your country had said \"HK\". Its report showed Hong Kong time. It returned 403, as this module expects.\n   - A test from the wrong country gives a clear answer to the wrong question.<\/li>\n<\/ol>\n<h2>Your Two Builders, and the One Decision<\/h2>\n<p><em>Full course. 5 minutes.<\/em><\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 3: this section replaces \"Every Route to Claude From Hong Kong, and Your Builders\" (15 minutes). The three other routes to Claude (a paid VPN, Claude Code on the server, a Claude model through opencode) and the Haiku paragraph now live in the server module (Module 08B), under \"Other Ways to Reach Claude, and Why This Course Uses Your Server\".]<\/em><\/p>\n<p>A builder is an AI that installs software, edits files and fixes problems. You tell it what you want in plain English.<\/p>\n<p>This course uses two builders.<\/p>\n<p><strong>pi.<\/strong> pi works from Hong Kong with nothing else turned on. It uses open models such as DeepSeek, through a company called opencode Go. You install pi first, in the build module (Module 08). pi then builds your server.<\/p>\n<p><strong>Claude Code.<\/strong> Claude Code is made by Anthropic. Anthropic does not serve Hong Kong. So Claude Code works only through your own rented server in Singapore. You install Claude Code last, in the second half of the build module (Module 08), after your server works.<\/p>\n<p><strong>The one decision today: pi now, Claude Code later, through your own server.<\/strong> Write it on your Access Sheet.<\/p>\n<p><strong>Why this order.<\/strong> pi needs no route out of Hong Kong. So pi keeps working when the route breaks. Annie's laptop runs on its normal Hong Kong connection for this reason. Claude Code is not her only builder (Build Log 103).<\/p>\n<p><strong>Which one is easier?<\/strong> On 29 September 2026 Annie tested Claude Code beside an open-model builder for a full day. She found Claude Code much easier for a non-developer building something new. It works out what you meant from an unclear description. pi needs clearer instructions from you (Annie's notes, 29 Sep 2026).<\/p>\n<p><strong>Whether a workaround breaks a company's terms is yours to decide.<\/strong><\/p>\n<ul>\n<li>A VPN or a server in another country is a workaround. It is not an official route.<\/li>\n<li>Anthropic's terms may not allow use from a region it does not serve.<\/li>\n<li>Each person is responsible for staying within local law and each company's terms.<\/li>\n<li>Answer questions about this with facts. Let each student decide.<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Claude Code (harness)<\/th>\n<th>pi (harness) with opencode Go (AI provider)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Works from a Hong Kong connection<\/td>\n<td>No. Needs your own server, or a VPN<\/td>\n<td>Yes<\/td>\n<\/tr>\n<tr>\n<td>Monthly cost<\/td>\n<td>$17 to $20 for Claude Pro, plus your server<\/td>\n<td>$10 for opencode Go<\/td>\n<\/tr>\n<tr>\n<td>Strength<\/td>\n<td>Understands unclear, plain-English requests<\/td>\n<td>Cheap and fast. Good inside a system that already exists<\/td>\n<\/tr>\n<tr>\n<td>Weakness<\/td>\n<td>Needs a route, and may break Anthropic's terms (see above)<\/td>\n<td>Needs clearer instructions from you<\/td>\n<\/tr>\n<tr>\n<td>Used in the Full course for<\/td>\n<td>Building, after the server work<\/td>\n<td>Your first builder. It builds your server<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p class=\"marker\"><em>[OPUS EDIT, 15 Oct 2026. Cost marks: the monthly cost row filled from the opener's cost table. Claude Pro is $20 a month, or $200 a year paid yearly, which is about $17 a month.]<\/em><\/p>\n<p>opencode Go is also the AI provider for your bot. The architecture module (Module 03A) explains this.<\/p>\n<p>The other ways to reach Claude from Hong Kong are in the server module (Module 08B), where you build one of them.<\/p>\n<h2>Your Builder, and Claude If You Want It<\/h2>\n<p><em>Short course.<\/em><\/p>\n<p>You need a builder for this course. A builder is the AI that installs software, edits files and fixes problems while you describe what you want in plain English.<\/p>\n<p><strong>In this course you build with pi (harness), connected to opencode Go (AI provider).<\/strong><\/p>\n<ul>\n<li>pi is a way to connect to many AI models, such as DeepSeek and Kimi K3. These open models are good, and they cost much less than the big Western models. opencode Go costs $10 a month. <em>[OPUS EDIT, 15 Oct 2026. Cost marks: one price added.]<\/em><\/li>\n<li>pi answers from Hong Kong directly. You need no VPN and no server (Build Log 103).<\/li>\n<li>pi understands unclear instructions less well than Claude Code. So your instructions need to be clear. This course shows you how to write them.<\/li>\n<\/ul>\n<p><strong>If you want Claude, a VPN is a very good option.<\/strong><\/p>\n<ul>\n<li>With a VPN on, Claude Code works on your laptop. A VPN costs about $3 a month. Annie pays that for ExpressVPN. Claude Pro costs $17 to $20 a month on top. <em>[OPUS EDIT, 15 Oct 2026. Cost marks: VPN price is Annie's own ExpressVPN plan (Annie's answer, 15 Oct 2026).]<\/em><\/li>\n<li>Annie found Claude Code much easier for a non-developer building something new. It works out what you meant from an unclear description (Annie's notes, 29 Sep 2026).<\/li>\n<li>She reached Claude through a paid VPN before she had her own server.<\/li>\n<li>Anthropic's terms may not allow use from a region it does not serve. So whether to use a VPN is your own decision.<\/li>\n<\/ul>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 3: the paragraph \"A Claude model through opencode: being checked\" moved from here to the Teaching Notes. It was a facilitator check, not student material.]<\/em><\/p>\n<p><strong>The optional server sitting.<\/strong> Students who choose it build their own server in Singapore. The server then becomes their route to Claude, with no paid VPN. It runs as a separate sitting, outside this course's 10 hours.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>pi (harness) with opencode Go (AI provider)<\/th>\n<th>Claude Code (harness) through a VPN<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Works from a Hong Kong connection<\/td>\n<td>Yes<\/td>\n<td>Yes, with the VPN on<\/td>\n<\/tr>\n<tr>\n<td>Monthly cost<\/td>\n<td>$10 for opencode Go<\/td>\n<td>About $20 to $23: Claude Pro plus the VPN<\/td>\n<\/tr>\n<tr>\n<td>Strength<\/td>\n<td>Cheap, fast, and no VPN<\/td>\n<td>Understands unclear, plain-English requests<\/td>\n<\/tr>\n<tr>\n<td>Weakness<\/td>\n<td>Needs clearer instructions from you<\/td>\n<td>Needs the VPN on, and may break Anthropic's terms (see above)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p class=\"marker\"><em>[OPUS EDIT, 15 Oct 2026. Cost marks: the monthly cost row filled. The VPN figure is Annie's own ExpressVPN price (Annie's answer, 15 Oct 2026).]<\/em><\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 3: the section \"Phones and the Mac\" moved from here to the server module (Module 08B), inside \"The Exit Node\", after \"Use one switch with two settings\". It explains Tailscale app settings, and Tailscale is installed there.]<\/em><\/p>\n<h2>From the Record<\/h2>\n<p><strong>The test that was not clean.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> In August 2026 Claude suggested two times that the Claude phone app might work in Hong Kong without a VPN. The first time, Tailscale was still connected during the test. The second time, Claude misread a \"Logged out\" label as \"VPN is down\". Both conclusions were wrong, and Annie caught both.<\/li>\n<li><strong>The cost:<\/strong> two wasted rounds of testing.<\/li>\n<li><strong>The lesson:<\/strong> when a test seems to disprove something you already know, check that the test was clean before you believe it.<\/li>\n<li><strong>Source:<\/strong> Build Log 68.<\/li>\n<\/ul>\n<p><strong>The models on the price list that would not answer.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> In September 2026 Claude recommended two Western models for Annie's bots. Both were blocked for her reseller account, and her notes already said so. Annie asked, \"is Haiku better than GLM? try again.\" A one-line hello through her OpenRouter key returned 403 for every Anthropic and Google model. Only the open-weight models answered.<\/li>\n<li><strong>The cost:<\/strong> a bot that would not have worked was nearly built.<\/li>\n<li><strong>The lesson:<\/strong> a model on a price list may still refuse you. Before you recommend one, send it a hello from the machine and key that will really use it.<\/li>\n<li><strong>Source:<\/strong> Build Logs 80 and 84.<\/li>\n<\/ul>\n<p><strong>The table that went out of date.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> For months, Annie's notes said that Google's AI was blocked in Hong Kong. In March 2026, consumer Gemini opened to Hong Kong. Nobody noticed until September, when a beginner seminar was being planned and Annie found the change herself.<\/li>\n<li><strong>The cost:<\/strong> a seminar was nearly designed around a tool the audience could not use. The tool they could use was already open.<\/li>\n<li><strong>The lesson:<\/strong> put a date on every fact about what works. Check it again before you teach or build on it.<\/li>\n<li><strong>Source:<\/strong> Build Log 83.<\/li>\n<\/ul>\n<p><strong>The block that a VPN cannot fix.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> In May 2026 Annie needed to buy API credit for her first bot. The developer website refused a Hong Kong billing address. A VPN changed nothing, because the check was on the card. It took about a week of her own research to find a way.<\/li>\n<li><strong>The lesson:<\/strong> your connection, your sign-up details and your billing address are three separate checks. A fix for one does not fix the others.<\/li>\n<li><strong>Source:<\/strong> Build Log 00.<\/li>\n<\/ul>\n<p><strong>The test that came from the wrong country.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> On 9 October 2026, this module's own Hong Kong test came back \"405, access works\" two times. The first run went out through Taiwan. The second went out through an address on New York time. A third run, from a setting that had passed a location check, returned 403.<\/li>\n<li><strong>The cost:<\/strong> nothing, because the third run happened before the table was written.<\/li>\n<li><strong>The lesson:<\/strong> before you trust a location test, prove where the request came from.<\/li>\n<li><strong>Source:<\/strong> this module's own test, 9 Oct 2026.<\/li>\n<\/ul>\n<p><strong>Why the Mac uses an on/off switch.<\/strong> <em>Full course.<\/em><\/p>\n<ul>\n<li><strong>What happened:<\/strong> In August 2026 Annie's Mac was set up to send only Claude's traffic through her server, and keep everything else in Hong Kong. It was built two times and removed once. Each time, a fragile setting sat in front of her most important tool. Once, an empty settings box broke it with no warning. On 30 September it was replaced with the simple on/off switch above. The switch was safe because pi, which needs no route, was now her second builder.<\/li>\n<li><strong>The lesson:<\/strong> do not put a fragile setting between you and the tool you depend on most. Keep a second tool that does not need that setting.<\/li>\n<li><strong>Sources:<\/strong> Build Logs 69 and 103.<\/li>\n<\/ul>\n<h2>Exercise<\/h2>\n<p>Run the live test for both companies. Then answer three questions in writing.<\/p>\n<ol>\n<li>Which status code did each company return, and what does that code mean?<\/li>\n<li>Which builder will you use? What is your route to Claude, if you want one? Give your reason in one sentence.<\/li>\n<li>Which AI tools have you been reaching through another route, such as a VPN or a work network? Did you know you were doing that?<\/li>\n<\/ol>\n<p>Most people find at least one tool they reach through another route.<\/p>\n<h2>Worksheet: Your Access Sheet<\/h2>\n<p>Copy this table into a new note called <code>Access Sheet<\/code> in your notes app. You move it into your notes folder later in the course.<\/p>\n<table>\n<thead>\n<tr>\n<th>Tool<\/th>\n<th>What I use it for<\/th>\n<th>Works from Hong Kong directly? (Y / N / test code)<\/th>\n<th>My route<\/th>\n<th>Account created?<\/th>\n<th>Tested on (date)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Gemini (consumer)<\/td>\n<td><\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My builder (pi, and Claude Code in the Full course)<\/td>\n<td>Building and fixing<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Claude, if I want it<\/td>\n<td><\/td>\n<td><\/td>\n<td>VPN, my server, or opencode<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>opencode Go (AI provider)<\/td>\n<td>The models for my bot and for pi<\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Telegram (Full course)<\/td>\n<td>Talking to my bot<\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Gemini (Short course)<\/td>\n<td>My morning message<\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Obsidian<\/td>\n<td>My notes, in one place<\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Tailscale (Full course, or the server sitting)<\/td>\n<td>Private network and route out<\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Server company (Full course, or the server sitting)<\/td>\n<td>Computer that is always on<\/td>\n<td><\/td>\n<td>Direct<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Other:<\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>My open question for the facilitator:<\/strong><\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 2: closing line added.]<\/em><\/p>\n<p><strong>Next: the privacy module (Module 02).<\/strong> You know which tools answer. Now you decide what each one is allowed to see.<\/p>\n<h2>Teaching Notes<\/h2>\n<ul>\n<li><strong>Three students at most in each class<\/strong> (Annie's rule, 9 Oct 2026). Hard material cannot be taught well to a bigger group. Sit beside each student for their first terminal command. Never take the keyboard. The student must be able to do it again at home, alone.<\/li>\n<li><strong>Expect the terms question early.<\/strong> Someone will ask whether a VPN is legal or allowed. Answer with facts only:<\/li>\n<li>The block is the company's choice.<\/li>\n<li>A workaround may break the company's terms.<\/li>\n<li>Each person decides.<\/li>\n<li>Do not promise that any route will keep working.<\/li>\n<li><em>[FABLE EDIT, 13 Oct 2026. Proposal 3: moved here from student text.]<\/em> <strong>A Claude model through opencode is being checked.<\/strong> opencode Go's model list has one Claude model, Claude Haiku 5.5, the smallest one. On 9 October 2026 it answered through Annie's opencode Go plan from a Taiwan connection. It has not been tested from Hong Kong. Run the check in the Merge Tracker before teaching. Until it passes from Hong Kong, call it \"being checked\". The larger Claude models are pay-per-use only on opencode, not on the Go plan. <em>[OPUS EDIT, 15 Oct 2026. Cost marks: mark removed. Zen has no fixed price, and the course does not use it.]<\/em><\/li>\n<li><strong>Never say Claude Code or the Claude apps work in Hong Kong without a route.<\/strong> This includes the phone apps. If a Claude screen seems to work without a route, the usual reason is that the session is really running on a server in another country. The one open question is a Claude model through opencode. Until that check passes from Hong Kong, call it \"being checked\".<\/li>\n<li><strong>The terminal is new for most students.<\/strong> Say \"unfamiliar, not hard\".<\/li>\n<li><strong>Windows students need different commands.<\/strong> Keep the PowerShell lines on the slide next to the Mac lines. Nobody has run the Windows lines on a Windows laptop yet. Run them once before teaching.<\/li>\n<li><strong>Company laptops cause most failures.<\/strong> Firewalls and company settings often block the test. If a student has one, they run the live test at home on a personal laptop. They write the result on their sheet for the next session.<\/li>\n<li><strong>If the Wi-Fi is slow,<\/strong> make the live test homework. Do not drop the Access Sheet, because later modules use it.<\/li>\n<li><strong>Full course students will build systems themselves.<\/strong> For them, the method matters more than today's table: date every fact, run a control, and prove where a test came from. Spend the control-test minutes on that.<\/li>\n<\/ul>\n<p><strong>Where v1's other stories went.<\/strong> v1's Block 1 had eleven stories. In the merge:<\/p>\n<ul>\n<li>Log 20 (the drafts permission) moves to the privacy module (Module 02).<\/li>\n<li>Log 15 and v1's \"Which Model for What\" table move to the script, machine learning or AI judgement module.<\/li>\n<li>Log 28 (the desktop app) moves to the architecture module (Module 03A).<\/li>\n<li>Log 63 (the server as exit node) moves to the server module (Module 08B), with the server's location corrected to Singapore.<\/li>\n<li>Log 70 (the leftover proxy setting) is already in the builder module (Module 08).<\/li>\n<li>Logs 92 and 94 (the provider move that broke three things) move to the module on what breaks (Module 10), corrected: only two of the three bots changed model.<\/li>\n<li>Log 77 (YouTube) and v1's recommendation of the Log 69 setup are cut.<\/li>\n<li>Log 29 stays here. Log 69 survives only as the history behind the Mac switch.<\/li>\n<\/ul>\n<p><strong>Changed 10 Oct 2026 (plain-words rewrite):<\/strong><\/p>\n<ul>\n<li>The Full course builder section now matches the pi-first decision. It had said \"You build with Claude Code. Until your server is working, Claude Code needs a VPN.\" The Full course now uses no paid VPN: pi comes first and builds the route.<\/li>\n<li>pi is described as a way to connect to many models (Annie's wording), not \"a small open builder\".<\/li>\n<li>The line \"a Claude subscription does not work inside pi\" moved out. Module 03A now explains it, with Anthropic's own terms.<\/li>\n<li>Harness, AI provider and AI model labels added where builders are named.<\/li>\n<\/ul>"}, {"id": "full-2", "title": "02: Privacy, Security and Whose Law Reaches Your Data", "handout": false, "html": "<h1>Module 02: Privacy, Security and Whose Law Reaches Your Data<\/h1>\n<p><strong>How to read this file.<\/strong> This file serves both courses.<\/p>\n<ul>\n<li><strong>Full course:<\/strong> runs every segment.<\/li>\n<li><strong>Short course:<\/strong> runs only the segments that have minutes in its column.<\/li>\n<li><strong>Both courses<\/strong> teach privacy for someone running their own life admin.<\/li>\n<li><strong>The Full course adds one section on client data.<\/strong> That section is for awareness. It shows what to think about. It is not enough to handle client data alone.<\/li>\n<li><strong>The reading is in the handout,<\/strong> <code>02 — Handout, More on Privacy and the Law<\/code>: six ways to run an AI tool, when the model you rent changes, Hong Kong law, and four stories from Annie's record.<\/li>\n<\/ul>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 2: bridge block added.]<\/em><\/p>\n<p><strong>Why this module comes here.<\/strong><\/p>\n<ol>\n<li>The access module (Module 01) told you which tools answer. Before you connect any of them, you decide what each one may see.<\/li>\n<li>A permission given in a hurry is hard to take back. When Annie asked Google for less access to her email, Google kept the wider access she had given before.<\/li>\n<li>You leave with your What AI Is Allowed to See sheet. The rules module (Module 07) and the build module (Module 08) turn it into rules your AI must follow.<\/li>\n<\/ol>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 4, approved by Annie on 13 Oct 2026. In this file: 0 changes, 1 editor notes and the sections Sources, Related moved to <code>editor-notes/02 — Editor's Notes.md<\/code>. Every change, with its old and new text, is listed in FABLE-EDITS.md.]<\/em><\/p>\n<h2>Run Sheet<\/h2>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 6, approved by Annie on 13 Oct 2026: the module now opens with the one-line rule. \"Why This Comes Before Any Connection\" is folded into the third habit. \"Six Ways to Run an AI Tool\", \"When the Model You Rent Changes\", \"Hong Kong Law in Five Minutes\" and four From the Record stories moved to <code>02 — Handout, More on Privacy and the Law<\/code>. Full course 70 to 50 minutes. The old run sheet is in FABLE-EDITS.md.]<\/em><\/p>\n<p>A dash means the segment is not in that course.<\/p>\n<table>\n<thead>\n<tr>\n<th>Full (min)<\/th>\n<th>Short (min)<\/th>\n<th>Segment<\/th>\n<th>Facilitator does<\/th>\n<th>Students do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5<\/td>\n<td>5<\/td>\n<td>Your one-line rule, and the three-part danger<\/td>\n<td>Reads Annie's rule. Explains the three things an AI assistant must never have all at once: your private data, content from strangers, and a way to send data out<\/td>\n<td>Write their own one-line rule on the worksheet<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>10<\/td>\n<td>The four habits that enforce the rule<\/td>\n<td>Walks the four habits. Tells Annie's Google story under \"revoke at the source\"<\/td>\n<td>Mark which habits they already keep<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>10<\/td>\n<td>Whose law can reach your data<\/td>\n<td>Defines where data sits, whose law can reach it, and who can read it. Walks the company list and the setting that lets a company train on your data<\/td>\n<td>Mark the companies they already use<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>—<\/td>\n<td>When the data is your clients'<\/td>\n<td>Walks the five kinds of data, the chain of companies, and the one sentence you must be able to finish<\/td>\n<td>Sort one client example into the five kinds<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>10<\/td>\n<td>Build your What AI Is Allowed to See sheet<\/td>\n<td>Checks each sheet<\/td>\n<td>Fill in the three tiers and the protection checklist<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>—<\/td>\n<td>Swap sheets to find gaps<\/td>\n<td>Rotates the sheets between the students<\/td>\n<td>Find one gap in another student's sheet<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>How the minutes add up.<\/strong><\/p>\n<ul>\n<li><strong>Full course: 50 minutes.<\/strong> The one-line rule and the three-part danger take 5 minutes. The four habits take 10. Whose law takes 10. Client data takes 10. The What AI Is Allowed to See sheet takes 10. Swapping sheets to find gaps takes 5.<\/li>\n<li><strong>Short course: 35 minutes.<\/strong> The one-line rule and the three-part danger take 5 minutes. The four habits take 10. Whose law takes 10. The What AI Is Allowed to See sheet takes 10.<\/li>\n<\/ul>\n<h2>What You Will Leave With<\/h2>\n<p><strong>Your What AI Is Allowed to See sheet.<\/strong> It sorts your information into three tiers: open, personal and never.<\/p>\n<ul>\n<li>For each tier, it names the companies you allow.<\/li>\n<li>For each tier, it names the places the data may be stored.<\/li>\n<li>It ends with a short list of things that never go into any AI tool.<\/li>\n<li>It also has a protection checklist for your accounts.<\/li>\n<\/ul>\n<p>Two later modules use the map:<\/p>\n<ul>\n<li>The rules module (Module 07) turns the map into rules your bot must follow.<\/li>\n<li>The builder module (Module 08) copies your list of things that never go into any AI tool into your builder's instructions.<\/li>\n<\/ul>\n<h2>Before This Module<\/h2>\n<ul>\n<li><strong>Module 01 finished.<\/strong> You need your Access Sheet. It lists the tools you are about to sort.<\/li>\n<li><strong>A list of your accounts.<\/strong> Email, calendar, cloud storage, password manager, and any AI tools you already use.<\/li>\n<li><strong>Your phone.<\/strong> You will check two-factor sign-in on it.<\/li>\n<\/ul>\n<h2>Your One-Line Rule, and the Three-Part Danger<\/h2>\n<p><em>5 minutes. Both courses.<\/em><\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 6, approved by Annie on 13 Oct 2026: this section and the next were one section, \"Your One-Line Rule and the Four Habits That Enforce It\", placed fourth. The wording is unchanged. The two closing lines came from \"Why This Comes Before Any Connection\".]<\/em><\/p>\n<p>Annie wrote one rule in June 2026. She tested every later connection against it (Build Log 00 and the trust-boundary session of 24 Jun 2026):<\/p>\n<blockquote>\n<p><strong>Read freely. Write to my own notes freely. Anything that goes to another person needs my yes, every time.<\/strong><\/p>\n<\/blockquote>\n<p><strong>Why this one rule matters.<\/strong> In June 2025 the writer Simon Willison named the most dangerous combination in AI tools. It is an AI assistant that does all three of these:<\/p>\n<ol>\n<li>It holds your private data.<\/li>\n<li>It reads content from strangers, such as incoming email.<\/li>\n<li>It has a way to send data out.<\/li>\n<\/ol>\n<p>Take away the way out. Then an instruction hidden in a stranger's email cannot send your data anywhere.<\/p>\n<p>So the order in this course matters:<\/p>\n<ol>\n<li>First, decide what data goes where. This module gives you those decisions.<\/li>\n<li>Then, connect only the tools that fit those decisions. The build module (Module 08) makes those connections.<\/li>\n<\/ol>\n<h2>The Four Habits That Enforce the Rule<\/h2>\n<p><em>10 minutes. Both courses.<\/em><\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 6, approved by Annie on 13 Oct 2026: the Google story under the third habit came from \"Why This Comes Before Any Connection\", which is gone as a section.]<\/em><\/p>\n<p>Four habits make the rule real.<\/p>\n<p><strong>Habit 1: Put the limit in the permission, not in the instructions.<\/strong><\/p>\n<ul>\n<li>A sentence such as \"never send email\" is a request. The model can misread it.<\/li>\n<li>Annie's email tool has read-only access at Google's end.<\/li>\n<li>Its script also has no command that sends.<\/li>\n<li>So Google refuses a send even if something tries one (Build Log 18).<\/li>\n<li>That is two separate protections. Neither depends on the model behaving.<\/li>\n<\/ul>\n<p><strong>Habit 2: Give each tool the smallest access that does the job.<\/strong><\/p>\n<ul>\n<li>Say a bot needs one calendar.<\/li>\n<li>Give it a small script that can only read that one calendar.<\/li>\n<li>Do not give it your whole account plus a sentence asking it to stay in one corner.<\/li>\n<li>Annie built exactly this for a family member's tutor bot (Build Log 54).<\/li>\n<\/ul>\n<p><strong>Habit 3: Revoke at the source before you delete anything.<\/strong><\/p>\n<ul>\n<li>A permission given in a hurry is hard to take back. Here is what happened to Annie (Build Log 14):\n  1. In June 2026, Annie asked Google to give her bot less access to her email.\n  2. Google kept the old, wider permission anyway.\n  3. The reason: a smaller request does not cancel a larger one you granted before.\n  4. She had to remove the app's access completely and start again.<\/li>\n<li>Deleting a file that holds a login does not cancel the login either.<\/li>\n<li>The login still works from any backup copy.<\/li>\n<li>In June 2026, an old Google login on Annie's server still had wide calendar access. Her bot used it once, even though its rules said never to (Build Log 16).<\/li>\n<li>The fix had three steps, in this order:\n  1. Cancel the login at Google.\n  2. Check that Google refused it.\n  3. Only then delete the files.<\/li>\n<li>The same applies inside chat apps. Disconnecting a tool inside a chat app does not cancel its permission at the company that granted it. The permission stays live until you remove it there too (Build Log 61).<\/li>\n<\/ul>\n<p><strong>Habit 4: Label every paste before you paste it.<\/strong><\/p>\n<ul>\n<li>Before your builder asks you to paste anything, it should say which kind it is:<\/li>\n<li>saf
