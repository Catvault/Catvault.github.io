Add four fixed rules to <code>AGENTS.md<\/code>,<\/strong> below \"My Three Rules\". Every student uses the same four rules. Each rule prevents a real problem that happened before:<\/p>\n<pre><code class=\"language-markdown\">## Fixed Rules\n- Answer only from files in this folder. Name the file you used.\n- If the files do not answer it, say so, and name the file you would need.\n- Never print the value of a key, a token or a password. Print the name only.\n- Ask me before you change or delete any file.\n<\/code><\/pre>\n<p><strong>Step 3. Put the job's files in <code>My Files/<\/code>.<\/strong><\/p>\n<p><strong>Rules for files:<\/strong><\/p>\n<ul>\n<li><strong>No colons in file names.<\/strong> A Mac or Windows laptop does not allow a colon in a file name (Build Log 96).<\/li>\n<li><strong>Use one folder, not five.<\/strong> Annie's founding document was once in a Downloads folder. Her phone, her bot and her second account could not see it. Nothing was broken. The file was in the wrong place (Build Log 08).<\/li>\n<\/ul>\n<p><strong>To change how the AI assistant behaves, change the file. Never tell it in the chat.<\/strong> In the chat, it agrees and then forgets in the next conversation. The file is the only memory that lasts.<\/p>\n<h2>The Cold Test: Prove a Fresh Session Reads Your File<\/h2>\n<p><em>15 minutes.<\/em><\/p>\n<p>Go to your AI assistant folder:<\/p>\n<ol>\n<li>Type <code>cd<\/code> and a space.<\/li>\n<li>Drag <code>My AI Assistant<\/code> into Terminal.<\/li>\n<li>Press Return.<\/li>\n<\/ol>\n<p>Then type:<\/p>\n<pre><code class=\"language-bash\">pi -p --no-session &quot;Answer from your instructions only. Who am I? Give two of my rules. What must you never print?&quot;\n<\/code><\/pre>\n<p><strong>You know it works when<\/strong> pi names you, quotes two of your rules, and says it never prints the value of a key.<\/p>\n<p><strong>If the answer is general, pi did not read your file.<\/strong> Check two things:<\/p>\n<ol>\n<li>The file is named exactly <code>AGENTS.md<\/code>.<\/li>\n<li>It is in the folder where you started pi.<\/li>\n<\/ol>\n<p>Fix it and run the test again. Do not go on until this test passes.<\/p>\n<p><strong>What can go wrong without this test.<\/strong> For weeks in July 2026, Annie's bot seemed to ignore its rules. The truth was that its rules file had never loaded at all. Two small file links fixed it, and a new test passed (Build Log 32).<\/p>\n<h2>Five Habits That Keep You in Control<\/h2>\n<p><em>10 minutes.<\/em><\/p>\n<p>Teach the five habits from \"Full Course: Before the Server\", under \"Five Habits That Keep You in Control\". Then ask pi to add them to <code>AGENTS.md<\/code>. Tell it to back up the file first.<\/p>\n<h2>Your One Real Job<\/h2>\n<p><em>45 minutes.<\/em><\/p>\n<p>The job comes from your Module 05 workflow. It must pass three checks:<\/p>\n<ol>\n<li>The answer is in files you can put in <code>My Files/<\/code> today.<\/li>\n<li>You can say the job in one sentence that a stranger would understand.<\/li>\n<li>You would notice if the answer was wrong.<\/li>\n<\/ol>\n<p><strong>The Short course job is a files job.<\/strong> The AI assistant answers from a folder of documents on this laptop. Three examples:<\/p>\n<ul>\n<li>A folder of receipts and invoices. The question: \"What arrived this month, and what is not claimed yet?\"<\/li>\n<li>Family paperwork, such as school letters, activity forms and medical documents. The question: \"What do I need to sign or pay this month?\"<\/li>\n<li>A folder of contracts and supplier agreements. The question: \"Which of these renew or expire in the next three months?\" <em>[FABLE EDIT, 13 Oct 2026. Proposal 12, approved by Annie on 13 Oct 2026: third example added. AUDIT.md, Finding 11.]<\/em><\/li>\n<\/ul>\n<p>Only a files job reliably finishes in the room. Email and calendar jobs need two things set up before class: a login, and a server to run them on a schedule. So they belong to the optional server sitting.<\/p>\n<p><strong>This job stays with you for the rest of the course.<\/strong> In the script-or-AI module (Module 09) you circle it and write its Build Brief. In the skills module (Module 11) you add the rows that keep it safe, and you turn it into a skill you start with one phrase. One job, built deeper each time. <em>[FABLE EDIT, 13 Oct 2026. Annie chose on 13 Oct 2026: in the Short course, the files job from Module 08 and the skill from Module 11 are the same job. AUDIT.md, question 3. One paragraph added, and \"Two examples\" became \"Three examples\" because Proposal 12 added the third.]<\/em><\/p>\n<p><strong>Running, fixing and running again is the work.<\/strong><\/p>\n<ol>\n<li>Run the job.<\/li>\n<li>Read the answer.<\/li>\n<li>Find the file that caused the wrong answer, and fix it.<\/li>\n<li>Run the job again.<\/li>\n<\/ol>\n<p>Annie's bot once answered a scheduling question with wrong dates and a class that did not exist. Three rounds fixed it:<\/p>\n<ul>\n<li>Round 1 added knowledge the bot was missing.<\/li>\n<li>Round 2 added a missing step-by-step procedure.<\/li>\n<li>Round 3 fixed reasoning that broke a rule the bot had already quoted.<\/li>\n<\/ul>\n<p>Each round fixed a different problem. The three rounds were the work. They were not a failure (Build Log 33).<\/p>\n<p><strong>If the answer is wrong in the same way two times, stop rewriting the rule.<\/strong> Instead, ask pi to move the check into a small script. The AI assistant then reads the script's result.<\/p>\n<p>Example: Annie's calendar check once said 9:15 to 10:15 was free. But another event ran from 9:45 to 10:30. The check compared only the start times. The fix was a small command that works out whether two times overlap (Build Log 38).<\/p>\n<h2>The Answer Test and the Refusal Test<\/h2>\n<p><em>15 minutes.<\/em><\/p>\n<p><strong>Test 1, the answer test.<\/strong> Ask your job question. The AI assistant must answer, and name the file it used.<\/p>\n<p><strong>Test 2, the refusal test.<\/strong> Ask a question your files cannot answer. The AI assistant must say it does not know, and name the file it would need.<\/p>\n<p><strong>Do not leave the room if test 2 gets a made-up answer.<\/strong> This is the one failure you must fix today. Fix the second fixed rule in <code>AGENTS.md<\/code>, the one that says to admit when the files do not answer. Then run the test again.<\/p>\n<p><strong>Then ask your three golden questions from Module 07, the test questions with known answers.<\/strong><\/p>\n<ul>\n<li>Ask each one in a new pi session.<\/li>\n<li>Ask each one two times. One right answer can be luck (How to Build Your Own Claudith guide, Part 5).<\/li>\n<\/ul>\n<p><strong>Why test 2 matters.<\/strong> In July 2026, Annie's receipt automation came back marked \"tested and working\". A separate check found six bugs. Four of them stopped it from working at all (Build Log 30):<\/p>\n<ul>\n<li>The sender check could never match.<\/li>\n<li>The email tool could not download attachments.<\/li>\n<\/ul>\n<p>A confident sentence is not proof. The two tests are proof.<\/p>\n<h2>Continuity Note and the \"Save\" Word<\/h2>\n<p><em>10 minutes.<\/em><\/p>\n<p>pi starts every session with no memory of yesterday. A continuity note fixes this. It is a short \"where we left off\" note. Every session reads it first.<\/p>\n<p><strong>Step 1.<\/strong> Ask pi:<\/p>\n<pre><code class=\"language-text\">Create CONTINUITY.md in this folder with a one-line header saying what it is. Add today's entry: what we built, what works, and my next action.\n<\/code><\/pre>\n<p><strong>Step 2.<\/strong> Add these two lines to <code>AGENTS.md<\/code>:<\/p>\n<ul>\n<li>\"At the start of every session, read CONTINUITY.md before answering anything.\"<\/li>\n<li>\"When I say 'save', add a dated entry to CONTINUITY.md, and if we built something, write the build log and its index row.\"<\/li>\n<\/ul>\n<p><strong>Keep the note short.<\/strong> Annie deletes entries older than three weeks. If a lesson will still matter in three weeks, put it in <code>AGENTS.md<\/code>, not in the continuity note.<\/p>\n<h2>The Build Log<\/h2>\n<p><em>10 minutes.<\/em><\/p>\n<ol>\n<li>Ask pi to create the folder and the index note, and save the template, the same way as in \"Full Course: After the Server\", under \"The Build Log\". <em>[OPUS EDIT, 15 Oct 2026. Second audit, finding 6: \"Steps 1 and 2\" now says what the steps are.]<\/em><\/li>\n<li>Ask pi to write Build Log 1 for today. Ask it to add the index row in the same step.<\/li>\n<li>Check two things on disk: the log exists, and the index row exists.<\/li>\n<\/ol>\n<h2>The Run Card<\/h2>\n<p><em>10 minutes.<\/em><\/p>\n<p>One page. Handwriting is fine. Write down:<\/p>\n<ul>\n<li>What this AI assistant is for, in one sentence.<\/li>\n<li>The exact start command (<code>cd<\/code> to the folder, then <code>pi<\/code>), and the key that stops it.<\/li>\n<li>Where its files live.<\/li>\n<li>Your three rules, and how you check each one.<\/li>\n<li>Your three golden questions (Module 07).<\/li>\n<li>What it costs each month: opencode Go, $10. <em>[OPUS EDIT, 15 Oct 2026. Cost marks: mark removed. The price was already in the line.]<\/em><\/li>\n<li>What to do when it does not answer: check the key, check you are in the right folder, then run the cold test.<\/li>\n<\/ul>\n<h2>Say What You Want, Not Every Step<\/h2>\n<p><em>5 minutes.<\/em><\/p>\n<p>Read the two conversations in \"Full Course: After the Server\", under \"Say What You Want, Not Every Step\".<\/p>\n<hr />\n<h2>From the Record<\/h2>\n<p><strong>The rules that never loaded.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> For weeks in July 2026, Annie kept teaching her bot procedures. It kept failing to follow them. Nothing showed a problem, because every part of the setup seemed to work. In fact, its rules file had never loaded into the model, in any version of the setup. Two file links fixed it.<\/li>\n<li><strong>The lesson:<\/strong> the cold test is not a formality. It is the only proof that the AI assistant read your files.<\/li>\n<li><strong>Source:<\/strong> Build Log 32.<\/li>\n<\/ul>\n<p><strong>\"Tested and working\" was not true.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> In July 2026, the receipt automation was reported as tested and working. A separate check on the machine found six bugs. Four of them stopped it from working at all.<\/li>\n<li><strong>The lesson:<\/strong> a report of success is only a claim. Test it yourself.<\/li>\n<li><strong>Source:<\/strong> Build Log 30.<\/li>\n<\/ul>\n<p><strong>The wrong account in the right place.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> In August 2026, Annie's personal start command kept signing her in to her work account. The two accounts were set up separately, as planned. But the personal one held a work sign-in, because her browser was signed in to work when she logged in. The fix: sign out in the browser, log in again, and check which account each folder holds.<\/li>\n<li><strong>The lesson:<\/strong> when a setup looks broken, look at what is inside it before you rebuild it.<\/li>\n<li><strong>Source:<\/strong> Build Log 61.<\/li>\n<\/ul>\n<p><strong>The builder that skipped the paperwork.<\/strong><\/p>\n<ul>\n<li><strong>What happened:<\/strong> In July 2026, a builder rebuilt Annie's morning message with nobody watching. The new message met every requirement. But the builder skipped three things: the build log, the to-do list update, and one setting. It had backed up that setting but never changed it. The fix: every instruction now ends with the builder reading its checks as a checklist, and marking each one done or not done.<\/li>\n<li><strong>The lesson:<\/strong> a check that depends on goodwill gets skipped. Make it part of the process.<\/li>\n<li><strong>Source:<\/strong> Build Log 27.<\/li>\n<\/ul>\n<h2>Worksheet<\/h2>\n<h3>Full Course<\/h3>\n<table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>pi installed; <code>pi --version<\/code> prints a number<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>opencode Go key entered without showing; <code>pi<\/code> starts on DeepSeek V4.1 Flash<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>CLAUDE.md<\/code> at the top of my vault, under one screen, with the five habits<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>pi cold test passed: it named me, two rules, and the never-print rule<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><em>(Module 08B finished)<\/em><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>loc=SG<\/code> with the exit node on<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Claude Code installed and signed in to my subscription<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Copy and paste work; <code>forceLoginMethod<\/code> set to <code>claudeai<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Status line shows what I chose<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>I know Escape stops, and which key queues<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Claude Code cold test passed, with the same answers as pi<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>Builder/CONTINUITY.md<\/code> exists; a new session knows where we left off<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My \"save\" word is in <code>CLAUDE.md<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Build Log 1 and its index row exist<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Run card written, including the one tool I cannot lose<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Short Course<\/h3>\n<table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>pi installed; <code>pi --version<\/code> prints a number<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>opencode Go key entered without showing<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>My AI Assistant/<\/code> holds <code>AGENTS.md<\/code>, <code>My Files/<\/code> and nothing scattered elsewhere<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Cold test passed<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Answer test passed: it answered and named the file<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Refusal test passed: it said it did not know and named the file it would need<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Golden questions passed two times, in new sessions<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>CONTINUITY.md<\/code> exists; my \"save\" line is in <code>AGENTS.md<\/code><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Build Log 1 and its index row exist<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Run card written<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Teaching Notes<\/h2>\n<ul>\n<li><strong>Cut the job down when time runs short (v1's clock rule).<\/strong><\/li>\n<li>Short course: at the two-hour mark, if the job is not working, make the job smaller until test 1 passes. An AI assistant that answers one question is a success. A half-built one that answers nothing is not.<\/li>\n<li>Full course: if Module 08B runs long, cut the 15 minutes of spare time first.<\/li>\n<li><strong>Never type on a student's keyboard.<\/strong> Sit beside them. Let them use their own device. If a student gets lost, you went too fast (Annie's seminar run sheet).<\/li>\n<li><strong>Entering the key is the riskiest moment for secrets.<\/strong> Watch each student paste the key into the hidden prompt. Make sure nobody pastes it into a chat or a note.<\/li>\n<li><strong>Fix the file, not the chat.<\/strong> Say this out loud two times: once while students write the instruction file, and once during the job.<\/li>\n<li><strong>One job only.<\/strong> If a student starts a second build, they misunderstood the module. Tell them.<\/li>\n<li><strong>Wifi.<\/strong> Every question to the AI goes over the internet. Have a phone hotspot ready.<\/li>\n<li><strong>Never show a student's private files on the projector<\/strong>.<\/li>\n<li><strong>Windows students:<\/strong> the course was built on a Mac. The key-entry line in \"Install pi and Connect opencode Go\" works only in a Mac's Terminal. It does not work in PowerShell. Facilitator: prepare the Windows version and test it before the course.<\/li>\n<li><strong>Developers may prefer git to dated backups.<\/strong> That is fine, if every change can be undone and the log records it.<\/li>\n<\/ul>"}, {"id": "full-11", "title": "08B: The Server and Your Bot", "handout": false, "html": "<h1>Module 08B: The Server and Your Bot<\/h1>\n<p><strong>How to read this file.<\/strong> This module is written once and used in two places.<\/p>\n<p><strong>Full course: every segment.<\/strong><\/p>\n<ul>\n<li>It sits between the two Full Course halves of Module 08: \"Before the Server\" and \"After the Server\".<\/li>\n<li>The result is Annie's own setup.<\/li>\n<li>That setup is a server that only your own devices can reach. It is also your route out to Claude.<\/li>\n<li><strong>pi drives every step.<\/strong><\/li>\n<li>No commercial VPN is used.<\/li>\n<\/ul>\n<p><strong>Short course: an optional extra server session.<\/strong><\/p>\n<ul>\n<li>It is outside the 10 hours.<\/li>\n<li>It sets up a bot on a rented server, reached by plain SSH with a key.<\/li>\n<li>The session <strong>stops before Tailscale<\/strong>.<\/li>\n<li>Segments marked \"Full only\" are skipped.<\/li>\n<li>See \"The Optional Short Course Server Session\" for its run sheet.<\/li>\n<\/ul>\n<p><strong>This order has not been run yet.<\/strong> Annie will run it herself before it is taught: on a fresh test server, from Hong Kong, with no VPN. If a step fails in her test, this module changes first.<\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 2: bridge block added.]<\/em><\/p>\n<p><strong>Why this module comes here.<\/strong><\/p>\n<ol>\n<li>pi is working on your laptop (Module 08). Now pi builds the small rented computer that never sleeps.<\/li>\n<li>The server gives your bot a home, your notes a second copy, and your laptop a way to reach Claude from Hong Kong.<\/li>\n<li>Your soul, rules and file about you (Modules 06 and 07) go live on the server here. Your three test questions prove they arrived.<\/li>\n<\/ol>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 4, approved by Annie on 13 Oct 2026. In this file: 12 changes, 5 editor notes and the sections Not Yet Tested, Where the Versions Went, Sources, Related moved to <code>editor-notes/08B — Editor's Notes.md<\/code>. Every change, with its old and new text, is listed in FABLE-EDITS.md.]<\/em><\/p>\n<h2>Run Sheet<\/h2>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 13, approved by Annie on 13 Oct 2026: every check in this file now starts \"You know it works when\". AUDIT.md, Finding 13. The old wording of each line is in <code>proposals/13 — One Phrase for Every Check.md<\/code>.]<\/em><\/p>\n<p>Full course: 160 minutes.<\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 9, approved by Annie on 13 Oct 2026: one 5-minute segment added at the end, \"Your First Boss Admin Move\". Full course 155 to 160 minutes.]<\/em><\/p>\n<table>\n<thead>\n<tr>\n<th>Min<\/th>\n<th>Segment<\/th>\n<th>Facilitator does<\/th>\n<th>Students do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5<\/td>\n<td>The plan and the four safety rules<\/td>\n<td>Explains the four: take a snapshot first; set an automatic undo before any change that could lock you out; make one change at a time; use the provider's web console if locked out<\/td>\n<td>Start pi in their vault; paste the opening request<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Snapshot and SSH key<\/td>\n<td>Shows the snapshot button and the key command<\/td>\n<td>Take a snapshot; make a key; put it on the server<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>First login, timezone and updates<\/td>\n<td>Explains the date bug<\/td>\n<td>Set the timezone; update the system<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>Secure the server, in an order that cannot lock you out<\/td>\n<td>Walks the order: look first without changing anything, open a second login window, allow key logins only, turn on the firewall, add fail2ban<\/td>\n<td>Harden the server with pi, testing after each step<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>Tailscale: your private network<\/td>\n<td>Shows the account, the apps and key expiry<\/td>\n<td>Join laptop, phone and server; add the short name<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Close public SSH, with an automatic undo timer<\/td>\n<td>Explains the timer that reopens public SSH after ten minutes unless you cancel it<\/td>\n<td>Close public SSH; test; cancel the timer<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>The exit node: send your laptop's traffic out through your Singapore server<\/td>\n<td>Shows forwarding, the firewall rule and the approval<\/td>\n<td>Make the server an exit node and test it<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Claude Code on the server<\/td>\n<td>Shows the one-time sign-in with the exit node on, so traffic goes out through Singapore<\/td>\n<td>Install, sign in, lock to the subscription<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Your vault on the server<\/td>\n<td>Shows the sync set-up<\/td>\n<td>Connect the vault; run a cold test on the server (a fresh session that proves the instructions file loads)<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Create the Telegram bot<\/td>\n<td>Shows @BotFather on the projector<\/td>\n<td>Create the bot; store the token<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>Install Hermes and connect it<\/td>\n<td>Leads the install through each student's pi<\/td>\n<td>Install Hermes; connect Telegram and the model<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Load your files and make it restart on its own<\/td>\n<td>Shows where each file goes and the restart settings<\/td>\n<td>Copy the files; install the service<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>Three tests: the bot quotes your rules, says when it does not know, and answers your golden questions (test questions with known answers)<\/td>\n<td>Explains why a restart proves nothing<\/td>\n<td>Run the tests in fresh conversations<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Same model, different program: why pi and the bot answer differently<\/td>\n<td>Asks one question in pi and in the bot<\/td>\n<td>Note what changed<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Your first boss admin move<\/td>\n<td>Shows the to-do receipt screenshot<\/td>\n<td>Type \"add to to do list: ...\" and check the file in Obsidian<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>How the minutes add up.<\/strong> The full course takes 160 minutes.<\/p>\n<ul>\n<li><strong>The server part takes 90 minutes.<\/strong> The plan and the four safety rules (snapshot first, an automatic undo timer, one change at a time, the web console) take 5 minutes. The snapshot and key take 10. First login takes 10. Securing the server takes 15. Tailscale takes 15. Closing public SSH takes 10. Making the server an exit node takes 15. Claude Code on the server takes 10.<\/li>\n<li><strong>The vault and bot part takes 70 minutes.<\/strong> Copying the vault to the server takes 10 minutes. Creating the bot takes 10. Installing Hermes takes 15. Loading your SOUL, RULES and USER files takes 10. Testing that the bot quotes its rules, says when it does not know and answers your golden questions takes 15. Asking pi and the bot the same question takes 5. Your first boss admin move takes 5.<\/li>\n<\/ul>\n<p><strong>Homework, not timed:<\/strong> a normal user instead of root (the server's master account, which can do anything), a swap file, and the reboot test. Each is written below.<\/p>\n<h2>What You Will Leave With<\/h2>\n<p><strong>Full course:<\/strong><\/p>\n<ul>\n<li>A locked server in Singapore that only your own devices can reach, over your own private network.<\/li>\n<li>It is your route out of Hong Kong when you want Claude.<\/li>\n<li>Claude Code runs on it, signed in to your subscription.<\/li>\n<li>Your vault is copied to it.<\/li>\n<li>A Telegram bot lives on it. The bot answers only you, restarts by itself and quotes your rules back. It has done its first job: it added a task to your to-do list and told you where it saved it.<\/li>\n<\/ul>\n<p><strong>Optional Short course server session:<\/strong><\/p>\n<ul>\n<li>A locked server in Singapore that accepts only your key. It has a firewall and automatic bans.<\/li>\n<li>A Telegram bot lives on it. The bot answers only you, restarts by itself and quotes your rules.<\/li>\n<li>Your laptop and pi stay exactly as they were.<\/li>\n<\/ul>\n<h2>Before This Module<\/h2>\n<ul>\n<li><strong>Your server, ordered in Module 03B, \"Order Your Server\".<\/strong> Its IP address and the provider's console login are in your password manager. <em>[OPUS EDIT, 15 Oct 2026. Second audit, finding 4: the pointer now names Module 03B.]<\/em><\/li>\n<li><strong>pi working on your laptop<\/strong> (Module 08, \"Full Course: Before the Server\" or \"Short Course\"), opening in your vault.<\/li>\n<li><strong>Your SOUL, RULES and USER files<\/strong> (Full) or your <code>AGENTS.md<\/code> and USER (Short), in the vault's <code>AI System<\/code> folder.<\/li>\n<li><strong>Telegram on your phone,<\/strong> with two-factor sign-in on.<\/li>\n<li><strong>Tailscale on your phone<\/strong> (Full only). Install the app now. You sign in during the module.<\/li>\n<li><strong>Obsidian Sync, bought before this module<\/strong> (Full only). About $4 a month on the Standard plan, $48 a year. The vault copy and the first boss admin move both need it. <em>[FABLE EDIT, 13 Oct 2026. Second audit, finding 2, fixed at Annie's request on 13 Oct 2026: \"only if the vault goes on the server\" removed, one sentence added.]<\/em><\/li>\n<li><strong>Your vault connected to Obsidian Sync, from your laptop<\/strong> (Full only). In Obsidian on the laptop: Settings, then Sync, then set up a remote vault and connect this vault to it. Wait until the first upload finishes. You know it works when the Sync icon says it is up to date, and your phone shows the same notes. <em>[FABLE EDIT, 13 Oct 2026. Proposal 10, approved by Annie on 13 Oct 2026: pre-work line added, and the Obsidian Sync cost filled in.]<\/em><\/li>\n<li><strong>If you already pay for a commercial VPN, switch it off before this module and leave it off.<\/strong> Two VPNs on one machine fight over the same settings (Build Log 64).<\/li>\n<\/ul>\n<h2>The Plan and the Four Safety Rules<\/h2>\n<p><em>5 minutes. Both courses.<\/em><\/p>\n<p><strong>You will not type most of these commands. pi does, and you approve each one.<\/strong><\/p>\n<ul>\n<li>Annie's guide is direct about this. Let the builder (here, pi) drive the install. Do not follow random tutorials by hand. The builder reads the errors and fixes them (How to Build Your Own Claudith guide, Part 3).<\/li>\n<li>Each step shows <strong>what to ask pi<\/strong>, the commands it should run, and <strong>what success looks like<\/strong>.<\/li>\n<li>Read the command before you approve it.<\/li>\n<\/ul>\n<p><strong>Why pi, and not Claude Code.<\/strong><\/p>\n<ul>\n<li>pi answers from Hong Kong directly.<\/li>\n<li>Nothing in this module can cut pi off, because it never depends on the network you are building.<\/li>\n<li>Claude Code would need a route out before it could start (Module 08, \"Why pi comes first\").<\/li>\n<\/ul>\n<p>Start pi in your vault and paste:<\/p>\n<pre><code class=\"language-text\">Today we set up my new Ubuntu server. Its IP address is in my password manager; I will paste it when you ask. You run commands on it over SSH from this laptop. Work one step at a time. Before each step, show me the command and what it changes. After each step, check it worked and show me the proof. Back up any file before editing it. Do not change anything I have not approved. If a command asks for a password or passphrase, give it to me to run myself in a second Terminal window. Keep a list of every change for my build log.\n<\/code><\/pre>\n<p><strong>The four safety rules.<\/strong> Annie learned each one on her own server.<\/p>\n<ol>\n<li><strong>Snapshot first.<\/strong> Before her first build in May 2026, Annie took a full snapshot of her server in the provider's console. If the build went wrong, she could return the server to that exact state (Build Log 00).<\/li>\n<li><strong>Every change that could lock you out needs an automatic undo.<\/strong> In September 2026 Annie changed which accounts may log in to her server (Build Log 103).\n   - Before the change, she set a ten-minute timer. It would undo the change automatically if she was locked out.\n   - She cancelled the timer once the change was proven.<\/li>\n<li><strong>One change at a time, tested before the next.<\/strong> In June 2026 her bot kept the same process number through every security change. That proved nothing had restarted or broken (Build Log 06).<\/li>\n<li><strong>The provider's web console still works when SSH does not.<\/strong> If anything locks you out, log in there.<\/li>\n<\/ol>\n<h2>Snapshot and SSH Key<\/h2>\n<p><em>10 minutes. Both courses.<\/em><\/p>\n<p><strong>Step 1. Take a snapshot.<\/strong> In your provider's web console, find the server. Choose \"Snapshot\" or \"Backup now\". Name it <code>day-1-before-build<\/code>.<\/p>\n<p>You know it works when the snapshot appears in the list.<\/p>\n<p><strong>Step 2. Make an SSH key on your laptop.<\/strong> An SSH key is a pair of files.<\/p>\n<ul>\n<li>The private file stays on your laptop. It proves who you are.<\/li>\n<li>The public file goes on the server.<\/li>\n<\/ul>\n<p>pi gives you this command to run yourself in a second Terminal window, because it asks for a passphrase:<\/p>\n<pre><code class=\"language-bash\">ssh-keygen -t ed25519 -C &quot;laptop-yourname&quot;\n<\/code><\/pre>\n<p><strong>Use a passphrase.<\/strong> Annie's first build log lists this as the one protection she had not set up. A passphrase makes a stolen key file useless on its own. Your Mac's keychain can remember it (Build Log 00).<\/p>\n<p><strong>Label every key with the device it belongs to.<\/strong> Annie's phone and tablet keys both arrived labelled <code>moshi<\/code>. So a list of keys could not tell them apart. She relabelled them by device (Build Log 103).<\/p>\n<p><strong>Step 3. Put the public key on the server.<\/strong> If your provider emailed you a root password, run this yourself in the second window:<\/p>\n<pre><code class=\"language-bash\">ssh-copy-id -i ~/.ssh/id_ed25519.pub root@&lt;your-server-ip&gt;\n<\/code><\/pre>\n<ul>\n<li>You type the root password once.<\/li>\n<li>If your provider asked for a key at order time, paste the contents of <code>~/.ssh/id_ed25519.pub<\/code> into the provider's console instead.<\/li>\n<li>On Windows, <code>ssh-copy-id<\/code> may not exist. Use the console.<\/li>\n<\/ul>\n<p>You know it works when <code>ssh root@&lt;your-server-ip&gt;<\/code> logs you in without asking for the server password.<\/p>\n<p><strong>Only the file ending in <code>.pub<\/code> is safe to share.<\/strong> Never paste the private key anywhere.<\/p>\n<h2>First Login, Timezone and Updates<\/h2>\n<p><em>10 minutes. Both courses.<\/em><\/p>\n<p><strong>Step 4. Set the timezone.<\/strong> Servers arrive set to UTC (Build Logs 00 and 14). UTC is the world's reference time, the same as London in winter. It is 8 hours behind Hong Kong.<\/p>\n<ul>\n<li>For about a month, Annie's bot gave tomorrow's date in the evenings.<\/li>\n<li>The cause: the server's clock ran eight hours behind Hong Kong.<\/li>\n<li>Her first build log said the timezone was set. It was not.<\/li>\n<\/ul>\n<pre><code class=\"language-bash\">timedatectl set-timezone Asia/Hong_Kong\ntimedatectl\n<\/code><\/pre>\n<p>You know it works when the output shows <code>Asia/Hong_Kong<\/code>, and the local time matches your watch.<\/p>\n<p><strong>Step 5. Update the system.<\/strong><\/p>\n<pre><code class=\"language-bash\">apt update &amp;&amp; apt upgrade -y\n<\/code><\/pre>\n<p>You know it works when it finishes without red errors. It may ask about a changed configuration file. If so, keep the version already installed.<\/p>\n<h2>Secure the Server, in an Order That Cannot Lock You Out<\/h2>\n<p><em>15 minutes. Both courses.<\/em><\/p>\n<p><strong>Annie's example (Build Logs 05 and 06).<\/strong><\/p>\n<ul>\n<li>For its first month, Annie's server had five secret files that any user on it could read. It had no firewall.<\/li>\n<li>Her guide says it plainly: nothing bad happened, and that was luck, not design (Annie's guide to building your own bot).<\/li>\n<li>Her review in June 2026 looked first and changed nothing. It sorted the fixes by risk.<\/li>\n<li>The next day the fixes went in, in an order that could not lock her out.<\/li>\n<\/ul>\n<p><strong>Step 6. Look first.<\/strong> Ask pi to report how SSH is set up and which ports are open. It must not change anything.<\/p>\n<pre><code class=\"language-bash\">sshd -T | grep -E 'passwordauthentication|permitrootlogin|pubkeyauthentication'\nss -tulnp\n<\/code><\/pre>\n<p>You know it works when it prints a short report, and only SSH (port 22) faces the internet.<\/p>\n<p><strong>Step 7. Prove your key works in a second window.<\/strong><\/p>\n<ul>\n<li>Open a new Terminal window and log in with <code>ssh root@&lt;your-server-ip&gt;<\/code>.<\/li>\n<li>Keep this window open for the rest of the module.<\/li>\n<li>If a change goes wrong, this window is still logged in and can undo it.<\/li>\n<\/ul>\n<p><strong>Step 8. Turn off password logins.<\/strong> Ask pi to write a small separate settings file. It should not edit the main one. Then each change is easy to see and undo (Build Log 103). The file <code>/etc/ssh/sshd_config.d/99-hardening.conf<\/code> should contain:<\/p>\n<pre><code class=\"language-text\">PasswordAuthentication no\nKbdInteractiveAuthentication no\nPermitRootLogin prohibit-password\n<\/code><\/pre>\n<p>Then check the settings before applying them, and reload:<\/p>\n<pre><code class=\"language-bash\">sshd -t &amp;&amp; systemctl reload ssh\n<\/code><\/pre>\n<p>You know it works when <code>sshd -t<\/code> prints nothing, which means no errors. A third new window still logs in with your key.<\/p>\n<p><strong>Step 9. Turn on the firewall, allowing SSH first.<\/strong> The order matters. Allow SSH, then block everything else coming in. Annie's review named this as the only lockout risk in the whole security review (Build Log 05).<\/p>\n<pre><code class=\"language-bash\">ufw allow OpenSSH\nufw default deny incoming\nufw default allow outgoing\nufw --force enable\nufw status verbose\n<\/code><\/pre>\n<p>You know it works when (Build Log 05):<\/p>\n<ul>\n<li>The firewall is active, with SSH allowed.<\/li>\n<li>A new window still logs in.<\/li>\n<li>The bot only makes outgoing connections. So this firewall will not block it later.<\/li>\n<\/ul>\n<p><strong>Step 10. Ban repeated failed logins, and keep security updates automatic.<\/strong><\/p>\n<pre><code class=\"language-bash\">apt install -y fail2ban\nfail2ban-client status sshd\nsystemctl is-enabled unattended-upgrades\n<\/code><\/pre>\n<p>You know it works when fail2ban reports an <code>sshd<\/code> jail, and unattended upgrades shows <code>enabled<\/code>. Annie's server runs both (live server check, 2 Oct 2026).<\/p>\n<p><strong>Lock the secret files as you add them.<\/strong> Any file holding a key or token gets <code>chmod 600<\/code>. Then only its owner can read it. Annie's five readable secret files were fixed this way (Build Log 06).<\/p>\n<p><strong>If you get locked out:<\/strong> log in through the provider's web console. Ask pi to undo the last change from its backup.<\/p>\n<p><strong>Optional Short course server session: the server steps stop here.<\/strong> Go to \"Create the Telegram Bot\".<\/p>\n<h2>Tailscale: Your Private Network<\/h2>\n<p><em>15 minutes. Full only.<\/em><\/p>\n<p><strong>Tailscale puts your laptop, phone and server on one private network,<\/strong> as if they sat in the same room. The free Personal plan covers up to 6 users and unlimited devices. It includes exit nodes (Tailscale pricing, seen 2 Oct 2026).<\/p>\n<p><strong>Step 11. Create a Tailscale account<\/strong> at tailscale.com. Sign in with an account you control personally.<\/p>\n<p><strong>Step 12. Join your laptop.<\/strong> Install the Tailscale app from tailscale.com/download and sign in.<\/p>\n<p><strong>If it hangs, check that no commercial VPN is on (Build Log 64).<\/strong><\/p>\n<ul>\n<li>In August 2026 Annie's Mac could not join for most of a day.<\/li>\n<li>The app did nothing, and the login printed no address.<\/li>\n<li>Tailscale's own health message gave the reason. The commercial VPN had taken over the Mac's address lookups.<\/li>\n<li>Annie guessed the cause first. Turning the VPN off fixed it at once.<\/li>\n<\/ul>\n<p><strong>Step 13. Join your phone.<\/strong> Open the Tailscale app and sign in with the same account.<\/p>\n<p><strong>Step 14. Join the server.<\/strong> Ask pi to install Tailscale on the server and start it:<\/p>\n<pre><code class=\"language-bash\">curl -fsSL https://tailscale.com/install.sh | sh\ntailscale up\n<\/code><\/pre>\n<p><code>tailscale up<\/code> prints a web address. Open it on your laptop and approve the server.<\/p>\n<p>You know it works when the Tailscale admin page lists three devices. On the server, <code>tailscale ip -4<\/code> prints an address starting with <code>100.<\/code>.<\/p>\n<p><strong>Step 15. Turn off key expiry.<\/strong> In the Tailscale admin page, open each device's menu and choose \"Disable key expiry\". Otherwise a device drops off the network when its key expires. Then the exit node stops working (Build Log 64).<\/p>\n<p><strong>Step 16. Give the server a short name on your laptop.<\/strong> Ask pi to add an entry to <code>~/.ssh/config<\/code>:<\/p>\n<pre><code class=\"language-text\">Host myserver\n  HostName &lt;your-server-tailscale-name&gt;\n  User root\n<\/code><\/pre>\n<p>You know it works when <code>ssh myserver<\/code> logs you in over Tailscale.<\/p>\n<h2>Close Public SSH, With an Automatic Undo Timer<\/h2>\n<p><em>10 minutes. Full only.<\/em><\/p>\n<p><strong>Step 17. Make SSH work only over your private network.<\/strong> Do three things in order:<\/p>\n<ol>\n<li>Allow SSH on the Tailscale side.<\/li>\n<li>Set a timer that reopens public SSH in ten minutes unless you cancel it.<\/li>\n<li>Remove the public rule.<\/li>\n<\/ol>\n<pre><code class=\"language-bash\">ufw allow in on tailscale0 to any port 22 proto tcp\napt install -y at\necho &quot;ufw allow OpenSSH&quot; | at now + 10 minutes\nufw delete allow OpenSSH\n<\/code><\/pre>\n<p>Test <code>ssh myserver<\/code> in a new window. If it works, cancel the timer. <code>atq<\/code> lists it, and <code>atrm &lt;number&gt;<\/code> cancels it.<\/p>\n<p>You know it works when <code>ssh myserver<\/code> works, and <code>ssh root@&lt;your-server-ip&gt;<\/code> no longer connects.<\/p>\n<p><strong>This is the same safety Annie used in September 2026<\/strong> when she changed which accounts may log in. The undo was set before the change and cancelled after it was proven. Her public SSH had already been closed by then (Build Log 103).<\/p>\n<p><strong>Now Tailscale is your only way in.<\/strong> With Tailscale off, you cannot reach your server. In September 2026 Annie's builder on the Mac could not reach her server for exactly this reason (Build Log 102). The provider's console still works.<\/p>\n<p><strong>After any network change, test every job that connects to the server<\/strong> (live system check, 2 Oct 2026).<\/p>\n<ul>\n<li>A check on 2 October 2026 found two of Annie's scheduled Mac jobs still using the server's old public address.<\/li>\n<li>This was days after public SSH was closed.<\/li>\n<li>One of them, a backup, had failed twice.<\/li>\n<\/ul>\n<h2>The Exit Node: Send Your Traffic Out Through Your Server<\/h2>\n<p><em>15 minutes. Full only.<\/em><\/p>\n<p><strong>An exit node sends a device's internet traffic out through your server.<\/strong> So your laptop appears to be in Singapore.<\/p>\n<p><strong>Annie's problem in August 2026 (Build Log 63).<\/strong> Her phone could run only one VPN at a time.<\/p>\n<ul>\n<li>With her commercial VPN on, Claude worked but her private pages did not.<\/li>\n<li>With Tailscale on, the private pages worked but Claude was blocked.<\/li>\n<li>Making her server an exit node meant one switch did both jobs.<\/li>\n<li>The commercial VPN was no longer needed.<\/li>\n<\/ul>\n<p>Her server is in Singapore, which Anthropic serves (Build Log 64).<\/p>\n<p><strong>The same caution from Module 01 applies.<\/strong> Using a route like this to reach a provider that does not serve Hong Kong is a choice about that provider's terms. It is yours to make.<\/p>\n<p><strong>Step 18. Allow the server to forward traffic, permanently (Build Log 64).<\/strong><\/p>\n<ul>\n<li>Annie's forwarding was first switched on in memory only. So a restart would have silently broken the exit node.<\/li>\n<li>She wrote it to a settings file. Then she proved it survived a simulated restart.<\/li>\n<\/ul>\n<p>Ask pi to write <code>/etc/sysctl.d/99-tailscale.conf<\/code> containing:<\/p>\n<pre><code class=\"language-text\">net.ipv4.ip_forward = 1\nnet.ipv6.conf.all.forwarding = 1\n<\/code><\/pre>\n<p>Then apply it:<\/p>\n<pre><code class=\"language-bash\">sysctl -p /etc/sysctl.d/99-tailscale.conf\n<\/code><\/pre>\n<p>Ask pi to write the file with a short command or an editor. In August 2026 a long pasted command wrapped in the terminal and failed (Build Log 63).<\/p>\n<p><strong>Step 19. Let the firewall forward Tailscale traffic only, then offer the server as an exit node.<\/strong><\/p>\n<pre><code class=\"language-bash\">ufw route allow in on tailscale0\ntailscale set --advertise-exit-node\n<\/code><\/pre>\n<p><strong>Step 20. Approve it.<\/strong> In the Tailscale admin page, open the server's menu. Choose \"Edit route settings\", and tick \"Use as exit node\".<\/p>\n<p><strong>Step 21. Test it from your laptop.<\/strong> In the Tailscale menu, choose your server as the exit node. Then run:<\/p>\n<pre><code class=\"language-bash\">curl -s https://1.1.1.1/cdn-cgi/trace | grep loc\n<\/code><\/pre>\n<p>You know it works when it prints <code>loc=SG<\/code>.<\/p>\n<p>Then run the status test from Module 01 again (Build Log 103).<\/p>\n<ul>\n<li>Anthropic answered 403 from Hong Kong.<\/li>\n<li>It answered 401 through Annie's Singapore server.<\/li>\n<li>A 401 means the route works.<\/li>\n<\/ul>\n<p><strong>Full course: Module 08's \"After the Server\" half can start from here.<\/strong> The rest of this module also works with that half done first.<\/p>\n<p><strong>Use one switch with two settings: exit node on, or exit node off.<\/strong><\/p>\n<ul>\n<li>A Mac cannot route app by app.<\/li>\n<li>Annie built two cleverer designs that sent only some traffic through Singapore. She removed both the next day, because each put Tailscale directly in front of Claude Code (Build Log 69).<\/li>\n<li>Her rule since then: exit node on, everything goes through Singapore. Exit node off, a normal Hong Kong connection.<\/li>\n<li>Since 30 September 2026 her exit node is off by default (How To Open Claude on the VPS note, 30 Sep 2026).<\/li>\n<li>pi works in both states (Build Log 103).<\/li>\n<\/ul>\n<h3>Phones and the Mac<\/h3>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 3: moved here from the access module (Module 01). It replaces the one-line Android note that was here.]<\/em><\/p>\n<p>You use your phone to talk to your bot and to open your private pages. Phones and laptops differ in one way that matters here: can you choose which apps use the exit node?<\/p>\n<p><strong>Android can choose app by app.<\/strong><\/p>\n<ul>\n<li>In the Tailscale app, use <strong>exclude mode<\/strong>.<\/li>\n<li>Tick only the apps that should stay on your Hong Kong connection, such as Chrome and your banking apps. Everything else uses the exit node.<\/li>\n<li>Do not use include mode. It looks safer, but it breaks. Android's address lookup is not an app you can tick. So website names stop working, and the phone can log itself out of Tailscale (Build Log 68).<\/li>\n<\/ul>\n<p><strong>An iPhone routes everything or nothing.<\/strong> There is no app-by-app choice on an iPhone.<\/p>\n<p><strong>The Mac also routes everything or nothing.<\/strong><\/p>\n<ul>\n<li>Annie uses one command that switches her Mac between two states: everything through her server, or her real Hong Kong connection.<\/li>\n<li>The same command prints the address the Mac is using. So she checks the state instead of guessing it (Build Log 103).<\/li>\n<\/ul>\n<p><strong>Trust a test, not a status label.<\/strong><\/p>\n<ul>\n<li>During the Android setup, the Tailscale app showed \"Logged out\", but traffic was still going through it.<\/li>\n<li>Claude misread the label. It wrongly decided that the Claude app worked without a VPN.<\/li>\n<li>Annie caught the mistake. A test across the private network proved the connection was up the whole time (Build Log 68).<\/li>\n<\/ul>\n<h2>Other Ways to Reach Claude, and Why This Course Uses Your Server<\/h2>\n<p><em>Reading only. No extra minutes. Full only.<\/em><\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 3: moved here from the access module (Module 01), where it was \"Every Route to Claude From Hong Kong\". The wording is the same, apart from the headings and the words \"Route 2\", which now say \"the exit node\".]<\/em><\/p>\n<p>The exit node you just built is the route this course uses. Annie has used or tested three others.<\/p>\n<p><strong>A paid VPN. Not used in the Full course.<\/strong><\/p>\n<ul>\n<li>You pay a VPN company and turn it on. Then Claude works on that device. A VPN costs about $3 a month. Annie pays that for ExpressVPN. <em>[OPUS EDIT, 15 Oct 2026. Cost marks: VPN price is Annie's own ExpressVPN plan (Annie's answer, 15 Oct 2026).]<\/em><\/li>\n<li>Annie used one before her own server took over.<\/li>\n<li>The problem: a device runs one VPN at a time. A paid VPN and Tailscale both try to control the same network settings. When one was on, the other stopped working (Build Log 63).<\/li>\n<\/ul>\n<p><strong>Claude Code on the server itself.<\/strong> This is the next section.<\/p>\n<ul>\n<li>Claude Code can run on the server. You reach it from your laptop or phone.<\/li>\n<li>The server is in Singapore, so Claude answers it directly.<\/li>\n<li>The first sign-in of each account needs the exit node turned on once, because Claude's sign-in page is blocked in Hong Kong. After that, you can turn the exit node off and keep working (Build Log 105).<\/li>\n<\/ul>\n<p><strong>A Claude model through opencode. Being checked.<\/strong><\/p>\n<ul>\n<li>opencode Go's model list has one Claude model: Claude Haiku 5.5, the smallest one.<\/li>\n<li>On 9 October 2026 it answered through Annie's opencode Go plan from a Taiwan connection.<\/li>\n<li>It has not been tested from Hong Kong yet. That is the test that matters.<\/li>\n<li>This route gives you a Claude model inside pi. It does not give you Claude Code.<\/li>\n<\/ul>\n<p><strong>Haiku is the only Claude model on the opencode Go plan.<\/strong> On 9 October 2026, Opus 5.5, Opus 4.8 and Sonnet 5.5 each returned \"Model is unavailable\" on the Go plan. On opencode, the larger Claude models are pay-per-use only. They are sold through a separate service, Zen, where you pay for each use instead of a monthly fee. <em>[OPUS EDIT, 15 Oct 2026. Cost marks: mark removed. Zen has no fixed price, and the course does not use it.]<\/em><\/p>\n<p>Facilitator: run the Hong Kong check for the opencode route before teaching. It is listed in the Merge Tracker.<\/p>\n<h2>Claude Code on the Server<\/h2>\n<p><em>10 minutes. Full only.<\/em><\/p>\n<p><strong>With Claude Code on the server, you can reach your builder from your phone with the laptop closed.<\/strong> In August 2026 Annie moved hers there in about 10 minutes. It ran on the subscription she already paid for (Build Log 46).<\/p>\n<p><strong>Step 22. Install Claude Code on the server.<\/strong> Ask pi to run, on the server:<\/p>\n<pre><code class=\"language-bash\">curl -fsSL https://claude.ai/install.sh | bash\n<\/code><\/pre>\n<p><strong>Step 23. Sign in once, with the exit node on (Build Log 105).<\/strong> Claude's sign-in page is blocked in Hong Kong. Only the sign-in needs the route.<\/p>\n<ol>\n<li>In your own SSH window, run <code>claude<\/code> on the server and follow the sign-in prompt.<\/li>\n<li>It shows a web address. Open it in your laptop's browser.<\/li>\n<li>With the exit node on, the page opens.<\/li>\n<li>Once you are signed in, the login is stored on the server.<\/li>\n<li>Turn the exit node off.<\/li>\n<\/ol>\n<p>Facilitator: confirm the current sign-in flow on the day.<\/p>\n<p>You know it works when <code>claude -p \"Reply with the word PONG\"<\/code> on the server prints <code>PONG<\/code>.<\/p>\n<p><strong>Step 24. Lock it to the subscription.<\/strong> Ask pi to set <code>forceLoginMethod<\/code> to <code>claudeai<\/code> in the server's <code>~/.claude/settings.json<\/code>. Annie's server has this lock (live server check, 2 Oct 2026).<\/p>\n<p><strong>The server's login expires (Build Log 75).<\/strong><\/p>\n<ul>\n<li>On an idle server it lasted about 30 days.<\/li>\n<li>Using it did not extend it.<\/li>\n<li>The watchdog, a checking script you set up in a later module (Module 10), warns you before it lapses.<\/li>\n<\/ul>\n<h2>Your Vault on the Server<\/h2>\n<p><em>10 minutes. Full only.<\/em><\/p>\n<p><strong>Step 25. Copy your vault to the server.<\/strong><\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 10, approved by Annie on 13 Oct 2026: this step had no steps. The eight below come from the README of Obsidian's own server sync program, <code>obsidian-headless<\/code> version 0.0.14, read on 13 Oct 2026. The old text is in FABLE-EDITS.md. Not yet run on a fresh server.]<\/em><\/p>\n<p>Your vault is already on your laptop and your phone, through Obsidian Sync. Now the server joins as a third device. Obsidian makes a small program for servers, called <code>ob<\/code>. It runs the same sync as the app, with no screen.<\/p>\n<p>Keep the vault in its own folder, <code>/root/vault/<\/code>. Keep it separate from the bot's files.<\/p>\n<ol>\n<li><strong>Install Node.js, which <code>ob<\/code> runs on.<\/strong> Ask pi:<\/li>\n<\/ol>\n<p><code>text\n   Install Node.js 22 or newer on my server from NodeSource. Show me each command before running it. Then run node --version.<\/code><\/p>\n<p>You know it works when <code>node --version<\/code> prints v22 or higher.<\/p>\n<ol start=\"2\">\n<li><strong>Install <code>ob<\/code>.<\/strong> Ask pi to run:<\/li>\n<\/ol>\n<p><code>bash\n   npm install -g obsidian-headless\n   ob --help<\/code><\/p>\n<p>You know it works when <code>ob --help<\/code> lists the sync commands.<\/p>\n<ol start=\"3\">\n<li><strong>Log in to your Obsidian account, yourself.<\/strong> Run this in your SSH window, not in pi. It asks for your email, your password and your two-factor code. Never paste any of them into pi.<\/li>\n<\/ol>\n<p><code>bash\n   ob login<\/code><\/p>\n<p>You know it works when it prints your account's email.<\/p>\n<ol start=\"4\">\n<li><strong>Find your vault's exact name.<\/strong><\/li>\n<\/ol>\n<p><code>bash\n   ob sync-list-remote<\/code><\/p>\n<p>Write the name down exactly as shown.<\/p>\n<ol start=\"5\">\n<li><strong>Make the folder and link it to your vault.<\/strong> Put your vault's name between the quotes.<\/li>\n<\/ol>\n<p><code>bash\n   mkdir -p /root/vault\n   cd /root/vault\n   ob sync-setup --vault \"Your Vault Name\" --device-name server\n   ob sync<\/code><\/p>\n<p>If your remote vault uses end-to-end encryption, the setup asks for the vault's encryption password. Type it yourself.<\/p>\n<p>You know it works when <code>ls /root/vault<\/code> shows your folders: <code>00 Inbox<\/code>, <code>AI System<\/code> and the rest.<\/p>\n<ol start=\"6\">\n<li><strong>Check the sync mode. Leave it as it is.<\/strong><\/li>\n<\/ol>\n<p><code>bash\n   ob sync-config<\/code><\/p>\n<p>You know it works when the mode reads <code>bidirectional<\/code>. That means changes go both ways: laptop to server, and server to laptop. Never choose <code>mirror-remote<\/code>. It undoes every change made on the server, so anything your bot writes would vanish.<\/p>\n<ol start=\"7\">\n<li><strong>Keep it running, the same way as the bot.<\/strong> Ask pi:<\/li>\n<\/ol>\n<p><code>text\n   Create a user service called obsidian-sync that runs \"ob sync --continuous\" in /root/vault. Give it Restart=always and RestartSec=5. Enable it, start it, and show me its status. Turn on linger for this user first, so the service keeps running when nobody is logged in.<\/code><\/p>\n<p class=\"marker\"><em>[OPUS EDIT, 15 Oct 2026. Test-run flag: the prompt said linger was already on, but nothing turns it on until the bot is installed later in this module. pi now turns it on here. Turning it on twice does no harm.]<\/em><\/p>\n<p>You know it works when this prints <code>active (running)<\/code>:<\/p>\n<p><code>bash\n   systemctl --user status obsidian-sync<\/code><\/p>\n<ol start=\"8\">\n<li><strong>Test it both ways.<\/strong> On your laptop, create a note called <code>sync test<\/code> in your inbox. Within a minute, <code>ls \"/root/vault/00 Inbox\"<\/code> on the server shows it. Then, on the server, ask pi to add one line to that note. Within a minute, the line appears in Obsidian on your laptop. Then delete the note on the server first, and let the deletion sync.<\/li>\n<\/ol>\n<p>Three sync facts every student needs (Build Logs 25, 97 and 104):<\/p>\n<ul>\n<li><strong>Obsidian must be open on your laptop<\/strong> for laptop edits to leave it. The server can report that sync is fine while your laptop sends nothing.<\/li>\n<li><strong>A file name with a colon never arrives<\/strong> on a Mac.<\/li>\n<li><strong>Deleting a file on one device may not stick.<\/strong> Delete on the server first, then let it sync.<\/li>\n<\/ul>\n<p>You know it works when a note you create on your laptop appears in the server's vault folder within a minute, and a line written on the server appears on your laptop.<\/p>\n<p><strong>Step 26. Run a cold test on the server.<\/strong> A cold test is a fresh session that proves your instructions file loads. From the vault folder on the server, run the cold test from Module 08 with <code>claude -p<\/code>. Annie's first server test caught that the wrong half of her memory had been copied (Build Log 46).<\/p>\n<h3>Your Daily Routine<\/h3>\n<p>From now on (How To Open Claude on the VPS note, 30 Sep 2026):<\/p>\n<ol>\n<li>Tailscale on.<\/li>\n<li>Exit node off.<\/li>\n<li><code>ssh myserver<\/code>.<\/li>\n<li>Go to your vault folder and start Claude Code.<\/li>\n<\/ol>\n<p>pi on the laptop works at any time, with or without these four steps. Claude Code on the laptop needs the exit node on.<\/p>\n<h2>Create the Telegram Bot<\/h2>\n<p><em>10 minutes. Both courses.<\/em><\/p>\n<p><strong>Step 27. Open Telegram and search for <code>@BotFather<\/code>.<\/strong> Check for the blue verified tick. This is Telegram's official account for creating bots.<\/p>\n<p><strong>Step 28. Send <code>/newbot<\/code>.<\/strong> Give it a display name, then a username ending in <code>bot<\/code>. Choose a username that does not include your full name.<\/p>\n<p><strong>Step 29. Save the token (Build Log 103).<\/strong><\/p>\n<ul>\n<li>BotFather replies with a long token.<\/li>\n<li>Anyone with this token controls your bot.<\/li>\n<li>Save it in your password manager straight away.<\/li>\n<li>Never paste it into a chat with any AI, a note or your vault.<\/li>\n<\/ul>\n<p>You know it works when the token is in your password manager, and your new bot appears in Telegram.<\/p>\n<h2>Install Hermes and Connect It<\/h2>\n<p><em>15 minutes. Both courses.<\/em><\/p>\n<p>A bot has four parts:<\/p>\n<ul>\n<li><strong>Framework:<\/strong> the program that runs the bot. It holds its tools, memory, schedules and rules.<\/li>\n<li>This course uses Hermes Agent by Nous Research.<\/li>\n<li>Annie's server runs version 0.21.5 (live server check, 2 Oct 2026).<\/li>\n<li><strong>Channel:<\/strong> where you type to it. This course uses Telegram.<\/li>\n<li><strong>Model:<\/strong> the AI that writes the answers. This course uses DeepSeek V4.1 Flash through opencode Go, the same as your pi.<\/li>\n<li><strong>Files:<\/strong> who it is and what it must do. This course uses your SOUL, RULES and USER.<\/li>\n<\/ul>\n<p><strong>Step 30. Install Hermes.<\/strong> Ask pi:<\/p>\n<pre><code class=\"language-text\">Install Hermes Agent on my server using the official install script from the NousResearch hermes-agent repository. Then set its timezone to Asia/Hong_Kong. Show me each command before running it. When it asks for my Telegram bot token or any key, stop and tell me how to enter it myself without it being shown on screen.\n<\/code><\/pre>\n<p>The commands it should use (official repository, seen 2 Oct 2026; Build Log 14):<\/p>\n<pre><code class=\"language-bash\">curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh | bash\nhermes config set timezone Asia/Hong_Kong\n<\/code><\/pre>\n<p><strong>Set the timezone in Hermes as well as on the server.<\/strong> They are two separate settings. Annie's bot's own timezone setting was blank. That is what caused the month of wrong dates (Build Log 14).<\/p>\n<p><strong>Step 31. Connect Telegram, and allow only yourself.<\/strong> The set-up asks questions, so run it yourself in your SSH window:<\/p>\n<pre><code class=\"language-bash\">hermes gateway setup\n<\/code><\/pre>\n<ol>\n<li>Choose Telegram.<\/li>\n<li>Paste your bot token when asked.<\/li>\n<li>Enter your numeric Telegram user ID (Hermes Telegram documentation, seen 2 Oct 2026).<\/li>\n<\/ol>\n<p><strong>If you do not know your ID (Build Log 52):<\/strong><\/p>\n<ol>\n<li>Leave it blank.<\/li>\n<li>Send your bot one message from your phone.<\/li>\n<li>The bot's log will show your number, in a line saying a user was blocked.<\/li>\n<li>Add that number as the only allowed user.<\/li>\n<\/ol>\n<p>The setting is <code>TELEGRAM_ALLOWED_USERS<\/code>. It holds your number and nobody else's.<\/p>\n<p><strong>Step 32. Connect the model.<\/strong> Ask pi to add your opencode Go key to the bot's <code>.env<\/code> file without printing it. Ask it to set the model in <code>config.yaml<\/code>. Annie's live settings (Build Log 92; live server check, 2 Oct 2026):<\/p>\n<pre><code class=\"language-yaml\">model:\n  default: deepseek-v4.1-flash\n  provider: opencode-go\n  max_tokens: 2048\n<\/code><\/pre>\n<ul>\n<li>The key's name in <code>.env<\/code> on Annie's server is <code>OPENCODE_GO_API_KEY<\/code> (Build Log 94).<\/li>\n<li>Then lock the file: <code>chmod 600 ~/.hermes/.env<\/code>.<\/li>\n<li>Facilitator: confirm the provider set-up in the Hermes documentation on the day.<\/li>\n<\/ul>\n<p><strong>The output limit matters (Build Log 80).<\/strong> <code>max_tokens<\/code> caps how long one answer can be.<\/p>\n<ul>\n<li>Annie's son's tutor bot once wrote an answer of about 15,000 tokens.<\/li>\n<li>It took up to three minutes to reply.<\/li>\n<li>A short-answers rule and a 2,048-token cap brought replies well under a minute.<\/li>\n<\/ul>\n<p><strong>A model name works only on the provider that serves it.<\/strong> When Annie changed provider in September 2026, every model name the old provider used stopped working (Build Log 94).<\/p>\n<h2>Load Your Files and Make It Restart on Its Own<\/h2>\n<p><em>10 minutes. Both courses.<\/em><\/p>\n<p><strong>Optional Short course server session first.<\/strong> Your Module 07 file is one <code>AGENTS.md<\/code>. Ask pi to split it into two files in your <code>AI System<\/code> folder:<\/p>\n<ul>\n<li><code>SOUL<\/code>: the \"Who You Are\" section<\/li>\n<li><code>RULES<\/code>: every rules section<\/li>\n<\/ul>\n<p>Hermes reads different files at different times (Hermes documentation, \"Which File Does What\", seen 2 Oct 2026):<\/p>\n<table>\n<thead>\n<tr>\n<th>Your file<\/th>\n<th>Where it goes on the server<\/th>\n<th>When Hermes reads it<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>SOUL<\/td>\n<td><code>~/.hermes/SOUL.md<\/code><\/td>\n<td>At the start of every conversation, first<\/td>\n<\/tr>\n<tr>\n<td>RULES<\/td>\n<td>A file named <code>.hermes.md<\/code> in the bot's working folder<\/td>\n<td>At the start of every conversation<\/td>\n<\/tr>\n<tr>\n<td>USER<\/td>\n<td><code>~/.hermes/memories/USER.md<\/code><\/td>\n<td>At the start of every conversation<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Give the bot its own working folder<\/strong> (Annie's Hermes notes).<\/p>\n<ul>\n<li>Hermes reads <code>.hermes.md<\/code> from the folder set as the bot's working folder in its settings.<\/li>\n<li>Annie uses a dedicated folder, never <code>/root<\/code>. Then her other bots do not load the same rules.<\/li>\n<li>Facilitator: confirm the setting's name on the day.<\/li>\n<\/ul>\n<p><strong>Keep the user file short.<\/strong> Annie's settings cap it at 1,375 characters (bot settings, 9 Oct 2026).<\/p>\n<p><strong>Step 33. Copy the files.<\/strong> Ask pi:<\/p>\n<pre><code class=\"language-text\">Copy SOUL, RULES and USER from my vault's AI System folder into the places in this table on my server. Back up anything already there first. Then restart the bot and show me that the restart worked.\n<\/code><\/pre>\n<p><strong>Restart after any change, then start a fresh chat<\/strong> (Annie's Hermes notes).<\/p>\n<ul>\n<li>The bot loads its files when it starts.<\/li>\n<li>An open Telegram chat also keeps the instructions it started with, even after a restart.<\/li>\n<li>So send <code>/new<\/code> after every change.<\/li>\n<\/ul>\n<pre><code class=\"language-bash\">hermes gateway restart\n<\/code><\/pre>\n<p><strong>Step 34. Make it come back on its own.<\/strong> A bot that stops and stays stopped is worse than no bot, because you think it is working. In September 2026 two of Annie's bots stayed connected to nothing for days, and nobody knew (Build Log 76).<\/p>\n<pre><code class=\"language-bash\">hermes gateway install\n<\/code><\/pre>\n<p>This runs the bot as a service that starts with the server. Then ask pi to show you the service file and confirm the four lines below. Here is why they matter (Build Log 78):<\/p>\n<ul>\n<li>Hermes's Telegram connection gives up after about 10 reconnects and exits.<\/li>\n<li>It expects something to restart it.<\/li>\n<li>On 6 September 2026 nothing did.<\/li>\n<\/ul>\n<pre><code class=\"language-text\">Restart=always\nRestartSec=5\nRestartForceExitStatus=75\nStartLimitIntervalSec=0\n<\/code><\/pre>\n<p>Then check that it runs with nobody logged in:<\/p>\n<pre><code class=\"language-bash\">loginctl show-user root --property=Linger\n<\/code><\/pre>\n<p>You know it works when it prints <code>Linger=yes<\/code>. Annie's builder once reported the restart settings had \"vanished\". It had looked in the wrong list of services (Build Log 80).<\/p>\n<h2>Three Tests: Quoting Rules, Saying It Does Not Know, and Golden Questions<\/h2>\n<p><em>15 minutes. Both courses.<\/em><\/p>\n<p><strong>A restart proves nothing about whether the bot works.<\/strong> When the bot starts, it does not check its model key. Only a real message does (Build Log 94).<\/p>\n<p><strong>Step 35. The hello test.<\/strong> In Telegram, send <code>/new<\/code>, then <code>hello<\/code>. You know it works when a reply arrives within a few seconds.<\/p>\n<p><strong>Step 36. The quote test.<\/strong> Send:<\/p>\n<pre><code class=\"language-text\">Quote your rule about saving things, word for word.\n<\/code><\/pre>\n<p>Then:<\/p>\n<pre><code class=\"language-text\">What are your standing instructions? List their headings.\n<\/code><\/pre>\n<p>You know it works when it quotes your save rule exactly and lists the headings from your RULES file.<\/p>\n<p><strong>If it cannot quote them, stop and fix it (Build Log 32).<\/strong><\/p>\n<ul>\n<li>For weeks in July 2026 Annie's rules file was never loaded into her bot.<\/li>\n<li>Asked about one of its rules, the bot said it had none.<\/li>\n<li>Two file links and a restart fixed it.<\/li>\n<li>Annie's guide calls this \"the single most instructive bug of the whole build\".<\/li>\n<li>Nothing else you write matters until the bot can read its rules.<\/li>\n<\/ul>\n<p><strong>Step 37. The refusal test.<\/strong><\/p>\n<ul>\n<li>Send a question your files cannot answer, such as the name of a person you have never mentioned.<\/li>\n<li>The bot must say it does not know.<\/li>\n<li>A made-up answer here is the one failure you must not leave the room with.<\/li>\n<li>Fix the rule and test again.<\/li>\n<\/ul>\n<p><strong>Step 38. Your golden questions<\/strong> from Module 07. These are your test questions with known answers.<\/p>\n<ol>\n<li>Ask each one in a fresh conversation. Send <code>/new<\/code> before each.<\/li>\n<li>Then ask them all again. A right answer once can be luck (guide, Part 5).<\/li>\n<li>Write the results into your build log.<\/li>\n<\/ol>\n<h2>Same Model, Different Program: Why pi and the Bot Answer Differently<\/h2>\n<p><em>5 minutes. Both courses.<\/em><\/p>\n<p><strong>Your pi and your bot now run the same model:<\/strong> DeepSeek V4.1 Flash on opencode Go.<\/p>\n<ul>\n<li>Ask both the same question: \"What can you do with my files?\"<\/li>\n<li>The answers differ, because the program around the model differs.<\/li>\n<li>pi can read and edit the files on your laptop.<\/li>\n<li>The bot has its own skills and its own rules on the server.<\/li>\n<\/ul>\n<p><strong>The line to say.<\/strong> \"The model only answers. The program around it decides what it can read, what it remembers, and what it is allowed to do.\"<\/p>\n<p><strong>This is why Annie moved her bots to a new model in one evening.<\/strong> She changed one line in each bot's settings. The skills, rules and limits stayed the same (Build Log 92).<\/p>\n<p><strong>It is also why a Telegram bot is not limited by Telegram (Build Log 23).<\/strong><\/p>\n<ul>\n<li>Annie once assumed her bot could not build software because it was a Telegram bot.<\/li>\n<li>The real reason was that it had been set up as an AI assistant, with no tools to edit files.<\/li>\n<\/ul>\n<h2>Your First Boss Admin Move<\/h2>\n<p><em>5 minutes. Full course only. The optional Short course server session skips it, because it makes no vault copy on the server. So the bot has no to-do list to write to.<\/em> <em>[OPUS EDIT, 15 Oct 2026. Annie's choice, 15 Oct 2026: Full course only. The line said the Short session did this as homework, which could not work.]<\/em><\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 9, approved by Annie on 13 Oct 2026: new section. AUDIT.md, Finding 9. The screenshot is the one the jobs demo (Module 04) uses.]<\/em><\/p>\n<p>Your bot quotes its rules. Now it does one real job. This is the first of Annie's boss admin moves: a task typed once goes on the to-do list.<\/p>\n<p><strong>Show first:<\/strong> <code>Adding Task to To Do List (edited)<\/code>. Annie types \"add to to do list:\" and the task. The bot writes it into her one to-do list and replies with a receipt that names the exact file.<\/p>\n<p><strong>First, tell the bot where your to-do list is.<\/strong> Your rules file says \"<code>_TO DO.md<\/code> in <code>00 Inbox<\/code>\". The bot works from its own folder, not from the vault, so it needs the full path. Ask pi:<\/p>\n<pre><code class=\"language-text\">In the RULES file in my vault's AI System folder, change the to-do line so it gives the full path on this server: /root/vault/00 Inbox/_TO DO.md. Then copy RULES to the bot's .hermes.md again, the same way as before, restart the bot, and show me the line in .hermes.md.\n<\/code><\/pre>\n<p>You know it works when pi shows the line with <code>/root/vault/00 Inbox/_TO DO.md<\/code> in it.<\/p>\n<p class=\"marker\"><em>[OPUS EDIT, 15 Oct 2026. Test-run flag: nothing told the bot where the to-do file is on the server. The rules file names it without a folder, and the bot does not work from the vault. Facilitator: on the test run, confirm the bot can write to /root/vault.]<\/em><\/p>\n<p><strong>Step 39. Add one task.<\/strong> In Telegram, send <code>/new<\/code>. Then send:<\/p>\n<pre><code class=\"language-text\">add to to do list: book the dentist\n<\/code><\/pre>\n<p>You know it works when the bot replies \"Saved\" and names your to-do note, for example <code>00 Inbox/_TO DO.md<\/code>.<\/p>\n<p><strong>Step 40. Check the file, not the reply.<\/strong> A reply is a claim. Open Obsidian on your laptop. Open <code>_TO DO.md<\/code> in <code>00 Inbox<\/code>. The new line is there within a minute, because the server's vault syncs to your laptop.<\/p>\n<p>Not there after five minutes? Ask pi: \"Show me the last three lines of <code>_TO DO.md<\/code> in the vault folder on my server.\" If the line is on the server, the sync is the problem. If it is not, ask pi to search the server for any other file called <code>_TO DO.md<\/code>. A second copy means the bot wrote to the wrong folder. No second copy means the bot said \"Saved\" without writing. Tell the facilitator. That is a real finding, and it goes in your build log. <em>[OPUS EDIT, 15 Oct 2026. Test-run flag: the check now tells a write to the wrong folder apart from no write at all.]<\/em><\/p>\n<p><strong>The line to say.<\/strong> \"The bot did not just answer. It wrote a file you can open, and it told you where. Every job from here on works the same way.\"<\/p>\n<h2>Homework: A Normal User, a Swap File and a Reboot Test<\/h2>\n<p><strong>A normal user instead of root (Build Log 05; live server check, 2 Oct 2026).<\/strong><\/p>\n<ul>\n<li>Logging in as <code>root<\/code> means every command runs with full power over the machine.<\/li>\n<li>Annie's June 2026 review listed moving her bot off root as the highest-risk change. She deferred it.<\/li>\n<li>Her server still runs the bot as root.<\/li>\n<li>If you choose a normal user, do it before installing anything else, with the facilitator beside you.<\/li>\n<\/ul>\n<p><strong>A swap file (Build Log 95).<\/strong> Swap is disk space the server uses when its memory is full. Without it, a full server stops a program of its own choosing.<\/p>\n<ul>\n<li>In September 2026 Annie's server began logging memory warnings every minute.<\/li>\n<li>The cause: six forgotten Claude Code sessions held 1.5 GB between them.<\/li>\n<li>Closing them freed the memory.<\/li>\n<li>A 2 GB swap file was added, so the server has room to spare next time.<\/li>\n<\/ul>\n<p>What to do:<\/p>\n<ul>\n<li>Ask pi to add a 2 GB swap file that survives a restart, with swappiness set to 10.<\/li>\n<li>Facilitator: confirm the first command on the day, because Build Log 95 does not record how the empty file was made.<\/li>\n<li>Close Claude Code sessions with <code>/exit<\/code> when you finish.<\/li>\n<\/ul>\n<p><strong>The reboot test.<\/strong> \"It works\" and \"it survives a restart\" are different claims. Reboot the server once, then check:<\/p>\n<pre><code class=\"language-bash\">tailscale status\nsysctl net.ipv4.ip_forward\nufw status\ntimedatectl\nsystemctl --user status hermes-gateway\nsystemctl --user status obsidian-sync\n<\/code><\/pre>\n<p>You know it works when:<\/p>\n<ul>\n<li>Tailscale is connected.<\/li>\n<li>Forwarding reads 1.<\/li>\n<li>The firewall is active.<\/li>\n<li>The timezone is Hong Kong.<\/li>\n<li>The bot answers <code>hello<\/code> in Telegram.<\/li>\n<li>The sync service is running. <em>[FABLE EDIT, 13 Oct 2026. Proposal 10, approved by Annie on 13 Oct 2026: one command and one line added to the reboot test.]<\/em><\/li>\n<\/ul>\n<p><strong>Private web pages, for later.<\/strong> You may want a small private page some day, such as a dashboard. Keep it reachable only through Tailscale.<\/p>\n<ul>\n<li>Annie first published one page publicly. She moved it back to private in August 2026, because it showed household items (Build Log 64).<\/li>\n<li><strong>A password box in front of a public page protects nothing.<\/strong> The page's content is still sent to anyone who asks. The box only hides it.<\/li>\n<li>To share a page with someone outside your network, encrypt the page itself. Then the public copy cannot be read without the password (Build Log 49).<\/li>\n<\/ul>\n<h2>The Optional Short Course Server Session<\/h2>\n<p><em>Optional, outside the 10 hours. 100 minutes. A bot on a rented server, reached by plain SSH with a key.<\/em> <em>[OPUS EDIT, 15 Oct 2026. Second audit, finding 6: \"Option 2a\" removed.]<\/em><\/p>\n<table>\n<thead>\n<tr>\n<th>Min<\/th>\n<th>Segment<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5<\/td>\n<td>The plan and the four safety rules: snapshot first, an automatic undo timer, one change at a time, the web console<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Snapshot and SSH key<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>First login, timezone and updates<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>Secure the server, in an order that cannot lock you out<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Why this session stops before Tailscale<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Create the Telegram bot<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>Install Hermes and connect it<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Load your files and make it restart on its own<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>Three tests: the bot quotes your rules, says when it does not know, and answers your golden questions<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Same model, different program: why pi and the bot answer differently<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>How the minutes add up.<\/strong> The session takes 100 minutes. The plan and the four safety rules (snapshot first, an automatic undo timer, one change at a time, the web console) take 5 minutes. The snapshot and key take 10. First login takes 10. Securing the server takes 15. Why this session stops before Tailscale takes 5. Creating the bot takes 10. Installing Hermes takes 15. Loading your SOUL, RULES and USER files takes 10. Testing that the bot quotes its rules, says when it does not know and answers your golden questions takes 15. Asking pi and the bot the same question takes 5.<\/p>\n<p><strong>Why this session stops before Tailscale.<\/strong><\/p>\n<ul>\n<li>Tailscale makes the server invisible to the internet. But it adds one more thing to look after. With it off, there is no way in (Build Log 102).<\/li>\n<li>For one bot, a server that accepts only your key, with a firewall and automatic bans, is a sound setup.<\/li>\n<li>Annie's own server ran this way from June 2026 until she moved it behind Tailscale (Build Logs 05, 06 and 103).<\/li>\n<\/ul>\n<p><strong>Three things keep it safe:<\/strong><\/p>\n<ul>\n<li>Never switch password logins back on.<\/li>\n<li>Keep the passphrase on your key.<\/li>\n<li>Keep security updates automatic.<\/li>\n<\/ul>\n<p><strong>Your daily way in<\/strong> is <code>ssh root@&lt;your-server-ip&gt;<\/code>. Or ask pi to add a short name for it.<\/p>\n<p><strong>What the session does not add.<\/strong><\/p>\n<ul>\n<li>No Claude Code on the server, no exit node and no vault copy.<\/li>\n<li>The bot reads only the files you copied to it.<\/li>\n<li>Claude is still reachable from your laptop only through a VPN, as Module 01 explained.<\/li>\n<li>pi needs no VPN.<\/li>\n<\/ul>\n<h2>From the Record<\/h2>\n<p><strong>Luck, not design (Build Logs 05 and 06).<\/strong><\/p>\n<ul>\n<li>For its first month, Annie's server had five secret files that any user on the machine could read. It had no firewall.<\/li>\n<li>Her June 2026 review looked first and changed nothing. It found the gaps and sorted the fixes by risk.<\/li>\n<li>The next day the fixes went in. SSH was allowed before the firewall was switched on, with a second login window open.<\/li>\n<li>The bot kept the same process number throughout. That proved nothing broke.<\/li>\n<li><strong>The lesson.<\/strong> Look before you change. Change in an order that always leaves you able to log in.<\/li>\n<\/ul>\n<p><strong>One VPN instead of two (Build Logs 63 and 64).<\/strong><\/p>\n<ul>\n<li>In August 2026 Annie's phone could run only one VPN at a time.<\/li>\n<li>With her commercial VPN on, Claude worked and her private pages did not. With Tailscale on, the reverse.<\/li>\n<li>She made her Singapore server a Tailscale exit node. One switch did both jobs.<\/li>\n<li>The commercial VPN became unnecessary on the phone, then on the Mac.<\/li>\n<li><strong>The lesson.<\/strong> Before adding a second tool to solve a clash, ask whether the one you already have can do both jobs.<\/li>\n<\/ul>\n<p><strong>The login that expired quietly (Build Log 75).<\/strong><\/p>\n<ul>\n<li>In September 2026 Annie could not open Claude Code on her server from her phone.<\/li>\n<li>She suspected the VPN. But her phone's Claude chat was working at that moment, so the network was fine.<\/li>\n<li>The server's login had expired. Using Claude did not extend it.<\/li>\n<li>The watchdog now warns before the expiry date.<\/li>\n<li><strong>The lesson.<\/strong> When one tool works and another fails on the same device, look at what differs.<\/li>\n<\/ul>\n<p><strong>One provider move, three outages (Build Log 94).<\/strong><\/p>\n<ul>\n<li>On 27 September 2026 Annie moved her bots to a new model provider.<\/li>\n<li>Two bots went down. The new key sat only in the main bot's file, and each bot reads only its own.<\/li>\n<li>The nightly filing job failed. Its model names existed only on the old provider.<\/li>\n<li>Every restart looked healthy, because starting the bot never checks the key.<\/li>\n<li><strong>The lesson.<\/strong> After any change to keys or models, send a real message through every bot.<\/li>\n<\/ul>\n<h2>Worksheet: Server and Bot Checklist<\/h2>\n<table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Proof<\/th>\n<th>Course<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Snapshot taken before any change<\/td>\n<td>Snapshot listed in the console<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Key login works; passwords off<\/td>\n<td><code>sshd -T<\/code> shows <code>passwordauthentication no<\/code><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Firewall active<\/td>\n<td><code>ufw status verbose<\/code><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>fail2ban and security updates on<\/td>\n<td><code>fail2ban-client status sshd<\/code><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Timezone is Hong Kong, on the server and in Hermes<\/td>\n<td><code>timedatectl<\/code>; Hermes config<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Laptop, phone and server on Tailscale; key expiry off<\/td>\n<td>Tailscale admin page<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>SSH works only over Tailscale<\/td>\n<td><code>ssh myserver<\/code> works; the public address does not<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Exit node tested<\/td>\n<td><code>loc=SG<\/code> with it on<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Claude Code on the server, signed in, locked to the subscription<\/td>\n<td><code>claude -p<\/code> returns PONG<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Vault copied to the server<\/td>\n<td>A new laptop note appears on the server<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Vault syncs both ways<\/td>\n<td>A laptop note reached the server, and a server line reached the laptop<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Bot token only in my password manager<\/td>\n<td><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Only my Telegram ID is allowed<\/td>\n<td>The allow-list holds one number<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>.env<\/code> readable by the owner only<\/td>\n<td><code>ls -l<\/code> shows <code>-rw-------<\/code><\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\
