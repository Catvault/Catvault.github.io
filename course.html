li><strong>Both courses:<\/strong> your run card.<\/li>\n<\/ul>\n<p><strong>If your brief is not ready, use the umbrella example.<\/strong> It answers one question: do I need an umbrella today in Hong Kong? It uses the free Open-Meteo weather service, which needs no account and no key. It is a small version of Annie's own weather job (Build Log 35).<\/p>\n<h2>Finish the Build Brief<\/h2>\n<p><em>15 minutes, Short course only. The Full course filled in these rows in Module 09.<\/em><\/p>\n<p>Your brief from Module 09 says what the job does. These five rows say what keeps it safe. Write them before anything is built, because the builder works from the brief.<\/p>\n<table>\n<thead>\n<tr>\n<th>Row<\/th>\n<th>What to write<\/th>\n<th>Why it matters<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Must never do<\/strong><\/td>\n<td>For example: send anything to another person; delete anything; touch Tier 3 information<\/td>\n<td>The AI assistant follows written limits. It cannot follow limits you only meant.<\/td>\n<\/tr>\n<tr>\n<td><strong>Needs my approval before<\/strong><\/td>\n<td>Any step where the AI assistant should stop and ask you first<\/td>\n<td>You decide the risky steps. The AI assistant does the rest.<\/td>\n<\/tr>\n<tr>\n<td><strong>Acceptance checks<\/strong><\/td>\n<td>Three checks, written now. The builder never changes them.<\/td>\n<td>If the builder can change the test, a test pass proves nothing.<\/td>\n<\/tr>\n<tr>\n<td><strong>How to undo it<\/strong><\/td>\n<td>What you would do to remove it, in one or two lines<\/td>\n<td>If you cannot undo it, you will be afraid to try it.<\/td>\n<\/tr>\n<tr>\n<td><strong>Keep-or-kill date<\/strong><\/td>\n<td>Two weeks after it starts working<\/td>\n<td>On that date you ask one question: did I use it?<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Tier 3<\/strong> is the information that never goes into any AI tool, such as passwords, keys and bank numbers (Module 02).<\/p>\n<p><strong>Put the keep-or-kill date in your calendar now.<\/strong> Annie set this two-week test for her morning brief when it went live on 6 July 2026 (Build Log 27).<\/p>\n<p><strong>In the Short course, your brief becomes a skill.<\/strong> It is the files job you built in Module 08, now with the five rows that keep it safe. The AI assistant does the job when you ask for it, with one phrase, instead of you typing the whole question each time. Later in this module you build it. <em>[FABLE EDIT, 13 Oct 2026. Annie chose on 13 Oct 2026: in the Short course, the files job from Module 08 and the skill from Module 11 are the same job. AUDIT.md, question 3. One sentence added, one changed.]<\/em><\/p>\n<h2>Add One Thing at a Time, and Saying No to a New Tool<\/h2>\n<p><em>10 minutes, both courses.<\/em><\/p>\n<h3>Add One Thing at a Time<\/h3>\n<p><strong>Add one new thing. Test it. Use it for a few days. Then add the next.<\/strong><\/p>\n<p><strong>Why:<\/strong> in May 2026 Annie's first bot broke down. Its cheap AI model could not use its tools reliably. It said tasks were done when they were not: the log calls this \"faked success\". Finding the fix took about a week of Annie's own research. The clean-up took 13 logged hours more (Build Log 00).<\/p>\n<p>The rule from her rebuild notes: <strong>\"Don't add features in batches.\"<\/strong> Version 2 started with three things: the soul file, the rules and one reminder. Her plan was to live with it for 24 to 48 hours before building more (Build Log 00).<\/p>\n<p><strong>The reason the rule works.<\/strong> If you add one thing and something breaks, there is one place to look. If you add three things, there are three places to look, and they can affect each other.<\/p>\n<p><strong>Full course: you add two things today.<\/strong> That is allowed, because you finish and test the scheduled job before you start the skill. Do not start the skill until the job has passed its test.<\/p>\n<h3>Saying No to a New Tool<\/h3>\n<p>New AI tools appear every week. Most of them will be offered to you as something you need.<\/p>\n<p><strong>Annie's example (Build Log 28).<\/strong> On 8 July 2026 someone she works with asked whether she used the Hermes desktop app. He said it could read all the files on her computer. She checked it and decided not to add it. Her four reasons:<\/p>\n<ol>\n<li><strong>She could already do it.<\/strong> Claude Code already read her files and her vault, and reached her server.<\/li>\n<li><strong>Her phone was already covered.<\/strong> Her bot on Telegram already reached her anywhere.<\/li>\n<li><strong>Her own setup was better.<\/strong> She asked: <em>\"even if I used Codex, wouldn't I just connect it to Obsidian or a shared folder both tools read, like I do now?\"<\/em> She was right. Her notes and rules live in her own vault, so any tool can read them, and no company holds them.<\/li>\n<li><strong>It would cost her more than it gave.<\/strong> It meant a second AI assistant that was not her main one, a new way into her system, and a large update to her live server.<\/li>\n<\/ol>\n<p><strong>Exercise.<\/strong> Write down one tool you have been tempted to add. Answer two questions:<\/p>\n<ol>\n<li>What would it let me do that I cannot do now?<\/li>\n<li>What would I have to look after if I added it?<\/li>\n<\/ol>\n<p>If the first answer is \"nothing new\", the answer is no for now. Write the reason on your run card.<\/p>\n<h2>How a Scheduled Job Sends Its Message<\/h2>\n<p><em>5 minutes, Full course only.<\/em><\/p>\n<p><strong>A scheduled job<\/strong> runs at set times without you. It is a timer plus a script.<\/p>\n<p><strong>In Hermes, whatever the script prints becomes the Telegram message.<\/strong> If it prints nothing, nothing is sent. Annie's server lists each of these jobs as \"no-agent (script stdout delivered directly)\" (live server check, 10 Oct 2026). stdout means whatever the script prints. This gives the script three rules:<\/p>\n<ol>\n<li><strong>Print the message when there is something to say.<\/strong><\/li>\n<li><strong>Print nothing when there is nothing to say.<\/strong> Silence is the right answer most days. The backup is the one exception. It sends one short receipt every night, so you can see that it ran (Module 10).<\/li>\n<li><strong>Print the failure when something breaks.<\/strong> A job that fails quietly is worse than no job (Module 10).<\/li>\n<\/ol>\n<p><strong>Check your brief now.<\/strong> Which of your steps print the message? What would the script print if a step failed?<\/p>\n<h2>Build the Scheduled Job<\/h2>\n<p><em>40 minutes, Full course only.<\/em><\/p>\n<h3>Step 1. Write the Script and Test It Without Sending Anything (20 minutes)<\/h3>\n<p>Log in to your server with <code>ssh myserver<\/code>. Start Claude Code in your vault folder, as in Module 08B. Paste:<\/p>\n<pre><code class=\"language-text\">Read Build Brief 1 in my AI System folder. Ask me every question you have before you start.\nThen write a script in ~/.hermes/scripts/ that does the scripted steps.\nRules:\n- Print the message only when there is something to say. Print nothing otherwise.\n- If anything fails, print one line starting with a warning sign, saying what failed. Never fail silently.\n- Add a --dry-run option. It prints what it would send, sends nothing, and changes no saved file.\n- Back up any file before you edit it.\n- Follow the &quot;Must never do&quot; and &quot;Needs my approval before&quot; rows in my brief.\nShow me the script before you save it. Then run it with --dry-run and show me the output.\n<\/code><\/pre>\n<p><strong>The umbrella version, if you have no brief:<\/strong> ask for a script that gets today's hourly rain forecast for Hong Kong from Open-Meteo. If any hour is likely to rain, it prints \"Umbrella today\" with the wettest hours. On a dry day it prints nothing.<\/p>\n<p><strong>You know it works when<\/strong> <code>--dry-run<\/code> prints the message you expect, and a second dry run shows that no file changed.<\/p>\n<p><strong>If it fails:<\/strong> read the line it printed. Most first failures are a missing library, a wrong file path or the wrong time zone. Ask the builder to explain the error in plain words before it fixes anything.<\/p>\n<p><strong>If your brief needs an email or calendar login,<\/strong> switch to the umbrella version today. Build your real job as homework. A login takes longer than the class has.<\/p>\n<h3>Step 2. Send One Labelled Test (5 minutes)<\/h3>\n<p>Ask the builder to send you one real message, with \"🧪 TEST\" at the start.<\/p>\n<p><strong>Why:<\/strong> this is Annie's habit. She sends herself one test labelled \"🧪 TEST\" and only lets the job go live after she approves it (Build Log 37). The label stops you mistaking a test for the real thing.<\/p>\n<p><strong>You know it works when<\/strong> the message arrives on your phone, and it reads the way you want.<\/p>\n<h3>Step 3. Put It on the Schedule and Run It Once (15 minutes)<\/h3>\n<p><strong>Ask the builder to create the job.<\/strong> The exact options change between Hermes versions, so the builder reads the help first:<\/p>\n<pre><code class=\"language-text\">Run &quot;hermes cron create --help&quot; and read it. Then create a no-agent job that runs my script at [time] every [day], and delivers to my Telegram. Show me the command before running it.\n<\/code><\/pre>\n<p><strong>Choose a time when you want messages.<\/strong> Annie groups her scheduled messages into set times: a morning burst and a 6 pm admin slot. A new message must fit one of them, or it needs her yes (Build Log 27; Claudith Clean Brief Style note).<\/p>\n<p><strong>Your builder may refuse to create the job.<\/strong> In September 2026 Claude Code's own safety check stopped it from installing a permanent job on Annie's server. She typed the final command herself (Build Log 78). This is correct: the owner approves anything permanent. If it happens to you, read the command. If you agree with it, run it yourself.<\/p>\n<p><strong>Then run it once through the scheduler.<\/strong> A job that works when you run it by hand can still fail on the schedule.<\/p>\n<pre><code class=\"language-bash\">hermes cron list\nhermes cron run &lt;job-id&gt;\n<\/code><\/pre>\n<p><code>hermes cron run<\/code> runs the job at the scheduler's next check, so the message can take up to a minute.<\/p>\n<p><strong>You know it works when<\/strong> the job is in the list with the right time, and the message arrives on your phone.<\/p>\n<p><strong>If your job checks for things it already sent, run it a second time.<\/strong> The second run should send nothing.<\/p>\n<p><strong>Keep every job in the one scheduler.<\/strong> In August 2026 Annie found a job installed outside Hermes, in the server's own scheduler. It ran every night and reported success, but it had done nothing for about four weeks (Build Log 45). It did not show in <code>hermes cron list<\/code>, which is why nobody saw it (Build Log 51).<\/p>\n<h2>Build and Test One Skill<\/h2>\n<p><em>Full course: 20 minutes. Short course: 25 minutes.<\/em><\/p>\n<p><strong>A skill is a written procedure that the AI assistant reads only when it is needed.<\/strong><\/p>\n<p><strong>Why skills exist (Build Log 19).<\/strong> The AI assistant's built-in memory is small. Annie's bot has 2,200 characters, and it reads all of them with every message. A six-step procedure saved there filled it, and left no room for facts. So the rule is: <strong>facts in memory, procedures in skills.<\/strong> The Full course met this rule in Module 07.<\/p>\n<h3>What a Skill Is<\/h3>\n<p>A skill is a folder. Inside it is one file, named exactly <code>SKILL.md<\/code>. The file starts with a short description, then the steps.<\/p>\n<p><strong>Three facts decide whether a skill works (Build Logs 90 and 98):<\/strong><\/p>\n<ol>\n<li><strong>The AI assistant reads only the name and description at the start.<\/strong> It reads the steps only when your request matches the description.<\/li>\n<li><strong>So the description must say when to use the skill, in the words you would type.<\/strong> A phrase that is not in the description will not start the skill. The limit is 1,024 characters. Annie's continuity and build-log skills use 914 and 1,004.<\/li>\n<li><strong>The file name must be exactly <code>SKILL.md<\/code>.<\/strong> In September 2026 one of Annie's skill folders held a backup copy named <code>SKILL.md.bak-20260929-170928<\/code>. The AI assistant could not see it, because the name was different (Build Log 98).<\/li>\n<\/ol>\n<p><strong>A skill is used reliably once the rules file points to it.<\/strong> On Annie's bot, a skill starting by itself has never been enough. Her client-document skill was used reliably once her rules file pointed to it, so she did the same for her Storage Inventory skill (Build Log 48). So the last step is to add one line to your rules file.<\/p>\n<h3>What Your Skill Does<\/h3>\n<ul>\n<li><strong>Full course:<\/strong> it runs the scheduled job's script when you ask, and sends you the result. So you can ask \"do I need an umbrella?\" at any time, not only at 7 am.<\/li>\n<li><strong>Short course:<\/strong> it does the files job you built in Module 08, from your Build Brief, when you ask for it with one phrase.<\/li>\n<\/ul>\n<h3>Where the Skill Goes<\/h3>\n<table>\n<thead>\n<tr>\n<th>Course<\/th>\n<th>Folder<\/th>\n<th>How to check it loaded<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Full<\/td>\n<td><code>~/.hermes/skills/&lt;skill-name&gt;/SKILL.md<\/code> on the server<\/td>\n<td><code>hermes skills list<\/code> shows it. Then type <code>/new<\/code> in Telegram, because an open chat keeps the instructions it started with<\/td>\n<\/tr>\n<tr>\n<td>Short<\/td>\n<td><code>~/.agents/skills/&lt;skill-name&gt;/SKILL.md<\/code> on the laptop<\/td>\n<td>Start a new pi session. pi read skills from this folder on Annie's Mac (checked 10 Oct 2026)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Build It<\/h3>\n<p>Paste this to your builder (Claude Code in the Full course, pi in the Short course):<\/p>\n<pre><code class=\"language-text\">Make a skill for [the job from my Build Brief / my scheduled job's script].\nPut it in [the folder from the table], in a folder named [skill-name], with one file named exactly SKILL.md.\nWrite the description as a list of the phrases I would actually type to ask for it, such as &quot;do I need an umbrella&quot;.\nFollow the &quot;Must never do&quot; and &quot;Needs my approval before&quot; rows in my brief.\nThen add one line to my rules file that names the skill and says when to use it.\nShow me the SKILL.md before you save it.\n<\/code><\/pre>\n<h3>Test It Three Ways<\/h3>\n<ol>\n<li><strong>Ask in the words from the description.<\/strong> The AI assistant should use the skill.<\/li>\n<li><strong>Ask in different words you would also use.<\/strong> If it does not use the skill, add those words to the description and test again.<\/li>\n<li><strong>Ask something unrelated.<\/strong> The AI assistant should not use the skill.<\/li>\n<\/ol>\n<p><strong>You know it works when<\/strong> all three tests give the right result, and your three acceptance checks from the brief pass.<\/p>\n<h2>Shown, Not Built: A Model on a Schedule<\/h2>\n<p><em>5 minutes, Full course only.<\/em><\/p>\n<p><strong>In class, no scheduled job calls an AI model.<\/strong> The jobs you build today are fixed steps only.<\/p>\n<p><strong>Why:<\/strong> a job that runs at 3 am with nobody watching should do the same thing every time. A model can give a different answer each time, and it can report success when it failed. That happened with Annie's first bot (Build Log 00). Since her rebuild, her scheduled jobs are scripts first. A job does not hand its judgement work to her top model (Build Log 00).<\/p>\n<p><strong>How Annie's system does it now, for when you are ready:<\/strong><\/p>\n<ul>\n<li><strong>Only one of her scheduled jobs hands the whole job to a model.<\/strong> Some of her scripts also ask a model for one step. On that one job, the model and the provider are fixed on the job itself, so a change to the default cannot move it without her knowing (Build Log 94).<\/li>\n<li><strong>Phoebe, her weekly idea job, calls Claude from a script.<\/strong> The script uses <code>claude -p<\/code> on her subscription. In September 2026 a script on her server picked up an API key from its surroundings, and it billed the paid API by mistake (Build Log 89). If you ever build this, make sure the script cannot see any API key.<\/li>\n<\/ul>\n<p><strong>This course does not teach <code>claude -p<\/code> as a step.<\/strong> We have no checked source on whether a subscription allows scheduled use.<\/p>\n<p><strong>When to try it:<\/strong> week 4 of your 30-day plan (Module 12). Write the test questions first, then build it.<\/p>\n<h2>Build Your Gemini Skill and Scheduled Action<\/h2>\n<p><em>20 minutes, Short course only.<\/em><\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 8, approved by Annie on 13 Oct 2026: this section replaces \"Shown, Not Built: A Schedule on a Laptop\" (5 minutes). The old text is in FABLE-EDITS.md. The steps are the Zonta deck's, 6 Oct 2026, cut to the lines that matter.]<\/em><\/p>\n<p>A laptop can run a job at a set time. But it runs only while the laptop is awake. If the laptop is closed at 7 am, the 7 am job does not run, and nothing tells you.<\/p>\n<p>Gemini is different. Gemini runs on Google's computers, not on your laptop. So a scheduled action in Gemini runs every morning even when your laptop is closed or switched off. The message arrives in the Gemini app on your phone.<\/p>\n<p>You did the setup at home, from the handout: Gemini Pro, your calendar connected, your instructions for Gemini written, and the app on your phone. Now you build.<\/p>\n<p><strong>Step 1. Build the skill (10 minutes).<\/strong> On the laptop, open a new chat in Gemini and type one line. Fill the brackets:<\/p>\n<pre><code class=\"language-text\">Build me a skill called &quot;[name]&quot;. Every morning I want a message I can copy and paste to [who]. From [calendar], show [what]. Leave out anything private. Before you save it, ask me what you need to know.\n<\/code><\/pre>\n<p>Gemini asks you questions. Answer in plain words, as you would brief new staff. When it saves, say \"overwrite the old one\". Without that, Gemini saves a second copy.<\/p>\n<p>You know it works when \"Write today's message\" gives a message in plain lines, with nothing private in it.<\/p>\n<p><strong>Step 2. Schedule it (5 minutes).<\/strong> Type:<\/p>\n<pre><code class=\"language-text\">Every weekday at 7:30am, send me today's message.\n<\/code><\/pre>\n<p>You know it works when Settings, then Scheduled actions, shows it.<\/p>\n<p><strong>Step 3. Test it on your phone (5 minutes).<\/strong> Open the Gemini app. Ask for today's message.<\/p>\n<p>You know it works when the app's model picker shows Pro, and the message arrives.<\/p>\n<p><strong>Do not set up automatic sending into WhatsApp.<\/strong> It can get your number banned. Copy and paste by hand.<\/p>\n<p><strong>If you took the optional server sitting,<\/strong> also build a scheduled job on the server as homework. Follow the Full course steps in \"Build the Scheduled Job\" above. Bring questions to Module 12.<\/p>\n<h2>Set the Keep-or-Kill Date<\/h2>\n<p><em>5 minutes, Full course only. The Short course set its date in \"Finish the Build Brief\".<\/em><\/p>\n<p><strong>Put a review date two weeks from today in your calendar.<\/strong> On that date, ask one question: did I actually use it?<\/p>\n<p>If not, pause it without guilt. Keep the script for later. Annie set this test for her morning brief when it went live on 6 July 2026 (Build Log 27).<\/p>\n<p>Then ask your builder to write today's build log, with its index row. It records the brief, the script, the job, the skill, the test results and the keep-or-kill date.<\/p>\n<h2>The Server Question<\/h2>\n<p><em>5 minutes, Short course only.<\/em><\/p>\n<p>Your Gemini message now arrives every morning because it runs on Google's computers, not on your laptop. pi runs on your laptop, so it stops when the laptop does. So now the question is real: do you need a server?<\/p>\n<p><strong>What a server gives you:<\/strong><\/p>\n<ol>\n<li>Your AI assistant answers when your laptop is shut.<\/li>\n<li>Scheduled jobs run at 3 am.<\/li>\n<li>Your phone reaches it from anywhere.<\/li>\n<\/ol>\n<p><strong>What a server costs you:<\/strong><\/p>\n<ol>\n<li><strong>Money every month.<\/strong> About $27 for a server with its whole-server backup, at Hetzner. <em>[OPUS EDIT, 15 Oct 2026. Cost marks: price for a new order (Annie's answer, 15 Oct 2026).]<\/em><\/li>\n<li><strong>A second computer to look after.<\/strong> In September 2026 Annie's server kept warning that its memory was low. The cause was six Claude Code sessions she had left open. They were 4 to 17 days old and held 1.5 GB, of a server with 3.8 GB in total. None of them closed by itself (Build Log 95).<\/li>\n<li><strong>Logins that expire.<\/strong> Her server's Claude login expired without warning after about 30 days, while chat on her phone still worked (Build Log 75).<\/li>\n<\/ol>\n<p><strong>\"Not yet\" is an allowed answer.<\/strong> A laptop teaches the same lessons and costs nothing extra.<\/p>\n<p><strong>Exercise.<\/strong> Answer in one sentence on your run card: do I need a server, and why? If you freeze, write it instead of saying it.<\/p>\n<h2>From the Record<\/h2>\n<p>Two stories for students who ask for more.<\/p>\n<p><strong>The reminder that arrived twice (Build Log 37).<\/strong> On at least two nights in July 2026 Annie received two receipt reminders, but only one job existed. When she replied \"done\", the bot sent the files again as a reply. The fix was a written rule: when she says \"done\", log it and do not send the files again.<\/p>\n<p><strong>The bot fixed the wrong file (Build Log 42).<\/strong> In July 2026 Annie asked for a new format for her morning message. The bot said \"updated\", and it changed its skill file correctly. The next two mornings still came in the old format. The scheduled job had its own stored instructions, which said \"EXACTLY this format\", and those won every time. When a fix does not show up, find which file the job actually reads.<\/p>\n<h2>Worksheet: Growing It<\/h2>\n<table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Proof<\/th>\n<th>Course<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Five new brief rows written<\/td>\n<td>My brief<\/td>\n<td>Short<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Gemini skill tested: today's message has nothing private in it<\/td>\n<td>Gemini, on the laptop<\/td>\n<td>Short<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Scheduled action set, and the message reached the phone<\/td>\n<td>Settings, then Scheduled actions; the Gemini app<\/td>\n<td>Short<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Keep-or-kill date in my calendar<\/td>\n<td>My calendar<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>One tool I decided not to add, with my reason<\/td>\n<td>My run card<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Script prints the message, prints nothing when quiet, prints failures<\/td>\n<td><code>--dry-run<\/code> output<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><code>--dry-run<\/code> changed no file<\/td>\n<td>A second dry run<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>One \"🧪 TEST\" message arrived and I approved it<\/td>\n<td>My phone<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Job is on the schedule at the right time<\/td>\n<td><code>hermes cron list<\/code><\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Job ran once through the scheduler<\/td>\n<td>The message on my phone<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Skill folder holds one file named exactly <code>SKILL.md<\/code><\/td>\n<td>The folder listing<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Skill passed all three tests<\/td>\n<td>My notes<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Rules file points to the skill<\/td>\n<td>The line in my rules file<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>One-sentence answer to the server question<\/td>\n<td>My run card<\/td>\n<td>Short<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Today's build log written, with its index row<\/td>\n<td>The log and the index<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 2: closing line added.]<\/em><\/p>\n<p><strong>Next: the close (Module 12).<\/strong> One job runs without you. Now you check it against the promise, and plan the next 30 days.<\/p>\n<h2>Teaching Notes<\/h2>\n<ul>\n<li><strong>Check two things before the course.<\/strong> The <code>hermes cron create<\/code> options in the Hermes version the room installs. And that the pi version the room installs still reads skills from <code>~/.agents/skills/<\/code>.<\/li>\n<li><strong>The skill description is the hard part.<\/strong> v1 called the skill exercise \"the hardest fifteen minutes in the course for some students\". Sit with each student and write the trigger phrases together.<\/li>\n<li><strong>The umbrella example is fine.<\/strong> A small job that works teaches more than a large one that does not finish.<\/li>\n<li><strong>Students will want a second job straight away.<\/strong> Point them to week 3 of the 30-day plan (Module 12).<\/li>\n<li><strong>Three students at most.<\/strong> In the Full course, the 40-minute build needs you at each keyboard in turn.<\/li>\n<li><strong>Timing risk:<\/strong> a brief that needs a login (email, calendar) runs long. Switch that student to the umbrella example and leave the real job as homework.<\/li>\n<\/ul>"}, {"id": "full-16", "title": "11: Handout, More Ways to Grow Your System", "handout": true, "html": "<h1>More Ways to Grow Your System<\/h1>\n<p><em>A handout for Module 11, both courses. Read it at home, after your first job or skill has run for a week. Each section comes from Annie's build logs. Use one at a time.<\/em><\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 4, approved by Annie on 13 Oct 2026. In this file: 0 changes, 0 editor notes and the sections Sources, Related moved to <code>editor-notes/11 — Handout, Editor's Notes.md<\/code>. Every change, with its old and new text, is listed in FABLE-EDITS.md.]<\/em><\/p>\n<h2>Formatting Messages for the Phone<\/h2>\n<p><strong>A correct message is not always a usable one.<\/strong> Annie's weather job worked out the weather correctly. She still said: \"in terms of how I want to read it, it's not quite right.\" The one line she could act on was hidden under a loud warning sign (Seminar Ideas, 15 and 19 July 2026).<\/p>\n<p><strong>Five of the seven rules in Annie's message format, approved on 15 July 2026<\/strong> (Claudith Clean Brief Style note):<\/p>\n<ol>\n<li>A bold first line that says what this is and when.<\/li>\n<li>A one-line summary under it.<\/li>\n<li>Short \"Label: value\" lines, with a blank line between items.<\/li>\n<li>Warning signs only where you need to act.<\/li>\n<li>Turn the unimportant items into a count. Send nothing when nothing matters.<\/li>\n<\/ol>\n<p><strong>Telegram shows only some formatting.<\/strong> Bold, italics, code and links work. Headings and quote blocks show as stray characters. Tables turn into bullet lists (Build Log 108).<\/p>\n<p><strong>Read the real message on your real phone.<\/strong> Annie's weather job took 18 changes in 6 days (Build Log 35). Each round of changes came from her reading the real message on her real phone (Seminar Ideas).<\/p>\n<h2>Reading the Web, With a Cap<\/h2>\n<p>Many useful jobs read web pages. Annie's bots use Firecrawl. It turns a web page into clean text, and it can search. Its free plan gives 1,000 credits a month. A search costs about 2 credits (Annie's notes, 29 Sep 2026).<\/p>\n<p><strong>Cap the job, not only the account.<\/strong> The first run of Annie's company-watch job had no limit on how many searches the AI could make. It used 92 credits and never finished. Limited to 14 calls, it finished in 12 and used 21 credits (<code>Firecrawl — Use Cases<\/code> note).<\/p>\n<p><strong>Her rule for Firecrawl:<\/strong> warn before the limit, and never top up automatically (Annie's Firecrawl notes).<\/p>\n<h2>Pausing and Restarting a Job<\/h2>\n<p>Pausing keeps the job but stops it from running. Use it on your keep-or-kill date if you are not sure yet.<\/p>\n<pre><code class=\"language-bash\">hermes cron pause &lt;job-id&gt;\nhermes cron resume &lt;job-id&gt;\n<\/code><\/pre>\n<p>Annie once paused a working bill reminder on the day she built it. It only told her to go and check an app, so it removed no work (Build Log 41).<\/p>\n<h2>Two Ways to Use a Model on a Schedule<\/h2>\n<p>Try these only after week 4 of your 30-day plan (Module 12), with your test questions written first.<\/p>\n<p><strong>1. A model job with its model fixed.<\/strong> The scheduler hands a request to the bot's model. Fix the model and the provider on the job itself. Then a change to the default model cannot move the job without you knowing. Annie's scheduler refuses to run a job that has no fixed model if the default changed after the job was made (Build Log 84). Her command (Build Log 94):<\/p>\n<pre><code class=\"language-bash\">hermes cron edit &lt;job-id&gt; --model deepseek-v4.1-flash --provider opencode-go --pin\n<\/code><\/pre>\n<p><strong>2. The model writes, a script sends.<\/strong> In June 2026 Annie wanted her morning summary as several short messages. A scheduled model job could only send one reply, and the cheap model added its working notes to it. The fix used two jobs. The model job writes only the clean message to a file, and sends nothing. Five minutes later, a script job splits the file and sends each part as its own message (Build Log 15).<\/p>"}, {"id": "full-17", "title": "11: Handout, Your Gemini Morning Message (Short Course)", "handout": true, "html": "<h1>Your Gemini Morning Message (Short Course)<\/h1>\n<p><em>A handout for Module 11, Short course. Do the steps at home before the module, up to the end of \"Teach Gemini How To Talk To You\". The skill and the schedule are built in class. Keep the rest for when something goes wrong.<\/em><\/p>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 8, approved by Annie on 13 Oct 2026: new file. Every section is from Annie's Zonta seminar deck of 6 Oct 2026, word for word, apart from two pointers by number that now name the thing: \"check Step 5 is saved\" became \"check your instructions for Gemini are saved\". \"(screenshot)\" marks a picture from the deck that is not in this file yet.]<\/em><\/p>\n<h2>Step 1. Check These<\/h2>\n<p>You are on a personal Google account. Not a work one, not a school one.\nKeep Activity is ON. Go to myactivity.google.com/product/gemini.\nMost problems today come from one of these. So we check them first.<\/p>\n<h2>Step 1. Check These (2)<\/h2>\n<p>Smart features in other Google products is ON, in your Gmail settings. (screenshot)<\/p>\n<h2>Step 2. Pay For Gemini Pro<\/h2>\n<p><em>(table: Plan · Price · What you get)<\/em><\/p>\n<ul>\n<li>Free · HK$0 · Flash-Lite from 9 October 2026. Weak, and often wrong.<\/li>\n<li>Google AI Plus · about HK$38/month · Gemini Pro for now. It loses Pro on a date Google emails you.<\/li>\n<li>Google AI Pro · about HK$158/month · Gemini Pro, kept. This is the one to buy.<\/li>\n<li>Work Workspace · varies · May include Gemini, if your office switched it on.\nWhy pay: the free and cheaper models are weak and get things wrong. To pay, open Google One, or tap the upgrade button inside Gemini.\nThe morning message itself is free. HK$158 is the price of the Pro model, not a fee for a schedule.<\/li>\n<\/ul>\n<h2>Step 3. Open Gemini On Your Laptop<\/h2>\n<p>Go to gemini.google.com in your browser. Sign in with the Google account you paid from. Look at the model picker at the top of the chat. Choose Pro.\nYou know it works when the model picker shows Pro.\nNo Pro? Check the account name in the top corner. It must be the account you paid from.<\/p>\n<h2>Step 4. Set Up A Household / Helper / Kid's Calendar<\/h2>\n<p>If you only have your personal Google account and no separate one for your household, set up a new Google account for your household. This protects your own privacy.\nEach Google account can have multiple calendars within it. You can choose to make one calendar per kid and helper, or combine all their tasks and events into one calendar. Do whichever works for your household.\nIf you don't know how to do this, ask Gemini Pro. The more you use it, the better a PA it becomes.\nName the calendars, not the people. Your helper never logs in to anything.\nAlready have these calendars on another Google account? Share them to yours. The next section shows how.<\/p>\n<h2>Step 4. Share Household/Kid's Calendar To Your Personal Account<\/h2>\n<p><em>(three screenshot slides)<\/em><\/p>\n<ol>\n<li>Open that calendar's settings<\/li>\n<li>Shared with → + Add people<\/li>\n<li>Choose \"See event details\"<\/li>\n<\/ol>\n<h2>Step 4. Connect Your Calendar To Gemini<\/h2>\n<p>Back in Gemini, open a new chat. Type @ and choose Google Calendar. Then type: \"What is on my calendar today?\"\nIt worked when Gemini reads back real events from your day. Nothing? Settings, then Personal Intelligence, then Connected apps: switch Calendar on.<\/p>\n<h2>Step 5. Teach Gemini How To Talk To You<\/h2>\n<p>In Gemini: Settings → Personal Intelligence → Instructions for Gemini. (screenshot)<\/p>\n<h2>Step 5. Teach Gemini How To Talk To You: Personality<\/h2>\n<p>Type your instructions. Save. It applies to every chat from now on.\nThis is how every answer in my own Gemini starts with a summary and ends with a next step.\nMy own example: Write in short, plain sentences. Always include a summary and bullet points if possible. No paragraph should be longer than 3 sentences. Always end with a suggested next action, giving options and explaining your recommendation and why. Never use my personal calendar unless specified.<\/p>\n<h2>Step 6. Build Your Skill The Easy Way<\/h2>\n<p>Currently, a Google bug stops skills saving in the phone app so best to do from laptop.\nOpen a new chat and type the line below. Gemini asks you questions. Answer in plain words, as you would brief new staff.\n\"Build me a skill called \"Helper Daily Msg\". I want a daily message that I can copy-paste to Whatsapp for my helper. Drawing from XYZ calendar(s), it should show my household events so she knows what to do. Before you save it, ask me what you need to know about my house, my helper and our daily routine.\"<\/p>\n<h2>Step 6. Or Paste A Full Skill Manually (part 1 of 2)<\/h2>\n<p>A full 13-rule skill prompt (household, calendars, how to write the message, 30 minutes travel time). Copy it from tinyurl.com/zonta-gemini, fill the brackets, and send it as one message.<\/p>\n<h2>Step 6. Or Paste A Full Skill Manually (part 2 of 2)<\/h2>\n<p>The rules that matter: never mention anything private; a journey is not an appointment; add daily things that are on no calendar; after the message add up to 5 \"Check these\" lines; end with \"Shall I add these to the Helper calendar?\"; when the day changes, rewrite the whole message.\nThis is the skill I use every morning, with my family's names taken out.<\/p>\n<h2>Step 6. Change Your Skill Later<\/h2>\n<p><em>(table: You want to → Type this)<\/em><\/p>\n<p>Change the travel time · Ask about dinner · Drop the please · Read what it saved.\nAlways say \"overwrite the old one\". Without it, Gemini saves a second copy called Helper day v2.\nGemini cannot delete a skill for you. Settings, then Skills, then the three dots on its row, then Delete.<\/p>\n<h2>Step 7. Ask For Today's Message<\/h2>\n<p>This is the only line you type from now on: \"Write today's helper message.\"\nRead the message before you send it. Not quite right? Say what to change, as you would to staff.\nIt ends with Check these, and asks to add missing jobs to your Helper calendar. Say yes, and it stops forgetting them.<\/p>\n<h2>Step 7. Test The Privacy Before You Trust It<\/h2>\n<p>Type: \"List every event you put in today's helper message, and tell me which calendar each one came from.\"\nCheck that your private event is not in the list. Check that the journeys are there: the drop-off, the collection, the drive.\nNo private event today? Name one you would expect it to leave out, and check that one.\nA private event got in? It is on the wrong calendar. Move it to your personal calendar, and check your instructions for Gemini are saved.<\/p>\n<h2>Step 8. Schedule Your Helper Message<\/h2>\n<p>Type: \"Every weekday at 7:30am, send me today's helper message.\" It needs no paid plan.\nSee or change it in Settings, then Scheduled actions. You can have up to 10.\nDo not set up automatic sending into WhatsApp. It can get your number banned. Copy and paste by hand.<\/p>\n<h2>Step 9. Put It On Your Phone<\/h2>\n<p>Open the app store on your phone. Search for Google Gemini, and install it. Sign in with the same Google account. Open the app.\nYou know it works when the app's model picker shows Pro.\nBuild or change skills on the laptop, never by hand in the phone app.<\/p>\n<h2>What Your AI PA Can Do: Calendar Checker<\/h2>\n<p><em>(screenshot)<\/em><\/p>\n<h2>Build The Calendar Checker Skill<\/h2>\n<p>Build this once, the same way as Helper day. Then paste the times you were offered, and it tells you which are free.\n\"Build me a skill called \"Calendar checker\". When I give you suggested times, check them against my calendar and [child]'s calendar. Tell me which are free and which clash. Protect [child]'s routine: [nap 1pm to 3pm, bath 6pm, bed 8:15pm].\"\nI built mine by typing one line: \"check my calendar and my son's against suggested times [insert times here]\". Gemini did the rest.<\/p>\n<h2>If Something Goes Wrong<\/h2>\n<p><em>(table: What you see → What to do)<\/em><\/p>\n<p>No Pro in the model picker → Sign in to the Google account you paid from.\nIt cannot see your calendar → Say: Please connect to my Google Calendar.\nA calendar is missing → Share it to your account, with See event details.\nIt gave you a table, not a message → Say: Rewrite that as one plain message, ready to copy and paste.\nYour private event is in the message → Move it to your diary calendar. Check your instructions for Gemini are saved.\nNo Skills in your settings → You are on a work or school account. Use a personal one.\nNothing saves → Turn on Keep Activity at myactivity.google.com/product/gemini.\nThe morning message stopped → Settings, then Scheduled actions. Switch it back on.\nA skill you want to delete → Settings, then Skills, then the three dots on the old one, then Delete.<\/p>"}, {"id": "full-18", "title": "12: The Close, Your 30-Day Plan", "handout": false, "html": "<h1>Module 12: The Close, Your 30-Day Plan<\/h1>\n<p><strong>How to read this file.<\/strong><\/p>\n<ul>\n<li>This is the master copy for both courses.<\/li>\n<li>The Full course runs every segment with minutes in its column.<\/li>\n<li>The Short course runs only the segments with minutes in its column.<\/li>\n<\/ul>\n<p><strong>Why this module comes last.<\/strong><\/p>\n<ol>\n<li>Students now own a system that does one real job (Modules 08 and 11).<\/li>\n<li>It has checks that tell them when it breaks (Module 10).<\/li>\n<li>So the last job is to check it against the course promise, and to plan the next four weeks.<\/li>\n<li>The course ends on the student's next action, not on a summary.<\/li>\n<\/ol>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 4, approved by Annie on 13 Oct 2026. In this file: 0 changes, 1 editor notes and the sections Where the Versions Went, Open Points for Annie, Sources, Related moved to <code>editor-notes/12 — Editor's Notes.md<\/code>. Every change, with its old and new text, is listed in FABLE-EDITS.md.]<\/em><\/p>\n<h2>Run Sheet<\/h2>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 13, approved by Annie on 13 Oct 2026: every check in this file now starts \"You know it works when\". AUDIT.md, Finding 13. The old wording of each line is in <code>proposals/13 — One Phrase for Every Check.md<\/code>.]<\/em><\/p>\n<p>Full course: 40 minutes. Short course: 15 minutes. A dash means the segment is not in that course.<\/p>\n<table>\n<thead>\n<tr>\n<th>Full (min)<\/th>\n<th>Short (min)<\/th>\n<th>Segment<\/th>\n<th>Facilitator does<\/th>\n<th>Students do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5<\/td>\n<td>5<\/td>\n<td>The promise, checked<\/td>\n<td>Reads the rows for this course<\/td>\n<td>Check their own system, row by row<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>—<\/td>\n<td>The closing question<\/td>\n<td>Goes round the room<\/td>\n<td>Answer it in one sentence, spoken or written<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>—<\/td>\n<td>Owner drill 1: an alert, without the builder<\/td>\n<td>Hands out one sample alert to each student<\/td>\n<td>Do the alert's one action, with no builder<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>5<\/td>\n<td>Your 30-day plan<\/td>\n<td>Shows a filled-in plan<\/td>\n<td>Write their own four weeks<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>—<\/td>\n<td>Owner drill 2: a delete that sticks<\/td>\n<td>Watches each screen<\/td>\n<td>Delete a test note on the server first, then check the laptop<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>5<\/td>\n<td>When it breaks, and where to get help<\/td>\n<td>Explains the four steps and the group chat<\/td>\n<td>Write the four steps and the chat name on the run card<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>—<\/td>\n<td>The last save<\/td>\n<td>Reminds the room; checks each build log has its index row<\/td>\n<td>Say \"save\" to their builder<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>How the minutes add up.<\/strong><\/p>\n<ul>\n<li><strong>Full course: 40 minutes.<\/strong> The close takes 30: the promise 5, the closing question 5, the 30-day plan 10, when it breaks and where to get help 5, and the last save 5. The two owner drills take 10, 5 minutes each.<\/li>\n<li><strong>Short course: 15 minutes.<\/strong> The promise takes 5. The plan takes 5. When it breaks and where to get help takes 5. The closing question is homework, written on the run card. The last save is said at the end of the help segment, with no extra minutes.<\/li>\n<\/ul>\n<h2>What You Will Leave With<\/h2>\n<p><strong>Both courses:<\/strong><\/p>\n<ul>\n<li>Your system, checked against the course promise. Any row you cannot tick is written on your run card as work to do.<\/li>\n<li>A 30-day plan, one row for each week, with a stop condition for each week.<\/li>\n<li>The four steps to take when something breaks.<\/li>\n<li>The name of the group chat where you get help for four weeks, and the date of the class call.<\/li>\n<\/ul>\n<p><strong>Full course only:<\/strong><\/p>\n<ul>\n<li>Proof that you can run your system alone: you did one alert's action and one delete that sticks, with no builder.<\/li>\n<\/ul>\n<h2>The Promise, Checked<\/h2>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 7, approved by Annie on 13 Oct 2026: one line added.]<\/em> Show the system picture from Module 03A. Every box on it now exists.<\/p>\n<p><em>5 minutes, both courses.<\/em><\/p>\n<p>At the start, the course promised you a system you can check. Check it now, against what is in front of you.<\/p>\n<p><strong>Full course.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>The claim<\/th>\n<th>The check<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>One AI assistant you can reach from your phone<\/td>\n<td>Send your bot a message on Telegram, and read the answer<\/td>\n<\/tr>\n<tr>\n<td>One real job that runs without you<\/td>\n<td>Run <code>hermes cron list<\/code> and find your scheduled job from Module 11<\/td>\n<\/tr>\n<tr>\n<td>Three rules you wrote<\/td>\n<td>Name them, and say how each one is checked<\/td>\n<\/tr>\n<tr>\n<td>It tells you when it breaks<\/td>\n<td>Run your watchdog with <code>--status<\/code>. All three checks are green<\/td>\n<\/tr>\n<tr>\n<td>You know what it costs<\/td>\n<td>Read the monthly figure off your run card<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Short course.<\/strong><\/p>\n<table>\n<thead>\n<tr>\n<th>The claim<\/th>\n<th>The check<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>One AI assistant on your laptop<\/td>\n<td>Start pi in your folder, and ask it a question<\/td>\n<\/tr>\n<tr>\n<td>One real job<\/td>\n<td>Ask for the job, in the words from your skill's description<\/td>\n<\/tr>\n<tr>\n<td>Three rules you wrote<\/td>\n<td>Name them, and say how each one is checked<\/td>\n<\/tr>\n<tr>\n<td>It tells you when it cannot answer<\/td>\n<td>Ask one of your golden questions that it should refuse, and read the refusal<\/td>\n<\/tr>\n<tr>\n<td>You know what it costs<\/td>\n<td>Read the monthly figure off your run card<\/td>\n<\/tr>\n<tr>\n<td>Your morning message arrived today without you<\/td>\n<td>Open the Gemini app on your phone and read it<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p class=\"marker\"><em>[FABLE EDIT, 13 Oct 2026. Proposal 8, approved by Annie on 13 Oct 2026: one Short course row added. Gemini runs on Google's computers, so the message arrives whether or not the laptop is on.]<\/em><\/p>\n<p><strong>A row you cannot tick is work to do. It is not a failure.<\/strong> Write the row on your run card. Bring it to the group chat or the class call.<\/p>\n<p><strong>Why the Full course checks the watchdog, not a refusal.<\/strong> The Full course built checks that run by themselves (Module 10). A refusal tests a different thing: the rule about saying when the AI assistant does not know.<\/p>\n<h2>The Closing Question<\/h2>\n<p><em>5 minutes, Full course. Short course: homework, written on the run card.<\/em><\/p>\n<p><strong>\"What have I built, and what does it take off my mind?\"<\/strong><\/p>\n<p><strong>Answer it in one sentence.<\/strong> You can say it to the room, or write it down. If you can describe your system in one sentence, you know what it is for. Keep the sentence somewhere you will see it.<\/p>\n<p><strong>Annie's own sentence, for an example.<\/strong> In August 2026 she wrote what the whole effort is for: clearing what drains her, so she can be present with the people in front of her, including herself (Build Log 72).<\/p>\n<p><strong>The second question, written, not spoken.<\/strong> What would \"too much looking after\" be for you? For example: more than 30 minutes a week of fixing. Write your limit now. If you reach it later, you switch something off. You do not keep adding.<\/p>\n<h2>Owner Drill 1: An Alert, Without the Builder<\/h2>\n<p><em>5 minutes, Full course only.<\/em><\/p>\n<p><strong>Why this drill exists.<\/strong> After today, nobody sits beside you. Your watchdog will one day send you an alert. You must be able to do its one action yourself, even if your builder is not working.<\/p>\n<p><strong>What the facilitator gives you.<\/strong> A printed alert, in the same format as your own watchdog's messages:<\/p>\n<pre><code class=\"language-text\">⚠️ Backup is 31 hours old (limit 26).\nDo this: run the backup script now, then run the watchdog with --status.\n<\/code><\/pre>\n<p><strong>What you do. Do not open Claude Code or pi.<\/strong><\/p>\n<ol>\n<li>Log in to your server: <code>ssh myserver<\/code>.<\/li>\n<li>Find your backup script: <code>ls ~/.hermes/scripts/<\/code>. Your run card should also have its name.<\/li>\n<li>Run it: <code>python3 ~/.hermes/scripts/&lt;your backup script&gt;<\/code>.<\/li>\n<li>Run your watchdog: <code>python3 ~/.hermes/scripts/watchdog.py --status<\/code>.<\/li>\n<\/ol>\n<p><strong>You know it works when<\/strong> the backup check is green, and you did not ask a builder.<\/p>\n<p><strong>If you got stuck,<\/strong> write down the step where you stopped. Add the missing command to your run card now. That is the point of the drill: the run card must hold what you need.<\/p>\n<h2>Your 30-Day Plan<\/h2>\n<p><em>Full course: 10 minutes. Short course: 5 minutes.<\/em><\/p>\n<p><strong>Add one tested thing at a time. Then live with it for a few days before you add the next.<\/strong> This is the rule from Module 11, and it applies after the course too. When Annie broke this rule in May 2026, the clean-up took 13 logged hours (Build Log 00).<\/p>\n<p><strong>Expect to change things many times.<\/strong> Annie built and reshaped her storage system across five days in August 2026. It took about 45 to 50 separate changes (Build Log 52). Changing your mind is how the system becomes yours.<\/p>\n<p><strong>Write your own plan.<\/strong> One row for each week. Each week has a stop condition: the thing that tells you the week is done.<\/p>\n<table>\n<thead>\n<tr>\n<th>Week<\/th>\n<th>What you do<\/th>\n<th>Stop condition<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1<\/strong><\/td>\n<td>Add nothing new. Use what you built today. Note anything that annoys you<\/td>\n<td>You used it at least three times, and you wrote down each annoyance<\/td>\n<\/tr>\n<tr>\n<td><strong>2<\/strong><\/td>\n<td>Your keep-or-kill date arrives (Module 11). Ask: did I actually use it? Keep it, change it, or switch it off. Bring your answer to the class call<\/td>\n<td>You decided, and you wrote down why<\/td>\n<\/tr>\n<tr>\n<td><strong>3<\/strong><\/td>\n<td>Add one more thing, from your Module 05 maps. One thing, one check, one sentence to describe it<\/td>\n<td>It passed its test, and it ran for three days<\/td>\n<\/tr>\n<tr>\n<td><strong>4<\/strong><\/td>\n<td>Try one task that needs AI judgement. Write your test questions with known answers first, then build it (Module 09)<\/td>\n<td>It passed your test questions. <strong>Full:<\/strong> your RULES file matches <code>hermes cron list<\/code>. <strong>Short:<\/strong> your <code>AGENTS.md<\/code> still describes everything your AI assistant does<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>How to size the week 3 thing.<\/strong> It is one thing. It has one check. You can describe it in one sentence. \"Send me the invoices that need a claim\" is one thing. \"Sort out my admin\" is not.<\/p>\n<p><strong>Switching something off counts as progress.<\/strong> On 27 July 2026 Annie built a job that watched for her credit card statement. Every test passed. She switched it off a few hours later. The bank's email never contained the amount or the due date, so the job could only ever say \"go and check the app\". It did not remove a chore, so it did not earn a place (Build Log 41).<\/p>\n<p><strong>Short course, week 3:<\/strong> if you took the optional server sitting, your one more thing can be a scheduled job. Follow Module 11's Full course steps.<\/p>\n<h2>Owner Drill 2: A Delete That Sticks<\/h2>\n<p><em>5 minutes, Full course only. Skip it if your vault is not on your server, and use the time for your plan.<\/em><\/p>\n<p><strong>Why this drill exists.<\/strong> In Annie's setup, a note deleted on her laptop can come back. A delete made on the server first does reach every device (Build Log 106). Module 08B told you this. Now you do it once, so you remember it.<\/p>\n<ol>\n<li>On your laptop, in Obsidian, make a note called <code>Drill test note<\/code>.<\/li>\n<li>Wait for it to sync. Then check it is on the server: <code>ls ~/&lt;your vault folder&gt;/<\/code>.<\/li>\n<li>Delete it on the server: <code>rm ~/\"&lt;your vault folder&gt;/Drill test note.md\"<\/code>. Keep the quote marks, because the file name has spaces.<\/li>\n<li>Wait for the next sync run. Look in Obsidian on your laptop.<\/li>\n<\/ol>\n<p><strong>You know it works when<\/strong> the note is gone from your laptop too.<\/p>\n<p><strong>Write the rule on your run card:<\/strong> \"To delete a note for good, delete it on the server first.\"<\/p>\n<h2>When It Breaks, and Where to Get Help<\/h2>\n<p><em>5 minutes, both courses.<\/em><\/p>\n<h3>The Four Steps<\/h3>\n<p>When something goes wrong, do these in order. Read the real thing before you guess.<\/p>\n<ol>\n<li><strong>Read what the AI assistant actually said,<\/strong> and what the file actually contains.<\/li>\n<li><strong>Check which folder it was started in.<\/strong> Most \"it forgot my rules\" problems are the wrong folder.<\/li>\n<li><strong>Check that the rule is written in a file.<\/strong> A rule you only said in a chat is gone after the chat ends.<\/li>\n<li><strong>Ask your builder one question, with the real output pasted in.<\/strong><\/li>\n<\/ol>\n<p><strong>If the four steps do not fix it, go to the group chat.<\/strong> Paste the real output there too. A copy of the error is quicker to answer than a description of it.<\/p>\n<h3>Help for Four Weeks After the Course<\/h3>\n<ul>\n<li><strong>A shared group chat for the class, for four weeks.<\/strong> It covers your whole 30-day plan.<\/li>\n<li><strong>Who answers:<\/strong> Annie or a co-teacher, as messages arrive. You should not lose a day of progress waiting for an answer.<\/li>\n<li><strong>The hours the chat is covered:<\/strong> [TO CONFIRM]. The co-teachers live in other time zones, so the hours are agreed after this draft.<\/li>\n<li><strong>One class call at the end of week 2,<\/strong> 30 to 45 minutes. This is when your keep-or-kill date arrives. Bring your answer, and any row from the promise check you could not tick.<\/li>\n<li><strong>Included in the course fee.<\/strong> The chat and the class call cost nothing extra. <em>[OPUS EDIT, 15 Oct 2026. Cost marks: Annie's answer, 15 Oct 2026: the four weeks of help are included.]<\/em><\/li>\n<\/ul>\n<p><strong>Write on your run card:<\/strong> the chat's name, the date and time of the class call, and the four steps.<\/p>\n<h3>The Last Save<\/h3>\n<p><em>Full course: 5 minutes. Short course: at the end of the help segment.<\/em><\/p>\n<p>Say <strong>\"save\"<\/strong> to your builder. It updates your continuity note and writes today's build log with its index row, as you set up in Module 08. This is the last thing you do in the course.<\/p>\n<h2>Worksheet: The Close<\/h2>\n<table>\n<thead>\n<tr>\n<th>Check<\/th>\n<th>Proof<\/th>\n<th>Course<\/th>\n<th>Done<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Every promise row checked<\/td>\n<td>My run card, with any row I could not tick<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>One sentence: what I built, and what it takes off my mind<\/td>\n<td>My run card<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>My limit for \"too much looking after\"<\/td>\n<td>My run card<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Drill 1: alert action done, with no builder<\/td>\n<td>Watchdog <code>--status<\/code> all green<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Drill 2: deleted on the server, gone from the laptop<\/td>\n<td>Obsidian on my laptop<\/td>\n<td>Full<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>30-day plan, four rows, each with a stop condition<\/td>\n<td>My plan<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Keep-or-kill date still in my calendar<\/td>\n<td>My calendar<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>The four steps, the chat's name and the call date<\/td>\n<td>My run card<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>Last save done<\/td>\n<td>My continuity note and build log<\/td>\n<td>Both<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Teaching Notes<\/h2>\n<ul>\n<li><strong>End on the student's next action.<\/strong> The last thing each student hears is \"start week 1 tomorrow\", not a summary.<\/li>\n<li><strong>Some adults freeze when asked to speak.<\/strong> Always allow a written answer to the closing question.<\/li>\n<li><strong>Students who used a fallback in the build<\/strong> (the umbrella example, or a browser) will have rows they cannot tick. Say plainly that this is work to do, not failure.<\/li>\n<li><strong>The drills are done without the builder on purpose.<\/strong> If a student opens Claude Code or pi, ask them to close it. The drill tests the run card, not the builder.<\/li>\n<li><strong>Prepare drill 1 before class.<\/strong> Print one sample alert for each student. Check each student's watchdog alert format in Module 10, so the sample looks like their own.<\/li>\n<li><strong>Drill 2 needs the vault on the server.<\/strong> Check this per student in Module 08B. A student without it skips the drill.<\/li>\n<li><strong>Name the group chat and set the call date before class.<\/strong> A student should leave with both written down, not \"we will let you know\".<\/li>\n<li><strong>Three students at most.<\/strong> In the drills, you watch each screen in turn.<\/li>\n<\/ul>"}], "short": [{"id": "short-about", "title": "About the Short course", "handout": false, "html": "<h1>The Short Course: Student Copies<\/h1>\n<p><em>Built 13 Oct 2026 from the master modules in <code>modules/<\/code>, after Annie's three decisions that day: the 10-hour cut, the three-day plan, and one job built deeper.<\/em><\/p>\n<p><strong>What this folder is.<\/strong> One file per module, holding only what the Short course teaches. No Full course material, no server, no Telegram, no Claude Code steps. The master copy for both courses stays in <code>modules/<\/code>. When a master module changes, rebuild its Short copy from it.<\/p>\n<p><strong>What the Short course is.<\/strong> 10 hours, over three days. Max 3 students. The builder is pi on the student's laptop. The bot is Gemini on the student's phone: a skill, and a scheduled action that sends the morning message every weekday. A rented server is an optional extra sitting, outside the 10 hours.<\/p>\n<h2>The three days, 596 minutes<\/h2>\n<table>\n<thead>\n<tr>\n<th>Day<\/th>\n<th>Modules<\/th>\n<th>Minutes<\/th>\n<th>You leave with<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>00 (43), 01 (35), 02 (35), 03A (47), 03B (10), 04 (8), 05 (35)<\/td>\n<td>213, about 3 hours 35<\/td>\n<td>What you are building. Which tools answer from Hong Kong. What your AI may see. One home for your notes. Your top two jobs on paper.<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>06 (30), 07 (30), 08 (170)<\/td>\n<td>230, about 3 hours 50<\/td>\n<td>A file about you. Your <code>AGENTS.md<\/code>. pi on your laptop, doing one real job from your own files.<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>09 (28), 10 (35), 11 (75), 12 (15)<\/td>\n<td>153, about 2 hours 35<\/td>\n<td>Every step sorted. A check you run yourself, and a spending cap. Your job as a skill. Your Gemini morning message. A 30-day plan.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>The gap between Day 2 and Day 3<\/strong> is for the Gemini homework: pay for Gemini Pro, connect the calendar, write the instructions for Gemini, install the app. The handout <code>11 — Handout, Your Gemini Morning Message (Short)<\/code> has the steps.<\/p>\n<h2>The 10-hour cut, applied here and in the master modules<\/h2>\n<p>The Short course was 626 minutes. Annie chose these four cuts on 13 Oct 2026, 30 minutes in all:<\/p>\n<ol>\n<li>Module 01: the live terminal test leaves the Short course. Students first open a terminal in Module 08, where pi's first answer proves the connection. 45 to 35 minutes.<\/li>\n<li>Module 03B: \"What the optional server sitting adds\" is read at home. Module 11 asks the server question in class. 15 to 10 minutes.<\/li>\n<li>Module 08: spare time 20 to 10 minutes. 180 to 170.<\/li>\n<li>Module 11: the server question 10 to 5 minutes. 80 to 75.<\/li>\n<\/ol>\n<h2>How each copy was made<\/h2>\n<ul>\n<li>Only the Short column of each run sheet is kept. Rows the Short course does not run are gone.<\/li>\n<li>Full-only sections are gone. A Full-only section that still helps a laptop student is kept and marked <em>Read at home<\/em> or <em>Homework<\/em>.<\/li>\n<li>Every \"Full course\" and \"Short course\" label is gone. Every <code>[FABLE EDIT<\/code> marker is gone.<\/li>\n<li>Module 08 is built from the master's Short section, with the install steps, the five habits, the build log steps and the two conversations copied in from the Full sections it pointed at.<\/li>\n<li>Module 04 keeps only the Gemini demo and \"circle your top two\".<\/li>\n<li>Module 07's worksheet holds only <code>AGENTS.md<\/code> and the golden questions.<\/li>\n<li>Modules 10 and 12 have no watchdog, no backup script and no owner drills. The check is the three golden questions.<\/li>\n<li>Day references say Day 1, 2 and 3 as above.<\/li>\n<li>\n<p>The handouts for Modules 02, 10 and 11 are copied with no change apart from the labels.<\/p>\n<\/li>\n<li>\n<p>The opener's two cards (the bot and the builder) are rewritten for this course: Gemini on Google's computers, pi in a terminal, with Annie's version in one line each.<\/p>\n<\/li>\n<li>Module 03B's decision tree says \"laptop plus Gemini on your phone\" where the master still says \"laptop plus a Telegram bot\".<\/li>\n<\/ul>\n<p><strong>The script that built them<\/strong> is <code>tools/build-short-copies.py<\/code>. Run it from the repo root with <code>python3 tools/build-short-copies.py<\/code>. It reads <code>modules/<\/code> and rewrites every file in this folder. It stops with an error if a line it expects to change is not found, so a change to a master module shows up as a failure, not as a silent wrong copy.<\/p>\n<p><strong>Audited 13 Oct 2026.<\/strong> Every file was read in full after it was built. Nine defects were found and fixed, all in the generator, then every file was rebuilt.<\/p>\n<h2>Still open<\/h2>\n<ul>\n<li>No <strong>[COST]<\/strong> marks remain. All prices were filled on 15 Oct 2026 with Annie's answers (branch <code>opus/costs<\/code>).<\/li>\n<li>The published page is built from <code>modules/<\/code> by <code>publish.sh<\/code>. It does not know about this folder yet.<\/li>\n<\/ul>"}, {"id": "short-0", "title": "00: The Opener, What You Are Building", "handout": false, "html": "<h1>Module 00: The Opener, What You Are Building<\/h1>\n<p><strong>How to read this file.<\/strong> This is the Short course copy: 10 hours over three days, built with pi on your laptop and Gemini on your phone. Every segment in it is taught. The master copy for both courses is in <code>modules/<\/code>.<\/p>\n<p><strong>Why this module comes here.<\/strong><\/p>\n<ol>\n<li>Both of Annie's models of good teaching open with the ending. You hear what you leave with before you do anything.<\/li>\n<li>The first thing you write in this course is about you: a list of the jobs you want gone.<\/li>\n<li>Every later module has a home in one of the five sentences below.<\/li>\n<\/ol>\n<h2>Run Sheet<\/h2>\n<p>43 minutes.<\/p>\n<table>\n<thead>\n<tr>\n<th>Min<\/th>\n<th>Segment<\/th>\n<th>Facilitator does<\/th>\n<th>Students do<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>5<\/td>\n<td>The whole course in five sentences<\/td>\n<td>Reads the five sentences<\/td>\n<td>Listen<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>The two things people mix up, and the three words you will hear all day<\/td>\n<td>Shows the two cards, then the chain: you, harness, provider, model<\/td>\n<td>Write one line for each card<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Demo: a photo becomes a record<\/td>\n<td><code>Storage Bot Logging Item (edited)<\/code>, <code>Storage Bot Finding Item (edited)<\/code><\/td>\n<td>Note what the bot did when it was unsure<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Demo: when the bot was wrong<\/td>\n<td><code>warranty-01-send-filed (edited)<\/code>, <code>warranty-02-caught-corrected (edited)<\/code>, <code>warranty-03-reorganised (edited)<\/code><\/td>\n<td>Note how the correction was made<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Demo: what it costs<\/td>\n<td>One slide with three numbers, no screenshot<\/td>\n<td>Write the question \"what would this cost me?\"<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Your Wish List, first draft<\/td>\n<td>Hands out the worksheet<\/td>\n<td>List three to five jobs and score them<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Today's agenda<\/td>\n<td>Shows the day plan with its break<\/td>\n<td>Mark the break time<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>How the minutes add up.<\/strong> The five sentences take 5 minutes. The bot, the builder and the three words take 8. The storage demo takes 7. The warranty demo takes 5. The cost slide takes 5. The Wish List draft takes 10. The agenda takes 3.<\/p>\n<h2>What You Will Leave With<\/h2>\n<ul>\n<li>You can say, in one sentence, what this course builds.<\/li>\n<li>You can tell the bot from the builder.<\/li>\n<li>You can say what a harness, an AI provider and an AI model are.<\/li>\n<li>A first draft of your Wish List: three to five jobs you want your system to take over, each scored by how much remembering it removes. You finish it in the demo (Module 04).<\/li>\n<\/ul>\n<h2>Before This Module<\/h2>\n<ul>\n<li><strong>Nothing.<\/strong> Bring a pen. Your laptop stays closed.<\/li>\n<li><strong>For the facilitator:<\/strong> the checklist at the end of the demo (Module 04), done before students arrive. The same screenshot rules apply here.<\/li>\n<\/ul>\n<h2>The Whole Course in Five Sentences<\/h2>\n<p>Read these aloud. Every detail in the course has a home in one of them.<\/p>\n<ol>\n<li>You end up with two AIs. A bot, which you message on your phone, does your daily jobs. A builder, which you talk to on your laptop, makes everything.<\/li>\n<li>In this course the assistant lives on your laptop. It works while the laptop is open. Your morning message comes from Gemini. Gemini runs on Google's computers, not on your laptop. So the message arrives on your phone every morning, even when your laptop is closed or switched off. A rented server is an optional extra sitting.<\/li>\n<li>Both AIs forget everything between conversations. Plain text files cure that: a file about you, a file that says who the bot is and what it must never do, and a short \"where we left off\" note for the builder. Those files are the real product.<\/li>\n<li>Your notes app holds the one real copy of everything. Your laptop, your phone and your builder read it.<\/li>\n<li>Every job goes in one of two lanes. Same steps every time becomes a small program, called a script, that runs for free. Needs judgement goes to the AI. That one choice is why Annie's whole system runs for about $70 a month, and this course's setup for about $30.<\/li>\n<\/ol>\n<h2>The Two Things People Mix Up<\/h2>\n<p>This course has two AIs. People confuse them, because both run on AI. Keep them apart from the first day.<\/p>\n<p><strong>The bot. The assistant.<\/strong><\/p>\n<ul>\n<li>Lives on a computer that is always on. In this course, that is Google's computers, running Gemini. Annie's lives on a rented server.<\/li>\n<li>You reach it on your phone, by text. In this course, in the Gemini app. Annie reaches hers in Telegram.<\/li>\n<li>Its job: the daily jobs. In this course, your morning message, written from your calendar. Annie's also reads her email and answers using her rules.<\/li>\n<li>Its memory: written instructions, read again on every conversation. In this course, your instructions for Gemini and the skill you write.<\/li>\n<li>It cannot build or change itself. That is on purpose.<\/li>\n<\/ul>\n<p><strong>The builder. pi.<\/strong><\/p>\n<ul>\n<li>Lives on your own laptop, only while you have it open.<\/li>\n<li>You reach it by opening it in a terminal.<\/li>\n<li>Its job: build, fix and run your files job. It reads and changes the files in your folder. Annie's builder also logs in to her server and builds her bot.<\/li>\n<li>Its memory: a \"where we left off\" note, read at the start of every session.<\/li>\n<li>It never answers you as the assistant.<\/li>\n<\/ul>\n<p><strong>When the bot is wrong, you change its written instructions. You do not argue with it in chat.<\/strong> In this course, you change your Gemini skill or your instructions for Gemini. Annie tells her builder, and the builder changes her bot's files.<\/p>\n<p><strong>In this course,<\/strong> your builder is pi on your laptop. Your bot is Gemini: a skill you write, and a scheduled action that messages you every morning. Gemini runs on Google's computers, not on your laptop. So the message arrives on your phone every morning, even when your laptop is closed or switched off. The two cards still matter. The optional server sitting adds a bot that does more.<\/p>\n<p><strong>Three words you will hear all day.<\/strong> Every AI in this course is reached the same way: you, then a harness, then an AI provider, then an AI model. The answer comes back the same way.<\/p>\n<ul>\n<li><strong>The harness<\/strong> is the program you type into. It sends your words to the AI. It lets the AI read your files and run commands. pi is a harness. Claude Code is a harness. Hermes, the program the bot runs on, is a harness too.<\/li>\n<li><strong>The AI provider<\/strong> is the company that runs the AI on its own computers. It sends the bill. opencode Go is a provider. Anthropic is a provider.<\/li>\n<li><strong>The AI model<\/strong> is the AI that writes the answers. DeepSeek is a model. Claude is a model.<\/li>\n<\/ul>\n<p><strong>The chain for pi:<\/strong> you, then pi (harness), then opencode Go (AI provider), then DeepSeek (AI model).<\/p>\n<p><strong>The chain for Annie's bot:<\/strong> you, then Hermes (harness), then opencode Go (AI provider), then DeepSeek (AI model).<\/p>\n<p>The two chains share a provider and a model. That is why one opencode Go plan, at $10 a month, pays for both pi and the bot. The architecture module (Module 03A) explains each of the three parts in more detail.<\/p>\n<h2>The Rule for the Whole Module<\/h2>\n<p><strong>Never show a capability without showing what it costs.<\/strong><\/p>\n<ul>\n<li>Every demo below comes with a failure, a bill or a trade-off.<\/li>\n<li>A demo that shows only wins makes the room feel behind.<\/li>\n<li>It also makes the facilitator hard to trust the first time a student's own build fails.<\/li>\n<\/ul>\n<h2>What This System Is For<\/h2>\n<p>Most AI marketing promises that you will do ten times more. Annie's system is built for a different reason.<\/p>\n<p>Her line, written in August 2026: the real gift is clearing what drains you, so you can be present with the people in front of you, including yourself (Build Log 72).<\/p>\n<p>It works in two directions:<\/p>\n<ul>\n<li><strong>Take things away.<\/strong> Admin, reminders, chasing, filing. Anything you hold in your head today because nothing else will.<\/li>\n<li><strong>Add depth.<\/strong> Research and learning on the things that matter to you.<\/li>\n<\/ul>\n<p>Annie judges every build by one rule: if a job only works when you remember to start it, it is not finished (Annie's ruling, 27 Aug 2026). Every demo in this course runs without her starting it.<\/p>\n<h2>Demo: A Photo Becomes a Record<\/h2>\n<p><strong>What it is.<\/strong> A photo catalogue of the family's storage units. A bot built it, and you can read it on a phone (Build Log 48).<\/p>\n<p><strong>What the screenshots show.<\/strong><\/p>\n<ol>\n<li><strong><code>Storage Bot Logging Item (edited)<\/code>.<\/strong>\n   - Annie sends a photo of a cap, with a short caption naming the unit.\n   - The bot replies \"Got it\".\n   - It logs the item to Unsorted, and says it did not catch the unit.\n   - A minute later, it moves the item to the right unit as number 325.\n   - It asks her to reply if that is wrong.<\/li>\n<li><strong><code>Storage Bot Finding Item (edited)<\/code>.<\/strong>\n   - Annie asks where a playmat is.\n   - The bot answers with the item number.\n   - It says the playmat was lent to a friend, and quotes the note about a missing part.\n   - It also lists two near-matches, in case she meant one of those.<\/li>\n<\/ol>\n<p><strong>The line to say.<\/strong> \"When it was unsure where the cap went, it said so and put it somewhere safe. It did not guess.\"<\/p>\n<p><strong>What else to point out.<\/strong> (Source: Build Log 80.)<\/p>\n<ul>\n<li>The count of items comes from code, not from the AI.<\/li>\n<li>AI models are bad at counting.<\/li>\n<li>So Annie's rule is: code does the arithmetic, and the model only reads the result.<\/li>\n<\/ul>\n<p><strong>The cost of this one.<\/strong> (Source: Build Log 48.)<\/p>\n<ol>\n<li>Annie's first answer from Claude was \"don't build it\". Describing photos seemed to need a paid AI service.<\/li>\n<li>She removed that assumption in six words: \"I actually don't mind typing descriptions.\"<\/li>\n<li>It then turned out the bot already described photos, for about $0.001 each.<\/li>\n<\/ol>\n<p>The lesson: say out loud the one assumption your advice depends on. Then the other person can overturn it.<\/p>\n<h2>Demo: When the Bot Was Wrong<\/h2>\n<p><strong>What happened (1 Oct 2026).<\/strong><\/p>\n<ol>\n<li>Annie photographed a hard drive's warranty card and said \"save this\".<\/li>\n<li>The bot filed it as a searchable page. It explained which folder it chose and why (<code>warranty-01<\/code>).<\/li>\n<li>Then it stated, confidently, that the warranty did not cover data recovery. That was wrong.<\/li>\n<\/ol>\n<p><strong>How it was corrected<\/strong> (<code>warranty-02<\/code>):<\/p>\n<ol>\n<li>Annie corrected it in one sentence.<\/li>\n<li>The bot checked the manufacturer's own data sheet. It quoted the line that includes data recovery.<\/li>\n<li>It replied \"You're right and I was wrong\".<\/li>\n<li>It fixed the page, and put the source in it.<\/li>\n<li>It explained the two ways to claim. It named what was still missing: the receipt.<\/li>\n<\/ol>\n<p><strong>Later<\/strong> (<code>warranty-03<\/code>):<\/p>\n<ul>\n<li>Annie asked it to move the files into a subfolder.<\/li>\n<li>It did.<\/li>\n<li>It also found and fixed a link elsewhere in the vault that the move would have broken (Boss Admin Moves note, 1 Oct 2026).<\/li>\n<\/ul>\n<p><strong>The line to say.<\/strong> \"The lesson is not that the bot is clever. I stayed in charge, and correcting it took one sentence.\"<\/p>\n<h2>Demo: What It Costs<\/h2>\n<p><strong>Show one slide with three numbers.<\/strong> No screenshot is needed, so nothing private can appear.<\/p>\n<ol>\n<li><strong>The monthly figure.<\/strong> About $70 a month, about $840 a year. Annie's own meters, October 2026. The table below shows every piece.<\/li>\n<li><strong>The cap.<\/strong> (Source: Build Log 89.)\n   - In September 2026, Annie had set a $20 monthly spending cap on one AI account.\n   - The cap was reached, and the account paused.\n   - The cap did exactly its job.<\/li>\n<li><strong>What filled it.<\/strong> (Source: Build Log 89.)\n   - One chat conversation ran for three days.\n   - It used 19.06 million tokens, costing $8.36.\n   - Tokens are the small pieces of text that AI companies count and charge for.<\/li>\n<\/ol>\n<p><strong>The line to say.<\/strong> \"I know what this costs to the cent. If you build this and do not know that, you will get a surprise you will not enjoy.\"<\/p>\n<p><strong>What each piece costs, per year.<\/strong> Show this after the three numbers, or hand it out.<\/p>\n<table>\n<thead>\n<tr>\n<th>Piece<\/th>\n<th>What it does<\/th>\n<th>Per year<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Rented server (Hetzner)<\/td>\n<td>The bot's house. Always on. Runs everything.<\/td>\n<td>$216<\/td>\n<\/tr>\n<tr>\n<td>AI tokens for the bot<\/td>\n<td>Every conversation, and the one scheduled job that uses the AI. A meter, not a flat bill. Check your own.<\/td>\n<td>About $180 to $240<\/td>\n<\/tr>\n<tr>\n<td>Claude subscription (Pro plan)<\/td>\n<td>The builder, Claude Code. Flat rate. All the expensive build thinking.<\/td>\n<td>$200<\/td>\n<\/tr>\n<tr>\n<td>opencode Go<\/td>\n<td>The company that serves pi its models. Flat rate.<\/td>\n<td>$120 ($10 a month)<\/td>\n<\/tr>\n<tr>\n<td>Gemini Pro (Google AI Pro)<\/td>\n<td>The Short course's bot. It sends the morning message.<\/td>\n<td>$0*<\/td>\n<\/tr>\n<tr>\n<td>Obsidian Sync (Standard plan)<\/td>\n<td>Keeps every copy of your notes identical: phone, laptop and the bot's server.<\/td>\n<td>$48<\/td>\n<\/tr>\n<tr>\n<td>Obsidian app, Hermes (the bot software), Telegram<\/td>\n<td>The notes app, the bot's body, the messaging app.<\/td>\n<td>$0<\/td>\n<\/tr>\n<tr>\n<td>Weather, calendar and email data<\/td>\n<td>Everything the bot reads to help you.<\/td>\n<td>$0<\/td>\n<\/tr>\n<tr>\n<td>Nightly off-site backup (Google Drive, free tier)<\/td>\n<td>The safety net. Data only.<\/td>\n<td>$0<\/td>\n<\/tr>\n<tr>\n<td>Hetzner whole-server backup<\/td>\n<td>Turns \"server died\" into a 10-minute fix instead of a 1 to 2 hour rebuild.<\/td>\n<td>$48 ($4 a month)<\/td>\n<\/tr>\n<tr>\n<td><strong>Total<\/strong><\/td>\n<td><\/td>\n<td><strong>About $812 to $872 a year. About $68 to $73 a month.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>*Annie pays nothing extra, because her 2TB Google storage plan includes Gemini Pro. Without that plan, Gemini Pro costs about HK$158 a month.<\/p>\n<p><strong>Two things to point out.<\/strong> More than half the yearly cost is flat rate: the two builder plans and notes sync. No meter, no surprises. And every $0 row does real work. The free pieces are most of the system.<\/p>\n<p><strong>What this course costs you.<\/strong> Two flat-rate plans and nothing else: opencode Go, $10 a month, for pi. Gemini Pro, about HK$158 a month, for your morning message. Obsidian Sync is optional. A rented server comes only with the optional server sitting.<\/p>\n<h2>Exercise: Your Wish List, First Draft<\/h2>\n<p>You finish this list in the demo (Module 04), after you have seen every demo. Today is the first draft.<\/p>\n<ol>\n<li>Write down three to five jobs you would hand over today if you could.<\/li>\n<li>For each one, write what you have to remember today to get it done.<\/li>\n<li>Score how much remembering it removes, from 1 to 5. A job you think about every day scores higher than a monthly one.<\/li>\n<li>Mark the harm if it goes wrong.<\/li>\n<\/ol>\n<table>\n<thead>\n<tr>\n<th>Job<\/th>\n<th>What I have to remember today<\/th>\n<th>Remembering removed (1 to 5)<\/th>\n<th>Harm if it goes wrong (low, medium, high)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Keep this sheet. You bring it to the demo (Module 04).<\/p>\n<h2>Today's Agenda<\/h2>\n<p><em>3 minutes.<\/em><\/p>\n<p>Show the day plan. Say where the break is. Three days, between 2 and 4 hours each.<\/p>\n<table>\n<thead>\n<tr>\n<th>Day<\/th>\n<th>Modules<\/th>\n<th>Hours<\/th>\n<th>You leave with<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>The opener (00), 01, 02, 03A, 03B, 04, 05<\/td>\n<td>About 3 hours 35<\/td>\n<td>You know what you are building. You know which tools answer from Hong Kong. You know what your AI may see. Your notes have one home. Your top two jobs are on paper.<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>06, 07, 08<\/td>\n<td>About 3 hours 50<\/td>\n<td>A file about you. A file that says who your AI assistant is and what it must never do. pi working on your laptop, doing one real job from your own files.<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>09, 10, 11, 12<\/td>\n<td>About 2 hours 35<\/td>\n<td>Every step sorted into script, model or person. A check you can run yourself, and a spending cap. Your job turned into a skill. Your Gemini morning message, arriving on your phone. A 30-day plan.<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Each day opens the same way.<\/strong> Read the \"You leave with\" line for the day. Show the day's modules with the break. Then
